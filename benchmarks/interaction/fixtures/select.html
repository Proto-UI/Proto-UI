<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Public harness calibration: native single select</title>
    <style>
      body {
        font: 16px system-ui;
        margin: 32px;
      }
      button,
      select {
        font: inherit;
        padding: 8px;
        margin: 8px;
      }
      :focus-visible {
        outline: 3px solid #0754c9;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <h1>Native single-select calibration</h1>
    <p>Public, hand-authored browser reference. No Proto component or conformance claim.</p>
    <p>
      Scope: HTML native single selection, labels, and disabled options. Native keyboard commits do
      not model Proto popup navigation.
    </p>
    <main id="fixture" data-calibration-domain="html-native-select">
      <label for="reference-select">Reference choice</label>
      <select id="reference-select" name="reference-choice">
        <option value="alpha" selected>Alpha</option>
        <option value="beta" disabled>Unavailable Beta</option>
        <option value="gamma">Gamma</option>
        <option value="delta">Delta</option>
      </select>
      <output id="selection-output" for="reference-select">alpha</output>
    </main>
    <button id="remove-fixture" type="button">Remove reference fixture</button>
    <button id="after-fixture" type="button">After fixture</button>
    <script>
      // Deliberately small, hand-authored public calibration code, not Proto output.
      const root = document.querySelector('#fixture');
      const select = document.querySelector('#reference-select');
      select.addEventListener('change', () => {
        document.querySelector('#selection-output').value = select.value;
      });
      document.querySelector('#remove-fixture').addEventListener('click', () => root.remove());
    </script>
  </body>
</html>

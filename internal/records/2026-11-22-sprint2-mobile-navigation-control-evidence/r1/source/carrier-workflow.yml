name: Sprint 2 mobile fixture repair control
run-name: Sprint 2 same-source repaired mobile four-point control
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sprint2-mobile-control-control
  cancel-in-progress: false
jobs:
  diagnose:
    if: ${{ github.repository == 'Proto-UI/Proto-UI' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: carrier
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 4541dfbca5001d4ff9b1cc6afd34d4fe1cf32d5d
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies and actual CJK fonts
        working-directory: candidate
        run: |
          corepack pnpm@10.32.1 install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          mkdir -p "$RUNNER_TEMP/sprint2-mobile-control"
          dpkg-query -W fonts-noto-cjk > "$RUNNER_TEMP/sprint2-mobile-control/fonts.txt"
          fc-match -f '%{family}\n' 'sans-serif:lang=zh-cn' >> "$RUNNER_TEMP/sprint2-mobile-control/fonts.txt"
      - name: Prepare actual public packages and styles sequentially
        working-directory: candidate
        run: |
          node scripts/build/public-packages.mjs > "$RUNNER_TEMP/sprint2-mobile-control/packages.log" 2>&1
          corepack pnpm@10.32.1 --filter apps-www generate:proto-ui-style > "$RUNNER_TEMP/sprint2-mobile-control/styles.log" 2>&1
      - name: Apply the reviewed fixture and repeat the unchanged strict assertion
        run: node carrier/.github/sprint2-site-hit-control/prepare.mjs candidate "$RUNNER_TEMP/sprint2-mobile-control"
      - name: Run original suite and bounded repeated failed mobile case
        working-directory: candidate
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PROTO_UI_SPRINT2_SITE_EVIDENCE_DIR: ${{ runner.temp }}/sprint2-mobile-control/captures
        run: |
          corepack pnpm@10.32.1 exec vitest run apps/www/src/content/docs/zh-cn/sprint2-site.browser.test.ts --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/sprint2-mobile-control/report.json" > "$RUNNER_TEMP/sprint2-mobile-control/run.log" 2>&1
      - name: Preserve all actual repair control outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint2-mobile-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sprint2-mobile-control/
          if-no-files-found: error
          retention-days: 30

[package]
name = "proto-ui-gpui-native-tests"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]
members = [
  "generated/GpuiCounter",
  "generated/PropsMatrix",
  "generated/RequiredProp",
  "generated/NumericState",
  "generated/EscapedText",
  "generated/BaseTextRoot",
  "generated/BaseSurfaceRoot",
  "generated/SlotHost",
  "generated/EmptyRoot",
  "generated/CreatedWatch",
  "generated/CreatedFailure",
  "generated/NumericPolicy",
  "generated/UpdateScheduling",
  "generated/InvokeReturn",
  "generated/RuleScheduling",
]
resolver = "2"

[workspace.dependencies]
# The real Verdant workspace dependency, independently of the upstream default.
gpui = { git = "https://github.com/cyjin-yl/z3rm", rev = "e5f2f9db75e97613232b5c1946333e61fa3828ab", default-features = false, features = ["test-support"] }

[dependencies]
anyhow = "1"
gpui.workspace = true
compiled-gpuicounter = { path = "generated/GpuiCounter" }
compiled-propsmatrix = { path = "generated/PropsMatrix" }
compiled-requiredprop = { path = "generated/RequiredProp" }
compiled-numericstate = { path = "generated/NumericState" }
compiled-escapedtext = { path = "generated/EscapedText" }
compiled-basetextroot = { path = "generated/BaseTextRoot" }
compiled-basesurfaceroot = { path = "generated/BaseSurfaceRoot" }
compiled-slothost = { path = "generated/SlotHost" }
compiled-emptyroot = { path = "generated/EmptyRoot" }
compiled-createdwatch = { path = "generated/CreatedWatch" }
compiled-createdfailure = { path = "generated/CreatedFailure" }
compiled-numericpolicy = { path = "generated/NumericPolicy" }
compiled-updatescheduling = { path = "generated/UpdateScheduling" }
compiled-invokereturn = { path = "generated/InvokeReturn" }
compiled-rulescheduling = { path = "generated/RuleScheduling" }

[profile.dev]
debug = 0

[profile.test]
debug = 0

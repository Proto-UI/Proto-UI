[package]
name = "proto-ui-gpui-codegen"
version = "0.4.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
syn = { version = "2", features = ["full"] }

<desc id="description">Prototype and applicable profile obligations form the shared baseline: identity, information channels, State transitions, Lifecycle order, and required Feedback. Shared, controlled input medium, viewport, units, and fonts permit finer comparison of input behavior and Feedback. The same Web family and applicable profiles sharing governed structure, events, style foundations, and projection policy permit comparison of normalized DOM after necessary declared wrappers and markers are excluded. Further control of device metrics, unit scale, font shaping, color, and rasterization permits pixel comparison. Agree the reasons and scope of tolerances and exclusions in advance. These are condition-to-comparison mappings, not automatic tiers, and do not imply complete evidence across Hosts.</desc>
<text x="32" y="44" font-size="28" text-anchor="start" class="strong"><tspan x="32" dy="0">Shared conditions determine</tspan><tspan x="32" dy="39.199999999999996">comparison detail</tspan></text>
<text x="32" y="136" font-size="26" text-anchor="start" class="muted"><tspan x="32" dy="0">Establish obligations, then</tspan><tspan x="32" dy="36.4">define both realization contexts</tspan></text>

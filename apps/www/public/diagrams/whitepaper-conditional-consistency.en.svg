<text x="48" y="48" font-size="20" text-anchor="start" class="muted"><tspan x="48" dy="0">07</tspan></text>
<text x="48" y="94" font-size="32" text-anchor="start" class="strong"><tspan x="48" dy="0">Shared conditions determine comparison detail</tspan></text>
<text x="48" y="132" font-size="22" text-anchor="start" class="muted"><tspan x="48" dy="0">Establish obligations, then define the two realization contexts</tspan></text>
<rect x="48" y="176" width="864" height="100" rx="14" class="blue"/>
<text x="480" y="218.29999999999998" font-size="22" text-anchor="middle" class=""><tspan x="480" dy="0">Shared baseline: obligations of the Prototype and applicable profile</tspan><tspan x="480" dy="30.799999999999997">Identity · channels · state transitions · lifecycle order · required Feedback</tspan></text>
<text x="72" y="329" font-size="25" text-anchor="start" class="strong"><tspan x="72" dy="0">Shared, controlled conditions</tspan></text>
<text x="625" y="329" font-size="25" text-anchor="start" class="strong"><tspan x="625" dy="0">Finer comparison</tspan></text>
<rect x="48" y="355" width="864" height="112" rx="14" class="panel"/>
<text x="72" y="400" font-size="22" text-anchor="start" class=""><tspan x="72" dy="0">Same input medium, viewport,</tspan><tspan x="72" dy="30.799999999999997">units, fonts, and related conditions</tspan></text>
<path d="M562 411 H600" class="line " marker-end="url(#arrow)"/>
<text x="748" y="399" font-size="24" text-anchor="middle" class=""><tspan x="748" dy="0">Input behavior</tspan><tspan x="748" dy="33.599999999999994">and Feedback</tspan></text>
<rect x="48" y="491" width="864" height="112" rx="14" class="panel"/>
<text x="72" y="536" font-size="22" text-anchor="start" class=""><tspan x="72" dy="0">Same Web family, with governed</tspan><tspan x="72" dy="30.799999999999997">structure, events, styles, and projection policy</tspan></text>
<path d="M562 547 H600" class="line " marker-end="url(#arrow)"/>
<text x="748" y="556" font-size="24" text-anchor="middle" class=""><tspan x="748" dy="0">Normalized DOM</tspan></text>
<rect x="48" y="627" width="864" height="112" rx="14" class="panel"/>
<text x="72" y="672" font-size="22" text-anchor="start" class=""><tspan x="72" dy="0">Also control device metrics, font shaping,</tspan><tspan x="72" dy="30.799999999999997">color, rasterization, and related conditions</tspan></text>
<path d="M562 683 H600" class="line " marker-end="url(#arrow)"/>
<text x="748" y="692" font-size="24" text-anchor="middle" class=""><tspan x="748" dy="0">Pixel output</tspan></text>
<text x="48" y="786" font-size="21" text-anchor="start" class="muted"><tspan x="48" dy="0">Agree tolerance / exclusion in advance; these are conditions, not automatic tiers.</tspan></text>
<text x="48" y="821" font-size="21" text-anchor="start" class="muted"><tspan x="48" dy="0">Comparison principles do not imply complete evidence across Hosts.</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760" role="img" aria-labelledby="information-flow-title information-flow-description" preserveAspectRatio="xMidYMid meet">
  <title id="information-flow-title">Proto UI information flow model</title>
  <desc id="information-flow-description">
    Event carries information from User to Component, while feedback returns from Component to User.
    Props carries information from Maker to Component, while expose returns from Component to Maker.
    Context connects Other Component and Component in both directions. State, lifecycle, and meta
    are internal Component dimensions rather than information channels.
  </desc>
  <defs>
    <style>
      :root {
        --diagram-ink: #1e1e1e;
        --diagram-muted: #5c6670;
        --diagram-blue: #1971c2;
        --diagram-green: #237a35;
        --diagram-amber: #ad6500;
        --diagram-purple: #6741d9;
        --diagram-red: #c92a2a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --diagram-ink: #e5e5e5;
          --diagram-muted: #a1abb5;
          --diagram-blue: #74c0fc;
          --diagram-green: #8ce99a;
          --diagram-amber: #ffc078;
          --diagram-purple: #b197fc;
          --diagram-red: #ff8787;
        }
      }
      text {
        font-family: "Excalifont", "Xiaolai", "Kalam", "STKaiti", "KaiTi", "Bradley Hand", cursive, sans-serif;
        fill: var(--diagram-ink);
        font-weight: 400;
      }
      .actor-label { font-size: 26px; }
      .component-label { font-size: 28px; }
      .channel-label { font-size: 20px; }
      .dimension-heading { font-size: 19px; fill: var(--diagram-muted); }
      .dimension-label { font-size: 23px; fill: var(--diagram-blue); }
      .hand-stroke {
        fill: none;
        stroke: var(--diagram-ink);
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .hand-echo { opacity: 0.42; stroke-width: 1; }
      .hand-dash { stroke-dasharray: 7 6; }
      .stroke-blue { stroke: var(--diagram-blue); }
      .stroke-green { stroke: var(--diagram-green); }
      .stroke-amber { stroke: var(--diagram-amber); }
      .stroke-purple { stroke: var(--diagram-purple); }
      .stroke-red { stroke: var(--diagram-red); }
      .stroke-muted { stroke: var(--diagram-muted); }
      .ink-blue { fill: var(--diagram-blue); }
      .ink-green { fill: var(--diagram-green); }
      .ink-amber { fill: var(--diagram-amber); }
      .ink-purple { fill: var(--diagram-purple); }
      .ink-red { fill: var(--diagram-red); }
    </style>
    <marker id="hand-arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 1.5 Q6 4.2 10 6 Q6 7.8 1.5 10.5" fill="none" stroke="var(--diagram-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="hand-arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 1.5 Q6 4.2 10 6 Q6 7.8 1.5 10.5" fill="none" stroke="var(--diagram-red)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="hand-arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 1.5 Q6 4.2 10 6 Q6 7.8 1.5 10.5" fill="none" stroke="var(--diagram-green)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="hand-arrow-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 1.5 Q6 4.2 10 6 Q6 7.8 1.5 10.5" fill="none" stroke="var(--diagram-amber)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="hand-arrow-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 1.5 Q6 4.2 10 6 Q6 7.8 1.5 10.5" fill="none" stroke="var(--diagram-purple)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- User box -->
  <path d="M44 74 C92 72 146 75 186 73 Q198 73 197 86 C199 138 196 186 198 228 Q198 240 185 239 C138 241 88 238 45 240 Q33 240 34 227 C32 178 35 128 33 87 Q33 74 44 74" class="hand-stroke stroke-blue"/>
  <path d="M46 76 C94 75 144 77 185 75 M195 88 C197 136 194 184 196 227 M184 237 C136 239 89 236 46 238 M36 225 C34 176 37 128 35 88" class="hand-stroke hand-echo stroke-blue"/>
  <text x="115" y="165" text-anchor="middle" class="actor-label">User</text>

  <!-- Maker box -->
  <path d="M44 294 C92 292 146 295 186 293 Q198 293 197 306 C199 358 196 406 198 448 Q198 460 185 459 C138 461 88 458 45 460 Q33 460 34 447 C32 398 35 348 33 307 Q33 294 44 294" class="hand-stroke stroke-green"/>
  <path d="M46 296 C94 295 144 297 185 295 M195 308 C197 356 194 404 196 447 M184 457 C136 459 89 456 46 458 M36 445 C34 396 37 348 35 308" class="hand-stroke hand-echo stroke-green"/>
  <text x="115" y="385" text-anchor="middle" class="actor-label">Maker</text>

  <!-- Other Component box -->
  <path d="M44 514 C92 512 146 515 186 513 Q198 513 197 526 C199 578 196 626 198 668 Q198 680 185 679 C138 681 88 678 45 680 Q33 680 34 667 C32 618 35 568 33 527 Q33 514 44 514" class="hand-stroke stroke-purple"/>
  <path d="M46 516 C94 515 144 517 185 515 M195 528 C197 576 194 624 196 667 M184 677 C136 679 89 676 46 678 M36 665 C34 616 37 568 35 528" class="hand-stroke hand-echo stroke-purple"/>
  <text x="115" y="590" text-anchor="middle" class="actor-label">Other</text>
  <text x="115" y="622" text-anchor="middle" class="actor-label">Component</text>

  <!-- Component main enclosure -->
  <path d="M366 64 C422 61 486 65 552 63 Q568 63 566 80 C570 280 564 490 567 678 Q567 694 550 692 C486 695 422 690 368 693 Q352 693 354 676 C350 486 356 278 353 81 Q353 64 366 64" class="hand-stroke"/>
  <path d="M368 67 C424 64 486 67 551 65 M564 81 C567 282 562 490 565 677 M549 690 C486 692 424 688 369 690 M356 675 C352 486 358 278 355 82" class="hand-stroke hand-echo"/>
  <text x="460" y="118" text-anchor="middle" class="component-label">Component</text>
  <path d="M374 142 C432 140 492 143 546 141" class="hand-stroke stroke-muted"/>

  <text x="460" y="182" text-anchor="middle" class="dimension-heading">Internal</text>
  <text x="460" y="206" text-anchor="middle" class="dimension-heading">dimensions</text>

  <!-- state -->
  <path d="M388 236 C432 234 488 237 532 235 Q542 235 541 246 C542 276 540 302 541 324 Q541 334 530 333 C486 335 432 332 389 334 Q379 334 380 323 C378 294 381 268 379 247 Q379 236 388 236" class="hand-stroke stroke-blue hand-dash"/>
  <text x="460" y="293" text-anchor="middle" class="dimension-label">state</text>

  <!-- lifecycle -->
  <path d="M388 376 C432 374 488 377 532 375 Q542 375 541 386 C542 416 540 442 541 464 Q541 474 530 473 C486 475 432 472 389 474 Q379 474 380 463 C378 434 381 408 379 387 Q379 376 388 376" class="hand-stroke stroke-blue hand-dash"/>
  <text x="460" y="433" text-anchor="middle" class="dimension-label">lifecycle</text>

  <!-- meta -->
  <path d="M388 516 C432 514 488 517 532 515 Q542 515 541 526 C542 556 540 582 541 604 Q541 614 530 613 C486 615 432 612 389 614 Q379 614 380 603 C378 574 381 548 379 527 Q379 516 388 516" class="hand-stroke stroke-blue hand-dash"/>
  <text x="460" y="573" text-anchor="middle" class="dimension-label">meta</text>

  <!-- Event & Feedback arrows -->
  <path d="M204 128 C252 125 298 130 344 128" class="hand-stroke stroke-blue" marker-end="url(#hand-arrow-blue)"/>
  <text x="275" y="114" text-anchor="middle" class="channel-label ink-blue">event</text>

  <path d="M348 184 C298 187 252 182 206 184" class="hand-stroke stroke-red" marker-end="url(#hand-arrow-red)"/>
  <text x="275" y="212" text-anchor="middle" class="channel-label ink-red">feedback</text>

  <!-- Props & Expose arrows -->
  <path d="M204 348 C252 345 298 350 344 348" class="hand-stroke stroke-green" marker-end="url(#hand-arrow-green)"/>
  <text x="275" y="334" text-anchor="middle" class="channel-label ink-green">props</text>

  <path d="M348 404 C298 407 252 402 206 404" class="hand-stroke stroke-amber" marker-end="url(#hand-arrow-amber)"/>
  <text x="275" y="432" text-anchor="middle" class="channel-label ink-amber">expose</text>

  <!-- Context bidirectional arrow -->
  <path d="M208 596 C254 593 298 599 344 596" class="hand-stroke stroke-purple" marker-start="url(#hand-arrow-purple)" marker-end="url(#hand-arrow-purple)"/>
  <text x="275" y="578" text-anchor="middle" class="channel-label ink-purple">context</text>
</svg>

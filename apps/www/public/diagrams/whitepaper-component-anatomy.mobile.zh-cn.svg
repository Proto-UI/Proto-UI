<desc id="description">Switch Root 是 checked 值与 activation 的唯一 owner。Thumb 通过同域 Context 获取 checked 和 disabled，只派生展示状态，不成为第二个开关控件。Select Root 拥有 open 与选中值，Trigger、Value、Content 和 Item 各自承担独立关系。固定 Caret 只有 Feedback 时可以附属于 Trigger；一旦拥有独立 Event、Props、Expose 或 Context，就需要独立 Component 边界。Caret 是边界判断的设计案例，不是新增的 Base Select part；图中位置不规定实际 Host tree。</desc>
<text x="32" y="44" font-size="28" text-anchor="start" class="strong"><tspan x="32" dy="0">看得见的结构，</tspan><tspan x="32" dy="39.199999999999996">不等于组件边界</tspan></text>
<text x="32" y="132" font-size="26" text-anchor="start" class="muted"><tspan x="32" dy="0">用责任解释拆分</tspan></text>

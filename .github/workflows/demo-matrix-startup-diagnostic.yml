name: Demo Matrix startup diagnostic
on:
  workflow_dispatch:
    inputs:
      docs_selector_comparison:
        description: Compare the two Toast selector conditions without changing Matrix assertions
        type: boolean
        required: false
        default: false
  workflow_call:
permissions:
  contents: read
concurrency:
  group: demo-matrix-startup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  representative-profile:
    if: ${{ inputs.docs_selector_comparison != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies and record the exact diagnostic subject
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/demo-matrix-startup"
          git rev-parse HEAD > "$RUNNER_TEMP/demo-matrix-startup/source-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/demo-matrix-startup/source-tree.txt"
          node --version > "$RUNNER_TEMP/demo-matrix-startup/node-environment.txt"
          "$CHROME" --version > "$RUNNER_TEMP/demo-matrix-startup/browser-environment.txt"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
      - name: Verify diagnostic fail-closed controls
        run: |
          corepack pnpm@10.32.1 exec vitest run \
            apps/www/src/content/docs/zh-cn/demo-matrix-browser-diagnostic.test.ts \
            apps/www/src/content/docs/zh-cn/demo-matrix-startup-diagnostic.test.ts \
            apps/www/src/content/docs/zh-cn/demo-matrix-observation.test.ts \
            --maxWorkers=1 --minWorkers=1 --no-file-parallelism
      - name: Profile one original Matrix case without changing its assertions or waits
        timeout-minutes: 10
        env:
          PROTO_UI_MATRIX_STARTUP_PROFILE: '1'
          PROTO_UI_MATRIX_BROWSER_DIAGNOSTIC: '1'
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/demo-matrix-startup
        run: |
          set -euo pipefail
          # Diagnostic-only subset, including profiler overhead. The other three
          # cases still run in standard CI; neither this subset nor its profile
          # establishes native performance acceptance or full Matrix success.
          corepack pnpm@10.32.1 exec vitest run \
            apps/www/src/content/docs/zh-cn/demo-matrix.browser.test.ts \
            --testNamePattern='mounts every demo in every official Web adapter$' \
            --maxWorkers=1 --minWorkers=1 --no-file-parallelism \
            --reporter=default --reporter=json \
            --outputFile="$RUNNER_TEMP/demo-matrix-startup/vitest.json" \
            2>&1 | tee "$RUNNER_TEMP/demo-matrix-startup/browser.log"
      - name: Retain exact-source phase, network and bounded CPU diagnostics including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-matrix-startup-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/demo-matrix-startup
          if-no-files-found: error
          retention-days: 14

  docs-selector-comparison:
    if: ${{ inputs.docs_selector_comparison == true }}
    runs-on: ubuntu-24.04
    # Two original ten-minute diagnostic commands, plus isolated setup.
    # Neither the original 180s case nor its 60s initialization oracle changes.
    timeout-minutes: 25
    env:
      COMPARISON_DIR: ${{ runner.temp }}/matrix-docs-selector-comparison
      PROTO_UI_MATRIX_STARTUP_PROFILE: '1'
      PROTO_UI_MATRIX_BROWSER_DIAGNOSTIC: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies and preserve the diagnostic environment
        id: setup
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p "$COMPARISON_DIR"
          node --version > "$COMPARISON_DIR/node-version.txt"
          "$CHROME" --version > "$COMPARISON_DIR/chrome-version.txt"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          node --test scripts/test/matrix-docs-selector-experiment.test.mjs
      - name: Observe the original selector with the shared route marker
        id: baseline
        if: ${{ steps.setup.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -euo pipefail
          node scripts/test/matrix-docs-selector-experiment.mjs prepare baseline "$COMPARISON_DIR"
          export PROTO_UI_RUNTIME_EVIDENCE_DIR="$COMPARISON_DIR/baseline"
          set +e
          corepack pnpm@10.32.1 exec vitest run \
            apps/www/src/content/docs/zh-cn/demo-matrix.browser.test.ts \
            --testNamePattern='mounts every demo in every official Web adapter$' \
            --maxWorkers=1 --minWorkers=1 --no-file-parallelism \
            --reporter=default --reporter=json --outputFile="$COMPARISON_DIR/baseline/vitest.json" \
            2>&1 | tee "$COMPARISON_DIR/baseline/browser.log"
          results=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${results[0]}" > "$COMPARISON_DIR/baseline/exit-code.txt"
          node scripts/test/matrix-docs-selector-experiment.mjs finish baseline "$COMPARISON_DIR"
          (( results[0] == 0 && results[1] == 0 ))
      - name: Observe the direct selector with the same declarations and adapter source
        id: direct
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -euo pipefail
          node scripts/test/matrix-docs-selector-experiment.mjs prepare direct "$COMPARISON_DIR"
          export PROTO_UI_RUNTIME_EVIDENCE_DIR="$COMPARISON_DIR/direct"
          set +e
          corepack pnpm@10.32.1 exec vitest run \
            apps/www/src/content/docs/zh-cn/demo-matrix.browser.test.ts \
            --testNamePattern='mounts every demo in every official Web adapter$' \
            --maxWorkers=1 --minWorkers=1 --no-file-parallelism \
            --reporter=default --reporter=json --outputFile="$COMPARISON_DIR/direct/vitest.json" \
            2>&1 | tee "$COMPARISON_DIR/direct/browser.log"
          results=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${results[0]}" > "$COMPARISON_DIR/direct/exit-code.txt"
          node scripts/test/matrix-docs-selector-experiment.mjs finish direct "$COMPARISON_DIR"
          (( results[0] == 0 && results[1] == 0 ))
      - name: Preserve both actual outcomes without declaring performance acceptance
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/test/matrix-docs-selector-experiment.mjs summary "$COMPARISON_DIR"
      - name: Retain original logs, exact source deltas and bounded browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-docs-selector-comparison-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.COMPARISON_DIR }}
          if-no-files-found: error
          retention-days: 14

name: Canonical compiler browser acceptance

on:
  workflow_dispatch:
    inputs:
      source_regressions:
        description: Run source, lifecycle and type regressions for this candidate
        type: boolean
        required: false
        default: false
      production_build:
        description: Build and inspect the production website for this candidate
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      source_regressions:
        type: boolean
        required: false
        default: false
      production_build:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: compiler-browser-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-regressions:
    if: ${{ inputs.source_regressions }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASTRO_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bind the source and install frozen dependencies
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/compiler-source-regressions"
          mkdir -p "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git rev-parse HEAD > "$EVIDENCE/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/source-tree.txt"
          sha256sum pnpm-lock.yaml > "$EVIDENCE/dependency-lock.sha256"
          node --version > "$EVIDENCE/node.txt"
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Verify retirement and actual request owner consumers
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/compiler-source-regressions"
          corepack pnpm@10.32.1 exec vitest run \
            packages/compiler/test/browser-client.test.ts \
            packages/compiler/test/browser-revision-session.test.ts \
            packages/compiler/test/browser-target-consumer.test.ts \
            packages/compiler/test/browser-wasm.test.ts \
            packages/compiler/test/browser-preview-retirement.test.ts \
            packages/compiler/test/browser-panel-retirement.test.ts \
            packages/compiler/test/browser-source-input.test.ts \
            packages/compiler/test/request-owner-ssr.test.ts \
            packages/compiler/test/button-ssr-server.test.ts \
            packages/compiler/test/gpui-a11y-value.test.ts \
            packages/compiler/test/gpui-capabilities.test.ts \
            packages/compiler/test/gpui-hook-renderer.test.ts \
            packages/compiler/test/gpui-event-notification.test.ts \
            packages/compiler/test/gpui-scalar-lowering.test.ts \
            packages/compiler/test/gpui-style-selection.test.ts \
            packages/compiler/test/gpui-control-label.test.ts \
            packages/compiler/test/string-coercion.test.ts \
            packages/runtime/test/contract/lifecycle.request.contract.test.ts \
            packages/runtime/test/contract/lifecycle.initial-data.contract.test.ts \
            packages/runtime/test/contract/lifecycle.module-resources.v1.contract.test.ts \
            packages/runtime/test/contract/as-hook.v0.contract.test.ts \
            packages/runtime/test/contract/prototype.render-syntax.v0.contract.test.ts \
            packages/runtime/test/contract/lifecycle.same-checkpoint-order.contract.test.ts \
            --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json \
            --outputFile="$EVIDENCE/vitest.json" 2>&1 | tee "$EVIDENCE/vitest.log"
      - name: Verify repository relocation and exact configuration controls
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/compiler-source-regressions"
          node --test scripts/compiler/browser-repository-root.test.mjs scripts/compiler/browser-delivery-index.test.mjs \
            2>&1 | tee "$EVIDENCE/browser-inputs.log"
          node --test --test-name-pattern='current retry virtual boundary|retry resolver profile: historical exact inputs' \
            scripts/coverage-matrices/test/check-coverage-matrices.test.mjs \
            2>&1 | tee "$EVIDENCE/configuration-controls.log"
          node scripts/ci/check-ci-schedule.mjs 2>&1 | tee "$EVIDENCE/ci-schedule.log"
          node --test scripts/ci/test/ci-scheduling-policy.test.mjs scripts/ci/test/cycle-job-inventory.test.mjs scripts/ci/test/cycle-report.test.mjs \
            2>&1 | tee "$EVIDENCE/ci-controls.log"
      - name: Check the complete workspace and documentation types
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 check:types 2>&1 | tee "$RUNNER_TEMP/compiler-source-regressions/types.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-source-regressions-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/compiler-source-regressions
          if-no-files-found: error
          retention-days: 30
  production-build:
    if: ${{ inputs.production_build }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASTRO_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the actual production website and inspect its bundle
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/compiler-production-build"
          mkdir -p "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git rev-parse HEAD > "$EVIDENCE/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/source-tree.txt"
          sha256sum pnpm-lock.yaml apps/www/astro.config.mjs > "$EVIDENCE/build-inputs.sha256"
          node --version > "$EVIDENCE/node.txt"
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          node --test scripts/coverage-matrices/test/check-website-production-bundle.test.mjs \
            2>&1 | tee "$EVIDENCE/bundle-gate-controls.log"
          corepack pnpm@10.32.1 check:website-production-bundle 2>&1 | tee "$EVIDENCE/production-build.log"
      - name: Retain the unmodified emitted production graph for independent replay
        if: always()
        run: |
          set -euo pipefail
          GRAPH=apps/www/dist/proto-ui-bundle-graph.json
          EVIDENCE="$RUNNER_TEMP/compiler-production-build"
          if [ -f "$GRAPH" ]; then
            mkdir -p "$EVIDENCE"
            cp "$GRAPH" "$EVIDENCE/proto-ui-bundle-graph.json"
            sha256sum "$GRAPH" > "$EVIDENCE/production-graph.sha256"
            cmp "$GRAPH" "$EVIDENCE/proto-ui-bundle-graph.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-production-build-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/compiler-production-build
          if-no-files-found: error
          retention-days: 30
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASTRO_TELEMETRY_DISABLED: '1'
      PUI_BROWSER_MODE: production
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bind the real source and locked toolchain
        run: |
          set -euo pipefail
          PUI_EVIDENCE_DIR="$RUNNER_TEMP/compiler-browser-acceptance"
          printf 'PUI_EVIDENCE_DIR=%s\n' "$PUI_EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PUI_EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git rev-parse HEAD > "$PUI_EVIDENCE_DIR/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$PUI_EVIDENCE_DIR/source-tree.txt"
          sha256sum pnpm-lock.yaml > "$PUI_EVIDENCE_DIR/dependency-lock.sha256"
          node --version > "$PUI_EVIDENCE_DIR/node.txt"
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          corepack pnpm@10.32.1 --version > "$PUI_EVIDENCE_DIR/pnpm.txt"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          "$CHROME" --version > "$PUI_EVIDENCE_DIR/browser.txt"
          printf 'PUI_CHROME_EXECUTABLE=%s\n' "$CHROME" >> "$GITHUB_ENV"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
      - name: Verify production receipt rejection and cleanup controls
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node --test scripts/compiler/browser-assets-production.test.mjs \
            scripts/compiler/browser-production.test.mjs \
            scripts/compiler/browser-delivery-index.test.mjs \
            2>&1 | tee "$PUI_EVIDENCE_DIR/production-controls.log"
      - name: Install and record Chinese fonts for the bilingual captures
        timeout-minutes: 3
        run: |
          set -euo pipefail
          sudo apt-get update -qq -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=2
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=2
          dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk fontconfig \
            > "$PUI_EVIDENCE_DIR/font-environment.txt"
          fc-match 'Noto Sans CJK SC' >> "$PUI_EVIDENCE_DIR/font-environment.txt"
      - name: Build once and run the cold bilingual four-target production journey
        run: |
          set -euo pipefail
          node --import tsx scripts/analysis/browser-compiler-browser.mts \
            2>&1 | tee "$PUI_EVIDENCE_DIR/browser-run.log"
      - name: Independently rebuild and verify the complete execution receipt
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          import { createBrowserDeliveryIndex } from './scripts/compiler/browser-delivery-index.mjs';
          const receipt = JSON.parse(await readFile(path.join(process.env.PUI_EVIDENCE_DIR, 'receipt.json'), 'utf8'));
          assert.equal(receipt.head, process.env.CANDIDATE_SHA);
          assert.equal(receipt.service.mode, 'runner-owned-production-static');
          assert.ok(receipt.cases.length > 0);
          assert.ok(receipt.cases.every((entry) => entry.status === 'passed'));
          const index = await createBrowserDeliveryIndex({ receipt });
          const rows = index.pages.flatMap((page) => page.targets ?? []);
          assert.equal(rows.length, 8, 'two actual documentation pages must each exercise four targets');
          assert.ok(rows.every((row) => row.status === 'browser-executed-awaiting-independent-acceptance'));
          await writeFile(path.join(process.env.PUI_EVIDENCE_DIR, 'verified-delivery.json'), JSON.stringify(index, null, 2) + '\n');
          JS
      - name: Retain original images, failures and source-bound receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-browser-acceptance-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: ${{ env.PUI_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

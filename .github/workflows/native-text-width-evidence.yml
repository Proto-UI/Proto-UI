name: Native text width evidence

on:
  pull_request:
    paths:
      - '.github/workflows/native-text-width-evidence.yml'
      - 'packages/adapters/web-component/src/**'
      - 'packages/adapters/web-component/test/native-text*'
      - 'packages/adapters/web-component/test/fixtures/native-width.mjs'
      - 'packages/prototypes/shadcn/src/input/**'
      - 'packages/prototypes/shadcn/src/textarea/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-text-width-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies without package scripts
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Bind evidence to exact source and runner browser
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-text-width"
          git rev-parse HEAD > "$RUNNER_TEMP/native-text-width/source-sha.txt"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --version > "$RUNNER_TEMP/native-text-width/browser-version.txt"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Verify native Input and Textarea across four runtimes
        env:
          PROTO_UI_NATIVE_WIDTH_EVIDENCE: ${{ runner.temp }}/native-text-width
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 exec vitest run --no-file-parallelism \
            packages/adapters/web-component/test/native-text-width.browser.test.ts \
            2>&1 | tee "$PROTO_UI_NATIVE_WIDTH_EVIDENCE/browser.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-text-width-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-text-width
          if-no-files-found: error
          retention-days: 30

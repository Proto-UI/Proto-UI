name: Shadcn Card shared style evidence
on:
  pull_request:
    paths:
      - 'packages/prototypes/shadcn/src/card/**'
      - 'packages/prototypes/shadcn/src/style-scope/**'
      - 'packages/prototypes/shadcn/test/card*.test.ts'
      - 'packages/adapters/**/src/**'
      - 'scripts/prototypes/shadcn-card-evidence*'
      - '.github/workflows/shadcn-card-style.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  card-four-web-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked existing dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
      - name: Test passive Card and scope projection
        run: node node_modules/vitest/vitest.mjs run packages/prototypes/shadcn/test/card-style-projection.test.ts packages/prototypes/shadcn/test/card-evidence-app-probe.test.ts packages/prototypes/shadcn/test/card.test.ts packages/prototypes/shadcn/test/style-scope.test.ts
      - name: Capture exact-head four-runtime Card density, theme and scope
        env:
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --import tsx scripts/prototypes/shadcn-card-evidence.mjs /tmp/pui-shadcn-card-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadcn-card-shared-style-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/pui-shadcn-card-evidence/
          if-no-files-found: warn
          retention-days: 30

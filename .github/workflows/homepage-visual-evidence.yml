name: Homepage visual evidence

on:
  workflow_dispatch:
    inputs:
      mobile_preview_fit:
        description: Run only the exact-source live homepage preview fit comparison
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      mobile_preview_fit:
        type: boolean
        required: false
        default: false

# Public homepage only; no secrets, deployment, repository writes or privileged
# PR context. Artifacts are review evidence, not a new branch-protection gate.
permissions:
  contents: read

concurrency:
  group: homepage-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

env:
  BASELINE_SHA: 1fd4c08a067a8322295c78b2b708d2b4cbc01304
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  capture:
    if: ${{ inputs.mobile_preview_fit != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out exact candidate (not the synthetic PR merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Check out immutable before revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore the exact browser font package only
        timeout-minutes: 1
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/homepage-font-cache/fonts-noto-cjk_20230817+repack1-3_all.deb
          key: ubuntu24-fonts-noto-cjk-7d64b985f6fe128c99eae5610d5c047338e572bdcfb2bb09736be01b824a7f6c
      - name: Install the official Ubuntu CJK font package for both revisions
        timeout-minutes: 3
        env:
          FONT_EVIDENCE_DIR: ${{ runner.temp }}/homepage-evidence
        run: bash candidate/apps/www/scripts/prepare-homepage-composition-fonts.sh
      - name: Install locked dependencies in both isolated worktrees
        id: install
        timeout-minutes: 5
        run: |
          corepack enable
          for worktree in baseline candidate; do
            (cd "$worktree" && corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts)
          done
      - name: Disable only the developer toolbar through Astro project preferences
        timeout-minutes: 2
        run: |
          set -euo pipefail
          {
            echo 'Renderer: supported Astro dev server; same project-local devToolbar preference on baseline and candidate'
            for worktree in baseline candidate; do
              echo "Checkout: $worktree"
              (
                cd "$worktree"
                corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
                corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
              )
            done
          } | tee "$RUNNER_TEMP/homepage-evidence/renderer-environment.txt"
          echo 'PROTO_UI_EVIDENCE_TOOLBAR=disabled-by-project-preference' >> "$GITHUB_ENV"
      - name: Locate runner-provided Chrome
        id: chrome
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser) || {
            echo 'BLOCKED: runner has no Chrome/Chromium executable'; exit 1;
          }
          "$CHROME" --version | tee "$RUNNER_TEMP/homepage-evidence/browser-environment.txt"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Test evidence provenance and acceptance predicates
        working-directory: candidate
        run: node --import tsx --test apps/www/scripts/homepage-evidence-contract.test.ts apps/www/scripts/label-selection-observer.test.ts scripts/test/projection-scope-evidence.test.mjs scripts/test/run-runtime-tests.test.mjs
      - name: Capture real baseline with the candidate-owned browser probe
        id: baseline_capture
        # Historical behavior may fail: preserve its red trace, then require
        # the complete before-image inventory in the independent step below.
        continue-on-error: true
        if: always() && !cancelled() && steps.install.outcome == 'success' && steps.chrome.outcome == 'success'
        timeout-minutes: 10
        working-directory: baseline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/homepage-evidence"
          timeout --signal=TERM --kill-after=10s 540s \
            node --import tsx "$GITHUB_WORKSPACE/candidate/apps/www/scripts/capture-homepage-evidence.ts" \
            --revision-kind baseline --expected-revision "$BASELINE_SHA" \
            --out "$RUNNER_TEMP/homepage-evidence/baseline" \
            2>&1 | tee "$RUNNER_TEMP/homepage-evidence/baseline.log"
      - name: Validate the complete immutable baseline visual inventory
        id: baseline_visual_inventory
        if: always() && !cancelled() && steps.install.outcome == 'success' && steps.chrome.outcome == 'success'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const root = path.join(process.env.RUNNER_TEMP, 'homepage-evidence/baseline');
          const report = JSON.parse(fs.readFileSync(path.join(root, 'metrics.json'), 'utf8'));
          assert.equal(report.revisionKind, 'baseline');
          assert.equal(report.revision, process.env.BASELINE_SHA);
          assert.equal(report.cases.length, 20, 'All configured before views must exist');
          assert.equal(new Set(report.cases.map((entry) => entry.id)).size, 20);
          const failed = report.cases.filter((entry) => entry.outcome !== 'passed');
          assert.equal(report.failures.length, failed.length, 'No unclassified top-level failures');
          for (const entry of failed) {
            assert.equal(entry.failureClassification, 'baseline-react-select-home-focus', `${entry.id}: unexpected baseline failure`);
            assert.equal(entry.failureStage, 'keyboard-home');
            assert.equal(entry.errorName, 'TimeoutError');
            console.log(`Known negative control ${entry.id}: ${entry.error}`);
          }
          for (const entry of report.cases) {
            assert.equal(entry.pageErrors?.length ?? 0, 0, `${entry.id}: unexpected page exception`);
            const filename = `${entry.id}-initial-viewport.png`;
            assert.match(filename, /^[a-z0-9-]+\.png$/);
            assert.ok(entry.screenshots.includes(filename), filename);
            const bytes = fs.readFileSync(path.join(root, filename));
            assert.equal(bytes.subarray(0, 8).toString('hex'), '89504e470d0a1a0a', filename);
            assert.ok(bytes.length > 1000, filename);
          }
          console.log(`20 exact-baseline initial screenshots verified; ${report.failures.length} historical behavior failures remain recorded in metrics.json.`);
          JS
      - name: Make baseline evidence available before candidate execution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-baseline-${{ env.BASELINE_SHA }}-probe-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/homepage-evidence/baseline
            ${{ runner.temp }}/homepage-evidence/baseline.log
            ${{ runner.temp }}/homepage-evidence/*-environment.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Capture real exact-head candidate with the same browser probe
        if: always() && !cancelled() && steps.install.outcome == 'success' && steps.chrome.outcome == 'success'
        timeout-minutes: 16
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/homepage-evidence"
          timeout --signal=TERM --kill-after=10s 900s \
            node --import tsx apps/www/scripts/capture-homepage-evidence.ts \
            --revision-kind candidate --expected-revision "$CANDIDATE_SHA" \
            --out "$RUNNER_TEMP/homepage-evidence/candidate" \
            2>&1 | tee "$RUNNER_TEMP/homepage-evidence/candidate.log"
      - name: Make candidate images available before the regression suites finish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-candidate-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/homepage-evidence/candidate
            ${{ runner.temp }}/homepage-evidence/candidate.log
            ${{ runner.temp }}/homepage-evidence/*-environment.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Retain small candidate frame and metadata bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-candidate-frames-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/homepage-evidence/candidate/*-initial-viewport.png
            ${{ runner.temp }}/homepage-evidence/candidate/*-initial-full.png
            ${{ runner.temp }}/homepage-evidence/candidate/*-navigation-open-viewport.png
            ${{ runner.temp }}/homepage-evidence/candidate/*brutalist-*-viewport.png
            ${{ runner.temp }}/homepage-evidence/candidate/*-failure-viewport.png
            ${{ runner.temp }}/homepage-evidence/candidate/reference-*.png
            ${{ runner.temp }}/homepage-evidence/candidate/*.json
            ${{ runner.temp }}/homepage-evidence/candidate.log
          if-no-files-found: warn
          retention-days: 30
      - name: Verify built production Search with real Pagefind
        if: always() && !cancelled() && steps.install.outcome == 'success' && steps.chrome.outcome == 'success'
        timeout-minutes: 10
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/homepage-evidence"
          node --test apps/www/scripts/run-search-production-evidence.test.mjs
          # The runner's single deadline includes build, readiness, exactly
          # two real-production cases, and cleanup of its own process groups.
          node apps/www/scripts/run-search-production-evidence.mjs \
            2>&1 | tee "$RUNNER_TEMP/homepage-evidence/search-production.log"
      - name: Preserve the small production Search evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-search-production-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/homepage-evidence/search-production
            ${{ runner.temp }}/homepage-evidence/search-production.log
          if-no-files-found: warn
          retention-days: 30
      - name: Retain actual images, measurements and failure output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-evidence-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/homepage-evidence
          if-no-files-found: warn
          retention-days: 30

  isolated-controls:
    if: ${{ inputs.mobile_preview_fit != true }}
    # Each suite gets a fresh process/server lifetime and its own bounded result.
    # A failed native-link journey cannot consume Copy's execution budget.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: native-links
            suite: site-native-links
            pattern: '^native links with app-owned Proto visual surfaces'
          # Exhaustive complement: reading/layout journeys keep the same per-case
          # assertions and a separate, unchanged 600s process/server lifetime.
          - name: native-links-reading
            suite: site-native-links
            pattern: '^(?!native links with app-owned Proto visual surfaces)'
          # Dedicated owner: apps/www/src/content/docs/zh-cn/brutalist-action-motion.browser.test.ts
          - name: brutalist-action-motion
            suite: brutalist-action-motion
          - name: code-surfaces
            suite: code-surfaces
          - name: code-surface-grammar
            suite: code-surface-grammar
          - name: docs-content-flow
            suite: docs-content-flow
          - name: homepage-button-contract
            suite: homepage-button-contract
          # Dedicated owner: apps/www/src/content/docs/zh-cn/homepage-composition.browser.test.ts
          - name: homepage-composition
            suite: homepage-composition
          - name: copy-commands
            suite: site-copy-commands
          - name: runtime-box
            suite: runtime-preview-surface
            contract: runtime-preview-evidence
          - name: search-activation
            suite: site-search-activation
            contract: site-search-browser-inventory
          - name: search-layout
            suite: site-search-layout
          - name: search-menu
            suite: site-search-menu
          # Each retained homepage suite keeps its original assertions and case
          # deadlines within the existing 600s isolated process/server lifetime.
          - name: homepage-dogfood
            suite: homepage-dogfood
          - name: home-demo-runtime
            suite: home-demo-runtime
          - name: prototype-projection-scope
            suite: prototype-projection-scope
          - name: demo-brutalist-checkbox
            suite: demo-brutalist-checkbox
          - name: demo-brutalist-remaining
            suite: demo-brutalist-remaining
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore the exact isolated-control font package only
        id: isolated-font-cache
        timeout-minutes: 1
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/homepage-font-cache/fonts-noto-cjk_20230817+repack1-3_all.deb
          key: ubuntu24-fonts-noto-cjk-7d64b985f6fe128c99eae5610d5c047338e572bdcfb2bb09736be01b824a7f6c
      - name: Install locked dependencies and the same official font package
        id: prepare-isolated-fonts
        timeout-minutes: 5
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          timeout --signal=TERM --kill-after=5s 220s bash apps/www/scripts/prepare-homepage-composition-fonts.sh
      - name: Select runner Chrome and the supported toolbar preference
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/homepage-evidence"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --version | tee "$RUNNER_TEMP/homepage-evidence/browser-environment.txt"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
          echo 'PROTO_UI_EVIDENCE_TOOLBAR=disabled-by-project-preference' >> "$GITHUB_ENV"
      - name: Execute the exact isolated browser suite
        timeout-minutes: 12
        env:
          SUITE: ${{ matrix.suite }}
          CONTRACT: ${{ matrix.contract }}
          TEST_PATTERN: ${{ matrix.pattern }}
          PROTO_UI_CODE_EVIDENCE_DIR: ${{ runner.temp }}/homepage-evidence/code-surfaces
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/homepage-evidence/runtime
        run: |
          set -euo pipefail
          FILE="apps/www/src/content/docs/zh-cn/${SUITE}.browser.test.ts"
          test -f "$FILE"
          files=("$FILE")
          filters=()
          if [[ -n "$TEST_PATTERN" ]]; then
            filters+=(--testNamePattern "$TEST_PATTERN")
          fi
          if [[ -n "$CONTRACT" ]]; then
            CONTRACT_FILE="apps/www/src/content/docs/zh-cn/${CONTRACT}.test.ts"
            test -f "$CONTRACT_FILE"
            files+=("$CONTRACT_FILE")
          fi
          {
            git rev-parse HEAD
            echo "Selected suite: $FILE"
            timeout --signal=TERM --kill-after=10s 600s \
              corepack pnpm@10.32.1 exec vitest run --no-file-parallelism "${files[@]}" "${filters[@]}"
          } 2>&1 | tee "$RUNNER_TEMP/homepage-evidence/isolated-regressions.log"
      - name: Save the verified composition font package
        if: ${{ !cancelled() && steps.prepare-isolated-fonts.outcome == 'success' && matrix.name == 'homepage-composition' && steps.isolated-font-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/homepage-font-cache/fonts-noto-cjk_20230817+repack1-3_all.deb
          key: ${{ steps.isolated-font-cache.outputs.cache-primary-key }}
      - name: Preserve this suite's actual images, measurements and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-${{ matrix.name }}-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/homepage-evidence
          if-no-files-found: warn
          retention-days: 30

  mobile-navigation-reading:
    if: ${{ inputs.mobile_preview_fit != true }}
    # Additive exact-source evidence for the mobile interaction increment.
    # Keep the older homepage comparison and all existing acceptance budgets.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MOBILE_BASELINE_SHA: ec6e5710d0aaeee6d5844f9c996c1d7ca594aa31
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MOBILE_BASELINE_SHA }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare the same official browser and fonts for both revisions
        id: prepare-mobile
        # Two worktrees are installed here. The previous five-minute ceiling
        # left no room for the font package and both locked installs on a
        # loaded runner.
        timeout-minutes: 12
        run: |
          set -euo pipefail
          corepack enable
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          mkdir -p "$RUNNER_TEMP/mobile-interaction"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --version | tee "$RUNNER_TEMP/mobile-interaction/browser.txt"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          for worktree in baseline candidate; do
            (
              cd "$worktree"
              corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
              corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
            )
          done
          cd candidate
          node --test --test-concurrency=1 \
            apps/www/scripts/mobile-prepared-inputs.test.mjs \
            apps/www/scripts/mobile-capture-owner.test.mjs
          node --import tsx apps/www/scripts/prepare-mobile-interaction-inputs.ts \
            --expected-revision "$CANDIDATE_SHA" \
            --out "$RUNNER_TEMP/mobile-interaction/candidate-inputs.json"
      - name: Capture the first normal-size 390px before view
        if: ${{ !cancelled() }}
        working-directory: baseline
        timeout-minutes: 2
        run: |
          node "$GITHUB_WORKSPACE/candidate/apps/www/scripts/run-mobile-interaction-evidence.mjs" \
            --revision-kind baseline --expected-revision "$MOBILE_BASELINE_SHA" --quick-preview \
            --out "$RUNNER_TEMP/mobile-interaction/first-pair/baseline"
      - name: Capture the first normal-size 390px after view
        if: ${{ !cancelled() && steps.prepare-mobile.outcome == 'success' }}
        working-directory: candidate
        timeout-minutes: 2
        run: |
          node apps/www/scripts/run-mobile-interaction-evidence.mjs \
            --revision-kind candidate --expected-revision "$CANDIDATE_SHA" --quick-preview \
            --prepared-inputs "$RUNNER_TEMP/mobile-interaction/candidate-inputs.json" \
            --out "$RUNNER_TEMP/mobile-interaction/first-pair/candidate"
      - name: Publish the first actual pair before the full interaction matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-first-pair-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mobile-interaction/first-pair
          if-no-files-found: warn
          retention-days: 30
      - name: Capture the exact pre-change mobile experience
        if: ${{ !cancelled() }}
        working-directory: baseline
        timeout-minutes: 6
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/candidate/apps/www/scripts/run-mobile-interaction-evidence.mjs" \
            --revision-kind baseline --expected-revision "$MOBILE_BASELINE_SHA" \
            --out "$RUNNER_TEMP/mobile-interaction/baseline" \
            2>&1 | tee "$RUNNER_TEMP/mobile-interaction/baseline.log"
      - name: Retain the pre-change mobile pictures before candidate validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-before-${{ env.MOBILE_BASELINE_SHA }}-probe-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mobile-interaction/baseline
          if-no-files-found: warn
          retention-days: 30
      - name: Capture and regress the exact candidate mobile interactions
        if: ${{ !cancelled() && steps.prepare-mobile.outcome == 'success' }}
        working-directory: candidate
        timeout-minutes: 6
        run: |
          set -euo pipefail
          node apps/www/scripts/run-mobile-interaction-evidence.mjs \
            --revision-kind candidate --expected-revision "$CANDIDATE_SHA" \
            --prepared-inputs "$RUNNER_TEMP/mobile-interaction/candidate-inputs.json" \
            --out "$RUNNER_TEMP/mobile-interaction/candidate" \
            2>&1 | tee "$RUNNER_TEMP/mobile-interaction/candidate.log"
      - name: Preserve before/after mobile screenshots and all failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-interaction-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-interaction
          if-no-files-found: error
          retention-days: 30

  visual-density:
    if: ${{ inputs.mobile_preview_fit != true }}
    # Consumer-only scale/sidebar/Copy comparison, isolated from the existing gates.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DENSITY_BASELINE_SHA: ec6e5710d0aaeee6d5844f9c996c1d7ca594aa31
      DENSITY_FOLLOWUP_BASELINE_SHA: fbd90df092369e6d2aab73c66848f4236ba83a29
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DENSITY_BASELINE_SHA }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DENSITY_FOLLOWUP_BASELINE_SHA }}
          path: followup-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare locked sources and the same official browser/font environment
        # Three worktrees are installed here (baseline, followup baseline and
        # candidate). The previous five-minute ceiling expired during the
        # installs, so every later capture ran without node_modules and failed
        # with ERR_MODULE_NOT_FOUND for tsx.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          corepack enable
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          mkdir -p "$RUNNER_TEMP/visual-density"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --version | tee "$RUNNER_TEMP/visual-density/browser.txt"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          for worktree in baseline followup-baseline candidate; do
            (
              cd "$worktree"
              corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
              corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
            )
          done
      - name: Capture the first same-page sidebar before view
        if: ${{ !cancelled() }}
        working-directory: followup-baseline
        timeout-minutes: 3
        run: |
          node --import tsx "$GITHUB_WORKSPACE/candidate/apps/www/scripts/capture-visual-density-evidence.ts" \
            --revision-kind baseline --expected-revision "$DENSITY_FOLLOWUP_BASELINE_SHA" --quick-preview \
            --out "$RUNNER_TEMP/visual-density/first-pair/baseline"
      - name: Capture the first same-page sidebar after view
        if: ${{ !cancelled() }}
        working-directory: candidate
        timeout-minutes: 3
        run: |
          node --import tsx apps/www/scripts/capture-visual-density-evidence.ts \
            --revision-kind candidate --expected-revision "$CANDIDATE_SHA" --quick-preview \
            --out "$RUNNER_TEMP/visual-density/first-pair/candidate"
      - name: Retain the first real sidebar pair before the full matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: density-first-pair-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/visual-density/first-pair
          if-no-files-found: warn
          retention-days: 30
      - name: Capture the complete pre-change homepage and sidebar matrix
        if: ${{ !cancelled() }}
        working-directory: baseline
        timeout-minutes: 6
        run: |
          node --import tsx "$GITHUB_WORKSPACE/candidate/apps/www/scripts/capture-visual-density-evidence.ts" \
            --revision-kind baseline --expected-revision "$DENSITY_BASELINE_SHA" \
            --out "$RUNNER_TEMP/visual-density/baseline"
      - name: Capture and verify actual candidate Text and Surface leaves
        if: ${{ !cancelled() }}
        working-directory: candidate
        timeout-minutes: 6
        run: |
          node --import tsx apps/www/scripts/capture-visual-density-evidence.ts \
            --revision-kind candidate --expected-revision "$CANDIDATE_SHA" \
            --out "$RUNNER_TEMP/visual-density/candidate"
      - name: Preserve all scale frames, provenance and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-density-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/visual-density
          if-no-files-found: warn
          retention-days: 30

  mobile-preview-fit:
    # Opt-in repair evidence; the four historical lanes above retain their
    # original default behavior and immutable before revisions.
    if: ${{ inputs.mobile_preview_fit == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PREVIEW_BASELINE_SHA: 2f2398fcbf65be5099901caa5649e39103b3a163
      # Dispatch binds github.sha; a reusable PR caller must use the real head.
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Retain the exact requested comparison before setup
        run: |
          PREVIEW_FIT_EVIDENCE_DIR="$RUNNER_TEMP/homepage-preview-fit"
          printf '%s\n' "PREVIEW_FIT_EVIDENCE_DIR=$PREVIEW_FIT_EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PREVIEW_FIT_EVIDENCE_DIR"
          printf '%s\n' "$PREVIEW_BASELINE_SHA" > "$PREVIEW_FIT_EVIDENCE_DIR/requested-baseline.txt"
          printf '%s\n' "$CANDIDATE_SHA" > "$PREVIEW_FIT_EVIDENCE_DIR/requested-candidate.txt"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_BASELINE_SHA }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore only the existing pinned official font package
        timeout-minutes: 1
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/homepage-font-cache/fonts-noto-cjk_20230817+repack1-3_all.deb
          key: ubuntu24-fonts-noto-cjk-7d64b985f6fe128c99eae5610d5c047338e572bdcfb2bb09736be01b824a7f6c
      - name: Prepare the same normal CJK font surface for both sources
        timeout-minutes: 3
        env:
          FONT_EVIDENCE_DIR: ${{ runner.temp }}/homepage-preview-fit/fonts
        run: bash candidate/apps/www/scripts/prepare-homepage-composition-fonts.sh
      - name: Install both locked dependency graphs without lifecycle scripts
        timeout-minutes: 5
        run: |
          set -euo pipefail
          corepack enable
          for worktree in baseline candidate; do
            (cd "$worktree" && corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts) \
              2>&1 | tee "$PREVIEW_FIT_EVIDENCE_DIR/install-$worktree.log"
          done
      - name: Configure only supported Astro preferences and identify the browser
        id: ready
        timeout-minutes: 2
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          {
            node --version
            corepack pnpm@10.32.1 --version
            "$CHROME" --version
            for worktree in baseline candidate; do
              (
                cd "$worktree"
                git rev-parse HEAD HEAD^{tree}
                corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
                corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
              )
            done
          } | tee "$PREVIEW_FIT_EVIDENCE_DIR/environment.txt"
      - name: Check the gallery capture contract
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        working-directory: candidate
        timeout-minutes: 3
        run: |
          set -euo pipefail
          node --import tsx --test apps/www/scripts/homepage-evidence-contract.test.ts \
            2>&1 | tee "$PREVIEW_FIT_EVIDENCE_DIR/gallery-contract.log"
      - name: Generate the candidate styles consumed by the gallery suites
        id: candidate-styles
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        working-directory: candidate
        timeout-minutes: 5
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 --filter apps-www run generate:proto-ui-style \
            2>&1 | tee "$PREVIEW_FIT_EVIDENCE_DIR/candidate-styles.log"
      - name: Exercise gallery composition, typography, icons, layout and runtime ownership
        if: ${{ !cancelled() && steps.candidate-styles.outcome == 'success' }}
        working-directory: candidate
        timeout-minutes: 5
        run: |
          set -uo pipefail
          set +e
          corepack pnpm@10.32.1 exec vitest run --no-file-parallelism --maxWorkers=1 --minWorkers=1 \
            apps/www/src/components/Homepage/homepage-showcase.test.ts \
            apps/www/src/components/Homepage/homepage-composition.integration.test.ts \
            apps/www/src/components/Homepage/homepage-gallery-props.test.ts \
            apps/www/src/components/Homepage/homepage-gallery-icons.test.ts \
            apps/www/src/components/Homepage/homepage-layout-evidence.test.ts \
            apps/www/src/components/Homepage/homepage-typography-state.test.ts \
            apps/www/src/components/Homepage/homepage-runtime-client.test.ts \
            apps/www/src/components/Homepage/homepage-focus-lifecycle.integration.test.ts \
            apps/www/src/components/PrototypePreviewer/homepage-presentation.test.ts \
            --reporter=default --reporter=json --outputFile="$PREVIEW_FIT_EVIDENCE_DIR/units.json" \
            2>&1 | tee "$PREVIEW_FIT_EVIDENCE_DIR/units.log"
          fit_status=("${PIPESTATUS[@]}")
          printf '%s\n' "${fit_status[0]}" > "$PREVIEW_FIT_EVIDENCE_DIR/units-exit.txt"
          if [ "${fit_status[0]}" -ne 0 ]; then exit "${fit_status[0]}"; fi
          exit "${fit_status[1]}"
      - name: Capture mobile, desktop and wide before views at the pinned main revision
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        working-directory: baseline
        timeout-minutes: 10
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 540s \
            node --import tsx "$GITHUB_WORKSPACE/candidate/apps/www/scripts/capture-homepage-preview-fit.ts" \
            --revision-kind baseline --expected-revision "$PREVIEW_BASELINE_SHA" \
            --expected-probe-revision "$CANDIDATE_SHA" --out "$PREVIEW_FIT_EVIDENCE_DIR/baseline" \
            2>&1 | tee "$PREVIEW_FIT_EVIDENCE_DIR/baseline.log"
      - name: Capture and verify the matching candidate views
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        working-directory: candidate
        timeout-minutes: 10
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 540s \
            node --import tsx apps/www/scripts/capture-homepage-preview-fit.ts \
            --revision-kind candidate --expected-revision "$CANDIDATE_SHA" \
            --expected-probe-revision "$CANDIDATE_SHA" --out "$PREVIEW_FIT_EVIDENCE_DIR/candidate" \
            2>&1 | tee "$PREVIEW_FIT_EVIDENCE_DIR/candidate.log"
      - name: Exercise the mobile journeys, responsive gallery, shortcuts and compact editor tabs
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        working-directory: candidate
        timeout-minutes: 10
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/homepage-preview-fit/native/runtime
        run: |
          set -uo pipefail
          set +e
          corepack pnpm@10.32.1 exec vitest run --no-file-parallelism --maxWorkers=1 --minWorkers=1 \
            apps/www/src/content/docs/zh-cn/home-demo-runtime.browser.test.ts \
            --testNamePattern='^Homepage Runtime demobox browser smoke (fills the mobile preview with live components and enters the same gallery through the Hero Demo link|keeps the compact preview full width through viewport, root-font, theme and Runtime changes|honors direct and repeated Hero hash entry with native Back and Forward|uses unframed responsive task layout, real control feedback and four executable runtimes|operates the four homepage shortcut groups and compact Brutalist editor tabs with native input)$' \
            --reporter=default --reporter=json --outputFile="$PREVIEW_FIT_EVIDENCE_DIR/runtime.json" \
            2>&1 | tee "$PREVIEW_FIT_EVIDENCE_DIR/runtime.log"
          fit_status=("${PIPESTATUS[@]}")
          printf '%s\n' "${fit_status[0]}" > "$PREVIEW_FIT_EVIDENCE_DIR/runtime-exit.txt"
          if [ "${fit_status[0]}" -ne 0 ]; then exit "${fit_status[0]}"; fi
          exit "${fit_status[1]}"
      - name: Retain the original WC Shadcn composition and 200 percent text interaction case
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        working-directory: candidate
        timeout-minutes: 10
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/homepage-preview-fit/native/composition
        run: |
          set -uo pipefail
          set +e
          corepack pnpm@10.32.1 exec vitest run --no-file-parallelism --maxWorkers=1 --minWorkers=1 \
            apps/www/src/content/docs/zh-cn/homepage-composition.browser.test.ts \
            --testNamePattern='^Homepage compositions: native input and exact-source responsive evidence wc/shadcn connects the example tasks and keeps their content readable$' \
            --reporter=default --reporter=json --outputFile="$PREVIEW_FIT_EVIDENCE_DIR/composition.json" \
            2>&1 | tee "$PREVIEW_FIT_EVIDENCE_DIR/composition.log"
          fit_status=("${PIPESTATUS[@]}")
          printf '%s\n' "${fit_status[0]}" > "$PREVIEW_FIT_EVIDENCE_DIR/composition-exit.txt"
          if [ "${fit_status[0]}" -ne 0 ]; then exit "${fit_status[0]}"; fi
          exit "${fit_status[1]}"
      - name: Reconcile exact source, all capture cases and the selected test inventory
        if: always()
        working-directory: candidate
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.env.PREVIEW_FIT_EVIDENCE_DIR;
          fs.mkdirSync(root, { recursive: true });
          const failures = [], captures = {}, suites = [];
          const sha256 = bytes => createHash('sha256').update(bytes).digest('hex');
          const read = name => JSON.parse(fs.readFileSync(path.join(root, name), 'utf8'));
          const expectedIds = ['zh-cn', 'en'].flatMap(locale => [390, 1440, 1920].flatMap(width =>
            ['light', 'dark'].map(theme => `${locale}-${width}-${theme}`)));
          for (const [kind, revision] of [['baseline', process.env.PREVIEW_BASELINE_SHA], ['candidate', process.env.CANDIDATE_SHA]]) {
            try {
              const file = path.join(kind, 'metrics.json'), raw = fs.readFileSync(path.join(root, file));
              const data = JSON.parse(raw);
              captures[kind] = { file, sha256: sha256(raw), data };
              assert.equal(data.schemaVersion, 1);
              assert.equal(data.revisionKind, kind);
              assert.equal(data.source.revision, revision);
              assert.equal(data.probe.revision, process.env.CANDIDATE_SHA);
              assert.equal(data.source.status, '');
              assert.equal(data.probe.status, '');
              assert.deepEqual(data.sourceAfter, data.source);
              assert.deepEqual(data.generatedFilesAfter, data.generatedFiles);
              assert.equal(data.generatedFiles.length, 5);
              assert.ok(data.generatedFiles.every(item => item.bytes > 0 && /^[a-f0-9]{64}$/.test(item.sha256)));
              assert.ok(data.browser.length > 0 && data.chromiumSandbox === true);
              assert.equal(data.cases.length, expectedIds.length);
              assert.deepEqual(data.cases.map(item => item.id).sort(), [...expectedIds].sort());
              assert.deepEqual(data.failures, []);
              for (const entry of data.cases) {
                assert.equal(entry.outcome, kind === 'baseline' ? 'captured' : 'passed');
                assert.deepEqual(entry.pageErrors, []);
                assert.deepEqual(entry.validationFailures, []);
                assert.ok(entry.fadeBox.physicalHeight > 0);
                assert.equal(entry.screenshots.length, 2);
                assert.deepEqual(entry.screenshots.map(item => item.file).sort(),
                  [`${entry.id}-initial-viewport.png`, `${entry.id}-initial-full.png`].sort());
                for (const screenshot of entry.screenshots) {
                  assert.match(screenshot.file, /^[a-z0-9-]+\.png$/);
                  const bytes = fs.readFileSync(path.join(root, kind, screenshot.file));
                  assert.equal(bytes.subarray(0, 8).toString('hex'), '89504e470d0a1a0a');
                  assert.equal(sha256(bytes), screenshot.sha256);
                  assert.equal(bytes.length, screenshot.bytes);
                  assert.equal(bytes.readUInt32BE(16), screenshot.width);
                  assert.equal(bytes.readUInt32BE(20), screenshot.height);
                  if (screenshot.file.endsWith('-initial-viewport.png')) {
                    assert.equal(screenshot.width, entry.viewport.width);
                    assert.equal(screenshot.height, entry.viewport.height);
                  } else {
                    assert.equal(screenshot.width, screenshot.documentExtent.width);
                    assert.equal(screenshot.height, screenshot.documentExtent.height);
                  }
                }
              }
            } catch (error) { failures.push(`${kind}: ${error.message}`); }
          }
          try {
            assert.deepEqual(captures.baseline.data.probe, captures.candidate.data.probe);
          } catch (error) { failures.push(`Shared probe binding: ${error.message}`); }
          const unitFiles = [
            'apps/www/src/components/Homepage/homepage-showcase.test.ts',
            'apps/www/src/components/Homepage/homepage-composition.integration.test.ts',
            'apps/www/src/components/Homepage/homepage-gallery-props.test.ts',
            'apps/www/src/components/Homepage/homepage-gallery-icons.test.ts',
            'apps/www/src/components/Homepage/homepage-layout-evidence.test.ts',
            'apps/www/src/components/Homepage/homepage-typography-state.test.ts',
            'apps/www/src/components/Homepage/homepage-runtime-client.test.ts',
            'apps/www/src/components/Homepage/homepage-focus-lifecycle.integration.test.ts',
            'apps/www/src/components/PrototypePreviewer/homepage-presentation.test.ts',
          ];
          const plans = [
            { id: 'units', files: unitFiles, titles: null },
            { id: 'runtime', files: ['apps/www/src/content/docs/zh-cn/home-demo-runtime.browser.test.ts'], titles: [
              'fills the mobile preview with live components and enters the same gallery through the Hero Demo link',
              'keeps the compact preview full width through viewport, root-font, theme and Runtime changes',
              'honors direct and repeated Hero hash entry with native Back and Forward',
              'uses unframed responsive task layout, real control feedback and four executable runtimes',
              'operates the four homepage shortcut groups and compact Brutalist editor tabs with native input',
            ] },
            { id: 'composition', files: ['apps/www/src/content/docs/zh-cn/homepage-composition.browser.test.ts'],
              titles: ['wc/shadcn connects the example tasks and keeps their content readable'] },
          ];
          for (const plan of plans) {
            const result = { ...plan, outcome: 'failed' }; suites.push(result);
            try {
              const raw = fs.readFileSync(path.join(root, `${plan.id}.json`)), data = JSON.parse(raw);
              const assertions = data.testResults.flatMap(suite => suite.assertionResults);
              const executed = assertions.filter(test => ['passed', 'failed'].includes(test.status));
              const selected = plan.titles ? assertions.filter(test => plan.titles.includes(test.title)) : assertions;
              Object.assign(result, { sha256: sha256(raw), collected: assertions.length,
                selected: selected.map(({ fullName, title, status }) => ({ fullName, title, status })),
                executed: executed.length, passed: assertions.filter(test => test.status === 'passed').length,
                failed: assertions.filter(test => test.status === 'failed').length,
                skipped: assertions.filter(test => !['passed', 'failed'].includes(test.status)).length });
              assert.deepEqual(data.testResults.map(suite => suite.name).sort(), plan.files.map(file => path.resolve(file)).sort());
              assert.equal(fs.readFileSync(path.join(root, `${plan.id}-exit.txt`), 'utf8').trim(), '0');
              assert.equal(data.success, true);
              assert.ok(data.testResults.every(suite => suite.assertionResults.length > 0));
              assert.ok(selected.length > 0 && selected.every(test => test.status === 'passed'));
              assert.equal(executed.length, selected.length, 'No unintended case may execute');
              if (plan.titles) assert.deepEqual(selected.map(test => test.title).sort(), [...plan.titles].sort());
              result.outcome = 'passed';
            } catch (error) { result.error = error.message; failures.push(`${plan.id}: ${error.message}`); }
          }
          const comparison = captures.baseline?.data.cases.map(before => {
            const after = captures.candidate?.data.cases.find(item => item.id === before.id);
            return { id: before.id, before: before.facts, beforeFade: before.fadeBox,
              after: after?.facts, afterFade: after?.fadeBox };
          }) ?? [];
          const receipt = { schemaVersion: 1, candidate: process.env.CANDIDATE_SHA,
            baseline: process.env.PREVIEW_BASELINE_SHA, runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT, observedAt: new Date().toISOString(),
            scope: '12 initial views per source; 9 source suites; 5 Runtime and 1 WC/Shadcn composition native cases',
            captures: Object.fromEntries(Object.entries(captures).map(([kind, { file, sha256 }]) => [kind, { file, sha256 }])),
            comparison, suites, failures, captureIntegrity: failures.length ? 'failed' : 'passed',
            acceptance: 'pending-independent-visual-review-and-project-gates',
            limitations: ['Unselected native cases remain skipped', '200% composition coverage is text-resize simulation, not browser page zoom',
              'No assistive-technology, complete Runtime/family or all-CI acceptance'] };
          fs.writeFileSync(path.join(root, 'receipt.json'), JSON.stringify(receipt, null, 2) + '\n');
          console.log(JSON.stringify({ captureIntegrity: receipt.captureIntegrity, suites, failures }, null, 2));
          if (failures.length) process.exitCode = 1;
          JS
      - name: Preserve all images, actual source bindings, selected results and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-preview-fit-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/homepage-preview-fit
          if-no-files-found: error
          retention-days: 30

name: Homepage visual evidence

on:
  pull_request:
    paths:
      - '.github/workflows/homepage-visual-evidence.yml'
      - 'apps/www/**'
      - 'packages/adapters/**'
      - 'packages/prototypes/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

# Public homepage only; no secrets, deployment, repository writes or privileged
# PR context. Artifacts are review evidence, not a new branch-protection gate.
permissions:
  contents: read

concurrency:
  group: homepage-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASELINE_SHA: 1fd4c08a067a8322295c78b2b708d2b4cbc01304
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact candidate (not the synthetic PR merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Check out immutable before revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the official Ubuntu CJK font package for both revisions
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/homepage-evidence"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          {
            dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk fontconfig
            fc-match -f '%{family}\n%{file}\n' 'sans-serif:lang=zh-cn'
          } | tee "$RUNNER_TEMP/homepage-evidence/font-environment.txt"
      - name: Install locked dependencies in both isolated worktrees
        id: install
        timeout-minutes: 5
        run: |
          corepack enable
          for worktree in baseline candidate; do
            (cd "$worktree" && corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts)
          done
      - name: Disable only the developer toolbar through Astro project preferences
        timeout-minutes: 2
        run: |
          set -euo pipefail
          {
            echo 'Renderer: supported Astro dev server; same project-local devToolbar preference on baseline and candidate'
            for worktree in baseline candidate; do
              echo "Checkout: $worktree"
              (
                cd "$worktree"
                corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
                corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
              )
            done
          } | tee "$RUNNER_TEMP/homepage-evidence/renderer-environment.txt"
          echo 'PROTO_UI_EVIDENCE_TOOLBAR=disabled-by-project-preference' >> "$GITHUB_ENV"
      - name: Locate runner-provided Chrome
        id: chrome
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser) || {
            echo 'BLOCKED: runner has no Chrome/Chromium executable'; exit 1;
          }
          "$CHROME" --version | tee "$RUNNER_TEMP/homepage-evidence/browser-environment.txt"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Test evidence provenance and acceptance predicates
        working-directory: candidate
        run: node --import tsx --test apps/www/scripts/homepage-evidence-contract.test.ts scripts/test/projection-scope-evidence.test.mjs scripts/test/run-runtime-tests.test.mjs
      - name: Capture real baseline with the candidate-owned browser probe
        id: baseline_capture
        # Historical behavior may fail: preserve its red trace, then require
        # the complete before-image inventory in the independent step below.
        continue-on-error: true
        if: always() && !cancelled() && steps.install.outcome == 'success' && steps.chrome.outcome == 'success'
        timeout-minutes: 10
        working-directory: baseline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/homepage-evidence"
          timeout --signal=TERM --kill-after=10s 540s \
            node --import tsx "$GITHUB_WORKSPACE/candidate/apps/www/scripts/capture-homepage-evidence.ts" \
            --revision-kind baseline --expected-revision "$BASELINE_SHA" \
            --out "$RUNNER_TEMP/homepage-evidence/baseline" \
            2>&1 | tee "$RUNNER_TEMP/homepage-evidence/baseline.log"
      - name: Validate the complete immutable baseline visual inventory
        id: baseline_visual_inventory
        if: always() && !cancelled() && steps.install.outcome == 'success' && steps.chrome.outcome == 'success'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const root = path.join(process.env.RUNNER_TEMP, 'homepage-evidence/baseline');
          const report = JSON.parse(fs.readFileSync(path.join(root, 'metrics.json'), 'utf8'));
          assert.equal(report.revisionKind, 'baseline');
          assert.equal(report.revision, process.env.BASELINE_SHA);
          assert.equal(report.cases.length, 20, 'All configured before views must exist');
          assert.equal(new Set(report.cases.map((entry) => entry.id)).size, 20);
          const failed = report.cases.filter((entry) => entry.outcome !== 'passed');
          assert.equal(report.failures.length, failed.length, 'No unclassified top-level failures');
          for (const entry of failed) {
            assert.equal(entry.failureClassification, 'baseline-react-select-home-focus', `${entry.id}: unexpected baseline failure`);
            assert.equal(entry.failureStage, 'keyboard-home');
            assert.equal(entry.errorName, 'TimeoutError');
            console.log(`Known negative control ${entry.id}: ${entry.error}`);
          }
          for (const entry of report.cases) {
            assert.equal(entry.pageErrors?.length ?? 0, 0, `${entry.id}: unexpected page exception`);
            const filename = `${entry.id}-initial-viewport.png`;
            assert.match(filename, /^[a-z0-9-]+\.png$/);
            assert.ok(entry.screenshots.includes(filename), filename);
            const bytes = fs.readFileSync(path.join(root, filename));
            assert.equal(bytes.subarray(0, 8).toString('hex'), '89504e470d0a1a0a', filename);
            assert.ok(bytes.length > 1000, filename);
          }
          console.log(`20 exact-baseline initial screenshots verified; ${report.failures.length} historical behavior failures remain recorded in metrics.json.`);
          JS
      - name: Make baseline evidence available before candidate execution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-baseline-${{ env.BASELINE_SHA }}-probe-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/homepage-evidence/baseline
            ${{ runner.temp }}/homepage-evidence/baseline.log
            ${{ runner.temp }}/homepage-evidence/*-environment.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Capture real exact-head candidate with the same browser probe
        if: always() && !cancelled() && steps.install.outcome == 'success' && steps.chrome.outcome == 'success'
        timeout-minutes: 10
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/homepage-evidence"
          timeout --signal=TERM --kill-after=10s 540s \
            node --import tsx apps/www/scripts/capture-homepage-evidence.ts \
            --revision-kind candidate --expected-revision "$CANDIDATE_SHA" \
            --out "$RUNNER_TEMP/homepage-evidence/candidate" \
            2>&1 | tee "$RUNNER_TEMP/homepage-evidence/candidate.log"
      - name: Make candidate images available before the regression suites finish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-candidate-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/homepage-evidence/candidate
            ${{ runner.temp }}/homepage-evidence/candidate.log
            ${{ runner.temp }}/homepage-evidence/*-environment.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Retain small candidate frame and metadata bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-candidate-frames-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/homepage-evidence/candidate/*-initial-viewport.png
            ${{ runner.temp }}/homepage-evidence/candidate/*-initial-full.png
            ${{ runner.temp }}/homepage-evidence/candidate/*-navigation-open-viewport.png
            ${{ runner.temp }}/homepage-evidence/candidate/*brutalist-*-viewport.png
            ${{ runner.temp }}/homepage-evidence/candidate/*-failure-viewport.png
            ${{ runner.temp }}/homepage-evidence/candidate/reference-*.png
            ${{ runner.temp }}/homepage-evidence/candidate/*.json
            ${{ runner.temp }}/homepage-evidence/candidate.log
          if-no-files-found: warn
          retention-days: 30
      - name: Execute focused real-browser regressions on the exact candidate
        if: always() && !cancelled() && steps.install.outcome == 'success' && steps.chrome.outcome == 'success'
        timeout-minutes: 12
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/homepage-evidence"
          suites=(
            apps/www/src/content/docs/zh-cn/homepage-dogfood.browser.test.ts
            apps/www/src/content/docs/zh-cn/home-demo-runtime.browser.test.ts
            apps/www/src/content/docs/zh-cn/prototype-projection-scope.browser.test.ts
            apps/www/src/content/docs/zh-cn/demo-brutalist-checkbox.browser.test.ts
            apps/www/src/content/docs/zh-cn/demo-brutalist-remaining.browser.test.ts
          )
          for suite in "${suites[@]}"; do test -f "$suite"; done
          {
            git rev-parse HEAD
            printf 'Selected suite: %s\n' "${suites[@]}"
            timeout --signal=TERM --kill-after=10s 600s \
              corepack pnpm@10.32.1 exec vitest run --no-file-parallelism "${suites[@]}"
          } 2>&1 | tee "$RUNNER_TEMP/homepage-evidence/browser-regressions.log"
      - name: Verify built production Search with real Pagefind
        if: always() && !cancelled() && steps.install.outcome == 'success' && steps.chrome.outcome == 'success'
        timeout-minutes: 10
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/homepage-evidence"
          node --test apps/www/scripts/run-search-production-evidence.test.mjs
          # The runner's single deadline includes build, readiness, exactly
          # two real-production cases, and cleanup of its own process groups.
          node apps/www/scripts/run-search-production-evidence.mjs \
            2>&1 | tee "$RUNNER_TEMP/homepage-evidence/search-production.log"
      - name: Preserve the small production Search evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-search-production-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/homepage-evidence/search-production
            ${{ runner.temp }}/homepage-evidence/search-production.log
          if-no-files-found: warn
          retention-days: 30
      - name: Retain actual images, measurements and failure output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-evidence-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/homepage-evidence
          if-no-files-found: warn
          retention-days: 30

  isolated-controls:
    # Each suite gets a fresh process/server lifetime and its own bounded result.
    # A failed native-link journey cannot consume Copy's execution budget.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: native-links
            suite: site-native-links
          - name: code-surfaces
            suite: code-surfaces
          - name: code-surface-grammar
            suite: code-surface-grammar
          - name: copy-commands
            suite: site-copy-commands
          - name: runtime-box
            suite: runtime-preview-surface
            contract: runtime-preview-evidence
          - name: search-commands
            suite: site-search-commands
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies and the same official font package
        timeout-minutes: 5
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Select runner Chrome and the supported toolbar preference
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/homepage-evidence"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --version | tee "$RUNNER_TEMP/homepage-evidence/browser-environment.txt"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
          echo 'PROTO_UI_EVIDENCE_TOOLBAR=disabled-by-project-preference' >> "$GITHUB_ENV"
      - name: Execute the exact isolated browser suite
        timeout-minutes: 12
        env:
          SUITE: ${{ matrix.suite }}
          CONTRACT: ${{ matrix.contract }}
          PROTO_UI_CODE_EVIDENCE_DIR: ${{ runner.temp }}/homepage-evidence/code-surfaces
        run: |
          set -euo pipefail
          FILE="apps/www/src/content/docs/zh-cn/${SUITE}.browser.test.ts"
          test -f "$FILE"
          files=("$FILE")
          if [[ -n "$CONTRACT" ]]; then
            CONTRACT_FILE="apps/www/src/content/docs/zh-cn/${CONTRACT}.test.ts"
            test -f "$CONTRACT_FILE"
            files+=("$CONTRACT_FILE")
          fi
          {
            git rev-parse HEAD
            echo "Selected suite: $FILE"
            timeout --signal=TERM --kill-after=10s 600s \
              corepack pnpm@10.32.1 exec vitest run --no-file-parallelism "${files[@]}"
          } 2>&1 | tee "$RUNNER_TEMP/homepage-evidence/isolated-regressions.log"
      - name: Preserve this suite's actual images, measurements and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-${{ matrix.name }}-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/homepage-evidence
          if-no-files-found: warn
          retention-days: 30

  mobile-navigation-reading:
    # Additive exact-source evidence for the mobile interaction increment.
    # Keep the older homepage comparison and all existing acceptance budgets.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MOBILE_BASELINE_SHA: ec6e5710d0aaeee6d5844f9c996c1d7ca594aa31
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MOBILE_BASELINE_SHA }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare the same official browser and fonts for both revisions
        timeout-minutes: 5
        run: |
          set -euo pipefail
          corepack enable
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          mkdir -p "$RUNNER_TEMP/mobile-interaction"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --version | tee "$RUNNER_TEMP/mobile-interaction/browser.txt"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          for worktree in baseline candidate; do
            (
              cd "$worktree"
              corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
              corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
            )
          done
      - name: Capture the first normal-size 390px before view
        if: ${{ !cancelled() }}
        working-directory: baseline
        timeout-minutes: 2
        run: |
          node --import tsx "$GITHUB_WORKSPACE/candidate/apps/www/scripts/capture-mobile-interaction-evidence.ts" \
            --revision-kind baseline --expected-revision "$MOBILE_BASELINE_SHA" --quick-preview \
            --out "$RUNNER_TEMP/mobile-interaction/first-pair/baseline"
      - name: Capture the first normal-size 390px after view
        if: ${{ !cancelled() }}
        working-directory: candidate
        timeout-minutes: 2
        run: |
          node --import tsx apps/www/scripts/capture-mobile-interaction-evidence.ts \
            --revision-kind candidate --expected-revision "$CANDIDATE_SHA" --quick-preview \
            --out "$RUNNER_TEMP/mobile-interaction/first-pair/candidate"
      - name: Publish the first actual pair before the full interaction matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-first-pair-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mobile-interaction/first-pair
          if-no-files-found: warn
          retention-days: 30
      - name: Capture the exact pre-change mobile experience
        if: ${{ !cancelled() }}
        working-directory: baseline
        timeout-minutes: 6
        run: |
          set -euo pipefail
          node --import tsx "$GITHUB_WORKSPACE/candidate/apps/www/scripts/capture-mobile-interaction-evidence.ts" \
            --revision-kind baseline --expected-revision "$MOBILE_BASELINE_SHA" \
            --out "$RUNNER_TEMP/mobile-interaction/baseline" \
            2>&1 | tee "$RUNNER_TEMP/mobile-interaction/baseline.log"
      - name: Retain the pre-change mobile pictures before candidate validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-before-${{ env.MOBILE_BASELINE_SHA }}-probe-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mobile-interaction/baseline
          if-no-files-found: warn
          retention-days: 30
      - name: Capture and regress the exact candidate mobile interactions
        if: ${{ !cancelled() }}
        working-directory: candidate
        timeout-minutes: 6
        run: |
          set -euo pipefail
          node --import tsx apps/www/scripts/capture-mobile-interaction-evidence.ts \
            --revision-kind candidate --expected-revision "$CANDIDATE_SHA" \
            --out "$RUNNER_TEMP/mobile-interaction/candidate" \
            2>&1 | tee "$RUNNER_TEMP/mobile-interaction/candidate.log"
      - name: Preserve before/after mobile screenshots and all failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-interaction-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-interaction
          if-no-files-found: error
          retention-days: 30

  visual-density:
    # Consumer-only scale/sidebar/Copy comparison, isolated from the existing gates.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DENSITY_BASELINE_SHA: ec6e5710d0aaeee6d5844f9c996c1d7ca594aa31
      DENSITY_FOLLOWUP_BASELINE_SHA: fbd90df092369e6d2aab73c66848f4236ba83a29
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DENSITY_BASELINE_SHA }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DENSITY_FOLLOWUP_BASELINE_SHA }}
          path: followup-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare locked sources and the same official browser/font environment
        timeout-minutes: 5
        run: |
          set -euo pipefail
          corepack enable
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          mkdir -p "$RUNNER_TEMP/visual-density"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --version | tee "$RUNNER_TEMP/visual-density/browser.txt"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          for worktree in baseline followup-baseline candidate; do
            (
              cd "$worktree"
              corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
              corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
            )
          done
      - name: Capture the first same-page sidebar before view
        if: ${{ !cancelled() }}
        working-directory: followup-baseline
        timeout-minutes: 3
        run: |
          node --import tsx "$GITHUB_WORKSPACE/candidate/apps/www/scripts/capture-visual-density-evidence.ts" \
            --revision-kind baseline --expected-revision "$DENSITY_FOLLOWUP_BASELINE_SHA" --quick-preview \
            --out "$RUNNER_TEMP/visual-density/first-pair/baseline"
      - name: Capture the first same-page sidebar after view
        if: ${{ !cancelled() }}
        working-directory: candidate
        timeout-minutes: 3
        run: |
          node --import tsx apps/www/scripts/capture-visual-density-evidence.ts \
            --revision-kind candidate --expected-revision "$CANDIDATE_SHA" --quick-preview \
            --out "$RUNNER_TEMP/visual-density/first-pair/candidate"
      - name: Retain the first real sidebar pair before the full matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: density-first-pair-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/visual-density/first-pair
          if-no-files-found: warn
          retention-days: 30
      - name: Capture the complete pre-change homepage and sidebar matrix
        if: ${{ !cancelled() }}
        working-directory: baseline
        timeout-minutes: 6
        run: |
          node --import tsx "$GITHUB_WORKSPACE/candidate/apps/www/scripts/capture-visual-density-evidence.ts" \
            --revision-kind baseline --expected-revision "$DENSITY_BASELINE_SHA" \
            --out "$RUNNER_TEMP/visual-density/baseline"
      - name: Capture and verify actual candidate Text and Surface leaves
        if: ${{ !cancelled() }}
        working-directory: candidate
        timeout-minutes: 6
        run: |
          node --import tsx apps/www/scripts/capture-visual-density-evidence.ts \
            --revision-kind candidate --expected-revision "$CANDIDATE_SHA" \
            --out "$RUNNER_TEMP/visual-density/candidate"
      - name: Preserve all scale frames, provenance and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-density-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/visual-density
          if-no-files-found: warn
          retention-days: 30

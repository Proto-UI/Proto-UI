name: Intranet preview checks

on:
  pull_request:
    paths:
      - .github/workflows/intranet-preview-*.yml
      - scripts/preview/**
  push:
    branches: [main]
    paths:
      - .github/workflows/intranet-preview-*.yml
      - scripts/preview/**

permissions:
  contents: read

concurrency:
  group: intranet-preview-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check preview admission, extraction and publication behavior
        run: node --test scripts/preview/*.test.mjs

name: Ordinary compiler WC native browser evidence
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: compiler-wc-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  ordinary-native-browser:
    # This job requires unprivileged user/network namespaces. Ubuntu 24.04's
    # AppArmor policy denies uid_map for this launcher. Keep the supported 22.04
    # image for this isolated lane; migrate before its 2027-04-17 retirement.
    # The ordinary CI image and host security policy are unchanged.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check required runner isolation before installing dependencies
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/compiler-wc-native"
          mkdir -p "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git rev-parse HEAD > "$EVIDENCE/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/source-tree.txt"
          sha256sum pnpm-lock.yaml > "$EVIDENCE/lockfile.sha256"
          node --version > "$EVIDENCE/node-environment.txt"
          node scripts/test/wc-native-isolation.mjs "$EVIDENCE"
      - name: Install locked dependencies (networked installation stage only)
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version > "$RUNNER_TEMP/compiler-wc-native/browser-environment.txt"
      - name: Run ordinary WC journeys with loopback only and no credential environment
        timeout-minutes: 12
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/compiler-wc-native"
          TEST_HOME=$(mktemp -d "$RUNNER_TEMP/compiler-wc-native-home.XXXXXX")
          PARENT_USER_NS=$(readlink /proc/self/ns/user)
          PARENT_NET_NS=$(readlink /proc/self/ns/net)
          # A new unprivileged user/network namespace has no external interfaces/routes.
          # Fail closed if unavailable. Never sudo, modify runner firewall, or fallback
          # to an unrestricted test/browser process.
          unshare --user --map-current-user --net --keep-caps sh -c '
            set -eu
            test "$(id -u)" -ne 0
            ip link set lo up
            # Capabilities exist only for loopback setup in this new namespace.
            # Drop every set before the environment check and browser process.
            exec setpriv --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
              env -i PATH="$1" HOME="$2" CI=1 NODE_ENV=test \
              CHROME_PATH="$3" CANDIDATE_SHA="$4" \
              COMPILER_WC_NATIVE_EVIDENCE_DIR="$5/browser" \
              GITHUB_RUN_ID="$6" GITHUB_RUN_ATTEMPT="$7" \
              node scripts/test/wc-native-isolation.mjs "$5" --run-native "$8" "$9"
          ' sh "$PATH" "$TEST_HOME" "$CHROME_PATH" "$CANDIDATE_SHA" "$EVIDENCE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PARENT_USER_NS" "$PARENT_NET_NS" \
            2>&1 | tee "$EVIDENCE/browser.log"
          node --input-type=module - "$EVIDENCE/browser-vitest.json" <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const result=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          assert.equal(result.numTotalTests,12,'All light/shadow ordinary-native journeys must run.');
          assert.equal(result.numPassedTests,12);
          assert.equal(result.numFailedTests,0);
          assert.equal(result.numPendingTests,0);
          assert.equal(result.success,true);
          JS
      - name: Retain head-bound native-only pages, artifacts, screenshots, traces and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-wc-native-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compiler-wc-native
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false

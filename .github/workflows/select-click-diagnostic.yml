name: Select public page click diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/select-click-diagnostic.yml'
      - 'apps/www/scripts/diagnose-select-click.ts'
      - 'apps/www/scripts/capture-transition-frames.ts'
      - 'apps/www/src/content/docs/zh-cn/select-click-diagnostic.test.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: select-click-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        observer: ['on', 'off']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
      - name: Diagnose the same native Select click with isolated recorder observation
        env:
          PUI_SELECT_OBSERVER: ${{ matrix.observer }}
          PUI_SELECT_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/select-click-diagnostic
        run: |
          set -euo pipefail
          mkdir -p "$PUI_SELECT_DIAGNOSTIC_OUTPUT"
          node --import tsx apps/www/scripts/diagnose-select-click.ts 2>&1 | tee "$PUI_SELECT_DIAGNOSTIC_OUTPUT/diagnostic.log"
      - name: Preserve diagnostic inputs, failures and debugger stacks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: select-click-diagnostic-${{ matrix.observer }}-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/select-click-diagnostic
          if-no-files-found: warn
          retention-days: 30

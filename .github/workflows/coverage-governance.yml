name: Coverage governance drift

on:
  # Candidate snapshot data is reconciled before merge with the same read-only
  # GitHub permissions. This is ordinary PR CI, not unforgeable attestation:
  # changes to this workflow or its checker still need independent source review.
  pull_request:
    paths:
      - .github/workflows/coverage-governance.yml
      - internal/coverage-matrices/**
      - internal/website/self-hosting-coverage-matrix.md
      - internal/agent-harness/dogfood-coverage-matrix.md
      - scripts/coverage-matrices/**
      - packages/spec/schema/**
      - '**/package.json'
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .prettier*
  issues:
    types:
      [
        opened,
        edited,
        closed,
        reopened,
        assigned,
        unassigned,
        labeled,
        unlabeled,
        milestoned,
        demilestoned,
      ]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Compare retained dependency governance with GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/coverage-matrices/sync-github-governance-snapshot.mjs --check

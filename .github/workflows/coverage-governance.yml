name: Coverage governance drift

on:
  # Candidate snapshot data is reconciled before merge with the same read-only
  # GitHub permissions. This check runs inside the central ci.yml lane on every
  # pull request and every scheduled regression cycle (reusable call), so it
  # keeps its automatic enforcement without its own trigger set; manual
  # dispatch stays available for targeted diagnosis. It is ordinary CI
  # evidence, not unforgeable attestation: changes to this workflow or its
  # checker still need independent source review.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Compare retained dependency governance with GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/coverage-matrices/sync-github-governance-snapshot.mjs --check

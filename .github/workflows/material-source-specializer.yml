name: Material source specialization
on:
  pull_request:
    paths:
      - 'experiments/material-specializer/**'
      - 'packages/**'
      - 'scripts/build/**'
      - 'apps/www/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/material-source-specializer.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/material-specializer/**'
      - 'packages/**'
      - 'scripts/build/**'
      - 'apps/www/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/material-source-specializer.yml'
permissions:
  contents: read
jobs:
  source-and-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install repository-locked test tools
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
      - name: Check source generation, exact modules and Base state ownership
        run: |
          git rev-parse HEAD
          node --version
          node --import tsx --test experiments/material-specializer/source.test.mjs
          node --test experiments/material-specializer/tree-shake.test.mjs
          corepack pnpm@10.32.1 exec vitest run packages/modules/feedback/test packages/modules/rule-expose-state-web/test packages/adapters/web-component/test/material-feedback.integration.test.ts

      - name: Build isolated real Prototype material fixture
        run: |
          corepack pnpm@10.32.1 --filter @proto.ui/cli build
          node --import tsx experiments/material-specializer/build-browser.mjs /tmp/pui-material-browser
      - name: Run approved fixed-source owned-content browser evidence
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          CHROME_PATH="$CHROME" node experiments/material-specializer/browser.test.mjs /tmp/pui-material-browser /tmp/pui-material-evidence
      - name: Preserve early source visual comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-visual-ab-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/pui-material-evidence/
            /tmp/pui-material-browser/source.json
            /tmp/pui-material-browser/LICENSE
            /tmp/pui-material-browser/NOTICE
      - name: Build and verify actual package artifact consumer
        run: |
          corepack pnpm@10.32.1 build:packages --package @proto.ui/adapter-web-component --package @proto.ui/prototypes-base
          corepack pnpm@10.32.1 check:package-manifests
          node --import tsx experiments/material-specializer/build-browser.mjs /tmp/pui-material-packed --packed
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          CHROME_PATH="$CHROME" node experiments/material-specializer/browser.test.mjs /tmp/pui-material-packed /tmp/pui-material-packed-evidence
      - name: Preserve source-bound captures and test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-owned-material-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/pui-material-evidence/
            /tmp/pui-material-browser/source.json
            /tmp/pui-material-browser/LICENSE
            /tmp/pui-material-browser/NOTICE
            /tmp/pui-material-packed/source.json
            /tmp/pui-material-packed/package-inputs.json
            /tmp/pui-material-packed-evidence/

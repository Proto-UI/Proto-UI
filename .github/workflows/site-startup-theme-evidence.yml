name: Website startup and theme evidence
on:
  pull_request:
    paths:
      - '.github/workflows/site-startup-theme-evidence.yml'
      - 'apps/www/**'
      - 'packages/adapters/**'
      - 'packages/prototypes/**'
      - 'packages/modules/**'
      - 'packages/runtime/**'
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'packages/hooks/**'
      - 'packages/types/**'
      - 'scripts/styles/**'
      - 'scripts/build/**'
      - 'scripts/test/runtime-test-plan.mjs'
      - 'scripts/test/server-readiness*'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: 'Optional exact historical subject SHA for diagnostic capture; candidate/probe remain this ref'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: site-startup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASELINE_SHA: ${{ inputs.baseline_sha || '48b80f8b8b0b94dbac04919e3516bc6a1ed2c37c' }}
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        subject: [baseline, candidate]
    steps:
      - name: Require immutable subject identity
        run: '[[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.subject == 'baseline' && env.BASELINE_SHA || env.CANDIDATE_SHA }}
          path: subject
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies and CJK fonts
        working-directory: subject
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Build the actual production website
        working-directory: subject
        run: corepack pnpm@10.32.1 docs:build
      - name: Bind the same probe to both exact source revisions
        run: |
          mkdir -p "$RUNNER_TEMP/site-startup"
          # This complete relative-import closure is candidate-owned for both subjects.
          for PROBE in \
            apps/www/src/content/docs/zh-cn/site-startup-theme.browser.test.ts \
            apps/www/src/content/docs/zh-cn/browser-harness.ts \
            scripts/test/server-readiness.mjs; do
            cp "candidate/$PROBE" "subject/$PROBE"
            sha256sum "subject/$PROBE" >> "$RUNNER_TEMP/site-startup/probe-sha256.txt"
          done
          git -C subject rev-parse HEAD > "$RUNNER_TEMP/site-startup/subject-sha.txt"
          git -C candidate rev-parse HEAD > "$RUNNER_TEMP/site-startup/probe-sha.txt"
          python3 -m http.server 4356 --bind 127.0.0.1 --directory subject/apps/www/dist > "$RUNNER_TEMP/site-startup/server.log" 2>&1 &
      - name: Capture production cold-load, theme and Select journeys
        working-directory: subject
        env:
          PROTO_UI_BROWSER_BASE_URL: http://127.0.0.1:4356
          PROTO_UI_STARTUP_SUBJECT: ${{ matrix.subject }}
          PROTO_UI_STARTUP_EVIDENCE_DIR: ${{ runner.temp }}/site-startup
        run: corepack pnpm@10.32.1 exec vitest run apps/www/src/content/docs/zh-cn/site-startup-theme.browser.test.ts --no-file-parallelism
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-startup-${{ matrix.subject }}-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site-startup
          retention-days: 30
          if-no-files-found: warn

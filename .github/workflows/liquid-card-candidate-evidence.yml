name: Liquid Card candidate producer evidence
on:
  pull_request:
    paths:
      - '.github/workflows/liquid-card-candidate-evidence.yml'
      - 'apps/www/src/components/**'
      - 'apps/www/src/pages/**/test/liquid-library-card.astro'
      - 'apps/www/src/content/docs/zh-cn/library-liquid-card-producer.browser.test.ts'
      - 'apps/www/src/content/docs/zh-cn/library-liquid-card-observation.ts'
      - 'apps/www/src/content/docs/zh-cn/library-no-script-interaction.ts'
      - 'apps/www/src/content/docs/zh-cn/library-card*.ts'
      - 'apps/www/src/content/docs/zh-cn/browser-harness.ts'
      - 'apps/www/src/styles/**'
      - 'apps/www/astro.config.mjs'
      - 'apps/www/package.json'
      - 'experiments/material-initial-paint/media-session.ts'
      - 'scripts/release/test/liquid-card-candidate-workflow.test.mjs'
      - 'scripts/test/liquid-card-observation.test.mjs'
      - 'scripts/test/no-script-interaction.test.mjs'
      - 'scripts/test/server-readiness.mjs'
      - '.npmrc'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vitest.config.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liquid-card-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  actual-card-producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked tools and record source
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/liquid-card"
          "$CHROME" --version > "$RUNNER_TEMP/liquid-card/browser-environment.txt"
          node --version > "$RUNNER_TEMP/liquid-card/node-environment.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/liquid-card/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/liquid-card/source-tree.txt"
      - name: Check producer source and workflow controls
        run: node --test scripts/release/test/liquid-card-candidate-workflow.test.mjs scripts/test/liquid-card-observation.test.mjs scripts/test/no-script-interaction.test.mjs
      - name: Install the same public CJK fallback as the Card gate
        timeout-minutes: 3
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk fontconfig > "$RUNNER_TEMP/liquid-card/font-environment.txt"
      - name: Disable the dev toolbar on the actual fixture
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          TOOLBAR_SETTING=$(NO_COLOR=1 corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled)
          grep -Eq '^◉ devToolbar\.enabled is set to[[:space:]]+false[[:space:]]*$' <<< "$TOOLBAR_SETTING"
      - name: Run original twelve Card cases and six response collector controls
        timeout-minutes: 20
        env:
          PUI_LIQUID_CARD_EVIDENCE_DIR: ${{ runner.temp }}/liquid-card/evidence
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 exec vitest run \
            apps/www/src/content/docs/zh-cn/library-liquid-card-producer.browser.test.ts \
            --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json \
            --outputFile="$RUNNER_TEMP/liquid-card/vitest.json" \
            2>&1 | tee "$RUNNER_TEMP/liquid-card/browser.log"
          node --input-type=module - "$RUNNER_TEMP/liquid-card/vitest.json" <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          assert.equal(report.numTotalTests, 18, 'All original twelve Card cases plus six independent response collector controls must run.');
          assert.equal(report.numPassedTests, 18);
          assert.equal(report.numFailedTests, 0);
          const expected = ["actual complete Liquid Card optical producer en-light-1440-text100", "actual complete Liquid Card optical producer en-light-320-text200", "actual complete Liquid Card optical producer en-dark-1440-text100", "actual complete Liquid Card optical producer en-dark-320-text200", "actual complete Liquid Card optical producer zh-cn-light-1440-text100", "actual complete Liquid Card optical producer zh-cn-light-320-text200", "actual complete Liquid Card optical producer zh-cn-dark-1440-text100", "actual complete Liquid Card optical producer zh-cn-dark-320-text200", "no-script native input controls scrolls a long no-script document and follows a real same-origin link", "no-script native input controls refuses a stable action hidden beneath a real fixed header", "candidate Card keeps its complete opaque no-JS fallback en 320px with 200% text", "candidate Card keeps its complete opaque no-JS fallback zh-cn 320px with 200% text", "same-origin response collector native controls success", "same-origin response collector native controls http-error", "same-origin response collector native controls request-abort", "same-origin response collector native controls missing-location", "same-origin response collector native controls invalid-location", "same-origin response collector native controls unknown-status"];
          const rows = report.testResults.flatMap(file => file.assertionResults);
          assert.deepEqual(rows.map(row => row.fullName).sort(), [...expected].sort());
          assert.ok(rows.every(row => row.status === 'passed'));
          JS
      - name: Retain exact-head raw Cards, renderer receipts and original failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-card-candidate-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/liquid-card
          if-no-files-found: error
          retention-days: 30

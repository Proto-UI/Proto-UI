name: Bounded Search intent same-tree A/B

on:
  pull_request:
    paths:
      - '.github/workflows/search-intent-ab.yml'
      - 'scripts/test/search-intent-ab*.mjs'
      - 'scripts/test/search-intent-index*.mjs'
      - 'apps/www/src/components/override/Search.astro'
      - 'apps/www/src/components/site-search-commands.ts'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: search-intent-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    # Temporary candidate diagnostic, not a replacement for current Search CI.
    # Keep the original 1000 ms opener acceptance and main browser suite intact.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/search-intent-module-preparation')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: baseline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe negative controls (no browser)
        run: node --test candidate/scripts/test/search-intent-ab.test.mjs candidate/scripts/test/search-intent-index.test.mjs
      - name: Prepare the same-tree counterfactual
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/search-intent-ab"
          for source in \
            apps/www/src/components/override/Search.astro \
            apps/www/src/components/site-search-commands.ts; do
            git -C baseline show "4a2320762ba5f4319dec1915ca4e138772dceb0c:$source" > "baseline/$source"
          done
          node --input-type=module - <<'JS'
          import { sourceBoundary } from './candidate/scripts/test/search-intent-ab.mjs';
          import { writeFile } from 'node:fs/promises';
          const boundary = await sourceBoundary('baseline', 'candidate', process.env.CANDIDATE_SHA);
          await writeFile(process.env.RUNNER_TEMP + '/search-intent-ab/source-before-build.json', JSON.stringify(boundary, null, 2));
          JS
      - name: Two locked production builds, serial
        timeout-minutes: 20
        run: |
          set -euo pipefail
          corepack enable
          for source in baseline candidate; do
            (
              cd "$source"
              corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
              corepack pnpm@10.32.1 --filter apps-www build
              test -f apps/www/dist/pagefind/pagefind.js
            ) 2>&1 | tee "$RUNNER_TEMP/search-intent-ab/build-$source.log"
          done
      - name: Fixed browser, interleaved samples, no rerun
        timeout-minutes: 12
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME_PATH="$CHROME"
          "$CHROME" --version | tee "$RUNNER_TEMP/search-intent-ab/browser.txt"
          timeout --signal=TERM --kill-after=15s 660s node candidate/scripts/test/search-intent-ab.mjs \
            "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/search-intent-ab" \
            2>&1 | tee "$RUNNER_TEMP/search-intent-ab/run.log"
      - name: Retain failures and successes for exact-head review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-intent-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/search-intent-ab
          if-no-files-found: error
          retention-days: 14

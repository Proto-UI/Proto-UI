name: Whitepaper diagram evidence

on:
  pull_request:
    paths:
      - '.github/workflows/whitepaper-diagram-evidence.yml'
      - 'apps/www/scripts/capture-whitepaper-diagram-evidence.mjs'
      - 'apps/www/scripts/generate-whitepaper-diagrams.mjs'
      - 'apps/www/scripts/whitepaper-diagram-fonts.json'
      - 'apps/www/public/diagrams/**'
      - 'apps/www/src/content/docs/*/whitepaper/**'
      - 'apps/www/src/styles/markdown.css'
      - 'pnpm-lock.yaml'

# Exact candidate, loopback-only built documentation. No secrets, deployments,
# repository writes, arbitrary URLs, login, or new branch-protection gate.
permissions:
  contents: read

concurrency:
  group: whitepaper-diagram-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      DIAGRAM_EVIDENCE_DIR: /tmp/whitepaper-diagram-evidence
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Identify browser and install public article font fallback
        run: |
          set -euo pipefail
          mkdir -p "$DIAGRAM_EVIDENCE_DIR"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          {
            git rev-parse HEAD
            node --version
            "$CHROME" --version
            dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk
          } | tee "$DIAGRAM_EVIDENCE_DIR/environment.txt"
      - name: Verify diagram source and build production documentation
        run: |
          set -o pipefail
          node --test scripts/docs/test/generated-whitepaper-diagrams.test.mjs
          corepack pnpm@10.32.1 --filter apps-www build 2>&1 | tee "$DIAGRAM_EVIDENCE_DIR/build.log"
      - name: Capture bilingual article and embedded-font evidence
        run: |
          set -o pipefail
          node apps/www/scripts/capture-whitepaper-diagram-evidence.mjs 2>&1 | tee "$DIAGRAM_EVIDENCE_DIR/browser.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whitepaper-diagram-evidence-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DIAGRAM_EVIDENCE_DIR }}
          retention-days: 14
          if-no-files-found: error

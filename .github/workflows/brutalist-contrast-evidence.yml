name: Brutalist contrast audit evidence

on:
  # The rendered source closure includes adapters, runtime, recipes, theme,
  # generated style inputs and docs composition. Avoid an incomplete allowlist.
  pull_request:

permissions:
  contents: read

concurrency:
  group: brutalist-contrast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  family-audit-evidence:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: binary-and-buttons
            families: button,toggle,switch,checkbox
          - shard: popup-boundaries
            families: dropdown-menu,select,dialog
          - shard: intent-and-tabs
            families: tooltip,hover-card,tabs
          - shard: passive-and-editors
            families: badge,card,skeleton,separator,spinner,textarea,scroll-area
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Disable the development toolbar before public-page evidence
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          TOOLBAR_SETTING=$(NO_COLOR=1 corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled)
          printf '%s\n' "$TOOLBAR_SETTING"
          grep -Eq '^◉ devToolbar\.enabled is set to[[:space:]]+false[[:space:]]*$' <<< "$TOOLBAR_SETTING"
      - name: Calibrate paint acceptance and bounded evidence storage
        run: |
          node --test apps/www/scripts/contrast-report-journal.test.mjs \
            apps/www/scripts/contrast-audit-plan.test.mjs \
            apps/www/scripts/contrast-anatomy.test.mjs \
            scripts/test/brutalist-contrast-toolbar.test.mjs
          corepack pnpm@10.32.1 exec vitest run \
            apps/www/src/content/docs/zh-cn/contrast-probe.browser.test.ts \
            --maxWorkers=1 --minWorkers=1
      - name: Observe exact-head ${{ matrix.shard }} in every page-declared Web runtime
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          PROTO_UI_CONTRAST_AUDIT: '1'
          PROTO_UI_CONTRAST_FAMILIES: ${{ matrix.families }}
          PROTO_UI_BROWSER_BASE_URL: http://127.0.0.1:4321
          PROTO_UI_CONTRAST_EVIDENCE_DIR: ${{ runner.temp }}/contrast-evidence/candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/contrast-evidence"
          corepack pnpm@10.32.1 --filter apps-www dev --host 127.0.0.1 --port 4321 \
            > "$RUNNER_TEMP/contrast-evidence/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 180); do
            if curl --silent --fail http://127.0.0.1:4321/__pui_contrast_provenance \
              > "$RUNNER_TEMP/contrast-evidence/server-provenance.json"; then
              READY=1
              break
            fi
            kill -0 "$SERVER_PID" || { cat "$RUNNER_TEMP/contrast-evidence/server.log"; exit 1; }
            sleep 1
          done
          test "$READY" = 1 || { cat "$RUNNER_TEMP/contrast-evidence/server.log"; exit 1; }
          corepack pnpm@10.32.1 exec tsx apps/www/scripts/audit-brutalist-contrast.mts
      - name: Retain public component captures, raw attempts and bound provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brutalist-contrast-${{ matrix.shard }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/contrast-evidence
          if-no-files-found: warn
          retention-days: 30

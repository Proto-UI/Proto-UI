name: Actual transition GIF source frames
on:
  pull_request:
    paths:
      - '.github/workflows/transition-gif-evidence.yml'
      - 'apps/www/scripts/capture-transition-frames.ts'
      - 'apps/www/src/content/docs/**'
      - 'apps/www/src/components/PrototypePreviewer/**'
      - 'apps/www/src/styles/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: transition-gif-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  actual-frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
      - name: Capture four bounded source-bound scenes at authored timings
        env:
          PUI_TRANSITION_OUTPUT: ${{ runner.temp }}/transition-frames
        run: |
          set -euo pipefail
          mkdir -p "$PUI_TRANSITION_OUTPUT"
          node --import tsx apps/www/scripts/capture-transition-frames.ts 2>&1 | tee "$PUI_TRANSITION_OUTPUT/capture.log"
      - name: Preserve actual frames, timestamps, acknowledgements and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transition-frames-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/transition-frames
          if-no-files-found: warn
          retention-days: 30

name: Shadcn Tabs text default style evidence
on:
  pull_request:
    paths:
      - 'packages/prototypes/shadcn/src/tabs/**'
      - 'packages/prototypes/shadcn/src/style-scope/**'
      - 'packages/prototypes/shadcn/test/tabs*.test.ts'
      - 'internal/fixtures/shadcn-tabs-style/**'
      - 'scripts/prototypes/shadcn-tabs-evidence*'
      - '.github/workflows/shadcn-tabs-style.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tabs-source-bound-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked existing dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
      - name: Test production scope projection
        run: node node_modules/vitest/vitest.mjs run packages/prototypes/shadcn/test/tabs-style-projection.test.ts packages/prototypes/shadcn/test/tabs.test.ts packages/prototypes/shadcn/test/style-scope.test.ts
      - name: Capture exact-head text default surface
        env:
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --import tsx scripts/prototypes/shadcn-tabs-evidence.mjs /tmp/pui-shadcn-tabs-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadcn-tabs-text-default-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/pui-shadcn-tabs-evidence/
          if-no-files-found: warn
          retention-days: 30

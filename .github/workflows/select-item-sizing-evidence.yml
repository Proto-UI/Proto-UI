name: Select website item sizing evidence
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: select-website-item-sizing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  styled-demo-eight:
    if: github.repository == 'Proto-UI/Proto-UI'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Bind checkout and execute the eight styled website cases
        env:
          PROTO_UI_SELECT_ITEM_SIZING_EVIDENCE: ${{ runner.temp }}/select-website-item-sizing
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$PROTO_UI_SELECT_ITEM_SIZING_EVIDENCE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD > "$PROTO_UI_SELECT_ITEM_SIZING_EVIDENCE/source-sha.txt"
          git rev-parse HEAD^{tree} > "$PROTO_UI_SELECT_ITEM_SIZING_EVIDENCE/source-tree.txt"
          sha256sum apps/www/src/content/docs/zh-cn/demo-shadcn-select.demo.ts apps/www/src/content/docs/zh-cn/demo-select-item-sizing.browser.test.ts scripts/test/runtime-test-plan.mjs > "$PROTO_UI_SELECT_ITEM_SIZING_EVIDENCE/input-sha256.txt"
          corepack pnpm@10.32.1 exec vitest run apps/www/src/content/docs/zh-cn/demo-select-item-sizing.browser.test.ts --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile.json="$PROTO_UI_SELECT_ITEM_SIZING_EVIDENCE/vitest.json" 2>&1 | tee "$PROTO_UI_SELECT_ITEM_SIZING_EVIDENCE/native.log"
          python3 - <<'PYCOUNT'
          import json, os
          from pathlib import Path
          root = Path(os.environ['PROTO_UI_SELECT_ITEM_SIZING_EVIDENCE'])
          report = json.loads((root / 'vitest.json').read_text())
          assert report['numTotalTests'] == report['numPassedTests'] == 8
          assert report['success'] and report['numFailedTests'] == report['numPendingTests'] == report['numTodoTests'] == 0
          source = json.loads((root / 'source.json').read_text())
          assert source['source'] == os.environ['EXPECTED_HEAD']
          for locale in ['en', 'zh-cn']:
              for runtime in ['wc', 'react', 'vue', 'vue2']:
                  case = json.loads((root / f'{locale}-{runtime}.json').read_text())
                  assert case['source'] == source['source'] and case['sourceTree'] == source['sourceTree']
                  assert case['runtime'] == runtime and case['locale'] == locale
                  assert [o['phase'] for o in case['observations']] == ['first-entry', 'selected-reopen', 'narrow-reopen']
                  assert all(o['value']['runtime'] == runtime for o in case['observations'])
                  assert (root / f'{locale}-{runtime}-first.png').is_file()
                  assert (root / f'{locale}-{runtime}-narrow.png').is_file()
          PYCOUNT
      - name: Retain source-bound results, four-box facts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: select-website-item-sizing-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/select-website-item-sizing
          if-no-files-found: warn
          retention-days: 30

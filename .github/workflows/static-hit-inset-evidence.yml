name: Static hit inset native evidence
on:
  pull_request:
    paths:
      - '.github/workflows/static-hit-inset-evidence.yml'
      - 'scripts/analysis/static-hit-inset-browser.mjs'
      - 'scripts/analysis/fixtures/static-hit-inset.ts'
      - 'scripts/analysis/self-hit-region-browser.mjs'
      - 'scripts/analysis/fixtures/self-hit-region.mjs'
      - 'packages/core/**'
      - 'packages/types/**'
      - 'packages/hooks/**'
      - 'packages/modules/**'
      - 'packages/runtime/**'
      - 'packages/adapters/**'
      - 'packages/prototypes/base/src/switch/**'
      - 'packages/prototypes/base/src/label/**'
      - 'packages/prototypes/shadcn/src/switch/**'
      - 'packages/cli/src/**'
      - 'spec/contracts/C-HIT-PARTICIPATION-0001.yaml'
      - 'spec/host-caps/HC-HIT-PARTICIPATION-0001.yaml'
      - 'spec/modules/M-HIT-PARTICIPATION-0001.yaml'
      - 'spec/tests/T-HIT-INSET-0001.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: static-hit-inset-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  browser-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies and record the exact source
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/static-hit-inset"
          git rev-parse HEAD > "$RUNNER_TEMP/static-hit-inset/head.txt"
          test "$(cat "$RUNNER_TEMP/static-hit-inset/head.txt")" = "$CANDIDATE_SHA"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/static-hit-inset/tree.txt"
          "$CHROME" --version > "$RUNNER_TEMP/static-hit-inset/browser.txt"
          node --version > "$RUNNER_TEMP/static-hit-inset/node.txt"
      - name: Exercise native geometry and same-root events
        env:
          STATIC_HIT_EVIDENCE_DIR: ${{ runner.temp }}/static-hit-inset
        run: |
          set -euo pipefail
          node scripts/analysis/static-hit-inset-browser.mjs 2>&1 | tee "$RUNNER_TEMP/static-hit-inset/browser.log"
      - name: Exercise runtime self-region acquire and release in four adapters
        env:
          STATIC_HIT_EVIDENCE_DIR: ${{ runner.temp }}/static-hit-inset
        run: |
          set -euo pipefail
          node scripts/analysis/self-hit-region-browser.mjs 2>&1 | tee "$RUNNER_TEMP/static-hit-inset/self-region-browser.log"
      - name: Retain source-bound results and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-hit-inset-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/static-hit-inset
          if-no-files-found: error
          retention-days: 30

        with:
          name: liquid-visible-refraction-diagnostic-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/liquid-visible-refraction-diagnostic
          if-no-files-found: warn
          retention-days: 30

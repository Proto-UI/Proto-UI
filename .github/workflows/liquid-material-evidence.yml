name: Liquid Glass material and library evidence
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: liquid-material-evidence-${{ github.ref }}
  cancel-in-progress: false
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  browser-evidence:
    runs-on: ubuntu-24.04
    # Material/library acceptance and 31 independent state-control cases run
    # sequentially, with separate complete manifests and retained failures.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Configure official evidence surface
        run: |
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences list
      - name: Source closure and real material/library evidence
        env:
          PROTO_UI_MATERIAL_EVIDENCE_DIR: ${{ runner.temp }}/liquid-material-evidence
          PUI_LIQUID_GLASS_INCLUDE_WIP: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p "$PROTO_UI_MATERIAL_EVIDENCE_DIR"
          node --test scripts/test/check-liquid-material-evidence.test.mjs
          node --test scripts/docs/test/liquid-toggle-mdx.test.mjs
          node scripts/build/generate-web-material-kernel.mjs --check
          corepack pnpm@10.32.1 check:styles:preset
          corepack pnpm@10.32.1 exec vitest run \
            packages/prototypes/liquid-glass/test/material.test.ts \
            packages/prototypes/liquid-glass/test/toggle.test.ts \
            packages/prototypes/liquid-glass/test/interactive-surface.test.ts \
            packages/prototypes/liquid-glass/test/accordion-material.test.ts \
            packages/prototypes/liquid-glass/test/collapsible-material.test.ts \
            packages/prototypes/liquid-glass/test/dropdown-material.test.ts \
            packages/prototypes/liquid-glass/test/select-material.test.ts \
            packages/adapters/base/test/portal-destination.test.ts \
            packages/adapters/base/test/portal-inline-size.test.ts \
            packages/adapters/base/test/web-material-program.test.ts \
            packages/adapters/base/test/web-material-image.test.ts \
            packages/adapters/base/test/web-material-preferences-ownership.test.ts \
            packages/adapters/base/test/web-material-preferences-sequence.test.ts \
            packages/adapters/base/test/web-material-style-tint.test.ts \
            packages/adapters/base/test/web-material-style-tint-source.test.ts \
            packages/adapters/base/test/web-material-style.test.ts \
            packages/adapters/base/test/web-material-source.test.ts \
            packages/adapters/base/test/web-material-sink.test.ts \
            apps/www/src/content/docs/zh-cn/material-paint-observation.test.ts \
            apps/www/src/content/docs/zh-cn/trace-category-admission.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-toggle-failure-diagnostics.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-toggle-snapshot.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-toggle-detail-metrics.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-toggle-detail-probe.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-hover-fixture.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-hover-capture.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-hover-plan.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-hover-source-layout.test.ts \
            apps/www/src/components/PrototypePreviewer/demo-renderer.hover-reenable.test.ts \
            apps/www/src/content/docs/zh-cn/demo-liquid-glass-material.browser.test.ts \
            apps/www/src/content/docs/zh-cn/demo-liquid-glass-portal.browser.test.ts \
            apps/www/src/content/docs/zh-cn/demo-liquid-glass-toggle.browser.test.ts \
            --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json \
            --outputFile.json="$PROTO_UI_MATERIAL_EVIDENCE_DIR/vitest.json"
      - name: Require actual material and lifecycle execution
        if: always()
        run: |
          node scripts/test/check-liquid-material-evidence.mjs \
            "$RUNNER_TEMP/liquid-material-evidence/vitest.json" material-library \
            "$RUNNER_TEMP/liquid-material-evidence/coverage.json"
      - name: Retain exact-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-material-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/liquid-material-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Run all eight Liquid parts through four real Web hosts
        if: ${{ !cancelled() }}
        id: state-controls
        env:
          PROTO_UI_LIQUID_CONTROLS_BROWSER_EVIDENCE: '1'
          PUI_LIQUID_GLASS_INCLUDE_WIP: '1'
          PROTO_UI_EXPECTED_HEAD_SHA: ${{ env.CANDIDATE_SHA }}
          PROTO_UI_LIQUID_CONTROLS_EVIDENCE_DIR: ${{ runner.temp }}/liquid-state-controls-evidence
        run: |
          corepack pnpm@10.32.1 exec vitest run \
            packages/prototypes/liquid-glass/test/draft-control-projections.test.ts \
            apps/www/src/content/docs/zh-cn/native-editor-evidence.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-state-controls-evidence.test.ts \
            apps/www/src/content/docs/zh-cn/demo-liquid-glass-state-controls.browser.test.ts \
            --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json \
            --outputFile.json="$PROTO_UI_LIQUID_CONTROLS_EVIDENCE_DIR/vitest.json"
      - name: Preserve the separate Liquid controls terminal result
        if: always()
        env:
          PROTO_UI_LIQUID_CONTROLS_EVIDENCE_DIR: ${{ runner.temp }}/liquid-state-controls-evidence
          EVIDENCE_STEP_STATUS: ${{ steps.state-controls.outcome }}
        run: |
          mkdir -p "$PROTO_UI_LIQUID_CONTROLS_EVIDENCE_DIR"
          node --input-type=module <<'JS'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { LIQUID_STATE_CONTROL_CASES, assessLiquidStateControls } from './apps/www/src/content/docs/zh-cn/liquid-state-controls-evidence.ts';
          const file = path.join(process.env.PROTO_UI_LIQUID_CONTROLS_EVIDENCE_DIR, 'manifest.json');
          const previous = existsSync(file) ? JSON.parse(readFileSync(file, 'utf8')) : {};
          const failures = [...(previous.pageErrors ?? [])];
          if (previous.startupError) failures.push(previous.startupError);
          if (previous.sourceSha !== process.env.CANDIDATE_SHA) failures.push('Measured source is not the candidate SHA.');
          if (process.env.EVIDENCE_STEP_STATUS !== 'success') failures.push('The selected suite did not complete successfully.');
          if (previous.status !== 'passed') failures.push('The suite did not retain a passed terminal result.');
          const terminal = assessLiquidStateControls(previous.results ?? [], failures);
          const result = {
            ...previous,
            expectedSha: process.env.CANDIDATE_SHA,
            stepStatus: process.env.EVIDENCE_STEP_STATUS,
            expectedCases: LIQUID_STATE_CONTROL_CASES,
            results: terminal.results,
            terminal,
            status: terminal.status,
            scope: 'Eight Liquid parts, four Web hosts, provider-free fallback and CDP composition. No optical, physical OS IME, Compiler or non-Web acceptance.',
          };
          writeFileSync(file, JSON.stringify(result, null, 2));
          if (result.status !== 'passed') throw new Error('The complete Liquid state-controls evidence is missing or failed.');
          JS
      - name: Retain Liquid controls screenshots and complete expected-case record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-state-controls-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/liquid-state-controls-evidence
          if-no-files-found: error
          retention-days: 30
  prominent-tint-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [wc, react, vue, vue2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Configure official evidence surface
        run: |
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences list
      - name: Main-command tint source closure and real component evidence
        env:
          PROTO_UI_MATERIAL_EVIDENCE_DIR: ${{ runner.temp }}/liquid-prominent-tint-evidence
          PROTO_UI_PROMINENT_TINT_RUNTIME: ${{ matrix.runtime }}
          # Liquid Glass prominent-tint cases are 0.4/WIP and register only under
          # this opt-in. The dedicated material-evidence lane runs them, so it must
          # opt in or the file is an empty suite and vitest fails.
          PUI_LIQUID_GLASS_INCLUDE_WIP: '1'
        run: |
          node scripts/build/generate-web-material-kernel.mjs --check
          corepack pnpm@10.32.1 check:styles:preset
          corepack pnpm@10.32.1 exec vitest run \
            packages/prototypes/liquid-glass/test/button.test.ts \
            packages/prototypes/liquid-glass/test/material.test.ts \
            packages/prototypes/liquid-glass/test/interactive-surface.test.ts \
            packages/prototypes/base/test/form-actions-material.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-prominent-tint-fixture.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-prominent-tint-test-harness.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-prominent-tint-metrics.test.ts \
            apps/www/src/content/docs/zh-cn/demo-liquid-glass-prominent-tint.browser.test.ts \
            --maxWorkers=1 --minWorkers=1
      - name: Retain exact-source prominent tint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-prominent-tint-${{ matrix.runtime }}-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/liquid-prominent-tint-evidence
          if-no-files-found: warn
          retention-days: 30

  hover-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [wc, react, vue, vue2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Configure official evidence surface
        run: |
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences list
      - name: Retain the complete runtime hover partition
        env:
          PROTO_UI_MATERIAL_EVIDENCE_DIR: ${{ runner.temp }}/liquid-material-evidence
          PROTO_UI_HOVER_RUNTIME: ${{ matrix.runtime }}
        run: |
          corepack pnpm@10.32.1 exec vitest run \
            apps/www/src/content/docs/zh-cn/demo-liquid-glass-hover.browser.test.ts \
            --maxWorkers=1 --minWorkers=1
      - name: Retain exact-source partial and completed hover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-hover-${{ matrix.runtime }}-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/liquid-material-evidence
          if-no-files-found: warn
          retention-days: 30

  tint-stage-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Configure official evidence surface
        run: |
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences list
      - name: Collect test-only tint stages and continuous-tone rejection evidence
        env:
          PROTO_UI_MATERIAL_EVIDENCE_DIR: ${{ runner.temp }}/liquid-tint-stage-diagnostic
        run: |
          node scripts/build/generate-web-material-kernel.mjs --check
          corepack pnpm@10.32.1 exec vitest run \
            apps/www/src/content/docs/zh-cn/liquid-tint-stage-diagnostic.test.ts \
            apps/www/src/content/docs/zh-cn/demo-liquid-tint-stage-diagnostic.browser.test.ts \
            --maxWorkers=1 --minWorkers=1
      - name: Retain diagnostic results without claiming material acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-tint-stage-diagnostic-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/liquid-tint-stage-diagnostic
          if-no-files-found: warn
          retention-days: 30

  visible-refraction-diagnostic:

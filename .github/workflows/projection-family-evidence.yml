name: Draft projection family evidence
on:
  pull_request:
    paths:
      - '.github/workflows/projection-family-evidence.yml'
      - 'packages/prototypes/bootstrap-2-3-2/**'
      - 'packages/prototypes/liquid-glass/**'
      - 'packages/cli/src/services/proto-style-css.ts'
      - 'packages/cli/src/generated/draft-family-style-tokens.ts'
      - 'apps/www/src/pages/en/test/new-projection-families.astro'
      - 'apps/www/src/content/docs/zh-cn/demo-new-projection-families.browser.test.ts'
permissions:
  contents: read
concurrency:
  group: draft-family-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Configure the official Astro evidence surface
        run: |
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences list
      - name: Check source tokens and real four-runtime fixture
        env:
          PROTO_UI_FAMILY_EVIDENCE_DIR: ${{ runner.temp }}/projection-family-evidence
        run: |
          corepack pnpm@10.32.1 check:styles:preset
          corepack pnpm@10.32.1 exec vitest run \
            packages/prototypes/bootstrap-2-3-2/test/button.test.ts \
            packages/prototypes/liquid-glass/test/button.test.ts \
            apps/www/src/content/docs/zh-cn/demo-new-projection-families.browser.test.ts \
            --maxWorkers=1 --minWorkers=1
      - name: Retain SHA-bound public fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projection-families-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/projection-family-evidence
          if-no-files-found: warn
          retention-days: 30

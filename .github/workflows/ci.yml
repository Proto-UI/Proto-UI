name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockstep-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify public package exact versions
        run: node scripts/release/check-lockstep.mjs

  public_package_plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      affected_count: ${{ steps.plan.outputs.affected_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        name: Plan affected public package graph
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            node scripts/build/public-packages.mjs --changed-from "${BASE_SHA}" --plan --json > /tmp/public-package-plan.json
          else
            node scripts/build/public-packages.mjs --plan --json > /tmp/public-package-plan.json
          fi
          cat /tmp/public-package-plan.json
          COUNT=$(node -p "require('/tmp/public-package-plan.json').selectedCount")
          echo "affected_count=${COUNT}" >> "$GITHUB_OUTPUT"

  public_package_build:
    needs: public_package_plan
    if: needs.public_package_plan.outputs.affected_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install
        run: corepack pnpm@10.32.1 install --frozen-lockfile

      - name: Build affected publish graph
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            corepack pnpm@10.32.1 build:packages --changed-from "${BASE_SHA}"
          else
            corepack pnpm@10.32.1 build:packages
          fi

      - name: Check public manifests and bundle budgets
        run: |
          corepack pnpm@10.32.1 check:package-manifests
          corepack pnpm@10.32.1 check:package-budgets

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm (corepack)
        run: |
          set -euo pipefail
          PACKAGE_MANAGER=$(node -p "require('./package.json').packageManager || ''")
          LOCKFILE_VERSION=$(node -e "const fs=require('fs');const text=fs.readFileSync('pnpm-lock.yaml','utf8');const m=text.match(/^lockfileVersion:\\s*['\\\"]?([^'\\\"\\n]+)['\\\"]?/m);if(!m){throw new Error('lockfileVersion not found');}process.stdout.write(m[1]);")
          echo "packageManager=${PACKAGE_MANAGER}"
          echo "lockfileVersion=${LOCKFILE_VERSION}"

          case "${LOCKFILE_VERSION}" in
            6* )
              PNPM_VERSION="8.13.1"
              ;;
            9* )
              PNPM_VERSION="10.32.1"
              ;;
            * )
              echo "Unsupported pnpm lockfileVersion: ${LOCKFILE_VERSION}"
              exit 1
              ;;
          esac

          corepack enable
          # Activate the lockfile-selected pnpm so any bare `pnpm` invocation
          # (including child spawns inside scripts/release/lib.mjs) honors the
          # version we picked, instead of falling back to package.json#packageManager.
          corepack prepare pnpm@"${PNPM_VERSION}" --activate
          echo "PROTO_PNPM_VERSION=${PNPM_VERSION}" >> "$GITHUB_ENV"
          # Tell corepack to ignore package.json#packageManager so child processes
          # spawning bare `pnpm` see the activated version.
          echo "COREPACK_ENABLE_PROJECT_SPEC=0" >> "$GITHUB_ENV"
          corepack pnpm@"${PNPM_VERSION}" --version

      - name: Install
        run: corepack pnpm@"${PROTO_PNPM_VERSION}" install --frozen-lockfile

      - name: Type check
        run: corepack pnpm@"${PROTO_PNPM_VERSION}" -s check:types

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Coverage promotion evidence is revision- and ancestry-bound.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm (corepack)
        run: |
          set -euo pipefail
          PACKAGE_MANAGER=$(node -p "require('./package.json').packageManager || ''")
          LOCKFILE_VERSION=$(node -e "const fs=require('fs');const text=fs.readFileSync('pnpm-lock.yaml','utf8');const m=text.match(/^lockfileVersion:\\s*['\\\"]?([^'\\\"\\n]+)['\\\"]?/m);if(!m){throw new Error('lockfileVersion not found');}process.stdout.write(m[1]);")
          echo "packageManager=${PACKAGE_MANAGER}"
          echo "lockfileVersion=${LOCKFILE_VERSION}"

          case "${LOCKFILE_VERSION}" in
            6* )
              PNPM_VERSION="8.13.1"
              ;;
            9* )
              PNPM_VERSION="10.32.1"
              ;;
            * )
              echo "Unsupported pnpm lockfileVersion: ${LOCKFILE_VERSION}"
              exit 1
              ;;
          esac

          corepack enable
          # Activate the lockfile-selected pnpm so any bare `pnpm` invocation
          # (including child spawns inside scripts/release/lib.mjs) honors the
          # version we picked, instead of falling back to package.json#packageManager.
          corepack prepare pnpm@"${PNPM_VERSION}" --activate
          echo "PROTO_PNPM_VERSION=${PNPM_VERSION}" >> "$GITHUB_ENV"
          # Tell corepack to ignore package.json#packageManager so child processes
          # spawning bare `pnpm` see the activated version.
          echo "COREPACK_ENABLE_PROJECT_SPEC=0" >> "$GITHUB_ENV"
          corepack pnpm@"${PNPM_VERSION}" --version

      - name: Install
        run: corepack pnpm@"${PROTO_PNPM_VERSION}" install --frozen-lockfile

      - name: Public documentation gate and repository tests
        run: |
          corepack pnpm@"${PROTO_PNPM_VERSION}" -s check:public-docs
          corepack pnpm@"${PROTO_PNPM_VERSION}" -s test:public-docs
          corepack pnpm@"${PROTO_PNPM_VERSION}" -s test

  release-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm (corepack)
        run: |
          set -euo pipefail
          PACKAGE_MANAGER=$(node -p "require('./package.json').packageManager || ''")
          LOCKFILE_VERSION=$(node -e "const fs=require('fs');const text=fs.readFileSync('pnpm-lock.yaml','utf8');const m=text.match(/^lockfileVersion:\\s*['\\\"]?([^'\\\"\\n]+)['\\\"]?/m);if(!m){throw new Error('lockfileVersion not found');}process.stdout.write(m[1]);")
          echo "packageManager=${PACKAGE_MANAGER}"
          echo "lockfileVersion=${LOCKFILE_VERSION}"

          case "${LOCKFILE_VERSION}" in
            6* )
              PNPM_VERSION="8.13.1"
              ;;
            9* )
              PNPM_VERSION="10.32.1"
              ;;
            * )
              echo "Unsupported pnpm lockfileVersion: ${LOCKFILE_VERSION}"
              exit 1
              ;;
          esac

          corepack enable
          # Activate the lockfile-selected pnpm so any bare `pnpm` invocation
          # (including child spawns inside scripts/release/lib.mjs) honors the
          # version we picked, instead of falling back to package.json#packageManager.
          corepack prepare pnpm@"${PNPM_VERSION}" --activate
          echo "PROTO_PNPM_VERSION=${PNPM_VERSION}" >> "$GITHUB_ENV"
          # Tell corepack to ignore package.json#packageManager so child processes
          # spawning bare `pnpm` see the activated version.
          echo "COREPACK_ENABLE_PROJECT_SPEC=0" >> "$GITHUB_ENV"
          corepack pnpm@"${PNPM_VERSION}" --version

      - name: Install
        run: corepack pnpm@"${PROTO_PNPM_VERSION}" install --frozen-lockfile

      - name: Release scan
        run: |
          set -euo pipefail
          # --json gives us per-package issue arrays. Parsing the structured form
          # avoids dropping whole lines that mix `workspace deps:` with real
          # offenders (e.g. "workspace deps: 1; missing license field").
          SCAN_JSON=$(corepack pnpm@"${PROTO_PNPM_VERSION}" -s release:scan -- --json)
          echo "$SCAN_JSON" | node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync(0, "utf8"));
            const tolerated = (issue) => /^workspace deps:/.test(issue);
            console.log("Discovered packages:", data.packageCount);
            console.log("Selected:", data.selectedCount);
            console.log("");
            const offenders = [];
            for (const pkg of data.selected || []) {
              const all = pkg.issues || [];
              const residual = all.filter((i) => !tolerated(i));
              const tail = all.length === 0 ? "clean" : all.join("; ");
              console.log("- " + pkg.name + " | " + tail);
              if (residual.length > 0) offenders.push({ name: pkg.name, residual });
            }
            console.log("");
            if (offenders.length > 0) {
              for (const o of offenders) {
                console.error("::error::" + o.name + ": " + o.residual.join("; "));
              }
              process.exit(1);
            }
            console.log("release-scan: clean (workspace-deps fragments tolerated)");
          '

  release-stage:
    needs: public_package_plan
    if: github.event_name != 'pull_request' || needs.public_package_plan.outputs.affected_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm (corepack)
        run: |
          set -euo pipefail
          PACKAGE_MANAGER=$(node -p "require('./package.json').packageManager || ''")
          LOCKFILE_VERSION=$(node -e "const fs=require('fs');const text=fs.readFileSync('pnpm-lock.yaml','utf8');const m=text.match(/^lockfileVersion:\\s*['\\\"]?([^'\\\"\\n]+)['\\\"]?/m);if(!m){throw new Error('lockfileVersion not found');}process.stdout.write(m[1]);")
          echo "packageManager=${PACKAGE_MANAGER}"
          echo "lockfileVersion=${LOCKFILE_VERSION}"

          case "${LOCKFILE_VERSION}" in
            6* )
              PNPM_VERSION="8.13.1"
              ;;
            9* )
              PNPM_VERSION="10.32.1"
              ;;
            * )
              echo "Unsupported pnpm lockfileVersion: ${LOCKFILE_VERSION}"
              exit 1
              ;;
          esac

          corepack enable
          # Activate the lockfile-selected pnpm so any bare `pnpm` invocation
          # (including child spawns inside scripts/release/lib.mjs) honors the
          # version we picked, instead of falling back to package.json#packageManager.
          corepack prepare pnpm@"${PNPM_VERSION}" --activate
          echo "PROTO_PNPM_VERSION=${PNPM_VERSION}" >> "$GITHUB_ENV"
          # Tell corepack to ignore package.json#packageManager so child processes
          # spawning bare `pnpm` see the activated version.
          echo "COREPACK_ENABLE_PROJECT_SPEC=0" >> "$GITHUB_ENV"
          corepack pnpm@"${PNPM_VERSION}" --version

      - name: Install
        run: corepack pnpm@"${PROTO_PNPM_VERSION}" install --frozen-lockfile

      - name: Release stage (tsc + npm publish --dry-run for all packages)
        run: corepack pnpm@"${PROTO_PNPM_VERSION}" -s release:stage

  release-consumer-react:
    needs: public_package_plan
    if: github.event_name != 'pull_request' || needs.public_package_plan.outputs.affected_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm (corepack)
        run: |
          set -euo pipefail
          PACKAGE_MANAGER=$(node -p "require('./package.json').packageManager || ''")
          LOCKFILE_VERSION=$(node -e "const fs=require('fs');const text=fs.readFileSync('pnpm-lock.yaml','utf8');const m=text.match(/^lockfileVersion:\s*['\"]?([^'\"\n]+)['\"]?/m);if(!m){throw new Error('lockfileVersion not found');}process.stdout.write(m[1]);")
          echo "packageManager=${PACKAGE_MANAGER}"
          echo "lockfileVersion=${LOCKFILE_VERSION}"
          case "${LOCKFILE_VERSION}" in
            6* ) PNPM_VERSION="8.13.1" ;;
            9* ) PNPM_VERSION="10.32.1" ;;
            * ) echo "Unsupported pnpm lockfileVersion: ${LOCKFILE_VERSION}"; exit 1 ;;
          esac
          corepack enable
          corepack prepare pnpm@"${PNPM_VERSION}" --activate
          echo "PROTO_PNPM_VERSION=${PNPM_VERSION}" >> "$GITHUB_ENV"
          echo "COREPACK_ENABLE_PROJECT_SPEC=0" >> "$GITHUB_ENV"
          corepack pnpm@"${PNPM_VERSION}" --version

      - name: Install
        run: corepack pnpm@"${PROTO_PNPM_VERSION}" install --frozen-lockfile

      - name: Smoke exact release tarballs in isolated React + Vite consumer
        run: corepack pnpm@"${PROTO_PNPM_VERSION}" -s release:smoke:react

  cli-smoke:
    needs: public_package_plan
    if: github.event_name != 'pull_request' || needs.public_package_plan.outputs.affected_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm (corepack)
        run: |
          set -euo pipefail
          PACKAGE_MANAGER=$(node -p "require('./package.json').packageManager || ''")
          LOCKFILE_VERSION=$(node -e "const fs=require('fs');const text=fs.readFileSync('pnpm-lock.yaml','utf8');const m=text.match(/^lockfileVersion:\s*['\"]?([^'\"\n]+)['\"]?/m);if(!m){throw new Error('lockfileVersion not found');}process.stdout.write(m[1]);")
          echo "packageManager=${PACKAGE_MANAGER}"
          echo "lockfileVersion=${LOCKFILE_VERSION}"
          case "${LOCKFILE_VERSION}" in
            6* ) PNPM_VERSION="8.13.1" ;;
            9* ) PNPM_VERSION="10.32.1" ;;
            * ) echo "Unsupported pnpm lockfileVersion: ${LOCKFILE_VERSION}"; exit 1 ;;
          esac
          corepack enable
          corepack prepare pnpm@"${PNPM_VERSION}" --activate
          echo "PROTO_PNPM_VERSION=${PNPM_VERSION}" >> "$GITHUB_ENV"
          echo "COREPACK_ENABLE_PROJECT_SPEC=0" >> "$GITHUB_ENV"
          corepack pnpm@"${PNPM_VERSION}" --version

      - name: Install
        run: corepack pnpm@"${PROTO_PNPM_VERSION}" install --frozen-lockfile

      - name: Smoke exact release tarballs through CLI in isolated multi-host consumer
        run: corepack pnpm@"${PROTO_PNPM_VERSION}" -s release:smoke:cli

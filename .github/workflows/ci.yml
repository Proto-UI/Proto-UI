          printf '%s  %s\n' 'b63e29a49c67dbea23883f9eff325aba54b0266812d930fb8d6c74824a7028fe' '.github/workflows/ci.yml' '105ba726bdb77425ece17da47c3d5780b3733a0ec228e8e0ab4001da0fc871eb' 'apps/www/scripts/prepare-homepage-composition-fonts.sh' | sha256sum --check --strict -

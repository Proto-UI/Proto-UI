name: TOC shared motion evidence

on:
  pull_request:
    paths:
      - '.github/workflows/toc-motion-evidence.yml'
      - 'apps/www/scripts/toc-motion/**'
      - 'apps/www/scripts/reading-reference-production.mjs'
      - 'apps/www/scripts/reading-reference-contract.mjs'
      - 'apps/www/scripts/search-production-preview.mjs'
      - 'apps/www/src/components/override/TableOfContents/**'
      - 'apps/www/src/components/site-native-controls*'
      - 'apps/www/src/components/site-native-link-facts*'
      - 'apps/www/src/components/site-link-recipes*'
      - 'apps/www/src/components/PrototypePreviewer/projection-theme*'
      - 'apps/www/src/styles/site-native-links.css'
      - 'apps/www/src/styles/right-sidebar.css'
      - 'apps/www/src/styles/site-header.css'
      - 'apps/www/src/styles/tailwindcss.css'
      - 'apps/www/src/styles/shadcn-theme.css'
      - 'apps/www/src/styles/proto-ui-*.css'
      - 'apps/www/src/styles/markdown.css'
      - 'apps/www/src/components/site-typography*'
      - 'apps/www/src/components/override/Header.astro'
      - 'apps/www/src/components/override/TwoColumnContent.astro'
      - 'packages/prototypes/base/src/surface/**'
      - 'packages/prototypes/shadcn/src/surface/**'
      - 'packages/prototypes/brutalist/src/surface/**'
      - 'packages/adapters/web-component/src/**'
      - 'apps/www/astro.config.mjs'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: toc-motion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies and real CJK fonts
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          APT_NETWORK=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${APT_NETWORK[@]}" update -qq
          sudo apt-get "${APT_NETWORK[@]}" install -y --no-install-recommends fonts-noto-cjk
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/toc-motion"
          "$CHROME" --version | tee "$RUNNER_TEMP/toc-motion/browser-environment.txt"
          fc-match -f '%{family}\n%{file}\n' 'sans-serif:lang=zh-cn' | tee "$RUNNER_TEMP/toc-motion/font-environment.txt"
      - name: Verify motion evidence contracts
        run: node --test apps/www/scripts/toc-motion/motion-contract.test.mjs
      - name: Build exact candidate once and bind production bytes
        timeout-minutes: 10
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          PROTO_UI_EXPECTED_HEAD: ${{ env.CANDIDATE_SHA }}
          PROTO_UI_READING_EVIDENCE_DIR: ${{ runner.temp }}/toc-motion
        run: |
          set -euo pipefail
          node apps/www/scripts/reading-reference-production.mjs begin-build
          corepack pnpm@10.32.1 --filter apps-www build 2>&1 | tee "$PROTO_UI_READING_EVIDENCE_DIR/build.log"
          node apps/www/scripts/reading-reference-production.mjs finish-build
      - name: Capture actual motion and reduced-motion with native anchors
        id: candidate_capture
        timeout-minutes: 10
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          PROTO_UI_EXPECTED_HEAD: ${{ env.CANDIDATE_SHA }}
          PROTO_UI_TOC_OUT: ${{ runner.temp }}/toc-motion
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 540s node apps/www/scripts/toc-motion/capture-toc-motion.mjs
      - name: Prepare unchanged original reference checkout
        id: original_prepare
        if: ${{ !cancelled() && steps.candidate_capture.outcome != 'skipped' }}
        timeout-minutes: 5
        env:
          BASELINE_SHA: '411c354cfbf76e9da34eafa90f1c8a7b973d043c'
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/toc-motion/toc-motion.json"
          test -f "$RUNNER_TEMP/toc-motion/font-environment.txt"
          test -n "${CHROME_PATH:-}"
          test ! -e "$RUNNER_TEMP/toc-original-subject"
          git fetch --no-tags origin "$BASELINE_SHA" --depth=1
          git worktree add --detach "$RUNNER_TEMP/toc-original-subject" "$BASELINE_SHA"
          corepack pnpm@10.32.1 --dir "$RUNNER_TEMP/toc-original-subject" install --frozen-lockfile --ignore-scripts
          mkdir -p "$RUNNER_TEMP/toc-motion/original-baseline"
          cp "$RUNNER_TEMP/toc-motion/browser-environment.txt" "$RUNNER_TEMP/toc-motion/original-baseline/"
          cp "$RUNNER_TEMP/toc-motion/font-environment.txt" "$RUNNER_TEMP/toc-motion/original-baseline/"

      - name: Build original reference exactly once and capture three normal transitions
        if: ${{ !cancelled() && steps.original_prepare.outcome == 'success' }}
        timeout-minutes: 15
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          PROTO_UI_TOC_RUNNER_ROOT: ${{ github.workspace }}
          PROTO_UI_TOC_RUNNER_SHA: ${{ env.CANDIDATE_SHA }}
          PROTO_UI_TOC_COMPARISON_SHA: ${{ env.CANDIDATE_SHA }}
          PROTO_UI_TOC_SUBJECT_ROOT: ${{ runner.temp }}/toc-original-subject
          PROTO_UI_TOC_OUT: ${{ runner.temp }}/toc-motion/original-baseline
          PROTO_UI_TOC_CANDIDATE_REPORT: ${{ runner.temp }}/toc-motion/toc-motion.json
          PROTO_UI_TOC_CANDIDATE_FONT: ${{ runner.temp }}/toc-motion/font-environment.txt
          PROTO_UI_TOC_PORT: '4396'
        run: |
          set -euo pipefail
          KIT="$GITHUB_WORKSPACE/apps/www/scripts/toc-motion/original"
          node --test "$KIT/original-contract.test.mjs" 2>&1 | tee "$PROTO_UI_TOC_OUT/contract-tests.log"
          node "$KIT/original-build.mjs" begin-build
          corepack pnpm@10.32.1 --dir "$PROTO_UI_TOC_SUBJECT_ROOT" --filter apps-www build 2>&1 | tee "$PROTO_UI_TOC_OUT/build.log"
          node "$KIT/original-build.mjs" finish-build
          timeout --signal=TERM --kill-after=10s 420s node "$KIT/capture-original.mjs"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toc-motion-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/toc-motion
          if-no-files-found: warn
          retention-days: 14

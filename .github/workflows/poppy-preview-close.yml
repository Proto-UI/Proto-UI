name: Poppy preview cleanup

on:
  pull_request_target:
    types: [closed]

# pull_request_target is used only for trusted cleanup code. This workflow never
# checks out or executes the pull request head.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: poppy-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Delete the per-PR Pages project
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Revalidate the live closed pull request under the lock
        id: live
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const expected = context.payload.pull_request;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(expected.number),
            });
            const expectedSHA = expected.head?.sha;
            const cleanup = typeof expectedSHA === 'string' && /^[0-9a-f]{40}$/.test(expectedSHA) &&
              pr.state === 'closed' && pr.head?.sha === expectedSHA;
            core.setOutput('cleanup', cleanup ? 'true' : 'false');
            if (!cleanup) core.notice('Skipping stale cleanup: the PR reopened or its head changed.');

      - name: Check out trusted cleanup code
        if: steps.live.outputs.cleanup == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Delete all preview resources for the PR
        id: cleanup
        if: steps.live.outputs.cleanup == 'true' && vars.POPPY_CLOUDFLARE_MUTATIONS_ENABLED == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POPPY_CLOUDFLARE_MUTATIONS_ENABLED: ${{ vars.POPPY_CLOUDFLARE_MUTATIONS_ENABLED }}
          PREVIEW_PROJECT: poppy-proto-ui-pr-${{ github.event.pull_request.number }}
        shell: bash
        run: node integrations/proto-ui-preview/scripts/cloudflare-pages.mjs delete "$PREVIEW_PROJECT"

      - name: Report the closed deployment to the central Poppy control plane
        id: revoke-central
        if: always() && steps.live.outputs.cleanup == 'true'
        continue-on-error: true
        env:
          POPPY_PREVIEW_INGEST_SECRET: ${{ secrets.POPPY_PREVIEW_INGEST_SECRET }}
          POPPY_CONTROL_PLANE: https://poppy-proto-ui.chenyejin2004.workers.dev
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_AUTHOR: ${{ github.event.pull_request.user.login }}
          PREVIEW_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          PREVIEW_PROJECT: poppy-proto-ui-pr-${{ github.event.pull_request.number }}
          PREVIEW_ORIGIN: ''
          PREVIEW_DEPLOYMENT_ID: ''
          PREVIEW_RUN_ID: ${{ github.run_id }}
          PREVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: node integrations/proto-ui-preview/scripts/report.mjs closed

      - name: Report the closed deployment to the configured fallback control plane
        id: revoke-fallback
        if: always() && steps.live.outputs.cleanup == 'true' && vars.POPPY_PREVIEW_FALLBACK_ORIGIN != ''
        continue-on-error: true
        env:
          POPPY_PREVIEW_INGEST_SECRET: ${{ secrets.POPPY_PREVIEW_FALLBACK_INGEST_SECRET }}
          POPPY_CONTROL_PLANE: ${{ vars.POPPY_PREVIEW_FALLBACK_ORIGIN }}
          POPPY_PREVIEW_FALLBACK_MODE: 'true'
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_AUTHOR: ${{ github.event.pull_request.user.login }}
          PREVIEW_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          PREVIEW_PROJECT: poppy-proto-ui-pr-${{ github.event.pull_request.number }}
          PREVIEW_ORIGIN: ''
          PREVIEW_DEPLOYMENT_ID: ''
          PREVIEW_RUN_ID: ${{ github.run_id }}
          PREVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: node integrations/proto-ui-preview/scripts/report.mjs closed

      - name: Maintain the sticky PR comment
        if: always() && steps.live.outputs.cleanup == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_PROJECT: poppy-proto-ui-pr-${{ github.event.pull_request.number }}
          PREVIEW_ORIGIN: ''
          PREVIEW_STATUS: ${{ vars.POPPY_CLOUDFLARE_MUTATIONS_ENABLED == 'true' && steps.cleanup.outcome == 'success' && steps.revoke-central.outcome == 'success' && (vars.POPPY_PREVIEW_FALLBACK_ORIGIN == '' || steps.revoke-fallback.outcome == 'success') && 'closed' || vars.POPPY_CLOUDFLARE_MUTATIONS_ENABLED != 'true' && steps.revoke-central.outcome == 'success' && (vars.POPPY_PREVIEW_FALLBACK_ORIGIN == '' || steps.revoke-fallback.outcome == 'success') && 'fallback-closed' || 'cleanup-failed' }}
          PREVIEW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: node integrations/proto-ui-preview/scripts/sticky-comment.mjs

      - name: Fail when resource cleanup or access revocation failed
        if: >-
          always() && steps.live.outputs.cleanup == 'true' && (steps.revoke-central.outcome != 'success' || (vars.POPPY_PREVIEW_FALLBACK_ORIGIN != '' && steps.revoke-fallback.outcome != 'success') || (vars.POPPY_CLOUDFLARE_MUTATIONS_ENABLED == 'true' && steps.cleanup.outcome != 'success'))


        shell: bash
        run: exit 1

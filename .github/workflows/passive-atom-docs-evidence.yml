name: Passive atom documentation evidence

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
concurrency:
  group: passive-atom-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  public-atom-previews:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        timeout-minutes: 5
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Install and record Chinese glyph coverage
        timeout-minutes: 3
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          mkdir -p "$RUNNER_TEMP/passive-atom-evidence"
          {
            dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk fontconfig
            fc-match -f '%{family}\n%{file}\n' 'sans-serif:lang=zh-cn'
            fc-list ':lang=zh-cn' family file
          } | tee "$RUNNER_TEMP/passive-atom-evidence/font-environment.txt"
          test -n "$(fc-list ':lang=zh-cn' file)"
      - name: Select real Chromium and supported toolbar setting
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
      - name: Exercise both locales through four real Web runtimes
        timeout-minutes: 11
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/passive-atom-evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --test scripts/test/passive-atom-docs-evidence.test.mjs
          mkdir -p "$PROTO_UI_RUNTIME_EVIDENCE_DIR"
          git rev-parse HEAD > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/source-sha.txt"
          "$CHROME_PATH" --version > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/browser-version.txt"
          timeout --signal=TERM --kill-after=10s 600s \
            corepack pnpm@10.32.1 exec vitest run --no-file-parallelism \
            apps/www/src/content/docs/zh-cn/demo-passive-atoms.browser.test.ts \
            2>&1 | tee "$PROTO_UI_RUNTIME_EVIDENCE_DIR/browser.log"
      - name: Retain original candidate-bound screenshots and facts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passive-atom-docs-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/passive-atom-evidence/
          if-no-files-found: warn
          retention-days: 30

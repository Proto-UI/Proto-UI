name: Sprint 2 original acceptance artifact audit
run-name: Sprint 2 acceptance audit f8e7d12 run 45029016292
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sprint2-original-acceptance-audit
  cancel-in-progress: false
jobs:
  audit-source-bound-artifact:
    if: ${{ github.repository == 'Proto-UI/Proto-UI' && github.ref == 'refs/heads/sprint2/transport-20261122-01' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the exact product source for the original receipt validator
        uses: actions/checkout@v4
        with:
          ref: f8e7d12ebe64343b8caec71a7f23a6b9761b6ef7
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read and verify original acceptance artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .sprint2-transport/audit-acceptance.mjs
      - name: Preserve read-only verification and original failure outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint2-acceptance-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sprint2-acceptance-audit/audit.json
            ${{ runner.temp }}/sprint2-acceptance-audit/original-receipt.json
            ${{ runner.temp }}/sprint2-acceptance-audit/*-original.log
            ${{ runner.temp }}/sprint2-acceptance-audit/*-report.json
          if-no-files-found: error
          retention-days: 30

name: Bounded preference source evidence
on:
  pull_request:
    paths:
      - '.github/workflows/preference-source-evidence.yml'
      - 'packages/modules/rule-meta/**'
      - 'packages/adapters/base/src/platform/web-preference*'
      - 'packages/adapters/*/src/adapt.ts'
      - 'packages/adapters/*/src/runtime/modules.ts'
      - 'apps/www/test/preferences.browser.test.ts'
      - 'apps/www/test/fixtures/preferences/**'
permissions:
  contents: read
concurrency:
  group: preference-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  four-web-preferences:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Verify bounded preferences in real Web hosts
        env:
          PROTO_UI_PREFERENCE_EVIDENCE_DIR: ${{ runner.temp }}/preference-evidence
        run: |
          mkdir -p "$PROTO_UI_PREFERENCE_EVIDENCE_DIR"
          git rev-parse HEAD > "$PROTO_UI_PREFERENCE_EVIDENCE_DIR/source-sha.txt"
          "$CHROME_PATH" --version > "$PROTO_UI_PREFERENCE_EVIDENCE_DIR/chrome-version.txt"
          corepack pnpm@10.32.1 exec vitest run \
            packages/adapters/base/test/web-preference-source.test.ts \
            packages/runtime/test/contract/rule.preferences-lifecycle.contract.test.ts \
            apps/www/test/preferences.browser.test.ts --maxWorkers=1 --minWorkers=1
          rm -rf "$PROTO_UI_PREFERENCE_EVIDENCE_DIR/cache"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preference-evidence-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/preference-evidence/*.json
            ${{ runner.temp }}/preference-evidence/*.txt
            ${{ runner.temp }}/preference-evidence/*.png
          retention-days: 30
          if-no-files-found: warn

name: Pinned liquidGL isolated baseline
on:
  pull_request:
    paths:
      - 'experiments/liquidgl-baseline/**'
      - 'apps/www/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/liquidgl-upstream-baseline.yml'
permissions:
  contents: read
jobs:
  upstream-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install repository-locked tools
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          corepack pnpm@10.32.1 --filter apps-www exec playwright-core install ffmpeg
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Check exact vendor bytes and observe bounded controls
        env:
          LIQUIDGL_EVIDENCE_DIR: ${{ runner.temp }}/liquidgl-baseline
        run: |
          node --test experiments/liquidgl-baseline/provenance.test.mjs
          node experiments/liquidgl-baseline/evidence.mjs
      - name: Record independently of observation acceptance
        if: always()
        env:
          LIQUIDGL_EVIDENCE_DIR: ${{ runner.temp }}/liquidgl-baseline
        run: node experiments/liquidgl-baseline/evidence.mjs --record
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquidgl-baseline-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/liquidgl-baseline
          retention-days: 30
          if-no-files-found: warn

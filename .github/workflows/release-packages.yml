name: Release Packages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'scan, stage(dry-run), or publish-all'
        required: true
        type: choice
        options:
          - scan
          - stage
          - publish-all
        default: scan
      profile:
        description: 'release profile (publish-all requires workspace; launch is audit-only)'
        required: true
        type: choice
        options:
          - launch
          - workspace
        default: workspace
      include_approved_candidates:
        description: 'include approved candidate packages (launch profile only)'
        required: true
        type: boolean
        default: false
      resume_published:
        description: 'partial-release recovery: skip only registry tarballs with identical integrity'
        required: true
        type: boolean
        default: false
      publish_delay_ms:
        description: 'delay between package publish requests'
        required: true
        default: '3000'
        type: string
      max_publish_retries:
        description: 'retries when npm returns 429/rate-limit'
        required: true
        default: '2'
        type: string
      retry_delay_ms:
        description: 'delay before each retry'
        required: true
        default: '15000'
        type: string

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # publish-all writes the globally versioned package set; gate it on the
    # npm environment (required reviewers + branch=main only). scan and
    # stage have no side effects but ride the same job to keep the workflow shape
    # simple — the environment check on those modes is a no-op (no rules trigger
    # for non-deployment runs that do not enter the protected publication environment).
    # Name matches the Environment field configured in the npm Trusted Publisher
    # binding for every @proto.ui/* package — they MUST stay in sync or OIDC
    # exchange fails with "no matching trusted publisher".
    environment: ${{ inputs.mode == 'publish-all' && 'npm' || '' }}
    permissions:
      # OIDC token for npm Trusted Publishing.
      id-token: write
      # tag push after the globally exact package set publishes.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history for tag creation after publication.
          fetch-depth: 0
          # Token has to allow writes for the post-publish push step.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm (corepack)
        run: |
          set -euo pipefail
          PACKAGE_MANAGER=$(node -p "require('./package.json').packageManager || ''")
          LOCKFILE_VERSION=$(node -e "const fs=require('fs');const text=fs.readFileSync('pnpm-lock.yaml','utf8');const m=text.match(/^lockfileVersion:\\s*['\\\"]?([^'\\\"\\n]+)['\\\"]?/m);if(!m){throw new Error('lockfileVersion not found');}process.stdout.write(m[1]);")
          echo "packageManager=${PACKAGE_MANAGER}"
          echo "lockfileVersion=${LOCKFILE_VERSION}"

          case "${LOCKFILE_VERSION}" in
            6* )
              PNPM_VERSION="8.13.1"
              ;;
            9* )
              PNPM_VERSION="10.32.1"
              ;;
            * )
              echo "Unsupported pnpm lockfileVersion: ${LOCKFILE_VERSION}"
              exit 1
              ;;
          esac

          corepack enable
          # Activate the lockfile-selected pnpm so any bare `pnpm` invocation
          # (including child spawns inside scripts/release/lib.mjs) honors the
          # version we picked, instead of falling back to package.json#packageManager.
          corepack prepare pnpm@"${PNPM_VERSION}" --activate
          echo "PROTO_PNPM_VERSION=${PNPM_VERSION}" >> "$GITHUB_ENV"
          # Tell corepack to ignore package.json#packageManager so child processes
          # spawning bare `pnpm` see the activated version.
          echo "COREPACK_ENABLE_PROJECT_SPEC=0" >> "$GITHUB_ENV"
          corepack pnpm@"${PNPM_VERSION}" --version

      - name: Install
        run: corepack pnpm@"${PROTO_PNPM_VERSION}" install --frozen-lockfile

      - name: Verify npm trusted publishing runtime
        if: ${{ inputs.mode == 'publish-all' }}
        run: |
          set -euo pipefail

          NPM_VERSION=$(corepack pnpm@"${PROTO_PNPM_VERSION}" exec npm --version)
          echo "npm=${NPM_VERSION}"

          node --input-type=module - "$NPM_VERSION" <<'NODE'
          const version = process.argv[2];
          const [major, minor, patch] = version.split('.').map((part) => Number(part));
          if (
            !Number.isInteger(major) ||
            major < 11 ||
            (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))
          ) {
            throw new Error(`npm trusted publishing requires npm >= 11.5.1; got ${version}`);
          }
          NODE

          if [[ -n "${NODE_AUTH_TOKEN:-}" || -n "${NPM_TOKEN:-}" ]]; then
            echo "OIDC publish must not use NODE_AUTH_TOKEN or NPM_TOKEN."
            exit 1
          fi

      - name: Validate Publish Branch
        if: ${{ inputs.mode == 'publish-all' }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "publish-all is only allowed on main (got: ${GITHUB_REF_NAME})"
            exit 1
          fi
          if [[ "${{ inputs.profile }}" != "workspace" ]]; then
            echo "publish-all requires the workspace profile; launch is audit-only."
            exit 1
          fi

      - name: Validate reviewed global release identity
        run: node scripts/release/check-version-governance.mjs

      - name: Validate reviewed release notes and package BOM
        run: node scripts/release/check-release-assets.mjs --check

      - name: Validate npm package identities
        if: ${{ inputs.mode == 'stage' || inputs.mode == 'publish-all' }}
        run: node scripts/release/check-registry-readiness.mjs

      - name: Generate deterministic spec release snapshot
        if: ${{ inputs.mode == 'publish-all' }}
        run: |
          set -euo pipefail
          VERSION_VALUE=$(cat VERSION)
          RELEASE_DIR="internal/releases/${VERSION_VALUE}"

          corepack pnpm@"${PROTO_PNPM_VERSION}" spec:snapshot:release -- --out-dir release-artifacts
          cp "${RELEASE_DIR}/package-bom.json" "release-artifacts/package-bom-${VERSION_VALUE}.json"
          cp "${RELEASE_DIR}/release-notes.zh-CN.md" "release-artifacts/release-notes-${VERSION_VALUE}.zh-CN.md"

      - name: Run Release Command
        run: |
          set -euo pipefail

          ARGS=(
            --profile "${{ inputs.profile }}"
            --check-governance
            --publish-delay-ms "${{ inputs.publish_delay_ms }}"
            --max-publish-retries "${{ inputs.max_publish_retries }}"
            --retry-delay-ms "${{ inputs.retry_delay_ms }}"
          )

          if [[ "${{ inputs.include_approved_candidates }}" == "true" ]]; then
            ARGS+=(--include-approved-candidates)
          fi

          if [[ "${{ inputs.resume_published }}" == "true" ]]; then
            if [[ "${{ inputs.mode }}" != "publish-all" ]]; then
              echo "resume_published is only valid for publish-all recovery"
              exit 1
            fi
            ARGS+=(--resume-published)
          fi

          case "${{ inputs.mode }}" in
            scan)
              node scripts/release/scan.mjs "${ARGS[@]}" --json | tee release-scan.json
              ;;
            stage)
              corepack pnpm@"${PROTO_PNPM_VERSION}" exec node scripts/release/publish.mjs --dry-run "${ARGS[@]}"
              ;;
            publish-all)
              # OIDC: npm CLI auto-detects ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN
              # and exchanges them for short-lived publish credentials.
              corepack pnpm@"${PROTO_PNPM_VERSION}" exec node scripts/release/publish.mjs --publish "${ARGS[@]}"
              ;;
            *)
              echo "unsupported mode: ${{ inputs.mode }}"
              exit 1
              ;;
          esac

      - name: Upload Release Scan Artifact
        if: ${{ inputs.mode == 'scan' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-scan
          path: release-scan.json

      - name: Upload spec release snapshot artifact
        if: ${{ inputs.mode == 'publish-all' }}
        uses: actions/upload-artifact@v4
        with:
          name: spec-release-${{ github.sha }}
          path: release-artifacts/

      - name: Tag published global release
        if: ${{ inputs.mode == 'publish-all' }}
        run: |
          set -euo pipefail
          VERSION_VALUE=$(cat VERSION)
          TAG_NAME="v${VERSION_VALUE}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists on origin."
          else
            git tag "${TAG_NAME}"
            git push origin "${TAG_NAME}"
          fi

      - name: Create GitHub release with spec evidence
        if: ${{ inputs.mode == 'publish-all' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION_VALUE=$(cat VERSION)
          TAG_NAME="v${VERSION_VALUE}"
          RELEASE_DIR="internal/releases/${VERSION_VALUE}"
          RELEASE_NOTES="${RELEASE_DIR}/release-notes.md"
          SNAPSHOT="release-artifacts/spec-snapshot-${VERSION_VALUE}.json"
          CHECKSUM="${SNAPSHOT}.sha256"
          BOM="release-artifacts/package-bom-${VERSION_VALUE}.json"
          ZH_NOTES="release-artifacts/release-notes-${VERSION_VALUE}.zh-CN.md"

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --notes-file "${RELEASE_NOTES}"
            gh release upload "${TAG_NAME}" "${SNAPSHOT}" "${CHECKSUM}" "${BOM}" "${ZH_NOTES}" --clobber
          else
            RELEASE_ARGS=(--verify-tag --title "Proto UI ${VERSION_VALUE}" --notes-file "${RELEASE_NOTES}")
            if [[ "${VERSION_VALUE}" == *-* ]]; then
              RELEASE_ARGS+=(--prerelease)
            fi
            gh release create "${TAG_NAME}" "${RELEASE_ARGS[@]}" "${SNAPSHOT}" "${CHECKSUM}" "${BOM}" "${ZH_NOTES}"
          fi

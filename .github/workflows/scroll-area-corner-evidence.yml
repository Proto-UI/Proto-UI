name: Shadcn Scroll Area forced palette evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scroll-forced-palettes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Capture actual Scroll Area palettes and geometry
        env:
          PROTO_UI_SCROLL_CORNER_EVIDENCE_DIR: ${{ runner.temp }}/scroll-forced-palettes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$PROTO_UI_SCROLL_CORNER_EVIDENCE_DIR"
          git rev-parse HEAD > "$PROTO_UI_SCROLL_CORNER_EVIDENCE_DIR/source.txt"
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          timeout --signal=TERM --kill-after=10s 720s corepack pnpm@10.32.1 exec vitest run --minWorkers=1 --maxWorkers=1 apps/www/src/content/docs/zh-cn/scroll-area-corner.browser.test.ts -t 'shadcn.*reserves a non-control corner'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scroll-forced-palettes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scroll-forced-palettes
          if-no-files-found: error

name: Browser suite repair evidence

on:
  workflow_dispatch:
    inputs:
      sprint3_acceptance:
        description: Run Sprint 3 acceptance instead of the selected repair scope
        type: boolean
        required: false
        default: false
      sprint3_followup:
        description: Run the independent Sprint 3 direct and installed consumer follow-up
        type: boolean
        required: false
        default: false
      scope:
        description: Existing repair controls, Sprint 1, or focused Contents wheel evidence
        type: choice
        options:
          [repair, sprint1, contents-wheel, dialog-reopen-diagnostic, dialog-shard-diagnostic]
        default: repair
  workflow_call:
    inputs:
      scope:
        type: string
        default: repair

permissions:
  contents: read

concurrency:
  group: browser-suite-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dialog-reopen-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'dialog-reopen-diagnostic' && inputs.sprint3_acceptance != true && inputs.sprint3_followup != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      ASTRO_TELEMETRY_DISABLED: '1'
      PROTO_UI_DIALOG_REOPEN_DIAGNOSTIC: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bind the unchanged f595 product and the passive diagnostic delta
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dialog-reopen"
          git rev-parse HEAD > "$RUNNER_TEMP/dialog-reopen/source-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/dialog-reopen/source-tree.txt"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/dialog-reopen/status-before.txt"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test ! -s "$RUNNER_TEMP/dialog-reopen/status-before.txt"
          git diff --exit-code f595e1a0662683cc47a3c68e790e87a70f303c13 HEAD -- \
            apps packages package.json pnpm-lock.yaml vitest.config.ts scripts/test/run-runtime-tests.mjs scripts/test/runtime-process-tree.mjs scripts/test/runtime-test-plan.mjs \
            ':(exclude)apps/www/src/content/docs/zh-cn/demo-shadcn-dialog.browser.test.ts' \
            > "$RUNNER_TEMP/dialog-reopen/product-diff.patch"
          git diff --binary f595e1a0662683cc47a3c68e790e87a70f303c13 HEAD > "$RUNNER_TEMP/dialog-reopen/diagnostic-source.patch"
          sha256sum .github/workflows/browser-suite-repair-evidence.yml pnpm-lock.yaml package.json vitest.config.ts \
            apps/www/src/content/docs/zh-cn/demo-shadcn-dialog.browser.test.ts \
            apps/www/src/content/docs/zh-cn/browser-harness.ts \
            scripts/test/run-runtime-tests.mjs scripts/test/runtime-process-tree.mjs scripts/test/runtime-test-plan.mjs \
            > "$RUNNER_TEMP/dialog-reopen/source-inputs.sha256"
      - name: Install the frozen original browser dependency graph
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
      - name: Record the original harness browser and actual Node selection
        run: |
          node --import tsx --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { chromeExecutable } from './apps/www/src/content/docs/zh-cn/browser-harness.ts';
          const executable = await chromeExecutable();
          const version = execFileSync(executable, ['--version'], { encoding: 'utf8' }).trim();
          assert.match(process.version, /^v24\./);
          assert.equal(executable, process.env.CHROME_PATH);
          assert.match(version, /\b158\./);
          assert.equal(process.env.PROTO_UI_DIALOG_REOPEN_DIAGNOSTIC, '1');
          writeFileSync(process.env.RUNNER_TEMP + '/dialog-reopen/environment.json', JSON.stringify({ node: process.version, executable, version, diagnosticFlag: '1' }, null, 2) + '\n');
          JS
      - name: Observe the original partial-reopen case with unchanged native input and deadlines
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/dialog-reopen
        run: |
          set -euo pipefail
          date -u +%FT%TZ > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/started-at.txt"
          set +e
          timeout --signal=TERM --kill-after=10s 900s \
            node scripts/test/run-runtime-tests.mjs \
              apps/www/src/content/docs/zh-cn/demo-shadcn-dialog.browser.test.ts \
              --testNamePattern='keeps native mask dismissal after reopening between the two part detachments$' \
              --no-file-parallelism --maxWorkers=1 --minWorkers=1 \
              --reporter=default --reporter=json \
              --outputFile="$PROTO_UI_RUNTIME_EVIDENCE_DIR/vitest.json" \
              2>&1 | tee "$PROTO_UI_RUNTIME_EVIDENCE_DIR/browser.log"
          results=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${results[0]}" > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/command-exit-code.txt"
          printf '%s\n' "${results[1]}" > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/log-exit-code.txt"
          date -u +%FT%TZ > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/completed-at.txt"
          if [ "${results[0]}" -ne 0 ]; then exit "${results[0]}"; fi
          exit "${results[1]}"
      - name: Verify the source remains unchanged after the first native outcome
        if: always()
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/dialog-reopen/source-sha-after.txt"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/dialog-reopen/status-after.txt"
          sha256sum -c "$RUNNER_TEMP/dialog-reopen/source-inputs.sha256" > "$RUNNER_TEMP/dialog-reopen/source-inputs-after.txt"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test ! -s "$RUNNER_TEMP/dialog-reopen/status-after.txt"
      - name: Reconcile one selected case and ten unselected cases without accepting a repair
        if: always()
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const dir = path.join(process.env.RUNNER_TEMP, 'dialog-reopen');
          const read = (name) => readFileSync(path.join(dir, name), 'utf8');
          const selectedTitle = 'keeps native mask dismissal after reopening between the two part detachments';
          const titles = [
            ...['react', 'vue'].map((runtime) => `starts public Dialog entry on the first visible ${runtime} frame`),
            ...['wc', 'react', 'vue', 'vue2'].flatMap((runtime) => ['no-preference', 'reduce'].map((motion) => `preserves public modal focus, dismissal and AX for ${runtime} with ${motion}`)),
            selectedTitle,
          ];
          const result = { sourceSha: process.env.CANDIDATE_SHA, diagnosticOnly: true, fullSuiteAcceptance: false, selectedTitle, captureValid: false };
          try {
            const report = JSON.parse(read('vitest.json'));
            assert.equal(report.numTotalTests, 11);
            assert.equal(report.numPassedTests + report.numFailedTests, 1);
            assert.equal(report.numPendingTests, 10);
            assert.equal(report.numTodoTests, 0);
            assert.equal(report.testResults.length, 1);
            assert.equal(path.resolve(report.testResults[0].name), path.resolve('apps/www/src/content/docs/zh-cn/demo-shadcn-dialog.browser.test.ts'));
            const tests = report.testResults[0].assertionResults;
            assert.equal(tests.length, 11);
            assert.deepEqual(tests.map((test) => test.title).sort(), [...titles].sort());
            const selected = tests.filter((test) => test.title === selectedTitle);
            assert.equal(selected.length, 1);
            assert.ok(['passed', 'failed'].includes(selected[0].status));
            assert.ok(tests.filter((test) => test.title !== selectedTitle).every((test) => test.status === 'skipped'));
            result.tests = tests.map(({ title, status }) => ({ title, status }));
            result.nativeOutcome = selected[0].status;
            result.nativeExitCode = Number(read('command-exit-code.txt').trim());
            assert.equal(result.nativeExitCode, selected[0].status === 'passed' ? 0 : 1);
            assert.equal(report.success, selected[0].status === 'passed');
            assert.equal(read('log-exit-code.txt').trim(), '0');
            assert.equal(read('product-diff.patch'), '');
            for (const name of ['source-sha.txt', 'source-sha-after.txt']) assert.equal(read(name).trim(), result.sourceSha);
            for (const name of ['status-before.txt', 'status-after.txt']) assert.equal(read(name), '');
            const inputs = read('source-inputs-after.txt').trim().split('\n');
            assert.equal(inputs.length, 9);
            assert.ok(inputs.every((line) => line.endsWith(': OK')));
            const environment = JSON.parse(read('environment.json'));
            assert.match(environment.node, /^v24\./);
            assert.match(environment.version, /\b158\./);
            assert.equal(environment.diagnosticFlag, '1');
            const capture = JSON.parse(read('dialog-public-native/partial-reopen-diagnostic.json'));
            assert.equal(capture.sourceSha, result.sourceSha);
            assert.equal(capture.diagnosticOnly, true);
            assert.equal(capture.originalCaseAcceptance, false);
            assert.equal(capture.failure === null, selected[0].status === 'passed');
            assert.equal(capture.snapshotError, undefined);
            assert.equal(capture.metadataError, undefined);
            assert.equal(capture.browser.dropped, 0);
            assert.ok(capture.browser.events.length > 0 && capture.browser.events.length <= 64);
            assert.ok(capture.browser.events.some((event) => event.trusted === true && event.event === 'pointerdown'));
            assert.ok(capture.browser.events.every((event) => typeof event.trusted === 'boolean' && ['pointerdown', 'click'].includes(event.event)));
            result.observedPhase = capture.phase;
            result.attempt = capture.attempt;
            result.captureValid = true;
          } catch (error) { result.error = String(error); process.exitCode = 1; }
          writeFileSync(path.join(dir, 'case-results.json'), JSON.stringify(result, null, 2) + '\n');
          JS
      - name: Preserve the first native result and bounded passive pointer observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dialog-reopen-diagnostic-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dialog-reopen
          if-no-files-found: error
          retention-days: 30
  # Diagnostic context comparison only: run the unchanged CI planner's whole
  # shard, with the already-reviewed passive Dialog observation still enabled.
  dialog-shard-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'dialog-shard-diagnostic' && inputs.sprint3_acceptance != true && inputs.sprint3_followup != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      ASTRO_TELEMETRY_DISABLED: '1'
      PROTO_UI_DIALOG_REOPEN_DIAGNOSTIC: '1'
      PROTO_UI_RUNTIME_PHASE: browser
      PROTO_UI_RUNTIME_SHARD: 15/20
      PROTO_UI_RUNTIME_SLOT: browser-15-of-20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bind f595 product, all six original files and the original runtime planner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dialog-shard"
          git rev-parse HEAD > "$RUNNER_TEMP/dialog-shard/source-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/dialog-shard/source-tree.txt"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/dialog-shard/status-before.txt"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test ! -s "$RUNNER_TEMP/dialog-shard/status-before.txt"
          git diff --exit-code f595e1a0662683cc47a3c68e790e87a70f303c13 HEAD -- \
            apps packages package.json pnpm-lock.yaml vitest.config.ts scripts/test \
            ':(exclude)apps/www/src/content/docs/zh-cn/demo-shadcn-dialog.browser.test.ts' \
            ':(exclude)scripts/test/sprint1-evidence.test.mjs' \
            ':(exclude)scripts/test/sprint3-consumer-workflow.test.mjs' \
            > "$RUNNER_TEMP/dialog-shard/product-diff.patch"
          git diff --binary f595e1a0662683cc47a3c68e790e87a70f303c13 HEAD > "$RUNNER_TEMP/dialog-shard/diagnostic-source.patch"
          sha256sum .github/workflows/browser-suite-repair-evidence.yml \
            pnpm-lock.yaml \
            package.json \
            vitest.config.ts \
            apps/www/src/content/docs/zh-cn/demo-base-select.browser.test.ts \
            apps/www/src/content/docs/zh-cn/demo-shadcn-dialog.browser.test.ts \
            apps/www/src/content/docs/zh-cn/demo-shadow-split-s2.browser.test.ts \
            apps/www/src/content/docs/zh-cn/demo-shadow-split-s3.browser.test.ts \
            apps/www/test/color-scheme.browser.test.ts \
            packages/adapters/web-component/test/view-operation-withdrawal.browser.test.ts \
            apps/www/src/content/docs/zh-cn/browser-harness.ts \
            scripts/test/run-runtime-tests.mjs \
            scripts/test/runtime-process-tree.mjs \
            scripts/test/runtime-test-plan.mjs \
            scripts/test/runtime-ci.mjs \
            apps/www/scripts/prepare-homepage-composition-fonts.sh \
            > "$RUNNER_TEMP/dialog-shard/source-inputs.sha256"
      - name: Install the frozen original browser dependency graph
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Restore the exact browser font package only
        timeout-minutes: 1
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/homepage-font-cache/fonts-noto-cjk_20230817+repack1-3_all.deb
          key: ubuntu24-fonts-noto-cjk-7d64b985f6fe128c99eae5610d5c047338e572bdcfb2bb09736be01b824a7f6c
      - name: Install real CJK fallback for typography glyph evidence
        timeout-minutes: 3
        env:
          FONT_EVIDENCE_DIR: ${{ runner.temp }}/dialog-shard/font-preparation
        run: bash apps/www/scripts/prepare-homepage-composition-fonts.sh
      - name: Disable the development toolbar before public-page browser tests
        run: |
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
      - name: Record the original harness browser, Node and shard environment
        run: |
          node --import tsx --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { chromeExecutable } from './apps/www/src/content/docs/zh-cn/browser-harness.ts';
          const executable = await chromeExecutable();
          const version = execFileSync(executable, ['--version'], { encoding: 'utf8' }).trim();
          const pnpm = execFileSync('corepack', ['pnpm@10.32.1', '--version'], { encoding: 'utf8' }).trim();
          const runtime = { phase: process.env.PROTO_UI_RUNTIME_PHASE, shard: process.env.PROTO_UI_RUNTIME_SHARD, slot: process.env.PROTO_UI_RUNTIME_SLOT };
          assert.match(process.version, /^v24\./);
          assert.equal(pnpm, '10.32.1');
          assert.equal(executable, process.env.CHROME_PATH);
          assert.match(version, /\b158\./);
          assert.equal(process.env.PROTO_UI_DIALOG_REOPEN_DIAGNOSTIC, '1');
          assert.deepEqual(runtime, { phase: 'browser', shard: '15/20', slot: 'browser-15-of-20' });
          writeFileSync(process.env.RUNNER_TEMP + '/dialog-shard/environment.json', JSON.stringify({ node: process.version, pnpm, executable, version, diagnosticFlag: '1', runtime }, null, 2) + '\n');
          JS
      - name: Observe the original complete shard through its argument-free CI runner
        run: |
          set -euo pipefail
          export PROTO_UI_RUNTIME_EVIDENCE_DIR="$RUNNER_TEMP/dialog-shard"
          export PROTO_UI_TYPOGRAPHY_EVIDENCE_DIR="$PROTO_UI_RUNTIME_EVIDENCE_DIR/typography"
          export PROTO_UI_MATERIAL_EVIDENCE_DIR="$PROTO_UI_RUNTIME_EVIDENCE_DIR/material"
          export PUI_QUICK_START_EVIDENCE_DIR="$PROTO_UI_RUNTIME_EVIDENCE_DIR/quick-start-first-frame"
          date -u +%FT%TZ > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/started-at.txt"
          set +e
          timeout --signal=TERM --kill-after=10s 900s \
            node scripts/test/run-runtime-tests.mjs 2>&1 | tee "$PROTO_UI_RUNTIME_EVIDENCE_DIR/browser.log"
          results=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${results[0]}" > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/command-exit-code.txt"
          printf '%s\n' "${results[1]}" > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/log-exit-code.txt"
          date -u +%FT%TZ > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/completed-at.txt"
          if [ "${results[0]}" -ne 0 ]; then exit "${results[0]}"; fi
          exit "${results[1]}"
      - name: Verify the source remains unchanged after the first native outcome
        if: always()
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/dialog-shard/source-sha-after.txt"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/dialog-shard/status-after.txt"
          sha256sum -c "$RUNNER_TEMP/dialog-shard/source-inputs.sha256" > "$RUNNER_TEMP/dialog-shard/source-inputs-after.txt"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test ! -s "$RUNNER_TEMP/dialog-shard/status-after.txt"
      - name: Reconcile all six files and 46 cases with original strict runtime gates
        if: always()
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { assertRuntimeSource, assertVitestReport, runtimeSelection } from './scripts/test/runtime-ci.mjs';
          const dir = path.join(process.env.RUNNER_TEMP, 'dialog-shard');
          const read = (name) => readFileSync(path.join(dir, name), 'utf8');
          const json = (name) => JSON.parse(read(name));
          const selectedTitle = 'keeps native mask dismissal after reopening between the two part detachments';
          // Collected locally from the unchanged planner's six files. These are footer
          // identities only; the native command remains the argument-free original runner.
          const expectedTitles = {
            "apps/www/src/content/docs/zh-cn/demo-base-select.browser.test.ts": [
              "'en' Base Select preserves native selection and cleanup through the public 'react' selector",
              "'en' Base Select preserves native selection and cleanup through the public 'vue' selector",
              "'en' Base Select preserves native selection and cleanup through the public 'vue2' selector",
              "'en' Base Select preserves native selection and cleanup through the public 'wc' selector",
              "'zh-cn' Base Select preserves native selection and cleanup through the public 'react' selector",
              "'zh-cn' Base Select preserves native selection and cleanup through the public 'vue' selector",
              "'zh-cn' Base Select preserves native selection and cleanup through the public 'vue2' selector",
              "'zh-cn' Base Select preserves native selection and cleanup through the public 'wc' selector"
            ],
            "apps/www/src/content/docs/zh-cn/demo-shadcn-dialog.browser.test.ts": [
              "Shadcn Dialog native lifecycle > keeps native mask dismissal after reopening between the two part detachments",
              "Shadcn Dialog native lifecycle > preserves public modal focus, dismissal and AX for react with no-preference",
              "Shadcn Dialog native lifecycle > preserves public modal focus, dismissal and AX for react with reduce",
              "Shadcn Dialog native lifecycle > preserves public modal focus, dismissal and AX for vue with no-preference",
              "Shadcn Dialog native lifecycle > preserves public modal focus, dismissal and AX for vue with reduce",
              "Shadcn Dialog native lifecycle > preserves public modal focus, dismissal and AX for vue2 with no-preference",
              "Shadcn Dialog native lifecycle > preserves public modal focus, dismissal and AX for vue2 with reduce",
              "Shadcn Dialog native lifecycle > preserves public modal focus, dismissal and AX for wc with no-preference",
              "Shadcn Dialog native lifecycle > preserves public modal focus, dismissal and AX for wc with reduce",
              "Shadcn Dialog native lifecycle > starts public Dialog entry on the first visible react frame",
              "Shadcn Dialog native lifecycle > starts public Dialog entry on the first visible vue frame"
            ],
            "apps/www/src/content/docs/zh-cn/demo-shadow-split-s2.browser.test.ts": [
              "S2 public Shadow split settings paths > renders all variant/size/theme combinations and exact geometry (en)",
              "S2 public Shadow split settings paths > renders all variant/size/theme combinations and exact geometry (zh-cn)",
              "S2 public Shadow split settings paths > retains mixed context, controlled state and slot ownership across move/reconnect without duplicate notifications",
              "S2 public Shadow split settings paths > routes native pointer, Tab, Space and Enter once, preserves focus paint and suppresses disabled input"
            ],
            "apps/www/src/content/docs/zh-cn/demo-shadow-split-s3.browser.test.ts": [
              "S3 complete Tabs and settings native acceptance paths > en: Light/split/mixed with keepMounted=false",
              "S3 complete Tabs and settings native acceptance paths > en: Light/split/mixed with keepMounted=true",
              "S3 complete Tabs and settings native acceptance paths > en: rejects matched wrong Switch geometry and restores the source recipe",
              "S3 complete Tabs and settings native acceptance paths > zh-cn: Light/split/mixed with keepMounted=false",
              "S3 complete Tabs and settings native acceptance paths > zh-cn: Light/split/mixed with keepMounted=true",
              "S3 complete Tabs and settings native acceptance paths > zh-cn: rejects matched wrong Switch geometry and restores the source recipe"
            ],
            "apps/www/test/color-scheme.browser.test.ts": [
              "default-document colorScheme browser contract > react paints without interaction and preserves the accepted lifetime",
              "default-document colorScheme browser contract > react reveals the initial dark recipe",
              "default-document colorScheme browser contract > vue paints without interaction and preserves the accepted lifetime",
              "default-document colorScheme browser contract > vue reveals the initial dark recipe",
              "default-document colorScheme browser contract > vue-mounted-recommit reveals the initial dark recipe",
              "default-document colorScheme browser contract > vue2 paints without interaction and preserves the accepted lifetime",
              "default-document colorScheme browser contract > vue2 reveals the initial dark recipe",
              "default-document colorScheme browser contract > wc paints without interaction and preserves the accepted lifetime",
              "default-document colorScheme browser contract > wc reveals the initial dark recipe"
            ],
            "packages/adapters/web-component/test/view-operation-withdrawal.browser.test.ts": [
              "required native WC source-view operation obligations > aborted-transport",
              "required native WC source-view operation obligations > nested-author-remove",
              "required native WC source-view operation obligations > owned-transport",
              "required native WC source-view operation obligations > remove-root",
              "required native WC source-view operation obligations > remove-source",
              "required native WC source-view operation obligations > second-reconnect",
              "required native WC source-view operation obligations > terminal-replacement",
              "required native WC source-view operation obligations > unrelated-reinsert"
            ]
          };
          const result = { sourceSha: process.env.CANDIDATE_SHA, diagnosticOnly: true, fullSuiteAcceptance: false, passed: false, captureValid: false, checks: {}, errors: [] };
          const check = (name, run) => {
            try { run(); result.checks[name] = true; }
            catch (error) { result.checks[name] = false; result.errors.push({ check: name, error: String(error) }); }
          };
          let selection, payload, report;
          check('completeOriginalInventory', () => {
            selection = runtimeSelection('browser', '15/20');
            assert.equal(selection.checkoutSha, result.sourceSha);
            assert.deepEqual(selection.suites, Object.keys(expectedTitles));
            assert.deepEqual(json('selection-browser-15-of-20.json'), selection);
            payload = json('result-browser-15-of-20.json');
            assert.deepEqual(Object.fromEntries(Object.keys(selection).map((key) => [key, payload[key]])), selection);
            report = json('vitest-browser-15-of-20.json');
            assert.deepEqual(payload.report, report);
            assert.equal(report.numTotalTests, 46);
            assert.equal(report.numPassedTests + report.numFailedTests, 46);
            assert.equal(report.numPendingTests, 0);
            assert.equal(report.numTodoTests, 0);
            assert.equal(report.testResults.length, 6);
            assert.deepEqual(report.testResults.map((file) => path.relative(process.cwd(), file.name)).sort(), [...selection.suites].sort());
            result.tests = [];
            for (const file of report.testResults) {
              const relative = path.relative(process.cwd(), file.name);
              assert.deepEqual(file.assertionResults.map((test) => [...test.ancestorTitles, test.title].join(' > ')).sort(), expectedTitles[relative]);
              for (const test of file.assertionResults) {
                assert.ok(['passed', 'failed'].includes(test.status));
                assert.equal(test.retryCount ?? test.meta?.retryCount ?? 0, 0);
                assert.equal(test.repeatCount ?? test.meta?.repeatCount ?? 0, 0);
                result.tests.push({ file: relative, title: test.title, status: test.status });
              }
            }
            result.nativeOutcome = report.success ? 'passed' : 'failed';
            result.counts = { total: report.numTotalTests, passed: report.numPassedTests, failed: report.numFailedTests, pending: report.numPendingTests, todo: report.numTodoTests };
            result.retryPolicy = 'Original unmodified config/tests and argument-free runner: no Vitest retry or repeated run. The original JSON reporter does not emit absent retry counters.';
          });
          check('strictOriginalRuntimeReport', () => assertVitestReport(report, selection));
          check('runtimeAndCheckoutSource', () => {
            assertRuntimeSource(payload.source, selection);
            assert.equal(payload.source.before.treeSha, read('source-tree.txt').trim());
            assert.equal(read('product-diff.patch'), '');
            for (const name of ['source-sha.txt', 'source-sha-after.txt']) assert.equal(read(name).trim(), result.sourceSha);
            for (const name of ['status-before.txt', 'status-after.txt']) assert.equal(read(name), '');
            const paths = [
            ".github/workflows/browser-suite-repair-evidence.yml",
            "pnpm-lock.yaml",
            "package.json",
            "vitest.config.ts",
            "apps/www/src/content/docs/zh-cn/demo-base-select.browser.test.ts",
            "apps/www/src/content/docs/zh-cn/demo-shadcn-dialog.browser.test.ts",
            "apps/www/src/content/docs/zh-cn/demo-shadow-split-s2.browser.test.ts",
            "apps/www/src/content/docs/zh-cn/demo-shadow-split-s3.browser.test.ts",
            "apps/www/test/color-scheme.browser.test.ts",
            "packages/adapters/web-component/test/view-operation-withdrawal.browser.test.ts",
            "apps/www/src/content/docs/zh-cn/browser-harness.ts",
            "scripts/test/run-runtime-tests.mjs",
            "scripts/test/runtime-process-tree.mjs",
            "scripts/test/runtime-test-plan.mjs",
            "scripts/test/runtime-ci.mjs",
            "apps/www/scripts/prepare-homepage-composition-fonts.sh"
          ];
            const before = read('source-inputs.sha256').trim().split('\n');
            assert.equal(before.length, paths.length);
            assert.deepEqual(before.map((line) => { assert.match(line, /^[a-f0-9]{64}  /); return line.slice(66); }), paths);
            assert.deepEqual(read('source-inputs-after.txt').trim().split('\n'), paths.map((file) => file + ': OK'));
          });
          check('nativeExitAndLog', () => {
            const exit = read('command-exit-code.txt').trim();
            assert.match(exit, /^(0|1)$/);
            result.nativeExitCode = Number(exit);
            assert.equal(result.nativeExitCode, report.success ? 0 : 1);
            assert.equal(read('log-exit-code.txt').trim(), '0');
          });
          check('ownedProcessCleanup', () => {
            const receipts = json('cleanup-browser-15-of-20.json');
            assert.deepEqual(receipts.map(({ label }) => label).sort(), ['astro', 'style-generation', 'vitest']);
            for (const receipt of receipts) {
              assert.equal(receipt.verified, true);
              assert.deepEqual(receipt.errors, []);
              assert.deepEqual(receipt.remaining, []);
            }
            const vitest = receipts.find(({ label }) => label === 'vitest');
            assert.equal(vitest.childExitCode, result.nativeExitCode);
            assert.equal(vitest.childSignal, null);
            assert.equal(vitest.childExitObserved, true);
            assert.equal(vitest.outputDrain.childPipesClosed, true);
            assert.equal(vitest.outputDrain.forwardedOutputDrained, true);
            result.cleanupVerified = true;
          });
          check('actualEnvironment', () => {
            const environment = json('environment.json');
            assert.match(environment.node, /^v24\./);
            assert.match(environment.version, /\b158\./);
            assert.equal(environment.pnpm, '10.32.1');
            assert.equal(environment.executable, process.env.CHROME_PATH);
            assert.equal(environment.diagnosticFlag, '1');
            assert.deepEqual(environment.runtime, { phase: 'browser', shard: '15/20', slot: 'browser-15-of-20' });
          });
          check('passiveCaptureConsistency', () => {
            const tests = report.testResults.flatMap((file) => file.assertionResults).filter((test) => test.title === selectedTitle);
            assert.equal(tests.length, 1);
            assert.ok(['passed', 'failed'].includes(tests[0].status));
            const capture = json('dialog-public-native/partial-reopen-diagnostic.json');
            assert.equal(capture.sourceSha, result.sourceSha);
            assert.equal(capture.diagnosticOnly, true);
            assert.equal(capture.originalCaseAcceptance, false);
            assert.equal(capture.failure === null, tests[0].status === 'passed');
            assert.equal(capture.snapshotError, undefined);
            assert.equal(capture.metadataError, undefined);
            // This is the existing case's partial-window loop, not a Vitest retry.
            assert.ok(Number.isInteger(capture.attempt) && capture.attempt >= 0 && capture.attempt < 5);
            assert.equal(capture.browser.dropped, 0);
            assert.ok(capture.browser.events.length > 0 && capture.browser.events.length <= 64);
            assert.ok(capture.browser.events.some((event) => event.trusted === true && event.event === 'pointerdown'));
            assert.ok(capture.browser.events.every((event) => typeof event.trusted === 'boolean' && ['pointerdown', 'click'].includes(event.event)));
            if (tests[0].status === 'passed') {
              assert.equal(capture.phase, 'passed');
              assert.deepEqual(capture.partialPointerSample, { trusted: true, partial: true });
            }
            result.observedPhase = capture.phase;
            result.partialWindowAttempt = capture.attempt;
            result.captureValid = true;
          });
          result.passed = Object.values(result.checks).every(Boolean);
          if (!result.passed) process.exitCode = 1;
          writeFileSync(path.join(dir, 'shard-results.json'), JSON.stringify(result, null, 2) + '\n');
          JS
      - name: Record the original terminal producer outcome including diagnostic failures
        if: always()
        env:
          RUNTIME_CI_OUTCOME: ${{ job.status }}
        run: node scripts/test/runtime-ci.mjs finish "$RUNNER_TEMP/dialog-shard"
      - name: Preserve original shard outcomes and bounded passive Dialog observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dialog-shard-diagnostic-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dialog-shard
          if-no-files-found: error
          retention-days: 30

  focused-browser:
    if: ${{ inputs.scope != 'sprint1' && inputs.scope != 'contents-wheel' && (github.event_name != 'workflow_dispatch' || (inputs.scope != 'dialog-reopen-diagnostic' && inputs.scope != 'dialog-shard-diagnostic')) && inputs.sprint3_acceptance != true && inputs.sprint3_followup != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject an unknown evidence scope
        env:
          EVIDENCE_SCOPE: ${{ inputs.scope }}
        run: test "$EVIDENCE_SCOPE" = repair
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Disable only the supported Astro development toolbar
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
      - name: Exercise unchanged controls with failure diagnostics
        env:
          PROTO_UI_IMAGE_SCREENSHOT_DIR: ${{ runner.temp }}/browser-suite-repair
          PROTO_UI_NEO_INPUT_EVIDENCE_DIR: ${{ runner.temp }}/browser-suite-repair/neo-input
        run: |
          set -euo pipefail
          mkdir -p "$PROTO_UI_IMAGE_SCREENSHOT_DIR"
          git rev-parse HEAD > "$PROTO_UI_IMAGE_SCREENSHOT_DIR/source-sha.txt"
          corepack pnpm@10.32.1 exec vitest run --no-file-parallelism \
            apps/www/src/content/docs/zh-cn/demo-base-image.browser.test.ts \
            apps/www/src/content/docs/zh-cn/scroll-end-follow.browser.test.ts \
            apps/www/test/evidence/brutalist-spinner.capture.browser.test.ts \
            apps/www/src/content/docs/zh-cn/demo-brutalist-input.browser.test.ts \
            --reporter=default --reporter=json \
            --outputFile="$PROTO_UI_IMAGE_SCREENSHOT_DIR/vitest.json"
      - name: Retain source-bound public Base Image captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-repair-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-suite-repair
          if-no-files-found: warn
          retention-days: 30

  # A separate opt-in preserves the original repair and Sprint 1 selections.
  # This is two oracle controls plus one original public Popover matrix, not
  # acceptance of the complete homepage suite or the complete CI selection.
  contents-wheel:
    if: ${{ inputs.scope == 'contents-wheel' && inputs.sprint3_acceptance != true && inputs.sprint3_followup != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Prepare evidence retention before checkout and setup
        run: |
          set -euo pipefail
          export CONTENTS_WHEEL_EVIDENCE_DIR="$RUNNER_TEMP/contents-wheel"
          export PROTO_UI_RUNTIME_EVIDENCE_DIR="$CONTENTS_WHEEL_EVIDENCE_DIR/runtime"
          printf '%s\n' "CONTENTS_WHEEL_EVIDENCE_DIR=$CONTENTS_WHEEL_EVIDENCE_DIR" \
            "PROTO_UI_RUNTIME_EVIDENCE_DIR=$PROTO_UI_RUNTIME_EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$CONTENTS_WHEEL_EVIDENCE_DIR"
          printf '%s\n' "$CANDIDATE_SHA" > "$CONTENTS_WHEEL_EVIDENCE_DIR/requested-source-sha.txt"
          cat > "$CONTENTS_WHEEL_EVIDENCE_DIR/record-source.mjs" <<'JS'
          import { spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { copyFileSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          const directory = process.env.CONTENTS_WHEEL_EVIDENCE_DIR;
          const phase = process.argv[2];
          const command = (file, args) => {
            const result = spawnSync(file, args, { encoding: 'utf8' });
            return { status: result.status, stdout: result.stdout ?? '', stderr: result.stderr ?? '', error: result.error?.message ?? null };
          };
          const source = command('git', ['rev-parse', 'HEAD']);
          const status = command('git', ['status', '--porcelain=v1', '--untracked-files=all']);
          const hashFile = (file) => {
            try {
              const bytes = readFileSync(file);
              return { path: file, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') };
            } catch (error) { return { path: file, error: String(error) }; }
          };
          const sourceFiles = [
            '.github/workflows/browser-suite-repair-evidence.yml', 'pnpm-lock.yaml',
            'apps/www/package.json', 'apps/www/scripts/generate-website-prototype-tokens.mjs',
            'apps/www/scripts/prepare-homepage-composition-fonts.sh',
            'apps/www/src/content/docs/zh-cn/browser-harness.ts',
            'apps/www/src/content/docs/zh-cn/contents-wheel-evidence.ts',
            'apps/www/src/content/docs/zh-cn/contents-wheel-evidence.browser.test.ts',
            'apps/www/src/content/docs/zh-cn/homepage-dogfood.browser.test.ts',
            'apps/www/src/styles/site-contents-command.css',
            'packages/modules/positioning/src/web/floating-ui-host.ts',
            'packages/modules/positioning/src/web/owned-style-lease.ts',
            'packages/modules/positioning/src/web/root-space-observer.ts',
            'packages/modules/positioning/test/floating-ui-host.test.ts',
            'packages/modules/positioning/test/floating-ui-host-intrinsic-invalidation.test.ts',
            'packages/modules/positioning/test/available-projection-ownership.test.ts',
            'packages/modules/positioning/test/lease-generation.test.ts',
            'packages/modules/positioning/test/owned-style-lease.test.ts',
          ].map(hashFile);
          // Actual outputs of apps-www generate:proto-ui-style, including the
          // ignored CSS/Shadow artifacts that git status cannot account for.
          const generatedFiles = [
            'shadcn-theme.css', 'proto-ui-style.css', 'proto-ui-tokens.generated.css',
            'proto-ui-shadow-style.generated.js', 'proto-ui-shadow-style.generated.d.ts',
          ].map((name) => hashFile(`apps/www/src/styles/${name}`));
          const archive = path.join(directory, phase, 'generated');
          mkdirSync(archive, { recursive: true });
          for (const file of generatedFiles) {
            if (!file.error) copyFileSync(file.path, path.join(archive, path.basename(file.path)));
          }
          const record = {
            phase, observedAt: new Date().toISOString(), expectedSha: process.env.CANDIDATE_SHA,
            source, status, dirty: status.status === 0 ? status.stdout !== '' : null,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            event: process.env.GITHUB_EVENT_NAME, ref: process.env.GITHUB_REF,
            node: process.version, platform: process.platform, arch: process.arch, os: os.release(),
            chromePath: process.env.CHROME_PATH ?? null,
            chrome: process.env.CHROME_PATH ? command(process.env.CHROME_PATH, ['--version']) : null,
            sourceFiles, generatedFiles,
          };
          writeFileSync(path.join(directory, `${phase}.json`), JSON.stringify(record, null, 2) + '\n');
          writeFileSync(path.join(directory, `${phase}-git-status.txt`), status.stdout + status.stderr);
          if (source.status !== 0 || source.stdout.trim() !== process.env.CANDIDATE_SHA || status.status !== 0)
            throw new Error('Could not bind evidence to the requested source and worktree state');
          JS
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the locked toolchain and official browser surface
        id: setup
        timeout-minutes: 4
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile 2>&1 | tee "$CONTENTS_WHEEL_EVIDENCE_DIR/install.log"
          corepack pnpm@10.32.1 --version | tee "$CONTENTS_WHEEL_EVIDENCE_DIR/pnpm-version.txt"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version | tee "$CONTENTS_WHEEL_EVIDENCE_DIR/browser-version.txt"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar 2>&1 | tee "$CONTENTS_WHEEL_EVIDENCE_DIR/toolbar-disable.log"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled 2>&1 | tee "$CONTENTS_WHEEL_EVIDENCE_DIR/toolbar-preference.log"
      - name: Prepare the same official CJK font input as full CI
        timeout-minutes: 3
        env:
          FONT_EVIDENCE_DIR: ${{ runner.temp }}/contents-wheel/fonts
        run: bash apps/www/scripts/prepare-homepage-composition-fonts.sh
      - name: Record source and actual CSS before native execution
        id: before
        run: node "$CONTENTS_WHEEL_EVIDENCE_DIR/record-source.mjs" beforeTest
      - name: Run both original native cancellation controls
        if: ${{ !cancelled() && steps.before.outcome == 'success' }}
        run: |
          set -uo pipefail
          set +e
          corepack pnpm@10.32.1 exec vitest run --no-file-parallelism \
            apps/www/src/content/docs/zh-cn/contents-wheel-evidence.browser.test.ts \
            --reporter=default --reporter=json \
            --outputFile="$CONTENTS_WHEEL_EVIDENCE_DIR/controls-vitest.json" \
            2>&1 | tee "$CONTENTS_WHEEL_EVIDENCE_DIR/controls.log"
          results=("${PIPESTATUS[@]}")
          printf '%s\n' "${results[0]}" > "$CONTENTS_WHEEL_EVIDENCE_DIR/controls-exit-code.txt"
          if [ "${results[0]}" -ne 0 ]; then exit "${results[0]}"; fi
          exit "${results[1]}"
      - name: Run the unchanged public Popover matrix with native input
        if: ${{ !cancelled() && steps.before.outcome == 'success' }}
        run: |
          set -uo pipefail
          set +e
          corepack pnpm@10.32.1 exec vitest run --no-file-parallelism \
            apps/www/src/content/docs/zh-cn/homepage-dogfood.browser.test.ts \
            --testNamePattern='^Homepage end-to-end dogfood boundary uses real family Popover Triggers through all four Docs runtimes with keyboard and exact-source visual evidence$' \
            --reporter=default --reporter=json \
            --outputFile="$CONTENTS_WHEEL_EVIDENCE_DIR/popover-vitest.json" \
            2>&1 | tee "$CONTENTS_WHEEL_EVIDENCE_DIR/popover.log"
          results=("${PIPESTATUS[@]}")
          printf '%s\n' "${results[0]}" > "$CONTENTS_WHEEL_EVIDENCE_DIR/popover-exit-code.txt"
          if [ "${results[0]}" -ne 0 ]; then exit "${results[0]}"; fi
          exit "${results[1]}"
      - name: Preserve source state and actual generated CSS even after failure
        if: always()
        run: node "$CONTENTS_WHEEL_EVIDENCE_DIR/record-source.mjs" afterTest
      - name: Require exactly two executed controls and the original matrix result
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const directory = process.env.CONTENTS_WHEEL_EVIDENCE_DIR;
          const plans = [
            { id: 'controls', file: 'apps/www/src/content/docs/zh-cn/contents-wheel-evidence.browser.test.ts', titles: [
              'preserves native cancellation=false and current dialog identity',
              'preserves native cancellation=true and current dialog identity',
            ] },
            { id: 'popover', file: 'apps/www/src/content/docs/zh-cn/homepage-dogfood.browser.test.ts', titles: [
              'uses real family Popover Triggers through all four Docs runtimes with keyboard and exact-source visual evidence',
            ] },
          ];
          const results = plans.map((plan) => {
            try {
              const report = JSON.parse(readFileSync(path.join(directory, `${plan.id}-vitest.json`), 'utf8'));
              const suites = report.testResults ?? [];
              const assertions = suites.flatMap((suite) => suite.assertionResults ?? []);
              const selected = assertions.filter((test) => plan.titles.includes(test.title));
              const executed = assertions.filter((test) => ['passed', 'failed'].includes(test.status));
              const exactScope = suites.length === 1 && suites[0].name === path.resolve(plan.file)
                && plan.titles.every((title) => selected.filter((test) => test.title === title).length === 1)
                && selected.every((test) => ['passed', 'failed'].includes(test.status))
                && executed.length === plan.titles.length;
              return { ...plan, exactScope, passed: exactScope && report.success === true && selected.every((test) => test.status === 'passed'),
                collected: assertions.length, executed: executed.length,
                skipped: assertions.filter((test) => !['passed', 'failed'].includes(test.status)).length,
                selected: selected.map(({ title, fullName, status, failureMessages }) => ({ title, fullName, status, failureMessages })) };
            } catch (error) { return { ...plan, exactScope: false, passed: false, error: String(error) }; }
          });
          let generatedEvidence;
          try {
            const after = JSON.parse(readFileSync(path.join(directory, 'afterTest.json'), 'utf8'));
            generatedEvidence = { complete: after.generatedFiles.length === 5
              && after.generatedFiles.every((file) => !file.error && /^[a-f0-9]{64}$/.test(file.sha256)),
              files: after.generatedFiles };
          } catch (error) { generatedEvidence = { complete: false, error: String(error) }; }
          writeFileSync(path.join(directory, 'selection-results.json'), JSON.stringify({
            expectedSha: process.env.CANDIDATE_SHA,
            scope: 'Two authored native oracle controls and one original public Popover matrix; not complete homepage or CI acceptance',
            results, generatedEvidence,
          }, null, 2) + '\n');
          if (results.some((result) => !result.passed) || !generatedEvidence.complete) process.exitCode = 1;
          JS
      - name: Retain every focused result and failure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contents-wheel-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contents-wheel
          if-no-files-found: error
          retention-days: 30

  sprint1:
    if: ${{ inputs.scope == 'sprint1' && inputs.sprint3_acceptance != true && inputs.sprint3_followup != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bind the complete selection before setup
        run: node scripts/test/sprint1-evidence.mjs prepare "$RUNNER_TEMP/sprint1"
      - name: Install the locked toolchain and configure the official evidence surface
        timeout-minutes: 4
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version | tee "$RUNNER_TEMP/sprint1/browser.txt"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
      - name: Collect every selected terminal result serially
        if: ${{ !cancelled() }}
        timeout-minutes: 80
        run: node scripts/test/sprint1-evidence.mjs run "$RUNNER_TEMP/sprint1"
      - name: Require complete source-bound receipts and retain missing outcomes
        if: always()
        run: node scripts/test/sprint1-evidence.mjs finish "$RUNNER_TEMP/sprint1"
      - name: Retain all selected results including original failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint1-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sprint1
          if-no-files-found: error
          retention-days: 30

  # Explicit manual opt-in; ordinary repair and reusable cycle calls stay unchanged.
  sprint3-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.sprint3_acceptance == true
    uses: ./.github/workflows/sprint3-consumer-evidence.yml
    permissions:
      contents: read

  # Separate explicit opt-in; the original five acceptance lanes stay unchanged.
  sprint3-followup:
    if: github.event_name == 'workflow_dispatch' && inputs.sprint3_followup == true
    uses: ./.github/workflows/sprint3-followup-evidence.yml
    permissions:
      contents: read

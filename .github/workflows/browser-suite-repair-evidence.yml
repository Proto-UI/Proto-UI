name: Browser suite repair evidence
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: textarea-admission-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shadcn-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare the locked dependencies and browser
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/textarea-admission"
          "$CHROME" --version | tee "$RUNNER_TEMP/textarea-admission/browser.txt"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
      - name: Measure Textarea readiness at the existing failure boundary
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/textarea-admission
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 3992ae27691ae65d52138e00681d27177623fcb4
          git rev-parse HEAD > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/source-sha.txt"
          corepack pnpm@10.32.1 exec vitest run --maxWorkers=1 --minWorkers=1 --no-file-parallelism \
            apps/www/src/content/docs/zh-cn/demo-shadcn-controls.browser.test.ts \
            -t 'transitions only colour and box-shadow at the upstream duration and easing' \
            --reporter=default --reporter=json \
            --outputFile.json="$PROTO_UI_RUNTIME_EVIDENCE_DIR/vitest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: textarea-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/textarea-admission
          if-no-files-found: warn
          retention-days: 30

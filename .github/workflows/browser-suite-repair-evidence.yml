name: Browser suite repair evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies and native video decoder
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg python3
          /usr/bin/ffprobe -version | /usr/bin/grep -E '^ffprobe version 6\.1\.'
      - name: Run Calendar and Shadcn source-binding controls
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/website-checks"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source.txt"
          node --test --test-name-pattern="Calendar caption import and controller binding|Shadcn public demo import requires the exact reviewed source" scripts/coverage-matrices/test/check-coverage-matrices.test.mjs 2>&1 | tee "$evidence/checker.tap"
      - name: Run repository coverage scanner
        if: success() || failure()
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/website-checks"
          mkdir -p "$evidence"
          node scripts/coverage-matrices/check-coverage-matrices.mjs > "$evidence/scanner.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/website-checks
          if-no-files-found: error
          retention-days: 30

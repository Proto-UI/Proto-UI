name: Sprint 1 original-object transfer and diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint1-transfer-e4f7fa8e46c87edaf5354f8d9553b261f66e16c8
  cancel-in-progress: false

env:
  S1_TARGET_SHA: 'e4f7fa8e46c87edaf5354f8d9553b261f66e16c8'
  S1_TARGET_TREE: '7a3c626ec6e1ca6a77836502361e47fc62be0ce4'
  S1_PUBLIC_BASE: '2810f0116b5bfe614b6e76d0a40984f86beebe3f'
  S1_TARGET_REF: 'refs/heads/fix/sprint1-reliable-regression-20261122'
  S1_BUNDLE_SHA256: '118a95c978d606fd1b9912748819f69673cc02e72a06b8b5edcc1aaa73a735f8'
  CANDIDATE_SHA: 'e4f7fa8e46c87edaf5354f8d9553b261f66e16c8'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  source-publication:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Proto-UI/Proto-UI' && github.ref == 'refs/heads/evidence/sprint1-transfer-e4f7fa8-20261122' && github.actor == 'cyjin-yl' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      published-sha: ${{ steps.publish.outputs.published-sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: carrier
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Verify original objects and publish one exact fast-forward
        id: publish
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: node carrier/.sprint1-transfer/publish.mjs
      - name: Retain original objects and real publication result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint1-transfer-publication-e4f7fa8e46c87edaf5354f8d9553b261f66e16c8-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sprint1-transfer-publication
          if-no-files-found: error
          retention-days: 30

  diagnostic:
    needs: source-publication
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Proto-UI/Proto-UI' && github.ref == 'refs/heads/evidence/sprint1-transfer-e4f7fa8-20261122' && github.actor == 'cyjin-yl' && needs.source-publication.result == 'success' && needs.source-publication.outputs.published-sha == 'e4f7fa8e46c87edaf5354f8d9553b261f66e16c8' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: carrier
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 'e4f7fa8e46c87edaf5354f8d9553b261f66e16c8'
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 'dc3b184ba10b0de53e40359c52d012b204b2cd01'
          path: baseline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Freeze actual candidate and baseline source and selected diagnostics
        run: node carrier/.sprint1-transfer/diagnose.mjs prepare
      - name: Select the existing runner Chrome and record its version
        run: |
          set -euo pipefail
          corepack enable
          S1_CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "CHROME_PATH=$S1_CHROME" >> "$GITHUB_ENV"
          "$S1_CHROME" --version > "$RUNNER_TEMP/sprint1-transfer-diagnostic/browser.txt"
      - name: Run serial source-owned native and type diagnostics
        if: ${{ !cancelled() }}
        timeout-minutes: 100
        run: node carrier/.sprint1-transfer/diagnose.mjs run
      - name: Retain every terminal and keep failures red
        if: always()
        run: node carrier/.sprint1-transfer/diagnose.mjs finish
      - name: Retain native captures, CPU profiles, built JS and all type logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint1-transfer-diagnostic-e4f7fa8e46c87edaf5354f8d9553b261f66e16c8-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sprint1-transfer-diagnostic
          if-no-files-found: error
          retention-days: 30

name: Browser suite repair evidence

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: browser-suite-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Disable only the supported Astro development toolbar
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
      - name: Run focused Shenko compiler suites
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/browser-suite-repair
          PROTO_UI_IMAGE_SCREENSHOT_DIR: ${{ runner.temp }}/browser-suite-repair
        run: |
          set -euo pipefail
          mkdir -p "$PROTO_UI_IMAGE_SCREENSHOT_DIR"
          git rev-parse HEAD > "$PROTO_UI_IMAGE_SCREENSHOT_DIR/source-sha.txt"
          corepack pnpm@10.32.1 exec vitest run --no-file-parallelism \
            packages/compiler/test/a11y-part-admission.test.ts packages/compiler/test/a11y-part-native.test.ts packages/compiler/test/hook-admission.test.ts packages/compiler/test/artifact-linking-consumer.test.ts
      - name: Compile the original Shenko Collapsible entry
        if: success() || failure()
        run: |
          node --import tsx --input-type=module <<'JS'
          import { compileFile } from './packages/compiler/src/index.ts';
          const result = await compileFile('packages/prototypes/shadcn/src/collapsible/content.proto.ts', { root: process.cwd(), exportName: 'default', profile: 'react-dom-source-v1', componentName: 'X' });
          console.log(JSON.stringify(result.diagnostics ?? []));
          if (!result.ok) process.exitCode = 1;
          JS
      - name: Retain candidate source identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-repair-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/browser-suite-repair
          if-no-files-found: warn
          retention-days: 30

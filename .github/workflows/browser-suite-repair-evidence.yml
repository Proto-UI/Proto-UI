name: Browser suite repair evidence
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  menubar-repeat-open:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - control: baseline
            source: f05a3953278e4d408b923d61704f73a69ddeefdd
          - control: repaired
            source: 3ac5fc1f6406bfd4c37debedb762f5d2a704b7c9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare locked dependencies and browser
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:apps/www/src/content/docs/zh-cn/demo-shadcn-menubar.browser.test.ts)" = '7fbc0f0adcb8169b8ddb60b87cb246fa3cf4c4a1'
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/menubar-native"
          git rev-parse HEAD > "$RUNNER_TEMP/menubar-native/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/menubar-native/source-tree.txt"
          "$CHROME" --version > "$RUNNER_TEMP/menubar-native/browser.txt"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
      - name: Exercise all four runtime focus and paint journeys
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/menubar-native
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ matrix.source }}'
          corepack pnpm@10.32.1 exec vitest run --maxWorkers=1 --minWorkers=1 --no-file-parallelism \
            apps/www/src/content/docs/zh-cn/demo-shadcn-menubar.browser.test.ts \
            --reporter=default --reporter=json \
            --outputFile.json="$PROTO_UI_RUNTIME_EVIDENCE_DIR/vitest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menubar-overlay-${{ matrix.control }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/menubar-native
          if-no-files-found: warn
          retention-days: 30

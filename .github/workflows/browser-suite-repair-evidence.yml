name: Browser suite repair evidence

on:
  pull_request:
    paths:
      - '.github/workflows/browser-suite-repair-evidence.yml'
      - 'scripts/test/**'
      - 'apps/www/src/content/docs/zh-cn/browser-harness.ts'
      - 'apps/www/src/content/docs/zh-cn/demo-base-image.browser.test.ts'
      - 'apps/www/src/content/docs/zh-cn/scroll-end-follow.browser.test.ts'
      - 'apps/www/test/evidence/brutalist-spinner.capture*.test.ts'

permissions:
  contents: read

concurrency:
  group: browser-suite-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Exercise unchanged controls with failure diagnostics
        env:
          PROTO_UI_IMAGE_SCREENSHOT_DIR: ${{ runner.temp }}/browser-suite-repair
        run: |
          set -euo pipefail
          mkdir -p "$PROTO_UI_IMAGE_SCREENSHOT_DIR"
          git rev-parse HEAD > "$PROTO_UI_IMAGE_SCREENSHOT_DIR/source-sha.txt"
          corepack pnpm@10.32.1 exec vitest run --no-file-parallelism \
            apps/www/src/content/docs/zh-cn/demo-base-image.browser.test.ts \
            apps/www/src/content/docs/zh-cn/scroll-end-follow.browser.test.ts \
            apps/www/test/evidence/brutalist-spinner.capture.browser.test.ts
      - name: Retain source-bound public Base Image captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-repair-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/browser-suite-repair
          if-no-files-found: warn
          retention-days: 30

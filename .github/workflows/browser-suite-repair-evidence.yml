name: Browser suite repair evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  overlay-first-open:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare locked dependencies and browser
        id: setup
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/overlay-entry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          mkdir -p "$PROTO_UI_RUNTIME_EVIDENCE_DIR"
          git rev-parse HEAD > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/source-sha.txt"
          "$chrome" --version > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/browser.txt"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
      - name: Verify ordinary React and Vue reveal guards
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/overlay-entry
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 exec vitest run packages/adapters/react/test/view-reveal-style.integration.test.ts \
            packages/adapters/vue/test/view-reveal-style.integration.test.ts \
            --no-file-parallelism --maxWorkers=1 --reporter=default --reporter=json \
            --outputFile.json="$PROTO_UI_RUNTIME_EVIDENCE_DIR/guards-vitest.json"
      - name: Observe the public Dialog and Search motion in Chrome
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/overlay-entry
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 exec vitest run apps/www/src/content/docs/zh-cn/overlay-first-open.observation.browser.test.ts \
            --no-file-parallelism --maxWorkers=1 --reporter=default --reporter=json \
            --outputFile.json="$PROTO_UI_RUNTIME_EVIDENCE_DIR/vitest.json"
      - name: Verify the permanent first visible frame regression
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/overlay-entry
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 exec vitest run apps/www/src/content/docs/zh-cn/demo-shadcn-dialog.browser.test.ts \
            -t 'starts public Dialog entry on the first visible' --no-file-parallelism --maxWorkers=1 \
            --reporter=default --reporter=json --outputFile.json="$PROTO_UI_RUNTIME_EVIDENCE_DIR/regression-vitest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-entry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/overlay-entry/
          if-no-files-found: warn
          retention-days: 30

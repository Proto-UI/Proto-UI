name: Sprint 1 read-only Matrix startup diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint1-matrix-profile-e4f7fa8e46c87edaf5354f8d9553b261f66e16c8
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 'e4f7fa8e46c87edaf5354f8d9553b261f66e16c8'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  matrix-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && github.repository == 'Proto-UI/Proto-UI' && github.ref == 'refs/heads/evidence/sprint1-matrix-profile-e4f7fa8-20261122' && github.actor == 'cyjin-yl' && github.triggering_actor == 'cyjin-yl' && github.event.sender.login == 'cyjin-yl' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: carrier
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 'e4f7fa8e46c87edaf5354f8d9553b261f66e16c8'
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Freeze original source and the bounded selected Matrix diagnosis
        run: node carrier/.sprint1-matrix/matrix.mjs prepare
      - name: Select the existing runner Chrome and record its version
        run: |
          set -euo pipefail
          corepack enable
          S1_CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "CHROME_PATH=$S1_CHROME" >> "$GITHUB_ENV"
          "$S1_CHROME" --version > "$RUNNER_TEMP/sprint1-matrix-profile/browser.txt"
      - name: Run original Matrix case with bounded read-only CPU and JS capture
        if: ${{ !cancelled() }}
        timeout-minutes: 21
        run: node carrier/.sprint1-matrix/matrix.mjs run
      - name: Retain every terminal and keep the original failures red
        if: always()
        run: node carrier/.sprint1-matrix/matrix.mjs finish
      - name: Retain source receipts, original profile, actual JS bytes and unavailable captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint1-matrix-profile-e4f7fa8e46c87edaf5354f8d9553b261f66e16c8-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sprint1-matrix-profile
          if-no-files-found: error
          retention-days: 30

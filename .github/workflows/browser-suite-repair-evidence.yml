name: Browser suite repair evidence

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: browser-suite-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3e5a6e6b69eb2ea4d53e032cf9caddb7f01a76a3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Exercise native Shadow closeout boundaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser-suite-repair"
          test "$(git rev-parse HEAD)" = 3e5a6e6b69eb2ea4d53e032cf9caddb7f01a76a3
          git rev-parse HEAD > "$RUNNER_TEMP/browser-suite-repair/source-sha.txt"
          "$CHROME_PATH" --version > "$RUNNER_TEMP/browser-suite-repair/browser.txt"
          corepack pnpm@10.32.1 exec vitest run --no-file-parallelism \
            --reporter=json --outputFile="$RUNNER_TEMP/browser-suite-repair/vitest.json" \
            packages/adapters/web-component/test/shadow-closeout.browser.test.ts
      - name: Retain Shadow closeout test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-repair-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/browser-suite-repair
          if-no-files-found: warn
          retention-days: 30

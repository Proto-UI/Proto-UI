name: Browser suite repair evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  surface-hover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CANDIDATE_SHA: 8127c678dea7c2ba731f24f0e018d2c7f8529b3e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare locked dependencies and retain source identity
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/surface-hover
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          mkdir -p "$PROTO_UI_RUNTIME_EVIDENCE_DIR"
          git rev-parse HEAD > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/source-sha.txt"
          "$chrome" --version > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/browser.txt"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
      - name: Exercise four native Surface runtimes
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/surface-hover
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 exec vitest run apps/www/src/content/docs/zh-cn/brutalist-passive-consumers.browser.test.ts \
            -t 'Surface keeps native text ownership and live raised timing' --no-file-parallelism --maxWorkers=1 \
            --reporter=default --reporter=json --outputFile.json="$PROTO_UI_RUNTIME_EVIDENCE_DIR/vitest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-hover-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/surface-hover/
          if-no-files-found: warn
          retention-days: 30

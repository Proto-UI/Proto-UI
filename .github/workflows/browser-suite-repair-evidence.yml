name: Browser suite repair evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pagefind:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: f54e1947e48ec4a46b0a664bd8607d7f5532abdc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked workspace dependencies
        run: corepack pnpm@10.32.1 install --frozen-lockfile
      - name: Verify complete coverage checker test file
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pagefind"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          node --test scripts/coverage-matrices/test/check-coverage-matrices.test.mjs 2>&1 | tee "$evidence/checker.tap"
      - name: Verify Search and Pagefind runtime unit suites
        if: success() || failure()
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pagefind"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          corepack pnpm@10.32.1 exec vitest run --reporter=json --outputFile="$evidence/search.json" \
            apps/www/src/components/site-pagefind-resource.test.ts \
            apps/www/src/components/site-search-owner.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pagefind-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pagefind
          if-no-files-found: error
          retention-days: 30

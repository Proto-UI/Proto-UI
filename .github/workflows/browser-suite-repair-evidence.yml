            try {
              const bytes = execFileSync('git', ['--no-pager', ...args], {
                encoding: null, timeout: 60_000, maxBuffer: 64 * 1024 * 1024,
              });
              write(name, bytes);
              return bytes;
            } catch (error) {
              write(`${name}.error.json`, JSON.stringify({ message: String(error), status: error.status,

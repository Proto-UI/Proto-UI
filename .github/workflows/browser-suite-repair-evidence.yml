name: Browser suite repair evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  menubar-roving-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare locked dependencies and browser
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/menubar-roving
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          mkdir -p "$PROTO_UI_RUNTIME_EVIDENCE_DIR"
          git rev-parse HEAD > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/source-sha.txt"
          "$chrome" --version > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/browser.txt"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
      - name: Verify Focus Center lifecycle and order
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/menubar-roving
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 exec vitest run packages/modules/focus/test/center.test.ts \
            packages/modules/focus/test/center-order.test.ts --no-file-parallelism --maxWorkers=1 \
            --reporter=default --reporter=json --outputFile.json="$PROTO_UI_RUNTIME_EVIDENCE_DIR/focus-vitest.json"
      - name: Verify two native Menubar journeys on each host
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/menubar-roving
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 exec vitest run apps/www/src/content/docs/zh-cn/demo-shadcn-menubar.browser.test.ts \
            --no-file-parallelism --maxWorkers=1 \
            --reporter=default --reporter=json --outputFile.json="$PROTO_UI_RUNTIME_EVIDENCE_DIR/vitest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menubar-roving-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/menubar-roving/
          if-no-files-found: warn
          retention-days: 30

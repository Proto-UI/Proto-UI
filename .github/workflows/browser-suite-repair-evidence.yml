name: Browser suite repair evidence
on:
  workflow_dispatch:
permissions:
  contents: read

env:
  CANDIDATE_SHA: ddffcc54868fbe3a752f06b2f59475fdd20fb4ca

jobs:
  brutalist-button:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare the locked dependencies and browser
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/brutalist-button"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version | tee "$evidence/browser.txt"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
      - name: Run the complete Brutalist Button browser suite
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/brutalist-button
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 exec vitest run --maxWorkers=1 --minWorkers=1 --no-file-parallelism \
            apps/www/src/content/docs/zh-cn/demo-brutalist-button.browser.test.ts \
            --reporter=default --reporter=json \
            --outputFile.json="$PROTO_UI_RUNTIME_EVIDENCE_DIR/vitest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brutalist-button-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/brutalist-button
          if-no-files-found: error
          retention-days: 30

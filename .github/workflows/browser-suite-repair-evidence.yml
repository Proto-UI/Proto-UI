# Scratch-only fixed no-input manual preflight; source publication must succeed before dispatch.
name: Sprint 1 collaboration read-only preflight
run-name: Sprint 1 readonly collaboration preflight e4f7fa8
on:
  workflow_dispatch: null
permissions: {}
concurrency:
  group: sprint1-ordinary-collaboration-Proto-UI-1711
  cancel-in-progress: false
jobs:
  readonly-preflight:
    if: github.repository == 'Proto-UI/Proto-UI' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/evidence/sprint1-collaboration-preflight-e4f7fa8-20261122' && github.actor == 'cyjin-yl'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: read
      statuses: read
      actions: read
    env:
      PROTO_S1_SOURCE_SHA: e4f7fa8e46c87edaf5354f8d9553b261f66e16c8
      PROTO_S1_MODE: preflight
      PROTO_S1_DISPATCH_ACTOR: cyjin-yl
      PROTO_S1_TARGET_KIND: pull-request
      PROTO_S1_TARGET_NUMBER: "1711"
      PROTO_S1_TOOLS_DIGEST: f263c44a540719d4daee0640d495e2c52286779695e86ffdc56e319eddae0245
      PROTO_S1_PACKET_DIGEST: ""
      PROTO_S1_CARRIER_REF: refs/heads/evidence/sprint1-collaboration-preflight-e4f7fa8-20261122
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: carrier
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bind independently reviewed launcher bytes before executing them
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sprint1-collaboration"
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync, realpathSync, lstatSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {resolve, sep} from 'node:path';
          const hash = (bytes) => createHash('sha256').update(bytes).digest('hex');
          assert(/^[a-f0-9]{40}$/.test(process.env.PROTO_S1_SOURCE_SHA));
          assert(/^[a-f0-9]{64}$/.test(process.env.PROTO_S1_TOOLS_DIGEST));
          assert(['preflight','apply'].includes(process.env.PROTO_S1_MODE));
          assert.equal(process.env.GITHUB_ACTOR, process.env.PROTO_S1_DISPATCH_ACTOR);
          assert.equal(process.env.GITHUB_TRIGGERING_ACTOR, process.env.PROTO_S1_DISPATCH_ACTOR);
          const dir = realpathSync(resolve('carrier/.sprint1-collaboration'));
          const raw = readFileSync(resolve(dir, 'tools-manifest.json'));
          assert.equal(hash(raw), process.env.PROTO_S1_TOOLS_DIGEST);
          const manifest = JSON.parse(raw);
          assert.equal(manifest.kind, 'sprint1.collaboration-carrier-tools');
          assert.deepEqual(manifest.files.map((entry) => entry.path).sort(), [
            'common.mjs', 'helpers/collect-readonly.mjs', 'preflight.mjs',
          ].sort());
          for (const entry of manifest.files) {
            assert(/^[A-Za-z0-9][A-Za-z0-9_./-]*\.mjs$/.test(entry.path));
            assert(!entry.path.split('/').some((part) => part === '..' || part === '.' || part === ''));
            const file = resolve(dir, entry.path);
            assert(realpathSync(file) === file && file.startsWith(dir + sep));
            assert(lstatSync(file).isFile() && !lstatSync(file).isSymbolicLink());
            assert.equal(hash(readFileSync(file)), entry.sha256);
          }
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PROTO_S1_SOURCE_SHA }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Install locked CLI dependencies without install scripts
        working-directory: candidate
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Read real viewer, permission and complete PR snapshot without a mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PROTO_S1_TOOLS="$GITHUB_WORKSPACE/carrier/.sprint1-collaboration"
          node "$PROTO_S1_TOOLS/preflight.mjs" "$GITHUB_WORKSPACE/candidate" \
            "$RUNNER_TEMP/sprint1-collaboration/preflight" "$PROTO_S1_SOURCE_SHA" \
            "$PROTO_S1_TARGET_KIND" "$PROTO_S1_TARGET_NUMBER" "$PROTO_S1_DISPATCH_ACTOR"
      - name: Retain raw refusals, original receipts and prepared data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint1-collaboration-preflight-${{ env.PROTO_S1_SOURCE_SHA }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sprint1-collaboration
          if-no-files-found: error
          retention-days: 30

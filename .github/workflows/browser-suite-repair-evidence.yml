name: Browser suite repair evidence

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: browser-suite-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Disable only the supported Astro development toolbar
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
      - name: Install and identify the bounded video evidence toolchain
        run: |
          set -euo pipefail
          /usr/bin/sudo /usr/bin/apt-get update
          /usr/bin/sudo /usr/bin/apt-get install --no-install-recommends -y ffmpeg python3
          /usr/bin/dpkg-query --show --showformat='${Package}=${Version}\n' ffmpeg python3
          /usr/bin/python3 --version
          /usr/bin/ffmpeg -version
          /usr/bin/ffprobe -version
          /usr/bin/ffmpeg -version | /usr/bin/grep -E '^ffmpeg version 6\.1\.'
          /usr/bin/ffprobe -version | /usr/bin/grep -E '^ffprobe version 6\.1\.'
          # Real fixture decoding proves fd seek/seal and codec capabilities;
          # inventory or version strings alone do not satisfy this gate.
          node --test scripts/coverage-matrices/test/decode-video-evidence.integration.mjs

      - name: Validate coverage matrices with remaining diagnostics visible
        run: corepack pnpm@10.32.1 check:coverage-matrices
      - name: Exercise coverage negative controls
        if: success() || failure()
        run: node --test scripts/coverage-matrices/test/check-coverage-matrices.test.mjs
      - name: Retain candidate source identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-repair-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/browser-suite-repair
          if-no-files-found: warn
          retention-days: 30

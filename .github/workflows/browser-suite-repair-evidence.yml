name: Browser suite repair evidence

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: browser-suite-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Disable only the supported Astro development toolbar
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
      - name: Verify Website provenance and markup
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/browser-suite-repair
          PROTO_UI_IMAGE_SCREENSHOT_DIR: ${{ runner.temp }}/browser-suite-repair
        run: |
          set -euo pipefail
          mkdir -p "$PROTO_UI_IMAGE_SCREENSHOT_DIR"
          git rev-parse HEAD > "$PROTO_UI_IMAGE_SCREENSHOT_DIR/source-sha.txt"
          export PROTO_UI_EXPECTED_REVISION=$(git rev-parse HEAD)
          node --test scripts/coverage-matrices/test/website-markup-provenance.test.mjs
          corepack pnpm@10.32.1 exec vitest run --no-file-parallelism \
            apps/www/src/content/docs/zh-cn/website-markup-provenance.browser.test.ts
      - name: Retain candidate source identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-repair-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/browser-suite-repair
            ${{ runner.temp }}/pui834
          if-no-files-found: warn
          retention-days: 30

name: Browser suite repair evidence
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shadcn-oracle-native-evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 36a799b77f96b094d9163474596176246531cdca

jobs:
  shadcn-radio-scroll:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare the locked dependencies and browser
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/shadcn-oracle-native"
          "$CHROME" --version | tee "$RUNNER_TEMP/shadcn-oracle-native/browser.txt"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
      - name: Exercise the Shadcn Radio Group and Scroll Area browser suites
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/shadcn-oracle-native
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git rev-parse HEAD > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/source-sha.txt"
          corepack pnpm@10.32.1 exec vitest run --maxWorkers=1 --minWorkers=1 --no-file-parallelism \
            apps/www/src/content/docs/zh-cn/demo-shadcn-radio-group.browser.test.ts apps/www/src/content/docs/zh-cn/demo-shadcn-scroll-area.browser.test.ts \
            --reporter=default --reporter=json \
            --outputFile.json="$PROTO_UI_RUNTIME_EVIDENCE_DIR/vitest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadcn-oracle-native-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shadcn-oracle-native
          if-no-files-found: warn
          retention-days: 30

name: Browser suite repair evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rhea-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked workspace dependencies
        run: corepack pnpm@10.32.1 install --frozen-lockfile
      - name: Run all five changed Rhea fixture files
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/rhea-fixtures"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source.txt"
          corepack pnpm@10.32.1 exec vitest run --reporter=json --outputFile="$evidence/vitest.json" \
            apps/www/src/components/PrototypePreviewer/checkbox-group-registration.test.ts \
            apps/www/src/components/PrototypePreviewer/dropdown-recipe-examples.test.ts \
            apps/www/src/components/PrototypePreviewer/fieldset-registration.test.ts \
            apps/www/src/components/PrototypePreviewer/text-registration.test.ts \
            apps/www/src/components/PrototypePreviewer/toast-registration.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhea-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rhea-fixtures
          if-no-files-found: error
          retention-days: 30

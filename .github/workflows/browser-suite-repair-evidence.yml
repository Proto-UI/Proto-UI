name: Browser suite repair evidence

on:
  workflow_dispatch:
    inputs:
      sprint3_acceptance:
        description: Run Sprint 3 acceptance instead of the selected repair scope
        type: boolean
        required: false
        default: false
      sprint3_followup:
        description: Run the independent Sprint 3 direct and installed consumer follow-up
        type: boolean
        required: false
        default: false
      scope:
        description: Existing repair controls, Sprint 1, Contents wheel, complete Website markup/Matrix evidence, or one Matrix timeline diagnostic
        type: choice
        options:
          [repair, sprint1, contents-wheel, website-markup, website-matrix, website-matrix-timeline]
        default: repair
  workflow_call:
    inputs:
      scope:
        type: string
        default: repair

permissions:
  contents: read

concurrency:
  group: browser-suite-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-browser:
    if: ${{ inputs.scope != 'sprint1' && inputs.scope != 'contents-wheel' && (github.event_name != 'workflow_dispatch' || (inputs.scope != 'website-markup' && inputs.scope != 'website-matrix' && inputs.scope != 'website-matrix-timeline')) && inputs.sprint3_acceptance != true && inputs.sprint3_followup != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject an unknown evidence scope
        env:
          EVIDENCE_SCOPE: ${{ inputs.scope }}
        run: test "$EVIDENCE_SCOPE" = repair
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Disable only the supported Astro development toolbar
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
      - name: Exercise unchanged controls with failure diagnostics
        env:
          PROTO_UI_IMAGE_SCREENSHOT_DIR: ${{ runner.temp }}/browser-suite-repair
          PROTO_UI_NEO_INPUT_EVIDENCE_DIR: ${{ runner.temp }}/browser-suite-repair/neo-input
        run: |
          set -euo pipefail
          mkdir -p "$PROTO_UI_IMAGE_SCREENSHOT_DIR"
          git rev-parse HEAD > "$PROTO_UI_IMAGE_SCREENSHOT_DIR/source-sha.txt"
          corepack pnpm@10.32.1 exec vitest run --no-file-parallelism \
            apps/www/src/content/docs/zh-cn/demo-base-image.browser.test.ts \
            apps/www/src/content/docs/zh-cn/scroll-end-follow.browser.test.ts \
            apps/www/test/evidence/brutalist-spinner.capture.browser.test.ts \
            apps/www/src/content/docs/zh-cn/demo-brutalist-input.browser.test.ts \
            --reporter=default --reporter=json \
            --outputFile="$PROTO_UI_IMAGE_SCREENSHOT_DIR/vitest.json"
      - name: Retain source-bound public Base Image captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-repair-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-suite-repair
          if-no-files-found: warn
          retention-days: 30

  # Diagnostic-only opt-in: the original file, assertions and case/hook deadlines
  # are unchanged. Keep the scheduled browser lane's 900s command and 20m job cap.
  website-markup:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'website-markup' && inputs.sprint3_acceptance != true && inputs.sprint3_followup != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bind the unchanged original file and source before setup
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pui834"
          git rev-parse HEAD > "$RUNNER_TEMP/pui834/source-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/pui834/source-tree.txt"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/pui834/status-before.txt"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test ! -s "$RUNNER_TEMP/pui834/status-before.txt"
          sha256sum .github/workflows/browser-suite-repair-evidence.yml pnpm-lock.yaml \
            apps/www/src/content/docs/zh-cn/website-markup-provenance.browser.test.ts \
            apps/www/src/content/docs/zh-cn/browser-harness.ts \
            scripts/coverage-matrices/website-markup-provenance.mjs \
            scripts/coverage-matrices/test/fixtures/website-markup-provenance-current.json \
            > "$RUNNER_TEMP/pui834/source-inputs.sha256"
      - name: Install the frozen Node 24 toolchain and require Chrome 158
        run: |
          set -euo pipefail
          node -e 'if (process.versions.node.split(".")[0] !== "24") process.exit(1)'
          node --version > "$RUNNER_TEMP/pui834/node-version.txt"
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/pui834/install.log"
          corepack pnpm@10.32.1 --version > "$RUNNER_TEMP/pui834/pnpm-version.txt"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version | tee "$RUNNER_TEMP/pui834/browser-version.txt"
          node -e 'const fs = require("node:fs"); if (!/\b158\./.test(fs.readFileSync(process.env.RUNNER_TEMP+"/pui834/browser-version.txt", "utf8"))) process.exit(1)'
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
      - name: Prepare the same official CJK font input as full CI
        timeout-minutes: 3
        env:
          FONT_EVIDENCE_DIR: ${{ runner.temp }}/pui834/fonts
        run: bash apps/www/scripts/prepare-homepage-composition-fonts.sh
      - name: Run the complete original seventeen-case Website markup file
        run: |
          set -euo pipefail
          date -u +%FT%TZ > "$RUNNER_TEMP/pui834/started-at.txt"
          set +e
          timeout --signal=TERM --kill-after=10s 900s \
            corepack pnpm@10.32.1 exec vitest run \
              apps/www/src/content/docs/zh-cn/website-markup-provenance.browser.test.ts \
              --no-file-parallelism --maxWorkers=1 --minWorkers=1 \
              --reporter=default --reporter=json \
              --outputFile="$RUNNER_TEMP/pui834/vitest.json" \
              2>&1 | tee "$RUNNER_TEMP/pui834/browser.log"
          results=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${results[0]}" > "$RUNNER_TEMP/pui834/command-exit-code.txt"
          printf '%s\n' "${results[1]}" > "$RUNNER_TEMP/pui834/log-exit-code.txt"
          date -u +%FT%TZ > "$RUNNER_TEMP/pui834/completed-at.txt"
          if [ "${results[0]}" -ne 0 ]; then exit "${results[0]}"; fi
          exit "${results[1]}"
      - name: Preserve exact terminal source state even when native evidence fails
        if: always()
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/pui834/source-sha-after.txt"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/pui834/status-after.txt"
          sha256sum -c "$RUNNER_TEMP/pui834/source-inputs.sha256" > "$RUNNER_TEMP/pui834/source-inputs-after.txt"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test ! -s "$RUNNER_TEMP/pui834/status-after.txt"
      - name: Require every original case to execute with its real browser
        if: always()
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const directory = path.join(process.env.RUNNER_TEMP, 'pui834');
          const read = (name) => readFileSync(path.join(directory, name), 'utf8');
          const titles = [];
          for (const route of ['generic', 'projected'])
            for (const theme of ['light', 'dark'])
              for (const width of [390, 1180])
                titles.push(`834 actual ${route} response, runtime, copy and remount ${theme} ${width}`);
          for (const theme of ['light', 'dark'])
            for (const width of [390, 1180])
              titles.push(`834 original code and install commands remain readable without JavaScript ${theme} ${width}`);
          for (const lang of ['html', 'tsx', 'vue'])
            titles.push(`834 real Shiki producer and native template clone preserve hostile example text for ${lang}`);
          for (const theme of ['light', 'dark'])
            titles.push(`834 current install Copy preserves original command and stable glyphs ${theme}`);
          const result = { source: process.env.CANDIDATE_SHA, expectedTitles: titles, passed: false };
          try {
            const report = JSON.parse(read('vitest.json'));
            result.tests = report.testResults.flatMap((suite) => suite.assertionResults);
            result.browser = JSON.parse(read('browser.json'));
            assert.equal(report.success, true);
            assert.equal(report.numTotalTests, 17);
            assert.equal(report.numPassedTests, 17);
            assert.equal(report.numFailedTests, 0);
            assert.equal(report.numPendingTests, 0);
            assert.equal(report.numTodoTests, 0);
            assert.equal(report.testResults.length, 1);
            assert.equal(path.resolve(report.testResults[0].name), path.resolve('apps/www/src/content/docs/zh-cn/website-markup-provenance.browser.test.ts'));
            assert.deepEqual(result.tests.map((test) => test.title).sort(), [...titles].sort());
            assert.ok(result.tests.every((test) => test.status === 'passed'));
            assert.match(result.browser.version, /^158\./);
            assert.match(read('node-version.txt').trim(), /^v24\./);
            assert.equal(JSON.parse(read('source-binding.json')).binding.revision, result.source);
            const verifiedInputs = read('source-inputs-after.txt').trim().split('\n');
            assert.equal(verifiedInputs.length, 6);
            assert.ok(verifiedInputs.every((line) => line.endsWith(': OK')));
            for (const name of ['source-sha.txt', 'source-sha-after.txt']) assert.equal(read(name).trim(), result.source);
            for (const name of ['status-before.txt', 'status-after.txt']) assert.equal(read(name), '');
            for (const name of ['command-exit-code.txt', 'log-exit-code.txt']) assert.equal(read(name).trim(), '0');
            result.passed = true;
          } catch (error) { result.error = String(error); process.exitCode = 1; }
          writeFileSync(path.join(directory, 'seventeen-case-results.json'), JSON.stringify(result, null, 2) + '\n');
          JS
      - name: Retain original HTML, screenshots, source binding and complete terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-markup-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pui834
          if-no-files-found: error
          retention-days: 30

  # Ordinary, unprofiled original Matrix oracle on unchanged main f595 product
  # bytes. The original case, initialization, hook and outer deadlines remain.
  website-matrix:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'website-matrix' && inputs.sprint3_acceptance != true && inputs.sprint3_followup != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASTRO_TELEMETRY_DISABLED: '1'
      PROTO_UI_MATRIX_STARTUP_PROFILE: '0'
      PROTO_UI_MATRIX_BROWSER_DIAGNOSTIC: '0'
      PROTO_UI_MATRIX_ENTRY_COST: '0'
      PROTO_UI_MATRIX_TRACE_BEFORE_INIT: '0'
      PROTO_UI_MATRIX_TRACE_LATE: '0'
      PROTO_UI_MATRIX_ANATOMY_NOTIFICATIONS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bind the original Matrix and unchanged f595 product source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/website-matrix"
          git rev-parse HEAD > "$RUNNER_TEMP/website-matrix/source-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/website-matrix/source-tree.txt"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/website-matrix/status-before.txt"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test ! -s "$RUNNER_TEMP/website-matrix/status-before.txt"
          git diff --exit-code f595e1a0662683cc47a3c68e790e87a70f303c13 HEAD -- \
            apps packages pnpm-lock.yaml scripts/test/run-runtime-tests.mjs scripts/test/runtime-process-tree.mjs \
            > "$RUNNER_TEMP/website-matrix/product-diff.patch"
          sha256sum .github/workflows/browser-suite-repair-evidence.yml pnpm-lock.yaml \
            apps/www/src/content/docs/zh-cn/demo-matrix.browser.test.ts \
            apps/www/src/content/docs/zh-cn/browser-harness.ts \
            apps/www/src/content/docs/zh-cn/demo-matrix-observation.ts \
            apps/www/src/content/docs/zh-cn/demo-matrix-startup-diagnostic.ts \
            apps/www/src/content/docs/zh-cn/demo-matrix-browser-diagnostic.ts \
            scripts/test/run-runtime-tests.mjs scripts/test/runtime-process-tree.mjs \
            > "$RUNNER_TEMP/website-matrix/source-inputs.sha256"
      - name: Install the same frozen Node 24 dependency graph
        run: |
          set -euo pipefail
          node -e 'if (process.versions.node.split(".")[0] !== "24") process.exit(1)'
          node --version > "$RUNNER_TEMP/website-matrix/node-version.txt"
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/website-matrix/install.log"
          corepack pnpm@10.32.1 --version > "$RUNNER_TEMP/website-matrix/pnpm-version.txt"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
      - name: Prepare the same official CJK font input as full CI
        timeout-minutes: 3
        env:
          FONT_EVIDENCE_DIR: ${{ runner.temp }}/website-matrix/fonts
        run: bash apps/www/scripts/prepare-homepage-composition-fonts.sh
      - name: Require all diagnostics off and bind the original harness browser selection
        run: |
          node --import tsx --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { chromeExecutable } from './apps/www/src/content/docs/zh-cn/browser-harness.ts';
          const flags = Object.fromEntries(Object.entries(process.env).filter(([key]) => key.startsWith('PROTO_UI_MATRIX_')));
          assert.equal(Object.keys(flags).length, 6);
          assert.ok(Object.values(flags).every((value) => value === '0'));
          const executable = await chromeExecutable();
          assert.equal(executable, process.env.CHROME_PATH);
          const version = execFileSync(executable, ['--version'], { encoding: 'utf8' }).trim();
          assert.match(version, /\b158\./);
          writeFileSync(process.env.RUNNER_TEMP + '/website-matrix/environment.json', JSON.stringify({
            node: process.version, executable, version, flags,
            executableSha256: createHash('sha256').update(readFileSync(executable)).digest('hex'),
            note: 'The unchanged native suite uses this original chromeExecutable resolver and CHROME_PATH. No browser or page is opened by this preparation.',
          }, null, 2) + '\n');
          JS
      - name: Run the complete original four-case Matrix without profiling or filters
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/website-matrix
        run: |
          set -euo pipefail
          date -u +%FT%TZ > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/started-at.txt"
          set +e
          timeout --signal=TERM --kill-after=10s 900s \
            node scripts/test/run-runtime-tests.mjs \
              apps/www/src/content/docs/zh-cn/demo-matrix.browser.test.ts \
              --no-file-parallelism --maxWorkers=1 --minWorkers=1 \
              --reporter=default --reporter=json \
              --outputFile="$PROTO_UI_RUNTIME_EVIDENCE_DIR/vitest.json" \
              2>&1 | tee "$PROTO_UI_RUNTIME_EVIDENCE_DIR/browser.log"
          results=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${results[0]}" > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/command-exit-code.txt"
          printf '%s\n' "${results[1]}" > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/log-exit-code.txt"
          date -u +%FT%TZ > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/completed-at.txt"
          if [ "${results[0]}" -ne 0 ]; then exit "${results[0]}"; fi
          exit "${results[1]}"
      - name: Preserve exact Matrix terminal source even after an original failure
        if: always()
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/website-matrix/source-sha-after.txt"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/website-matrix/status-after.txt"
          sha256sum -c "$RUNNER_TEMP/website-matrix/source-inputs.sha256" > "$RUNNER_TEMP/website-matrix/source-inputs-after.txt"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test ! -s "$RUNNER_TEMP/website-matrix/status-after.txt"
      - name: Require all four original Matrix outcomes and the unprofiled source boundary
        if: always()
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const directory = path.join(process.env.RUNNER_TEMP, 'website-matrix');
          const read = (name) => readFileSync(path.join(directory, name), 'utf8');
          const titles = [
            'mounts every demo in every official Web adapter',
            'keeps the matrix readable at 320px',
            'keeps the matrix readable at 390px',
            'moves focus into the Base Dialog content in every runtime',
          ];
          const result = { source: process.env.CANDIDATE_SHA, expectedTitles: titles, passed: false };
          try {
            const report = JSON.parse(read('vitest.json'));
            result.tests = report.testResults.flatMap((suite) => suite.assertionResults);
            result.environment = JSON.parse(read('environment.json'));
            assert.equal(report.success, true);
            assert.equal(report.numTotalTests, 4);
            assert.equal(report.numPassedTests, 4);
            assert.equal(report.numFailedTests, 0);
            assert.equal(report.numPendingTests, 0);
            assert.equal(report.numTodoTests, 0);
            assert.equal(report.testResults.length, 1);
            assert.equal(path.resolve(report.testResults[0].name), path.resolve('apps/www/src/content/docs/zh-cn/demo-matrix.browser.test.ts'));
            assert.deepEqual(result.tests.map((test) => test.title).sort(), [...titles].sort());
            assert.ok(result.tests.every((test) => test.status === 'passed'));
            assert.match(result.environment.node, /^v24\./);
            assert.match(result.environment.version, /\b158\./);
            assert.equal(result.environment.executable, process.env.CHROME_PATH);
            assert.equal(Object.keys(result.environment.flags).length, 6);
            assert.ok(Object.values(result.environment.flags).every((value) => value === '0'));
            assert.equal(read('product-diff.patch'), '');
            for (const name of ['source-sha.txt', 'source-sha-after.txt']) assert.equal(read(name).trim(), result.source);
            for (const name of ['status-before.txt', 'status-after.txt']) assert.equal(read(name), '');
            for (const name of ['command-exit-code.txt', 'log-exit-code.txt']) assert.equal(read(name).trim(), '0');
            const verifiedInputs = read('source-inputs-after.txt').trim().split('\n');
            assert.equal(verifiedInputs.length, 9);
            assert.ok(verifiedInputs.every((line) => line.endsWith(': OK')));
            const files = readdirSync(directory, { recursive: true });
            assert.ok(files.every((file) => !/(?:^|\/)(?:startup-profile|browser-diagnostic|entry-cost|anatomy-notifications)(?:\/|$)|\.cpuprofile$/.test(file)));
            result.passed = true;
          } catch (error) { result.error = String(error); process.exitCode = 1; }
          writeFileSync(path.join(directory, 'four-case-results.json'), JSON.stringify(result, null, 2) + '\n');
          JS
      - name: Retain complete original Matrix results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-matrix-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/website-matrix
          if-no-files-found: error
          retention-days: 30

  website-matrix-timeline:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'website-matrix-timeline' && inputs.sprint3_acceptance != true && inputs.sprint3_followup != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASTRO_TELEMETRY_DISABLED: '1'
      PROTO_UI_MATRIX_STARTUP_PROFILE: '0'
      PROTO_UI_MATRIX_BROWSER_DIAGNOSTIC: '0'
      PROTO_UI_MATRIX_ENTRY_COST: '0'
      PROTO_UI_MATRIX_TRACE_BEFORE_INIT: '0'
      PROTO_UI_MATRIX_TRACE_LATE: '0'
      PROTO_UI_MATRIX_ANATOMY_NOTIFICATIONS: '0'
      PROTO_UI_MATRIX_LAYOUT_TIMELINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bind f595 product bytes and preserve the complete diagnostic-only source delta
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/website-matrix-timeline"
          git rev-parse HEAD > "$RUNNER_TEMP/website-matrix-timeline/source-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/website-matrix-timeline/source-tree.txt"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/website-matrix-timeline/status-before.txt"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test ! -s "$RUNNER_TEMP/website-matrix-timeline/status-before.txt"
          git diff --exit-code f595e1a0662683cc47a3c68e790e87a70f303c13 HEAD -- \
            apps packages package.json pnpm-lock.yaml vitest.config.ts scripts/test/run-runtime-tests.mjs scripts/test/runtime-process-tree.mjs scripts/test/runtime-test-plan.mjs \
            ':(exclude)apps/www/src/content/docs/zh-cn/demo-matrix.browser.test.ts' \
            ':(exclude)apps/www/src/content/docs/zh-cn/demo-matrix-browser-diagnostic.ts' \
            ':(exclude)apps/www/src/content/docs/zh-cn/demo-matrix-browser-diagnostic.test.ts' \
            > "$RUNNER_TEMP/website-matrix-timeline/product-diff.patch"
          git diff --binary f595e1a0662683cc47a3c68e790e87a70f303c13 HEAD > "$RUNNER_TEMP/website-matrix-timeline/complete-diagnostic-source.patch"
          git diff --binary f595e1a0662683cc47a3c68e790e87a70f303c13 HEAD -- \
            apps/www/src/content/docs/zh-cn/demo-matrix.browser.test.ts \
            apps/www/src/content/docs/zh-cn/demo-matrix-browser-diagnostic.ts \
            apps/www/src/content/docs/zh-cn/demo-matrix-browser-diagnostic.test.ts \
            > "$RUNNER_TEMP/website-matrix-timeline/test-instrumentation.patch"
          sha256sum .github/workflows/browser-suite-repair-evidence.yml pnpm-lock.yaml package.json vitest.config.ts \
            apps/www/src/content/docs/zh-cn/demo-matrix-activation.ts \
            apps/www/src/content/docs/zh-cn/demo-matrix-browser-diagnostic.test.ts \
            scripts/test/runtime-test-plan.mjs \
            apps/www/src/content/docs/zh-cn/demo-matrix.browser.test.ts \
            apps/www/src/content/docs/zh-cn/browser-harness.ts \
            apps/www/src/content/docs/zh-cn/demo-matrix-observation.ts \
            apps/www/src/content/docs/zh-cn/demo-matrix-startup-diagnostic.ts \
            apps/www/src/content/docs/zh-cn/demo-matrix-browser-diagnostic.ts \
            scripts/test/run-runtime-tests.mjs scripts/test/runtime-process-tree.mjs \
            > "$RUNNER_TEMP/website-matrix-timeline/source-inputs.sha256"
      - name: Install the same frozen Node 24 dependency graph
        run: |
          set -euo pipefail
          node -e 'if (process.versions.node.split(".")[0] !== "24") process.exit(1)'
          node --version > "$RUNNER_TEMP/website-matrix-timeline/node-version.txt"
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/website-matrix-timeline/install.log"
          corepack pnpm@10.32.1 --version > "$RUNNER_TEMP/website-matrix-timeline/pnpm-version.txt"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
      - name: Prepare the same official CJK font input as full CI
        timeout-minutes: 3
        env:
          FONT_EVIDENCE_DIR: ${{ runner.temp }}/website-matrix-timeline/fonts
        run: bash apps/www/scripts/prepare-homepage-composition-fonts.sh
      - name: Require the timeline-only envelope and bind the original harness browser selection
        run: |
          node --import tsx --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { chromeExecutable } from './apps/www/src/content/docs/zh-cn/browser-harness.ts';
          const flags = Object.fromEntries(Object.entries(process.env).filter(([key]) => key.startsWith('PROTO_UI_MATRIX_')));
          assert.equal(Object.keys(flags).length, 7);
          assert.equal(flags.PROTO_UI_MATRIX_LAYOUT_TIMELINE, '1');
          assert.ok(Object.entries(flags).every(([key, value]) => value === (key === 'PROTO_UI_MATRIX_LAYOUT_TIMELINE' ? '1' : '0')));
          const executable = await chromeExecutable();
          assert.equal(executable, process.env.CHROME_PATH);
          const version = execFileSync(executable, ['--version'], { encoding: 'utf8' }).trim();
          assert.match(version, /\b158\./);
          writeFileSync(process.env.RUNNER_TEMP + '/website-matrix-timeline/environment.json', JSON.stringify({
            node: process.version, executable, version, flags,
            executableSha256: createHash('sha256').update(readFileSync(executable)).digest('hex'),
            note: 'The original harness selects this browser. Only the first original case adds one bounded timeline; no browser or page is opened by this preparation.',
          }, null, 2) + '\n');
          JS
      - name: Diagnose only the first original Matrix case with one 20s timeline; three cases are not selected
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/website-matrix-timeline
        run: |
          set -euo pipefail
          date -u +%FT%TZ > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/started-at.txt"
          set +e
          timeout --signal=TERM --kill-after=10s 900s \
            node scripts/test/run-runtime-tests.mjs \
              apps/www/src/content/docs/zh-cn/demo-matrix.browser.test.ts \
              --testNamePattern='mounts every demo in every official Web adapter$' \
              --no-file-parallelism --maxWorkers=1 --minWorkers=1 \
              --reporter=default --reporter=json \
              --outputFile="$PROTO_UI_RUNTIME_EVIDENCE_DIR/vitest.json" \
              2>&1 | tee "$PROTO_UI_RUNTIME_EVIDENCE_DIR/browser.log"
          results=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${results[0]}" > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/command-exit-code.txt"
          printf '%s\n' "${results[1]}" > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/log-exit-code.txt"
          date -u +%FT%TZ > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/completed-at.txt"
          if [ "${results[0]}" -ne 0 ]; then exit "${results[0]}"; fi
          exit "${results[1]}"
      - name: Preserve exact Matrix terminal source even after an original failure
        if: always()
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/website-matrix-timeline/source-sha-after.txt"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/website-matrix-timeline/status-after.txt"
          sha256sum -c "$RUNNER_TEMP/website-matrix-timeline/source-inputs.sha256" > "$RUNNER_TEMP/website-matrix-timeline/source-inputs-after.txt"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test ! -s "$RUNNER_TEMP/website-matrix-timeline/status-after.txt"
      - name: Reconcile one selected case, three unselected cases and the bounded non-V8 recording
        if: always()
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const directory = path.join(process.env.RUNNER_TEMP, 'website-matrix-timeline');
          const read = (name) => readFileSync(path.join(directory, name), 'utf8');
          const titles = [
            'mounts every demo in every official Web adapter',
            'keeps the matrix readable at 320px',
            'keeps the matrix readable at 390px',
            'moves focus into the Base Dialog content in every runtime',
          ];
          const result = { source: process.env.CANDIDATE_SHA, diagnosticOnly: true, fullMatrixAcceptance: false,
            selectedTitle: titles[0], notSelectedTitles: titles.slice(1), diagnosticCaptureValid: false };
          try {
            const report = JSON.parse(read('vitest.json'));
            result.tests = report.testResults.flatMap((suite) => suite.assertionResults);
            result.environment = JSON.parse(read('environment.json'));
            assert.equal(report.numTotalTests, 4);
            assert.equal(report.numPassedTests + report.numFailedTests, 1);
            assert.equal(report.numPendingTests, 3);
            assert.equal(report.numTodoTests, 0);
            assert.equal(report.testResults.length, 1);
            assert.equal(path.resolve(report.testResults[0].name), path.resolve('apps/www/src/content/docs/zh-cn/demo-matrix.browser.test.ts'));
            assert.deepEqual(result.tests.map((test) => test.title).sort(), [...titles].sort());
            const selected = result.tests.filter((test) => test.title === titles[0]);
            assert.equal(selected.length, 1);
            assert.ok(['passed', 'failed'].includes(selected[0].status));
            assert.ok(result.tests.filter((test) => test.title !== titles[0]).every((test) => test.status === 'pending'));
            result.nativeOutcome = selected[0].status;
            result.nativeExitCode = Number(read('command-exit-code.txt').trim());
            assert.equal(result.nativeExitCode, selected[0].status === 'passed' ? 0 : 1);
            assert.equal(report.success, selected[0].status === 'passed');
            assert.equal(read('log-exit-code.txt').trim(), '0');
            assert.match(result.environment.node, /^v24\./);
            assert.match(result.environment.version, /\b158\./);
            assert.equal(result.environment.executable, process.env.CHROME_PATH);
            const flags = result.environment.flags;
            assert.equal(Object.keys(flags).length, 7);
            assert.equal(flags.PROTO_UI_MATRIX_LAYOUT_TIMELINE, '1');
            assert.ok(Object.entries(flags).every(([key, value]) => value === (key === 'PROTO_UI_MATRIX_LAYOUT_TIMELINE' ? '1' : '0')));
            assert.equal(read('product-diff.patch'), '');
            assert.ok(read('complete-diagnostic-source.patch').length > 0);
            assert.ok(read('test-instrumentation.patch').length > 0);
            for (const name of ['source-sha.txt', 'source-sha-after.txt']) assert.equal(read(name).trim(), result.source);
            for (const name of ['status-before.txt', 'status-after.txt']) assert.equal(read(name), '');
            const verifiedInputs = read('source-inputs-after.txt').trim().split('\n');
            assert.equal(verifiedInputs.length, 14);
            assert.ok(verifiedInputs.every((line) => line.endsWith(': OK')));
            const files = readdirSync(directory, { recursive: true });
            assert.ok(files.every((file) => !/(?:^|\/)(?:startup-profile|browser-diagnostic|entry-cost|anatomy-notifications)(?:\/|$)|\.cpuprofile$/.test(file)));
            const status = JSON.parse(read('demo-matrix/browser-timeline/status.json'));
            result.timeline = status;
            assert.equal(status.sourceSha, result.source);
            assert.ok(status.caseName.endsWith(titles[0]));
            assert.equal(status.traceMode, 'timeline');
            assert.equal(status.diagnosticOnly, true);
            assert.equal(status.finished, true);
            assert.equal(status.commandLimitMs, 2000);
            assert.equal(status.ownerLimitMs, 180000);
            assert.equal(status.cpu.state, 'disabled-for-timeline');
            assert.equal(status.cpu.sampleCount, 0);
            const trace = status.trace;
            assert.deepEqual(trace.categories, ['devtools.timeline', 'toplevel']);
            assert.equal(trace.requestedWindowMs, 20000);
            assert.equal(trace.bufferLimitBytes, 16 * 1024 * 1024);
            assert.equal(trace.outputEventLimitBytes, 16 * 1024 * 1024);
            assert.equal(trace.outputChunkLimit, 256);
            assert.equal(trace.state, 'complete');
            assert.equal(trace.stopReason, 'checkpoint');
            const clocks = ['startAcknowledgedAt', 'stopRequestedAt', 'stopAcknowledgedAt', 'completeAt'].map((key) => Date.parse(trace[key]));
            assert.ok(clocks.every(Number.isFinite));
            assert.ok(clocks[1] >= clocks[0] && clocks[2] >= clocks[1] && clocks[3] >= clocks[1]);
            result.requestedWindowMs = trace.requestedWindowMs;
            result.observedTraceRequestWindowMs = clocks[1] - clocks[0];
            assert.equal(trace.dataLossOccurred, false);
            assert.equal(trace.outputTruncated, false);
            assert.equal(trace.projectionTruncated, false);
            assert.equal(trace.bufferedEvents, 0);
            assert.equal(trace.bufferedBytes, 0);
            const chunks = files.filter((file) => /^demo-matrix\/browser-timeline\/trace-\d+\.json$/.test(file)).sort();
            assert.equal(chunks.length, trace.chunks);
            assert.ok(chunks.length > 0 && chunks.length <= 256);
            let bytes = 0;
            const events = chunks.flatMap((file) => {
              const raw = read(file);
              bytes += Buffer.byteLength(raw);
              const chunk = JSON.parse(raw);
              assert.equal(chunk.sourceSha, result.source);
              assert.equal(chunk.traceMode, 'timeline');
              return chunk.traceEvents;
            });
            assert.equal(bytes, trace.retainedBytes);
            assert.ok(bytes <= 16 * 1024 * 1024);
            assert.equal(events.length, trace.retainedEvents);
            assert.equal(events.length, trace.receivedEvents);
            assert.ok(events.every((event) => !/Profile|Heap/.test(event.name ?? '') && !/cpu_profiler|memory-infra/.test(event.cat ?? '')));
            const counts = {};
            for (const event of events) counts[event.name] = (counts[event.name] ?? 0) + 1;
            result.eventCounts = counts;
            assert.ok(counts.Layout > 0 && counts.UpdateLayoutTree > 0);
            assert.ok(Object.keys(counts).some((name) => name.includes('RunTask')));
            const durations = events.filter((event) => ['X', 'B', 'E'].includes(event.ph));
            assert.ok(durations.length > 0);
            assert.ok(durations.every((event) => Number.isFinite(event.ts) && (event.ph !== 'X' || (Number.isFinite(event.dur) && event.dur >= 0))));
            assert.ok(events.some((event) => event.ph === 'M' && event.name === 'thread_name' && event.args?.name === 'CrRendererMain'));
            result.durationEvents = durations.length;
            result.paintEventsObserved = counts.Paint ?? 0;
            result.diagnosticCaptureValid = true;
          } catch (error) { result.error = String(error); process.exitCode = 1; }
          writeFileSync(path.join(directory, 'timeline-case-results.json'), JSON.stringify(result, null, 2) + '\n');
          JS
      - name: Retain the diagnostic delta, selected/unselected outcomes and complete bounded timeline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-matrix-timeline-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/website-matrix-timeline
          if-no-files-found: error
          retention-days: 30

  # A separate opt-in preserves the original repair and Sprint 1 selections.
  # This is two oracle controls plus one original public Popover matrix, not
  # acceptance of the complete homepage suite or the complete CI selection.
  contents-wheel:
    if: ${{ inputs.scope == 'contents-wheel' && inputs.sprint3_acceptance != true && inputs.sprint3_followup != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Prepare evidence retention before checkout and setup
        run: |
          set -euo pipefail
          export CONTENTS_WHEEL_EVIDENCE_DIR="$RUNNER_TEMP/contents-wheel"
          export PROTO_UI_RUNTIME_EVIDENCE_DIR="$CONTENTS_WHEEL_EVIDENCE_DIR/runtime"
          printf '%s\n' "CONTENTS_WHEEL_EVIDENCE_DIR=$CONTENTS_WHEEL_EVIDENCE_DIR" \
            "PROTO_UI_RUNTIME_EVIDENCE_DIR=$PROTO_UI_RUNTIME_EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$CONTENTS_WHEEL_EVIDENCE_DIR"
          printf '%s\n' "$CANDIDATE_SHA" > "$CONTENTS_WHEEL_EVIDENCE_DIR/requested-source-sha.txt"
          cat > "$CONTENTS_WHEEL_EVIDENCE_DIR/record-source.mjs" <<'JS'
          import { spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { copyFileSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          const directory = process.env.CONTENTS_WHEEL_EVIDENCE_DIR;
          const phase = process.argv[2];
          const command = (file, args) => {
            const result = spawnSync(file, args, { encoding: 'utf8' });
            return { status: result.status, stdout: result.stdout ?? '', stderr: result.stderr ?? '', error: result.error?.message ?? null };
          };
          const source = command('git', ['rev-parse', 'HEAD']);
          const status = command('git', ['status', '--porcelain=v1', '--untracked-files=all']);
          const hashFile = (file) => {
            try {
              const bytes = readFileSync(file);
              return { path: file, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') };
            } catch (error) { return { path: file, error: String(error) }; }
          };
          const sourceFiles = [
            '.github/workflows/browser-suite-repair-evidence.yml', 'pnpm-lock.yaml',
            'apps/www/package.json', 'apps/www/scripts/generate-website-prototype-tokens.mjs',
            'apps/www/scripts/prepare-homepage-composition-fonts.sh',
            'apps/www/src/content/docs/zh-cn/browser-harness.ts',
            'apps/www/src/content/docs/zh-cn/contents-wheel-evidence.ts',
            'apps/www/src/content/docs/zh-cn/contents-wheel-evidence.browser.test.ts',
            'apps/www/src/content/docs/zh-cn/homepage-dogfood.browser.test.ts',
            'apps/www/src/styles/site-contents-command.css',
            'packages/modules/positioning/src/web/floating-ui-host.ts',
            'packages/modules/positioning/src/web/owned-style-lease.ts',
            'packages/modules/positioning/src/web/root-space-observer.ts',
            'packages/modules/positioning/test/floating-ui-host.test.ts',
            'packages/modules/positioning/test/floating-ui-host-intrinsic-invalidation.test.ts',
            'packages/modules/positioning/test/available-projection-ownership.test.ts',
            'packages/modules/positioning/test/lease-generation.test.ts',
            'packages/modules/positioning/test/owned-style-lease.test.ts',
          ].map(hashFile);
          // Actual outputs of apps-www generate:proto-ui-style, including the
          // ignored CSS/Shadow artifacts that git status cannot account for.
          const generatedFiles = [
            'shadcn-theme.css', 'proto-ui-style.css', 'proto-ui-tokens.generated.css',
            'proto-ui-shadow-style.generated.js', 'proto-ui-shadow-style.generated.d.ts',
          ].map((name) => hashFile(`apps/www/src/styles/${name}`));
          const archive = path.join(directory, phase, 'generated');
          mkdirSync(archive, { recursive: true });
          for (const file of generatedFiles) {
            if (!file.error) copyFileSync(file.path, path.join(archive, path.basename(file.path)));
          }
          const record = {
            phase, observedAt: new Date().toISOString(), expectedSha: process.env.CANDIDATE_SHA,
            source, status, dirty: status.status === 0 ? status.stdout !== '' : null,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            event: process.env.GITHUB_EVENT_NAME, ref: process.env.GITHUB_REF,
            node: process.version, platform: process.platform, arch: process.arch, os: os.release(),
            chromePath: process.env.CHROME_PATH ?? null,
            chrome: process.env.CHROME_PATH ? command(process.env.CHROME_PATH, ['--version']) : null,
            sourceFiles, generatedFiles,
          };
          writeFileSync(path.join(directory, `${phase}.json`), JSON.stringify(record, null, 2) + '\n');
          writeFileSync(path.join(directory, `${phase}-git-status.txt`), status.stdout + status.stderr);
          if (source.status !== 0 || source.stdout.trim() !== process.env.CANDIDATE_SHA || status.status !== 0)
            throw new Error('Could not bind evidence to the requested source and worktree state');
          JS
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the locked toolchain and official browser surface
        id: setup
        timeout-minutes: 4
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile 2>&1 | tee "$CONTENTS_WHEEL_EVIDENCE_DIR/install.log"
          corepack pnpm@10.32.1 --version | tee "$CONTENTS_WHEEL_EVIDENCE_DIR/pnpm-version.txt"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version | tee "$CONTENTS_WHEEL_EVIDENCE_DIR/browser-version.txt"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar 2>&1 | tee "$CONTENTS_WHEEL_EVIDENCE_DIR/toolbar-disable.log"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled 2>&1 | tee "$CONTENTS_WHEEL_EVIDENCE_DIR/toolbar-preference.log"
      - name: Prepare the same official CJK font input as full CI
        timeout-minutes: 3
        env:
          FONT_EVIDENCE_DIR: ${{ runner.temp }}/contents-wheel/fonts
        run: bash apps/www/scripts/prepare-homepage-composition-fonts.sh
      - name: Record source and actual CSS before native execution
        id: before
        run: node "$CONTENTS_WHEEL_EVIDENCE_DIR/record-source.mjs" beforeTest
      - name: Run both original native cancellation controls
        if: ${{ !cancelled() && steps.before.outcome == 'success' }}
        run: |
          set -uo pipefail
          set +e
          corepack pnpm@10.32.1 exec vitest run --no-file-parallelism \
            apps/www/src/content/docs/zh-cn/contents-wheel-evidence.browser.test.ts \
            --reporter=default --reporter=json \
            --outputFile="$CONTENTS_WHEEL_EVIDENCE_DIR/controls-vitest.json" \
            2>&1 | tee "$CONTENTS_WHEEL_EVIDENCE_DIR/controls.log"
          results=("${PIPESTATUS[@]}")
          printf '%s\n' "${results[0]}" > "$CONTENTS_WHEEL_EVIDENCE_DIR/controls-exit-code.txt"
          if [ "${results[0]}" -ne 0 ]; then exit "${results[0]}"; fi
          exit "${results[1]}"
      - name: Run the unchanged public Popover matrix with native input
        if: ${{ !cancelled() && steps.before.outcome == 'success' }}
        run: |
          set -uo pipefail
          set +e
          corepack pnpm@10.32.1 exec vitest run --no-file-parallelism \
            apps/www/src/content/docs/zh-cn/homepage-dogfood.browser.test.ts \
            --testNamePattern='^Homepage end-to-end dogfood boundary uses real family Popover Triggers through all four Docs runtimes with keyboard and exact-source visual evidence$' \
            --reporter=default --reporter=json \
            --outputFile="$CONTENTS_WHEEL_EVIDENCE_DIR/popover-vitest.json" \
            2>&1 | tee "$CONTENTS_WHEEL_EVIDENCE_DIR/popover.log"
          results=("${PIPESTATUS[@]}")
          printf '%s\n' "${results[0]}" > "$CONTENTS_WHEEL_EVIDENCE_DIR/popover-exit-code.txt"
          if [ "${results[0]}" -ne 0 ]; then exit "${results[0]}"; fi
          exit "${results[1]}"
      - name: Preserve source state and actual generated CSS even after failure
        if: always()
        run: node "$CONTENTS_WHEEL_EVIDENCE_DIR/record-source.mjs" afterTest
      - name: Require exactly two executed controls and the original matrix result
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const directory = process.env.CONTENTS_WHEEL_EVIDENCE_DIR;
          const plans = [
            { id: 'controls', file: 'apps/www/src/content/docs/zh-cn/contents-wheel-evidence.browser.test.ts', titles: [
              'preserves native cancellation=false and current dialog identity',
              'preserves native cancellation=true and current dialog identity',
            ] },
            { id: 'popover', file: 'apps/www/src/content/docs/zh-cn/homepage-dogfood.browser.test.ts', titles: [
              'uses real family Popover Triggers through all four Docs runtimes with keyboard and exact-source visual evidence',
            ] },
          ];
          const results = plans.map((plan) => {
            try {
              const report = JSON.parse(readFileSync(path.join(directory, `${plan.id}-vitest.json`), 'utf8'));
              const suites = report.testResults ?? [];
              const assertions = suites.flatMap((suite) => suite.assertionResults ?? []);
              const selected = assertions.filter((test) => plan.titles.includes(test.title));
              const executed = assertions.filter((test) => ['passed', 'failed'].includes(test.status));
              const exactScope = suites.length === 1 && suites[0].name === path.resolve(plan.file)
                && plan.titles.every((title) => selected.filter((test) => test.title === title).length === 1)
                && selected.every((test) => ['passed', 'failed'].includes(test.status))
                && executed.length === plan.titles.length;
              return { ...plan, exactScope, passed: exactScope && report.success === true && selected.every((test) => test.status === 'passed'),
                collected: assertions.length, executed: executed.length,
                skipped: assertions.filter((test) => !['passed', 'failed'].includes(test.status)).length,
                selected: selected.map(({ title, fullName, status, failureMessages }) => ({ title, fullName, status, failureMessages })) };
            } catch (error) { return { ...plan, exactScope: false, passed: false, error: String(error) }; }
          });
          let generatedEvidence;
          try {
            const after = JSON.parse(readFileSync(path.join(directory, 'afterTest.json'), 'utf8'));
            generatedEvidence = { complete: after.generatedFiles.length === 5
              && after.generatedFiles.every((file) => !file.error && /^[a-f0-9]{64}$/.test(file.sha256)),
              files: after.generatedFiles };
          } catch (error) { generatedEvidence = { complete: false, error: String(error) }; }
          writeFileSync(path.join(directory, 'selection-results.json'), JSON.stringify({
            expectedSha: process.env.CANDIDATE_SHA,
            scope: 'Two authored native oracle controls and one original public Popover matrix; not complete homepage or CI acceptance',
            results, generatedEvidence,
          }, null, 2) + '\n');
          if (results.some((result) => !result.passed) || !generatedEvidence.complete) process.exitCode = 1;
          JS
      - name: Retain every focused result and failure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contents-wheel-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contents-wheel
          if-no-files-found: error
          retention-days: 30

  sprint1:
    if: ${{ inputs.scope == 'sprint1' && inputs.sprint3_acceptance != true && inputs.sprint3_followup != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bind the complete selection before setup
        run: node scripts/test/sprint1-evidence.mjs prepare "$RUNNER_TEMP/sprint1"
      - name: Install the locked toolchain and configure the official evidence surface
        timeout-minutes: 4
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version | tee "$RUNNER_TEMP/sprint1/browser.txt"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
      - name: Collect every selected terminal result serially
        if: ${{ !cancelled() }}
        timeout-minutes: 80
        run: node scripts/test/sprint1-evidence.mjs run "$RUNNER_TEMP/sprint1"
      - name: Require complete source-bound receipts and retain missing outcomes
        if: always()
        run: node scripts/test/sprint1-evidence.mjs finish "$RUNNER_TEMP/sprint1"
      - name: Retain all selected results including original failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint1-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sprint1
          if-no-files-found: error
          retention-days: 30

  # Explicit manual opt-in; ordinary repair and reusable cycle calls stay unchanged.
  sprint3-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.sprint3_acceptance == true
    uses: ./.github/workflows/sprint3-consumer-evidence.yml
    permissions:
      contents: read

  # Separate explicit opt-in; the original five acceptance lanes stay unchanged.
  sprint3-followup:
    if: github.event_name == 'workflow_dispatch' && inputs.sprint3_followup == true
    uses: ./.github/workflows/sprint3-followup-evidence.yml
    permissions:
      contents: read

name: Browser suite repair evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch-motion-restoration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bind the source and test delta
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/switch-motion-restoration
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          source=$(git rev-parse HEAD^)
          test "$(git diff --name-only "$source" HEAD)" = '.github/workflows/browser-suite-repair-evidence.yml'
          test "$(git rev-parse "$source^" )" = '37a4999352892c6ba2721ce4caed0dcf630976d0'
          test "$(git diff --name-only "$source^" "$source")" = 'packages/prototypes/shadcn/test/switch-motion.browser.test.ts'
          git checkout --detach "$source"
          git rev-parse HEAD > "$EVIDENCE_DIR/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE_DIR/source-tree.txt"
          sha256sum packages/prototypes/shadcn/test/switch-motion.browser.test.ts > "$EVIDENCE_DIR/fixture-sha256.txt"
      - name: Install locked workspace dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$chrome" --version > "$EVIDENCE_DIR/browser.txt"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
      - name: Exercise live preference changes on the mounted control
        run: |
          set -euo pipefail
          export PUI_FINF_FEATURE_EVIDENCE_DIR="$EVIDENCE_DIR/samples"
          corepack pnpm@10.32.1 exec vitest run packages/prototypes/shadcn/test/switch-motion.browser.test.ts \
            --no-file-parallelism --maxWorkers=1 -t 'New York .* Switch' \
            --reporter=default --reporter=json --outputFile="$EVIDENCE_DIR/vitest.json" \
            2>&1 | tee "$EVIDENCE_DIR/browser.log"
      - name: Retain successful and failed observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switch-motion-restoration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/switch-motion-restoration/
          if-no-files-found: error
          retention-days: 30

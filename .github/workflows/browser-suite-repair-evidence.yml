name: Browser suite repair evidence

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: browser-suite-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - control: baseline
            source: a6dd2a9a4d41cdf26c2c27b04a0bddb98180c0e1
          - control: repaired
            source: fdb275905810a2103308b490a731b3eb80bfc01b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Exercise Shadow closeout in native Chrome
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser-suite-repair"
          test "$(git rev-parse HEAD)" = '${{ matrix.source }}'
          git rev-parse HEAD > "$RUNNER_TEMP/browser-suite-repair/source-sha.txt"
          "$CHROME_PATH" --version > "$RUNNER_TEMP/browser-suite-repair/browser.txt"
          corepack pnpm@10.32.1 exec vitest run --maxWorkers=1 --no-file-parallelism \
            --reporter=json --outputFile="$RUNNER_TEMP/browser-suite-repair/vitest.json" \
            packages/adapters/web-component/test/shadow-closeout.browser.test.ts
      - name: Retain source-bound Shadow results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-closeout-${{ matrix.control }}-${{ matrix.source }}-${{ github.run_id }}
          path: ${{ runner.temp }}/browser-suite-repair
          if-no-files-found: warn
          retention-days: 30

name: Browser suite repair evidence
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: color-lifetime-diagnostic-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shadcn-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare the locked dependencies and browser
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/color-lifetime-diagnostic"
          "$CHROME" --version | tee "$RUNNER_TEMP/color-lifetime-diagnostic/browser.txt"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
      - name: Record physical color scheme lifetime samples
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/color-lifetime-diagnostic
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = c5aa7bbb183a40f775198bc965187127aa9dde38
          git rev-parse HEAD > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/source-sha.txt"
          corepack pnpm@10.32.1 exec vitest run --maxWorkers=1 --minWorkers=1 --no-file-parallelism \
            apps/www/test/color-scheme.browser.test.ts \
            --reporter=default --reporter=json \
            --outputFile.json="$PROTO_UI_RUNTIME_EVIDENCE_DIR/vitest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: color-lifetime-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/color-lifetime-diagnostic
          if-no-files-found: warn
          retention-days: 30

          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync, spawnSync } from 'node:child_process';

          // Embedded verbatim in the carrier workflow; run only on the real hosted checkout.
          const [stage, manifestPath] = process.argv.slice(2);
          assert(['before-setup', 'before-native', 'after-native'].includes(stage));
          const evidence = process.env.EVIDENCE_DIR;
          assert(evidence && path.isAbsolute(evidence));
          const expected = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const hash = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const blobOid = (bytes) => createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');

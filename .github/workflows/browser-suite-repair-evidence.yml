name: Browser suite repair evidence

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: browser-suite-repair-${{ github.ref }}
  cancel-in-progress: false

env:
  PROTO_UI_EXPECTED_REVISION: 981c664aadd6a65c112c0af05468de9e9aef3f90

jobs:
  focused-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PROTO_UI_EXPECTED_REVISION }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Disable only the supported Astro development toolbar
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
      - name: Run the registered Website markup provenance suite
        timeout-minutes: 12
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PROTO_UI_EXPECTED_REVISION"
          evidence="$RUNNER_TEMP/pui834"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          "$CHROME_PATH" --version > "$evidence/chromium-version.txt"
          corepack pnpm@10.32.1 exec vitest run --no-file-parallelism \
            --reporter=default --reporter=json --outputFile.json="$evidence/vitest.json" \
            apps/www/src/content/docs/zh-cn/website-markup-provenance.browser.test.ts \
            2>&1 | tee "$evidence/browser.log"
      - name: Retain provenance receipts and browser output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-markup-provenance-${{ env.PROTO_UI_EXPECTED_REVISION }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pui834
          if-no-files-found: error
          retention-days: 30

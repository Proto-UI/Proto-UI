name: Browser suite repair evidence

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: browser-suite-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0fcb75d454d9ddd5df870b479b61dbc60ef30a37
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Disable only the supported Astro development toolbar
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
      - name: Exercise native Select entry focus
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser-suite-repair"
          test "$(git rev-parse HEAD)" = 0fcb75d454d9ddd5df870b479b61dbc60ef30a37
          git rev-parse HEAD > "$RUNNER_TEMP/browser-suite-repair/source-sha.txt"
          "$CHROME_PATH" --version > "$RUNNER_TEMP/browser-suite-repair/browser.txt"
          corepack pnpm@10.32.1 exec vitest run --no-file-parallelism \
            --reporter=json --outputFile="$RUNNER_TEMP/browser-suite-repair/vitest.json" \
            apps/www/src/content/docs/zh-cn/demo-select-first-paint.browser.test.ts \
            apps/www/src/content/docs/zh-cn/demo-select-draft-projections.browser.test.ts
      - name: Retain Select browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-repair-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/browser-suite-repair
          if-no-files-found: warn
          retention-days: 30

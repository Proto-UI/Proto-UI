name: Browser suite repair evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE_SHA: 6d53491469ebb179112b8c4acca452d9d01788ec
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Exercise full Shadow closeout suite in native Chrome
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/shadow-reconnect"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          "$CHROME_PATH" --version > "$evidence/browser.txt"
          sha256sum packages/adapters/web-component/test/shadow-closeout.browser.test.ts > "$evidence/source-file.txt"
          corepack pnpm@10.32.1 exec vitest run --maxWorkers=1 --no-file-parallelism \
            --reporter=json --outputFile="$evidence/vitest.json" \
            packages/adapters/web-component/test/shadow-closeout.browser.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-reconnect-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shadow-reconnect
          if-no-files-found: error
          retention-days: 30

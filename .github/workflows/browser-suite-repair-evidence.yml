            for (const record of bytes.toString('utf8').split('\0').filter(Boolean)) {
              const tab = record.indexOf('\t');
              assert(tab > 0);
              const [mode, type, oid] = record.slice(0, tab).split(' ');
              const file = record.slice(tab + 1);
              assert(!entries.has(file), 'Duplicate native tree member');
              entries.set(file, { mode, type, oid });
            }
            return entries;
          }
          try {
            const head = git('head.txt', ['rev-parse', 'HEAD']).toString('utf8').trim();
            const tree = git('tree.txt', ['rev-parse', 'HEAD^{tree}']).toString('utf8').trim();
            report.head = head;
            report.tree = tree;
            report.actualEnvironment = Object.fromEntries([
              'CI', 'GITHUB_ACTIONS', 'GITHUB_SHA', 'CANDIDATE_SHA', 'GITHUB_REPOSITORY',
              'GITHUB_EVENT_NAME', 'GITHUB_REF', 'GITHUB_WORKFLOW_REF', 'GITHUB_WORKFLOW_SHA',
              'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_ACTOR', 'RUNNER_OS', 'RUNNER_ARCH',
              'CHROME_PATH', 'PUI_FINF_FEATURE_GROUP', 'PUI_FINF_PRESET_CHECK',
              'PROTO_UI_RUNTIME_PHASE', 'PROTO_UI_RUNTIME_SHARD', 'PROTO_UI_RUNTIME_SLOT',
            ].map((key) => [key, process.env[key] ?? null]));
            assert.equal(process.env.CI, 'true');
            assert.equal(process.env.GITHUB_ACTIONS, 'true');
            assert.equal(process.env.GITHUB_EVENT_NAME, 'workflow_dispatch');
            assert.equal(process.env.GITHUB_REPOSITORY, 'Proto-UI/Proto-UI');
            assert.equal(process.env.GITHUB_SHA, head, 'Actual event SHA and checkout differ');
            assert.equal(process.env.CANDIDATE_SHA, head, 'Candidate must be the actual carrier SHA');
            assert.notEqual(head, expected.primaryHead, 'A workflow carrier must retain its own identity');
            assert.equal(process.versions.node.split('.')[0], '24');
            const raw = git('commit.raw', ['cat-file', 'commit', head]);
            const boundary = raw.indexOf('\n\n');
            assert(boundary > 0);
            const headers = raw.subarray(0, boundary).toString('utf8').split('\n');
            assert.deepEqual(headers.filter((line) => line.startsWith('parent ')), [`parent ${expected.primaryHead}`]);
            assert(headers.includes(`tree ${tree}`));
            git('commit-display.txt', ['show', '--no-patch', '--format=raw', head]);
            const primaryTree = git('original-tree.txt', ['rev-parse', `${expected.primaryHead}^{tree}`])
              .toString('utf8').trim();
            assert.equal(primaryTree, expected.primaryTree);
            const original = members(git('original-members.z', ['ls-tree', '-r', '-z', expected.primaryHead]));
            const carrier = members(git('carrier-members.z', ['ls-tree', '-r', '-z', head]));
            git('complete-carrier-tree.z', ['ls-tree', '-r', '-t', '-z', head]);
            assert.equal(carrier.size, original.size);
            const sourceDelta = git('complete-source-diff.z', ['diff-tree', '--no-commit-id', '--name-only',
              '-r', '-z', expected.primaryHead, head]).toString('utf8').split('\0').filter(Boolean);
            report.sourceDelta = sourceDelta;
            assert.deepEqual(sourceDelta, [expected.workflowPath]);
            for (const [file, member] of original) {
              if (file !== expected.workflowPath) assert.deepEqual(carrier.get(file), member,
                `Unexpected source-tree change: ${file}`);
            }
            for (const entry of expected.inputs) {
              const bytes = fs.readFileSync(entry.path);
              report.files.push({ path: entry.path, bytes: bytes.length, sha256: hash(bytes),
                gitBlobOid: blobOid(bytes), carrierMember: carrier.get(entry.path), originalMember: original.get(entry.path) });
            }
            for (const [index, entry] of expected.inputs.entries()) {
              const actual = report.files[index];
              const member = { mode: entry.mode, type: entry.type, oid: entry.sha };
              // The workflow is the sole admitted source delta; record its real current bytes.
              assert.deepEqual(actual.originalMember, member);
              if (entry.path === expected.workflowPath) {
                assert.equal(actual.gitBlobOid, actual.carrierMember.oid);
                assert.notEqual(actual.gitBlobOid, entry.sha);
                fs.copyFileSync(entry.path, path.join(evidence, 'actual-workflow.yml'));
                continue;
              }
              assert.equal(actual.bytes, entry.bytes);
              assert.equal(actual.sha256, entry.sha256);
              assert.equal(actual.gitBlobOid, entry.sha);
              assert.deepEqual(actual.carrierMember, member);
            }
            const diff = git('tracked-diff.txt', ['diff', '--name-only', 'HEAD']);
            const status = git('status.txt', ['status', '--porcelain', '--untracked-files=all']);
            report.trackedDiffBytes = diff.length;
            report.statusBytes = status.length;
            assert.equal(diff.length, 0, 'Tracked checkout changes remain a source-admission failure');
            assert.equal(status.length, 0, 'The complete native checkout is not clean');
            const event = fs.readFileSync(process.env.GITHUB_EVENT_PATH);
            write('event.json', event);
            report.eventBytes = event.length;
            report.eventSha256 = hash(event);
            const eventValue = JSON.parse(event.toString('utf8'));
            assert.equal(eventValue.repository?.full_name, 'Proto-UI/Proto-UI');
            assert.equal(`refs/heads/${eventValue.ref.replace(/^refs\/heads\//, '')}`, process.env.GITHUB_REF);
            report.frozenSourceRelation = 'Original PR1489 source-equivalent carrier; no combined-main acceptance.';
            report.acceptedPlanSha256 = expected.acceptedPlanSha256;
            if (stage === 'before-setup') {
              // Native objects retain every tracked blob, including hidden paths and symlinks.
              // Git attributes cannot omit or substitute bytes in a Git object pack.
              const file = path.join(evidence, 'carrier-source.pack');
              const fd = fs.openSync(file, 'wx', 0o600);
              let packed;
              try {
                packed = spawnSync('git', ['pack-objects', '--stdout', '--revs'], {
                  input: Buffer.from(`${head}\n`), stdio: ['pipe', fd, 'pipe'], timeout: 60_000,
                });
              } finally {
                fs.closeSync(fd);
              }
              write('source-pack-command.json', JSON.stringify({ argv: ['git', 'pack-objects', '--stdout', '--revs'],
                stdin: `${head}\n`, status: packed.status, signal: packed.signal,
                error: packed.error ? String(packed.error) : null, stderr: String(packed.stderr ?? '') }, null, 2));
              assert.equal(packed.error, undefined);
              assert.equal(packed.signal, null);
              assert.equal(packed.status, 0);
              report.sourceArchive = { file: 'carrier-source.pack', format: 'Native Git object pack',
                bytes: fs.statSync(file).size, head, tree, shallowBoundary: 'Actual actions/checkout depth=2' };
            }
            const generated = 'apps/www/src/generated/cli-init.generated.json';
            if (fs.existsSync(generated)) {
              const bytes = fs.readFileSync(generated);
              report.generatedCliFixture = { path: generated, bytes: bytes.length, sha256: hash(bytes),
                scope: 'Observed generated fixture; no substitute or fabricated source.' };
              write('cli-init.generated.json', bytes);
            } else {
              report.generatedCliFixture = { path: generated, present: false };
            }
            report.admitted = true;
          } catch (error) {
            report.error = { name: error?.name ?? typeof error, message: String(error?.message ?? error),
              stack: typeof error?.stack === 'string' ? error.stack : null };
            throw error;
          } finally {
            write('source-admission.json', JSON.stringify(report, null, 2) + '\n');
          }
          PR1489_SOURCE_ADMISSION
          cat > "$EVIDENCE_DIR/artifact-inventory.mjs" <<'PR1489_ARTIFACT_INVENTORY'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';

          // Embedded verbatim in the workflow; preserve bytes and outcomes without a pass inference.
          const root = process.env.EVIDENCE_DIR;
          const outcomes = Object.fromEntries(Object.entries(process.env)
            .filter(([key]) => key.startsWith('OUTCOME_')));
          fs.writeFileSync(path.join(root, 'step-outcomes.json'), JSON.stringify({
            observedAt: new Date().toISOString(), lane: process.env.MATRIX_LANE,
            outcomes, acceptance: 'Unassessed. Inspect native results, exact inventory and captures independently.',
          }, null, 2) + '\n');
          const files = [];
          async function visit(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true }).sort((a, b) => a.name.localeCompare(b.name))) {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) await visit(file);
              else if (entry.isFile()) {
                const digest = createHash('sha256');
                for await (const chunk of fs.createReadStream(file)) digest.update(chunk);
                files.push({ path: path.relative(root, file), bytes: fs.statSync(file).size, sha256: digest.digest('hex') });
              } else if (entry.isSymbolicLink()) {
                files.push({ path: path.relative(root, file), type: 'symlink', target: fs.readlinkSync(file) });
              } else {
                throw new Error(`Unsupported native artifact kind: ${file}`);
              }
            }
          }
          await visit(root);
          fs.writeFileSync(path.join(root, 'artifact-files.json'), JSON.stringify({
            scope: 'Complete artifact directory before upload; artifact-files.json excludes its own recursive digest.',
            files, imageCount: files.filter((file) => /\.(png|jpe?g|webp)$/i.test(file.path)).length,
          }, null, 2) + '\n', { flag: 'wx' });
          PR1489_ARTIFACT_INVENTORY
          node "$EVIDENCE_DIR/source-admission.mjs" before-setup "$EVIDENCE_DIR/source-custody.json"
      - name: Install the locked graph and build the real CLI prerequisite
        id: prerequisite
        shell: bash
        run: |
          set -euo pipefail
          cat > "$EVIDENCE_DIR/prerequisite-command.txt" <<'PR1489_PREREQUISITE'
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          corepack pnpm@10.32.1 --filter @proto.ui/cli build
          PR1489_PREREQUISITE
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/prerequisite-started-at.txt"
          set +e
          (
            set -euo pipefail
            corepack enable
            corepack pnpm@10.32.1 install --frozen-lockfile
            corepack pnpm@10.32.1 --filter @proto.ui/cli build
          ) 2>&1 | tee "$EVIDENCE_DIR/prerequisite.log"
          codes=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${codes[0]}" > "$EVIDENCE_DIR/prerequisite-exit-code.txt"
          printf '%s\n' "${codes[1]}" > "$EVIDENCE_DIR/prerequisite-tee-exit-code.txt"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/prerequisite-finished-at.txt"
          if (( codes[0] != 0 )); then exit "${codes[0]}"; fi
          exit "${codes[1]}"
      - name: Record the real browser and install the existing official font prerequisite
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -x "$CHROME"
          printf 'CHROME_PATH=%s\n' "$CHROME" >> "$GITHUB_ENV"
          printf '%s\n' "$CHROME" > "$EVIDENCE_DIR/chrome-path.txt"
          "$CHROME" --version > "$EVIDENCE_DIR/chrome-version.txt"
          node --version > "$EVIDENCE_DIR/node-version.txt"
          corepack pnpm@10.32.1 --version > "$EVIDENCE_DIR/pnpm-version.txt"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/fonts-started-at.txt"
          set +e
          (
            set -euo pipefail
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
            dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk
          ) 2>&1 | tee "$EVIDENCE_DIR/fonts.log"
          codes=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${codes[0]}" > "$EVIDENCE_DIR/fonts-exit-code.txt"
          printf '%s\n' "${codes[1]}" > "$EVIDENCE_DIR/fonts-tee-exit-code.txt"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/fonts-finished-at.txt"
          if (( codes[0] != 0 )); then exit "${codes[0]}"; fi
          exit "${codes[1]}"
      - name: Preserve the actual preset check outcome
        id: presets
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'corepack pnpm@10.32.1 check:styles:preset' > "$EVIDENCE_DIR/preset-check-command.txt"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/preset-check-started-at.txt"
          set +e
          corepack pnpm@10.32.1 check:styles:preset 2>&1 | tee "$EVIDENCE_DIR/preset-check.log"
          codes=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${codes[0]}" > "$EVIDENCE_DIR/preset-check-exit-code.txt"
          printf '%s\n' "${codes[1]}" > "$EVIDENCE_DIR/preset-check-tee-exit-code.txt"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/preset-check-finished-at.txt"
          if (( codes[0] != 0 )); then exit "${codes[0]}"; fi
          exit "${codes[1]}"
      - name: Disable only the supported Astro development toolbar preference
        id: preference
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar' > "$EVIDENCE_DIR/astro-preference-command.txt"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar 2>&1 | tee "$EVIDENCE_DIR/astro-preference.log"
      - name: Re-admit unchanged checkout bytes before the native command
        id: source-ready
        shell: bash
        run: |
          set -euo pipefail
          node "$EVIDENCE_DIR/source-admission.mjs" before-native "$EVIDENCE_DIR/source-custody.json"
      - name: Run the complete selected original native inventory
        id: native
        env:
          PUI_FINF_PRESET_CHECK: ${{ steps.presets.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          unset PROTO_UI_RUNTIME_PHASE PROTO_UI_RUNTIME_SHARD PROTO_UI_RUNTIME_SLOT
          unset PUI_FINF_POPOVER_NEGATIVE_CONTROL
          case "$MATRIX_LANE" in
            runtime-tabs)
              export PUI_FINF_FEATURE_GROUP=runtime-tabs
              export PUI_FINF_FEATURE_EVIDENCE_DIR="$EVIDENCE_DIR"
              native=(node scripts/test/run-runtime-tests.mjs apps/www/src/content/docs/zh-cn/finf-representative-features.browser.test.ts)
              ;;
            liquid-button)
              export PROTO_UI_MATERIAL_EVIDENCE_DIR="$EVIDENCE_DIR"
              native=(node scripts/test/run-runtime-tests.mjs apps/www/src/content/docs/zh-cn/demo-liquid-glass-material.browser.test.ts --testNamePattern 'the actual public Button documentation uses the same optical path on all four runtime panels|records actual four-runtime idle/hover work without accepting an optimization')
              ;;
            code-surface-grammar)
              export PROTO_UI_RUNTIME_EVIDENCE_DIR="$EVIDENCE_DIR"
              export PROTO_UI_CODE_GRAMMAR_PHASES=1
              native=(node scripts/test/run-runtime-tests.mjs apps/www/src/content/docs/zh-cn/code-surface-grammar.browser.test.ts)
              ;;
            *) printf '%s\n' 'Unknown source lane' >&2; exit 2 ;;
          esac
          native+=(--maxWorkers=1 --minWorkers=1 --no-file-parallelism --reporter=default --reporter=json "--outputFile=$EVIDENCE_DIR/vitest-results.json")
          printf '%q ' timeout --signal=TERM --kill-after=10s 900s "${native[@]}" > "$EVIDENCE_DIR/command.txt"
          printf '\n' >> "$EVIDENCE_DIR/command.txt"
          node --input-type=module -e 'import fs from "node:fs"; const keys=["CI","GITHUB_ACTIONS","GITHUB_SHA","CANDIDATE_SHA","CHROME_PATH","PROTO_UI_BROWSER_BASE_URL","PROTO_UI_RUNTIME_PHASE","PROTO_UI_RUNTIME_SHARD","PROTO_UI_RUNTIME_SLOT","PUI_FINF_FEATURE_GROUP","PUI_FINF_FEATURE_EVIDENCE_DIR","PUI_FINF_PRESET_CHECK","PUI_FINF_POPOVER_NEGATIVE_CONTROL","PROTO_UI_MATERIAL_EVIDENCE_DIR","PROTO_UI_RUNTIME_EVIDENCE_DIR","PROTO_UI_CODE_GRAMMAR_PHASES"]; fs.writeFileSync(process.env.EVIDENCE_DIR+"/native-environment.json",JSON.stringify(Object.fromEntries(keys.map(key=>[key,process.env[key]??null])),null,2)+"\n");'
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/started-at.txt"
          set +e
          timeout --signal=TERM --kill-after=10s 900s "${native[@]}" 2>&1 | tee "$EVIDENCE_DIR/native.log"
          codes=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${codes[0]}" > "$EVIDENCE_DIR/exit-code.txt"
          printf '%s\n' "${codes[1]}" > "$EVIDENCE_DIR/native-tee-exit-code.txt"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/finished-at.txt"
          if (( codes[0] != 0 )); then exit "${codes[0]}"; fi
          exit "${codes[1]}"
      - name: Retain source identity and generated CLI bytes after every native outcome
        id: source-after
        if: always() && steps.source-before.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node "$EVIDENCE_DIR/source-admission.mjs" after-native "$EVIDENCE_DIR/source-custody.json"
      - name: Keep a failed preset prerequisite blocking
        if: always() && steps.presets.outcome == 'failure'
        shell: bash
        run: exit 1
      - name: Bind actual step outcomes and all retained artifact bytes
        if: always() && steps.source-before.outcome != 'skipped' && steps.node.outcome == 'success'
        env:
          OUTCOME_CHECKOUT: ${{ steps.checkout.outcome }}
          OUTCOME_NODE: ${{ steps.node.outcome }}
          OUTCOME_SOURCE_BEFORE: ${{ steps.source-before.outcome }}
          OUTCOME_PREREQUISITE: ${{ steps.prerequisite.outcome }}
          OUTCOME_BROWSER: ${{ steps.browser.outcome }}
          OUTCOME_PRESETS: ${{ steps.presets.outcome }}
          OUTCOME_PREFERENCE: ${{ steps.preference.outcome }}
          OUTCOME_SOURCE_READY: ${{ steps.source-ready.outcome }}
          OUTCOME_NATIVE: ${{ steps.native.outcome }}
          OUTCOME_SOURCE_AFTER: ${{ steps.source-after.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/collection-at.txt"
          node "$EVIDENCE_DIR/artifact-inventory.mjs"
      - name: Retain original-source observations and every failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1489-frozen-source-${{ github.sha }}-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr1489-native/${{ matrix.lane }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

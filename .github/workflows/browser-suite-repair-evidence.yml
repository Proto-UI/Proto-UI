name: Browser suite repair evidence

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: browser-suite-repair-${{ github.ref }}
  cancel-in-progress: false

env:
  TESTED_MAIN: 009612b25e3ba425fc2f5016ae28a7309092f808

jobs:
  packed-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_MAIN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
      - name: Smoke exact release tarballs through CLI in isolated multi-host consumer
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_MAIN"
          evidence="$RUNNER_TEMP/packed-cli-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          corepack pnpm@10.32.1 -s release:smoke:cli 2>&1 | tee "$evidence/cli-smoke.log"
      - name: Retain checkout and packed consumer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-cli-${{ env.TESTED_MAIN }}-${{ github.run_id }}
          path: ${{ runner.temp }}/packed-cli-evidence
          if-no-files-found: error
          retention-days: 30

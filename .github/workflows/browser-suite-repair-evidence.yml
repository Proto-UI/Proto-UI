name: Browser suite repair evidence

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: browser-suite-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Disable only the supported Astro development toolbar
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
      - name: Run Portal lifecycle unit tests
        run: corepack pnpm@10.32.1 exec vitest run --no-file-parallelism packages/adapters/base/test/view-visibility.test.ts packages/adapters/web-component/test/portal-conceal.test.ts packages/adapters/web-component/test/portal-mount-ownership.test.ts packages/adapters/web-component/test/portal-adoption-review.test.ts packages/adapters/base/test/layout-ready.test.ts
      - name: Run the WC color scheme browser case
        if: success() || failure()
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/browser-suite-repair
          PROTO_UI_IMAGE_SCREENSHOT_DIR: ${{ runner.temp }}/browser-suite-repair
        run: |
          set -euo pipefail
          mkdir -p "$PROTO_UI_IMAGE_SCREENSHOT_DIR"
          git rev-parse HEAD > "$PROTO_UI_IMAGE_SCREENSHOT_DIR/source-sha.txt"
          corepack pnpm@10.32.1 exec vitest run --no-file-parallelism \
            apps/www/test/color-scheme.browser.test.ts -t 'wc paints without interaction'
      - name: Retain candidate source identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-repair-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/browser-suite-repair
          if-no-files-found: warn
          retention-days: 30

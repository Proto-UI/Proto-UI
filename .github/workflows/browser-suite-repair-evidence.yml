name: Browser suite repair evidence
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oracle-repairs-evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: b8c7f77fa94a3ae6102a90c82ffef4825a9e212a

jobs:
  style-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare the locked dependencies and browser
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/oracle-style"
          "$CHROME" --version | tee "$RUNNER_TEMP/oracle-style/browser.txt"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
      - name: Verify the scoped style closure oracle
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/oracle-style
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git rev-parse HEAD > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/source-sha.txt"
          corepack pnpm@10.32.1 exec vitest run --maxWorkers=1 --minWorkers=1 --no-file-parallelism \
            apps/www/src/content/docs/zh-cn/demo-prototype-style-closure.browser.test.ts \
            -t 'loads only scoped Proto UI physical styles and mounts every real runtime' \
            --reporter=default --reporter=json \
            --outputFile.json="$PROTO_UI_RUNTIME_EVIDENCE_DIR/vitest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-style-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oracle-style
          if-no-files-found: warn
          retention-days: 30

  accordion:

name: Browser suite repair evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website-coverage:
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'baseline' && '3992ae27691ae65d52138e00681d27177623fcb4' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked workspace dependencies
        run: corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Run repository coverage scanner
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/coverage"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source.txt"
          node --version > "$evidence/node.txt"
          set +e
          node scripts/coverage-matrices/check-coverage-matrices.mjs > "$evidence/scanner.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$evidence/exit.txt"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage/
          if-no-files-found: error
          retention-days: 30

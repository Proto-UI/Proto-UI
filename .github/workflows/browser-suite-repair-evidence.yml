name: Original PR1489 native source carrier
run-name: pr1489-frozen-source-${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr1489-frozen-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        lane: [runtime-tabs, liquid-button, code-surface-grammar]
    env:
      EVIDENCE_DIR: ${{ runner.temp }}/pr1489-native/${{ matrix.lane }}
      MATRIX_LANE: ${{ matrix.lane }}
      CANDIDATE_SHA: ${{ github.sha }}
      PROTO_UI_BROWSER_BASE_URL: ''
    steps:
      - name: Initialize retained evidence before setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/job-started-at.txt"
          printf '%s\n' "$MATRIX_LANE" > "$EVIDENCE_DIR/lane.txt"
          printf '%s\n' 'Original PR1489 source-equivalent carrier; combined-main proof remains separate.' > "$EVIDENCE_DIR/scope.txt"
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 24
      - name: Admit and retain the actual original-source carrier before setup

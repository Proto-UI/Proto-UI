name: Bootstrap state-controls evidence
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: bootstrap-state-controls-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROTO_UI_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bind evidence to the exact PR head before setup
        env:
          PROTO_UI_BOOTSTRAP_EVIDENCE_DIR: ${{ runner.temp }}/bootstrap-state-controls-evidence
        run: |
          test "$(git rev-parse HEAD)" = "$PROTO_UI_EXPECTED_HEAD_SHA"
          mkdir -p "$PROTO_UI_BOOTSTRAP_EVIDENCE_DIR"
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          writeFileSync(path.join(process.env.PROTO_UI_BOOTSTRAP_EVIDENCE_DIR, 'manifest.json'), JSON.stringify({
            sourceSha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            expectedSha: process.env.PROTO_UI_EXPECTED_HEAD_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            status: 'setup-pending',
            scope: 'Eight draft Bootstrap parts, four Web runtimes only; no native or Compiler claim.',
          }, null, 2));
          JS
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Configure the official Astro evidence surface
        run: corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
      - name: Check fixture boundaries and source token closure
        run: |
          node --test scripts/test/bootstrap-state-controls-evidence.test.mjs
          corepack pnpm@10.32.1 check:styles:preset
      - name: Collect real four-runtime evidence
        env:
          PROTO_UI_BOOTSTRAP_BROWSER_EVIDENCE: '1'
          PROTO_UI_BOOTSTRAP_EVIDENCE_DIR: ${{ runner.temp }}/bootstrap-state-controls-evidence
        run: |
          corepack pnpm@10.32.1 exec vitest run \
            packages/prototypes/bootstrap-2-3-2/test/controls.test.ts \
            apps/www/src/content/docs/zh-cn/native-editor-evidence.test.ts \
            apps/www/src/content/docs/zh-cn/bootstrap-disabled-paint.test.ts \
            apps/www/src/content/docs/zh-cn/demo-bootstrap-state-controls.browser.test.ts \
            --maxWorkers=1 --minWorkers=1
      - name: Preserve terminal status even when setup or browser launch fails
        if: always()
        env:
          EVIDENCE_JOB_STATUS: ${{ job.status }}
          PROTO_UI_BOOTSTRAP_EVIDENCE_DIR: ${{ runner.temp }}/bootstrap-state-controls-evidence
        run: |
          mkdir -p "$PROTO_UI_BOOTSTRAP_EVIDENCE_DIR"
          node --input-type=module <<'JS'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const file = path.join(process.env.PROTO_UI_BOOTSTRAP_EVIDENCE_DIR, 'manifest.json');
          const previous = existsSync(file) ? JSON.parse(readFileSync(file, 'utf8')) : {};
          writeFileSync(file, JSON.stringify({
            ...previous,
            expectedSha: process.env.PROTO_UI_EXPECTED_HEAD_SHA,
            workflowStatus: process.env.EVIDENCE_JOB_STATUS,
            status: previous.status === 'passed' && process.env.EVIDENCE_JOB_STATUS === 'success' ? 'passed' : 'failed',
          }, null, 2));
          JS
      - name: Retain SHA-bound public fixture screenshots and failure manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-state-controls-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bootstrap-state-controls-evidence
          if-no-files-found: error
          retention-days: 30

name: Evidence-only Search cold open parity

on:
  pull_request:
    paths:
      - '.github/workflows/search-cold-open-parity.yml'
      - 'scripts/test/search-cold-open-parity*.mjs'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: search-cold-open-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'evidence/search-cold-open-parity')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PROBE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PROBE_SHA }}
          path: probe
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '46fa65bb0146d951a08f6368ee4568be57fba3f5'
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '4a2320762ba5f4319dec1915ca4e138772dceb0c'
          path: current
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check probe negative controls (no browser)
        run: node --test probe/scripts/test/search-cold-open-parity.test.mjs
      - name: Two locked production builds, serial
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/search-cold-open"
          corepack enable
          for source in baseline current; do
            (
              cd "$source"
              git rev-parse HEAD
              corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
              corepack pnpm@10.32.1 --filter apps-www build
              test -f apps/www/dist/pagefind/pagefind.js
              git diff --exit-code
            ) 2>&1 | tee "$RUNNER_TEMP/search-cold-open/build-$source.log"
          done
      - name: Fixed browser, serial interleaved measurements
        timeout-minutes: 12
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME_PATH="$CHROME"
          "$CHROME" --version | tee "$RUNNER_TEMP/search-cold-open/browser.txt"
          timeout --signal=TERM --kill-after=15s 660s node probe/scripts/test/search-cold-open-parity.mjs \
            "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/current" "$RUNNER_TEMP/search-cold-open" \
            2>&1 | tee "$RUNNER_TEMP/search-cold-open/run.log"
      - name: Retain raw successes, failures and distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-cold-open-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/search-cold-open
          if-no-files-found: error
          retention-days: 14

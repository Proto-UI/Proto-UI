name: Compiler GPUI source consumers

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: compiler-gpui-consumers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure the Cargo target after runner allocation
        id: configure-cargo
        run: printf 'CARGO_TARGET_DIR=%s/gpui-consumer-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install frozen JavaScript dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libasound2-dev libfontconfig1-dev libssl-dev libudev-dev libvulkan-dev libwayland-dev libxcb1-dev libxcb-composite0-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/gpui-consumer-target
          key: gpui-source-${{ runner.os }}-rust-1.98.1-${{ hashFiles('packages/compiler/test/fixtures/gpui-ordinary-values/Cargo.lock') }}
          restore-keys: gpui-source-${{ runner.os }}-rust-1.98.1-
      - name: Compile unchanged authored source into native crates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gpui-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/gpui-evidence/source-sha.txt"
          rustc +1.98.1 --version --verbose > "$RUNNER_TEMP/gpui-evidence/rustc.txt"
          node --import tsx packages/compiler/test/fixtures/gpui-ordinary-values/produce.mjs "$RUNNER_TEMP/gpui-evidence/generated" 2>&1 | tee "$RUNNER_TEMP/gpui-evidence/producer.log"
      - name: Build the default published native SDK
        run: |
          set -euo pipefail
          cargo +1.98.1 check --locked --manifest-path "$RUNNER_TEMP/gpui-evidence/generated/transition/Cargo.toml" --lib 2>&1 | tee "$RUNNER_TEMP/gpui-evidence/default-check.log"
      - name: Execute generated Rust consumers and resource controls
        run: |
          set -euo pipefail
          cargo +1.98.1 test --locked --manifest-path "$RUNNER_TEMP/gpui-evidence/generated/transition/Cargo.toml" --features test-support --test ordinary -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/gpui-evidence/consumer.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-gpui-source-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gpui-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

name: Compiler GPUI source consumers

on:
  workflow_dispatch:
    inputs:
      package_budget_evidence:
        description: 'Also run the strict whole-entry package gate for this exact ref'
        type: boolean
        required: false
        default: false
      website_shader_evidence:
        description: 'Also collect full Website source and original Docs evidence for this exact ref'
        type: boolean
        required: false
        default: false
      adapter_acceptance:
        description: Run the separate GPUI Adapter native acceptance lane
        type: boolean
        required: false
        default: false
      browser_acceptance:
        description: Run the separate browser compiler and source regression lanes
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      adapter_acceptance:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: compiler-gpui-consumers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Explicit manual evidence only. Reusable full-cycle calls retain their
  # existing public_package_build owner and do not inherit this opt-in input.
  package-budgets:
    if: github.event_name == 'workflow_dispatch' && inputs.package_budget_evidence == true
    uses: ./.github/workflows/package-budget-evidence.yml
    permissions:
      contents: read

  website-shader-evidence:
    if: github.event_name == 'workflow_dispatch' && inputs.website_shader_evidence == true
    uses: ./.github/workflows/website-shader-ownership-evidence.yml
    permissions:
      contents: read

  browser-compiler:
    # Use the registered manual entry point to run this revision's reusable
    # browser workflow independently of either native implementation.
    if: ${{ inputs.browser_acceptance }}
    uses: ./.github/workflows/compiler-browser-acceptance.yml
    with:
      source_regressions: true
      production_build: true
    permissions:
      contents: read
  adapter-native:
    # A distinct receipt: generated Rust never stands in for the Adapter.
    # The optional input keeps existing full-cycle selection unchanged.
    if: ${{ inputs.adapter_acceptance }}
    uses: ./.github/workflows/gpui-adapter-acceptance.yml
    permissions:
      contents: read
  native-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure the Cargo target after runner allocation
        id: configure-cargo
        run: printf 'CARGO_TARGET_DIR=%s/gpui-consumer-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install frozen JavaScript dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Execute headless generated Rust consumers
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
          PROTO_UI_REQUIRE_RUST_DATA_TESTS: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gpui-evidence"
          corepack pnpm@10.32.1 exec vitest run \
            packages/compiler/test/rust-data-source.test.ts \
            packages/compiler/test/rust-data-artifacts.test.ts \
            --maxWorkers=1 --minWorkers=1 \
            2>&1 | tee "$RUNNER_TEMP/gpui-evidence/headless-consumer.log"
      - name: Exercise Cargo graph admission against real dependency syntax
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
          PROTO_UI_REQUIRE_CARGO_GRAPH_TESTS: '1'
        run: node --test scripts/gpui/test/cargo-graph.test.mjs
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libasound2-dev libfontconfig1-dev libssl-dev libudev-dev libvulkan-dev libwayland-dev libxcb1-dev libxcb-composite0-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/gpui-consumer-target
          key: gpui-source-${{ runner.os }}-rust-1.98.1-${{ hashFiles('packages/compiler/test/fixtures/gpui-ordinary-values/Cargo.lock') }}
          restore-keys: gpui-source-${{ runner.os }}-rust-1.98.1-
      - name: Compile unchanged authored source into native crates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gpui-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/gpui-evidence/source-sha.txt"
          rustc +1.98.1 --version --verbose > "$RUNNER_TEMP/gpui-evidence/rustc.txt"
          node --import tsx packages/compiler/test/fixtures/gpui-ordinary-values/produce.mjs "$RUNNER_TEMP/gpui-evidence/generated" 2>&1 | tee "$RUNNER_TEMP/gpui-evidence/producer.log"
          node --import tsx packages/compiler/test/fixtures/gpui-control-label/produce.mjs "$RUNNER_TEMP/gpui-evidence/official-control-label" 2>&1 | tee "$RUNNER_TEMP/gpui-evidence/official-control-label-producer.log"
      - name: Verify the full locked GPUI and shared SDK dependency graph
        run: |
          set -euo pipefail
          node scripts/gpui/check-cargo-graph.mjs \
            --manifest-path "$RUNNER_TEMP/gpui-evidence/generated/transition/Cargo.toml" \
            --git https://github.com/zed-industries/zed \
            --rev 62e5991dd0f0c8a3af8d5e7e9c4652490d468db8 \
            --toolchain 1.98.1 \
            --output "$RUNNER_TEMP/gpui-evidence/cargo-graph.json" \
            2>&1 | tee "$RUNNER_TEMP/gpui-evidence/cargo-graph.log"
          cargo +1.98.1 metadata --all-features --format-version 1 --manifest-path "$RUNNER_TEMP/gpui-evidence/official-control-label/Cargo.toml" > "$RUNNER_TEMP/gpui-evidence/official-control-label-metadata.json"
          node scripts/gpui/check-cargo-graph.mjs \
            --manifest-path "$RUNNER_TEMP/gpui-evidence/official-control-label/Cargo.toml" \
            --git https://github.com/zed-industries/zed \
            --rev 62e5991dd0f0c8a3af8d5e7e9c4652490d468db8 \
            --toolchain 1.98.1 \
            --output "$RUNNER_TEMP/gpui-evidence/official-control-label-graph.json" \
            2>&1 | tee "$RUNNER_TEMP/gpui-evidence/official-control-label-graph.log"
      - name: Build the default published native SDK
        id: native_sdk
        run: |
          set -euo pipefail
          cargo +1.98.1 check --locked --manifest-path "$RUNNER_TEMP/gpui-evidence/generated/transition/Cargo.toml" --lib 2>&1 | tee "$RUNNER_TEMP/gpui-evidence/default-check.log"
      - name: Execute generated Rust consumers and resource controls
        if: ${{ !cancelled() && steps.native_sdk.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo +1.98.1 test --locked --manifest-path "$RUNNER_TEMP/gpui-evidence/generated/transition/Cargo.toml" --features test-support --test ordinary -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/gpui-evidence/consumer.log"
      - name: Execute unchanged compiled Button Toggle and Label consumers
        if: ${{ !cancelled() && steps.native_sdk.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo +1.98.1 test --locked --manifest-path "$RUNNER_TEMP/gpui-evidence/generated/transition/Cargo.toml" --features test-support --test control_label -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/gpui-evidence/control-label-consumer.log"
      - name: Execute the official Input delegate and physical ControlLabel consumer
        if: ${{ !cancelled() && steps.native_sdk.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo +1.98.1 test --locked --manifest-path "$RUNNER_TEMP/gpui-evidence/official-control-label/Cargo.toml" --test control_label -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/gpui-evidence/official-control-label-consumer.log"
      - name: Verify bounded native text-selection style mapping
        if: ${{ !cancelled() && steps.native_sdk.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo +1.98.1 test --locked --manifest-path "$RUNNER_TEMP/gpui-evidence/generated/transition/Cargo.toml" --features test-support --test style_mapping -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/gpui-evidence/style-mapping-consumer.log"
      - name: Verify native accessibility activation through authored operations
        if: ${{ !cancelled() && steps.native_sdk.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo +1.98.1 test --locked --manifest-path "$RUNNER_TEMP/gpui-evidence/generated/transition/Cargo.toml" --features test-support --test a11y_activation -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/gpui-evidence/a11y-activation-consumer.log"
      - name: Execute the generated numeric accessibility action bridge
        if: ${{ !cancelled() && steps.native_sdk.outcome == 'success' }}
        run: |
          set -euo pipefail
          node --import tsx packages/compiler/test/fixtures/gpui-a11y-value/produce.mjs "$RUNNER_TEMP/gpui-evidence/numeric-action" 2>&1 | tee "$RUNNER_TEMP/gpui-evidence/numeric-producer.log"
          cargo +1.98.1 metadata --all-features --format-version 1 --manifest-path "$RUNNER_TEMP/gpui-evidence/numeric-action/Cargo.toml" > "$RUNNER_TEMP/gpui-evidence/numeric-metadata.json"
          node scripts/gpui/check-cargo-graph.mjs \
            --manifest-path "$RUNNER_TEMP/gpui-evidence/numeric-action/Cargo.toml" \
            --git https://github.com/zed-industries/zed \
            --rev 62e5991dd0f0c8a3af8d5e7e9c4652490d468db8 \
            --toolchain 1.98.1 \
            --output "$RUNNER_TEMP/gpui-evidence/numeric-graph.json" \
            2>&1 | tee "$RUNNER_TEMP/gpui-evidence/numeric-graph.log"
          cargo +1.98.1 test --locked --manifest-path "$RUNNER_TEMP/gpui-evidence/numeric-action/Cargo.toml" --test a11y_value -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/gpui-evidence/numeric-consumer.log"
      - name: Verify explicit native scroll pause against ordinary requests
        if: ${{ !cancelled() && steps.native_sdk.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo +1.98.1 test --locked --manifest-path "$RUNNER_TEMP/gpui-evidence/generated/transition/Cargo.toml" --features test-support --test scroll_pause -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/gpui-evidence/scroll-pause-consumer.log"
      - name: Verify native scroll reader displacement and append behavior
        if: ${{ !cancelled() && steps.native_sdk.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo +1.98.1 test --locked --manifest-path "$RUNNER_TEMP/gpui-evidence/generated/transition/Cargo.toml" --features test-support --test scroll_reader -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/gpui-evidence/scroll-reader-consumer.log"
      - name: Verify composed native Scroll geometry and current view leases
        id: composed_scroll
        if: ${{ !cancelled() && steps.native_sdk.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo +1.98.1 test --locked --manifest-path "$RUNNER_TEMP/gpui-evidence/generated/transition/Cargo.toml" --features test-support --test composed_scroll -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/gpui-evidence/composed-scroll-consumer.log"
      - name: Execute emitted SDK lifecycle and control regressions
        if: ${{ !cancelled() && steps.native_sdk.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo +1.98.1 test --locked --manifest-path "$RUNNER_TEMP/gpui-evidence/numeric-action/Cargo.toml" \
            -p proto-ui-gpui-native --features test-support,gpui/test-support --lib -- --test-threads=1 --nocapture \
            2>&1 | tee "$RUNNER_TEMP/gpui-evidence/native-sdk-controls.log"
      - name: Require complete composed Scroll evidence and summarize the native result
        if: ${{ !cancelled() }}
        env:
          PROTO_UI_COMPOSED_STEP_OUTCOME: ${{ steps.composed_scroll.outcome }}
        run: node scripts/ci/check-gpui-composed-scroll-evidence.mjs "$RUNNER_TEMP/gpui-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-gpui-source-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gpui-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  # Actual Qt Quick consumers exercise the dormant direct source emitter.
  # This does not activate a public Qt compilation profile.
  qt-native-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install frozen source and Qt build dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qt-native-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/qt-native-evidence/source-sha.txt"
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libxkbcommon-dev
      - name: Prepare and record the exact Qt 6.4.2 SDK
        timeout-minutes: 7
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/qt-sdk-tools"
          "$RUNNER_TEMP/qt-sdk-tools/bin/python" -m pip install --report "$RUNNER_TEMP/qt-native-evidence/tools-install.json" aqtinstall==3.3.0
          timeout --signal=TERM --kill-after=5s 360s "$RUNNER_TEMP/qt-sdk-tools/bin/python" -m aqt install-qt linux desktop 6.4.2 gcc_64 --outputdir "$RUNNER_TEMP/qt-source-sdk" --archives qtbase qtdeclarative qtsvg icu 2>&1 | tee "$RUNNER_TEMP/qt-native-evidence/sdk-install.log"
          QT_SDK_DIR="$RUNNER_TEMP/qt-source-sdk/6.4.2/gcc_64"
          "$QT_SDK_DIR/bin/qmake" -query > "$RUNNER_TEMP/qt-native-evidence/qt-environment.txt"
          test "$("$QT_SDK_DIR/bin/qmake" -query QT_VERSION)" = '6.4.2'
          printf 'PROTO_UI_QT_DIR=%s\nPROTO_UI_QT_EVIDENCE_DIR=%s/qt-native-evidence\n' "$QT_SDK_DIR" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Execute source-generated Qt Root and Scroll consumers
        run: |
          set -euo pipefail
          test -x "$PROTO_UI_QT_DIR/bin/qmake"
          corepack pnpm@10.32.1 exec vitest run packages/compiler/test/qt-native-consumer.native.test.ts --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile.json="$PROTO_UI_QT_EVIDENCE_DIR/vitest.json" 2>&1 | tee "$PROTO_UI_QT_EVIDENCE_DIR/native.log"
          node scripts/ci/check-qt-native-evidence.mjs "$PROTO_UI_QT_EVIDENCE_DIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-qt-native-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/qt-native-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  # This consumes the dormant direct Flutter emitter with real Widgets. It
  # does not activate a public Flutter compilation profile.
  flutter-scroll-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record the exact source before preparing native dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flutter-scroll-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/flutter-scroll-evidence/source-sha.txt"
      - name: Install frozen JavaScript dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Prepare the pinned Flutter SDK and isolated offline package cache
        run: |
          set -euo pipefail
          node scripts/ci/prepare-flutter-scroll-sdk.mjs "$RUNNER_TEMP/flutter-scroll-sdk" "$RUNNER_TEMP/flutter-scroll-evidence" 2>&1 | tee "$RUNNER_TEMP/flutter-scroll-evidence/preparation.log"
      - name: Execute the original Flutter Widget consumer wrapper
        run: |
          set -euo pipefail
          test -n "$PROTO_UI_FLUTTER"
          test -x "$PROTO_UI_FLUTTER"
          corepack pnpm@10.32.1 exec vitest run packages/compiler/test/flutter-scroll-outcomes.native.test.ts --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile.json="$PROTO_UI_FLUTTER_EVIDENCE_DIR/vitest.json" 2>&1 | tee "$PROTO_UI_FLUTTER_EVIDENCE_DIR/native.log"
      - name: Require executed wrapper and complete native Widget evidence
        run: node scripts/ci/check-flutter-scroll-evidence.mjs "$RUNNER_TEMP/flutter-scroll-evidence" 17
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-flutter-scroll-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/flutter-scroll-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

name: Compiler GPUI source consumers

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: compiler-gpui-consumers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure the Cargo target after runner allocation
        id: configure-cargo
        run: printf 'CARGO_TARGET_DIR=%s/gpui-consumer-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install frozen JavaScript dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config python3 libasound2-dev libfontconfig1-dev libfreetype6-dev libssl-dev libudev-dev libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-composite0-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/gpui-consumer-target
          key: gpui-source-${{ runner.os }}-rust-1.98.1-${{ hashFiles('packages/compiler/test/fixtures/gpui-ordinary-values/Cargo.lock') }}
          restore-keys: gpui-source-${{ runner.os }}-rust-1.98.1-
      - name: Compile unchanged authored source into native crates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gpui-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/gpui-evidence/source-sha.txt"
          rustc +1.98.1 --version --verbose > "$RUNNER_TEMP/gpui-evidence/rustc.txt"
          node --import tsx packages/compiler/test/fixtures/gpui-ordinary-values/produce.mjs "$RUNNER_TEMP/gpui-evidence/generated" 2>&1 | tee "$RUNNER_TEMP/gpui-evidence/producer.log"
      - name: Build the default published native SDK
        run: |
          set -euo pipefail
          cargo +1.98.1 check --locked --manifest-path "$RUNNER_TEMP/gpui-evidence/generated/transition/Cargo.toml" --lib 2>&1 | tee "$RUNNER_TEMP/gpui-evidence/default-check.log"
      - name: Execute generated Rust consumers and resource controls
        run: |
          set -euo pipefail
          cargo +1.98.1 test --locked --manifest-path "$RUNNER_TEMP/gpui-evidence/generated/transition/Cargo.toml" --features test-support --test ordinary -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/gpui-evidence/consumer.log"
      - name: Check generated workspace consumer against retained Verdant GPUI
        shell: bash
        env:
          WORKSPACE_GPUI_REVISION: e5f2f9db75e97613232b5c1946333e61fa3828ab
        run: |
          set -euo pipefail
          export GPUI_WORKSPACE="$RUNNER_TEMP/gpui-evidence/workspace"
          trap 'status=$?; printf "%s\n" "$status" > "$RUNNER_TEMP/gpui-evidence/workspace-step-exit.txt"' EXIT

          node --import tsx packages/compiler/test/fixtures/gpui-ordinary-values/produce-workspace.mjs \
            "$GPUI_WORKSPACE" "$WORKSPACE_GPUI_REVISION" \
            2>&1 | tee "$RUNNER_TEMP/gpui-evidence/workspace-producer.log"

          # Configure the embedding host; preserve all emitted component/SDK bytes.
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          const manifest = `${process.env.GPUI_WORKSPACE}/Cargo.toml`;
          const text = await readFile(manifest, 'utf8');
          const original = 'git = "https://github.com/zed-industries/zed"';
          assert.equal(text.split(original).length, 2);
          await writeFile(manifest, text.replace(
            original, 'git = "https://github.com/cyjin-yl/z3rm"'
          ));
          NODE

          # Resolve this fresh workspace and retain the resulting Cargo.lock.
          cargo +1.98.1 metadata --format-version 1 \
            --manifest-path "$GPUI_WORKSPACE/Cargo.toml" \
            > "$RUNNER_TEMP/gpui-evidence/workspace-metadata.json" \
            2> "$RUNNER_TEMP/gpui-evidence/workspace-resolution.log"

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          const directory = `${process.env.RUNNER_TEMP}/gpui-evidence`;
          const metadata = JSON.parse(
            await readFile(`${directory}/workspace-metadata.json`, 'utf8')
          );
          const gpui = metadata.packages.filter(pkg => pkg.name === 'gpui');
          assert.equal(gpui.length, 1, 'Expected one shared resolved GPUI package');
          const revision = process.env.WORKSPACE_GPUI_REVISION;
          assert.equal(gpui[0].source,
            `git+https://github.com/cyjin-yl/z3rm?rev=${revision}#${revision}`);
          await writeFile(`${directory}/workspace-gpui-resolution.json`,
            JSON.stringify(gpui, null, 2) + '\n');
          NODE

          set +e
          cargo +1.98.1 check --locked \
            --manifest-path "$GPUI_WORKSPACE/Cargo.toml" --lib \
            2>&1 | tee "$RUNNER_TEMP/gpui-evidence/workspace-check.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" \
            > "$RUNNER_TEMP/gpui-evidence/workspace-cargo-exit.txt"
          if (( statuses[0] != 0 )); then
            exit "${statuses[0]}"
          fi
          exit "${statuses[1]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-gpui-source-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gpui-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

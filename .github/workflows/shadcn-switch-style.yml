name: Shadcn Switch shared style evidence
on:
  pull_request:
    paths:
      - 'packages/prototypes/shadcn/src/switch/**'
      - 'packages/prototypes/shadcn/src/style-scope/**'
      - 'packages/prototypes/shadcn/test/switch*.test.ts'
      - 'packages/adapters/**/src/**'
      - 'scripts/prototypes/shadcn-switch-evidence*'
      - '.github/workflows/shadcn-switch-style.yml'
      - 'apps/www/src/content/docs/zh-cn/demo-shadcn-switch-compositions*'
      - 'apps/www/src/content/docs/zh-cn/switch-compositions.test.ts'
      - 'apps/www/src/content/docs/*/ui-libraries/shadcn/switch.mdx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  switch-four-web-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked existing dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
      - name: Test Switch and scope projection
        run: node node_modules/vitest/vitest.mjs run packages/prototypes/shadcn/test/switch-style-profile.test.ts packages/prototypes/shadcn/test/switch-evidence-app-probe.test.ts packages/prototypes/shadcn/test/switch.test.ts packages/prototypes/shadcn/test/style-scope.test.ts
      - name: Capture exact-head four-runtime Switch density, theme and scope
        env:
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --import tsx scripts/prototypes/shadcn-switch-evidence.mjs /tmp/pui-shadcn-switch-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadcn-switch-shared-style-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/pui-shadcn-switch-evidence/
          if-no-files-found: warn
          retention-days: 30


  public-compositions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies and locate the existing browser
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/switch-public-compositions"
          git rev-parse HEAD > "$RUNNER_TEMP/switch-public-compositions/source-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/switch-public-compositions/source-tree.txt"
          "$CHROME" --version > "$RUNNER_TEMP/switch-public-compositions/browser.txt"
      - name: Disable only the supported development toolbar
        run: corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
      - name: Exercise the actual public composition page in all four Web hosts
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/switch-public-compositions
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 exec vitest run \
            apps/www/src/content/docs/zh-cn/switch-compositions.test.ts \
            apps/www/src/content/docs/zh-cn/demo-shadcn-switch-compositions.browser.test.ts \
            --no-file-parallelism --maxWorkers=1 --minWorkers=1 \
            --reporter=default --reporter=json \
            --outputFile="$PROTO_UI_RUNTIME_EVIDENCE_DIR/vitest.json" \
            2>&1 | tee "$PROTO_UI_RUNTIME_EVIDENCE_DIR/browser.log"
      - name: Preserve exact-source successful and failed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switch-public-compositions-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/switch-public-compositions/
          if-no-files-found: warn
          retention-days: 30

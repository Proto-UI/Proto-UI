name: Library Card first-frame evidence
on:
  pull_request:
    paths:
      - '.github/workflows/library-card-evidence.yml'
      - 'packages/**'
      - 'apps/www/astro.config.mjs'
      - 'apps/www/package.json'
      - 'package.json'
      - 'apps/www/src/components/**'
      - 'apps/www/src/styles/**'
      - 'apps/www/src/content/docs/zh-cn/ui-libraries/index.mdx'
      - 'apps/www/src/content/docs/en/ui-libraries/index.mdx'
      - 'apps/www/src/content/docs/zh-cn/library-cards-first-frame*.ts'
      - 'apps/www/src/content/docs/zh-cn/library-card-capture*.ts'
      - 'apps/www/src/content/docs/zh-cn/library-card-font-trace*.ts'
      - 'apps/www/src/content/docs/zh-cn/library-card-font-boundary*.ts'
      - 'apps/www/src/content/docs/zh-cn/library-card-platform-fonts*.ts'
      - 'apps/www/src/content/docs/zh-cn/library-card-readability*.ts'
      - 'apps/www/src/content/docs/zh-cn/browser-harness.ts'
      - 'scripts/test/server-readiness.mjs'
      - 'vitest.config.ts'
      - 'scripts/test/runtime-test-plan.mjs'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: library-card-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  browser-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies and identify Chromium
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/library-card"
          "$CHROME" --version > "$RUNNER_TEMP/library-card/browser-environment.txt"
          node --version > "$RUNNER_TEMP/library-card/node-environment.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/library-card/source-sha.txt"
      - name: Install the matching public CJK font fallback
        timeout-minutes: 3
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk fontconfig > "$RUNNER_TEMP/library-card/font-environment.txt"
      - name: Disable the development toolbar on the real evidence surface
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          TOOLBAR_SETTING=$(NO_COLOR=1 corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled)
          printf '%s\n' "$TOOLBAR_SETTING"
          grep -Eq '^◉ devToolbar\.enabled is set to[[:space:]]+false[[:space:]]*$' <<< "$TOOLBAR_SETTING"
      - name: Run all 9 first-frame, refresh and no-JavaScript journeys
        timeout-minutes: 20
        env:
          PUI_LIBRARY_CARD_EVIDENCE_DIR: ${{ runner.temp }}/library-card/screenshots
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 exec vitest run \
            apps/www/src/content/docs/zh-cn/library-cards-first-frame.browser.test.ts \
            --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json \
            --outputFile="$RUNNER_TEMP/library-card/vitest.json" \
            2>&1 | tee "$RUNNER_TEMP/library-card/browser.log"
          node --input-type=module - "$RUNNER_TEMP/library-card/vitest.json" <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          assert.equal(report.numTotalTests, 9, 'All first-frame and no-script journeys must run.');
          assert.equal(report.numPassedTests, 9, 'All first-frame and no-script journeys must pass.');
          assert.equal(report.numFailedTests, 0);
          JS
      - name: Retain exact-source results, screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-card-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/library-card
          if-no-files-found: error
          retention-days: 30

  font-parent-comparison:
    # Temporary exact-source diagnostic for PR1227 only; never a required check.
    # Remove this job before making the product PR merge-ready.
    if: github.event.pull_request.number == 1227
    # Fixed parent versus the actual event head; retain the old d850/026 run separately.
    # The original browser-evidence job and all its gates above remain intact.
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: library-card
            job_minutes: 25
          - lane: quick-start
            job_minutes: 35
          - lane: visual-density
            job_minutes: 25
    env:
      PAIR_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d850c28a40bfbc31f10d244b075d6f27038f46fa
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare the same locked dependencies, browser and CJK fonts
        id: environment
        timeout-minutes: 5
        run: |
          set -euo pipefail
          corepack enable
          OUT="$RUNNER_TEMP/font-parent-pair/$PAIR_LANE"
          mkdir -p "$OUT"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version > "$OUT/browser-environment.txt"
          node --version > "$OUT/node-environment.txt"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk fontconfig > "$OUT/font-environment.txt"
          for role in baseline candidate; do
            (
              cd "$role"
              corepack pnpm@10.32.1 install --frozen-lockfile
              corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
              SETTING=$(NO_COLOR=1 corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled)
              printf '%s\n' "$SETTING" > "$OUT/$role-toolbar.txt"
              grep -Eq '^◉ devToolbar\.enabled is set to[[:space:]]+false[[:space:]]*$' <<< "$SETTING"
            )
          done
      - name: Bind both clean product trees and the original acceptance inventory
        id: prepare
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/font-parent-pair.py" <<'PY'
          import hashlib, json, os, pathlib, stat, subprocess, sys
          ROOT = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          OUT = pathlib.Path(os.environ['RUNNER_TEMP']) / 'font-parent-pair' / os.environ['PAIR_LANE']
          CANDIDATE_HEAD = os.environ['CANDIDATE_SHA']
          assert len(CANDIDATE_HEAD) == 40 and all(c in '0123456789abcdef' for c in CANDIDATE_HEAD)
          CANDIDATE_TREE = subprocess.check_output(['git', '-C', str(ROOT / 'candidate'), 'rev-parse', CANDIDATE_HEAD + '^{tree}']).decode().strip()
          SOURCES = {
              'baseline': ('d850c28a40bfbc31f10d244b075d6f27038f46fa', '7c999e92aa49569d93905be6a54a6124a6553441'),
              'candidate': (CANDIDATE_HEAD, CANDIDATE_TREE),
          }
          EXPECTED_CHANGED = ['.github/workflows/library-card-evidence.yml', 'apps/www/public/fonts/geist-OFL.txt', 'apps/www/src/components/PrototypePreviewer/demo-ref-observer.test.ts', 'apps/www/src/components/PrototypePreviewer/projection-theme.test.ts', 'apps/www/src/components/PrototypePreviewer/projection-theme.ts', 'apps/www/src/components/PrototypePreviewer/runtime-preview-portal-theme.test.ts', 'apps/www/src/components/PrototypePreviewer/runtime-preview-surface.ts', 'apps/www/src/components/UiLibraryGallery.astro', 'apps/www/src/components/library-card-source.test.ts', 'apps/www/src/components/site-typography.test.ts', 'apps/www/src/components/site-typography.ts', 'apps/www/src/content/docs/zh-cn/library-card-font-boundary.browser.test.ts', 'apps/www/src/content/docs/zh-cn/library-card-platform-fonts.test.ts', 'apps/www/src/content/docs/zh-cn/library-card-platform-fonts.ts', 'apps/www/src/content/docs/zh-cn/site-typography.browser.test.ts', 'apps/www/src/pages/styles/site-library-theme.css.ts', 'apps/www/src/styles/assets/font/geist/Geist-Variable.ttf', 'apps/www/src/styles/assets/font/geist/OFL.txt', 'apps/www/src/styles/assets/font/geist/README.md', 'apps/www/src/styles/site-library-family.css', 'apps/www/src/styles/tailwindcss.css', 'apps/www/test/shadcn-font-license.test.ts', 'apps/www/test/shadcn-typography-theme.test.ts', 'internal/records/2026-11-02-font-author-boundary.md', 'packages/prototypes/shadcn/README.md', 'packages/prototypes/shadcn/src/text/index.ts', 'packages/prototypes/shadcn/src/text/typography.ts', 'packages/prototypes/shadcn/test/typography-theme.test.ts', 'scripts/test/runtime-test-plan.mjs', 'spec/prototypes/P-SHADCN-TEXT.yaml', 'spec/tests/T-SHADCN-TYPOGRAPHY-THEME-0001.yaml']
          DENSITY_HASH = '6f23b528bd0142a449333d5f6ea452a75fa439f1ccea6d3e6e55c3f2e6fd8f4c'

          def git(root, *args):
              return subprocess.check_output(['git', '-C', str(root), *args])

          def guard(role, label):
              root = ROOT / role
              head, tree = SOURCES[role]
              assert git(root, 'rev-parse', 'HEAD').decode().strip() == head
              assert git(root, 'rev-parse', 'HEAD^{tree}').decode().strip() == tree
              assert not git(root, 'status', '--porcelain', '--untracked-files=all').strip()
              entries = {}
              for item in git(root, 'ls-tree', '-rz', 'HEAD').split(b'\0'):
                  if not item:
                      continue
                  metadata, raw_name = item.split(b'\t', 1)
                  mode, kind, oid = metadata.decode().split()
                  name = raw_name.decode()
                  assert kind == 'blob' and mode in ('100644', '100755', '120000')
                  file = root / name
                  info = file.lstat()
                  if mode == '120000':
                      assert stat.S_ISLNK(info.st_mode)
                      data = os.readlink(file).encode()
                  else:
                      assert stat.S_ISREG(info.st_mode) and not file.is_symlink()
                      assert bool(info.st_mode & 0o111) == (mode == '100755')
                      data = file.read_bytes()
                  assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == oid, name
                  entries[name] = {'mode': mode, 'gitBlob': oid, 'sha256': hashlib.sha256(data).hexdigest()}
              out = OUT / role
              out.mkdir(parents=True, exist_ok=True)
              (out / (label + '-source.json')).write_text(json.dumps({'role': role, 'head': head, 'tree': tree, 'dirty': False, 'trackedFileCount': len(entries), 'files': entries}, indent=2) + '\n')
              return entries

          def prepare():
              a, b = guard('baseline', 'prepared'), guard('candidate', 'prepared')
              assert sorted(k for k in set(a) | set(b) if a.get(k) != b.get(k)) == EXPECTED_CHANGED
              assert a['pnpm-lock.yaml'] == b['pnpm-lock.yaml']
              for name in ['vitest.config.ts', 'apps/www/src/content/docs/zh-cn/browser-harness.ts',
                           'apps/www/src/content/docs/zh-cn/library-cards-first-frame.browser.test.ts',
                           'apps/www/src/content/docs/zh-cn/quick-start-first-frame.browser.test.ts',
                           'apps/www/src/content/docs/zh-cn/quick-start-first-frame-fragment-control.browser.test.ts',
                           'apps/www/scripts/capture-visual-density-evidence.ts']:
                  assert a[name] == b[name], name
              assert a['apps/www/src/content/docs/zh-cn/library-cards-first-frame.browser.test.ts']['sha256'] == '0321dc7b6eed1fa9660f9e5c5bd00e2e125f277b980c1bada12f9a6b39fa2ac1'
              assert a['apps/www/scripts/capture-visual-density-evidence.ts']['sha256'] == DENSITY_HASH
              (OUT / 'source-roles.json').write_text(json.dumps({'sources': {r: {'head': h, 'tree': t} for r, (h,t) in SOURCES.items()}, 'workflowEventSha': os.environ.get('GITHUB_SHA'), 'workflowCandidateHead': os.environ.get('CANDIDATE_SHA'), 'historicalFixed026ComparisonRun': 41483779188, 'lane': os.environ['PAIR_LANE'], 'changedPaths': EXPECTED_CHANGED, 'densityRevisionKind': 'candidate on BOTH roles solely to enable the same original assertions', 'unchangedLock': a['pnpm-lock.yaml'], 'acceptance': 'Both original outcomes retained; any ordinary red or incomplete evidence keeps this lane failed.'}, indent=2) + '\n')

          def unit_report(file, expected):
              report = json.loads(file.read_text())
              rows = [r for f in report['testResults'] for r in f['assertionResults']]
              identities = [(f['name'], r['fullName']) for f in report['testResults'] for r in f['assertionResults']]
              assert report['numTotalTests'] == len(rows) == len(set(identities)) == expected
              assert all(r['status'] in ('passed', 'failed') for r in rows)
              assert report['numPassedTests'] == sum(r['status'] == 'passed' for r in rows)
              assert report['numFailedTests'] == sum(r['status'] == 'failed' for r in rows)
              assert report['numPassedTests'] + report['numFailedTests'] == expected
              return {'tests': expected, 'passed': report['numPassedTests'], 'failed': report['numFailedTests'], 'identities': identities}

          def run(role):
              guard(role, 'before')
              out = OUT / role
              env = os.environ.copy()
              env['CANDIDATE_SHA'] = SOURCES[role][0]
              env['PUI_LIBRARY_CARD_EVIDENCE_DIR'] = str(out / 'library-frames')
              env['PUI_QUICK_START_EVIDENCE_DIR'] = str(out / 'quick-start-frames')
              lane = os.environ['PAIR_LANE']
              results = []
              def command(label, seconds, argv, count=None):
                  with (out / (label + '.raw.log')).open('wb') as log:
                      result = subprocess.run(['timeout', '--signal=TERM', '--kill-after=10s', str(seconds) + 's', *argv], cwd=ROOT / role, env=env, stdout=log, stderr=subprocess.STDOUT)
                  row = {'label': label, 'argv': argv, 'timeoutSeconds': seconds, 'exit': result.returncode}
                  results.append(row)
                  # Save the actual exit before any report/source validation can fail.
                  (out / 'command-exits.json').write_text(json.dumps(results, indent=2) + '\n')
                  print(role, label, 'actual exit', result.returncode, flush=True)
                  if count is not None:
                      row['coverage'] = unit_report(out / (label + '.json'), count)
                      assert result.returncode != 0 or row['coverage']['failed'] == 0, 'False-green unit exit/report disagreement'
                  (out / 'command-exits.json').write_text(json.dumps(results, indent=2) + '\n')
                  guard(role, 'after-' + label)
              def unit(label, filename, count, seconds):
                  command(label, seconds, ['corepack', 'pnpm@10.32.1', 'exec', 'vitest', 'run', 'apps/www/src/content/docs/zh-cn/' + filename, '--maxWorkers=1', '--minWorkers=1', '--reporter=default', '--reporter=json', '--outputFile=' + str(out / (label + '.json'))], count)
              if lane == 'library-card':
                  unit('library-card', 'library-cards-first-frame.browser.test.ts', 9, 1200)
              elif lane == 'quick-start':
                  unit('quick-start', 'quick-start-first-frame.browser.test.ts', 20, 1200)
                  unit('fragment-controls', 'quick-start-first-frame-fragment-control.browser.test.ts', 4, 600)
                  for owner in ['menu', 'content-link']:
                      debt = json.loads((out / 'quick-start-frames' / ('react-' + owner + '-early-native-ownership.json')).read_text())['endToEndEarlyInputDebt']
                      assert debt['passed'] is False and debt['productFixClaimed'] is False
              elif lane == 'visual-density':
                  command('density', 180, ['node', '--import', 'tsx', 'apps/www/scripts/capture-visual-density-evidence.ts', '--revision-kind', 'candidate', '--expected-revision', SOURCES[role][0], '--quick-preview', '--out', str(out / 'density')])
                  report = json.loads((out / 'density/metrics.json').read_text())
                  assert report['revision'] == SOURCES[role][0] and report['scriptSha256'] == DENSITY_HASH
                  expected = ['zh-cn-1440-light-shadcn-quick-start', 'zh-cn-1440-light-shadcn-docs', 'zh-cn-1440-dark-brutalist-docs']
                  assert [x['id'] for x in report['cases']] == expected
                  assert all(x['outcome'] in ('passed', 'failed') for x in report['cases'])
                  assert len(report['failures']) == sum(x['outcome'] == 'failed' for x in report['cases'])
                  assert results[-1]['exit'] != 0 or not report['failures'], 'False-green density exit/report disagreement'
              else:
                  raise AssertionError('Unknown fixed lane')
              guard(role, 'terminal')
              (out / 'terminal.json').write_text(json.dumps({'role': role, 'head': SOURCES[role][0], 'complete': True, 'commands': results}, indent=2) + '\n')
              # Ordinary assertion failures remain failed steps but permit the counterpart.
              with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                  stream.write('complete=true\n')
              return 1 if any(row['exit'] != 0 for row in results) else 0

          if sys.argv[1] == 'prepare':
              prepare()
          elif sys.argv[1] == 'run':
              sys.exit(run(sys.argv[2]))
          elif sys.argv[1] == 'finish':
              rows = [json.loads((OUT / role / 'terminal.json').read_text()) for role in SOURCES]
              assert all(row['complete'] and row['head'] == SOURCES[row['role']][0] for row in rows)
              for row in rows:
                  guard(row['role'], 'final')
              (OUT / 'paired-terminal.json').write_text(json.dumps({'complete': True, 'allOriginalCommandsPassed': all(c['exit'] == 0 for r in rows for c in r['commands']), 'sources': rows}, indent=2) + '\n')
              assert all(c['exit'] == 0 for r in rows for c in r['commands']), 'Original baseline/candidate failures retained, not waived'
          else:
              raise AssertionError('Unknown own metadata action')
          PY
          python "$RUNNER_TEMP/font-parent-pair.py" prepare
      - name: Run the unchanged gates against the exact parent
        id: baseline
        continue-on-error: true
        run: python "$RUNNER_TEMP/font-parent-pair.py" run baseline
      - name: Run the same gates against the actual event head after ordinary parent failure
        id: candidate
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.baseline.outputs.complete == 'true' }}
        continue-on-error: true
        run: python "$RUNNER_TEMP/font-parent-pair.py" run candidate
      - name: Require complete pair and retain every original failure as failure
        if: ${{ always() && !cancelled() }}
        run: python "$RUNNER_TEMP/font-parent-pair.py" finish
      - name: Preserve both exact-source raw logs, frames, reports and partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-parent-pair-${{ matrix.lane }}-d850-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/font-parent-pair/${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 30

  font-author-boundary:
    # Additional eight-case diagnostic cost, separate from the original Card9.
    # Temporary PR1227-only owner; resolve its ongoing owner before merge-ready.
    if: github.event.pull_request.number == 1227
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare the same locked browser and public CJK fallback
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          OUT="$RUNNER_TEMP/font-author-boundary"
          mkdir -p "$OUT"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version > "$OUT/browser-environment.txt"
          node --version > "$OUT/node-environment.txt"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk fontconfig > "$OUT/font-environment.txt"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          SETTING=$(NO_COLOR=1 corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled)
          printf '%s\n' "$SETTING" > "$OUT/toolbar.txt"
          grep -Eq '^◉ devToolbar\.enabled is set to[[:space:]]+false[[:space:]]*$' <<< "$SETTING"
      - name: Bind the actual clean event head and complete tracked source
        id: prepare
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/font-author-boundary-source.py" <<'PY'
          import hashlib, json, os, pathlib, stat, subprocess, sys
          ROOT = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          OUT = pathlib.Path(os.environ['RUNNER_TEMP']) / 'font-author-boundary'
          def git(*args):
              return subprocess.check_output(['git', '-C', str(ROOT), *args])
          head = git('rev-parse', 'HEAD').decode().strip()
          assert head == os.environ['CANDIDATE_SHA']
          assert not git('status', '--porcelain', '--untracked-files=all').strip()
          files = {}
          for item in git('ls-tree', '-rz', 'HEAD').split(b'\0'):
              if not item:
                  continue
              metadata, raw_name = item.split(b'\t', 1)
              mode, kind, oid = metadata.decode().split()
              name = raw_name.decode()
              assert kind == 'blob' and mode in ('100644', '100755', '120000')
              file = ROOT / name
              info = file.lstat()
              if mode == '120000':
                  assert stat.S_ISLNK(info.st_mode)
                  data = os.readlink(file).encode()
              else:
                  assert stat.S_ISREG(info.st_mode) and not file.is_symlink()
                  assert bool(info.st_mode & 0o111) == (mode == '100755')
                  data = file.read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == oid, name
              files[name] = {'mode': mode, 'gitBlob': oid, 'sha256': hashlib.sha256(data).hexdigest()}
          assert files['apps/www/src/content/docs/zh-cn/library-cards-first-frame.browser.test.ts']['sha256'] == '0321dc7b6eed1fa9660f9e5c5bd00e2e125f277b980c1bada12f9a6b39fa2ac1'
          snapshot = {'head': head, 'tree': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'dirty': False, 'workflowEventSha': os.environ.get('GITHUB_SHA'), 'files': files}
          label = sys.argv[1]
          assert label in ('prepared', 'before', 'after', 'final')
          if label != 'prepared':
              assert snapshot == json.loads((OUT / 'prepared-source.json').read_text())
          (OUT / (label + '-source.json')).write_text(json.dumps(snapshot, indent=2) + '\n')
          PY
          python "$RUNNER_TEMP/font-author-boundary-source.py" prepared
      - name: Run all eight supplemental inheritance and glyph journeys
        timeout-minutes: 17
        env:
          PUI_LIBRARY_FONT_BOUNDARY_EVIDENCE_DIR: ${{ runner.temp }}/font-author-boundary/frames
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/font-author-boundary"
          python "$RUNNER_TEMP/font-author-boundary-source.py" before
          set +e
          timeout --signal=TERM --kill-after=10s 960s corepack pnpm@10.32.1 exec vitest run \
            apps/www/src/content/docs/zh-cn/library-card-font-boundary.browser.test.ts \
            --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json \
            --outputFile="$OUT/vitest.json" 2>&1 | tee "$OUT/browser.log"
          codes=("${PIPESTATUS[@]}")
          set -e
          printf '{"testExit":%s,"teeExit":%s}\n' "${codes[0]}" "${codes[1]}" > "$OUT/command-exits.json"
          python "$RUNNER_TEMP/font-author-boundary-source.py" after
          python - "$OUT" <<'PY'
          import json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          report = json.loads((out / 'vitest.json').read_text())
          rows = [r for f in report['testResults'] for r in f['assertionResults']]
          identities = [(f['name'], r['fullName']) for f in report['testResults'] for r in f['assertionResults']]
          assert report['numTotalTests'] == len(rows) == len(set(identities)) == 8
          assert all(r['status'] in ('passed', 'failed') for r in rows)
          assert report['numPassedTests'] == sum(r['status'] == 'passed' for r in rows)
          assert report['numFailedTests'] == sum(r['status'] == 'failed' for r in rows)
          exits = json.loads((out / 'command-exits.json').read_text())
          coverage = {'tests': 8, 'passed': report['numPassedTests'], 'failed': report['numFailedTests'], 'identities': identities, 'exits': exits}
          (out / 'coverage.json').write_text(json.dumps(coverage, indent=2) + '\n')
          assert exits['testExit'] == exits['teeExit'] == 0
          assert report['numPassedTests'] == 8 and report['numFailedTests'] == 0
          PY
      - name: Recheck the complete clean source even after diagnostic failure
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: python "$RUNNER_TEMP/font-author-boundary-source.py" final
      - name: Preserve exact-source supplemental results and partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-author-boundary-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/font-author-boundary
          if-no-files-found: error
          retention-days: 30

name: Documentation image preview evidence

on:
  pull_request:
    paths:
      - '.github/workflows/documentation-image-preview.yml'
      - 'apps/www/**'
      - 'packages/adapters/**'
      - 'packages/prototypes/**'
      - 'packages/modules/**'
      - 'scripts/test/runtime-test-plan.mjs'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

# Exact-head public-page evidence only: no secrets, deployment or repository writes.
permissions:
  contents: read

concurrency:
  group: documentation-image-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      IMAGE_PREVIEW_EVIDENCE_DIR: /tmp/documentation-image-preview
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Install public CJK font fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          mkdir -p "$IMAGE_PREVIEW_EVIDENCE_DIR"
          dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk > "$IMAGE_PREVIEW_EVIDENCE_DIR/fonts.txt"
      - name: Identify renderer and exact revision
        run: |
          set -euo pipefail
          mkdir -p "$IMAGE_PREVIEW_EVIDENCE_DIR"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          {
            git rev-parse HEAD
            node --version
            "$CHROME" --version
            echo 'Public documentation and maintained fixtures only; no private references'
          } | tee "$IMAGE_PREVIEW_EVIDENCE_DIR/environment.txt"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
      - name: Run exact-head image preview matrix
        run: |
          set -o pipefail
          corepack pnpm@10.32.1 exec vitest run apps/www/src/components/documentation-image-preview.browser.test.ts --maxWorkers=1 --minWorkers=1 --bail=1 2>&1 | tee "$IMAGE_PREVIEW_EVIDENCE_DIR/browser.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-image-preview-${{ env.CANDIDATE_SHA }}
          path: ${{ env.IMAGE_PREVIEW_EVIDENCE_DIR }}
          retention-days: 14
          if-no-files-found: error

name: Bounded Search startup profile

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  diagnose:
    # This diagnostic is scoped to the current repair, not a new repository gate.
    # Its exit status requires complete capture, including cleanup/source checks.
    # Historical readiness misses remain FAIL in artifacts and the step summary;
    # current-product Search CI retains its separate, unchanged 1000ms gate.
    env:
      APP_SHA: ${{ matrix.scenario.app_sha }}
      CASE_ID: ${{ matrix.scenario.id }}
      PROBE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        mode: [unprofiled, profiled]
        scenario:
          - id: shadcn-dark-1440
            app_sha: '7669713a853211bb36995039d3c16569799c3e88'
          - id: shadcn-light-390
            app_sha: '9e183f7a7d69e61d17d62d92e3ccdacd00196833'
    steps:
      - name: Validate immutable application target
        run: |
          set -euo pipefail
          [[ "$APP_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PROBE_SHA }}
          path: probe
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record boundary before dependency setup
        env:
          MODE: ${{ matrix.mode }}
          EVIDENCE: ${{ runner.temp }}/search-profile/${{ matrix.scenario.id }}/${{ matrix.mode }}
        run: |
          mkdir -p "$EVIDENCE"
          node -e 'require("fs").writeFileSync(process.env.EVIDENCE+"/setup.json",JSON.stringify({caseId:process.env.CASE_ID,appSha:process.env.APP_SHA,probeSha:process.env.PROBE_SHA,mode:process.env.MODE,status:"setup-started",noRetry:true}))'
      - name: Check the candidate probe without a browser
        working-directory: probe
        run: node --test scripts/test/search-startup-profile.test.mjs
      - name: Install original application's locked dependencies
        working-directory: app
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: One source-bound visit (no retry)
        env:
          PROTO_UI_PROFILE_APP_SHA: ${{ env.APP_SHA }}
          PROTO_UI_PROFILE_PROBE_SHA: ${{ env.PROBE_SHA }}
          EVIDENCE: ${{ runner.temp }}/search-profile/${{ matrix.scenario.id }}/${{ matrix.mode }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 5m node \
            --import "$GITHUB_WORKSPACE/app/node_modules/tsx/dist/loader.mjs" \
            "$GITHUB_WORKSPACE/probe/scripts/test/search-startup-profile.mjs" \
            "$GITHUB_WORKSPACE/app" "$EVIDENCE" "$MODE" "$CASE_ID"
      - name: Retain both success and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-profile-${{ matrix.scenario.id }}-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/search-profile/${{ matrix.scenario.id }}/${{ matrix.mode }}
          if-no-files-found: error
          retention-days: 7

name: PR1593 pinned FileList native evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  file-membership-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 047a0e97d60823291b73207f1f8da814ba994298
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bind exact product source
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/pr1593-file-membership-native
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$EVIDENCE_DIR/product-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE_DIR/product-tree.txt"
          test "$(cat "$EVIDENCE_DIR/product-sha.txt")" = 047a0e97d60823291b73207f1f8da814ba994298
          test "$(cat "$EVIDENCE_DIR/product-tree.txt")" = 70461aeae8be9e89db133f654b4f3915add53a07
          printf '%s\n' '${{ github.sha }}' > "$EVIDENCE_DIR/carrier-sha.txt"
          git status --porcelain --untracked-files=no > "$EVIDENCE_DIR/tracked-before.txt"
          test ! -s "$EVIDENCE_DIR/tracked-before.txt"
          sha256sum packages/adapters/web-component/test/shadow-closeout.browser.test.ts pnpm-lock.yaml > "$EVIDENCE_DIR/source-sha256.txt"
      - name: Install original locked dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Bind native browser executable
        run: |
          set -euo pipefail
          CHROME_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          printf 'CHROME_PATH=%s\n' "$CHROME_PATH" >> "$GITHUB_ENV"
          printf '%s\n' "$CHROME_PATH" > "$EVIDENCE_DIR/browser-path.txt"
          "$CHROME_PATH" --version > "$EVIDENCE_DIR/browser-version.txt"
          sha256sum "$CHROME_PATH" > "$EVIDENCE_DIR/browser-executable-sha256.txt"
          node --version > "$EVIDENCE_DIR/node-version.txt"
      - name: Run original six native FileList cases
        run: |
          set -euo pipefail
          node node_modules/vitest/vitest.mjs run \
            packages/adapters/web-component/test/shadow-closeout.browser.test.ts \
            -t 'validates caller file membership through late split publication' \
            --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json \
            --outputFile="$EVIDENCE_DIR/vitest.raw.json" \
            2>&1 | tee "$EVIDENCE_DIR/native.log"
      - name: Require actual selected tests including original in-place variant
        if: always()
        run: |
          set -euo pipefail
          node --input-type=module - "$EVIDENCE_DIR" <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const dir = process.argv[2];
          const report = JSON.parse(fs.readFileSync(`${dir}/vitest.raw.json`, 'utf8'));
          const path = 'packages/adapters/web-component/test/shadow-closeout.browser.test.ts';
          const prefix = 'validates caller file membership through late split publication';
          const mutations = ['unchanged', 'remove second', 'mutate the assigned list', 'replace second', 'reverse', 'clear'];
          const suites = report.testResults.filter((suite) => suite.name.endsWith('/' + path));
          const assertions = suites.flatMap((suite) => suite.assertionResults);
          const selected = assertions.filter((test) => test.title.startsWith(prefix));
          const executed = assertions.filter((test) => ['passed', 'failed'].includes(test.status));
          const receipt = {
            expectedSelectedCount: mutations.length,
            actualSelectedCount: selected.length,
            actualExecutedCount: executed.length,
            passedSelectedCount: selected.filter((test) => test.status === 'passed').length,
            selected: selected.map(({title, fullName, status, failureMessages}) => ({title, fullName, status, failureMessages})),
            reportCounts: {total: report.numTotalTests, passed: report.numPassedTests, failed: report.numFailedTests, pending: report.numPendingTests},
          };
          fs.writeFileSync(`${dir}/selected-tests.json`, JSON.stringify(receipt, null, 2) + '\n');
          assert.equal(suites.length, 1, 'Exactly one original suite required');
          assert.equal(selected.length, 6, 'All six original parameter expansions required');
          assert.equal(executed.length, 6, 'Exactly six tests must actually execute');
          for (const mutation of mutations) {
            const matches = selected.filter((test) => test.title === `${prefix} (${mutation})`);
            assert.equal(matches.length, 1, `Missing or duplicated original variant: ${mutation}`);
            assert.equal(matches[0].status, 'passed', `Original variant did not pass: ${mutation}`);
          }
          assert.equal(report.numFailedTests, 0);
          assert.equal(report.numPassedTests, 6);
          assert.equal(report.success, true);
          JS
      - name: Preserve final source status
        if: always()
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=no > "$EVIDENCE_DIR/tracked-after.txt"
          test ! -s "$EVIDENCE_DIR/tracked-after.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1593-file-membership-native-047a0e97-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr1593-file-membership-native/
          if-no-files-found: error
          retention-days: 30

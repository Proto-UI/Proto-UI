name: Shadow Split S2 reconnect regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 257dd18e05701908bc646b380ded887efd43ded5
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Exercise S2 mixed context and reconnect
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/shadow-s2-reconnect-evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 257dd18e05701908bc646b380ded887efd43ded5
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          corepack pnpm@10.32.1 exec vitest run --minWorkers=1 --maxWorkers=1 apps/www/src/content/docs/zh-cn/demo-shadow-split-s2.browser.test.ts -t 'retains mixed context, controlled state and slot ownership across move/reconnect'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-s2-reconnect-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shadow-s2-reconnect-evidence
          if-no-files-found: warn

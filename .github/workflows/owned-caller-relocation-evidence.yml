name: Production Search runtime publication regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c78d159b1fe50875bc83be64f38ac9305cf791ff
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Verify production Pagefind recovery
        env:
          CANDIDATE_SHA: c78d159b1fe50875bc83be64f38ac9305cf791ff
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          mkdir -p "$RUNNER_TEMP/homepage-evidence"
          node --test apps/www/scripts/run-search-production-evidence.test.mjs
          node apps/www/scripts/run-search-production-evidence.mjs 2>&1 | tee "$RUNNER_TEMP/homepage-evidence/search-production.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-search-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/homepage-evidence

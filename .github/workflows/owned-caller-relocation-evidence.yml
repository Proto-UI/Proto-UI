name: Switch and Shadow split initial projection regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6944f6de7ade65331234f2355826754383d2ab39
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Run Switch and border admission regressions
        env:
          PUI_FINF_FEATURE_EVIDENCE_DIR: ${{ runner.temp }}/switch-shadow-evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6944f6de7ade65331234f2355826754383d2ab39
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          corepack pnpm@10.32.1 exec vitest run --minWorkers=1 --maxWorkers=1 packages/prototypes/shadcn/test/switch-motion.browser.test.ts packages/adapters/web-component/test/shadow-split-effects.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switch-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/switch-shadow-evidence
          if-no-files-found: warn

name: Main coverage matrix diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fef9bf23827f108f32b18df82a1f7feac06be86c
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Scan the exact main source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = fef9bf23827f108f32b18df82a1f7feac06be86c
          node scripts/coverage-matrices/check-coverage-matrices.mjs
  compare-css:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 57819223e7c07b31f43b779eea011912f48bec5a
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fef9bf23827f108f32b18df82a1f7feac06be86c
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          set -euo pipefail
          for side in baseline candidate; do
            corepack pnpm@10.32.1 --dir "$side" install --frozen-lockfile --ignore-scripts
          done
          corepack pnpm@10.32.1 --dir baseline/apps/www exec astro dev --host 127.0.0.1 --port 4321 > "$RUNNER_TEMP/baseline.log" 2>&1 &
          corepack pnpm@10.32.1 --dir candidate/apps/www exec astro dev --host 127.0.0.1 --port 4322 > "$RUNNER_TEMP/candidate.log" 2>&1 &
          for side in baseline candidate; do
            port=4321
            if [ "$side" = candidate ]; then port=4322; fi
            curl -fsS --retry 30 --retry-delay 2 --retry-connrefused --max-time 20 -o "$RUNNER_TEMP/$side.css" -w '%{http_code}\n%{content_type}\n' "http://127.0.0.1:$port/styles/site-library-theme.css" | cmp - <(printf '200\ntext/css; charset=utf-8\n') || { cat "$RUNNER_TEMP/$side.log"; exit 1; }
          done
          cmp "$RUNNER_TEMP/baseline.css" "$RUNNER_TEMP/candidate.css"
          sha256sum "$RUNNER_TEMP/"*.css

name: Compiler type regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 870d1f8bb5a0be8d81f62ab0006ea8145aeb2d77
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Check workspace types
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 870d1f8bb5a0be8d81f62ab0006ea8145aeb2d77
          corepack pnpm@10.32.1 -s check:types

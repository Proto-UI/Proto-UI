name: Draft caller relocation native evidence
on:
  pull_request:
    paths:
      - 'packages/core/src/handles.ts'
      - 'packages/core/src/spec/template.ts'
      - 'packages/modules/feedback/**'
      - 'packages/modules/rule/**'
      - 'packages/modules/rule-expose-state-web/**'
      - 'packages/adapters/web-component/src/**'
      - 'packages/adapters/base/src/platform/web-owned-decoration*.ts'
      - 'packages/adapters/base/src/platform/portal-destination.ts'
      - 'packages/adapters/react/src/**'
      - 'packages/adapters/web-component/test/fixtures/owned-caller-relocation-evidence-app.ts'
      - 'packages/adapters/vue/src/**'
      - 'packages/adapters/vue2/src/**'
      - 'scripts/feedback/owned-caller-relocation-evidence*'
      - '.github/workflows/owned-caller-relocation-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-caller-relocation-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked existing dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Check bounded caller relocation
        run: node node_modules/vitest/vitest.mjs run packages/adapters/web-component/test/owned-slot-relocation.test.ts packages/adapters/web-component/test/portal-owned-relocation.test.ts packages/adapters/web-component/test/commit.failure-atomicity.test.ts packages/adapters/web-component/test/commit.session-failure-atomicity.test.ts
      - name: Capture exact-head native keyboard, pointer and accessibility evidence
        env:
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --import tsx scripts/feedback/owned-caller-relocation-evidence.mjs /tmp/pui-owned-caller-relocation-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-caller-relocation-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/pui-owned-caller-relocation-evidence/
          if-no-files-found: warn
          retention-days: 30

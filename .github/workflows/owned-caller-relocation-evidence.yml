name: Brutalist Search close focus attribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9df26b7452abff73d21dfb2ced2809d38ca3d131
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Trace the two keyboard close journeys
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/search-focus-evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9df26b7452abff73d21dfb2ced2809d38ca3d131
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          corepack pnpm@10.32.1 exec vitest run --minWorkers=1 --maxWorkers=1 apps/www/src/content/docs/zh-cn/site-search-commands.browser.test.ts -t 'brutalist (light 1440px|dark 390px) preserves activation'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-focus-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/search-focus-evidence
          if-no-files-found: warn

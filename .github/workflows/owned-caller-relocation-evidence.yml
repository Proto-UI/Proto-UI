name: PR1595 macOS Clippy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-macos:
    if: ${{ github.event_name != 'pull_request' }}
    # Covers the GPUI translation layer on the platform the first fixture pins.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b304eb6f61a3bdd71eadb3f5cdfe979528791322
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b304eb6f61a3bdd71eadb3f5cdfe979528791322
          rustup show active-toolchain
          rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/gpui/target
          key: cargo-macos-${{ hashFiles('native/gpui/Cargo.lock') }}
          restore-keys: cargo-macos-

      - name: Lint
        working-directory: native/gpui
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets -- -D warnings
          # The real-window test is behind a feature; lint it too.
          cargo clippy -p proto-ui-gpui --features macos-accessibility-test --all-targets -- -D warnings

name: Main coverage matrix diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 41ffc3e32bbad621b9acbffd7622bd2f687a9a10
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Scan the exact main source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 41ffc3e32bbad621b9acbffd7622bd2f687a9a10
          node scripts/coverage-matrices/check-coverage-matrices.mjs

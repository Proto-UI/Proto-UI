name: Shadcn Scroll Area geometry regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0256f1dad00ebcbd642424e53ddfc3c7e2b74e9d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Exercise Shadcn corner and thumb geometry
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/shadcn-scroll-corner-evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0256f1dad00ebcbd642424e53ddfc3c7e2b74e9d
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          corepack pnpm@10.32.1 exec vitest run --minWorkers=1 --maxWorkers=1 apps/www/src/content/docs/zh-cn/scroll-area-corner.browser.test.ts -t 'shadcn.*reserves a non-control corner'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadcn-scroll-corner-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shadcn-scroll-corner-evidence
          if-no-files-found: warn

name: WC dark Portal first visible frame
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 79f718e4a59f912678c443bff2077849a0da1758
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Run the existing color scheme lifecycle suite
        env:
          PUI_FINF_FEATURE_EVIDENCE_DIR: ${{ runner.temp }}/wc-portal-evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 79f718e4a59f912678c443bff2077849a0da1758
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          corepack pnpm@10.32.1 exec vitest run --minWorkers=1 --maxWorkers=1 apps/www/test/color-scheme.browser.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wc-portal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wc-portal-evidence
          if-no-files-found: warn

name: Shadcn Switch shadow border trace
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 46be6adce3b1f4e2f9417c7862eb2f4fbf7a5992
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Trace original Shadcn Switch Shadow assertions
        env:
          PUI_FINF_FEATURE_EVIDENCE_DIR: ${{ runner.temp }}/switch-shadow-evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 46be6adce3b1f4e2f9417c7862eb2f4fbf7a5992
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          corepack pnpm@10.32.1 exec vitest run --minWorkers=1 --maxWorkers=1 packages/prototypes/shadcn/test/switch-motion.browser.test.ts -t 'New York default Switch.*shadow root 16px'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switch-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/switch-shadow-evidence
          if-no-files-found: warn

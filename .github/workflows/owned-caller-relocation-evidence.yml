name: Demo Matrix startup profile
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6900f996483a536f53e9a77b13f63fa0ee7cbfca
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Profile the desktop Demo Matrix startup
        env:
          PROTO_UI_MATRIX_STARTUP_PROFILE: 1
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/matrix-startup-evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6900f996483a536f53e9a77b13f63fa0ee7cbfca
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          corepack pnpm@10.32.1 exec vitest run --minWorkers=1 --maxWorkers=1 apps/www/src/content/docs/zh-cn/demo-matrix.browser.test.ts -t 'mounts every demo in every official Web adapter'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/matrix-startup-evidence
          if-no-files-found: warn

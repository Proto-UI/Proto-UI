name: Intranet preview build
run-name: 'Intranet preview build PR #${{ inputs.pr_number || github.event.pull_request.number }}'

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to bootstrap or rebuild
        required: true
        type: number
      expected_head_sha:
        description: Full live pull request head SHA
        required: true
        type: string

# Contributor code runs only on the disposable hosted builder. The intranet
# publisher consumes its artifact as hostile data and never executes it.
permissions:
  contents: read

concurrency:
  group: intranet-preview-build-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve the exact live pull request
        id: pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REQUESTED_PR: ${{ inputs.pr_number || github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}
        with:
          script: |
            const number = Number(process.env.REQUESTED_PR);
            const expectedHead = String(process.env.EXPECTED_HEAD_SHA || "").trim();
            if (!Number.isSafeInteger(number) || number < 1 || !/^[0-9a-f]{40}$/.test(expectedHead)) {
              core.setFailed("A positive PR number and full expected head SHA are required");
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            if (pr.state !== "open" || !pr.head.repo || pr.head.sha !== expectedHead) {
              core.setFailed(`PR #${number} no longer matches the requested open head`);
              return;
            }
            core.setOutput("number", String(pr.number));
            core.setOutput("repository", pr.head.repo.full_name);
            core.setOutput("sha", pr.head.sha);

      - name: Create the pre-build identity binding
        env:
          PREVIEW_PR: ${{ steps.pr.outputs.number }}
          PREVIEW_SHA: ${{ steps.pr.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/intranet-preview-binding"
          printf '%s\n' "PR=$PREVIEW_PR" "HEAD=$PREVIEW_SHA" > \
            "$RUNNER_TEMP/intranet-preview-binding/binding.txt"

      # Upload before any contributor code runs. Admission trusts the platform's
      # artifact identity, never bytes supplied by the contributor.
      - name: Upload the build identity binding
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intranet-preview-binding-${{ steps.pr.outputs.number }}-${{ steps.pr.outputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intranet-preview-binding/binding.txt
          if-no-files-found: error
          retention-days: 3

      - name: Check out the exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.pr.outputs.repository }}
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Enable the pinned pnpm release
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the canonical documentation site
        run: pnpm --filter apps-www build

      - name: Verify the generated entrypoint
        run: test -s apps/www/dist/index.html

      - name: Upload the untrusted static artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intranet-preview-${{ steps.pr.outputs.number }}-${{ steps.pr.outputs.sha }}-${{ github.run_attempt }}
          path: apps/www/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

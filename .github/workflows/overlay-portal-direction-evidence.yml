name: Overlay portal direction native evidence
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: overlay-portal-direction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  browser-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies and identify Chromium
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/overlay-portal-direction"
          "$CHROME" --version > "$RUNNER_TEMP/overlay-portal-direction/browser-environment.txt"
          node --version > "$RUNNER_TEMP/overlay-portal-direction/node-environment.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/overlay-portal-direction/source-sha.txt"
      - name: Install the matching public CJK font fallback
        timeout-minutes: 3
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk fontconfig > "$RUNNER_TEMP/overlay-portal-direction/font-environment.txt"
      - name: Disable the development toolbar on the real evidence surface
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          TOOLBAR_SETTING=$(NO_COLOR=1 corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled)
          printf '%s\n' "$TOOLBAR_SETTING"
          grep -Eq '^◉ devToolbar\.enabled is set to[[:space:]]+false[[:space:]]*$' <<< "$TOOLBAR_SETTING"
      - name: Run all 8 paired portal-direction journeys and retain failing paint
        timeout-minutes: 20
        env:
          PROTO_UI_PORTAL_DIRECTION_SCREENSHOT_DIR: ${{ runner.temp }}/overlay-portal-direction/screenshots
        run: |
          set -euo pipefail
          # Supplementary direct evidence only. The standard required CI inventory
          # and its historical failures remain intact; this does not replace them.
          corepack pnpm@10.32.1 exec vitest run \
            apps/www/src/content/docs/zh-cn/overlay-portal-direction.browser.test.ts \
            --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json \
            --outputFile="$RUNNER_TEMP/overlay-portal-direction/vitest.json" \
            2>&1 | tee "$RUNNER_TEMP/overlay-portal-direction/browser.log"
          node --input-type=module - "$RUNNER_TEMP/overlay-portal-direction/vitest.json" <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          assert.equal(report.numTotalTests, 8, 'The complete native portal-direction inventory must run.');
          assert.equal(report.numPassedTests, 8, 'All paired native portal-direction journeys must pass.');
          assert.equal(report.numFailedTests, 0);
          JS
      - name: Retain exact-source results, screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-portal-direction-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/overlay-portal-direction
          if-no-files-found: error
          retention-days: 30
  reconciliation-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record exact source and install original locked dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/overlay-reconciliation-contract"
          git rev-parse HEAD > "$RUNNER_TEMP/overlay-reconciliation-contract/source-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/overlay-reconciliation-contract/source-tree.txt"
          git status --porcelain --untracked-files=no > "$RUNNER_TEMP/overlay-reconciliation-contract/tracked-status.txt"
          test ! -s "$RUNNER_TEMP/overlay-reconciliation-contract/tracked-status.txt"
          sha256sum pnpm-lock.yaml > "$RUNNER_TEMP/overlay-reconciliation-contract/lock-sha256.txt"
          node --version > "$RUNNER_TEMP/overlay-reconciliation-contract/node-environment.txt"
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          git status --porcelain --untracked-files=no > "$RUNNER_TEMP/overlay-reconciliation-contract/post-install-tracked-status.txt"
          test ! -s "$RUNNER_TEMP/overlay-reconciliation-contract/post-install-tracked-status.txt"
      - name: Run bounded Overlay and Menubar regression contracts
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Supplementary evidence. Preserve the original general catalog gate,
          # browser job, failures, permissions and all existing runtime budgets.
          corepack pnpm@10.32.1 exec vitest run \
            packages/modules/overlay/test/resource-reconciliation-barrier.test.ts \
            packages/modules/overlay/test/resource-lifetime.test.ts \
            packages/modules/overlay/test/host-callback-reentrancy.test.ts \
            packages/modules/overlay/test/host-neutral-target.test.ts \
            packages/modules/overlay/test/target-alignment-binding.test.ts \
            packages/modules/overlay/test/modal-lock.test.ts \
            packages/prototypes/base/test/navigation-overlays/menubar-focus-entry.test.ts \
            packages/prototypes/base/test/navigation-overlays/menubar-request.test.ts \
            packages/prototypes/base/test/navigation-overlays/menus.test.ts \
            packages/prototypes/shadcn/test/menubar-style-projection.test.ts \
            packages/runtime/test/contract/overlay.v0.contract.test.ts \
            packages/prototypes/base/test/as-transition.test.ts \
            --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json \
            --outputFile="$RUNNER_TEMP/overlay-reconciliation-contract/vitest.json" \
            2>&1 | tee "$RUNNER_TEMP/overlay-reconciliation-contract/tests.log"
          node --input-type=module - "$RUNNER_TEMP/overlay-reconciliation-contract/vitest.json" <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          assert.equal(report.numFailedTests, 0);
          const required = [
            'packages/modules/overlay/test/resource-reconciliation-barrier.test.ts',
            'packages/modules/overlay/test/resource-lifetime.test.ts',
            'packages/modules/overlay/test/host-callback-reentrancy.test.ts',
            'packages/modules/overlay/test/host-neutral-target.test.ts',
            'packages/modules/overlay/test/target-alignment-binding.test.ts',
            'packages/modules/overlay/test/modal-lock.test.ts',
            'packages/prototypes/base/test/navigation-overlays/menubar-focus-entry.test.ts',
            'packages/prototypes/base/test/navigation-overlays/menubar-request.test.ts',
            'packages/prototypes/base/test/navigation-overlays/menus.test.ts',
            'packages/prototypes/shadcn/test/menubar-style-projection.test.ts',
            'packages/runtime/test/contract/overlay.v0.contract.test.ts',
            'packages/prototypes/base/test/as-transition.test.ts',
          ];
          for (const path of required) {
            const result = report.testResults.find((entry) => entry.name.endsWith('/' + path));
            assert.ok(result, `Missing required suite: ${path}`);
            assert.ok(result.assertionResults.length > 0, `Empty required suite: ${path}`);
            assert.ok(result.assertionResults.every((test) => test.status === 'passed'),
              `Every required assertion must execute and pass: ${path}`);
          }
          JS
      - name: Record final tracked source state even after test failure
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/overlay-reconciliation-contract"
          git status --porcelain --untracked-files=no > "$RUNNER_TEMP/overlay-reconciliation-contract/post-test-tracked-status.txt"
          test ! -s "$RUNNER_TEMP/overlay-reconciliation-contract/post-test-tracked-status.txt"
      - name: Retain exact-source unit results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-reconciliation-contract-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/overlay-reconciliation-contract
          if-no-files-found: error
          retention-days: 30

name: Overlay portal direction native evidence
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: overlay-portal-direction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  browser-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies and identify Chromium
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/overlay-portal-direction"
          "$CHROME" --version > "$RUNNER_TEMP/overlay-portal-direction/browser-environment.txt"
          node --version > "$RUNNER_TEMP/overlay-portal-direction/node-environment.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/overlay-portal-direction/source-sha.txt"
      - name: Install the matching public CJK font fallback
        timeout-minutes: 3
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk fontconfig > "$RUNNER_TEMP/overlay-portal-direction/font-environment.txt"
      - name: Disable the development toolbar on the real evidence surface
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          TOOLBAR_SETTING=$(NO_COLOR=1 corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled)
          printf '%s\n' "$TOOLBAR_SETTING"
          grep -Eq '^◉ devToolbar\.enabled is set to[[:space:]]+false[[:space:]]*$' <<< "$TOOLBAR_SETTING"
      - name: Run all 8 paired portal-direction journeys and retain failing paint
        timeout-minutes: 20
        env:
          PROTO_UI_PORTAL_DIRECTION_SCREENSHOT_DIR: ${{ runner.temp }}/overlay-portal-direction/screenshots
        run: |
          set -euo pipefail
          # Supplementary direct evidence only. The standard required CI inventory
          # and its historical failures remain intact; this does not replace them.
          corepack pnpm@10.32.1 exec vitest run \
            apps/www/src/content/docs/zh-cn/overlay-portal-direction.browser.test.ts \
            --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json \
            --outputFile="$RUNNER_TEMP/overlay-portal-direction/vitest.json" \
            2>&1 | tee "$RUNNER_TEMP/overlay-portal-direction/browser.log"
          node --input-type=module - "$RUNNER_TEMP/overlay-portal-direction/vitest.json" <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          assert.equal(report.numTotalTests, 8, 'The complete native portal-direction inventory must run.');
          assert.equal(report.numPassedTests, 8, 'All paired native portal-direction journeys must pass.');
          assert.equal(report.numFailedTests, 0);
          JS
      - name: Retain exact-source results, screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-portal-direction-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/overlay-portal-direction
          if-no-files-found: error
          retention-days: 30

  focus-activation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record exact source and install existing locked dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/focus-activation-contract"
          git rev-parse HEAD > "$RUNNER_TEMP/focus-activation-contract/source-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/focus-activation-contract/source-tree.txt"
          sha256sum pnpm-lock.yaml > "$RUNNER_TEMP/focus-activation-contract/lock-sha256.txt"
          git status --porcelain --untracked-files=no > "$RUNNER_TEMP/focus-activation-contract/tracked-status.txt"
          test ! -s "$RUNNER_TEMP/focus-activation-contract/tracked-status.txt"
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          node --version > "$RUNNER_TEMP/focus-activation-contract/node-environment.txt"
          git status --porcelain --untracked-files=no > "$RUNNER_TEMP/focus-activation-contract/post-install-tracked-status.txt"
          test ! -s "$RUNNER_TEMP/focus-activation-contract/post-install-tracked-status.txt"
      - name: Run activation policy and existing Focus regression contracts
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Supplementary policy evidence, not native Search conformance. Preserve
          # the complete general preflight, original portal job and failures.
          files=(
            packages/modules/focus/test/scope-activation-entry.test.ts
            packages/prototypes/base/test/dialog-focus-entry.test.ts
            packages/modules/focus/test/center.test.ts
            packages/modules/focus/test/center-order.test.ts
            packages/runtime/test/contract/focus.v0.contract.test.ts
            packages/adapters/web-component/test/dialog-overlay.test.ts
          )
          for file in "${files[@]}"; do test -f "$file"; done
          printf '%s\n' "${files[@]}" > "$RUNNER_TEMP/focus-activation-contract/required-files.txt"
          node node_modules/vitest/vitest.mjs run "${files[@]}" \
            --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json \
            --outputFile="$RUNNER_TEMP/focus-activation-contract/vitest.json" \
            2>&1 | tee "$RUNNER_TEMP/focus-activation-contract/tests.log"
          node --input-type=module - "$RUNNER_TEMP/focus-activation-contract" <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const dir = process.argv[2];
          const report = JSON.parse(fs.readFileSync(`${dir}/vitest.json`, 'utf8'));
          const required = fs.readFileSync(`${dir}/required-files.txt`, 'utf8').trim().split('\n');
          assert.equal(report.success, true);
          assert.equal(report.numFailedTests, 0);
          assert.equal(report.testResults.length, required.length);
          for (const path of required) {
            const result = report.testResults.find((entry) => entry.name.endsWith('/' + path));
            assert.ok(result, `Missing required suite: ${path}`);
            assert.ok(result.assertionResults.length > 0, `Empty required suite: ${path}`);
            if (path.endsWith('/scope-activation-entry.test.ts')) assert.equal(result.assertionResults.length, 11, 'All new policy controls must run');
            if (path.endsWith('/dialog-focus-entry.test.ts')) assert.equal(result.assertionResults.length, 6, 'All Dialog consumer policy controls must run');
            assert.ok(result.assertionResults.every((entry) => entry.status === 'passed'), `Incomplete suite: ${path}`);
          }
          JS
      - name: Record post-test source status
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/focus-activation-contract"
          git status --porcelain --untracked-files=no > "$RUNNER_TEMP/focus-activation-contract/post-test-tracked-status.txt"
          test ! -s "$RUNNER_TEMP/focus-activation-contract/post-test-tracked-status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focus-activation-contract-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/focus-activation-contract/
          if-no-files-found: error
          retention-days: 30

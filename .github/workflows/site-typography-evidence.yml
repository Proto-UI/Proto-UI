name: Native typography evidence

on:
  pull_request:
    paths:
      - '.github/workflows/site-typography-evidence.yml'
      - 'apps/www/**'
      - 'packages/adapters/**'
      - 'packages/cli/**'
      - 'packages/prototypes/**'
      - 'scripts/test/runtime-test-plan.mjs'
      - 'scripts/test/site-typography-browser-evidence.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

# Public authored routes only. No secrets, deployment, writes or privileged PR context.
permissions:
  contents: read
concurrency:
  group: typography-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  native-typography:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies and real CJK font resources
        timeout-minutes: 5
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          mkdir -p "$RUNNER_TEMP/typography-evidence"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          {
            dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk fontconfig
            fc-match -f '%{family}\n%{file}\n' 'sans-serif:lang=zh-cn'
          } | tee "$RUNNER_TEMP/typography-evidence/font-environment.txt"
      - name: Select runner Chromium and disable only the supported development toolbar
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --version | tee "$RUNNER_TEMP/typography-evidence/browser-environment.txt"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
      - name: Check exact provenance, suite registration and socket-free contracts
        env:
          PROTO_UI_EXPECTED_HEAD: ${{ env.CANDIDATE_SHA }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PROTO_UI_EXPECTED_HEAD"
          node --test scripts/test/site-typography-browser-evidence.test.mjs scripts/test/run-runtime-tests.test.mjs
      - name: Exercise native source with actual adapters and Chromium
        timeout-minutes: 15
        env:
          PROTO_UI_EXPECTED_HEAD: ${{ env.CANDIDATE_SHA }}
          PROTO_UI_TYPOGRAPHY_EVIDENCE_DIR: ${{ runner.temp }}/typography-evidence
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 840s \
            corepack pnpm@10.32.1 exec vitest run --no-file-parallelism \
            apps/www/src/content/docs/zh-cn/site-typography.browser.test.ts \
            2>&1 | tee "$PROTO_UI_TYPOGRAPHY_EVIDENCE_DIR/browser.log"
      - name: Retain small source-bound frames and measured metadata even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typography-frames-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/typography-evidence/*.png
            ${{ runner.temp }}/typography-evidence/*.json
            ${{ runner.temp }}/typography-evidence/*.txt
            ${{ runner.temp }}/typography-evidence/*.log
          if-no-files-found: warn
          retention-days: 30
      - name: Retain complete real-browser traces separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typography-traces-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/typography-evidence/*-trace.zip
          if-no-files-found: warn
          retention-days: 14

name: Runtime layout and loading mask native evidence
on:
  pull_request:
    paths:
      - '.github/workflows/runtime-switching-evidence.yml'
      - 'apps/www/src/components/Homepage/**'
      - 'apps/www/src/components/PrototypePreviewer/**'
      - 'apps/www/src/content/docs/zh-cn/runtime-layout-parity.browser.test.ts'
      - 'apps/www/src/content/docs/zh-cn/runtime-loading-mask.browser.test.ts'
      - 'apps/www/src/content/docs/zh-cn/base-accordion-layout-parity.browser.test.ts'
      - 'apps/www/src/content/docs/accordion-demo.shared.ts'
      - 'scripts/test/runtime-test-plan.mjs'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-switching-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  browser-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies and identify Chromium
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/runtime-switching"
          "$CHROME" --version > "$RUNNER_TEMP/runtime-switching/browser-environment.txt"
          node --version > "$RUNNER_TEMP/runtime-switching/node-environment.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/runtime-switching/source-sha.txt"
      - name: Install the matching public CJK font fallback
        timeout-minutes: 3
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk fontconfig > "$RUNNER_TEMP/runtime-switching/font-environment.txt"
      - name: Disable the development toolbar on the real evidence surface
        run: |
          set -euo pipefail
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          TOOLBAR_SETTING=$(NO_COLOR=1 corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled)
          printf '%s\n' "$TOOLBAR_SETTING"
          grep -Eq '^◉ devToolbar\.enabled is set to[[:space:]]+false[[:space:]]*$' <<< "$TOOLBAR_SETTING"
      - name: Run all 14 paired layout and regional loading journeys
        timeout-minutes: 20
        env:
          PUI_RUNTIME_LAYOUT_EVIDENCE_DIR: ${{ runner.temp }}/runtime-switching/layout
          PROTO_UI_ACCORDION_LAYOUT_EVIDENCE_DIR: ${{ runner.temp }}/runtime-switching/accordion
          PUI_RUNTIME_MASK_EVIDENCE_DIR: ${{ runner.temp }}/runtime-switching/mask
        run: |
          set -euo pipefail
          # Supplementary direct evidence only. The standard required CI inventory
          # and its historical failures remain intact; this does not replace them.
          corepack pnpm@10.32.1 exec vitest run \
            apps/www/src/content/docs/zh-cn/runtime-layout-parity.browser.test.ts \
            apps/www/src/content/docs/zh-cn/runtime-loading-mask.browser.test.ts \
            apps/www/src/content/docs/zh-cn/base-accordion-layout-parity.browser.test.ts \
            --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json \
            --outputFile="$RUNNER_TEMP/runtime-switching/vitest.json" \
            2>&1 | tee "$RUNNER_TEMP/runtime-switching/browser.log"
          node --input-type=module - "$RUNNER_TEMP/runtime-switching/vitest.json" <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          assert.equal(report.numTotalTests, 14, 'The complete native runtime-switching inventory must run.');
          assert.equal(report.numPassedTests, 14, 'All paired layout and local-mask journeys must pass.');
          assert.equal(report.numFailedTests, 0);
          JS
      - name: Retain exact-source results, screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-switching-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-switching
          if-no-files-found: error
          retention-days: 30

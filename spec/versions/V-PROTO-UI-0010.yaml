    change: introduced
    summary: Opened the second globally exact 0.3 alpha train with the reviewed Vue 2 CLI, Base Image projection, consumer smoke evidence, and a bounded bootstrap-latest readiness exception.
tags: [release, prerelease, alpha, global-version]

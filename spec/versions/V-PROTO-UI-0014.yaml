  - path: internal/governance/release-workflow.md
openQuestions:
  - id: V-PROTO-UI-0014-Q-STAGE-CONVERGENCE
    question:
      en: How will retained Dropdown submenu and checkbox/radio criteria reach semantic and implementation completion before the existing RC-stage condition is satisfied?
      zh-CN: 保留的 Dropdown 子菜单与 checkbox/radio 条件将如何先完成语义和实现，再满足现有 RC 阶段条件？
    context:
      en: Their effective 0.3 placement has not been deferred. The preparation audit found missing capabilities, not only unexecuted final verification.
      zh-CN: 这些条件的有效 0.3 归属没有延期。准备审计发现的是能力缺口，而不只是尚未执行的最终验证。
    blocks: []
revisions:
  - version: 0.3.0-rc.1
    change: introduced
    summary: Prepared the intended first numbered RC identity under the current owner's direction, retaining draft lifecycle, next-channel identity, unresolved stage eligibility and final-source evidence requirements.
tags: [release, prerelease, release-candidate, global-version]

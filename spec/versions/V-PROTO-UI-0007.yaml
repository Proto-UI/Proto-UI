revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: Opened the draft rc.7 release train tracking executable-artifact production, trigger-group merge boundary, and repository-side Neo-Brutalist foundation.
  - version: 0.2.0-rc.7
    change: revised
    summary: Expanded the draft candidate to 40 public packages with Text Control, Base Textarea, and Brutalist Textarea.
  - version: 0.2.0-rc.7
    change: revised
    summary: Refreshed the draft over current main to include Scroll Area, Tooltip, Live/Async Region, direct Brutalist Badge/Card, focus and documentation runtime hardening, and the current bilingual discovery experience.
  - version: 0.2.0-rc.7
    change: updated
    summary: Activated after publishing all 40 packages, the Git tag, GitHub prerelease, and immutable spec snapshot evidence.

id: V-PROTO-UI-0007
type: version
title: Proto UI 0.2.0-rc.7
status: draft
since: 0.2.0-rc.7
summary: Seventh globally exact release candidate (draft) tracking executable-artifact production for all 40 public packages, continuous-trigger-group merge boundary, and the repository-side Neo-Brutalist foundation prior to publication.
statement:
  en: Proto UI 0.2.0-rc.7 is one ecosystem release identity that will be shared exactly by every public @proto.ui package and the corresponding immutable spec snapshot once published.
  zh-CN: Proto UI 0.2.0-rc.7 是将由全部公开 @proto.ui package 与对应不可变 spec snapshot 在发布后精确共享的一次生态发行身份。
release:
  version: 0.2.0-rc.7
  channel: prerelease
  gitTag: v0.2.0-rc.7
  npmDistTag: next
  packageVersionPolicy: exact
  packageScope: public-@proto.ui
dependsOn:
  decisions:
    - D-GLOBAL-RELEASE-VERSION-0001
criteria:
  - id: V-PROTO-UI-0007-DRAFT-BOUNDARY
    text:
      en: The draft entity may govern aligned rc.7 package manifests, release assets, and catalog references, but it must not claim npm, Git tag, GitHub Release, or immutable snapshot evidence.
      zh-CN: 本 draft 实体可以治理已对齐的 rc.7 package manifest、发行物料与 catalog 引用，但不得声称已存在 npm、Git tag、GitHub Release 或不可变 snapshot 证据。
  - id: V-PROTO-UI-0007-IDENTITY
    text:
      en: Before publication, VERSION, every public @proto.ui package manifest, staged internal dependency versions, and the spec snapshot must be prepared at 0.2.0-rc.7 exactly.
      zh-CN: 发布前，VERSION、全部公开 @proto.ui package manifest、暂存发布包的内部依赖版本以及 spec snapshot 必须统一准备为 0.2.0-rc.7。
  - id: V-PROTO-UI-0007-PUBLICATION
    text:
      en: The entity may become active only after npm publication, the v0.2.0-rc.7 Git tag, and snapshot digest evidence all exist.
      zh-CN: 仅当 npm 发布、v0.2.0-rc.7 Git tag 与 snapshot digest 证据均存在后，本实体才可转为 active。
sources:
  - path: internal/releases/0.2.0-rc.7/package-bom.json
  - path: internal/releases/0.2.0-rc.7/release-notes.md
  - path: internal/releases/0.2.0-rc.7/release-notes.zh-CN.md
openQuestions: []
revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: Opened the draft rc.7 release train tracking executable-artifact production, trigger-group merge boundary, and repository-side Neo-Brutalist foundation.
  - version: 0.2.0-rc.7
    change: revised
    summary: Expanded the draft candidate to 40 public packages with Text Control, Base Textarea, and Brutalist Textarea.
tags:
  - release
  - prerelease
  - global-version

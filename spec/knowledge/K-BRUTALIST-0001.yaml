id: K-BRUTALIST-0001
type: knowledge
title: The Brutalist style family is a Proto UI-maintained Neo-Brutalist design language, not a third-party compatibility target
status: draft
since: 0.2.0-rc.7
summary: 'Brutalist is a Proto UI-maintained design-language projection with visual recipes aligned to the pinned neobrutalism.dev source. Its protocol implementation and explicit extensions remain Proto UI-owned; no upstream certification or API-compatibility promise is implied.'

statement:
  en: Brutalist deliberately follows neobrutalism-components 3306a802 for visual typography, geometry, color and component depth, preserving license attribution for adapted recipes. Proto UI maintains its own semantic implementation, documented extensions and cross-adapter evidence. It must not claim upstream authorship, endorsement, certification or component API compatibility.
  zh-CN: Brutalist 的字体、几何、颜色与组件层级有意遵循 neobrutalism-components 3306a802，改编 recipe 保留许可署名。Proto UI 维护自己的语义实现、已说明扩展与跨 Adapter 证据；不得声称上游作者身份、背书、认证或组件 API 兼容性。

criteria:
  - id: K-BRUTALIST-0001-A
    text:
      en: >-
        Spec entities, docs, and package metadata for the Brutalist style family must describe it as a Proto UI-maintained design-language projection and must not assert third-party upstream ownership, certification, or compatibility-target status.


      zh-CN: >-
        Brutalist style family 的 spec 实体、文档与 package 元数据必须 将其描述为 Proto UI 维护的 design-language 投射，不得声称第三方 上游所有权、认证或兼容目标地位。



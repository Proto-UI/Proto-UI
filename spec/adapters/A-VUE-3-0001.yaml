id: A-VUE-3-0001
type: adapter
title: Official Vue 3 Web Adapter profile
status: active
since: 0.2.0-rc.7
summary: The official Vue 3 Web Adapter owns the Runtime lifecycle boundary and translates Vue props, attrs, and Web input into required semantic modules.
adapterProfile:
  package: '@proto.ui/adapter-vue'
  target:
    platform: web
    runtime:
      name: vue
      versionRange: '>=3.4.0 <4'
statement:
  zh-CN: >-
    该 profile 表示 `@proto.ui/adapter-vue` 在 Web platform 上面向 Vue `>=3.4.0 <4` 的 official translation identity。当前已编目的 Props slice 合并 component props 与 `ctx.attrs` 后执行 Adapter 分类，通过 deep watch、attrs reconciliation 与 component-updated hook 发送 invalidation。Vue component-updated 阶段的其它工作可以形成 callback-safe runtime sync point，因此关闭 auto update 后 watcher 仍可能在同一 host update 中派发，但不得因此产生 Proto render commit。Event slice 固定安装 required Event Module，通过共用 Web router 把 native input 翻译为 root/global Proto event stream，只在 Vue commit boundary 之后启用 delivery，按 logical interaction owner 路由 semantic event，并把 default-action request 翻译为 DOM `preventDefault()`。Lifecycle slice 由一个 Vue component owner 持有一个 RuntimeSession，将 KeepAlive deactivate/reactivate 翻译为 repeatable mount epoch，将 terminal app/component teardown 翻译为 dispose，并透传结构化 lifecycle diagnostics；Lifecycle 是 Runtime 与 Adapter 的执行协议，不虚构对应 Module 或 host-cap。State slice 使用 standard Runtime 固定安装的 required State Module；其 value 与 watcher 属于 instance lifetime，mutation 不隐式触发 Vue render，且纯内存语义不要求 Adapter 提供 State host-cap。Expose core slice 同样由 standard Runtime 固定安装；component public instance 通过 `getExposes()` 提供 detached App Maker record，递归 callable 自动进入 instance callback scope，registry 跨 repeatable view epoch 保留且 core 不要求直接 host-cap。Expose State slice 将 internal State handle 降权为稳定、只读、同源的 external handle，并通过 Adapter 提供的 complete record sink 发布到同一 public instance；sink rebind/terminal disposal 清理旧 record，DOM/CSS mirror 不属于该 baseline。 Expose Event slice 将 shared-key declaration 与 outward registry/emit bridge 组合，并通过 Adapter 提供的 host-neutral signal sink 映射为 component emit/`onXxx` listener；listener attrs 不进入 Proto raw props，declaration metadata 不进入 public-instance `getExposes()` record，repeatable view epoch 保留 registration。


  en: >-
    This profile is the official translation identity of `@proto.ui/adapter-vue` for Vue `>=3.4.0 <4` on the Web platform. Its currently cataloged Props slice combines component props with `ctx.attrs`, applies Adapter classification, and sends invalidation through deep watches, attrs reconciliation, and a component-updated hook. Other work in Vue's component-updated phase may form a callback-safe runtime synchronization point, so watchers may still dispatch during the same host update when automatic update is disabled, but this must not produce a Proto render commit by itself. Its Event slice installs the required Event module, uses the shared Web router to translate native input into root and global Proto event streams, enables delivery only after the Vue commit boundary, routes semantic events by logical interaction owner, and translates default-action requests to DOM `preventDefault()`. Its Lifecycle slice lets one Vue component owner retain one RuntimeSession, translates KeepAlive deactivation and reactivation into repeatable mount epochs, maps terminal app or component teardown to disposal, and forwards structured lifecycle diagnostics. Lifecycle is a Runtime-to-Adapter execution protocol and does not invent a corresponding Module or host capability. Its State slice uses the required State module installed by the standard Runtime; values and watchers belong to instance lifetime, mutation does not implicitly render Vue output, and the in-memory semantics require no State host capability from the Adapter. Its Expose core slice is likewise installed by the standard Runtime; the component public instance provides detached App Maker records through `getExposes()`, recursively callable values automatically enter the instance callback scope, the registry survives repeatable view epochs, and the core requires no direct host capability. Its Expose State slice attenuates internal State handles into stable, read-only, same-source external handles and publishes them to the same public instance through an Adapter-provided complete-record sink; sink rebinding and terminal disposal clear old records, while DOM or CSS mirroring is outside this baseline. Its Expose Event slice composes shared-key declaration with the outward registry and emit bridge, then maps the host-neutral signal sink to component emit or an `onXxx` listener; listener attrs do not enter Proto raw props, declaration metadata does not enter the public-instance `getExposes()` record, and registrations survive repeatable view epochs.


criteria:
  - id: A-VUE-3-0001-A
    text:
      zh-CN: Profile identity 必须对应 `@proto.ui/adapter-vue` 与 peer range `vue >=3.4.0 <4`，不得被表述为所有 Vue 版本或非 Web host 的保证。
      en: The profile identity must correspond to `@proto.ui/adapter-vue` and peer range `vue >=3.4.0 <4` and must not be represented as a guarantee for every Vue version or a non-Web host.
  - id: A-VUE-3-0001-B
    text:
      zh-CN: Adapter 必须把 Props Module 作为 required Module 接入，并以 translated capability 提供 `HC-PROPS-SOURCE-0001`。
      en: The Adapter must wire the Props Module as required and provide `HC-PROPS-SOURCE-0001` as a translated capability.
  - id: A-VUE-3-0001-C
    text:
      zh-CN: 默认 Props normalization 必须在合并 component props 与 attrs 后剥离 class/style presentation fields 与函数型 `onXxx` listeners，同时允许显式 `getProps` option 替换分类策略。
      en: Default Props normalization must combine component props and attrs, then exclude class and style presentation fields and function-valued `onXxx` listeners while allowing an explicit `getProps` option to replace the classification policy.
  - id: A-VUE-3-0001-D
    text:
      zh-CN: 'Host input change 只能使 snapshot 失效；Vue component-updated 中合法 callback-safe sync 可以派发 watcher，但 `autoUpdateOnPropsChange: false` 时不得仅因 Props invalidation 产生 Proto render commit。'
      en: 'A host-input change may only invalidate the snapshot; a legitimate callback-safe sync during Vue component-updated may dispatch watchers, but with `autoUpdateOnPropsChange: false`, Props invalidation alone must not produce a Proto render commit.'
  - id: A-VUE-3-0001-E
    text:
      zh-CN: Adapter 必须把 Event Module 作为 required Module 接入，并以 translated capability 提供 `HC-EVENT-BINDING-0001` 与 `HC-DEFAULT-ACTION-0001`；这些关系不得把 DOM `EventTarget` 写成跨宿主保证。
      en: The Adapter must wire the Event module as required and provide `HC-EVENT-BINDING-0001` and `HC-DEFAULT-ACTION-0001` as translated capabilities; these relations must not turn DOM `EventTarget` into a cross-host guarantee.
  - id: A-VUE-3-0001-F
    text:
      zh-CN: Vue view wiring 必须在 commit boundary 后把 host input 翻译为当前支持的 root/global Event type，按 logical owner 路由 semantic event，并在 unmount 后停止旧 root 的 delivery。
      en: Vue view wiring must translate host input into currently supported root and global Event types after the commit boundary, route semantic events by logical owner, and stop delivery from the old root after unmount.
  - id: A-VUE-3-0001-G
    text:
      zh-CN: 一个 Vue component lifecycle owner 必须持有一个 Proto RuntimeSession；KeepAlive deactivate/reactivate 必须推进同一 instance 的 repeatable mount epoch，而 terminal owner teardown 必须且只能 dispose 该 instance 一次。
      en: One Vue component lifecycle owner must retain one Proto RuntimeSession; KeepAlive deactivation and reactivation must advance repeatable mount epochs of the same instance, while terminal owner teardown must dispose that instance exactly once.
  - id: A-VUE-3-0001-H
    text:
      zh-CN: Adapter diagnostics 必须透传 Runtime 的 structured lifecycle event stream；deprecated CP0-CP10 只允许作为有损兼容投影，且该协议不得被建模为 Module support 或 host-cap provision。
      en: Adapter diagnostics must forward Runtime's structured lifecycle event stream; deprecated CP0-CP10 checkpoints may exist only as a lossy compatibility projection, and this protocol must not be modeled as Module support or host-capability provision.
  - id: A-VUE-3-0001-I
    text:
      zh-CN: Vue owner 必须在 created callbacks 后按最新 ViewIntent 调和首次及后续 view epoch，在首次 commit 与 view effects 一致前保持新 root 隐藏，并让 terminal teardown 权限高于 desired presence。
      en: The Vue owner must reconcile the latest ViewIntent into initial and subsequent view epochs after created callbacks, keep a new root hidden until its first commit and view effects are coherent, and let terminal teardown authority override desired presence.
  - id: A-VUE-3-0001-J
    text:
      zh-CN: Adapter 必须通过 standard Runtime 接入 required State Module，跨 repeatable view epoch 保留其 instance-owned value 与 watcher；State mutation 不得绕过显式 Adapter update 触发 Vue render，且 profile 不得虚构 State host-cap。
      en: The Adapter must wire the required State module through the standard Runtime and retain its instance-owned values and watchers across repeatable view epochs; State mutation must not bypass explicit Adapter update to render Vue output, and the profile must not invent a State host capability.
  - id: A-VUE-3-0001-K
    text:
      zh-CN: Adapter 必须通过 standard Runtime 接入 required Expose core Module，以 component public instance `getExposes()` 向 App Maker 返回 detached record，跨 repeatable view epoch 保留 registry，并让 record 中的 JavaScript callable 自动进入所属 instance callback scope；profile 不得虚构 core Expose host-cap。
      en: The Adapter must wire the required Expose core module through the standard Runtime, return a detached App Maker record from component-public-instance `getExposes()`, preserve the registry across repeatable view epochs, and automatically enter the owning instance callback scope for JavaScript callables in that record; the profile must not invent a core Expose host capability.
  - id: A-VUE-3-0001-L
    text:
      zh-CN: Adapter 必须接入 required Expose State Module，并以 translated capability 提供 `HC-EXPOSES-RECORD-SINK-0001`；public instance 中的 state 必须是稳定、只读、同源 external handle，跨 repeatable view epoch 保留，sink replacement/removal 与 terminal disposal 必须清理旧 record，且该关系不得暗含 DOM/CSS projection。
      en: The Adapter must wire the required Expose State module and provide `HC-EXPOSES-RECORD-SINK-0001` as a translated capability; State entries on the public instance must be stable, read-only, same-source external handles retained across repeatable view epochs, sink replacement or removal and terminal disposal must clear old records, and this relation must not imply DOM or CSS projection.
  - id: A-VUE-3-0001-M
    text:
      zh-CN: Adapter 必须接入 required Expose Event semantic Module，并以 translated capability 提供 `HC-EXPOSE-EVENT-SINK-0001`；合法 emission 映射到 component emit/当前 `onXxx` listener，listener attrs 不得进入 Proto raw props，declaration metadata 不得进入 `getExposes()`，且该关系不得被解释为 Event input routing。
      en: The Adapter must wire the required Expose Event semantic Module and provide `HC-EXPOSE-EVENT-SINK-0001` as a translated capability; valid emissions map to component emit or the current `onXxx` listener, listener attrs must not enter Proto raw props, declaration metadata must not enter `getExposes()`, and this relation must not be interpreted as Event input routing.
supports:
  modules:
    - id: M-PROPS-0001
      role: required-module
      note: Props is required for the standard Maker-to-Component configuration channel.
    - id: M-EVENT-0001
      role: required-module
      note: Event is installed for the standard User-to-Component interaction channel; host binding is only required for scopes with registrations.
    - id: M-STATE-0001
      role: required-module
      note: State is the host-neutral instance memory baseline and requires no Adapter-provided host capability.
    - id: M-EXPOSE-0001
      role: required-module
      note: Expose core provides the standard Component-to-App-Maker registry and directly requires no Adapter-provided host capability.
    - id: M-EXPOSE-STATE-0001
      role: required-module
      note: Expose State finalizes the complete outward record and attenuates internal State handles before Adapter publication.
    - id: M-EXPOSE-EVENT-0001
      role: required-module
      note: The standalone Expose Event module owns the Component-to-App-Maker outward-signal bridge and receives its sink through expose-event wiring.
    - id: M-IMAGE-VIEW-0001
      since: 0.3.0-alpha.0
      role: optional-module
      note: Vue resolves declared Image View requirements to one physical HTMLImageElement root and retains the generation-bound host lease.
provides:
  hostCaps:
    - id: HC-PROPS-SOURCE-0001
      role: translated-capability
      note: Vue props and attrs are normalized into a readable source with watch and component-updated invalidation.
    - id: HC-EVENT-BINDING-0001
      role: translated-capability
      note: The shared Web router translates DOM input into Adapter-owned root and global Proto event streams after Vue commit.
    - id: HC-DEFAULT-ACTION-0001
      role: translated-capability
      note: Default-action cancellation requests are translated to preventDefault when the native DOM event supports it.
    - id: HC-EXPOSES-RECORD-SINK-0001
      role: translated-capability
      note: Vue receives classified translation snapshots, filters declaration descriptors, and returns detached public records through component-public-instance getExposes.
    - id: HC-EXPOSE-EVENT-SINK-0001
      role: translated-capability
      note: Vue maps validated outward signal keys to component emit and current onXxx listeners.
    - id: HC-IMAGE-VIEW-0001
      since: 0.3.0-alpha.0
      role: translated-capability
      note: Vue maps Image View to the physical image root and carries loading completion through the host lease.

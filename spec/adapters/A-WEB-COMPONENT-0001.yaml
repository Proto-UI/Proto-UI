revisions:
  - version: 0.3.0-alpha.0
    change: revised
    summary: Migrated the outward signal sink from Event wiring to the standalone Expose Event Module.
  - version: 0.2.0-rc.7
    change: revised
    summary: Added required Expose Event support, translated signal sink provision, persistent-owner CustomEvent mapping, and declaration-record exclusion.
  - version: 0.2.0-rc.7
    change: revised
    summary: Added required Expose State composition, finalized-record sink provision, stable read-only external handles, and sink lifecycle criteria.
  - version: 0.2.0-rc.7
    change: revised
    summary: Added required host-neutral Expose core support, Custom Element record access, instance-lifetime preservation, terminal invalidation, and automatic callback-scope translation.
  - version: 0.2.0-rc.7
    change: revised
    summary: Added required host-neutral State Module support, instance-lifetime preservation, explicit-render behavior, and no-host-cap criteria.
  - version: 0.2.0-rc.7
    change: revised
    summary: Cataloged lifecycle ownership, repeatable mount epochs, structured diagnostics, confirmed-disconnection disposal, and ViewIntent reconciliation without inventing a Lifecycle Module or host capability.
  - version: 0.2.0-rc.7
    change: revised
    summary: Added required Event Module support, translated scoped Event binding, Default Action provision, logical-owner routing and disposal criteria, and conformance evidence.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Cataloged the official Web Component profile identity and its source plus direct-push Props translation slice.

id: HC-ANCHORED-POSITION-0001
type: host-cap
title: Host measures and maintains anchored floating geometry
status: draft
since: 0.2.0-rc.0
summary: The host attaches a bounded positioning lease that measures anchor and floating targets, resolves collision policy, writes non-transform coordinates, and observes relevant geometry changes.
criteria:
  - id: HC-ANCHORED-POSITION-0001-A
    text:
      en: 'The host translates opaque anchor/floating targets and placement policy into a lease with update, requestUpdate and dispose. The current Web realization accepts HTMLElement targets, uses Floating UI, and projects coordinates and size without owning transform. Invalid Web targets acquire no observation.'
      zh-CN: 'host 将不透明 anchor/floating target 与 placement policy 翻译为含 update、requestUpdate、dispose 的 lease。当前 Web 实现接受 HTMLElement target，使用 Floating UI 投射坐标与尺寸且不拥有 transform；无效 Web target 不获取 observation。'
  - id: HC-ANCHORED-POSITION-0001-B
    text:
      en: 'Only the current computation of a live lease may publish geometry, size variables or resolved placement. Replacement, newer updates and disposal invalidate older work. Disposal revokes observation and cannot be undone by update; observation never enables animation-frame polling by default.'
      zh-CN: '仅 live lease 的当前计算可发布几何、尺寸变量或 resolved placement。替换、更新及 dispose 使旧工作失效。dispose 撤销 observation，update 不得将其复活；observation 默认不启用 animation-frame polling。'
satisfies:
  contracts:
    - C-ANCHORED-POSITIONING-0001
verifies:
  tests: [T-ANCHORED-POSITIONING-0001]
sources:
  - path: packages/modules/positioning/src/caps.ts
  - path: packages/modules/positioning/src/web/floating-ui-host.ts
revisions:
  - version: 0.3.0-alpha.0
    change: clarified
    summary: Clarified current-computation ownership and terminal observation cleanup; retained the existing geometry and Portal contract.
  - version: 0.2.0-rc.0
    change: introduced
    summary: Added the high-level anchored positioning host capability and lease boundary.
tags: [host-capability, positioning, overlay, geometry]

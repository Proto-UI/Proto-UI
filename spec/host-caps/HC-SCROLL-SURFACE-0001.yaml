    change: revised
    summary: Added Move Gesture-backed composed Thumb control mapping and bounded cleanup.
  - version: 0.2.0-rc.7
    change: revised
    summary: Added passive composed chrome geometry projection and cleanup to the bounded surface lease.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Drafted the cross-host capability for bounded scroll sessions, facts, requests, projection support, and cleanup.
tags: [scroll, host-capability, session, projection]

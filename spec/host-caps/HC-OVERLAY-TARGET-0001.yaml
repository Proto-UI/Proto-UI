id: HC-OVERLAY-TARGET-0001
type: host-cap
title: Host resolves an Overlay target without a browser identity requirement
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Node conformance proves that a host-private target can reach the existing resource and available-space ports without HTMLElement. Real GPUI transport, window scope, layers, layout and complete Overlay interaction remain unverified.
  zh-CN: Node conformance 证明 host-private target 可不依赖 HTMLElement 到达已有资源与 available-space port；真实 GPUI transport、window scope、layer/layout 与完整 Overlay 交互仍未验证。
summary: An explicit host target resolver validates identities before physical Overlay resources are acquired.
statement:
  en: OVERLAY_TARGET_HOST_CAP provides root() and resolve(candidate). Only a current verified host-private object may be returned. Prototype registration remains opaque and never proves physical ownership by itself. Portal/layer capabilities accept a host target rather than requiring DOM types; Web providers retain their actual HTMLElement specialization.
  zh-CN: OVERLAY_TARGET_HOST_CAP 提供 root()/resolve(candidate)，仅能返回当前经验证的 host-private object。Prototype registration 保持opaque，本身不证明物理ownership；Portal/layer cap接收宿主target而不要求DOM类型，Web provider仍保留实际HTMLElement特化。
criteria:
  - id: HC-OVERLAY-TARGET-0001-IDENTITY
    text:
      en: Explicit content is resolved by the current provider; otherwise its root is resolved. Foreign, missing or primitive identities cannot acquire portal, layer, modal or available-space output. A rejected explicit target does not silently fall back to another root. Missing support remains diagnostic; a DOM-free runtime must not evaluate an unguarded HTMLElement global.
      zh-CN: 显式content由当前provider验证，否则验证provider root。foreign/missing/primitive身份不得获取portal/layer/modal/available-space输出；显式目标被拒时不静默换root。缺失支持保留诊断，无DOM runtime不得读取未保护的HTMLElement全局。
  - id: HC-OVERLAY-TARGET-0001-LIFETIME
    text:
      en: Scope/view/provider changes during resolution invalidate the attempted acquisition. A rejected replacement withdraws previous physical resources while retaining logical open/registration state. Returning to a current accepted target can reacquire; view deactivation/detach retires availability. The same resolved target feeds one reconciliation's layer and geometry operations.
      zh-CN: 解析期间scope/view/provider变化使此次获取无效。替换目标被拒时撤销旧物理资源，保留logical open/registration；恢复当前合法目标可重新获取。view停用/detach撤availability，同一次协调的layer/geometry使用同一resolved target。
  - id: HC-OVERLAY-TARGET-0001-BOUNDARY
    text:
      en: Host resolution is not native layout, focus, accessibility-tree membership or pixel evidence. The legacy guarded Web HOST_ELEMENT_CAP path accepts only real HTMLElement targets; it never accepts arbitrary objects as a native fallback. GPUI still must lower logical available-space frames and prove actual window/layer lifetime before admission.
      zh-CN: host解析不等于native layout/focus、辅助树关系或像素证明。兼容Web HOST_ELEMENT_CAP通路只接收真实HTMLElement，不能将任意object当作native fallback。GPUI仍须降下logical available-space frame并证明真实window/layer生命周期。

id: HC-TEXT-CONTROL-0001
type: host-cap
title: Host can lease one multiline plain-text editor
status: draft
since: 0.2.0-rc.7
summary: The host can resolve a portable multiline editing requirement to one host-owned editor and return an updateable, inspectable, disposable lease.
statement:
  zh-CN: >-
    Host 可以将 Text Control portable requirement 与 patch 投影到一个 host-owned 多行纯文本 editor，标准化该 target 的 input/change/composition event，保留系统 editing session，并返回可 update、snapshot 与 dispose 的 mount lease。当前 Web implementation 使用 `HTMLTextAreaElement`。


  en: >-
    The host can project a portable Text Control requirement and patch to one host-owned multiline plain-text editor, normalize that target's input/change/composition events, preserve the system editing session, and return a mount lease that can be updated, inspected, and disposed. The current Web implementation uses `HTMLTextAreaElement`.


satisfies:
  contracts:
    - C-TEXT-CONTROL-0001
dependsOn:
  contracts:
    - C-HOST-SURFACE-PROJECTION-0001
verifies:
  tests:
    - T-TEXT-CONTROL-0001
sources:
  - path: packages/modules/text-control/src/caps.ts
  - path: packages/modules/text-control/src/web.ts
revisions:
  - version: 0.2.0-rc.7
    change: revised
    summary: Made the leased physical editor the default presentation surface when adapter infrastructure retains a separate boundary wrapper.
  - version: 0.2.0-rc.7
    change: revised
    summary: Generalized the host lease from a declared Web tag to a host-selected multiline editor.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Cataloged the Text Control host lease for one native textarea.
tags:
  - text-control
  - textarea
  - host-capability

id: HC-PREFERENCE-INVALIDATION-0001
type: host-cap
title: Host invalidates bounded paired preferences
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Draft fixed-key Web provider for issue 793; native and Compiler providers are excluded and stable admission is pending.
  zh-CN: Issue 793 固定 key Web provider 草案，排除 native/Compiler provider，待稳定接纳。
summary: A paired getter and keyed subscription provide current preference facts without host objects.
statement:
  en: RULE_META_PREFERENCE_SOURCE_CAP pairs the exact getter with subscribe(keys, invalidate). It has no synchronous subscription callback, delivers no values and returns an independent idempotent disposer.
  zh-CN: RULE_META_PREFERENCE_SOURCE_CAP 将精确 getter 与 subscribe(keys, invalidate) 配对。订阅不做同步回调、不投递值，并返回独立幂等 disposer。
criteria:
  - id: HC-PREFERENCE-INVALIDATION-0001-A
    text:
      en: Each consumed key observes every defined media-query alternative. A known value requires exactly one explicit match, including no-preference and forced-colors none. No matches, conflicting matches, unavailable matchMedia or unobservable query lists yield unknown.
      zh-CN: 每个消费 key 观察所有定义的 media-query 候选值；已知值要求恰一个显式匹配，包括 no-preference 和 forced-colors none。无匹配、冲突匹配、缺 matchMedia 或不可观察 query list 均为 unknown。
  - id: HC-PREFERENCE-INVALIDATION-0001-B
    text:
      en: One loaded adapter-base module shares one listener per Document and relevant query. Creation is lazy, subscriptions observe only their consumed keys, and final key release disconnects its listeners. Different Documents remain isolated.
      zh-CN: 同一 adapter-base 模块按 Document 和相关 query 共享一个 listener。构造惰性，订阅仅观察消费 key，最后一个 key 租约释放即断开，Document 之间隔离。
  - id: HC-PREFERENCE-INVALIDATION-0001-C
    text:
      en: Microtask batches compare final effective values and invalidate each still-active affected subscription once. Listener errors do not starve peers and remain asynchronously observable. Released listeners and prior connection generations ignore queued and late callbacks.
      zh-CN: microtask batch 比较最终有效值，对仍活动且受影响的订阅通知一次。listener 抛错不阻断其它 listener，错误仍异步可观察。已释放订阅和旧连接 generation 忽略排队与迟到回调。
  - id: HC-PREFERENCE-INVALIDATION-0001-D
    text:
      en: Default Web adapters pair only their own default getter; custom getMeta never silently inherits the document source. This source conveys no alpha-fill, blur, refraction or other rendering support fact.
      zh-CN: 默认 Web adapter 仅与自有 default getter 配对，custom getMeta 不得静默接上 document source。本 source 不表达 alpha fill、blur、refraction 或其它渲染支持事实。
satisfies:
  contracts:
    - id: C-RULE-PREFERENCES-0001
      anchors: [C-RULE-PREFERENCES-0001-A, C-RULE-PREFERENCES-0001-B]
relates:
  modules: [M-RULE-META-0001]
verifies:
  tests: [T-RULE-PREFERENCES-0001]
openQuestions:
  - id: HC-PREFERENCE-INVALIDATION-0001-Q-ADMISSION
    question: Has the provider received independent admission beyond the bounded four-Web evidence?
    blocks: [activation:HC-PREFERENCE-INVALIDATION-0001]
sources:
  - path: packages/adapters/base/src/platform/web-preference-source.ts
  - path: packages/adapters/base/test/web-preference-source.test.ts
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added explicit-alternative, realm-isolated Web preference observation as a separate draft source.
tags: [host-capability, preferences, web, invalidation, draft]

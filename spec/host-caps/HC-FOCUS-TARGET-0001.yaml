  - path: packages/adapters/vue2/src/runtime/modules.ts
  - path: packages/adapters/web-component/src/runtime/modules.ts
revisions:
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Linked criterion D's retained-entry host boundary to its governing C-AS-FOCUS-ENTRY-0001-H criterion without changing semantics or lifecycle.
  - version: 0.3.0-alpha.1
    change: refined
    summary: Owner-approved separation preserves synchronous programmatic effects and root-scoped native admission while retaining rejected entry intent until its actual event owner is ready; committed blur and A11y remain independent.
  - version: 0.3.0-alpha.0
    change: introduced
    summary: Cataloged bounded Focus ownership and executable evidence.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Cataloged the required privileged FOCUS_REQUEST_FOCUS_CAP(target, options or undefined, kind) shape and resolved surface-owner native readiness boundary (criterion D), preserving committed one-shot effects and fact ownership; this breaking privileged change does not establish new host conformance or alter lifecycle.
    breaking: true

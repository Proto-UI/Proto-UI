id: HC-FEEDBACK-PRESENCE-PRESENTATION-0001
type: host-cap
title: Presence endpoints receive physical-view application receipts
status: draft
since: 0.2.0-rc.0
summary: One host-owned projection applies typed translate and opacity without becoming phase authority.
lifecycleRationale:
  en: Real Document, Shadow and native frame evidence and independent Compiler interpretation remain required. Source-model or CSSOM checks do not establish physical animation conformance.
statement:
  en: The host provides cancellable presentation frames, monotonic time, live visibility and motion preference, reference-box and root-font bases and atomic typed endpoint application. The phase owner's independent deadline remains separate from frame scheduling. Physical bindings are host-minted identities, not prototype-supplied epochs.
criteria:
  - id: HC-FEEDBACK-PRESENCE-PRESENTATION-0001-DOCUMENT
    text:
      en: A physical surface binding includes its owner Document identity. Cross-document adoption retires the old projection epoch, cancels old-frame work and disconnects old preference, visibility and geometry observers before binding destination inputs. The current semantic frame is admitted as a new physical view without extending its logical attempt deadline. Old document callbacks cannot paint or acknowledge the destination. Same-document movement does not create a document epoch. Host adoption uses an early retirement barrier before existing reentrant adoption work, followed by destination-ready admission after that work; newly created destination sinks also wait for readiness. Explicit host adoption notifications are removable on final disposal; subsequent commits and stale callback boundaries also validate current document identity.
  - id: HC-FEEDBACK-PRESENCE-PRESENTATION-0001-LEASE
    text:
      en: One view-owned writer composes presentation with final semantic style and existing geometry displacement, preserving unrelated transform and opacity owners. It rejects stale bindings and revisions before and after reentrant application. Accepted receipts cover all requested channels atomically. A stolen lease is diagnosed and preserved, never overwritten. Release removes only current owned transient writes.
  - id: HC-FEEDBACK-PRESENCE-PRESENTATION-0001-COMPOSITION
    text:
      en: Layout and presentation provide separate typed affine translation leases to one physical translation writer. The writer composes the live layout baseline and presentation delta, preserves unrelated transform channels, and applies layout updates while presentation is active. Releasing presentation restores the latest layout baseline rather than a stale captured baseline. No CSS parsing, computed-transform decomposition or hardcoded component offsets supply typed geometry.
  - id: HC-FEEDBACK-PRESENCE-PRESENTATION-0001-PROFILE
    text:
      en: The first source-Web provider admits neutral entered endpoints only, with zero coefficients on both translate axes and opacity one or absent. It detects unsupported-endpoint before acquiring or writing transient presentation leases, preserves the ordinary semantic baseline and requests current-attempt diagnosed settlement. Generic syntax remains broader; other backends may independently implement it. Unsupported profiles never claim a successfully presented arbitrary endpoint.
  - id: HC-FEEDBACK-PRESENCE-PRESENTATION-0001-INPUTS
    text:
      en: Own-box dimensions are actual layout-space reference-box extents; rootText uses the real root font. Missing or non-finite bases, unsupported channels and unknown preferences are diagnosed without computed-CSS inference or guessed viewport offsets. A new physical view cannot inherit an old displayed sample. Settled, hidden and reduced states do not poll or replay on restoration.
  - id: HC-FEEDBACK-PRESENCE-PRESENTATION-0001-EVIDENCE
    text:
      en: Cold and endpoint acknowledgements are current frame application receipts, not rasterization certificates. Conformance additionally requires exact-build real frame captures for cold open, retained close, four directions, reversal and two independently retained Content and Mask surfaces. Pure-model tests, token output and explicit unsupported diagnostics do not substitute for host or Compiler acceptance.
dependsOn:
  contracts:
    - C-FEEDBACK-PRESENCE-PRESENTATION-0001
revisions:
  - version: 0.2.0-rc.0
    change: introduced
    summary: Establish physical binding, atomic application and evidence boundaries for presence presentation.

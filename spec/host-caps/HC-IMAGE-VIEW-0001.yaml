id: HC-IMAGE-VIEW-0001
type: host-cap
title: Host can lease one image presentation target
status: draft
since: 0.3.0-alpha.0
summary: The host can resolve a portable image presentation requirement to one host-owned image target and return an updateable, inspectable, disposable generation-bound lease.
statement:
  zh-CN: >-
    Host 可以将 Image View portable requirement 与 patch 投影到一个 host-owned image target，标准化该 target 的 loading status transition，使 update 与 completion 携带 generation identity，并返回可 update、snapshot 与 dispose 的 mount lease。


  en: >-
    The host can project a portable Image View requirement and patch to one host-owned image target, normalize that target's loading status transitions, carry generation identity through updates and completions, and return a mount lease that can be updated, inspected, and disposed.


satisfies:
  contracts:
    - C-IMAGE-VIEW-0001
dependsOn:
  contracts:
    - C-HOST-SURFACE-PROJECTION-0001
verifies:
  tests:
    - T-IMAGE-VIEW-0001
sources:
  - path: packages/modules/image-view/src/caps.ts
  - path: packages/modules/image-view/src/create.ts
  - path: packages/modules/image-view/src/web.ts
revisions:
  - version: 0.3.0-alpha.0
    change: introduced
    summary: >-
      Cataloged the Image View host lease for one host-owned image presentation target with generation-bound lifecycle.


  - version: 0.3.0-alpha.0
    change: clarified
    summary: Made request-bound Web realization and cleanup addressable without generalizing readiness across hosts.

tags:
  - image
  - host-capability
criteria:
  - id: HC-IMAGE-VIEW-0001-A
    text:
      en: The host owns one image target and immutable request identity, projects current source/alternative text/fit, and clears replaced visuals. Web completion comes from a complete displayable image or request-bound decode settlement; stale settlements and native load/error events cannot become current portable transitions. Disposal releases the target and listeners.
      zh-CN: host 拥有一个 image target 与不可变 request identity，投射当前 source/alternative text/fit 并清除被替换视觉。Web completion 来自 complete 且可展示图像或绑定 request 的 decode settlement；旧 settlement 与 native load/error 不得成为当前 portable transition。dispose 释放 target 与 listener。

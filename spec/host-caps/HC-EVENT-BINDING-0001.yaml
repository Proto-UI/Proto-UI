openQuestions:
  - id: HC-EVENT-BINDING-0001-Q-LEASE-SHAPE
    question:
      zh-CN: 当前 `EventTarget` getter cap 应直接替换为统一 `bind(registration) => lease`，还是保留为 Web-only helper 并由新的跨宿主 binding cap 包装？
      en: Should the current `EventTarget` getter caps be replaced directly by a unified `bind(registration) => lease`, or remain Web-only helpers wrapped by a new cross-host binding cap?
    context:
      zh-CN: 当前三类 official profile 都是 Web host，可以通过 `EventTarget` 实现完整语义；该形状不能证明 Flutter 或其它非 DOM host 能自然提供相同对象。
      en: All current official profiles are Web hosts and can realize the semantics through `EventTarget`; this shape does not prove that Flutter or another non-DOM host can naturally provide the same object.
    blocks: [cross-host-event-binding-port]
  - id: HC-EVENT-BINDING-0001-Q-OPTIONS
    question:
      zh-CN: Event registration options 的 portable subset 应为空、只包含一次性策略，还是定义独立于 DOM capture/passive 的跨宿主策略对象？
      en: Should the portable Event registration options subset be empty, contain only a once policy, or define a cross-host policy object independent of DOM capture and passive options?
    context:
      zh-CN: 当前 facade 类型直接使用 DOM `EventListenerOptions`，属于未解决的 Web 偏置；本轮不把它提升为 host-cap guarantee。
      en: The current facade type directly uses DOM `EventListenerOptions`, which is unresolved Web bias; this pass does not promote it into a host-cap guarantee.
    blocks: [portable-event-listener-options]
revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: Cataloged host-neutral scoped Event binding, translation, conditional availability, rebinding, and cleanup while recording the current EventTarget realization as portability debt.
tags: [host-capability, event, binding, adapter, lifecycle]

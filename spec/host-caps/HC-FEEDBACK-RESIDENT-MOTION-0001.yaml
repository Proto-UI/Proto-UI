id: HC-FEEDBACK-RESIDENT-MOTION-0001
type: host-cap
title: Resident motion projects typed final targets through one view-owned writer
status: draft
since: 0.2.0-rc.0
lifecycleRationale:
  en: Shared model and Web development implementation exist; physical timing, real theme consumption, native and Compiler composition remain required evidence.
summary: A motion sink consumes final semantic style and timing declarations with view/revision ownership, host unit bases and typed palette inputs.
statement:
  en: The host supplies monotonic time, cancellable frame scheduling, physical reference-box and root-font bases, a live motion preference, visibility, supported property channels and a versioned typed palette. It applies the shared sampler output without interpreting component identity or Rule conditions. Targets remain independent of presentation and computed CSS is not a target source.
criteria:
  - id: HC-FEEDBACK-RESIDENT-MOTION-0001-OWNER
    text:
      en: The sink replaces legacy style projection for its admitted frame and preserves Root provenance while removing only translated tokens it owns. It releases its own inline or native property leases on detach/dispose without erasing a later external writer. Relinquishing a channel ends its saved-original lease; reacquisition snapshots the current external value and priority. Every physical write after a reentrant effects callback must recheck the current frame lease so release or a newer commit cannot be overwritten. Unsupported channels preserve ordinary target style. Optical material requires a combined atomic owner and is not admitted by a separate concurrent sink.
  - id: HC-FEEDBACK-RESIDENT-MOTION-0001-ENVIRONMENT
    text:
      en: Unknown preferences, missing unit bases or palette roles and unsupported property channels cannot be guessed. Reduce or hidden settles; restoration does not replay. Web ResizeObserver measurement is layout-space, not a transformed viewport rectangle. Theme CSS and typed palettes must derive from one source.
  - id: HC-FEEDBACK-RESIDENT-MOTION-0001-EPOCH
    text:
      en: Older view/revision frames and released callbacks cannot paint. Physical surface replacement receives a fresh settled projection. The host never turns presentation samples into State or retained final targets.
dependsOn:
  contracts:
    - C-FEEDBACK-RESIDENT-MOTION-0001
sources:
  - path: packages/modules/feedback/src/motion/sink.ts
  - path: packages/modules/feedback/src/motion/projector.ts
  - path: packages/adapters/base/src/motion/web-resident-motion.ts
revisions:
  - version: 0.2.0-rc.0
    change: introduced
    summary: Added a bounded typed timing/projection capability independent of component identity.

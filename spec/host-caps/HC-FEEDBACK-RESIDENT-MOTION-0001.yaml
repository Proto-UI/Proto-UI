id: HC-FEEDBACK-RESIDENT-MOTION-0001
type: host-cap
title: Resident motion projects typed final targets through one view-owned writer
status: draft
since: 0.2.0-rc.0
lifecycleRationale:
  en: Shared model and Web development implementation exist; physical timing, real theme consumption, native and Compiler composition remain required evidence.
summary: A motion sink consumes final semantic style and timing declarations with view/revision ownership, host unit bases and typed palette inputs.
statement:
  en: The host supplies monotonic time, cancellable frame scheduling, physical reference-box and root-font bases, a live motion preference, visibility, supported property channels and a versioned typed palette. It applies the shared sampler output without interpreting component identity or Rule conditions. Between frame callbacks retargeting uses the last acknowledged typed sample, not an unseen clock catch-up; the new timeline starts at the current monotonic time. Same-target commits hold that sample without restarting, while actual frames continue the original timeline. Targets remain independent of presentation and computed CSS is not a target source.
criteria:
  - id: HC-FEEDBACK-RESIDENT-MOTION-0001-OWNER
    text:
      en: The sink replaces legacy style projection for its admitted frame and preserves Root provenance while removing only translated tokens it owns. It releases its own inline or native property leases on detach/dispose without erasing a later external writer. Relinquishing a channel ends its saved-original lease; reacquisition snapshots the current external value and priority. Every physical write after a reentrant effects callback must recheck the current frame lease so release or a newer commit cannot be overwritten. project returns the typed accepted channel list; only a successful still-current receipt advances the last-presented cache. A channel rejected after a flush cannot retain a phantom cache or active frame loop. Exact own-inline value or priority mismatch detects an external owner without parsing CSS; that single channel is suspended with an external-inline-owner diagnostic until a new physical view/sink, preserving later external writes. Settled color channels relinquish their owned inline lease so retained target CSS remains authoritative, including idle theme changes. A typed active/settled channel state distinguishes this from a missing color sample. Unsupported channels preserve ordinary target style. Optical material requires a combined atomic owner and is not admitted by a separate concurrent sink.
  - id: HC-FEEDBACK-RESIDENT-MOTION-0001-ENVIRONMENT
    text:
      en: Unknown preferences, missing unit bases or palette roles and unsupported property channels cannot be guessed. Reduce or hidden settles; restoration does not replay. Web ResizeObserver measurement is layout-space, not a transformed viewport rectangle. Theme CSS and typed palettes must derive from one source. Palette authority is checked for every target and active frame, with normal source revision subscriptions and no idle polling. Factories bind once per physical surface and each view unsubscribes on release. Silent idle CSSOM changes become observable at the next target.
  - id: HC-FEEDBACK-RESIDENT-MOTION-0001-EPOCH
    text:
      en: Older view/revision frames and released callbacks cannot paint. Physical surface replacement receives a fresh source factory binding and settled projection through its first presentation-frame boundary; initialization commits before that boundary cannot start interpolation. Frame scheduling may reenter and must not retain stale tickets. The host never turns presentation samples into State or retained final targets.
dependsOn:
  contracts:
    - C-FEEDBACK-RESIDENT-MOTION-0001
sources:
  - path: packages/modules/feedback/src/motion/sink.ts
  - path: packages/modules/feedback/src/motion/projector.ts
  - path: packages/adapters/base/src/motion/web-resident-motion.ts
revisions:
  - version: 0.2.0-rc.0
    change: introduced
    summary: Added a bounded typed timing/projection capability independent of component identity.

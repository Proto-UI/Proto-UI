id: HC-DEFAULT-ACTION-0001
type: host-cap
title: Host can cancel default interaction actions
status: draft
since: 0.1.0
summary: The host can receive Proto UI default-action cancellation requests for an interaction sample and project them to its native default-action mechanism.
statement:
  zh-CN: >-
    Host 可以接收 Proto UI 对某次 interaction sample 的 default-action cancellation request，并将其投射到宿主的默认动作控制机制。Web 宿主通常投射为 `Event.preventDefault()`；其他宿主可以投射到平台输入默认动作控制、记录诊断，或在能力缺失时保持 no-op。


  en: >-
    The host can receive Proto UI default-action cancellation requests for an interaction sample and project them to the host's native default-action control mechanism. Web hosts usually project this as `Event.preventDefault()`; other hosts may project it to platform input default-action control, record diagnostics, or keep it as a no-op when unsupported.


criteria:
  - id: HC-DEFAULT-ACTION-0001-A
    text:
      zh-CN: host-cap 必须允许模块或 adapter 以宿主无关的方式请求取消本次 interaction sample 的默认动作。
      en: The host capability must let modules or adapters request cancellation of the current interaction sample's default action in a host-independent way.
  - id: HC-DEFAULT-ACTION-0001-B
    text:
      zh-CN: Web adapter 对可取消的 DOM Event 应将该请求投射为 `preventDefault()`。
      en: Web adapters should project the request to `preventDefault()` for cancelable DOM Events.
  - id: HC-DEFAULT-ACTION-0001-C
    text:
      zh-CN: 该能力不得被解释为 boundary classification；取消默认动作不代表交互属于 inside 或 outside。
      en: This capability must not be treated as boundary classification; canceling a default action does not imply that the interaction is inside or outside.

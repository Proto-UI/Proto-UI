id: HC-FEEDBACK-VISUAL-SINK-0001
type: host-cap
title: Host lowers complete final style and material intent for a current view
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: The shared sink receives complete unresolved intent and has Runtime lifecycle evidence. No current provider is admitted by this interface; real provenance, source leases and physical atomic paint remain required.
  zh-CN: 共享 sink 接收完整未解析意图并有 Runtime 生命周期证据；接口不接纳任何现有 provider，仍要求真实 provenance、source lease 与物理原子 paint。
summary: A single current sink accepts final style and typed material together; receipt of intent does not prove an enhanced frame.
statement:
  en: VISUAL_FEEDBACK_SINK_CAP accepts a complete view/revision-bound final style and material-intent frame. It replaces the legacy style-only output path for that projection, and owns actual lowering into source-qualified, geometry-consistent visual transactions. Missing capability preserves legal style and remains an observable material-host-unavailable diagnostic, not completed material support.
  zh-CN: VISUAL_FEEDBACK_SINK_CAP 接受绑定 view/revision 的完整最终 style 与 material-intent frame；同一 projection 替代 legacy style-only 输出，负责降为有来源证明、geometry 一致的 visual transaction。cap缺失时保留合法 style 并保留可观察 material-host-unavailable 诊断，不代表材质支持完成。
criteria:
  - id: HC-FEEDBACK-VISUAL-SINK-0001-INPUT
    text:
      en: One immutable frame contains final style replacement and explicit material slot/candidates or tombstone. Host lowering cannot reinterpret Rule conditions, infer button state, or create a second fill owner. Governed final style IR establishes opaque fallback ownership; arbitrary computed CSS does not.
      zh-CN: 单一不可变 frame 包含最终 style replacement 与显式 material slot/candidates 或 tombstone。host 不得重解释 Rule、猜测 Button 状态或创建第二个 fill owner；opaque fallback ownership 来自受治理最终 style IR，不来自任意 computed CSS。
  - id: HC-FEEDBACK-VISUAL-SINK-0001-LIFETIME
    text:
      en: Sink replacement and view detach/retirement release previous owned output; remount receives only current intent and a new view epoch. Host resource completions separately validate source, binding, geometry and frame identities under C-VISUAL-TRANSACTION-0001. Old callbacks never certify a current frame.
      zh-CN: sink替换和view detach/retirement释放旧owned输出；remount仅接收当前意图与新view epoch。host资源完成另依C-VISUAL-TRANSACTION-0001校验source/binding/geometry/frame，旧回调不得认证当前帧。
  - id: HC-FEEDBACK-VISUAL-SINK-0001-EVIDENCE
    text:
      en: Distinguish intent receipt, pure eligibility, prepared resources and committed paint. The selected self-optical, system-native or in-app browser compositor must prove actual source scope, live accessibility override and one physical style/material commit. An interface, token map, CSS syntax probe or source-specializer result alone cannot pass this capability.
      zh-CN: 区分intent receipt、纯eligible、resources prepared与committed paint；self-optical/system-native/in-app browser compositor须证明真实scope、live accessibility override与一次物理style/material提交。接口、token map、CSS语法探测或source-specializer结果本身不能通过本cap。
dependsOn:
  contracts:
    - C-FEEDBACK-MATERIAL-0001
    - C-VISUAL-TRANSACTION-0001
relates:
  modules:
    - M-FEEDBACK-0001
verifies:
  tests:
    - T-MATERIAL-VISUAL-RESULT-0001
sources:
  - path: packages/modules/feedback/src/material/shared-sink.ts
  - path: packages/modules/feedback/src/create.ts
openQuestions:
  - id: HC-FEEDBACK-VISUAL-SINK-0001-Q-PAINT
    question: Which exact provider/profile demonstrates physical paint, complete cleanup and current source qualification?
    blocks:
      - activation:HC-FEEDBACK-VISUAL-SINK-0001
      - implementation:T-MATERIAL-VISUAL-RESULT-0001#material-host-atomic-integration
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Defined the shared visual intent sink separately from provider paint admission.
tags:
  - feedback
  - material
  - host-capability
  - draft

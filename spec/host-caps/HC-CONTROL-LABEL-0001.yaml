id: HC-CONTROL-LABEL-0001
type: host-cap
title: Host supplies current Label view scope and eligible activation intent
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: The explicit bounded association direction has owning-layer and Web Adapter harness evidence. Stable admission remains blocked on independent review, complete native input/lifetime and assistive-technology evidence.
summary: Host-private physical facts and input interpretation remain outside portable Props or State.
criteria:
  - id: HC-CONTROL-LABEL-0001-VIEW
    text:
      en: A disposable host lease supplies current physical identity and accessibility tree-scope identity, or absence. In the Web slice participants must share Document and getRootNode scope; neither identity is exposed as a portable value. Shared scope observers cover both document and shadow-tree containment changes; physical detachment and cross-scope reparenting invalidate current naming without scanning all trees per participant.
  - id: HC-CONTROL-LABEL-0001-INPUT
    text:
      en: The Web provider rejects modified/nonprimary pointer input, pointercancel or moved gestures, untrusted click-only input and nested interactive descendants. Trusted non-pointer activation facts are admitted without a Label Tab stop or keyboard binding. It commits synchronously in the originating click turn after checking then-observed click cancellation; later listeners cannot roll back an already committed target operation. Cancelling pointerup alone does not cancel click. It never synthesizes target input, prevents arbitrary defaults or clears text selection. This explicitly bounded host intent is not claimed to implement the native HTML label post-dispatch default-action algorithm.
  - id: HC-CONTROL-LABEL-0001-ACTION-PROJECTION
    text:
      en: Attachment receives the Module-owned activation boolean, and the current lease receives setActivation updates. Only a Label subject may advertise its corresponding native activation action; target participation does not create a second action. Naming-only labels advertise no Label action. A host may attach the action to the same visible native text semantic node without inventing a portable Button role, a Tab stop or duplicate hidden text. It must not infer activation from selection utilities or presentation. Disposal retires the old action lease and cannot revoke a reentrantly installed successor.
  - id: HC-CONTROL-LABEL-0001-CALLBACK
    text:
      en: Activation runs in the target Runtime callback scope, with current binding/generation rechecked before target effects. Target replacements and disposal retire listeners and stale requests.
satisfies:
  contracts:
    - C-CONTROL-LABEL-0001
verifies:
  tests:
    - T-CONTROL-LABEL-0001
sources:
  - path: packages/modules/control-label/src/caps.ts
  - path: packages/modules/control-label/src/web.ts
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Cataloged host-private view leases and bounded activation intent for the four Web providers.
tags:
  - host-capability
  - label
  - web

revisions:
  - version: 0.3.0-alpha.2
    change: clarified
    summary: Defined compiled GPUI current-view input and native action leases, including explicit unsupported activation through opaque native children; kept physical input and assistive-technology evidence separate.
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Cataloged host-private view leases and bounded activation intent for the four Web providers.
  - version: 0.4.0
    change: revised
    summary: Retire deleted compiler evidence and retain commit-bound historical sources without changing independent behavior.

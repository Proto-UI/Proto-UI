id: HC-CONTROL-LABEL-0001
type: host-cap
title: Host supplies current Label view scope and eligible activation intent
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: The explicit bounded association direction has owning-layer and Web Adapter harness evidence. Stable admission remains blocked on independent review, complete native input/lifetime and assistive-technology evidence.
summary: Host-private physical facts and input interpretation remain outside portable Props or State.
criteria:
  - id: HC-CONTROL-LABEL-0001-VIEW
    text:
      en: A disposable host lease supplies current physical identity and accessibility tree-scope identity, or absence. In the Web slice participants must share Document and getRootNode scope; neither identity is exposed as a portable value. Shared scope observers cover both document and shadow-tree containment changes; physical detachment and cross-scope reparenting invalidate current naming without scanning all trees per participant.
  - id: HC-CONTROL-LABEL-0001-INPUT
    text:
      en: The Web provider rejects modified/nonprimary pointer input, pointercancel or moved gestures, untrusted click-only input and nested interactive descendants. Trusted non-pointer activation facts are admitted without a Label Tab stop or keyboard binding. It commits synchronously in the originating click turn after checking then-observed click cancellation; later listeners cannot roll back an already committed target operation. Cancelling pointerup alone does not cancel click. It never synthesizes target input, prevents arbitrary defaults or clears text selection. This explicitly bounded host intent is not claimed to implement the native HTML label post-dispatch default-action algorithm.
  - id: HC-CONTROL-LABEL-0001-ACTION-PROJECTION
    text:
      en: Attachment receives the Module-owned activation boolean, and the current lease receives setActivation updates. Only a Label subject may advertise its corresponding native activation action; target participation does not create a second action. Naming-only labels advertise no Label action. A host may attach the action to the same visible native text semantic node without inventing a portable Button role, a Tab stop or duplicate hidden text. It must not infer activation from selection utilities or presentation. Disposal retires the old action lease and cannot revoke a reentrantly installed successor.
  - id: HC-CONTROL-LABEL-0001-GPUI
    text:
      en: The private compiled GPUI slice uses the current Window tree and exact semantic-node binding. Only an unmodified primary pointer turn beginning and ending on the Label, within the host click tolerance, may request activation; final release coordinates participate in eligibility. Leaving, cancellation, a lost button, replacement, window deactivation or nested interactive input retires the pending turn. The enabled native accessibility action attaches to the same visible Label text node without a Button role, Tab stop or independent keyboard action; its retained lease must reject obsolete views. Naming-only labels advertise no such action. Native framework dispatch and action-callback tests do not establish physical touch or assistive-technology delivery.
  - id: HC-CONTROL-LABEL-0001-GPUI-OPAQUE-CHILD
    text:
      en: An externally supplied native_view child is opaque to the private compiler and does not certify a noninteractive descendant path. Pointer input originating within that actual child boundary therefore cannot activate the enclosing compiled Label and produces a bounded unsupported diagnostic when activation is requested. The host preserves the child's rendering, naming and input propagation; it does not guess interaction from text, geometry or type names. This fail-closed boundary does not prevent ordinary Label text outside the opaque child from requesting activation, and it is not a shared native host-object ABI.
  - id: HC-CONTROL-LABEL-0001-CALLBACK
    text:
      en: Activation runs in the target Runtime callback scope, with current binding/generation rechecked before target effects. Target replacements and disposal retire listeners and stale requests.
  - id: HC-CONTROL-LABEL-0001-GPUI-PROVIDER
    text:
      en: The compiled GPUI provider requires exact window and current physical-view identities. A pair may span cached frames only when both participants have unique live receipts owned by actual retained GPUI element states and backed by actual semantic nodes. If either participant still uses the legacy view protocol, both must satisfy its shared current layout-frame check; retired retained receipts cannot fall back to that protocol. Duplicate physical occurrences or absent semantic nodes refuse the pair, and an immutable action snapshot cannot acquire a later replacement pair. The provider projects the actual Label node and invokes the target-authored callback through the checked pair request. It admits primary unmodified native mouse gestures only on known passive content, retires drag/cancel/blur turns, and rejects unknown native view descendants. Its AccessKit action stays on the visible text node and is unavailable for naming-only or unresolved pairs. The provider does not invent Label key bindings or claim anatomy/touch support.
satisfies:
  contracts:
    - C-CONTROL-LABEL-0001
verifies:
  tests:
    - T-CONTROL-LABEL-0001

openQuestions:
  - id: HC-FOCUS-ORDER-0001-Q-CROSS-TREE
    question:
      en: Should the Web realization order targets across shadow roots or portals by a composed or flat-tree order?
      zh-CN: Web realization 是否应按 composed 或 flat-tree 顺序排列跨 shadow root 或 portal 的 target？
    context:
      en: This draft reports such sets unorderable, so Focus keeps registration order for them. Before it, the Focus comparator returned the implementation-specific order that document position comparison gives for nodes in different trees.
      zh-CN: 本 draft 将这类集合报告为无法排序，Focus 因此对其保持注册顺序。此前 Focus 的比较函数对不同树中的节点返回文档位置比较给出的、由实现决定的顺序。
    blocks: ['criterion:HC-FOCUS-ORDER-0001#HC-FOCUS-ORDER-0001-B']
  - id: HC-FOCUS-ORDER-0001-Q-NON-WEB
    question:
      en: How does a non-Web host keep its projected order available to a Focus Module that runs in another realm?
      zh-CN: 非 Web 宿主如何让运行在另一个 realm 中的 Focus Module 取得它投影的顺序？
    context:
      en: A native host such as the GPUI direction in #687 is expected to project a stable order locally rather than answer each key over a round trip. No non-Web host provides the capability yet, so such hosts keep registration order.
      zh-CN: '#687 中 GPUI 方向这样的原生宿主，预期在本地投影稳定顺序，而不是每次按键都往返回答。目前还没有非 Web 宿主提供该能力，这类宿主保持注册顺序。'
    blocks: ['activation:HC-FOCUS-ORDER-0001']
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Cataloged the host order for Focus navigations, with its Web document-order realization and whole-navigation registration fallback.

    change: introduced
    summary: Select explicit authoring spellings and complete design inputs for the accepted foundation while retaining missing implementation evidence.
  - version: 0.4.0
    change: revised
    summary: Add equals(left, right) as the explicit structural comparison for composite values, and state that string literals with unpaired surrogates are source-invalid rather than asserting every literal is well-formed.
tags: [compiler, authoring, language, migration, controlled, context, async]

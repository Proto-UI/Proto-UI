relates:
  decisions: [D-AS-HOOK-CALLER-NAME-0001, { id: D-TRIGGER-GROUP-SURFACE-0001, since: 0.2.0-rc.3 }]
revisions:
  - version: 0.3.0-alpha.0
    change: clarified
    summary: Required a single continuous chain and diagnosed rejection of sibling Trigger branches.
  - version: 0.1.0
    change: introduced
    summary: Captured asTrigger as a minimal privileged asHook contract for nested trigger event route merging.
  - version: 0.2.0-rc.1
    change: revised
    summary: Separated opaque logical trigger ownership from physical EventTarget projection and required late, repeatable view binding.
  - version: 0.2.0-rc.3
    change: clarified
    summary: Allowed hosts to publish domain-neutral trigger-group surface ownership without adding Focus or A11y as asTrigger dependencies.

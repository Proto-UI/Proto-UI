id: C-AS-TRIGGER-0001
type: contract
title: asTrigger forms continuous trigger groups with one semantic activation route
status: draft
since: 0.1.0
summary: asTrigger is a privileged asHook that merges directly nested trigger instances into one group while keeping group anchor, interaction surface, behavior participants, and host-local events distinct.
statement:
  zh-CN: >-
    `asTrigger()` 是核心契约中的特权 asHook。它把宿主中直接连续嵌套的 trigger instances 合并为一个 trigger group，而不是把某个 trigger 的全部事件简单代理给另一个 trigger。group 默认以最外层连续 trigger 作为稳定 anchor、以最内层连续 trigger 作为宿主 interaction surface，所有成员保留自身 behavior 声明并共享一条 semantic activation route；`host:*` 事件仍属于各实例自己的宿主 root。直接父子关系与父 prototype 查询由 host-cap 提供；`asTrigger` 消费这些关系，但不自行定义宿主树、DOM containment、surface hit testing 或 Focus/A11y policy。链路在第一个非 trigger prototype、缺失 parent、缺失 prototype 查询结果或 host-cap 无法证明直接父子关系处停止。


  en: >-
    `asTrigger()` is a privileged asHook in the core contract set. It merges directly and continuously nested trigger instances into one trigger group rather than simply proxying every event from one trigger to another. The group uses the outermost continuous trigger as its default stable anchor and the innermost continuous trigger as its default host interaction surface; every member retains its own behavior declarations while sharing one semantic activation route, and `host:*` events remain local to each instance root. Direct parenthood and parent prototype lookup are supplied by host caps; `asTrigger` consumes those relations without defining the host tree, DOM containment, surface hit testing, or Focus and A11y policy. The chain stops at the first non-trigger prototype, missing parent, missing prototype lookup result, or host-cap result that cannot prove direct parenthood.


criteria:
  - id: C-AS-TRIGGER-0001-A
    text:
      zh-CN: '`asTrigger()` 必须被建模为特权 asHook，而不是普通 authored asHook 或普通事件注册 helper。'
      en: '`asTrigger()` must be modeled as a privileged asHook, not as an ordinary authored asHook or plain event registration helper.'
  - id: C-AS-TRIGGER-0001-B
    text:
      zh-CN: '`asTrigger()` 必须在 caller prototype 的 asHook trace 中以 privileged trigger identity 记录自身，使 host 可以把 logical instance 识别为 trigger-group member。'
      en: '`asTrigger()` must record itself in the caller prototype asHook trace with a privileged trigger identity so the host can recognize its logical instance as a trigger-group member.'
  - id: C-AS-TRIGGER-0001-C
    text:
      zh-CN: host 必须为 trigger group 记录 members、默认最外层 anchor 与默认最内层 surface；anchor、surface 与 group identity 是可独立演化的角色，均不得被解释为某个成员吞并其他成员 behavior。
      en: The host must record trigger-group members, the default outermost anchor, and the default innermost surface; anchor, surface, and group identity are independently evolvable roles and none means that one member absorbs the other members' behaviors.
  - id: C-AS-TRIGGER-0001-D
    text:
      zh-CN: 当当前 trigger 的直接 parent 也是 trigger 且该关系连续成立时，所有连续成员必须合并为一个 group；最外层成员默认成为 anchor，最内层成员默认成为 surface，所有成员的 semantic activation registrations 汇聚到 group route。
      en: When the current trigger's direct parent is also a trigger and that relation remains continuous, all continuous members must merge into one group; the outermost member becomes the default anchor, the innermost member becomes the default surface, and every member's semantic activation registrations converge on the group route.
  - id: C-AS-TRIGGER-0001-E
    text:
      zh-CN: 当 parent 缺失、parent prototype 缺失、parent 不是 trigger，或 host-cap 不能证明直接 trigger 父子关系时，合并必须停止，当前 trigger 形成自身 group 并同时作为默认 anchor 与 surface。
      en: When the parent is missing, the parent prototype is missing, the parent is not a trigger, or host caps cannot prove direct trigger parenthood, merging must stop and the current trigger forms its own group as both default anchor and surface.
  - id: C-AS-TRIGGER-0001-F
    text:
      zh-CN: group 中每个成员必须保留自身 behavior 声明；一次合法宿主 activation sample 最多向共享 semantic route 发布一次，不得退化为逐成员重复解释原生输入。`host:*` listeners 必须留在各实例自己的宿主 root，不参加 group merge。
      en: Every group member must retain its own behavior declarations; one valid host activation sample may be published to the shared semantic route at most once and must not regress to per-member native-input interpretation. `host:*` listeners must remain on each instance's own host root and do not participate in the group merge.
  - id: C-AS-TRIGGER-0001-G
    text:
      zh-CN: host-cap 提供的 logical instance 与 group identities 必须保持 opaque；`asTrigger()` 不得把它们强制转换或假定为 `EventTarget`，而必须通过 host 提供的 group semantic-target projection 获得可绑定 target。
      en: Host-cap-provided logical instance and group identities must remain opaque; `asTrigger()` must not cast or assume them to be `EventTarget` objects and must obtain a bindable target through the host-provided group semantic-target projection.
  - id: C-AS-TRIGGER-0001-H
    text:
      zh-CN: 当 group surface 在 setup 时尚无物理 view，或其 view epoch 后续被替换时，group semantic-target projection 必须保留 group 与 registrations，并把既有 registrations 绑定或迁移到当前有效 surface target。
      en: When the group surface has no physical view during setup or its view epoch is later replaced, group semantic-target projection must preserve the group and registrations and bind or migrate existing registrations to the current live surface target.
  - id: C-AS-TRIGGER-0001-I
    text:
      zh-CN: host 必须以 domain-neutral 方式提供 group anchor、members 与 surface，使 Event、Focus、A11y 等 domain 独立消费；这不得使 `asTrigger` 直接依赖或实现这些 domain 的完整 policy。
      en: The host must expose group anchor, members, and surface in a domain-neutral form for Event, Focus, and A11y to consume independently; this must not make `asTrigger` directly depend on or implement the complete policy of those domains.
  - id: C-AS-TRIGGER-0001-J
    text:
      zh-CN: pointer activation 只有在原生 hit origin 是当前 surface 的宿主 root 或其内容时才可进入 group semantic route；命中非 surface member 自身的额外宿主盒必须被拒绝，且不得通过 anchor 或 group membership 重定向为 surface activation。
      en: Pointer activation may enter the group semantic route only when the native hit origin is the current surface host root or its content; a hit on the extra host box of a non-surface member must be rejected and must not be redirected into surface activation through the anchor or group membership.
  - id: C-AS-TRIGGER-0001-K
    text:
      zh-CN: '`asTrigger()` 的稳定依赖只应包括 privileged trace、group membership、semantic event route 与 host-cap 提供的 logical tree/group projection；Focus、A11y、hit admission、overlay 与 boundary policy 必须由消费 group 角色的对应 domain 实现。'
      en: '`asTrigger()` stable dependencies should include only privileged trace, group membership, the semantic event route, and host-cap-provided logical-tree and group projection; Focus, A11y, hit admission, overlay, and boundary policy must be implemented by the corresponding domains that consume group roles.'
  - id: C-AS-TRIGGER-0001-L
    text:
      zh-CN: Trigger group 必须是一条直接连续链；同一 Trigger 下出现并列 Trigger 分支时，宿主必须诊断并拒绝形成分叉的声明或父关系变更，并保留原有已接纳链、surface 与 route，不得按注册顺序选择赢家。非 Trigger parent 下的独立 Trigger group 不构成此分叉。
      en: A Trigger group must be one directly continuous chain. Sibling Trigger branches under a Trigger require a diagnostic and rejection of the declaration or parent change that forms the branch, preserving the previously accepted chain, surface and route rather than selecting a registration-order winner. Independent Trigger groups under a non-Trigger parent are not such a branch.

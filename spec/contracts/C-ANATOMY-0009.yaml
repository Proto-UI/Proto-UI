id: C-ANATOMY-0009
type: contract
title: Part views read explicit exposes
status: draft
since: 0.1.0
summary: Anatomy may read only capabilities explicitly exposed by same-domain parts through Expose.
statement:
  zh-CN: >-
    Anatomy PartView 只能通过 Expose 读取 same-domain part 主动公开的能力。Anatomy 因此在实现上依赖 Expose，但这种依赖是对 Expose 的使用，而不是继承 Expose 的通路身份；Anatomy 不新增独立输出系统，也不得推断、补造或访问未公开的内部能力。


  en: >-
    An Anatomy PartView may read only capabilities explicitly exposed by same-domain parts through Expose. Anatomy therefore depends on Expose in implementation, but this dependency is usage of Expose rather than inheritance of Expose's channel identity; Anatomy does not add an independent output system and must not infer, fabricate, or access unexposed internal capabilities.


criteria:
  - id: C-ANATOMY-0009-A
    text:
      zh-CN: PartView 可以提供 `hasExpose` 与 `getExpose` 一类受限读取能力。
      en: A PartView may provide limited read capabilities such as `hasExpose` and `getExpose`.
  - id: C-ANATOMY-0009-B
    text:
      zh-CN: Anatomy 只能读取目标 part 已经通过 Expose 主动公开的 key。
      en: Anatomy may read only keys the target part has explicitly exposed through Expose.
  - id: C-ANATOMY-0009-C
    text:
      zh-CN: 若目标 part 未 expose 某项能力，Anatomy 不得推断、补造或访问其内部替代能力。
      en: If the target part has not exposed a capability, Anatomy must not infer, fabricate, or access an internal substitute.
  - id: C-ANATOMY-0009-D
    text:
      zh-CN: Anatomy 对 Expose 的实现依赖必须在治理与模块依赖中被明确记录。
      en: Anatomy's implementation dependency on Expose must be explicitly recorded in governance and module dependencies.
  - id: C-ANATOMY-0009-E
    text:
      zh-CN: PartView 读取到的 exposed method 在调用时必须进入目标 part 的 callback scope；调用方不得获得目标 instance 或 run handle，返回值与异常必须同步投射给调用方。
      en: An exposed method read through a PartView must enter the target part's callback scope when invoked; the caller must not receive the target instance or run handle, and the return value or error must be synchronously projected back to the caller.
  - id: C-ANATOMY-0009-F
    text:
      zh-CN: 保存的 PartView 不延长目标 declaration 的生命周期。目标 claim 已退役或其公开 Expose entry 已因 terminal teardown 不可用时，新的 hasExpose/getExpose 读取必须分别返回 false/null，不得进入目标 callback 或重用旧 registry；仍存活目标的 repeatable view detach 不导致该失效。调用方权限、phase 与来源校验仍须保留，不能把这些错误转换为缺席。此前取出的 method 保持原有生命周期检查，该读取规则不授权其在目标终止后执行。
      en: A retained PartView does not extend its target declaration's lifetime. When the target claim is retired or its public Expose entries are unavailable due to terminal teardown, a fresh hasExpose/getExpose lookup must return false/null respectively without entering a target callback or reusing a stale registry; repeatable view detachment of a live target does not cause this invalidation. Caller authority, phase, and provenance checks remain in force and their failures must not become absence. Previously retrieved methods retain their existing lifecycle checks; this lookup rule does not authorize executing them after target retirement.

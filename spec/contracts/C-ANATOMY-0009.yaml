    change: refined
    summary: Defined safe absent reads for retired target declarations while preserving caller checks and previously retrieved method lifecycle boundaries.
  - version: 0.1.0
    change: introduced
    summary: Captured PartView expose reads and Anatomy's implementation dependency on Expose.
  - version: 0.1.1
    change: refined
    summary: Required PartView method invocation to preserve the target part callback binding.

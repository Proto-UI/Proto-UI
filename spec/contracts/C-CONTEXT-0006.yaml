id: C-CONTEXT-0006
type: contract
title: Context subscription intent is required or optional
status: draft
since: 0.1.0
summary: Context subscriptions are setup-only intent declarations; `subscribe` declares a required context dependency, while `trySubscribe` declares an optional context dependency.
statement:
  zh-CN: >-
    Context subscription API 用于在 setup 期间声明组件如何参与某个 context scope。`subscribe(key, cb?)` 表示该 context 是组件成立所必需的；setup 期间无法解析 provider 时必须失败。`trySubscribe(key, cb?)` 表示该 context 是可选协作环境；provider 不存在时不得失败，组件必须能自治运行。


  en: >-
    Context subscription APIs declare during setup how a component participates in a context scope. `subscribe(key, cb?)` means the context is required for the component to operate; if no provider resolves during setup it must fail. `trySubscribe(key, cb?)` means the context is an optional cooperation environment; absence of a provider must not fail and the component must remain able to operate autonomously.


criteria:
  - id: C-CONTEXT-0006-A
    text:
      zh-CN: '`def.context.subscribe(key, cb?)` 必须是 setup-only API。'
      en: '`def.context.subscribe(key, cb?)` must be a setup-only API.'
  - id: C-CONTEXT-0006-B
    text:
      zh-CN: '`def.context.trySubscribe(key, cb?)` 必须是 setup-only API。'
      en: '`def.context.trySubscribe(key, cb?)` must be a setup-only API.'
  - id: C-CONTEXT-0006-C
    text:
      zh-CN: required `subscribe` 在 setup 期间无法解析 provider 时必须失败。
      en: Required `subscribe` must fail when no provider resolves during setup.
  - id: C-CONTEXT-0006-D
    text:
      zh-CN: optional `trySubscribe` 在 setup 期间 provider 不存在时不得失败。
      en: Optional `trySubscribe` must not fail when no provider exists during setup.
  - id: C-CONTEXT-0006-E
    text:
      zh-CN: 订阅 API 返回的 unsubscribe 必须停用对应 callback delivery。
      en: The unsubscribe returned by a subscription API must deactivate the corresponding callback delivery.
  - id: C-CONTEXT-0006-F
    text:
      en: trySubscribeAncestor is setup-only optional strict-ancestor intent, independent of ordinary required/optional intent for the same key. Absence is allowed. Unsubscribe removes only its callback; intent lasts until terminal disposal. Ancestor intent grants neither ordinary read nor consumer update authority.
      zh-CN: trySubscribeAncestor 是 setup-only 的 optional 严格祖先意图，与同 key 的普通 required/optional 意图独立。允许缺少 provider。unsubscribe 仅移除对应 callback，意图保留到终端销毁；祖先意图不授予普通 read 或 consumer update 权限。
sources:
  - path: internal/contracts/context/with-tree.v0.md
    sections:
      - Setup-only subscription intent
  - path: packages/modules/context/src/impl.ts
    sections:
      - subscribe
      - trySubscribe
dependsOn:
  contracts:
    - C-CONTEXT-0004
revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added independent optional strict-ancestor subscription intent with callback cleanup and no implicit write authority.
  - version: 0.1.0
    change: introduced
    summary: Captured required and optional context dependency intent.
tags:
  - context
  - subscribe
  - optional
  - setup

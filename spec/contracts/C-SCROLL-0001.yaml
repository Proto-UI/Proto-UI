  - version: 0.2.0-rc.7
    change: revised
    summary: Resolved continuous composed Thumb projection through the family-scoped host-local chrome contract.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Defined logical Scroll ownership, portable facts and requests, bounded host sessions, and accessibility projection.

openQuestions:
  - id: C-COMPILER-PIPELINE-0001-Q-NON-REACT-TARGETS
    question:
      zh-CN: 当前仅 React 与 LLVM/WASM 后端具备完整端到端执行验证；Vue 3、Web Components 与 GPUI 原生后端的薄型契约与消费者证据尚待 0.4 后续批次补齐。
      en: Only React and LLVM/WASM backends have full end-to-end execution evidence today; thin Vue 3, Web Components, and native GPUI consumer contracts remain for follow-up 0.4 slices.

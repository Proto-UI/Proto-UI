openQuestions:
  - id: C-COMPILER-PIPELINE-0001-Q-COMMIT-SCHEDULING
    question:
      zh-CN: 当前原生目标仅准入每个回调执行路径末尾的一次显式update，跨handler、watch与生命周期组也须检查。首次update同步读取模板而后续in-flight请求合并的完整commit调度、完整Expose读订阅spec/dispose语义、以及更多原子能力仍需实现；这些合法定义不能被重新解释为另一种语义。
      en: Current native targets admit one terminal explicit update per callback path and check combined handler, watch, and lifecycle sequences. Full commit scheduling with synchronous first-request template reads and coalesced in-flight requests, complete Expose read/subscription/spec/disposal behavior, and additional atomic capabilities remain to be implemented; valid definitions must not be reinterpreted as different semantics.
    blocks:
      - activation:C-COMPILER-PIPELINE-0001
      - criterion:C-COMPILER-PIPELINE-0001#C-COMPILER-PIPELINE-0001-HIR
  - id: C-COMPILER-PIPELINE-0001-Q-NON-REACT-TARGETS
    question:
      zh-CN: 全量原型语义和各目标降级、浏览器/CLI/库兼容、旧回归及GPUI/Shenko/Verdant真实消费者证据尚待逐项完成；局部React与LLVM内核用例不能覆盖这些义务。
      en: Full prototype semantics and target lowering, browser/CLI/library compatibility, prior regressions, and real GPUI/Shenko/Verdant consumer evidence remain to be completed explicitly. Local React and LLVM kernel examples do not cover these obligations.
    blocks:
      - activation:C-COMPILER-PIPELINE-0001
      - criterion:C-COMPILER-PIPELINE-0001#C-COMPILER-PIPELINE-0001-CONSUMERS
revisions:
  - version: 0.3.0
    change: introduced
    summary: Defined the v2 compiler pipeline contract for TS TypeChecker extraction, Proto SSA IR verification/optimization, LLVM 8-byte slot ABI/WASM execution, 3-tier thin React codegen, and CLI diagnostics (#1809).
  - version: 0.3.0
    change: refined
    summary: Refined the pipeline contract to preserve authored control flow and ownership, fail explicitly on unsupported behavior, construct React and GPUI targets through AST/IR APIs, verify the real ABI, and separate analysis, native compilation, kernels, and consumer evidence.

id: C-COMPILER-PIPELINE-0001
type: contract
title: Proto semantic compilation, target admission, AST/LLVM construction, and evidence boundaries
status: draft
since: 0.3.0
lifecycleRationale: >-
  Defines the corrected #1809 0.4-scope compiler contract from TypeScript binding and Proto semantic HIR through target admission, React/GPUI AST generation, and native LLVM IRBuilder output. Replaces the former protocol-wrapper route under the current user's explicit instruction. Remains draft pending full semantic coverage, regression migration, cross-target consumer evidence, and applicable acceptance; earlier wrapper and metadata tests are not inherited proof.


summary: Preserve authored semantics through explicit HIR and verified target lowering; reject unsupported behavior and generate programs through target AST/IR APIs without runtime fallback.
statement:
  zh-CN: >-
    编译器必须将合法的 Proto UI 定义与 authored 行为表示为可追踪源位置的语义 HIR，按所选目标检查能力并保存求值顺序、控制流、状态、事件、生命周期和所有权，再通过 TypeScript AST、GPUI Rust AST 或原生 LLVM IRBuilder 构造目标程序。未实现语义必须给出明确的未支持诊断；不得静默删除或委托原型 runtime。请求的产物须实际构建及验证，分析成功、内核输出、组件原生编译和真实消费者执行分别报告。


  en: >-
    The compiler must represent valid Proto UI definitions and authored behavior as source-traceable semantic HIR, admit capabilities for the selected target, preserve evaluation order, control flow, state, events, lifecycle, and ownership, then construct target programs through TypeScript AST, GPUI Rust AST, or native LLVM IRBuilder. Unsupported semantics receive explicit diagnostics and must not be erased or delegated to a prototype runtime. Requested artifacts must actually be built and verified; analysis, kernel emission, native component compilation, and consumer execution are reported separately.


criteria:
  - id: C-COMPILER-PIPELINE-0001-FRONTEND
    text:
      zh-CN: 使用缓存 ts.Program/ts.TypeChecker 解析真实符号、导出、别名及组合；已识别操作产生语义表示，无法分析的语句/回调/选项产生含源位置和原因的 lowering gap，不得仅以名称、语法扫描或能力缺失推定可静态编译。常量与函数别名的读取须证明初始化顺序，保留调用者执行点并检查跨模块值依赖循环；未知全局读取、回调默认参数和异步/生成器效果不得被消除。
      en: Resolve real symbols, exports, aliases, and composition through cached ts.Program/ts.TypeChecker sessions. Recognized operations produce semantics; unanalyzed statements/callbacks/options produce source-located lowering gaps rather than being treated as statically compilable because a name scan or capability summary omitted them. Constant and function-alias reads require initialization-order proof, including caller execution points and cyclic module value dependencies; unknown global reads, callback defaults, and asynchronous/generator effects must not disappear.
  - id: C-COMPILER-PIPELINE-0001-HIR
    text:
      zh-CN: HIR 必须保存表达式与动作体、if/else 两侧、短路及求值次数、绑定身份、props/default/empty/update、state读写与事件顺序、生命周期及能力owner。普通helper调用的参数只求值一次且return只退出该次调用；authored Hook按真实注册模式展开。state写入、订阅反馈和显式run.update是独立操作；宿主自发重画不得提前推进模板状态。任何尚未完整表示或降低的相关行为在目标生成前明确拒绝，不得被摘要或默认常量代替。
      en: HIR must preserve expressions and action bodies, both if/else branches, short-circuit evaluation, binding identity, props/default/empty/update semantics, state and event order, lifecycle, and capability ownership. Ordinary helper arguments evaluate once and return exits only that invocation; authored Hooks expand according to their registration mode. State writes, subscription feedback, and explicit run.update are distinct operations; incidental host redraws must not advance template state. Relevant behavior not fully represented or lowered is rejected before target emission, never replaced by summaries or default constants.
  - id: C-COMPILER-PIPELINE-0001-SSA-IR
    text:
      zh-CN: 类型化内核必须满足值唯一性、基本块终结、操作数与返回类型、支配关系、PHI前驱、调用签名及指针/槽范围不变量；优化前后校验，非法IR必须在目标构造前失败。
      en: Typed kernels must uphold value uniqueness, block termination, operand/return types, dominance, PHI predecessor coverage, call signatures, and pointer/slot invariants. Verification runs before and after optimization, and malformed IR fails before target construction.
  - id: C-COMPILER-PIPELINE-0001-OPT
    text:
      zh-CN: 优化必须保存源语义、控制流、求值次数、副作用和清理；f64保留NaN、Infinity、正负零及比较语义，整数折叠遵守目标位宽与溢出规则。不得以LLVM结构校验替代优化前后及源语义的执行差分。
      en: Optimization preserves source semantics, control flow, evaluation counts, effects, and cleanup. f64 preserves NaN, Infinity, signed zero, and comparison behavior; integer folding follows target width/overflow rules. LLVM structural verification does not replace execution comparisons against source and pre-optimization semantics.
  - id: C-COMPILER-PIPELINE-0001-LLVM-ABI
    text:
      zh-CN: LLVM产物须由C++ IRBuilder/Module构造、verifyModule验证并由标准接口输出；ABI明确版本、槽宽、容量、对齐、所有权与实际内存。WASM宿主按实际堆边界分区、检查每次访问、处理grow并隔离实例；缺少内存或未定义ABI不得使用临时内存或默认值继续。
      en: LLVM artifacts are constructed with C++ IRBuilder/Module, verified with verifyModule, and emitted through standard interfaces. The ABI declares version, slot size, capacities, alignment, ownership, and actual memory. WASM hosts allocate beyond the actual heap boundary, check accesses, handle growth, and isolate instances; missing memory or undefined ABI must not be masked with temporary memory or defaults.
  - id: C-COMPILER-PIPELINE-0001-THIN-EMIT
    text:
      zh-CN: React生成器通过ts.factory/ts.Printer构造并输出原生组件，完整保存所准入的props/state/event/rule/lifecycle语义。禁止源代码字符串模板、先拼源码再解析、原.proto.ts导入及Proto runtime/adapter回退。未支持行为必须阻断目标生成。
      en: React code generation constructs native components through ts.factory/ts.Printer, preserving admitted props/state/event/rule/lifecycle semantics. Source templates, parsing constructed source, original prototype imports, and Proto runtime/adapter fallback are prohibited. Unsupported behavior blocks target emission.
  - id: C-COMPILER-PIPELINE-0001-GPUI
    text:
      zh-CN: GPUI后端必须通过syn节点及prettyplease构造Rust组件，保存已准入的props/state/Render/事件/规则/生命周期语义，禁止Rust源码模板和原型执行回退。依赖pin和feature与真实消费者保持可核对；真实Cargo构建、行为及Verdant GPUI验收分别记录，缺失能力明确诊断。
      en: The GPUI backend must construct Rust components through syn nodes and prettyplease, preserving admitted props/state/Render/event/rule/lifecycle semantics without Rust source templates or prototype execution fallback. Dependency pins/features remain auditable against real consumers; actual Cargo builds, behavior, and Verdant GPUI acceptance are recorded separately, with diagnostics for missing capabilities.
  - id: C-COMPILER-PIPELINE-0001-DIAGNOSTICS
    text:
      zh-CN: API/CLI输出结构化诊断与确定退出码，区分输入非法、目标未支持、构建或验证失败。显式请求的LLVM/原生/WASM阶段必须真实执行；工具链不可用时失败，不以warning或静默跳过记作通过。产物写入须保护输入及已有文件，拒绝输出路径上的符号链接，并发无覆盖写入不能互相覆盖；验证失败不得留下冒充成功的产物。
      en: APIs/CLI emit structured diagnostics and deterministic exits distinguishing invalid input, unsupported targets, and build/verification failure. Explicit LLVM/native/WASM stages actually run and fail when unavailable rather than passing with warnings or silent skips. Artifact publication protects inputs and existing files, rejects symbolic links in output paths, and prevents concurrent no-overwrite writers from replacing each other; verification failure must not leave artifacts presented as successful output.
  - id: C-COMPILER-PIPELINE-0001-COVERAGE
    text:
      zh-CN: 每文件、原型、hook及目标分别报告分析、原生编译、未支持/非法、内核生成与消费者执行；统计包含原因和证明边界。产物体积计入传递依赖，冷/热/增量耗时分开，包装行数与删除代码量不能代表覆盖或性能收益。
      en: Report analysis, native compilation, unsupported/invalid results, kernel emission, and consumer execution per file/prototype/hook/target with reasons and evidence limits. Size includes transitive dependencies and timing distinguishes cold/warm/incremental work; wrapper line counts and deleted code volume do not establish coverage or performance benefit.
  - id: C-COMPILER-PIPELINE-0001-CONSUMERS
    text:
      zh-CN: 全量官方Base/设计家族、其他已承诺后端、浏览器/CLI/库接口及Shenko React/Web、Verdant GPUI等真实消费者的原生编译、构建和行为验收必须保留并迁移。显式未支持只完成诊断义务，不取消原有能力与回归测试债务。
      en: Native compilation, build, and behavioral acceptance for the full official Base/family corpus, other committed backends, browser/CLI/library interfaces, and real consumers including Shenko React/Web and Verdant GPUI remain migration obligations. Explicit unsupported results fulfill diagnostics only and do not cancel capability or regression-test debt.

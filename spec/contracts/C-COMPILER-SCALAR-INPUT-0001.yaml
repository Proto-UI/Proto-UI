id: C-COMPILER-SCALAR-INPUT-0001
type: contract
title: Bounded scalar conversion and readonly JSON output in Compiler source
status: removed
since: 0.3.0-alpha.2
removedSince: 0.4.0
replacedBy: C-COMPILER-FOUNDATION-0001
lifecycleRationale: >-
  Retired for the new 0.4 compiler by the maintainer-selected foundation decision.
  This identity and prior criteria remain historical; old implementation, source
  admission, artifacts and results impose no compatibility or correctness
  obligation on the new language. The replacement has no executed evidence yet.


summary: Preserve checked scalar conversion, UTF-16 length, numeric rounding and finite readonly data snapshots without admitting arbitrary JavaScript coercion.
statement:
  en: >-
    A compiler may admit the bounded source operations defined here independently of any component identity. They preserve the existing primitive language semantics and JSON ownership boundary; they neither grant general object coercion nor remove readonly permissions from an authored lexical value.


criteria:
  - id: C-COMPILER-SCALAR-INPUT-0001-LENGTH
    text: >-
      Reading length on a checked string counts UTF-16 code units. Optional access preserves undefined only for a nullish receiver. This does not admit arbitrary string properties or extend a target's string transport domain.


  - id: C-COMPILER-SCALAR-INPUT-0001-CONVERSION
    text: >-
      Number accepts zero or one checked scalar primitive operand and follows the existing ECMAScript binary64 scalar conversion. No argument yields positive zero; undefined yields NaN. GPUI String accepts zero or one checked scalar primitive operand; no argument yields the empty string. Structured objects, callbacks, capabilities and opaque unknown do not acquire native conversion. Calls evaluate their argument once. Source bindings shadowing Number, String or Math retain their authored meaning.


  - id: C-COMPILER-SCALAR-INPUT-0001-ROUNDING
    text: >-
      Math.floor and Math.round each require one checked number operand. Floor rounds toward negative infinity. Round chooses the nearest integer with ties toward positive infinity, preserving negative zero for values from negative one half through negative zero. Both preserve NaN, infinities and signed zero as intermediate numeric values. This does not admit nonfinite outward JSON numbers. Evaluation occurs once, including failures.


  - id: C-COMPILER-SCALAR-INPUT-0001-READONLY
    text: >-
      An outward Expose event may snapshot a finite readonly record whose entire value type recursively proves JSON data. Readonly remains a lexical mutation restriction. The event schema removes only readonly metadata, retaining field types and optionality. Capabilities, callable values, open dictionaries, unknown and nested undefined cannot cross this boundary, including hidden fields in a structurally narrowed source view. A union retains the nesting depth of its alternatives: it preserves the existing root void boundary without admitting undefined inside a record or array. Independently supplied IR must satisfy the same proof as source admission.


  - id: C-COMPILER-SCALAR-INPUT-0001-EVENT-TARGETS
    text: >-
      A finite dynamic outward event key must name only declared events. Its checked JSON payload must satisfy every possible target event schema; another legal payload emitted only to one target may widen that target without invalidating the shared emission. A payload accepted by only one possible target remains invalid. Each target's boundary and the full source/serialized-IR provenance proof remain mandatory; joining target schemas is not a substitute for checking each target.



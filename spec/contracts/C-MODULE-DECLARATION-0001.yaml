id: C-MODULE-DECLARATION-0001
type: contract
title: Prototypes declare typed module configuration before execution
status: draft
since: 0.2.0-rc.7
summary: A prototype can bind immutable typed configuration to a stable module declaration token so runtimes and adapters can select host infrastructure before rendering.
statement:
  zh-CN: >-
    Prototype 可以通过具名、带类型的 token 静态声明 module configuration。declaration 在 prototype definition 上只编写一次，经由 immutable lookup 暴露给 adapter，并在 module construction 前作为同一只读视图进入 runtime；重复 declaration ID 必须 fail fast。


  en: >-
    A prototype may declare module configuration statically through a named typed token. The declaration is authored once on the prototype definition, exposed to adapters through immutable lookup, and passed as one read-only view into the runtime before module construction; duplicate declaration IDs must fail fast.


criteria:
  - id: C-MODULE-DECLARATION-0001-A
    text:
      zh-CN: '`moduleDeclaration<Config>(id)` 必须创建具有非空稳定 ID 与类型身份的只读 token；无效 ID 必须 fail fast。'
      en: '`moduleDeclaration<Config>(id)` must create a read-only token with a non-empty stable ID and typed identity; invalid IDs must fail fast.'
  - id: C-MODULE-DECLARATION-0001-B
    text:
      zh-CN: '`declareModule(token, config)` 必须只接受真实 declaration token，并返回与该 token ID 绑定、declaration 与顶层 config 均被冻结的只读值。'
      en: '`declareModule(token, config)` must accept only a genuine declaration token and return a read-only value bound to that token ID, with both the declaration and top-level config frozen.'
  - id: C-MODULE-DECLARATION-0001-C
    text:
      zh-CN: '`definePrototype` 必须将 authored declarations 暴露为冻结数组，并拒绝同一 prototype 内重复的 declaration ID。'
      en: '`definePrototype` must expose authored declarations as a frozen array and reject duplicate declaration IDs within one prototype.'
  - id: C-MODULE-DECLARATION-0001-D
    text:
      zh-CN: '`getModuleDeclaration` 必须按 token 的稳定 ID 返回对应 typed declaration；不存在时返回 undefined，不得产生隐式 fallback。'
      en: '`getModuleDeclaration` must return the matching typed declaration by the token stable ID, or undefined when absent, without an implicit fallback.'
  - id: C-MODULE-DECLARATION-0001-E
    text:
      zh-CN: Runtime 必须在 module construction 前将 prototype declarations 复制为同一个冻结只读视图，并向每个 `ModuleInit` 提供该视图。
      en: Before module construction, the runtime must copy prototype declarations into one frozen read-only view and provide that view to every `ModuleInit`.
  - id: C-MODULE-DECLARATION-0001-F
    text:
      zh-CN: Authored asHook 可以通过冻结的 `modules` surface 发布 pre-render static requirements；调用者 prototype 必须在 definition 上显式复用该 surface，setup-time asHook 调用不得被解释为能够事后改变 adapter selection。
      en: An authored asHook may publish pre-render static requirements through a frozen `modules` surface; a caller prototype must explicitly reuse that surface on its definition, and a setup-time asHook call must not be interpreted as retroactively changing adapter selection.
sources:
  - path: packages/core/src/prototype.ts
  - path: packages/core/src/module/types.ts
  - path: packages/runtime/src/orchestrator/module-orchestrator/runtime-module-orchestrator.ts
dependsOn:
  contracts:
    - C-CORE-SYNTAX-0003
revisions:
  - version: 0.2.0-rc.7
    change: revised
    summary: Added authored-asHook publication and explicit caller reuse of pre-render module requirements.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Cataloged the typed static declaration substrate used for pre-render host selection.
tags:
  - core
  - module
  - declaration
  - prototype
  - runtime

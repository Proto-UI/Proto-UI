id: C-IMAGE-VIEW-0001
type: contract
title: Image View projects one host-owned image presentation target
status: draft
since: 0.3.0-alpha.0
summary: Image View binds one semantically declared host-owned image presentation target to stable source ownership, portable property patches, generation-bound lease lifecycle, and normalized loading status transitions.
statement:
  zh-CN: >-
    Image View 必须通过 prototype 的静态 declaration 在首次 render 前声明 plain image presentation requirement（opaque URI source），由 adapter 选择物理 image target，并通过 portable patch、loadingStatus fact 与 loadingStatusChange transition 投影 image presentation 协议。source 变更必须创建新 generation 与 loading 状态；replacement、detach/rematerialize、dispose 必须使旧 generation 的 lease terminal。旧 generation 的 stale completion 不得改变当前 state 或发出 outward signal。


  en: >-
    Image View must declare a plain image presentation requirement (opaque URI source) before first render, let the adapter select the physical image target, and project the image presentation protocol through portable patches, loadingStatus facts, and loadingStatusChange transitions. A source change must create a new generation and loading state; replacement, detach/rematerialize, and disposal must make the old generation's lease terminal. A stale completion from an old generation must not change the current state or emit an outward signal.


criteria:
  - id: C-IMAGE-VIEW-0001-A
    text:
      zh-CN: Static declaration 必须只表达 plain image presentation requirement（opaque URI source）；adapter 在首次 render 前选择物理 image target。
      en: A static declaration must express only the plain image presentation requirement (opaque URI source); the adapter selects the physical image target before first render.
  - id: C-IMAGE-VIEW-0001-B
    text:
      zh-CN: Portable patch 必须投影 source、a11yMode、alternativeText、fit (contain|cover|fill) 与 module-owned loadingStatus；source 变更不得重置 alternativeText、a11yMode 或 fit，除非显式 patch。
      en: The portable patch must project source, a11yMode, alternativeText, fit (contain|cover|fill), and module-owned loadingStatus; a source change must not reset alternativeText, a11yMode, or fit unless explicitly patched.
  - id: C-IMAGE-VIEW-0001-C
    text:
      zh-CN: a11y 采用显式二分输入：informative 必须有 non-empty alternativeText；decorative 明确排除语义内容。矛盾/缺失输入属于 authoring diagnostic 并 fail closed，不由 adapter 猜测。
      en: >-
        A11y uses explicit binary input: informative requires non-empty alternativeText; decorative explicitly excludes semantic content. Contradictory or missing input is an authoring diagnostic and fails closed; the adapter must not guess.


  - id: C-IMAGE-VIEW-0001-E
    text:
      zh-CN: Generation-bound lease：新 source 必须先建立新 generation 与 loading 状态，再启动 host work；每次 host update 与 completion 必须携带不可变 generation identity。replacement、detach/rematerialize、physical-target replacement、dispose 必须使旧 lease/generation terminal。旧 completion 不得再改当前 state 或发 outward signal；当前 generation 的 terminal completion 最多接受一次。
      en: >-
        Generation-bound lease: a new source must first establish a new generation and loading state before starting host work; every host update and completion must carry an immutable generation identity. Replacement, detach/rematerialize, physical-target replacement, and disposal must make the old lease/generation terminal. A stale completion from an old generation must not change the current state or emit an outward signal; the current generation's terminal completion is accepted at most once.


  - id: C-IMAGE-VIEW-0001-F
    text:
      zh-CN: loadingStatus (idle|loading|loaded|error) 与 loadingStatusChange transition 是唯一的状态/transition surface。进入 loaded 或 error 是 terminal evidence。v0 不公开同义的 load/error 事件。
      en: loadingStatus (idle|loading|loaded|error) and loadingStatusChange transition are the only status/transition surfaces. Entering loaded or error is terminal evidence. v0 does not expose synonymous load/error events.
  - id: C-IMAGE-VIEW-0001-G
    text:
      zh-CN: Replacement v0 必须清除 previous visual，避免把 host 偶然保留的旧图变成隐式协议。
      en: Replacement v0 must clear the previous visual to prevent an accidentally retained old image from becoming an implicit protocol.
  - id: C-IMAGE-VIEW-0001-H
    text:
      zh-CN: Target listener 与 host reference 必须受 generation lease 约束并在 detach/dispose 时撤销；旧 generation 的事件必须在 lease boundary 内停止传播。
      en: Target listeners and host references must be bounded by the generation lease and revoked on detach or disposal; events from an old generation must stop at the lease boundary.
sources:
  - path: packages/modules/image-view/src/create.ts
  - path: packages/prototypes/base/src/image/root.proto.ts
dependsOn:
  decisions:
    - D-IMAGE-VIEW-PROJECTION-0001
  contracts:
    - C-HOST-SURFACE-PROJECTION-0001
    - C-MODULE-DECLARATION-0001
    - C-AS-HOOK-0001
revisions:
  - version: 0.3.0-alpha.0
    change: introduced
    summary: >-
      Introduced the focused Image View host boundary for one host-owned image presentation target with generation-bound lease, loadingStatus/transition surfaces, and explicit a11y binary input.



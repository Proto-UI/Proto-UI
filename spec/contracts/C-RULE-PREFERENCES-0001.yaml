id: C-RULE-PREFERENCES-0001
type: contract
title: Bounded live preference inputs fail closed
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: A bounded experimental slice for issue 793. Fixed vocabulary and lifetime are reviewable; independent admission and complete provider evidence remain required. This is not a generic reactive Meta bus or material realization guarantee.
  zh-CN: Issue 793 的有界实验片，固定词表和生命周期可审查；仍需独立接纳与完整 provider 证据，不是通用 reactive Meta 总线或材质实现保证。
summary: Four new preference keys require a matching active source; legacy Meta keys remain sampled.
statement:
  en: Rule Meta owns a separate mounted preference lease. Prototype Rules choose presentation policy; the host supplies preference facts only. No Base interaction, existing sampled key, colorScheme contract, structural render or Compiler/native support is changed.
  zh-CN: Rule Meta 拥有独立 mounted preference 租约，Prototype Rule 决定呈现策略，host 仅提供偏好事实。不改变 Base 交互、既有 sampled key、colorScheme 契约、结构渲染或 Compiler/native 支持。
criteria:
  - id: C-RULE-PREFERENCES-0001-A
    text:
      en: The fixed keys are preference.reducedMotion and preference.reducedTransparency (no-preference, reduce, unknown), preference.contrast (no-preference, less, more, custom, unknown), and preference.forcedColors (none, active, unknown). Unrecognized values normalize to unknown. Existing reducedMotion remains sampled with its existing compatibility fallback.
      zh-CN: 固定 key 为 preference.reducedMotion 与 preference.reducedTransparency（no-preference、reduce、unknown），preference.contrast（no-preference、less、more、custom、unknown），以及 preference.forcedColors（none、active、unknown）。非法值归一为 unknown，既有 reducedMotion 保留原 sampled 兼容回退。
  - id: C-RULE-PREFERENCES-0001-B
    text:
      en: Only authored fixed-key Rule dependencies acquire one getter-reference-paired subscription after mounted. Setup, detached, disposing, absent, mismatched or unleased reads return unknown. No subscription is acquired for legacy or unrelated keys. Explicit evaluation-context readMeta overrides remain caller-owned.
      zh-CN: 仅 authored 固定 key Rule dependency 在 mounted 后取得一个 getter 引用配对订阅。setup、detached、disposing、缺失、错配或无租约读取返回 unknown；旧 key 和无关 key 不订阅。显式 evaluation-context readMeta override 仍由调用方负责。
  - id: C-RULE-PREFERENCES-0001-C
    text:
      en: Subscribe precedes fresh style reconciliation. Replacement, reset, mismatch and source loss retire the old generation before release and reconcile mounted consumers to unknown immediately. Unmount/dispose release the lease; old callbacks cannot request work. Remount samples afresh even when the preference is unchanged.
      zh-CN: 先订阅再重算样式。替换、reset、错配与 source loss 在释放前淘汰旧 generation，并立即将 mounted consumer 重算为 unknown。unmount/dispose 释放租约，旧回调不得请求工作；remount 即使值不变也重新采样。
  - id: C-RULE-PREFERENCES-0001-D
    text:
      en: Notifications request the existing Rule style reevaluation port, without direct Props pulls, structural renders, delivered value caches or a second evaluator. Unknown must not affirmatively enable preference-dependent presentation.
      zh-CN: 通知只请求既有 Rule style reevaluation port，不直接拉取 Props、结构重渲染、传递值缓存或引入第二 evaluator。unknown 不得肯定启用依赖偏好的呈现。
verifies:
  tests: [T-RULE-PREFERENCES-0001]
relates:
  contracts: [C-RULE-COLOR-SCHEME-0001]
  modules: [M-RULE-META-0001]
openQuestions:
  - id: C-RULE-PREFERENCES-0001-Q-ADMISSION
    question:
      en: Has the bounded API and real Web provider evidence received independent admission? Compiler, GPUI, Flutter and Qt are not implemented by this slice.
      zh-CN: 有界 API 与真实 Web provider 证据是否已独立接纳？本片未实现 Compiler、GPUI、Flutter 或 Qt。
    blocks: [activation:C-RULE-PREFERENCES-0001]

revisions:
  - version: 0.3.0-alpha.1
    change: refined
    summary: Added definition-only opt-in paint-footprint visual separation with planned evidence; default border-box positioning remains unchanged.
  - version: 0.3.0-alpha.1
    change: refined
    summary: Added revocable host-local input-origin associations and current-connection callback-phase delivery with reentrant lease cancellation, without exporting geometry or replacing logical anchor ownership.
  - version: 0.3.0-alpha.0
    change: refined
    summary: Made rendered-anchor geometry the positioning default and added the explicit excludeAnchorTranslation opt-in for decorative interaction transforms.
  - version: 0.2.0-rc.0
    change: introduced
    summary: Defined host-mediated anchored geometry, collision defaults, output projection, Portal separation, and bounded observation lifetime.

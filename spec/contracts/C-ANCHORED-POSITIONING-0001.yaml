id: C-ANCHORED-POSITIONING-0001
type: contract
title: Anchored positioning is host-mediated geometry with bounded lifetime
status: draft
since: 0.2.0-rc.0
summary: Proto modules declare anchor-relative placement while a host capability measures, resolves collisions, writes coordinates, and observes geometry only while the floating view is active.
statement:
  zh-CN: >-
    Anchored Positioning 必须把语义 placement 与宿主几何分离。Proto module 只声明 anchor、floating、side、align、offset、strategy 与 collision policy；测量、overflow ancestor 发现、坐标写入和 scroll/resize/element-resize observation 必须由 host-cap 完成。默认碰撞边界是 floating 的 clipping ancestors，并以 visual viewport 为 root boundary。positioning lease 只能在浮层 view active 且 anchor/floating 同时可用时存在；Portal 是独立能力，用于逃逸无法通过几何重新定位消除的 ancestor clipping。


  en: >-
    Anchored Positioning must separate semantic placement from host geometry. A Proto module declares only the anchor, floating target, side, align, offsets, strategy, and collision policy; measurement, overflow-ancestor discovery, coordinate writes, and scroll, resize, and element-resize observation are performed by a host capability. The default collision boundary is the floating target's clipping ancestors with the visual viewport as root boundary. A positioning lease may exist only while the floating view is active and both anchor and floating targets are available. Portal remains an independent capability for escaping ancestor clipping that geometry alone cannot remove.


criteria:
  - id: C-ANCHORED-POSITIONING-0001-A
    text:
      zh-CN: Proto author 与通用 module 不得直接测量或写入宿主几何；这些操作必须由 Anchored Position host-cap 执行。
      en: Prototype authors and generic modules must not directly measure or write host geometry; those operations must be performed by the Anchored Position host capability.
  - id: C-ANCHORED-POSITIONING-0001-B
    text:
      zh-CN: 配置必须至少表达 side、align、sideOffset、alignOffset、absolute/fixed strategy、avoidCollisions、collisionBoundary 与 collisionPadding。
      en: Configuration must express at least side, align, sideOffset, alignOffset, absolute or fixed strategy, avoidCollisions, collisionBoundary, and collisionPadding.
  - id: C-ANCHORED-POSITIONING-0001-C
    text:
      zh-CN: avoidCollisions 启用时，host 必须执行 flip 与 shift；默认 boundary 为 clipping ancestors，root boundary 为 visual viewport，并返回 resolved side/align。
      en: When avoidCollisions is enabled, the host must perform flip and shift, default the boundary to clipping ancestors and the root boundary to the visual viewport, and report the resolved side and align.
  - id: C-ANCHORED-POSITIONING-0001-D
    text:
      zh-CN: host 必须把坐标写入 position/left/top，避免占用 transform，以便 Transition 或下游样式独立拥有 transform；并投射 resolved data-side/data-align 与可用尺寸变量。
      en: The host must write coordinates through position, left, and top without taking ownership of transform so Transition or downstream styling can own transform independently; it also projects resolved data-side and data-align plus available-size variables.
  - id: C-ANCHORED-POSITIONING-0001-E
    text:
      zh-CN: 自动更新只能在 active view 的 lease 生命周期内监听 scroll、resize 与 element resize，默认不得启用逐帧 animation-frame polling，detach/dispose 必须撤销全部监听。
      en: Automatic updates may observe scroll, resize, and element resize only for the lifetime of an active-view lease, must not enable per-frame animation-frame polling by default, and must revoke every observer on detach or dispose.
  - id: C-ANCHORED-POSITIONING-0001-F
    text:
      zh-CN: collision detection 与 Portal 不得合并为同一策略；inline floating 使用实际 clipping ancestors，Portal 可改变宿主 containing/clipping context，但 logical owner 必须保持不变。
      en: Collision detection and Portal must not be merged into one policy; an inline floating target uses its actual clipping ancestors, while Portal may change its host containing and clipping context without changing its logical owner.
  - id: C-ANCHORED-POSITIONING-0001-G
    text:
      zh-CN: host 默认必须基于 anchor 的实际渲染几何定位；只有 config 显式声明 `excludeAnchorTranslation` 时才允许从测量中扣除 anchor 自身 CSS translation（matrix m41/m42），以排除 hover lift、press 等交互装饰位移。合法布局 translation（如居中、应用动画）不得被默认抵消。
      en: The host must position against the anchor's actual rendered geometry by default; only when the config explicitly declares `excludeAnchorTranslation` may it subtract the anchor's own CSS translation (matrix m41/m42) from the measurement to exclude decorative interaction offsets such as hover lift or press-down. Legitimate layout translations (centering, application animation) must not be cancelled by default.
  - id: C-ANCHORED-POSITIONING-0001-H
    text:
      en: 'An optional input-origin association may select a host-local point or element reference. It must expose no geometry or contact identity to portable props, State, or Context JSON. Revocation invalidates pending geometry writes; the association affects positioning only, without replacing the logical anchor used for boundary and focus.'
      zh-CN: '可选 input-origin 关联可选择宿主本地点或元素参考；不得向可移植 props、State 或 Context JSON 暴露几何及 contact identity。撤销必须使待完成几何写入失效；该关联只影响定位，不替代 boundary 与 focus 的逻辑 anchor。'
  - id: C-ANCHORED-POSITIONING-0001-I
    text:
      zh-CN: 宿主完成回调必须先进入实例的 Runtime callback 作用域，再调用消费者回调。Module 在分发前和进入分发后都必须拒绝已替换连接、provider epoch、已断开或终止 owner 的结果。重入的 lease attach/update/dispose 不得安装或恢复旧租约。断开会清除分类 snapshot；终止后 reconnect 不得复活。该保护补充而不替代宿主的几何写入取消。
      en: Host completion must pass through the instance Runtime callback scope before invoking consumer callbacks. Both before dispatch and inside dispatch, the module must reject replaced connections, provider epochs, disconnected or terminal owners. Reentrant lease attach, update or disposal must not install or restore an obsolete lease. Disconnect clears the categorical snapshot and terminal disposal cannot be revived by reconnect. This guard supplements rather than replaces host-side geometry-write cancellation.
  - id: C-ANCHORED-POSITIONING-0001-VISUAL-GAP
    text:
      en: "An explicit visual-gap policy may relate current host-local anchor and floating paint targets to the existing positioning connection. Omission preserves border-box sideOffset semantics and every existing default. For distinct paint and positioning targets, the host first projects the paint target's expanded bounds into the corresponding anchor/floating reference coordinate frame and derives nonnegative effective edges relative to that reference border box, including internal offsets and overflow; unsupported projection is unavailable, never an assumption that boxes coincide. In visual mode, the requested nonnegative clearance applies between conservative painted boundaries: for resolved side s, border-box separation must be at least the maximum of existing sideOffset and effective anchor-reference edge on s plus effective floating-reference edge on its opposing side plus clearance. Resolve asymmetric edges after flip; shift and available-space calculations must not conceal paint clipping. The logical anchor, floating lifecycle frame, focus and Portal remain unchanged even when a distinct associated Surface owns paint."
      zh-CN: '显式 visual-gap 策略可将当前宿主侧 anchor 与 floating 绘制目标关联到现定位连接；省略时保持 border-box sideOffset 语义和全部默认行为。绘制与定位目标不同时，host 先把绘制目标的扩展边界投射到对应 anchor/floating 参考坐标域，再相对参考 border box 计算含内部偏移与溢出的非负 effective edges；不支持投射时 unavailable，不得假设两框重合。视觉模式的非负 clearance 作用于保守绘制边界：resolved side s 的 border-box 分离至少为现 sideOffset 与 anchor-reference 在 s 边的 effective edge、floating-reference 对向 effective edge 及 clearance 之和两者的最大值。flip 后按非对称边求解，shift 与可用空间计算不得掩盖绘制裁切。独立关联 Surface 拥有绘制时仍保留 logical anchor、floating 生命周期框、focus 与 Portal。'
  - id: C-ANCHORED-POSITIONING-0001-VISUAL-UNAVAILABLE
    text:
      en: 'Visual-gap readiness requires both current footprint facts and a feasible current placement. Unknown, stale or revoked footprint is unavailable, not zero. A fallback placement may retain the existing border-box policy and Base interactions, but must report visual clearance unavailable and preserve complete opaque material fallback; it cannot claim optical or visual-ready success. Footprint updates use the current active positioning lease, never restart Overlay entry, and obey existing current-computation and Runtime callback cancellation.'
      zh-CN: 'visual-gap 就绪要求两侧当前 footprint 事实及可满足的当前定位；未知、过期或撤销范围为 unavailable 而非零。回退定位可保留原 border-box 策略与 Base 交互，但必须报告视觉间距不可用并保留完整不透明材质回退，不得宣称光学或 visual-ready 成功。范围更新使用当前 active positioning lease，不重启 Overlay entry，并遵守现 current-computation 与 Runtime callback 取消约束。'
sources:

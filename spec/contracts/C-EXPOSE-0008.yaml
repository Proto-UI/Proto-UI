dependsOn:
  contracts:
    - C-EXPOSE-0004
    - C-LIFECYCLE-0004
    - C-LIFECYCLE-0006
revisions:
  - version: 0.2.0-rc.7
    change: revised
    summary: Aligned Expose ownership with the dual-axis lifecycle so repeatable view detachment preserves entries and only terminal disposal invalidates them.
  - version: 0.1.0
    change: introduced
    summary: Captured lifecycle invalidation and cleanup for expose entries.
tags:

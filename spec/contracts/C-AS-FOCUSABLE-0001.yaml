id: C-AS-FOCUSABLE-0001
type: contract
title: asFocusable declares a no-arg singleton focus target
status: draft
since: 0.1.0
summary: asFocusable is a privileged no-arg once asHook that declares the caller as a focus target and returns state-backed focus facts plus target-level focus requests.
statement:
  zh-CN: >-
    `asFocusable()` 是 focus domain 的特权 asHook，用于声明当前原型实例是 focus target。它必须保持无参数、once/singleton 安装形态，并通过返回的 handle 提供 setup 期配置、focus facts observed state handle，以及 `focus`/`focusSelf`/`blur` 等 target-level focus requests。`asFocusable()` 不负责 scope entry、restore、trap 或 sibling roving navigation。


  en: >-
    `asFocusable()` is the focus-domain privileged asHook for declaring the current prototype instance as a focus target. It must remain a no-arg, once/singleton install hook, and expose setup-time configuration, focus fact observed state handles, and target-level focus requests such as `focus`, `focusSelf`, and `blur` through its returned handle. `asFocusable()` does not own scope entry, restore, trap, or sibling roving navigation.


criteria:
  - id: C-AS-FOCUSABLE-0001-A
    text:
      zh-CN: '`asFocusable()` 必须是特权 asHook，并必须以 no-arg caller 形态调用。'
      en: '`asFocusable()` must be a privileged asHook and must be called as a no-arg caller.'
  - id: C-AS-FOCUSABLE-0001-B
    text:
      zh-CN: 同一 setup 中重复调用 `asFocusable()` 必须复用同一个 focusable handle，不得重复安装 focusable capability。
      en: Repeated `asFocusable()` calls in the same setup must reuse the same focusable handle and must not reinstall the focusable capability.
  - id: C-AS-FOCUSABLE-0001-C
    text:
      zh-CN: '`asFocusable()` 返回的 `focused`、`focusVisible` 与 `focusable` 必须是 state-backed observed handles，而不是原型作者可写状态。'
      en: 'The `focused`, `focusVisible`, and `focusable` values returned by `asFocusable()` must be state-backed observed handles, not author-writable states.'
  - id: C-AS-FOCUSABLE-0001-D
    text:
      zh-CN: '`asFocusable()` 的 `configure(...)` 必须限制在 setup 期使用。'
      en: '`asFocusable().configure(...)` must be restricted to setup-time use.'
  - id: C-AS-FOCUSABLE-0001-E
    text:
      zh-CN: disabled focusable 不得接受 focus request 并激活 focus facts。
      en: A disabled focusable must not accept focus requests that activate focus facts.
  - id: C-AS-FOCUSABLE-0001-F
    text:
      zh-CN: '`asFocusable()` 必须允许运行时切换自然导航参与状态；`navParticipation: none` 应将 target 排除出宿主顺序焦点导航，但不得等同于 disabled，也不得阻止显式或 roving focus request。对于非原生可聚焦 target，支持该投射的 Web host 必须保留程序化聚焦能力，例如使用 `tabindex="-1"`，而不得通过完全移除 `tabindex` 使请求失效。'
      en: '`asFocusable()` must allow runtime switching of natural navigation participation; `navParticipation: none` should remove the target from host sequential focus navigation, but must not be equivalent to disabled or block explicit or roving focus requests. For a target that is not natively focusable, a Web host supporting this projection must preserve programmatic focusability, for example with `tabindex="-1"`, rather than removing `tabindex` entirely and making the request inapplicable.'
  - id: C-AS-FOCUSABLE-0001-G
    text:
      zh-CN: 当合法的 logical focus request 发生时 host target 尚未完成 projection，Focus 必须只保留最新 pending request，并在该实例后续 commit/mounted readiness 使 target 与 logical parent 可用后重新经过 Focus Center policy 再兑现；host focus capability 必须能够拒绝当前尚不可应用的 target，且拒绝不得被解释为成功或产生 facts。当宿主的 connected 与 focus-ready 不是同一时刻时，adapter 必须通过窄化的 target-readiness host capability 发出就绪信号。retained view detach 仅结束当前 host view epoch，不得丢弃 logical owner 的 pending request；若 Portal 或后续 retained view epoch 移动或替换 native target，同一就绪信号必须把 pending 或既有 focus owner 投射到新 target，而不得伪造或改写 semantic facts。`preventScroll` request policy 必须由支持该能力的宿主投射为保持 viewport 的原生 focus option，不支持的宿主可以忽略该 policy，但不得拒绝 logical focus。pending 期间不得伪造 focus facts，blur、disabled、更新的 request、logical instance 的 terminal unmount 或 dispose 必须取消或取代旧 request。
      en: When a valid logical focus request occurs before its host target has completed projection, Focus must retain only the latest pending request and re-run it through Focus Center policy after a later commit or mounted-readiness boundary makes both the target and logical parent available; the host focus capability must be able to reject a target that is not yet applicable, and rejection must not be interpreted as success or produce facts. When host connectedness and focus-readiness occur at different times, the adapter must publish readiness through a narrow target-readiness host capability. A retained view detach ends only the current host view epoch and must not discard the logical owner's pending request; if a portal or later retained view epoch moves or replaces the native target, the same readiness signal must project the pending or established focus owner onto the new target without fabricating or rewriting semantic facts. A host that supports the `preventScroll` request policy must project it to native focus while preserving the viewport; a host without that capability may ignore the policy but must not reject logical focus. While pending, focus facts must not be fabricated, and blur, disabled, a newer request, terminal unmount of the logical instance, or dispose must cancel or replace the older request.

revisions:
  - version: 0.1.0
    change: introduced
    summary: Captured asFocusable as the no-arg focus target privileged hook.
  - version: 0.1.1
    change: refined
    summary: Added runtime natural navigation participation switching for roving focus item tab-order control.
  - version: 0.1.2
    change: refined
    summary: Added durable pre-projection focus requests with latest-wins, commit fulfillment, and lifecycle cancellation rules.
  - version: 0.1.3
    change: refined
    summary: Clarified mounted host and logical-parent readiness plus Focus Center policy revalidation.
  - version: 0.1.4
    change: refined
    summary: Required an explicit narrow host capability when adapter target readiness follows connection.
  - version: 0.1.5
    change: refined
    summary: Required target readiness to re-project an established logical focus owner across portal and retained view epochs.
  - version: 0.1.6
    change: refined
    summary: Allowed the host focus capability to reject a temporarily inapplicable target without producing focus facts.
  - version: 0.1.7
    change: refined
    summary: Required retained view detachment to preserve pending logical focus until replacement target readiness.
  - version: 0.1.8
    change: refined
    summary: Clarified adapter-owned post-layout readiness for connected Web targets that still reject focus before layout.
  - version: 0.1.9
    change: refined
    summary: Added host projection semantics for scroll-preserving focus requests.
  - version: 0.1.10
    change: refined
    summary: Required navParticipation none to preserve programmatic focusability for non-native Web targets.

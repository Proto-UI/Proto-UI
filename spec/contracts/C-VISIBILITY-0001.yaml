openQuestions:
  - id: C-VISIBILITY-0001-Q-HOST-CAPABILITY
    question:
      zh-CN: Visibility 投射是否应拆出独立 host capability/module port，以统一 a11y、focus、hit 与 visual channel 的 host 投射？
      en: Should Visibility projection be split into a dedicated host capability or module port to unify host projection across a11y, focus, hit, and visual channels?
    context:
      zh-CN: 当前实现中相关能力分散在 a11y、focus、hit participation 与 style 投射中，第一轮契约先定义事实域与边界。
      en: Current implementation paths are distributed across a11y, focus, hit participation, and style projection; the first contract pass defines the fact domain and boundary first.
    blocks:
      - C-VISIBILITY-0001
revisions:
  - version: 0.1.0
    change: introduced
    summary: Drafted Visibility as the host-neutral hidden fact domain distinct from presence and host-specific projection mechanisms.

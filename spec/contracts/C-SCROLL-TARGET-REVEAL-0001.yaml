openQuestions:
  - id: C-SCROLL-TARGET-REVEAL-0001-Q-ADMISSION
    question:
      en: When do the original four-adapter short-viewport Search journeys and independent lifetime review admit this bounded Web profile?
      zh-CN: 何时以原四 Adapter 短视口 Search 旅程及独立生命周期审查准入此有界 Web profile？
    blocks: [activation:C-SCROLL-TARGET-REVEAL-0001]
  - id: C-SCROLL-TARGET-REVEAL-0001-Q-PROFILES
    question:
      en: When do independent compiler, non-Web, horizontal and externally clipped multi-surface journeys admit corresponding reveal profiles?
      zh-CN: 何时以独立 compiler、非 Web、横向及外部 clipping 多 surface 旅程准入对应 reveal profile？
    blocks: []
revisions:

id: C-A11Y-0001
type: contract
title: Accessibility exposes projectable semantic objects
status: draft
since: 0.1.0
summary: The a11y domain records projectable semantic object facts, stable opaque object identity, and string or ordered-reference relationships without exposing protocol keys as host ids.
statement:
  zh-CN: >-
    Accessibility 是一个可由宿主投影的 semantic object domain。原型通过 a11y API 声明当前交互对象的 identity、role、name、description、state、action、relation 与 semantic tree behavior；runtime 将这些声明保存为稳定 IR，adapter 负责把 IR 投影到宿主的无障碍表达。a11y IR 可以引用 state/focus/event/anatomy 等其它域事实，但 a11y 不重新拥有这些域。


  en: >-
    Accessibility is a host-projectable semantic object domain. A prototype declares identity, role, name, description, state, action, relation, and semantic tree behavior for the current interaction object through a11y APIs; the runtime stores these declarations as stable IR, and adapters project the IR to host accessibility output. A11y IR may reference facts from state, focus, event, anatomy, and other domains, but a11y does not re-own those domains.


criteria:
  - id: C-A11Y-0001-A
    text:
      zh-CN: a11y domain 必须输出可由 adapter 投影的 semantic object IR。
      en: The a11y domain must output semantic object IR that adapters can project.
  - id: C-A11Y-0001-B
    text:
      zh-CN: semantic object 至少应能表达 identity、role、name、description、state、action 与 relation。
      en: A semantic object should at least be able to express identity, role, name, description, state, action, and relation.
  - id: C-A11Y-0001-C
    text:
      zh-CN: role 表达交互对象是什么，不得直接等同于某个宿主 attribute 名称。
      en: Role describes what the interaction object is and must not be equated directly with a host attribute name.
  - id: C-A11Y-0001-D
    text:
      zh-CN: name 与 description 必须作为 semantic object 的事实记录，而不是 Button 等单个原型的私有 props 规则。
      en: Name and description must be recorded as semantic object facts rather than private props rules of a single prototype such as Button.
  - id: C-A11Y-0001-E
    text:
      zh-CN: a11y state 可以引用 state handle；其值读取与生命周期仍由 state domain 负责。
      en: A11y state may reference state handles; value reading and lifecycle remain owned by the state domain.
  - id: C-A11Y-0001-F
    text:
      zh-CN: a11y action 可以引用 expose event 或其它交互通路；action 本身不重新定义 event route。
      en: A11y action may reference expose events or other interaction routes; the action itself does not redefine the event route.
  - id: C-A11Y-0001-G
    text:
      zh-CN: adapter 可以按宿主能力选择原生 identity/role/name/state/action/relation 投影、降级投影或仅保留诊断 IR。
      en: Adapters may choose native identity/role/name/state/action/relation projection, degraded projection, or diagnostic-only IR based on host capabilities.
  - id: C-A11Y-0001-H
    text:
      zh-CN: a11y relation 可以引用字符串目标、state handle、单个 opaque semantic-object ref 或有序 ref list；ref 与 protocol match key / host id 相互独立，宿主 adapter 负责投影为宿主可表达的关系机制。
      en: An A11y relation may reference a string target, state handle, one opaque semantic-object ref, or an ordered ref list; refs remain independent of protocol match keys and host ids, and host adapters project them to host-expressible relationship mechanisms.
  - id: C-A11Y-0001-I
    text:
      zh-CN: a11y name 与 description 可以引用字符串或 state handle；当引用 state handle 时，adapter 投射必须随 state 值变化更新。
      en: A11y name and description may reference a string or a state handle; when they reference a state handle, adapter projection must update as the state value changes.
  - id: C-A11Y-0001-J
    text:
      zh-CN: a11y role 可以引用静态字符串或 state handle；当交互对象的 role 由受治理状态切换时，adapter 投射必须随 state 更新。
      en: A11y role may reference a static string or a state handle; when an interaction object's role changes through governed state, adapter projection must update with that state.
  - id: C-A11Y-0001-K
    text:
      zh-CN: 对于可包含多个 IDREF 的 relation，原型可以声明追加投影；adapter 必须保留宿主已有且不由该 semantic object 拥有的 relation 目标，并只更新或移除自身拥有的目标。
      en: For relations that accept multiple IDREFs, a prototype may declare additive projection; the adapter must preserve existing host relation targets not owned by that semantic object and update or remove only its own targets.
  - id: C-A11Y-0001-L
    text:
      zh-CN: a11y semantic tree behavior 可以引用 state handle；投影 snapshot 必须解析为 boolean，并在 mounted 后随 state 更新，且 semantic hiding 不得误改宿主布局可见性。
      en: A11y semantic tree behavior may reference state handles; projected snapshots must resolve to booleans and update with state after mount, while semantic hiding must not alter host layout visibility.
  - id: C-A11Y-0001-M
    text:
      zh-CN: Web adapter 投影字符串 a11y state 时，空字符串必须移除对应宿主 attribute，并在恢复非空值后重新投影。
      en: When the Web adapter projects a string a11y state, an empty string must remove the corresponding host attribute, and a later non-empty value must restore it.
  - id: C-A11Y-0001-N
    text:
      zh-CN: 每个 A11y module logical instance 必须拥有一个 opaque semantic-object ref；该 ref 不包含 host data，在 source/target view detach、replacement 与 rematerialization 期间保持 identity，terminal disposal 时释放 projector ownership。
      en: Every A11y module logical instance must own one opaque semantic-object ref; the ref contains no host data, preserves identity across source or target view detach, replacement, and rematerialization, and releases projector ownership on terminal disposal.
  - id: C-A11Y-0001-O
    text:
      zh-CN: 单 ref 或 ordered ref list 必须在 snapshot 中归一化为 first-occurrence order 的 frozen list；module-internal owner 可以原子 set/remove relation。Mounted 后 set、replace 或 remove State-backed relation 时，投影必须跟随 current binding，并停止跟随 replaced/removed handle。Missing、duplicate-bound 或 unavailable target 必须使整个 structured relation fail closed，而不得投影 partial list。
      en: A single ref or ordered ref list must normalize in snapshots to a frozen first-occurrence-ordered list; a module-internal owner may atomically set or remove the relation. When a State-backed relation is set, replaced, or removed after mount, projection must follow the current binding and stop following the replaced or removed handle. A missing, duplicate-bound, or unavailable target must fail the entire structured relation closed rather than project a partial list.
  - id: C-A11Y-0001-P
    text:
      zh-CN: Web direct-ref projector 必须从 opaque ref 保留 target identity，而不是从 protocol key 生成 host id；reservation 作用域必须限定为 target owner document，projector cap replacement 必须立即 replay current semantic snapshot，dependent-source re-resolution 必须按 dependency 定向且不得 sweep unrelated legacy projections；target detach/rematerialize、owner-document transition、source/target physical replacement 与 terminal disposal 必须撤销 stale IDREF/id ownership、重新解析 dependent sources，并保留 host-authored additive tokens 与不再由 projector 拥有的值。
      en: The Web direct-ref projector must reserve target identity from the opaque ref rather than derive a host id from a protocol key; reservations must be scoped to the target owner document, projector-cap replacement must immediately replay the current semantic snapshot, and dependent-source re-resolution must be dependency-targeted without sweeping unrelated legacy projections. Target detach or rematerialization, owner-document transition, source or target physical replacement, and terminal disposal must revoke stale IDREF or id ownership, re-resolve dependent sources, and preserve host-authored additive tokens and values the projector no longer owns.

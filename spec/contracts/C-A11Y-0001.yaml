  prototypes:
    - P-BASE-BUTTON
verifies:
  tests:
    - T-A11Y-0001
revisions:
  - version: 0.1.0
    change: introduced
    summary: Introduced the minimal semantic object contract for the a11y module.
  - version: 0.1.1
    change: refined
    summary: Allowed a11y name and description text facts to reference state handles for dynamic host-neutral labels.
  - version: 0.1.2
    change: refined
    summary: Allowed semantic roles to reference state handles for governed dynamic role projection.
  - version: 0.2.0-rc.7
    change: refined
    summary: Added additive relation projection, state-backed semantic tree behavior, and optional Web a11y state omission.
  - version: 0.3.0-alpha.0
    change: refined
    summary: Added opaque logical semantic-object refs, ordered multi-target relations, runtime mutation, and bounded Web direct-ref projection lifecycle.

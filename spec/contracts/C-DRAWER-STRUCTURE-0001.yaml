id: C-DRAWER-STRUCTURE-0001
type: contract
title: Passive Drawer Header and Footer share their logical owner
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: Portable structural parts are defined independently of New York direction, viewport sizing and Content gesture work; native composition remains unverified.
summary: Passive parts preserve anatomy; a separate read-only accepted-direction observation supports family presentation without input ownership.
statement:
  en: Drawer Header and Footer are passive slot containers belonging to the nearest logical Drawer family owner. Family styling does not create another Root, input route or mutable presentation authority.
  zh-CN: Drawer Header 与 Footer 是归属最近逻辑 Drawer family owner 的被动 slot 容器。family 样式不创建另一 Root、输入路径或可变呈现权限。
criteria:
  - id: C-DRAWER-STRUCTURE-0001-PASSIVE
    text:
      en: Base Header and Footer claim only their existing header or footer anatomy role and preserve authored children. They add no focusability, accessibility role, range, state, event, command or geometry owner. The asHook form is idempotent within one prototype setup.
      zh-CN: Base Header 与 Footer 仅声明已有 header 或 footer anatomy role 并保留作者子内容，不增加焦点、无障碍角色、范围、State、事件、命令或几何 owner。asHook 在一次原型 setup 内幂等。
  - id: C-DRAWER-STRUCTURE-0001-OWNER
    text:
      en: Existing Drawer anatomy cardinality and containment apply within each logical Root. Mixed visual families may compose under that owner; nested Roots do not share header or footer membership. Disposing the owner releases descendant instances and memberships; these passive parts expose no writable or retained State handles.
      zh-CN: 已有 Drawer anatomy 数量与包含约束在每个逻辑 Root 内适用。不同视觉 family 可在同一 owner 下组合；嵌套 Root 不共享 header 或 footer 成员。owner dispose 释放子实例与成员；被动部件不暴露可写或留存 State handle。
  - id: C-DRAWER-STRUCTURE-0001-DIRECTION
    text:
      en: Content asHook returns a frozen acceptedSide observation of its existing accepted drawerSide with read and observe only; it is not a Rule State token. It never exposes set, setDefault, raw capture access or mutable Context. Initial unadmitted Content retains the existing bottom default, and invalid updates retain the last accepted side together with the existing admission behavior.
      zh-CN: Content asHook 将已有已接受 drawerSide 投影为仅含 read 与 observe 的冻结观察对象，并非 Rule State token。不提供 set、setDefault、原始 capture 或可写 Context。初始未准入 Content 保留已有 bottom 默认值；非法更新保留最后已接受方向及现有准入行为。
  - id: C-DRAWER-STRUCTURE-0001-OBSERVATION
    text:
      en: The separate asDrawerAcceptedSide helper observes only the nearest logical Drawer Root's Content through a private scalar presentation Context whose Root ID must match the nearest Drawer Root Context. Missing or retired Content projects null, never an outer Root's Content. The existing Context API owns subscriptions and provider rebinding; the helper gates projection during view detach and terminal disposal, and resynchronizes on remount. Only an admitted accepted Content publishes a direction; otherwise the descendant projection is null. Its frozen read/observe facade is idempotent within setup, is observation-only and cannot change Content acceptance; observe registration is setup-only. Base Header and Footer remain passive and do not compose this helper themselves.
      zh-CN: 独立 asDrawerAcceptedSide helper 仅经私有标量呈现 Context 观察最近逻辑 Drawer Root 的 Content，呈现 Root ID 必须与最近 Drawer Root Context 匹配。缺失或退役 Content 投影 null，绝不借用外层 Root 的 Content。已有 Context API 负责订阅及 provider 重绑定；helper 在 view detach 与最终 dispose 期间阻断投影并于 remount 重新同步。只有已准入且已接受的 Content 发布方向，否则子部件观察为 null。冻结 read/observe facade 在 setup 内幂等，只读且不能改变 Content 准入；observe 仅在 setup 注册。Base Header 与 Footer 仍被动，不自行组合此 helper。
  - id: C-DRAWER-STRUCTURE-0001-FAMILY
    text:
      en: Shadcn Header composes Base Header and the accepted-side observation, owning flex flex-col gap-0.5 p-4 and center alignment for accepted top/bottom directions; left/right or missing Content inherit alignment. Shadcn Footer retains mt-[auto] flex flex-col gap-2 p-4. Family-local presentation State may mirror the observation for rules but does not mutate Base authority. Responsive md alignment/gap, directional edge paint, decorative Indicator and upstream extent migration remain separate unimplemented slices; no full New York parity is certified.
      zh-CN: Shadcn Header 组合 Base Header 与已接受方向观察，拥有 flex flex-col gap-0.5 p-4，已接受 top/bottom 时居中；left/right 或缺失 Content 时继承对齐。Footer 保留 mt-[auto] flex flex-col gap-2 p-4。family 局部呈现 State 可为 rule 镜像观察值，不改变 Base 权限。md 响应式对齐与间距、方向边缘绘制、装饰 Indicator 及上游 extent 迁移仍为独立未实现切片，不认定完整 New York 对齐。
  - id: C-DRAWER-STRUCTURE-0001-INTERIOR
    text:
      en: Shadcn Content uses flex flex-col bg-background text-foreground without the former grid gap-4 p-4. Content adds no box shadow. Uniform rounded-lg border border-border remains an explicit mismatch until generic directional corner/edge translation is supported; it is not upstream-equivalent paint. Header/Footer own their padding in migrated demos, and authored body content owns its spacing. Title uses text-foreground font-semibold and inherits font size and line height. The existing available-minus-root-text cap and horizontal extent are unchanged, not certified as upstream 80vh or w-3/4.
      zh-CN: Shadcn Content 使用 flex flex-col bg-background text-foreground，移除原 grid gap-4 p-4。Content 不再添加 box shadow；统一 rounded-lg border border-border 仍明确为尚未对齐项，等待通用分角圆角与单边绘制能力，不认定其绘制与上游等价。已迁移 demo 的 Header/Footer 自有 padding，正文自有间距。Title 使用 text-foreground font-semibold 并继承字号与行高。已有 available-minus-root-text cap 与横向 extent 不变，不认定为上游 80vh 或 w-3/4。

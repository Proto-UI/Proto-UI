    change: introduced
    summary: Define passive Base Header and Footer and the isolated New York Footer recipe without changing existing consumers.
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Add an observation-only accepted-side protocol, owner-safe Header composition and supported Content interior while retaining explicit responsive, edge-paint, indicator and extent gaps.
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Remove the unsupported Content shadow and retain explicit generic directional-edge and responsive capability gaps.

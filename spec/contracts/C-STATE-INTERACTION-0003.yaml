id: C-STATE-INTERACTION-0003
type: contract
title: Interaction state identity is shared per interaction subject and semantic type
status: deprecated
since: 0.1.0
deprecatedSince: 0.1.0
summary: Repeated deprecated `fromInteraction` declarations of the same interaction state type for the same interaction subject must return the same state reference while the compatibility API remains.
statement:
  zh-CN: >-
    对同一个交互主体来说，同一种 interaction state 永远对应同一份 state slot 引用。重复调用 deprecated `def.state.fromInteraction(name)` 不得创建新的同名状态。过去该契约曾要求调用 asHook 的原型作者也能直接通过 `fromInteraction(name)` 取得 asHook 内部同名声明对应状态；现在这只描述兼容层行为，不再作为新原型的推荐组合方式。新组合应消费 asHook result 中的 named state handles。


  en: >-
    For the same interaction subject, the same interaction state type always corresponds to the same state slot reference. Repeated calls to deprecated `def.state.fromInteraction(name)` must not create a new state with the same name. This contract previously required prototype authors using an asHook to obtain the same state corresponding to that asHook's same-name internal declaration by directly calling `fromInteraction(name)`; that now describes compatibility-layer behavior rather than the recommended composition model. New composition should consume named state handles from the asHook result.


criteria:
  - id: C-STATE-INTERACTION-0003-A
    text:
      zh-CN: 对同一交互主体，同名 `fromInteraction(name)` 调用必须返回同一份 state slot view 引用。
      en: For the same interaction subject, calls to `fromInteraction(name)` with the same name must return the same state slot view reference.
  - id: C-STATE-INTERACTION-0003-B
    text:
      zh-CN: 重复声明同名 interaction state 不得创建第二份独立 state slot、第二套 memory identity 或第二套互相不同步的 watcher/source。
      en: Re-declaring the same interaction state name must not create a second independent state slot, a second memory identity, or a second unsynchronized watcher/source set.
  - id: C-STATE-INTERACTION-0003-C
    text:
      zh-CN: asHook 内部声明的 interaction state 必须归属于调用方所在的同一交互主体，而不是成为 asHook 私有、只能通过 asHook 返回值取得的状态。
      en: Interaction state declared inside an asHook must belong to the same interaction subject as the caller, not become an asHook-private state that can only be obtained through the asHook return value.
  - id: C-STATE-INTERACTION-0003-D
    text:
      zh-CN: 兼容层保留期间，调用 asHook 的原型作者仍可以通过直接调用 deprecated `def.state.fromInteraction(name)` 获得 asHook 内部同名声明对应的同一份状态视图；新组合不应依赖该路径。
      en: While the compatibility layer remains, a prototype author using an asHook may still obtain the same state view corresponding to that asHook's same-name internal declaration by directly calling deprecated `def.state.fromInteraction(name)`; new composition should not depend on this path.
  - id: C-STATE-INTERACTION-0003-E
    text:
      zh-CN: 该同一引用规则适用于 interaction state 类型；accessibility semantic state 是否完全共享同一 subject 模型由其自身契约继续细化。
      en: This same-reference rule applies to interaction state types; whether accessibility semantic state fully shares the same subject model remains refined by its own contracts.

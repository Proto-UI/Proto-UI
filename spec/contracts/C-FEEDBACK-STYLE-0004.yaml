id: C-FEEDBACK-STYLE-0004
type: contract
title: Author style tokens exclude state selectors and admit finite static paint
  targets
status: draft
since: 0.1.0
summary: Prototype-author-side `feedback.style` tokens must describe style only
  and must not encode state, event, selector, or host-realization dependencies.
statement:
  en: Prototype-author feedback.style tokens describe style intent, not
    state/event/selectors. The only static target exceptions are
    selection:<style-token> and the finite placeholder color vocabulary of
    C-PLACEHOLDER-COLOR-0001. Neither reads state or owns editing, placeholder
    content or host structure.
  zh-CN: 原型作者 feedback.style token 只表达样式意图，不表达 state/event/selector。静态目标例外为
    selection:<style-token> 与 C-PLACEHOLDER-COLOR-0001 的有限 placeholder
    颜色词汇；两者均不读取状态或拥有编辑、placeholder 文本或宿主结构。
criteria:
  - id: C-FEEDBACK-STYLE-0004-A
    text:
      en: Author tokens exclude colons except one uncombined selection:<style-token>
        or an exact static placeholder color token admitted by
        C-PLACEHOLDER-COLOR-0001.
      zh-CN: 作者 token 禁止冒号，例外仅为不可组合的单一 selection:<style-token> 或
        C-PLACEHOLDER-COLOR-0001 明确准入的静态 placeholder 颜色 token。
  - id: C-FEEDBACK-STYLE-0004-B
    text:
      en: Outside those static paint targets, tokens cannot directly express hover,
        active, focus, disabled, data-attribute, ARIA or arbitrary
        selector/state/event dependencies.
      zh-CN: 除这些静态绘制目标外，作者 token 不得直接表达 hover、active、focus、disabled、data
        attribute、ARIA 或任意 selector/state/event 依赖。
  - id: C-FEEDBACK-STYLE-0004-C
    text:
      en: Stateful visual feedback composes independent state, context, props or
        metadata with Rule. Static target token syntax carries no state
        condition.
      zh-CN: 状态化视觉反馈通过独立 state、context、props 或 meta 与 Rule 组合表达；静态目标 token 语法不得携带状态条件。
  - id: C-FEEDBACK-STYLE-0004-D
    text:
      zh-CN: Adapter 或翻译层可以生成带状态、selector 或平台特定结构的最终样式产物；这些最终产物不受作者侧 style token
        语法约束，也不等同于原型内部作者侧 style token。
      en: Adapters or translation layers can generate final style artifacts with
        state, selectors, or platform-specific structure; those final artifacts
        are not constrained by author-side style-token syntax and are not
        equivalent to prototype-internal author-side style tokens.
  - id: C-FEEDBACK-STYLE-0004-E
    text:
      zh-CN: 因非法 token 语法导致的失败必须同步、确定性地抛错。
      en: Failures caused by illegal token syntax must throw synchronously and
        deterministically.
  - id: C-FEEDBACK-STYLE-0004-F
    text:
      en: "selection: accepts one valid unvarianted style token. placeholder: accepts
        only text-foreground, text-muted-foreground, text-primary or
        text-destructive. Arbitrary selectors, nested variants and all other
        colon forms fail synchronously."
      zh-CN: "selection: 后为一个合法的无 variant 样式 token。placeholder: 后仅允许
        text-foreground、text-muted-foreground、text-primary、text-destructive。任意
        selector、嵌套 variant 和其余冒号形式均同步拒绝。"
sources:
  - path: internal/contracts/feedback/style.use.setup-only.v0.md
    sections:
      - Token Syntax Rules (`tw.tokens`)
      - Explicitly Unsupported Handle Kinds
  - path: packages/core/src/spec/feedback/tokens.ts
    sections:
      - assertTwTokenV0
  - path: packages/cli/src/services/proto-style-css.ts
    sections:
      - renderTokenRule
      - applyVariant
  - path: packages/modules/rule-expose-state-web/src/create.ts
    sections:
      - buildVariant
      - useStyleUnsafe
dependsOn:
  contracts:
    - C-FEEDBACK-STYLE-0003
revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Explicitly admit finite static placeholder color paint alongside
      selection without general state-selector authoring.
  - version: 0.1.0
    change: introduced
    summary: Captured purity constraints for author-side style tokens and separated
      them from translation-layer style artifacts.
  - version: 0.1.0
    change: revised
    summary: Clarified the colon ban as a feedback-channel purity requirement and
      separated author tokens from translation-layer artifacts.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added one allowlisted static text-selection pseudo-element token prefix
      while retaining rejection of state selectors, arbitrary selectors, and
      nested variants.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Clarified the static visual target, its current Web realization, and
      the distinction between author syntax and declared host support.
tags:
  - feedback
  - style
  - tokens
  - purity

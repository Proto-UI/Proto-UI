revisions:
  - version: 0.1.0
    change: introduced
    summary: Defined Overlay logical state and single Presence-driver coordination over lifecycle ViewIntent.
  - version: 0.1.1
    change: updated
    summary: Added explicit dismiss opt-in and the Event-Boundary-Overlay sampling path.
  - version: 0.1.2
    change: updated
    summary: Required renderer-owned portal projection for virtual-DOM adapters.
  - version: 0.1.3
    change: refined
    summary: Required portal host-projection teardown to preserve retained Proto logical ownership across view epochs.
  - version: 0.1.4
    change: refined
    summary: Moved post-callback host-resource reconciliation from hook-selected microtasks into the runtime and Overlay module boundary.
  - version: 0.2.0-rc.0
    change: extended
    summary: Added delegated anchored positioning, internal Anatomy part resolution, and active-view positioning lifetime.
  - version: 0.2.0-rc.0
    change: refined
    summary: Required resolved Anatomy anchors to remain shared by Positioning and Boundary classification.
  - version: 0.3.0-alpha.0
    change: extended
    summary: Added scope-bound single-sample Escape coordination without changing portable author payloads.

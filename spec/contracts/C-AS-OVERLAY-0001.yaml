id: C-AS-OVERLAY-0001
type: contract
title: asOverlay coordinates logical open state with one Presence driver
status: draft
since: 0.1.0
summary: asOverlay is a privileged no-argument once hook whose logical open state delegates structural view presence to exactly one immediate or bound Presence driver.
statement:
  zh-CN: >-
    `asOverlay()` 必须是无参数的 privileged once hook，配置通过首次调用返回的稳定 handle 表达。Overlay 的 logical open、感知 presence、lifecycle ViewIntent 与当前 view epoch mount phase 必须保持为不同事实。未绑定外部 Presence 时，Overlay 使用即时 driver 将 logical open 投射到 `run.lifecycle.setPresent()`；绑定 Transition 等 Presence driver 后，即时 driver 必须完全停用，logical open 只驱动该 binding 的 enter/leave，binding 的 present signal 决定 Overlay 宿主资源 active 状态。一个 Proto instance 最多只能存在一个有效 binding，不得形成多个 ViewIntent writer。


  en: >-
    `asOverlay()` must be a privileged no-argument once hook, with configuration expressed through the stable handle returned by the first call. Overlay logical open, perceptual presence, lifecycle ViewIntent, and the current view-epoch mount phase must remain distinct facts. Without an external Presence binding, Overlay uses an immediate driver to project logical open through `run.lifecycle.setPresent()`; after binding a Presence driver such as Transition, the immediate driver must be completely disabled, logical open drives only the binding's enter/leave operations, and the binding's present signal governs active Overlay host resources. A Proto instance may have at most one effective binding and must not create multiple ViewIntent writers.


criteria:
  - id: C-AS-OVERLAY-0001-A
    text:
      zh-CN: '`asOverlay()` 必须无参数且采用 once 安装；重复调用返回严格相同的 handle，配置通过 handle.configure 表达。'
      en: '`asOverlay()` must be no-argument and once-installed; repeated calls return the exact same handle and configuration is expressed through handle.configure.'
  - id: C-AS-OVERLAY-0001-B
    text:
      zh-CN: 未绑定 Presence 时，logical open 必须由唯一的即时 driver 投射到 lifecycle ViewIntent。
      en: Without a Presence binding, logical open must be projected to lifecycle ViewIntent by one immediate driver.
  - id: C-AS-OVERLAY-0001-C
    text:
      zh-CN: 绑定 Presence 后，即时 driver 必须停用，open/close 只能调用 binding 的 enter/leave。
      en: After Presence binding, the immediate driver must be disabled and open/close may call only the binding's enter/leave operations.
  - id: C-AS-OVERLAY-0001-D
    text:
      zh-CN: 同一 binding 重复提交必须幂等，不同 binding 的竞争提交必须失败并给出冲突诊断。
      en: Repeating the same binding must be idempotent, while a competing different binding must fail with a conflict diagnostic.
  - id: C-AS-OVERLAY-0001-E
    text:
      zh-CN: logical close 不得在 binding 仍 present 的 leaving 阶段撤销 portal、layer 或 modal 资源。
      en: Logical close must not revoke portal, layer, or modal resources while a bound Presence driver remains present during leaving.
  - id: C-AS-OVERLAY-0001-F
    text:
      zh-CN: Boundary stack 跟随 logical open；portal/layer 的彻底撤销跟随 view epoch detach，modal active 跟随 binding present。
      en: Boundary stack follows logical open; final portal/layer revocation follows view-epoch detach, while modal activity follows binding presence.
  - id: C-AS-OVERLAY-0001-G
    text:
      zh-CN: Overlay 可以消费 Boundary 的 outside 分类，但不得把 Hit Participation 合并为 Overlay 自身策略。
      en: Overlay may consume Boundary outside classification but must not absorb Hit Participation into Overlay policy.
  - id: C-AS-OVERLAY-0001-H
    text:
      zh-CN: '`keepMounted()` 必须显式保留结构 view，并且不得与外部 Presence binding 同时成为有效策略。'
      en: '`keepMounted()` must explicitly retain the structural view and must not coexist with an external Presence binding as an effective policy.'
  - id: C-AS-OVERLAY-0001-I
    text:
      zh-CN: Dismiss 策略必须显式 opt-in；outside press 通过 Boundary observation/classification，Escape 直接消费 Event，Focus outside 在可靠的中立 sample 契约出现前不得伪造实现。
      en: Dismiss policies must be explicitly opted in; outside press uses Boundary observation/classification, Escape consumes Event directly, and focus outside must not be fabricated before a reliable neutral sample contract exists.
  - id: C-AS-OVERLAY-0001-J
    text:
      zh-CN: 对 React/Vue 等 renderer-owned host，portal 必须由宿主 renderer 的 portal/teleport primitive 投射；Overlay bridge 不得在 renderer 背后直接移动其拥有的 DOM node。
      en: For renderer-owned hosts such as React and Vue, portal projection must use the host renderer's portal/teleport primitive; an Overlay bridge must not move renderer-owned DOM nodes behind the renderer's back.
  - id: C-AS-OVERLAY-0001-K
    text:
      zh-CN: portal view epoch detach 只能撤销临时 host projection；被保留 Proto instance 的 logical parent、context/anatomy topology 与重新进入能力必须继续有效。
      en: Detaching a portal view epoch may revoke only the temporary host projection; the retained Proto instance's logical parent, context/anatomy topology, and ability to re-enter must remain valid.
  - id: C-AS-OVERLAY-0001-L
    text:
      zh-CN: Presence signal 在 runtime callback chain 内变为 active 时，Overlay host resource reconciliation 必须由 runtime/module 边界推迟到最外层 callback 完成后；author-facing hook 不得直接选择 `queueMicrotask` 或其它宿主线程调度机制。
      en: When a Presence signal becomes active within a runtime callback chain, Overlay host-resource reconciliation must be deferred by the runtime/module boundary until the outermost callback completes; the author-facing hook must not directly choose `queueMicrotask` or another host-thread scheduling mechanism.
  - id: C-AS-OVERLAY-0001-M
    text:
      zh-CN: anchored opt-in 必须由 Overlay 编排但委托 Positioning module/host-cap 执行几何；Overlay 只提交 anchor、content 与 placement policy，不得自行测量宿主节点。
      en: Anchored opt-in must be orchestrated by Overlay but delegate geometry to the Positioning module and host capability; Overlay submits only anchor, content, and placement policy and must not measure host nodes itself.
  - id: C-AS-OVERLAY-0001-N
    text:
      zh-CN: Overlay 可以把 author-facing AnatomyPartView 注册为 anchor，但 raw target 解析必须只发生在 Anatomy 与 Overlay 的 module-internal port 之间，不得向 prototype author 暴露宿主引用；解析出的当前 target 必须同时参与 anchored positioning 与 Boundary region 分类，使 anchor/trigger interaction 不会被误判为 outside。
      en: Overlay may register an author-facing AnatomyPartView as its anchor, but raw-target resolution must occur only between Anatomy and Overlay module-internal ports and must not expose a host reference to prototype authors; the current resolved target must participate in both anchored positioning and Boundary region classification so anchor or trigger interaction is not misclassified as outside.
  - id: C-AS-OVERLAY-0001-O
    text:
      zh-CN: positioning lease 必须跟随 bound Presence 的 active view，而非仅跟随 logical open；Portal、layer 与 positioning 的建立必须在最外层 runtime callback 完成后协调。
      en: The positioning lease must follow the bound Presence active view rather than logical open alone; Portal, layer, and positioning establishment must be reconciled after the outermost runtime callback completes.
  - id: C-AS-OVERLAY-0001-P
    text:
      en: 'Within one global input scope, one Escape sample selects at most the most recently activated eligible Overlay. Eligibility requires logical open, active presence, a mounted view and closeOnEscape opt-in. Opted-out or detached instances do not block eligible instances. Selection is fixed before callbacks: closing, disposing or synchronously reopening the selected instance cannot deliver that sample to another candidate. Logical activation order is independent of z-index; repeated open on an already eligible instance does not reorder it.'
      zh-CN: 同一 global input scope 中，一次 Escape sample 至多选择最近激活的合格 Overlay。资格要求 logical open、active presence、mounted view 与 closeOnEscape opt-in。未启用或 detached 实例不阻挡合格实例。调用 callback 前固定选择；被选实例关闭、销毁或同步重新打开，都不能将同一 sample 传给另一候选。逻辑激活顺序独立于 z-index；已合格实例重复 open 不改变顺序。

revisions:
  - version: 0.3.0-alpha.1
    change: refined
    summary: Define the explicitly selected logical-first activation-owned Entry fallback and its cancellation, readiness and retained-view boundaries without changing default entry or promoting lifecycle.
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Clarify the existing restore-none opt-out and ordinary previous-owner default without changing explicit consumer handback or promoting the draft lifecycle.

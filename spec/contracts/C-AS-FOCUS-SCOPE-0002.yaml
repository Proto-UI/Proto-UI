id: C-AS-FOCUS-SCOPE-0002
type: contract
title: Focus scope activation gates focus and applies configured restoration
status: draft
since: 0.1.0
lifecycleRationale: Draft scope policy; per-activation entry override and explicit activation-owned Entry fallback require focused execution, independent review and separate compiler admission and consumer conformance.
summary: A focus scope may exist inactive in the logical tree; activation captures previous focus, moves focus into the scope and gates outside focus requests. Deactivation restores the captured owner by default, while restore none opts out of automatic handback.
statement:
  zh-CN: >-
    `asFocusScope()` 声明的 scope 不得因为存在于逻辑树中就自动生效。scope activation 必须是显式动作：激活时记录当前 scope 外部的 previous focus owner，将 scope 标记为 active，并在非 manual entry 策略下把焦点移交给 scope 内第一个合格的 logical focusable child；取消激活时清除 active，默认将焦点归还给激活前捕获的 previous owner，显式 restore: none 则不自动移交焦点。scope active 期间，scope 外部的普通 focus request 必须被忽略并产生诊断警告；scope 自身及其 logical descendants 的 focus request 继续允许。显式 entryFallback: entry 仅在同一次激活未选择合格 logical target 时组合当前 owner 独立声明的 Entry role；该激活持有并可取消此 continuation，不取决于其边界是否仍为 active。


  en: >-
    A scope declared by `asFocusScope()` must not become effective merely because it exists in the logical tree. Scope activation must be an explicit action: activation captures the previous focus owner outside the scope, marks the scope active, and transfers focus to the first eligible logical focusable child inside the scope for non-manual entry policies. Deactivation clears active and restores the captured previous owner by default; explicit restore: none performs no automatic focus transfer. While the scope is active, ordinary focus requests from outside the scope must be ignored with a diagnostic warning; focus requests from the scope itself or its logical descendants remain allowed. An explicit entryFallback: entry opt-in composes the owner's separately declared Entry role only when that same activation selected no eligible logical target; the activation owns and can cancel that continuation independently of whether its boundary remains active.


criteria:
  - id: C-AS-FOCUS-SCOPE-0002-A
    text:
      zh-CN: scope 必须可以存在于 logical tree 中但保持 inactive；存在本身不得等同于生效。
      en: A scope must be able to exist in the logical tree while inactive; existence itself must not mean it is effective.
  - id: C-AS-FOCUS-SCOPE-0002-B
    text:
      zh-CN: '`activate()` 必须将 scope 标记为 active；非 manual entry 策略应优先请求 focus 到 scope 内第一个合格的 logical focusable child，`entry: manual` 则只激活边界并由调用者后续驱动入场。'
      en: '`activate()` must mark the scope active; non-manual entry policies should request focus for the first eligible logical focusable child inside the scope, while `entry: manual` only activates the boundary and leaves entry focus to the caller.'
  - id: C-AS-FOCUS-SCOPE-0002-C
    text:
      zh-CN: '`activate()` 必须记录激活前位于 scope 外部的 previous focus owner。'
      en: '`activate()` must capture the previous focus owner when it is outside the activating scope.'
  - id: C-AS-FOCUS-SCOPE-0002-D
    text:
      zh-CN: '`deactivate()` 必须清除 active。默认或 restore: previous 时，在捕获的 previous owner 仍存在时请求将焦点归还给该 owner；显式 restore: none 不得自动移交焦点，包括不得覆盖 scope 外部已聚焦的目标。消费者显式发起的 handback 与 scope 的自动恢复策略相互独立。'
      en: '`deactivate()` must clear active. By default or with restore: previous, it requests focus for the captured previous owner when that owner still exists. Explicit restore: none must perform no automatic focus transfer, including no replacement of an already focused outside destination. Explicit consumer handback remains independent of the automatic scope restore policy.'
  - id: C-AS-FOCUS-SCOPE-0002-E
    text:
      zh-CN: active scope 外部的普通 focus request 必须被忽略，并产生可诊断 warning。
      en: Ordinary focus requests from outside the active scope must be ignored and produce a diagnostic warning.
  - id: C-AS-FOCUS-SCOPE-0002-F
    text:
      zh-CN: active scope 自身及其 logical descendants 的 focus request 必须继续允许。
      en: Focus requests from the active scope itself and its logical descendants must remain allowed.
  - id: C-AS-FOCUS-SCOPE-0002-G
    text:
      zh-CN: '`activate(options)` 与 `deactivate(options)` 必须把 focus request reason 传递给 scope entry focus 与 previous owner restore；键盘触发的 open/close 不得在 scope 边界处丢失 keyboard modality。'
      en: '`activate(options)` and `deactivate(options)` must forward focus request reason to scope entry focus and previous-owner restore; keyboard-triggered open/close must not lose keyboard modality at the scope boundary.'
  - id: C-AS-FOCUS-SCOPE-0002-H
    text:
      zh-CN: active top scope 启用 trap/loop 时，Tab 导航必须由 scope 统一解释为 scope 内 next/prev focus request，并阻止宿主默认遍历逃离 active scope。
      en: When the active top scope enables trap/loop, Tab navigation must be interpreted by the scope as in-scope next/previous focus requests and must prevent host default traversal from escaping the active scope.
  - id: C-AS-FOCUS-SCOPE-0002-I
    text:
      zh-CN: active scope 内部因指针点击空白区域或宿主差异暂时没有 focused child 时，后续 Tab 导航必须能从 scope 记忆的最近 scoped focus 或首尾 eligible child 恢复，不能让焦点遍历逃离 scope。
      en: If an active scope temporarily has no focused child due to pointer interaction on blank space or host variance, subsequent Tab navigation must recover from the scope's remembered scoped focus or the first/last eligible child and must not let traversal escape the scope.
  - id: C-AS-FOCUS-SCOPE-0002-J
    since: 0.3.0-alpha.0
    text:
      zh-CN: 支持顺序焦点采样的宿主可以提供当前 scope 内的有序可 Tab targets 与实际 focused target。Focus 必须仍拥有 top active scope、方向、loop 与默认遍历阻止策略；采样必须尊重已投射的导航参与、隐藏与 entry fallback，不得把程序化可聚焦等同于可 Tab。采样仅用于当前顺序遍历，不得伪造 logical focus facts；无该能力时保留 logical member 路径。
      en: A host supporting sequential-focus sampling may supply ordered tabbable targets inside the current scope and the actual focused target. Focus retains ownership of the top active scope, direction, loop and default-traversal prevention. Sampling must respect projected navigation participation, hiding and entry fallback, and must not equate programmatic focusability with tabbability. Samples serve current sequential traversal only and must not fabricate logical focus facts; hosts without the capability retain the logical-member path.
  - id: C-AS-FOCUS-SCOPE-0002-K
    since: 0.3.0-alpha.1
    text:
      zh-CN: >-
        activate(options) 可通过 entry: manual 仅抑制本次激活的自动入场；省略 entry 或 entry: configured 必须遵循原 setup 配置，而不能强制覆盖已配置的 manual。在非类型化 Runtime 边界仅字面量 manual 抑制入场，其他值遵循 configured 分支；这不扩展静态或 Compiler 接受的枚举。该选项不修改持久配置；后续激活独立选择。manual 仍激活相同的 scope 边界并保留 trap、loop、previous owner 捕获与配置的停用恢复策略，允许作者随后显式请求内部焦点。该选项不得作为新的 Host Focus 请求字段下发，不提供目标选择、ready 保证或取消既有 pending 请求的能力。调用 activate 仍是显式激活；此选项本身不提供运行中 props watcher 或自动重新激活。


      en: >-
        activate(options) may suppress only this activation's automatic entry using entry: manual. Omitted entry or entry: configured follows the original setup policy and cannot force automatic entry over configured manual. At the untyped Runtime boundary only the literal manual suppresses entry; other values follow the configured branch, without extending the statically or compiler-admitted enum. This option does not mutate persistent configuration; later activations choose independently. Manual still activates the same scope boundary with trapping, looping, previous-owner capture and configured deactivation restoration, and allows subsequent explicit inside-focus requests. The option must not be forwarded as a new Host Focus request field. It provides neither target selection, readiness nor cancellation of existing pending requests. Calling activate remains an explicit activation; the option does not itself install a runtime props watcher or automatically reactivate a scope.


  - id: C-AS-FOCUS-SCOPE-0002-L
    text:
      zh-CN: >-
        setup 配置 entryFallback: entry 可显式组合当前 owner 独立声明且启用的 Entry role；默认 none 不改变现有入场。一次非 manual 激活必须先按现有 policy 选择 logical target；已选择的 child 即使等待 host target 或 acquisition 被拒绝，也不得触发 region fallback。仅当未选择任何合格 logical target 且该激活仍为 current 时，才按现有 Entry policy 请求 descendant-first 或允许的 self fallback，并保留同次激活快照中的 reason、preventScroll。configured manual 与本次 entry: manual 都抑制两类自动入场。fallback 不声明 Focusable、roving member 或 target facts，不提供 public target、selection 或 readiness receipt；isActive 仅是边界事实，不能用作选择结果。

      en: >-
        The setup configuration entryFallback: entry explicitly composes this owner's separately declared and enabled Entry role; the default none preserves existing entry. A non-manual activation first selects a logical target under the existing policy. A selected child suppresses region fallback even while awaiting its host target or after rejected acquisition. Only when no eligible logical target was selected and that activation remains current may the existing Entry policy request descendant-first or permitted self fallback, preserving that activation's snapshotted reason and preventScroll. Configured manual and per-activation entry: manual suppress both forms of automatic entry. Fallback declares no Focusable, roving member or target facts and exposes no public target, selection or readiness receipt; isActive is only a boundary fact, not a selection result.

    dependsOn:
      contracts:
        - id: C-AS-FOCUS-ENTRY-0001
          anchors: [C-AS-FOCUS-ENTRY-0001-D, C-AS-FOCUS-ENTRY-0001-F, C-AS-FOCUS-ENTRY-0001-G]
  - id: C-AS-FOCUS-SCOPE-0002-M
    text:
      zh-CN: >-
        opt-in fallback 的 continuation 属于同一次激活，可等待尚未出现的 region 或被拒绝的 acquisition；emptyPolicy 仍只决定边界策略，不能因此将 inactive 等同于取消。显式 deactivate 必须在 inactive 或缺少 view/Root 的提前返回前结束此激活，并在发布 inactive 给 observer 前取消其仍持有的请求。readiness 只能在当前 view 重新解析仍属该激活的 Entry，不能重新选择 logical child、重复已接纳的 acquisition 或复活已取消的 intent。重复激活、Entry disable、显式 blur、terminal disposal 与较新的独立 focus intent 必须阻止旧 continuation replay；retained view detach 可保留当前 logical intent，但不能复用旧 physical target。此取消必须按 identity 判断，不得清除较新的独立 Entry 或 target request，包括 reentrant resolver、host callback 或 state observer 中产生的请求。普通 Scope 边界 cleanup、restore 策略和消费者显式 handback 仍独立适用；停用已经 inactive 的边界不产生新的自动恢复。

      en: >-
        The opt-in fallback continuation belongs to the same activation and may await an absent region or rejected acquisition. Empty policy still controls only the boundary, so inactive does not imply cancellation. Explicit deactivate ends this activation before any inactive or absent-view/Root early return and cancels its still-owned request before publishing inactive to observers. Readiness may only re-resolve that activation's current Entry against the current view; it must not repeat logical selection, repeat accepted acquisition or resurrect canceled intent. Repeated activation, Entry disable, explicit blur, terminal disposal and newer independent focus intent prevent old continuation replay. Retained view detachment may preserve current logical intent, but never an old physical target. Cancellation is identity-scoped and must not clear a newer independent Entry or target request, including requests from reentrant resolvers, host callbacks or state observers. Ordinary Scope boundary cleanup, configured restoration and explicit consumer handback remain independently applicable; deactivating an already inactive boundary creates no new automatic restoration.



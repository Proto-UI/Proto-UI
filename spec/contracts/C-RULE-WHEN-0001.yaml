id: C-RULE-WHEN-0001
type: contract
title: Rule when expressions are pure conditions
status: draft
since: 0.1.0
summary: Rule `when` expressions evaluate observable inputs into booleans without side effects, event matching, deep comparison, or custom comparators.
statement:
  zh-CN: >-
    Rule 的 `when` 是纯条件表达式。它读取已声明的可观察输入并产出 boolean 判断结果；求值期间不得写 state、写 feedback、更新 context、注册 event、触达 host 或执行其他副作用。v0 核心表达式包含 `true`、`false`、`eq`、`gte`、`not`、`all` 与 `any`；`eq` 使用严格相等，不做深比较或自定义比较。


  en: >-
    Rule `when` is a pure condition expression. It reads declared observable inputs and produces a boolean result; evaluation must not write state, write feedback, update context, register events, touch the host, or execute other side effects. The v0 core expression set includes `true`, `false`, `eq`, `gte`, `not`, `all`, and `any`; `eq` uses strict equality without deep comparison or custom comparators.


criteria:
  - id: C-RULE-WHEN-0001-A
    text:
      zh-CN: '`when` 求值必须是无副作用的纯判断。'
      en: '`when` evaluation must be a side-effect-free pure predicate.'
  - id: C-RULE-WHEN-0001-B
    text:
      zh-CN: v0 核心表达式必须覆盖 `true`、`false`、`eq`、`gte`、`not`、`all` 与 `any`。
      en: The v0 core expression set must cover `true`, `false`, `eq`, `gte`, `not`, `all`, and `any`.
  - id: C-RULE-WHEN-0001-C
    text:
      zh-CN: '`eq` 必须使用严格相等语义，不得隐式类型转换、深比较或自定义 comparator。'
      en: '`eq` must use strict equality semantics without implicit coercion, deep comparison, or custom comparators.'
  - id: C-RULE-WHEN-0001-D
    text:
      zh-CN: '`all([])` 必须为 true，`any([])` 必须为 false。'
      en: '`all([])` must evaluate to true, and `any([])` must evaluate to false.'
  - id: C-RULE-WHEN-0001-E
    text:
      zh-CN: Rule 不匹配瞬时 event occurrence；事件驱动的 Rule 必须先把事件维度表达为可观察状态。
      en: Rule must not match instantaneous event occurrences; event-driven Rules must first express the event dimension as observable state.
  - id: C-RULE-WHEN-0001-FINITE-GTE
    text:
      en: gte requires a finite numeric literal RHS and a finite numeric current LHS. It performs no coercion; unknown, null, strings, booleans, NaN and infinities do not match. Invalid authored RHS throws synchronously. This is not a custom comparator or a new input source. Compiler profiles must explicitly support it or reject it, never reinterpret or drop it.
      zh-CN: gte 要求有限数字字面量 RHS 和有限数字当前 LHS，不做类型转换；unknown、null、字符串、boolean、NaN 和无穷不匹配。非法作者 RHS 同步抛错。它不是自定义比较器或新输入源；Compiler profile 必须明确支持或拒绝，不得改释或丢弃。

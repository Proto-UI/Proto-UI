id: C-FOCUS-0001
type: contract
title: Focus is a host-mediated logical interaction target domain
status: draft
since: 0.1.0
summary: Focus is a system domain for coordinating logical interaction targets, requests, facts, topology, and policy; it is not owned by state, event, expose, adapter, or any single asHook alone.
statement:
  zh-CN: >-
    Focus 是宿主协同的逻辑交互目标管理域，用于决定哪个逻辑节点、边界或同级集合可以接收主导交互意图，并协调焦点请求、焦点事实、焦点资格、焦点拓扑与焦点策略。Focus 不是 State、Event、Expose、Adapter 或单个特权 asHook 的子领域；这些系统可以参与或投影 focus 语义，但不能单独定义 focus。


  en: >-
    Focus is a host-mediated logical interaction target management domain. It decides which logical node, boundary, or sibling set may receive primary interaction intent, and coordinates focus requests, focus facts, focus eligibility, focus topology, and focus policy. Focus is not a subdomain owned by State, Event, Expose, Adapter, or a single privileged asHook; those systems may participate in or project focus semantics, but none of them defines focus alone.


criteria:
  - id: C-FOCUS-0001-A
    text:
      zh-CN: Focus 契约必须被建模为系统域，而不是 `state`、`event`、`expose`、adapter capability 或单个 asHook 的普通子功能。
      en: Focus contracts must model focus as a system domain, not as a plain subfeature of `state`, `event`, `expose`, adapter capability, or a single asHook.
  - id: C-FOCUS-0001-B
    text:
      zh-CN: Focus domain 至少必须区分 focus facts、focus requests、focus eligibility、focus topology 与 focus policy。
      en: The focus domain must at least distinguish focus facts, focus requests, focus eligibility, focus topology, and focus policy.
  - id: C-FOCUS-0001-C
    text:
      zh-CN: Focus facts 可以以 state-shaped observed handle 形式被 rule、expose 或诊断消费，但事实所有权仍属于 focus domain。
      en: Focus facts may be consumed by rule, expose, or diagnostics as state-shaped observed handles, but ownership remains in the focus domain.
  - id: C-FOCUS-0001-D
    text:
      zh-CN: Focus requests 是对宿主/runtime 的请求，不得被解释为原型作者直接写入 focus facts。
      en: Focus requests are requests to the host/runtime and must not be treated as prototype-author writes to focus facts.
  - id: C-FOCUS-0001-E
    text:
      zh-CN: 同一 focus domain 内，长期 `focused` 与 `focusVisible` 事实必须保持唯一主 owner；当新的 focusable 通过 focus request 或 host focus 上报成为 owner 时，runtime 必须清理其他 focusable 上残留的 `focused`、`focusVisible` 与 `active` 事实。
      en: Within one focus domain, long-lived `focused` and `focusVisible` facts must keep a single primary owner; when a new focusable becomes the owner through a focus request or host focus report, runtime must clear stale `focused`, `focusVisible`, and `active` facts on other focusables.
  - id: C-FOCUS-0001-F
    text:
      zh-CN: 焦点事实唯一性不得完全依赖宿主一定会投递 blur；adapter、commit gate 或宿主差异导致 blur 缺失时，focus center 仍必须维持内部事实一致性。
      en: Focus fact uniqueness must not rely entirely on the host always delivering blur; if adapter, commit gate, or host variance causes blur to be missed, the focus center must still preserve internal fact consistency.
  - id: C-FOCUS-0001-G
    text:
      zh-CN: Focus domain 必须区分 focus target identity 与 focus entry region；entry region 可以将真实 focus target 委派给后代或 fallback 到自身，但不得因此伪造自身 target-level focus facts。
      en: The focus domain must distinguish focus target identity from focus entry regions; an entry region may delegate the real focus target to a descendant or fall back to itself, but must not fake its own target-level focus facts because of that delegation.
    dependsOn:
      decisions:
        - D-FOCUS-ENTRY-DELEGATION-0001
  - id: C-FOCUS-0001-H
    text:
      zh-CN: 同一实例的 target 与 entry role 必须独立控制 pending request 的禁用取消；显式 blur 必须取消任一 role 的 pending request。取消必须先于可同步通知观察者的 host blur；观察者产生的更新 request 或取消决定必须保留，不得在 host blur 返回后恢复旧 pending request。
      en: Target and entry roles on the same instance must independently control disable cancellation of pending requests; explicit blur must cancel a pending request of either role. Cancellation must precede host blur that can synchronously notify observers; newer requests or cancellation decisions from those observers must survive, and an older pending request must not be restored after host blur returns.
    dependsOn:
      contracts:
        - C-AS-FOCUSABLE-0001
        - C-AS-FOCUS-ENTRY-0001

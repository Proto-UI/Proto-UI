id: C-CONTEXT-0007
type: contract
title: Context read surfaces follow subscription intent
status: draft
since: 0.1.0
summary: Runtime and render-time readonly context reads must follow prior subscription intent; required reads throw on missing context, while optional reads return null.
statement:
  zh-CN: >-
    Context read surface 必须遵守 setup 期声明的 subscription intent。`read(key)` 读取 required context，缺少 prior `subscribe` 或当前 context disconnected 时必须失败。`tryRead(key)` 读取 optional context，缺少 prior `trySubscribe` 时必须失败，但当前 context 不存在或 disconnected 时返回 `null`。


  en: >-
    Context read surfaces must follow the subscription intent declared during setup. `read(key)` reads a required context and must fail without prior `subscribe` or when the current context is disconnected. `tryRead(key)` reads an optional context and must fail without prior `trySubscribe`, but returns `null` when the current context is absent or disconnected.


criteria:
  - id: C-CONTEXT-0007-A
    text:
      zh-CN: '`run.context.read(key)` 必须要求 prior required subscription。'
      en: '`run.context.read(key)` must require prior required subscription.'
  - id: C-CONTEXT-0007-B
    text:
      zh-CN: '`run.context.tryRead(key)` 必须要求 prior optional subscription。'
      en: '`run.context.tryRead(key)` must require prior optional subscription.'
  - id: C-CONTEXT-0007-C
    text:
      zh-CN: required read 在 provider 缺失或 disconnected 时必须失败。
      en: Required reads must fail when the provider is missing or disconnected.
  - id: C-CONTEXT-0007-D
    text:
      zh-CN: optional tryRead 在 provider 缺失或 disconnected 时必须返回 `null`。
      en: Optional tryRead must return `null` when the provider is missing or disconnected.
  - id: C-CONTEXT-0007-E
    text:
      zh-CN: render-time `renderer.read.context` 只能暴露 `read` 与 `tryRead`，不得暴露 update surface。
      en: Render-time `renderer.read.context` may expose only `read` and `tryRead`, and must not expose update surfaces.
  - id: C-CONTEXT-0007-F
    text:
      en: run.context.tryReadAncestor requires prior trySubscribeAncestor for that key, returns the nearest current strict-ancestor value or null on absence, and rejects setup use. This extension does not expand the renderer read facade or add an ancestor write API.
      zh-CN: run.context.tryReadAncestor 要求同 key 的 prior trySubscribeAncestor，返回当前最近严格祖先值或缺失时 null，并拒绝 setup 调用。该扩展不扩大 renderer read facade，也不新增 ancestor 写 API。

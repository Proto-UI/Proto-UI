    change: refined
    summary: Clarified nearest-valid-domain isolation during parent-first terminal disposal without changing retained view lifetime or author APIs.
  - version: 0.1.0
    change: introduced
    summary: Captured root-scoped anatomy domains and strict default query behavior.

id: C-ANATOMY-0005
type: contract
title: Anatomy domains are scoped by root claims
status: draft
since: 0.1.0
summary: A root claim establishes the runtime domain in which same-family parts can observe each other.
statement:
  zh-CN: >-
    Anatomy domain 由同一 family 的 root claim 划定。Runtime 查询必须解析到当前 prototype instance 所属的最近合法 root domain，并且只能观察该 domain 内实际存在的同 family part；同一 family 可以在不同结构位置形成多个互不混淆的 domain。


  en: >-
    An anatomy domain is scoped by a same-family root claim. Runtime queries must resolve to the nearest valid root domain that contains the current prototype instance, and may observe only actually existing same-family parts inside that domain; the same family may form multiple independent domains at different structural positions.


criteria:
  - id: C-ANATOMY-0005-A
    text:
      zh-CN: Root claim 必须作为 anatomy domain 的作用域锚点。
      en: A root claim must act as the scope anchor for an anatomy domain.
  - id: C-ANATOMY-0005-B
    text:
      zh-CN: Runtime 查询必须限制在当前 instance 所属的最近合法 root domain 内。
      en: Runtime queries must be limited to the nearest valid root domain containing the current instance.
  - id: C-ANATOMY-0005-C
    text:
      zh-CN: 同一 family 的多个 root 可以形成多个独立 domain，查询不得跨 domain 混合 part。
      en: Multiple roots of the same family may form multiple independent domains, and queries must not mix parts across domains.
  - id: C-ANATOMY-0005-D
    text:
      zh-CN: 当前 instance 若无法解析到合法 root domain，默认 strict runtime 查询必须失败而不是静默返回空结构。
      en: If the current instance cannot resolve a valid root domain, default strict runtime queries must fail instead of silently returning empty structure.
  - id: C-ANATOMY-0005-E
    text:
      zh-CN: Terminal disposal 撤销 owner claim 后，其尚未销毁的后代不得仅因祖先 teardown 顺序穿过退休边界加入外层同 family domain；实际逻辑 reparent 离开该边界仍可重新解析 domain。repeatable view detach 不建立退休边界。
      en: After terminal owner claims are revoked, surviving descendants must not cross the retiring boundary into an outer same-family domain merely because ancestors tear down first. Actual logical reparenting out of that boundary may resolve a new domain; repeatable view detach does not establish a retiring boundary.

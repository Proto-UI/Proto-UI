id: C-CONTROL-LABEL-0001
type: contract
title: Explicit control-label association separates accessible naming from activation
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: The bounded independent Label and five-target direction is accepted for implementation; complete paired Web input, lifecycle, projection and assistive-technology evidence is still required before stable admission.
summary: One opaque reference authorizes one independent Label and one participating control without adding a Label part to the control's anatomy or introducing a general action bus.
statement:
  en: An App Maker explicitly shares a ControlLabelRef between an independent Label and an opt-in target. The reference owns only this association; it carries no host identity, checked value, callback or general component lookup. Naming and activation are independently declared effects. The target retains its existing activation, disabled, controlled value, focus and outward-signal ownership. The implemented target set is Checkbox, Switch, Radio Group Item, Input and Textarea; Text Control activation is focus-only.
  zh-CN: App Maker 显式将同一 ControlLabelRef 交给独立 Label 与主动参与的目标。引用仅授权该关联，不携带宿主 identity、checked value、callback 或通用组件查询。命名与 activation 分别声明；目标保留已有 activation、disabled、controlled value、focus 与 outward signal 所有权。当前目标包括 Checkbox、Switch、Radio Group Item、Input 与 Textarea；Text Control 的关联 activation 仅请求 focus。
criteria:
  - id: C-CONTROL-LABEL-0001-IDENTITY
    text:
      en: Only the public factory creates an admitted opaque reference. A plain lookalike, cloned object, string, DOM node or serialized attribute must be rejected with an explicit diagnostic. Creating or sharing a reference does not itself create a binding or discover another component.
  - id: C-CONTROL-LABEL-0001-DOMAIN
    text:
      en: The shared reference defines the sole logical pair-authorization domain, so explicitly paired siblings need not share an Anatomy family. Both current views must additionally belong to the same host accessibility tree scope. No relation is inferred by position, DOM order, nearest control, name or framework root. Existing kind:part relationships remain constrained to their original same-Anatomy domain; this contract uses the separate direct semantic-object-reference path and does not widen part lookup.
  - id: C-CONTROL-LABEL-0001-UNIQUENESS
    text:
      en: The first slice accepts exactly one live Label and one live target per reference. Missing, duplicate, detached or foreign-scope participants withdraw association effects and diagnose the condition; they never choose a winner by registration or DOM order. A candidate replacement must not revoke a distinct current owner through a stale cleanup callback.
  - id: C-CONTROL-LABEL-0001-NAME
    text:
      en: Naming, when requested, relates the target to the actual rendered Label through A11y labelledBy semantic references. It must not copy label text into aria-label or hidden duplicate content. An explicit existing text name or labelledBy source conflicts with the first-slice naming request and remains unchanged; the conflict is diagnosed independently of an explicitly requested activation-only effect. A content-derived default name can yield to the explicit relation. Live Label content changes are read through the same semantic subject.
  - id: C-CONTROL-LABEL-0001-OWNED-NAME
    text:
      en: Derived naming owns a bounded relation contribution and releases only that contribution. Consumer-authored names or IDREF tokens, later replacements and newer view leases survive cleanup. Terminal disposal retires callbacks and view relations before releasing the logical binding; repeatable detach retains authored association intent for a valid remount.
  - id: C-CONTROL-LABEL-0001-ACTIVATION
    text:
      en: Activation is optional and separate from naming. An eligible label action requests the target's existing internal activation operation exactly once in the target's runtime callback scope. The same operation serves direct press input, retains disabled and controlled/uncontrolled rules, and emits only the ordinary outward signal. Label must not mutate the target's value, invoke an outward event as input, dispatch a synthetic DOM click or gain a separate toggle state.
  - id: C-CONTROL-LABEL-0001-INPUT
    text:
      en: The host rejects secondary or modified pointer actions, pointercancel or dragged gestures, and input originating in nested interactive descendants. A trusted host-generated non-pointer click can request activation without inventing a Label keyboard binding; synthetic click-only input is not sufficient. The Web host preserves the originating activation turn and checks click cancellation synchronously at its listener. A later listener cannot roll back an already committed operation; preventDefault on pointerup alone is not click cancellation. This boundary is narrower than a native HTML label default action and must remain explicit. Label is neither a new Tab stop nor a button and adds no independent keyboard activation path. A native host may attach an explicitly enabled action to the same visible text semantic node without adding a portable interactive role or hidden text duplicate; naming-only labels do not advertise that action. The target's ordinary keyboard and direct-pointer behavior remains unchanged. No blanket pointerdown cancellation or text-selection clearing is permitted.
  - id: C-CONTROL-LABEL-0001-FOCUS
    text:
      en: When an accepted actionable label requests focus, the target uses its existing focus owner under the same disabled and lifecycle checks. Reentrant focus or outward callbacks that disable, detach or replace either participant invalidate subsequent work from the old request. Naming remains available for a disabled target while activation and focus are suppressed.
  - id: C-CONTROL-LABEL-0001-CONTENT
    text:
      en: Passive naming-only labels remain selectable content. A short actionable label may explicitly suppress accidental selection under the content-selection affordance contract. Long descriptions remain independent selectable content rather than an enlarged action target or duplicated accessible name. Checkbox/Switch anatomy does not acquire a Label part.
  - id: C-CONTROL-LABEL-0001-LOWERING
    text:
      en: Direct host integrations pass the opaque reference through the dedicated typed InstanceAssociations input, whose only admitted key in this slice is controlLabel. The Runtime delivers it through ControlLabelPort only to a Prototype that explicitly declared Label or target participation. It never enters raw or resolved Props; the active JSON Props contracts remain unchanged. This association channel cannot carry arbitrary data, callbacks, values, host objects or other reference families. Unknown keys and undeclared recipients are errors. Data-only demo input must declare an association key in a bounded render instance and materialize references through the public factory, preserving stable identity until that instance is disposed. Reusing the same key in another render instance never associates the two. Unsupported serialization or compiler lowering must report an explicit diagnostic rather than silently output an empty object or install an application listener that simulates protocol support.
  - id: C-CONTROL-LABEL-0001-WEB
    text:
      en: The first Web projection requires connected participants in the same Document and getRootNode tree scope. It uses the existing A11y semantic-reference and IDREF ownership projection for naming, plus a narrowly scoped input-intent host bridge for activation. Scope observers are shared, include shadow-tree containment changes, and retire only their own subscriptions. Cross-document and cross-shadow-root associations are unsupported and diagnosed even when an App Maker shares a reference. View identity and callback epoch are rechecked before every target effect.
  - id: C-CONTROL-LABEL-0001-BOUNDS
    text:
      en: This slice admits no Form, submission, validation, error summary, multiple-label ordering, arbitrary action dispatch, native selection model or platform-wide support claim. Missing host capability is an explicit unsupported state, not success. Passing instance-association input or rendering label text alone does not certify a working association.

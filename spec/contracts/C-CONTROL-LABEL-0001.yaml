openQuestions:
  - id: C-CONTROL-LABEL-0001-Q-EVIDENCE
    question:
      en: Does the completed slice satisfy paired real input, naming, reentrancy, duplicate binding and remount evidence across all four Web adapters?
    blocks: [activation:C-CONTROL-LABEL-0001]
revisions:
  - version: 0.3.0-alpha.2
    change: clarified
    summary: Defined a separate draft shared-SDK Rust nominal association and exact native pair lease for the private GPUI source profile, without extending the ECMAScript interop ABI or promoting lifecycle status.
  - version: 0.3.0-alpha.2
    change: clarified
    summary: Defined same-realm nominal reference and pair interoperability across native output graphs and Runtime Adapters, with target-owned semantic source translation and bounded generated-ID lifetime; retained draft admission and existing Label behavior.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Extend explicit target participation to Button, Toggle and Toggle Group Item while retaining the same naming, activation and lifecycle owners.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Declared the explicit bounded label text-selection policy vocabulary (ControlLabelSelectionPolicy) shared with the content-selection affordance, preserving the activation-derived default and selectable passive content.
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Recorded the bounded independent Label pairing direction, explicit domain, ownership and lowering requirements without stable admission.
  - version: 0.3.0-alpha.2
    change: clarified
    summary: Named the Compiler admission boundary for the declared association target set; Toggle Group Item stays a declared target and the Toggle Group Root and Item definitions keep their explicit unsupported diagnostic.
  - version: 0.3.0-alpha.2
    change: revised
    summary: Added focus-only explicit Label participation to standalone Select Trigger and Number Field Input, preserving author names, numeric and popup owners and the separate Field anatomy pairing; compiler admission remains definition- and backend-specific.
  - version: 0.4.0
    change: revised
    summary: Retire deleted compiler evidence and retain commit-bound historical sources without changing independent behavior.
tags: [label, accessibility, association, activation, lifecycle]

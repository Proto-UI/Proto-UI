id: C-CONTROL-LABEL-0001
type: contract
title: Explicit control-label association separates accessible naming from activation
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: The bounded independent Label and declared target direction is accepted for implementation; complete paired Web input, lifecycle, projection and assistive-technology evidence is still required before stable admission.
summary: One opaque reference authorizes one independent Label and one participating control without adding a Label part to the control's anatomy or introducing a general action bus.
statement:
  en: An App Maker explicitly shares a ControlLabelRef between an independent Label and an opt-in target. The reference owns only this association; it carries no host identity, checked value, callback or general component lookup. Naming and activation are independently declared effects. The target retains its existing activation, disabled, controlled value, focus and outward-signal ownership. The association target set is Checkbox, Switch, Radio Group Item, Input, Textarea, Button, Toggle, Toggle Group Item, standalone Select Trigger and Number Field Input. Each target declares its own participation and keeps its existing operation owners; text editors and Select Trigger use focus-only activation. Compiler admission is checked for each actual target definition and backend through the same ControlLabel protocol; unsupported definitions keep an explicit diagnostic and passing association props alone never establishes support.
  zh-CN: App Maker 显式将同一 ControlLabelRef 交给独立 Label 与主动参与的目标。引用仅授权该关联，不携带宿主 identity、checked value、callback 或通用组件查询。命名与 activation 分别声明；目标保留已有 activation、disabled、controlled value、focus 与 outward signal 所有权。关联目标集合为 Checkbox、Switch、Radio Group Item、Input、Textarea、Button、Toggle、Toggle Group Item、独立 Select Trigger 与 Number Field Input。各目标自行声明参与，文本编辑器与 Select Trigger 的关联 activation 只请求 focus。Compiler 按真实目标定义和后端核对同一 ControlLabel 协议的准入；不支持的定义保留明确诊断，单独传入关联属性不代表已支持。
criteria:
  - id: C-CONTROL-LABEL-0001-IDENTITY
    text:
      en: Only the public factory creates an admitted opaque reference. A plain lookalike, cloned object, string, DOM node or serialized attribute must be rejected with an explicit diagnostic. Creating or sharing a reference does not itself create a binding or discover another component.
  - id: C-CONTROL-LABEL-0001-INTEROP
    text:
      en: Compatible implementations in one ECMAScript realm, including independently emitted native graphs and Runtime Adapters, admit the same exact public-factory reference and participate in one pair-ownership domain. Nominal admission and duplicate arbitration must not depend on which bundle loaded the factory or participant. The v1 realm ABI uses immutable, non-replaceable global data properties at Symbol.for('@proto.ui/control-label/ref/v1') and Symbol.for('@proto.ui/control-label/pairs/v1'). The former exposes version 1, create and is operations with private nominal membership; the latter exposes version 1 and bind with private pair state. No mutable registry, arbitrary-object admission operation or serializable structural brand is exposed. Incompatible occupied ABI slots are explicit errors. This mechanism is an implementation interoperability boundary, not a security boundary or cross-realm serialization guarantee; it does not recover references created by an incompatible older private authority or widen Anatomy domain matching.
      zh-CN: 同一 ECMAScript realm 中的兼容实现，包括独立生成的原生组件图与 Runtime Adapter，必须接纳同一个公共工厂引用并共享唯一配对所有权域。nominal admission 与重复参与者仲裁不依赖工厂或参与者来自哪个 bundle。v1 realm ABI 在两个固定 Symbol.for 键上提供不可替换的只读服务，私有集合与配对状态不得暴露为可变 registry，也不提供任意对象注册或可序列化结构品牌。已占用且不兼容的 ABI 必须显式报错；该机制不构成安全边界，不承诺跨 realm 序列化，也不恢复旧版私有 authority 创建的引用或扩大 Anatomy 匹配域。
  - id: C-CONTROL-LABEL-0001-GPUI-IDENTITY
    text:
      en: The draft gpui-source-v1 explicit-association slice uses a nominal Rust ControlLabelRef created by one content-compatible shared native SDK. Independently emitted crates share that SDK type and clones of the same reference through typed InstanceAssociations constructor and update inputs; existing constructors default to no association. The reference is not a JSON, Value, string, structural brand or serializable payload. An undeclared recipient is an error. This native boundary does not extend the ECMAScript realm registry ABI, authorize a GPUI Runtime Adapter bridge, or promise cross-process identity; Anatomy descriptor pairing remains explicitly unsupported by this native profile.
      zh-CN: draft gpui-source-v1 显式关联切片使用同一内容兼容共享 SDK 工厂创建的 Rust nominal ControlLabelRef；独立生成的 crate 通过强类型 InstanceAssociations 构造与更新入口共享该类型及同一引用的克隆，原有构造入口默认无关联。它不得成为 JSON、Value、字符串、结构品牌或可序列化载荷，未声明参与的接收者必须报错。该原生边界不扩展 ECMAScript realm registry ABI，不承诺与 GPUI Runtime Adapter 混合配对或跨进程 identity；原生 profile 继续明确拒绝 Anatomy descriptor 配对。
  - id: C-CONTROL-LABEL-0001-GPUI-LEASE
    text:
      en: A compiled native pair requires exactly one current Label and target with the same nominal reference, one Window accessibility tree, and unambiguous current semantic-node bindings. Requests retain exact participant, view epoch, association generation and pair revision and recheck them before target work; replacement, duplication, detach or terminal disposal invalidates older requests. Naming projects labelledBy to the actual rendered Label node as a separately owned derived contribution; explicit nonempty author names and relations are preserved and content-derived defaults may yield. Detach retains authored association intent. Evidence must consume the unchanged Button, Toggle and Label sources through compileFile and distinguish native framework execution, Adapter execution and physical input or assistive-technology delivery.
  - id: C-CONTROL-LABEL-0001-DOMAIN
    text:
      en: The shared reference defines the sole logical pair-authorization domain, so explicitly paired siblings need not share an Anatomy family. Both current views must additionally belong to the same host accessibility tree scope. No relation is inferred by position, DOM order, nearest control, name or framework root. Existing kind:part relationships remain constrained to their original same-Anatomy domain; this contract uses the separate direct semantic-object-reference path and does not widen part lookup.
  - id: C-CONTROL-LABEL-0001-UNIQUENESS
    text:
      en: The first slice accepts exactly one live Label and one live target per reference. Missing, duplicate, detached or foreign-scope participants withdraw association effects and diagnose the condition; they never choose a winner by registration or DOM order. A candidate replacement must not revoke a distinct current owner through a stale cleanup callback.
  - id: C-CONTROL-LABEL-0001-NAME
    text:
      en: Naming, when requested, relates the target to the actual rendered Label through A11y labelledBy semantic references. It must not copy label text into aria-label or hidden duplicate content. An explicit existing text name or labelledBy source conflicts with the first-slice naming request and remains unchanged; the conflict is diagnosed independently of an explicitly requested activation-only effect. A content-derived default name can yield to the explicit relation. Live Label content changes are read through the same semantic subject.
  - id: C-CONTROL-LABEL-0001-OWNED-NAME
    text:
      en: Derived naming owns a bounded relation contribution and releases only that contribution. Consumer-authored names or IDREF tokens, later replacements and newer view leases survive cleanup. Terminal disposal retires callbacks and view relations before releasing the logical binding; repeatable detach retains authored association intent for a valid remount.
  - id: C-CONTROL-LABEL-0001-ACTIVATION
    text:
      en: Activation is optional and separate from naming. An eligible label action requests the target's existing internal activation operation exactly once in the target's runtime callback scope. The same operation serves direct press input, retains disabled and controlled/uncontrolled rules, and emits only the ordinary outward signal. Label must not mutate the target's value, invoke an outward event as input, dispatch a synthetic DOM click or gain a separate toggle state.
  - id: C-CONTROL-LABEL-0001-INPUT
    text:
      en: The host rejects secondary or modified pointer actions, pointercancel or dragged gestures, and input originating in nested interactive descendants. A trusted host-generated non-pointer click can request activation without inventing a Label keyboard binding; synthetic click-only input is not sufficient. The Web host preserves the originating activation turn and checks click cancellation synchronously at its listener. A later listener cannot roll back an already committed operation; preventDefault on pointerup alone is not click cancellation. This boundary is narrower than a native HTML label default action and must remain explicit. Label is neither a new Tab stop nor a button and adds no independent keyboard activation path. A native host may attach an explicitly enabled action to the same visible text semantic node without adding a portable interactive role or hidden text duplicate; naming-only labels do not advertise that action. The target's ordinary keyboard and direct-pointer behavior remains unchanged. No blanket pointerdown cancellation or text-selection clearing is permitted.
  - id: C-CONTROL-LABEL-0001-FOCUS
    text:
      en: When an accepted actionable label requests focus, the target uses its existing focus owner under the same disabled and lifecycle checks. Reentrant focus or outward callbacks that disable, detach or replace either participant invalidate subsequent work from the old request. Naming remains available for a disabled target while activation and focus are suppressed.
  - id: C-CONTROL-LABEL-0001-STANDALONE-EDITORS
    text:
      en: Standalone Select Trigger and Number Field Input accept explicit associations and use their current focus owners under the same disabled and live-request guards. The label does not open the popup, change selection, parse a draft or step a number. Existing author names and Number Field label-part relations remain authoritative; an activation-only Label may preserve them. The explicit Field variants retain their anatomy-pair association and reject simultaneous explicit pairing.
  - id: C-CONTROL-LABEL-0001-CONTENT
    text:
      en: >-
        The label text-selection policy is explicit and bounded. Passive naming-only labels remain selectable content; a short actionable label may suppress accidental selection under the content-selection affordance contract. The admitted policy vocabulary is the shared ControlLabelSelectionPolicy ('policy', 'auto', 'text', 'none'): 'policy' derives the declaration from the label's actionable role, and the three explicit values lower only to the subject-local select-auto, select-text and select-none affordances. The policy never owns a selection range, editing or clipboard command, control state, focus or a second selection state machine. Long descriptions remain independent selectable content rather than an enlarged action target or duplicated accessible name. Checkbox/Switch anatomy does not acquire a Label part.


  - id: C-CONTROL-LABEL-0001-LOWERING
    text:
      en: Direct host integrations pass the opaque reference through the dedicated typed InstanceAssociations input, whose only admitted key in this slice is controlLabel. The Runtime delivers it through ControlLabelPort only to a Prototype that explicitly declared Label or target participation. It never enters raw or resolved Props; the active JSON Props contracts remain unchanged. This association channel cannot carry arbitrary data, callbacks, values, host objects or other reference families. Unknown keys and undeclared recipients are errors. Data-only demo input must declare an association key in a bounded render instance and materialize references through the public factory, preserving stable identity until that instance is disposed. Reusing the same key in another render instance never associates the two. Unsupported serialization or compiler lowering must report an explicit diagnostic rather than silently output an empty object or install an application listener that simulates protocol support.
  - id: C-CONTROL-LABEL-0001-WEB
    text:
      en: The first Web projection requires connected participants in the same Document and getRootNode tree scope. It uses the existing A11y semantic-reference and IDREF ownership projection for naming, plus a narrowly scoped input-intent host bridge for activation. Scope observers are shared, include shadow-tree containment changes, and retire only their own subscriptions. Cross-document and cross-shadow-root associations are unsupported and diagnosed even when an App Maker shares a reference. View identity and callback epoch are rechecked before every target effect.
  - id: C-CONTROL-LABEL-0001-NAME-INTEROP
    text:
      en: A shared pair passes the Label's opaque semantic identity and current physical view to the target-owned naming operation. When compatible implementations use distinct A11y identity registries, the target host may translate that exact current view into a bounded local semantic source lease. It must reuse an unambiguous exact local binding, reject an ambiguous or foreign-tree binding, and otherwise relate to the same rendered Label without copying content. Alias projection and generated-ID receipts retire with the target relation or view; a generated ID stays valid while another compatible live projection retains it, and last release preserves a consumer replacement. This privileged bridge does not admit foreign objects to the public A11y author API or expose host facts through ControlLabelRef, Props or Context.
  - id: C-CONTROL-LABEL-0001-BOUNDS
    text:
      en: This module does not own Form, submission, validation or error summaries. Its bounded anatomy bridge may be consumed by an independent Field protocol; it admits no multiple-label ordering, arbitrary action dispatch, native selection model or platform-wide support claim. Missing host capability is an explicit unsupported state, not success. Passing instance-association input or rendering label text alone does not certify a working association.
  - id: C-CONTROL-LABEL-0001-GPUI-DIRECT
    text:
      en: The GPUI source lowering passes a factory-only Rust reference through NativeInstanceAssociations, separately from JSON Props. One exact live label and target in the same window may contribute a same-frame labelled_by relation and an explicitly enabled action on the visible label node. Explicit naming sources retain ownership and conflict independently of activation. Unknown native-view slot content fails closed for pointer qualification, without suppressing its naming or explicit assistive action; the host never guesses whether an arbitrary native child is interactive. Pair revision and both view epochs retire requests after rebinding, duplicate adoption, detach or disposal. Native source anatomy descriptors remain an explicit unsupported diagnostic.
  - id: C-CONTROL-LABEL-0001-ANATOMY
    text:
      en: A participant may instead declare one setup-only {family,labelRole,targetRole} anatomy pair. ControlLabel alone resolves the opaque nearest-root domain and exact self role through AnatomyPort, retains a module-private pair reference for that domain/role tuple, and uses its existing live registry and physical tree-scope guard. The descriptor contains no host IDs or callbacks; the internal reference never enters Props/Context. Explicit non-null InstanceAssociations conflicts with this mode and is rejected. Missing domain, mismatched role, zero/multiple live targets, adoption, detach, replacement and terminal cleanup fail closed or refresh exact leases. Anatomy supplies structure, not a new value or activation owner. Naming may be disabled so a pre-existing A11y part relationship remains the sole name owner.

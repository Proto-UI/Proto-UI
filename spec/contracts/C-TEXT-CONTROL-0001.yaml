revisions:
  - version: 0.2.0-rc.7
    change: revised
    summary: Required wrapper-backed Text Control profiles to project Root visual intent onto the physical editor surface.
  - version: 0.2.0-rc.7
    change: revised
    summary: Replaced the Web target declaration with host-neutral editing requirements and added editing-session preservation.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Introduced the focused native multiline Text Control host boundary.
  - version: 0.3.0-alpha.0
    change: revised
    summary: >-
      Made the Text Control module line-mode-aware (single or multiline), added common inputMode and enterKeyHint hints, and required CR/LF canonicalization at the module boundary. Single-line mode resolves to HTMLInputElement on the Web profile.



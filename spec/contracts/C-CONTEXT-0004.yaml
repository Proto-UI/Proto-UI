dependsOn:
  contracts:
    - C-CONTEXT-0002
revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added an explicit strict-ancestor optional read/subscription exception while preserving ordinary self-inclusive resolution.
  - version: 0.3.0-alpha.0
    change: clarified
    summary: Made nearest-provider resolution explicitly self-inclusive, aligning the contract with the existing provider-self decision, Module criterion and executable evidence.
  - version: 0.2.0-rc.7
    change: revised
    summary: Allowed opaque nearest-provider identity for bounded module-internal coordination without weakening JSON values.
  - version: 0.1.0
    change: introduced
    summary: Captured scope ancestry and nearest-provider resolution without requiring all hosts to be tree-shaped.
tags:
  - context
  - scope
  - resolution

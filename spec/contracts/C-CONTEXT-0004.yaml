id: C-CONTEXT-0004
type: contract
title: Context resolves through nearest scope owner
status: draft
since: 0.1.0
summary: Context resolution binds a participant to the nearest provider or equivalent scope owner for the requested ContextKey.
statement:
  zh-CN: >-
    Context resolution 必须基于 runtime/adapter 提供的 scope ancestry。常见 UI 宿主中，这个 ancestry 通常表现为 logical tree 或 component tree；若宿主没有树形结构，只要 adapter 能提供等价的 scope resolution 逻辑，Context 仍然可以成立。对于同一个 ContextKey，最近的 scope owner wins。


  en: >-
    Context resolution must be based on scope ancestry supplied by the runtime/adapter. In common UI hosts this ancestry usually appears as a logical tree or component tree; if a host is not tree-shaped, Context may still work when the adapter provides equivalent scope-resolution logic. For the same ContextKey, the nearest scope owner wins.


criteria:
  - id: C-CONTEXT-0004-A
    text:
      zh-CN: context resolution 必须通过 runtime/adapter 提供的 scope ancestry 执行。
      en: Context resolution must use scope ancestry provided by the runtime/adapter.
  - id: C-CONTEXT-0004-B
    text:
      zh-CN: 在树形宿主中，resolution 必须选择最近的祖先 provider。
      en: In tree-shaped hosts, resolution must choose the nearest ancestor provider.
  - id: C-CONTEXT-0004-C
    text:
      zh-CN: 同一 ContextKey 可以由不同组件实例同时提供；绑定结果按参与者所在 scope 决定。
      en: The same ContextKey may be provided by multiple component instances at once; binding depends on the participant's scope.
  - id: C-CONTEXT-0004-D
    text:
      zh-CN: Context 不得被硬编码为某个宿主的 DOM tree、React Context 或 Vue provide/inject 语义。
      en: Context must not be hard-coded to a specific host's DOM tree, React Context, or Vue provide/inject semantics.
  - id: C-CONTEXT-0004-E
    text:
      zh-CN: Module-internal 协调器可以把 nearest provider identity 作为 opaque scope token 使用，但该 token 不属于 Context value，也不得暴露给 prototype author。
      en: A module-internal coordinator may use nearest-provider identity as an opaque scope token, but that token is not part of the Context value and must not be exposed to prototype authors.
sources:

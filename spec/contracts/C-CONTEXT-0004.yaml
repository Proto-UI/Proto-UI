dependsOn:
  contracts:
    - C-CONTEXT-0002
revisions:
  - version: 0.2.0-rc.7
    change: revised
    summary: Allowed opaque nearest-provider identity for bounded module-internal coordination without weakening JSON values.
  - version: 0.1.0
    change: introduced
    summary: Captured scope ancestry and nearest-provider resolution without requiring all hosts to be tree-shaped.
tags:
  - context
  - scope
  - resolution

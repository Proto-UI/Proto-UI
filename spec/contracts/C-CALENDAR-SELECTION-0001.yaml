id: C-CALENDAR-SELECTION-0001
type: contract
title: Calendar single, multiple and range selection
status: draft
since: 0.3.0-alpha.2
lifecycleRationale: The owner requested these missing Calendar and Date Picker capabilities. This definition precedes implementation; independent review, native browser and assistive-technology evidence remain required for stable admission.
summary: One Calendar Root owns civil-date selection and accepted completion; days and Date Picker project that owner.
statement:
  en: Selection policy belongs to the portable Calendar Root. Calendar Day submits a civil-date activation through that owner; family parts paint its facts, and Date Picker composes accepted completion with Popover. Existing single-date value types and callbacks remain compatible.
criteria:
  - id: C-CALENDAR-SELECTION-0001-MODES
    text: Root mode is single by default, multiple or range. Single retains value/defaultValue, valueChange and string value state. Multiple uses values/defaultValues and valuesChange with fresh, unique, ascending civil-date arrays; getValues returns a copy. Range uses range/defaultRange and rangeChange with a copied object; getRange returns a copy. An empty range is {}, an incomplete range is {from}, and a complete inclusive range is {from,to}, normalized to ascending endpoints. Switching mode does not reinterpret another mode's stored value. Every date is YYYY-MM-DD Gregorian without a host time zone.
  - id: C-CALENDAR-SELECTION-0001-REQUEST
    text: requestValue(date) and day activation select a date in single mode, toggle its membership in multiple mode, or start/complete a range in range mode. Activating after a complete range starts a fresh incomplete range; completing before its anchor normalizes endpoint order; selecting the anchor again completes a zero-night range when allowed. requestValues and requestRange accept complete proposals only in their respective modes. No-op and malformed requests emit no change. All outputs are independent copies; mutating callback payloads or return values cannot change canonical selection.
  - id: C-CALENDAR-SELECTION-0001-ELIGIBILITY
    text: Disabled or readOnly Root blocks every selection request. min/max and unavailable apply to every new selected date; a range crossing any unavailable civil date is rejected without silently skipping that date or changing its anchor. Multiple minSelected defaults to zero and maxSelected is unbounded. Day activation and requestValue may add one eligible date while below minSelected so a selection can grow from empty toward the minimum; removing a date must leave at least minSelected, and explicit requestValues replacements must meet both count limits. Controlled progressive additions remain proposals until owner acceptance. Range minNights defaults to zero and maxNights is unbounded. Limits are nonnegative integers. Completed-range length is the UTC civil-day difference; incomplete/empty ranges remain valid while choosing or clearing. Infeasible policies reject requests. Owner-supplied valid-shape values remain authoritative when eligibility changes and are not silently rewritten.
  - id: C-CALENDAR-SELECTION-0001-CONTROLLED
    text: Each supplied mode-specific controlled prop is the sole accepted selection for that mode. Requests emit proposals without painting them as accepted. Synchronous or delayed matching acceptance updates all day facts. Default values initialize once; subsequent default changes do not reset selection. Changed mode, disabled/readOnly, superseding selection, unrelated owner replacement, unmount or disposal retires pending completion. No stale request closes a reentered popup.
  - id: C-CALENDAR-SELECTION-0001-CAPTURE
    text: An author composing asCalendarRoot may registerSelectionCapture during setup through its stable hook handle. Each distinct capture receives a read-only request id, Calendar view epoch and current Context reader synchronously after a valid non-no-op request is allocated, before any State write, Context transition or outward proposal callback for that request. Capture only records local consumer facts; it must not request updates, dispatch events or retain the Context reader for later use. Registration is owner-local, duplicate registration of the same function is idempotent, and disposal releases it. Late new registration is a setup-phase error. Calendar revalidates its owner, view and request after capture before continuing. This causal seam does not impose a global order on independent Context channels or encode any consumer component in Calendar.
  - id: C-CALENDAR-SELECTION-0001-DAYS
    text: Every Day exposes selected, rangeStart, rangeEnd, rangeMiddle and rangePending booleans derived from the current canonical mode/selection. Selected includes every inclusive range date; an incomplete anchor has rangeStart/rangePending true and rangeEnd/rangeMiddle false. A one-day complete range has both endpoints true. Non-range modes clear all range facts. Hidden capacity clears all selection facts. Grid declares multiselectable for multiple and range. Existing one-entry keyboard navigation, disabled date skipping, RTL and month-control refusal remain independent from selection policy. Families visibly distinguish middle segments from endpoints using these facts.
  - id: C-CALENDAR-SELECTION-0001-PICKER
    text: Date Picker inherits the same props, requests and day facts. It requests Popover closure once only after a single-date or complete-range request is canonically accepted while the popup is open; it remains open for rejected/pending proposals, incomplete ranges and multiple toggles. The corresponding valueChange or rangeChange proposal is delivered before that completion; after delivery returns, its owner, view and request must remain current. Synchronous owner acceptance inside the proposal callback updates canonical facts without closing ahead of the callback. At request capture, the mounted Picker records the actual Popover root and accepted opening session. Completion must match that request and the same still-open session. An opening or close/reopen caused by any later State observer, Context observer or proposal callback cannot become the earlier request's session. A fresh request started in that new session remains independently eligible even while older notifications drain; old close notifications cannot retire it. External selection changes without a live request do not close it. Date Picker Value renders the canonical single date, comma-separated multiple dates, an incomplete from date with an ellipsis, or complete from/to endpoints; placeholder represents empty selection. Popover remains the authority for controlled open refusal, focus return and dismissal.

    change: refined
    summary: Define setup-time request capture and accepted opening correlation before implementation, preserving independent Context channel scheduling and current nested requests.
  - version: 0.3.0-alpha.2
    change: introduced
    summary: Defined additive multiple/range ownership, eligibility, day facts and accepted Date Picker completion before implementation.

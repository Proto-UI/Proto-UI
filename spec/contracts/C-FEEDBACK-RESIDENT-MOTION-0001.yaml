id: C-FEEDBACK-RESIDENT-MOTION-0001
type: contract
title: Resident style motion follows final semantic targets
status: draft
since: 0.2.0-rc.0
summary: Setup declarations select typed style channels; a shared sampler projects persistent-view target changes without owning component state or presence.
statement:
  en: >-
    def.feedback.style.transition declares a bounded set of translate or background-color channels, durationMs and cubic-bezier easing. Existing style contributions and runtime patch determine the sole final target. Motion is presentation only and must never write State, presence, target style, material source or contact acquisition. Hosts resolve governed typed units and palette roles, never recover intent by parsing computed CSS or dispatching on component identity.


criteria:
  - id: C-FEEDBACK-RESIDENT-MOTION-0001-A
    text:
      en: Declarations are setup-only, snapshotted and finite; declaration fields and array coordinates must be own data properties, sparse arrays and accessors are rejected before invocation; properties cannot overlap across declarations. Duration is nonnegative and cubic-bezier x coordinates are in [0,1]. Relevant style Rules remain runtime evaluated so their target is not hidden in host selectors.
  - id: C-FEEDBACK-RESIDENT-MOTION-0001-B
    text:
      en: Extract targets only after setup, Rule and runtime patch merge. A patch outranks the Rule and suppress removes the channel. Unsupported or selector-dependent targets settle with an explicit diagnostic; transition-all does not imply interpolation support.
  - id: C-FEEDBACK-RESIDENT-MOTION-0001-C
    text:
      en: The pure sampler accepts finite monotonic timestamps and typed vectors. A changed resident target starts from the last successfully acknowledged typed presentation, preserving displayed C0 continuity even when the frame scheduler is delayed past the old duration. A non-frame commit cannot advance the display by sampling unseen wall-clock progress. The pure sampler retains its mathematical current-time default; projection supplies an explicit dense immutable finite vector anchor. An unchanged target does not restart or advance between frame callbacks; the next actual frame follows the unchanged timeline. Missing projection acknowledgement, incompatible dimensions or unresolved targets invalidate the channel anchor and settle rather than reuse an unpresented value. A reversing target uses the CSS reversing-shortening factor evaluated from the acknowledged eased progress; reconstruct this ratio from the largest nonzero component of the current typed from-to path, retaining easing overshoot until the factor clamp; a third target resets that factor. No unbounded queue is retained.
  - id: C-FEEDBACK-RESIDENT-MOTION-0001-D
    text:
      en: Controlled rejection changes no final target and starts no motion. Input cancel clears transient interaction through its existing owner and cannot roll back an accepted checked value.
  - id: C-FEEDBACK-RESIDENT-MOTION-0001-E
    text:
      en: A new view settles every initialization commit until its first presentation-frame callback; any target received before that boundary is its not-yet-presented initial state. The boundary uses one delivered frame per view, is epoch/cancellation safe, and never polls idle. After that boundary, first mount, hidden or detached view, new view epoch, missing unit measurement, missing palette resolution, reduce or unknown motion preference settle to the current target. Returning to no-preference does not replay. Dispose cancels scheduling and rejects stale callbacks or commits.
  - id: C-FEEDBACK-RESIDENT-MOTION-0001-F
    text:
      en: Translate is a typed affine pair with px, rem and own reference-box percentage terms. The host must supply the actual reference-box extent and root font; missing bases cannot be guessed. Projection must remove exactly its owned translated contribution and preserve unrelated transform channels; incompatible composition is an explicit unsupported result.
  - id: C-FEEDBACK-RESIDENT-MOTION-0001-G
    text:
      en: Color targets are semantic palette roles or typed colors with alpha, resolved through a versioned host palette. Interpolation uses premultiplied Oklab with explicit conversion; missing roles settle, and final CSS strings or computed background color are never the source of target identity.
  - id: C-FEEDBACK-RESIDENT-MOTION-0001-H
    text:
      en: One projection owner applies each view/revision and returns a typed list of accepted property channels. Only a successful still-current projection receipt can update channel anchors. Reentrant stale projections cannot acknowledge paint; rejected channels clear their sampler and anchor and stop scheduling, while other admitted channels may continue. Presentation samples never overwrite retained final-style snapshots, material intent or optical sampling inputs. Web Document, Shadow and native consumers implement the same declaration and sampler contract; a token generator or unmapped diagnostic alone is not acceptance.
  - id: C-FEEDBACK-RESIDENT-MOTION-0001-AXIS-MERGE
    text:
      en: Unqualified translate-x utilities form one last-wins semantic group regardless of sign, units or affine calc payload; translate-y forms a separate group. Runtime patch and suppress operate on that same axis group after ordinary contributions. Selector scopes remain distinct from unqualified tokens and other scopes. This does not establish general transform decomposition or merge semantics.
  - id: C-FEEDBACK-RESIDENT-MOTION-0001-PALETTE-LIFETIME
    text:
      en: A host palette source factory binds once to each physical surface and supplies current revision, typed colors and optional source diagnostics. Each view owns its subscription cleanup; replacement binds a fresh source and retired callbacks cannot project. Source authority is checked at each target and active frame. Normal theme revision notifications invalidate; silent CSSOM mutations while idle are observed at the next target, never by perpetual idle polling. An unsupported or mismatched role settles without parsing computed paint into semantic intent.
  - id: C-FEEDBACK-RESIDENT-MOTION-0001-COLOR-LEASE
    text:
      en: Color presentation explicitly distinguishes active and settled channels. Web owns an inline color lease only while active. On endpoint, reduced or unknown preference, hidden settlement or unresolved source it releases only its own latest write and restores that lease's baseline; a newer external inline write is preserved. The retained target token owns settled paint and idle theme updates. A later active transition captures a new baseline. While a lease is active, an external change to its exact inline value or priority suspends that channel for the remainder of the physical view, preserves the external value, and reports a named ownership diagnostic. Recovery requires a new view/sink binding. The comparison establishes ownership only and must not parse CSS into a typed anchor. Ordinary theme or semantic target changes that do not steal the inline lease remain animatable in the same view. Numeric settled samples remain available to non-Web hosts.
lifecycleRationale:
  en: This new bounded contract remains draft pending independent review, typed palette integration, Compiler coverage and real Web/native host evidence. Model and DOM tests alone do not establish physical animation support.

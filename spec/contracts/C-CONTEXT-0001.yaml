id: C-CONTEXT-0001
type: contract
title: Context is the official inter-component information channel
status: draft
since: 0.1.0
summary: Context is Proto UI's official Component-to-Component information channel and the only information channel dedicated to inter-component communication.
statement:
  zh-CN: >-
    Context 是 Proto UI 官方承认的 Component ↔ Component 信息通路，也是当前信息通路模型中唯一负责组件间通信的通路。除 Context 外，Props、Feedback、Event、Expose 与 State 都不得被解释为普通组件间信息交流机制；它们可以与 Context 协同，但不能替代 Context 的通路身份。


  en: >-
    Context is Proto UI's official Component ↔ Component information channel and the only channel in the current information-channel model dedicated to inter-component communication. Props, Feedback, Event, Expose, and State must not be interpreted as ordinary inter-component communication mechanisms; they may cooperate with Context, but do not replace Context's channel identity.


criteria:
  - id: C-CONTEXT-0001-A
    text:
      zh-CN: Context 必须被识别为组件间通信的信息通路。
      en: Context must be identified as the inter-component information channel.
  - id: C-CONTEXT-0001-B
    text:
      zh-CN: Context 是当前信息通路模型中唯一负责组件间信息交流的官方通路。
      en: Context is the only official information channel dedicated to inter-component communication in the current channel model.
  - id: C-CONTEXT-0001-C
    text:
      zh-CN: Props 不得被解释为组件间传参通路；Proto UI core 不提供原型级组合。
      en: Props must not be interpreted as an inter-component parameter-passing channel; Proto UI core does not provide prototype-level composition.
  - id: C-CONTEXT-0001-D
    text:
      zh-CN: Anatomy + Expose 可以作为兜底协作路径，但不得被描述为 Context 的官方替代通路。
      en: Anatomy + Expose may be used as a fallback coordination path, but must not be described as the official replacement for Context.

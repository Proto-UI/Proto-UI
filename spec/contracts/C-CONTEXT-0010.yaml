id: C-CONTEXT-0010
type: contract
title: Context callbacks observe semantic updates deterministically
status: draft
since: 0.1.0
summary: Context update callbacks must observe successful semantic updates with correct next/prev values and deterministic ordering, while runtime and adapters may retain scheduling flexibility.
statement:
  zh-CN: >-
    每次成功的 context update 都必须形成一次可观察的 semantic context transition。订阅 callback 必须接收与该 transition 对应的 `next` 与 `prev`，并接收当前 callback invocation 的 run handle。实现可以通过 runtime/adapter 调度 callback delivery，但不得静默丢失更新、错误合并不同语义更新，或破坏同一 dispatch window 内的确定性顺序。


  en: >-
    Every successful context update must form an observable semantic context transition. Subscription callbacks must receive the `next` and `prev` values for that transition and the run handle for the current callback invocation. Implementations may schedule callback delivery through the runtime/adapter, but must not silently drop updates, incorrectly merge semantically distinct updates, or break deterministic ordering within the same dispatch window.


criteria:
  - id: C-CONTEXT-0010-A
    text:
      zh-CN: 成功 context update 必须产生可观察的 semantic transition。
      en: Successful context updates must produce observable semantic transitions.
  - id: C-CONTEXT-0010-B
    text:
      zh-CN: callback 接收的 `next` 与 `prev` 必须对应被通知的那次 transition。
      en: Callback `next` and `prev` values must correspond to the transition being delivered.
  - id: C-CONTEXT-0010-C
    text:
      zh-CN: context callback 必须接收当前 callback invocation 可用的 run handle。
      en: Context callbacks must receive a run handle usable for the current callback invocation.
  - id: C-CONTEXT-0010-D
    text:
      zh-CN: 同一 dispatch window 内的 callback delivery 顺序必须确定。
      en: Callback delivery order within the same dispatch window must be deterministic.
  - id: C-CONTEXT-0010-E
    text:
      zh-CN: 契约不得强制所有 adapter 同步即时派发；调度优化不得改变 callback 语义。
      en: The contract must not force every adapter to dispatch synchronously; scheduling optimizations must not change callback semantics.
  - id: C-CONTEXT-0010-F
    text:
      zh-CN: 自 0.3.0-alpha.0 的 J1 起，同一 provider 实例代次与 ContextKey 的重入通知按更新提交顺序送达持续有效的订阅者，不合并或丢弃 transition。嵌套 update 的 callback 可在当前 transition delivery 完成后执行；不同通路无全局总序要求。
      en: From J1 in 0.3.0-alpha.0, reentrant notifications for one provider generation and ContextKey reach continuously eligible subscribers in update commit order, without coalescing or dropping transitions. Nested update callbacks may run after the current transition delivery; independent channels have no required global total order.
  - id: C-CONTEXT-0010-G
    text:
      zh-CN: 更新在排队前提交 provider 当前值；read 和 updater 读取当前值，而 callback next/prev 始终描述对应 transition。通知只面向提交时已注册且 delivery 时仍有效并解析到同一 provider 代次的 callback；unsubscribe、解绑或销毁不得被排队通知撤销，新代次不接收旧代次通知。
      en: Updates commit the provider value before queuing delivery. Reads and updater functions see current values while callback next/prev describe their transition. Only callbacks registered at commit and still eligible and resolving to the same provider generation at delivery receive it; queued work cannot undo unsubscribe, rebinding or disposal, or leak into a new generation.
  - id: C-CONTEXT-0010-H
    text:
      zh-CN: 同步 callback 抛错不回滚已提交的值。有限 dispatch window 中其余仍有效的 delivery 完成、队列清理后向调用者报告错误；多个错误可聚合。后续独立更新不得重放残留任务。此规则不承诺终止作者构造的无限更新循环。
      en: A synchronous callback error does not roll back committed values. Remaining eligible deliveries in a finite dispatch window finish and queue resources clear before errors are reported to the caller; multiple errors may be aggregated. Later independent updates must not replay stale work. This does not guarantee termination of author-created infinite update cycles.
openQuestions:
  - id: C-CONTEXT-0010-Q-SCHEDULING
    question:
      zh-CN: 是否需要在未来为 context callback 固化更强的同步派发或批处理规则？
      en: Should future contracts stabilize stronger synchronous dispatch or batching rules for context callbacks?
    context:
      zh-CN: J1 已明确同通路重入顺序；跨宿主同步／异步调度与跨通路总序仍保留合理空间。
      en: J1 resolves same-channel reentrant ordering; cross-host synchronous/asynchronous scheduling and cross-channel ordering retain flexibility.
    blocks:
      - context callback scheduling policy

openQuestions:
  - id: C-DRAWER-HANDLE-PRESENTATION-0001-Q-NATIVE
    question: Which exact-head native receipts establish once-only intrinsic contribution and snap stability on every required adapter?
    blocks: [activation:C-DRAWER-HANDLE-PRESENTATION-0001]
  - id: C-DRAWER-HANDLE-PRESENTATION-0001-Q-INDICATOR
    question: How will a separate passive Indicator and neutral whole-Content gesture routing preserve nested scrolling, input exclusion, focus and retained resize semantics?
    blocks: [activation:C-DRAWER-HANDLE-PRESENTATION-0001]
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Separate legacy edge placement from Handle input and adopt only the bounded Shadcn bottom flow recipe with explicit remaining interaction and geometry gates.
tags: [drawer, presentation, family, gesture]

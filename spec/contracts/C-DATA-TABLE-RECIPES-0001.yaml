revisions:
  - version: 0.3.0-alpha.2
    change: clarified
    summary: Record the exposed getSelectedKeys() read of the authoritative selection so the catalog matches the implemented prototype method and its public consumer.
  - version: 0.3.0-alpha.2
    change: clarified
    summary: Make the shared hidden projection fact explicit for authored family hooks; preserve the existing display, focus and retained-child requirements.
  - version: 0.3.0-alpha.2
    change: introduced
    summary: Define the missing finite public Data Table recipe operations and their controlled and lifecycle boundaries.
tags: [data-table, table, filtering, selection, recipes]

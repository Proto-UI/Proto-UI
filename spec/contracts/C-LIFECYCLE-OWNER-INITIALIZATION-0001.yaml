  - id: C-LIFECYCLE-OWNER-INITIALIZATION-0001-Q-ADMISSION
    question: Independent shared-definition review and full source-bound browser/target evidence remain required. Automatic migration of arbitrary runtime State is not selected by this bounded data-initialization contract.

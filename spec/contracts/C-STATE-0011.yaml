  - path: packages/modules/state/test/kernel.v0.test.ts
  - path: packages/modules/state/test/port.v0.test.ts
dependsOn:
  contracts:
    - C-STATE-0010
    - C-STATE-0005
revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Defined number.list content equality while retaining scalar Object.is behavior.
  - version: 0.2.0-rc.7
    change: revised
    summary: Distinguished terminal or explicit source disconnection from repeatable view detachment.
  - version: 0.1.0
    change: introduced
    summary: Captured StateEvent shape, same-value suppression, disconnect, and deterministic re-entrant delivery.

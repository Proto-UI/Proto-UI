id: C-STATE-0011
type: contract
title: StateEvent records value changes and disconnects
status: draft
since: 0.1.0
summary: State watchers receive `next` events for value transitions and `disconnect` events for terminal or explicit source disconnection.
statement:
  zh-CN: >-
    StateEvent 是 state 变化记录的 portable event shape。state value 发生实际变化时，watcher 接收 `next` event，包含 `prev`、`next` 与可选 `reason`；state slot 与 watcher 因 terminal lifecycle 或显式 semantic source 断开时，watcher 可以接收 `disconnect` event。repeatable view detach 不得断开 instance-owned state slot 或 watcher。StateEvent 不携带 render 调度语义。


  en: >-
    StateEvent is the portable event shape for state-change records. When the state value actually changes, watchers receive a `next` event containing `prev`, `next`, and optional `reason`; when a state slot and watcher disconnect because of terminal lifecycle or an explicit semantic source disconnection, watchers may receive a `disconnect` event. Repeatable view detachment must not disconnect an instance-owned state slot or watcher. StateEvent carries no render scheduling semantics.


criteria:
  - id: C-STATE-0011-A
    text:
      zh-CN: "state value 按其 kind 的相等规则从 `prev` 转换到 `next` 时，watcher 必须接收 `{ type: 'next', prev, next, reason? }` 形状的 StateEvent。"
      en: "When a state value transitions from `prev` to `next` under its kind-specific equality, watchers must receive a StateEvent shaped as `{ type: 'next', prev, next, reason? }`."
  - id: C-STATE-0011-B
    text:
      zh-CN: 旧 scalar 在 `Object.is(prev, next)` 为 true 时不构成实际 change；number.list 按规范化长度与逐项 Object.is 比较，相等时保留原快照且不发事件。
      en: Legacy scalar writes use Object.is; number.list uses normalized length and per-item Object.is equality, retaining the original snapshot and emitting no event when equal.
  - id: C-STATE-0011-C
    text:
      zh-CN: '`setDefault(...)` 不得派发 `next` StateEvent。'
      en: '`setDefault(...)` must not dispatch `next` StateEvents.'
  - id: C-STATE-0011-D
    text:
      zh-CN: "state slot 与 watcher 因 terminal dispose 或显式 semantic source 断开时，可以派发 `{ type: 'disconnect', reason: 'unmount' }`；repeatable view detach 本身不得派发该事件。"
      en: "When a state slot and watcher disconnect because of terminal disposal or an explicit semantic source disconnection, `{ type: 'disconnect', reason: 'unmount' }` may be dispatched; repeatable view detachment alone must not dispatch it."
  - id: C-STATE-0011-E
    text:
      zh-CN: re-entrant `set(...)` 触发的 StateEvent 必须以确定性顺序派发，不得丢失已记录的状态转换。
      en: StateEvents caused by re-entrant `set(...)` calls must be delivered in deterministic order and must not lose recorded state transitions.
sources:
  - path: packages/types/src/state.ts
    sections:
      - StateEvent
  - path: packages/modules/state/src/kernel.ts
    sections:

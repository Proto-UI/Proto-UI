revisions:
  - version: 0.3.0-alpha.0
    change: revised
    summary: Projected current-run callback-scope binding and phase restoration onto State watcher dispatch, including privileged idle-phase mutations.
  - version: 0.1.0
    change: introduced
    summary: Captured setup-only watch as auxiliary observation, not reactive rendering.

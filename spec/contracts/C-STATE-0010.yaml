id: C-STATE-0010
type: contract
title: State watch is setup-only auxiliary observation
status: draft
since: 0.1.0
summary: '`watch` observes non-owned or not-fully-owned state changes in the owning runtime callback scope, but it is not a reactive rendering system.'
statement:
  zh-CN: >-
    State `watch(...)` 是 setup-only 的辅助 observation 能力，用于观察 borrowed 或 observed state 的变化。watch callback 在 runtime 执行时必须进入所属 instance 的 callback scope，并接收当前 invocation 的 `run handle`，包括由 privileged State port 在 kernel idle 时发起的 mutation。它不属于 owned view，不建立 render dependency，不隐式触发 update，也不得被解释为 Proto UI 的响应式渲染系统。


  en: >-
    State `watch(...)` is a setup-only auxiliary observation capability for observing borrowed or observed state changes. When a watch callback executes at runtime, it must enter the owning instance's callback scope and receive the current invocation's `run handle`, including for mutations initiated through the privileged State port while the kernel is idle. It is not part of the owned view, does not establish render dependencies, does not implicitly trigger update, and must not be interpreted as Proto UI's reactive rendering system.


criteria:
  - id: C-STATE-0010-A
    text:
      zh-CN: '`watch(...)` 必须只存在于 borrowed 与 observed view，不得存在于 owned view。'
      en: '`watch(...)` must only exist on borrowed and observed views, not on owned views.'
  - id: C-STATE-0010-B
    text:
      zh-CN: '`watch(...)` registration 必须是 setup-only。'
      en: '`watch(...)` registration must be setup-only.'
  - id: C-STATE-0010-C
    text:
      zh-CN: watch callback 必须随 state value 实际变化而可被调用；相同值写入是否派发由 StateEvent 契约定义。
      en: Watch callbacks must be callable when the state value actually changes; whether same-value writes dispatch is defined by the StateEvent contract.
  - id: C-STATE-0010-D
    text:
      zh-CN: watch callback 不得隐式触发 render、commit 或 update。
      en: Watch callbacks must not implicitly trigger render, commit, or update.
  - id: C-STATE-0010-E
    text:
      zh-CN: watch registration 必须绑定到组件实例生命周期，并在实例 dispose 时清理。
      en: Watch registrations must be bound to the component instance lifecycle and cleaned up when the instance is disposed.
  - id: C-STATE-0010-F
    text:
      zh-CN: watch callback 必须在所属 instance 的 runtime callback scope 中执行，并把绑定到当前 callback invocation 的 `run handle` 作为第一个参数；即使 mutation 来自 privileged State port 且 kernel 原本处于 idle，也不得以 unknown phase 或过期 context 直接调用 callback。
      en: Watch callbacks must execute in the owning instance's runtime callback scope and receive the `run handle` bound to the current callback invocation as their first argument; even when a mutation comes from the privileged State port while the kernel was idle, the callback must not be invoked directly in an unknown phase or with stale context.
  - id: C-STATE-0010-G
    text:
      zh-CN: watcher dispatch 完成后，runtime 必须恢复 dispatch 前的 phase；callback 内通过当前 `run handle` 执行的合法 state mutation 必须保持可用，但不得把 callback phase 泄漏到后续 idle 工作。
      en: After watcher dispatch completes, the runtime must restore the phase that preceded dispatch; phase-valid state mutations through the current `run handle` must remain available inside the callback, without leaking callback phase into subsequent idle work.

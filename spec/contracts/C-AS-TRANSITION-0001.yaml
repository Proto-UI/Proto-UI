revisions:
  - version: 0.1.0
    change: introduced
    summary: Replaced the legacy Presence-bridge transition model with a no-arg state machine coordinated through lifecycle ViewIntent and Core delay.
  - version: 0.1.1
    change: revised
    summary: Reclassified asTransition as an ordinary authored asHook using stable custom caller handle projection.
  - version: 0.1.2
    change: revised
    summary: Added setup-only transition default configuration and explicit-host-prop precedence.
  - version: 0.2.0-rc.0
    change: revised
    summary: Added reduced-motion consumption semantics while deferring final environment capability ownership.
  - version: 0.2.0-rc.0
    change: refined
    summary: Defined a setup-only declarative context-field initial fallback without a second target owner or callback capability.

id: C-AS-TRANSITION-0001
type: contract
title: asTransition governs perceptual phases over lifecycle ViewIntent
status: draft
since: 0.1.0
summary: asTransition is a no-argument once hook whose host-neutral state machine retains the current view while leaving, detaches only after close completion, and materializes a view before entering.
statement:
  zh-CN: >-
    `asTransition()` 只治理感知层的 transition phase，并通过 `run.lifecycle.setPresent()` 与 L1 ViewIntent 协同；它不得把 `isPresent`、Presence host bridge 或宿主 DOM 存在性建立为第二套生命周期真相。离场期间必须保留当前 view，完成为 `closed` 后才请求 detach；从 detached 进入时必须先请求 materialize，并等待新 view epoch mounted 后再进入 `entering`。延时完成必须消费 Core `delay()`，受 RuntimeSession 生命周期约束。


  en: >-
    `asTransition()` governs perceptual transition phases only and coordinates with L1 ViewIntent through `run.lifecycle.setPresent()`; it must not establish `isPresent`, a Presence host bridge, or host DOM existence as a second lifecycle truth. The current view must remain retained while leaving and detach may be requested only after completing into `closed`; entry from detached must request materialization first and wait for the new view epoch to mount before entering `entering`. Delayed completion must consume Core `delay()` and remain bound to RuntimeSession lifecycle.


criteria:
  - id: C-AS-TRANSITION-0001-A
    text:
      zh-CN: '`asTransition()` 必须是由 `defineAsHook` 定义的无参数 ordinary once hook；同一 setup chain 重复调用必须跳过安装并返回严格相同的投射 handle。'
      en: '`asTransition()` must be a no-argument ordinary once hook defined through `defineAsHook`; repeated calls in one setup chain must skip installation and return the exact same projected handle.'
  - id: C-AS-TRANSITION-0001-B
    text:
      zh-CN: transitionState 必须限定为 closed、entering、entered、leaving；isPresent 只表示感知存在性，不得作为结构 mount fact。
      en: transitionState must be limited to closed, entering, entered, and leaving; isPresent represents perceptual presence only and must not be treated as a structural mount fact.
  - id: C-AS-TRANSITION-0001-C
    text:
      zh-CN: 初始关闭必须允许 Proto setup 与 created 在无 view 的情况下完成；初始打开且 appear=false 必须直接从 entered 开始。
      en: Initial close must allow Proto setup and created to complete without a view; initial open with appear=false must begin directly at entered.
  - id: C-AS-TRANSITION-0001-D
    text:
      zh-CN: 初始打开且 appear=true，或从 detached closed 执行 enter 时，必须先请求 ViewIntent present，并仅在 view epoch mounted 后进入 entering。
      en: For initial open with appear=true, or enter from detached closed, ViewIntent present must be requested first and entering may begin only after the view epoch mounts.
  - id: C-AS-TRANSITION-0001-E
    text:
      zh-CN: leave 必须在 leaving 全程保留当前 view；仅在完成为 closed 并发出 afterLeave 后才可请求 ViewIntent detached。
      en: Leave must retain the current view throughout leaving; ViewIntent detached may be requested only after completing into closed and emitting afterLeave.
  - id: C-AS-TRANSITION-0001-F
    text:
      zh-CN: beforeEnter、afterEnter、beforeLeave、afterLeave 必须分别位于对应 phase 的开始与完成边界。
      en: beforeEnter, afterEnter, beforeLeave, and afterLeave must occur at the start and completion boundaries of their corresponding phases.
  - id: C-AS-TRANSITION-0001-G
    text:
      zh-CN: enterDuration 与 leaveDuration 的 fallback completion 必须通过 Core delay 调度；complete 必须取消当前 fallback 并同步完成有效 phase。
      en: Fallback completion for enterDuration and leaveDuration must be scheduled through Core delay; complete must cancel the current fallback and synchronously complete the valid phase.
  - id: C-AS-TRANSITION-0001-H
    text:
      zh-CN: unmount、dispose、phase 反转或新 completion generation 必须使旧 delay callback 失效，旧 callback 不得完成新 phase。
      en: Unmount, dispose, phase reversal, or a new completion generation must invalidate old delay callbacks, which must not complete a newer phase.
  - id: C-AS-TRANSITION-0001-I
    text:
      zh-CN: reverse、wait、immediate 必须按最新 target 解释中断；wait 只保留最新待处理方向，不得形成无界 FIFO。
      en: reverse, wait, and immediate must interpret interruption against the latest target; wait retains only the latest pending direction and must not form an unbounded FIFO.
  - id: C-AS-TRANSITION-0001-J
    text:
      zh-CN: 提供 open 时必须按受控 target 更新；未提供 open 时 defaultOpen 只决定初值，后续由 controls 驱动。
      en: When open is provided it must drive the controlled target; when open is absent defaultOpen determines only the initial value and controls drive subsequent changes.
  - id: C-AS-TRANSITION-0001-K
    text:
      zh-CN: closed、ViewIntent detached 与 Proto instance disposed 必须保持为三个不同事实；detach 后 controls 与 expose 必须继续可用，直到 owner terminal dispose。
      en: closed, ViewIntent detached, and Proto instance disposed must remain distinct facts; controls and exposes remain available after detach until terminal owner disposal.
  - id: C-AS-TRANSITION-0001-L
    text:
      zh-CN: 投射 handle 必须提供 setup-only `configure`，用于设置 appear、enterDuration、leaveDuration 与 interrupt 的 hook-owned 默认值，而不得给无参数 caller 增加 options。
      en: The projected handle must provide setup-only `configure` for hook-owned appear, enterDuration, leaveDuration, and interrupt defaults without adding options to the no-argument caller.
  - id: C-AS-TRANSITION-0001-M
    text:
      zh-CN: 显式宿主 prop 必须优先于对应的 configure 默认值；多次 setup 配置只 patch 显式字段，并以最后一次提供的值为准。
      en: An explicit host prop must take precedence over its corresponding configured default; repeated setup configuration patches only supplied fields and the last supplied value wins.
  - id: C-AS-TRANSITION-0001-N
    text:
      zh-CN: 当宿主 environment meta 声明 reducedMotion=reduce 时，自动 fallback completion 必须以 0ms delay 调度，在不保留非必要持续运动等待的同时保留 entering/leaving phase、before/after event 与 ViewIntent sequencing；meta 的最终实体归属由后续 Module/HC/Adapter 编目决定。
      en: When host environment meta declares reducedMotion=reduce, automatic fallback completion must be scheduled with a 0ms delay, preserving entering and leaving phases, before and after events, and ViewIntent sequencing without retaining non-essential sustained-motion waits; final entity ownership of the meta source is left to later Module, HC, and Adapter cataloging.
  - id: C-AS-TRANSITION-0001-O
    text:
      zh-CN: authored handle 可通过 setup-only bindInitialOpen 绑定 ContextKey 与 required boolean 直接字段的初始 fallback source，不接受回调、path 或 selector。绑定必须保存不可变 descriptor 副本；同 ContextKey identity 与字段在 setup 重复绑定幂等，不同来源必须显式报冲突；先检查 setup phase 再判断幂等。
      en: The authored handle may bind an initial fallback source through setup-only bindInitialOpen using a ContextKey and required boolean direct field, never a callback, path, or selector. Binding must retain an immutable descriptor copy; the same ContextKey identity and field are idempotent during setup, while a different source must fail explicitly. Check setup phase before idempotence.
  - id: C-AS-TRANSITION-0001-P
    text:
      zh-CN: 初始化保持显式 open、显式 defaultOpen、已绑定初始 source、未绑定 defaultOpen fallback 的优先级；显式输入分支不得读取 source。source 只在既有 created 初始化内同步读取一次，必须经组合已有 required context subscription 获得普通读取准入；缺失 provider、未声明读取、缺失字段或非 boolean 值必须按 context 或绑定错误传播，不得吞错或强转 false。
      en: Initialization precedence is explicit open, explicit defaultOpen, bound initial source, then the unbound defaultOpen fallback; explicit-input branches must not read the source. Read the source synchronously once within existing created initialization, under ordinary context admission through the composition's existing required subscription. Missing provider, undeclared read, missing field, and nonboolean values must propagate context or binding errors, never be swallowed or coerced to false.
  - id: C-AS-TRANSITION-0001-Q
    text:
      zh-CN: 初始 source 绑定不得新增持续 subscription、target watcher、timer、ViewIntent writer 或运行时重绑定；detach/remount 不重新采样。后续目标继续由既有 open/controls 协议驱动；machine.initialize、appear、duration、interrupt 与 reduced-motion 语义保持独立，不得依赖调用者先后安装 once hook 的某一种顺序。
      en: Initial source binding must not introduce an ongoing subscription, target watcher, timer, ViewIntent writer, or runtime rebinding, and detach/remount must not resample it. Later targets remain governed by existing open/controls. Machine initialization, appear, duration, interrupt, and reduced-motion semantics remain independent and must not depend on one preferred installation order of once hooks.

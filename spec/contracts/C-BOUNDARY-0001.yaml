id: C-BOUNDARY-0001
type: contract
title: Boundary observes host interactions and classifies one shared interaction domain
status: draft
since: 0.1.0
summary: Boundary keeps sample transport separate from multi-region classification and publishes one ternary outside-derived signal for higher-level consumers.
statement:
  zh-CN: >-
    Boundary 必须将宿主采样的传输与交互域分类分开：Event 负责监听、路由、生命周期 gating 与 callback scope，Boundary 负责将当前多 region 交互域分类为 `inside | outside | unknown`。`boundary.observe('pointer.press' | 'focus.move')` 是 setup-only 且幂等的采样请求；outside 通知只能由该共享分类结果产生，并且 stacked boundary 只允许最上层 active boundary 发布 outside。Overlay、dismiss 与 focus 是 Boundary 的消费者，Hit Participation 仍是独立能力。


  en: >-
    Boundary must separate host-sample transport from interaction-domain classification: Event owns listening, routing, lifecycle gating, and callback scope, while Boundary classifies the current multi-region interaction domain as `inside | outside | unknown`. `boundary.observe('pointer.press' | 'focus.move')` is a setup-only idempotent observation request; outside notifications may only derive from that shared classification, and stacked boundaries permit only the top-most active boundary to publish outside. Overlay, dismiss, and focus are Boundary consumers, while Hit Participation remains independent.


criteria:
  - id: C-BOUNDARY-0001-A
    text:
      zh-CN: Boundary 必须支持多个结构不相连的 region，并严格保留 `inside | outside | unknown` 三态。
      en: Boundary must support multiple structurally disjoint regions and strictly preserve `inside | outside | unknown`.
  - id: C-BOUNDARY-0001-B
    text:
      zh-CN: "`observe('pointer.press' | 'focus.move')` 必须是 setup-only 且幂等；Event 负责将宿主 sample 送入 runtime callback scope，Boundary 负责唯一分类。"
      en: "`observe('pointer.press' | 'focus.move')` must be setup-only and idempotent; Event transports the host sample into runtime callback scope and Boundary owns the sole classification."
  - id: C-BOUNDARY-0001-C
    text:
      zh-CN: outside 通知必须由 Boundary 分类产生，组件不得各自实现主路径的宿主 containment 判断。
      en: Outside notifications must derive from Boundary classification; components must not implement separate host-containment checks as the primary path.
  - id: C-BOUNDARY-0001-D
    text:
      zh-CN: 多个 active Boundary 共享一次 sample 时，仅 top-most Boundary 可以发布 outside，较低层必须返回 unknown。
      en: When multiple active boundaries share one sample, only the top-most Boundary may publish outside and lower boundaries must return unknown.
  - id: C-BOUNDARY-0001-E
    text:
      zh-CN: Boundary 分类与 Hit Participation 必须保持独立；passthrough 不得被改写为 outside。
      en: Boundary classification and Hit Participation must remain independent; passthrough must not be rewritten as outside.
  - id: C-BOUNDARY-0001-F
    text:
      zh-CN: view detach 时 Boundary 必须暂停 sample 消费，Proto instance 终止时必须清理 region 与 subscriber。
      en: Boundary must suspend sample consumption while the view is detached and clean up regions and subscribers when the Proto instance terminates.
  - id: C-BOUNDARY-0001-G
    text:
      zh-CN: '`asBoundary()` 必须是 no-arg privileged once caller；同一 setup chain 重复调用必须返回严格相同的 handle，setup-time 配置通过 `handle.configure(patch)` 表达。'
      en: '`asBoundary()` must be a no-argument privileged once caller; repeated calls in one setup chain must return the exact same handle, and setup-time configuration is expressed through `handle.configure(patch)`.'
  - id: C-BOUNDARY-0001-H
    text:
      zh-CN: 'focus.move 必须来自宿主证明的当前 focus destination，并通过同一多 region 分类与 observation discriminator 发布；不得以历史 hasFocused、无当前焦点证明的合成事件或 unknown 推断 outside。一次 pointer press 及其尚未 release/cancel 的 focus move 共享 top owner，已发布 pointer outside 的 boundary 不得重复发布该 press 的 focus outside；新 press、key 或 release/cancel 后可以再次发布。'
      en: 'focus.move requires a host-proven current focus destination and the same multi-region classifier with an observation discriminator; focus history, synthetic events without current-focus proof, and unknown cannot prove outside. A pointer press and its focus moves before release/cancel share one top owner; a boundary that already published pointer outside must not repeat focus outside for that press. A new press, key, or release/cancel permits another notification.'

openQuestions:
  - id: C-MATERIAL-PAINT-RESERVATION-0001-Q-REVIEW
    question: Does independent review accept this syntax, target-size preservation, responsive constraints and all four runtime transports as a solution to the parent Q-SYNTAX?
    blocks: [activation:C-MATERIAL-PAINT-RESERVATION-0001]
  - id: C-MATERIAL-PAINT-RESERVATION-0001-Q-NATIVE
    question: Which exact-source native layout, source-admission, open/reopen, real input, accessibility and resource receipts satisfy the parent Q-NATIVE?
    blocks: [activation:C-MATERIAL-PAINT-RESERVATION-0001]
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Proposed exact Anatomy association and an independently owned template part; parent activation questions and native acceptance remain open.
tags: [material, layout, anatomy, template, lifecycle]

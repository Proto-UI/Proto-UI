id: C-FEEDBACK-MATERIAL-0001
type: contract
title: Finite material intent resolves one owned visual slot
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: The independent finite material channel and conservative fallback policy are accepted draft direction. Private resolver evidence, final style provenance through Rule optimization, author/Runtime integration, and real atomic host realization remain unverified; this entity grants no stable Base or provider support.
  zh-CN: 独立有限 material 通路与保守 fallback 策略是已接受的 draft 方向。 私有 resolver 证据、Rule 优化后的最终 style provenance、作者与 Runtime 接线和真实宿主原子提交仍待验证； 本实体不授予稳定 Base 或 provider 支持保证。
summary: A separate typed material channel owns one finite fill slot and resolves complete candidates or its explicit opaque fallback after final style semantics.
statement:
  en: Material intent is a separate typed visual Feedback channel, not a new token, arbitrary StyleHandle, CSS interpreter, shader program or extension of feedback.style Rule intent. A declared slot has an explicit complete opaque fallback and mutually exclusive whole-value candidates. Resolve it against final post-patch style provenance, one shared style geometry, preferences and truthful support/source facts. The first slice is a private pure resolver; public author APIs, Rule lowering and host wiring require separate evidence. Single-surface resolution does not complete group/morph, all 106 Base projections, four Web Adapters, real native hosts or Prototype Compiler work, and finite backend resource generation is not full AOT compilation.
  zh-CN: Material intent 是独立 typed visual Feedback 通路，不是新 token、任意 StyleHandle、CSS 解释器、shader 程序， 也不扩展 feedback.style Rule intent。声明的 slot 具有显式完整 opaque fallback 与互斥的 whole-value candidate。 resolver 以 post-patch 最终 style provenance、唯一共享 style geometry、偏好和可信支持/来源事实求解。 首个 slice 是私有纯 resolver；公开作者 API、Rule lowering 和宿主接线须另有证据。 单 surface 解析不等于完成 group/morph、全部 106 Base 投影、四个 Web Adapter、真实 native host 或 Prototype Compiler； 有限 backend 资源生成也不等于完整 AOT。
criteria:
  - id: C-FEEDBACK-MATERIAL-0001-GRAMMAR
    text:
      en: 'Version 2 slots admit distinct liquid-glass and adaptive-blur intents. Liquid glass requires a self optical renderer; model/profile version belongs to the backend, and static surfaces need no model or interaction declaration. Optional regular/clear variant and finite press deformation are independent parameters, not a button requirement. Adaptive blur admits an eligible system-native material or an evidenced in-app browser compositor, with optional system/light/dark tone. Neither intent can silently become the other. Logical owned-scene, in-app-backdrop and behind-window source requests are distinct and do not grant capture access. Reject unknown fields, arbitrary anchors/paths/URLs/textures/CSS/shaders and non-finite values.'
      zh-CN: 'Version 2 slot 区分 liquid-glass 与 adaptive-blur。显式液态玻璃要求自实现光学 renderer；model/profile 版本属于后端，静态面板无需声明模型或交互。regular/clear 与有限 press deformation 是可选参数，不要求 Button 状态。适应模糊可由实证 system-native 材质或 in-app 浏览器 compositor 提供，可选 system/light/dark tone；两意图不可静默替代。owned-scene、in-app-backdrop、behind-window 是不同逻辑来源，不授予捕获权限。拒绝未知字段、任意 anchor/path/URL/texture/CSS/shader 和非有限值。'
  - id: C-FEEDBACK-MATERIAL-0001-SLOT
    text:
      en: One instance surface has at most one declared material slot. Each candidate is a complete value; no candidate-field merge or declaration-order last-write-wins is permitted. Exactly one valid active candidate may be enhanced. Zero active candidates select the declared slot fallback. Multiple active candidates or an invalid active candidate select that same fallback and emit a deterministic diagnostic. Removing the slot is a distinct tombstone, not zero active candidates.
      zh-CN: 每个实例 surface 最多声明一个 material slot。每个 candidate 必须是完整值，不允许字段合并或按声明顺序 last-write-wins。 恰好一个有效 active candidate 才可进入 enhanced。零 active candidate 选择 slot 声明的 fallback； 多个 active candidate 或无效 active candidate 选择同一 fallback 并产生确定性诊断。 移除 slot 是独立 tombstone，不等同零 active candidate。
  - id: C-FEEDBACK-MATERIAL-0001-FALLBACK
    text:
      en: 'The public slot explicitly designates final style fill and foreground as its fallback. Resolve one complete opaque RGBA pair from governed final post-patch style IR/provenance before admitting a material candidate; arbitrary computed CSS cannot establish ownership. Values must be finite, in range and opaque. Missing/ambiguous/nonopaque fill, unresolved palette roles/cycles, unreadable foreground or conflicting paint rejects material admission, preserves legal original style and cannot claim valid fallback. The foreground keeps its existing text owner and the fallback follows the same current theme.'
      zh-CN: '公共 slot 显式指定最终 style fill/foreground 作为 fallback。候选接纳前，必须从受治理 post-patch 最终 style IR/provenance 解析完整 opaque RGBA 对；任意 computed CSS 不能建立所有权。分量须有限、范围内且不透明。缺失/歧义/非 opaque fill、palette role 缺失/循环、不可解析 foreground 或竞争 paint 拒绝 material 接纳，保留原合法 style，不得谎称有效 fallback。foreground 保留原文本 owner，fallback 跟随同一当前 theme。'
  - id: C-FEEDBACK-MATERIAL-0001-OWNERSHIP
    text:
      en: 'An admitted slot owns fill, backdrop, optical coat and its resolved opaque fallback; style owns layout, geometry, text and border. The explicitly designated final style fill is the fallback input, not a second concurrently painted fill. Suppress only its normalized owned paint contributions in a valid material transaction. Any additional competing paint is diagnosed and cannot be settled by declaration order. A rejected slot preserves legal original style. An explicit tombstone releases material ownership and restores current legal style under C-VISUAL-TRANSACTION-0001.'
      zh-CN: '接纳后的 slot 拥有 fill/backdrop/optical coat 与已解析 opaque fallback；style 拥有 layout/geometry/text/border。显式指定的最终 style fill 是 fallback 输入，不是并绘的第二层 fill；有效 material transaction 仅抑制规范化自有 paint contribution。其他竞争 paint 必须诊断，不能由声明顺序决定。拒绝 slot 时保留原合法 style；显式 tombstone 释放材质 ownership 并按 C-VISUAL-TRANSACTION-0001 恢复当前合法 style。'
  - id: C-FEEDBACK-MATERIAL-0001-PROVENANCE
    text:
      en: 'Fallback ownership and geometry validation run after all setup/Rule style contributions and runtime patch/suppress/clearPatch. Selector-lowered and evaluator-retained Rules must yield equivalent final facts. A material-bearing Rule cannot be removed by style-only optimization, including a material-only Rule with no tokens. Incomplete, unknown or selector-dependent provenance rejects admission without clearing original legal style. Claims concern governed observable Proto intent, not arbitrary external CSS.'
      zh-CN: 'fallback ownership 与 geometry 校验发生于全部 setup/Rule contribution 及 runtime patch/suppress/clearPatch 之后。selector-lowered 与 evaluator-retained Rule 必须产生等价最终事实。含 material 的 Rule 不能被 style-only 优化丢弃，包括没有 token 的 material-only Rule。不完整、未知或依赖 selector 的 provenance 拒绝接纳且不清除原合法 style；证明边界只涉及受治理可观察 Proto intent，不覆盖任意外部 CSS。'
  - id: C-FEEDBACK-MATERIAL-0001-GEOMETRY
    text:
      en: Resolve surface bounds and corner radii once from the final style-owned geometry for the current surface identity and geometry revision. Material clipping and outer surface geometry consume that same resolution. There is no material-only radius. Non-finite, unknown or incompatible geometry selects opaque fallback and a diagnostic, never an independently guessed clipping shape.
      zh-CN: 对当前 surface identity/geometry revision，仅从最终 style geometry 解析一次 bounds 与 corner radii； material clip 与外层 surface 使用同一结果，不设 material 专用 radius。 非有限、未知或不兼容 geometry 选择 opaque fallback 并诊断，不得独立猜测 clip shape。
  - id: C-FEEDBACK-MATERIAL-0001-SAFETY
    text:
      en: 'Reduced or unknown transparency preference, forced colors and unsafe/unknown contrast select complete opaque fallback without waiting for another Rule turn. Reduced or unknown motion instead constrains optional dynamic deformation to a static material path; it does not imply reduced transparency. If the selected provider lacks that static path, report its concrete missing capability and fall back. Missing, false, incompatible, stale or unproven provider/source support cannot enhance. CSS syntax probes or advertised capabilities alone do not prove source scope or committed paint.'
      zh-CN: 'reduced/unknown transparency、forced colors 与不安全/未知 contrast 选择完整 opaque fallback，不能等待下一 Rule。reduced/unknown motion 则将可选动态形变约束为静态材质，不等同 reduced transparency；选定 provider 缺失静态路径时报告具体能力缺口并回退。缺失、false、不兼容、过期或未证明的 provider/source 不能增强；CSS 语法探测或能力公告不证明来源作用域或已提交 paint。'
  - id: C-FEEDBACK-MATERIAL-0001-SEMANTICS
    text:
      en: 'Material is visual-only. Static surfaces require no interaction state. Optional finite deformation consumes existing semantic state handles through Feedback/Rule contributions; no exposed-name convention or button-press profile is universal. Resolution, fallback and resources never invent input, activation, disabled state, structural render or a second semantic owner. Pure schema/policy functions acquire no resources and publish no host paint.'
      zh-CN: 'material 仅属视觉。静态 surface 不要求交互状态；可选有限形变经 Feedback/Rule contribution 消费已有语义 state handle，不能将 expose 名字约定或 button-press profile 作为通用要求。解析、fallback 与资源不得虚构输入、激活、disabled、structural render 或第二个语义 owner。纯 schema/policy 不获取资源也不发布 host paint。'
  - id: C-FEEDBACK-MATERIAL-0001-QUALITY
    text:
      en: 'Report requested intent, actual source scope, selected backend/profile, motion override, quality and diagnostic reasons separately. Pure policy eligibility is not enhanced paint. Committed self-optical, adaptive system-native, adaptive browser-compositor, opaque-fallback and unavailable outcomes require their respective evidence; native glass cannot certify explicit liquid-glass. No finite model or successful code generation claims Apple-private parameters, cross-engine equivalence, perceived resemblance or full Prototype Compiler support.'
      zh-CN: '分别报告 requested intent、实际source scope、选定backend/profile、motion override、quality 与诊断。纯 policy eligible 不等于 enhanced paint。已提交 self-optical、adaptive system-native、adaptive browser-compositor、opaque-fallback、unavailable 分别需要实证；原生glass不能证明显式liquid-glass。有限model或代码生成成功均不代表Apple私有参数、跨引擎等价、感知相似或完整Prototype Compiler支持。'
openQuestions:
  - id: C-FEEDBACK-MATERIAL-0001-Q-RESOLVER
    question: Has the private resolver executed the finite grammar, slot, fallback, safety and ownership cases without claiming public integration?
    blocks:
      - activation:C-FEEDBACK-MATERIAL-0001
      - implementation:T-MATERIAL-VISUAL-RESULT-0001#material-visual-result-unit
  - id: C-FEEDBACK-MATERIAL-0001-Q-PROVENANCE
    question: How will the integrated final style boundary retain or inhibit selector lowering so runtime patches and all observable fill/radius contributions are validated together?
    context: The private resolver's conservative provenance input is not an implemented Rule optimizer or public material API.
    blocks:
      - activation:C-FEEDBACK-MATERIAL-0001
      - criterion:C-FEEDBACK-MATERIAL-0001#C-FEEDBACK-MATERIAL-0001-PROVENANCE
      - implementation:T-MATERIAL-VISUAL-RESULT-0001#material-style-runtime-integration
  - id: C-FEEDBACK-MATERIAL-0001-Q-ADMISSION
    question: Which real host profiles, author/Runtime surfaces and independent visual review establish this slice before any stable admission?
    context: Current style-only EffectsPort implementations and native protocol structures do not provide material support.
    blocks:
      - activation:C-FEEDBACK-MATERIAL-0001
      - criterion:C-FEEDBACK-MATERIAL-0001#C-FEEDBACK-MATERIAL-0001-SEMANTICS
      - criterion:C-FEEDBACK-MATERIAL-0001#C-FEEDBACK-MATERIAL-0001-QUALITY
      - implementation:T-MATERIAL-VISUAL-RESULT-0001#material-host-atomic-integration

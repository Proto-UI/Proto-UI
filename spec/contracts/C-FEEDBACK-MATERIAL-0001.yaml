id: C-FEEDBACK-MATERIAL-0001
type: contract
title: Finite material intent resolves one owned visual slot
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: The independent finite material channel and conservative fallback policy are accepted draft direction. Private resolver evidence, final style provenance through Rule optimization, author/Runtime integration, and real atomic host realization remain unverified; this entity grants no stable Base or provider support.
  zh-CN: 独立有限 material 通路与保守 fallback 策略是已接受的 draft 方向。 私有 resolver 证据、Rule 优化后的最终 style provenance、作者与 Runtime 接线和真实宿主原子提交仍待验证； 本实体不授予稳定 Base 或 provider 支持保证。
summary: A separate typed material channel owns one finite fill slot and resolves complete candidates or its explicit opaque fallback after final style semantics.
statement:
  en: Material intent is a separate typed visual Feedback channel, not a new token, arbitrary StyleHandle, CSS interpreter, shader program or extension of feedback.style Rule intent. A declared slot has an explicit complete opaque fallback and mutually exclusive whole-value candidates. Resolve it against final post-patch style provenance, one shared style geometry, preferences and truthful support/source facts. The first slice is a private pure resolver; public author APIs, Rule lowering and host wiring require separate evidence. Single-surface resolution does not complete group/morph, all 106 Base projections, four Web Adapters, real native hosts or Prototype Compiler work, and finite backend resource generation is not full AOT compilation.
  zh-CN: Material intent 是独立 typed visual Feedback 通路，不是新 token、任意 StyleHandle、CSS 解释器、shader 程序， 也不扩展 feedback.style Rule intent。声明的 slot 具有显式完整 opaque fallback 与互斥的 whole-value candidate。 resolver 以 post-patch 最终 style provenance、唯一共享 style geometry、偏好和可信支持/来源事实求解。 首个 slice 是私有纯 resolver；公开作者 API、Rule lowering 和宿主接线须另有证据。 单 surface 解析不等于完成 group/morph、全部 106 Base 投影、四个 Web Adapter、真实 native host 或 Prototype Compiler； 有限 backend 资源生成也不等于完整 AOT。
criteria:
  - id: C-FEEDBACK-MATERIAL-0001-GRAMMAR
    text:
      en: Admit only version 1 refractive intent with regular or clear variant, rest or pressed phase, center anchor, and an axis-aligned rounded rectangle using shared resolved style geometry. Fidelity is explicitly native-semantic or portable-model heightfield-v1; a strict portable request cannot silently become native-semantic. Reject unknown fields/models, non-finite values, arbitrary anchors, paths, URLs, textures, CSS strings and shader programs.
      zh-CN: 仅接受 version 1 refractive intent，variant 为 regular/clear，phase 为 rest/pressed，anchor 仅 center， shape 为使用共享 resolved style geometry 的轴对齐 rounded rectangle。 Fidelity 显式为 native-semantic 或 portable-model heightfield-v1；严格 portable 请求不得静默改成 native-semantic。 拒绝未知字段/model、非有限值、任意 anchor/path/URL/texture/CSS 字符串及 shader 程序。
  - id: C-FEEDBACK-MATERIAL-0001-SLOT
    text:
      en: One instance surface has at most one declared material slot. Each candidate is a complete value; no candidate-field merge or declaration-order last-write-wins is permitted. Exactly one valid active candidate may be enhanced. Zero active candidates select the declared slot fallback. Multiple active candidates or an invalid active candidate select that same fallback and emit a deterministic diagnostic. Removing the slot is a distinct tombstone, not zero active candidates.
      zh-CN: 每个实例 surface 最多声明一个 material slot。每个 candidate 必须是完整值，不允许字段合并或按声明顺序 last-write-wins。 恰好一个有效 active candidate 才可进入 enhanced。零 active candidate 选择 slot 声明的 fallback； 多个 active candidate 或无效 active candidate 选择同一 fallback 并产生确定性诊断。 移除 slot 是独立 tombstone，不等同零 active candidate。
  - id: C-FEEDBACK-MATERIAL-0001-FALLBACK
    text:
      en: A declared slot must already contain a complete resolved opaque RGBA fallback fill and foreground before candidate resolution. Components must be finite and within their declared ranges, with opaque alpha. Palette lookup failure, missing roles and palette cycles cannot invent a default or recurse into another fallback. A malformed slot fallback is rejected before candidate selection; no enhanced or valid-fallback result may be claimed from it. The foreground agrees with the final style-owned text result rather than creating a second text owner.
      zh-CN: candidate 解析前，声明的 slot 必须已具备完整 resolved opaque RGBA fallback fill 与 foreground； 各分量有限且处于声明范围内，alpha 必须不透明。Palette 查找失败、role 缺失或循环不得虚构默认值或递归 fallback。 无效 slot fallback 必须在选择 candidate 前拒绝，不得声称得到 enhanced 或有效 fallback。 foreground 与最终 style 所有的文本结果一致，不创建第二个文本 owner。
  - id: C-FEEDBACK-MATERIAL-0001-OWNERSHIP
    text:
      en: While the slot exists, material owns fill, backdrop, optical coat and its opaque fallback; style owns layout, geometry, text and border. Simultaneous observable Proto-owned style fill and material fill is invalid and diagnosed, not silently settled by style precedence. The visual result must not project competing fills. An explicit slot tombstone releases material ownership and restores the current legal style result under C-VISUAL-TRANSACTION-0001.
      zh-CN: slot 存在时，material 拥有 fill/backdrop/optical coat 及其 opaque fallback；style 拥有 layout/geometry/text/border。 可观察的 Proto style fill 与 material fill 同时存在属于无效输入并须诊断，不以隐式 style 优先级解决。 visual result 不得投影竞争 fill。显式 slot tombstone 释放 material ownership，按 C-VISUAL-TRANSACTION-0001 恢复当前合法 style。
  - id: C-FEEDBACK-MATERIAL-0001-PROVENANCE
    text:
      en: Fill conflict and geometry validation run after all setup/Rule style contributions and runtime patch, suppress and clearPatch effects. The input must account for selector-lowered Rules as well as evaluator-retained Rules. Incomplete, unknown or selector-dependent provenance cannot justify enhanced output; the first private resolver conservatively selects opaque fallback with a diagnostic. Optimizer provenance retention or inhibition is required before integrated conformance and is not supplied by this draft. Diagnostics concern only observable Proto intent, never proof about arbitrary external host CSS.
      zh-CN: fill 冲突与 geometry 校验必须晚于全部 setup/Rule style 贡献及 runtime patch/suppress/clearPatch。 输入必须同时覆盖 selector-lowered 与 evaluator-retained Rule。 不完整、未知或 selector-dependent provenance 不足以支持 enhanced；首个私有 resolver 保守选择 opaque fallback 并诊断。 集成符合性之前须实现 optimizer provenance 保留或禁止该优化，本 draft 不代表已实现。 诊断仅涉及可观察 Proto intent，不证明任意外部 host CSS 的行为。
  - id: C-FEEDBACK-MATERIAL-0001-GEOMETRY
    text:
      en: Resolve surface bounds and corner radii once from the final style-owned geometry for the current surface identity and geometry revision. Material clipping and outer surface geometry consume that same resolution. There is no material-only radius. Non-finite, unknown or incompatible geometry selects opaque fallback and a diagnostic, never an independently guessed clipping shape.
      zh-CN: 对当前 surface identity/geometry revision，仅从最终 style geometry 解析一次 bounds 与 corner radii； material clip 与外层 surface 使用同一结果，不设 material 专用 radius。 非有限、未知或不兼容 geometry 选择 opaque fallback 并诊断，不得独立猜测 clip shape。
  - id: C-FEEDBACK-MATERIAL-0001-SAFETY
    text:
      en: In this first conservative profile, reducedMotion, reducedTransparency, forced colors, or unsafe/unknown contrast select the complete opaque fallback. Unknown relevant preferences also select fallback. Missing, false, unknown, incompatible or unproven provider/source support must not enable enhancement. A CSS syntax probe or advertised capability alone is not source or rendering evidence. No preference loss waits for a later Rule turn to restore opaque output.
      zh-CN: 首个保守 profile 中，reducedMotion、reducedTransparency、forced colors 或不安全/未知 contrast 均选择完整 opaque fallback； 相关偏好未知也选择 fallback。Provider/source 支持缺失、false、未知、不兼容或未证实均不得启用 enhanced。 CSS 语法探针或 capability 声明本身不构成来源或渲染证据；偏好失效不得等待后续 Rule 才恢复 opaque 输出。
  - id: C-FEEDBACK-MATERIAL-0001-SEMANTICS
    text:
      en: 'Material rest/pressed intent consumes the existing Base semantic state. Resolution, fallback and resource changes are visual-only: they never invent pointer input, activation, disabled state, structural render or another semantic owner. The pure resolver performs no host writes, resource acquisition, DOM reads or public API export by itself.'
      zh-CN: material rest/pressed intent 消费既有 Base semantic state。解析、fallback 与资源变化仅属视觉， 不得虚构 pointer input/activation/disabled state、触发 structural render 或创建第二个 semantic owner。 纯 resolver 本身不写宿主、不获取资源、不读取 DOM，也不构成公开 API export。
  - id: C-FEEDBACK-MATERIAL-0001-QUALITY
    text:
      en: 'Report resolved quality and reason truthfully: native-semantic, portable-model, opaque-fallback or unavailable. An admitted finite model is not a claim of Apple-private optical parameters, native availability, cross-engine equivalence, perceived resemblance or complete compiler support. Rejection and conservative coarsening remain observable rather than masquerading as enhancement.'
      zh-CN: 如实报告 quality/reason：native-semantic、portable-model、opaque-fallback 或 unavailable。 有限 model 不代表 Apple 私有光学参数、native 可用性、跨引擎等价、主观相似度或完整 compiler 支持。 拒绝与保守降级保持可观察，不冒充 enhanced。
openQuestions:
  - id: C-FEEDBACK-MATERIAL-0001-Q-RESOLVER
    question: Has the private resolver executed the finite grammar, slot, fallback, safety and ownership cases without claiming public integration?
    blocks:
      - activation:C-FEEDBACK-MATERIAL-0001
      - implementation:T-MATERIAL-VISUAL-RESULT-0001#material-visual-result-unit
  - id: C-FEEDBACK-MATERIAL-0001-Q-PROVENANCE
    question: How will the integrated final style boundary retain or inhibit selector lowering so runtime patches and all observable fill/radius contributions are validated together?
    context: The private resolver's conservative provenance input is not an implemented Rule optimizer or public material API.
    blocks:
      - activation:C-FEEDBACK-MATERIAL-0001
      - criterion:C-FEEDBACK-MATERIAL-0001#C-FEEDBACK-MATERIAL-0001-PROVENANCE
      - implementation:T-MATERIAL-VISUAL-RESULT-0001#material-style-runtime-integration
  - id: C-FEEDBACK-MATERIAL-0001-Q-ADMISSION
    question: Which real host profiles, author/Runtime surfaces and independent visual review establish this slice before any stable admission?
    context: Current style-only EffectsPort implementations and native protocol structures do not provide material support.
    blocks:
      - activation:C-FEEDBACK-MATERIAL-0001
      - criterion:C-FEEDBACK-MATERIAL-0001#C-FEEDBACK-MATERIAL-0001-SEMANTICS
      - criterion:C-FEEDBACK-MATERIAL-0001#C-FEEDBACK-MATERIAL-0001-QUALITY
      - implementation:T-MATERIAL-VISUAL-RESULT-0001#material-host-atomic-integration

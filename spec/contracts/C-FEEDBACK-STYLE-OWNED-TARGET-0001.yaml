id: C-FEEDBACK-STYLE-OWNED-TARGET-0001
type: contract
title: Draft owned decorative style target boundary
status: draft
since: 0.3.0-alpha.1
summary: 'Draft owner-lived decoration addressing with generation-scoped physical views; bounded Web adapter implementation remains under review. Tracks #935 and #957.'
statement:
  en: This draft defines the minimum law for owned decorative targets of existing feedback.style. Bounded experimental Web Component, React, Vue and Vue2 implementations use setup declareDecoration, style.to(target).use and r.decoration(target). It does not establish stable or portable support. Existing style contribution semantics remain authoritative; no Tabs-specific path is introduced.
  zh-CN: 本草案定义既有 feedback.style 自有装饰目标的最小法则。受限实验实现探索 light-DOM Web Component、React、Vue 与 Vue2 的 setup 身份、定点样式贡献与空装饰叶绑定，不构成稳定或可移植支持；既有样式贡献语义优先，不引入 Tabs 专用通道。
criteria:
  - id: C-FEEDBACK-STYLE-OWNED-TARGET-0001-IDENTITY
    text:
      en: A target identity is setup-created, opaque, scoped to one logical instance lifetime, independent of debug names and host nodes, and cannot be forged, shared across instances or reused after disposal.
      zh-CN: 目标身份在 setup 创建，为单一逻辑实例生命周期内的 opaque 身份，不以 debugName 或宿主节点为键；不得伪造、跨实例共享或在释放后复用。
  - id: C-FEEDBACK-STYLE-OWNED-TARGET-0001-BINDING
    text:
      en: Within one physical view lease, one target binds exactly one framework-owned decorative leaf in the declared Template. Duplicate, foreign, slot, caller-owned, PrototypeRef and host-root bindings fail closed before mutation. Style updates never create, remove, replace or rebind nodes.
      zh-CN: 在一个物理 view lease 中，一个目标仅绑定声明 Template 中一个框架拥有的装饰叶节点；重复、外来、slot、用户节点、PrototypeRef 及宿主根绑定必须在修改前拒绝。样式更新不得创建、移除、替换或重绑节点。
  - id: C-FEEDBACK-STYLE-OWNED-TARGET-0001-CONTRIBUTION
    text:
      en: Existing setup and Rule style contributions remain style-only and merge independently per target using the existing semantic law. Rule invalidation withdraws only its own contribution; host and other targets remain unchanged.
      zh-CN: 既有 setup 与 Rule 样式贡献仍为纯样式，并按既有语义法则为各目标独立合并。Rule 失效只撤回自身贡献，不改宿主及其他目标。
  - id: C-FEEDBACK-STYLE-OWNED-TARGET-0001-LIFETIME
    text:
      en: A committed target replays its current merged style without rendering. Temporary view detachment revokes physical sinks while preserving the live owner, opaque identities and logical contributions. A new signalled view generation validates and binds the complete same target set before reveal; stale release, ref and acknowledgement callbacks cannot mutate or revive it. Structural rebind within a live view remains rejected. An exact immutable full-Template reevaluation may reuse a successfully committed current view without rebinding, while retaining commit acknowledgement and current caller slot projection; changed structure or static payload still rejects. Terminal instance disposal removes bindings, contributions and subscriptions and prevents later physical writes. Unknown, unavailable or unsupported targets reject explicitly, with no silent host fallback.
      zh-CN: 目标提交绑定后无需 render 即回放当前合并样式；临时 view detach 撤销物理 sink，但保留活 owner、opaque 身份及逻辑贡献。 新的已通知 view generation 须在 reveal 前验证并完整绑定同一目标集；旧 release、ref 与 ack 不得修改或复活新 view，同一活 view 内结构重绑仍拒绝。完全相同的不可变完整 Template 重求值可复用已成功提交且仍有效的 view，但不得重新绑定，并须保留 commit ack 和当前 caller slot 投影；结构或静态内容变化仍拒绝。实例终止释放必须移除绑定、贡献及订阅，禁止后续物理写入。未知、不可用或不支持目标须明确拒绝，不得静默回落宿主。
  - id: C-FEEDBACK-STYLE-OWNED-TARGET-0001-NO-RESET
    text:
      en: Style changes retain owned node and caller slot identities, value and selection handles, focus and selection ranges. No state/event ownership, selector query, arbitrary host attribute, behavior IR, generic keyed diff or arbitrary reparent guarantee is added. Same-document portal paint requires a current physical-view lease and an authoritative committed portal epoch. A private adapter-owned caller relocation may retain an existing child view only with an exact destination ancestry, unchanged document and owner, and a single-use synchronous reconnect receipt; it does not authorize an explicit child structural update.
      zh-CN: 样式变化必须保留自有节点及用户 slot 身份、值及选择句柄、焦点与选区；不新增状态/事件所有权、selector 查询、任意宿主属性、行为 IR、通用 keyed diff 或任意 reparent 保证；同文档 portal 绘制同时要求当前物理 view lease 和已提交的公共 portal epoch。adapter 自有 caller 搬运仅在目的祖先身份、文档与 owner 不变且具有单次同步 reconnect 凭据时保留既有子 view，不授权显式子模板结构更新。
  - id: C-FEEDBACK-STYLE-OWNED-TARGET-0001-DECORATIVE
    text:
      en: 'A target is permanently decorative: accessibility-hidden without layout hiding, not focusable, no actions, names, events or caller content. Reuse governed A11y projection where applicable; never hide the owning control or its slot. Arbitrary Template props and DOM attributes remain prohibited.'
      zh-CN: 目标永久为装饰：退出无障碍树但不隐藏布局，不可聚焦，无 action、名称、事件或用户内容。可适用处复用受治理 A11y 投影，不得隐藏所属控件或其 slot；仍禁止任意 Template props 及 DOM 属性。
  - id: C-FEEDBACK-STYLE-OWNED-TARGET-0001-SUPPORT
    text:
      en: Each adapter must explicitly implement or reject the capability. Accepted types, draft contracts, static inspection and planned tests do not establish runtime or cross-adapter support. PrototypeRef rejection remains unchanged.
      zh-CN: 每个 adapter 必须明确实现或拒绝能力；类型接受、草案、静态审查及计划测试均不构成运行时或跨 adapter 支持证明。PrototypeRef 拒绝规则不变。
openQuestions:
  - id: C-FEEDBACK-STYLE-OWNED-TARGET-0001-Q-API
    question:
      en: Which setup identity and Template binding API preserves serializable style values without exposing physical nodes?
      zh-CN: 哪种 setup 身份及 Template 绑定 API 能保留可序列化样式值而不暴露物理节点？
    blocks:
      - activation:C-FEEDBACK-STYLE-OWNED-TARGET-0001
  - id: C-FEEDBACK-STYLE-OWNED-TARGET-0001-Q-A11Y
    question:
      en: How should fixed decorative accessibility exclusion reuse A11y projection for an owned leaf, given the current AccessibleHandle only targets its logical instance?
      zh-CN: 当前 AccessibleHandle 仅作用于其逻辑实例，固定装饰叶节点的无障碍排除应如何复用 A11y 投影？
    blocks:
      - activation:C-FEEDBACK-STYLE-OWNED-TARGET-0001
  - id: C-FEEDBACK-STYLE-OWNED-TARGET-0001-Q-VIEW-LIFETIME
    question:
      en: What explicit view-lifetime rule distinguishes pending first binding from unsupported structural replacement or rematerialization without promising generic keyed diff?
      zh-CN: 哪种明确 view 生命周期规则区分首次待绑定与不支持的结构替换/再物化，而不冒许通用 keyed diff？
    blocks:
      - activation:C-FEEDBACK-STYLE-OWNED-TARGET-0001

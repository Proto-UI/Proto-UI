lifecycleRationale:
  en: Owned target API, owned-leaf accessibility binding and view lifetime remain explicit review questions. The bounded Web adapter candidates have DOM/framework evidence, not native accessibility acceptance or portable compiler support. React asynchronous Activity retention beyond the existing same-turn owner disposal window is an independently reproduced pre-existing gap; this draft does not revive disposed owners or declare that gap solved. Draft status and stable-admission blockers remain unchanged.

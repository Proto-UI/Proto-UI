revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Admitted a draft Field contract candidate within the user-directed Finf scope; no stable or complete
      native guarantee.
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Independent review FIELD-R1/R2 made two-way policy invalidation and dense atomic payload admission
      explicit; preserved pending recovery and error identity.

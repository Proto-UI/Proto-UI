dependsOn:
  contracts:
    - C-EVENT-0003
    - C-LIFECYCLE-0002
revisions:
  - version: 0.1.0
    change: introduced
    summary: Captured automatic cleanup and transparent target migration semantics for event bindings.
  - version: 0.2.0
    change: strengthened
    summary: Required target preflight, zero new listeners on target-resolution failure, and explicit complete-plan retry while leaving attachment and cleanup failure semantics open.
tags:

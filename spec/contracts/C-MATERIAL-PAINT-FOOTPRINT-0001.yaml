openQuestions:
  - id: C-MATERIAL-PAINT-FOOTPRINT-0001-Q-SYNTAX
    question: Which independently reviewable host association and reservation-part declaration realizes these responsibilities without page-specific observers, portable geometry or a new runtime bus?
    blocks: [activation:C-MATERIAL-PAINT-FOOTPRINT-0001]
  - id: C-MATERIAL-PAINT-FOOTPRINT-0001-Q-NATIVE
    question: Which exact-source four-Web layout, optical, accessibility and measured resource evidence admits the reservation and unavailable-to-fallback behavior?
    blocks: [activation:C-MATERIAL-PAINT-FOOTPRINT-0001]

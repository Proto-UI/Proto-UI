id: C-FEEDBACK-SHADER-PRESENTATION-0001
type: contract
title: Audited finite shader presentation preserves authored material ownership
status: draft
since: 0.3.0-alpha.2
summary: One immutable pixel or explicitly bound scene pass graph has bounded resources, opaque fallback and view/source retirement.
lifecycleRationale:
  en: The owned-pixels and explicitly bound canvas-scene slices require independent current-source browser and Runtime/Compiler evidence. Other application source providers, additional kernels and native GPU backends retain separate acceptance.
statement:
  en: def.feedback.material.shader registers one setup-only data declaration on the existing material Feedback channel. It is exclusive with ordinary shared/private material slots and with presence/resident motion until an atomic combined contract is implemented. A graph contains symbolic resources and audited kernel identities, never shader text, URLs, DOM/GPU objects or author callbacks. Semantic component state and foreground remain authored responsibilities.
criteria:
  - id: C-FEEDBACK-SHADER-PRESENTATION-0001-SNAPSHOT
    text:
      en: Snapshot all records and arrays through own enumerable data properties without invoking accessors. Reject unknown fields, foreign prototypes, holes, nonfinite numbers, unrecognized source/kernel/interface versions and alpha-inconsistent source bytes. Copy and freeze all input data before setup registration; later caller mutation cannot change active work. The disposer is setup-only and idempotent.
  - id: C-FEEDBACK-SHADER-PRESENTATION-0001-GRAPH
    text:
      en: Version 1 admits owned-pixels data or an owned-scene source with one finite slot identifier. Owned pixels are dense RGBA8 in top-left row-major order, linear-sRGB color and premultiplied alpha. An owned-scene declaration contains no host capability; its explicit host binding supplies converted data with the same resource interface. Each ordered pass writes a new same-extent RGBA8 resource, reads only the source or an earlier pass and uses copy-rgba8-v1 or tint-rgba8-v1. Copy has no uniform. Tint uses a complete straight linear RGBA multiplier; output RGB multiplies input RGB by tint RGB and tint alpha, and output alpha multiplies input alpha by tint alpha. Each pass rounds into RGBA8. The declared output names the final ordered pass. Cycles, current-attachment reads, writable external resources, arbitrary storage and implicit historical feedback reject.
  - id: C-FEEDBACK-SHADER-PRESENTATION-0001-BOUNDS
    text:
      en: Width and height are positive safe integers at most 1024; source has at most 262144 texels; there are 1 through 16 passes. Total source plus intermediate resource storage is at most 16 MiB. Reject invalid static declarations before allocation; an owned-scene binding checks these extent, texel and aggregate resource bounds against every resolved frame before upload. These storage limits do not claim GPU performance or responsiveness.
  - id: C-FEEDBACK-SHADER-PRESENTATION-0001-LIFETIME
    text:
      en: A physical root and owner Document identify a view binding; monotonically ordered view/revision frames select the current preparation generation. The shader frame's view is an owner-local physical binding generation, advanced on capability replacement or remount rather than copied from the mount epoch. A restored capability gets a fresh generation; repeated selection of the same current capability does not reacquire it. Retire replaced roots, Documents, views and generations before a new publication. A stale decoded image or callback cannot paint, resurrect a retired owner or release its replacement's resource. Failed partial acquisition releases in reverse acquisition order and all resources release at most once, including cleanup exceptions and reentrant disposal. No perpetual RAF, global source subscription or hidden owner is created. A selected owned-scene binding borrows only its explicit source subscription and retires that subscription with the physical view.
  - id: C-FEEDBACK-SHADER-PRESENTATION-0001-FALLBACK
    text:
      en: A complete opaque sRGB fallback fill accompanies every declaration. The Web provider preserves authored foreground, geometry and children, uses no input-intercepting canvas, and shows the fallback while preparing or when support, compilation, allocation, decode, ownership, source identity or context is unavailable. Shader pixels cannot replace the fallback until the current complete output is decoded and its binding remains current. Missing sink capability is an explicit unsupported result with ordinary authored style only, not an opaque-fallback paint success claim.
  - id: C-FEEDBACK-SHADER-PRESENTATION-0001-SCENE
    text:
      en: An owned-scene slot is an identifier of 1 through 64 ASCII letters, digits, underscore or hyphen, beginning with a letter. The Web draft binds it explicitly at the application host boundary to a borrowed immutable canvas-frame lease. The whole scene texture maps to normalized surface UV, as owned-pixels does; this is not a surface-aligned crop, in-app-backdrop, behind-window capture or an alias for either source kind. Source frames are opaque sRGB8 and are independently copied, decoded and quantized to linear premultiplied RGBA8 before upload. Scope follows composed ancestry, including ShadowRoots and slots, within one current Document. A provider publishes immutable identity/revision frames and notifies every change or revocation. Regressed or same-revision replacement frames reject. Source loss or replacement retires old pending publication; an old notification, getter result, subscription acquisition or decode cannot acquire or repaint a replacement owner. Hosts unsubscribe their borrowed observation but never draw, revoke or dispose the application source.
  - id: C-FEEDBACK-SHADER-PRESENTATION-0001-LOWERING
    text:
      en: Runtime and Compiler consume the same validated data and host publication contract. Compiler admission and serialized IR preserve immutable interfaces and explicit ordered resource dependencies. The current native Web profile admits inline own-data graphs and statically proved immutable local or module aliases, including renamed or re-exported pure finite-data factories. The proof follows binding identity, evaluated arguments and defaults, finite own-data construction and selected control flow without executing author JavaScript. Mutation, escaping containers, effectful or recursive construction and unproved inputs remain explicit unsupported coverage rather than forbidden public semantics. Admitted output specializes the actual pass sequence into direct allocation and audited pass calls, without a graph evaluator, Prototype protocol copy or Runtime/Adapter import in the generated module. Unimplemented targets diagnose instead of dropping the declaration. Every emitted kernel records the exact first-party source digest; support code is a host resource atom rather than a semantic graph interpreter.
openQuestions:
  - id: C-FEEDBACK-SHADER-PRESENTATION-0001-Q-ADMISSION
    question: Which independently reviewed Runtime, native consumer and actual browser receipts establish stable admission of the bounded pixel and explicitly bound canvas-scene profiles?
    context: Executable cases and a reviewed draft do not promote this entity. The new canvas-scene profile does not close the original inventory of all application backing-source families. Other source providers, kernels and non-Web backends retain their original conditions.
    blocks:
      - activation:C-FEEDBACK-SHADER-PRESENTATION-0001

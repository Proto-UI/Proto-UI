revisions:
  - version: 0.3.0-alpha.2
    change: revised
    summary: Add a draft whole-texture owned-scene slot with explicit borrowed canvas binding, conversion and source retirement; retain separate independent browser, other-family and backend acceptance.
  - version: 0.3.0-alpha.2
    change: revised
    summary: Extend the draft native Web coverage to proved immutable aliases and pure finite-data factories while retaining unknown construction, application sources and native GPU acceptance boundaries.
  - version: 0.3.0-alpha.2
    change: introduced
    summary: Define bounded owned pixels, audited pass interfaces, resource lifetime and independent Runtime/Compiler evidence under the existing effect-graph direction.

revisions:
  - version: 0.1.0
    change: introduced
    summary: Drafted a placeholder for `applyRawProps` scheduling semantics pending runtime and host-cap analysis.
  - version: 0.1.0
    change: revised
    summary: Promoted `applyRawProps` runtime/controller behavior to active criteria while keeping core update/render commit ownership open.
  - version: 0.3.0-alpha.2
    change: revised
    summary: Resolved C-PROPS-0014-Q-CORE-UPDATE-OWNER by binding positive update-flow ownership to the existing C-LIFECYCLE-0003 and its C-LIFECYCLE-0002 ordering dependency. Retained all five active criteria, lifecycle draft statuses and existing host/profile compatibility; this ownership resolution is not lifecycle promotion.

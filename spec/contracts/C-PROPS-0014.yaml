id: C-PROPS-0014
type: contract
title: applyRawProps updates the props channel without implicit render commit
status: active
since: 0.1.0
summary: Applying `raw props` through the controller may update props state and trigger watchers, but should not itself imply render commit.
statement:
  zh-CN: >-
    `controller.applyRawProps(nextRaw)` 是 runtime/controller 层用于向 Props channel 应用新的 `raw props snapshot` 的动作，不是原型作者通过 `def.props` 或 `run.props` 使用的 API。该动作必须走 Props channel 的 raw/resolved resolution 与 watcher dispatch 语义，因此可以触发 raw 或 resolved watcher；但它不得隐式触发 render commit。`run.update()` 与 runtime render commit 的正向调度归属由已有的 `C-LIFECYCLE-0003` 承接，已接受 update cycle 的顺序继续由其依赖 `C-LIFECYCLE-0002` 定义。这一责任绑定不改变两条 lifecycle 契约的 draft 状态，也不将其全部方向提升为本契约的 active 保证；本契约的五条 active criteria 保持 Props 通路与 render commit 的既有边界。


  en: >-
    `controller.applyRawProps(nextRaw)` is a runtime/controller action for applying a new `raw props snapshot` to the Props channel. It is not a prototype-author API exposed through `def.props` or `run.props`. This action must use the Props channel's raw/resolved resolution and watcher-dispatch semantics, so it may trigger raw or resolved watchers; however, it must not implicitly trigger a render commit. The existing `C-LIFECYCLE-0003` owns positive scheduling for `run.update()` and runtime render commits; its dependency `C-LIFECYCLE-0002` defines the order of an accepted update cycle. This ownership binding does not change either lifecycle contract's draft status or promote all of its direction into this contract's active guarantees. The five active criteria here retain the existing boundary between the Props channel and render commit.


criteria:
  - id: C-PROPS-0014-A
    text:
      zh-CN: '`controller.applyRawProps(nextRaw)` 必须被建模为 runtime/controller 动作，而不是 `def.props` 或 `run.props` 的原型作者 API。'
      en: '`controller.applyRawProps(nextRaw)` must be modeled as a runtime/controller action, not as a prototype-author API on `def.props` or `run.props`.'
  - id: C-PROPS-0014-B
    text:
      zh-CN: '`applyRawProps(nextRaw)` 必须将 `nextRaw` 作为新的 `raw props snapshot` 应用到 Props channel。'
      en: '`applyRawProps(nextRaw)` must apply `nextRaw` to the Props channel as the new `raw props snapshot`.'
  - id: C-PROPS-0014-C
    text:
      zh-CN: 若该 raw props 应用产生 raw 或 resolved diff，`applyRawProps` 必须允许对应 watcher 按 `C-PROPS-0011` 与 `C-PROPS-0012` 的规则 dispatch。
      en: If the raw props application produces raw or resolved diffs, `applyRawProps` must allow the corresponding watchers to dispatch according to `C-PROPS-0011` and `C-PROPS-0012`.
  - id: C-PROPS-0014-D
    text:
      zh-CN: 由 `applyRawProps` 触发的 watcher callback 必须遵守 `C-PROPS-0013` 的 `run handle` 绑定规则。
      en: Watcher callbacks triggered by `applyRawProps` must follow the `run handle` binding rules defined by `C-PROPS-0013`.
  - id: C-PROPS-0014-E
    text:
      zh-CN: '`applyRawProps` 本身不得隐式触发 render commit。'
      en: '`applyRawProps` itself must not implicitly trigger a render commit.'
    rationale:
      zh-CN: Props 输入变化只更新 Props channel 并派发 watcher；原型作者层的 `run.update()` 与 runtime 层的 render commit 是不同 API，其正向触发责任由 `C-LIFECYCLE-0003` 承接。显式 runtime/controller 或 host update 入口与 Props 通路行为分开；宿主策略的选择和兼容不改变 `applyRawProps` 自身的边界。
      en: Props input changes update the Props channel and dispatch watchers; prototype-author-level `run.update()` and runtime-level render commit are separate APIs whose positive triggering responsibility belongs to `C-LIFECYCLE-0003`. Explicit runtime/controller or host update entry points remain separate from Props channel behavior; host policy selection and compatibility do not change the boundary of `applyRawProps` itself.

dependsOn:
  contracts:
    - C-LIFECYCLE-0001
    - C-LIFECYCLE-0005
openQuestions:
  - id: C-LIFECYCLE-0002-Q-CALLBACK-ERRORS
    question:
      zh-CN: 除 I 治理的已取得 instance 的同步 `created` 失败外，lifecycle callback 抛错后的传播、后续 callback 是否继续执行、以及是否进入 dispose 是否应由本契约定义？
      en: Beyond the acquired-instance synchronous `created` failure governed by I, should this contract define error propagation, whether later lifecycle callbacks continue, and whether disposal proceeds after a lifecycle callback throws?
    context:
      zh-CN: I 只关闭同步创建失败的原始错误与可达资源清理边界；其它 callback 的传播、继续执行与恢复仍是 adapter/runtime 断口，不因此提升 draft lifecycle。
      en: I closes only the initiating-error and reachable-resource cleanup boundary for synchronous failed creation. Propagation, continuation, and recovery for other callbacks remain a runtime/adapter gap, without promoting this draft lifecycle.
    blocks:
      - C-LIFECYCLE-0002
revisions:
  - version: 0.1.0
    change: introduced
    summary: Drafted the prototype-visible lifecycle callback ordering contract.
  - version: 0.1.0
    change: revised
    summary: Resolved the `created` protoPhase exposure gap as an implementation follow-up without changing the callback ordering criteria.
  - version: 0.1.0
    change: revised
    summary: Clarified that lifecycle commit ordering is based on host commit completion rather than synchronous function-call completion.
  - version: 0.1.0
    change: revised
    summary: Moved lifecycle API surface syntax ownership to `C-LIFECYCLE-0005` while keeping callback invocation ordering here.
  - version: 0.1.0
    change: revised
    summary: Separated repeatable mount epochs from terminal instance disposal.
  - version: 0.3.0-alpha.1
    change: revised
    summary: 'Defined the accepted acquired-instance synchronous created-failure boundary: preserve the initiating thrown value while completing reachable terminal cleanup; broader callback error recovery remains open and draft.'

id: C-LIFECYCLE-0002
type: contract
title: Prototype-visible lifecycle callbacks follow canonical runtime order
status: draft
since: 0.1.0
summary: Proto UI exposes one instance lifetime containing zero or more repeatable mount epochs before terminal disposal.
statement:
  zh-CN: >-
    Proto UI 的原型可见生命周期 API 必须映射到一个 instance lifetime 与零个或多个 mount epoch：`setup -> created -> (mount -> render -> commit -> mounted -> update cycles -> unmount -> unmounted)*n -> beforeDispose -> dispose`。`created` 每个 instance 一次；`mounted` 与 `unmounted` 每个成功进入的 mount epoch 至多一次；`unmounted` 只结束当前 epoch，不得隐含 terminal dispose。


  en: >-
    Proto UI's prototype-visible lifecycle API must map to one instance lifetime containing zero or more mount epochs: `setup -> created -> (mount -> render -> commit -> mounted -> update cycles -> unmount -> unmounted)*n -> beforeDispose -> dispose`. `created` runs once per instance; `mounted` and `unmounted` run at most once for each entered mount epoch; `unmounted` ends only that epoch and must not imply terminal disposal.


criteria:
  - id: C-LIFECYCLE-0002-A
    text:
      zh-CN: 通过 `C-LIFECYCLE-0005` 定义的 prototype-visible lifecycle API 注册的 callback，必须由 runtime 生命周期流程调用，而不是在注册时立即执行。
      en: Callbacks registered through the prototype-visible lifecycle API defined by `C-LIFECYCLE-0005` must be invoked by runtime lifecycle flow rather than immediately during registration.
  - id: C-LIFECYCLE-0002-B
    text:
      zh-CN: '`created` callback 必须在 `setup` 完成之后、首次 render 与首次 commit 之前执行。'
      en: '`created` callbacks must run after `setup` completes and before the first render and first commit.'
  - id: C-LIFECYCLE-0002-C
    text:
      zh-CN: 首次 render 必须在 `created` 之后执行，并且首次 commit 必须应用该 render 的输出。
      en: The first render must run after `created`, and the first commit must apply that render output.
  - id: C-LIFECYCLE-0002-D
    text:
      zh-CN: '`mounted` callback 必须在当前 mount epoch 的 commit 完成之后执行；若该 epoch 在 callback 执行前已经 unmount，已排队的 callback 必须失效。'
      en: '`mounted` callbacks must run after commit completion for the current mount epoch; if that epoch unmounts before the callback runs, the queued callback must become ineffective.'
  - id: C-LIFECYCLE-0002-E
    text:
      zh-CN: 每个被接受的 update cycle 必须按照 `update intent -> render -> commit completion -> updated` 的顺序执行；`updated` callback 不得早于对应 update commit completion。
      en: Each accepted update cycle must execute in `update intent -> render -> commit completion -> updated` order; `updated` callbacks must not run before the corresponding update commit completion.
  - id: C-LIFECYCLE-0002-F
    text:
      zh-CN: '`unmounted` callback 必须在当前 mount epoch 结束时执行；此时实例仍 alive，instance-scoped handle 必须继续可用。'
      en: '`unmounted` callbacks must run when the current mount epoch ends; the instance remains alive and instance-scoped handles must remain usable.'
  - id: C-LIFECYCLE-0002-G
    text:
      zh-CN: terminal dispose 必须与 repeatable unmount 分离；dispose 完成后受 runtime lifecycle 管理的 facade、port 与 handle 必须失效。
      en: Terminal disposal must be separate from repeatable unmount; after disposal, runtime-managed facades, ports, and handles must be invalid.
  - id: C-LIFECYCLE-0002-H
    text:
      zh-CN: 同一 Proto instance 可以经历多个 mount epoch，后续 mount 不得重新执行 setup 或 created。
      en: One Proto instance may experience multiple mount epochs; later mounts must not rerun setup or created.
  - id: C-LIFECYCLE-0002-I
    text:
      zh-CN: Runtime 已取得 instance 后，若同步 `created` callback 抛错，必须在重新抛出同一原始值之前完成所有可达的已取得资源的 terminal cleanup，取消已排队的 Delay 并使 instance-scoped handle 失效。清理 callback、diagnostic 或 release 的次级错误不得替换该原始值；该边界不承诺回收未返回资源的失败 factory，也不定义其它 lifecycle callback 的一般错误恢复。
      en: After Runtime acquires an instance, a synchronous `created` callback failure must complete all reachable acquired-resource terminal cleanup, cancel queued Delay work, and invalidate instance-scoped handles before rethrowing the identical initiating value. Secondary cleanup callback, diagnostic, or release errors must not replace that value. This boundary does not promise to reclaim resources never returned by a failing factory or define general error recovery for other lifecycle callbacks.

revisions:
  - version: 0.3.0-alpha.0
    change: introduced
    summary: >-
      Introduced the draft Image View projection decision for the host-owned image presentation target with opaque URI source, explicit a11y binary input, and generation-bound lease.


  - version: 0.3.0-alpha.0
    change: refined
    summary: Added the bounded Web image host and three official Web Adapter realization boundary without widening the decision to multi-host conformance.


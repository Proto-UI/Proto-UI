revisions:
  - version: 0.3.0-alpha.0
    change: introduced
    summary: >-
      Introduced the draft host-owned Image View projection decision with opaque URI source, explicit a11y binary input, generation-bound lease semantics, a request-scoped Web cache-hit/decode readiness mapping, and bounded Web Component, React, and Vue realization boundaries without claiming multi-host conformance.



id: D-WEB-SURFACE-NORMALIZATION-0001
type: decision
title: Styled Web native form controls receive a scoped neutral normalization
status: draft
since: 0.3.0-alpha.0
summary: Generated Web physical token CSS neutralizes user-agent form-control defaults only on styled Proto UI native surfaces, at zero specificity and below Prototype token rules.
statement:
  zh-CN: >-
    Web physical token CSS 必须在 `@layer proto-ui` 内、所有 Prototype token rule 之前，以零 specificity selector `:where(button[data-pui-style], input[data-pui-style], select[data-pui-style], textarea[data-pui-style])` 为进入 Proto UI style projection 的原生表单控件提供中立 user-agent normalization。该 normalization 必须让 font shorthand、font feature/variation settings、letter spacing 与 color 继承，并把 margin、padding、border、background 与 opacity 复位到中立值；不得匹配没有 `data-pui-style` 的元素。其低 specificity 与 source order 必须允许后续 Prototype token rule 以及 consumer 显式 surface class/style 覆盖这些默认值。使用 named layers 的 host 必须在相关 layer 首次声明前建立 `generated theme defaults < reset/base < proto-ui < explicit consumer layers`；生成入口必须以 `@layer theme, proto-ui;` 预留这两个 slot，并把生成的 theme defaults import 放入较低的 `theme` layer，使更后的 named consumer layer 或 unlayered consumer CSS 能够提供 authoritative variable values。该入口不能追溯重排已有 layer。


  en: >-
    Web physical token CSS must provide a neutral user-agent normalization for native form controls that enter Proto UI style projection, using the zero-specificity selector `:where(button[data-pui-style], input[data-pui-style], select[data-pui-style], textarea[data-pui-style])` inside `@layer proto-ui` and before every Prototype token rule. The normalization must inherit the font shorthand, font feature and variation settings, letter spacing, and color, and reset margin, padding, border, background, and opacity to neutral values. It must not match elements without `data-pui-style`. Its low specificity and source order must allow subsequent Prototype token rules and explicit consumer surface class or style to override these defaults. A host using named layers must establish `generated theme defaults < reset/base < proto-ui < explicit consumer layers` before any relevant layer is first declared. The generated entry must reserve the two owned slots with `@layer theme, proto-ui;` and place the generated theme-default import in the lower `theme` layer so later named consumer layers or unlayered consumer CSS can provide authoritative variable values. The entry cannot retroactively reorder an existing layer.


criteria:
  - id: D-WEB-SURFACE-NORMALIZATION-0001-A
    text:
      zh-CN: 生成的 Web physical token CSS 必须使用且只使用 `:where(button[data-pui-style], input[data-pui-style], select[data-pui-style], textarea[data-pui-style])` 作为这组原生表单控件 normalization 的 selector；整个 selector 的 specificity 必须为零。
      en: Generated Web physical token CSS must use exactly `:where(button[data-pui-style], input[data-pui-style], select[data-pui-style], textarea[data-pui-style])` as the normalization selector for this native form-control set, and the whole selector must have zero specificity.
  - id: D-WEB-SURFACE-NORMALIZATION-0001-B
    text:
      zh-CN: 该 rule 必须位于 `@layer proto-ui` 内且先于所有 Prototype token rule 输出，使相同 presentation surface 上的 token rule 可以按 source order 覆盖 normalization。
      en: The rule must be emitted inside `@layer proto-ui` and before every Prototype token rule so token rules on the same presentation surface can override the normalization by source order.
  - id: D-WEB-SURFACE-NORMALIZATION-0001-C
    text:
      zh-CN: >-
        Normalization 必须声明 `font: inherit`、`font-feature-settings: inherit`、`font-variation-settings: inherit`、`letter-spacing: inherit` 与 `color: inherit`，并以 `margin: 0`、`padding: 0`、`border: 0`、`background: transparent`、`opacity: 1` 消除会干扰 Prototype visual intent 的 user-agent 控件默认值。


      en: >-
        The normalization must declare `font: inherit`, `font-feature-settings: inherit`, `font-variation-settings: inherit`, `letter-spacing: inherit`, and `color: inherit`, and remove user-agent control defaults that interfere with Prototype visual intent through `margin: 0`, `padding: 0`, `border: 0`, `background: transparent`, and `opacity: 1`.


  - id: D-WEB-SURFACE-NORMALIZATION-0001-D
    text:
      zh-CN: 没有 `data-pui-style` 的 button、input、select、textarea 与其他宿主内容不得被该 rule 修改；该 decision 不授权裸 tag selector、universal selector、document-wide reset 或 theme stylesheet patch。
      en: Buttons, inputs, selects, textareas, and other host content without `data-pui-style` must not be modified by this rule; this decision does not authorize bare tag selectors, universal selectors, a document-wide reset, or a theme-stylesheet patch.
  - id: D-WEB-SURFACE-NORMALIZATION-0001-E
    text:
      zh-CN: Prototype token rule 与 consumer 显式 surface class/style 必须能够覆盖 normalization 中同名 property；consumer-owned theme variable value 必须能够覆盖生成的 theme defaults。生成器不得通过更高 specificity、`!important`、unlayered defaults 或更晚的重复 normalization 夺取这些 source 的所有权。对于 named layers，host 必须在任一相关 layer 首次声明前把生成的 theme defaults 排在 reset/base layers 之下，把 reset/base layers 排在 `proto-ui` 之下，并把显式 consumer layers 排在 `proto-ui` 之上。
      en: Prototype token rules and explicit consumer surface class or style must be able to override the same properties in the normalization, and consumer-owned theme variable values must be able to override generated theme defaults. The generator must not take ownership away from those sources through higher specificity, `!important`, unlayered defaults, or a later duplicate normalization. For named layers, the host must place generated theme defaults below reset or base layers, reset or base layers below `proto-ui`, and explicit consumer layers above `proto-ui` before any relevant layer is first declared.
  - id: D-WEB-SURFACE-NORMALIZATION-0001-F
    text:
      zh-CN: 生成的 style entry 必须在 theme 与 token imports 之前输出 `@layer theme, proto-ui;`，并以 `layer(theme)` 导入生成的 theme defaults，使该 entry 在 host consumer layers 之前加载时能够预留两个已知 slot，同时确保 defaults 位于 `proto-ui` 之下。该声明不得硬编码未知 consumer layer 名称，也不得声称能重排已经首次声明的 named layer；完整 host order 仍由集成方提前声明。
      en: The generated style entry must emit `@layer theme, proto-ui;` before its theme and token imports and must import generated theme defaults with `layer(theme)`, so it can reserve both known slots when the entry loads before host consumer layers while keeping those defaults below `proto-ui`. That declaration must not hard-code unknown consumer layer names or claim to reorder a named layer that has already been declared; the integrating host must still declare the complete order early.

id: D-TEXT-CONTROL-PROJECTION-0001
type: decision
title: Text Control keeps the editing engine and system editing chrome host-owned
status: draft
since: 0.2.0-rc.7
summary: Text Control declarations express portable plain-text editing requirements while adapters select host widgets and retain system selection, composition, keyboard, and edit-menu behavior.
statement:
  zh-CN: >-
    Text Control 必须声明 plain-text、line mode 与 host-owned engine 等 portable editing requirement，而不得在 prototype declaration 中指定 Web tag、UIKit class、Flutter widget 或其它宿主 materialization。Adapter 与 host capability 负责选择物理编辑目标，并默认保留 selection、cursor、IME、软件键盘、长按编辑菜单与系统 editing chrome；当前 rc.7 证据只覆盖 Web host 上的 Web Component、React 与 Vue adapter，不得表述为已经完成多宿主 conformance。


  en: >-
    Text Control must declare portable editing requirements such as plain text, line mode, and a host-owned engine rather than naming a Web tag, UIKit class, Flutter widget, or other host materialization in the prototype declaration. The adapter and host capability select the physical editor and preserve system selection, cursor, IME, software-keyboard, long-press edit-menu, and editing-chrome behavior by default; current rc.7 evidence covers Web Component, React, and Vue adapters on the Web host only and must not be represented as multi-host conformance.


criteria:
  - id: D-TEXT-CONTROL-PROJECTION-0001-A
    text:
      zh-CN: Prototype static declaration 只能表达 portable editing requirement，不得包含具体宿主 target 名称。
      en: A prototype static declaration may express only portable editing requirements and must not contain a concrete host target name.
  - id: D-TEXT-CONTROL-PROJECTION-0001-B
    text:
      zh-CN: Adapter/host capability 必须将 requirement 解析为宿主物理 editor；当前 Web profile 对 single-line 解析为一个 `HTMLInputElement`，对 multiline 解析为一个 `HTMLTextAreaElement`。
      en: The adapter or host capability must resolve the requirement to a physical host editor; the current Web profile resolves single-line requirements to one `HTMLInputElement` and multiline requirements to one `HTMLTextAreaElement`.
  - id: D-TEXT-CONTROL-PROJECTION-0001-C
    text:
      zh-CN: 普通 property sync 与未改变 value 的 patch 不得破坏 active selection、cursor、composition 或系统 editing session；controlled composition 期间不得因无关 patch 写回 owner value。
      en: Ordinary property synchronization and patches with an unchanged value must not disrupt the active selection, cursor, composition, or system editing session; unrelated patches during controlled composition must not write the owner value back.
  - id: D-TEXT-CONTROL-PROJECTION-0001-D
    text:
      zh-CN: 长按 selection、copy/cut/paste menu、selection handle 与软件键盘默认属于宿主 editing chrome，不产生 touch-only Textarea prototype。
      en: Long-press selection, copy or cut or paste menus, selection handles, and software keyboards belong to host editing chrome by default and do not create a touch-only Textarea prototype.
  - id: D-TEXT-CONTROL-PROJECTION-0001-E
    text:
      zh-CN: 多个 framework adapter 在同一 Web host 上通过测试只能证明 cross-adapter Web profile，不得冒充多宿主 conformance。
      en: Passing multiple framework adapters on the same Web host proves a cross-adapter Web profile and must not masquerade as multi-host conformance.
openQuestions:
  - id: D-TEXT-CONTROL-PROJECTION-0001-Q-SELECTION
    question:
      zh-CN: selection facts 与 selectAll、setSelection、replaceSelection requests 应在哪一阶段进入 portable Text Control contract？
      en: At what stage should selection facts and selectAll, setSelection, and replaceSelection requests enter the portable Text Control contract?
    blocks: [portable-text-selection]
  - id: D-TEXT-CONTROL-PROJECTION-0001-Q-EDIT-MENU
    question:
      zh-CN: 自定义 edit menu 应如何作为 optional host capability 暴露，并在不支持时保留系统默认菜单？
      en: How should custom edit menus surface as an optional host capability while preserving the system default when unsupported?
    blocks: [portable-text-edit-menu]
sources:
  - path: internal/records/2026-08-02-text-control-host-boundary.zh-CN.md
  - path: packages/modules/text-control/src/declaration.ts
  - path: packages/modules/text-control/src/web.ts
explains:
  contracts:
    - C-TEXT-CONTROL-0001
relates:
  hostCaps:
    - HC-TEXT-CONTROL-0001
revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: Selected host-owned plain-text editing with semantic declarations and an explicitly Web-only initial conformance profile.

  - version: 0.3.0-alpha.0
    change: revised
    summary: Extended the Web profile target-resolution evidence to map single-line requirements to HTMLInputElement and multiline requirements to HTMLTextAreaElement while retaining the host-owned boundary.
tags: [text-control, editing, host-projection, selection, textarea]

revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: Introduced the decision scoping the CLI Brutalist CSS-only preset closure on the rc.7 release train (Button-only foundation). Not present in the immutable rc.6 snapshot.
  - version: 0.2.0-rc.7
    change: revised
    summary: Revised the public Brutalist family/token closure to include the complete 14-family surface, including Badge and Card.
  - version: 0.2.0-rc.7
    change: revised
    summary: Made the package-owned semantic theme manifest and its checked offline CLI projection part of the preset closure, including Light/Dark key parity and paired foreground completeness.

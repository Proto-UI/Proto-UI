id: D-CLI-BRUTALIST-PRESET-CLOSURE-0001
type: decision
title: CLI Brutalist preset is a generated closure of official theme and style tokens
status: draft
since: 0.2.0-rc.7
summary: The Brutalist package owns one complete Light/Dark semantic theme manifest, while the CLI carries a deterministic checked projection of that manifest and the official prototype style-token scan for first-run and offline use.
statement:
  en: >-
    `proto-ui init --prototypes brutalist` must produce usable initial CSS before the target project installs prototype packages. The Brutalist package therefore owns the complete semantic theme manifest, and the CLI carries checked static projections of that manifest and the style-token closure scanned from official prototype sources.


  zh-CN: >-
    `proto-ui init --prototypes brutalist` 必须在目标项目安装 prototype package 之前生成可用初始 CSS。因此 Brutalist package 维护完整 semantic theme manifest，CLI 携带该 manifest 与官方 prototype 源码 style-token closure 的受检查静态投影。


criteria:
  - id: D-CLI-BRUTALIST-PRESET-CLOSURE-0001-A
    text:
      en: The Brutalist package must own one structured semantic theme manifest whose Light and Dark modes have identical keys and complete background/foreground pairs.
      zh-CN: Brutalist package 必须维护一份结构化 semantic theme manifest；其 Light 与 Dark mode 必须具有相同 keys 与完整 background/foreground 配对。
  - id: D-CLI-BRUTALIST-PRESET-CLOSURE-0001-B
    text:
      en: Token CSS produced by `proto-ui init --prototypes brutalist` must include the hard-shadow and square-corner token closure scanned from official Brutalist prototype sources.
      zh-CN: '`proto-ui init --prototypes brutalist` 产生的 token CSS 必须包含从官方 Brutalist prototype 源码扫描出的硬阴影与直角 token closure。'
  - id: D-CLI-BRUTALIST-PRESET-CLOSURE-0001-C
    text:
      en: The generated Brutalist theme projection must stay current with the package manifest and produce prefixed Light/Dark Proto UI CSS variables without maintaining a second authored palette.
      zh-CN: 生成的 Brutalist theme 投影必须与 package manifest 保持同步，并产生带前缀的 Light/Dark Proto UI CSS variables，不得维护第二份手写 palette。

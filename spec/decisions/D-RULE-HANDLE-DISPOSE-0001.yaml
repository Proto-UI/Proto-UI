id: D-RULE-HANDLE-DISPOSE-0001
type: decision
title: RuleHandle.dispose is setup-time composition removal
status: draft
since: 0.1.0
summary: RuleHandle.dispose follows the setup-only cancellation boundary and is unavailable from created onward; terminal cleanup belongs to Module lifecycle.
statement:
  en: RuleHandle.dispose is cancellation of a setup declaration. It is permitted only while prototype setup is executing; created callbacks and all later execution scopes must reject it before mutating Rule state or output. This follows C-CORE-SYNTAX-0007 regardless of whether cancellation is exposed as a function or a handle method. Terminal Module disposal is separate internal cleanup. Runtime rule removal is not admitted by this decision.
  zh-CN: RuleHandle.dispose 是 setup 声明的取消动作，仅允许在原型 setup 执行期间调用；created callback 与后续所有执行阶段都必须在修改 Rule 状态或输出前拒绝调用。无论取消动作以函数还是 handle method 暴露，均遵循 C-CORE-SYNTAX-0007。Module terminal disposal 是独立的内部资源清理。本决定不接纳 runtime Rule removal。
explains:
  contracts:
    - C-CORE-SYNTAX-0007
    - C-RULE-0004
sources:
  - path: internal/contracts/rule/define.setup-only.v0.md
    sections:

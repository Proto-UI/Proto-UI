    change: clarified
    summary: Resolved the maintainer decision in favor of setup-only removal, including direct handles and captured asHook disposers; retained draft lifecycle.
  - version: 0.1.0
    change: introduced
    summary: Recorded `RuleHandle.dispose()` phase semantics as a decision gap.

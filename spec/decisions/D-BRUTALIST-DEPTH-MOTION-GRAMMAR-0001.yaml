id: D-BRUTALIST-DEPTH-MOTION-GRAMMAR-0001
type: decision
title: Brutalist depth and motion are a typed category grammar, not a strict universal invariant
status: draft
since: 0.3.0-alpha.1
summary: >-
  The Brutalist family resolves the rest-depth and interaction-motion drift by admitting a finite typed category catalog. Each category owns explicit rest depth, hover depth, and press depth; component P entities name their category and keep only the listed exceptions. The unqualified family table is replaced by category-qualified projection.
statement:
  en: >-
    Brutalist depth and interaction motion follow the typed grammar in this decision, not a universal 3px/lift/sink rule applied to every surface. Category defaults and the finite exception list below are normative; a P entity may deviate only by naming its category and retaining its own listed exception. The public design-contract pages must project this typed grammar and must not present an unqualified family table that contradicts P entities.


  zh-CN: >-
    Brutalist 层级与交互 motion 遵循本 decision 的 typed grammar，而不是对每个 surface 套用统一的 3px/lift/sink 规则。下列 category 默认值与有限 exception 清单是 normative；P 实体仅可通过命名其 category 并保留自身列出的 exception 偏离。公开 design-contract 页面必须投射该 typed grammar，不得呈现与 P 实体矛盾的无条件 family table。


criteria:
  - id: D-BRUTALIST-DEPTH-MOTION-GRAMMAR-0001-CATALOG
    text:
      en: >-
        The family admits exactly these depth/motion categories. Elevated action control (Button, raised Surface, Dialog Trigger, Dropdown Trigger, Select Trigger, Collapsible Trigger, Accordion Item): rest 4px 4px zero-blur black shadow, hover and transient press translate +4px,+4px along the shadow axis and clear the outer shadow, with no additional hover-only lift. Raised panel (Card, Dialog Content, Alert Dialog Content, Command Dialog Content, Drawer Content, Calendar, raised Surface, elevated Accordion Item): rest 4px 4px zero-blur black shadow, no interaction motion. Anchored content panel (Dropdown/Context/Menubar/Navigation Menu Content, Autocomplete/Combobox Content, Popover, Select Content, Hover Card Content): rest 3px 3px zero-blur foreground shadow, no interaction motion. Flat selection control (Toggle, Tabs Trigger): no rest shadow and no translation; Toggle hover/press keep border-black, selected Tabs Trigger owns its color pair and black border, and the Toggle active 2px inset ink frame persists through press. Binary capsule control (Switch Root): no rest shadow, no hover lift, 150ms color transition; Thumb owns the 20px translate travel and no shadow. Editable surface (Input, Textarea, Number Field, Input OTP): no hover lift or press sink; the 2px 2px border-colored hard shadow on Number Field and Input OTP is a named small-control exception, while Input and Textarea rest without shadow. Passive label (Badge, Text, Label, Kbd): no rest shadow and no interaction motion. Loading placeholder (Skeleton): no rest shadow, static, no imported pulse animation. Scroll chrome (Scroll Area Root, Viewport, Scrollbar, Thumb) and Separator: no rest shadow and no interaction motion. Flat overlay (Dialog Mask): no shadow, fixed inset overlay with only the governed 150ms fade. Flat interactive item (Dropdown/Context/Menubar/Select Item): no rest shadow, feedback by background change only.


      zh-CN: >-
        family 仅准入以下 depth/motion category。Elevated action control（Button、raised Surface、Dialog Trigger、Dropdown Trigger、Select Trigger、Collapsible Trigger、Accordion Item）：静止 4px 4px 零模糊黑影，hover 与瞬时 press 沿阴影轴位移 +4px,+4px 并清除外影，不叠加额外 hover-only lift。Raised panel（Card、Dialog Content、Alert Dialog Content、Command Dialog Content、Drawer Content、Calendar、raised Surface、elevated Accordion Item）：静止 4px 4px 零模糊黑影，无交互 motion。Anchored content panel（Dropdown/Context/Menubar/Navigation Menu Content、Autocomplete/Combobox Content、Popover、Select Content、Hover Card Content）：静止 3px 3px 零模糊 foreground 阴影，无交互 motion。Flat selection control（Toggle、Tabs Trigger）：无静止阴影且无位移；Toggle hover/press 保持 border-black，selected Tabs Trigger 拥有色对与黑边，Toggle active 的 2px inset ink frame 在 press 中持续。Binary capsule control（Switch Root）：无静止阴影、无 hover lift，150ms color transition；Thumb 独自拥有 20px translate 行程且无阴影。Editable surface（Input、Textarea、Number Field、Input OTP）：无 hover lift 或 press sink；Number Field 与 Input OTP 的 2px 2px border 色硬阴影是命名 small-control exception，Input 与 Textarea 静止无阴影。Passive label（Badge、Text、Label、Kbd）：无静止阴影、无交互 motion。Loading placeholder（Skeleton）：无静止阴影、保持静态、不引入 pulse animation。Scroll chrome（Scroll Area Root、Viewport、Scrollbar、Thumb）与 Separator：无静止阴影、无交互 motion。Flat overlay（Dialog Mask）：无阴影、fixed inset overlay，仅有受治理的 150ms fade。Flat interactive item（Dropdown/Context/Menubar/Select Item）：无静止阴影，仅以背景变化反馈。


  - id: D-BRUTALIST-DEPTH-MOTION-GRAMMAR-0001-EXCEPTIONS
    text:
      en: >-
        Exceptions are finite and named: (1) Toggle active and selected Tabs Trigger are hover-gated state variants inside the flat selection category, and the Toggle active inset frame survives press; (2) Switch has no hover visual and its Thumb owns travel, so the Button displacement grammar never applies; (3) Number Field and Input OTP small controls keep a 2px 2px border-colored shadow rather than the elevated 4px black shadow; (4) grouping surfaces (Toolbar Root, Toggle Group Root, Toast Root) keep their 3px 3px foreground shadow as passive containers with no control displacement; (5) Dialog Content retains prototype-owned fixed centering and Dialog Mask retains its 150ms fade, so category membership never reassigns positioning or transition ownership. No other rest-depth, hover-depth, or press-depth exception is admitted without revising this decision.


      zh-CN: >-
        exception 有限且命名：(1) Toggle active 与 selected Tabs Trigger 是 flat selection category 内的 hover-gated 状态变体，Toggle active inset frame 在 press 中保留；(2) Switch 没有 hover 视觉且 Thumb 拥有行程，因此不适用 Button 位移语法；(3) Number Field 与 Input OTP 小控件保留 2px 2px border 色阴影，而非 elevated 4px 黑影；(4) 分组 surface（Toolbar Root、Toggle Group Root、Toast Root）作为 passive 容器保留 3px 3px foreground 阴影，无控件位移；(5) Dialog Content 保留 prototype 拥有的 fixed 居中，Dialog Mask 保留 150ms fade，category 归属绝不转移 positioning 或 transition owner。未经修订本 decision，不准入其他 rest-depth、hover-depth 或 press-depth exception。


  - id: D-BRUTALIST-DEPTH-MOTION-GRAMMAR-0001-P-PROJECTION
    text:
      en: >-
        Badge, Card, Skeleton, Textarea, Scroll Area, Toggle, Switch, and Tabs P entities must name their category through a typed dependsOn.decisions backlink and keep their component-specific criteria consistent with the category default plus its named exception. Where a P entity already matches the category, no implementation change is required; normalization applies only when the grammar declares behavior invariant.


      zh-CN: >-
        Badge、Card、Skeleton、Textarea、Scroll Area、Toggle、Switch 与 Tabs P 实体必须通过 typed dependsOn.decisions backlink 命名其 category，并保持组件特定 criteria 与 category 默认值及其命名 exception 一致。P 实体已与 category 一致时不需要实现变更；仅在 grammar 声明行为不变时才进行 normalization。


  - id: D-BRUTALIST-DEPTH-MOTION-GRAMMAR-0001-DOCS-PROJECTION
    text:
      en: >-
        The English and Chinese design-contract pages must replace the unqualified depth/interaction table with category-qualified rows that trace to this decision and the owning P entities, including the no-shadow Badge/Skeleton/Textarea/Scroll Area rows and the flat Toggle/Tabs/Switch motion rows.


      zh-CN: >-
        英文与中文 design-contract 页面必须用可追溯到本 decision 与所属 P 实体的 category-qualified 行替换无条件的 depth/interaction 表，包括 Badge/Skeleton/Textarea/Scroll Area 的无阴影行以及 Toggle/Tabs/Switch 的 flat motion 行。



    change: introduced
    summary: Recorded the #1809 clean-slate v2 compiler architecture decision (TS TypeChecker frontend, Proto SSA IR, LLVM IR/WASM pipeline, 3-tier thin React lowering over shared runtime).
  - version: 0.3.0
    change: refined
    summary: Refined #1809 under the 2026-11-25 current-user instruction to require semantic HIR, target admission, TypeScript AST and LLVM C++ IRBuilder construction, prohibit source templates and prototype-runtime fallback, implement GPUI Rust AST lowering in parallel, and preserve full native corpus and consumer obligations.

id: D-COMPILER-ARCH-0001
type: decision
title: Proto semantic compiler with React and GPUI AST lowering and LLVM IRBuilder
status: draft
since: 0.3.0
lifecycleRationale: >-
  Records the current-user correction of the #1809 0.4-scope rebuild: compile authored semantics through a Proto HIR and target lowering, construct React and GPUI programs through TypeScript/Rust AST and kernels through LLVM C++ APIs, and remove prototype-runtime wrapper fallback. Remains draft while semantic coverage, cross-target migration, consumer integration, and independent acceptance are incomplete. Historical wrapper acceptance and deleted code volume do not establish native compiler completion.

summary: Compile Proto semantics through explicit HIR and target admission into structurally constructed native programs, with unsupported diagnostics and no prototype-runtime fallback.
statement:
  zh-CN: >-
    Proto UI 编译器以真实 ts.Program 和 ts.TypeChecker 提供的绑定与类型事实为基础，建立保留表达式、控制流、props/state、事件、生命周期及能力所有权的 Proto 语义 HIR；经目标能力准入与降级，使用 ts.factory 和 ts.Printer 构造 React 程序、使用 syn Rust AST 和 prettyplease 构造 GPUI 原生组件，使用 LLVM C++ IRBuilder、Module 和标准 printer 构造适用的原生/WASM 内核。禁止源码字符串模板、先拼源码再解析的替代手法，以及导入原 .proto.ts 或调用 Proto runtime/adapter 执行未编译行为的回退。未实现的合法语义必须明确诊断，并继续保留其原有交付与消费者验收义务。

  en: >-
    The Proto UI compiler uses binding and type facts from a real ts.Program and ts.TypeChecker to construct a semantic Proto HIR preserving expressions, control flow, props/state, events, lifecycle, and capability ownership. Target admission and lowering construct React programs through ts.factory and ts.Printer, native GPUI components through syn Rust AST and prettyplease, and applicable native/WASM kernels through LLVM C++ IRBuilder, Module, and standard printers. Source templates, parsing constructed source as a substitute for structured generation, and fallback that imports the original prototype or executes it through a Proto runtime/adapter are prohibited. Valid but unsupported semantics receive explicit diagnostics while retaining their existing delivery and consumer obligations.

criteria:
  - id: D-COMPILER-ARCH-0001-A
    text:
      zh-CN: 目标程序必须通过结构化 AST/IR API 构造；禁止源码字符串模板及拼接后再解析。生成组件不得导入原 .proto.ts、Proto runtime/adapter 或等价原型执行桥；共享宿主原语不得承载通用 Proto 执行器。
      en: Target programs must be constructed through structured AST/IR APIs without source templates or parsing constructed source. Generated components must not import original prototypes, Proto runtimes/adapters, or equivalent execution bridges; shared host primitives must not carry a generic Proto executor.
  - id: D-COMPILER-ARCH-0001-B
    text:
      zh-CN: 前端必须基于真实 TypeScript 绑定、符号与类型事实解析导入、导出、别名、组合和能力，不得按组件名、文件路径或命名形态决定语义。未知语句、回调与选项必须保留未降级原因，不得静默丢弃。
      en: The frontend must resolve imports, exports, aliases, composition, and capabilities from real TypeScript binding, symbol, and type facts without name/path heuristics for semantics. Unknown statements, callbacks, and options must retain lowering gaps rather than disappearing silently.
  - id: D-COMPILER-ARCH-0001-C
    text:
      zh-CN: Proto 语义 HIR 必须保存执行顺序、表达式、控制流、状态、事件、生命周期与能力所有权；类型化标量内核可进一步降低为 SSA。各层必须校验自身不变量，能力位图与元数据不得替代实际行为表示。
      en: Semantic Proto HIR must preserve evaluation order, expressions, control flow, state, events, lifecycle, and capability ownership; typed scalar kernels may lower further to SSA. Each layer verifies its invariants, and capability masks or metadata must not substitute for behavioral representation.
  - id: D-COMPILER-ARCH-0001-D
    text:
      zh-CN: LLVM 后端必须使用原生 LLVM C++ API 构造并验证 Module，由标准 printer/产物接口输出，不得拼接 .ll 后交给 parser。显式请求 LLVM 产物或验证时，工具链缺失及各阶段失败必须报告；React-only 编译无需生成未请求的 LLVM 附属产物。
      en: The LLVM backend must construct and verify modules through native LLVM C++ APIs and use standard printers/artifact interfaces, never assembling .ll strings for a parser. Explicit LLVM artifact or verification requests fail on missing tools or stage errors; React-only compilation need not generate unrequested LLVM sidecars.
  - id: D-COMPILER-ARCH-0001-E
    text:
      zh-CN: 按目标逐项准入并原生降级完整行为，分别报告 analyzed、compiled-native、unsupported 和消费者执行证据；禁止 runtime 包装回退。全量官方 Base 与已承诺目标及消费者仍需完成原生编译和行为验收，明确拒绝未支持项不等于完成该项。
      en: Admit and natively lower complete behavior per target, reporting analyzed, compiled-native, unsupported, and consumer execution evidence separately without runtime-wrapper fallback. Full official Base coverage and committed targets/consumers still require native compilation and behavioral acceptance; an explicit unsupported diagnostic does not complete that obligation.
  - id: D-COMPILER-ARCH-0001-F
    text:
      zh-CN: GPUI为本轮并行实施目标：从同一语义HIR降级为Rust AST、类型化组件及真实GPUI Render/事件/生命周期接线。结构化生成、真实GPUI依赖构建与Verdant GPUI消费者验收分别提供证据；LLVM内核或原生壳不能代替完整组件。
      en: GPUI is a parallel implementation target in this iteration, lowering the same semantic HIR into Rust AST, typed components, and real GPUI Render/event/lifecycle integration. Structured generation, real GPUI dependency builds, and Verdant GPUI consumer acceptance require separate evidence; LLVM kernels or native shells do not substitute for complete components.

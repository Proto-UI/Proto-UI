id: D-COMPILER-ARCH-0001
type: decision
title: Clean-slate Proto UI v2 compiler architecture (TS TypeChecker, Proto SSA IR, LLVM IR, 3-tier thin lowering)
status: draft
since: 0.3.0
lifecycleRationale: >-
  Records the 0.4-scope architectural reset authorized under issue #1809 to replace the legacy 180k-LOC string-template compiler with a real TypeScript TypeChecker frontend, typed Proto SSA IR, LLVM IR toolchain pipeline, and 3-tier thin React codegen over a shared runtime. Kept draft because packages/compiler remains private 0.4 experimental scope pending multi-target completion and independent acceptance.

summary: Replace embedded String.raw runtime duplication and hand-rolled parsing with a real TypeScript frontend, verified Proto SSA IR, native LLVM IR/WASM lowering, and capability-driven 3-tier thin codegen.
statement:
  zh-CN: >-
    Proto UI 私有编译器（`packages/compiler`，0.4 scope，#1809）采用四段式真实编译器架构：以工作区 `tsconfig.json` 驱动的缓存 `ts.Program` + `ts.TypeChecker` 为前端；以强类型、单赋值、经结构校验且具备常量折叠/代数化简/死块裁剪/反向活跃性 DCE 的 Proto SSA IR 为核心中间表示；以 Opaque-Pointer LLVM IR（`.ll`）及真实 LLVM 工具链（`opt`、`llvm-as`、`llc`、`wasm-ld`）承接验证、优化与原生/WASM 标量内核生成；并按编译期 64-bit 能力闭包实行三层渐进式薄输出（`static` 零运行时、`reactive` 原生 `React.useState`、`protocol` 薄包装委托共享运行时 `@proto.ui/compiler/runtime`）。严禁在编译器源码中使用 `String.raw` 复制嵌入式运行时，严禁按组件名或源码路径特判业务逻辑，并移除文档站 QuickJS-in-WASM 嵌套沙箱。

  en: >-
    The private Proto UI compiler (`packages/compiler`, 0.4 scope, #1809) adopts a four-stage real compiler architecture: a cached `ts.Program` + `ts.TypeChecker` frontend backed by workspace `tsconfig.json`; a typed, single-assignment, structurally verified Proto SSA IR with target-independent passes (constant folding, algebraic simplification, dead-block pruning, backward liveness DCE, and 64-bit capability closure); native opaque-pointer LLVM IR (`.ll`) emission integrated with real LLVM tooling (`opt`, `llvm-as`, `llc`, `wasm-ld`) for verification, optimization, and native/WASM kernel compilation; and capability-driven 3-tier thin target emission (`static` zero-runtime, `reactive` native `React.useState`, and `protocol` thin wrappers delegating to `@proto.ui/compiler/runtime`). Embedded `String.raw` runtime copies, component-name/path business dispatch, and the legacy QuickJS-in-WASM browser VM are rejected.

criteria:
  - id: D-COMPILER-ARCH-0001-A
    text:
      zh-CN: '`packages/compiler/src/**` 不得通过 `String.raw` 或等价多行字符串模板将 DOM/运行时模块复制到生成产物；完整协议组件必须委托给共享运行时入口 `@proto.ui/compiler/runtime`。'
      en: '`packages/compiler/src/**` must not embed copied DOM or runtime modules via `String.raw` or equivalent string templates; protocol-tier components must delegate to the shared `@proto.ui/compiler/runtime` entry.'
  - id: D-COMPILER-ARCH-0001-B
    text:
      zh-CN: 前端抽取必须基于真实 `ts.Program` 与 `ts.TypeChecker` 解析导出、导入别名、组合 Hook 与 `def.*`/`run.*` 能力闭包，不得以组件名、导出名或源码路径决定语义行为。
      en: Frontend extraction must use a real `ts.Program` and `ts.TypeChecker` to resolve exports, import aliases, authored hooks, and `def.*`/`run.*` capability closures without dispatching business semantics by component name, export name, or source path.
  - id: D-COMPILER-ARCH-0001-C
    text:
      zh-CN: 中间表示必须采用带显式基本块与单赋值约束的 Proto SSA IR，并通过结构校验器及目标无关优化 Pass，任何结构非法 IR 必须在后端发射前失败。
      en: The intermediate representation must be a typed Proto SSA IR with explicit basic blocks and single-assignment invariants, guarded by a structural verifier and target-independent optimization passes that fail closed before emission.
  - id: D-COMPILER-ARCH-0001-D
    text:
      zh-CN: 编译器必须发射合法的 Opaque-Pointer LLVM IR（`.ll`），并支持对接本机 LLVM 工具链（`opt`、`llvm-as`、`llc`、`wasm-ld`）完成验证、`O2` 优化与可执行 `wasm32` 内核编译；当宿主机未安装 LLVM 时须显式降级而非伪造通过。
      en: The compiler must emit valid opaque-pointer LLVM IR (`.ll`) and integrate with installed LLVM tooling (`opt`, `llvm-as`, `llc`, `wasm-ld`) for verification, `O2` optimization, and executable `wasm32` kernel generation, degrading explicitly when LLVM tools are absent.
  - id: D-COMPILER-ARCH-0001-E
    text:
      zh-CN: 目标降级必须严格按能力闭包分为 `static`（零 Proto 运行时）、`reactive`（原生宿主响应状态，零 Proto kernel）与 `protocol`（薄包装共享运行时）三层，并支持全量官方 Base 原型编译而不引入人工阻断。
      en: Target lowering must classify prototypes strictly by capability closure into `static` (zero Proto runtime), `reactive` (target-native reactivity, zero Proto kernel), and `protocol` (thin shared-runtime wrapper), compiling the official Base prototype corpus cleanly.

openQuestions:
  - id: D-COMPILER-ARCH-0001-Q-MULTI-TARGET
    question:
      zh-CN: 语义 HIR 和各目标原生降级覆盖、旧回归迁移、浏览器/CLI/库接口及 GPUI/Rust、Shenko、Verdant 等消费者验收仍须逐项补齐；其余已记录目标不得因本次重建自动退出。
      en: Semantic HIR and target lowering coverage, regression migration, browser/CLI/library interfaces, and GPUI/Rust, Shenko, Verdant, and other consumer acceptance require explicit completion. Other recorded targets do not automatically exit scope because of this rebuild.

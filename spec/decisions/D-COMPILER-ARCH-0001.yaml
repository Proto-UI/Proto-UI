      zh-CN: Vue 3、Web Components 与 GPUI/Rust 原生后端尚未在 v2 SSA/LLVM 架构下完成独立实现与消费者验收；在此之前本决策保持 `draft` 与 `0.4 scope`。
      en: Thin Vue 3, Web Components, and native GPUI/Rust backends on the v2 SSA/LLVM pipeline remain to be implemented and consumer-verified before stable admission beyond 0.4 experimental scope.

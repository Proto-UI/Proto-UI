id: D-TRIGGER-GROUP-SURFACE-0001
type: decision
title: Continuous triggers merge as one group with distinct anchor and surface roles
status: draft
since: 0.2.0-rc.3
summary: Continuous trigger chains form one group whose outer anchor, inner interaction surface, behavior participants, and domain projections remain distinct.
statement:
  zh-CN: >-
    连续嵌套且均声明 `asTrigger()` 的 prototype instances 必须合并为同一个 trigger group，而不是彼此形成单向事件代理。最外层连续 trigger 默认作为稳定 group anchor，默认最内层连续 trigger 作为 interaction surface；所有 members 保留自身 behavior 声明并通过 surface 上的一次合法输入共享 semantic activation route。Event、Focus 与 A11y 分别消费 domain-neutral 的 group roles：Event 不得把非 surface member 的额外宿主盒解释为 surface hit，Focus 不得投射多个宿主 focus targets，A11y 不得投射多个 control semantic objects，`host:*` events 始终留在各实例自己的宿主 root。


  en: >-
    Directly and continuously nested prototype instances that declare `asTrigger()` merge into one trigger group rather than forming a one-way event proxy chain. The outermost continuous trigger is the default stable group anchor and the innermost continuous trigger is the default interaction surface; every member retains its own behavior declarations and shares the semantic activation route through one valid input on the surface. Event, Focus, and A11y independently consume the domain-neutral group roles: Event must not interpret the extra host box of a non-surface member as a surface hit, Focus must not project multiple host focus targets, A11y must not project multiple control semantic objects, and `host:*` events always remain on each instance's own host root.


criteria:
  - id: D-TRIGGER-GROUP-SURFACE-0001-A
    text:
      zh-CN: 连续 trigger group 必须区分默认最外层 anchor、members 与默认最内层 surface；这些 identity 可以不同，anchor 不代表物理 hit range，surface 也不吞并其他成员 behavior。
      en: A continuous trigger group must distinguish its default outermost anchor, members, and default innermost surface; these identities may differ, the anchor does not represent physical hit range, and the surface does not absorb other members' behaviors.
  - id: D-TRIGGER-GROUP-SURFACE-0001-B
    text:
      zh-CN: Event 必须让一次合法 pointer、keyboard 或 a11y activation 最多向 group semantic route 发布一次，并让所有相关 behavior participants 消费该 route，不得改回逐实例解释同一宿主输入。
      en: Event must publish one valid pointer, keyboard, or accessibility activation to the group semantic route at most once and let every relevant behavior participant consume that route; it must not regress to per-instance interpretation of the same host input.
  - id: D-TRIGGER-GROUP-SURFACE-0001-C
    text:
      zh-CN: Focus 必须为 trigger group 投射至多一个宿主 focus target，并在 focus scope/roving 导航中把 group 视为一个成员且优先最内层 surface；group members 可以共享 focused、focusVisible 等 facts 以驱动各自 feedback。
      en: Focus must project at most one host focus target for a trigger group, treat the group as one focus-scope or roving-navigation member, and prefer the innermost surface; group members may share facts such as focused and focusVisible for their own feedback.
  - id: D-TRIGGER-GROUP-SURFACE-0001-D
    text:
      zh-CN: A11y 必须为 trigger group 投射至多一个 control semantic object；相同 role/action 可以合并，不兼容声明必须诊断而不是产生重复 controls。
      en: A11y must project at most one control semantic object for a trigger group; compatible roles and actions may merge, while incompatible declarations require diagnostics rather than duplicate controls.
  - id: D-TRIGGER-GROUP-SURFACE-0001-E
    text:
      zh-CN: Trigger group 的 anchor、members 与 surface 必须保持 domain-neutral；Event、Focus 与 A11y 消费这些 roles，但 `asTrigger` module 不得直接实现这些 domain 的完整 policy。
      en: Trigger-group anchor, members, and surface must remain domain-neutral; Event, Focus, and A11y consume these roles, while the asTrigger module must not directly implement the complete policy of those domains.
  - id: D-TRIGGER-GROUP-SURFACE-0001-F
    text:
      zh-CN: Event 的 semantic activation registrations 必须汇聚到默认最内层 surface 的共享 target，同时保留每个 member 自身 behavior；`host:*` listeners 必须留在各实例自己的宿主 root，避免 surface 吞掉其他成员的原生 focus、blur 或 lifecycle observations。
      en: Event semantic activation registrations must converge on the shared target of the default innermost surface while preserving every member's own behavior; `host:*` listeners must remain on each instance's own host root so the surface does not absorb another member's native focus, blur, or lifecycle observations.
  - id: D-TRIGGER-GROUP-SURFACE-0001-G
    text:
      zh-CN: Trigger ancestry 必须识别规范 hook identity `as-trigger` 或已建立的 logical trigger-group mark，不得依赖旧的非规范 `asTrigger` trace spelling；pointer 与 keyboard activation 必须进入同一 group semantic route。
      en: Trigger ancestry must recognize the canonical `as-trigger` hook identity or an established logical trigger-group mark and must not depend on the legacy non-canonical `asTrigger` trace spelling; pointer and keyboard activation must enter the same group semantic route.
  - id: D-TRIGGER-GROUP-SURFACE-0001-H
    text:
      zh-CN: pointer hit origin 必须位于当前 surface 的宿主 root 或其内容中；命中 anchor 或其他非 surface member 自身的额外宿主盒不得激活 group，即使这些 members 在逻辑上属于同一 group。
      en: Pointer hit origin must be within the current surface host root or its content; hitting the extra host box of the anchor or another non-surface member must not activate the group even though those members logically belong to it.
  - id: D-TRIGGER-GROUP-SURFACE-0001-I
    text:
      zh-CN: Trigger group 必须是一条直接连续链；同一 Trigger 下出现并列 Trigger 分支时，宿主必须诊断并拒绝形成分叉的声明或父关系变更，并保留原有已接纳链、surface 与 route，不得按注册顺序选择赢家。非 Trigger parent 下的独立 Trigger group 不构成此分叉。
      en: A Trigger group must be one directly continuous chain. Sibling Trigger branches under a Trigger require a diagnostic and rejection of the declaration or parent change that forms the branch, preserving the previously accepted chain, surface and route rather than selecting a registration-order winner. Independent Trigger groups under a non-Trigger parent are not such a branch.

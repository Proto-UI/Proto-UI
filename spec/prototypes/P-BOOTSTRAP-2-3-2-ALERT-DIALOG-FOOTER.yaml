id: P-BOOTSTRAP-2-3-2-ALERT-DIALOG-FOOTER
type: prototype
title: Bootstrap 2.3.2 AlertDialog passive Footer
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: New passive family anatomy is draft until the real shared documentation consumer, four-Web interaction and independent review establish the projection.
summary: A passive modal-footer wrapper with the pinned Bootstrap border, spacing and action grouping.
statement:
  en: Footer claims the existing AlertDialog footer anatomy role and projects its authored slot. Each action retains its own command owner; Footer owns no confirm or cancel semantics. Modal surfaces and footer colors use paired semantic palette tokens so nested public components remain readable. Dark appearance is a Proto adaptation; fixed white footer highlights are omitted.
criteria:
  - id: P-BOOTSTRAP-2-3-2-ALERT-DIALOG-FOOTER-COMPOSITION
    text:
      en: Footer claims the AlertDialog footer role once, renders its slot and uses finite family feedback tokens for wrapping, spacing, alignment and the top border.
  - id: P-BOOTSTRAP-2-3-2-ALERT-DIALOG-FOOTER-BOUNDARY
    text:
      en: Exact-head four-Web visual, keyboard, AT and independent review remain acceptance gates; source presence is not stable admission.
inherits:
  prototypes: [P-BASE-ALERT-DIALOG]
verifies:
  tests: [T-BOOTSTRAP-2-3-2-HISTORICAL-OVERLAYS-0001]

  contracts: [C-A11Y-0001, C-AS-COLLECTION-ITEM-0001, C-AS-FOCUSABLE-0001, C-AS-TRIGGER-0001]
verifies: { tests: [T-BASE-DROPDOWN-MENU-ITEM-0001] }
revisions:
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Bound Dropdown mouse-hover focus handoff to the shared Focus owner, retaining disabled keyboard navigation and separating source tests from native paint acceptance.
  - version: 0.2.0-rc.0
    change: introduced
    summary: Cataloged Item collection, active navigation, selection signal, close policy, and focusable-disabled behavior.
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Clarify draft cancellation and retained-view transient cleanup without changing semantic ownership or Host contact lifetime.
tags: [prototype, base, dropdown-menu, item, collection, a11y]

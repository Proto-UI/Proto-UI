id: P-BASE-DROPDOWN-MENU-ITEM
type: prototype
title: Base Dropdown Menu Item is a transiently active menu action
status: draft
since: 0.2.0-rc.0
summary: Item is a collection-backed menu action that participates in navigation, emits selection intent, and optionally requests close without creating persistent selection.
statement:
  zh-CN: Dropdown Menu Item 是 Content 中可重复出现的 menu action。它发布 value/textValue collection snapshot、host-neutral menuitem semantics 与瞬时 active state。focus 或 enabled pointer intent 更新 active；Enter、Space 或 pointer activation 发出 `select` 并按 Item/Root policy 请求 close。disabled Item 保留 menu 内焦点能力以便被感知，但必须抑制 select、commit 与 close request。
  en: Dropdown Menu Item is a repeatable menu action within Content. It publishes value and textValue collection snapshots, host-neutral menuitem semantics, and transient active state. Focus or enabled pointer intent updates active; Enter, Space, or pointer activation emits `select` and requests close according to Item and Root policy. A disabled Item remains focusable within the menu so it can be perceived but must suppress selection, commit, and close requests.
criteria:
  - id: P-BASE-DROPDOWN-MENU-ITEM-TRANSIENT-CLEANUP
    text:
      zh-CN: 'press.cancel、pointer.cancel 与 view unmount 必须清除本 part 的 hovered/pressed；清理不得改变 canonical Root open 或发出 activation/request。逻辑实例 remount 不得重放旧瞬态；pointer.leave 的语义清理不等于取消 Host 持有的 contact。'
      en: "press.cancel, pointer.cancel and view unmount must clear this part's hovered/pressed without changing canonical Root open or emitting activation/requests. Logical-instance remount must not replay stale transient state; semantic pointer.leave cleanup does not cancel a Host-owned contact."
    dependsOn:
      contracts: [C-EVENT-TYPE-0002, C-LIFECYCLE-0008]
  - id: P-BASE-DROPDOWN-MENU-ITEM-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-dropdown-item` 与 `asDropdownItem` 必须是同一 Item protocol 的 authoring entries。'
      en: '`base-dropdown-item` and `asDropdownItem` must be authoring entries for the same Item protocol.'
  - id: P-BASE-DROPDOWN-MENU-ITEM-COLLECTION
    text:
      zh-CN: Item 必须通过 Collection Item 发布有序的 value、textValue、disabled 与 position snapshot。
      en: Item must publish an ordered value, textValue, disabled, and position snapshot through Collection Item.
  - id: P-BASE-DROPDOWN-MENU-ITEM-A11Y
    text:
      zh-CN: Item 必须投射 menuitem role、content-derived name、disabled state 与 activate action。
      en: Item must project a menuitem role, content-derived name, disabled state, and activate action.
  - id: P-BASE-DROPDOWN-MENU-ITEM-ACTIVE
    text:
      zh-CN: focus 必须更新 active item；enabled pointer enter 可以更新 active；active 仅是本次打开期间的导航事实。
      en: Focus must update the active item, enabled pointer enter may update it, and active is only a navigation fact for the current open session.
  - id: P-BASE-DROPDOWN-MENU-ITEM-POINTER-FOCUS
    text:
      zh-CN: >-
        open 且 Root/Item enabled 时，已确认 mouse 且无按键的 pointer.move 必须通过现有 Focus owner 请求本 Item 焦点并保留 preventScroll。焦点观察负责旧行到新行的交接，家族 foreground/background 与被动 Shortcut 消费这些事实，不另造 highlight owner。重复 move 可在键盘导航后恢复鼠标行；touch、pen、unknown、按压移动、closed 或 disabled 不得请求该焦点或隐式激活。disabled Item 的既有键盘 focus participation 保持。value 省略时也须发布实际 focus 对应 active，并清除旧的有值 activeValue，让被动 Shortcut 跟随当前行。


      en: >-
        While open and Root/Item enabled, a confirmed mouse pointer.move with no buttons must request this Item through the existing Focus owner with preventScroll. Focus observation hands off the old row to the new row; family foreground/background and passive Shortcut consume these facts without another highlight owner. Repeated movement can restore the mouse row after keyboard navigation. Touch, pen, unknown, pressed movement, closed and disabled states must not request this focus or implicitly activate. Existing disabled-item keyboard focus participation is preserved. An omitted value still publishes active from observed focus and clears the old valued activeValue so passive Shortcut follows the current row.


    dependsOn:
      contracts: [C-AS-FOCUSABLE-0001]
  - id: P-BASE-DROPDOWN-MENU-ITEM-SELECT
    text:
      zh-CN: enabled activation 必须发出包含 value 与 reason 的 `select` signal，并按 `closeOnCommit` 或 Root `closeOnItemCommit` 请求 close。
      en: Enabled activation must emit a `select` signal containing value and reason and request close according to `closeOnCommit` or Root `closeOnItemCommit`.
  - id: P-BASE-DROPDOWN-MENU-ITEM-DISABLED
    text:
      zh-CN: disabled Item 必须保留 menu 内 focus participation，但不得发出 select、执行 action 或请求 close。
      en: A disabled Item must retain within-menu focus participation but must not emit select, perform an action, or request close.
  - id: P-BASE-DROPDOWN-MENU-ITEM-NO-SELECTION
    text:
      zh-CN: Item 不得把 active/value 解释为 checked、selected 或 persistent selection；这些语义属于后续 Checkbox/Radio variants。
      en: Item must not interpret active or value as checked, selected, or persistent selection; those semantics belong to future Checkbox and Radio variants.

id: P-SHADCN-TABS
type: prototype
title: Shadcn Tabs Root inherits Base Tabs and projects the source-bound
  text/default layout
status: draft
since: 0.2.0-rc.0
summary: Inherits Base behavior and projects the bounded text-only default
  surface for New York v4, Nova and Rhea through shared style scope.
statement:
  en: This draft projects only the text-only default surface of fixed upstream
    3d98900e9b73c45f035f8109e9d41ba6a51685e7 for New York v4, Nova and Rhea,
    preserving Base ownership and shared style-scope precedence. Both
    orientations and light/dark interaction paint are covered where relevant to
    this part. It is not complete Tabs or all-style parity. Existing Proto
    underline remains a separate compatibility appearance, never an alias for
    upstream line.
criteria:
  - id: P-SHADCN-TABS-UPSTREAM-IDENTITY
    text:
      zh-CN: Root 必须标记为 Proto UI 维护的非官方 shadcn/ui 衍生实现并固定 upstream
        revision/path；本实体不主张上游所有权或认证。
      en: Root must identify itself as an unofficial Proto UI-maintained
        shadcn/ui-derived implementation and pin its upstream revision and path;
        this entity claims neither upstream ownership nor endorsement.
  - id: P-SHADCN-TABS-BASE-INHERITANCE
    text:
      zh-CN: "`shadcn-tabs-root` 必须通过 `inherits.prototypes` 指向 `P-BASE-TABS` 并调用
        `asTabsRoot()`；任何 setup-only 负向补丁必须明确声明被改写的 Base guarantee 与替代语义。"
      en: "`shadcn-tabs-root` must point to `P-BASE-TABS` through
        `inherits.prototypes` and call `asTabsRoot()`; any setup-only negative
        patch must identify the rewritten Base guarantee and replacement
        semantics."
    references:
      prototypes:
        - id: P-BASE-TABS
          anchors:
            - P-BASE-TABS-AUTHORING-ENTRIES
            - P-BASE-TABS-ROOT-SEMANTIC-OWNER
            - P-BASE-TABS-ANATOMY-FAMILY
    dependsOn:
      contracts:
        - C-AS-HOOK-0001
        - C-CORE-SYNTAX-0007
  - id: P-SHADCN-TABS-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不反转 inherited
        value、selection、orientation、activation、context、anatomy、a11y 或 signal
        guarantee；新增 style tokens 仅构成视觉增量。
      en: The current implementation reverses no inherited value, selection,
        orientation, activation, context, anatomy, accessibility, or signal
        guarantee; added style tokens are visual deltas only.
  - id: P-SHADCN-TABS-DIRECT-ENTRY
    text:
      zh-CN: 当前 Root protocol 以 `shadcn-tabs-root` direct prototype 公开，本层不额外提供
        authored asHook。
      en: The current Root protocol is exposed as `shadcn-tabs-root`; this layer
        provides no additional authored asHook.
  - id: P-SHADCN-TABS-CURRENT-VISUAL-SURFACE
    text:
      en: "The source-bound text/default surface is described by the dedicated Tabs
        coverage inventory: New York compatibility dimensions plus Nova/Rhea
        recipes, Base-derived horizontal/vertical layout, and existing
        feedback.style semantic merging. Only the declared bounded surface is
        projected; it does not imply line, SVG, arbitrary native props, or
        other-style support."
    dependsOn:
      contracts:
        - C-RULE-INTENT-FEEDBACK-STYLE-0001
  - id: P-SHADCN-TABS-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前实体只声明已测试的 inherited family behavior 与 root surface；固定 baseline
        的所有差异必须集中在唯一 compatibility open question。
      en: This entity claims only tested inherited family behavior and root surface;
        every difference from the pinned baseline must be centralized in one
        compatibility open question.
  - id: P-SHADCN-TABS-AS-CHILD-OMISSION
    text:
      zh-CN: upstream Root props 中的 `asChild` 依 `D-AS-CHILD-OMISSION-0001` 有意不进入 API。
      en: The `asChild` member of upstream Root props is intentionally omitted under
        `D-AS-CHILD-OMISSION-0001`.
    dependsOn:
      decisions:
        - D-AS-CHILD-OMISSION-0001
  - id: P-SHADCN-TABS-STYLE-SCOPE
    text:
      en: "Shared style selection preserves the actual Base owner, value, focus, handles and caller nodes while switching among New York and the eight modern profiles. Explicit leaf selection overrides scope; absence preserves the component compatibility default. Unknown profiles fail closed rather than borrowing another recipe."
  - id: P-SHADCN-TABS-SOURCE-BOUND-TEXT-DEFAULT
    text:
      en: "The fixed inventory is eight modern styles (vega, nova, maia, lyra, mira, luma, sera, rhea) plus independent New York. Each has source-distinct default and line paint; List variant changes update an owned decorative line without replacing Trigger leaves, caller content, Base selection or focus. Content and the optional semantic-only Indicator gain no selection owner. Proto appearance=underline remains separate. Nested SVG/inline-glyph selector parity, full API and native/cross-adapter acceptance remain open."
openQuestions:
  - id: P-SHADCN-TABS-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: Shadcn Tabs Root 相对固定 upstream baseline 的全部差异应如何分类与收敛？
      en: How should every Shadcn Tabs Root difference from the pinned upstream
        baseline be classified and converged?
    context:
      en: "The nine source-distinct default/line recipes and live owned line decoration have authored consumer cases, not exact-head execution or native acceptance. Remaining gaps include nested SVG/inline-glyph sizing and placement, className/native forwarding, upstream data-slot/state correspondence, all-adapter paint, motion, assistive technology and independent review. Scope changes must preserve Base owners, live caller nodes and controlled refusal."
    blocks:
      - shadcn tabs root parity roadmap

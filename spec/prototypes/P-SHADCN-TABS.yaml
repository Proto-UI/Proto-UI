    change: revised
    summary: Added bounded production text/default style scope projection; line explicitly rejects pending generic owned decorative feedback, with legacy underline and all remaining gaps preserved.
  - version: 0.2.0-rc.0
    change: introduced
    summary: Introduced Shadcn Tabs Root delta cataloging with Base inheritance, current layout surface, intentional asChild omission, and centralized upstream differences.

  - path: packages/modules/scroll/src/impl.ts
  - path: packages/modules/scroll/src/web/create-web-scroll-host.ts
  - path: https://www.w3.org/WAI/ARIA/apg/practices/keyboard-interface/
    label: WAI-ARIA APG keyboard interface guidance

id: P-BOOTSTRAP-2-3-2-SLIDER
type: prototype
title: Bootstrap 2.3.2 Slider projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: >-
    Draft catalog relation for an implemented family projection against the pinned Bootstrap 2.3.2 vocabulary. Stable admission requires real consumers, browser/native evidence and independent review; source presence and private package availability are not release or conformance admission.


summary: Scalar Bootstrap Slider family over Base with historical progress/button vocabulary; a Proto extension.
statement:
  en: >-
    The family composes the seven scalar entries Root, Label, Track, Indicator, Thumb, Value and FieldThumb, each consuming its matching hook once. Root owns value and session, Track owns AxisInput capture, Thumb derives pointer facts and FieldThumb is the Field-bound alternative. Painted thumb uses a private thumb-visual helper over inherited facts.


criteria:
  - id: P-BOOTSTRAP-2-3-2-SLIDER-BASE
    text:
      en: >-
        Invoke asSlider{Root,Label,Track,Indicator,Thumb,Value,FieldThumb}() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias, jQuery/plugin API or Base.setup call.


  - id: P-BOOTSTRAP-2-3-2-SLIDER-VISUAL
    text:
      en: >-
        Track/indicator borrow the pinned progress-bar and button vocabulary (gradients, shadows, 600ms width transition where source-defined); the thumb uses its own thumb-visual recipe. Scalar Slider is a Proto extension, not an upstream widget.


  - id: P-BOOTSTRAP-2-3-2-SLIDER-EXTENSION
    text:
      en: >-
        General focused facts are not transported by the Thumb hooks, so focused-specific paint is not projected; this is an explicit transport gap, not a fabricated state.


  - id: P-BOOTSTRAP-2-3-2-SLIDER-CLOSURE
    text:
      en: >-
        All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, Glyphicons, upstream JavaScript or Adapter component-name dispatch may supply default intent.


  - id: P-BOOTSTRAP-2-3-2-SLIDER-BOUNDARY
    text:
      en: >-
        Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; the package is private and source-only. Catalog presence is a draft relation, not acceptance.



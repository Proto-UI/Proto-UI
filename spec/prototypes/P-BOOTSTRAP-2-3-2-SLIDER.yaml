id: P-BOOTSTRAP-2-3-2-SLIDER
type: prototype
title: Bootstrap 2.3.2 Slider projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    en: Draft catalog relation for an implemented family projection against the pinned Bootstrap 2.3.2 vocabulary. Stable admission requires real consumers, browser/native evidence and independent review; source presence and private package availability are not release or conformance admission.
summary: Scalar Bootstrap Slider family over Base with historical progress/button vocabulary; a Proto extension.
statement:
    en: "Each real family part consumes its matching Base hook once and preserves its owner, modules and render. Track/Indicator borrow pinned progress-bar gradients and shadows while Thumb uses its private visual recipe. This is an explicit Proto Slider extension. The historical .6s width and 2s stripe motion require separate neutral capabilities and are not projected or accepted by these static endpoints."
criteria:
  - id: P-BOOTSTRAP-2-3-2-SLIDER-BASE
    text:
            en: 'Invoke asSlider{Root,Label,Track,Indicator,Thumb,Value,FieldThumb}() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias, jQuery/plugin API or Base.setup call.'
  - id: P-BOOTSTRAP-2-3-2-SLIDER-VISUAL
    text:
            en: "Track/Indicator borrow pinned progress-bar gradients and shadows while Thumb uses its private visual recipe. This is an explicit Proto Slider extension. The historical .6s width and 2s stripe motion require separate neutral capabilities and are not projected or accepted by these static endpoints."
  - id: P-BOOTSTRAP-2-3-2-SLIDER-EXTENSION
    text:
            en: General focused facts are not transported by the Thumb hooks, so focused-specific paint is not projected; this is an explicit transport gap, not a fabricated state.
  - id: P-BOOTSTRAP-2-3-2-SLIDER-CLOSURE
    text:
            en: All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, Glyphicons, upstream JavaScript or Adapter component-name dispatch may supply default intent.
  - id: P-BOOTSTRAP-2-3-2-SLIDER-BOUNDARY
    text:
            en: Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; the package is private and source-only. Catalog presence is a draft relation, not acceptance.

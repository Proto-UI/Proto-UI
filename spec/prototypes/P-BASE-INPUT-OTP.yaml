id: P-BASE-INPUT-OTP
type: prototype
title: Base inputOtp
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: 'Draft 实现方向，稳定准入需要独立审查及浏览器/native 证据。'
  en: 'Draft implementation direction. Stable admission requires independent review and browser/native evidence.'
summary: Base inputOtp protocol with shared Proto UI lifecycle and anatomy boundaries.
statement:
  zh-CN: 独立编写的 Proto UI 协议，复用 Base 共享能力和 L1 lifecycle。
  en: An independently authored Proto UI protocol reusing Base shared capabilities and L1 lifecycle.
criteria:
  - id: P-BASE-INPUT-OTP-ADMISSION
    text:
      zh-CN: Draft 准入需要精确 head 的浏览器/native 证据和独立审查。
      en: Draft admission requires exact-head browser/native evidence and independent review.
  - id: P-BASE-INPUT-OTP-FIELD
    text:
      en: The optional Field Control reports only the Root's canonical accepted value. Input and composition completion finish their outward owner callbacks before requesting automatic change validation; a refused controlled candidate or unchanged normalized uncontrolled value cannot validate the old value as a change. An accepted canonical change requests automatic onChange validation; explicit manual validation and configured blur validation remain available even without a change. Same-turn edits coalesce to one report for the latest accepted snapshot. Root reset first retires its editor lease. Reset, policy changes, composition restart and editor retirement revoke queued reports. Composition end still retires the composing fact when no value was accepted.

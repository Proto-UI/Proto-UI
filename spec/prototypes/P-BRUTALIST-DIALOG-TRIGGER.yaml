id: P-BRUTALIST-DIALOG-TRIGGER
type: prototype
title: 'Brutalist Dialog Trigger inherits Base trigger behavior and layers a fixed sky command surface'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Dialog Trigger inherits Base Dialog Trigger interaction semantics and projects a style-family visual API: a fixed sky fill pair, component-owned rounded geometry, hard offset shadows, and explicit interaction states. There is no variant prop — it was removed as inert.'

statement:
  en: P-BRUTALIST-DIALOG-TRIGGER preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-DIALOG-TRIGGER 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-DIALOG-TRIGGER-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Dialog Trigger through `asDialogTrigger()` once and must not redefine Base open, disabled, hovered, focusVisible, or pressed protocol semantics. Visual projection may only consume the projected state handles.


      zh-CN: >-
        该 prototype 必须通过 `asDialogTrigger()` 一次性继承 Base Dialog Trigger，不得重定义 Base 的 open、disabled、hovered、focusVisible 或 pressed 协议语义；视觉投射只能消费投影出的 state handles。


  - id: P-BRUTALIST-DIALOG-TRIGGER-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-dialog-trigger`.
      zh-CN: 直接 prototype 入口名为 `brutalist-dialog-trigger`。
  - id: P-BRUTALIST-DIALOG-TRIGGER-PAIR-INVARIANT
    text:
      en: >-
        The trigger surface must co-select its fill and foreground as a fixed pair: `bg-sky` with `text-sky-foreground`. This pair is not theme-variable at the fill level; no rule may replace the foreground with a theme-global text token independently of its background.


      zh-CN: >-
        trigger 表面必须将填充与前景作为固定色对同时选择：`bg-sky` 与 `text-sky-foreground`。该色对在填充层面不随主题变化；任何规则都不得在脱离背景的情况下用主题全局文本 token 覆盖前景。


  - id: P-BRUTALIST-DIALOG-TRIGGER-INTERACTION
    text:
      en: >-
        Hover and press settle the control along its hard shadow axis by +4px,+4px and clear the outer shadow. Press does not introduce a second displacement. Focus-visible uses a hard ring with offset. Disabled preserves geometry and paired fill while reducing emphasis with opacity-50 and pointer-events-none. These are visual projections of the existing Base states.


      zh-CN: >-
        hover 与 press 均沿硬阴影轴位移 +4px,+4px 并清除外侧阴影，press 不叠加第二次位移。focus-visible 使用带 offset 的硬 ring；disabled 保持几何与色对并使用 opacity-50、pointer-events-none 降低强调。以上仅投射现有 Base state。


  - id: P-BRUTALIST-DIALOG-TRIGGER-VISUAL-GRAMMAR
    text:
      en: >-
        The trigger uses 5px rounded-base corners, 2px black structural borders, flat paired fills, and explicit per-component elevation. Text-bearing surfaces carry DM Sans via font-sans with a system sans fallback; base weight is 500, heading/Toggle/Tabs-trigger weight is 700, and authored casing is preserved. No gradient, glass, blur, or soft shadow; its Button-like rest elevation is 4px 4px 0 0 black. Existing fill-pair, native semantics, placement and API ownership remain unchanged.


      zh-CN: >-
        Trigger 使用5px rounded-base 圆角、2px 黑色结构边框、平面色对与按组件分工的 elevation。文本 surface 通过 font-sans 携带 DM Sans 与系统 sans fallback；正文为 500，标题、Toggle 与 Tabs Trigger 为 700，保留作者大小写。不使用 gradient、glass、blur 或 soft shadow，Button-like 静止阴影为 4px 4px 0 0 黑色。保留现有色对、原生语义、placement 与 API owner。



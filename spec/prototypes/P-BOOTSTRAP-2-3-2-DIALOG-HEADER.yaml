id: P-BOOTSTRAP-2-3-2-DIALOG-HEADER
type: prototype
title: Bootstrap 2.3.2 Dialog passive Header
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: New passive family anatomy is draft until the real homepage consumer, four-Web interaction and independent review establish the projection.
summary: A passive modal-header wrapper with the pinned Bootstrap border and spacing recipe.
statement:
  en: Header claims the existing Dialog header anatomy role and projects its authored slot. It owns no title relationship, close behavior or second interaction state. Modal surfaces and footer colors use paired semantic palette tokens so nested public components remain readable. Dark appearance is a Proto adaptation; fixed white footer highlights are omitted.
criteria:
  - id: P-BOOTSTRAP-2-3-2-DIALOG-HEADER-COMPOSITION
    text:
      en: Header claims the Dialog header role once, renders its slot and uses finite family feedback tokens; authored Title and Close keep their existing owners.
  - id: P-BOOTSTRAP-2-3-2-DIALOG-HEADER-BOUNDARY
    text:
      en: Exact-head four-Web visual, keyboard, AT and independent review remain acceptance gates; source presence is not stable admission.
inherits:
  prototypes: [P-BASE-DIALOG]
verifies:
  tests: [T-BOOTSTRAP-2-3-2-DRAFT-OVERLAY-0001]
sources:

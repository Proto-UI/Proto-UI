dependsOn:
  contracts: [C-AS-HOOK-0001, C-RULE-WHEN-0002, C-RULE-INTENT-FEEDBACK-STYLE-0001]
  decisions: [D-SCROLL-PROJECTION-0001]
relates:
  prototypes: [P-SHADCN-SCROLL-AREA]
verifies:
  tests: [T-SHADCN-SCROLL-AREA-0001]
revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Removed the rejected Shadcn corner tile and divider edges while preserving measured track separation, transparent tracks, and Base ownership.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added the accepted private horizontal passive corner fill, with zero-reservation clipping and unchanged Base/control ownership.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Refined the requested dual-track presentation with a host-local opposite-track end inset; preserved draft lifecycle, physical edge placement, and Base ownership.
  - version: 0.3.0-alpha.0
    change: introduced
    summary: Introduced the common and orientation-specific shadcn Scrollbar track surface.
tags: [prototype, shadcn, scroll-area, scrollbar, geometry, visual, delta]

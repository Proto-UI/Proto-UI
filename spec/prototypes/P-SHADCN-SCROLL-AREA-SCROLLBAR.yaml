id: P-SHADCN-SCROLL-AREA-SCROLLBAR
type: prototype
title: shadcn Scroll Area Scrollbar projects an oriented composed track
status: draft
lifecycleRationale: The oriented Shadcn track presentation remains a draft inherited Base control; current geometry and fallback evidence do not independently admit the design-language surface as stable.
since: 0.3.0-alpha.0
summary: shadcn Scroll Area Scrollbar inherits Base control routing and adds the current common and oriented track presentation.
statement:
  en: Scrollbar keeps Base orientation and host-control leases and adds only the authored track surface.
  zh-CN: Scrollbar 保留 Base orientation 与 host-control leases，仅增加 authored track surface。
criteria:
  - id: P-SHADCN-SCROLL-AREA-SCROLLBAR-BASE-INHERITANCE
    text:
      en: Scrollbar must inherit P-BASE-SCROLL-AREA-SCROLLBAR through asScrollAreaScrollbar() and must not own scroll position or movement.
      zh-CN: Scrollbar 必须通过 asScrollAreaScrollbar() 继承 P-BASE-SCROLL-AREA-SCROLLBAR，且不得拥有 scroll position 或 movement。
  - id: P-SHADCN-SCROLL-AREA-SCROLLBAR-DIRECT-ENTRY
    text:
      en: The direct Scrollbar entry is shadcn-scroll-area-scrollbar and this layer provides no authored asHook.
      zh-CN: Scrollbar direct entry 为 shadcn-scroll-area-scrollbar，且本层不提供 authored asHook。
  - id: P-SHADCN-SCROLL-AREA-SCROLLBAR-CURRENT-VISUAL-SURFACE
    text:
      en: Scrollbar must project absolute flex touch-none select-none transition-colors.
      zh-CN: Scrollbar 必须投射 absolute flex touch-none select-none transition-colors。
  - id: P-SHADCN-SCROLL-AREA-SCROLLBAR-ORIENTED-GEOMETRY
    text:
      en: >-
        Vertical must project h-[calc(100%_-_var(--proto-ui-scroll-track-end-inset,0px))] w-2.5 top-0 right-0 border-2 border-transparent. Horizontal must project w-[calc(100%_-_var(--proto-ui-scroll-track-end-inset,0px))] h-2.5 flex-col bottom-0 left-0 border-2 border-transparent. These tracks remain composed chrome around the same host-owned Viewport.


      zh-CN: >-
        vertical 必须投射 h-[calc(100%_-_var(--proto-ui-scroll-track-end-inset,0px))] w-2.5 top-0 right-0 border-2 border-transparent；horizontal 必须投射 w-[calc(100%_-_var(--proto-ui-scroll-track-end-inset,0px))] h-2.5 flex-col bottom-0 left-0 border-2 border-transparent。两条 track 继续作为同一个 host-owned Viewport 周围的 composed chrome。


  - id: P-SHADCN-SCROLL-AREA-SCROLLBAR-CORNER
    text:
      en: In the Web composed projection, each track reserves the measured outer thickness of the other bound rendered track at its long-axis end. The lower-right intersection contains neither track nor Thumb; no separate Corner control or Base identity is created. A missing or display-hidden opposite track reserves zero. Tracks with no overflow keep their existing authored surface while their Thumb is hidden. The CSS inset is host-local and does not extend portable facts or RTL normalization. The reserved intersection must remain visually continuous with the underlying Root surface, without a separate filled tile, divider borders, or authored Corner element. Transparent track borders and rounded Thumbs remain unchanged; no corner paint or hit target is introduced.
      zh-CN: Web composed projection 中，每条 track 在长轴末端避让另一条已绑定且渲染的 track 的实测外厚度。右下交点不包含 track 或 Thumb，不创建独立 Corner control 或 Base identity。另一条 track 缺失或 display 隐藏时避让为零；无 overflow 时保留既有 authored track surface，仅隐藏 Thumb。CSS inset 属于 host-local geometry，不扩展 portable facts 或 RTL normalization。预留交点必须与底层 Root surface 自然连续，不绘制独立实心方块、分隔边框或 authored Corner element。透明 track border 与圆头 Thumb 保持不变，不引入 corner paint 或 hit target。
sources:
  - path: packages/prototypes/shadcn/src/scroll-area/scrollbar.proto.ts
  - path: packages/prototypes/shadcn/test/scroll-area.test.ts

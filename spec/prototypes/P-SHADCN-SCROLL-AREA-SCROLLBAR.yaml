id: P-SHADCN-SCROLL-AREA-SCROLLBAR
type: prototype
title: shadcn Scroll Area Scrollbar inherits Base Scroll Area Scrollbar
status: draft
since: 0.3.0-alpha.0
summary: shadcn Scroll Area Scrollbar inherits Base and projects flex touch-none select-none.
statement:
  en: shadcn Scroll Area Scrollbar is a draft projection with flex touch-none select-none transition-colors.
  zh-CN: shadcn Scroll Area Scrollbar 是 draft 投射，使用 flex touch-none select-none transition-colors。
criteria:
  - id: P-SHADCN-SCROLL-AREA-SCROLLBAR-ENTRY
    text:
      {
        en: Entry name is shadcn-scroll-area-scrollbar,
        zh-CN: 入口名为 shadcn-scroll-area-scrollbar,
      }
  - id: P-SHADCN-SCROLL-AREA-SCROLLBAR-GEOMETRY
    text:
      en: >-
        Orientation-specific Scrollbar tracks must remain an absolutely positioned, transparent-bordered visual surface: vertical uses full height, width 0.625rem, and top/right edge placement; horizontal uses full width, height 0.625rem, bottom/left edge placement, and column flex layout for its Thumb.

      zh-CN: >-
        Scrollbar 必须保持按 orientation 区分的 absolute、透明边框 visual surface：vertical 使用满高、0.625rem 宽并贴合 top/right 边缘；horizontal 使用满宽、0.625rem 高、bottom/left 边缘与 column flex layout 以承载 Thumb。


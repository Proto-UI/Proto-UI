dependsOn:
  contracts: [C-AS-HOOK-0001, C-RULE-WHEN-0002, C-RULE-INTENT-FEEDBACK-STYLE-0001]
  decisions: [D-SCROLL-PROJECTION-0001]
relates:
  prototypes: [P-SHADCN-SCROLL-AREA]
verifies:
  tests: [T-SHADCN-SCROLL-AREA-0001]
revisions:
  - version: 0.3.0-alpha.0
    change: introduced
    summary: Introduced the common and orientation-specific shadcn Scrollbar track surface.
tags: [prototype, shadcn, scroll-area, scrollbar, geometry, visual, delta]

id: P-SHADCN-SELECT
type: prototype
title: Shadcn Select Root inherits Base select-only ownership
status: draft
since: 0.2.0-rc.0
summary: Shadcn Select Root is an unofficial direct projection that inherits Base select-only value, text derivation, requests, context, and anatomy and adds no Root-specific behavior.
statement:
  zh-CN: Shadcn Select Root 是 `P-BASE-SELECT` 之上的 direct prototype，保留 select-only value/open ownership、selection invariant、text derivation、requests、context 与 anatomy；Root 仅新增共享 style scope 边界，不新增交互行为。Root 原比较基线为 `f31ed81983653919dd4fe77aee4b4859f610f1dc`；已采用的结构 parts 基线为 `02cad61166c4c20edbc8a3f71bd720eed4c1f49b`，详见 `P-SHADCN-SELECT-STRUCTURAL-PARTS`。
  en: Shadcn Select Root is a direct prototype over `P-BASE-SELECT`. It retains select-only value and open ownership, selection invariant, text derivation, requests, context, and anatomy; Root adds only a shared style-scope boundary, not interaction behavior. Its original Root comparison reference is `f31ed81983653919dd4fe77aee4b4859f610f1dc`; the adopted structural-parts reference is `02cad61166c4c20edbc8a3f71bd720eed4c1f49b`, governed by `P-SHADCN-SELECT-STRUCTURAL-PARTS`.
criteria:
  - id: P-SHADCN-SELECT-STYLE-PROFILES
    text:
      en: The earlier fixed recipes in this document describe the New York compatibility profile. Shared style selection additionally supports Rhea from shadcn/ui 3d98900e9b73c45f035f8109e9d41ba6a51685e7; the bounded profile and composition contract is P-SHADCN-SELECT-STYLE. This is not full upstream API, positioning or scroll-control parity.
  - id: P-SHADCN-SELECT-UPSTREAM-IDENTITY
    text:
      {
        zh-CN: Root 必须固定 upstream revision/path 并明确为非官方 Proto UI projection。,
        en: Root must pin the upstream revision and path and identify itself as an unofficial Proto UI projection.,
      }
  - id: P-SHADCN-SELECT-BASE-INHERITANCE
    text:
      {
        zh-CN: '`shadcn-select-root` 必须继承 `P-BASE-SELECT` 并调用 `asSelectRoot()`；任何 setup-only 负向补丁必须显式声明。',
        en: '`shadcn-select-root` must inherit `P-BASE-SELECT` and call `asSelectRoot()`; any setup-only negative patch must be declared explicitly.',
      }
    references:
      prototypes:
        - id: P-BASE-SELECT
          anchors:
            [
              P-BASE-SELECT-AUTHORING-ENTRIES,
              P-BASE-SELECT-ROOT-OWNER,
              P-BASE-SELECT-SELECTION-INVARIANT,
            ]
  - id: P-SHADCN-SELECT-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不反转 inherited value/open、selection、text、request、context 或 anatomy guarantee，仅增加共享 style-scope 边界。
      en: The current implementation reverses no inherited value, open, selection, text, request, context or anatomy guarantee and adds only a shared style-scope boundary.
  - id: P-SHADCN-SELECT-DIRECT-ENTRY
    text:
      {
        zh-CN: 当前 Root protocol 以 `shadcn-select-root` direct prototype 公开。,
        en: The current Root protocol is exposed as the `shadcn-select-root` direct prototype.,
      }
  - id: P-SHADCN-SELECT-COMPATIBILITY-SUBSET
    text:
      en: The current family provides Root, Trigger, Value, Content, Item, Surface, Viewport, ItemText, Group, Label and decorative Separator. Structural part adoption does not assert full positioning, scroll-control, form or upstream API parity; remaining differences stay open.
openQuestions:
  - id: P-SHADCN-SELECT-Q-UPSTREAM-DIFFERENCES
    question:
      {
        zh-CN: Select family scope 与 Root API parity 应如何收敛？,
        en: How should Select family scope and Root API parity converge?,
      }
    context:
      zh-CN: upstream 的 ScrollUpButton、ScrollDownButton 仍待实现，并在 Content 内固定 Viewport 与 scroll controls。Root 待评审项包括 `onValueChange`/`onOpenChange` 相对 signals、name/required/form、data-slot 及 forwarding；Root 无 upstream `asChild`。
      en: Upstream ScrollUpButton and ScrollDownButton remain missing and fixes Viewport and scroll controls inside Content. Root gaps include callbacks versus signals, name, required, form, data-slot, and forwarding; Root has no upstream `asChild`.
    blocks: [shadcn select parity roadmap]
sources:
  - path: packages/prototypes/shadcn/src/select/root.proto.ts
  - path: packages/prototypes/shadcn/test/select.test.ts
  - path: https://github.com/shadcn-ui/ui/blob/f31ed81983653919dd4fe77aee4b4859f610f1dc/apps/v4/registry/new-york-v4/ui/select.tsx
    label: Original Root comparison reference, not the structural-parts adoption reference
  - path: https://github.com/shadcn-ui/ui/blob/02cad61166c4c20edbc8a3f71bd720eed4c1f49b/apps/v4/registry/new-york-v4/ui/select.tsx
    label: Adopted structural-parts source
dependsOn:
  contracts: [C-AS-HOOK-0001, C-CORE-SYNTAX-0003, C-CORE-SYNTAX-0007]
  decisions: [D-PROTOTYPE-ENTITY-NAMING-0001]
inherits:
  prototypes:
    [
      {
        id: P-BASE-SELECT,
        note: Default inherited select-only protocol; explicit setup-time negative patches must be declared.,
      },
    ]
verifies: { tests: [T-SHADCN-SELECT-0001] }
revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Reconciled eleven current parts, preserved the original Root reference and identified the separately adopted fixed structural reference without asserting full parity.
  - version: 0.2.0-rc.0
    change: introduced
    summary: Introduced Shadcn Select Root delta cataloging with Base inheritance and centralized family-scope gaps.
tags: [prototype, shadcn, select, root, upstream-derived, delta, compatibility]

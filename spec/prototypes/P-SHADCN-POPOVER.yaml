      en: Does the project accept the provisional secondary/icon trigger, or should navigation follow the fixed upstream ghost/h-8/Menu appearance?
      zh-CN: 项目是否接受暂定 secondary/icon trigger，还是应按固定上游 ghost/h-8/Menu 外观完成导航？
    blocks:
      - activation:P-SHADCN-POPOVER
  - id: P-SHADCN-POPOVER-Q-ADMISSION
    question:
      zh-CN: 何时完成精确 head 的浏览器/native 证据并准入此 draft？
      en: When have exact-head browser/native evidence admitted this draft?
    blocks:

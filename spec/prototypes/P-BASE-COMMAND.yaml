id: P-BASE-COMMAND
type: prototype
title: Base command
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: 'Draft 实现方向，稳定准入需要独立审查及浏览器/native 证据。'
  en: 'Draft implementation direction. Stable admission requires independent review and browser/native evidence.'
summary: Base command protocol with shared Proto UI lifecycle and anatomy boundaries.
statement:
  zh-CN: 独立编写的 Proto UI 协议，复用 Base 共享能力和 L1 lifecycle。
  en: An independently authored Proto UI protocol reusing Base shared capabilities and L1 lifecycle.
criteria:
  - id: P-BASE-COMMAND-ADMISSION
    text:
      zh-CN: Draft 准入需要精确 head 的浏览器/native 证据和独立审查。
      en: Draft admission requires exact-head browser/native evidence and independent review.
  - id: P-BASE-COMMAND-TARGET-REVEAL
    text:
      en: Accepted keyboard navigation in the current open view must reveal its active option through C-SCROLL-TARGET-REVEAL-0001 on Content's vertical scroll surface while retaining editor focus. Pointer-only activation and disabled, read-only, composing or retired input must not request keyboard reveal. Consumer layout must keep that list viewport bounded; external scrolling and additional compiler or host profiles require separate admission.
      zh-CN: 当前打开 view 接受的键盘导航必须通过 Content 的纵向 scroll surface 和 C-SCROLL-TARGET-REVEAL-0001 显示 active option，保留编辑器焦点。仅 pointer 活动及 disabled、read-only、composing、退役输入不得请求键盘 reveal。消费者布局必须约束列表 viewport；外部滚动及额外 compiler/host profile 必须单独准入。
dependsOn:
  contracts:
    - C-PROPS-0001
    - C-LIFECYCLE-0008
    - { id: C-SCROLL-TARGET-REVEAL-0001, since: 0.3.0-alpha.2 }
verifies:
  tests:
    - { id: T-SCROLL-TARGET-REVEAL-0001, since: 0.3.0-alpha.2 }
sources:
  - path: packages/prototypes/base/src/command/
openQuestions:
  - id: P-BASE-COMMAND-Q-ADMISSION
    question:
      zh-CN: 何时完成精确 head 的浏览器/native 证据并准入此 draft？
      en: When have exact-head browser/native evidence admitted this draft?
    blocks:
      - activation:P-BASE-COMMAND
revisions:
  - version: 0.3.0-alpha.2
    change: revised
    summary: Defined keyboard active-item reveal through the existing Scroll owner while retaining editor focus and explicit additional-profile boundaries.
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Cataloged the Base command family as draft.
tags:
  - prototype
  - base
  - command

type: prototype
title: Bootstrap 2.3.2 Radio Group Item projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: >-
    Draft catalog relation for an implemented family projection against the pinned Bootstrap 2.3.2 vocabulary. Stable admission requires real consumers, browser/native evidence and independent review; source presence and private package availability are not release or conformance admission.


summary: Bootstrap Radio Group part over P-BASE-RADIO-GROUP-ITEM.
statement:
  en: >-
    The Prototype invokes asRadioGroupItem() once and preserves the exact Base protocol while adding family paint per its stated role.


criteria:
  - id: P-BOOTSTRAP-2-3-2-RADIO-GROUP-ITEM-BASE
    text:
      en: >-
        Invoke asRadioGroupItem() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias, jQuery/plugin API or Base.setup call.


  - id: P-BOOTSTRAP-2-3-2-RADIO-GROUP-ITEM-VISUAL
    text:
      en: >-
        Item is a labeled row per the Base item definition: it requests selection and derives checked; hover/disabled paint withdraws without owning selection.


  - id: P-BOOTSTRAP-2-3-2-RADIO-GROUP-ITEM-CLOSURE
    text:
      en: >-
        All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, Glyphicons, upstream JavaScript or Adapter component-name dispatch may supply default intent.


  - id: P-BOOTSTRAP-2-3-2-RADIO-GROUP-ITEM-BOUNDARY
    text:
      en: >-
        Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; the package is private and source-only. Catalog presence is a draft relation, not acceptance.



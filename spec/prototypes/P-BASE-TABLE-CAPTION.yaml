id: P-BASE-TABLE-CAPTION
type: prototype
title: Base Table Caption supplies App-owned purpose content
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Real source, Base evidence and bounded passing caption materialization exist for Web Component, React, Vue 3 and Vue 2, including a real React 19 consumer. Independent Checkpoint C review and explicit semantic/lifecycle admission remain incomplete; assistive-technology and non-Web support are not claimed.
  zh-CN: 已有真实 source、Base 证据与通过的有界 Web Component、React、Vue 3、Vue 2 caption materialization，包括真实 React 19 consumer。尚未完成 Checkpoint C 独立 review 与明确 semantic/lifecycle admission；不宣称 assistive-technology 或 non-Web support。
summary: Caption contributes one optional same-domain semantic object while preserving authored content.
statement:
  en: Base Table Caption claims the optional caption role, projects caption accessibility identity, and transparently preserves one anonymous App-owned slot.
  zh-CN: Base Table Caption 声明 optional caption role，投射 caption accessibility identity，并透明保留一个 App-owned anonymous slot。
criteria:
  - id: P-BASE-TABLE-CAPTION-ROLE
    text:
      en: At most one Caption belongs to the nearest Table domain and supplies the root caption relationship through an opaque semantic-object ref.
      zh-CN: 最近 Table domain 最多包含一个 Caption，并通过 opaque semantic-object ref 提供 root caption relationship。
  - id: P-BASE-TABLE-CAPTION-CONTENT
    text:
      en: Caption preserves authored content through one anonymous slot and Table Structure never parses it as data.
      zh-CN: Caption 通过一个 anonymous slot 保留 authored content，Table Structure 不得把它解析为 data。
dependsOn:
  contracts: [C-TABLE-STRUCTURE-0001]
  prototypes: [P-BASE-TABLE]
  modules: [M-TABLE-STRUCTURE-0001]
verifies: { tests: [T-TABLE-STRUCTURE-0001] }
openQuestions:
  - id: P-BASE-TABLE-CAPTION-Q-ADAPTERS
    question:
      en: Has the bounded four-Web-Adapter Caption evidence received independent Checkpoint C review and explicit admission?
      zh-CN: 有界四 Web Adapter Caption 证据是否已完成 Checkpoint C 独立 review 与明确 admission？
    blocks: [activation:P-BASE-TABLE-CAPTION]
sources:
  - path: packages/prototypes/base/src/table/caption.proto.ts
  - path: packages/prototypes/base/test/table.test.ts
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added the optional transparent Table Caption identity and semantic relationship source.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Recorded bounded Web Component caption materialization while retaining the remaining Adapter blockers.
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Recorded bounded caption naming evidence across four Web Adapters, including real React 19, while retaining independent Checkpoint C review and explicit admission as the draft boundary.
tags: [table, caption, base, prototype, draft]

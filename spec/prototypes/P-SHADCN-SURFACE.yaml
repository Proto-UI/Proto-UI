    change: revised
    summary: Explicitly admitted the bounded nine-profile passive action appearance, retaining native interaction ownership and separate modern and legacy source recipes; draft review and native evidence remain required.
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added reusable passive Surface atom, without page semantics or new navigation ownership.

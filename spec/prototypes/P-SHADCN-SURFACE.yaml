id: P-SHADCN-SURFACE
type: prototype
title: shadcn passive Surface atom
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Bounded passive presentation atom under current user-directed normalization. Draft pending independent review and exact-source browser evidence; native/compiler omissions remain explicit rather than implied by Web behavior.
summary: Reusable passive content surface with presentation-only facts, independent of any page or navigation protocol.
statement:
  en: Surface owns a slotted visual shell. Its consumer supplies layout, content and facts from the existing semantic owner. It does not own hover detection, focus, activation, selection, navigation, disclosure, clipboard, source editing or material effects. This design projection inherits Base Surface and lowers visual rules through standard feedback styles. No homepage, preview, code-toolbar or social-icon vocabulary is part of the API.
criteria:
  - id: P-SHADCN-SURFACE-PASSIVE
    text:
      en: Surface introduces no role, tabindex, focus request, event listener, activation, semantic state, native property forwarding or exposed method. Authored content remains in its original semantic ownership. Observed presentation inputs are not an event simulation or an independent interaction truth.
  - id: P-SHADCN-SURFACE-INPUTS
    text:
      en: Inputs are variant transparent|outline|secondary|muted|accent|solid|scrim, radius default|none|sm|md|lg|xl|full, border all|bottom|none, elevation none|raised, boolean hovered/focusVisible/pressed/current/fade, and observed transitionState closed|entering|entered|leaving. Defaults are outline/default/all/none, transitionState entered, and all booleans false. Absent inputs restore defaults. Family is not a Surface prop. Shadcn actionProfile none|rhea|luma is an explicit passive visual profile; none preserves these ordinary defaults.
  - id: P-SHADCN-SURFACE-PROJECTION
    text:
      en: The family inherits asSurfaceRoot and owns its finite fill, border, radius, depth and observed-feedback recipes through rule/feedback.style. Surface does not choose font, text size or content. Pointer hit ownership stays with the semantic host. Fade projects only the existing Transition owner phase; it does not create a clock, lifecycle, inertness or interaction state. Web surface-fade consumes --pui-surface-transition-duration, default 0ms, supplied only from finite nonnegative duration milliseconds by its composition owner. Reduced-motion uses 0ms. Scrim lowers to black at 80 percent opacity. Unsupported native lowering, including unresolved CSS duration variables and starting-style selectors, remains diagnostic, never an inferred support claim.
  - id: P-SHADCN-SURFACE-ENTRIES
    text:
      en: The public package root and /surface subpath expose Surface, with CLI registration for adapter facade consumption. Partial-family Surface defaults to neutral opaque outline presentation (transparent and scrim are ordinary fills, not material effects) and does not expand material or unrelated component compatibility guarantees.
  - id: P-SHADCN-SURFACE-PRESSED-PROJECTION
    text:
      en: An observed pressed fact on an ordinary actionProfile none surface does not imply Button motion or remove authored elevation. Explicit rhea and luma action appearances project their one-pixel pressed translation only; they do not apply scale or pressed shadow removal. Native navigation and activation ownership remains unchanged. This does not assign Button feedback to Sidebar, table-of-contents, or other non-action consumers.
  - id: P-SHADCN-SURFACE-ACTION-APPEARANCE
    text:
      en: The separate shadcnActionAppearance Web composition helper returns the public family Surface and Text props plus family-owned wrapping layout for an action label. The Shadcn-only actionProfile enum none|rhea|luma defaults to none; opt-in recipes use the named Button profile corner, border and focus/hover paint without changing ordinary Surface defaults. Its default minimum height matches the family default wrapped Button, while the native owner retains href, focus, Enter, modifiers, middle click, context menu and Space behavior. The label's nonselectable affordance does not suppress document or editor selection, intercept events or introduce Button semantics. This is a passive appearance composition, not admission of a Base Link prototype or a cross-host navigation API.

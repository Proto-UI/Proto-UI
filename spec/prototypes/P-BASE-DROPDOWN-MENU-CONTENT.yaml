revisions:
  - version: 0.3.0-alpha.0
    change: refined
    summary: Added the excludeAnchorTranslation positioning prop (default false) so design languages with decorative trigger transforms can opt into layout-position anchoring.
  - version: 0.2.0-rc.0
    change: introduced
    summary: Cataloged Content semantics, focus navigation, dismissal, Transition presence, positioning, and Portal ownership.
  - version: 0.2.0-rc.0
    change: refined
    summary: Bound typeahead expiry to the runtime delay policy and removed direct host scheduling.
  - version: 0.2.0-rc.0
    change: refined
    summary: Defined structure-first entry focus with a host-neutral stabilization fallback and Focus-owned target readiness.
  - version: 0.2.0-rc.0
    change: refined
    summary: Replaced private readiness handshakes and zero-delay entry retries with deferred Focus roving entry requests.
  - version: 0.2.0-rc.0
    change: refined
    summary: Made Item-action restoration conditional so composed actions may establish a new focus owner.
  - version: 0.2.0-rc.0
    change: refined
    summary: Allowed idempotent entry-intent replay at the public mounted checkpoint across detached view epochs.
  - version: 0.2.0-rc.0
    change: refined
    summary: Required entry focus to preserve host scroll until portal positioning is projected.
  - version: 0.2.0-rc.0
    change: refined
    summary: Kept perceptual animation independent from positioning geometry and made the resolved Trigger anchor an inside Boundary region.
tags: [prototype, base, dropdown-menu, content, overlay, transition, positioning, a11y]

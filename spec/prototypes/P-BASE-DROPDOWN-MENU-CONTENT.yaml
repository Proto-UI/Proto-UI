id: P-BASE-DROPDOWN-MENU-CONTENT
type: prototype
title: Base Dropdown Menu Content is a transitional positioned menu surface
status: draft
since: 0.2.0-rc.0
summary: Content binds Root visibility to Overlay and Transition, owns dismissal and menu navigation, and portals a collision-aware surface anchored to Trigger.
statement:
  zh-CN: Dropdown Menu Content 是 Root 同域中至多一个的 vertical menu surface。它从 Root open 派生 Overlay/Transition presence，使用 Trigger PartView 作为 anchor，并通过 renderer-owned Portal 与 fixed positioning 逃逸 clipping ancestor。Content 建立 menu focus entry、roving、typeahead、Escape/Tab/outside dismissal；所有 close 都回到 Root request channel。Transition 是 Overlay 的唯一 Presence driver，leave 完成前必须保留 view。
  en: Dropdown Menu Content is the optional, at-most-one vertical menu surface in the Root domain. It derives Overlay and Transition presence from Root open, uses the Trigger PartView as its anchor, and escapes clipping ancestors through a renderer-owned Portal with fixed positioning. Content establishes menu focus entry, roving, typeahead, and Escape, Tab, and outside dismissal, with every close returning to the Root request channel. Transition is the sole Overlay Presence driver and must retain the view until leave completes.
criteria:
  - id: P-BASE-DROPDOWN-MENU-CONTENT-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-dropdown-content` 与 `asDropdownContent` 必须是同一 Content protocol 的 authoring entries，并向下游选择性提供 Transition handle。'
      en: '`base-dropdown-content` and `asDropdownContent` must be authoring entries for the same Content protocol and selectively provide the Transition handle downstream.'
  - id: P-BASE-DROPDOWN-MENU-CONTENT-A11Y
    text:
      zh-CN: Content 必须投射 menu role、vertical orientation 与稳定 identity，并在 open 时通过 Focus roving entry request 把焦点进入一个 menu item；entry request 必须要求宿主保持当前滚动位置，以免 renderer-owned Portal 在 positioning 投射完成前因原生 focus scroll 移动页面。eligible Item 尚未加入或 target 尚未投影时，该请求必须由 Focus 与 adapter capability 保留。若 open fact 在 detached view epoch 已建立，Content 可以在公开的 mounted checkpoint 幂等重放同一 entry intent，但不得通过私有 expose handshake 或零延迟任务补偿 readiness。
      en: Content must project a menu role, vertical orientation, and stable identity, and must move focus into one menu item through a Focus roving entry request when opened; the entry request must ask the host to preserve the current scroll position so native focus scrolling cannot move the page before the renderer-owned portal has received its positioning projection. When no eligible Item has joined or its target has not been projected, Focus and the adapter capability must retain that request. If the open fact was established during a detached view epoch, Content may idempotently replay the same entry intent at the public mounted checkpoint, but must not compensate readiness through a private expose handshake or zero-delay task.
  - id: P-BASE-DROPDOWN-MENU-CONTENT-OVERLAY
    text:
      zh-CN: Content 必须消费 non-modal Overlay，启用 Escape 与 outside press dismissal、Trigger focus restore、Portal 和 anchored positioning；Overlay 不得直接改写 Root open fact。
      en: Content must consume a non-modal Overlay with Escape and outside-press dismissal, Trigger focus restoration, Portal, and anchored positioning; Overlay must not directly rewrite the Root open fact.
  - id: P-BASE-DROPDOWN-MENU-CONTENT-PRESENCE
    text:
      zh-CN: Content 必须以 `asTransition` 作为 Overlay 的唯一 Presence driver，在 logical close 后保留 leave view，并只在 closed 后执行 L1 detach；感知 enter/leave 动画不得插值 Overlay positioning 写入的几何属性。
      en: Content must bind `asTransition` as the sole Overlay Presence driver, retain the leaving view after logical close, and perform L1 detach only after closed; perceptual enter and leave animation must not interpolate geometric properties written by Overlay positioning.
  - id: P-BASE-DROPDOWN-MENU-CONTENT-POSITION
    text:
      zh-CN: Content 必须接受 side、align、sideOffset、alignOffset、avoidCollisions、collisionPadding 与 excludeAnchorTranslation；默认 bottom、center、4、0、true、0、false，并把运行时更新提交给 Overlay positioning policy。excludeAnchorTranslation 为 false 时定位必须基于 Trigger 的实际渲染几何。
      en: Content must accept side, align, sideOffset, alignOffset, avoidCollisions, collisionPadding, and excludeAnchorTranslation; defaults are bottom, center, 4, 0, true, 0, and false, and runtime updates must be submitted to Overlay positioning policy. With excludeAnchorTranslation false, positioning must use the Trigger's actual rendered geometry.
  - id: P-BASE-DROPDOWN-MENU-CONTENT-ANCHOR-PORTAL
    text:
      zh-CN: Content mounted 后必须注册同域 Trigger PartView；Overlay 必须把解析出的当前 Trigger target 同时用作 position anchor 与 inside Boundary region，使一次 Trigger pointer activation 只产生一次 toggle request。Content 使用 clipping-ancestor collision boundary、visual viewport root、flip/shift、fixed strategy 与 renderer-owned Portal，同时保持 logical Context/Anatomy ownership。
      en: After mounting, Content must register the same-domain Trigger PartView; Overlay must use its current resolved Trigger target as both the positioning anchor and an inside Boundary region so one Trigger pointer activation produces only one toggle request. Content uses a clipping-ancestor collision boundary, visual viewport root, flip and shift, fixed strategy, and a renderer-owned Portal while preserving logical Context and Anatomy ownership.
  - id: P-BASE-DROPDOWN-MENU-CONTENT-KEYBOARD
    text:
      zh-CN: Content 必须支持 ArrowDown/ArrowUp、Home/End 与 printable-character typeahead；typeahead buffer 的过期必须通过 runtime delay policy 表达，不得直接选择宿主计时 API；方向键可不 wrap，disabled item 仍可获得菜单内焦点但必须不能激活。
      en: Content must support ArrowDown and ArrowUp, Home and End, and printable-character typeahead; typeahead-buffer expiry must be expressed through the runtime delay policy rather than selecting a host timing API directly; arrow navigation may stop at boundaries, and disabled items remain focusable within the menu but must not activate.
  - id: P-BASE-DROPDOWN-MENU-CONTENT-DISMISS
    text:
      zh-CN: Escape 必须请求 close 并把焦点返回 Trigger；Item action close 仅在 menu 仍持有焦点时返回 Trigger，不得覆盖 action 已建立的新焦点；Tab/Shift+Tab 必须请求 close 而不阻止宿主继续焦点遍历；outside press 必须请求 close。受控模式不得绕过 owner。
      en: Escape must request close and return focus to Trigger; an Item-action close returns focus to Trigger only while the menu still owns focus and must not override focus newly established by the action; Tab and Shift+Tab must request close without preventing host focus traversal; outside press must request close. Controlled mode must not bypass its owner.

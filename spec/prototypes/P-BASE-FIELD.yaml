        min: 1
        max: 1
    label:
      cardinality:
        min: 0
        max: 1
    control:
      cardinality:
        min: 1
        max: 1
    description:
      cardinality:
        min: 0
        max: 1
    error:
      cardinality:
        min: 0
        max: 1
    validity:
      cardinality:
        min: 0
        max: "*"
  relations:
    - kind: contains
      parent: root
      child: label
    - kind: contains
      parent: root
      child: control
    - kind: contains
      parent: root
      child: description
    - kind: contains
      parent: root
      child: error
    - kind: contains
      parent: root
      child: validity

id: P-BASE-FIELD
type: prototype
title: Base Field root
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: Finf Field 的 draft 契约及投影。稳定准入仍需独立审查、精确 head 的原生输入、辅助技术、视觉/材质与 GPUI 证据；synthetic DOM 测试不建立这些保证。
  en: Draft Finf Field contract and projections. Stable admission requires independent review and exact-head
    native input, assistive technology, visual/material and GPUI evidence; synthetic DOM checks do not
    establish those guarantees.
summary: Governed atomic Field root and public authoring entry.
statement:
  zh-CN: The root realizes its exact part of C-FIELD-0001, without a second state owner or host escape.
  en: The root realizes its exact part of C-FIELD-0001, without a second state owner or host escape.
criteria:
  - id: P-BASE-FIELD-SEMANTICS
    text:
      zh-CN: Implements C-FIELD-0001-OWNER, C-FIELD-0001-ANATOMY, C-FIELD-0001-VALUES, C-FIELD-0001-OWNERSHIP,
        C-FIELD-0001-VALIDATION, C-FIELD-0001-ASYNC, C-FIELD-0001-BOUNDS for the root atom; preserves its
        documented JSON Props, exposes and lifecycle.
      en: Implements C-FIELD-0001-OWNER, C-FIELD-0001-ANATOMY, C-FIELD-0001-VALUES, C-FIELD-0001-OWNERSHIP,
        C-FIELD-0001-VALIDATION, C-FIELD-0001-ASYNC, C-FIELD-0001-BOUNDS for the root atom; preserves its
        documented JSON Props, exposes and lifecycle.

id: P-BASE-SELECT-CONTENT
type: prototype
title: Base Select Content is a transitional positioned listbox surface
status: draft
since: 0.2.0-rc.0
summary: Content binds Root visibility to Overlay and Transition, owns listbox focus navigation and dismissal, and portals an anchored option surface.
statement:
  zh-CN: Select Content 是 Root 同域中至多一个的 vertical listbox surface。它从 Root open 派生 Overlay/Transition presence，使用 Trigger PartView 作为 anchor，并建立 selected-or-boundary focus entry、asFocusRoving keyboard navigation、typeahead 与 Escape/Tab/outside dismissal。popup active option 与 committed selection 必须保持分离，所有 close 都回到 Root request entry。
  en: Select Content is the optional, at-most-one vertical listbox surface in the Root domain. It derives Overlay and Transition presence from Root open, uses the Trigger PartView as its anchor, and establishes selected-or-boundary focus entry, asFocusRoving keyboard navigation, typeahead, and Escape, Tab, and outside dismissal. Popup active option and committed selection must remain separate, and every close returns to the Root request entry.
criteria:
  - id: P-BASE-SELECT-CONTENT-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-select-content` 与 `asSelectContent` 必须是同一 Content protocol 的 authoring entries，并向下游提供 Transition handle。'
      en: '`base-select-content` and `asSelectContent` must be authoring entries for the same Content protocol and provide the Transition handle downstream.'
  - id: P-BASE-SELECT-CONTENT-A11Y
    text:
      zh-CN: Content 必须投射 listbox role、vertical orientation 与稳定 identity；open entry 必须等本轮同步挂载的 Item collection 稳定后，把 DOM focus 移到 selected enabled Item，缺失时才按 request boundary 进入 enabled Item；不得因 adapter 逐项挂载而过早聚焦首项。
      en: Content must project a listbox role, vertical orientation, and stable identity; open entry must wait until the synchronously mounted Item collection for the current turn is stable, then move DOM focus to the selected enabled Item or, only when absent, to an enabled Item at the requested boundary; adapter-by-adapter item mounting must not cause an early first-item fallback.
  - id: P-BASE-SELECT-CONTENT-FOCUS-ROVING
    text:
      zh-CN: Content 必须以 `asFocusRoving` 作为 ArrowUp/ArrowDown/Home/End、orientation、boundary 与 deferred entry 的唯一 owner；不得消费 `useFocusRoving` 或让 Item 手动转发 sibling movement。
      en: Content must use `asFocusRoving` as the sole owner of ArrowUp, ArrowDown, Home, End, orientation, boundaries, and deferred entry; it must not consume `useFocusRoving` or make Items manually forward sibling movement.
  - id: P-BASE-SELECT-CONTENT-OVERLAY-PRESENCE
    text:
      zh-CN: Content 必须消费 non-modal Overlay，并以 `asTransition` 作为唯一 Presence driver；logical close 后保留 leave view，只在 closed 后 detach。
      en: Content must consume a non-modal Overlay and bind `asTransition` as its sole Presence driver; it must retain the leaving view after logical close and detach only after reaching closed.
  - id: P-BASE-SELECT-CONTENT-POSITION
    text:
      zh-CN: Content 必须接受 side、align、sideOffset、alignOffset、avoidCollisions 与 collisionPadding，把运行时更新提交给 fixed、portal、Trigger-anchored positioning policy。
      en: Content must accept side, align, sideOffset, alignOffset, avoidCollisions, and collisionPadding and submit runtime updates to a fixed, portaled, Trigger-anchored positioning policy.
  - id: P-BASE-SELECT-CONTENT-KEYBOARD
    text:
      zh-CN: open Content 必须支持 ArrowDown/ArrowUp、Home/End、Enter/Space commit 与 printable-character typeahead；typeahead expiry 必须消费 runtime delay policy，disabled Item 必须从 focus navigation 与 commit 中排除。
      en: Open Content must support ArrowDown, ArrowUp, Home, End, Enter and Space commit, and printable-character typeahead; typeahead expiry must consume the runtime delay policy, and disabled Items must be excluded from focus navigation and commit.
  - id: P-BASE-SELECT-CONTENT-DISMISS
    text:
      zh-CN: Escape 必须 close 且不改变 selection，并把焦点返回 Trigger；Tab 必须 close 而不阻止宿主遍历，包括 deferred entry 尚未完成且焦点仍在同域唯一 Trigger 的阶段；outside press 必须 close；Trigger activation 必须被 inside Boundary 识别以避免一次 pointer activation 产生二次 toggle。
      en: Escape must close without changing selection and return focus to Trigger, Tab must close without preventing host traversal, including deferred entry while the unique same-domain Trigger still owns focus, outside press must close, and Trigger activation must be classified inside the Boundary to avoid a double toggle from one pointer activation.
  - id: P-BASE-SELECT-CONTENT-DEFERRED-SURFACES
    text:
      zh-CN: item-aligned positioning、Viewport、scroll controls 与虚拟化不属于当前 Base Content 保证；下游只能对已实现的 anchored popper 行为声明兼容。
      en: Item-aligned positioning, Viewport, scroll controls, and virtualization are outside the current Base Content guarantee; downstream layers may claim compatibility only for implemented anchored popper behavior.

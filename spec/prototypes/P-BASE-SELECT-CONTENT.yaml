      since: 0.3.0-alpha.1
revisions:
  - version: 0.3.0-alpha.1
    change: extended
    summary: Defined an internal initial-alignment intent resolver as an unwired S1 slice, preserving the runtime item-aligned gap and unresolved compatibility boundaries.
  - version: 0.2.0-rc.0
    change: introduced
    summary: Cataloged Content listbox semantics, asFocusRoving ownership, Overlay and Transition presence, positioning, keyboard behavior, and dismissal.
  - version: 0.2.0-rc.0
    change: clarified
    summary: Required selected-option entry focus to wait for a stable synchronously mounted Item collection across adapters.
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Tab dismissal covers Trigger focus during deferred entry and cancels the pending entry without preventing host traversal.
tags:
  [prototype, base, select, content, listbox, focus-roving, overlay, transition, positioning, a11y]

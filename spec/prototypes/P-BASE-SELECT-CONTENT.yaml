id: P-BASE-SELECT-CONTENT
type: prototype
title: Base Select Content is a transitional positioned listbox surface
status: draft
since: 0.2.0-rc.0
summary: Content binds Root visibility to Overlay and Transition, owns listbox focus navigation and dismissal, and portals an anchored option surface.
statement:
  zh-CN: Select Content 是 Root 同域中至多一个的 vertical listbox surface。它从 Root open 派生 Overlay/Transition presence，使用 Trigger PartView 作为 anchor，并建立 selected-or-boundary focus entry、asFocusRoving keyboard navigation、typeahead 与 Escape/Tab/outside dismissal。popup active option 与 committed selection 必须保持分离，普通 dismissal 都回到 Root request entry；具名结构错误可独立终止 presentation，但不改变 Root 事实。
  en: Select Content is the optional, at-most-one vertical listbox surface in the Root domain. It derives Overlay and Transition presence from Root open, uses the Trigger PartView as its anchor, and establishes selected-or-boundary focus entry, asFocusRoving keyboard navigation, typeahead, and Escape, Tab, and outside dismissal. Popup active option and committed selection must remain separate, and every ordinary dismissal returns to the Root request entry; a named structural failure may separately abort presentation without changing Root facts.
criteria:
  - id: P-BASE-SELECT-CONTENT-AUTHORING-ENTRIES
    text:
      zh-CN: "'`base-select-content` 与 `asSelectContent` 必须是同一 Content protocol 的 authoring entries，并向下游提供 Transition handle。'"
      en: "'`base-select-content` and `asSelectContent` must be authoring entries for the same Content protocol and provide the Transition handle downstream.'"
  - id: P-BASE-SELECT-CONTENT-A11Y
    text:
      zh-CN: 'Content 必须投射 listbox role、vertical orientation 与稳定 identity；open entry 必须等本轮同步挂载的 Item collection 稳定后，把 DOM focus 移到 selected enabled Item，缺失时才按 request boundary 进入 enabled Item；不得因 adapter 逐项挂载而过早聚焦首项。'
      en: 'Content must project a listbox role, vertical orientation, and stable identity; open entry must wait until the synchronously mounted Item collection for the current turn is stable, then move DOM focus to the selected enabled Item or, only when absent, to an enabled Item at the requested boundary; adapter-by-adapter item mounting must not cause an early first-item fallback.'
  - id: P-BASE-SELECT-CONTENT-FOCUS-ROVING
    text:
      zh-CN: 'Content 必须以 `asFocusRoving` 作为 ArrowUp/ArrowDown/Home/End、orientation、boundary 与 deferred entry 的唯一 owner；不得消费 `useFocusRoving` 或让 Item 手动转发 sibling movement。'
      en: 'Content must use `asFocusRoving` as the sole owner of ArrowUp, ArrowDown, Home, End, orientation, boundaries, and deferred entry; it must not consume `useFocusRoving` or make Items manually forward sibling movement.'
  - id: P-BASE-SELECT-CONTENT-OVERLAY-PRESENCE
    text:
      zh-CN: 'Content 必须消费 non-modal Overlay，并以 `asTransition` 作为唯一 Presence driver；普通 dismissal 只有 Root 已提交 open=false 才能驱动 leave，随后按配置保留 leave view，只在 closed 后 detach。受控 owner 拒绝 close 请求时，不得暂时 entering/leaving、撤销准备或重置 focus/scroll。'
      en: 'Content must consume a non-modal Overlay and bind `asTransition` as its sole Presence driver; ordinary dismissal drives leave only for Root committed open=false; it then retains the configured leaving view and detaches only after reaching closed. A controlled owner refusing a close request must not transiently enter/leave, cancel preparation, or reset focus/scroll.'
  - id: P-BASE-SELECT-CONTENT-POSITION
    text:
      zh-CN: 'Content 必须接受 side、align、sideOffset、alignOffset、avoidCollisions 与 collisionPadding，把运行时更新提交给 fixed、portal、Trigger-anchored positioning policy。'
      en: 'Content must accept side, align, sideOffset, alignOffset, avoidCollisions, and collisionPadding and submit runtime updates to a fixed, portaled, Trigger-anchored positioning policy.'
  - id: P-BASE-SELECT-CONTENT-KEYBOARD
    text:
      zh-CN: 'open Content 必须支持 ArrowDown/ArrowUp、Home/End、Enter/Space commit 与 printable-character typeahead；typeahead expiry 必须消费 runtime delay policy，disabled Item 必须从 focus navigation 与 commit 中排除。'
      en: 'Open Content must support ArrowDown, ArrowUp, Home, End, Enter and Space commit, and printable-character typeahead; typeahead expiry must consume the runtime delay policy, and disabled Items must be excluded from focus navigation and commit.'
  - id: P-BASE-SELECT-CONTENT-DISMISS
    text:
      zh-CN: 'Escape 必须 close 且不改变 selection，并把焦点返回 Trigger；Tab 必须 close 而不阻止宿主遍历，包括 deferred entry 尚未完成且焦点仍在同域唯一 Trigger 的阶段；outside press 必须 close；Trigger activation 必须被 inside Boundary 识别以避免一次 pointer activation 产生二次 toggle。'
      en: 'Escape must close without changing selection and return focus to Trigger, Tab must close without preventing host traversal, including deferred entry while the unique same-domain Trigger still owns focus, outside press must close, and Trigger activation must be classified inside the Boundary to avoid a double toggle from one pointer activation.'
  - id: P-BASE-SELECT-CONTENT-INITIAL-ALIGNMENT-INTENT
    text:
      en: "'The internal S1 resolver accepts explicit mode, committed value with an unset distinction, ordered semantic records with associated row/text PartView identities, reference identities and an initial-collection settlement phase. Explicit popper preserves edge config. In a settled ordinary initial collection, a unique enabled match wins; unset or unmatched value uses the first enabled record. Duplicate values, disabled selected compatibility, missing associated targets, empty/all-disabled collections, unsettled collections and already-open updates remain named unresolved results, not automatic popper policy. No focus candidate, speculative controlled request, geometry or host query selects targets. Neutral constraints are immutable and explicit. The pure initial resolver alone does not establish runtime alignment; the Content presentation-admission and current-request criteria govern consumer wiring.'"
  - id: P-BASE-SELECT-CONTENT-PRESENTATION-ADMISSION
    text:
      zh-CN: 'Content 是唯一 presence owner；Root open/selection 事实与组合 admission 分离。仅在本次同步组合已经提交后分类。legacy（零 Surface/Viewport/ItemText）及 explicit popper 清除旧 target binding/Surface Boundary 替换，使用原 edge policy 并释放当前冷 gate；不得在未 settled 时先显示 edge 再跳 aligned。full-pending 保留可测 view，隐藏且不启动默认 delay 焦点任务，等待当前定位请求。valid 仅由当前 request 的 applied 进入，释放本次 gate 后复核最新 Root open/value 与 request 再聚焦一次。structure-invalid 是具名 presentation abort，不伪造 Root close/openChange 或改变 selection；Content 撤销定位 binding、旧 release、entry task、geometry observers 与 focus scope并终结为 closed，仅保留结构恢复订阅。无关 Context/value 更新不得重启；合法结构重新提交或显式 mode 转 popper 才可重新 admission。unsupported-selection 必须与结构错误分开，仅合法已注册选值或显式 mode 变更恢复。geometry-unavailable 另以 select.geometry 原因诊断并终结 presentation，不冒充作者结构错误；仅新一次真实关闭后重开、结构修复或显式 popper 重试，无关 Context 不循环。冷准备期间 Content 尚未 mounted 时不能承担 Trigger 输入；Trigger 自己处理持焦 Tab，各 Item 仅在自己的 portable 根事件处理自身持焦 Tab（不是 Content global 当前焦点再判），均不阻止原生 Tab 默认动作且同事件只发一个关闭请求。Trigger/Item 通过既有 requestSelectOpen 在请求前调用同域唯一当前 Content 的内部 __cancelPendingEntry；该命令只撤销当前 open epoch 的 delay/applied 自动焦点，不改 presence、Root 或几何 gate，迟到 item/measure 不复活焦点。只有 committed false→true 后重新允许入场；缺失/歧义 Content 不随意选第一个。撤回 view 时以同域当前 Item 的实际 focused 事实确认归属（不得套用过滤 disabled 的导航候选表），仅在其已知 option 仍持有焦点时还焦 Trigger，不夺取外部焦点。'
      en: 'Content is the sole presence owner; Root open/selection facts are separate from composition admission. Classify only after the current synchronous composition commits. Legacy (no Surface/Viewport/ItemText) and explicit popper clear old target binding and Surface Boundary replacement, use the existing edge policy, and release the current cold gate; an unsettled composition must not first reveal edge and then jump to aligned. Full-pending retains a measurable view, stays hidden, and starts no default delayed focus task while awaiting the current positioning request. Valid follows only applied from the current request; after gate release, recheck current Root open/value and request before focusing once. Structure-invalid is a named presentation abort without a Root close/openChange or selection mutation; Content cancels binding, old releases, entry tasks, geometry observers, and focus scope, reaching closed while retaining structural recovery subscriptions. Unrelated Context/value updates cannot restart it; a newly committed valid structure or explicit mode change to popper may readmit. Unsupported-selection is distinct from structural errors and recovers only for a valid represented selection or explicit mode change. Geometry-unavailable terminates presentation with a distinct select.geometry diagnostic rather than an author-structure error; retry requires an actual closed/reopen cycle, structural repair, or explicit popper, not unrelated Context updates. A cold Content that has not mounted cannot own Trigger input: Trigger handles Tab while it owns focus, while each Item handles its own focused Tab through its portable root event rather than Content global current-focus reclassification. Neither prevents native Tab default behavior, and the same event submits only one close request. Before requesting, Trigger/Item use existing requestSelectOpen to call internal __cancelPendingEntry on the unique current same-domain Content. It revokes delayed/applied automatic focus for this open epoch without changing presence, Root, or the geometry gate; late items/measurement cannot revive focus. Only a committed false→true cycle permits entry again. Missing/ambiguous Content never selects an arbitrary first part. Withdrawal determines ownership from current same-domain Item focused facts, without filtering out disabled navigation candidates, and restores Trigger focus only when a known option still owns focus, never stealing external focus.'
  - id: P-BASE-SELECT-CONTENT-CURRENT-ALIGNMENT-INTENT
    text:
      zh-CN: 'Base position 默认 popper；下游可明确声明 item-aligned 默认。完整组合首次结算使用既有 initial intent；已打开后的 committed value 替换只准入唯一 enabled、已注册且具有实际唯一 ItemText 的匹配项，不将首次注册的 first-enabled fallback 泛化为运行期 fallback。同值 Context 重复不得重置 viewport scroll 或重新居中；Root 将有序 collection 的 value/textValue/disabled 标量快照去重后才增加内部 collectionRevision，并在任何通知前保存快照与版本；重复通知不增版本。新值、记录版本、part 退役/替换、mode 变更与关闭必须先失效旧 request。key 与交付复核均比较版本；版本不是 identity/readiness，也不能解锁 structure-invalid 或重置 initial 状态。合法记录修复允许重试 unsupported-selection/geometry-unavailable。成功 initial fallback 后，仅 Root committed value 和结构版本连续未变（首次偏离或退出 item-aligned 永久作废该记录）的 metadata-only 更新可验证并保留当时唯一 enabled candidate.value；不得重新挑 first-enabled，不比较 PartView/expose wrapper 身份，原候选 disabled/换值/消失或结构变更仍走 current resolver 的具名边界。撤回 beforeLeave 时若当前 Root 已换值，保留 view 仍须更新 current target；旧 release/focus 不得覆盖。'
      en: 'Base position defaults to popper; a downstream prototype may explicitly default to item-aligned. A full composition initially uses the existing initial intent; an already-open committed value replacement admits only a unique enabled registered match with one actual ItemText, without generalizing the first-registration first-enabled fallback into runtime fallback. Repeated same-value Context must not reset viewport scroll or recenter. Root increments internal collectionRevision only after deduplicating the ordered value/textValue/disabled scalar snapshot, saving snapshot and version before any notification. Repeated notifications do not increment it. A new value or record revision, retired/replaced part, mode change, or close invalidates the old request first. Both request keys and delivery checks compare revision; it is not identity/readiness and cannot unlock structure-invalid or reset initial state. Valid record repair may retry unsupported-selection/geometry-unavailable. After successful initial fallback, a metadata-only update may validate and retain that same unique enabled candidate.value only while Root committed value and structure version remain continuously unchanged (the first deviation or exit from item-aligned permanently invalidates that record). It must not choose a new first-enabled candidate or compare PartView/expose wrapper identity; candidate disability, changed/missing value, or structural changes remain subject to the named current-resolver boundary. When beforeLeave is withdrawn after Root value changes, the retained view must still update its current target; stale release/focus cannot override it.'
  - id: P-BASE-SELECT-CONTENT-DEFERRED-SURFACES
    text:
      zh-CN: 'item-aligned 仅保证已准入的完整实际 parts 组合及选值范围；零 Surface legacy 不计作默认对齐完成。Scroll buttons、虚拟化及未准入的 disabled/unknown 更新兼容仍不在保证内。'
      en: 'Item alignment is bounded to the admitted complete real-parts composition and selection subset; zero-Surface legacy does not count as completed default alignment. Scroll buttons, virtualization, and unadmitted disabled/unknown update compatibility remain outside the guarantee.'

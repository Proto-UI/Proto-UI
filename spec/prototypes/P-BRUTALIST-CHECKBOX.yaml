id: P-BRUTALIST-CHECKBOX
type: prototype
title: Brutalist Checkbox Root inherits Base Checkbox and layers a square check surface
status: draft
since: 0.3.0-alpha.1
summary: >-
  Brutalist Checkbox Root inherits Base Checkbox interaction semantics and projects a square visual surface: zero radius, black structural borders, hard offset shadow, flat resting fill, checked fill swap, pressed shadow removal, focus-visible ring, and disabled de-emphasis.


statement:
  en: >-
    Brutalist Checkbox Root is a draft Proto UI-maintained Neo-Brutalist design-language projection over Base Checkbox. It preserves inherited Base protocol semantics (checked/defaultChecked/disabled/indeterminate) and adds only visual/style behavior: zero radius, black structural borders, hard offset shadows, a checked fill swap, pressed feedback, a focus-visible ring, and disabled de-emphasis.


  zh-CN: >-
    Brutalist Checkbox Root 是 Proto UI 维护的 draft Neo-Brutalist design-language 投射，建立在 Base Checkbox 之上。它保留继承的 Base 协议语义（checked/defaultChecked/disabled/indeterminate），仅增加视觉/style 行为：零圆角、黑色结构边框、硬偏移阴影、checked 填充切换、pressed 反馈、focus-visible ring 与 disabled 降阶。


criteria:
  - id: P-BRUTALIST-CHECKBOX-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Checkbox through `asCheckboxRoot()` once and must not redefine Base checked, pressed, focus-visible, or disabled protocol semantics. Visual projection may only consume the projected state handles (`checked`, `disabled`, `focusVisible`, `pressed`).

      zh-CN: >-
        该 prototype 必须通过 `asCheckboxRoot()` 一次性继承 Base Checkbox，不得重定义 Base 的 checked、pressed、focus-visible 或 disabled 协议语义；视觉投射只能消费投影出的 state handles。

  - id: P-BRUTALIST-CHECKBOX-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-checkbox-root` and is the only public Checkbox Root entry in this foundation slice.
      zh-CN: 直接 prototype 入口名为 `brutalist-checkbox-root`，且是本 foundation 切片中唯一公开的 Checkbox Root 入口。
  - id: P-BRUTALIST-CHECKBOX-VISUAL-GRAMMAR
    text:
      en: >-
        The root visual surface must preserve square corners (`rounded-none`), black structural borders (`border-2 border-black`), a hard zero-blur offset shadow (`shadow-[3px_3px_0_0_#000]`), and a flat `bg-main` resting fill without gradients, glass, rounded cards, or soft elevation. Checked swaps the fill to `bg-foreground text-main`; pressed clears the shadow with `shadow-none`.

      zh-CN: >-
        root 视觉表面必须保持直角（`rounded-none`）、黑色结构边框（`border-2 border-black`）、零模糊硬偏移阴影（`shadow-[3px_3px_0_0_#000]`）与平面 `bg-main` 静止填充，不得使用渐变、玻璃拟态、圆角卡片或柔和高度阴影。Checked 将填充切换为 `bg-foreground text-main`；pressed 以 `shadow-none` 清除阴影。

  - id: P-BRUTALIST-CHECKBOX-INTERACTION
    text:
      en: >-
        Focus-visible applies a hard ring with offset. Disabled reduces emphasis with `opacity-50` and `pointer-events-none` while preserving geometry.

      zh-CN: >-
        Focus-visible 使用带 offset 的硬 ring。Disabled 以 `opacity-50` 与 `pointer-events-none` 降低强调，同时保留几何。



id: P-BRUTALIST-CHECKBOX
type: prototype
title: Brutalist Checkbox Root inherits Base Checkbox and layers a square check surface
status: draft
since: 0.3.0-alpha.0
summary: >-
  Brutalist Checkbox retains Base ownership and projects the pinned 16px outlined Neo control, with main-colored checked/mixed fill and a derived passive glyph.


statement:
  en: This draft inherits the single Base Checkbox value, activation, disabled, focus, event and accessibility owners. The pinned Neo 3306a802 checkbox.tsx supplies the 16px outline-based geometry and checked/mixed main fill. Root/Indicator public anatomy remains unchanged. Existing Proto UI disabled suppression and theme-aware focus ring are retained; no exact upstream API or complete visual parity is claimed.
  zh-CN: 该 draft 继承唯一 Base Checkbox value、activation、disabled、focus、event 与 accessibility owner。固定 Neo 3306a802 checkbox.tsx 提供 16px outline 几何及 checked/mixed main fill；Root/Indicator 公开 anatomy 不变。保留既有 Proto UI disabled suppression 与 theme-aware focus ring，不声称完整上游 API 或视觉一致。

criteria:
  - id: P-BRUTALIST-CHECKBOX-BASE-INHERITANCE
    text:
      en: >-
        The Root must inherit P-BASE-CHECKBOX through asCheckboxRoot() and may consume its checked, indeterminate, disabled, focusVisible, and pressed handles only for presentation.


      zh-CN: >-
        Root 必须通过 asCheckboxRoot() 继承 P-BASE-CHECKBOX，且只能为呈现消费其 checked、indeterminate、disabled、focusVisible 与 pressed handles。


    references:
      prototypes:
        - id: P-BASE-CHECKBOX
          anchors:
            - P-BASE-CHECKBOX-ROOT-SEMANTIC-OWNER
            - P-BASE-CHECKBOX-CONTROLLED-CHECKED
            - P-BASE-CHECKBOX-ACTIVATION-FLIPS-CHECKED
            - P-BASE-CHECKBOX-ACCESSIBLE-ROLE
  - id: P-BRUTALIST-CHECKBOX-DIRECT-ENTRY
    text:
      en: The direct Root entry is brutalist-checkbox-root and this layer provides no authored asHook.
      zh-CN: Root direct entry 为 brutalist-checkbox-root，且本层不提供 authored asHook。
  - id: P-BRUTALIST-CHECKBOX-PUBLIC-PACKAGE-NO-CLI
    text:
      en: >-
        The already-public @proto.ui/prototypes-brutalist package must export Root and Indicator from its root and ./checkbox anatomy subpath. Checkbox must not enter the proto-ui add registry and creates no package, publication channel, or independent release commitment.


      zh-CN: >-
        已公开的 @proto.ui/prototypes-brutalist package 必须从 package root 与 ./checkbox anatomy subpath 导出 Root 和 Indicator。Checkbox 不得进入 proto-ui add registry，也不创建 package、 publication channel 或独立 release commitment。


  - id: P-BRUTALIST-CHECKBOX-CURRENT-VISUAL-SURFACE
    text:
      en: Root projects flex size-4 shrink-0 items-center justify-center rounded-none outline-2 outline-border bg-transparent select-none transition-none. The 16px box uses an external 2px outline rather than an internal border; it has no resting main fill, outer shadow, gradient, glass or rounded-card treatment.
      zh-CN: Root 投射 flex size-4 shrink-0 items-center justify-center rounded-none outline-2 outline-border bg-transparent select-none transition-none。16px box 使用外侧 2px outline，而非内部 border；静止态无 main fill、外侧阴影、gradient、glass 或 rounded-card。

  - id: P-BRUTALIST-CHECKBOX-STATE-PRESENTATION
    text:
      en: Checked or indeterminate selects bg-main text-main-foreground together; the Indicator retains mixed-glyph precedence. Unchecked returns to a transparent surface with the same outline. The existing theme-aware hard focus ring replaces the resting outline while visible. Disabled retains pointer-events-none opacity-50 and adds cursor-not-allowed. Press changes no geometry or shadow and owns no additional state. Upstream invalid styles remain omitted because this layer adds no validation owner.
      zh-CN: checked 或 indeterminate 同时选择 bg-main text-main-foreground；Indicator 保留 mixed glyph 优先级。unchecked 回到透明底与相同 outline；既有 theme-aware 硬 focus ring 在可见时替换静止 outline。disabled 保留 pointer-events-none opacity-50 并加 cursor-not-allowed；press 不改变几何或阴影、不新增状态。因本层不新增 validation owner，仍不投射上游 invalid 样式。

  - id: P-BRUTALIST-CHECKBOX-ADMITTED-ANATOMY
    text:
      en: Root and Indicator are the only admitted identities; no Label, Group, HiddenInput, styled-only duplicate, or raw class alias is added.
      zh-CN: Root 与 Indicator 是唯一 admitted identities；不得增加 Label、Group、HiddenInput、styled-only duplicate 或 raw class alias。
  - id: P-BRUTALIST-CHECKBOX-BOUNDARY
    text:
      en: >-
        The projection must add no second checked, indeterminate, activation, disabled, focus, event, form, or accessibility owner and must not add variants, event callbacks, submission, or validation.


      zh-CN: >-
        该投射不得增加第二个 checked、indeterminate、activation、disabled、focus、event、form 或 accessibility owner，也不得增加 variants、event callbacks、submission 或 validation。



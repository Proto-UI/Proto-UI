  contracts:
    - C-ANATOMY-0004
    - C-CONTEXT-0006
    - C-STATE-0001
    - C-A11Y-0001
    - C-AS-FOCUS-ENTRY-0001
  decisions:
    - D-A11Y-PART-RELATIONSHIP-PROJECTION-0001
    - D-FOCUS-ENTRY-DELEGATION-0001
verifies:
  tests:
    - T-BASE-TABS-0001
revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Migrated reciprocal Tabs accessibility relationships to the exact-key same-domain service without changing selection, Context or focus ownership.
  - version: 0.1.0
    change: introduced
    summary: Added the first Base Tabs Content protocol catalog.
  - version: 0.1.1
    change: refined
    summary: Replaced deferred tabpanel focus entry gap with descendant-first focus entry requirement.
  - version: 0.1.2
    change: expanded
    summary: Added lazyMount, unmountOnExit, and keepMounted view policies on the repeatable lifecycle model.
  - version: 0.1.3
    change: breaking
    summary: Replaced the three-boolean presence policy with default L1 detach and the single keepMounted retention option.
tags:
  - prototype
  - base
  - tabs
  - content
  - tabpanel

id: P-BRUTALIST-DIALOG-FOOTER
type: prototype
title: 'Brutalist Dialog Footer is an optional layout-only anatomy part'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Dialog Footer is an optional layout-only anatomy part inside the DIALOG_FAMILY. It has no Base prototype to inherit; the projection is limited to the direct entry, a DIALOG_FAMILY footer anatomy claim, and a top-bordered flex-col-reverse layout surface.'

statement:
  en: P-BRUTALIST-DIALOG-FOOTER preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-DIALOG-FOOTER 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-DIALOG-FOOTER-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-dialog-footer`.
      zh-CN: 直接 prototype 入口名为 `brutalist-dialog-footer`。
  - id: P-BRUTALIST-DIALOG-FOOTER-ANATOMY
    text:
      en: >-
        The prototype claims the `footer` role inside the `DIALOG_FAMILY` anatomy and forwards its slot content. It is optional and does not own open/close or interaction semantics.


      zh-CN: >-
        该 prototype 在 `DIALOG_FAMILY` anatomy 中声明 `footer` 角色并透传其 slot 内容。它是可选的，不持有 open/close 或交互语义。


  - id: P-BRUTALIST-DIALOG-FOOTER-VISUAL-GRAMMAR
    text:
      en: >-
        Footer owns flex flex-col-reverse gap-2 pt-3 justify-end layout, with no compulsory separator, fill or shadow; composed controls retain their own semantics.


      zh-CN: >-
        Footer 拥有 flex flex-col-reverse gap-2 pt-3 justify-end 布局，不强制 separator、fill 或 shadow；组合 control 保留自身语义。



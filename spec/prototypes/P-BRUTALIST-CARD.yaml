id: P-BRUTALIST-CARD
type: prototype
title: 'Brutalist Card styled-only surface'

status: draft
since: 0.2.0-rc.7
summary: 'Passive four-part Neo-Brutalist visual grouping surface.'

statement:
  en: P-BRUTALIST-CARD preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-CARD 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-CARD-PASSIVE-BOUNDARY
    text:
      en: Root is roleless and non-focusable and exposes no interactive, clickable, selectable, activation, selection, event, state, command, or method surface.
      zh-CN: Root 无 role、不可聚焦，且不暴露 interactive、clickable、selectable、activation、selection、event、state、command 或 method surface。
  - id: P-BRUTALIST-CARD-REDUCED-ANATOMY
    text:
      en: The public Card module contains only Root, Header, Content, and Footer; title and description use ordinary content, while actions use Button or Link composition.
      zh-CN: 公开 Card module 只包含 Root、Header、Content 与 Footer；title 与 description 使用普通内容，action 使用 Button 或 Link 组合。
  - id: P-BRUTALIST-CARD-ROOT-VISUAL
    text:
      en: >-
        Root projects a 5px rounded 2px black frame, paper fill, vertical grouping, 4px 4px zero-blur black shadow and font-sans font-medium. It has no implicit content semantics.


      zh-CN: >-
        Root 投射 5px 圆角、2px 黑色 frame、paper fill、垂直分组、4px 4px 零模糊黑影与 font-sans font-medium，不隐含内容语义。


sources:

id: P-BRUTALIST-CARD
type: prototype
title: Brutalist Card styled-only surface
status: draft
since: 0.2.0-rc.7
summary: Passive four-part Neo-Brutalist visual grouping surface.
statement:
  en: Brutalist Card directly owns Root, Header, Content, and Footer visual regions without a Base counterpart; ordinary text and interactive children retain their own semantics.
  zh-CN: Brutalist Card 直接拥有 Root、Header、Content 与 Footer 视觉区域而不依赖 Base counterpart；普通文本与交互 child 保留各自语义。
criteria:
  - id: P-BRUTALIST-CARD-PASSIVE-BOUNDARY
    text:
      en: Root is roleless and non-focusable and exposes no interactive, clickable, selectable, activation, selection, event, state, command, or method surface.
      zh-CN: Root 无 role、不可聚焦，且不暴露 interactive、clickable、selectable、activation、selection、event、state、command 或 method surface。
  - id: P-BRUTALIST-CARD-REDUCED-ANATOMY
    text:
      en: The public Card module contains only Root, Header, Content, and Footer; title and description use ordinary content, while actions use Button or Link composition.
      zh-CN: 公开 Card module 只包含 Root、Header、Content 与 Footer；title 与 description 使用普通内容，action 使用 Button 或 Link 组合。
  - id: P-BRUTALIST-CARD-ROOT-VISUAL
    text:
      en: Root projects a square 2px ink frame, paper fill, vertical grouping, and a zero-blur hard offset shadow.
      zh-CN: Root 投射方形 2px ink frame、paper fill、垂直分组与零模糊硬偏移阴影。
sources:
  - path: packages/prototypes/brutalist/src/card/index.ts
  - path: packages/prototypes/brutalist/src/card/root.proto.ts
relates:
  knowledge: [K-BRUTALIST-0001]
dependsOn:
  contracts: [C-CORE-SYNTAX-0003, C-FEEDBACK-STYLE-0002, C-FEEDBACK-STYLE-0003]
revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: Introduced the direct styled-only Brutalist Card surface.
tags:
  - prototype
  - brutalist
  - card
verifies:
  tests:
    - T-BRUTALIST-CARD-0001

id: P-BOOTSTRAP-2-3-2-SURFACE
type: prototype
title: bootstrap-2-3-2 passive Surface atom
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Bounded passive presentation atom under current user-directed normalization. Draft pending independent review and exact-source browser evidence; native/compiler omissions remain explicit rather than implied by Web behavior.
summary: Reusable passive content surface with presentation-only facts, independent of any page or navigation protocol.
statement:
  en: Surface owns a slotted visual shell. Its consumer supplies layout, content and facts from the existing semantic owner. It does not own hover detection, focus, activation, selection, navigation, disclosure, clipboard, source editing or material effects. This design projection inherits Base Surface and lowers visual rules through standard feedback styles. No homepage, preview, code-toolbar or social-icon vocabulary is part of the API.
criteria:
  - id: P-BOOTSTRAP-2-3-2-SURFACE-PASSIVE
    text:
      en: Surface introduces no role, tabindex, focus request, event listener, activation, semantic state, native property forwarding or exposed method. Authored content remains in its original semantic ownership. Observed presentation inputs are not an event simulation or an independent interaction truth.
  - id: P-BOOTSTRAP-2-3-2-SURFACE-INPUTS
    text:
      en: Inputs are variant transparent|outline|secondary|muted|accent|solid|scrim, radius default|none|sm|md|lg|xl|full, border all|bottom|none, elevation none|raised, boolean hovered/focusVisible/pressed/current/fade, and observed transitionState closed|entering|entered|leaving. Defaults are outline/default/all/none, transitionState entered, and all booleans false. Absent inputs restore defaults. Family is not a Surface prop.
  - id: P-BOOTSTRAP-2-3-2-SURFACE-PROJECTION
    text:
      en: The family inherits asSurfaceRoot and owns its finite fill, border, radius, depth and observed-feedback recipes through rule/feedback.style. Explicit outline plus raised elevation uses the archived Thumbnail border/depth recipe; default outline plus no elevation remains neutral. Solid presentation shares the existing primary Button paint and observed press depth without introducing a Button owner or translating its native host. Surface does not choose font, text size or content. Pointer hit ownership stays with the semantic host. Fade projects only the existing Transition owner phase; it does not create a clock, lifecycle, inertness or interaction state. Web surface-fade consumes --pui-surface-transition-duration, default 0ms, supplied only from finite nonnegative duration milliseconds by its composition owner. Reduced-motion uses 0ms. Scrim lowers to black at 80 percent opacity. Unsupported native lowering, including unresolved CSS duration variables and starting-style selectors, remains diagnostic, never an inferred support claim.
  - id: P-BOOTSTRAP-2-3-2-SURFACE-ENTRIES
    text:
      en: The private workspace package root and /surface source subpath expose Surface for internal Adapter and compiler consumption. This unpublished, release-excluded package is not offered by public CLI add or its interactive choices. Partial-family Surface defaults to neutral opaque outline presentation (transparent and scrim are ordinary fills, not material effects) and does not expand material or unrelated component compatibility guarantees.

revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Bound the opt-in Runtime underline appearance while preserving family default behavior, Base ownership and existing upstream parity gaps.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Aligned draft visual grammar with neobrutalism-components 3306a802; preserved Base semantics and documented Proto UI extensions.
  - version: 0.2.0-rc.7
    change: introduced
    summary: >-
      Introduced the draft Brutalist Tabs Trigger projection with real public-API criteria (selected pair invariant, non-selected hover lift, press/focus/disabled) on the rc.7 release train. Not present in the immutable rc.6 snapshot.


  - version: 0.2.0
    change: revised
    summary: >-
      Made transient press precedence over hover and selected outer elevation explicit and executable.



id: P-BRUTALIST-TABS-TRIGGER
type: prototype
title: 'Brutalist Tabs Trigger inherits selection and projects a rounded flat tab'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Tabs Trigger preserves Base selected, pressed, disabled and keyboard ownership while projecting a 5px rounded flat control with DM Sans 700, a reserved border and paired selected fill without elevation or translation.'

statement:
  en: P-BRUTALIST-TABS-TRIGGER preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-TABS-TRIGGER 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-TABS-TRIGGER-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Tabs Trigger through `asTabsTrigger()` once and must not redefine Base selected, hovered, focus-visible, pressed, or disabled protocol semantics. Visual projection may only consume the projected state handles (`selected`, `hovered`, `focusVisible`, `pressed`, `disabled`).


      zh-CN: >-
        该 prototype 必须通过 `asTabsTrigger()` 一次性继承 Base Tabs Trigger，不得重定义 Base 的 selected、hovered、focus-visible、pressed 或 disabled 协议语义；视觉投射只能消费投影出的 state handles（`selected`、`hovered`、`focusVisible`、`pressed`、`disabled`）。


  - id: P-BRUTALIST-TABS-TRIGGER-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-tabs-trigger` and is the only public Tabs Trigger entry in this foundation slice.
      zh-CN: 直接 prototype 入口名为 `brutalist-tabs-trigger`，且是本 foundation 切片中唯一公开的 Tabs Trigger 入口。
  - id: P-BRUTALIST-TABS-TRIGGER-SELECTED-PAIR-INVARIANT
    text:
      en: >-
        With appearance=default, selected co-selects bg-main/text-main-foreground and border-black. Selection never adds elevation; the pair and frame persist through press without changing Base selected or aria-selected ownership.


      zh-CN: >-
        appearance=default 时，selected 同时选择 bg-main/text-main-foreground 与 border-black，不增加 elevation；色对与 frame 在 press 时保持，Base selected 与 aria-selected owner 不变。


  - id: P-BRUTALIST-TABS-TRIGGER-INTERACTION
    text:
      en: >-
        With appearance=default, hover on an unselected, released Trigger applies bg-secondary-background and border-black. Press retains border-black without movement or shadow. Focus-visible and disabled retain their ring and gate rules.


      zh-CN: >-
        appearance=default 时，未选中且未 pressed 的 Trigger hover 使用 bg-secondary-background 与 border-black；press 保持 border-black，无位移或阴影；focus-visible 与 disabled 保留 ring/gate 规则。


  - id: P-BRUTALIST-TABS-TRIGGER-VISUAL-GRAMMAR
    text:
      en: >-
        With appearance=default, trigger uses rounded-base 5px, border-2 with transparent resting border, font-heading font-bold text-sm, authored casing and text-foreground. It has no shadow or translation; selection is the main fill pair plus black border.


      zh-CN: >-
        appearance=default 时，Trigger 使用 rounded-base 5px、静止透明 border-2、font-heading font-bold text-sm、作者大小写与 text-foreground，无 shadow 或 translation；selected 由 main 色对与黑边表达。


  - id: P-BRUTALIST-TABS-TRIGGER-APPEARANCE
    text:
      en: 'Accept appearance=default|underline with default as the omission behavior. Underline is a Runtime consumer opt-in: transparent unframed medium-weight 16px label, muted inactive text, foreground selected/hover text and a reserved 2px selected underline spanning the label. Focus-visible remains perceivable and disabled remains gated/dimmed. Selection, hover, press, focus-visible and disabled truth stay Base-owned. Default-to-underline-to-default must withdraw obsolete paint and reproduce the original current-state default contribution; no static-selector representation or upstream line/vertical parity is mandated.'


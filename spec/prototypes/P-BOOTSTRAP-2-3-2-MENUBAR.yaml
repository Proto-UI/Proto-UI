id: P-BOOTSTRAP-2-3-2-MENUBAR
type: prototype
title: Bootstrap 2.3.2 Menubar projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: >-
    Draft catalog relation for an implemented family projection against the pinned Bootstrap 2.3.2 vocabulary. Stable admission requires real consumers, browser/native evidence and independent review; source presence and private package availability are not release or conformance admission.


summary: Bootstrap Menubar family over P-BASE-MENUBAR with pinned vocabulary.
statement:
  en: >-
    The family parts each invoke their matching public Base hook exactly once and preserve the complete Base protocol. Root/Trigger/Content/Item preserve the horizontal menubar and roving-focus owner with pinned nav-pills/menu vocabulary; no link entry is invented beyond the public set.


criteria:
  - id: P-BOOTSTRAP-2-3-2-MENUBAR-BASE
    text:
      en: >-
        Invoke asMenubar* hooks() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias, jQuery/plugin API or Base.setup call.


  - id: P-BOOTSTRAP-2-3-2-MENUBAR-VISUAL
    text:
      en: >-
        Root/Trigger/Content/Item preserve the horizontal menubar and roving-focus owner with pinned nav-pills/menu vocabulary; no link entry is invented beyond the public set.


  - id: P-BOOTSTRAP-2-3-2-MENUBAR-CLOSURE
    text:
      en: >-
        All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, Glyphicons, upstream JavaScript or Adapter component-name dispatch may supply default intent.


  - id: P-BOOTSTRAP-2-3-2-MENUBAR-BOUNDARY
    text:
      en: >-
        Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; the package is private and source-only. Catalog presence is a draft relation, not acceptance.



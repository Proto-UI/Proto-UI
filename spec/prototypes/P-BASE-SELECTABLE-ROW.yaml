openQuestions:
  - id: P-BASE-SELECTABLE-ROW-Q-EVIDENCE
    question:
      en: Have exact-head consumer, lifecycle and assistive-technology observations independently established the declared row semantics, including the bounded Web double-activation path?
    blocks:
      - activation:P-BASE-SELECTABLE-ROW
revisions:
  - version: 0.3.0-alpha.2
    change: introduced
    summary: Extracted controlled row selection and distinct activation for compiler consumers while retaining explicit Web extension and collection-policy boundaries.
tags: [prototype, base, selection, row]

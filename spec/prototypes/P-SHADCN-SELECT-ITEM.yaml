id: P-SHADCN-SELECT-ITEM
type: prototype
title: Shadcn Select Item inherits Base option behavior and adds current styling and a selected check
status: draft
since: 0.2.0-rc.0
summary: Shadcn Select Item inherits Base option collection, accessibility, state separation, commit, controlled, and disabled behavior and adds current visual feedback and a context-driven check indicator.
statement:
  zh-CN: Shadcn Select Item 是 `P-BASE-SELECT-ITEM` 之上的 direct part，保留 option collection/a11y、active 与 selected 分离、commit、controlled value 和 disabled behavior，并增加当前 item surface、state feedback 与由 inherited selected state 驱动的 check SVG。`asChild` 明确不提供。
  en: Shadcn Select Item is a direct part over `P-BASE-SELECT-ITEM`. It retains option collection and accessibility, active versus selected separation, commit, controlled value, and disabled behavior while adding the current item surface, state feedback, and a check SVG driven by inherited selected state. `asChild` is explicitly unavailable.
criteria:
  - id: P-SHADCN-SELECT-ITEM-STYLE-PROFILES
    text:
      en: The earlier fixed recipes in this document describe the New York compatibility profile. Shared style selection additionally supports Rhea from shadcn/ui 3d98900e9b73c45f035f8109e9d41ba6a51685e7; the bounded profile and composition contract is P-SHADCN-SELECT-STYLE. This is not full upstream API, positioning or scroll-control parity.
  - id: P-SHADCN-SELECT-ITEM-UPSTREAM-IDENTITY
    text:
      {
        zh-CN: Item 必须沿用固定 Select revision/path 并明确其非官方 projection 身份。,
        en: Item must use the pinned Select revision and path and identify its unofficial projection status.,
      }
  - id: P-SHADCN-SELECT-ITEM-BASE-INHERITANCE
    text:
      {
        zh-CN: '`shadcn-select-item` 必须继承 `P-BASE-SELECT-ITEM` 并调用 `asSelectItem()`。',
        en: '`shadcn-select-item` must inherit `P-BASE-SELECT-ITEM` and call `asSelectItem()`.',
      }
    references:
      prototypes:
        - id: P-BASE-SELECT-ITEM
          anchors:
            [
              P-BASE-SELECT-ITEM-AUTHORING-ENTRIES,
              P-BASE-SELECT-ITEM-COLLECTION,
              P-BASE-SELECT-ITEM-STATE-SEPARATION,
              P-BASE-SELECT-ITEM-COMMIT,
            ]
  - id: P-SHADCN-SELECT-ITEM-CURRENT-BASE-DEVIATIONS
    text:
      {
        zh-CN: 当前实现不反转 inherited collection、a11y、state separation、commit、controlled 或 disabled guarantee；styles/renderer 是增量。,
        en: The current implementation reverses no inherited collection,
        accessibility,
        state separation,
        commit,
        controlled,
        or disabled guarantee; styles and renderer are deltas.,
      }
  - id: P-SHADCN-SELECT-ITEM-DIRECT-ENTRY
    text:
      {
        zh-CN: 当前 Item protocol 以 `shadcn-select-item` direct prototype 公开。,
        en: The current Item protocol is exposed as the `shadcn-select-item` direct prototype.,
      }
  - id: P-SHADCN-SELECT-ITEM-CURRENT-VISUAL-SURFACE
    text:
      zh-CN: Item 使用固定源 full-width flex row、gap-2、rounded-sm、py-1.5、pl-2、pr-8、text-sm，无 justify-between；indicator absolute right-2 size-3.5，check size-4；作者显式以公开 ItemText part 包裹文字。
      en: Item uses the pinned full-width flex row, gap-2, rounded-sm, py-1.5, pl-2, pr-8 and text-sm without justify-between; indicator is absolute right-2 size-3.5 with a size-4 check; authors explicitly wrap text in the public ItemText part.
  - id: P-SHADCN-SELECT-ITEM-STATE-DRIVEN-STYLES
    text:
      {
        zh-CN: active/hover/focus、pressed 与 disabled visuals 必须从 inherited states 派生，不得混淆 selected value truth。,
        en: Active,
        hover,
        focus,
        pressed,
        and disabled visuals must derive from inherited states and must not confuse selected-value truth.,
      }
  - id: P-SHADCN-SELECT-ITEM-SELECTED-INDICATOR
    text:
      {
        zh-CN: renderer 必须保留 slot content、追加 indicator span，并仅在 inherited selected=true 时渲染固定 check SVG；selected 变化必须安全触发 render update。,
        en: The renderer must preserve slot content,
        append an indicator span,
        and render the fixed check SVG only when inherited selected is true; selected changes must safely trigger render updates.,
      }
  - id: P-SHADCN-SELECT-ITEM-COMPATIBILITY-SUBSET
    text:
      {
        zh-CN: 当前 behavior/surface/indicator 之外的结构与 token 差异集中在唯一 open question。,
        en: Structural and token differences beyond current behavior,
        surface,
        and indicator are centralized in one open question.,
      }
  - id: P-SHADCN-SELECT-ITEM-AS-CHILD-OMISSION
    text:
      {
        zh-CN: upstream Item props 中的 `asChild` 依共享决策省略。,
        en: Upstream Item `asChild` is omitted under the shared decision.,
      }
    dependsOn: { decisions: [D-AS-CHILD-OMISSION-0001] }
openQuestions:
  - id: P-SHADCN-SELECT-ITEM-Q-UPSTREAM-DIFFERENCES
    question:
      {
        zh-CN: Item indicator placement、ItemText composition 与 exact parity 应如何收敛？,
        en: How should Item indicator placement,
        ItemText composition,
        and exact parity converge?,
      }
    context:
      zh-CN: intentional deviation 是省略 `asChild`。upstream indicator 绝对定位到 right-2 并位于 children 前，children 包在 ItemText；本次以合法外层 ItemText 包裹文字，并提供 absolute right-2/size-3.5 indicator 与 pl-2/pr-8；indicator DOM 顺序仍为 slot 后，视觉绝对定位。待核对项还包括 focus-only mapping、pressed/hover extras、pr-8/pl-2、nested SVG/span rules、data-slot 与 forwarding。
      en: The intentional deviation is omission of `asChild`. Upstream positions the indicator absolutely at right-2 before children and wraps children in ItemText; This slice supplies externally composed ItemText, an absolute right-2/size-3.5 indicator and pl-2/pr-8. Indicator DOM order remains after the slot with absolute visual positioning. Other gaps include focus-only mapping, extra pressed and hover behavior, pr-8 and pl-2, nested SVG and span rules, data-slot, and forwarding.
    blocks: [shadcn select item parity roadmap]

id: P-LIQUID-GLASS-FIELDSET
type: prototype
title: liquid-glass Fieldset root
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: 可移植分组的 draft 方向。原生无障碍、跨 Adapter 实现、关系生命周期与独立精确 head 验收仍阻塞稳定准入；synthetic DOM 与源码 token 不建立这些保证。
  en: Draft portable grouping direction. Native accessibility, cross-Adapter realization, relation lifetime and independent exact-head acceptance remain activation blockers; synthetic DOM and source tokens do not establish them.
summary: Direct Base projection of passive Fieldset root.
statement: &a1
  zh-CN: 拥有被动分组、本地或祖先 disabled 策略及分组名称/描述关系。保留插槽子内容，不创建值、校验、提交或焦点所有权。
  en: Own the passive group, local-or-ancestor disabled policy and group naming/description relations. Preserve slotted children without creating value, validation, submission or focus ownership.
criteria:
  - id: P-LIQUID-GLASS-FIELDSET-SEMANTICS
    text: *a1
  - id: P-LIQUID-GLASS-FIELDSET-INHERITANCE
    text:
      zh-CN: 消费一次 asFieldsetRoot 并保留继承 renderer、Props、exposes 与 modules；不增加第二策略或关系 owner。
      en: Consume asFieldsetRoot once and retain the inherited renderer, Props, exposes and modules; add no second policy or relationship owner.
  - id: P-LIQUID-GLASS-FIELDSET-PRESENTATION
    text:
      zh-CN: 普通圆角边框内边距内容分组，gap-3；不声明 material slot、candidate 或隐式材质。disabled 与名称/描述关系继续由继承的 Base owner 管理，不因家族名称而给内容增加玻璃。
      en: Ordinary rounded bordered padded content group with gap-3; declare no material slot, candidate or implicit material. Disabled policy and naming/description relations remain with the inherited Base owner; the family name does not turn content into glass.
dependsOn:
  contracts:
    - C-FIELDSET-0001
    - C-FEEDBACK-STYLE-0003
verifies:
  tests:
    - T-BASE-FIELDSET-0001
sources:
  - path: packages/prototypes/liquid-glass/src/fieldset/root.proto.ts
  - path: packages/prototypes/liquid-glass/src/fieldset/index.ts
inherits:
  prototypes:
    - P-BASE-FIELDSET
openQuestions:
  - id: P-LIQUID-GLASS-FIELDSET-Q-ACCEPTANCE
    question:
      zh-CN: 何时完成完整重复目标 fail-closed、关系清理/重挂载、原生名称/描述、键盘、跨 Adapter 与 GPUI 的精确 head 验收？现有 runtime 检查不覆盖全部条件。普通外观与对比度仍需原生证据；Fieldset 不请求材质，也不声称 Apple 视觉一致。
      en: When will complete duplicate-target fail-closed, relation teardown/remount, native accessible-name/description, keyboard, cross-Adapter and GPUI evidence close exact-head acceptance? Existing runtime checks do not answer all of these. Ordinary paint and contrast still need native evidence; Fieldset requests no material and claims no Apple visual parity.
    blocks:
      - activation:P-LIQUID-GLASS-FIELDSET
revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Removed implicit material from ordinary Fieldset content while preserving Base policy, relationships and draft evidence boundaries.
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Introduced draft Fieldset definition with explicit evidence limits; no stable admission.
tags:
  - fieldset
  - draft

id: P-LIQUID-GLASS-MESSAGE-SCROLLER
type: prototype
title: Liquid Glass Message Scroller projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native and material-host evidence plus independent review; source presence, private package availability and intent frames are not release, conformance or Apple-equivalence admission.
summary: Liquid Glass Message Scroller family over P-BASE-MESSAGE-SCROLLER.
statement:
  en: The family parts each invoke their matching public Base hook exactly once and preserve the complete Base protocol. Root/Viewport/Jump preserve composed Scroll Area ownership, message facts and the end-follow request; Root material over message content is not silently retained as default intent.
criteria:
  - id: P-LIQUID-GLASS-MESSAGE-SCROLLER-BASE
    text:
      en: Invoke asMessageScroller* hooks() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias or Base.setup call.
  - id: P-LIQUID-GLASS-MESSAGE-SCROLLER-VISUAL
    text:
      en: 'Root/Viewport/Jump preserve composed Scroll Area ownership, message facts and the end-follow request; Root material over message content is not silently retained as default intent. Exact functional material clauses are provisional: real provider capability, missing-host opaque fallback and bounded source leases stay governed by the shared V2 material contract.'
  - id: P-LIQUID-GLASS-MESSAGE-SCROLLER-CLOSURE
    text:
      en: All family appearance is authored through feedback tokens, typed material intent and Rules with explicit finite physical translation; no website-only CSS, private Apple asset or Adapter component-name dispatch may supply default intent, and explicit liquid-glass intent is never silently replaced by adaptive native blur.
  - id: P-LIQUID-GLASS-MESSAGE-SCROLLER-BOUNDARY
    text:
      en: Exact-head browser, native, material-provider and Compiler evidence plus independent review remain open; the package is private and source-only. Apple documentation is a design reference, not implementation, asset or equivalence evidence. Catalog presence is a draft relation, not acceptance.
dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
inherits:
  prototypes:
    - P-BASE-MESSAGE-SCROLLER
verifies:
  tests:
    - T-LIQUID-GLASS-CONTENT-SOURCE-0001
sources:

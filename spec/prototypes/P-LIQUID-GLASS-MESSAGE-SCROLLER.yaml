  - path: packages/prototypes/liquid-glass/src/message-scroller/index.ts
  - path: https://developer.apple.com/design/human-interface-guidelines/materials
    label: Apple HIG Materials design reference only
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Liquid Glass Message Scroller projection cataloged as a draft family projection over the implemented source slice.

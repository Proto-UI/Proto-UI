openQuestions:
  - id: P-BASE-DATA-TABLE-HEADER-ROW-Q-ACCEPTANCE
    question:
      en: Have legal asHook reuse, exact empty public handles, all five family entries and two-header real-browser journeys received independent acceptance?
      zh-CN: 合法 asHook 复用、准确空 public handle、五家族入口与双表头真实浏览器旅程是否完成独立验收？
    blocks: [activation:P-BASE-DATA-TABLE-HEADER-ROW]
  - id: P-BASE-DATA-TABLE-HEADER-ROW-Q-PARENT-CATALOG
    question:
      en: The existing DataTable root/header/row composition has no cataloged prototype identity in the audited tree. How will its broader controlled and compatibility semantics be admitted separately without claiming this narrow structural repair covers them?
      zh-CN: 被审树中的 DataTable root/header/row 组合尚无 cataloged prototype identity，其更广受控及兼容语义如何另行准入，且不将本窄结构修复冒称为覆盖这些语义？
    blocks: [activation:P-BASE-DATA-TABLE-HEADER-ROW]

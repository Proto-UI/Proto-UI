id: P-BRUTALIST-TEXTAREA
type: prototype
title: 'Brutalist Textarea inherits Base and projects lavender ink styling'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Textarea preserves the complete Base Textarea protocol on one native target and adds only a rounded neutral, ink, proportional sans, role-specific visual treatment.'

statement:
  en: P-BRUTALIST-TEXTAREA preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-TEXTAREA 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-TEXTAREA-BASE-INHERITANCE
    text:
      zh-CN: Root 必须通过 `asTextareaRoot()` 一次性继承 `P-BASE-TEXTAREA`，不得复制或重定义 controlled/uncontrolled、event、IME、a11y 或 focus ownership。
      en: Root must inherit `P-BASE-TEXTAREA` once through `asTextareaRoot()` without copying or redefining controlled/uncontrolled, event, IME, accessibility, or focus ownership.
  - id: P-BRUTALIST-TEXTAREA-SINGLE-TARGET
    text:
      zh-CN: Brutalist style 必须直接投影到 Base 支撑的同一个 contentless 原生 textarea；不得增加 wrapper control、child renderer 或第二个 target。
      en: Brutalist styling must project directly to the same contentless Base-backed native textarea without adding a wrapper control, child renderer, or second target.
  - id: P-BRUTALIST-TEXTAREA-VISUAL-GRAMMAR
    text:
      en: Root projects flex w-full min-h-20 resize-y, rounded-base 5px, border-2 border-border, bg-secondary-background text-foreground, px-3 py-2 and font-sans font-medium text-sm with no explicit leading-6 override or shadow. Native selection uses selection:bg-main selection:text-main-foreground. Existing focus-visible ring, disabled cursor/opacity and host-owned resize remain unchanged. Placeholder and invalid styling remain unimplemented differences under the existing style-syntax and Base ownership boundaries.
      zh-CN: Root 投射 flex w-full min-h-20 resize-y、rounded-base 5px、border-2 border-border、bg-secondary-background text-foreground、px-3 py-2 与 font-sans font-medium text-sm，不加 leading-6 override 或阴影；原生选择使用 selection:bg-main selection:text-main-foreground。既有 focus-visible ring、disabled cursor/opacity 与 host-owned resize 保持不变。placeholder 与 invalid 样式仍是既有 style-syntax/Base ownership 边界下未实现的差异。

  - id: P-BRUTALIST-TEXTAREA-NO-PROTOCOL-DELTA
    text:
      zh-CN: Root 不得新增 interaction、state、event、accessibility、form、validation、auto-resize 或 ownership protocol；原生尺寸调整仍属于 host 或 consumer。
      en: Root must add no interaction, state, event, accessibility, form, validation, auto-resize, or ownership protocol; native resizing remains host- or consumer-owned.

id: P-BRUTALIST-TEXTAREA
type: prototype
title: Brutalist Textarea inherits Base and projects lavender ink styling
status: draft
since: 0.2.0-rc.7
summary: Brutalist Textarea preserves the complete Base Textarea protocol on one native target and adds only a square lavender, ink, monospace, hard-shadow visual treatment.
statement:
  zh-CN: Brutalist Textarea 是 Base Textarea 的直接 design-language projection。它通过 asTextareaRoot 继承同一物理原生 textarea、value ownership、event、accessibility 与 focus protocol，只增加方角、薰衣草紫、ink、等宽字体与硬阴影视觉样式，不建立第二个行为层。
  en: Brutalist Textarea is a direct design-language projection of Base Textarea. Through asTextareaRoot it retains the same physical native textarea, value ownership, events, accessibility, and focus protocol, adding only square lavender, ink, monospace, and hard-shadow styling without creating a second behavioral layer.
criteria:
  - id: P-BRUTALIST-TEXTAREA-BASE-INHERITANCE
    text:
      zh-CN: Root 必须通过 `asTextareaRoot()` 一次性继承 `P-BASE-TEXTAREA`，不得复制或重定义 controlled/uncontrolled、event、IME、a11y 或 focus ownership。
      en: Root must inherit `P-BASE-TEXTAREA` once through `asTextareaRoot()` without copying or redefining controlled/uncontrolled, event, IME, accessibility, or focus ownership.
  - id: P-BRUTALIST-TEXTAREA-SINGLE-TARGET
    text:
      zh-CN: Brutalist style 必须直接投影到 Base 支撑的同一个 contentless 原生 textarea；不得增加 wrapper control、child renderer 或第二个 target。
      en: Brutalist styling must project directly to the same contentless Base-backed native textarea without adding a wrapper control, child renderer, or second target.
  - id: P-BRUTALIST-TEXTAREA-VISUAL-GRAMMAR
    text:
      zh-CN: Root 必须投影 block、w-full、min-h-28、rounded-none、2px ink border、lavender surface、lavender-paired ink text、p-3、monospace、3px hard ink shadow 与 focus-visible ring，并在 disabled 时使用不可用 cursor 与 opacity。
      en: Root must project block, w-full, min-h-28, square corners, a 2px ink border, lavender surface, lavender-paired ink text, p-3, monospace type, a 3px hard ink shadow, and a focus-visible ring, with disabled cursor and opacity treatment.
  - id: P-BRUTALIST-TEXTAREA-NO-PROTOCOL-DELTA
    text:
      zh-CN: Root 不得新增 interaction、state、event、accessibility、form、validation、auto-resize 或 ownership protocol；原生尺寸调整仍属于 host 或 consumer。
      en: Root must add no interaction, state, event, accessibility, form, validation, auto-resize, or ownership protocol; native resizing remains host- or consumer-owned.

id: P-BASE-SCROLL-AREA
type: prototype
title: Base Scroll Area defines a host-projected scrolling domain
status: draft
since: 0.2.0-rc.7
summary: Base Scroll Area is a compound protocol whose Viewport owns one logical scroll surface while Root and composed controls remain layout and projection parts.
statement:
  zh-CN: Base Scroll Area 把滚动建模为跨宿主语义域，而不是 Web DOM scrollbar 的薄包装。Viewport 通过特权 `asScrollSurface` 接入宿主滚动能力；Root 只建立 anatomy 边界，Scrollbar 与 Thumb 只在 composed projection 中承担可视控制部件。Web 可以选择 system 或 composed 投射，其他宿主可映射到自身原生滚动容器。
  en: Base Scroll Area models scrolling as a cross-host semantic domain rather than a thin wrapper over a Web DOM scrollbar. Viewport reaches host scrolling through the privileged `asScrollSurface`; Root only establishes the anatomy boundary, while Scrollbar and Thumb are visual control parts for composed projection. Web may select system or composed projection and other hosts may map the domain to their native scrolling containers.
anatomy:
  family: base-scroll-area
  roles:
    root: { cardinality: { min: 1, max: 1 } }
    viewport: { cardinality: { min: 1, max: 1 } }
    scrollbar: { cardinality: { min: 0, max: 2 } }
    thumb: { cardinality: { min: 0, max: 2 } }
  relations:
    - { kind: contains, parent: root, child: viewport }
    - { kind: contains, parent: root, child: scrollbar }
    - { kind: contains, parent: scrollbar, child: thumb }
criteria:
  - id: P-BASE-SCROLL-AREA-SEMANTIC-DOMAIN
    text:
      zh-CN: Scroll Area 必须表示一个具有 position、extent、可滚方向、scrolling 与 scroll request 的逻辑滚动域，不得把某一宿主的 DOM、widget 或原始 geometry 当作跨宿主协议。
      en: Scroll Area must represent a logical scrolling domain with position, extent, available directions, scrolling state, and scroll requests; a host-specific DOM node, widget, or raw geometry must not become the cross-host protocol.
  - id: P-BASE-SCROLL-AREA-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-scroll-area-root` 与 `asScrollAreaRoot` 必须是同一 Root protocol 的 direct 与 authored-asHook entries。'
      en: '`base-scroll-area-root` and `asScrollAreaRoot` must be the direct and authored-asHook entries of the same Root protocol.'
  - id: P-BASE-SCROLL-AREA-ANATOMY
    text:
      zh-CN: canonical Root、Viewport、Scrollbar 与 Thumb roles、cardinality 及 contains relations 必须由顶层 anatomy 字段定义；普通盒状 Corner 不构成独立 prototype role。
      en: Canonical Root, Viewport, Scrollbar, and Thumb roles, cardinalities, and contains relations must be defined by the top-level anatomy field; a plain box-shaped corner is not an independent prototype role.
  - id: P-BASE-SCROLL-AREA-ROOT-NO-BEHAVIOR
    text:
      zh-CN: Root 只拥有 anatomy 与 JSON-only Context family scope，不得拥有 viewport offset、host geometry、focus target、滚动事件或默认尺寸。
      en: Root owns only the Anatomy and JSON-only Context family scope and must not own viewport offsets, host geometry, a focus target, scrolling events, or a default size.
  - id: P-BASE-SCROLL-AREA-PROJECTION-CHOICE
    text:
      zh-CN: system 与 composed 是同一逻辑滚动域的宿主投射策略，不得裂变为两个 Base prototype；默认策略由 host adapter 与 design-language preference 共同解析。
      en: System and composed are host projection strategies for the same logical scrolling domain and must not split into separate Base prototypes; the host adapter and design-language preference jointly resolve the default.
  - id: P-BASE-SCROLL-AREA-FAMILY-SESSION
    text:
      zh-CN: Root 必须提供 Scroll Area Context scope，使 Viewport 可以在不把 session object 写入 Context value 的前提下建立家族级 composed host attachment。
      en: Root must provide the Scroll Area Context scope so Viewport can establish a family-level composed host attachment without placing a session object in the Context value.
sources:

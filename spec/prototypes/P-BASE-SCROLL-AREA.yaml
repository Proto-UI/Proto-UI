    change: revised
    summary: Added a JSON-only Context family scope for composed host projection sessions.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Cataloged Scroll Area as a cross-host semantic domain with one Viewport-owned surface and host-selectable system or composed projection.
tags: [prototype, base, scroll-area, compound, host-projection]

id: P-SHADCN-TOAST
type: prototype
title: shadcn toast
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: 'Draft 实现方向，稳定准入需要独立审查及浏览器/native 证据。'
  en: 'Draft implementation direction. Stable admission requires independent review and browser/native evidence.'
summary: shadcn toast protocol with shared Proto UI lifecycle and anatomy boundaries.
statement:
  zh-CN: 独立编写的 Proto UI 协议，复用 Base 共享能力和 L1 lifecycle。
  en: An independently authored Proto UI protocol reusing Base shared capabilities and L1 lifecycle.
criteria:
  - id: P-SHADCN-TOAST-STACK-ORDER
    text:
      zh-CN: 折叠与展开均使用 Base 的完整 opening 索引决定布局及绘制顺序。bottom placement 的最新消息最靠下，top placement 最靠上；最新消息的绘制层级最高。层级和 flex order 立即更新，不参与尺寸、偏移和透明度的过渡。已关闭但由 Presence 保留的卡片在离场期间退出 normal/flex 布局流和命中范围，保留展示表面直至离场结束，不得占据新 Toast 的定位锚点。
      en: Collapsed and expanded layouts use the same complete Base opening index for geometry and paint order. The newest message is closest to the bottom edge for bottom placements and the top edge for top placements, and has the highest paint layer. Layers and flex order update immediately, independently of size, offset and opacity transitions. Closed cards retained by Presence leave normal and flex flow and hit testing while keeping their presentation surface until leave completion; they must not reserve a new Toast's anchor.
  - id: P-SHADCN-TOAST-VIEWPORT
    text:
      zh-CN: 默认 placement 为 bottom-right，固定于页面视口而非 RuntimeBox 的文档流；六种现有位置均使用同一个页面级 portal。作者容器的 transform、overflow 或页面滚动不得把 Toast 限制回该容器。主题由预览的 portal owner 投射并随 owner 销毁而释放。
      en: The default bottom-right placement is fixed to the page viewport, outside RuntimeBox document flow. All six existing placements share the page-level portal. An authored container's transform, overflow or page scroll must not confine Toasts to that container. Preview portal ownership projects the theme and releases it on owner disposal.
  - id: P-SHADCN-TOAST-ADMISSION
    text:
      zh-CN: Draft 准入需要精确 head 的浏览器/native 证据和独立审查。
      en: Draft admission requires exact-head browser/native evidence and independent review.

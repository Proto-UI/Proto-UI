id: P-BRUTALIST-DIALOG-TITLE
type: prototype
title: 'Brutalist Dialog Title inherits Base title relations and layers heavy heading typography'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Dialog Title inherits Base Dialog Title relations and projects DM Sans 700 heading typography with natural casing with flat foreground. The projection is limited to Base inheritance, the direct entry, and heading typography styling.'

statement:
  en: P-BRUTALIST-DIALOG-TITLE preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-DIALOG-TITLE 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-DIALOG-TITLE-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Dialog Title through `asDialogTitle()` once and must not redefine Base title relation protocol semantics. Visual projection may only consume the projected state handles.


      zh-CN: >-
        该 prototype 必须通过 `asDialogTitle()` 一次性继承 Base Dialog Title，不得重定义 Base 的 title 关系协议语义；视觉投射只能消费投影出的 state handles。


  - id: P-BRUTALIST-DIALOG-TITLE-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-dialog-title`.
      zh-CN: 直接 prototype 入口名为 `brutalist-dialog-title`。
  - id: P-BRUTALIST-DIALOG-TITLE-VISUAL-GRAMMAR
    text:
      en: >-
        Title carries font-heading text-lg font-bold leading-none tracking-tight text-foreground: DM Sans at 18px, 700, unit line-height, and -0.025em tracking, without forced uppercase. It owns no frame or fill.


      zh-CN: >-
        Title 使用 font-heading text-lg font-bold leading-none tracking-tight text-foreground：DM Sans 18px、700、line-height 1、tracking -0.025em，不强制大写；不拥有 frame 或 fill。


sources:
  - path: docs/superpowers/specs/2026-10-03-neobrutalism-source-aligned-design.md

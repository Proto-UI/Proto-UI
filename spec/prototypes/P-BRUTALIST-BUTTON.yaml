revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added opt-in public wrap for content-driven height while preserving all pinned default sizes; command selection is inherited from Base rather than duplicated in family paint.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Aligned draft visual grammar with neobrutalism-components 3306a802; corrected earlier local sm text-xs and lg h-12 px-6 text-base choices to the pinned source. Base semantics and Proto UI API extensions remain unchanged.
  - version: 0.2.0-rc.7
    change: introduced
    summary: >-
      Introduced the draft Neo-Brutalist Button projection as the reference family of the Brutalist style foundation slice on the rc.7 release train (redesigned public API: solid/surface/destructive + accent color, paired foreground invariant, live theme behavior). Not present in the immutable rc.6 snapshot.



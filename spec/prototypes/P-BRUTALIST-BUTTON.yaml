id: P-BRUTALIST-BUTTON
type: prototype
title: 'Brutalist Button inherits Base Button and layers a Neo-Brutalist visual API'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Button inherits Base Button interaction semantics and projects a style-family visual API: solid/surface/destructive fills, constrained accent colors with paired foregrounds, component-owned rounded geometry, hard offset shadows, and live theme-compatible surface tokens.'

statement:
  en: P-BRUTALIST-BUTTON preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-BUTTON 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-BUTTON-MOTION
    text:
      en: The mounted Button has one CSS timing writer. With preference.reducedMotion equal to no-preference, transition-all uses the existing compiler mapping of 150ms cubic-bezier(0.4,0,0.2,1), including transform and the hard box-shadow on entry and release. Reduce or unknown uses transition-none, and live preference changes update the same mounted subject. Hover and transient press share the existing endpoint, not an additional displacement. At 200% text scale translation follows rem while the hard shadow remains 4px. This does not change Base activation timing, add keyboard press-start semantics, or claim that every other Brutalist command already shares this timing.
      zh-CN: 挂载 Button 仅有一个 CSS 时序写入者。preference.reducedMotion 为 no-preference 时，transition-all 使用既有 compiler 的 150ms cubic-bezier(0.4,0,0.2,1)，覆盖进入与释放的 transform 和硬 box-shadow；reduce 或未知时为 transition-none，偏好变化实时更新同一 subject。hover 与瞬时 press 共用既有端点，不叠加位移；200% 文字缩放时位移随 rem，硬阴影仍为 4px。不改变 Base 激活时机、不新增键盘 press-start，也不声称其他 Brutalist command 已拥有相同时序。
  - id: P-BRUTALIST-BUTTON-WRAP
    text:
      en: Public wrap is an opt-in boolean defaulting to false. For default/sm/lg, true uses automatic height with the existing family minimum of 2.5rem/2.25rem/2.75rem, normal wrapping, unchanged horizontal padding/font size, 0.25rem vertical padding and bounded inline width. Icon stays square at 2.5rem. Removing wrap restores fixed defaults. This is a Proto UI extension, not a claim that pinned upstream exposes the same API.
      zh-CN: 公开 wrap 是默认 false 的可选 boolean。default/sm/lg 为 true 时使用自动高度及既有 2.5rem/2.25rem/2.75rem family 下限，允许换行，保留水平 padding 与字号，垂直 padding 为 0.25rem，并限制 inline 宽度。icon 保留 2.5rem 正方形；移除 wrap 恢复默认固定尺寸。此为 Proto UI 扩展，不声称固定上游有同名 API。
  - id: P-BRUTALIST-BUTTON-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Button through `asButton()` once and must not redefine Base click, press, hover, focus, or disabled protocol semantics. Visual projection may only consume the projected state handles.


      zh-CN: >-
        该 prototype 必须通过 `asButton()` 一次性继承 Base Button，不得重定义 Base 的 click、press、hover、focus 或 disabled 协议语义；视觉投射只能消费投影出的 state handles。


  - id: P-BRUTALIST-BUTTON-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-button` and is the only public Button entry in this foundation slice.
      zh-CN: 直接 prototype 入口名为 `brutalist-button`，且是本 foundation 切片中唯一公开的 Button 入口。
  - id: P-BRUTALIST-BUTTON-VARIANT-PROP
    text:
      en: >-
        Public `variant` is the enum `solid | surface | destructive` with default `solid`. `solid` is the accent fill role; `surface` is the paper/panel fill; `destructive` is the warning fill. There is no `outline` variant because every Brutalist control already carries a structural 2px outline.


      zh-CN: >-
        公开 `variant` 为枚举 `solid | surface | destructive`，默认 `solid`。 `solid` 为强调填充，`surface` 为纸面/面板填充，`destructive` 为警告填充。 不提供 `outline`，因为每个 Brutalist 控件本身已带 2px 结构描边。


  - id: P-BRUTALIST-BUTTON-COLOR-PROP
    text:
      en: >-
        Public `color` is the enum `main | mint | lavender | coral | sky` with default `main`. It applies only when `variant` is `solid` and selects a fixed accent pair from the Brutalist palette.


      zh-CN: >-
        公开 `color` 为枚举 `main | mint | lavender | coral | sky`，默认 `main`。 仅在 `variant` 为 `solid` 时生效，并从 Brutalist 调色板选择固定强调色对。


  - id: P-BRUTALIST-BUTTON-SIZE-PROP
    text:
      en: Public `size` is the enum `default | sm | lg | icon` with default `default`. Text sizes follow the pinned 3306a802 recipe; default h-10 px-4, sm h-9 px-3, and lg h-11 px-8, all text-sm (14px/20px). Icon remains size-10.
      zh-CN: 公开 `size` 为枚举 `default | sm | lg | icon`，默认 `default`。文字尺寸对齐固定 3306a802 配方：default 为 h-10 px-4，sm 为 h-9 px-3，lg 为 h-11 px-8，均为 text-sm（14px/20px）；icon 保持 size-10。
  - id: P-BRUTALIST-BUTTON-DEFAULTS
    text:
      en: >-
        When `variant`, `color`, `size`, or `disabled` are omitted or removed after mount, the prototype must restore `solid`, `main`, `default`, and `false` respectively.


      zh-CN: >-
        当 `variant`、`color`、`size` 或 `disabled` 缺省或在挂载后被移除时，prototype 必须分别恢复为 `solid`、`main`、`default` 与 `false`。


  - id: P-BRUTALIST-BUTTON-PAIR-INVARIANT
    text:
      en: >-
        Every fill must co-select its intended foreground token. Solid accents use `bg-{color}` with `text-{color}-foreground`; surface uses `bg-secondary-background` with `text-foreground`; destructive uses `bg-destructive` with `text-destructive-foreground`. No rule may replace a fill's foreground with a theme-global text token independently of its background.


      zh-CN: >-
        每一种填充必须同时选择其对应的前景 token。solid 强调色使用 `bg-{color}` 与 `text-{color}-foreground`；surface 使用 `bg-secondary-background` 与 `text-foreground`；destructive 使用 `bg-destructive` 与 `text-destructive-foreground`。任何规则都不得在脱离背景的情况下用主题全局 文本 token 覆盖填充前景。


  - id: P-BRUTALIST-BUTTON-INTERACTION
    text:
      en: >-
        Hover and press settle the control along its hard shadow axis by +4px,+4px and clear the outer shadow. Press does not introduce a second displacement. Focus-visible uses a hard ring with offset. Disabled preserves geometry and paired fill while reducing emphasis with opacity-50 and pointer-events-none. These are visual projections of the existing Base states.


      zh-CN: >-
        hover 与 press 均沿硬阴影轴位移 +4px,+4px 并清除外侧阴影，press 不叠加第二次位移。focus-visible 使用带 offset 的硬 ring；disabled 保持几何与色对并使用 opacity-50、pointer-events-none 降低强调。以上仅投射现有 Base state。


  - id: P-BRUTALIST-BUTTON-VISUAL-GRAMMAR
    text:
      en: >-
        The Button projects 5px rounded-base corners, 2px black structural borders, flat paired fills, and explicit per-component elevation. Text-bearing surfaces carry DM Sans via font-sans with a system sans fallback; base weight is 500, heading/Toggle/Tabs-trigger weight is 700, and authored casing is preserved. No gradient, glass, blur, or soft shadow. Resting hard shadow is 4px 4px 0 0 black; normal labels use 14px/20px at default size.


      zh-CN: >-
        Button 投射5px rounded-base 圆角、2px 黑色结构边框、平面色对与按组件分工的 elevation。文本 surface 通过 font-sans 携带 DM Sans 与系统 sans fallback；正文为 500，标题、Toggle 与 Tabs Trigger 为 700，保留作者大小写。不使用 gradient、glass、blur 或 soft shadow。静止硬阴影为 4px 4px 0 0 黑色；默认尺寸标签为 14px/20px。


  - id: P-BRUTALIST-BUTTON-LIGHT-DARK
    text:
      en: >-
        Solid accent pairs are theme-invariant: accent backgrounds keep black foreground tokens in both Light and Dark host themes. Surface and destructive fills resolve through CSS variables so their concrete colors follow the active host theme while preserving the pair invariant.


      zh-CN: >-
        solid 强调色对在主题间不变：强调背景在 Light 与 Dark 宿主主题下都保持黑色 前景 token。surface 与 destructive 通过 CSS 变量解析，使具体颜色跟随宿主 主题，同时保持色对不变量。


  - id: P-BRUTALIST-BUTTON-LIVE-THEME
    text:
      en: >-
        When the active host theme changes after the Button is mounted, theme-dependent surfaces (those that resolve through Brutalist CSS variables such as `--pui-secondary-background` and `--pui-foreground`) must repaint without requiring pointer interaction. Disabled controls must also repaint under the same host-theme transition. The supported mechanism is host-theme-driven CSS variable resolution; a `colorScheme` meta or `prefers-color-scheme` path is not part of this criterion.


      zh-CN: >-
        当 Brutalist Button 已挂载后活动宿主主题发生变化时，主题相关表面（经 Brutalist CSS 变量如 `--pui-secondary-background` 与 `--pui-foreground` 解析的表面）必须在无需指针交互的情况下重绘；Disabled 控件在相同宿主主题切换下也必须重绘。支持机制为宿主主题驱动的 CSS 变量解析；`colorScheme` meta 或 `prefers-color-scheme` 路径不属于本准则。



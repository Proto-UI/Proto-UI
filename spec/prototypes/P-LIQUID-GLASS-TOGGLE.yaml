revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Bind independent static hover, focus, quiet disabled paint and existing self-contact to the shared six-part draft recipe without introducing input ownership or claiming Apple-native equivalence.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Replace text underline with a permanently reserved decorative currentColor check for text and icon-only selection, retaining Base accessible naming, disabled selection, independent focus and state-stable geometry.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Add finite selected style-fill tint with same-state readable foreground and fallback; text underline and fixed geometry remain, while icon-only and exact-head optical acceptance stay separate.
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Add a standalone Proto Toggle projection with regular optical intent in both selected states, equal geometry and explicit selected-tint and native/compiler limits.
tags: [prototype, liquid-glass, toggle]

id: P-BASE-SELECT-ITEM
type: prototype
title: Base Select Item is a selectable collection option
status: draft
lifecycleRationale:
  en: Existing Item semantics remain draft; explicit size inheritance and override have unrun regressions and no new native geometry acceptance.
since: 0.2.0-rc.0
summary: Item publishes ordered option metadata, separates transient active state from committed selected state, and submits enabled commits to Root.
statement:
  zh-CN: Select Item 是 Content 中可重复出现的 option。它发布 value/textValue/disabled collection snapshot、option semantics、committed selected 与 transient active state。focus 或 enabled pointer intent 可以改变 popup active option；Enter、Space 或 pointer activation 发出 select 并请求 Root commit。disabled Item 必须同时退出 focus navigation 与 commit。
  en: Select Item is a repeatable option within Content. It publishes value, textValue, and disabled collection snapshots, option semantics, committed selected state, and transient active state. Focus or enabled pointer intent may change the popup active option, while Enter, Space, or pointer activation emits select and requests a Root commit. A disabled Item must leave both focus navigation and commit.
criteria:
  - id: P-BASE-SELECT-ITEM-SIZE-OVERRIDE
    text:
      en: Item accepts itemSizing inherit or intrinsic. Omission inherits Root policy; explicit intrinsic removes the row from size matching without changing value, selected state, disabled behavior or focus. Multi-line content and explicit author size constraints use intrinsic rather than clipping text to force equality. Policy changes publish collection metadata revision so an old pending size callback cannot apply to the new selection of targets.
    dependsOn:
      contracts: [{ id: C-TARGET-SIZE-MATCH-0001, since: 0.3.0-alpha.1 }]
  - id: P-BASE-SELECT-ITEM-TRANSIENT-CLEANUP
    text:
      zh-CN: 'press.cancel、pointer.cancel 与 view unmount 必须清除本 part 的 hovered/pressed；清理不得改变 canonical Root open/value or committed selected 或发出 activation/request。逻辑实例 remount 不得重放旧瞬态；pointer.leave 的语义清理不等于取消 Host 持有的 contact。'
      en: "press.cancel, pointer.cancel and view unmount must clear this part's hovered/pressed without changing canonical Root open/value or committed selected or emitting activation/requests. Logical-instance remount must not replay stale transient state; semantic pointer.leave cleanup does not cancel a Host-owned contact."
    dependsOn:
      contracts: [C-EVENT-TYPE-0002, C-LIFECYCLE-0008]
  - id: P-BASE-SELECT-ITEM-LOCAL-TAB
    text:
      zh-CN: 已打开、enabled 且自身持焦的 Item 通过自己的 portable key.down 处理 Tab；先取消同域唯一 Content 的本次自动入场焦点，再请求关闭，不阻止默认动作。不得由 Content global 根据后来焦点重新判定原事件归属。
      en: An open enabled focused Item handles Tab through its own portable key.down. It first cancels this epoch automatic entry focus in the unique same-domain Content, then requests close without preventing default. Content global handlers must not reclassify the original event from later focus.
  - id: P-BASE-SELECT-ITEM-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-select-item` 与 `asSelectItem` 必须是同一 Item protocol 的 authoring entries。'
      en: '`base-select-item` and `asSelectItem` must be authoring entries for the same Item protocol.'
  - id: P-BASE-SELECT-ITEM-COLLECTION
    text:
      zh-CN: Item 必须通过 Collection Item 发布有序的 value、textValue、disabled 与 position snapshot；value 必须是 option identity。
      en: Item must publish an ordered value, textValue, disabled, and position snapshot through Collection Item, with value as the option identity.
  - id: P-BASE-SELECT-ITEM-METADATA-FOCUS-ORDER
    text:
      zh-CN: 本地 disabled 变为 true 时，Item 必须在清除现持焦事实前发布当前 collection 元数据，让 Content 认领并安全退出已禁用的持焦项；恢复 enabled 时先恢复焦点资格再发布，以便当前合法目标恢复可聚焦。同步通知导致 owner dispose 后不得继续同步交互状态。
      en: When local disabled becomes true, Item publishes current collection metadata before clearing existing focus ownership so Content can safely retire a now-disabled focused item. Re-enabling restores focus eligibility before publication so the admitted current target can receive focus. Synchronous owner disposal during notification cancels further interaction synchronization.
  - id: P-BASE-SELECT-ITEM-A11Y
    text:
      zh-CN: Item 必须投射 option role、content-derived name、selected、disabled 与 activate action。
      en: Item must project an option role, content-derived name, selected state, disabled state, and activate action.
  - id: P-BASE-SELECT-ITEM-STATE-SEPARATION
    text:
      zh-CN: selected 必须严格派生自 committed Root value；active 必须表示 open popup 中的当前 focus/pointer option。pointer 离开非 focused Item 时必须清除该 Item 的 pointer active/highlight；popup close 时每个 Item 必须清除 hovered、pressed、focused 与 active transient facts。active 变化不得隐式改变 selected 或 value。
      en: selected must derive strictly from committed Root value, while active represents the current focus or pointer option in the open popup. Pointer leave from a non-focused Item must clear that Item's pointer active or highlight, and popup close must clear hovered, pressed, focused, and active transient facts from every Item. Changing active must not implicitly change selected or value.
  - id: P-BASE-SELECT-ITEM-COMMIT
    text:
      zh-CN: enabled activation 必须发出包含 value 与 reason 的 `select` signal，向 Root `requestValue` 提交 value/textValue，并按 Item/Root close policy 请求 close。
      en: Enabled activation must emit a `select` signal containing value and reason, submit value and textValue to Root `requestValue`, and request close according to Item or Root close policy.
  - id: P-BASE-SELECT-ITEM-CONTROLLED
    text:
      zh-CN: 受控 value request 后 Item selected 必须保持 owner value 对应状态，直到新的 value input 到达；open 可以按独立 ownership 关闭。
      en: After a controlled value request, Item selected state must continue matching the owner value until new value input arrives; open may close according to its independent ownership.
  - id: P-BASE-SELECT-ITEM-DISABLED
    text:
      zh-CN: Item local disabled 或 Root disabled 必须抑制 focus participation、active 更新、select signal、value request 与 close request，并投射 aria-disabled。
      en: Local Item disabled or Root disabled must suppress focus participation, active updates, select signal, value request, and close request, and project aria-disabled.
sources:
  - path: packages/prototypes/base/src/select/item.proto.ts
  - path: packages/prototypes/base/src/select/command.ts
  - path: https://www.radix-ui.com/primitives/docs/components/select#item
    label: Radix Select Item
dependsOn:
  prototypes: [P-BASE-SELECT, P-BASE-SELECT-CONTENT]
  contracts: [C-A11Y-0001, C-AS-COLLECTION-ITEM-0001, C-AS-FOCUSABLE-0001, C-AS-TRIGGER-0001]
verifies:
  { tests: [T-BASE-SELECT-ITEM-0001, { id: T-TARGET-SIZE-MATCH-0001, since: 0.3.0-alpha.1 }] }
revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Declared inherited size matching and explicit intrinsic item override without changing selection or navigation facts.
  - version: 0.2.0-rc.0
    change: introduced
    summary: Cataloged Item collection, option a11y, active and selected separation, commit requests, controlled behavior, and disabled gating.
  - version: 0.2.0-rc.0
    change: clarified
    summary: Required pointer-leave and popup-close cleanup for transient Item interaction facts.
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Clarify draft cancellation and retained-view transient cleanup without changing semantic ownership or Host contact lifetime.
tags: [prototype, base, select, item, option, selection, a11y]

revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added bounded production text/default style scope projection; line
      explicitly rejects pending generic owned decorative feedback, with legacy
      underline and all remaining gaps preserved.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Bound the opt-in Runtime underline appearance while preserving family
      default behavior, Base ownership and existing upstream parity gaps.
  - version: 0.2.0-rc.0
    change: introduced
    summary: Introduced Shadcn Tabs Trigger delta cataloging with Base inheritance,
      state-driven styles, intentional asChild omission, and centralized parity
      gaps.

id: P-SHADCN-TABS-TRIGGER
type: prototype
title: Shadcn Tabs Trigger inherits Base Tabs Trigger and projects source-bound
  text/default styling
status: draft
since: 0.2.0-rc.0
summary: Inherits Base behavior and projects the bounded text-only default
  surface for New York v4, Nova and Rhea through shared style scope.
statement:
  en: This draft projects only the text-only default surface of fixed upstream
    3d98900e9b73c45f035f8109e9d41ba6a51685e7 for New York v4, Nova and Rhea,
    preserving Base ownership and shared style-scope precedence. Both
    orientations and light/dark interaction paint are covered where relevant to
    this part. It is not complete Tabs or all-style parity. Existing Proto
    underline remains a separate compatibility appearance, never an alias for
    upstream line.
criteria:
  - id: P-SHADCN-TABS-TRIGGER-UPSTREAM-IDENTITY
    text:
      zh-CN: Trigger 必须沿用固定 Shadcn Tabs revision/path，并明确为 Proto UI 治理的非官方 anatomy
        projection。
      en: Trigger must use the pinned Shadcn Tabs revision and path and identify
        itself as an unofficial Proto UI-governed anatomy projection.
  - id: P-SHADCN-TABS-TRIGGER-BASE-INHERITANCE
    text:
      zh-CN: "`shadcn-tabs-trigger` 必须继承 `P-BASE-TABS-TRIGGER` 并调用
        `asTabsTrigger()`；任何 setup-only 负向补丁必须声明被改写能力及替代语义。"
      en: "`shadcn-tabs-trigger` must inherit `P-BASE-TABS-TRIGGER` and call
        `asTabsTrigger()`; any setup-only negative patch must identify the
        rewritten capability and replacement semantics."
    references:
      prototypes:
        - id: P-BASE-TABS-TRIGGER
          anchors:
            - P-BASE-TABS-TRIGGER-AUTHORING-ENTRIES
            - P-BASE-TABS-TRIGGER-ROLE-TAB
            - P-BASE-TABS-TRIGGER-ACTIVATION-REQUESTS-SELECTION
  - id: P-SHADCN-TABS-TRIGGER-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不反转 inherited
        selection、context、interaction、focus、disabled、keyboard、click signal 或
        a11y guarantee；新增 rules 仅构成视觉增量。
      en: The current implementation reverses no inherited selection, context,
        interaction, focus, disabled, keyboard, click-signal, or accessibility
        guarantee; added rules are visual deltas only.
  - id: P-SHADCN-TABS-TRIGGER-DIRECT-ENTRY
    text:
      zh-CN: 当前 Trigger protocol 以 `shadcn-tabs-trigger` direct prototype 公开。
      en: The current Trigger protocol is exposed as the `shadcn-tabs-trigger` direct
        prototype.
  - id: P-SHADCN-TABS-TRIGGER-CURRENT-VISUAL-SURFACE
    text:
      en: "The source-bound text/default surface is described by the dedicated Tabs
        coverage inventory: New York compatibility dimensions plus Nova/Rhea
        recipes, Base-derived horizontal/vertical layout, and existing
        feedback.style semantic merging. Only the declared bounded surface is
        projected; it does not imply line, SVG, arbitrary native props, or
        other-style support."
  - id: P-SHADCN-TABS-TRIGGER-STATE-DRIVEN-STYLES
    text:
      zh-CN: appearance=default 时，selected、hovered、focusVisible 与 disabled rules 必须从
        inherited Trigger state 派生：selected 投射
        background/foreground/shadow-sm，hovered 非 selected 只提升
        foreground，focusVisible 投射 border/ring/outline，disabled 抑制 pointer 并降低
        opacity；不得创建第二套 selection 或 interaction truth。
      en: "With appearance=default, selected, hovered, focusVisible, and disabled
        rules must derive from inherited Trigger state: selected projects
        background, foreground, and shadow-sm; hovered non-selected raises only
        the foreground; focusVisible projects border, ring, and outline;
        disabled suppresses pointer input and lowers opacity. They must not
        create a second selection or interaction source of truth."
    references:
      prototypes:
        - id: P-BASE-TABS-TRIGGER
          anchors:
            - P-BASE-TABS-TRIGGER-SELECTED-DERIVED
            - P-BASE-TABS-TRIGGER-INTERACTION-STATES
            - P-BASE-TABS-TRIGGER-FOCUSABLE
            - P-BASE-TABS-TRIGGER-DISABLED-EXPOSE
  - id: P-SHADCN-TABS-TRIGGER-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前实体只声明已测试的 inherited behavior 与视觉 surface；固定 baseline 的全部差异集中维护在唯一
        compatibility open question。
      en: This entity claims only tested inherited behavior and visual surface; every
        difference from the pinned baseline is maintained in one compatibility
        open question.
  - id: P-SHADCN-TABS-TRIGGER-AS-CHILD-OMISSION
    text:
      zh-CN: upstream Trigger props 中的 `asChild` 依共享决策有意省略。
      en: The `asChild` member of upstream Trigger props is intentionally omitted
        under the shared decision.
    dependsOn:
      decisions:
        - D-AS-CHILD-OMISSION-0001
  - id: P-SHADCN-TABS-TRIGGER-APPEARANCE
    text:
      en: "Accept appearance=default|underline with default as the omission behavior.
        Underline is a Runtime consumer opt-in: transparent unframed
        medium-weight 16px label, muted inactive text, foreground selected/hover
        text and a reserved 2px selected underline spanning the label.
        Focus-visible remains perceivable and disabled remains gated/dimmed.
        Selection, hover, press, focus-visible and disabled truth stay
        Base-owned. Default-to-underline-to-default must withdraw obsolete paint
        and reproduce the original current-state default contribution; no
        static-selector representation or upstream line/vertical parity is
        mandated."
  - id: P-SHADCN-TABS-TRIGGER-STYLE-SCOPE
    text:
      en: "Shared style selection preserves the actual Base owner, value, focus, handles and caller nodes while switching among New York and the eight modern profiles. Explicit leaf selection overrides scope; absence preserves the component compatibility default. Unknown profiles fail closed rather than borrowing another recipe."
  - id: P-SHADCN-TABS-TRIGGER-SOURCE-BOUND-TEXT-DEFAULT
    text:
      en: "The fixed inventory is eight modern styles (vega, nova, maia, lyra, mira, luma, sera, rhea) plus independent New York. Each has source-distinct default and line paint; List variant changes update an owned decorative line without replacing Trigger leaves, caller content, Base selection or focus. Content and the optional semantic-only Indicator gain no selection owner. Proto appearance=underline remains separate. Nested SVG/inline-glyph selector parity, full API and native/cross-adapter acceptance remain open."
openQuestions:
  - id: P-SHADCN-TABS-TRIGGER-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: Trigger 的 orientation/variant-aware styling 与其他 upstream parity 应如何收敛？
      en: How should Trigger orientation and variant-aware styling and other upstream
        parity converge?
    context:
      en: "The nine source-distinct default/line recipes and live owned line decoration have authored consumer cases, not exact-head execution or native acceptance. Remaining gaps include nested SVG/inline-glyph sizing and placement, className/native forwarding, upstream data-slot/state correspondence, all-adapter paint, motion, assistive technology and independent review. Scope changes must preserve Base owners, live caller nodes and controlled refusal."
    blocks:
      - shadcn tabs trigger parity roadmap

id: P-SHADCN-TABS-TRIGGER
type: prototype
title: Shadcn Tabs Trigger inherits Base Tabs Trigger and projects pinned v4 default styling
status: draft
since: 0.2.0-rc.0
summary: Shadcn Tabs Trigger inherits Base tab selection, focus, activation, and accessibility behavior and reproduces the pinned v4 default-variant horizontal trigger surface.
statement:
  zh-CN: >-
    Shadcn Tabs Trigger 是 `P-BASE-TABS-TRIGGER` 之上的 direct anatomy part，保留同域 tab identity、selection request、interaction/focus state、disabled gating 与 a11y，并按固定 v4 baseline 投射 default variant 的 horizontal trigger surface，以及 selected、hovered、focusVisible、disabled 视觉反馈。pressed 仍是 inherited interaction fact，但默认 v4 surface 不为其增加独立视觉；orientation/variant-aware styling、SVG handling 与其他 API 差异尚不属于 passing guarantee；`asChild` 明确不提供。


  en: >-
    Shadcn Tabs Trigger is a direct anatomy part over `P-BASE-TABS-TRIGGER`. It retains same-domain tab identity, selection requests, interaction and focus state, disabled gating, and accessibility while projecting the pinned v4 default-variant horizontal trigger surface and selected, hovered, focusVisible, and disabled feedback. Pressed remains an inherited interaction fact but adds no independent visual in the default v4 surface. Orientation and variant-aware styling, SVG handling, and other API differences are not part of the passing guarantee; `asChild` is explicitly unavailable.


criteria:
  - id: P-SHADCN-TABS-TRIGGER-UPSTREAM-IDENTITY
    text:
      zh-CN: Trigger 必须沿用固定 Shadcn Tabs revision/path，并明确为 Proto UI 治理的非官方 anatomy projection。
      en: Trigger must use the pinned Shadcn Tabs revision and path and identify itself as an unofficial Proto UI-governed anatomy projection.
  - id: P-SHADCN-TABS-TRIGGER-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-tabs-trigger` 必须继承 `P-BASE-TABS-TRIGGER` 并调用 `asTabsTrigger()`；任何 setup-only 负向补丁必须声明被改写能力及替代语义。'
      en: '`shadcn-tabs-trigger` must inherit `P-BASE-TABS-TRIGGER` and call `asTabsTrigger()`; any setup-only negative patch must identify the rewritten capability and replacement semantics.'
    references:
      prototypes:
        - id: P-BASE-TABS-TRIGGER
          anchors:
            [
              P-BASE-TABS-TRIGGER-AUTHORING-ENTRIES,
              P-BASE-TABS-TRIGGER-ROLE-TAB,
              P-BASE-TABS-TRIGGER-ACTIVATION-REQUESTS-SELECTION,
            ]
  - id: P-SHADCN-TABS-TRIGGER-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不反转 inherited selection、context、interaction、focus、disabled、keyboard、click signal 或 a11y guarantee；新增 rules 仅构成视觉增量。
      en: The current implementation reverses no inherited selection, context, interaction, focus, disabled, keyboard, click-signal, or accessibility guarantee; added rules are visual deltas only.
  - id: P-SHADCN-TABS-TRIGGER-DIRECT-ENTRY
    text:
      zh-CN: 当前 Trigger protocol 以 `shadcn-tabs-trigger` direct prototype 公开。
      en: The current Trigger protocol is exposed as the `shadcn-tabs-trigger` direct prototype.
  - id: P-SHADCN-TABS-TRIGGER-CURRENT-VISUAL-SURFACE
    text:
      zh-CN: 默认 horizontal/default-variant Trigger 必须翻译固定 v4 baseline 的 relative、inline-flex、height、flex growth、alignment、gap、rounded-md、transparent border、px-2/py-1、typography、foreground opacity、transition 与 outline surface；不得保留旧有 rounded-lg、px-3/py-1.5 或额外按压缩放。
      en: The default horizontal, default-variant Trigger must translate the pinned v4 relative, inline-flex, height, flex-growth, alignment, gap, rounded-md, transparent-border, px-2/py-1, typography, foreground-opacity, transition, and outline surface; it must not retain the former rounded-lg, px-3/py-1.5, or extra pressed scaling.
  - id: P-SHADCN-TABS-TRIGGER-STATE-DRIVEN-STYLES
    text:
      zh-CN: appearance=default 时，selected、hovered、focusVisible 与 disabled rules 必须从 inherited Trigger state 派生：selected 投射 background/foreground/shadow-sm，hovered 非 selected 只提升 foreground，focusVisible 投射 border/ring/outline，disabled 抑制 pointer 并降低 opacity；不得创建第二套 selection 或 interaction truth。
      en: >-
        With appearance=default, selected, hovered, focusVisible, and disabled rules must derive from inherited Trigger state: selected projects background, foreground, and shadow-sm; hovered non-selected raises only the foreground; focusVisible projects border, ring, and outline; disabled suppresses pointer input and lowers opacity. They must not create a second selection or interaction source of truth.


    references:
      prototypes:
        - id: P-BASE-TABS-TRIGGER
          anchors:
            [
              P-BASE-TABS-TRIGGER-SELECTED-DERIVED,
              P-BASE-TABS-TRIGGER-INTERACTION-STATES,
              P-BASE-TABS-TRIGGER-FOCUSABLE,
              P-BASE-TABS-TRIGGER-DISABLED-EXPOSE,
            ]
  - id: P-SHADCN-TABS-TRIGGER-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前实体只声明已测试的 inherited behavior 与视觉 surface；固定 baseline 的全部差异集中维护在唯一 compatibility open question。
      en: This entity claims only tested inherited behavior and visual surface; every difference from the pinned baseline is maintained in one compatibility open question.
  - id: P-SHADCN-TABS-TRIGGER-AS-CHILD-OMISSION
    text:
      zh-CN: upstream Trigger props 中的 `asChild` 依共享决策有意省略。
      en: The `asChild` member of upstream Trigger props is intentionally omitted under the shared decision.
    dependsOn:
      decisions: [D-AS-CHILD-OMISSION-0001]
  - id: P-SHADCN-TABS-TRIGGER-APPEARANCE
    text:
      en: 'Accept appearance=default|underline with default as the omission behavior. Underline is a Runtime consumer opt-in: transparent unframed medium-weight 16px label, muted inactive text, foreground selected/hover text and a reserved 2px selected underline spanning the label. Focus-visible remains perceivable and disabled remains gated/dimmed. Selection, hover, press, focus-visible and disabled truth stay Base-owned. Default-to-underline-to-default must withdraw obsolete paint and reproduce the original current-state default contribution; no static-selector representation or upstream line/vertical parity is mandated.'

openQuestions:
  - id: P-SHADCN-TABS-TRIGGER-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: Trigger 的 orientation/variant-aware styling 与其他 upstream parity 应如何收敛？
      en: How should Trigger orientation and variant-aware styling and other upstream parity converge?
    context:
      zh-CN: >-
        intentional deviation 是省略 `asChild`。默认 horizontal/default-variant 的 light surface 与 focus outline 已按 Proto state facts 翻译固定 v4 baseline。待实现或待评审项包括 className/native prop forwarding、data-slot、Radix data-state 命名映射、vertical full-width/left alignment、List line variant 分支及 line indicator、显式 dark 分支，以及 nested SVG handling。


      en: >-
        The intentional deviation is omission of `asChild`. The default horizontal, default-variant light surface and focus outline now translate the pinned v4 baseline through Proto state facts. Implementation or review gaps include className and native prop forwarding, data-slot, Radix data-state naming, vertical full-width and left alignment, the List line-variant branch and line indicator, explicit dark branches, and nested-SVG handling.


    blocks: [shadcn tabs trigger parity roadmap]

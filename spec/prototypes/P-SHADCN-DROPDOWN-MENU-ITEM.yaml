id: P-SHADCN-DROPDOWN-MENU-ITEM
type: prototype
title: Shadcn Dropdown Menu Item inherits Base menu-command behavior and adds visual variants
status: draft
since: 0.2.0-rc.0
summary: Shadcn Dropdown Menu Item inherits Base collection, accessibility, active, selection, and disabled behavior and adds inset and destructive visual props plus current state styling.
statement:
  zh-CN: >-
    Shadcn Dropdown Menu Item 是 `P-BASE-DROPDOWN-MENU-ITEM` 之上的 direct part，保留 collection、menuitem a11y、transient active、select 与 disabled behavior，并增加 `inset` 和 `variant: default | destructive` 视觉 props、基础 item surface 与 inherited state-driven feedback。`asChild` 明确不提供。


  en: >-
    Shadcn Dropdown Menu Item is a direct part over `P-BASE-DROPDOWN-MENU-ITEM`. It retains collection, menuitem accessibility, transient active, selection, and disabled behavior while adding `inset` and `variant: default | destructive` visual props, the base item surface, and inherited state-driven feedback. `asChild` is explicitly unavailable.


criteria:
  - id: P-SHADCN-DROPDOWN-MENU-ITEM-UPSTREAM-IDENTITY
    text:
      zh-CN: Item 必须沿用固定 Dropdown Menu revision/path 并明确其非官方 Proto UI projection 身份。
      en: Item must use the pinned Dropdown Menu revision and path and identify its unofficial Proto UI projection status.
  - id: P-SHADCN-DROPDOWN-MENU-ITEM-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-dropdown-item` 必须继承 `P-BASE-DROPDOWN-MENU-ITEM` 并调用 `asDropdownItem()`；任何负向补丁必须显式声明。'
      en: '`shadcn-dropdown-item` must inherit `P-BASE-DROPDOWN-MENU-ITEM` and call `asDropdownItem()`; any negative patch must be declared explicitly.'
    references:
      prototypes:
        - id: P-BASE-DROPDOWN-MENU-ITEM
          anchors:
            [
              P-BASE-DROPDOWN-MENU-ITEM-AUTHORING-ENTRIES,
              P-BASE-DROPDOWN-MENU-ITEM-COLLECTION,
              P-BASE-DROPDOWN-MENU-ITEM-SELECT,
            ]
  - id: P-SHADCN-DROPDOWN-MENU-ITEM-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不反转 inherited collection、a11y、active、select 或 disabled guarantee；新增 props 与 styles 是视觉增量。
      en: The current implementation reverses no inherited collection, accessibility, active, selection, or disabled guarantee; added props and styles are visual deltas.
  - id: P-SHADCN-DROPDOWN-MENU-ITEM-DIRECT-ENTRY
    text:
      zh-CN: 当前 Item protocol 以 `shadcn-dropdown-item` direct prototype 公开。
      en: The current Item protocol is exposed as the `shadcn-dropdown-item` direct prototype.
  - id: P-SHADCN-DROPDOWN-MENU-ITEM-VISUAL-PROPS
    text:
      zh-CN: '`inset` 默认 false 并投射 pl-8；`variant` 提供 default/destructive、默认 default，destructive 投射对应 foreground 与 active surface。'
      en: '`inset` defaults to false and projects pl-8; `variant` provides default and destructive with default as its default, and destructive projects the corresponding foreground and active surface.'
  - id: P-SHADCN-DROPDOWN-MENU-ITEM-CURRENT-VISUAL-SURFACE
    text:
      zh-CN: Item 必须提供当前 full-width row、spacing、radius、typography、outline、selection 与 transition tokens。
      en: Item must provide the current full-width row, spacing, radius, typography, outline, selection, and transition tokens.
  - id: P-SHADCN-DROPDOWN-MENU-ITEM-STATE-DRIVEN-STYLES
    text:
      zh-CN: active/hover/focus、pressed 与 disabled visuals 必须从 inherited states 派生；styles 不得成为另一套 command truth。
      en: Active, hover, focus, pressed, and disabled visuals must derive from inherited states; styles must not become another command source of truth.
  - id: P-SHADCN-DROPDOWN-MENU-ITEM-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前 behavior、props 与 surface 之外的全部差异集中在唯一 compatibility open question。
      en: All differences beyond current behavior, props, and surface are centralized in one compatibility open question.
  - id: P-SHADCN-DROPDOWN-MENU-ITEM-DESTRUCTIVE-EVIDENCE-BOUNDARY
    text:
      zh-CN: >-
        destructive variant 的现有 token 断言只是 projection-covered 的投影证据；在文档实例、跨运行时渲染与该 Dropdown surface 自身的对比度测量证据落地前，该 surface 保持 render-undemonstrated。Button #454 仅是相邻组件观察，不属于 Dropdown Item 的实测证据。

      en: >-
        The destructive variant's existing token assertion is projection evidence only; without a docs instance, cross-runtime rendered evidence, and contrast measurement of this Dropdown surface itself, the surface remains render-undemonstrated. Button #454 is a related component observation, not measured evidence for Dropdown Item.

  - id: P-SHADCN-DROPDOWN-MENU-ITEM-AS-CHILD-OMISSION
    text:
      zh-CN: upstream Item props 中的 `asChild` 依共享决策有意省略。
      en: The `asChild` member of upstream Item props is intentionally omitted under the shared decision.
    dependsOn:
      decisions: [D-AS-CHILD-OMISSION-0001]
openQuestions:
  - id: P-SHADCN-DROPDOWN-MENU-ITEM-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: Item 的 focus mapping、SVG handling 与 exact API/token parity 应如何收敛？
      en: How should Item focus mapping, SVG handling, and exact API or token parity converge?
    context:
      zh-CN: >-
        intentional deviation 是省略 `asChild`。待核对项包括 className/native props、data-slot/data-inset/data-variant、onSelect mapping、upstream focus-only surface 相对当前 active/hover/focused/focusVisible 合并、pressed feedback、dark destructive surface、nested SVG size/color rules，以及额外 w-full、text-left、transition-colors 与 outline-none。


      en: >-
        The intentional deviation is omission of `asChild`. Review gaps include className and native props, data-slot, data-inset, data-variant, onSelect mapping, upstream focus-only surface versus current merged active, hover, focused, and focusVisible state, pressed feedback, dark destructive surface, nested-SVG size and color rules, and extra w-full, text-left, transition-colors, and outline-none.


    blocks: [shadcn dropdown item parity roadmap]

revisions:
  - version: 0.3.0-alpha.0
    change: refined
    summary: >-
      Recorded the destructive surface's evidence boundary on the owning Item entity as projection-covered but render-undemonstrated; Button #454 remains only a related observation and not Dropdown measurement evidence.

  - version: 0.2.0-rc.0
    change: introduced
    summary: Introduced Shadcn Dropdown Menu Item delta cataloging with Base inheritance, visual props, state styles, asChild omission, and centralized differences.

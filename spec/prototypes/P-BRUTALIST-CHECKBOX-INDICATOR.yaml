id: P-BRUTALIST-CHECKBOX-INDICATOR
type: prototype
title: Brutalist Checkbox Indicator inherits Base Checkbox Indicator and projects a derived glyph
status: draft
since: 0.3.0-alpha.0
summary: >-
  Brutalist Checkbox Indicator derives Base context and paints one aria-hidden 16px check or mixed dash; it owns no interaction or accessibility semantics.


statement:
  en: This presentation-only part derives checked and indeterminate from the nearest Base domain. Its 16px rounded 2px-stroke glyph follows the pinned Neo Lucide Check treatment. The distinguishable mixed dash is retained as an explicit Proto UI accessibility extension instead of silently replacing it with the upstream Check.
  zh-CN: 此纯呈现 part 从最近 Base domain 派生 checked 与 indeterminate；16px、圆端点/圆连接、2px stroke glyph 对应固定 Neo 的 Lucide Check 处理。可区分的 mixed dash 保留为明确 Proto UI 无障碍扩展，不静默替换为上游 Check。

criteria:
  - id: P-BRUTALIST-CHECKBOX-INDICATOR-BASE-INHERITANCE
    text:
      en: >-
        Indicator must inherit P-BASE-CHECKBOX-INDICATOR through asCheckboxIndicator(), retain same-domain context derivation, and create no autonomous checked or indeterminate state.


      zh-CN: >-
        Indicator 必须通过 asCheckboxIndicator() 继承 P-BASE-CHECKBOX-INDICATOR，保留 same-domain context 派生，并且不得创建自治 checked 或 indeterminate state。


  - id: P-BRUTALIST-CHECKBOX-INDICATOR-DIRECT-ENTRY
    text:
      en: The direct Indicator entry is brutalist-checkbox-indicator and this layer provides no authored asHook.
      zh-CN: Indicator direct entry 为 brutalist-checkbox-indicator，且本层不提供 authored asHook。
  - id: P-BRUTALIST-CHECKBOX-INDICATOR-CONTEXT-DERIVED
    text:
      en: >-
        Indicator must expose only context-derived checked and indeterminate observation. It must have no writable value, activation route, focus target, event target, form behavior, role, or aria-checked; its SVG glyph must be aria-hidden.


      zh-CN: >-
        Indicator 只能 expose 从 context 派生的 checked 与 indeterminate observation。它不得拥有 writable value、activation route、focus target、event target、form behavior、role 或 aria-checked； SVG glyph 必须 aria-hidden。


  - id: P-BRUTALIST-CHECKBOX-INDICATOR-GLYPH-SELECTION
    text:
      en: Checked paints exactly one 2px round-cap round-join check, indeterminate exactly one matching dash, and neither state no glyph. Indeterminate wins when both are true; repeated updates must not stack SVGs. The distinct dash is a retained Proto UI accessibility extension.
      zh-CN: checked 绘制恰好一个 2px round-cap/round-join check，indeterminate 绘制恰好一个同笔画 dash，两者均不成立时不绘制；两者同真时 indeterminate 优先，重复更新不得叠加 SVG。可区分 dash 是保留的 Proto UI 无障碍扩展。

  - id: P-BRUTALIST-CHECKBOX-INDICATOR-CURRENT-VISUAL-SURFACE
    text:
      en: Indicator projects flex size-4 items-center justify-center text-main-foreground transition-none, with opacity-100 for checked or indeterminate and opacity-0 only when both are false. The glyph remains aria-hidden.
      zh-CN: Indicator 投射 flex size-4 items-center justify-center text-main-foreground transition-none；checked 或 indeterminate 为 opacity-100，仅两者均false时为 opacity-0；glyph 继续 aria-hidden。


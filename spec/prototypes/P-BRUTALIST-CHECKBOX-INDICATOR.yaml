id: P-BRUTALIST-CHECKBOX-INDICATOR
type: prototype
title: Brutalist Checkbox Indicator inherits Base Checkbox Indicator and projects a derived glyph
status: draft
since: 0.3.0-alpha.0
summary: >-
  Brutalist Checkbox Indicator inherits Base Checkbox Indicator and renders a derived hard-stroke tick when checked, a bar when indeterminate, and no glyph when ordinarily unchecked.


statement:
  en: >-
    Brutalist Checkbox Indicator is a draft Proto UI-maintained Neo-Brutalist design-language projection over Base Checkbox Indicator. It preserves inherited Base protocol semantics and adds only visual/style behavior: an accessibility-hidden hard-stroke tick when checked, a bar when indeterminate, no glyph when ordinarily unchecked, and matching opacity visibility.


  zh-CN: >-
    Brutalist Checkbox Indicator 是 Proto UI 维护的 draft Neo-Brutalist design-language 投射，建立在 Base Checkbox Indicator 之上。它保留继承的 Base 协议语义，仅增加视觉/style 行为：checked 时渲染从无障碍树隐藏的硬线勾号，indeterminate 时渲染横杠，普通 unchecked 时不渲染 glyph，并同步投射 opacity 可见性。


criteria:
  - id: P-BRUTALIST-CHECKBOX-INDICATOR-BASE-INHERITANCE
    text:
      en: The prototype must inherit Base Checkbox Indicator through `asCheckboxIndicator()` once and must not redefine Base checked or indeterminate protocol semantics.
      zh-CN: 该 prototype 必须通过 `asCheckboxIndicator()` 一次性继承 Base Checkbox Indicator，不得重定义 Base 的 checked 或 indeterminate 协议语义。
  - id: P-BRUTALIST-CHECKBOX-INDICATOR-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-checkbox-indicator` and is the only public Checkbox Indicator entry in this foundation slice.
      zh-CN: 直接 prototype 入口名为 `brutalist-checkbox-indicator`，且是本 foundation 切片中唯一公开的 Checkbox Indicator 入口。
  - id: P-BRUTALIST-CHECKBOX-INDICATOR-VISUAL-GRAMMAR
    text:
      en: >-
        The indicator must render exactly one accessibility-hidden hard-stroke tick when `checked` is true, exactly one hard bar when `indeterminate` is true, and no glyph when both are false; indeterminate takes precedence when both values are true. It must be fully opaque (`opacity-100`) for checked or indeterminate and fully transparent (`opacity-0`) only when both values are false. No transition, gradient, or animation is applied.


      zh-CN: >-
        indicator 在 `checked` 为 true 时必须恰好渲染一个从无障碍树隐藏的硬线勾号，在 `indeterminate` 为 true 时必须恰好渲染一个硬横杠，两者同时为 true 时 indeterminate 优先；两者同时为 false 时不得渲染 glyph。checked 或 indeterminate 时必须完全不透明（`opacity-100`），仅在两者同时为 false 时完全透明（`opacity-0`）。不应用任何 transition、gradient 或 animation。


sources:
  - path: packages/prototypes/brutalist/src/checkbox/indicator.proto.ts

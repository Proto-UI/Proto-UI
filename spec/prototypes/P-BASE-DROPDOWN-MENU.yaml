id: P-BASE-DROPDOWN-MENU
type: prototype
title: Base Dropdown Menu is a root-owned action-menu protocol
status: draft
since: 0.2.0-rc.0
summary: Base Dropdown Menu is a compound action-menu protocol whose Root owns visibility, request arbitration, collection order, entry policy, and shared menu context.
statement:
  zh-CN: >-
    Base Dropdown Menu 是由 Trigger 打开的 compound action-menu protocol。Root 持有 open、controlled ownership、disabled、collection order、open-entry policy 与 request arbitration；Trigger、Content 和 Item 通过同域 Root request entry 与 fact-oriented Context 协作。所有开合交互都必须进入 `openChange` request channel，只有 owner input 或非受控 Root 可以改变最终 open fact。瞬时 active item 只属于一次打开期间的键盘/指针导航，不得成为持久 selection。


  en: >-
    Base Dropdown Menu is a compound action-menu protocol opened by a Trigger. Root owns open state, controlled ownership, disabled state, collection order, open-entry policy, and request arbitration while Trigger, Content, and Item cooperate through a same-domain Root request entry and fact-oriented Context. Every visibility interaction must enter the `openChange` request channel, and only owner input or an uncontrolled Root may change the final open fact. The transient active item belongs only to navigation during one open session and must not become persistent selection.


anatomy:
  family: base-dropdown
  roles:
    root: { cardinality: { min: 1, max: 1 } }
    trigger: { cardinality: { min: 0, max: 1 } }
    content: { cardinality: { min: 0, max: 1 } }
    item: { cardinality: { min: 0, max: 100 } }
    group: { cardinality: { min: 0, max: 100 } }
    label: { cardinality: { min: 0, max: 100 } }
    separator: { cardinality: { min: 0, max: 100 } }
    shortcut: { cardinality: { min: 0, max: 100 } }
  relations:
    - { kind: contains, parent: root, child: trigger }
    - { kind: contains, parent: root, child: content }
    - { kind: contains, parent: content, child: item }
    - { kind: contains, parent: content, child: group }
    - { kind: contains, parent: group, child: label }
    - { kind: contains, parent: content, child: separator }
    - { kind: contains, parent: item, child: shortcut }
criteria:
  - id: P-BASE-DROPDOWN-MENU-ROLE-ACTION-MENU
    text:
      zh-CN: Dropdown Menu 必须表示由按钮打开的一组 action/function，不得把普通导航列表、任意表单或 persistent selection 伪装成 menu。
      en: Dropdown Menu must represent a set of actions or functions opened by a button and must not disguise ordinary navigation, arbitrary forms, or persistent selection as a menu.
  - id: P-BASE-DROPDOWN-MENU-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-dropdown-root` 与 `asDropdownRoot` 必须是同一 Root protocol 的 direct 与 authored-asHook entries。'
      en: '`base-dropdown-root` and `asDropdownRoot` must be direct and authored-asHook entries for the same Root protocol.'
  - id: P-BASE-DROPDOWN-MENU-PROTOCOL-INDEPENDENCE
    text:
      zh-CN: Dropdown Menu parts 不得消费 Button 或其它 Base prototype-specific authored asHook 获得自身核心语义。
      en: Dropdown Menu parts must not consume Button or another Base prototype-specific authored asHook to obtain their core semantics.
  - id: P-BASE-DROPDOWN-MENU-ROOT-OWNER
    text:
      zh-CN: Root 必须是 open、controlled ownership、disabled、collection、open-entry policy、commit-close policy 与 request arbitration 的 semantic owner。
      en: Root must be the semantic owner of open state, controlled ownership, disabled state, collection, open-entry policy, commit-close policy, and request arbitration.
  - id: P-BASE-DROPDOWN-MENU-PROPS
    text:
      zh-CN: Root 必须接受 `open`、`defaultOpen`、`disabled`、`closeOnItemCommit`、`openEntry` 与 `openEntryValue`；提供 `open` 时进入受控模式。
      en: Root must accept `open`, `defaultOpen`, `disabled`, `closeOnItemCommit`, `openEntry`, and `openEntryValue`; providing `open` selects controlled mode.
  - id: P-BASE-DROPDOWN-MENU-REQUESTS
    text:
      zh-CN: Root 必须 expose `open`、`openDropdown`、`close`、`toggle`、同域 `requestOpen` entry 与 `openChange`；method、Trigger、dismiss 和 Item commit 必须进入该 Root-owned request channel，并携带 requested open、reason 与 focus reason。
      en: Root must expose `open`, `openDropdown`, `close`, `toggle`, a same-domain `requestOpen` entry, and `openChange`; methods, Trigger, dismissal, and Item commit must enter that Root-owned request channel carrying requested open, reason, and focus reason.
  - id: P-BASE-DROPDOWN-MENU-CONTROLLED-OWNER
    text:
      zh-CN: 受控 Dropdown Menu 在 request 后必须保持 owner 提供的 open fact，直到新的 `open` input 到达。
      en: After a request, a controlled Dropdown Menu must retain the owner-provided open fact until a new `open` input arrives.
  - id: P-BASE-DROPDOWN-MENU-TRANSIENT-ACTIVE
    text:
      zh-CN: active item 必须在 close 时清空，重新打开时按本次 entry policy 决定焦点，不得把上次 active 当作 selection。
      en: The active item must clear on close, and reopening must choose focus from the current entry policy rather than treating the previous active item as selection.
  - id: P-BASE-DROPDOWN-MENU-CONTEXT
    text:
      zh-CN: Root 必须通过同域 Context 发布 open ownership、disabled、active、entry、commit-close 与最近 transition reason facts；Context 不得使用 versioned request envelope 充当命令总线。
      en: Root must publish open ownership, disabled, active, entry, commit-close, and latest transition-reason facts through same-domain Context; Context must not act as a command bus through a versioned request envelope.
  - id: P-BASE-DROPDOWN-MENU-ANATOMY
    text:
      zh-CN: canonical Root、Trigger、Content、Item roles、cardinality 与 contains relations 必须由顶层 anatomy 字段定义。
      en: Canonical Root, Trigger, Content, and Item roles, cardinalities, and contains relations must be defined by the top-level anatomy field.
  - id: P-BASE-DROPDOWN-MENU-DEFERRED-EXTENSIONS
    text:
      zh-CN: CheckboxItem、RadioItem 与 Submenu 不属于当前 Base 保证；Group、Label、Separator 与 Shortcut 仅由各自新 draft P 定义承接；下游原型不得把缺失能力宣称为兼容。
      en: CheckboxItem, RadioItem, and Submenu are not current Base guarantees; Group, Label, Separator, and Shortcut are governed only by their new draft P definitions; downstream prototypes must not claim compatibility for missing capabilities.

id: P-BRUTALIST-SCROLL-AREA-VIEWPORT
type: prototype
title: Brutalist Scroll Area Viewport prefers composed Web projection
status: draft
since: 0.2.0-rc.7
summary: Brutalist Viewport inherits the Base host-owned surface and adds full-size overflow styling, an inward focus ring, and a composed projection preference.
statement:
  zh-CN: Brutalist Viewport 保留 Base Viewport 的归一化 facts 与 host-mediated requests，并为可绘制的 Brutalist scrollbar 请求 composed projection。该 preference 不把 Web DOM 变成 prototype 依赖；不支持 composed chrome 的宿主仍可按 capability contract 降级。
  en: Brutalist Viewport retains Base Viewport normalized facts and host-mediated requests and asks for composed projection so Brutalist scrollbar chrome can be drawn. This preference does not make Web DOM a prototype dependency; a host without composed chrome may fall back under the capability contract.
criteria:
  - id: P-BRUTALIST-SCROLL-AREA-VIEWPORT-BASE-INHERITANCE
    text:
      zh-CN: Viewport 必须通过 `asScrollAreaViewport()` 继承 `P-BASE-SCROLL-AREA-VIEWPORT`，且不得复制 Base scroll facts。
      en: Viewport must inherit `P-BASE-SCROLL-AREA-VIEWPORT` through `asScrollAreaViewport()` and must not duplicate Base scroll facts.
  - id: P-BRUTALIST-SCROLL-AREA-VIEWPORT-COMPOSED-PREFERENCE
    text:
      zh-CN: >-
        Viewport 必须通过特权 `asScrollSurface().configure({ projection: 'composed' })` 表达 design-language preference，由 host adapter 解析能力与 fallback。


      en: >-
        Viewport must express its design-language preference through privileged `asScrollSurface().configure({ projection: 'composed' })`, leaving capability resolution and fallback to the host adapter.


  - id: P-BRUTALIST-SCROLL-AREA-VIEWPORT-SURFACE
    text:
      zh-CN: Viewport 必须投射 `block h-full w-full overflow-auto rounded-none outline-none`，填满调用方提供的 Root 尺寸并保持直角。
      en: Viewport must project `block h-full w-full overflow-auto rounded-none outline-none`, filling the consumer-provided Root dimensions while retaining square corners.
  - id: P-BRUTALIST-SCROLL-AREA-VIEWPORT-FOCUS-RING
    text:
      zh-CN: focus ring 必须以继承的 `focusVisible` fact 为条件，且必须向内绘制——`ring-2 ring-ring ring-inset ring-offset-0`。不得复用共享的 `BRUTALIST_FOCUS_TOKENS`：那套向外绘制，会被 Root 的 `overflow-hidden` 裁掉，键盘用户就看不到当前的滚动面。Viewport 只消费 Base fact，不安装第二个 focus domain。
      en: The focus ring must be conditioned on the inherited `focusVisible` fact and must be drawn inward, as `ring-2 ring-ring ring-inset ring-offset-0`. The shared `BRUTALIST_FOCUS_TOKENS` must not be reused, because they draw outward and the Root clips them with `overflow-hidden`, leaving a keyboard user unable to see which scroll surface is active. Viewport consumes the Base fact and installs no second focus domain.
    dependsOn:
      contracts: [C-RULE-WHEN-0002, C-RULE-INTENT-FEEDBACK-STYLE-0001]
    references:
      prototypes:
        - id: P-BASE-SCROLL-AREA-VIEWPORT
          anchors:
            [
              P-BASE-SCROLL-AREA-VIEWPORT-KEYBOARD-FOCUS,
              P-BASE-SCROLL-AREA-VIEWPORT-NAV-PARTICIPATION,
            ]
sources:
  - path: packages/prototypes/brutalist/src/scroll-area/viewport.proto.ts
dependsOn:
  contracts:
    [C-AS-HOOK-0001, C-AS-SCROLL-SURFACE-0001, C-RULE-WHEN-0002, C-RULE-INTENT-FEEDBACK-STYLE-0001]
  decisions: [D-SCROLL-PROJECTION-0001]
inherits:
  prototypes:
    - id: P-BASE-SCROLL-AREA-VIEWPORT
verifies: { tests: [T-BRUTALIST-SCROLL-AREA-0001] }
revisions:
  - version: 0.3.0-alpha.0
    change: revised
    summary: Projected an inward focus ring from the inherited focusVisible fact, because the Root clips an outward one.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Cataloged the composed projection preference and full-size square Viewport surface.
tags: [prototype, brutalist, scroll-area, viewport, composed-projection, visual, focus]

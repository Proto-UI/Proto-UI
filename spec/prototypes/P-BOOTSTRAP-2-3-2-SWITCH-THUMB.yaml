id: P-BOOTSTRAP-2-3-2-SWITCH-THUMB
type: prototype
title: bootstrap-2-3-2 switch thumb over Base
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: Draft all-Base coverage increment. Source/unit availability is not release, browser paint, Compiler or native conformance admission.
summary: A genuine asSwitchThumb projection; Base retains switch semantics and this part contributes only appearance.
statement:
  en: The authored Prototype invokes asSwitchThumb once. A 20px raised thumb with 4px corners. It is pointer-transparent; placement is owned by the root layout. This is part of the Switch design-language extension, not a historical Bootstrap component.
criteria:
  - id: P-BOOTSTRAP-2-3-2-SWITCH-THUMB-BASE
    text:
      en: Invoke asSwitchThumb once and retain every inherited state, event, focus, editing, context and anatomy owner; never copy the semantic implementation or introduce a competing value owner.
  - id: P-BOOTSTRAP-2-3-2-SWITCH-THUMB-API
    text:
      en: The thumb derives checked from the nearest same-domain Switch root; it owns no checked prop, activation, change signal or focus target.
  - id: P-BOOTSTRAP-2-3-2-SWITCH-THUMB-VISUAL
    text:
      en: A 20px raised thumb with 4px corners. It is pointer-transparent; placement is owned by the root layout. This is part of the Switch design-language extension, not a historical Bootstrap component.
  - id: P-BOOTSTRAP-2-3-2-SWITCH-THUMB-CLOSURE
    text:
      en: All component appearance is declared by Prototype feedback and Rules and closes through the source-derived finite physical token renderer. No website-only component CSS may supply missing default intent.
  - id: P-BOOTSTRAP-2-3-2-SWITCH-THUMB-BOUNDARY
    text:
      en: The package is private and unreleased. Documentation and demos expose the real parts. Actual four-Web browser rendering, general Compiler and GPUI/Flutter/Qt conformance need separate collected evidence; source availability alone is insufficient.

    - C-PROPS-0001
    - C-CONTEXT-0006
    - C-ANATOMY-0004
    - C-A11Y-0001
    - C-LIFECYCLE-0008
    - C-A11Y-PART-RELATIONSHIP-0001
  decisions:
    - D-BASE-PROTOTYPE-INDEPENDENCE-0001
verifies:
  tests:
    - T-BASE-ACCORDION-0001
sources:

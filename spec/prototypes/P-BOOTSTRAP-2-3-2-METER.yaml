id: P-BOOTSTRAP-2-3-2-METER
type: prototype
title: Bootstrap 2.3.2 Meter projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: >-
    Draft catalog relation for an implemented family projection against the pinned Bootstrap 2.3.2 vocabulary. Stable admission requires real consumers, browser/native evidence and independent review; source presence and private package availability are not release or conformance admission.


summary: Bootstrap Meter family over P-BASE-METER with pinned vocabulary.
statement:
  en: >-
    The family parts each invoke their matching public Base hook exactly once and preserve the complete Base protocol. Root/Label/Track/Indicator/Value map existing Base zones to the historical progress success/warning/danger recipes; those colors do not create an upstream Meter API and Meter is not a Progress alias.


criteria:
  - id: P-BOOTSTRAP-2-3-2-METER-BASE
    text:
      en: >-
        Invoke asMeter* hooks() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias, jQuery/plugin API or Base.setup call.


  - id: P-BOOTSTRAP-2-3-2-METER-VISUAL
    text:
      en: >-
        Root/Label/Track/Indicator/Value map existing Base zones to the historical progress success/warning/danger recipes; those colors do not create an upstream Meter API and Meter is not a Progress alias.


  - id: P-BOOTSTRAP-2-3-2-METER-EXTENSION
    text:
      en: >-
        Meter is a Proto extension using pinned progress vocabulary.


  - id: P-BOOTSTRAP-2-3-2-METER-CLOSURE
    text:
      en: >-
        All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, Glyphicons, upstream JavaScript or Adapter component-name dispatch may supply default intent.


  - id: P-BOOTSTRAP-2-3-2-METER-BOUNDARY
    text:
      en: >-
        Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; the package is private and source-only. Catalog presence is a draft relation, not acceptance.


dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
inherits:
  prototypes:
    - P-BASE-METER
verifies:
  tests:
    - T-BOOTSTRAP-2-3-2-HISTORICAL-OVERLAYS-0001
sources:
  - path: packages/prototypes/bootstrap-2-3-2/src/meter/
  - path: packages/prototypes/bootstrap-2-3-2/src/meter/index.ts
  - path: https://github.com/twbs/bootstrap/blob/b4c4072679943773a7582daa63f545ba818fa627/less/progress-bars.less
    label: Pinned historical design reference
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Bootstrap 2.3.2 Meter projection cataloged as a draft family projection over the implemented source slice.
tags:
  - prototype
  - bootstrap-2-3-2
  - meter
  - draft

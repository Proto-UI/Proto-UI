id: P-BASE-DIALOG-CONTENT
type: prototype
title: Base Dialog Content owns the active dialog surface
status: draft
since: 0.2.0-rc.0
summary: Dialog Content is the modal surface that owns dialog semantics, focus containment, dismissal requests, transition presence, and title/description relationships.
statement:
  zh-CN: Dialog Content 是至多一个的 active modal surface。它从 Root open 派生 Overlay/Transition presence，active 时包含 focus，并把 Escape/outside 转换为 Root request。普通模式投射 dialog；alert 模式投射 alertdialog 且不允许 outside dismiss。
  en: Dialog Content is an optional, at-most-one active modal surface. It derives Overlay/Transition presence from Root open, contains focus while active, and converts Escape/outside interactions into Root requests. Normal mode projects dialog; alert mode projects alertdialog and disallows outside dismissal.
criteria:
  - id: P-BASE-DIALOG-CONTENT-ENTRY-POLICY
    text:
      en: 'Optional focusEntry auto (default) preserves configured automatic scope entry. Manual suppresses automatic entry only for the next actual Content scope activation, retaining trap, loop, explicit focus and restoration. Content requests initial focus on the Content surface itself under the content-entry criterion. Changing the prop while active does not refocus or reconfigure the scope; a later activation reads the current policy. Rejected controlled open/close requests do not create an activation. Manual does not select a target, promise native readiness, cancel an already pending request, or establish cross-generation focus continuity.'
      zh-CN: '可选 focusEntry 默认为 auto，保留原自动 scope entry；manual 仅抑制下一次 Content 实际激活的自动 entry，保留 trap、loop、显式 focus 与恢复。content 按 content-entry 条款请求初始焦点到 Content 表面自身。active 中修改 prop 不重聚焦或重配 scope，后续实际激活读取当前策略。受控 owner 拒绝 open/close request 不产生新激活。manual 不选目标、不保证 native ready、不取消已有 pending request，也不建立跨 generation 焦点连续性。'
  - id: P-BASE-DIALOG-CONTENT-CONTENT-ENTRY
    text:
      en: 'For an accepted actual activation with focusEntry content, Content first activates the same focus scope without automatic child entry, then requests native focus on its own dialog surface with scroll preservation. The surface remains outside sequential Tab navigation; forward and reverse Tab enter and loop through eligible descendants. This target is enabled only for that content-entry activation. Accepted close, owner replacement observed through Context or lifecycle synchronization, and terminal disposal retire its pending focus; a synchronous close, observed replacement or newer activation during entry must prevent the old activation from acquiring or replaying focus. Ancestry changes alone do not invent a Context notification. A rejected controlled open must not enter, and a rejected controlled close must not retire the accepted activation. The existing trap, loop, dismissal, accessible naming and exact previous-owner restoration remain in effect. Host rejection retains only the current activation request through the existing Focus readiness contract; no native focus, readiness or visibility fact is fabricated.'
      zh-CN: '当实际接受的激活选择 focusEntry content 时，Content 先激活同一 focus scope 并跳过自动 child entry，再以保持滚动的原生请求将焦点送到自身 dialog 表面。该表面不参与顺序 Tab 导航；正反向 Tab 进入并循环合格后代。该 target 仅在本次 content-entry 激活期间启用。接受关闭、通过 Context 或生命周期同步观察到的 owner 替换及终止销毁必须撤销其 pending focus；入场中的同步关闭、已观察替换或更新激活必须阻止旧激活获取或重放焦点。仅 ancestry 改变不额外制造 Context 通知。受控 open 被拒绝时不得入场，受控 close 被拒绝时不得撤销已接受的激活。既有 trap、loop、dismiss、无障碍命名及准确 previous-owner 恢复保持有效。宿主拒绝时仅按既有 Focus readiness 契约保留当前激活请求，不伪造原生焦点、ready 或 visibility 事实。'
  - id: P-BASE-DIALOG-CONTENT-AVAILABLE
    text:
      en: 'Active Dialog Content opts into the logical available-space lease. The direct Base projection centers and bounds the content within that region with scrollable overflow. Styled families own visual insets; Mask remains full-window and edge-attached Sheet policy is not inferred. Unknown host support does not claim safe-area coverage.'
      zh-CN: 'active Dialog Content 获取逻辑可用空间租约。direct Base 投射在该区域居中并限制内容尺寸，溢出可滚动；样式体系拥有视觉留白，Mask 仍满窗口，不推导贴边 Sheet 策略。未知 host 能力不声称安全区覆盖。'
  - id: P-BASE-DIALOG-CONTENT-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-dialog-content` 与 `asDialogContent` 是同一 protocol 的 authoring entries。'
      en: '`base-dialog-content` and `asDialogContent` are authoring entries for the same protocol.'
  - id: P-BASE-DIALOG-CONTENT-PRESENCE
    text:
      zh-CN: Content 必须经 Transition 保留 leave view，并在 closed 后执行 L1 detach。
      en: Content must retain the leaving view through Transition and perform L1 detach after closed.
  - id: P-BASE-DIALOG-CONTENT-FOCUS
    text:
      zh-CN: active Content 必须 trap/loop focus，关闭后按 request focus reason 恢复 Trigger。
      en: Active Content must trap and loop focus and restore Trigger after close according to request focus reason.
  - id: P-BASE-DIALOG-CONTENT-DISMISS
    text:
      zh-CN: Escape 必须请求关闭；普通 Dialog 的 outside press 必须请求关闭；alert Dialog 必须拒绝 outside request。
      en: Escape must request close; outside press must request close for normal Dialog and be rejected for alert Dialog.
  - id: P-BASE-DIALOG-CONTENT-CONTROLLED
    text:
      zh-CN: 受控 dismissal 只能发出 request，不得在 owner input 更新前完成 logical close。
      en: Controlled dismissal may only emit a request and must not complete logical close before owner input updates.
  - id: P-BASE-DIALOG-CONTENT-A11Y-ROLE
    text:
      zh-CN: Content 必须按 Root alert fact 投射 `dialog` 或 `alertdialog`，并投射 modal=true。
      en: Content must project `dialog` or `alertdialog` according to the Root alert fact and project modal=true.
  - id: P-BASE-DIALOG-CONTENT-A11Y-RELATIONS
    text:
      zh-CN: Title 存在时，Content 必须通过稳定同域 identity 被其 labelled，并忽略 Root a11yLabel；Title 不存在时必须移除 labelledBy，并在 Root a11yLabel 非空时将其投射为 accessible name。Description 存在时必须投射 describedBy，不存在时必须移除该关系，任何关系都不得指向缺失 part。
      en: When Title exists, Content must be labelled by its stable same-domain identity and ignore Root a11yLabel; when Title is absent, it must remove labelledBy and project Root a11yLabel as the accessible name when non-empty. It must project describedBy when Description exists and remove the relation when absent; no relation may target a missing part.


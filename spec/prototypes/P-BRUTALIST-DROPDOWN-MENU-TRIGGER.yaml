id: P-BRUTALIST-DROPDOWN-MENU-TRIGGER
type: prototype
title: 'Brutalist Dropdown Menu Trigger inherits Base Dropdown Trigger and layers an indicator-capable command surface'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Dropdown Menu Trigger inherits Base menu-button Trigger semantics and projects a style-family visual API: a main accent paired fill, an optional trailing indicator icon, and hover/press/focus-visible/disabled interaction states.'

statement:
  en: P-BRUTALIST-DROPDOWN-MENU-TRIGGER preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-DROPDOWN-MENU-TRIGGER 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-DROPDOWN-MENU-TRIGGER-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Dropdown Menu Trigger through `asDropdownTrigger()` once and must not redefine Base hover, press, focus-visible, or disabled protocol semantics. Visual projection may only consume the projected state handles (`hovered`, `pressed`, `focusVisible`, `disabled`).


      zh-CN: >-
        该 prototype 必须通过 `asDropdownTrigger()` 一次性继承 Base Dropdown Menu Trigger，不得重定义 Base 的 hover、press、focus-visible 或 disabled 协议语义；视觉投射只能消费投影出的 state handles（`hovered`、`pressed`、`focusVisible`、`disabled`）。


  - id: P-BRUTALIST-DROPDOWN-MENU-TRIGGER-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-dropdown-trigger` and is the only public Dropdown Menu Trigger entry in this foundation slice.
      zh-CN: 直接 prototype 入口名为 `brutalist-dropdown-trigger`，且是本 foundation 切片中唯一公开的 Dropdown Menu Trigger 入口。
  - id: P-BRUTALIST-DROPDOWN-MENU-TRIGGER-INDICATOR-PROP
    text:
      en: >-
        Public indicator props are: `indicator` boolean with default `false`; `indicatorIcon` enum `chevron-down | chevrons-up-down` with default `chevron-down`; `indicatorSize` number with default `16`; `indicatorStrokeWidth` number with default `2`. When `indicator` is not `false` the trigger renders the chosen icon after its default slot at the configured size and stroke-width; unknown `indicatorIcon` values fall back to `chevron-down`, and non-positive `indicatorSize`/`indicatorStrokeWidth` fall back to `16` and `2`.


      zh-CN: >-
        公开 indicator props 为：`indicator` 布尔，默认 `false`；`indicatorIcon` 枚举 `chevron-down | chevrons-up-down`，默认 `chevron-down`；`indicatorSize` 数值，默认 `16`；`indicatorStrokeWidth` 数值，默认 `2`。当 `indicator` 不为 `false` 时，trigger 在其默认 slot 之后以配置的尺寸与描边宽度渲染所选图标；未知的 `indicatorIcon` 值回退到 `chevron-down`，非正的 `indicatorSize`/`indicatorStrokeWidth` 回退到 `16` 与 `2`。


  - id: P-BRUTALIST-DROPDOWN-MENU-TRIGGER-PAIR-INVARIANT
    text:
      en: >-
        The base fill must co-select its foreground: the trigger uses `bg-main` with `text-main-foreground` (with `border-2 border-black` and a hard `shadow-[4px_4px_0_0_#000]`). No rule may replace the fill's foreground with a theme-global text token independently of its background.


      zh-CN: >-
        基础填充必须同时选择其前景：trigger 使用 `bg-main` 与 `text-main-foreground`（配 `border-2 border-black` 与硬阴影 `shadow-[4px_4px_0_0_#000]`）。任何规则都不得在脱离背景的情况下用主题全局文本 token 覆盖填充前景。


  - id: P-BRUTALIST-DROPDOWN-MENU-TRIGGER-INTERACTION
    text:
      en: >-
        Hover and press settle the control along its hard shadow axis by +4px,+4px and clear the outer shadow. Press does not introduce a second displacement. Focus-visible uses a hard ring with offset. Disabled preserves geometry and paired fill while reducing emphasis with opacity-50 and pointer-events-none. These are visual projections of the existing Base states.


      zh-CN: >-
        hover 与 press 均沿硬阴影轴位移 +4px,+4px 并清除外侧阴影，press 不叠加第二次位移。focus-visible 使用带 offset 的硬 ring；disabled 保持几何与色对并使用 opacity-50、pointer-events-none 降低强调。以上仅投射现有 Base state。


  - id: P-BRUTALIST-DROPDOWN-MENU-TRIGGER-VISUAL-GRAMMAR
    text:
      en: >-
        The trigger uses 5px rounded-base corners, 2px black structural borders, flat paired fills, and explicit per-component elevation. Text-bearing surfaces carry DM Sans via font-sans with a system sans fallback; base weight is 500, heading/Toggle/Tabs-trigger weight is 700, and authored casing is preserved. No gradient, glass, blur, or soft shadow; its Button-like rest elevation is 4px 4px 0 0 black. Existing fill-pair, native semantics, placement and API ownership remain unchanged.


      zh-CN: >-
        Trigger 使用5px rounded-base 圆角、2px 黑色结构边框、平面色对与按组件分工的 elevation。文本 surface 通过 font-sans 携带 DM Sans 与系统 sans fallback；正文为 500，标题、Toggle 与 Tabs Trigger 为 700，保留作者大小写。不使用 gradient、glass、blur 或 soft shadow，Button-like 静止阴影为 4px 4px 0 0 黑色。保留现有色对、原生语义、placement 与 API owner。



id: P-LIQUID-GLASS-SELECT-STRUCTURAL-PARTS
type: prototype
title: Liquid Glass Select Group, Label and Separator structural parts
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native and material-host evidence plus independent review; source presence, private package availability and intent frames are not release, conformance or Apple-equivalence admission.
summary: Three passive structural parts preserving scoped naming and contentless decoration.
statement:
  en: The Prototypes invoke asSelectGroup(), asSelectLabel() and asSelectSeparator() once each. Group is semantic-only, Label supplies the scoped accessible name and Separator renders null with hidden accessibility; none owns selection or material.
criteria:
  - id: P-LIQUID-GLASS-SELECT-STRUCTURAL-PARTS-INHERITANCE
    text:
      en: Each part invokes its matching Base hook exactly once; Group keeps its local naming scope, Label keeps the group-local name and Separator remains a decorative, contentless boundary.
  - id: P-LIQUID-GLASS-SELECT-STRUCTURAL-PARTS-VISUAL
    text:
      en: 'Group/Label/Separator stay passive off the material surface; Label uses Dropdown-family typography and Separator is accessibility-hidden. Exact functional material clauses are provisional: real provider capability, missing-host opaque fallback and bounded source leases stay governed by the shared V2 material contract.'
  - id: P-LIQUID-GLASS-SELECT-STRUCTURAL-PARTS-CLOSURE
    text:
      en: All family appearance is authored through feedback tokens, typed material intent and Rules with explicit finite physical translation; no website-only CSS, private Apple asset or Adapter component-name dispatch may supply default intent, and explicit liquid-glass intent is never silently replaced by adaptive native blur.
  - id: P-LIQUID-GLASS-SELECT-STRUCTURAL-PARTS-BOUNDARY
    text:
      en: Exact-head browser, native, material-provider and Compiler evidence plus independent review remain open; the package is private and source-only. Apple documentation is a design reference, not implementation, asset or equivalence evidence. Catalog presence is a draft relation, not acceptance.
dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
inherits:
  prototypes:
    - P-BASE-SELECT-STRUCTURAL-PARTS
verifies:
  tests:
    - T-LIQUID-GLASS-SELECT-0001
sources:

  - path: packages/prototypes/liquid-glass/src/select/label.proto.ts
  - path: packages/prototypes/liquid-glass/src/select/separator.proto.ts
  - path: packages/prototypes/liquid-glass/src/select/index.ts
  - path: https://developer.apple.com/design/human-interface-guidelines/materials
    label: Apple HIG Materials design reference only
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Liquid Glass Select Group, Label and Separator structural parts cataloged as a draft family projection over the implemented source slice.

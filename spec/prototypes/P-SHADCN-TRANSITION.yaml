id: P-SHADCN-TRANSITION
type: prototype
title: Shadcn standalone Transition projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: >-
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native evidence and independent review; source presence is not conformance or release admission.


summary: Shadcn standalone Transition consumes asTransition once preserving the caller slot and phase ownership.
statement:
  en: >-
    The Prototype invokes asTransition() once and preserves the transparent caller slot, Base timing defaults, interruption, phase and ViewIntent ordering and reduced-motion behavior. Borrowed phase facts may drive bounded family endpoint presentation; no second timer, animation engine or invented upstream choreography is installed.


criteria:
  - id: P-SHADCN-TRANSITION-BASE
    text:
      en: >-
        Invoke asTransition() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias or Base.setup call.


  - id: P-SHADCN-TRANSITION-VISUAL
    text:
      en: >-
        Family presentation may bind the borrowed transitionState to endpoint opacity or equivalent bounded vocabulary only. Phase sequencing, presence, completion and interruption remain Base-owned; projected endpoints are not interpolation guarantees.


  - id: P-SHADCN-TRANSITION-CLOSURE
    text:
      en: >-
        All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, raw host escape or Adapter component-name dispatch may supply default intent.


  - id: P-SHADCN-TRANSITION-BOUNDARY
    text:
      en: >-
        Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; catalog presence is a draft relation, not acceptance.


dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-AS-TRANSITION-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
inherits:
  prototypes:
    - P-BASE-TRANSITION
verifies:
  tests:
    - T-SHADCN-PASSIVE-PROJECTIONS-0001
sources:
  - path: packages/prototypes/shadcn/src/transition/transition.proto.ts
  - path: packages/prototypes/shadcn/src/transition/index.ts
  - path: https://github.com/shadcn-ui/ui/blob/3d98900e9b73c45f035f8109e9d41ba6a51685e7/apps/v4/registry/styles
    label: Retained style profiles; no standalone upstream Transition counterpart claimed
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Shadcn standalone Transition projection cataloged as a draft family projection over the implemented source slice.
tags:

id: P-SHADCN-SELECT-VALUE
type: prototype
title: Shadcn Select Value inherits Base display derivation and renders the current text
status: draft
since: 0.2.0-rc.0
summary: Shadcn Select Value inherits Base context-derived selected text and placeholder fallback and renders the resulting display value without adding interaction behavior.
statement:
  zh-CN: Shadcn Select Value 是 `P-BASE-SELECT-VALUE` 之上的 direct part，从同域 context 派生 displayValue，沿用 placeholder fallback，并将非空 displayValue 渲染为文本；它不拥有 selection 或 interaction。`asChild` 明确不提供。
  en: Shadcn Select Value is a direct part over `P-BASE-SELECT-VALUE`. It derives displayValue from same-domain context, retains placeholder fallback, and renders a non-empty displayValue as text; it owns no selection or interaction. `asChild` is explicitly unavailable.
criteria:
  - id: P-SHADCN-SELECT-VALUE-STYLE-PROFILES
    text:
      en: The earlier fixed recipes in this document describe the New York compatibility profile. Shared style selection additionally supports Rhea from shadcn/ui 3d98900e9b73c45f035f8109e9d41ba6a51685e7; the bounded profile and composition contract is P-SHADCN-SELECT-STYLE. This is not full upstream API, positioning or scroll-control parity.
  - id: P-SHADCN-SELECT-VALUE-UPSTREAM-IDENTITY
    text:
      {
        zh-CN: Value 必须沿用固定 Select revision/path 并明确其非官方 projection 身份。,
        en: Value must use the pinned Select revision and path and identify its unofficial projection status.,
      }
  - id: P-SHADCN-SELECT-VALUE-BASE-INHERITANCE
    text:
      {
        zh-CN: '`shadcn-select-value` 必须继承 `P-BASE-SELECT-VALUE` 并调用 `asSelectValue()`。',
        en: '`shadcn-select-value` must inherit `P-BASE-SELECT-VALUE` and call `asSelectValue()`.',
      }
    references:
      prototypes:
        - id: P-BASE-SELECT-VALUE
          anchors:
            [
              P-BASE-SELECT-VALUE-AUTHORING-ENTRIES,
              P-BASE-SELECT-VALUE-CONTEXT,
              P-BASE-SELECT-VALUE-FALLBACK,
              P-BASE-SELECT-VALUE-NO-INTERACTION,
            ]
  - id: P-SHADCN-SELECT-VALUE-CURRENT-BASE-DEVIATIONS
    text:
      {
        zh-CN: 当前实现不反转 inherited context、fallback、refresh 或 no-interaction guarantee。,
        en: The current implementation reverses no inherited context,
        fallback,
        refresh,
        or no-interaction guarantee.,
      }
  - id: P-SHADCN-SELECT-VALUE-DIRECT-ENTRY
    text:
      {
        zh-CN: 当前 Value protocol 以 `shadcn-select-value` direct prototype 公开。,
        en: The current Value protocol is exposed as the `shadcn-select-value` direct prototype.,
      }
  - id: P-SHADCN-SELECT-VALUE-DISPLAY-RENDER
    text:
      {
        zh-CN: Value 自有 part 必须投射 line-clamp-1、flex、items-center、gap-2；renderer 必须在 displayValue 非空时输出该文本，否则返回空 view；displayValue 继续由 Base context/fallback 决定。,
        en: 'The Value part must project line-clamp-1, flex, items-center and gap-2; the renderer must output non-empty displayValue text and otherwise return an empty view; Base context and fallback continue to determine displayValue.',
      }
  - id: P-SHADCN-SELECT-VALUE-COMPATIBILITY-SUBSET
    text:
      {
        zh-CN: 当前 text rendering 之外的 upstream forwarding 差异集中在唯一 open question。,
        en: Upstream forwarding differences beyond current text rendering are centralized in one open question.,
      }
  - id: P-SHADCN-SELECT-VALUE-AS-CHILD-OMISSION
    text:
      {
        zh-CN: upstream Value props 中的 `asChild` 依共享决策有意省略。,
        en: The `asChild` member of upstream Value props is intentionally omitted under the shared decision.,
      }
    dependsOn: { decisions: [D-AS-CHILD-OMISSION-0001] }
openQuestions:
  - id: P-SHADCN-SELECT-VALUE-Q-UPSTREAM-DIFFERENCES
    question:
      {
        zh-CN: Value 的 children/placeholder forwarding 与当前 text renderer 应如何对齐？,
        en: How should Value children and placeholder forwarding align with the current text renderer?,
      }
    context:
      {
        zh-CN: intentional deviation 是省略 `asChild`。upstream 仅添加 data-slot 并转发 Radix Value props，允许 children/placeholder；当前由 Base displayValue 决定纯文本输出，不支持 className/native/data-slot forwarding 或自定义 selected item rendering。,
        en: The intentional deviation is omission of `asChild`. Upstream adds data-slot and forwards Radix Value props including children and placeholder; the current implementation renders plain text from Base displayValue and lacks className,
        native,
        data-slot,
        or custom selected-item rendering.,
      }
    blocks: [shadcn select value parity roadmap]
sources:
  - path: packages/prototypes/shadcn/src/select/value.proto.ts
  - path: packages/prototypes/shadcn/test/select.test.ts
  - path: https://github.com/shadcn-ui/ui/blob/f31ed81983653919dd4fe77aee4b4859f610f1dc/apps/v4/registry/new-york-v4/ui/select.tsx
    label: shadcn/ui v4 new-york SelectValue pinned baseline
dependsOn:
  contracts: [C-AS-HOOK-0001, C-CORE-SYNTAX-0003, C-CORE-SYNTAX-0007]
  decisions: [D-PROTOTYPE-ENTITY-NAMING-0001, D-AS-CHILD-OMISSION-0001]
  prototypes: [P-SHADCN-SELECT]
inherits:
  prototypes:
    [
      {
        id: P-BASE-SELECT-VALUE,
        note: Default inherited value-display protocol; explicit setup-time negative patches must be declared.,
      },
    ]
verifies: { tests: [T-SHADCN-SELECT-VALUE-0001] }
revisions:
  [
    {
      version: 0.2.0-rc.0,
      change: introduced,
      summary: Introduced Shadcn Select Value delta cataloging with Base display inheritance and centralized forwarding gaps.,
    },
  ]
tags: [prototype, shadcn, select, value, upstream-derived, delta, compatibility]

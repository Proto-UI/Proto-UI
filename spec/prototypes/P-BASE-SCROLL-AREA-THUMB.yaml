id: P-BASE-SCROLL-AREA-THUMB
type: prototype
title: Base Scroll Area Thumb is a host-projected feedback and hit subregion
status: draft
since: 0.2.0-rc.7
summary: Thumb is a stable authored part whose geometry and pointer movement are interpreted by the host session without independently owning scrolling, focus, events, accessibility, or host geometry.
statement:
  zh-CN: Thumb 为设计语言提供稳定的 composed scrollbar 反馈部件与 pointer Move 命中子区域。Base 层仍只声明 anatomy identity；family host session 解释其 Move Gesture，它不是独立 prototype Event target、focus owner、ARIA scrollbar、Drag and Drop source，也不持有 offset 或精确 geometry。
  en: Thumb provides a stable composed-scrollbar feedback part and pointer-Move hit subregion for design languages. The Base layer still claims anatomy identity only; the family host session interprets its Move Gesture, and it is not an independent prototype Event target, focus owner, ARIA scrollbar, Drag and Drop source, or owner of offset or exact geometry.
criteria:
  - id: P-BASE-SCROLL-AREA-THUMB-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-scroll-area-thumb` 与 `asScrollAreaThumb` 必须是同一 Thumb protocol 的 direct 与 authored-asHook entries。'
      en: '`base-scroll-area-thumb` and `asScrollAreaThumb` must be direct and authored-asHook entries for the same Thumb protocol.'
  - id: P-BASE-SCROLL-AREA-THUMB-NO-INDEPENDENT-SEMANTICS
    text:
      zh-CN: Thumb setup 不得定义独立 props、state、prototype event、focus、a11y 或 Drag and Drop semantics；pointer Move 由 family host session 绑定，而不是提升为 Thumb 作者 API。
      en: Thumb setup must define no independent props, state, prototype-event, focus, accessibility, or Drag and Drop semantics; pointer Move is bound by the family host session rather than promoted to a Thumb author API.
  - id: P-BASE-SCROLL-AREA-THUMB-NOT-GEOMETRY-OWNER
    text:
      zh-CN: Thumb 不得把宿主像素 geometry 或 Viewport offset 复制为自身 source of truth；geometry projection 必须从同一 host-owned scroll snapshot 派生。
      en: Thumb must not copy host pixel geometry or Viewport offset as its own source of truth; geometry projection must derive from the same host-owned scroll snapshot.
  - id: P-BASE-SCROLL-AREA-THUMB-PASSIVE-PROJECTION
    text:
      zh-CN: composed projection 下，host session 必须从 Viewport normalized facts 投射 Thumb size/offset；Thumb prototype 本身仍不得声明 State、Event、Focus 或 A11y ownership。
      en: Under composed projection, the host session must project Thumb size and offset from normalized Viewport facts while the Thumb prototype itself continues to declare no State, Event, Focus, or A11y ownership.
  - id: P-BASE-SCROLL-AREA-THUMB-MOVE-HIT-SUBREGION
    text:
      zh-CN: 在 composed projection 且存在 overflow/travel 时，host session 必须把实际 Thumb target 绑定为 Move Gesture 命中子区域，并通过 Scrollbar control route 产生 normalized `control-drag` request；Thumb 位置仍必须只由实际 surface facts 回投。
      en: Under composed projection with overflow and travel, the host session must bind the actual Thumb target as a Move Gesture hit subregion and produce normalized `control-drag` requests through the Scrollbar control route; Thumb position must still project only from actual surface facts.
sources:
  - path: packages/prototypes/base/src/scroll-area/thumb.proto.ts
dependsOn:
  prototypes: [P-BASE-SCROLL-AREA, P-BASE-SCROLL-AREA-SCROLLBAR]
  contracts:
    [C-AS-HOOK-0001, C-SCROLL-0001, C-SCROLL-COMPOSED-CHROME-0001, C-SCROLL-COMPOSED-CONTROL-0001]
verifies: { tests: [T-BASE-SCROLL-AREA-0001, T-SCROLL-COMPOSED-CONTROL-0001] }
revisions:
  - version: 0.2.0-rc.7
    change: revised
    summary: Added the Move Gesture hit-subregion role without granting independent Event, Focus, A11y, state, or Drag and Drop ownership.
  - version: 0.2.0-rc.7
    change: revised
    summary: Added host-projected passive geometry while preserving Thumb's no-independent-behavior boundary.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Cataloged Thumb as feedback-only anatomy and deferred cross-host drag and geometry ownership.
tags: [prototype, base, scroll-area, thumb, feedback, move]

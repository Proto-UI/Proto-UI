id: P-BRUTALIST-SKELETON
type: prototype
title: 'Brutalist Skeleton protocol'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Skeleton is a direct styled-only, contentless placeholder with a static role-specific surface.'

statement:
  en: P-BRUTALIST-SKELETON preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-SKELETON 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-SKELETON-DIRECT-OWNERSHIP
    text:
      en: The prototype must materialize directly without inheriting or invoking a Base Skeleton hook.
      zh-CN: 该原型必须直接 materialize，不得继承或调用 Base Skeleton hook。
  - id: P-BRUTALIST-SKELETON-VISUAL-ONLY
    text:
      en: The prototype must be contentless, aria-hidden, passive, and non-focusable, with no loading, busy, announcement, action, event, or command surface.
      zh-CN: 该原型必须是 contentless、aria-hidden、passive 且不可聚焦，并且不得拥有 loading、busy、announcement、action、event 或 command surface。
  - id: P-BRUTALIST-SKELETON-VISUAL-GRAMMAR
    text:
      en: >-
        Skeleton uses rounded-base 5px, border-2 border-black and bg-secondary-background with no shadow. It remains static as the existing Proto UI motion contract; no upstream pulse animation is imported implicitly.


      zh-CN: >-
        Skeleton 使用 rounded-base 5px、border-2 border-black 与 bg-secondary-background，无阴影；保留现有 Proto UI 静态 motion 合同，不隐式引入上游 pulse animation。


  - id: P-BRUTALIST-SKELETON-CONSUMER-SIZE
    text:
      en: The projection must not emit width, height, or min/max dimension tokens; the consuming composition owns size.
      zh-CN: 该投影不得生成 width、height 或 min/max dimension token；尺寸由消费端组合拥有。
sources:
  - path: docs/superpowers/specs/2026-10-03-neobrutalism-source-aligned-design.md
  - path: packages/prototypes/brutalist/src/skeleton/root.proto.ts
revisions:

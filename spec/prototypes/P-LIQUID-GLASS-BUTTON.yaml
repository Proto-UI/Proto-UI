id: P-LIQUID-GLASS-BUTTON
type: prototype
title: Liquid Glass fallback Button projection over Base Button
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: A user-directed, independently authored visual foundation. Full family/component coverage, material capability where applicable, generated/native evidence and stable admission remain open; source package availability is not release or conformance admission.
summary: 'This first slice is only the opaque, non-moving fallback for functional controls: capsule corners, paired light/dark surface and foreground, restrained elevation and visible keyboard focus. It must not claim translucent material, refraction, adaptive luminosity, morphing or completion of the Liquid Glass design request. Those need the separately tracked preference/material boundary.'
statement:
  en: 'This first slice is only the opaque, non-moving fallback for functional controls: capsule corners, paired light/dark surface and foreground, restrained elevation and visible keyboard focus. It must not claim translucent material, refraction, adaptive luminosity, morphing or completion of the Liquid Glass design request. Those need the separately tracked preference/material boundary. variant is regular | prominent, default regular; disabled is inherited and defaults false.'
criteria:
  - id: P-LIQUID-GLASS-BUTTON-BASE
    text:
      en: The Prototype invokes asButton() once, preserves inherited interaction, focus, disabled and click ownership, and consumes only its exposed state handles for visual Rules.
  - id: P-LIQUID-GLASS-BUTTON-API
    text:
      en: variant is regular | prominent, default regular; disabled is inherited and defaults false. Removing a prop restores its default.
  - id: P-LIQUID-GLASS-BUTTON-VISUAL
    text:
      en: 'This first slice is only the opaque, non-moving fallback for functional controls: capsule corners, paired light/dark surface and foreground, restrained elevation and visible keyboard focus. It must not claim translucent material, refraction, adaptive luminosity, morphing or completion of the Liquid Glass design request. Those need the separately tracked preference/material boundary.'
  - id: P-LIQUID-GLASS-BUTTON-CLOSURE
    text:
      en: Appearance is authored in feedback tokens and state/prop Rules; every token has an explicit physical translation. Standalone Web output must not depend on website component CSS or reset rules.
  - id: P-LIQUID-GLASS-BUTTON-BOUNDARY
    text:
      en: The package is private and unreleased. Initial source and Web evidence do not establish general Prototype Compiler, GPUI, Flutter or Qt support. Homepage and full component coverage remain separate work.
sources:

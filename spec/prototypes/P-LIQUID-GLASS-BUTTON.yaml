id: P-LIQUID-GLASS-BUTTON
type: prototype
title: Liquid Glass fallback Button projection over Base Button
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: A user-directed, independently authored visual foundation. Full family/component coverage, material capability where applicable, generated/native evidence and stable admission remain open; source package availability is not release or conformance admission.
summary: A regular functional Button with live preference/support-gated 80% fill and 4px backdrop blur, plus deterministic opaque fallback and solid prominent action.
statement:
  en: A regular functional Button with live preference/support-gated 80% fill and 4px backdrop blur, plus deterministic opaque fallback and solid prominent action. material is auto | opaque (default auto); variant is regular | prominent. Base remains the sole interaction owner. Unknown, reduction, contrast, forced-colors or missing support withdraws translucency immediately.
criteria:
  - id: P-LIQUID-GLASS-BUTTON-BASE
    text:
      en: The Prototype invokes asButton() once, preserves inherited interaction, focus, disabled and click ownership, and consumes only its exposed state handles for visual Rules.
  - id: P-LIQUID-GLASS-BUTTON-API
    text:
      en: variant is regular | prominent (default regular), material is auto | opaque (default auto), and inherited disabled defaults false. Removing a visual prop restores its default.
  - id: P-LIQUID-GLASS-BUTTON-VISUAL
    text:
      en: The regular functional surface uses capsule geometry and readable source-owned light/dark colors. Auto may apply 80% secondary fill and 4px backdrop blur only under the admitted live policy. Prominent remains solid. No movement, refraction, adaptive luminosity or proprietary Apple material is promised.
  - id: P-LIQUID-GLASS-BUTTON-CLOSURE
    text:
      en: Appearance is authored in feedback tokens and state/prop Rules; every token has an explicit physical translation. Standalone Web output must not depend on website component CSS or reset rules.
  - id: P-LIQUID-GLASS-BUTTON-BOUNDARY
    text:
      en: The package is private and unreleased. Initial source and Web evidence do not establish general Prototype Compiler, GPUI, Flutter or Qt support. Homepage and full component coverage remain separate work.
  - id: P-LIQUID-GLASS-BUTTON-MATERIAL
    text:
      en: Auto enhancement requires regular variant, all four preference.* keys in their safe no-preference/none states, and both styleSupport.alphaFill and styleSupport.backdropBlur4px equal true. Opaque opt-out, unknown or lost/mismatched sources, any reduction/contrast/forced-colors request, or unsupported style fact removes both translucent fill and backdrop blur without moving interaction ownership.
sources:
  - path: packages/prototypes/liquid-glass/src/button/button.proto.ts
  - path: packages/prototypes/liquid-glass/src/theme.ts
  - path: packages/prototypes/liquid-glass/README.md

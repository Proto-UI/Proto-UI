id: P-BRUTALIST-DIALOG-CLOSE
type: prototype
title: Brutalist Dialog Close inherits Base close behavior and layers nothing visual
status: draft
since: 0.2.0-rc.7
summary: >-
  Brutalist Dialog Close inherits Base Dialog Close behavior ownership and provides only an inheritable close surface with no visual styling of its own. The projection is limited to Base inheritance and the direct entry; the visual close-icon variant is a separate prototype (P-BRUTALIST-DIALOG-CLOSE-ICON).


statement:
  en: >-
    Brutalist Dialog Close is a draft Proto UI-maintained Neo-Brutalist design-language projection over Base Dialog Close. It preserves inherited Base protocol semantics (close/disabled state ownership) and adds the direct prototype entry only; it contributes no visual styling, acting as a bare slot-bearing close host for composing sibling parts.


  zh-CN: >-
    Brutalist Dialog Close 是 Proto UI 维护的 draft Neo-Brutalist design-language 投射，建立在 Base Dialog Close 之上。它保留继承的 Base 协议语义（close/disabled 状态归属），仅增加直接 prototype 入口；自身不贡献视觉样式，作为承载 slot 的纯 close 宿主供组合兄弟部件使用。


criteria:
  - id: P-BRUTALIST-DIALOG-CLOSE-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Dialog Close through `asDialogClose()` once and must not redefine Base close or disabled protocol semantics. Visual projection may only consume the projected state handles.


      zh-CN: >-
        该 prototype 必须通过 `asDialogClose()` 一次性继承 Base Dialog Close，不得重定义 Base 的 close 或 disabled 协议语义；视觉投射只能消费投影出的 state handles。


  - id: P-BRUTALIST-DIALOG-CLOSE-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-dialog-close`.
      zh-CN: 直接 prototype 入口名为 `brutalist-dialog-close`。
  - id: P-BRUTALIST-DIALOG-CLOSE-COMPOSITION
    text:
      en: >-
        Close owns dismissal and projects no control surface of its own: it claims no role, stays off the tab ring, and carries no resting, hover, pressed, or focus-visible treatment. A consumer that needs a visible action composes a control child, normally Brutalist Button, whose continuous trigger route merges with Close under `asTrigger()`, so the composition keeps one tab stop and issues one dismissal.


      zh-CN: >-
        Close 拥有 dismissal，自身不投射任何 control surface：不声明 role、不进入 tab 序列，也不带 resting、hover、pressed 或 focus-visible 处理。需要可见 action 的调用方组合一个 control child（通常是 Brutalist Button），其连续 trigger route 在 `asTrigger()` 下与 Close 合并，因此组合后只有一个 tab stop、只发出一次 dismissal。


sources:
  - path: packages/prototypes/brutalist/src/dialog/close.proto.ts
  - path: packages/prototypes/brutalist/test/dialog.test.ts
relates:
  knowledge: [K-BRUTALIST-0001]
dependsOn:
  contracts: [C-CORE-SYNTAX-0003, C-AS-HOOK-0001, C-RULE-INTENT-FEEDBACK-STYLE-0001]
inherits:
  prototypes:
    - id: P-BASE-DIALOG-CLOSE
verifies: { tests: [T-BRUTALIST-DIALOG-0001] }
revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: >-
      Introduced draft Brutalist Dialog Close projection with real public-API criteria (Base inheritance, direct entry) on rc.7. Not present in immutable rc.6.


  - version: 0.3.0-alpha.0
    change: revised
    summary: >-
      Cataloged that Close owns dismissal without a control surface and that consumers compose one.


tags: [prototype, brutalist, neo-brutalist, visual, delta, dialog]

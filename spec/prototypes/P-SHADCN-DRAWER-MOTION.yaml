openQuestions:
  - id: P-SHADCN-DRAWER-MOTION-Q-INITIAL-ADMISSION
    question:
      en: How should initial Root defaultOpen suppress first presentation while preserving Content declaration admission and Mask ordering?
    context:
      en: Pinned Vaul 1.1.2 initializes shouldAnimate from not defaultOpen. Current Base admission can deliver accepted open only after Transition initialization; binding raw Root open would bypass admission. Generic Transition initial entered behavior does not prove this family integration.
    blocks: [activation:P-SHADCN-DRAWER-MOTION]

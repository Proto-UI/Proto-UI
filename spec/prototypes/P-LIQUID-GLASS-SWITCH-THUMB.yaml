id: P-LIQUID-GLASS-SWITCH-THUMB
type: prototype
title: Liquid Glass Switch Thumb projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native and material-host evidence plus independent review; source presence, private package availability and intent frames are not release, conformance or Apple-equivalence admission.
summary: Context-derived visual indicator without another value or event owner.
statement:
  en: The Prototype invokes asSwitchThumb() once and derives checked/disabled facts from its Root context.
criteria:
  - id: P-LIQUID-GLASS-SWITCH-THUMB-BASE
    text:
      en: Invoke asSwitchThumb() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias or Base.setup call.
  - id: P-LIQUID-GLASS-SWITCH-THUMB-VISUAL
    text:
      en: 'Passive thumb paint and position only; no value, focus, input or event ownership. Exact functional material clauses are provisional: real provider capability, missing-host opaque fallback and bounded source leases stay governed by the shared V2 material contract.'
  - id: P-LIQUID-GLASS-SWITCH-THUMB-CLOSURE
    text:
      en: All family appearance is authored through feedback tokens, typed material intent and Rules with explicit finite physical translation; no website-only CSS, private Apple asset or Adapter component-name dispatch may supply default intent, and explicit liquid-glass intent is never silently replaced by adaptive native blur.
  - id: P-LIQUID-GLASS-SWITCH-THUMB-BOUNDARY
    text:
      en: Exact-head browser, native, material-provider and Compiler evidence plus independent review remain open; the package is private and source-only. Apple documentation is a design reference, not implementation, asset or equivalence evidence. Catalog presence is a draft relation, not acceptance.
dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
inherits:
  prototypes:
    - P-BASE-SWITCH-THUMB
verifies:
  tests:
    - T-LIQUID-GLASS-DRAFT-CONTROL-0001
sources:
  - path: packages/prototypes/liquid-glass/src/switch/thumb.proto.ts
  - path: packages/prototypes/liquid-glass/src/switch/index.ts
  - path: https://developer.apple.com/design/human-interface-guidelines/materials
    label: Apple HIG Materials design reference only
revisions:

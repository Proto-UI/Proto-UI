id: P-LIQUID-GLASS-CHECKBOX
type: prototype
title: Liquid Glass Checkbox projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native and material-host evidence plus independent review; source presence, private package availability and intent frames are not release, conformance or Apple-equivalence admission.
summary: Checked/mixed control with family box paint.
statement:
  en: The Prototype invokes asCheckboxRoot() once; Base owns checked/mixed, activation and optional Field policy.
criteria:
  - id: P-LIQUID-GLASS-CHECKBOX-BASE
    text:
      en: Invoke asCheckboxRoot() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias or Base.setup call.
  - id: P-LIQUID-GLASS-CHECKBOX-VISUAL
    text:
      en: 'Use the six public Apple HIG macOS Checkbox illustrations as the standalone default appearance reference. Their 32 by 32 source-pixel box at @2x establishes a 16 by 16 logical paint target. Preserve the 20 by 20 activation/focus frame and the external Label association. While the material host uses the Root border box for its paint geometry, the fallback and optical paint share that 20 by 20 frame. An independently inset 16 by 16 material surface remains open. The 4-unit corner radius is a family approximation. Checked and mixed retain the consumer primary/primary-foreground pair (blue/white in the family defaults) and differ by glyph. Disabled retains opaque muted/muted-foreground paint, visible marks, blocked activation and no elevation. Focus remains on the Base Root. Default material is auto; explicit opaque and missing-provider fallback retain the complete ordinary paint.'
  - id: P-LIQUID-GLASS-CHECKBOX-REFERENCE-COLOR
    text:
      en: 'The source PNGs declare sRGB. Measured light matte/field encoded RGB are (247,247,247)/(234,234,234). The encoded sRGB black-overlay model gives 1-234/247 = 0.0526. Dark matte/field are (54,43,38)/(74,65,60). The encoded sRGB white-overlay model gives (field-matte)/(255-matte) = (0.0995,0.1038,0.1014). Composite the rounded 5% black and 10% white over the corresponding default family backgrounds in encoded sRGB and round each channel to the nearest byte. The resulting opaque secondary-background role is #e9e9eb over #f5f5f7 and #333335 over #1c1c1e. This approximates the reference neutral fill while providing the opaque pair required by V2. Source blue samples (10,141,255) light and (0,136,255) dark describe artwork only. The six illustrations supply no disabled, hover, focus, hit-target or physical-device measurement.'
  - id: P-LIQUID-GLASS-CHECKBOX-CLOSURE
    text:
      en: All family appearance is authored through feedback tokens, typed material intent and Rules with explicit finite physical translation; no website-only CSS, private Apple asset or Adapter component-name dispatch may supply default intent, and explicit liquid-glass intent is never silently replaced by adaptive native blur.
  - id: P-LIQUID-GLASS-CHECKBOX-BOUNDARY
    text:
      en: Exact-head browser, native, material-provider and Compiler evidence plus independent review remain open; the package is private and source-only. Apple documentation is a design reference, not implementation, asset or equivalence evidence. Catalog presence is a draft relation, not acceptance.

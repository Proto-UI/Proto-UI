id: P-BRUTALIST-DIALOG-HEADER
type: prototype
title: 'Brutalist Dialog Header is an optional layout-only anatomy part'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Dialog Header is an optional layout-only anatomy part inside the DIALOG_FAMILY. It has no Base prototype to inherit; the projection is limited to the direct entry, a DIALOG_FAMILY header anatomy claim, and a bottom-bordered grid layout surface.'

statement:
  en: P-BRUTALIST-DIALOG-HEADER preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-DIALOG-HEADER 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-DIALOG-HEADER-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-dialog-header`.
      zh-CN: 直接 prototype 入口名为 `brutalist-dialog-header`。
  - id: P-BRUTALIST-DIALOG-HEADER-ANATOMY
    text:
      en: >-
        The prototype claims the `header` role inside the `DIALOG_FAMILY` anatomy and forwards its slot content. It is optional and does not own open/close or interaction semantics.


      zh-CN: >-
        该 prototype 在 `DIALOG_FAMILY` anatomy 中声明 `header` 角色并透传其 slot 内容。它是可选的，不持有 open/close 或交互语义。


  - id: P-BRUTALIST-DIALOG-HEADER-VISUAL-GRAMMAR
    text:
      en: >-
        Header owns grid gap-1 pb-3 text-left layout and no compulsory separator, fill or shadow. Authored content retains its own text roles.


      zh-CN: >-
        Header 拥有 grid gap-1 pb-3 text-left 布局，不强制 separator、fill 或 shadow；作者内容保留自身文本 role。



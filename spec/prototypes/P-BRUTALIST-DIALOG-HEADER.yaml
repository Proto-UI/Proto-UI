id: P-BRUTALIST-DIALOG-HEADER
type: prototype
title: Brutalist Dialog Header is an optional layout-only anatomy part
status: draft
since: 0.2.0-rc.7
summary: >-
  Brutalist Dialog Header is an optional layout-only anatomy part inside the DIALOG_FAMILY. It has no Base prototype to inherit; the projection is limited to the direct entry, a DIALOG_FAMILY header anatomy claim, and a bottom-bordered grid layout surface.


statement:
  en: >-
    Brutalist Dialog Header is a draft Proto UI-maintained Neo-Brutalist design-language projection with no Base prototype to inherit (anatomy-only). It claims the `header` role inside the `DIALOG_FAMILY` anatomy and adds only a grid layout surface with a bottom border, text-left alignment, and gap spacing; it carries no interactive or close behavior of its own.


  zh-CN: >-
    Brutalist Dialog Header 是 Proto UI 维护的 draft Neo-Brutalist design-language 投射，为 anatomy-only，无可继承的 Base prototype。它在 `DIALOG_FAMILY` anatomy 中声明 `header` 角色，仅增加带下边框的 grid 布局表面、text-left 对齐与 gap 间距；自身不带任何交互或 close 行为。


criteria:
  - id: P-BRUTALIST-DIALOG-HEADER-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-dialog-header`.
      zh-CN: 直接 prototype 入口名为 `brutalist-dialog-header`。
  - id: P-BRUTALIST-DIALOG-HEADER-ANATOMY
    text:
      en: >-
        The prototype claims the `header` role inside the `DIALOG_FAMILY` anatomy and forwards its slot content. It is optional and does not own open/close or interaction semantics.


      zh-CN: >-
        该 prototype 在 `DIALOG_FAMILY` anatomy 中声明 `header` 角色并透传其 slot 内容。它是可选的，不持有 open/close 或交互语义。


  - id: P-BRUTALIST-DIALOG-HEADER-VISUAL-GRAMMAR
    text:
      en: >-
        The surface uses `grid gap-1 border-b-2 border-foreground pb-3 text-left` — a grid layout panel with a 2px bottom border resolved from the theme foreground rather than a fixed black, no fill of its own, and left-aligned text, preserving the Neo-Brutalist structural border grammar without gradients, glass, rounded cards, or soft elevation.


      zh-CN: >-
        表面使用 `grid gap-1 border-b-2 border-foreground pb-3 text-left`——带有由主题 foreground 解析而非固定黑色的 2px 下边框的 grid 布局面板、无自有填充、左对齐文本，保持 Neo-Brutalist 结构边框语法，不得使用渐变、玻璃拟态、圆角卡片或柔和高度阴影。


sources:
  - path: packages/prototypes/brutalist/src/dialog/header.proto.ts

id: P-BRUTALIST-HOVER-CARD-TRIGGER
type: prototype
title: 'Brutalist Hover Card Trigger inherits Base Hover Card Trigger and layers a command-like surface'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Hover Card Trigger inherits Base preview-intent Trigger semantics and projects a style-family visual API: a main accent paired fill, component-owned rounded geometry, hard offset shadows, and hover/focus-visible/disabled interaction states.'

statement:
  en: P-BRUTALIST-HOVER-CARD-TRIGGER preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-HOVER-CARD-TRIGGER 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-HOVER-CARD-TRIGGER-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Hover Card Trigger through `asHoverCardTrigger()` once and must not redefine Base hover, focus, or disabled protocol semantics. Visual projection may only consume the projected state handles (`hovered`, `focusVisible`, `disabled`).


      zh-CN: >-
        该 prototype 必须通过 `asHoverCardTrigger()` 一次性继承 Base Hover Card Trigger，不得重定义 Base 的 hover、focus 或 disabled 协议语义；视觉投射只能消费投影出的 state handles（`hovered`、`focusVisible`、`disabled`）。


  - id: P-BRUTALIST-HOVER-CARD-TRIGGER-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-hover-card-trigger` and is the only public Hover Card Trigger entry in this foundation slice.
      zh-CN: 直接 prototype 入口名为 `brutalist-hover-card-trigger`，且是本 foundation 切片中唯一公开的 Hover Card Trigger 入口。
  - id: P-BRUTALIST-HOVER-CARD-TRIGGER-PAIR-INVARIANT
    text:
      en: >-
        The base fill must co-select its foreground: the trigger uses `bg-main` with `text-main-foreground` (with `border-2 border-black` and a hard `shadow-[4px_4px_0_0_#000]`). No rule may replace the fill's foreground with a theme-global text token independently of its background.


      zh-CN: >-
        基础填充必须同时选择其前景：trigger 使用 `bg-main` 与 `text-main-foreground`（配 `border-2 border-black` 与硬阴影 `shadow-[4px_4px_0_0_#000]`）。任何规则都不得在脱离背景的情况下用主题全局文本 token 覆盖填充前景。


  - id: P-BRUTALIST-HOVER-CARD-TRIGGER-INTERACTION
    text:
      en: >-
        Hover settles the trigger +4px,+4px and removes its 4px hard shadow. Focus-visible retains the existing ring; disabled retains its pointer gate and opacity. Hover Card opening remains Base-owned.


      zh-CN: >-
        hover 将 trigger 下沉 +4px,+4px 并移除 4px 硬阴影。保留 focus-visible ring、disabled pointer gate 与 opacity；Hover Card open 仍由 Base 拥有。


  - id: P-BRUTALIST-HOVER-CARD-TRIGGER-VISUAL-GRAMMAR
    text:
      en: >-
        The trigger uses 5px rounded-base corners, 2px black structural borders, flat paired fills, and explicit per-component elevation. Text-bearing surfaces carry DM Sans via font-sans with a system sans fallback; base weight is 500, heading/Toggle/Tabs-trigger weight is 700, and authored casing is preserved. No gradient, glass, blur, or soft shadow; its Button-like rest elevation is 4px 4px 0 0 black. Existing fill-pair, native semantics, placement and API ownership remain unchanged.


      zh-CN: >-
        Trigger 使用5px rounded-base 圆角、2px 黑色结构边框、平面色对与按组件分工的 elevation。文本 surface 通过 font-sans 携带 DM Sans 与系统 sans fallback；正文为 500，标题、Toggle 与 Tabs Trigger 为 700，保留作者大小写。不使用 gradient、glass、blur 或 soft shadow，Button-like 静止阴影为 4px 4px 0 0 黑色。保留现有色对、原生语义、placement 与 API owner。



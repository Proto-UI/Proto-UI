id: P-BRUTALIST-HOVER-CARD-TRIGGER
type: prototype
title: Brutalist Hover Card Trigger inherits Base Hover Card Trigger and layers a command-like surface
status: draft
since: 0.2.0-rc.7
summary: >-
  Brutalist Hover Card Trigger inherits Base preview-intent Trigger semantics and projects a style-family visual API: a main accent paired fill, square geometry, hard offset shadows, and hover/focus-visible/disabled interaction states.


statement:
  en: >-
    Brutalist Hover Card Trigger is a draft Proto UI-maintained Neo-Brutalist design-language projection over Base Hover Card Trigger. It preserves inherited Base protocol semantics (hover/focus/disabled) and adds only visual/style behavior: a `bg-main` paired `text-main-foreground` surface, zero radius, black structural borders, hard offset shadows, hover lift, focus-visible hard ring, and disabled emphasis reduction.


  zh-CN: >-
    Brutalist Hover Card Trigger 是 Proto UI 维护的 draft Neo-Brutalist design-language 投射，建立在 Base Hover Card Trigger 之上。它保留继承的 Base 协议语义（hover/focus/disabled），仅增加视觉/style 行为：`bg-main` 配对 `text-main-foreground` 表面、零圆角、黑色结构边框、硬偏移阴影、hover 抬升、focus-visible 硬 ring 与 disabled 降低强调。


criteria:
  - id: P-BRUTALIST-HOVER-CARD-TRIGGER-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Hover Card Trigger through `asHoverCardTrigger()` once and must not redefine Base hover, focus, or disabled protocol semantics. Visual projection may only consume the projected state handles (`hovered`, `focusVisible`, `disabled`).


      zh-CN: >-
        该 prototype 必须通过 `asHoverCardTrigger()` 一次性继承 Base Hover Card Trigger，不得重定义 Base 的 hover、focus 或 disabled 协议语义；视觉投射只能消费投影出的 state handles（`hovered`、`focusVisible`、`disabled`）。


  - id: P-BRUTALIST-HOVER-CARD-TRIGGER-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-hover-card-trigger` and is the only public Hover Card Trigger entry in this foundation slice.
      zh-CN: 直接 prototype 入口名为 `brutalist-hover-card-trigger`，且是本 foundation 切片中唯一公开的 Hover Card Trigger 入口。
  - id: P-BRUTALIST-HOVER-CARD-TRIGGER-PAIR-INVARIANT
    text:
      en: >-
        The base fill must co-select its foreground: the trigger uses `bg-main` with `text-main-foreground` (with `border-2 border-black` and a hard `shadow-[3px_3px_0_0_#000]`). No rule may replace the fill's foreground with a theme-global text token independently of its background.


      zh-CN: >-
        基础填充必须同时选择其前景：trigger 使用 `bg-main` 与 `text-main-foreground`（配 `border-2 border-black` 与硬阴影 `shadow-[3px_3px_0_0_#000]`）。任何规则都不得在脱离背景的情况下用主题全局文本 token 覆盖填充前景。


  - id: P-BRUTALIST-HOVER-CARD-TRIGGER-INTERACTION
    text:
      en: >-
        Hover lifts the trigger (`-translate-x-px -translate-y-px` with deeper `shadow-[4px_4px_0_0_#000]`). Focus-visible applies a hard ring (`ring-2 ring-ring ring-offset-2`). Disabled reduces emphasis with `pointer-events-none` and `opacity-50` while preserving geometry and the base fill pair.


      zh-CN: >-
        Hover 抬升 trigger（`-translate-x-px -translate-y-px` 并加深为 `shadow-[4px_4px_0_0_#000]`）。Focus-visible 使用硬 ring（`ring-2 ring-ring ring-offset-2`）。Disabled 以 `pointer-events-none` 与 `opacity-50` 降低强调，同时保留几何与基础填充色对。


  - id: P-BRUTALIST-HOVER-CARD-TRIGGER-VISUAL-GRAMMAR
    text:
      en: >-
        The visual surface must preserve square corners (`rounded-none`), black structural borders (`border-2 border-black`), hard zero-blur offset shadows, flat theme-token fills, and bold uppercase typography (`font-bold uppercase`) without gradients, glass, rounded cards, or soft elevation.


      zh-CN: >-
        视觉表面必须保持直角（`rounded-none`）、黑色结构边框（`border-2 border-black`）、零模糊硬偏移阴影、平面主题 token 填充与粗体大写排版（`font-bold uppercase`），不得使用渐变、玻璃拟态、圆角卡片或柔和高度阴影。



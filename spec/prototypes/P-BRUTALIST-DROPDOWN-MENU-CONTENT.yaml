revisions:
  - version: 0.3.0-alpha.0
    change: refined
    summary: >-
      Anchored menus to the Trigger's layout position by defaulting excludeAnchorTranslation to true, excluding decorative hover-lift and press transforms from menu geometry.

  - version: 0.2.0-rc.7
    change: introduced
    summary: >-
      Introduced draft Brutalist Dropdown Menu Content projection with real public-API criteria (Base inheritance, entry, 150/100ms transition with fade-zoom and side slide-in, panel visual grammar) on the rc.7 release train. Not present in the immutable rc.6 snapshot.



id: P-BRUTALIST-DROPDOWN-MENU-CONTENT
type: prototype
title: 'Brutalist Dropdown Menu Content inherits Base menu overlay and layers a hard-shadowed transition panel'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Dropdown Menu Content inherits Base Dropdown Menu overlay behavior and projects a style-family visual API: a max-height-constrained Brutalist panel, a 150ms enter / 100ms leave transition with fade-zoom open animation and side-based slide-in.'

statement:
  en: P-BRUTALIST-DROPDOWN-MENU-CONTENT preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-DROPDOWN-MENU-CONTENT 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-DROPDOWN-MENU-CONTENT-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Dropdown Menu Content through `asDropdownContent()` once and must not redefine Base open, side, or transition protocol semantics. It must consume the projected `open` state handle, the projected `side` prop, and the `asTransition.transitionState` for animation framing.


      zh-CN: >-
        该 prototype 必须通过 `asDropdownContent()` 一次性继承 Base Dropdown Menu Content，不得重定义 Base 的 open、side 或 transition 协议语义；必须消费投影出的 `open` state handle、`side` prop 与 `asTransition.transitionState` 以构成动画。


  - id: P-BRUTALIST-DROPDOWN-MENU-CONTENT-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-dropdown-content` and is the only public Dropdown Menu Content entry in this foundation slice.
      zh-CN: 直接 prototype 入口名为 `brutalist-dropdown-content`，且是本 foundation 切片中唯一公开的 Dropdown Menu Content 入口。
  - id: P-BRUTALIST-DROPDOWN-MENU-CONTENT-TRANSITION
    text:
      en: >-
        The content must configure `asTransition` with `enterDuration: 150` and `leaveDuration: 100`. When `transitionState` is `entering` or `entered` it applies `animate-in fade-in-0 zoom-in-95`; when `open` is false it applies `animate-out fade-out-0 zoom-out-95`. Side-based slide-in is applied alongside the open animation: `bottom` → `slide-in-from-top-2`, `top` → `slide-in-from-bottom-2`, `left` → `slide-in-from-right-2`, `right` → `slide-in-from-left-2`.


      zh-CN: >-
        content 必须将 `asTransition` 配置为 `enterDuration: 150` 与 `leaveDuration: 100`。当 `transitionState` 为 `entering` 或 `entered` 时应用 `animate-in fade-in-0 zoom-in-95`；当 `open` 为 false 时应用 `animate-out fade-out-0 zoom-out-95`。开启动画之外再按方向施加 slide-in：`bottom` → `slide-in-from-top-2`、`top` → `slide-in-from-bottom-2`、`left` → `slide-in-from-right-2`、`right` → `slide-in-from-left-2`。


  - id: P-BRUTALIST-DROPDOWN-MENU-CONTENT-VISUAL-GRAMMAR
    text:
      en: >-
        The content uses BRUTALIST_PANEL_TOKENS: rounded-base (5px), border-2 border-black, bg-background/text-foreground, font-sans font-medium. This anchored popup has no hard shadow. Existing positioning, available-space bounds, padding, transition and focus ownership remain unchanged. Rounded children own their own radius; the parent must not globally zero or override child geometry.


      zh-CN: >-
        Content 使用 BRUTALIST_PANEL_TOKENS：rounded-base（5px）、border-2 border-black、bg-background/text-foreground、font-sans font-medium。anchored popup 无硬阴影；现有 positioning、可用空间边界、padding、transition 与 focus owner 不变。圆角 child 各自拥有 radius；父级不得全局清零或覆盖 child 几何。


  - id: P-BRUTALIST-DROPDOWN-MENU-CONTENT-ANCHOR-TRANSFORM
    text:
      en: >-
        The prototype must default `excludeAnchorTranslation` to true so the anchored menu tracks the Trigger's layout position instead of its decorative hover-lift and press transforms; apps may still override the prop per instance.


      zh-CN: >-
        该 prototype 必须将 `excludeAnchorTranslation` 默认为 true，使锚定菜单跟随 Trigger 的布局位置而非其装饰性 hover-lift 与 press transform；应用仍可按实例覆盖该 prop。



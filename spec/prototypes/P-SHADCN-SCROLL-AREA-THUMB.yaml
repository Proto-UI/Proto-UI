revisions:
  - version: 0.3.0-alpha.2
    change: revised
    summary: Replaced the zero-basis flexible fill with full cross-axis dimensions under the existing host-owned size and offset; preserves passive ownership and draft status, with native drag and visibility acceptance pending.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Proposed an active-forced-colors-only contour using existing Preference and border vocabulary while preserving the ordinary borderless recipe and host geometry; native acceptance remains pending.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Reconciled retained New York borderless Thumb paint and square Lyra/Sera profiles; supersedes the earlier transparent-border recipe without claiming native forced-color acceptance.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added a transparent one-pixel Thumb border to retain visible position feedback under forced colors without changing host geometry or opting out of the user palette.
  - version: 0.3.0-alpha.0
    change: introduced
    summary: Introduced the passive rounded shadcn Scroll Area Thumb surface.

id: P-SHADCN-SCROLL-AREA-THUMB
type: prototype
title: shadcn Scroll Area Thumb projects passive host-driven feedback
status: draft
lifecycleRationale: This passive Shadcn Thumb presentation remains a draft Base projection; host-owned movement and cleanup evidence does not grant a new interaction protocol or stable lifecycle.
since: 0.3.0-alpha.0
summary: shadcn Scroll Area Thumb inherits Base passive geometry and Move hit routing and adds the selected profile's fill and corner shape.
statement:
  en: Thumb remains a passive, non-focusable, roleless host-projected subregion and adds only its flexible fill and profile-specific corner shape.
  zh-CN: Thumb 继续作为 passive、不可聚焦、roleless 的 host-projected subregion，仅增加 flexible fill 与 profile-specific corner shape。
criteria:
  - id: P-SHADCN-SCROLL-AREA-THUMB-BASE-INHERITANCE
    text:
      en: Thumb must inherit P-BASE-SCROLL-AREA-THUMB through asScrollAreaThumb() and must not own scroll or Move state.
      zh-CN: Thumb 必须通过 asScrollAreaThumb() 继承 P-BASE-SCROLL-AREA-THUMB，且不得拥有 scroll 或 Move state。
  - id: P-SHADCN-SCROLL-AREA-THUMB-DIRECT-ENTRY
    text:
      en: The direct Thumb entry is shadcn-scroll-area-thumb and this layer provides no authored asHook.
      zh-CN: Thumb direct entry 为 shadcn-scroll-area-thumb，且本层不提供 authored asHook。
  - id: P-SHADCN-SCROLL-AREA-THUMB-CURRENT-VISUAL-SURFACE
    text:
      en: Thumb must project relative h-full w-full bg-border without an ordinary authored border, filling the track's content box across the scrolling axis while host facts determine its scrolling-axis border-box size and offset. The host's explicit axis size overrides the corresponding full-size declaration; the empty Thumb must not retain a zero flex basis when the host disables flex growth. This sizing adaptation replaces the pinned source's flex-1 for Proto UI's existing host-owned geometry. New York and the nonsquare profiles use rounded-full; Lyra and Sera use rounded-none. The retained New York source does not add a transparent Thumb border. Native forced-color visibility requires separate evidence and is not certified by this ordinary fill recipe.
      zh-CN: Thumb 必须投射 relative h-full w-full bg-border，不添加普通 authored border；沿滚动交叉轴填满 track content box，滚动主轴 border-box size 与 offset 仍由 host facts 决定。host 的显式主轴尺寸覆盖相应 full-size 声明；host 关闭 flex growth 时，空 Thumb 不得保留 zero flex basis。该尺寸适配为 Proto UI 既有 host-owned geometry 替换 pinned source 的 flex-1。New York 与非方角 profiles 使用 rounded-full，Lyra 与 Sera 使用 rounded-none。保留的 New York 源不添加透明 Thumb border；native forced-color 可见性需要独立证据，普通 fill recipe 不构成认证。
  - id: P-SHADCN-SCROLL-AREA-THUMB-FORCED-COLORS-CONTOUR
    text:
      en: Only when the existing preference.forcedColors fact is active, Thumb must add a one-pixel solid currentColor border inside its host-owned border box using box-border border border-current. This conditional accessibility adaptation qualifies the ordinary borderless recipe above. The user agent retains system-palette rendering authority through forced-color-adjust:auto; no authored system-color literal, palette override, new public API or compiler special case is introduced. The none and unknown facts must not enable the adaptation, and leaving active must withdraw it. Both vertical and horizontal New York Thumb cross axes must retain their ordinary 7px outer extent; host size, offset, travel, drag mapping and profile corner shape remain unchanged. Acceptance must compare the actually painted contour against the immediately adjacent rendered surface in both light and dark forced-color palettes, rather than treating computed fill or the presence of a border as proof of visibility. Existing native geometry, drag, focus, keyboard and teardown acceptance remains required.
      zh-CN: 仅当既有 preference.forcedColors fact 为 active 时，Thumb 必须以 box-border border border-current 在 host 所有的 border box 内添加一像素实线 currentColor 边框。该条件性无障碍适配限定上述普通无边框配方。用户代理通过 forced-color-adjust:auto 保留系统调色板绘制权；不得引入 authored system-color literal、调色板覆盖、新 public API 或 compiler 特例。none 与 unknown 不得启用适配，离开 active 时必须撤销。New York 的纵横 Thumb 交叉轴均须保持普通 7px 外部尺寸；host size、offset、travel、drag mapping 与 profile corner shape 均不变。验收必须在浅色与深色 forced-color 调色板下，将实际绘制轮廓与紧邻 rendered surface 对比，不得以 computed fill 或边框存在作为可见性证明。既有 native geometry、drag、focus、keyboard 与 teardown 验收仍须保留。
  - id: P-SHADCN-SCROLL-AREA-THUMB-PASSIVE-BOUNDARY
    text:
      en: Thumb must remain roleless and outside sequential focus; movement requests must retain Base pointer guards and teardown.
      zh-CN: Thumb 必须保持 roleless 且不进入 sequential focus；movement requests 必须保留 Base pointer guards 与 teardown。

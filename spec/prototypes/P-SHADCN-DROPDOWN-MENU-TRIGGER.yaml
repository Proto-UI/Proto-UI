id: P-SHADCN-DROPDOWN-MENU-TRIGGER
type: prototype
title: Shadcn Dropdown Menu Trigger inherits Base command behavior and adds an optional indicator extension
status: draft
since: 0.2.0-rc.0
summary: Shadcn Dropdown Menu Trigger inherits Base command, accessibility, request, and disabled behavior and adds the current button-like visual surface plus an opt-in Proto UI indicator extension.
statement:
  zh-CN: >-
    Shadcn Dropdown Menu Trigger 是 `P-BASE-DROPDOWN-MENU-TRIGGER` 之上的 direct part，保留 command、a11y、open request 与 disabled behavior，并增加当前 button-like surface 及 hover/focus/press feedback。`indicator`、`indicatorIcon`、`indicatorSize`、`indicatorStrokeWidth` 是默认关闭的 Proto UI legacy extension，不是官方 Trigger parity；`asChild` 明确不提供。


  en: >-
    Shadcn Dropdown Menu Trigger is a direct part over `P-BASE-DROPDOWN-MENU-TRIGGER`. It retains command, accessibility, open-request, and disabled behavior while adding the current button-like surface and hover, focus, and press feedback. `indicator`, `indicatorIcon`, `indicatorSize`, and `indicatorStrokeWidth` are a disabled-by-default Proto UI legacy extension rather than upstream Trigger parity; `asChild` is explicitly unavailable.


criteria:
  - id: P-SHADCN-DROPDOWN-MENU-TRIGGER-UPSTREAM-IDENTITY
    text:
      zh-CN: Trigger 必须沿用固定 Dropdown Menu revision/path 并明确其非官方 Proto UI projection 身份。
      en: Trigger must use the pinned Dropdown Menu revision and path and identify its unofficial Proto UI projection status.
  - id: P-SHADCN-DROPDOWN-MENU-TRIGGER-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-dropdown-trigger` 必须继承 `P-BASE-DROPDOWN-MENU-TRIGGER` 并调用 `asDropdownTrigger()`；任何负向补丁必须显式声明。'
      en: '`shadcn-dropdown-trigger` must inherit `P-BASE-DROPDOWN-MENU-TRIGGER` and call `asDropdownTrigger()`; any negative patch must be declared explicitly.'
    references:
      prototypes:
        - id: P-BASE-DROPDOWN-MENU-TRIGGER
          anchors:
            [
              P-BASE-DROPDOWN-MENU-TRIGGER-AUTHORING-ENTRIES,
              P-BASE-DROPDOWN-MENU-TRIGGER-COMMAND,
              P-BASE-DROPDOWN-MENU-TRIGGER-REQUEST,
            ]
  - id: P-SHADCN-DROPDOWN-MENU-TRIGGER-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不反转 inherited command、a11y、request 或 disabled guarantee；新增 props、renderer 与 rules 是扩展增量。
      en: The current implementation reverses no inherited command, accessibility, request, or disabled guarantee; added props, renderer, and rules are extension deltas.
  - id: P-SHADCN-DROPDOWN-MENU-TRIGGER-DIRECT-ENTRY
    text:
      zh-CN: 当前 Trigger protocol 以 `shadcn-dropdown-trigger` direct prototype 公开。
      en: The current Trigger protocol is exposed as the `shadcn-dropdown-trigger` direct prototype.
  - id: P-SHADCN-DROPDOWN-MENU-TRIGGER-INDICATOR-EXTENSION
    text:
      zh-CN: indicator 默认 false；启用后必须保留 slot content 并按受限 icon enum、正数 size 与 strokeWidth 渲染内置 SVG，非法数值回退到 16 与 2。
      en: Indicator defaults to false; when enabled it must preserve slot content and render built-in SVG from the bounded icon enum and positive size and strokeWidth values, with invalid numbers falling back to 16 and 2.
  - id: P-SHADCN-DROPDOWN-MENU-TRIGGER-CURRENT-VISUAL-SURFACE
    text:
      zh-CN: Trigger 必须提供当前 button-like alignment、spacing、border、background、typography、shadow、transition 与 outline tokens。
      en: Trigger must provide the current button-like alignment, spacing, border, background, typography, shadow, transition, and outline tokens.
  - id: P-SHADCN-DROPDOWN-MENU-TRIGGER-STATE-DRIVEN-STYLES
    text:
      zh-CN: hover、focus-visible、pressed 与 disabled visuals 必须从 inherited state 派生。
      en: Hover, focus-visible, pressed, and disabled visuals must derive from inherited state.
  - id: P-SHADCN-DROPDOWN-MENU-TRIGGER-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前行为、surface 与明确的 indicator extension 之外的差异集中在唯一 compatibility open question。
      en: Differences beyond current behavior, surface, and the explicit indicator extension are centralized in one compatibility open question.
  - id: P-SHADCN-DROPDOWN-MENU-TRIGGER-AS-CHILD-OMISSION
    text:
      zh-CN: upstream Trigger props 中的 `asChild` 依共享决策有意省略。
      en: The `asChild` member of upstream Trigger props is intentionally omitted under the shared decision.
    dependsOn:
      decisions: [D-AS-CHILD-OMISSION-0001]
openQuestions:
  - id: P-SHADCN-DROPDOWN-MENU-TRIGGER-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: Trigger 的额外 button surface、indicator extension 与 upstream forwarding 应如何长期定位？
      en: How should Trigger's extra button surface, indicator extension, and upstream forwarding be positioned long term?
    context:
      zh-CN: >-
        intentional deviations 是省略 `asChild`，以及 indicator 明确作为 Proto UI extension。upstream Trigger 仅添加 data-slot 并转发 props，不提供默认视觉或 indicator；当前 className/native forwarding、data-slot、exact tokens 与是否保留 button-like 默认 surface 均待评审。


      en: >-
        Intentional deviations are omission of `asChild` and the indicator as an explicit Proto UI extension. Upstream Trigger only adds data-slot and forwards props, with no default visual or indicator; current className and native forwarding, data-slot, exact tokens, and whether the button-like default remains are pending review.


    blocks: [shadcn dropdown trigger parity roadmap]

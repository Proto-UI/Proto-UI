id: P-SHADCN-SLIDER-FIELD-THUMB
type: prototype
title: Shadcn Field-bound Slider Thumb projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    en: Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native evidence and independent review; source presence is not conformance or release admission.
summary: Field-bound scalar Slider Thumb retaining the optional Field policy owner.
statement:
    en: The Prototype invokes asSliderFieldThumb() once, preserving the scalar Thumb facts plus the optional Field binding, invalid and disabled policy. It borrows the same profile Thumb paint as the ordinary Thumb; no additional Field, value or focus owner is installed.
criteria:
  - id: P-SHADCN-SLIDER-FIELD-THUMB-BASE
    text:
            en: Invoke asSliderFieldThumb() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias or Base.setup call.
  - id: P-SHADCN-SLIDER-FIELD-THUMB-VISUAL
    text:
            en: Shares the scalar Thumb passive owned decoration with profile-specific shapes; Field-invalid and disabled facts derive only from the borrowed Field binding.
  - id: P-SHADCN-SLIDER-FIELD-THUMB-CLOSURE
    text:
            en: All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, raw host escape or Adapter component-name dispatch may supply default intent.
  - id: P-SHADCN-SLIDER-FIELD-THUMB-BOUNDARY
    text:
            en: Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; catalog presence is a draft relation, not acceptance.

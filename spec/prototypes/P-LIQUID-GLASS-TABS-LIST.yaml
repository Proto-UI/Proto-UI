id: P-LIQUID-GLASS-TABS-LIST
type: prototype
title: Liquid Glass Tabs list directly projects the Base Tabs protocol
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Draft extension inherits the existing draft Base Tabs definition; exact-commit native interaction/paint, generated preset and packed-consumer resource proof, and independent admission remain incomplete. Cataloging does not promote Base or family guarantees.
summary: Direct Liquid Glass list with inherited Base ownership and a separately bounded family appearance.
statement:
  en: The List is the Base trigger collection and roving-focus host, not a selected-value owner. Consume asTabsList once. Preserve orientation-aware arrows, Home/End, loop, disabled-member exclusion, focus methods, a11yLabel and same-domain tablist relationships. Appearance must not install a second keyboard or collection owner.
criteria:
  - id: P-LIQUID-GLASS-TABS-LIST-BASE-INHERITANCE
    text:
      en: The List is the Base trigger collection and roving-focus host, not a selected-value owner. Consume asTabsList once. Preserve orientation-aware arrows, Home/End, loop, disabled-member exclusion, focus methods, a11yLabel and same-domain tablist relationships. Appearance must not install a second keyboard or collection owner.
  - id: P-LIQUID-GLASS-TABS-LIST-DIRECT-ENTRY
    text:
      en: Expose the independently defined liquid-glass-tabs-list prototype and typed tabsList export through @proto.ui/prototypes-liquid-glass/tabs. This is a private source-only entry; registry publication or unsupported Compiler/non-Web admission must not be inferred.
  - id: P-LIQUID-GLASS-TABS-LIST-VISUAL-DEFAULT
    text:
      en: With appearance=default, provide an independently authored rounded segmented surface with restrained border, padded label spacing and readable theme foreground. Optical material uses the shared material protocol with an opaque style fallback; underline appearance withdraws the material contribution. Do not claim an official Apple component or optical realization without host evidence.
  - id: P-LIQUID-GLASS-TABS-LIST-APPEARANCE
    text:
      en: 'Accept appearance=default|underline with default as the omission behavior. Default preserves the family surface. Underline is a horizontal Runtime consumer opt-in: full-width transparent, borderless, non-wrapping text row, 24px label gap and horizontal overflow on narrow hosts. It must retain Base roving, orientation and naming semantics; it is not a claim of upstream line-variant or vertical visual parity. Each change withdraws the previous appearance contribution and restores the default surface when reversed.'
openQuestions:
  - id: P-LIQUID-GLASS-TABS-LIST-Q-ADMISSION
    question:
      en: When do exact-source native interaction and same-state screenshots, generated/published-resource closure and independent review support admission?
    blocks:
      - activation:P-LIQUID-GLASS-TABS-LIST

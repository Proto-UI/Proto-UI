id: P-BASE-ACCORDION-CONTENT
type: prototype
title: Base Accordion content
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: 'Finf #872 的 draft 实现方向。稳定准入需要独立审查及当前浏览器/native、材质与 GPUI 证据；synthetic DOM 通过不等于九维完成。'
  en: 'Draft implementation direction for Finf #872. Stable admission requires independent review and current browser/native, material and GPUI evidence; synthetic DOM success is not nine-dimension completion.'
summary: Independent Accordion content protocol with JSON ownership and exact Anatomy boundaries.
statement:
  zh-CN: 独立编写的 Proto UI 协议。APG及风格库提供比较证据，不是实现授权或继承API。复用 Collection、Anatomy、Context、A11y、asTrigger、asFocusable及L1 lifecycle。
  en: An independently authored Proto UI protocol. APG and design libraries provide comparison evidence, not implementation authority or inherited APIs. Shared capabilities are Collection, Anatomy, Context, A11y, asTrigger, asFocusable and L1 lifecycle.
criteria:
  - id: P-BASE-ACCORDION-CONTENT-PRESENCE
    text:
      zh-CN: Content 派生 open/hidden 及仅 callback 内的 desired presence=keepMounted || open。默认 L1 detach 保留逻辑实例，不承诺宿主子节点/native状态；keepMounted 保留完整隐藏 view。不新增transition计时、延迟关闭语义、focus entry或focus return；消费者动画不得成为第二个canonical open owner。
      en: Content derives open/hidden and callback-only desired presence keepMounted || open. Default L1 detach preserves the logical instance, not host children or native state; keepMounted retains the complete hidden view. No transition timer, delayed-close semantics, focus entry or focus return is added. Consumer-authored transitions must not create a second canonical open owner.
  - id: P-BASE-ACCORDION-CONTENT-RELATIONSHIP
    text:
      zh-CN: Content 声明 item 域 panel identity 及 labelledBy Trigger。region 默认 false，true 显式启用 region landmark，作者需避免过多地标。detach/reopen 的identity reservation及IDREF撤销/恢复服从既有 A11y relationship service。
      en: Content declares item-scoped panel identity and labelledBy its Trigger. region defaults false and true opts into a region landmark. Author chooses it to avoid landmark proliferation. Identity reservation and IDREF withdrawal/restore follow the existing A11y relationship service through detach/reopen.

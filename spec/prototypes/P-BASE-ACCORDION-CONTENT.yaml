  - path: packages/prototypes/base/src/accordion/types.ts
  - path: packages/prototypes/base/src/accordion/shared.ts
  - path: https://www.w3.org/WAI/ARIA/apg/patterns/accordion/
openQuestions:
  - id: P-BASE-ACCORDION-CONTENT-Q-ADMISSION
    question:
      zh-CN: 何时完成精确head的浏览器/native、辅助技术、GPUI及独立审查并准入此draft？
      en: When have exact-head browser/native, assistive-technology, GPUI and independent review evidence admitted this draft?
    blocks:
      - activation:P-BASE-ACCORDION-CONTENT
revisions:

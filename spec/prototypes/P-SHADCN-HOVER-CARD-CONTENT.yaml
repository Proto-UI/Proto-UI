id: P-SHADCN-HOVER-CARD-CONTENT
type: prototype
title: Shadcn Hover Card Content inherits Base overlay behavior and adds the current animated surface
status: draft
since: 0.2.0-rc.0
summary: Shadcn Hover Card Content inherits Base non-modal overlay, hover bridge, presence, positioning, and transition behavior and adds the current popover surface and open or side animation rules.
statement:
  zh-CN: >-
    Shadcn Hover Card Content 是 `P-BASE-HOVER-CARD-CONTENT` 之上的 direct anatomy part，保留 non-modal overlay、hover bridge、presence、portal、position/collision 与 Transition 行为，并将 enter/leave duration 配置为 200ms，增加当前 popover surface 及 open/closed、side-driven animation tokens。比较基线固定到同一 Shadcn Hover Card 文件；`asChild` 明确不提供。


  en: >-
    Shadcn Hover Card Content is a direct anatomy part over `P-BASE-HOVER-CARD-CONTENT`. It retains non-modal overlay, hover bridge, presence, portal, position and collision, and Transition behavior, configures enter and leave duration to 200ms, and adds the current popover surface plus open, closed, and side-driven animation tokens. Its comparison baseline is the same pinned Shadcn Hover Card file; `asChild` is explicitly unavailable.


criteria:
  - id: P-SHADCN-HOVER-CARD-CONTENT-UPSTREAM-IDENTITY
    text:
      zh-CN: Content 必须沿用固定 Hover Card revision/path，并明确为非官方 Proto UI anatomy projection。
      en: Content must use the pinned Hover Card revision and path and identify itself as an unofficial Proto UI anatomy projection.
  - id: P-SHADCN-HOVER-CARD-CONTENT-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-hover-card-content` 必须继承 `P-BASE-HOVER-CARD-CONTENT` 并调用 `asHoverCardContent()`；任何 setup-only 负向补丁必须显式声明。'
      en: '`shadcn-hover-card-content` must inherit `P-BASE-HOVER-CARD-CONTENT` and call `asHoverCardContent()`; any setup-only negative patch must be declared explicitly.'
    references:
      prototypes:
        - id: P-BASE-HOVER-CARD-CONTENT
          anchors:
            [
              P-BASE-HOVER-CARD-CONTENT-AUTHORING-ENTRIES,
              P-BASE-HOVER-CARD-CONTENT-OVERLAY,
              P-BASE-HOVER-CARD-CONTENT-POSITION,
              P-BASE-HOVER-CARD-CONTENT-PORTAL,
            ]
  - id: P-SHADCN-HOVER-CARD-CONTENT-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不反转 inherited overlay、presence、hover bridge、position、collision、portal 或 transition guarantee；200ms transition 配置与 style rules 是具体化增量。
      en: The current implementation reverses no inherited overlay, presence, hover-bridge, position, collision, portal, or transition guarantee; the 200ms transition configuration and style rules are specialization deltas.
  - id: P-SHADCN-HOVER-CARD-CONTENT-DIRECT-ENTRY
    text:
      zh-CN: 当前 Content protocol 以 `shadcn-hover-card-content` direct prototype 公开。
      en: The current Content protocol is exposed as the `shadcn-hover-card-content` direct prototype.
  - id: P-SHADCN-HOVER-CARD-CONTENT-TRANSITION
    text:
      zh-CN: Content 必须通过 inherited `asTransition` handle 将 enterDuration 与 leaveDuration 配置为 200ms；presence lifecycle 继续以 Transition protocol 为真理来源。
      en: Content must configure enterDuration and leaveDuration to 200ms through the inherited `asTransition` handle; the presence lifecycle remains sourced from the Transition protocol.
  - id: P-SHADCN-HOVER-CARD-CONTENT-CURRENT-VISUAL-SURFACE
    text:
      zh-CN: Content 必须提供当前 `z-50 w-64 rounded-md border border-border bg-popover p-4 text-sm text-popover-foreground shadow-md outline-none transition-none duration-200` surface；边框颜色必须由 Prototype 的 `border-border` intent 与生成的 token rule 得到，不得借用文档站 document-wide border default。
      en: Content must provide the current `z-50 w-64 rounded-md border border-border bg-popover p-4 text-sm text-popover-foreground shadow-md outline-none transition-none duration-200` surface. Its border color must come from Prototype-owned `border-border` intent and the generated token rule rather than a documentation-site document-wide border default.
    dependsOn:
      contracts:
        - id: C-PROTOTYPE-STYLE-CLOSURE-0001
          since: 0.3.0-alpha.0
        - C-RULE-INTENT-FEEDBACK-STYLE-0001
  - id: P-SHADCN-HOVER-CARD-CONTENT-OPEN-AND-SIDE-STYLES
    text:
      zh-CN: enter/leave fade、zoom 与四向 slide rules 必须从 inherited open state 与 side prop 派生，不得另建 presence 或 placement truth。
      en: Enter and leave fade, zoom, and four-direction slide rules must derive from inherited open state and side prop and must not establish separate presence or placement truth.
  - id: P-SHADCN-HOVER-CARD-CONTENT-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前实体只声明已测试的 overlay/transition/position behavior 与 surface；全部 upstream 差异集中在唯一 compatibility open question。
      en: This entity claims only tested overlay, transition, positioning behavior, and surface; all upstream differences are centralized in one compatibility open question.
  - id: P-SHADCN-HOVER-CARD-CONTENT-AS-CHILD-OMISSION
    text:
      zh-CN: upstream Content props 中的 `asChild` 依共享决策有意省略。
      en: The `asChild` member of upstream Content props is intentionally omitted under the shared decision.
    dependsOn:
      decisions: [D-AS-CHILD-OMISSION-0001]
openQuestions:
  - id: P-SHADCN-HOVER-CARD-CONTENT-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: Content 的 Portal、position API、motion 与 exact token parity 应如何收敛？
      en: How should Content Portal, positioning API, motion, and exact token parity converge?
    context:
      zh-CN: >-
        intentional deviation 是省略 `asChild`。待实现或待评审项包括 upstream 固定 Portal wrapper/data-slot、className/native prop forwarding、默认 align=center 与 sideOffset=4、transform-origin token、outline-hidden，以及 Radix data-state/data-side 相对 Proto state/prop rules 的映射。当前额外 text-sm、transition-none、duration-200 与 Transition setup duration 的职责、motion-reduction 继承保证及精确动画时序也需继续核对。


      en: >-
        The intentional deviation is omission of `asChild`. Implementation or review gaps include the upstream fixed Portal wrapper and data-slot, className and native prop forwarding, default align=center and sideOffset=4, transform-origin token, outline-hidden, and mapping Radix data-state and data-side to Proto state and prop rules. The responsibility of the current extra text-sm, transition-none, duration-200, and Transition setup duration, inherited motion-reduction guarantees, and exact animation timing also require review.


    blocks: [shadcn hover card content parity roadmap]

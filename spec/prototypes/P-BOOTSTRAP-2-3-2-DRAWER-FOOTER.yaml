id: P-BOOTSTRAP-2-3-2-DRAWER-FOOTER
type: prototype
title: Bootstrap 2.3.2 Drawer Footer projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    en: Draft catalog relation for an implemented family projection against the pinned Bootstrap 2.3.2 vocabulary. Stable admission requires real consumers, browser/native evidence and independent review; source presence and private package availability are not release or conformance admission.
summary: Passive owner-scoped footer slot with exact text-right alignment.
statement:
    en: The Prototype invokes asDrawerFooter() once and preserves children and the Drawer footer role. It applies exact text-right alignment; sibling .btn + .btn margins and button-group exceptions are not imposed on arbitrary slot children.
criteria:
  - id: P-BOOTSTRAP-2-3-2-DRAWER-FOOTER-BASE
    text:
            en: Invoke asDrawerFooter() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias, jQuery/plugin API or Base.setup call.
  - id: P-BOOTSTRAP-2-3-2-DRAWER-FOOTER-VISUAL
    text:
            en: Exact text-right alignment per the pinned modal-footer grammar; no fabricated flex or gap spacing and no interaction owner.
  - id: P-BOOTSTRAP-2-3-2-DRAWER-FOOTER-CLOSURE
    text:
            en: All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, Glyphicons, upstream JavaScript or Adapter component-name dispatch may supply default intent.
  - id: P-BOOTSTRAP-2-3-2-DRAWER-FOOTER-BOUNDARY
    text:
            en: Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; the package is private and source-only. Catalog presence is a draft relation, not acceptance.

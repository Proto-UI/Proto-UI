id: P-LIQUID-GLASS-SELECT-CONTENT
type: prototype
title: Liquid Glass Select Content directly projects Base selection semantics
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Draft pending exact-source native browser and GPUI evidence, optical host proof where applicable, independent review and stable admission.
  zh-CN: 等待精确源码 native browser/GPUI 证据、适用的光学 host 绘制验证、独立审查与稳定准入，保留 draft。
summary: Liquid Glass presentation of the independent Base Select Content protocol.
statement:
  en: 'Directly consume asSelectContent exactly once, retaining all Base Content props, exposes, requests, anatomy and lifetimes. No other family or Button protocol may own Select semantics.'
  zh-CN: '直接且仅消费一次 asSelectContent，保留完整 Base Content props、exposes、请求、anatomy 与生命周期；不得由其他体系或 Button 协议持有 Select 语义。'
criteria:
  - id: P-LIQUID-GLASS-SELECT-CONTENT-BASE-INHERITANCE
    text:
      en: 'Directly consume asSelectContent exactly once, retaining all Base Content props, exposes, requests, anatomy and lifetimes. No other family or Button protocol may own Select semantics.'
      zh-CN: '直接且仅消费一次 asSelectContent，保留完整 Base Content props、exposes、请求、anatomy 与生命周期；不得由其他体系或 Button 协议持有 Select 语义。'
  - id: P-LIQUID-GLASS-SELECT-CONTENT-DIRECT-ENTRY
    text:
      en: 'Expose liquid-glass-select-content and typed public source exports through @proto.ui/prototypes-liquid-glass/select; private workspace source requires explicit workspace CLI generation and is not a registry publication.'
      zh-CN: '通过 @proto.ui/prototypes-liquid-glass/select 提供 liquid-glass-select-content 与完整类型；private workspace 源码只允许显式 workspace CLI 生成，不代表 registry 已发布。'
  - id: P-LIQUID-GLASS-SELECT-CONTENT-VISUAL-SAFETY
    text:
      en: "Use shrinkable logical layout and readable wrapping labels. Content is the nonmaterial portal/lifetime/frame, Surface solely owns popup paint and complete opaque fallback, and Viewport is the one scrollport. Preserve Base focus, disabled state, anchor/available bounds and item text identity without fixed content height or physical text alignment."
      zh-CN: "使用可收缩逻辑布局和可读换行标签。Content 仅为无材质 portal/lifetime/frame，Surface 独占 popup 绘制与完整不透明 fallback，Viewport 是唯一 scrollport。保留 Base focus、disabled、anchor/available 边界和 ItemText 身份，不引入固定内容高度或物理文字对齐。"
  - id: "P-LIQUID-GLASS-SELECT-CONTENT-PORTAL-FRAME"
    text:
      en: "Content preserves asSelectContent portal, collision, focus, dismissal and zero-duration presence, but declares no material slot, candidate, opaque fallback or popup chrome. Surface is the sole popup paint/material owner and Viewport alone scrolls; no inactive competing Content slot remains. Intent and synthetic-DOM cases do not prove optical paint or native positioning."
      zh-CN: "Content 保留 asSelectContent portal、collision、focus、dismissal 与零时长 presence，但不声明 material slot、candidate、不透明 fallback 或 popup chrome。Surface 独占 popup 绘制/材质，Viewport 唯一负责滚动；Content 不保留竞争性的 inactive slot。意图及 synthetic DOM 测试不证明光学绘制或原生定位。"
openQuestions:
  - id: P-LIQUID-GLASS-SELECT-CONTENT-Q-ADMISSION
    question:
      en: When do exact-source native interaction/paint evidence and independent review justify stable admission?
      zh-CN: 何时由精确源码原生交互/绘制证据和独立审查支持稳定准入？
    blocks: [activation:P-LIQUID-GLASS-SELECT-CONTENT]

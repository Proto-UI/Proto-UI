openQuestions:
  - id: P-BASE-SLIDER-VALUES-Q-IMPLEMENTATION
    question: When do a governed collection State, compatible typed API and single Field binding permit implementation and independent Runtime/native/Compiler verification?
    blocks: [activation:P-BASE-SLIDER-VALUES]

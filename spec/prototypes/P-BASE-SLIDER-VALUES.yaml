id: P-BASE-SLIDER-VALUES
type: prototype
title: Base Slider Values additive owner and indexed-keyboard draft
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: New reconstruction in progress using an independently rebuilt number-list prerequisite. Only fresh exact-source checks may admit the bounded owner/keyboard slice. Pointer session association, grouped Field, visual families, native input and Compiler translation remain unimplemented.
summary: Six static Values entries preserve the old scalar family while exposing a sole unwrapped owner and derived indexed display.
statement:
  en: The additive SLIDER_VALUES_FAMILY uses Root as sole current-value and logical completion owner. Thumb instances select sorted display slots without owning values. Track is structural until public input-origin association is available. Parts and hooks share the same definitions; no generator or host-specific component branch is allowed.
criteria:
  - id: P-BASE-SLIDER-VALUES-ANATOMY
    text: A new static family has one Root, optional one structural Track, zero or more Thumbs and Indicators, optional Label and Value. It does not loosen or inherit the existing scalar family cardinality. Each editable value slot requires exactly one live Thumb. Explicit integer indices or public Anatomy order select sorted slots; indices are not host-node keys. Duplicate, missing or out-of-range mappings reject indexed edits and disable unmapped composition until repaired. [] means zero editable slots, with no manufactured Thumb. Membership/index changes invalidate the old logical session.
  - id: P-BASE-SLIDER-VALUES-ROOT
    text: The real number-list current slot stores only unwrapped owner data. Scalar/array shape, readiness, effective policy, phase, revision and logical proposal state are separately declared facts. Creation/reset and session/proposal lists are history, not display owners. Resolved Props get/watchAll is the only input path. Non-null resolved value selects fixed controlled mode, including legal hook defaults. Omitted defaultValue initializes from resolved min. Public getValue and getDisplayValue name raw-owner and display reads explicitly. Scalar and whole-array methods are shape-specific; indexed edits require a complete mapping. Existing scalar callbacks/exports remain unchanged; the new same-named events have union-valued payloads and need actual type evidence.
  - id: P-BASE-SLIDER-VALUES-TRACK
    text: Values Track renders a structural slot only in this A/B slice. It does not install AxisInput, independently recognize Thumb pointer events, seek, capture or claim pointer parity. Future pointer implementation needs public origin/session association and one Track capture owner, plus Track seek versus off-center Thumb no-jump semantics and retirement/cancel evidence. Missing capability is explicit rather than emulated with DOM events, closure flags or component-special Compiler cases.
  - id: P-BASE-SLIDER-VALUES-THUMB
    text: Each Thumb derives finite scalar value/percentage, root ARIA min/max, local name/value text and disabled/readOnly from its selected Root display slot. Ordinary Tab reaches every enabled Thumb; readOnly may remain focused. Keyboard routes through Root and completes a changed uncanceled proposal without requiring controlled owner echo. Retained nodes can be reindexed or moved between Roots; they must route to the current live owner. Public Anatomy retirement may guard invalidated callbacks, but a live required-context error cannot be swallowed. Values has no pointer pressed/hover-to-origin surrogate. Root inherits Field policy only; grouped Field control ownership remains missing.
  - id: P-BASE-SLIDER-VALUES-PROJECTION
    text: Indicator startPercentage/endPercentage/extent and Value text derive from current display. Multiple Indicators may select ordered start/end slot indices. Orientation, direction and policy are Root projections; family styling and native geometry remain separate. Matching Values parts and hooks compose only with Values Root. Ordinary source-only CLI registry metadata may map these static entries; no generator special case is permitted.
  - id: P-BASE-SLIDER-VALUES-NO-ADMISSION
    text: Fresh bounded owner/keyboard tests do not mark Range, Multiple Thumbs, any visual family, native host or Compiler complete. Historical pure-model and lost local R4 checks are not current evidence. New candidate scope, prerequisites, known failures and exact tree must be independently reverified.

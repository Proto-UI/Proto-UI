id: P-BOOTSTRAP-2-3-2-SWITCH
type: prototype
title: bootstrap-2-3-2 switch root over Base
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: Draft all-Base coverage increment. Source/unit availability is not release, browser paint, Compiler or native conformance admission.
summary: A genuine asSwitchRoot projection; Base retains switch semantics and this part contributes only appearance.
statement:
  en: The authored Prototype invokes asSwitchRoot once. Design-language extension, not an original Bootstrap 2.3.2 component. A 44 by 24px inset track with 4px corners uses the archived palette; root alignment changes with checked, without a second state owner.
criteria:
  - id: P-BOOTSTRAP-2-3-2-SWITCH-BASE
    text:
      en: Invoke asSwitchRoot once and retain every inherited state, event, focus, editing, context and anatomy owner; never copy the semantic implementation or introduce a competing value owner.
  - id: P-BOOTSTRAP-2-3-2-SWITCH-API
    text:
      en: The root owns checked, checkedChange, controlled or uncontrolled ownership, disabled suppression, focus and the inherited Switch anatomy domain.
  - id: P-BOOTSTRAP-2-3-2-SWITCH-VISUAL
    text:
      en: Design-language extension, not an original Bootstrap 2.3.2 component. A 44 by 24px inset track with 4px corners uses the archived palette; root alignment changes with checked, without a second state owner.
  - id: P-BOOTSTRAP-2-3-2-SWITCH-CLOSURE
    text:
      en: All component appearance is declared by Prototype feedback and Rules and closes through the source-derived finite physical token renderer. No website-only component CSS may supply missing default intent.
  - id: P-BOOTSTRAP-2-3-2-SWITCH-BOUNDARY
    text:
      en: The package is private and unreleased. Documentation and demos expose the real parts. Actual four-Web browser rendering, general Compiler and GPUI/Flutter/Qt conformance need separate collected evidence; source availability alone is insufficient.

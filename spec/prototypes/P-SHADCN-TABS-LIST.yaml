id: P-SHADCN-TABS-LIST
type: prototype
title: Shadcn Tabs List inherits Base Tabs List and projects the pinned v4 default surface
status: draft
since: 0.2.0-rc.0
summary: Shadcn Tabs List inherits Base collection, roving-focus, orientation, and accessibility behavior and reproduces the pinned v4 default horizontal list surface.
statement:
  zh-CN: >-
    Shadcn Tabs List 是 `P-BASE-TABS-LIST` 之上的 direct anatomy part，保留同域 collection、roving focus、keyboard navigation、orientation 与 tablist a11y，并按固定 v4 baseline 投射 default variant 的 horizontal list surface，包括明确的 fit-content width。`line` variant 与 vertical 方向感知样式尚未进入 passing API；`asChild` 明确不提供。


  en: >-
    Shadcn Tabs List is a direct anatomy part over `P-BASE-TABS-LIST`. It retains same-domain collection, roving focus, keyboard navigation, orientation, and tablist accessibility while projecting the pinned v4 default-variant horizontal list surface, including an explicit fit-content width. The `line` variant and vertical orientation-aware styles are not yet part of the passing API; `asChild` is explicitly unavailable.


criteria:
  - id: P-SHADCN-TABS-LIST-UPSTREAM-IDENTITY
    text:
      zh-CN: List 必须沿用固定 Shadcn Tabs revision/path，并明确为 Proto UI 治理的非官方 anatomy projection。
      en: List must use the pinned Shadcn Tabs revision and path and identify itself as an unofficial Proto UI-governed anatomy projection.
  - id: P-SHADCN-TABS-LIST-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-tabs-list` 必须继承 `P-BASE-TABS-LIST` 并调用 `asTabsList()`；任何 setup-only 负向补丁必须显式声明。'
      en: '`shadcn-tabs-list` must inherit `P-BASE-TABS-LIST` and call `asTabsList()`; any setup-only negative patch must be declared explicitly.'
    references:
      prototypes:
        - id: P-BASE-TABS-LIST
          anchors:
            [
              P-BASE-TABS-LIST-AUTHORING-ENTRIES,
              P-BASE-TABS-LIST-ROLE-COLLECTION,
              P-BASE-TABS-LIST-FOCUS-ROVING,
            ]
  - id: P-SHADCN-TABS-LIST-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不反转 inherited collection、context、focus、keyboard 或 a11y guarantee；新增 tokens 仅构成视觉增量。
      en: The current implementation reverses no inherited collection, context, focus, keyboard, or accessibility guarantee; added tokens are visual deltas only.
  - id: P-SHADCN-TABS-LIST-DIRECT-ENTRY
    text:
      zh-CN: 当前 List protocol 以 `shadcn-tabs-list` direct prototype 公开。
      en: The current List protocol is exposed as the `shadcn-tabs-list` direct prototype.
  - id: P-SHADCN-TABS-LIST-CURRENT-VISUAL-SURFACE
    text:
      zh-CN: 默认 horizontal/default-variant List 必须按固定 v4 baseline 提供 `inline-flex h-9 w-fit items-center justify-center rounded-lg bg-muted p-[3px] text-muted-foreground`；不得附加旧有 border、shadow、rounded-xl 或 muted opacity，也不得据此宣称 line/vertical parity。
      en: The default horizontal, default-variant List must provide `inline-flex h-9 w-fit items-center justify-center rounded-lg bg-muted p-[3px] text-muted-foreground` from the pinned v4 baseline; it must not retain the former border, shadow, rounded-xl, or muted-opacity additions, and this does not claim line or vertical parity.
  - id: P-SHADCN-TABS-LIST-COMPATIBILITY-SUBSET
    text:
      zh-CN: 已测试的 Base behavior 与当前 surface 之外，所有差异必须集中在唯一 compatibility open question。
      en: Beyond tested Base behavior and the current surface, all differences must be centralized in one compatibility open question.
  - id: P-SHADCN-TABS-LIST-AS-CHILD-OMISSION
    text:
      zh-CN: upstream List props 中的 `asChild` 依共享决策有意省略。
      en: The `asChild` member of upstream List props is intentionally omitted under the shared decision.
    dependsOn:
      decisions: [D-AS-CHILD-OMISSION-0001]
  - id: P-SHADCN-TABS-LIST-APPEARANCE
    text:
      en: 'Accept appearance=default|underline with default as the omission behavior. Default preserves the family surface. Underline is a horizontal Runtime consumer opt-in: full-width transparent, borderless, non-wrapping text row, 24px label gap and horizontal overflow on narrow hosts. It must retain Base roving, orientation and naming semantics; it is not a claim of upstream line-variant or vertical visual parity. Each change withdraws the previous appearance contribution and restores the default surface when reversed.'

openQuestions:
  - id: P-SHADCN-TABS-LIST-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: List 的 variant、orientation 与 token parity 应如何收敛？
      en: How should List variant, orientation, and token parity converge?
    context:
      zh-CN: >-
        intentional deviation 是省略 `asChild`。默认 horizontal/default-variant surface 已对齐固定 v4 baseline。upstream 仍公开 `variant: default | line`，并使用 Root orientation group 调整 vertical height 与 flex direction；当前 API 没有 variant，data-slot/data-variant 与 vertical `h-fit flex-col` 仍是待实现或待评审 gap。


      en: >-
        The intentional deviation is omission of `asChild`. The default horizontal, default-variant surface now matches the pinned v4 baseline. Upstream still exposes `variant: default | line` and uses the Root orientation group for vertical height and flex direction; the current API has no variant, while data-slot, data-variant, and vertical `h-fit flex-col` remain implementation or review gaps.


    blocks: [shadcn tabs list parity roadmap]

id: P-SHADCN-TABS-LIST
type: prototype
title: Shadcn Tabs List inherits Base Tabs List and projects the source-bound
  text/default surface
status: draft
since: 0.2.0-rc.0
summary: Inherits Base behavior and projects the bounded text-only default
  surface for New York v4, Nova and Rhea through shared style scope.
statement:
  en: This draft projects only the text-only default surface of fixed upstream
    3d98900e9b73c45f035f8109e9d41ba6a51685e7 for New York v4, Nova and Rhea,
    preserving Base ownership and shared style-scope precedence. Both
    orientations and light/dark interaction paint are covered where relevant to
    this part. It is not complete Tabs or all-style parity. Existing Proto
    underline remains a separate compatibility appearance, never an alias for
    upstream line.
criteria:
  - id: P-SHADCN-TABS-LIST-UPSTREAM-IDENTITY
    text:
      zh-CN: List 必须沿用固定 Shadcn Tabs revision/path，并明确为 Proto UI 治理的非官方 anatomy
        projection。
      en: List must use the pinned Shadcn Tabs revision and path and identify itself
        as an unofficial Proto UI-governed anatomy projection.
  - id: P-SHADCN-TABS-LIST-BASE-INHERITANCE
    text:
      zh-CN: "`shadcn-tabs-list` 必须继承 `P-BASE-TABS-LIST` 并调用 `asTabsList()`；任何
        setup-only 负向补丁必须显式声明。"
      en: "`shadcn-tabs-list` must inherit `P-BASE-TABS-LIST` and call `asTabsList()`;
        any setup-only negative patch must be declared explicitly."
    references:
      prototypes:
        - id: P-BASE-TABS-LIST
          anchors:
            - P-BASE-TABS-LIST-AUTHORING-ENTRIES
            - P-BASE-TABS-LIST-ROLE-COLLECTION
            - P-BASE-TABS-LIST-FOCUS-ROVING
  - id: P-SHADCN-TABS-LIST-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不反转 inherited collection、context、focus、keyboard 或 a11y guarantee；新增
        tokens 仅构成视觉增量。
      en: The current implementation reverses no inherited collection, context, focus,
        keyboard, or accessibility guarantee; added tokens are visual deltas
        only.
  - id: P-SHADCN-TABS-LIST-DIRECT-ENTRY
    text:
      zh-CN: 当前 List protocol 以 `shadcn-tabs-list` direct prototype 公开。
      en: The current List protocol is exposed as the `shadcn-tabs-list` direct
        prototype.
  - id: P-SHADCN-TABS-LIST-CURRENT-VISUAL-SURFACE
    text:
      en: "The source-bound text/default surface is described by the dedicated Tabs
        coverage inventory: New York compatibility dimensions plus Nova/Rhea
        recipes, Base-derived horizontal/vertical layout, and existing
        feedback.style semantic merging. Only the declared bounded surface is
        projected; it does not imply line, SVG, arbitrary native props, or
        other-style support."
  - id: P-SHADCN-TABS-LIST-COMPATIBILITY-SUBSET
    text:
      zh-CN: 已测试的 Base behavior 与当前 surface 之外，所有差异必须集中在唯一 compatibility open
        question。
      en: Beyond tested Base behavior and the current surface, all differences must be
        centralized in one compatibility open question.
  - id: P-SHADCN-TABS-LIST-AS-CHILD-OMISSION
    text:
      zh-CN: upstream List props 中的 `asChild` 依共享决策有意省略。
      en: The `asChild` member of upstream List props is intentionally omitted under
        the shared decision.
    dependsOn:
      decisions:
        - D-AS-CHILD-OMISSION-0001
  - id: P-SHADCN-TABS-LIST-APPEARANCE
    text:
      en: "Accept appearance=default|underline with default as the omission behavior.
        Default preserves the family surface. Underline is a horizontal Runtime
        consumer opt-in: full-width transparent, borderless, non-wrapping text
        row, 24px label gap and horizontal overflow on narrow hosts. It must
        retain Base roving, orientation and naming semantics; it is not a claim
        of upstream line-variant or vertical visual parity. Each change
        withdraws the previous appearance contribution and restores the default
        surface when reversed."
  - id: P-SHADCN-TABS-LIST-STYLE-SCOPE
    text:
      en: "Shared style selection preserves the actual Base owner, value, focus, handles and caller nodes while switching among New York and the eight modern profiles. Explicit leaf selection overrides scope; absence preserves the component compatibility default. Unknown profiles fail closed rather than borrowing another recipe."
  - id: P-SHADCN-TABS-LIST-SOURCE-BOUND-TEXT-DEFAULT
    text:
      en: "The fixed inventory is eight modern styles (vega, nova, maia, lyra, mira, luma, sera, rhea) plus independent New York. Each has source-distinct default and line paint; List variant changes update an owned decorative line without replacing Trigger leaves, caller content, Base selection or focus. Content and the optional semantic-only Indicator gain no selection owner. Proto appearance=underline remains separate. Nested SVG/inline-glyph selector parity, full API and native/cross-adapter acceptance remain open."
openQuestions:
  - id: P-SHADCN-TABS-LIST-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: List 的 variant、orientation 与 token parity 应如何收敛？
      en: How should List variant, orientation, and token parity converge?
    context:
      en: "The nine source-distinct default/line recipes and live owned line decoration have authored consumer cases, not exact-head execution or native acceptance. Remaining gaps include nested SVG/inline-glyph sizing and placement, className/native forwarding, upstream data-slot/state correspondence, all-adapter paint, motion, assistive technology and independent review. Scope changes must preserve Base owners, live caller nodes and controlled refusal."
    blocks:
      - shadcn tabs list parity roadmap

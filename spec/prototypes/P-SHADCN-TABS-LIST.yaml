    change: revised
    summary: Bound the opt-in Runtime underline appearance while preserving family default behavior, Base ownership and existing upstream parity gaps.
  - version: 0.2.0-rc.0
    change: introduced
    summary: Introduced Shadcn Tabs List delta cataloging with Base inheritance, current surface, intentional asChild omission, and variant parity gaps.

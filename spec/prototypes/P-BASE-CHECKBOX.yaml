id: P-BASE-CHECKBOX
type: prototype
title: Base Checkbox is a checked input control with optional mixed display state
status: draft
since: 0.1.0
summary: Base Checkbox is the base prototype protocol for a focusable checked input control whose root owns checked value state, may expose an author-controlled indeterminate display state, toggles checked state through user activation, and provides Checkbox context for indicator parts.
statement:
  zh-CN: >-
    Base Checkbox 是一个可聚焦、可禁用、由 root 拥有语义与状态的 checked input control。它的 primary input value 是 `checked`，并可拥有一个 secondary `indeterminate` mixed display state；`indeterminate` 不是 User 直接设置的值，而是供 Component Author 或更高阶协议表达汇总/混合展示状态的能力。`base-checkbox-root` direct prototype 与 `asCheckboxRoot` authored asHook 是同一 Checkbox root protocol 的两个 authoring entries；Checkbox 可包含 indicator part，但 indicator 不拥有 checked value、activation 或 form 语义。


  en: >-
    Base Checkbox is a focusable, disable-able checked input control whose root owns the semantics and state. Its primary input value is `checked`, and it may own a secondary `indeterminate` mixed display state; `indeterminate` is not a value directly set by the User, but a capability for Component Authors or higher-level protocols to express aggregate or mixed display state. The `base-checkbox-root` direct prototype and the `asCheckboxRoot` authored asHook are two authoring entries of the same Checkbox root protocol; Checkbox may include indicator parts, but indicators do not own checked value, activation, or form semantics.


anatomy:
  family: base-checkbox
  roles:
    root:
      cardinality:
        min: 1
        max: 1
      summary:
        zh-CN: Checkbox 的 semantic owner、checked value owner、mixed display owner 与 anatomy domain anchor。
        en: Checkbox semantic owner, checked value owner, mixed display owner, and anatomy domain anchor.
    indicator:
      cardinality:
        min: 0
        max: '*'
      summary:
        zh-CN: 可选且可重复的 same-domain indicator，不拥有 activation、checked value 或 form 语义。
        en: Optional and repeatable same-domain indicator that does not own activation, checked value, or form semantics.
  relations:
    - kind: contains
      parent: root
      child: indicator
criteria:
  - id: P-BASE-CHECKBOX-EXTERNAL-LABEL
    text:
      en: An independent Base Label may associate through the explicit typed InstanceAssociations.controlLabel input and C-CONTROL-LABEL-0001. This is not a Props value, label text Prop or new Anatomy part. A qualifying label request shares the existing value-request operation, retaining disabled, controlled value and outward-signal ownership. Naming and activation remain independent, and a stale pair cannot perform subsequent target effects.
    dependsOn:
      contracts:
        - id: C-CONTROL-LABEL-0001
          since: 0.3.0-alpha.1
  - id: P-BASE-CHECKBOX-ROLE-CHECKED-INPUT
    text:
      zh-CN: Checkbox 表示 checked input control，而不是 command control、button-like active control 或 on/off setting value control。
      en: Checkbox represents a checked input control, not a command control, button-like active control, or on/off setting value control.
    dependsOn:
      knowledge:
        - K-COMPONENT-INTERACTION-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-ROLE-COMMAND
        - id: P-BASE-TOGGLE
          anchors:
            - P-BASE-TOGGLE-ROLE-ACTIVE-CONTROL
        - id: P-BASE-SWITCH
          anchors:
            - P-BASE-SWITCH-ROLE-ON-OFF-VALUE
  - id: P-BASE-CHECKBOX-DISPLAY-AND-INPUT
    text:
      zh-CN: Checkbox 同时承担 checked value 展示与 checked value 输入责任；它的 primary input value 是 `checked`。
      en: Checkbox is both a checked value display and a checked value input; its primary input value is `checked`.
    dependsOn:
      knowledge:
        - K-COMPONENT-INTERACTION-0001
  - id: P-BASE-CHECKBOX-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-checkbox-root` direct prototype 与 `asCheckboxRoot` authored asHook 是同一 Checkbox root protocol 的两个 authoring entries。'
      en: 'The `base-checkbox-root` direct prototype and the `asCheckboxRoot` authored asHook are two authoring entries of the same Checkbox root protocol.'
    dependsOn:
      contracts:
        - C-CORE-SYNTAX-0003
        - C-AS-HOOK-0001
      decisions:
        - D-PROTOTYPE-ENTITY-NAMING-0001
  - id: P-BASE-CHECKBOX-PROTOCOL-INDEPENDENCE
    text:
      zh-CN: Checkbox 不应通过消费 Button、Toggle 或 Switch 这类其他基础原型的 protocol-specific authored asHook 获得自身核心语义。
      en: Checkbox should not obtain its own core semantics by consuming protocol-specific authored asHooks from other base prototypes such as Button, Toggle, or Switch.
    dependsOn:
      decisions:
        - D-BASE-PROTOTYPE-INDEPENDENCE-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-AUTHORING-ENTRIES
        - id: P-BASE-TOGGLE
          anchors:
            - P-BASE-TOGGLE-PROTOCOL-INDEPENDENCE
        - id: P-BASE-SWITCH
          anchors:
            - P-BASE-SWITCH-PROTOCOL-INDEPENDENCE
  - id: P-BASE-CHECKBOX-ROOT-SEMANTIC-OWNER
    text:
      zh-CN: Checkbox root 是 Checkbox protocol 的 semantic owner，负责持有 checked value、indeterminate display state、activation、exposed state、outward signal 与 Checkbox context。
      en: Checkbox root is the semantic owner of the Checkbox protocol and owns checked value, indeterminate display state, activation, exposed state, outward signals, and Checkbox context.
    dependsOn:
      contracts:
        - C-ANATOMY-0005
        - C-STATE-0001
        - C-EXPOSE-STATE-0001
        - C-EXPOSE-EVENT-0001
        - C-CONTEXT-0006
  - id: P-BASE-CHECKBOX-ANATOMY-FAMILY
    text:
      zh-CN: Checkbox anatomy family 的 canonical structure 由顶层 `anatomy` 字段定义；anatomy 不得创建 part 或注入行为。
      en: The canonical structure of the Checkbox anatomy family is defined by the top-level `anatomy` field; anatomy must not create parts or inject behavior.
    dependsOn:
      contracts:
        - C-ANATOMY-0001
        - C-ANATOMY-0002
        - C-ANATOMY-0004
  - id: P-BASE-CHECKBOX-FAMILY-ROLES
    text:
      zh-CN: Checkbox anatomy family 第一轮必须至少定义 `root` 与 `indicator` roles。
      en: The first Checkbox anatomy family must define at least the `root` and `indicator` roles.
    dependsOn:
      contracts:
        - C-ANATOMY-0002
        - C-ANATOMY-0004
  - id: P-BASE-CHECKBOX-ROOT-DOMAIN-ANCHOR
    text:
      zh-CN: Checkbox root 必须 claim Checkbox anatomy family 的 root role，并作为同一 Checkbox domain 的作用域锚点。
      en: Checkbox root must claim the root role of the Checkbox anatomy family and act as the scope anchor for the same Checkbox domain.
    dependsOn:
      contracts:
        - C-ANATOMY-0004
        - C-ANATOMY-0005
  - id: P-BASE-CHECKBOX-ROOT-CARDINALITY
    text:
      zh-CN: 同一 Checkbox domain 中必须且只能有一个 Checkbox root。
      en: A Checkbox domain must have exactly one Checkbox root.
    dependsOn:
      contracts:
        - C-ANATOMY-0002
        - C-ANATOMY-0005
  - id: P-BASE-CHECKBOX-INDICATOR-ROLE
    text:
      zh-CN: Checkbox indicator 是可选且可重复的 same-domain visual indicator；它不拥有 checked value、indeterminate display、activation 或 form 语义。
      en: Checkbox indicator is an optional and repeatable same-domain visual indicator; it does not own checked value, indeterminate display, activation, or form semantics.
    dependsOn:
      contracts:
        - C-ANATOMY-0008
    references:
      prototypes:
        - id: P-BASE-CHECKBOX-INDICATOR
          anchors:
            - P-BASE-CHECKBOX-INDICATOR-ROLE-INDICATOR
  - id: P-BASE-CHECKBOX-INDICATOR-CARDINALITY
    text:
      zh-CN: Checkbox indicator 的基数为 `0..*`；没有 indicator 的 Checkbox 仍然成立，多个 indicator 可用于不同视觉片段。
      en: Checkbox indicator cardinality is `0..*`; a Checkbox remains valid without an indicator, and multiple indicators may represent different visual fragments.
    dependsOn:
      contracts:
        - C-ANATOMY-0002
  - id: P-BASE-CHECKBOX-ROOT-CONTAINS-INDICATOR
    text:
      zh-CN: Checkbox indicator 若存在，必须被解析为同一 Checkbox domain 中由 root 包含的 indicator。
      en: If Checkbox indicators exist, they must resolve as indicators contained by the root in the same Checkbox domain.
    dependsOn:
      contracts:
        - C-ANATOMY-0005
        - C-CONTEXT-0002
  - id: P-BASE-CHECKBOX-PROP-CHECKED
    text:
      zh-CN: 'Checkbox root 必须接受 `checked?: boolean` props input，用于受控 checked value。'
      en: 'Checkbox root must accept a `checked?: boolean` props input for controlled checked value.'
    dependsOn:
      contracts:
        - C-PROPS-0001
        - C-PROPS-0003
        - C-STATE-0001
  - id: P-BASE-CHECKBOX-PROP-DEFAULT-CHECKED
    text:
      zh-CN: 'Checkbox root 必须接受 `defaultChecked?: boolean` props input，用于非受控初始 checked value，默认值为 `false`。'
      en: 'Checkbox root must accept a `defaultChecked?: boolean` props input for uncontrolled initial checked value whose default is `false`.'
    dependsOn:
      contracts:
        - C-PROPS-0001
        - C-PROPS-0003
        - C-STATE-0001
  - id: P-BASE-CHECKBOX-CONTROLLED-CHECKED
    text:
      zh-CN: 当 App Maker 提供或更新 `checked` props input 时，Checkbox root 必须以该 input 同步 checked value。
      en: When the App Maker provides or updates the `checked` props input, Checkbox root must synchronize checked value from that input.
    dependsOn:
      contracts:
        - C-PROPS-0001
        - C-STATE-0001
        - C-EXPOSE-STATE-0001
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            - P-BASE-SWITCH-CONTROLLED-CHECKED
  - id: P-BASE-CHECKBOX-PROP-DISABLED
    text:
      zh-CN: 'Checkbox root 必须接受 `disabled?: boolean` props input，默认值为 `false`。'
      en: 'Checkbox root must accept a `disabled?: boolean` props input whose default is `false`.'
    dependsOn:
      contracts:
        - C-PROPS-0001
        - C-PROPS-0003
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-PROP-DISABLED
  - id: P-BASE-CHECKBOX-PROP-NO-EVENT-CALLBACK
    text:
      zh-CN: Checkbox props 不包含 `onCheckedChange` 之类事件回调；Checkbox checked value change 通过 expose event 发出 `checkedChange` signal。
      en: Checkbox props do not include event callbacks such as `onCheckedChange`; Checkbox checked value changes emit the `checkedChange` signal through expose event.
    dependsOn:
      contracts:
        - C-PROPS-0001
        - C-EXPOSE-EVENT-0001
  - id: P-BASE-CHECKBOX-CHECKED-EXPOSE
    text:
      zh-CN: Checkbox root 必须 expose `checked` state；`checked=true` 表示 Checkbox 的 primary checked input value 为 checked。
      en: Checkbox root must expose `checked` state; `checked=true` means the Checkbox primary checked input value is checked.
    dependsOn:
      contracts:
        - C-STATE-0001
        - C-EXPOSE-STATE-0001
  - id: P-BASE-CHECKBOX-INDETERMINATE-STATE
    text:
      zh-CN: Checkbox root 必须拥有并 expose `indeterminate` state；它表示 secondary mixed display state，而不是 primary checked input value。
      en: Checkbox root must own and expose `indeterminate` state; it represents a secondary mixed display state rather than the primary checked input value.
    dependsOn:
      contracts:
        - C-STATE-0001
        - C-EXPOSE-STATE-0001
    references:
      prototypes:
        - id: P-BASE-CHECKBOX-INDICATOR
          anchors:
            - P-BASE-CHECKBOX-INDICATOR-DERIVED-INDETERMINATE
  - id: P-BASE-CHECKBOX-INDETERMINATE-NOT-USER-VALUE
    text:
      zh-CN: User 不得通过 Checkbox 自身的直接交互把 `indeterminate` 设置为 `true`；`indeterminate` 只能由 Component Author、上层协议或受控输入恢复/设置。
      en: The User must not set `indeterminate` to `true` through direct Checkbox interaction; `indeterminate` may only be restored or set by Component Authors, higher-level protocols, or controlled inputs.
    dependsOn:
      contracts:
        - C-STATE-0001
        - C-EVENT-TYPE-0002
  - id: P-BASE-CHECKBOX-INDETERMINATE-AUTHOR-CAPABILITY
    text:
      zh-CN: '`asCheckboxRoot` 必须让 Component Author 能取得并主动设置 `indeterminate` state handle，以支持 tree、table header、permission matrix 等 higher-level aggregate checkbox。'
      en: '`asCheckboxRoot` must allow Component Authors to obtain and actively set the `indeterminate` state handle to support higher-level aggregate checkboxes such as tree nodes, table headers, and permission matrices.'
    dependsOn:
      contracts:
        - C-AS-HOOK-0001
        - C-STATE-0001
  - id: P-BASE-CHECKBOX-INDETERMINATE-PROP-DEFERRED
    text:
      zh-CN: '`indeterminate` 是否作为 App Maker-facing controlled props surface 进入 Checkbox root core props，第一轮暂不定案；当前应视为 advanced/component-author surface 的断口。'
      en: Whether `indeterminate` belongs to the Checkbox root core props as an App Maker-facing controlled props surface is not decided in the first layer; it remains a gap around advanced or component-author surfaces.
    dependsOn:
      contracts:
        - C-PROPS-0001
        - C-STATE-0001
  - id: P-BASE-CHECKBOX-CONTEXT-KEY
    text:
      zh-CN: Checkbox root 必须使用稳定的 Checkbox context key 向同域 part 提供协作信息。
      en: Checkbox root must use a stable Checkbox context key to provide coordination information to same-domain parts.
    dependsOn:
      contracts:
        - C-CONTEXT-0001
        - C-CONTEXT-0006
  - id: P-BASE-CHECKBOX-CONTEXT-VALUE
    text:
      zh-CN: 'Checkbox context value 顶层必须是 JSON object，且至少包含 `checked: boolean`、`indeterminate: boolean` 与 `disabled: boolean`。'
      en: 'Checkbox context value must be a top-level JSON object and must contain at least `checked: boolean`, `indeterminate: boolean`, and `disabled: boolean`.'
    dependsOn:
      contracts:
        - C-CONTEXT-0006
        - C-PROPS-0003
  - id: P-BASE-CHECKBOX-CONTEXT-SYNC
    text:
      zh-CN: 当 root 的 checked、indeterminate 或 disabled state 变化时，Checkbox root 必须同步更新 Checkbox context value 中对应字段。
      en: When root checked, indeterminate, or disabled state changes, Checkbox root must synchronize the corresponding fields in the Checkbox context value.
    dependsOn:
      contracts:
        - C-CONTEXT-0007
        - C-STATE-0001
  - id: P-BASE-CHECKBOX-PART-CONTEXT-CONSUME
    text:
      zh-CN: Checkbox anatomy part 必须通过 Checkbox context 消费 root state；不得通过复制 root props、读取 host DOM 状态或以 root exposed state 作为主通路。
      en: Checkbox anatomy parts must consume root state through Checkbox context; they must not use copied root props, host DOM state, or root exposed state as their primary channel.
    dependsOn:
      contracts:
        - C-CONTEXT-0006
        - C-CONTEXT-0007
  - id: P-BASE-CHECKBOX-TRIGGER-SEMANTICS
    text:
      zh-CN: Checkbox root 必须通过官方 trigger 能力处理 activation route，但不得依赖 Button protocol 来获得 Checkbox checked 语义。
      en: Checkbox root must process its activation route through the official trigger capability, but must not depend on the Button protocol to obtain Checkbox checked semantics.
    dependsOn:
      contracts:
        - C-AS-TRIGGER-0001
        - C-EVENT-TYPE-0001
        - C-EVENT-TYPE-0002
      decisions:
        - D-BASE-PROTOTYPE-INDEPENDENCE-0001
  - id: P-BASE-CHECKBOX-ACTIVATION-FLIPS-CHECKED
    text:
      zh-CN: Checkbox root 在 enabled 状态下成功 User activation 后，必须计算与当前 checked 相反的 next checked value。
      en: After successful User activation while enabled, Checkbox root must compute a next checked value opposite to the current checked value.
    dependsOn:
      contracts:
        - C-EVENT-TYPE-0001
        - C-EVENT-TYPE-0002
        - C-STATE-0001
  - id: P-BASE-CHECKBOX-ACTIVATION-CLEARS-INDETERMINATE
    text:
      zh-CN: enabled Checkbox root 被 User activation 时，若当前 `indeterminate=true`，必须清除或请求清除 `indeterminate`，且不得由该 activation 产生新的 `indeterminate=true`。
      en: When an enabled Checkbox root receives User activation, if `indeterminate=true`, it must clear or request clearing `indeterminate`, and that activation must not produce a new `indeterminate=true`.
    dependsOn:
      contracts:
        - C-EVENT-TYPE-0002
        - C-STATE-0001
  - id: P-BASE-CHECKBOX-UNCONTROLLED-UPDATES-CHECKED
    text:
      zh-CN: 非受控 Checkbox root 在成功 activation 后必须更新 checked state，并 expose 更新后的 checked value。
      en: An uncontrolled Checkbox root must update checked state after successful activation and expose the updated checked value.
    dependsOn:
      contracts:
        - C-STATE-0001
        - C-EXPOSE-STATE-0001
  - id: P-BASE-CHECKBOX-CONTROLLED-EMITS-NEXT
    text:
      zh-CN: 受控 Checkbox root 在成功 activation 后不得自行最终拥有 checked state；它必须发出包含 next checked value 的 outward signal。
      en: A controlled Checkbox root must not finally own checked state after successful activation; it must emit an outward signal carrying the next checked value.
    dependsOn:
      contracts:
        - C-PROPS-0001
        - C-EXPOSE-EVENT-0001
  - id: P-BASE-CHECKBOX-CHECKED-CHANGE-SIGNAL
    text:
      zh-CN: 'Checkbox checked value 成功变化或请求变化时，必须发出名为 `checkedChange` 的 outward signal，payload 必须至少包含 `{ checked: boolean }`。'
      en: 'When Checkbox checked value changes or requests a change successfully, it must emit an outward signal named `checkedChange` whose payload contains at least `{ checked: boolean }`.'
    dependsOn:
      contracts:
        - C-EVENT-TYPE-0001
        - C-EVENT-TYPE-0002
        - C-EXPOSE-EVENT-0001
  - id: P-BASE-CHECKBOX-CHECKED-CHANGE-PROTOCOL-NAME
    text:
      zh-CN: '`checkedChange` 是 Checkbox protocol 约定的 checked value-change outward signal 名称。'
      en: '`checkedChange` is the checked value-change outward signal name defined by the Checkbox protocol.'
    dependsOn:
      contracts:
        - C-EXPOSE-EVENT-0001
  - id: P-BASE-CHECKBOX-INDETERMINATE-CHANGE-DEFERRED
    text:
      zh-CN: '`indeterminateChange` 是否应作为 App Maker 可见 outward signal，第一轮暂不定案；它可能更适合作为 Component Author 通过 state handle 管理的内部状态变化。'
      en: Whether `indeterminateChange` should be an App Maker-visible outward signal is not decided in the first layer; it may be better treated as internal state changes managed by Component Authors through state handles.
    dependsOn:
      contracts:
        - C-EXPOSE-EVENT-0001
        - C-STATE-0001
  - id: P-BASE-CHECKBOX-DISABLED-EXPOSE
    text:
      zh-CN: Checkbox root 必须 expose `disabled` state。
      en: Checkbox root must expose `disabled` state.
    dependsOn:
      contracts:
        - C-STATE-INTERACTION-0001
        - C-EXPOSE-STATE-0001
        - C-A11Y-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-DISABLED-EXPOSE
  - id: P-BASE-CHECKBOX-DISABLED-SUPPRESS-ACTIVATION
    text:
      zh-CN: 当 `disabled` 为 true 时，Checkbox root 不得完成 activation，不得改变 checked 或 indeterminate state，也不得发出 checked value-change signal。
      en: When `disabled` is true, Checkbox root must not complete activation, change checked or indeterminate state, or emit checked value-change signals.
    dependsOn:
      contracts:
        - C-EVENT-TYPE-0001
        - C-EVENT-TYPE-0002
        - C-EXPOSE-EVENT-0001
  - id: P-BASE-CHECKBOX-DISABLED-CLEAR-TRANSIENT
    text:
      zh-CN: 当 `disabled` 变为 true 时，Checkbox root 必须清理自身 transient interaction state，但不得因此改变 checked 或 indeterminate state。
      en: When `disabled` becomes true, Checkbox root must clear its own transient interaction state without changing checked or indeterminate state.
    dependsOn:
      contracts:
        - C-STATE-INTERACTION-0001
        - C-STATE-INTERACTION-0002
        - C-STATE-INTERACTION-0003
  - id: P-BASE-CHECKBOX-POINTER-HOVER
    text:
      zh-CN: Checkbox root 必须响应指向性设备的 hover 进入与离开，并 expose `hovered` state。
      en: Checkbox root must respond to pointer hover enter and leave, and must expose `hovered` state.
    dependsOn:
      contracts:
        - C-STATE-INTERACTION-0001
        - C-STATE-INTERACTION-0002
        - C-EXPOSE-STATE-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-POINTER-HOVER
  - id: P-BASE-CHECKBOX-FOCUSABLE
    text:
      zh-CN: Checkbox root 必须是 focus target，并 expose `focused` 与 `focusVisible` state。
      en: Checkbox root must be a focus target and must expose `focused` and `focusVisible` state.
    dependsOn:
      contracts:
        - C-AS-FOCUSABLE-0001
        - C-EXPOSE-STATE-0001
      decisions:
        - D-FOCUS-STATE-INTERACTION-BOUNDARY-0001
  - id: P-BASE-CHECKBOX-REQUEST-FOCUS
    text:
      zh-CN: Checkbox root 必须提供主动请求焦点的能力。
      en: Checkbox root must provide a capability for actively requesting focus.
    dependsOn:
      contracts:
        - C-AS-FOCUSABLE-0001
  - id: P-BASE-CHECKBOX-DISABLED-REJECT-FOCUS
    text:
      zh-CN: 当 `disabled` 为 true 时，Checkbox root 必须拒绝主动焦点请求。
      en: When `disabled` is true, Checkbox root must reject active focus requests.
    dependsOn:
      contracts:
        - C-AS-FOCUSABLE-0001
  - id: P-BASE-CHECKBOX-PRESS-LIFECYCLE
    text:
      zh-CN: Checkbox root 必须维护 transient press lifecycle，并 expose `pressed` state；该 `pressed` 不表示 checked 或 indeterminate。
      en: Checkbox root must maintain the transient press lifecycle and expose `pressed` state; this `pressed` does not represent checked or indeterminate.
    dependsOn:
      contracts:
        - C-STATE-INTERACTION-0001
        - C-STATE-INTERACTION-0002
        - C-STATE-INTERACTION-0003
        - C-EXPOSE-STATE-0001
  - id: P-BASE-CHECKBOX-KEYBOARD-SPACE-ACTIVATION
    text:
      zh-CN: Checkbox root 必须支持 Space keyboard activation。
      en: Checkbox root must support Space keyboard activation.
    dependsOn:
      contracts:
        - C-EVENT-TYPE-0001
        - C-EVENT-TYPE-0002
  - id: P-BASE-CHECKBOX-KEYBOARD-ENTER-NOT-ACTIVATION
    text:
      zh-CN: Checkbox root 不应把 Enter 作为第一层 keyboard activation 路径。
      en: Checkbox root should not treat Enter as a first-layer keyboard activation route.
    dependsOn:
      contracts:
        - C-EVENT-TYPE-0001
        - C-EVENT-TYPE-0002
  - id: P-BASE-CHECKBOX-KEYBOARD-SPACE-PREVENT-DEFAULT
    text:
      zh-CN: 当已聚焦 Checkbox root 通过 Space 触发 activation 时，Checkbox 应请求阻止宿主默认副作用。
      en: When a focused Checkbox root is activated through Space, Checkbox should request prevention of host default side effects.
    dependsOn:
      contracts:
        - C-EVENT-TYPE-0001
        - C-EVENT-TYPE-0002
  - id: P-BASE-CHECKBOX-ACCESSIBLE-ROLE
    text:
      zh-CN: Checkbox root 必须具备可映射到 checkbox role 的可访问语义。
      en: Checkbox root must carry accessibility semantics that can be mapped to the checkbox role.
    dependsOn:
      contracts:
        - C-A11Y-0001
  - id: P-BASE-CHECKBOX-ACCESSIBLE-NAME
    text:
      zh-CN: Checkbox root 必须支持 accessible name。
      en: Checkbox root must support an accessible name.
    dependsOn:
      contracts:
        - C-A11Y-0001
  - id: P-BASE-CHECKBOX-A11Y-CHECKED
    text:
      zh-CN: 当 `indeterminate=false` 时，Checkbox root 必须将 checked state 投射为可访问 checked state；`checked=true` 对应 true，`checked=false` 对应 false。
      en: When `indeterminate=false`, Checkbox root must project checked state as accessible checked state; `checked=true` maps to true, and `checked=false` maps to false.
    dependsOn:
      contracts:
        - C-A11Y-0001
        - C-EXPOSE-STATE-0001
  - id: P-BASE-CHECKBOX-A11Y-MIXED
    text:
      zh-CN: 当 `indeterminate=true` 时，Checkbox root 必须优先投射可访问 checked state 为 mixed。
      en: When `indeterminate=true`, Checkbox root must project accessible checked state as mixed with priority over checked true or false.
    dependsOn:
      contracts:
        - C-A11Y-0001
        - C-EXPOSE-STATE-0001
  - id: P-BASE-CHECKBOX-PROP-LABEL-DEFERRED
    text:
      zh-CN: Checkbox 的 accessible name 是核心可访问能力，但第一版 core props 不强制把它定义为 `label` prop。
      en: Checkbox accessible name is a core accessibility capability, but the first core props surface does not force it to be a `label` prop.
    dependsOn:
      contracts:
        - C-PROPS-0001
        - C-A11Y-0001
  - id: P-BASE-CHECKBOX-FORM-INTEGRATION-DEFERRED
    text:
      zh-CN: Checkbox 是 form-relevant input control，但 `name`、`value`、`form`、`required`、validation、hidden input 与提交行为不进入第一轮实现；实现中必须作为 TODO 或断口保留。
      en: Checkbox is a form-relevant input control, but `name`, `value`, `form`, `required`, validation, hidden input, and submission behavior do not enter the first implementation layer; the implementation must preserve them as TODOs or gaps.
    dependsOn:
      contracts:
        - C-PROPS-0001
  - id: P-BASE-CHECKBOX-NO-VISUAL-VARIANT-CORE
    text:
      zh-CN: Checkbox core contract 不定义 size、variant、tone、shape、indicator icon 等视觉参数。
      en: Checkbox core contract does not define visual parameters such as size, variant, tone, shape, or indicator icon.
    dependsOn:
      decisions:
        - D-BASE-PROTOTYPE-INDEPENDENCE-0001
      knowledge:
        - K-DESIGN-TRADEOFF-0001
openQuestions:
  - id: P-BASE-CHECKBOX-Q-INDETERMINATE-PROPS
    question:
      zh-CN: '`indeterminate` / `defaultIndeterminate` 是否应成为 App Maker-facing core props，还是只通过 asHook state handle 和 higher-level protocol 管理？'
      en: Should `indeterminate` / `defaultIndeterminate` become App Maker-facing core props, or should they be managed only through asHook state handles and higher-level protocols?
    context:
      zh-CN: '`indeterminate` 对 User 不可直接设置，且通常由 Component Author 或树/表格/权限矩阵等上层协议驱动；但一些 direct prototype 和受控渲染场景可能仍需要显式输入。'
      en: '`indeterminate` is not directly set by the User and is usually driven by Component Authors or higher-level protocols such as trees, tables, and permission matrices; however, some direct prototype and controlled rendering scenarios may still need explicit inputs.'
    blocks:
      - checkbox advanced props surface
      - checkbox aggregate authoring model
  - id: P-BASE-CHECKBOX-Q-INDETERMINATE-SIGNAL
    question:
      zh-CN: '`indeterminateChange` 是否应作为 App Maker 可见 outward signal，还是仅作为 Component Author 内部 state 变化？'
      en: Should `indeterminateChange` be an App Maker-visible outward signal, or only an internal state change for Component Authors?
    context:
      zh-CN: 当前实现已经 emit `indeterminateChange`，但该 signal 可能过度公开了 secondary mixed display state。
      en: The current implementation already emits `indeterminateChange`, but that signal may overexpose the secondary mixed display state.
    blocks:
      - checkbox expose event surface
  - id: P-BASE-CHECKBOX-Q-INDETERMINATE-STATE-SYNC
    question:
      zh-CN: Component Author 在 mounted 之后通过 `asCheckboxRoot().stateHandles.indeterminate.set(...)` 任意写入时，Checkbox root 应通过 state observation 自动同步 context/a11y，还是提供显式同步 API？
      en: When a Component Author arbitrarily writes through `asCheckboxRoot().stateHandles.indeterminate.set(...)` after mounted, should Checkbox root automatically synchronize context/a11y through state observation, or provide an explicit synchronization API?
    context:
      zh-CN: 当前实现可在 lifecycle、props 与 root 交互路径中同步 `indeterminate`，并能让 `asHook` 返回可设置的 state handle；但 runtime owned state handle 还没有 author-facing watch/observation 能力，因此 post-mounted 任意外部写入不会立即触发 root context publish。
      en: The current implementation synchronizes `indeterminate` through lifecycle, props, and root interaction paths, and `asHook` returns a settable state handle; however, runtime owned state handles do not yet expose author-facing watch/observation, so arbitrary post-mounted external writes do not immediately trigger root context publishing.
    blocks:
      - checkbox aggregate authoring model
      - state observation capability
  - id: P-BASE-CHECKBOX-Q-AGGREGATE-CONTEXT
    question:
      zh-CN: tree/table/group 等 aggregate checkbox 关系是否应通过 Checkbox context scope、独立 Group/Summary protocol，还是更通用的 collection/form protocol 表达？
      en: Should aggregate checkbox relationships for trees, tables, and groups be represented through Checkbox context scope, an independent Group/Summary protocol, or a more general collection/form protocol?
    context:
      zh-CN: '`indeterminate` 经常来自一组 checkbox 的汇总，但基础 Checkbox 第一轮只处理自身原子化交互，不建模 group/tree 的聚合算法。'
      en: '`indeterminate` often comes from aggregation over a set of checkboxes, but the first Base Checkbox layer only handles atomic interaction and does not model group or tree aggregation algorithms.'
    blocks:
      - checkbox group catalog
      - form and collection integration
  - id: P-BASE-CHECKBOX-Q-FORM-INTEGRATION
    question:
      zh-CN: Checkbox 的 `name`、`value`、`form`、`required`、validation、hidden input 与提交行为应归属于 Checkbox root core、Form protocol capability，还是 adapter/host capability？
      en: Should Checkbox `name`, `value`, `form`, `required`, validation, hidden input, and submission behavior belong to Checkbox root core, Form protocol capabilities, or adapter/host capabilities?
    context:
      zh-CN: Checkbox 是 form-relevant input control；本轮编目记录该兼容面，但暂不实现。
      en: Checkbox is a form-relevant input control; this cataloging round records that compatibility surface but does not implement it.
    blocks:
      - checkbox form integration
      - form protocol design

  - path: packages/prototypes/base/src/slider/part-setup.ts
  - path: packages/prototypes/base/src/slider/types.ts
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Recorded the existing FieldThumb entry with shared transient facts and explicit draft limits.
tags: [prototype, base, slider, field, draft]

id: P-BOOTSTRAP-2-3-2-SELECT-ALIGNMENT-PARTS
type: prototype
title: Bootstrap 2.3.2 Select Surface Viewport and ItemText alignment parts
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    en: Draft catalog relation for an implemented family projection against the pinned Bootstrap 2.3.2 vocabulary. Stable admission requires real consumers, browser/native evidence and independent review; source presence and private package availability are not release or conformance admission.
summary: Three same-family alignment parts completing the eleven-part Select anatomy.
statement:
    en: The Prototypes invoke asSelectSurface(), asSelectViewport() and asSelectItemText() once each. Surface is semantic-only (the .dropdown-menu chrome stays on Content), Viewport owns the scrollport and ItemText supplies item text identity; none owns selection, positioning or presence.
criteria:
  - id: P-BOOTSTRAP-2-3-2-SELECT-ALIGNMENT-PARTS-INHERITANCE
    text:
            en: Each part invokes its matching Base hook exactly once and preserves Base props/exposes, anatomy order, scoped naming and render. The item-aligned composition is Content > Surface > Viewport > Item > ItemText.
  - id: P-BOOTSTRAP-2-3-2-SELECT-ALIGNMENT-PARTS-VISUAL
    text:
            en: Surface and ItemText are semantic-only or content-level; Viewport carries relative overflow scrolling. Upstream had a native select, so the custom Select and its alignment parts are explicit family extensions, not widget parity.
  - id: P-BOOTSTRAP-2-3-2-SELECT-ALIGNMENT-PARTS-CLOSURE
    text:
            en: All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, Glyphicons, upstream JavaScript or Adapter component-name dispatch may supply default intent.
  - id: P-BOOTSTRAP-2-3-2-SELECT-ALIGNMENT-PARTS-BOUNDARY
    text:
            en: Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; the package is private and source-only. Catalog presence is a draft relation, not acceptance.

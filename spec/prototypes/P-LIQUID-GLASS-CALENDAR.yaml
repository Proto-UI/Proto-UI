id: P-LIQUID-GLASS-CALENDAR
type: prototype
title: Liquid Glass Calendar projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native and material-host evidence plus independent review; source presence, private package availability and intent frames are not release, conformance or Apple-equivalence admission.
summary: Liquid Glass Calendar family over P-BASE-CALENDAR.
statement:
  en: "Each Calendar part consumes its exact Base hook once; the computed date model and ordinary content stay with their existing owners and no nested material surface is added."
criteria:
  - id: P-LIQUID-GLASS-CALENDAR-BASE
    text:
      en: Invoke asCalendar* hooks() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias or Base.setup call.
  - id: P-LIQUID-GLASS-CALENDAR-VISUAL
    text:
      en: "All ten Calendar parts preserve localized days, heading, navigation, selection, disabled policy and Base-controlled refusal with ordinary nonmaterial content. A containing DatePicker may own its one functional popup surface; Calendar does not add a nested optical owner. Source and intent frames do not establish native raster or Apple equivalence."
  - id: P-LIQUID-GLASS-CALENDAR-CLOSURE
    text:
      en: All family appearance is authored through feedback tokens, typed material intent and Rules with explicit finite physical translation; no website-only CSS, private Apple asset or Adapter component-name dispatch may supply default intent, and explicit liquid-glass intent is never silently replaced by adaptive native blur.
  - id: P-LIQUID-GLASS-CALENDAR-BOUNDARY
    text:
      en: Exact-head browser, native, material-provider and Compiler evidence plus independent review remain open; the package is private and source-only. Apple documentation is a design reference, not implementation, asset or equivalence evidence. Catalog presence is a draft relation, not acceptance.
dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
inherits:
  prototypes:
    - P-BASE-CALENDAR
verifies:
  tests:
    - T-LIQUID-GLASS-CONTENT-SOURCE-0001
sources:
  - path: packages/prototypes/liquid-glass/src/calendar/
  - path: packages/prototypes/liquid-glass/src/calendar/index.ts
  - path: https://developer.apple.com/design/human-interface-guidelines/materials
    label: Apple HIG Materials design reference only
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Liquid Glass Calendar projection cataloged as a draft family projection over the implemented source slice.
tags:
  - prototype
  - liquid-glass
  - calendar
  - draft

revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: >-
      Introduced the draft Brutalist Toggle projection with real public-API criteria (size enum, defaults, active pair invariant, interaction states) on the rc.7 release train. Not present in the immutable rc.6 snapshot.

  - version: 0.2.0
    change: revised
    summary: >-
      Added a geometry-stable inset ink frame as the persistent non-color active signal and made transient press precedence explicit.



id: P-BRUTALIST-TOGGLE
type: prototype
title: 'Brutalist Toggle inherits Base Toggle and layers a rounded active-control surface'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Toggle preserves Base Toggle interaction and the admitted size enum while projecting the pinned Neo size recipe, flat paired fills, rounded geometry and an explicit persistent non-color active inset extension.'

statement:
  en: P-BRUTALIST-TOGGLE preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-TOGGLE 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-TOGGLE-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Toggle through `asToggle()` once and must not redefine Base active, press, hover, focus, or disabled protocol semantics. Visual projection may only consume the projected state handles.


      zh-CN: >-
        该 prototype 必须通过 `asToggle()` 一次性继承 Base Toggle，不得重定义 Base 的 active、press、hover、focus 或 disabled 协议语义；视觉投射只能消费投影出的 state handles。


  - id: P-BRUTALIST-TOGGLE-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-toggle`.
      zh-CN: 直接 prototype 入口名为 `brutalist-toggle`。
  - id: P-BRUTALIST-TOGGLE-SIZE-PROP
    text:
      en: Public size remains default | sm | lg, defaulting to default. The pinned 3306a802 toggle.tsx maps default to h-10 min-w-10 px-3 text-sm, sm to h-9 min-w-9 px-2.5 text-[0.8rem], and lg to h-11 min-w-11 px-4 text-sm. Removing size restores default. These geometry and type tokens add no public variant or icon API.
      zh-CN: 公开 size 仍为 default | sm | lg，默认 default。固定 3306a802 toggle.tsx 将 default 映射到 h-10 min-w-10 px-3 text-sm、sm 映射到 h-9 min-w-9 px-2.5 text-[0.8rem]、lg 映射到 h-11 min-w-11 px-4 text-sm；移除 size 恢复 default。这些几何与排版 token 不增加公开 variant 或 icon API。
  - id: P-BRUTALIST-TOGGLE-DEFAULTS
    text:
      en: >-
        When `size` or `disabled` are omitted or removed after mount, the prototype must restore `default` and `false` respectively. `defaultActive` supplies the uncontrolled initial value and defaults to `false` when omitted at creation; removing it after mount does not reset owned active state.


      zh-CN: >-
        当 `size` 或 `disabled` 缺省或在挂载后被移除时，prototype 必须分别恢复为 `default` 与 `false`。`defaultActive` 提供非受控初值，在创建时缺省为 `false`；挂载后移除它不会重置已归属的 active 状态。


  - id: P-BRUTALIST-TOGGLE-PAIR-INVARIANT
    text:
      en: >-
        The active fill must co-select its foreground: active uses `bg-main` with `text-main-foreground`. No rule may replace the active fill's foreground with a theme-global text token independently of its background.


      zh-CN: >-
        active 填充必须同时选择其前景：active 使用 `bg-main` 与 `text-main-foreground`。任何规则都不得在脱离背景的情况下用主题全局文本 token 覆盖 active 填充前景。


  - id: P-BRUTALIST-TOGGLE-ACTIVE-SIGNAL
    text:
      en: >-
        Active retains a persistent 2px inset ink frame independently of color, including during press. The inset does not change layout, translation or Base active/pressed/aria-pressed ownership. This non-color marker is an explicit Proto UI accessibility extension.


      zh-CN: >-
        active 保留独立于颜色的持续 2px inset ink frame，press 时仍保留；inset 不改变布局、translation 或 Base active/pressed/aria-pressed owner。这一非颜色 marker 是明确的 Proto UI 无障碍扩展。


  - id: P-BRUTALIST-TOGGLE-INTERACTION
    text:
      en: >-
        Hover and press preserve the flat frame with no translation or outer shadow; active inset persists. Focus-visible retains the offset ring, and disabled retains opacity-50/pointer-events-none with geometry and marker preserved.


      zh-CN: >-
        hover/press 保持 flat frame，无 translation 或外侧阴影；active inset 持续存在。focus-visible 保留 offset ring；disabled 保留 opacity-50/pointer-events-none 以及几何与 marker。


  - id: P-BRUTALIST-TOGGLE-VISUAL-GRAMMAR
    text:
      en: >-
        Toggle uses rounded-base 5px, 2px black frame, neutral bg-secondary-background/text-foreground and font-heading font-bold text-sm with authored casing. No outer elevation or movement is applied.


      zh-CN: >-
        Toggle 使用 rounded-base 5px、2px 黑边、中性 bg-secondary-background/text-foreground、font-heading font-bold text-sm 与作者大小写，不施加外侧 elevation 或 movement。



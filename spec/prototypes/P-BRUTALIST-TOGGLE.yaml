id: P-BRUTALIST-TOGGLE
type: prototype
title: Brutalist Toggle inherits Base Toggle and layers a square active-control surface
status: draft
since: 0.2.0-rc.7
summary: >-
  Brutalist Toggle inherits Base Toggle interaction semantics and projects a style-family visual API: a constrained size enum, square geometry, hard offset shadows, flat paired fills, and an active accent pair reinforced by a persistent non-color inset frame.


statement:
  en: >-
    Brutalist Toggle is a draft Proto UI-maintained Neo-Brutalist design-language projection over Base Toggle. It preserves inherited Base protocol semantics (active/defaultActive/disabled) and adds only visual/style behavior: zero radius, black structural borders, hard offset shadows, a `default | sm | lg` size enum, and a main accent pair plus persistent inset ink frame when active.


  zh-CN: >-
    Brutalist Toggle 是 Proto UI 维护的 draft Neo-Brutalist design-language 投射，建立在 Base Toggle 之上。它保留继承的 Base 协议语义（active/defaultActive/disabled），仅增加视觉/style 行为：零圆角、黑色结构边框、硬偏移阴影、`default | sm | lg` size 枚举，以及 active 时的 main 强调色对与持续 inset ink frame。


criteria:
  - id: P-BRUTALIST-TOGGLE-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Toggle through `asToggle()` once and must not redefine Base active, press, hover, focus, or disabled protocol semantics. Visual projection may only consume the projected state handles.


      zh-CN: >-
        该 prototype 必须通过 `asToggle()` 一次性继承 Base Toggle，不得重定义 Base 的 active、press、hover、focus 或 disabled 协议语义；视觉投射只能消费投影出的 state handles。


  - id: P-BRUTALIST-TOGGLE-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-toggle`.
      zh-CN: 直接 prototype 入口名为 `brutalist-toggle`。
  - id: P-BRUTALIST-TOGGLE-SIZE-PROP
    text:
      en: Public `size` is the enum `default | sm | lg` with default `default`, mapping to distinct height/min-width/padding/typography tokens.
      zh-CN: 公开 `size` 为枚举 `default | sm | lg`，默认 `default`，对应不同的高度/最小宽度/内边距/排版 token。
  - id: P-BRUTALIST-TOGGLE-DEFAULTS
    text:
      en: >-
        When `size` or `disabled` are omitted or removed after mount, the prototype must restore `default` and `false` respectively. `defaultActive` supplies the uncontrolled initial value and defaults to `false` when omitted at creation; removing it after mount does not reset owned active state.


      zh-CN: >-
        当 `size` 或 `disabled` 缺省或在挂载后被移除时，prototype 必须分别恢复为 `default` 与 `false`。`defaultActive` 提供非受控初值，在创建时缺省为 `false`；挂载后移除它不会重置已归属的 active 状态。


  - id: P-BRUTALIST-TOGGLE-PAIR-INVARIANT
    text:
      en: >-
        The active fill must co-select its foreground: active uses `bg-main` with `text-main-foreground`. No rule may replace the active fill's foreground with a theme-global text token independently of its background.


      zh-CN: >-
        active 填充必须同时选择其前景：active 使用 `bg-main` 与 `text-main-foreground`。任何规则都不得在脱离背景的情况下用主题全局文本 token 覆盖 active 填充前景。


  - id: P-BRUTALIST-TOGGLE-ACTIVE-SIGNAL
    text:
      en: >-
        Active must remain distinguishable without color by adding a persistent 2px inset ink frame while retaining the resting 3px outer hard shadow. The inset frame must not change layout geometry or translate the control. During transient press, the inset frame remains while the outer shadow clears and the press translation applies; release restores the outer shadow. This visual rule must not redefine Base `active`, `pressed`, activation, or `aria-pressed` ownership.


      zh-CN: >-
        Active 必须通过持续的 2px inset ink frame 在不依赖颜色时仍可区分，同时保留静止态 3px 外部硬阴影。Inset frame 不得改变布局几何或平移控件。瞬时 press 期间 inset frame 保留，外部阴影清除并应用 press 位移；释放后恢复外部阴影。该视觉规则不得重定义 Base 的 `active`、`pressed`、activation 或 `aria-pressed` 所有权。


  - id: P-BRUTALIST-TOGGLE-INTERACTION
    text:
      en: >-
        Hover only while inactive and not pressed lifts the control. Press takes precedence over hover, translates into the shadow axis, and clears outer elevation while preserving the active inset frame. Focus-visible applies a hard ring with offset. Disabled reduces emphasis with `opacity-50` and `pointer-events-none` while preserving geometry and the active marker.


      zh-CN: >-
        Hover 仅在 inactive 且未 pressed 时抬升控件。Press 优先于 hover，沿阴影轴压入并清除外部高度，同时保留 active inset frame。Focus-visible 使用带 offset 的硬 ring。Disabled 以 `opacity-50` 与 `pointer-events-none` 降低强调，同时保留几何与 active marker。


  - id: P-BRUTALIST-TOGGLE-VISUAL-GRAMMAR
    text:
      en: >-
        The visual surface must preserve square corners, black structural borders, hard zero-blur offset shadows, and flat theme-token fills without gradients, glass, rounded cards, or soft elevation.


      zh-CN: >-
        视觉表面必须保持直角、黑色结构边框、零模糊硬偏移阴影和平面主题 token 填充，不得使用渐变、玻璃拟态、圆角卡片或柔和高度阴影。



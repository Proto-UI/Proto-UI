id: P-BASE-SELECT-TRIGGER
type: prototype
title: Base Select Trigger is an accessible select-only combobox command
status: draft
since: 0.2.0-rc.0
summary: Trigger projects the collapsed select control, reports popup relationships, and submits pointer and keyboard open requests to Root.
statement:
  zh-CN: Select Trigger 是同域 Root 中至多一个的 focusable command。它投射 select-only combobox role、expanded/controls/disabled facts 与 content-derived name，并将 pointer、Enter、Space、ArrowDown、ArrowUp 的 open intent 提交到 Root；它不得拥有 open 或 selection。
  en: Select Trigger is the optional, at-most-one focusable command in the Root domain. It projects a select-only combobox role, expanded, controls, and disabled facts, and a content-derived name, and submits pointer, Enter, Space, ArrowDown, and ArrowUp open intent to Root; it must not own open state or selection.
criteria:
  - id: P-BASE-SELECT-TRIGGER-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-select-trigger` 与 `asSelectTrigger` 必须是同一 Trigger protocol 的 authoring entries。'
      en: '`base-select-trigger` and `asSelectTrigger` must be authoring entries for the same Trigger protocol.'
  - id: P-BASE-SELECT-TRIGGER-COMMAND
    text:
      zh-CN: Trigger 必须直接消费通用 Trigger 与 Focus 能力，发布 disabled/hovered/focused/focusVisible/pressed state，不得依赖 Base Button 获得自身语义。
      en: Trigger must directly consume generic Trigger and Focus capabilities, publish disabled, hovered, focused, focusVisible, and pressed state, and must not depend on Base Button for its semantics.
  - id: P-BASE-SELECT-TRIGGER-A11Y
    text:
      zh-CN: Trigger 必须投射 combobox role、content-derived name、expanded、listbox popup、disabled 与指向稳定 Content identity 的 controls relation。
      en: Trigger must project a combobox role, content-derived name, expanded state, listbox popup, disabled state, and a controls relation targeting stable Content identity.
  - id: P-BASE-SELECT-TRIGGER-REQUEST
    text:
      zh-CN: pointer activation 必须 toggle；Enter/Space 必须打开；ArrowDown/ArrowUp 必须阻止宿主默认滚动并以 selected-or-first/selected-or-last entry 请求打开，且每次物理交互只提交一次 request。
      en: Pointer activation must toggle, Enter and Space must open, and ArrowDown and ArrowUp must prevent host scrolling and request selected-or-first or selected-or-last entry, with one request per physical interaction.
  - id: P-BASE-SELECT-TRIGGER-DISABLED
    text:
      zh-CN: Trigger local disabled 或 Root disabled 必须同时抑制 focus participation、pointer commit 与 keyboard open request。
      en: Local Trigger disabled or Root disabled must suppress focus participation, pointer commit, and keyboard open requests together.
  - id: P-BASE-SELECT-TRIGGER-NO-SELECTION
    text:
      zh-CN: Trigger 不得因 open 或 navigation 改写 committed value；Value part 负责可见值回显，Root 负责 selection ownership。
      en: Trigger must not rewrite committed value because of open or navigation; Value owns visible value display and Root owns selection.
  - id: P-BASE-SELECT-TRIGGER-VIEW-LIFETIME
    text:
      en: A Trigger logical instance that survives view withdrawal must clear hovered and pressed state on unmount. Remount must not replay a prior pointer interaction or its downstream material deformation.
      zh-CN: Trigger logical instance 在 view 撤回后存活时，unmount 必须清除 hovered 与 pressed；remount 不得重放上一 view 的指针交互或下游材质形变。
sources:
  - path: packages/prototypes/base/src/select/trigger.proto.ts
  - path: packages/prototypes/base/src/select/command.ts
dependsOn:
  prototypes: [P-BASE-SELECT]
  contracts: [C-A11Y-0001, C-AS-FOCUSABLE-0001, C-AS-TRIGGER-0001]
verifies:
  {
    tests:
      [T-BASE-SELECT-TRIGGER-0001, { id: T-SELECT-DRAFT-PROJECTIONS-0001, since: 0.3.0-alpha.1 }],
  }
revisions:
  - version: 0.2.0-rc.0
    change: introduced
    summary: Cataloged Trigger command, a11y relationship, keyboard entry, disabled gating, and selection boundaries.
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Require clearing transient pointer state when a view unmounts while its logical Select Trigger survives.
tags: [prototype, base, select, trigger, combobox, keyboard, a11y]

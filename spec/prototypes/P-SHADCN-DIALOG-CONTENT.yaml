id: P-SHADCN-DIALOG-CONTENT
type: prototype
title: Shadcn Dialog Content inherits Base modal content and adds a narrowed animated panel surface
status: draft
since: 0.2.0-rc.0
summary: Shadcn Dialog Content inherits Base presence, focus, dismissal, controlled, and accessibility behavior, narrows its declared public Transition surface, and adds the current centered animated panel.
statement:
  zh-CN: >-
    Shadcn Dialog Content 是 `P-BASE-DIALOG-CONTENT` 之上的 direct part，保留 modal presence、focus trap/restore、dismiss、controlled 与 a11y relations，将 enter/leave 配置为 200ms，并增加居中 panel surface 与 fade/zoom。公开 props 当前为空，exposes 只声明 `open`、`transitionState`、`isPresent`；内部 inherited Transition capabilities 不构成稳定 Shadcn public API。upstream Content 内置 Portal、Overlay 与可选 Close button，而 Proto UI 将其拆分；`asChild` 明确不提供。


  en: >-
    Shadcn Dialog Content is a direct part over `P-BASE-DIALOG-CONTENT`. It retains modal presence, focus trap and restore, dismissal, controlled behavior, and accessibility relations, configures enter and leave to 200ms, and adds the centered panel surface with fade and zoom. Public props are currently empty and exposes declare only `open`, `transitionState`, and `isPresent`; internal inherited Transition capabilities are not stable Shadcn public API. Upstream Content composes Portal, Overlay, and an optional Close button while Proto UI separates them; `asChild` is explicitly unavailable.


criteria:
  - id: P-SHADCN-DIALOG-CONTENT-AVAILABLE
    text:
      en: 'The centered panel reserves at least one rem on each side of the available region, caps width at 32rem and permits internal vertical scrolling. This bounded geometry does not assert complete upstream composition or responsive-breakpoint parity.'
      zh-CN: '居中 panel 在可用区域四侧至少保留一 rem，宽度上限 32rem，允许内部纵向滚动。本有界几何不声称上游组合和响应式断点完全对齐。'
  - id: P-SHADCN-DIALOG-CONTENT-UPSTREAM-IDENTITY
    text:
      {
        zh-CN: Content 必须固定 upstream DialogContent revision/path 并明确其非官方 projection 身份。,
        en: Content must pin the upstream DialogContent revision and path and identify its unofficial projection status.,
      }
  - id: P-SHADCN-DIALOG-CONTENT-BASE-INHERITANCE
    text:
      {
        zh-CN: '`shadcn-dialog-content` 必须继承 `P-BASE-DIALOG-CONTENT` 并调用 `asDialogContent()`。',
        en: '`shadcn-dialog-content` must inherit `P-BASE-DIALOG-CONTENT` and call `asDialogContent()`.',
      }
    references:
      prototypes:
        - id: P-BASE-DIALOG-CONTENT
          anchors:
            [
              P-BASE-DIALOG-CONTENT-AUTHORING-ENTRIES,
              P-BASE-DIALOG-CONTENT-PRESENCE,
              P-BASE-DIALOG-CONTENT-FOCUS,
              P-BASE-DIALOG-CONTENT-DISMISS,
              P-BASE-DIALOG-CONTENT-A11Y-RELATIONS,
            ]
  - id: P-SHADCN-DIALOG-CONTENT-PUBLIC-BOUNDARY-DEVIATION
    text:
      {
        zh-CN: Shadcn public type surface 必须保持空 props，并只声明 open/transitionState/isPresent exposes；内部 inherited Transition capability 不得据此宣称为支持的 public API。,
        en: The Shadcn public type surface must keep empty props and declare only open,
        transitionState,
        and isPresent exposes; internal inherited Transition capability must not thereby be claimed as supported public API.,
      }
  - id: P-SHADCN-DIALOG-CONTENT-DIRECT-ENTRY
    text:
      {
        zh-CN: 当前 Content protocol 以 `shadcn-dialog-content` direct prototype 公开。,
        en: The current Content protocol is exposed as the `shadcn-dialog-content` direct prototype.,
      }
  - id: P-SHADCN-DIALOG-CONTENT-TRANSITION
    text:
      {
        zh-CN: Content 必须配置 enterDuration=200ms、leaveDuration=200ms，并按 open state 投射 fade/zoom enter/leave。,
        en: Content must configure enterDuration=200ms and leaveDuration=200ms and project fade and zoom enter and leave from open state.,
      }
  - id: P-SHADCN-DIALOG-CONTENT-CURRENT-VISUAL-SURFACE
    text:
      {
        zh-CN: Content 必须提供 fixed centered grid、width/max-width、gap、radius、border、background、padding、shadow、duration 与 outline tokens。,
        en: Content must provide fixed centered grid,
        width and max-width,
        gap,
        radius,
        border,
        background,
        padding,
        shadow,
        duration,
        and outline tokens.,
      }
  - id: P-SHADCN-DIALOG-CONTENT-COMPATIBILITY-SUBSET
    text:
      {
        zh-CN: 组合模型、showCloseButton、responsive width 与 public boundary 差异集中在唯一 open question。,
        en: Composition model,
        showCloseButton,
        responsive width,
        and public-boundary differences are centralized in one open question.,
      }
  - id: P-SHADCN-DIALOG-CONTENT-AS-CHILD-OMISSION
    text:
      {
        zh-CN: upstream Content props 中的 `asChild` 依共享决策省略。,
        en: Upstream Content `asChild` is omitted under the shared decision.,
      }
    dependsOn: { decisions: [D-AS-CHILD-OMISSION-0001] }
openQuestions:
  - id: P-SHADCN-DIALOG-CONTENT-Q-UPSTREAM-DIFFERENCES
    question:
      {
        zh-CN: Content composition、public boundary 与 exact panel parity 应如何收敛？,
        en: How should Content composition,
        public boundary,
        and exact panel parity converge?,
      }
    context:
      zh-CN: intentional deviations 是省略 `asChild` 与当前受限 public types。upstream Content 自动组合 Portal/Overlay，提供 `showCloseButton` 默认 true、内置 X/sr-only Close，使用 z-50、responsive max width；当前要求调用者组合独立 Mask/Close，可用区域减去两 rem 且上限 32rem（中间断点宽度仍不同）、额外 border-border。className/native/data-slot forwarding 及内部 controls 运行时可见性也待治理。
      en: Intentional deviations are omission of `asChild` and limited public types. Upstream Content composes Portal and Overlay, defaults showCloseButton to true, includes X and sr-only Close, and uses z-50 and responsive max width; current code requires separate Mask and Close, caps width at 32rem within the available region minus two rem (the intermediate responsive breakpoint remains different), and adds border-border. Forwarding and runtime visibility of internal controls also need governance.
    blocks: [activation:P-SHADCN-DIALOG-CONTENT]


  - path: packages/prototypes/shadcn/THIRD_PARTY_NOTICES.md
  - path: packages/prototypes/shadcn/test/card.test.ts
revisions:
  - version: 0.3.0-alpha.1
    change: refined
    summary: Project existing passive parts through bounded New York/Rhea shared scope and density; preserve native content ownership and explicit unsupported source features.
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added bounded four-part passive draft Card and real gallery consumption; no stable admission.

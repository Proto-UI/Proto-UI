    change: revised
    summary: Required Root visual intent to target the physical editor across wrapper-backed adapters.
  - version: 0.2.0-rc.7
    change: revised
    summary: Made physical materialization host-selected and kept system editing chrome outside the prototype boundary.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Cataloged Base Textarea as a focused host-mediated multiline text-control protocol with an initial Web profile.

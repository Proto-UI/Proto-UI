id: P-LIQUID-GLASS-ACCORDION-TRIGGER
type: prototype
title: liquid-glass Accordion trigger projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: 'Finf #872 的 draft 实现方向。稳定准入需要独立审查及当前浏览器/native、材质与 GPUI 证据；synthetic DOM 通过不等于九维完成。'
  en: 'Draft implementation direction for Finf #872. Stable admission requires independent review and current browser/native, material and GPUI evidence; synthetic DOM success is not nine-dimension completion.'
summary: Family-owned presentation consuming the corresponding Base Accordion atom.
statement:
  zh-CN: 此 Proto UI 独立投影原样消费对应 Base authoring entry，不安装另一选择、激活、焦点、heading或presence owner。
  en: This Proto UI authored presentation consumes the matching Base authoring entry unchanged. It does not install another selection, activation, focus, heading or presence owner.
criteria:
  - id: P-LIQUID-GLASS-ACCORDION-TRIGGER-INHERITANCE
    text:
      zh-CN: 调用 asAccordionTrigger 并保留Base JSON Props/exposes及lifecycle。
      en: Calls asAccordionTrigger and retains the Base JSON Props/exposes and lifecycle.
  - id: P-LIQUID-GLASS-ACCORDION-TRIGGER-STYLE
    text:
      zh-CN: 拥有本family tokens，支持最小宽度收缩、标签折行、正常内容流与溢出容纳；Trigger焦点与展开视觉派生自Base。不定高裁剪，不自建激活回调。
      en: Owns family tokens with min-width shrink safety, wrapping labels, normal content flow and overflow containment. Trigger focus and expanded visuals derive from Base. No fixed-height clipping or own activation callbacks.
  - id: P-LIQUID-GLASS-ACCORDION-TRIGGER-EVIDENCE
    text:
      en: The Trigger consumes explicit shared optical intent; actual rendering remains an opaque fallback where the host visual sink is unavailable. Full native optical/material and GPUI evidence remains required.
      zh-CN: Trigger 消费显式共享光学意图；宿主缺少 visual sink 时实际渲染仍为 opaque fallback。完整 native optical/material 与 GPUI 证据仍须完成。
  - id: P-LIQUID-GLASS-ACCORDION-TRIGGER-MATERIAL
    text:
      en: The Trigger declares one shared v2 rounded-rect/style in-app-backdrop slot with style-resolved fill/foreground fallback. Mutually exclusive Rules submit one liquid-glass candidate with Base pressed/rest deformation. It neither stacks a static candidate under the Rules nor substitutes adaptive-blur or infers a button profile. Missing host capability is diagnosed and remains opaque; intent/runtime evidence is not optical/native paint acceptance.
      zh-CN: Trigger 声明一个共享 v2 rounded-rect/style、in-app-backdrop slot，fill/foreground fallback 从 style 解析。互斥 Rules 消费 Base pressed/rest，并提交唯一 liquid-glass candidate；不叠加 static candidate，不换成 adaptive-blur，不推断 button profile。缺失宿主 capability 时诊断并保留 opaque；意图/runtime 证据不是光学/native paint 验收。
    dependsOn:
      contracts:
        - C-FEEDBACK-MATERIAL-0001
        - C-RULE-INTENT-FEEDBACK-MATERIAL-0001
inherits:
  prototypes:
    - P-BASE-ACCORDION-TRIGGER
dependsOn:
  contracts:
    - C-FEEDBACK-STYLE-0003
verifies:
  tests:
    - T-BASE-ACCORDION-0001
sources:
  - path: packages/prototypes/liquid-glass/src/accordion/trigger.proto.ts
  - path: packages/prototypes/liquid-glass/src/accordion/index.ts
  - path: packages/prototypes/liquid-glass/test/accordion-material.test.ts
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added the independent Base-consuming presentation, without claiming release or complete material/native parity.
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Bound the explicit optical intent consumer to Base pressed/rest with mandatory opaque fallback and no adaptive-native substitution.
tags:
  - prototype
  - liquid-glass
  - accordion

id: P-BOOTSTRAP-2-3-2-CALENDAR
type: prototype
title: Bootstrap 2.3.2 Calendar projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: >-
    Draft catalog relation for an implemented family projection against the pinned Bootstrap 2.3.2 vocabulary. Stable admission requires real consumers, browser/native evidence and independent review; source presence and private package availability are not release or conformance admission.


summary: Bootstrap Calendar family over P-BASE-CALENDAR with pinned vocabulary.
statement:
  en: >-
    The family parts each invoke their matching public Base hook exactly once and preserve the complete Base protocol. All ten parts exist in calendar.proto.ts: Root, Caption, Grid, Weekdays, Weekday, Row, Day, Heading, Previous and Next. Calendar is a Proto extension over pinned vocabulary; day, navigation and selection ownership stay with Base.


criteria:
  - id: P-BOOTSTRAP-2-3-2-CALENDAR-BASE
    text:
      en: >-
        Invoke asCalendar* hooks() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias, jQuery/plugin API or Base.setup call.


  - id: P-BOOTSTRAP-2-3-2-CALENDAR-VISUAL
    text:
      en: >-
        All ten parts exist in calendar.proto.ts: Root, Caption, Grid, Weekdays, Weekday, Row, Day, Heading, Previous and Next. Calendar is a Proto extension over pinned vocabulary; day, navigation and selection ownership stay with Base.


  - id: P-BOOTSTRAP-2-3-2-CALENDAR-EXTENSION
    text:
      en: >-
        Bootstrap 2.3.2 has no Calendar; this is a Proto design-language extension, not upstream parity.


  - id: P-BOOTSTRAP-2-3-2-CALENDAR-CLOSURE
    text:
      en: >-
        All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, Glyphicons, upstream JavaScript or Adapter component-name dispatch may supply default intent.


  - id: P-BOOTSTRAP-2-3-2-CALENDAR-BOUNDARY
    text:
      en: >-
        Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; the package is private and source-only. Catalog presence is a draft relation, not acceptance.


dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
inherits:
  prototypes:
    - P-BASE-CALENDAR
verifies:

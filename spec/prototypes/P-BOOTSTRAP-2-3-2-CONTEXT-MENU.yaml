id: P-BOOTSTRAP-2-3-2-CONTEXT-MENU
type: prototype
title: Bootstrap 2.3.2 Context Menu projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    en: Draft catalog relation for an implemented family projection against the pinned Bootstrap 2.3.2 vocabulary. Stable admission requires real consumers, browser/native evidence and independent review; source presence and private package availability are not release or conformance admission.
summary: Bootstrap Context Menu family over P-BASE-CONTEXT-MENU with pinned vocabulary.
statement:
    en: The family parts each invoke their matching public Base hook exactly once and preserve the complete Base protocol. Root/Trigger/Content/Item preserve context-menu opening and dismissal semantics with pinned dropdown-menu paint; ordinary click versus context-menu intent stays Base-owned.
criteria:
  - id: P-BOOTSTRAP-2-3-2-CONTEXT-MENU-BASE
    text:
            en: Invoke asContextMenu* hooks() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias, jQuery/plugin API or Base.setup call.
  - id: P-BOOTSTRAP-2-3-2-CONTEXT-MENU-VISUAL
    text:
            en: Root/Trigger/Content/Item preserve context-menu opening and dismissal semantics with pinned dropdown-menu paint; ordinary click versus context-menu intent stays Base-owned.
  - id: P-BOOTSTRAP-2-3-2-CONTEXT-MENU-CLOSURE
    text:
            en: All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, Glyphicons, upstream JavaScript or Adapter component-name dispatch may supply default intent.
  - id: P-BOOTSTRAP-2-3-2-CONTEXT-MENU-BOUNDARY
    text:
            en: Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; the package is private and source-only. Catalog presence is a draft relation, not acceptance.
dependsOn:
  contracts:

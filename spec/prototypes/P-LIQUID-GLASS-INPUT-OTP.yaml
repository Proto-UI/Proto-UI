id: P-LIQUID-GLASS-INPUT-OTP
type: prototype
title: Liquid Glass Input Otp projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native and material-host evidence plus independent review; source presence, private package availability and intent frames are not release, conformance or Apple-equivalence admission.
summary: Liquid Glass Input Otp family over P-BASE-INPUT-OTP.
statement:
  en: The family parts each invoke their matching public Base hook exactly once and preserve the complete Base protocol. Root/Input/Control/Slot/Separator preserve the single visible Base editor, filtering, completion and optional Field binding; nested parts do not each own an optical surface.
criteria:
  - id: P-LIQUID-GLASS-INPUT-OTP-BASE
    text:
      en: Invoke asInputOtp* hooks() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias or Base.setup call.
  - id: P-LIQUID-GLASS-INPUT-OTP-VISUAL
    text:
      en: 'Root/Input/Control/Slot/Separator preserve the single visible Base editor, filtering, completion and optional Field binding; nested parts do not each own an optical surface. Exact functional material clauses are provisional: real provider capability, missing-host opaque fallback and bounded source leases stay governed by the shared V2 material contract.'
  - id: P-LIQUID-GLASS-INPUT-OTP-CLOSURE
    text:
      en: All family appearance is authored through feedback tokens, typed material intent and Rules with explicit finite physical translation; no website-only CSS, private Apple asset or Adapter component-name dispatch may supply default intent, and explicit liquid-glass intent is never silently replaced by adaptive native blur.
  - id: P-LIQUID-GLASS-INPUT-OTP-BOUNDARY
    text:
      en: Exact-head browser, native, material-provider and Compiler evidence plus independent review remain open; the package is private and source-only. Apple documentation is a design reference, not implementation, asset or equivalence evidence. Catalog presence is a draft relation, not acceptance.
dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
inherits:
  prototypes:
    - P-BASE-INPUT-OTP
verifies:
  tests:
    - T-LIQUID-GLASS-CONTENT-SOURCE-0001
sources:
  - path: packages/prototypes/liquid-glass/src/input-otp/
  - path: packages/prototypes/liquid-glass/src/input-otp/index.ts
  - path: https://developer.apple.com/design/human-interface-guidelines/materials
    label: Apple HIG Materials design reference only
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Liquid Glass Input Otp projection cataloged as a draft family projection over the implemented source slice.
tags:

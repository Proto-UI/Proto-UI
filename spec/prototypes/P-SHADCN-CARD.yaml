id: P-SHADCN-CARD
type: prototype
title: Shadcn Card Root passive styled region
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Source-aligned styled-only draft under bounded user-authorized Finf work. Stable admission awaits independent review and exact-candidate native visual, first-frame and host evidence; source and harness tests do not complete a Finf goal.
summary: Passive four-part Card presentation with consumer-owned content semantics.
statement:
  en: This direct design-language surface has no Base Card counterpart and does not inherit Surface semantics. It follows the declared subset of shadcn/ui f31ed81983653919dd4fe77aee4b4859f610f1dc apps/v4/registry/new-york-v4/ui/card.tsx under its MIT notice. It is not an official shadcn component or a claim of complete upstream API compatibility.
criteria:
  - id: P-SHADCN-CARD-VISUAL
    text:
      en: Root owns flex column grouping, gap-6, rounded-xl, a one-pixel border with explicit border-border ink (the upstream global reset made self-contained), bg-card, py-6, text-card-foreground and shadow-sm. Card fill and ink resolve through independent card theme slots rather than page background/foreground tokens; matching default values do not alias those slots.
  - id: P-SHADCN-CARD-PASSIVE
    text:
      en: All four parts are roleless, non-focusable slots, with no interaction props, event handlers, semantic state, commands or exposed methods. Native anchors and independently semantic children keep their ownership.
  - id: P-SHADCN-CARD-ANATOMY
    text:
      en: Package root and /card export Root, Header, Content and Footer plus lowercase aliases and empty public props/exposes types; CLI facades and the public preview consume the same parts. No CardTitle, CardDescription, CardAction, asChild or Base Card contract is implied. These are public presentation parts, not a runtime Anatomy domain or an enforced cardinality grammar.
  - id: P-SHADCN-CARD-CONTENT
    text:
      en: Consumers retain native headings/paragraphs and may compose Text for title/body with tone inherit to preserve Card foreground. Muted captions/descriptions intentionally request muted tone. Card does not invent heading levels or accessibility roles.
dependsOn:
  contracts:

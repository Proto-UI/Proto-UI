id: P-SHADCN-DROPDOWN-MENU-CONTENT
type: prototype
title: Shadcn Dropdown Menu Content inherits Base menu overlay behavior and adds the base-nova draft animated surface
status: draft
since: 0.2.0-rc.0
summary: Shadcn Dropdown Menu Content inherits Base menu accessibility, overlay, presence, positioning, portal, keyboard, and dismissal behavior and adds current transition and surface styling.
statement:
  zh-CN: >-
    Shadcn Dropdown Menu Content 是 `P-BASE-DROPDOWN-MENU-CONTENT` 之上的 direct part，保留 menu a11y、overlay/presence、position/portal、keyboard navigation 与 dismiss behavior，将 Transition enter/leave 配置为 150ms/100ms，并增加当前 popover surface 与 open/closed/side animations。`asChild` 明确不提供。


  en: >-
    Shadcn Dropdown Menu Content is a direct part over `P-BASE-DROPDOWN-MENU-CONTENT`. It retains menu accessibility, overlay and presence, positioning and portal, keyboard navigation, and dismissal behavior, configures Transition enter and leave to 150ms and 100ms, and adds the current popover surface and open, closed, and side animations. `asChild` is explicitly unavailable.


criteria:
  - id: P-SHADCN-DROPDOWN-MENU-CONTENT-UPSTREAM-IDENTITY
    text:
      zh-CN: Content 必须沿用固定 Dropdown Menu revision/path 并明确其非官方 Proto UI projection 身份。
      en: Content must use the pinned Dropdown Menu revision and path and identify its unofficial Proto UI projection status.
  - id: P-SHADCN-DROPDOWN-MENU-CONTENT-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-dropdown-content` 必须继承 `P-BASE-DROPDOWN-MENU-CONTENT` 并调用 `asDropdownContent()`；任何负向补丁必须显式声明。'
      en: '`shadcn-dropdown-content` must inherit `P-BASE-DROPDOWN-MENU-CONTENT` and call `asDropdownContent()`; any negative patch must be declared explicitly.'
    references:
      prototypes:
        - id: P-BASE-DROPDOWN-MENU-CONTENT
          anchors:
            [
              P-BASE-DROPDOWN-MENU-CONTENT-AUTHORING-ENTRIES,
              P-BASE-DROPDOWN-MENU-CONTENT-OVERLAY,
              P-BASE-DROPDOWN-MENU-CONTENT-KEYBOARD,
              P-BASE-DROPDOWN-MENU-CONTENT-DISMISS,
            ]
  - id: P-SHADCN-DROPDOWN-MENU-CONTENT-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不反转 inherited a11y、overlay、presence、position、portal、keyboard 或 dismiss guarantee；Transition 配置和 styles 是具体化增量。
      en: The current implementation reverses no inherited accessibility, overlay, presence, positioning, portal, keyboard, or dismissal guarantee; Transition configuration and styles are specialization deltas.
  - id: P-SHADCN-DROPDOWN-MENU-CONTENT-DIRECT-ENTRY
    text:
      zh-CN: 当前 Content protocol 以 `shadcn-dropdown-content` direct prototype 公开。
      en: The current Content protocol is exposed as the `shadcn-dropdown-content` direct prototype.
  - id: P-SHADCN-DROPDOWN-MENU-CONTENT-TRANSITION
    text:
      zh-CN: Content 必须通过 inherited Transition handle 配置 enterDuration=100ms、leaveDuration=100ms，并在 leave 完成前保留 portaled surface。
      en: Content must configure enterDuration=100ms and leaveDuration=100ms through the inherited Transition handle and retain the portaled surface until leave completion.
  - id: P-SHADCN-DROPDOWN-MENU-CONTENT-CURRENT-VISUAL-SURFACE
    text:
      zh-CN: Content 必须提供当前 height/width constraints、overflow、popover colors、radius、border、padding、shadow、outline 与 duration tokens。
      en: Content must provide the current height and width constraints, overflow, popover colors, radius, border, padding, shadow, outline, and duration tokens.
  - id: P-SHADCN-DROPDOWN-MENU-CONTENT-OPEN-AND-SIDE-STYLES
    text:
      zh-CN: enter/leave fade、zoom 与四向 slide rules 必须从 inherited Transition/open state 与 side prop 派生。
      en: Enter and leave fade, zoom, and four-direction slide rules must derive from inherited Transition and open state and side prop.
  - id: P-SHADCN-DROPDOWN-MENU-CONTENT-COMPATIBILITY-SUBSET
    text:
      zh-CN: 已测试的 overlay、motion、position 与 surface 之外的差异集中在唯一 compatibility open question。
      en: Differences beyond tested overlay, motion, positioning, and surface are centralized in one compatibility open question.
  - id: P-SHADCN-DROPDOWN-MENU-CONTENT-AS-CHILD-OMISSION
    text:
      zh-CN: upstream Content props 中的 `asChild` 依共享决策有意省略。
      en: The `asChild` member of upstream Content props is intentionally omitted under the shared decision.
    dependsOn:
      decisions: [D-AS-CHILD-OMISSION-0001]
openQuestions:
  - id: P-SHADCN-DROPDOWN-MENU-CONTENT-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: Content 的 Portal、position、motion 与 exact token parity 应如何收敛？
      en: How should Content Portal, positioning, motion, and exact token parity converge?
    context:
      zh-CN: >-
        intentional deviation 是省略 `asChild`。待实现/待评审项包括 upstream 固定 Portal wrapper、sideOffset=4、data-slot、className/native props、Radix available-height/transform-origin vars，以及 data-state/data-side 映射。当前 proto variable、border-border、outline-none、transition-none、duration-150、150/100ms lifecycle 与 upstream CSS animation timing、motion reduction 的职责边界也需核对。


      en: >-
        The intentional deviation is omission of `asChild`. Gaps include the upstream fixed Portal wrapper, sideOffset=4, data-slot, className and native props, Radix available-height and transform-origin variables, and data-state or data-side mapping. The responsibility boundary among the current Proto variable, border-border, outline-none, transition-none, duration-150, 150/100ms lifecycle, upstream CSS animation timing, and motion reduction also needs review.


    blocks: [shadcn dropdown content parity roadmap]

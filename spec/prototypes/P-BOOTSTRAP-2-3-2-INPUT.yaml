id: P-BOOTSTRAP-2-3-2-INPUT
type: prototype
title: bootstrap-2-3-2 input root over Base
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: Draft all-Base coverage increment. Source/unit availability is not release, browser paint, Compiler or native conformance admission.
summary: A genuine asInputRoot projection; Base retains input semantics and this part contributes only appearance.
statement:
  en: The authored Prototype invokes asInputRoot once. A white compact field with 4px corners, 6px horizontal/4px vertical padding, normal 14/20 typography at a 16px root and the archived 7.5% inset shadow. A stronger focus-visible ring and scalable geometry are deliberate differences.
criteria:
  - id: P-BOOTSTRAP-2-3-2-INPUT-BASE
    text:
      en: Invoke asInputRoot once and retain every inherited state, event, focus, editing, context and anatomy owner; never copy the semantic implementation or introduce a competing value owner.
  - id: P-BOOTSTRAP-2-3-2-INPUT-API
    text:
      en: The projection preserves asInputRoot.modules and one host-owned single-line editor. Base owns stable controlledness, value/change/composition signals, hints, accessible naming and focus. Renderer returns null; no new input type, form or validation API is introduced.
  - id: P-BOOTSTRAP-2-3-2-INPUT-VISUAL
    text:
      en: A white compact field with 4px corners, 6px horizontal/4px vertical padding, normal 14/20 typography at a 16px root and the archived 7.5% inset shadow. A stronger focus-visible ring and scalable geometry are deliberate differences.
  - id: P-BOOTSTRAP-2-3-2-INPUT-CLOSURE
    text:
      en: All component appearance is declared by Prototype feedback and Rules and closes through the source-derived finite physical token renderer. No website-only component CSS may supply missing default intent.
  - id: P-BOOTSTRAP-2-3-2-INPUT-BOUNDARY
    text:
      en: The package is private and unreleased. Documentation and demos expose the real parts. Actual four-Web browser rendering, general Compiler and GPUI/Flutter/Qt conformance need separate collected evidence; source availability alone is insufficient.

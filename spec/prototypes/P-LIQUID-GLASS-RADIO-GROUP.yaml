id: P-LIQUID-GLASS-RADIO-GROUP
type: prototype
title: Liquid Glass Radio Group projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native and material-host evidence plus independent review; source presence, private package availability and intent frames are not release, conformance or Apple-equivalence admission.
summary: Radio Group Root over Base with family row paint; a Proto extension.
statement:
  en: The Prototype invokes asRadioGroupRoot() once; Base owns selection, collection and roving focus.
criteria:
  - id: P-LIQUID-GLASS-RADIO-GROUP-BASE
    text:
      en: Invoke asRadioGroupRoot() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias or Base.setup call.
  - id: P-LIQUID-GLASS-RADIO-GROUP-VISUAL
    text:
      en: 'Root establishes the group domain with neutral row paint; checked remains a non-color supplementary signal. Exact functional material clauses are provisional: real provider capability, missing-host opaque fallback and bounded source leases stay governed by the shared V2 material contract.'
  - id: P-LIQUID-GLASS-RADIO-GROUP-EXTENSION
    text:
      en: This custom control is a Proto design-language extension; no upstream radio-group widget or native-element API parity is claimed.
  - id: P-LIQUID-GLASS-RADIO-GROUP-CLOSURE
    text:
      en: All family appearance is authored through feedback tokens, typed material intent and Rules with explicit finite physical translation; no website-only CSS, private Apple asset or Adapter component-name dispatch may supply default intent, and explicit liquid-glass intent is never silently replaced by adaptive native blur.
  - id: P-LIQUID-GLASS-RADIO-GROUP-BOUNDARY
    text:
      en: Exact-head browser, native, material-provider and Compiler evidence plus independent review remain open; the package is private and source-only. Apple documentation is a design reference, not implementation, asset or equivalence evidence. Catalog presence is a draft relation, not acceptance.
dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
inherits:
  prototypes:
    - P-BASE-RADIO-GROUP
verifies:
  tests:
    - T-LIQUID-GLASS-DRAFT-CONTROL-0001
sources:
  - path: packages/prototypes/liquid-glass/src/radio-group/root.proto.ts
  - path: packages/prototypes/liquid-glass/src/radio-group/index.ts
  - path: https://developer.apple.com/design/human-interface-guidelines/materials
    label: Apple HIG Materials design reference only
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Liquid Glass Radio Group projection cataloged as a draft family projection over the implemented source slice.
tags:

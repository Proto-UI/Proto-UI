id: P-BRUTALIST-DIALOG-CONTENT
type: prototype
title: 'Brutalist Dialog Content inherits Base content and layers a hard-shadowed modal panel'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Dialog Content inherits Base Dialog Content open/transition ownership and projects a style-family visual API: a centered modal panel with component-owned depth, a 200ms fade-zoom transition, and an empty own-prop TypeScript consumer boundary.'

statement:
  en: P-BRUTALIST-DIALOG-CONTENT preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-DIALOG-CONTENT 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-DIALOG-CONTENT-AVAILABLE
    text:
      en: 'The centered panel reserves at least one rem on each side of the available region, caps width at 32rem and permits internal vertical scrolling. This bounded geometry does not assert complete upstream composition or responsive-breakpoint parity.'
      zh-CN: '居中 panel 在可用区域四侧至少保留一 rem，宽度上限 32rem，允许内部纵向滚动。本有界几何不声称上游组合和响应式断点完全对齐。'
  - id: P-BRUTALIST-DIALOG-CONTENT-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Dialog Content through `asDialogContent()` once and must not redefine Base open, transitionState, or isPresent protocol semantics. Visual projection may only consume the projected state handles.


      zh-CN: >-
        该 prototype 必须通过 `asDialogContent()` 一次性继承 Base Dialog Content，不得重定义 Base 的 open、transitionState 或 isPresent 协议语义；视觉投射只能消费投影出的 state handles。


  - id: P-BRUTALIST-DIALOG-CONTENT-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-dialog-content`.
      zh-CN: 直接 prototype 入口名为 `brutalist-dialog-content`。
  - id: P-BRUTALIST-DIALOG-CONTENT-PUBLIC-BOUNDARY
    text:
      en: >-
        The content declares no consumer props of its own. Its TypeScript exposes retain only `open`, `transitionState`, and `isPresent`; this declared consumer boundary does not require an adapter to erase Base Transition runtime plumbing from its internal bridge object.


      zh-CN: >-
        content 不声明自有消费者 props；其 TypeScript exposes 仅保留 `open`、`transitionState` 与 `isPresent`；该声明的消费者边界不要求 adapter 从其内部 bridge object 中擦除 Base Transition runtime plumbing。


  - id: P-BRUTALIST-DIALOG-CONTENT-TRANSITION
    text:
      en: >-
        The content configures its transition with `enterDuration: 200, leaveDuration: 200`. When open it applies `animate-in fade-in-0 zoom-in-95`; when open is false it applies `animate-out fade-out-0 zoom-out-95`. There is no side-based slide component.


      zh-CN: >-
        content 将其 transition 配置为 `enterDuration: 200, leaveDuration: 200`。open 时应用 `animate-in fade-in-0 zoom-in-95`；open 为 false 时应用 `animate-out fade-out-0 zoom-out-95`。无基于 side 的 slide 分量。


  - id: P-BRUTALIST-DIALOG-CONTENT-VISUAL-GRAMMAR
    text:
      en: >-
        The content uses BRUTALIST_PANEL_TOKENS: rounded-base (5px), border-2 border-black, bg-background/text-foreground, font-sans font-medium. Dialog adds a 4px 4px hard black shadow and retains prototype-owned fixed centering, 32rem width ceiling within the available region, grid gap-4 and p-6. Rounded children own their own radius; the parent must not globally zero or override child geometry.


      zh-CN: >-
        Content 使用 BRUTALIST_PANEL_TOKENS：rounded-base（5px）、border-2 border-black、bg-background/text-foreground、font-sans font-medium。Dialog 增加 4px 4px 黑色硬阴影，保留 prototype 自有 fixed 居中、32rem width ceiling within the available region、grid gap-4 与 p-6。圆角 child 各自拥有 radius；父级不得全局清零或覆盖 child 几何。



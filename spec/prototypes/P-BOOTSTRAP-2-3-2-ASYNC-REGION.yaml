id: P-BOOTSTRAP-2-3-2-ASYNC-REGION
type: prototype
title: Bootstrap 2.3.2 Async Region projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    en: Draft catalog relation for an implemented family projection against the pinned Bootstrap 2.3.2 vocabulary. Stable admission requires real consumers, browser/native evidence and independent review; source presence and private package availability are not release or conformance admission.
summary: Bootstrap 2.3.2 family projection of P-BASE-ASYNC-REGION.
statement:
    en: 'The Prototype invokes asAsyncRegionRoot() once, forwards modules and render, and preserves the exact Base protocol. Semantic-only: Base owns busy projection, descendants and focus; the family adds ordinary readable foreground with no loader widget or announcement owner.'
criteria:
  - id: P-BOOTSTRAP-2-3-2-ASYNC-REGION-BASE
    text:
            en: Invoke asAsyncRegionRoot() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias, jQuery/plugin API or Base.setup call.
  - id: P-BOOTSTRAP-2-3-2-ASYNC-REGION-VISUAL
    text:
            en: 'Semantic-only: Base owns busy projection, descendants and focus; the family adds ordinary readable foreground with no loader widget or announcement owner.'
  - id: P-BOOTSTRAP-2-3-2-ASYNC-REGION-CLOSURE
    text:
            en: All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, Glyphicons, upstream JavaScript or Adapter component-name dispatch may supply default intent.
  - id: P-BOOTSTRAP-2-3-2-ASYNC-REGION-BOUNDARY
    text:
            en: Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; the package is private and source-only. Catalog presence is a draft relation, not acceptance.

id: P-LIQUID-GLASS-SLIDER-VALUES
type: prototype
title: Liquid Glass Slider Values family projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native and material-host evidence plus independent review; source presence, private package availability and intent frames are not release, conformance or Apple-equivalence admission.
summary: Six indexed Slider Values parts as a separate multi-value family over the Base additive owner.
statement:
  en: The Prototypes invoke asSliderValuesRoot, asSliderValuesTrack, asSliderValuesThumb, asSliderValuesIndicator, asSliderValuesLabel and asSliderValuesValue once each. Values Root remains the sole unwrapped owner; Thumbs select sorted display slots and Track is structural. The scalar family is untouched.
criteria:
  - id: P-LIQUID-GLASS-SLIDER-VALUES-BASE
    text:
      en: Each of the six Values entries composes only with Values Root and preserves Base indexed mapping, controlled acceptance/refusal, vetoable proposals and immediate keyboard completion; no Values Thumb is a scalar-Thumb alias.
  - id: P-LIQUID-GLASS-SLIDER-VALUES-VISUAL
    text:
      en: 'Values Thumbs project selected segments and Root orientation/direction without installing pointer semantics; family paint maps real derived facts only. Exact functional material clauses are provisional: real provider capability, missing-host opaque fallback and bounded source leases stay governed by the shared V2 material contract.'
  - id: P-LIQUID-GLASS-SLIDER-VALUES-BOUNDARY
    text:
      en: 'Values Track stays structural: pointer origin/session association, grouped Field control, native input and Compiler translation remain open Base/host prerequisites recorded on P-BASE-SLIDER-VALUES, not closed here. Exact-head browser, native, material-provider and Compiler evidence plus independent review remain open; the package is private and source-only. Apple documentation is a design reference, not implementation, asset or equivalence evidence. Catalog presence is a draft relation, not acceptance.'
  - id: P-LIQUID-GLASS-SLIDER-VALUES-CLOSURE
    text:
      en: All family appearance is authored through feedback tokens, typed material intent and Rules with explicit finite physical translation; no website-only CSS, private Apple asset or Adapter component-name dispatch may supply default intent, and explicit liquid-glass intent is never silently replaced by adaptive native blur.
dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-SLIDER-VALUE-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
    - C-FEEDBACK-MATERIAL-0001
    - C-RULE-INTENT-FEEDBACK-MATERIAL-0001
inherits:
  prototypes:
    - P-BASE-SLIDER-VALUES
verifies:
  tests:
    - T-LIQUID-GLASS-SLIDER-VALUES-0001
    - T-SLIDER-VALUES-RUNTIME-0001
openQuestions:
  - id: P-LIQUID-GLASS-SLIDER-VALUES-Q-POINTER
    question:
      en: When do public pointer-origin/session association, grouped Field control and native/Compiler evidence admit the remaining Values scope?
    blocks:
      - activation:P-LIQUID-GLASS-SLIDER-VALUES

id: P-BASE-COLLAPSIBLE-TRIGGER
type: prototype
title: Base Collapsible Trigger is a same-domain disclosure button
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: Issue 388 接受了 button identity、自然 Tab、Enter/Space、disabled focus suppression 与 reusable controls 方向；保留 draft，等待四种 Web Adapter、direct/asHook consumer 与独立稳定准入审查。relationship contract 仍为 draft，合入其实现不构成本 Trigger 的 stable 保证。
  en: Issue 388 accepts button identity, natural Tab, Enter/Space, disabled focus suppression, and reusable controls. This entity remains draft pending four Web Adapter, direct/asHook consumer, and independent stable-admission review. The relationship contract remains draft; merging its implementation does not establish a stable Trigger guarantee.
summary: A button-like Trigger derives expanded and effective disabled from its Root domain, requests canonical toggle through portable press, and declares reusable exact-key controls without owning host identity.
statement:
  zh-CN: >-
    Collapsible Trigger 是 base-collapsible domain 内唯一 controlling part，而非 open owner。它使用 reusable activation/focus/accessibility 能力，消费 Root canonical open，派生 expanded 与 Root.disabled || Trigger.disabled。Enabled Trigger 保持自然 sequential focus，Enter/Space 或成功 pointer press 请求 toggle。两端显式 protocol key 'content' 由同域 relationship 服务解析；Trigger 不拼接宿主 ID 或维护 presence registry。


  en: >-
    Collapsible Trigger is the sole controlling part in a base-collapsible domain, not an open owner. It uses reusable activation/focus/accessibility capabilities, consumes Root canonical open, and derives expanded and Root.disabled || Trigger.disabled. Enabled Trigger remains naturally sequentially focusable; Enter/Space or successful pointer press requests toggle. Both endpoints declare the explicit protocol key 'content' for same-domain relationship resolution; Trigger constructs no host id and maintains no presence registry.


criteria:
  - id: P-BASE-COLLAPSIBLE-TRIGGER-A11Y
    text:
      zh-CN: Trigger 必须 claim base-collapsible trigger role，投射 button identity，并允许 accessible name 来自内容或宿主作者；它不得成为 open owner、tab 或 heading。
      en: Trigger must claim the base-collapsible trigger role, project button identity, and permit an accessible name from content or the host author; it must not become an open owner, tab, or heading.
    dependsOn:
      contracts: [C-ANATOMY-0004, C-A11Y-0001]
      prototypes: [P-BASE-COLLAPSIBLE]
  - id: P-BASE-COLLAPSIBLE-TRIGGER-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-collapsible-trigger` direct prototype（collapsibleTrigger）与 asCollapsibleTrigger 必须提供同一 Trigger protocol。'
      en: 'The base-collapsible-trigger direct prototype (collapsibleTrigger) and asCollapsibleTrigger must provide the same Trigger protocol.'
    dependsOn:
      contracts: [C-CORE-SYNTAX-0003, C-AS-HOOK-0001]
      decisions: [D-PROTOTYPE-ENTITY-NAMING-0001]
  - id: P-BASE-COLLAPSIBLE-TRIGGER-INDEPENDENCE
    text:
      zh-CN: Trigger 必须复用 portable activation、focus 与 accessibility 能力，不得消费 Button 或其他 Base protocol-specific asHook 作为实现依赖。
      en: Trigger must reuse portable activation, focus, and accessibility capabilities without consuming Button or another Base protocol-specific asHook as an implementation dependency.
    dependsOn:
      decisions: [D-BASE-PROTOTYPE-INDEPENDENCE-0001]
  - id: P-BASE-COLLAPSIBLE-TRIGGER-SAME-DOMAIN
    text:
      zh-CN: Trigger 必须消费同一 anatomy domain 的 COLLAPSIBLE_CONTEXT 并向该 Root 请求变化；嵌套或并列 Collapsible 的 open、disabled 与关系不得跨 domain 泄漏。
      en: Trigger must consume COLLAPSIBLE_CONTEXT from the same anatomy domain and request changes from that Root; open, disabled, and relationships must not leak across nested or sibling Collapsible domains.
    dependsOn:
      contracts: [C-ANATOMY-0005, C-CONTEXT-0002, C-CONTEXT-0006, C-CONTEXT-0007]
      prototypes: [P-BASE-COLLAPSIBLE]
  - id: P-BASE-COLLAPSIBLE-TRIGGER-EXPANDED
    text:
      zh-CN: Trigger 必须 expose expanded 并投射 expanded true/false（Web aria-expanded）；expanded 只能由 Root canonical open 派生，受控 request 本身不得改变它。
      en: Trigger must expose expanded and project expanded true/false (Web aria-expanded); expanded derives only from Root canonical open and must not change merely because a controlled request occurred.
    dependsOn:
      contracts: [C-STATE-0001, C-EXPOSE-STATE-0001, C-A11Y-0001]
  - id: P-BASE-COLLAPSIBLE-TRIGGER-DISABLED
    text:
      zh-CN: >-
        Trigger 必须接受 disabled?: boolean（默认 false），expose 并投射 effective disabled = Root.disabled || Trigger.disabled；effective disabled 必须抑制 press activation 与 Root request，不改写 canonical open 或 expanded。


      en: >-
        Trigger must accept disabled?: boolean (default false), expose and project effective disabled = Root.disabled || Trigger.disabled; effective disabled must suppress press activation and Root requests without rewriting canonical open or expanded.


    dependsOn:
      contracts: [C-PROPS-0001, C-STATE-INTERACTION-0001, C-A11Y-0001]
  - id: P-BASE-COLLAPSIBLE-TRIGGER-FOCUS
    text:
      zh-CN: Enabled Trigger 必须参与自然 Tab 顺序并 expose guarded focusSelf；effectively disabled Trigger 不得参与 sequential focus，focusSelf 不得绕过 disabled。Focus 本身不请求 toggle，也不自动把 focus 移入 Content。
      en: Enabled Trigger must participate in natural Tab order and expose guarded focusSelf; an effectively disabled Trigger must not participate in sequential focus, and focusSelf must not bypass disabled. Focus alone does not request toggle or automatically move focus into Content.
    dependsOn:
      contracts: [C-AS-FOCUSABLE-0001, C-STATE-INTERACTION-0001]
  - id: P-BASE-COLLAPSIBLE-TRIGGER-ACTIVATION
    text:
      zh-CN: Trigger 必须复用 portable asTrigger press lifecycle；只有成功 press.commit 才请求 Root toggle，pointer 与 Enter/Space 分别归一化为 pointer/keyboard reason。取消或未完成的 press 不得 toggle，同一次成功 activation 不得重复 toggle；focused Space keydown 必须阻止宿主默认滚动。
      en: Trigger must reuse the portable asTrigger press lifecycle; only successful press.commit requests Root toggle, with pointer and Enter/Space normalized to pointer/keyboard reasons. Cancelled or incomplete presses must not toggle, and one successful activation must not toggle twice; focused Space keydown must prevent the host's default scrolling.
    dependsOn:
      contracts: [C-AS-TRIGGER-0001, C-EVENT-TYPE-0001]
  - id: P-BASE-COLLAPSIBLE-TRIGGER-INTERACTION-EXPOSES
    text:
      zh-CN: Trigger 必须 expose hovered、pressed、focused 与 focusVisible transient states，由现有 hover/press/focus 能力管理；这些状态不得成为第二个 expanded/open truth 或替代 Root openChange。
      en: Trigger must expose hovered, pressed, focused, and focusVisible transient states managed by existing hover/press/focus capabilities; these states must not become a second expanded/open truth or replace Root openChange.
    dependsOn:
      contracts: [C-STATE-INTERACTION-0001, C-EXPOSE-STATE-0001]
  - id: P-BASE-COLLAPSIBLE-TRIGGER-RELATIONSHIP
    text:
      zh-CN: Trigger 必须显式声明 asAccessible.part(COLLAPSIBLE_FAMILY,{key:'content'})，以及 controls target {kind:'part',family:COLLAPSIBLE_FAMILY,role:'content',key:'content'}；key 是精确 protocol match key，不是宿主 id。Web controls 只能指向同域唯一且 materialized 的 Content；零或多个有效匹配 fail closed。
      en: "Trigger must explicitly declare asAccessible.part(COLLAPSIBLE_FAMILY,{key:'content'}) and controls target {kind:'part',family:COLLAPSIBLE_FAMILY,role:'content',key:'content'}. The key is an exact protocol match key, not a host id. Web controls may target only the unique materialized Content in the same domain; zero or multiple valid matches fail closed."
    dependsOn:
      contracts:
        - id: C-A11Y-PART-RELATIONSHIP-0001
          since: 0.3.0-alpha.1
          anchors:
            [
              C-A11Y-PART-RELATIONSHIP-0001-A,
              C-A11Y-PART-RELATIONSHIP-0001-B,
              C-A11Y-PART-RELATIONSHIP-0001-C,
            ]
      decisions: [D-A11Y-PART-RELATIONSHIP-PROJECTION-0001]
  - id: P-BASE-COLLAPSIBLE-TRIGGER-NO-HOST-IDENTITY
    text:
      zh-CN: Trigger 不得拼接、保存或将宿主 ID/node 写入 Props/State/Context，也不得维护本地 target 或 presence registry；reusable relationship 服务拥有 domain/epoch/lease cleanup，Adapter 拥有 opaque reserved identity，并保留宿主作者或其他 owner 的投射。
      en: Trigger must not construct, store, or copy host ids/nodes into Props/State/Context or maintain a local target or presence registry. The reusable relationship service owns domain/epoch/lease cleanup, the Adapter owns opaque reserved identity, and host-authored or independently owned projections remain preserved.
    dependsOn:
      contracts:
        - id: C-A11Y-PART-RELATIONSHIP-0001
          since: 0.3.0-alpha.1
          anchors:
            [
              C-A11Y-PART-RELATIONSHIP-0001-D,
              C-A11Y-PART-RELATIONSHIP-0001-F,
              C-A11Y-PART-RELATIONSHIP-0001-H,
              C-A11Y-PART-RELATIONSHIP-0001-I,
              C-A11Y-PART-RELATIONSHIP-0001-J,
            ]
  - id: P-BASE-COLLAPSIBLE-TRIGGER-KEYBOARD-BOUNDARY
    text:
      zh-CN: Trigger 只提供自然 sequential focus 与 Enter/Space activation；本 slice 不引入 orientation、loop、roving collection 或 Arrow/Home/End navigation，也不继承 Tabs activation/selection。
      en: Trigger provides natural sequential focus and Enter/Space activation only; this slice adds no orientation, loop, roving collection, or Arrow/Home/End navigation and inherits no Tabs activation/selection.
openQuestions:
  - id: P-BASE-COLLAPSIBLE-TRIGGER-Q-STABLE-ADMISSION
    question:
      zh-CN: 独立维护者何时在真实 keyboard/focus、effective disabled、same-domain relationship 与 consumer 证据审查后明确准入 Trigger 为 stable？
      en: When will an independent maintainer explicitly admit Trigger as stable after reviewing real keyboard/focus, effective-disabled, same-domain-relationship, and consumer evidence?
    context:
      zh-CN: focused Base 与四种 Web Adapter T mappings 已在 synthetic DOM 通过，public-browser mapping 尚未执行；这些结果、Issue 388 实现授权和 prerequisite 合入均不是稳定准入，draft dependency 不得描述为 active 保证。L1 逻辑保留不扩大为 detached host child 或 native view state 保留。
      en: Focused Base and four Web Adapter T mappings passed under a synthetic DOM; the public-browser mapping is unexecuted. These results, Issue 388 implementation authorization and merged prerequisites are not stable admission; draft dependencies must not be described as active guarantees. L1 logical preservation does not extend to detached host children or native view state.
    blocks: [activation:P-BASE-COLLAPSIBLE-TRIGGER]

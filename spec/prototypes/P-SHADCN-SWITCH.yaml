id: P-SHADCN-SWITCH
type: prototype
title: Shadcn Switch Root inherits Base Switch and adds the current track surface
status: draft
since: 0.2.0-rc.0
summary: Shadcn Switch Root is an unofficial Proto UI-maintained projection that inherits Base Switch root semantics and adds the currently implemented shadcn-style track and state-driven visual surface.
statement:
  en: This unofficial direct projection preserves all Base Switch on/off value, activation, focus, disabled, accessibility, context and checkedChange ownership. Its draft default-size presentation now uses the explicitly adopted shadcn/ui c2a67849be260701852b0977ba15eb5f3a0ce2a4 Base+Nova sources; the 2026-10-10 content-hashed registry snapshot and new-york reference remain historical evidence only. Public Root/Thumb composition and preset ownership are unchanged.
  zh-CN: 此非官方 direct projection 保留全部 Base Switch on/off value、activation、focus、disabled、accessibility、context 与 checkedChange owner。draft 默认尺寸呈现改用 本次明确采用的 shadcn/ui c2a67849be260701852b0977ba15eb5f3a0ce2a4 Base+Nova source；2026-10-10 registry 内容 hash 与 new-york 仅保留为历史证据；公开 Root/Thumb composition 与 preset owner 不变。

criteria:
  - id: P-SHADCN-SWITCH-UPSTREAM-IDENTITY
    text:
      en: The unofficial Proto UI projection pins the adopted c2a67849be260701852b0977ba15eb5f3a0ce2a4 Base+Nova source URLs and Git blob identities; registry retrieval dates and content hashes are historical evidence, not a second current pin. This implies no upstream ownership or endorsement.
      zh-CN: 非官方 Proto UI 投射在 sources 固定本次采用的 c2a67849be260701852b0977ba15eb5f3a0ce2a4 Base+Nova source URL 与 Git blob；registry 抓取日期与内容 hash 仅为历史证据，不构成第二现行 pin，不暗示上游所有权或认证。
  - id: P-SHADCN-SWITCH-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-switch-root` 必须通过 `inherits.prototypes` 指向 `P-BASE-SWITCH`，并通过 `asSwitchRoot()` 默认引入其 guarantee；若以 setup-only 负向补丁放弃或改写 Base 能力，必须在本实体中声明具体偏离和替代语义。'
      en: '`shadcn-switch-root` must point to `P-BASE-SWITCH` through `inherits.prototypes` and call `asSwitchRoot()` to introduce its guarantees by default; any setup-only negative patch that abandons or rewrites a Base capability must declare the exact deviation and replacement semantics in this entity.'
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            [
              P-BASE-SWITCH-AUTHORING-ENTRIES,
              P-BASE-SWITCH-ROOT-SEMANTIC-OWNER,
              P-BASE-SWITCH-NO-VISUAL-VARIANT-CORE,
            ]
    dependsOn:
      contracts: [C-AS-HOOK-0001, C-CORE-SYNTAX-0007]
  - id: P-SHADCN-SWITCH-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不对 `asSwitchRoot()` 引入的 value、activation、focus、disabled、a11y、context、interaction state 或 outward signal 施加负向补丁；style rules 构成视觉增量；staticHitInset 只扩展同一语义 Root 的 acquisition，不增加 value owner。
      en: The current implementation applies no negative patch to value, activation, focus, disabled, accessibility, context, interaction state, or outward signals introduced by `asSwitchRoot()`; its style rules are visual deltas and staticHitInset expands acquisition on the same semantic Root without adding a value owner.
  - id: P-SHADCN-SWITCH-DIRECT-ENTRY
    text:
      zh-CN: 当前 Root protocol 以 `shadcn-switch-root` direct prototype 公开；本层不额外提供 authored asHook。
      en: The current Root protocol is exposed as the `shadcn-switch-root` direct prototype; this layer provides no additional authored asHook.
    dependsOn:
      contracts: [C-CORE-SYNTAX-0003]
  - id: P-SHADCN-SWITCH-CURRENT-VISUAL-SURFACE
    text:
      en: Default Root projects relative inline-flex h-[18.4px] w-[32px] shrink-0 items-center rounded-full border border-transparent p-0 bg-input outline-none. It has no shadow, extra padding, hover tint or press scale. The Web scoped border-box baseline preserves the 32px outer width and 18.4px outer height without a global reset; Thumb owns its translation. Resident background-color timing is declared through C-FEEDBACK-RESIDENT-MOTION-0001; the Website static light/dark palette is generated from the same canonical SHADCN_THEME_CSS with live source validation; user overrides without matching typed facts settle. Actual consumer browser evidence and native/Compiler realization remain independent gates. The fixed upstream track dimensions remain px at root font sizes 16px and 32px; do not replace width with w-8 or height with h-[1.15rem]. Thumb size-4 remains rem and its large-font used geometry requires separate evidence. The smaller upstream size is not admitted by this slice.
      zh-CN: 默认 Root 投射 relative inline-flex h-[18.4px] w-[32px] shrink-0 items-center rounded-full border border-transparent p-0 bg-input outline-none，无阴影、额外内边距、hover tint 或 press scale。Web scoped border-box 在无全局 reset 时保持32px外宽与18.4px外高；位移由 Thumb 所有。固定上游轨道尺寸在root font为16px和32px时均保留px，不得替换为w-8或h-[1.15rem]；Thumb size-4仍为rem，其大字体used geometry须另验。本片不准入上游 smaller size。
    dependsOn:
      contracts: [C-RULE-INTENT-FEEDBACK-STYLE-0001]
      decisions:
        - id: D-WEB-STYLE-BASELINE-0001
          since: 0.2.0-rc.1
  - id: P-SHADCN-SWITCH-STATIC-ACQUISITION
    text:
      en: Root declares physical padding-box staticHitInset of 0.5rem top/bottom and 0.75rem left/right through the existing HitParticipation owner. The ordinary border box remains hittable. Native clipping, overlap order, disabled state, focus, cancellation and child-control arbitration are preserved; no extra semantic element or upstream label-coordination claim is introduced. This is independent of movement compensation.
      zh-CN: Root 通过既有 HitParticipation owner 声明相对 padding-box 的静态命中扩展：上下0.5rem、左右0.75rem，保留原 border-box 命中；原生裁切、重叠顺序、disabled、focus、cancel与子控件仲裁继续有效，不增语义节点或声称上游label联动；与movement补偿独立。
    dependsOn:
      contracts:
        - id: C-HIT-PARTICIPATION-0001
          since: 0.3.0-alpha.1
  - id: P-SHADCN-SWITCH-STATE-DRIVEN-STYLES
    text:
      en: Checked projects bg-primary. Unchecked uses bg-input, or bg-input/80 in dark colorScheme. Inherited focusVisible projects border-ring ring-3 ring-ring/50 without an added ring offset; disabled retains pointer-events-none opacity-50 and adds cursor-not-allowed. State and metadata are inherited only; hover and press retain Base behavior without adding source-absent visual effects.
      zh-CN: checked 投射 bg-primary；unchecked 为 bg-input，dark colorScheme下为 bg-input/80。继承 focusVisible 投射 border-ring ring-3 ring-ring/50，不增加 ring offset；disabled 保留 pointer-events-none opacity-50 并加 cursor-not-allowed。仅消费继承状态与metadata；hover/press 保留 Base 行为，不增加源码没有的视觉效果。
    dependsOn:
      contracts: [C-RULE-WHEN-0002, C-RULE-INTENT-FEEDBACK-STYLE-0001]
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            [
              P-BASE-SWITCH-CHECKED-EXPOSE,
              P-BASE-SWITCH-POINTER-HOVER,
              P-BASE-SWITCH-PRESS-LIFECYCLE,
              P-BASE-SWITCH-FOCUSABLE,
              P-BASE-SWITCH-DISABLED-EXPOSE,
            ]
  - id: P-SHADCN-SWITCH-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前实体只声明已实现并测试的 inherited behavior、Root/Thumb 协作和视觉 surface；相对固定 upstream baseline 的全部差异必须集中在唯一 compatibility open question，并区分 intentional deviation 与 parity gap。
      en: This entity claims only implemented and tested inherited behavior, Root/Thumb coordination, and visual surface; every difference from the pinned upstream baseline must be centralized in one compatibility open question and classified as an intentional deviation or parity gap.
  - id: P-SHADCN-SWITCH-AS-CHILD-OMISSION
    text:
      zh-CN: upstream Root props 中的 `asChild` 依 `D-AS-CHILD-OMISSION-0001` 有意不进入 API，任何元素投射或事件组合均不得被宣称为 Radix Slot 等价实现。
      en: The `asChild` member of upstream Root props is intentionally omitted under `D-AS-CHILD-OMISSION-0001`; no element projection or event composition may be claimed as a Radix Slot equivalent.
    dependsOn:
      decisions: [D-AS-CHILD-OMISSION-0001]
  - id: P-SHADCN-SWITCH-COMPONENT-PRESET
    text:
      zh-CN: Prototype library 必须在 Switch 组件目录的 preset recipe 中声明 Root/Thumb identity、`direct-child` placement 与替换策略，并通过 `component-presets` 聚合 surface 提供给 CLI；CLI 只消费受检查的生成投影并在保留 raw Root/Thumb facades 的同时生成 `ShadcnSwitch` convenience preset。未提供 Thumb 时物化一个同适配器默认 Thumb，显式兼容 Thumb 必须替换默认值，显式关闭必须不物化 Thumb，且所有候选解析必须先于该 part 挂载并在 Root context 已建立后连接。Preset recipe 不得声明或覆盖视觉 tokens。
      en: The prototype library must declare Root and Thumb identity, `direct-child` placement, and replacement policy in a preset recipe colocated with the Switch component and expose it through the aggregate `component-presets` surface. The CLI consumes only a checked generated projection and generates the `ShadcnSwitch` convenience preset alongside raw Root and Thumb facades. An absent Thumb materializes one same-adapter default Thumb, an explicit compatible Thumb replaces it, explicit omission materializes no Thumb, and all candidates must resolve before that part mounts and connect after the Root context exists. The preset recipe must neither declare nor override visual tokens.
    dependsOn:
      decisions:
        - id: D-COMPONENT-PRESET-MATERIALIZATION-0001
          since: 0.2.0-rc.3
openQuestions:
  - id: P-SHADCN-SWITCH-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: 相较固定 shadcn/ui Switch baseline，当前全部差异分别是有意偏离还是待实现 gap，应按什么顺序收敛？
      en: Against the pinned shadcn/ui Switch baseline, which current differences are intentional deviations versus implementation gaps, and in what order should the gaps converge?
    context:
      en: This bounded migration implements only the default-size recipe. Upstream sm size, field-label coordination, invalid styling, className/native prop forwarding, data-slot/data-size, form props and callback naming remain gaps or semantic exclusions. Existing disabled pointer suppression and explicit Root/Thumb facade/preset composition are retained Proto UI differences. Fresh source, CSS and real-browser evidence are independent gates.
      zh-CN: 本限定迁移只实现默认尺寸 recipe；上游 sm、field-label联动、invalid样式、className/native prop forwarding、data-slot/data-size、form props与callback命名仍为缺口或语义排除。既有 disabled pointer suppression、显式Root/Thumb facade/preset composition为保留的Proto UI差异；新source、CSS与真实浏览器证据分别验收。

    blocks: [shadcn switch parity roadmap]
  - id: P-SHADCN-SWITCH-Q-HIT-ENVELOPE
    question:
      en: How can the 32 by 18.4px visual recipe retain at least the existing activation target through a governed cross-host hit envelope?
      zh-CN: 32×18.4px视觉recipe如何通过受治理的跨宿主hit envelope至少保留现有activation target？
    context:
      en: The owner-directed source-size correction implements the 32 by 18.4px visual recipe rather than retaining the historical 44 by 24px size. Root now declares governed staticHitInset (top/bottom 0.5rem, left/right 0.75rem) via C-HIT-PARTICIPATION-0001; relative Root with after:-inset-x-3 and after:-inset-y-2 expands the padding-box interaction region independently of layout. This same-root static acquisition preserves the ordinary border box and expands from the padding box; clipping, overlap order, disabled behavior, focus, cancellation and nested controls remain owned by native input routing. It creates no extra semantic control and adds no label-coordination claim. Existing hit-envelope-translate-1 is movement compensation and must not be repurposed. Keep consumer activation acceptance blocked until its own exact-version browser hit tests are completed; visual recipe tests alone do not close it.
      zh-CN: 按用户要求实现32×18.4px源尺寸，不再保留历史44×24px掩盖差异。上游relative Root配after:-inset-x-3与after:-inset-y-2，独立于布局扩大padding-box交互区；Root现声明staticHitInset上下0.5rem、左右0.75rem，同一语义节点承接native命中、裁切、重叠、disabled、focus/cancel与嵌套控件，不新增控件或声称label联动。不得挪用movement-only hit-envelope-translate-1。该消费者自身固定版本真实命中验证完成前，activation验收继续阻塞，视觉recipe测试不等于关闭缺口。
    blocks:
      - activation:P-SHADCN-SWITCH
      - criterion:P-SHADCN-SWITCH#P-SHADCN-SWITCH-CURRENT-VISUAL-SURFACE

  - version: 0.2.0-rc.3
    change: expanded
    summary: Added a CLI-materialized convenience preset with replaceable or omittable default Thumb while preserving raw facades.
  - version: 0.2.0-rc.5
    change: revised
    summary: Moved checked position changes from asymmetric Root padding to the Thumb's inherited checked-state translation and required context-safe preset mounting.
  - version: 0.2.0-rc.6
    change: revised
    summary: Corrected final Thumb geometry and moved the explicit direct-child preset recipe beside the Switch prototypes.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Migrated only draft presentation to content-pinned base-nova; retained Base and public anatomy ownership; fresh runtime/CSS/browser evidence remains required.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Adopt the fixed 2026-10-12 New York default rem recipe, shadow and unexpanded hit box; retain explicit sm, motion and native evidence gaps.
  - version: 0.3.0-alpha.1
    change: expanded
    summary: Define Shadcn-only default/sm visual sizing through actual Switch-domain Root Expose reads and Context invalidation, including mixed-family isolation and repeatable lifecycle.

id: P-SHADCN-SWITCH
type: prototype
title: Shadcn Switch Root inherits Base Switch and adds the current track surface
status: draft
since: 0.2.0-rc.0
summary: Shadcn Switch Root is an unofficial Proto UI-maintained projection that inherits Base Switch root semantics and adds the currently implemented shadcn-style track and state-driven visual surface.
statement:
  en: This unofficial direct projection preserves all Base Switch value, activation, focus, disabled, accessibility, context and checkedChange ownership. The current default/sm visual target is shadcn/ui 02cad61166c4c20edbc8a3f71bd720eed4c1f49b apps/v4/registry/new-york-v4/ui/switch.tsx. Older Base+Nova sources remain historical evidence only. Public Root/Thumb composition and preset ownership are unchanged.
  zh-CN: 此非官方投射保留全部 Base Switch value、activation、focus、disabled、accessibility、context 与 checkedChange owner。现行默认/sm尺寸视觉目标为 shadcn/ui 02cad61166c4c20edbc8a3f71bd720eed4c1f49b 的 apps/v4/registry/new-york-v4/ui/switch.tsx；旧 Base+Nova 仅保留历史证据，公开 Root/Thumb composition 与 preset owner 不变。
criteria:
  - id: P-SHADCN-SWITCH-UPSTREAM-IDENTITY
    text:
      en: Use the fixed New York source URL and content identity in sources as the current target; old Nova URLs are historical evidence, not alternative current baselines. This implies no upstream endorsement.
      zh-CN: 以 sources 中固定 New York URL 和内容身份为现行目标；旧 Nova URL 是历史证据，不是并列现行基线，也不暗示上游认证。
  - id: P-SHADCN-SWITCH-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-switch-root` 必须通过 `inherits.prototypes` 指向 `P-BASE-SWITCH`，并通过 `asSwitchRoot()` 默认引入其 guarantee；若以 setup-only 负向补丁放弃或改写 Base 能力，必须在本实体中声明具体偏离和替代语义。'
      en: '`shadcn-switch-root` must point to `P-BASE-SWITCH` through `inherits.prototypes` and call `asSwitchRoot()` to introduce its guarantees by default; any setup-only negative patch that abandons or rewrites a Base capability must declare the exact deviation and replacement semantics in this entity.'
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            [
              P-BASE-SWITCH-AUTHORING-ENTRIES,
              P-BASE-SWITCH-ROOT-SEMANTIC-OWNER,
              P-BASE-SWITCH-NO-VISUAL-VARIANT-CORE,
            ]
    dependsOn:
      contracts: [C-AS-HOOK-0001, C-CORE-SYNTAX-0007]
  - id: P-SHADCN-SWITCH-CURRENT-BASE-DEVIATIONS
    text:
      en: No negative patch is applied to Base value, activation, focus, disabled, accessibility, context, interaction states or outward signals. Family style rules remain visual deltas.
      zh-CN: 不对 Base value、activation、focus、disabled、a11y、context、交互状态或 outward signals 施加负向补丁；家族 style rules 仍是视觉增量。
  - id: P-SHADCN-SWITCH-DIRECT-ENTRY
    text:
      zh-CN: 当前 Root protocol 以 `shadcn-switch-root` direct prototype 公开；本层不额外提供 authored asHook。
      en: The current Root protocol is exposed as the `shadcn-switch-root` direct prototype; this layer provides no additional authored asHook.
    dependsOn:
      contracts: [C-CORE-SYNTAX-0003]
  - id: P-SHADCN-SWITCH-CURRENT-VISUAL-SURFACE
    text:
      en: Default Root uses inline-flex h-[1.15rem] w-8 shrink-0 items-center rounded-full border border-transparent p-0 shadow-xs bg-input outline-none. Preserve source rem units; declarations correspond to 32 by 18.4 at root 16px and 64 by 36.8 at root 32px, without claiming rendered measurement. No extra hover tint or press scale is added. Scoped border-box and select-none are retained host-baseline extensions. Existing resident background-color motion remains governed by C-FEEDBACK-RESIDENT-MOTION-0001; full upstream transition-all interpolation is not implemented. The sm Root uses h-3.5 w-6 (0.875rem by 1.5rem) through the owner-bound visual size protocol below.
      zh-CN: 默认 Root 使用 inline-flex h-[1.15rem] w-8 shrink-0 items-center rounded-full border border-transparent p-0 shadow-xs bg-input outline-none。保留 rem；声明值对应根字体16px时32×18.4、32px时64×36.8，不等于实测。无额外hover着色或press缩放；保留scoped border-box与select-none宿主基线扩展。既有resident background-color动画继续受C-FEEDBACK-RESIDENT-MOTION-0001治理，尚未完整实现transition-all。sm Root使用h-3.5 w-6（0.875rem×1.5rem），按下述owner-bound视觉尺寸协议协调。
    dependsOn:
      contracts: [C-RULE-INTENT-FEEDBACK-STYLE-0001]
      decisions:
        - id: D-WEB-STYLE-BASELINE-0001
          since: 0.2.0-rc.1
  - id: P-SHADCN-SWITCH-STATIC-ACQUISITION
    text:
      en: The current New York wrapper declares no pseudo-element hit inset. This family Root must not configure the historical Nova staticHitInset by default. Keep generic HitParticipation capability unchanged and preserve native border-box input, clipping, overlap, disabled, focus and cancellation ownership. Consumer activation evidence must be regenerated for this exact recipe.
      zh-CN: 现行New York wrapper没有伪元素命中扩展，本家族Root默认不得配置历史Nova staticHitInset。通用HitParticipation能力不变，保留原生命中、裁切、重叠、disabled、focus/cancel所有权；此确切recipe须重新取得消费者命中证据。
    dependsOn:
      contracts:
        - id: C-HIT-PARTICIPATION-0001
          since: 0.3.0-alpha.1
  - id: P-SHADCN-SWITCH-STATE-DRIVEN-STYLES
    text:
      en: Checked projects bg-primary. Unchecked uses bg-input, or bg-input/80 in dark colorScheme. Inherited focusVisible projects border-ring ring-3 ring-ring/50 without an added ring offset; disabled retains pointer-events-none opacity-50 and adds cursor-not-allowed. State and metadata are inherited only; hover and press retain Base behavior without adding source-absent visual effects.
      zh-CN: checked 投射 bg-primary；unchecked 为 bg-input，dark colorScheme下为 bg-input/80。继承 focusVisible 投射 border-ring ring-3 ring-ring/50，不增加 ring offset；disabled 保留 pointer-events-none opacity-50 并加 cursor-not-allowed。仅消费继承状态与metadata；hover/press 保留 Base 行为，不增加源码没有的视觉效果。
    dependsOn:
      contracts: [C-RULE-WHEN-0002, C-RULE-INTENT-FEEDBACK-STYLE-0001]
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            [
              P-BASE-SWITCH-CHECKED-EXPOSE,
              P-BASE-SWITCH-POINTER-HOVER,
              P-BASE-SWITCH-PRESS-LIFECYCLE,
              P-BASE-SWITCH-FOCUSABLE,
              P-BASE-SWITCH-DISABLED-EXPOSE,
            ]
  - id: P-SHADCN-SWITCH-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前实体只声明已实现并测试的 inherited behavior、Root/Thumb 协作和视觉 surface；相对固定 upstream baseline 的全部差异必须集中在唯一 compatibility open question，并区分 intentional deviation 与 parity gap。
      en: This entity claims only implemented and tested inherited behavior, Root/Thumb coordination, and visual surface; every difference from the pinned upstream baseline must be centralized in one compatibility open question and classified as an intentional deviation or parity gap.
  - id: P-SHADCN-SWITCH-AS-CHILD-OMISSION
    text:
      zh-CN: upstream Root props 中的 `asChild` 依 `D-AS-CHILD-OMISSION-0001` 有意不进入 API，任何元素投射或事件组合均不得被宣称为 Radix Slot 等价实现。
      en: The `asChild` member of upstream Root props is intentionally omitted under `D-AS-CHILD-OMISSION-0001`; no element projection or event composition may be claimed as a Radix Slot equivalent.
    dependsOn:
      decisions: [D-AS-CHILD-OMISSION-0001]
  - id: P-SHADCN-SWITCH-COMPONENT-PRESET
    text:
      zh-CN: Prototype library 必须在 Switch 组件目录的 preset recipe 中声明 Root/Thumb identity、`direct-child` placement 与替换策略，并通过 `component-presets` 聚合 surface 提供给 CLI；CLI 只消费受检查的生成投影并在保留 raw Root/Thumb facades 的同时生成 `ShadcnSwitch` convenience preset。未提供 Thumb 时物化一个同适配器默认 Thumb，显式兼容 Thumb 必须替换默认值，显式关闭必须不物化 Thumb，且所有候选解析必须先于该 part 挂载并在 Root context 已建立后连接。Preset recipe 不得声明或覆盖视觉 tokens。
      en: The prototype library must declare Root and Thumb identity, `direct-child` placement, and replacement policy in a preset recipe colocated with the Switch component and expose it through the aggregate `component-presets` surface. The CLI consumes only a checked generated projection and generates the `ShadcnSwitch` convenience preset alongside raw Root and Thumb facades. An absent Thumb materializes one same-adapter default Thumb, an explicit compatible Thumb replaces it, explicit omission materializes no Thumb, and all candidates must resolve before that part mounts and connect after the Root context exists. The preset recipe must neither declare nor override visual tokens.
    dependsOn:
      decisions:
        - id: D-COMPONENT-PRESET-MATERIALIZATION-0001
          since: 0.2.0-rc.3
  - id: P-SHADCN-SWITCH-VISUAL-SIZE-PROP
    text:
      en: Only Shadcn Root accepts size default or sm, defaulting to default when absent. Its family-owned getVisualSize Expose method returns the normalized resolved size. Missing size resets to default; provided-empty or invalid enum input follows C-PROPS-0009 (including previous-valid fallback), not a family-specific raw-Props bypass. Size changes change only appearance and never checked, disabled, focus, activation or checkedChange. Base Root and Thumb gain no visual prop, state or guarantee.
      zh-CN: 仅Shadcn Root接受size default或sm，省略时为default。家族自有getVisualSize Expose方法返回规范化resolved尺寸。移除size时回退default；显式empty或非法enum遵循C-PROPS-0009（含previous-valid fallback），不以家族raw Props绕过。size变化只影响外观，不改变checked、disabled、focus、activation或checkedChange；Base Root/Thumb不新增视觉prop、state或guarantee。
    dependsOn:
      contracts: [C-PROPS-0009]
  - id: P-SHADCN-SWITCH-VISUAL-SIZE-OWNER
    text:
      en: Shadcn Thumb resolves the actual current root in its inherited SWITCH_FAMILY anatomy domain and reads only that Root's explicit getVisualSize capability. A missing capability or unknown result yields default. Structural detach or retirement clears derived size to default; this does not relax strict missing-domain queries or inherited required Base Context diagnostics. A Shadcn visual Context size value is an invalidation signal only, never owner authority; an outer Shadcn sm Root must not size a Thumb owned by an inner Base or another styled Switch Root claiming SWITCH_FAMILY. No identity tokens, host targets or functions travel through Context, and no DOM selector or host ancestry access substitutes for logical Anatomy resolution.
      zh-CN: Shadcn Thumb解析继承SWITCH_FAMILY当前domain中的实际Root，仅读取该Root显式getVisualSize能力。能力缺失或返回未知值时为default；结构detach/retirement时清除派生尺寸为default，不放宽strict missing-domain query或继承的Base required Context诊断。Shadcn视觉Context的size值只触发重新读取，不代表owner；外层Shadcn sm Root不得影响内层Base或其他同样claim SWITCH_FAMILY的styled Switch Root所拥有的Thumb。Context不传identity token、host target或函数，不以DOM selector/host ancestry取代逻辑Anatomy解析。
    dependsOn:
      contracts:
        [C-ANATOMY-0001, C-ANATOMY-0005, C-ANATOMY-0009, C-ANATOMY-ORDER-0003, C-CONTEXT-0011]
  - id: P-SHADCN-SWITCH-VISUAL-SIZE-LIFECYCLE
    text:
      en: Root initializes size before descendant mounting and publishes size invalidation on Props changes. Every Thumb resolves its current owner on mount, update, relevant Anatomy membership change and visual Context notification; it never trusts a cached former owner or notification payload. View detach clears derived visual size, remount re-reads current ownership, and terminal disposal releases module-owned subscriptions. Multiple Thumbs derive independently. Default, replacement and omitted preset parts preserve this protocol without a second visual owner. Native, browser and compiler realization remain separate evidence gates.
      zh-CN: Root在后代挂载前初始化size，Props变化时发布尺寸失效通知。每个Thumb在mount、update、相关Anatomy membership变化与视觉Context通知时重新解析当前owner，不信任旧owner缓存或通知payload。view detach清除派生尺寸，remount重读当前owner，terminal dispose释放module自有订阅。多个Thumb独立派生；preset默认、替换、省略均不新增视觉owner。native、browser与compiler实现仍须分别验收。
openQuestions:
  - id: P-SHADCN-SWITCH-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: 相较固定 shadcn/ui Switch baseline，当前全部差异分别是有意偏离还是待实现 gap，应按什么顺序收敛？
      en: Against the pinned shadcn/ui Switch baseline, which current differences are intentional deviations versus implementation gaps, and in what order should the gaps converge?
    context:
      en: Default and sm appearance use the Shadcn-owned logical-root size protocol above; its implementation and rendered evidence must be verified separately. Root transition-all spans more channels than current resident motion supports. className/native prop forwarding, data-slot/data-size, form props and callback naming remain gaps or semantic exclusions. The fixed New York wrapper has no invalid-state recipe or field-label selector, so those are not missing source paint. Disabled pointer suppression, scoped baseline and explicit Root/Thumb preset composition remain disclosed Proto UI extensions. Source, CSS, real-browser and native evidence remain independent gates.
      zh-CN: default与sm外观遵循上述Shadcn自有逻辑Root尺寸协议；其实现与渲染证据须分别验证。Root transition-all超出现有resident motion通道；className/native forwarding、data-slot/data-size、form props与callback命名仍为缺口或语义排除。固定NY wrapper没有invalid或field-label样式，不能伪报为缺失源paint。disabled pointer suppression、scoped baseline及公开Root/Thumb preset仍是已披露Proto扩展。source、CSS、真实浏览器与native证据分别验收。
    blocks: [shadcn switch parity roadmap]
  - id: P-SHADCN-SWITCH-Q-HIT-ENVELOPE
    question:
      en: Does the exact New York default recipe preserve correct native border-box activation and accessibility at both root font sizes?
      zh-CN: 确切New York默认recipe在两种根字体下是否保持正确原生border-box激活与可访问性？
    context:
      en: Historical Nova expanded-hit acceptance cannot validate the new source profile. Regenerate pointer, touch, disabled, focus and clipping evidence without claiming an expanded hit region. Generic staticHitInset remains available to consumers that actually declare it.
      zh-CN: 历史Nova扩展命中证据不能验收新profile；须重测pointer、touch、disabled、focus与裁切，不声称扩展命中区。通用staticHitInset仍供实际声明它的消费者使用。
    blocks: [activation:P-SHADCN-SWITCH]

id: P-SHADCN-SWITCH
type: prototype
title: Shadcn Switch Root inherits Base Switch and adds the current track surface
status: draft
since: 0.2.0-rc.0
summary: Shadcn Switch Root is an unofficial Proto UI-maintained projection that inherits Base Switch root semantics and adds the currently implemented shadcn-style track and state-driven visual surface.
statement:
  en: This unofficial direct projection preserves all Base Switch on/off value, activation, focus, disabled, accessibility, context and checkedChange ownership. Its draft default-size presentation now uses the content-pinned 2026-10-10 base-nova Switch registry snapshot in sources, replacing the historical new-york reference without inferring a Git revision. Public Root/Thumb composition and preset ownership are unchanged.
  zh-CN: 此非官方 direct projection 保留全部 Base Switch on/off value、activation、focus、disabled、accessibility、context 与 checkedChange owner。draft 默认尺寸呈现改用 sources 中以内容 hash 固定的 2026-10-10 base-nova Switch registry snapshot，替换历史 new-york 参考，不推断 Git revision；公开 Root/Thumb composition 与 preset owner 不变。

criteria:
  - id: P-SHADCN-SWITCH-UPSTREAM-IDENTITY
    text:
      en: The unofficial Proto UI projection must pin the base-nova registry URL, retrieval date and content hashes in sources, without inferring upstream ownership, endorsement or Git revision.
      zh-CN: 非官方 Proto UI 投射必须在 sources 固定 base-nova registry URL、抓取日期与内容 hash，不推断上游所有权、认证或 Git revision。
  - id: P-SHADCN-SWITCH-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-switch-root` 必须通过 `inherits.prototypes` 指向 `P-BASE-SWITCH`，并通过 `asSwitchRoot()` 默认引入其 guarantee；若以 setup-only 负向补丁放弃或改写 Base 能力，必须在本实体中声明具体偏离和替代语义。'
      en: '`shadcn-switch-root` must point to `P-BASE-SWITCH` through `inherits.prototypes` and call `asSwitchRoot()` to introduce its guarantees by default; any setup-only negative patch that abandons or rewrites a Base capability must declare the exact deviation and replacement semantics in this entity.'
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            [
              P-BASE-SWITCH-AUTHORING-ENTRIES,
              P-BASE-SWITCH-ROOT-SEMANTIC-OWNER,
              P-BASE-SWITCH-NO-VISUAL-VARIANT-CORE,
            ]
    dependsOn:
      contracts: [C-AS-HOOK-0001, C-CORE-SYNTAX-0007]
  - id: P-SHADCN-SWITCH-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不对 `asSwitchRoot()` 引入的 value、activation、focus、disabled、a11y、context、interaction state 或 outward signal 施加负向补丁；新增 style rules 仅构成视觉增量。
      en: The current implementation applies no negative patch to value, activation, focus, disabled, accessibility, context, interaction state, or outward signals introduced by `asSwitchRoot()`; its added style rules are visual deltas only.
  - id: P-SHADCN-SWITCH-DIRECT-ENTRY
    text:
      zh-CN: 当前 Root protocol 以 `shadcn-switch-root` direct prototype 公开；本层不额外提供 authored asHook。
      en: The current Root protocol is exposed as the `shadcn-switch-root` direct prototype; this layer provides no additional authored asHook.
    dependsOn:
      contracts: [C-CORE-SYNTAX-0003]
  - id: P-SHADCN-SWITCH-CURRENT-VISUAL-SURFACE
    text:
      en: Default Root projects inline-flex h-[18.4px] w-8 shrink-0 items-center rounded-full border border-transparent p-0 bg-input transition-all outline-none. It has no shadow, extra padding, hover tint or press scale. The Web scoped border-box baseline preserves the 32px outer width and 18.4px outer height without a global reset; Thumb owns its translation. The smaller upstream size is not admitted by this slice.
      zh-CN: 默认 Root 投射 inline-flex h-[18.4px] w-8 shrink-0 items-center rounded-full border border-transparent p-0 bg-input transition-all outline-none，无阴影、额外内边距、hover tint 或 press scale。Web scoped border-box 在无全局 reset 时保持32px外宽与18.4px外高；位移由 Thumb 所有。本片不准入上游 smaller size。
    dependsOn:
      contracts: [C-RULE-INTENT-FEEDBACK-STYLE-0001]
      decisions:
        - id: D-WEB-STYLE-BASELINE-0001
          since: 0.2.0-rc.1
  - id: P-SHADCN-SWITCH-STATE-DRIVEN-STYLES
    text:
      en: Checked projects bg-primary. Unchecked uses bg-input, or bg-input/80 in dark colorScheme. Inherited focusVisible projects border-ring ring-3 ring-ring/50 without an added ring offset; disabled retains pointer-events-none opacity-50 and adds cursor-not-allowed. State and metadata are inherited only; hover and press retain Base behavior without adding source-absent visual effects.
      zh-CN: checked 投射 bg-primary；unchecked 为 bg-input，dark colorScheme下为 bg-input/80。继承 focusVisible 投射 border-ring ring-3 ring-ring/50，不增加 ring offset；disabled 保留 pointer-events-none opacity-50 并加 cursor-not-allowed。仅消费继承状态与metadata；hover/press 保留 Base 行为，不增加源码没有的视觉效果。
    dependsOn:
      contracts: [C-RULE-WHEN-0002, C-RULE-INTENT-FEEDBACK-STYLE-0001]
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            [
              P-BASE-SWITCH-CHECKED-EXPOSE,
              P-BASE-SWITCH-POINTER-HOVER,
              P-BASE-SWITCH-PRESS-LIFECYCLE,
              P-BASE-SWITCH-FOCUSABLE,
              P-BASE-SWITCH-DISABLED-EXPOSE,
            ]
  - id: P-SHADCN-SWITCH-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前实体只声明已实现并测试的 inherited behavior、Root/Thumb 协作和视觉 surface；相对固定 upstream baseline 的全部差异必须集中在唯一 compatibility open question，并区分 intentional deviation 与 parity gap。
      en: This entity claims only implemented and tested inherited behavior, Root/Thumb coordination, and visual surface; every difference from the pinned upstream baseline must be centralized in one compatibility open question and classified as an intentional deviation or parity gap.
  - id: P-SHADCN-SWITCH-AS-CHILD-OMISSION
    text:
      zh-CN: upstream Root props 中的 `asChild` 依 `D-AS-CHILD-OMISSION-0001` 有意不进入 API，任何元素投射或事件组合均不得被宣称为 Radix Slot 等价实现。
      en: The `asChild` member of upstream Root props is intentionally omitted under `D-AS-CHILD-OMISSION-0001`; no element projection or event composition may be claimed as a Radix Slot equivalent.
    dependsOn:
      decisions: [D-AS-CHILD-OMISSION-0001]
  - id: P-SHADCN-SWITCH-COMPONENT-PRESET
    text:
      zh-CN: Prototype library 必须在 Switch 组件目录的 preset recipe 中声明 Root/Thumb identity、`direct-child` placement 与替换策略，并通过 `component-presets` 聚合 surface 提供给 CLI；CLI 只消费受检查的生成投影并在保留 raw Root/Thumb facades 的同时生成 `ShadcnSwitch` convenience preset。未提供 Thumb 时物化一个同适配器默认 Thumb，显式兼容 Thumb 必须替换默认值，显式关闭必须不物化 Thumb，且所有候选解析必须先于该 part 挂载并在 Root context 已建立后连接。Preset recipe 不得声明或覆盖视觉 tokens。
      en: The prototype library must declare Root and Thumb identity, `direct-child` placement, and replacement policy in a preset recipe colocated with the Switch component and expose it through the aggregate `component-presets` surface. The CLI consumes only a checked generated projection and generates the `ShadcnSwitch` convenience preset alongside raw Root and Thumb facades. An absent Thumb materializes one same-adapter default Thumb, an explicit compatible Thumb replaces it, explicit omission materializes no Thumb, and all candidates must resolve before that part mounts and connect after the Root context exists. The preset recipe must neither declare nor override visual tokens.
    dependsOn:
      decisions:
        - id: D-COMPONENT-PRESET-MATERIALIZATION-0001
          since: 0.2.0-rc.3
openQuestions:
  - id: P-SHADCN-SWITCH-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: 相较固定 shadcn/ui Switch baseline，当前全部差异分别是有意偏离还是待实现 gap，应按什么顺序收敛？
      en: Against the pinned shadcn/ui Switch baseline, which current differences are intentional deviations versus implementation gaps, and in what order should the gaps converge?
    context:
      en: This bounded migration implements only the default-size recipe. Upstream sm size, field-label coordination, expanded pseudo-element hit target, invalid styling, className/native prop forwarding, data-slot/data-size, form props and callback naming remain gaps or semantic exclusions. Existing disabled pointer suppression and explicit Root/Thumb facade/preset composition are retained Proto UI differences. Fresh source, CSS and real-browser evidence are independent gates.
      zh-CN: 本限定迁移只实现默认尺寸 recipe；上游 sm、field-label联动、pseudo-element扩大命中区、invalid样式、className/native prop forwarding、data-slot/data-size、form props与callback命名仍为缺口或语义排除。既有 disabled pointer suppression、显式Root/Thumb facade/preset composition为保留的Proto UI差异；新source、CSS与真实浏览器证据分别验收。

    blocks: [shadcn switch parity roadmap]
  - id: P-SHADCN-SWITCH-Q-HIT-ENVELOPE
    question:
      en: How can the 32 by 18.4px visual recipe retain at least the existing activation target through a governed cross-host hit envelope?
      zh-CN: 32×18.4px视觉recipe如何通过受治理的跨宿主hit envelope至少保留现有activation target？
    context:
      en: The current Root remains 44 by 24px. Shrinking it directly would reduce the pointer target; the upstream expanded pseudo-element hit area is not implemented. Existing hit-envelope-translate-1 is movement compensation, not a general static target-size capability, and must not be repurposed. Keep this draft target unimplemented and fresh evidence planned until the owning host/style capability is governed and validated.
      zh-CN: 当前Root仍44×24px，直接缩小会减小pointer target；上游expanded pseudo-element hit area未实现。既有hit-envelope-translate-1是movement补偿，不是一般静态target-size能力，不得挪用。相关host/style能力治理并验证前，此draft目标保持未实施且新证据planned。
    blocks:
      - activation:P-SHADCN-SWITCH
      - criterion:P-SHADCN-SWITCH#P-SHADCN-SWITCH-CURRENT-VISUAL-SURFACE

id: P-BASE-SWITCH
type: prototype
title: Base Switch is a root-owned on/off value control
status: draft
since: 0.1.0
summary: Base Switch is the base prototype protocol for a focusable on/off value control whose root owns a persistent checked state, toggles that state through activation, may include indicator parts such as a thumb, and emits a `checkedChange` outward signal when the checked value changes.
statement:
  zh-CN: >-
    Base Switch 是一个可聚焦、可禁用、由 root 拥有语义与状态的 on/off value control。它展示一个持久二值状态，并在成功 activation 后切换到相反状态，向 App Maker 发出名为 `checkedChange` 的 outward signal。`base-switch-root` direct prototype 与 `asSwitchRoot` authored asHook 是同一 Switch root protocol 的两个 authoring entries；Switch 可包含 thumb / indicator 等 anatomy part，但这些 part 不拥有 activation 或 value 语义。


  en: >-
    Base Switch is a focusable, disable-able on/off value control whose root owns the semantics and state. It displays a persistent binary state, flips to the opposite state after successful activation, and emits an outward signal named `checkedChange` to the App Maker. The `base-switch-root` direct prototype and the `asSwitchRoot` authored asHook are two authoring entries of the same Switch root protocol; Switch may include anatomy parts such as thumb or indicator, but those parts do not own activation or value semantics.


anatomy:
  family: base-switch
  roles:
    root:
      cardinality:
        min: 1
        max: 1
      summary:
        zh-CN: Switch 的 semantic owner、value owner 与 anatomy domain anchor。
        en: Switch semantic owner, value owner, and anatomy domain anchor.
    thumb:
      cardinality:
        min: 0
        max: '*'
      summary:
        zh-CN: 可选且可重复的 same-domain indicator，不拥有 activation 或 value 语义。
        en: Optional and repeatable same-domain indicator that does not own activation or value semantics.
  relations:
    - kind: contains
      parent: root
      child: thumb
criteria:
  - id: P-BASE-SWITCH-ROLE-ON-OFF-VALUE
    text:
      zh-CN: Switch 表示一个 on/off value control，而不是触发离散 action 的 command control。
      en: Switch represents an on/off value control rather than a command control that triggers a discrete action.
    dependsOn:
      knowledge:
        - K-COMPONENT-INTERACTION-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-ROLE-COMMAND
          note: Switch contrasts with Button command semantics.
  - id: P-BASE-SWITCH-DISPLAY-AND-INPUT
    text:
      zh-CN: Switch 同时承担状态展示与状态输入责任；它只展示符合开关语义的持久二值状态。
      en: Switch is both a state display and a state input; it displays only persistent binary state that fits switch semantics.
    dependsOn:
      knowledge:
        - K-COMPONENT-INTERACTION-0001
  - id: P-BASE-SWITCH-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-switch-root` direct prototype 与 `asSwitchRoot` authored asHook 是同一 Switch root protocol 的两个 authoring entries。'
      en: 'The `base-switch-root` direct prototype and the `asSwitchRoot` authored asHook are two authoring entries of the same Switch root protocol.'
    dependsOn:
      contracts:
        - C-CORE-SYNTAX-0003
        - C-AS-HOOK-0001
      decisions:
        - D-PROTOTYPE-ENTITY-NAMING-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-AUTHORING-ENTRIES
  - id: P-BASE-SWITCH-PROTOCOL-INDEPENDENCE
    text:
      zh-CN: Switch 不应通过消费 Button 或 Toggle 这类其他基础原型的 protocol-specific authored asHook 获得自身核心语义。
      en: Switch should not obtain its own core semantics by consuming protocol-specific authored asHooks from other base prototypes such as Button or Toggle.
    dependsOn:
      decisions:
        - D-BASE-PROTOTYPE-INDEPENDENCE-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-AUTHORING-ENTRIES
  - id: P-BASE-SWITCH-ROOT-SEMANTIC-OWNER
    text:
      zh-CN: Switch root 是 Switch protocol 的 semantic owner，负责持有 checked/on-off state、处理 activation、对外 expose 状态与 signal。
      en: Switch root is the semantic owner of the Switch protocol and owns checked/on-off state, activation handling, exposed state, and outward signals.
    dependsOn:
      contracts:
        - C-ANATOMY-0005
        - C-EXPOSE-STATE-0001
        - C-EXPOSE-EVENT-0001
  - id: P-BASE-SWITCH-ANATOMY-FAMILY
    text:
      zh-CN: Switch anatomy family 的 canonical structure 由顶层 `anatomy` 字段定义；anatomy 不得创建 part 或注入行为。
      en: The canonical structure of the Switch anatomy family is defined by the top-level `anatomy` field; anatomy must not create parts or inject behavior.
    dependsOn:
      contracts:
        - C-ANATOMY-0001
        - C-ANATOMY-0002
        - C-ANATOMY-0004
  - id: P-BASE-SWITCH-FAMILY-ROLES
    text:
      zh-CN: Switch anatomy family 第一轮必须至少定义 `root` 与 `thumb` roles。
      en: The first Switch anatomy family must define at least the `root` and `thumb` roles.
    dependsOn:
      contracts:
        - C-ANATOMY-0002
        - C-ANATOMY-0004
  - id: P-BASE-SWITCH-ROOT-DOMAIN-ANCHOR
    text:
      zh-CN: Switch root 必须 claim Switch anatomy family 的 root role，并作为同一 Switch domain 的作用域锚点。
      en: Switch root must claim the root role of the Switch anatomy family and act as the scope anchor for the same Switch domain.
    dependsOn:
      contracts:
        - C-ANATOMY-0004
        - C-ANATOMY-0005
  - id: P-BASE-SWITCH-ROOT-CARDINALITY
    text:
      zh-CN: Switch anatomy family 中 `root` role 的 cardinality 必须是 `1..1`。
      en: The `root` role cardinality in the Switch anatomy family must be `1..1`.
    dependsOn:
      contracts:
        - C-ANATOMY-0002
        - C-ANATOMY-0005
  - id: P-BASE-SWITCH-THUMB-INDICATOR
    text:
      zh-CN: Switch thumb 若作为官方 part 存在，只能作为 same-domain indicator 反映 root 的 checked/on-off state，不得拥有 activation 或 value 语义。
      en: If Switch thumb exists as an official part, it may only reflect the root checked/on-off state as a same-domain indicator and must not own activation or value semantics.
    dependsOn:
      contracts:
        - C-ANATOMY-0008
        - C-ANATOMY-0009
        - C-EXPOSE-STATE-0001
  - id: P-BASE-SWITCH-THUMB-CARDINALITY
    text:
      zh-CN: Switch anatomy family 中 `thumb` role 的 cardinality 必须是 `0..*`；thumb 是可选且可重复的 indicator。
      en: The `thumb` role cardinality in the Switch anatomy family must be `0..*`; thumb is an optional and repeatable indicator.
    dependsOn:
      contracts:
        - C-ANATOMY-0002
        - C-ANATOMY-0005
  - id: P-BASE-SWITCH-ROOT-CONTAINS-THUMB
    text:
      zh-CN: Switch anatomy family 必须声明 `root contains thumb` 的结构关系。
      en: The Switch anatomy family must declare the `root contains thumb` structural relation.
    dependsOn:
      contracts:
        - C-ANATOMY-0002
        - C-ANATOMY-0005
  - id: P-BASE-SWITCH-THUMB-NOT-TARGET
    text:
      zh-CN: Switch thumb 不应成为独立 event target；activation route 属于 Switch root。
      en: Switch thumb should not become an independent event target; the activation route belongs to Switch root.
    dependsOn:
      contracts:
        - C-EVENT-TYPE-0001
        - C-ANATOMY-0001
  - id: P-BASE-SWITCH-TRACK-DEFERRED
    text:
      zh-CN: Switch track 是否成为官方 anatomy role 或独立 part protocol 暂缓；第一轮 core protocol 不要求 `base-switch-track`。
      en: Whether Switch track becomes an official anatomy role or independent part protocol is deferred; the first core protocol does not require `base-switch-track`.
    dependsOn:
      knowledge:
        - K-PROTOTYPE-COMPOSITION-0001
  - id: P-BASE-SWITCH-PROP-CHECKED
    text:
      zh-CN: 'Switch root 必须接受 `checked?: boolean` props input，用于受控 checked/on-off state。'
      en: 'Switch root must accept a `checked?: boolean` props input for controlled checked/on-off state.'
    dependsOn:
      contracts:
        - C-PROPS-0001
        - C-PROPS-0003
  - id: P-BASE-SWITCH-PROP-DEFAULT-CHECKED
    text:
      zh-CN: 'Switch root 必须接受 `defaultChecked?: boolean` props input，用于非受控初始 checked/on-off state，默认值为 `false`。'
      en: 'Switch root must accept a `defaultChecked?: boolean` props input for uncontrolled initial checked/on-off state whose default is `false`.'
    dependsOn:
      contracts:
        - C-PROPS-0001
        - C-PROPS-0003
  - id: P-BASE-SWITCH-CONTROLLED-CHECKED
    text:
      zh-CN: 当 App Maker 提供或更新 `checked` props input 时，Switch 必须以该 input 同步 root checked/on-off state。
      en: When the App Maker provides or updates the `checked` props input, Switch must synchronize the root checked/on-off state from that input.
    dependsOn:
      contracts:
        - C-PROPS-0001
        - C-STATE-0001
        - C-EXPOSE-STATE-0001
  - id: P-BASE-SWITCH-PROP-DISABLED
    text:
      zh-CN: 'Switch root 必须接受 `disabled?: boolean` props input，默认值为 `false`。'
      en: 'Switch root must accept a `disabled?: boolean` props input whose default is `false`.'
    dependsOn:
      contracts:
        - C-PROPS-0001
        - C-PROPS-0003
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-PROP-DISABLED
  - id: P-BASE-SWITCH-PROP-NO-EVENT-CALLBACK
    text:
      zh-CN: Switch props 不包含 `onCheckedChange` 之类事件回调；Switch value change 通过 expose event 发出 `checkedChange` signal。
      en: Switch props do not include event callbacks such as `onCheckedChange`; Switch value changes emit the `checkedChange` signal through expose event.
    dependsOn:
      contracts:
        - C-PROPS-0001
        - C-EXPOSE-EVENT-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-PROP-NO-EVENT-CALLBACK
  - id: P-BASE-SWITCH-CHECKED-EXPOSE
    text:
      zh-CN: Switch root 必须 expose `checked` state；`checked=true` 表示 on，`checked=false` 表示 off。
      en: Switch root must expose `checked` state; `checked=true` means on, and `checked=false` means off.
    dependsOn:
      contracts:
        - C-STATE-0001
        - C-EXPOSE-STATE-0001
        - C-A11Y-0001
  - id: P-BASE-SWITCH-DISABLED-EXPOSE
    text:
      zh-CN: Switch root 必须 expose `disabled` state。
      en: Switch root must expose `disabled` state.
    dependsOn:
      contracts:
        - C-STATE-INTERACTION-0001
        - C-EXPOSE-STATE-0001
        - C-A11Y-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-DISABLED-EXPOSE
  - id: P-BASE-SWITCH-NO-MIXED-STATE
    text:
      zh-CN: Switch core checked/on-off state 不支持 mixed 或 indeterminate；这类三态语义不属于 Base Switch protocol。
      en: Switch core checked/on-off state does not support mixed or indeterminate values; tri-state semantics do not belong to the Base Switch protocol.
    dependsOn:
      contracts:
        - C-STATE-0001
        - C-A11Y-0001
  - id: P-BASE-SWITCH-CONTEXT-KEY
    text:
      zh-CN: Switch protocol 必须定义稳定的 ContextKey（例如 `SWITCH_CONTEXT` / `base-switch`），作为同一 Switch domain 内 root 与官方 anatomy parts 的协作身份。
      en: Switch protocol must define a stable ContextKey, such as `SWITCH_CONTEXT` / `base-switch`, as the coordination identity for the root and official anatomy parts in the same Switch domain.
    dependsOn:
      contracts:
        - C-CONTEXT-0001
        - C-CONTEXT-0003
  - id: P-BASE-SWITCH-CONTEXT-PROVIDE
    text:
      zh-CN: Switch root 必须在 setup 期间 provide Switch context scope，并以 root 所属 Switch domain 作为该 context scope 的归属边界。
      en: Switch root must provide the Switch context scope during setup and use the Switch domain owned by the root as that context scope's ownership boundary.
    dependsOn:
      contracts:
        - C-CONTEXT-0002
        - C-CONTEXT-0005
        - C-ANATOMY-0005
  - id: P-BASE-SWITCH-CONTEXT-VALUE
    text:
      zh-CN: 'Switch context value 顶层必须是 JSON object，且至少包含 `checked: boolean` 与 `disabled: boolean`。'
      en: 'The Switch context value must be a top-level JSON object and must contain at least `checked: boolean` and `disabled: boolean`.'
    dependsOn:
      contracts:
        - C-CONTEXT-0009
        - C-STATE-0001
        - C-STATE-INTERACTION-0001
  - id: P-BASE-SWITCH-CONTEXT-SYNC
    text:
      zh-CN: 当 root 的 checked 或 disabled state 变化时，Switch root 必须同步更新 Switch context value 中对应字段。
      en: When the root checked or disabled state changes, Switch root must synchronize the corresponding fields in the Switch context value.
    dependsOn:
      contracts:
        - C-CONTEXT-0008
        - C-EXPOSE-STATE-0001
  - id: P-BASE-SWITCH-PART-CONTEXT-CONSUME
    text:
      zh-CN: Switch 官方 indicator part 应通过 Switch context 读取或订阅 root state；不得通过复制 root props 或推断宿主 DOM 状态获得 Switch 协作信息。
      en: Official Switch indicator parts should read or subscribe to root state through Switch context; they must not obtain Switch coordination information by copying root props or inferring host DOM state.
    dependsOn:
      contracts:
        - C-CONTEXT-0006
        - C-CONTEXT-0007
        - C-ANATOMY-0008
  - id: P-BASE-SWITCH-TRIGGER-SEMANTICS
    text:
      zh-CN: Switch root 必须通过官方 trigger 能力处理 activation route，但不得依赖 Button protocol 来获得 Switch 语义。
      en: Switch root must process its activation route through the official trigger capability, but must not depend on the Button protocol to obtain Switch semantics.
    dependsOn:
      contracts:
        - C-AS-TRIGGER-0001
        - C-EVENT-TYPE-0001
        - C-EVENT-TYPE-0002
      decisions:
        - D-BASE-PROTOTYPE-INDEPENDENCE-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-TRIGGER-SEMANTICS
  - id: P-BASE-SWITCH-ACTIVATION-FLIPS-CHECKED
    text:
      zh-CN: Switch root 在 enabled 状态下成功 activation 后，必须计算与当前 checked 相反的 next checked value。
      en: After successful activation while enabled, Switch root must compute a next checked value opposite to the current checked value.
    dependsOn:
      contracts:
        - C-EVENT-TYPE-0001
        - C-EVENT-TYPE-0002
        - C-STATE-0001
  - id: P-BASE-SWITCH-UNCONTROLLED-UPDATES-CHECKED
    text:
      zh-CN: 非受控 Switch 在成功 activation 后必须更新 root checked state，并暴露更新后的 on/off value。
      en: An uncontrolled Switch must update root checked state after successful activation and expose the updated on/off value.
    dependsOn:
      contracts:
        - C-STATE-0001
        - C-EXPOSE-STATE-0001
  - id: P-BASE-SWITCH-CONTROLLED-EMITS-NEXT
    text:
      zh-CN: 受控 Switch 在成功 activation 后不得自行最终拥有 checked state；它必须发出包含 next checked value 的 outward signal。
      en: A controlled Switch must not finally own checked state after successful activation; it must emit an outward signal carrying the next checked value.
    dependsOn:
      contracts:
        - C-PROPS-0001
        - C-EXPOSE-EVENT-0001
  - id: P-BASE-SWITCH-CHECKED-CHANGE-SIGNAL
    text:
      zh-CN: 'Switch checked/on-off value 成功变化或请求变化时，必须发出名为 `checkedChange` 的 outward signal，payload 必须包含 `{ checked: boolean }`。'
      en: 'When Switch checked/on-off value changes or requests a change successfully, it must emit an outward signal named `checkedChange` whose payload contains `{ checked: boolean }`.'
    dependsOn:
      contracts:
        - C-EVENT-TYPE-0001
        - C-EVENT-TYPE-0002
        - C-EXPOSE-EVENT-0001
  - id: P-BASE-SWITCH-CHECKED-CHANGE-PROTOCOL-NAME
    text:
      zh-CN: '`checkedChange` 是 Switch protocol 约定的 value-change outward signal 名称。'
      en: '`checkedChange` is the value-change outward signal name defined by the Switch protocol.'
    dependsOn:
      contracts:
        - C-EXPOSE-EVENT-0001
  - id: P-BASE-SWITCH-CLICK-DEFERRED
    text:
      zh-CN: '`click` 不属于 Base Switch 第一层 value-change signal；宿主 click、press commit 与 Switch `checkedChange` 的关系应保持可区分。'
      en: '`click` does not belong to the first Base Switch value-change signal surface; host click, press commit, and Switch `checkedChange` should remain distinguishable.'
    dependsOn:
      contracts:
        - C-EVENT-TYPE-0001
        - C-EXPOSE-EVENT-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-CLICK-SIGNAL
            - P-BASE-BUTTON-CLICK-PROTOCOL-NAME
  - id: P-BASE-SWITCH-DISABLED-SUPPRESS-ACTIVATION
    text:
      zh-CN: 当 `disabled` 为 true 时，Switch 不得完成 activation，不得改变 checked state，也不得发出 `checkedChange` signal。
      en: When `disabled` is true, Switch must not complete activation, change checked state, or emit the `checkedChange` signal.
    dependsOn:
      contracts:
        - C-EVENT-TYPE-0001
        - C-EVENT-TYPE-0002
        - C-EXPOSE-EVENT-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-DISABLED-SUPPRESS-ACTIVATION
  - id: P-BASE-SWITCH-DISABLED-CLEAR-TRANSIENT
    text:
      zh-CN: 当 `disabled` 变为 true 时，Switch root 必须清理自身 transient interaction state，但不得因此改变 checked/on-off state。
      en: When `disabled` becomes true, Switch root must clear its own transient interaction state without changing checked/on-off state.
    dependsOn:
      contracts:
        - C-STATE-INTERACTION-0001
        - C-STATE-INTERACTION-0002
        - C-STATE-INTERACTION-0003
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-DISABLED-CLEAR-TRANSIENT
  - id: P-BASE-SWITCH-POINTER-HOVER
    text:
      zh-CN: Switch root 必须响应指向性设备的 hover 进入与离开，并 expose `hovered` state。
      en: Switch root must respond to pointer hover enter and leave, and must expose `hovered` state.
    dependsOn:
      contracts:
        - C-STATE-INTERACTION-0001
        - C-STATE-INTERACTION-0002
        - C-EXPOSE-STATE-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-POINTER-HOVER
  - id: P-BASE-SWITCH-FOCUSABLE
    text:
      zh-CN: Switch root 必须是 focus target，并 expose `focused` 与 `focusVisible` state。
      en: Switch root must be a focus target and must expose `focused` and `focusVisible` state.
    dependsOn:
      contracts:
        - C-AS-FOCUSABLE-0001
        - C-EXPOSE-STATE-0001
      decisions:
        - D-FOCUS-STATE-INTERACTION-BOUNDARY-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-FOCUSABLE
  - id: P-BASE-SWITCH-REQUEST-FOCUS
    text:
      zh-CN: Switch root 必须提供主动请求焦点的能力。
      en: Switch root must provide a capability for actively requesting focus.
    dependsOn:
      contracts:
        - C-AS-FOCUSABLE-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-REQUEST-FOCUS
  - id: P-BASE-SWITCH-DISABLED-REJECT-FOCUS
    text:
      zh-CN: 当 `disabled` 为 true 时，Switch root 必须拒绝主动焦点请求。
      en: When `disabled` is true, Switch root must reject active focus requests.
    dependsOn:
      contracts:
        - C-AS-FOCUSABLE-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-DISABLED-REJECT-FOCUS
  - id: P-BASE-SWITCH-PRESS-LIFECYCLE
    text:
      zh-CN: Switch root 必须维护 transient press lifecycle，并 expose `pressed` state；该 `pressed` 不表示持久 value。
      en: Switch root must maintain the transient press lifecycle and expose `pressed` state; this `pressed` does not represent persistent value.
    dependsOn:
      contracts:
        - C-STATE-INTERACTION-0001
        - C-STATE-INTERACTION-0002
        - C-STATE-INTERACTION-0003
        - C-EXPOSE-STATE-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-PRESS-LIFECYCLE
  - id: P-BASE-SWITCH-KEYBOARD-SPACE-ACTIVATION
    text:
      zh-CN: Switch root 必须支持键盘 Space activation；当 Switch 已聚焦时，Space 应触发 Switch activation。
      en: Switch root must support keyboard Space activation; when Switch is focused, Space should trigger Switch activation.
    dependsOn:
      contracts:
        - C-EVENT-TYPE-0001
        - C-EVENT-TYPE-0002
  - id: P-BASE-SWITCH-KEYBOARD-ENTER-OPTIONAL
    text:
      zh-CN: Switch root 可以支持 Enter activation；若支持 Enter，它必须遵循与其他 activation route 相同的 checked flip 与 disabled gating 规则。
      en: Switch root may support Enter activation; if Enter is supported, it must follow the same checked flip and disabled gating rules as other activation routes.
    dependsOn:
      contracts:
        - C-EVENT-TYPE-0001
        - C-EVENT-TYPE-0002
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-KEYBOARD-ACTIVATION
  - id: P-BASE-SWITCH-KEYBOARD-SPACE-PREVENT-DEFAULT
    text:
      zh-CN: 当已聚焦 Switch 通过 Space 触发 activation 时，Switch 应请求阻止宿主默认副作用。
      en: When a focused Switch is activated through Space, Switch should request prevention of host default side effects.
    dependsOn:
      contracts:
        - C-EVENT-TYPE-0001
        - C-EVENT-TYPE-0002
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-KEYBOARD-SPACE-PREVENT-DEFAULT
  - id: P-BASE-SWITCH-ACCESSIBLE-ROLE
    text:
      zh-CN: Switch root 必须具备可映射到 switch role 的可访问语义。
      en: Switch root must carry accessibility semantics that can be mapped to the switch role.
    dependsOn:
      contracts:
        - C-A11Y-0001
  - id: P-BASE-SWITCH-ACCESSIBLE-NAME
    text:
      zh-CN: Switch root 必须支持 accessible name。
      en: Switch root must support an accessible name.
    dependsOn:
      contracts:
        - C-A11Y-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-ACCESSIBLE-NAME
  - id: P-BASE-SWITCH-STABLE-LABEL
    text:
      zh-CN: Switch 的 accessible label 不应在 checked/on-off state 改变时改变；状态变化应由 checked state 表达。
      en: Switch accessible label should not change when checked/on-off state changes; the state change should be expressed through checked state.
    dependsOn:
      contracts:
        - C-A11Y-0001
  - id: P-BASE-SWITCH-A11Y-CHECKED
    text:
      zh-CN: Switch root 必须将 checked/on-off state 投射为可访问 checked state；on 对应 true，off 对应 false。
      en: Switch root must project checked/on-off state as accessible checked state; on maps to true and off maps to false.
    dependsOn:
      contracts:
        - C-A11Y-0001
        - C-EXPOSE-STATE-0001
  - id: P-BASE-SWITCH-A11Y-NO-MIXED
    text:
      zh-CN: Switch 可访问 checked state 不得投射 mixed；如果宿主出现 mixed 输入，应按 off/false 或错误恢复策略处理。
      en: Switch accessible checked state must not project mixed; if a host mixed input appears, it should be handled as off/false or by an error recovery policy.
    dependsOn:
      contracts:
        - C-A11Y-0001
  - id: P-BASE-SWITCH-INDICATOR-PRESENTATIONAL-A11Y
    text:
      zh-CN: Switch thumb / indicator 不应成为独立可访问 control；它应作为 root switch 语义的呈现结构。
      en: Switch thumb or indicator should not become an independent accessible control; it should remain presentational structure for the root switch semantics.
    dependsOn:
      contracts:
        - C-A11Y-0001
        - C-ANATOMY-0001
  - id: P-BASE-SWITCH-PROP-LABEL-DEFERRED
    text:
      zh-CN: Switch 的 accessible name 是核心可访问能力，但第一版 core props 不强制把它定义为 `label` prop。
      en: Switch accessible name is a core accessibility capability, but the first core props surface does not force it to be a `label` prop.
    dependsOn:
      contracts:
        - C-PROPS-0001
        - C-A11Y-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-PROP-LABEL-DEFERRED
  - id: P-BASE-SWITCH-FORM-INTEGRATION-DEFERRED
    text:
      zh-CN: Switch 与 Form 的联动是重要场景，但 `name`、`value`、`form`、`required` 与 unchecked value 不进入第一轮 Base Switch core props。
      en: Switch and Form integration is an important scenario, but `name`, `value`, `form`, `required`, and unchecked value do not enter the first Base Switch core props surface.
    dependsOn:
      contracts:
        - C-PROPS-0001
      decisions:
        - D-BASE-PROTOTYPE-INDEPENDENCE-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-PROP-FORM-DEFERRED
            - P-BASE-BUTTON-FORM-EXTENSION
  - id: P-BASE-SWITCH-NO-VISUAL-VARIANT-CORE
    text:
      zh-CN: Switch 核心契约不定义 size、variant、tone、track shape、thumb motion 等视觉参数。
      en: Switch core contract does not define visual parameters such as size, variant, tone, track shape, or thumb motion.
    dependsOn:
      decisions:
        - D-BASE-PROTOTYPE-INDEPENDENCE-0001
      knowledge:
        - K-DESIGN-TRADEOFF-0001
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            - P-BASE-BUTTON-NO-VISUAL-VARIANT-CORE
            - P-BASE-BUTTON-PROP-VISUAL-DEFERRED
openQuestions:
  - id: P-BASE-SWITCH-Q-A11Y-API
    question:
      zh-CN: 在 asAccessible 已提供语义声明入口的前提下，Switch 是否需要额外的 accessible name、description 或原因说明 props？
      en: With asAccessible providing semantic declarations, does Switch need additional accessible-name, description or explanatory props?
    context:
      zh-CN: 作者入口已确定为 asAccessible；独立的组件 props 设计仍等待实际需求，不阻塞当前入口迁移。
      en: The author entry is asAccessible; separate component prop design awaits concrete use cases and does not block this migration.
    blocks: []
  - id: P-BASE-SWITCH-Q-TRACK
    question:
      zh-CN: Switch track 是否应成为官方 anatomy role、profile recommendation、独立 part protocol，还是继续作为宿主模板内部结构？
      en: Should Switch track become an official anatomy role, a profile recommendation, an independent part protocol, or remain host-template internal structure?
    context:
      zh-CN: track 往往只是容器、背景或布局结构，未必承担足够独立的信息通路责任。
      en: Track is often only a container, background, or layout structure and may not carry enough independent information-flow responsibility.
    blocks:
      - switch anatomy family final shape
      - downstream switch customization model
  - id: P-BASE-SWITCH-Q-FORM-INTEGRATION
    question:
      zh-CN: Switch 的 `name`、`value`、`form`、`required`、unchecked value 与 hidden input 行为应归属于 Base Switch core props、Form 协议能力，还是 adapter/host capability？
      en: Should Switch `name`, `value`, `form`, `required`, unchecked value, and hidden input behavior belong to Base Switch core props, Form protocol capabilities, or adapter/host capabilities?
    context:
      zh-CN: Switch 相比 Button 更接近 form-associated 二值输入，但第一轮 core props 暂不吸收完整 Form 联动。
      en: Switch is closer than Button to a form-associated binary input, but the first core props surface does not absorb full Form integration.
    blocks:
      - form prototype catalog
      - switch form extension design
  - id: P-BASE-SWITCH-Q-CHECKED-NAMING
    question:
      zh-CN: Base Switch 对外状态是否应长期使用 `checked`，还是在语义层区分 `checked` 与 `on`？
      en: Should Base Switch use `checked` as the long-term outward state name, or distinguish `checked` and `on` at the semantic layer?
    context:
      zh-CN: ARIA 与常见库多使用 checked / checkedChange API，但 Switch 的用户语义是 on/off。
      en: ARIA and common libraries often use checked / checkedChange APIs, but the user-facing Switch semantics are on/off.
    blocks:
      - switch state naming decision

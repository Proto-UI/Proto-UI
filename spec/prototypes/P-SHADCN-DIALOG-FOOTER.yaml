id: P-SHADCN-DIALOG-FOOTER
type: prototype
title: Shadcn Dialog Footer is an optional layout-only anatomy part
status: draft
since: 0.2.0-rc.3
summary: Dialog Footer groups explicit actions with intrinsic reverse wrapping and bounded inline layout, without defining confirm or cancel semantics.
statement:
  zh-CN: Shadcn Dialog Footer 是可选的 `footer` anatomy part，只提供 action 布局与 slot projection；Confirm、Cancel、Save 等语义仍由 App Maker 选择的 Button、Close 或 expose method 调用组成。
  en: Shadcn Dialog Footer is an optional `footer` anatomy part that provides action layout and slot projection only; Confirm, Cancel, Save, and similar semantics remain compositions of App-Maker-selected Buttons, Close parts, or expose-method calls.
criteria:
  - id: P-SHADCN-DIALOG-FOOTER-ANATOMY
    text:
      zh-CN: Footer 必须 claim `base-dialog` family 的 `footer` role，并被 Content containment 接受。
      en: Footer must claim the `footer` role in the `base-dialog` family and be accepted by Content containment.
  - id: P-SHADCN-DIALOG-FOOTER-NO-ACTION-SEMANTICS
    text:
      zh-CN: Footer 不得自带 Confirm、Cancel 或 Save 行为；其后代 action 保持独立 prototype boundary。
      en: Footer must not own Confirm, Cancel, or Save behavior; descendant actions retain independent prototype boundaries.
# Intrinsic wrapping intentionally differs from upstream sm media-query switching.
# Descendant controls own label wrapping (for example Button wrap); this part
# neither mutates their paint nor guarantees arbitrary unbounded descendants fit.
sources:
  - path: packages/prototypes/shadcn/src/dialog/footer.proto.ts
  - path: packages/prototypes/shadcn/test/dialog.test.ts
dependsOn:
  contracts: [C-ANATOMY-0001, C-RULE-INTENT-FEEDBACK-STYLE-0001]
  prototypes: [P-SHADCN-DIALOG-CONTENT]
verifies: { tests: [T-SHADCN-DIALOG-LAYOUT-0001] }
revisions:
  - version: 0.2.0-rc.3
    change: introduced
    summary: Added the optional layout-only Footer part without action semantics.
tags: [prototype, shadcn, dialog, footer, anatomy, layout]

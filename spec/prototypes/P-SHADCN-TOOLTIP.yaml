id: P-SHADCN-TOOLTIP
type: prototype
title: shadcn Tooltip Root inherits Base Tooltip coordination
status: draft
since: 0.3.0-alpha.0
summary: shadcn Tooltip Root inherits Base Tooltip coordination without taking over part-owned presentation.
statement:
  en: >-
    shadcn Tooltip Root is a draft Proto UI-maintained shadcn design-language projection over Base Tooltip. It preserves inherited open, delay, disabled, and request coordination without adding a competing visual or interaction owner; Group, Trigger, and Content keep their direct part responsibilities.


  zh-CN: >-
    shadcn Tooltip Root 是 Proto UI 维护的 draft shadcn design-language 投射，建立在 Base Tooltip 之上。它保留继承的 open、delay、disabled 与 request 协调，不增加相互竞争的视觉或交互 owner；Group、Trigger 与 Content 继续持有各自的直接 part 职责。


criteria:
  - id: P-SHADCN-TOOLTIP-BASE-INHERITANCE
    text:
      en: The prototype must inherit Base Tooltip through asTooltipRoot() once and must not redefine Base protocol semantics.
      zh-CN: 该 prototype 必须通过 asTooltipRoot() 一次性继承 Base Tooltip，不得重定义 Base 协议语义。
  - id: P-SHADCN-TOOLTIP-ENTRY
    text:
      en: The direct prototype entry name is shadcn-tooltip-root and is the only public Tooltip Root entry in this foundation slice.
      zh-CN: 直接 prototype 入口名为 shadcn-tooltip-root，且是本 foundation 切片中唯一公开的 Tooltip Root 入口。
sources:
  - path: packages/prototypes/shadcn/src/tooltip/root.proto.ts
  - path: packages/prototypes/shadcn/src/tooltip/types.ts
inherits:
  prototypes:
    - id: P-BASE-TOOLTIP
verifies: { tests: [T-SHADCN-TOOLTIP-0001] }
revisions:
  - version: 0.3.0-alpha.0
    change: introduced
    summary: Introduced the draft shadcn Tooltip projection.
tags: [prototype, shadcn, visual, delta, tooltip]

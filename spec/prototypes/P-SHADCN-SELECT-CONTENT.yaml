id: P-SHADCN-SELECT-CONTENT
type: prototype
title: Shadcn Select Content inherits Base listbox overlay and adds position, motion, and surface
status: draft
since: 0.2.0-rc.0
summary: Shadcn Select Content inherits Base listbox, focus, overlay, presence, position, keyboard, and dismissal behavior and adds a position prop, configured transition, and current surface.
statement:
  zh-CN: Shadcn Select Content 是 `P-BASE-SELECT-CONTENT` 之上的 direct part，保留 listbox a11y、roving focus、overlay/presence、position、keyboard 与 dismiss behavior，增加 position enum、150/0ms Transition 配置及当前 popover animations/surface。`asChild` 明确不提供。
  en: Shadcn Select Content is a direct part over `P-BASE-SELECT-CONTENT`. It retains listbox accessibility, roving focus, overlay and presence, positioning, keyboard, and dismissal behavior while adding a position enum, 150/0ms Transition configuration, and the current popover animations and surface. `asChild` is explicitly unavailable.
criteria:
  - id: P-SHADCN-SELECT-CONTENT-STYLE-PROFILES
    text:
      en: The earlier fixed recipes in this document describe the New York compatibility profile. Shared style selection additionally supports Rhea from shadcn/ui 3d98900e9b73c45f035f8109e9d41ba6a51685e7; the bounded profile and composition contract is P-SHADCN-SELECT-STYLE. This is not full upstream API, positioning or scroll-control parity.
  - id: P-SHADCN-SELECT-CONTENT-SIDE-AVAILABILITY
    text:
      zh-CN: 固定 Radix item-aligned 不提供 data-side，故不得从默认 side prop 虚构定向 slide 或 popper 位移。popper 当前仅有请求 side，碰撞后 resolved side 订阅尚未提供；该差距必须明确，不能声称全方向碰撞动画一致。
      en: Pinned Radix item-aligned supplies no data-side, so default side props must not invent directional slides or popper translation. Current popper exposes only requested side without a resolved-side subscription after collisions; that gap must remain explicit rather than claiming collision-animation parity.
  - id: P-SHADCN-SELECT-CONTENT-UPSTREAM-IDENTITY
    text:
      {
        zh-CN: Content 必须沿用固定 Select revision/path 并明确其非官方 projection 身份。,
        en: Content must use the pinned Select revision and path and identify its unofficial projection status.,
      }
  - id: P-SHADCN-SELECT-CONTENT-BASE-INHERITANCE
    text:
      {
        zh-CN: '`shadcn-select-content` 必须继承 `P-BASE-SELECT-CONTENT` 并调用 `asSelectContent()`。',
        en: '`shadcn-select-content` must inherit `P-BASE-SELECT-CONTENT` and call `asSelectContent()`.',
      }
    references:
      prototypes:
        - id: P-BASE-SELECT-CONTENT
          anchors:
            [
              P-BASE-SELECT-CONTENT-AUTHORING-ENTRIES,
              P-BASE-SELECT-CONTENT-A11Y,
              P-BASE-SELECT-CONTENT-FOCUS-ROVING,
              P-BASE-SELECT-CONTENT-OVERLAY-PRESENCE,
            ]
  - id: P-SHADCN-SELECT-CONTENT-CURRENT-BASE-DEVIATIONS
    text:
      {
        zh-CN: 当前实现不反转 inherited listbox/focus/overlay/position/keyboard/dismiss guarantee；新增 API、Transition 配置与 styles 是增量。,
        en: The current implementation reverses no inherited listbox,
        focus,
        overlay,
        position,
        keyboard,
        or dismissal guarantee; API,
        Transition configuration,
        and styles are deltas.,
      }
  - id: P-SHADCN-SELECT-CONTENT-DIRECT-ENTRY
    text:
      {
        zh-CN: 当前 Content protocol 以 `shadcn-select-content` direct prototype 公开。,
        en: The current Content protocol is exposed as the `shadcn-select-content` direct prototype.,
      }
  - id: P-SHADCN-SELECT-CONTENT-POSITION-PROP
    text:
      {
        zh-CN: position 接受 item-aligned/popper，Shadcn 默认 item-aligned、align=center、sideOffset=0，Base 默认 popper；完整 Surface/Viewport/ItemText 组合使用已固定 Radix 2.2.6 对齐协议，零新 parts 的旧组合暂保留 edge 兼容并不计入上游对齐。,
        en: Position accepts item-aligned and popper; Shadcn defaults to item-aligned,
        align=center and sideOffset=0 while Base defaults to popper. Complete Surface/Viewport/ItemText composition uses the pinned Radix 2.2.6 alignment protocol. Legacy composition with none of the new parts temporarily retains edge compatibility and does not count as upstream alignment.,
      }
  - id: P-SHADCN-SELECT-CONTENT-TRANSITION
    text:
      {
        zh-CN: 固定源 Radix Select 在 committed open=false 时立即撤下 Content；此前 100ms leave 是偏离。Shadcn 配置 enterDuration=150ms、leaveDuration=0ms、interrupt=reverse，并在真实关闭请求返回后仅当最新 Root 仍 closed 且 phase=leaving 时 complete。beforeLeave 同步撤回关闭必须保持最新 open；拒绝受控关闭不运行关闭路径；真实 closed 后重开必须 fresh cold preparing。,
        en: Pinned Radix Select withdraws Content immediately when committed open becomes false; the former 100ms leave was a deviation. Shadcn configures enterDuration=150ms,
        leaveDuration=0ms and interrupt=reverse. After the committed close operation returns,
        complete only if the latest Root remains closed and phase is leaving. A synchronous beforeLeave reversal preserves the latest open; refused controlled close never runs this path; reopening after actual closed requires fresh cold preparation.,
      }
  - id: P-SHADCN-SELECT-CONTENT-CURRENT-VISUAL-SURFACE
    text:
      zh-CN: 完整组合中 Content 仅承担内部定位 frame，Surface 通过 Base 合法 part hook 承担 paint，Viewport 承担滚动与 p-1，ItemText 提供实际文字锚点。Surface 使用固定源 min-w-[8rem]、rounded-md、border、shadow-md、popover 与 flex column/max-h-full；Viewport relative flex-1 min-h-0 overflow-hidden overflow-y-auto。popper 才使用 trigger-size 变量与四向 translate-1。parts 从公开 select 入口提供，不能在 Template 内嵌 PrototypeRef；私有 JSON 视觉 Context 只投射当前 phase/side/position，不驱动 presence。
      en: In complete composition Content owns only the internal positioning frame, Surface uses the legal Base part hook to own paint, Viewport owns scrolling and p-1, and ItemText supplies the actual text anchor. Surface uses pinned min-w-[8rem], rounded-md, border, shadow-md, popover and flex column/max-h-full; Viewport uses relative flex-1 min-h-0 overflow-hidden overflow-y-auto. Only popper uses trigger-size variables and directional translate-1. Parts are exported from the public select entry and cannot nest PrototypeRef in Template. Private JSON visual Context projects phase/side/position only and never drives presence.
  - id: P-SHADCN-SELECT-CONTENT-OPEN-AND-SIDE-STYLES
    text:
      {
        zh-CN: enter/leave/side animations 必须从 inherited Transition/open state 与 side prop 派生。,
        en: Enter,
        leave,
        and side animations must derive from inherited Transition and open state and side prop.,
      }
  - id: P-SHADCN-SELECT-CONTENT-COMPATIBILITY-SUBSET
    text:
      {
        zh-CN: 当前保证之外的 Viewport/scroll/position 差异集中在唯一 open question。,
        en: Viewport,
        scroll,
        and position differences beyond current guarantees are centralized in one open question.,
      }
  - id: P-SHADCN-SELECT-CONTENT-AS-CHILD-OMISSION
    text:
      {
        zh-CN: upstream Content props 中的 `asChild` 依共享决策省略。,
        en: Upstream Content `asChild` is omitted under the shared decision.,
      }
    dependsOn: { decisions: [D-AS-CHILD-OMISSION-0001] }
openQuestions:
  - id: P-SHADCN-SELECT-CONTENT-Q-UPSTREAM-DIFFERENCES
    question:
      {
        zh-CN: Content 的 position、Viewport/scroll controls 与 exact motion parity 应如何收敛？,
        en: How should Content position,
        Viewport and scroll controls,
        and exact motion parity converge?,
      }
    context:
      zh-CN: intentional deviation 是省略 `asChild`。upstream 固定 Portal、Viewport、上下 scroll buttons，默认 align=center，并仅在 popper 时使用 side translation 与 trigger size vars；本次提供真实 Surface/Viewport/ItemText 与完整组合绑定；七处 www 迁移清单尚未全完成，旧零 parts 组合仍是 edge 兼容。上下 scroll buttons 尚未实现。data-slot、transform-origin、Radix vars、forwarding 与 motion timing 也待核对。
      en: The intentional deviation is omission of `asChild`. Upstream fixes Portal, Viewport, and scroll buttons, defaults align=center, and uses side translation and trigger-size variables only for popper; This slice supplies actual Surface/Viewport/ItemText and the complete binding. The seven-site www migration remains incomplete and zero-part legacy compositions still use edge compatibility. Scroll buttons remain unimplemented. Data-slot, transform-origin, Radix variables, forwarding, and motion timing also need review.
    blocks: [shadcn select content parity roadmap]

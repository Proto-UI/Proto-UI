id: P-LIQUID-GLASS-SWITCH
type: prototype
title: Liquid Glass Switch projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native and material-host evidence plus independent review; source presence, private package availability and intent frames are not release, conformance or Apple-equivalence admission.
summary: Checked-state control with family track paint; a Proto extension.
statement:
  en: The Prototype invokes asSwitchRoot() once; Base owns checked, input and the optional Field policy.
criteria:
  - id: P-LIQUID-GLASS-SWITCH-BASE
    text:
      en: Invoke asSwitchRoot() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias or Base.setup call.
  - id: P-LIQUID-GLASS-SWITCH-VISUAL
    text:
      en: 'Track and state paint only; checked remains a non-color supplementary signal and no sliding-animation or native-switch equivalence is claimed. Exact functional material clauses are provisional: real provider capability, missing-host opaque fallback and bounded source leases stay governed by the shared V2 material contract.'
  - id: P-LIQUID-GLASS-SWITCH-FIELD-COMPOSITION
    text:
      en: The public fieldSwitch entry composes asFieldSwitch once; the optional Field binding remains sole owner of invalid, pending, policy and label relationships.
  - id: P-LIQUID-GLASS-SWITCH-CLOSURE
    text:
      en: All family appearance is authored through feedback tokens, typed material intent and Rules with explicit finite physical translation; no website-only CSS, private Apple asset or Adapter component-name dispatch may supply default intent, and explicit liquid-glass intent is never silently replaced by adaptive native blur.
  - id: P-LIQUID-GLASS-SWITCH-BOUNDARY
    text:
      en: Exact-head browser, native, material-provider and Compiler evidence plus independent review remain open; the package is private and source-only. Apple documentation is a design reference, not implementation, asset or equivalence evidence. Catalog presence is a draft relation, not acceptance.
dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
inherits:
  prototypes:
    - P-BASE-SWITCH
verifies:
  tests:
    - T-LIQUID-GLASS-DRAFT-CONTROL-0001
sources:
  - path: packages/prototypes/liquid-glass/src/switch/root.proto.ts
  - path: packages/prototypes/liquid-glass/src/switch/index.ts
  - path: https://developer.apple.com/design/human-interface-guidelines/materials
    label: Apple HIG Materials design reference only
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Liquid Glass Switch projection cataloged as a draft family projection over the implemented source slice.
tags:
  - prototype
  - liquid-glass
  - switch
  - draft

id: P-BASE-SELECT
type: prototype
title: Base Select is a root-owned select-only single-selection protocol
status: draft
since: 0.2.0-rc.0
summary: Base Select is a compound select-only protocol whose Root owns open state, committed value, selected text, collection order, request arbitration, and shared selection facts.
statement:
  zh-CN: >-
    Base Select 是由 Trigger 打开的 compound select-only single-selection protocol。Root 持有 open、committed value、selected text、controlled ownership、disabled、collection order 与 request arbitration；Trigger、Value、Content 和 Item 只通过同域 Root request entry 与 fact-oriented Context 协作。popup 中的临时导航不得改写 committed value，只有 Item commit 或 owner input 可以改变 selection。


  en: >-
    Base Select is a compound select-only single-selection protocol opened by a Trigger. Root owns open state, committed value, selected text, controlled ownership, disabled state, collection order, and request arbitration while Trigger, Value, Content, and Item cooperate through same-domain Root request entries and fact-oriented Context. Transient popup navigation must not rewrite the committed value; only Item commit or owner input may change selection.


anatomy:
  family: base-select
  roles:
    root: { cardinality: { min: 1, max: 1 } }
    trigger: { cardinality: { min: 0, max: 1 } }
    value: { cardinality: { min: 0, max: 1 } }
    content: { cardinality: { min: 0, max: 1 } }
    surface: { cardinality: { min: 0, max: 1 } }
    viewport: { cardinality: { min: 0, max: 1 } }
    item-text: { cardinality: { min: 0, max: 100 } }
    group: { cardinality: { min: 0, max: 100 } }
    label: { cardinality: { min: 0, max: 100 } }
    separator: { cardinality: { min: 0, max: 100 } }
    item: { cardinality: { min: 0, max: 100 } }
  relations:
    - { kind: contains, parent: root, child: trigger }
    - { kind: contains, parent: root, child: value }
    - { kind: contains, parent: root, child: content }
    - { kind: contains, parent: content, child: item }
    - { kind: contains, parent: content, child: surface }
    - { kind: contains, parent: surface, child: viewport }
    - { kind: contains, parent: item, child: item-text }
    - { kind: contains, parent: content, child: group }
    - { kind: contains, parent: group, child: label }
    - { kind: contains, parent: content, child: separator }
criteria:
  - id: P-BASE-SELECT-OPTIONAL-FIELD-COMPOSITION
    text:
      en: The explicit FieldSelectTrigger composition reuses the same setup and existing Field validator. Root observes optional Field disabled/readOnly policy and gates selection; the ordinary Trigger keeps content-derived naming while the Field entry uses Field label/description/error relations. Raw Root policy is kept separate from inherited Field policy to prevent feedback latching. This extends the earlier content-only Trigger surface without replacing selection, popup or focus protocols.
    dependsOn:
      contracts: [{ id: C-FIELD-SELECT-0001, since: 0.3.0-alpha.1 }]
  - id: P-BASE-SELECT-ROLE-SELECT-ONLY
    text:
      zh-CN: Select 必须表示从有限 option 集合中提交一个持久值的 select-only control，不得把 action menu、可自由输入 combobox 或 multi-select 伪装成当前协议。
      en: Select must represent a select-only control that commits one persistent value from a finite option set and must not disguise an action menu, free-form combobox, or multi-select as this protocol.
  - id: P-BASE-SELECT-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-select-root` 与 `asSelectRoot` 必须是同一 Root protocol 的 direct 与 authored-asHook entries。'
      en: '`base-select-root` and `asSelectRoot` must be direct and authored-asHook entries for the same Root protocol.'
  - id: P-BASE-SELECT-ROOT-OWNER
    text:
      zh-CN: Root 必须是 open、committed value、selected text、controlled ownership、disabled、collection、close-on-select policy 与 request arbitration 的 semantic owner。
      en: Root must be the semantic owner of open state, committed value, selected text, controlled ownership, disabled state, collection, close-on-select policy, and request arbitration.
  - id: P-BASE-SELECT-PROPS
    text:
      zh-CN: Root 必须接受 `open`、`defaultOpen`、`value`、`defaultValue`、`disabled` 与 `closeOnSelect`；分别提供 `open` 或 `value` 时对应事实进入受控模式。
      en: Root must accept `open`, `defaultOpen`, `value`, `defaultValue`, `disabled`, and `closeOnSelect`; providing `open` or `value` selects controlled ownership for the corresponding fact.
  - id: P-BASE-SELECT-REQUESTS
    text:
      zh-CN: Root 必须 expose open/value/textValue、open/close/toggle methods、同域 `requestOpen` 与 `requestValue` entries，以及 `openChange` 与 `valueChange` signals；受控请求不得越过 owner 改写最终事实。
      en: Root must expose open, value, and textValue, open, close, and toggle methods, same-domain `requestOpen` and `requestValue` entries, and `openChange` and `valueChange` signals; controlled requests must not bypass the owner to rewrite final facts.
  - id: P-BASE-SELECT-SELECTION-INVARIANT
    text:
      zh-CN: popup active option 与 committed selection 必须是不同事实；导航、pointer hover 与 Escape cancellation 不得改变 value，成功 commit 才能请求 value change。
      en: The popup active option and committed selection must remain distinct facts; navigation, pointer hover, and Escape cancellation must not change value, and only a successful commit may request a value change.
  - id: P-BASE-SELECT-TEXT-DERIVATION
    text:
      zh-CN: textValue 必须由当前 committed value 对应 Item 的 collection text snapshot 派生；同一 Item 的 textValue 更新必须刷新 Root textValue 与 Value 回显而不改变 value。
      en: textValue must derive from the collection text snapshot of the Item matching the committed value; updating that Item's textValue must refresh Root textValue and Value display without changing value.
  - id: P-BASE-SELECT-CONTEXT
    text:
      zh-CN: Root 必须通过同域 Context 发布 open/value ownership、disabled、selected text、popup active value、close policy 与最近 request facts；Context 不得充当版本化命令总线。
      en: Root must publish open and value ownership, disabled state, selected text, popup active value, close policy, and latest request facts through same-domain Context; Context must not act as a versioned command bus.
  - id: P-BASE-SELECT-ANATOMY
    text:
      zh-CN: canonical Root、Trigger、Value、Content、Item 与可选结构 parts roles、cardinality 与 contains relations 必须由顶层 anatomy 字段定义并与运行时代码一致。
      en: Canonical Root, Trigger, Value, Content, Item and optional structural-part roles, cardinalities, and contains relations must be defined by the top-level anatomy field and match runtime code.
  - id: P-BASE-SELECT-DEFERRED-EXTENSIONS
    text:
      zh-CN: form submission、required validation、scroll controls、ItemIndicator、editable search、multi-select 与虚拟化不属于当前 Base 保证。
      en: Form submission, required validation, scroll controls, ItemIndicator, editable search, multi-select, and virtualization are outside the current Base guarantee.
  - id: P-BASE-SELECT-STRUCTURAL-SCOPE
    text:
      en: Surface, Viewport and ItemText follow P-BASE-SELECT-ALIGNMENT-PARTS. Group, Label and decorative Separator follow P-BASE-SELECT-STRUCTURAL-PARTS; SelectRoot installs only that naming-scope boundary, not an accessible group or naming relation. These optional parts do not replace Root ownership.

id: P-BRUTALIST-FIELD
type: prototype
title: brutalist Field root
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: Finf Field 的 draft 契约及投影。稳定准入仍需独立审查、精确 head 的原生输入、辅助技术、视觉/材质与 GPUI 证据；synthetic DOM 测试不建立这些保证。
  en: Draft Finf Field contract and projections. Stable admission requires independent review and exact-head native input, assistive technology, visual/material and GPUI evidence; synthetic DOM checks do not establish those guarantees.
summary: Direct Base Field root design-language projection.
statement:
  zh-CN: The style family owns only presentation and inherits the exact Base atom. It does not install its own validation, control, focus, callback, or relationship owner.
  en: The style family owns only presentation and inherits the exact Base atom. It does not install its own validation, control, focus, callback, or relationship owner.
criteria:
  - id: P-BRUTALIST-FIELD-TEXTAREA
    text:
      zh-CN: FieldTextarea 显式继承 Base asFieldTextarea，保持一个原生多行 editor、canonical owner、只读/禁用与 Field 关系。其外观与普通 Brutalist Textarea 共用同一视觉定义，并从 Base Field invalid 状态增加非颜色唯一的错误反馈；不增加验证或 editor owner。
      en: FieldTextarea explicitly inherits Base asFieldTextarea, preserving one native multiline editor, canonical ownership, readonly/disabled policy and Field relationships. It shares the ordinary Brutalist Textarea visual definition and derives invalid feedback from Base Field facts, with textual Error support rather than color alone. It adds no validator or editor owner.
  - id: P-BRUTALIST-FIELD-INHERITANCE
    text:
      zh-CN: Calls asFieldRoot exactly once, preserves its renderer and static modules, and retains all Base JSON Props/exposes.
      en: Calls asFieldRoot exactly once, preserves its renderer and static modules, and retains all Base JSON Props/exposes.
  - id: P-BRUTALIST-FIELD-STYLE
    text:
      zh-CN: Uses family-owned layout, wrapping, focus-visible, disabled and invalid presentation derived from canonical Base state. Invalidity includes a textual Error; color is never the only explanation. Native layout, text scaling and visual parity require source-bound browser evidence.
      en: Uses family-owned layout, wrapping, focus-visible, disabled and invalid presentation derived from canonical Base state. Invalidity includes a textual Error; color is never the only explanation. Native layout, text scaling and visual parity require source-bound browser evidence.
inherits:
  prototypes:
    - P-BASE-FIELD

    change: extended
    summary: Define the explicit Base FieldTextarea composition and shared Brutalist multiline presentation.
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added a direct independently authored Base Field presentation; no native optical or release-complete claim.

revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Defined explicit nine-profile passive action typography and its withdrawal, paired with the bounded Surface appearance contract without admitting interaction ownership.
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added bounded Text family projection through standard typography feedback.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added explicit size-owned line boxes and bounded tighter leading/tracking without changing existing defaults or native semantics.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added an opt-in shared family typography input with consumer-owned licensed font delivery, preserving ordinary defaults and explicit native and visual evidence gaps.

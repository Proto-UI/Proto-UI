id: P-SHADCN-TEXT
type: prototype
title: Shadcn Text presentation projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: New bounded Text presentation slice has source-backed Web Adapter and compiler evidence. It remains draft pending independent review and real-browser visual admission; native GPUI typography omissions remain explicit.
summary: Portable Text presentation inputs realized as standard Rule and Feedback style plans.
statement:
  en: Shadcn Text is a Proto UI-authored projection of P-BASE-TEXT. It introduces no new interaction or native document semantics and claims no upstream component/API parity. Font and ink resolve against the selected family's existing theme variables; the public finite inputs map to standard typography tokens.
criteria:
  - id: P-SHADCN-TEXT-INHERITANCE
    text:
      en: The projection invokes asTextRoot and preserves its slot, defaults, passive boundary and independent presentation axes without negative patches.
  - id: P-SHADCN-TEXT-PROJECTION
    text:
      en: Each input selects exactly one token for its axis through def.rule and feedback.style, except leading size, which intentionally contributes no leading token. Size maps to text-xs through text-5xl, tone to text-foreground/text-muted-foreground/text-inherit, weight to font-normal/medium/semibold/bold, font to font-sans/heading/mono, leading tighter to leading-[1.1], tracking tighter to tracking-tighter, other explicit leading and tracking values to their named tokens, emphasis to not-italic/italic and decoration to no-underline/underline/line-through. Explicit leading other than size wins over composite size line-height. With leading size, xs|sm|base|lg|xl|2xl|3xl|4xl|5xl retain respectively 1rem|1.25rem|1.5rem|1.75rem|1.75rem|2rem|2.25rem|2.5rem|1 line-height from their size tokens. Missing size falls back to base. An initially invalid size falls back to base; provided empty or invalid size after a valid value preserves that previous value under the existing Props contract. Default leading normal remains 1.5; tighter is 1.1 and tracking tighter is -0.05em. Removing props restores defaults on the same subject. Shadcn-only actionProfile defaults to none and explicitly admits vega|nova|maia|lyra|mira|luma|sera|rhea|new-york-v4 plus the new-york alias. Explicit action composition uses 1.25rem leading for Vega/Nova/Maia/Luma/Rhea/New York, 1rem for Lyra/Sera, and 1.625 relative leading for Mira; Sera adds uppercase and 0.1em tracking. The helper pairs source-bound sm typography except xs for Lyra/Mira/Sera, and medium weight except Sera semibold. Other size, tone, font and weight inputs remain ordinary Text inputs; the profile's line box and Sera tracking take precedence only while explicitly selected, and omission restores ordinary leading/tracking behavior on the same subject. These recipes follow the fixed sources and scope in P-SHADCN-SURFACE-ACTION-PROFILES. This is explicit passive appearance, with no implicit style-scope subscription, event, role, selection interception or native navigation claim.
  - id: P-SHADCN-TEXT-CONSUMPTION
    text:
      en: Public root and /text exports include textRoot, shadcnTextRoot, ShadcnTextRoot and TextRootProps/TextRootExposes with family aliases. CLI shadcn-text generates WC, React, Vue and Vue2 facades. Real four-Adapter DOM evidence does not imply browser visual acceptance or native parity. Web compiler owns these declarations; unsupported CLI hosts are rejected. GPUI currently reports unmapped inherit color, font-style, letter-spacing and text-decoration-line rather than claiming their realization.
  - id: P-SHADCN-TEXT-THEME-PRESET
    text:
      en: The optional immutable SHADCN_TYPOGRAPHY public theme input supplies font-sans and font-heading with Geist followed by platform and CJK fallbacks. It performs no loading, DOM access or global mutation and does not alter passive Surface or other-family defaults. A consumer owns licensed same-origin font delivery and applies the selected theme to authored text and non-Text controls, including its explicitly owned escaped portal boundaries. Explicit authored surface font declarations retain precedence. Missing or failed font resources use the ordinary fallback chain. This draft input does not establish per-glyph fallback identity, layout stability, visual parity or native backend font realization.
inherits:

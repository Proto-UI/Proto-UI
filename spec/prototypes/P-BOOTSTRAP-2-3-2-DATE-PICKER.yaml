id: P-BOOTSTRAP-2-3-2-DATE-PICKER
type: prototype
title: Bootstrap 2.3.2 Date Picker projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    en: Draft catalog relation for an implemented family projection against the pinned Bootstrap 2.3.2 vocabulary. Stable admission requires real consumers, browser/native evidence and independent review; source presence and private package availability are not release or conformance admission.
summary: Bootstrap Date Picker family over P-BASE-DATE-PICKER with pinned vocabulary.
statement:
    en: The family parts each invoke their matching public Base hook exactly once and preserve the complete Base protocol. Root/Trigger/Content/Day/Value compose the Popover and Calendar protocols; Trigger/Content compose the corresponding Popover hooks, Day borrows Calendar Day and Value derives the displayed date. DatePicker is a Proto extension.
criteria:
  - id: P-BOOTSTRAP-2-3-2-DATE-PICKER-BASE
    text:
            en: Invoke asDatePicker* hooks() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias, jQuery/plugin API or Base.setup call.
  - id: P-BOOTSTRAP-2-3-2-DATE-PICKER-VISUAL
    text:
            en: Root/Trigger/Content/Day/Value compose the Popover and Calendar protocols; Trigger/Content compose the corresponding Popover hooks, Day borrows Calendar Day and Value derives the displayed date. DatePicker is a Proto extension.
  - id: P-BOOTSTRAP-2-3-2-DATE-PICKER-EXTENSION
    text:
            en: Bootstrap 2.3.2 has no date picker widget; the composition is a Proto extension.
  - id: P-BOOTSTRAP-2-3-2-DATE-PICKER-CLOSURE
    text:
            en: All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, Glyphicons, upstream JavaScript or Adapter component-name dispatch may supply default intent.
  - id: P-BOOTSTRAP-2-3-2-DATE-PICKER-BOUNDARY
    text:
            en: Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; the package is private and source-only. Catalog presence is a draft relation, not acceptance.

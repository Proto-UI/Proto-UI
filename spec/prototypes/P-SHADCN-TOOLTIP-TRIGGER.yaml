id: P-SHADCN-TOOLTIP-TRIGGER
type: prototype
title: shadcn Tooltip Trigger inherits Base Tooltip Trigger
status: draft
since: 0.3.0-alpha.0
summary: shadcn Tooltip Trigger inherits Base Tooltip Trigger and projects hover/focus/press visual feedback.
statement:
  en: shadcn Tooltip Trigger is a draft projection preserving Base Trigger semantics with hover opacity, focus-visible ring, and press scale feedback.
  zh-CN: shadcn Tooltip Trigger 是 draft 投射，保留 Base Trigger 语义，增加 hover 透明度、focus-visible ring 与 press 缩放反馈。
criteria:
  - id: P-SHADCN-TOOLTIP-TRIGGER-ENTRY
    text:
      en: The direct prototype entry name is shadcn-tooltip-trigger.
      zh-CN: 直接 prototype 入口名为 shadcn-tooltip-trigger。
  - id: P-SHADCN-TOOLTIP-TRIGGER-STATE-DRIVEN-VISUALS
    text:
      en: >-
        Trigger must derive hover opacity and focus-visible ring feedback from inherited Base handles, and press scale-[0.98] feedback from the runtime-managed official pressed interaction slot; it must not author a button role or activation event.


      zh-CN: >-
        Trigger 必须从继承的 Base handles 派生 hover 透明度与 focus-visible ring，并从 runtime 管理的官方 pressed interaction slot 派生 scale-[0.98] 按压反馈；不得 author button role 或 activation event。



id: P-BASE-MENUBAR
type: prototype
title: Base menubar
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: 'Draft 实现方向，稳定准入需要独立审查及浏览器/native 证据。'
  en: 'Draft implementation direction. Stable admission requires independent review and browser/native evidence.'
summary: Base menubar protocol with shared Proto UI lifecycle and anatomy boundaries.
statement:
  zh-CN: 独立编写的 Proto UI 协议，复用 Base 共享能力和 L1 lifecycle。
  en: An independently authored Proto UI protocol reusing Base shared capabilities and L1 lifecycle.
criteria:
  - id: P-BASE-MENUBAR-ADMISSION
    text:
      zh-CN: Draft 准入需要精确 head 的浏览器/native 证据和独立审查。
      en: Draft admission requires exact-head browser/native evidence and independent review.
  - id: P-BASE-MENUBAR-SOURCE-ENTRY
    text:
      en: An unfulfilled Trigger-initiated opening entry captures the initiating Trigger's current source-view operation before author callbacks can withdraw it. First or last entry is delivered only while that same operation and the existing opening, focus, enabled and revision guards remain current. Withdrawal or unrelated reinsertion cannot revive it; cancellation itself neither commits selection nor emits a new close or restoration request.
  - id: P-BASE-MENUBAR-DELIVERED-FOCUS
    text:
      en: After one valid logical opening entry is delivered, existing Focus retained-intent and target-readiness rules remain authoritative. Multiple permitted native re-projections are not additional logical entries. Source-operation adoption does not redefine Navigation Menu entry or suppress native effects solely because logical focus is already true.
dependsOn:
  contracts:
    - C-PROPS-0001
    - C-LIFECYCLE-0008
    - C-LIFECYCLE-VIEW-OPERATION-0001
    - C-AS-FOCUS-ROVING-0001
verifies:
  tests: [T-BASE-MENUBAR-SOURCE-ENTRY-0001]
sources:
  - path: packages/prototypes/base/src/menubar/
  - path: packages/prototypes/base/src/menu-primitives/family.ts
openQuestions:
  - id: P-BASE-MENUBAR-Q-ADMISSION
    question:
      zh-CN: 何时完成精确 head 的浏览器/native 证据并准入此 draft？
      en: When have exact-head browser/native evidence admitted this draft?
    blocks:
      - activation:P-BASE-MENUBAR
  - id: P-BASE-MENUBAR-Q-SOURCE-OPERATION
    question:
      en: Have same-head source-withdrawal consumer tests, four-Web native/framework evidence, independent review and the shared Compiler capture/check closure established this draft adoption without regressing an admitted consumer?
    blocks:
      - criterion:P-BASE-MENUBAR#P-BASE-MENUBAR-SOURCE-ENTRY
      - activation:P-BASE-MENUBAR
revisions:
  - version: 0.3.0-alpha.1
    change: refined
    summary: Define consumption of the existing source-view operation for an undelivered opening entry without changing retained Focus ownership. Candidate source remains unexecuted and Compiler admission is an explicit dependency.
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Cataloged the Base menubar family as draft.
tags:
  - prototype
  - base
  - menubar

id: P-SHADCN-TEXTAREA
type: prototype
title: Shared-scope New York and Rhea Textarea projection
status: draft
lifecycleRationale: Draft source-mapped New York/Rhea production paint; exact native resize, intrinsic sizing, scope and invalid-state evidence plus independent admission remain required.
since: 0.3.0-alpha.0
summary: Shadcn Textarea Root is an unofficial Proto UI-maintained projection that inherits the host-mediated Base Textarea editor and adds the currently implemented field surface and state-driven presentation.
statement:
  zh-CN: "Shadcn Textarea Root 是 `P-BASE-TEXTAREA` 之上的 direct prototype，保留 Base Textarea 的 controlled/uncontrolled value、归一化 input/change/IME 事件、accessibility 投影、focus/blur 与唯一 host-owned 物理编辑器，并增加当前实现的 field 尺寸、边框、focus ring 与 disabled 呈现。兼容比较基线固定到 shadcn-ui/ui revision `3d98900e9b73c45f035f8109e9d41ba6a51685e7` 的 New York 与 Rhea Textarea；`asChild` 明确不提供，其他差异统一记录为 compatibility differences。"

  en: "Shadcn Textarea Root is a direct prototype over `P-BASE-TEXTAREA`. It retains Base Textarea controlled and uncontrolled value, normalized input/change/IME events, accessibility projection, focus and blur, and the single host-owned physical editor while adding the currently implemented field dimensions, border, focus ring, and disabled presentation. Its compatibility baseline is the New York and Rhea Textarea at shadcn-ui/ui revision `3d98900e9b73c45f035f8109e9d41ba6a51685e7`; `asChild` is explicitly unavailable, and all other divergences are tracked as compatibility differences."

criteria:
  - id: P-SHADCN-TEXTAREA-UPSTREAM-IDENTITY
    text:
      zh-CN: Shadcn Textarea 必须标记为 Proto UI 维护的非官方 shadcn/ui 衍生实现，并固定 upstream revision/path；本实体只治理 Proto UI 投射，不主张上游所有权或认证。
      en: Shadcn Textarea must identify itself as an unofficial Proto UI-maintained shadcn/ui-derived implementation and pin its upstream revision and path; this entity governs only the Proto UI projection and claims neither upstream ownership nor endorsement.
  - id: P-SHADCN-TEXTAREA-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-textarea-root` 必须通过 `inherits.prototypes` 指向 `P-BASE-TEXTAREA`，并通过 `asTextareaRoot()` 默认引入其 guarantee；若以 setup-only 负向补丁放弃或改写 Base 能力，必须在本实体中声明具体偏离和替代语义。'
      en: '`shadcn-textarea-root` must point to `P-BASE-TEXTAREA` through `inherits.prototypes` and call `asTextareaRoot()` to introduce its guarantees by default; any setup-only negative patch that abandons or rewrites a Base capability must declare the exact deviation and replacement semantics in this entity.'
    references:
      prototypes:
        - id: P-BASE-TEXTAREA
          anchors:
            [
              P-BASE-TEXTAREA-PHYSICAL-TARGET,
              P-BASE-TEXTAREA-VALUE-OWNERSHIP,
              P-BASE-TEXTAREA-EVENTS-AND-IME,
              P-BASE-TEXTAREA-A11Y-AND-FOCUS,
            ]
    dependsOn:
      contracts: [C-AS-HOOK-0001, C-CORE-SYNTAX-0007]
  - id: P-SHADCN-TEXTAREA-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不对 `asTextareaRoot()` 引入的 value ownership、事件归一化、IME、native props、accessibility 或 focus 施加负向补丁；新增 style rules 仅构成视觉增量。
      en: The current implementation applies no negative patch to value ownership, event normalization, IME, native props, accessibility, or focus introduced by `asTextareaRoot()`; its added style rules are visual deltas only.
  - id: P-SHADCN-TEXTAREA-DIRECT-ENTRY
    text:
      zh-CN: 当前 Root protocol 以 `shadcn-textarea-root` direct prototype 公开；本层不额外提供 authored asHook。
      en: The current Root protocol is exposed as the `shadcn-textarea-root` direct prototype; this layer provides no additional authored asHook.
    dependsOn:
      contracts: [C-CORE-SYNTAX-0003]
  - id: P-SHADCN-TEXTAREA-CURRENT-VISUAL-SURFACE
    text:
      zh-CN: "普通 Root 与语义 Field Textarea 共用唯一 paint setup，支持 New York（new-york alias）及八个现代 profiles；显式选择优先于最近 shared scope，再回退 New York。公共规则使用 native field-sizing-content、placeholder muted foreground、基础 text-base 和 viewport.width gte 768 时 text-sm。New York 保留 resize-y/rounded-md/px-3/shadow-xs/150ms；Rhea 使用 resize-none/主题派生 rounded-2xl（基础 radius + 8px）/px-2.5/bg-input/50/transparent border/200ms，无 shadow。未知宽度安全保留基础字号，不在 Adapter 写入断点。"
      en: "Ordinary Root and semantic Field Textarea share one paint setup supporting New York (new-york alias) and all eight modern profiles. Explicit choice wins over nearest shared scope, then New York fallback. Common paint includes native field-sizing-content, muted placeholder color, text-base and text-sm when viewport.width gte 768. New York retains resize-y/rounded-md/px-3/shadow-xs/150ms; Rhea uses resize-none/theme-derived rounded-2xl (base radius + 8px)/px-2.5/bg-input/50/transparent border/200ms without shadow. Unknown width safely retains base font size; no Adapter owns the breakpoint."
    dependsOn:
      contracts: [C-RULE-INTENT-FEEDBACK-STYLE-0001, C-PROTOTYPE-STYLE-CLOSURE-0001]
  - id: P-SHADCN-TEXTAREA-STATE-DRIVEN-STYLES
    text:
      zh-CN: focus、disabled 与 dark colorScheme 的视觉 rule 必须以继承的 Textarea state handle 或 host metadata 为条件。焦点环必须键控继承的 `focusVisible`：Focus 对文本控件的指针聚焦遵循宿主 `:focus-visible` 判定（#438），因此环在点击路径上的表现与 upstream 一致，不得建立第二套 focus、disabled 或 theme truth，也不得依赖宿主 data attribute；具体 attribute 降级方式由 Adapter 拥有，不属于本投影的 guarantee。
      en: Visual rules for focus, disabled, and the dark colorScheme must be conditioned on the inherited Textarea state handles or host metadata. The focus ring must key the inherited `focusVisible` state; Focus honors the host `:focus-visible` determination for pointer-focused text controls (#438), so the ring paints on the pointer path exactly as upstream does. Independently of which state the rule keys, it must not establish a second focus, disabled, or theme source of truth, and must not depend on a host data attribute; the concrete attribute lowering is owned by the Adapter and is not a guarantee of this projection.
    dependsOn:
      contracts: [C-RULE-WHEN-0002, C-RULE-INTENT-FEEDBACK-STYLE-0001]
    references:
      prototypes:
        - id: P-BASE-TEXTAREA
          anchors: [P-BASE-TEXTAREA-A11Y-AND-FOCUS]
  - id: P-SHADCN-TEXTAREA-CONTENTLESS
    text:
      zh-CN: 投影必须返回 contentless renderer。caller prototype 拥有自己的 renderer，因此继承 Base 的 contentless 保证必须在本层重新声明，authored children 不得成为第二个编辑面。
      en: The projection must return a contentless renderer. A caller prototype owns its own renderer, so the inherited Base contentless guarantee must be restated at this layer, and authored children must never become a second editing surface.
    references:
      prototypes:
        - id: P-BASE-TEXTAREA
          anchors: [P-BASE-TEXTAREA-PRESENTATION-SURFACE, P-BASE-TEXTAREA-BOUNDARY]
  - id: P-SHADCN-TEXTAREA-BOUNDARY
    text:
      zh-CN: 投影不得引入第二个编辑器、form workflow、validation message、JS 测量/设置高度的 auto-resize、rich text 或 announcement 协议。按用户最新上游对齐要求，旧 slice 的全部 auto-resize 排除仅对 native CSS field-sizing-content 视觉 intrinsic 明确修订；它不新增编辑状态或 JS 尺寸协议。
      en: The projection must introduce no second editor, form workflow, validation message, JS-measured/height-setting auto-resize, rich text, or announcement protocol. Under the current user request for latest upstream parity, the prior slice-wide auto-resize exclusion is explicitly superseded only for native CSS field-sizing-content visual intrinsic sizing; it introduces no editing state or JS sizing protocol.
    references:
      prototypes:
        - id: P-BASE-TEXTAREA
          anchors: [P-BASE-TEXTAREA-BOUNDARY]
  - id: P-SHADCN-TEXTAREA-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前实体只声明已实现并测试的 inherited behavior 与视觉 surface；相对固定 upstream baseline 的全部差异必须集中在唯一 compatibility open question，并区分 intentional deviation 与 parity gap。
      en: This entity claims only implemented and tested inherited behavior and visual surface; every difference from the pinned upstream baseline must be centralized in one compatibility open question and classified as an intentional deviation or parity gap.
  - id: P-SHADCN-TEXTAREA-AS-CHILD-OMISSION
    text:
      zh-CN: upstream Root props 中的 `asChild` 依 `D-AS-CHILD-OMISSION-0001` 有意不进入 API，任何元素投射均不得被宣称为 Radix Slot 等价实现。
      en: The `asChild` member of upstream Root props is intentionally omitted under `D-AS-CHILD-OMISSION-0001`; no element projection may be claimed as a Radix Slot equivalent.
    dependsOn:
      decisions: [D-AS-CHILD-OMISSION-0001]
  - id: P-SHADCN-TEXTAREA-FIELD-COMPOSITION
    text: The public fieldTextarea entry composes asFieldTextarea and the same setupTextareaVisual as ordinary Root. Optional Field binding remains sole owner of invalid/pending/policy/relationships; ordinary Root retains independent explicit-label semantics. Style scope changes must not replace Base handles, value, selection, IME or focus. Rhea invalid paints destructive border/ring, ring-3, dark ring/40 and dark border/50 from the Field fact.
    dependsOn:
      contracts:
        - id: C-FIELD-TEXTAREA-0001
          since: 0.3.0-alpha.1
        - id: C-RULE-VIEWPORT-WIDTH-0001
          since: 0.3.0-alpha.1
openQuestions:
  - id: P-SHADCN-TEXTAREA-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: 相较固定 shadcn/ui Textarea baseline，当前全部差异分别是有意偏离还是待实现 gap，应按什么顺序收敛？
      en: Against the pinned shadcn/ui Textarea baseline, which current differences are intentional deviations versus implementation gaps, and in what order should the gaps converge?
    context:
      zh-CN: "固定源为 3d98900e9b73c45f035f8109e9d41ba6a51685e7 的 bases/base/ui/textarea.tsx、styles/style-rhea.css、new-york-v4/ui/textarea.tsx。有意差异：asChild 不提供，New York 保留既有 resize-y，原 Root 不自动吸附 Field；invalid 仅由显式语义 fieldTextarea 复用既有 optional Field binding，不映射任意宿主 aria-invalid 或 native validity。fieldTextarea 与 Root 共用 Base editor 和 paint setup，不是平行风格产品。旧 auto-resize 排除按本次用户指示仅修订为允许 native intrinsic CSS，JS 高度测量仍禁止。placeholder 与 md 现由有限颜色通道和受租约 viewport.width Rule 表达。remaining gaps：data-slot/className/任意 native prop forwarding、compiler positive lowering、native intrinsic/resizing/raster 和独立批准。普通 Root 显式 labels 保留；Field 模式拒绝外部关系覆盖。不得把这些 gap 或静态测试当成全部上游 API parity。"
      en: "Sources are bases/base/ui/textarea.tsx, styles/style-rhea.css and new-york-v4/ui/textarea.tsx at 3d98900e9b73c45f035f8109e9d41ba6a51685e7. Intentional differences: asChild is absent, New York retains existing resize-y, and ordinary Root does not absorb Field. Only the explicit semantic fieldTextarea obtains invalid from existing optional Field binding, never arbitrary host aria-invalid/native validity. Field Textarea shares the Base editor and paint setup, not a parallel style product. The old auto-resize exclusion is revised under the current user direction only to permit native intrinsic CSS; JS height measurement remains forbidden. Placeholder and md are now expressed through finite color vocabulary and leased viewport.width Rules. Remaining gaps include data-slot/className/arbitrary native prop forwarding, positive compiler lowering, native intrinsic/resizing/raster evidence and independent approval. Ordinary explicit labels remain; Field mode rejects external relationship overrides. Browsers without native field-sizing support retain native rows/min-height fallback; no JS autosize polyfill is claimed. These gaps or static tests cannot be called complete upstream API parity."


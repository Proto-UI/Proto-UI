revisions:
  - version: 0.3.0-alpha.1
    change: refined
    summary: Source-pinned shared New York/Rhea paint, optional Field invalid and explicit native intrinsic boundary revision; no JS sizing or full-host parity claim.
  - version: 0.3.0-alpha.0
    change: refined
    summary: Closed the portable field surface with explicit foreground and vertical-resize intent while leaving host normalization to each Adapter profile.
  - version: 0.3.0-alpha.0
    change: refined
    summary: Restored the focus ring to the inherited focusVisible state after #438 aligned Focus with the host :focus-visible determination for pointer-focused text controls.
  - version: 0.3.0-alpha.0
    change: introduced
    summary: Introduced the Shadcn Textarea projection with Base inheritance, restated contentless renderer, and centralized upstream differences.

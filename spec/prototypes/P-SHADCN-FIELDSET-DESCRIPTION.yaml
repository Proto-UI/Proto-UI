id: P-SHADCN-FIELDSET-DESCRIPTION
type: prototype
title: shadcn Fieldset description
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: 可移植分组的 draft 方向。原生无障碍、跨 Adapter 实现、关系生命周期与独立精确 head 验收仍阻塞稳定准入；synthetic DOM 与源码 token 不建立这些保证。
  en: Draft portable grouping direction. Native accessibility, cross-Adapter realization, relation lifetime and independent exact-head acceptance remain activation blockers; synthetic DOM and source tokens do not establish them.
summary: Direct Base projection of passive Fieldset description.
statement: &a1
  zh-CN: 通过限定域 description 关系向同一 Root 贡献被动描述，镜像继承 disabled，不创建 live region、编辑器或校验状态。
  en: Contribute passive descriptive content to the same Root through the scoped description relationship, mirror inherited disabled, and create no live region, editor or validation state.
criteria:
  - id: P-SHADCN-FIELDSET-DESCRIPTION-SEMANTICS
    text: *a1
  - id: P-SHADCN-FIELDSET-DESCRIPTION-INHERITANCE
    text:
      zh-CN: 消费一次 asFieldsetDescription 并保留继承 renderer、Props、exposes 与 modules；不增加第二策略或关系 owner。
      en: Consume asFieldsetDescription once and retain the inherited renderer, Props, exposes and modules; add no second policy or relationship owner.
  - id: P-SHADCN-FIELDSET-DESCRIPTION-PRESENTATION
    text:
      zh-CN: 小号正常字重、弱化色且可换行的帮助文本。
      en: Small normal-weight muted wrapping help text.

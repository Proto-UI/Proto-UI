  roles:
    root:
      cardinality:
        min: 1
        max: 1
    heading:
      cardinality:
        min: 1
        max: 1
    trigger:
      cardinality:
        min: 1
        max: 1
    content:
      cardinality:
        min: 1
        max: 1
  relations:
    - kind: contains
      parent: root
      child: heading
    - kind: contains
      parent: heading
      child: trigger
    - kind: contains
      parent: root
      child: content

id: P-BASE-ACCORDION-ITEM
type: prototype
title: Base Accordion item
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: 'Finf #872 的 draft 实现方向。稳定准入需要独立审查及当前浏览器/native、材质与 GPUI 证据；synthetic DOM 通过不等于九维完成。'
  en: 'Draft implementation direction for Finf #872. Stable admission requires independent review and current browser/native, material and GPUI evidence; synthetic DOM success is not nine-dimension completion.'
summary: Independent Accordion item protocol with JSON ownership and exact Anatomy boundaries.
statement:
  zh-CN: 独立编写的 Proto UI 协议。APG及风格库提供比较证据，不是实现授权或继承API。复用 Collection、Anatomy、Context、A11y、asTrigger、asFocusable及L1 lifecycle。
  en: An independently authored Proto UI protocol. APG and design libraries provide comparison evidence, not implementation authority or inherited APIs. Shared capabilities are Collection, Anatomy, Context, A11y, asTrigger, asFocusable and L1 lifecycle.
criteria:
  - id: P-BASE-ACCORDION-ITEM-IDENTITY
    text:
      zh-CN: Item value 必填非空；每个 Root 的登记键唯一，重复身份 fail closed。身份来自作者键而非集合索引；存活迁入读取目标 Root 并退出原成员关系。
      en: Item value is required and non-empty; registered values are unique per Root and duplicate identity fails closed. Identity is stable by authored key, never collection index. Live adoption reads the destination Root and retires former membership.
  - id: P-BASE-ACCORDION-ITEM-DERIVATION
    text:
      zh-CN: Item 从当前 Root 与局部 disabled 派生 open、disabled、collapseBlocked，向 Heading/Trigger/Content 提供 item 域 context；重入 owner 更新优于旧通知。
      en: Item derives open, disabled and collapseBlocked from the current Root plus local disabled. It supplies one item-scoped context to Heading/Trigger/Content; reentrant owner updates win over stale notifications.
dependsOn:
  contracts:
    - C-PROPS-0001
    - C-CONTEXT-0006
    - C-ANATOMY-0004
    - C-A11Y-0001
    - C-LIFECYCLE-0008
    - C-A11Y-PART-RELATIONSHIP-0001
  decisions:
    - D-BASE-PROTOTYPE-INDEPENDENCE-0001
  prototypes:
    - P-BASE-ACCORDION
verifies:
  tests:
    - T-BASE-ACCORDION-0001
sources:
  - path: packages/prototypes/base/src/accordion/item.proto.ts
  - path: packages/prototypes/base/src/accordion/types.ts
  - path: packages/prototypes/base/src/accordion/shared.ts
  - path: https://www.w3.org/WAI/ARIA/apg/patterns/accordion/
openQuestions:
  - id: P-BASE-ACCORDION-ITEM-Q-ADMISSION
    question:
      zh-CN: 何时完成精确head的浏览器/native、辅助技术、GPUI及独立审查并准入此draft？
      en: When have exact-head browser/native, assistive-technology, GPUI and independent review evidence admitted this draft?
    blocks:
      - activation:P-BASE-ACCORDION-ITEM
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Cataloged the bounded Accordion family independently; retained draft admission and explicit native evidence debt.
tags:
  - prototype
  - base
  - accordion
anatomy:

id: P-BRUTALIST-SWITCH-THUMB
type: prototype
title: 'Brutalist Switch Thumb inherits Base state and solely owns centered checked motion'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Switch Thumb preserves Base checked/disabled facts and projects a constant white 16px circular disc, centered within the 24x48 track, with one 20px transform movement and a reduced-motion fallback.'

statement:
  en: P-BRUTALIST-SWITCH-THUMB preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-SWITCH-THUMB 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-SWITCH-THUMB-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Switch Thumb through `asSwitchThumb()` once and must not redefine Base checked or disabled protocol semantics; press feedback remains on the root, not the thumb. Visual projection may only consume the projected `checked` handle.


      zh-CN: >-
        该 prototype 必须通过 `asSwitchThumb()` 一次性继承 Base Switch Thumb，不得重定义 Base 的 checked 或 disabled 协议语义；press 反馈保留在 root 而非 thumb。视觉投射只能消费投影出的 `checked` handle。


  - id: P-BRUTALIST-SWITCH-THUMB-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-switch-thumb` and is the only public Switch Thumb entry in this foundation slice.
      zh-CN: 直接 prototype 入口名为 `brutalist-switch-thumb`，且是本 foundation 切片中唯一公开的 Switch Thumb 入口。
  - id: P-BRUTALIST-SWITCH-THUMB-SINGLE-MOVEMENT
    text:
      en: 'Thumb is absolutely placed at left-1 top-1/2 with -translate-y-1/2. It alone moves from translate-x-0 to translate-x-5 (20px). Both endpoints retain 6px outer inset and vertical centering within the 48x24 track. Placement is physically left-to-right even in an RTL ancestor; mirrored semantics are not claimed.'
      zh-CN: 'Thumb 绝对定位于 left-1 top-1/2 并使用 -translate-y-1/2；只有它从 translate-x-0 移动到 translate-x-5（20px）。两个端点均保留 6px 外侧留白并在 48×24 track 内垂直居中。RTL 祖先下仍采用物理从左到右定位，不声称镜像语义。'

  - id: P-BRUTALIST-SWITCH-THUMB-VISUAL-GRAMMAR
    text:
      en: 'Thumb is a rounded-full size-4 white disc with border-2 border-black and no shadow. The 150ms transform transition has cubic-bezier(0.4,0,0.2,1) easing; reduced motion disables it. White fill and 16px size remain unchanged throughout checked, unchecked and intermediate animation frames.'
      zh-CN: 'Thumb 是 rounded-full size-4 白色圆盘，带 border-2 border-black、无阴影。transform transition 为 150ms、cubic-bezier(0.4,0,0.2,1)；reduced motion 下关闭。checked、unchecked 与中间 animation frame 均保持白色和 16px 尺寸。'


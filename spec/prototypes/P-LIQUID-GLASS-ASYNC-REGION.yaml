id: P-LIQUID-GLASS-ASYNC-REGION
type: prototype
title: Liquid Glass Async Region projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native and material-host evidence plus independent review; source presence, private package availability and intent frames are not release, conformance or Apple-equivalence admission.
summary: Liquid Glass projection of P-BASE-ASYNC-REGION with neutral ink only.
statement:
  en: The Prototype invokes asAsyncRegionRoot() once, forwards modules and render, and preserves busy semantics, content and focus.
criteria:
  - id: P-LIQUID-GLASS-ASYNC-REGION-BASE
    text:
      en: Invoke asAsyncRegionRoot() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias or Base.setup call.
  - id: P-LIQUID-GLASS-ASYNC-REGION-VISUAL
    text:
      en: 'Semantic-only: Base owns busy projection, descendants and focus; the family adds neutral readable foreground with no loader widget, announcement or material owner. Exact functional material clauses are provisional: real provider capability, missing-host opaque fallback and bounded source leases stay governed by the shared V2 material contract.'
  - id: P-LIQUID-GLASS-ASYNC-REGION-CLOSURE
    text:
      en: All family appearance is authored through feedback tokens, typed material intent and Rules with explicit finite physical translation; no website-only CSS, private Apple asset or Adapter component-name dispatch may supply default intent, and explicit liquid-glass intent is never silently replaced by adaptive native blur.
  - id: P-LIQUID-GLASS-ASYNC-REGION-BOUNDARY
    text:
      en: Exact-head browser, native, material-provider and Compiler evidence plus independent review remain open; the package is private and source-only. Apple documentation is a design reference, not implementation, asset or equivalence evidence. Catalog presence is a draft relation, not acceptance.
dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
inherits:
  prototypes:
    - P-BASE-ASYNC-REGION
verifies:

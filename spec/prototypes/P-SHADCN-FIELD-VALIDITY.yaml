id: P-SHADCN-FIELD-VALIDITY
type: prototype
title: shadcn Field validity
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: Finf Field 的 draft 契约及投影。稳定准入仍需独立审查、精确 head 的原生输入、辅助技术、视觉/材质与 GPUI 证据；synthetic DOM 测试不建立这些保证。
  en: Draft Finf Field contract and projections. Stable admission requires independent review and exact-head
    native input, assistive technology, visual/material and GPUI evidence; synthetic DOM checks do not
    establish those guarantees.
summary: Direct Base Field validity design-language projection.
statement:
  zh-CN: The style family owns only presentation and inherits the exact Base atom. It does not install its own
    validation, control, focus, callback, or relationship owner.
  en: The style family owns only presentation and inherits the exact Base atom. It does not install its own
    validation, control, focus, callback, or relationship owner.
criteria:
  - id: P-SHADCN-FIELD-VALIDITY-INHERITANCE
    text:
      zh-CN: Calls asFieldValidity exactly once, preserves its renderer and static modules, and retains all Base
        JSON Props/exposes.
      en: Calls asFieldValidity exactly once, preserves its renderer and static modules, and retains all Base JSON
        Props/exposes.
  - id: P-SHADCN-FIELD-VALIDITY-STYLE
    text:
      zh-CN: Uses family-owned layout, wrapping, focus-visible, disabled and invalid presentation derived from
        canonical Base state. Invalidity includes a textual Error; color is never the only explanation. Native
        layout, text scaling and visual parity require source-bound browser evidence.
      en: Uses family-owned layout, wrapping, focus-visible, disabled and invalid presentation derived from
        canonical Base state. Invalidity includes a textual Error; color is never the only explanation. Native
        layout, text scaling and visual parity require source-bound browser evidence.
inherits:
  prototypes:
    - P-BASE-FIELD-VALIDITY
dependsOn:
  contracts:
    - C-FEEDBACK-STYLE-0003
verifies:
  tests:
    - T-BASE-FIELD-0001
sources:
  - path: packages/prototypes/shadcn/src/field/validity.proto.ts
  - path: packages/prototypes/shadcn/src/field/index.ts
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added a direct independently authored Base Field presentation; no native optical or release-complete
      claim.
tags:
  - prototype
  - shadcn
  - field

id: P-SHADCN-DROPDOWN-MENU-LABEL
type: prototype
title: shadcn Dropdown Menu label
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: 组成语义和源码投影已明确；本家实际绘制、全宿主、native/GPUI、打包和独立审查尚未完成。
  en: Composition semantics and source projection are bounded; family paint, all hosts, native/GPUI, packed consumers and independent review remain pending.
summary: Family-owned passive paint over the explicit Dropdown label definition.
statement:
  zh-CN: 本原型只在共同的 label 定义上添加本家排版、间距与视觉反馈，不增加焦点、快捷键或press owner。
  en: This prototype adds family typography, spacing and feedback to the common label definition without adding a focus, shortcut or press owner.
criteria:
  - id: P-SHADCN-DROPDOWN-MENU-LABEL-SEMANTICS-AND-PAINT
    text:
      zh-CN: 保留对应Base定义的语义与生命周期；视觉源、偏差和未验证边界须显式记录。
      en: Preserve the corresponding Base semantics and lifecycle; record the visual reference, deviations and unverified boundaries explicitly.
  - id: P-SHADCN-DROPDOWN-MENU-LABEL-INSET
    text:
      zh-CN: 本家 inset 视觉 prop 默认 false；true 投射固定 New York 的物理左侧 pl-8（包括 RTL），右侧 pr-2，动态变更不改变 Base 的最近 Group 命名、被动焦点边界或生命周期。
      en: The family-only inset visual prop defaults to false; true projects the fixed New York physical-left pl-8 and right pr-2 recipe, including RTL. Dynamic changes do not alter Base nearest-Group naming, passive focus boundaries or lifecycle.
inherits:
  prototypes:
    - P-BASE-DROPDOWN-MENU-LABEL
verifies:
  tests: [T-BASE-DROPDOWN-COMPOSITION-0001, T-SHADCN-DROPDOWN-MENU-LABEL-0001]
sources:

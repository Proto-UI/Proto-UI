    label: Selected fixed New York Label/Item source; physical-left inset in LTR and RTL.
  - path: https://github.com/shadcn-ui/ui/blob/c2a67849be260701852b0977ba15eb5f3a0ce2a4/apps/v4/registry/styles/style-nova.css
    label: Historical Nova Label inset recipe; historical registry snapshot byte equivalence not claimed.
  - path: packages/prototypes/shadcn/src/dropdown/types.ts
  - path: packages/prototypes/shadcn/test/dropdown-label.test.ts
  - path: packages/prototypes/shadcn/src/dropdown/label.proto.ts
revisions:
  - version: 0.3.0-alpha.1
    change: refined
    summary: Align Label/Item paint and physical-left inset with fixed New York 02cad611; retain prior Nova history and pending exact-head browser acceptance.

  - version: 0.3.0-alpha.1
    change: refined
    summary: Added the bounded family-only inset visual prop over unchanged Base label semantics; complete host and visual acceptance remains pending.
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Defined the passive family projection without admitting unverified visual or platform parity.
tags: [prototype, shadcn, dropdown-menu, composition]

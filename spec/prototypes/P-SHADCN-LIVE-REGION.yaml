  - path: packages/prototypes/shadcn/src/live-region/index.ts
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Shadcn Live Region semantic-only projection cataloged as a draft family projection over the implemented source slice.
tags:

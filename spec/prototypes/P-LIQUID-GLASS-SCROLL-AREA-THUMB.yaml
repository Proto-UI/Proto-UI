id: P-LIQUID-GLASS-SCROLL-AREA-THUMB
type: prototype
title: Liquid Glass Scroll Area Thumb Scroll Area projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native and material-host evidence plus independent review; source presence, private package availability and intent frames are not release, conformance or Apple-equivalence admission.
summary: Liquid Glass Scroll Area part over P-BASE-SCROLL-AREA-THUMB; a Proto extension.
statement:
  en: The Prototype invokes asScrollAreaThumb() once and preserves the exact Base protocol while adding family paint per its stated role.
criteria:
  - id: P-LIQUID-GLASS-SCROLL-AREA-THUMB-BASE
    text:
      en: Invoke asScrollAreaThumb() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias or Base.setup call.
  - id: P-LIQUID-GLASS-SCROLL-AREA-THUMB-VISUAL
    text:
      en: 'Thumb is the composed control route with family-scoped session/retirement; it owns no offset. Exact functional material clauses are provisional: real provider capability, missing-host opaque fallback and bounded source leases stay governed by the shared V2 material contract.'
  - id: P-LIQUID-GLASS-SCROLL-AREA-THUMB-EXTENSION
    text:
      en: Scroll area composed chrome is a Proto design-language extension, not an Apple or platform-scrollbar equivalence claim.
  - id: P-LIQUID-GLASS-SCROLL-AREA-THUMB-CLOSURE
    text:
      en: All family appearance is authored through feedback tokens, typed material intent and Rules with explicit finite physical translation; no website-only CSS, private Apple asset or Adapter component-name dispatch may supply default intent, and explicit liquid-glass intent is never silently replaced by adaptive native blur.
  - id: P-LIQUID-GLASS-SCROLL-AREA-THUMB-BOUNDARY
    text:
      en: Exact-head browser, native, material-provider and Compiler evidence plus independent review remain open; the package is private and source-only. Apple documentation is a design reference, not implementation, asset or equivalence evidence. Catalog presence is a draft relation, not acceptance.

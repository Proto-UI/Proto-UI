id: P-BASE-SEPARATOR
type: prototype
title: Base Separator protocol
status: draft
since: 0.2.0-rc.7
summary: Base Separator defines orientation and decorative accessibility semantics without interaction.
statement:
  zh-CN: Base Separator 仅拥有 horizontal/vertical orientation 与 decorative 语义；decorative 默认隐藏于 accessibility tree，semantic 模式暴露 separator role 与 aria-orientation。
  en: Base Separator owns only horizontal/vertical orientation and decorative semantics; decorative mode is hidden from the accessibility tree by default, while semantic mode exposes separator role and aria-orientation.
criteria:
  - id: P-BASE-SEPARATOR-ORIENTATION
    text:
      zh-CN: orientation 必须默认为 horizontal 并支持 vertical。
      en: orientation must default to horizontal and support vertical.
  - id: P-BASE-SEPARATOR-DECORATIVE
    text:
      zh-CN: decorative=true 必须隐藏于 accessibility tree，且不得暴露 separator role 或 aria-orientation。
      en: decorative=true must be hidden from the accessibility tree and expose neither separator role nor aria-orientation.
  - id: P-BASE-SEPARATOR-SEMANTIC
    text:
      zh-CN: decorative=false 必须暴露 separator role 与对应 aria-orientation。
      en: decorative=false must expose separator role and the corresponding aria-orientation.
  - id: P-BASE-SEPARATOR-CONTENTLESS
    text:
      zh-CN: Separator 必须是 contentless，不得渲染会被 decorative 语义意外隐藏的后代内容。
      en: Separator must be contentless and render no descendant content that decorative semantics could hide accidentally.
  - id: P-BASE-SEPARATOR-NO-INTERACTION
    text:
      zh-CN: Separator 不得声明 focus、tab stop、event、command、activation 或 mutable value 通路。
      en: Separator must declare no focus, tab-stop, event, command, activation, or mutable-value channel.
dependsOn:
  contracts:
    - C-CORE-SYNTAX-0003
    - C-PROPS-0001
    - C-STATE-0001
    - C-EXPOSE-STATE-0001
    - C-AS-HOOK-0001
    - C-A11Y-0001
verifies:
  tests: [T-BASE-SEPARATOR-0001]
sources:
  - path: packages/prototypes/base/src/separator/root.proto.ts
  - path: packages/prototypes/base/src/separator/types.ts
revisions:
  - version: 0.2.0-rc.7
    change: rewritten
    summary: Rewrote Separator as a minimal accessibility protocol.
tags: [prototype, base, separator]

id: P-BOOTSTRAP-2-3-2-TABS
type: prototype
title: Bootstrap 2.3.2 Tabs root directly projects the Base Tabs protocol
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Draft extension inherits the existing draft Base Tabs definition; exact-commit native interaction/paint, generated preset and packed-consumer resource proof, and independent admission remain incomplete. Cataloging does not promote Base or family guarantees.
summary: Direct Bootstrap 2.3.2 root with inherited Base ownership and a separately bounded family appearance.
statement:
  en: The Root is the sole selected-value and request owner. Preserve Base value/defaultValue, orientation, activationMode, value/valueChange exposes, controlled request versus accepted truth, same-domain context, anatomy and teardown. Consume asTabsRoot once; do not introduce a second selection owner or a cross-family fallback.
criteria:
  - id: P-BOOTSTRAP-2-3-2-TABS-BASE-INHERITANCE
    text:
      en: The Root is the sole selected-value and request owner. Preserve Base value/defaultValue, orientation, activationMode, value/valueChange exposes, controlled request versus accepted truth, same-domain context, anatomy and teardown. Consume asTabsRoot once; do not introduce a second selection owner or a cross-family fallback.
  - id: P-BOOTSTRAP-2-3-2-TABS-DIRECT-ENTRY
    text:
      en: Expose the independently defined bootstrap-2-3-2-tabs-root prototype and typed tabsRoot export through @proto.ui/prototypes-bootstrap-2-3-2/tabs. This is a private source-only entry; registry publication or unsupported Compiler/non-Web admission must not be inferred.
  - id: P-BOOTSTRAP-2-3-2-TABS-VISUAL-DEFAULT
    text:
      en: Provide a shrinkable vertical grouping of the List and Content with readable inherited foreground. The Root has no activation surface.
openQuestions:
  - id: P-BOOTSTRAP-2-3-2-TABS-Q-ADMISSION
    question:
      en: When do exact-source native interaction and same-state screenshots, generated/published-resource closure and independent review support admission?
    blocks:
      - activation:P-BOOTSTRAP-2-3-2-TABS
sources:
  - path: spec/prototypes/P-BASE-TABS.yaml
  - path: packages/prototypes/bootstrap-2-3-2/src/tabs/root.proto.ts

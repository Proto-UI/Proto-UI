id: P-LIQUID-GLASS-SLIDER-FIELD-THUMB
type: prototype
title: Liquid Glass Slider Field Thumb projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native and material-host evidence plus independent review; source presence, private package availability and intent frames are not release, conformance or Apple-equivalence admission.
summary: Liquid Glass scalar Slider part over P-BASE-SLIDER-FIELD-THUMB.
statement:
  en: The Prototype invokes asSliderFieldThumb() once and preserves the exact Base protocol while adding family paint per its stated role.
criteria:
  - id: P-LIQUID-GLASS-SLIDER-FIELD-THUMB-BASE
    text:
      en: Invoke asSliderFieldThumb() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias or Base.setup call.
  - id: P-LIQUID-GLASS-SLIDER-FIELD-THUMB-VISUAL
    text:
      en: 'Field-bound Thumb shares the scalar recipe plus the optional Field binding, invalid and disabled policy. Exact functional material clauses are provisional: real provider capability, missing-host opaque fallback and bounded source leases stay governed by the shared V2 material contract.'
  - id: P-LIQUID-GLASS-SLIDER-FIELD-THUMB-CLOSURE
    text:
      en: All family appearance is authored through feedback tokens, typed material intent and Rules with explicit finite physical translation; no website-only CSS, private Apple asset or Adapter component-name dispatch may supply default intent, and explicit liquid-glass intent is never silently replaced by adaptive native blur.
  - id: P-LIQUID-GLASS-SLIDER-FIELD-THUMB-BOUNDARY
    text:
      en: Exact-head browser, native, material-provider and Compiler evidence plus independent review remain open; the package is private and source-only. Apple documentation is a design reference, not implementation, asset or equivalence evidence. Catalog presence is a draft relation, not acceptance.

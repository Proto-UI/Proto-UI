id: P-LIQUID-GLASS-DRAWER
type: prototype
title: Liquid Glass Drawer projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native and material-host evidence plus independent review; source presence, private package availability and intent frames are not release, conformance or Apple-equivalence admission.
summary: Liquid Glass Drawer family over the Base Drawer protocol with functional sheet chrome.
statement:
  en: The family composes the exported Base Drawer parts (Root, Trigger, Mask, Content, Title, Description, Close, Handle) plus Header and Footer, each consuming its matching hook once. DRAWER-SCROLL is the Content-owned semantic scroll declaration and DRAWER-ACCEPTED-SIDE is a read-only owner observation helper; neither is a rendered part or a cataloged family entity.
criteria:
  - id: P-LIQUID-GLASS-DRAWER-BASE
    text:
      en: 'Invoke asDrawer{Root,Trigger,Mask,Content,Title,Description,Close,Handle,Header,Footer}() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias or Base.setup call.'
  - id: P-LIQUID-GLASS-DRAWER-VISUAL
    text:
      en: 'Content is the governed functional material owner along its edge; edge-specific paint consumes the established handle/edge helper while Base keeps open, admission, presence and scroll ownership. Exact functional material clauses are provisional: real provider capability, missing-host opaque fallback and bounded source leases stay governed by the shared V2 material contract.'
  - id: P-LIQUID-GLASS-DRAWER-EXTENSION
    text:
      en: P-BASE-DRAWER-SCROLL and P-BASE-DRAWER-ACCEPTED-SIDE are helper/boundary definitions consumed by Content and presentation, not manufactured family parts; they are intentionally uncataloged as standalone entities.
  - id: P-LIQUID-GLASS-DRAWER-CLOSURE
    text:
      en: All family appearance is authored through feedback tokens, typed material intent and Rules with explicit finite physical translation; no website-only CSS, private Apple asset or Adapter component-name dispatch may supply default intent, and explicit liquid-glass intent is never silently replaced by adaptive native blur.
  - id: P-LIQUID-GLASS-DRAWER-BOUNDARY
    text:
      en: Exact-head browser, native, material-provider and Compiler evidence plus independent review remain open; the package is private and source-only. Apple documentation is a design reference, not implementation, asset or equivalence evidence. Catalog presence is a draft relation, not acceptance.
dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
    - C-FEEDBACK-MATERIAL-0001
    - C-RULE-INTENT-FEEDBACK-MATERIAL-0001
inherits:
  prototypes:
    - P-BASE-DRAWER
verifies:
  tests:
    - T-LIQUID-GLASS-DRAFT-OVERLAY-0001
sources:

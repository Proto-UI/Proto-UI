id: P-BRUTALIST-TEXT
type: prototype
title: Brutalist Text presentation projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: New bounded Text presentation slice has source-backed Web Adapter and compiler evidence. It remains draft pending independent review and real-browser visual admission; native GPUI typography omissions remain explicit.
summary: Portable Text presentation inputs realized as standard Rule and Feedback style plans.
statement:
  en: Brutalist Text is a Proto UI-authored projection of P-BASE-TEXT. It introduces no new interaction or native document semantics and claims no upstream component/API parity. Font and ink resolve against the selected family's existing theme variables; the public finite inputs map to standard typography tokens.
criteria:
  - id: P-BRUTALIST-TEXT-INHERITANCE
    text:
      en: The projection invokes asTextRoot and preserves its slot, defaults, passive boundary and independent presentation axes without negative patches.
  - id: P-BRUTALIST-TEXT-PROJECTION
    text:
      en: Each input selects exactly one token for its axis through def.rule and feedback.style, except leading size, which intentionally contributes no leading token. Size maps to text-xs through text-5xl, tone to text-foreground/text-muted-foreground/text-inherit, weight to font-normal/medium/semibold/bold, font to font-sans/heading/mono, leading tighter to leading-[1.1], tracking tighter to tracking-tighter, other explicit leading and tracking values to their named tokens, emphasis to not-italic/italic and decoration to no-underline/underline/line-through. Explicit leading other than size wins over composite size line-height. With leading size, xs|sm|base|lg|xl|2xl|3xl|4xl|5xl retain respectively 1rem|1.25rem|1.5rem|1.75rem|1.75rem|2rem|2.25rem|2.5rem|1 line-height from their size tokens. Missing size falls back to base. An initially invalid size falls back to base; provided empty or invalid size after a valid value preserves that previous value under the existing Props contract. Default leading normal remains 1.5; tighter is 1.1 and tracking tighter is -0.05em. Removing props restores defaults on the same subject.
  - id: P-BRUTALIST-TEXT-CONSUMPTION
    text:
      en: Public root and /text exports include textRoot, brutalistTextRoot, BrutalistTextRoot and TextRootProps/TextRootExposes with family aliases. CLI brutalist-text generates WC, React, Vue and Vue2 facades. Real four-Adapter DOM evidence does not imply browser visual acceptance or native parity. Web compiler owns these declarations; unsupported CLI hosts are rejected. GPUI currently reports unmapped inherit color, font-style, letter-spacing and text-decoration-line rather than claiming their realization.
inherits:
  prototypes:
    - P-BASE-TEXT
dependsOn:
  contracts:
    - C-FEEDBACK-STYLE-0002
    - C-FEEDBACK-STYLE-0003
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
verifies:

id: P-LIQUID-GLASS-TOOLTIP-CONTENT
type: prototype
title: Liquid Glass Tooltip Content Tooltip projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native and material-host evidence plus independent review; source presence, private package availability and intent frames are not release, conformance or Apple-equivalence admission.
summary: Liquid Glass Tooltip part over P-BASE-TOOLTIP-CONTENT.
statement:
  en: The Prototype invokes asTooltipContent() once and preserves the exact Base protocol while adding family paint per its stated role.
criteria:
  - id: P-LIQUID-GLASS-TOOLTIP-CONTENT-BASE
    text:
      en: Invoke asTooltipContent() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias or Base.setup call.
  - id: P-LIQUID-GLASS-TOOLTIP-CONTENT-VISUAL
    text:
      en: 'Content carries bounded tooltip chrome within Base presence; zero-duration configuration does not establish motion completion. Exact functional material clauses are provisional: real provider capability, missing-host opaque fallback and bounded source leases stay governed by the shared V2 material contract.'
  - id: P-LIQUID-GLASS-TOOLTIP-CONTENT-CLOSURE
    text:
      en: All family appearance is authored through feedback tokens, typed material intent and Rules with explicit finite physical translation; no website-only CSS, private Apple asset or Adapter component-name dispatch may supply default intent, and explicit liquid-glass intent is never silently replaced by adaptive native blur.
  - id: P-LIQUID-GLASS-TOOLTIP-CONTENT-BOUNDARY
    text:
      en: Exact-head browser, native, material-provider and Compiler evidence plus independent review remain open; the package is private and source-only. Apple documentation is a design reference, not implementation, asset or equivalence evidence. Catalog presence is a draft relation, not acceptance.
dependsOn:
  contracts:

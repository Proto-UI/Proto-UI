id: P-BRUTALIST-HOVER-CARD
type: prototype
title: Brutalist Hover Card inherits Base Hover Card and layers a relative inline-flex root
status: draft
since: 0.2.0-rc.7
summary: >-
  Brutalist Hover Card Root inherits Base Hover Card ownership and projects a style-family visual API: an unframed relative inline-flex container that anchors trigger and content; child projections own their surface geometry and depth.


statement:
  en: >-
    Brutalist Hover Card is a draft Proto UI-maintained Neo-Brutalist design-language projection over Base Hover Card. It preserves inherited Base protocol semantics where an inherited prototype is declared and adds only visual/style behavior: an unframed relative inline-flex root container. Surface radius, border, fill, and shadow belong to the relevant child projections.


  zh-CN: >-
    Brutalist Hover Card 是 Proto UI 维护的 draft Neo-Brutalist design-language 投射，建立在 Base Hover Card 之上。它在声明继承关系的位置保留 Base protocol 语义，仅增加视觉/style 行为：无框的 relative inline-flex 根容器；表面的圆角、边框、填充与阴影由对应子投射负责。


criteria:
  - id: P-BRUTALIST-HOVER-CARD-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Hover Card through `asHoverCardRoot()` once and must not redefine Base open, hover, focus, or disabled protocol semantics. Visual projection may only consume the projected state handles.


      zh-CN: >-
        该 prototype 必须通过 `asHoverCardRoot()` 一次性继承 Base Hover Card，不得重定义 Base 的 open、hover、focus 或 disabled 协议语义；视觉投射只能消费投影出的 state handles。


  - id: P-BRUTALIST-HOVER-CARD-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-hover-card-root` and is the only public Hover Card root entry in this foundation slice.
      zh-CN: 直接 prototype 入口名为 `brutalist-hover-card-root`，且是本 foundation 切片中唯一公开的 Hover Card 根入口。
  - id: P-BRUTALIST-HOVER-CARD-VISUAL-GRAMMAR
    text:
      en: >-
        The root projects a `relative inline-flex items-start` container so trigger and content retain their anchor. It adds no visible frame, border, radius, fill, or shadow; the relevant child projections own those surfaces under the source-aligned Brutalist visual grammar.


      zh-CN: >-
        根投射 `relative inline-flex items-start` 容器，保持 trigger 与 content 的锚定关系。根不增加可见外框、边框、圆角、填充或阴影；这些表面由对应子投射按与上游源码对齐的新粗野主义视觉规则负责。


sources:
  - path: packages/prototypes/brutalist/src/hover-card/root.proto.ts
  - path: packages/prototypes/brutalist/src/hover-card/types.ts
  - path: packages/prototypes/brutalist/test/hover-card.test.ts
  - path: packages/prototypes/brutalist/src/style.ts
relates:
  knowledge: [K-BRUTALIST-0001]
dependsOn:
  contracts: [C-CORE-SYNTAX-0003, C-AS-HOOK-0001, C-RULE-INTENT-FEEDBACK-STYLE-0001]
inherits:
  prototypes:
    - id: P-BASE-HOVER-CARD
verifies: { tests: [T-BRUTALIST-HOVER-CARD-0001] }
revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: >-
      Clarified that the unframed root does not force square geometry or hard-shadow surfaces on children; visual surfaces follow their own source-aligned projections. Base ownership and root style output are unchanged.


  - version: 0.2.0-rc.7
    change: introduced
    summary: >-
      Introduced draft Brutalist Hover Card root projection with real public-API criteria (Base inheritance, relative inline-flex entry, visual grammar) on the rc.7 release train. Not present in the immutable rc.6 snapshot.


tags: [prototype, brutalist, neo-brutalist, visual, delta, hover-card]

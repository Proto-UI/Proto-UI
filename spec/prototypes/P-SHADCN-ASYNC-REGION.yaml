id: P-SHADCN-ASYNC-REGION
type: prototype
title: Shadcn Async Region semantic-only projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: >-
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native evidence and independent review; source presence is not conformance or release admission.


summary: Shadcn Async Region root consumes asAsyncRegionRoot once with neutral ink only.
statement:
  en: >-
    The Prototype invokes asAsyncRegionRoot() once, forwards its modules and render, preserves busy projection, authored descendants and focus identity, and adds only neutral foreground presentation. It installs no loading widget, announcement, focus or interaction owner.


criteria:
  - id: P-SHADCN-ASYNC-REGION-BASE
    text:
      en: >-
        Invoke asAsyncRegionRoot() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias or Base.setup call.


  - id: P-SHADCN-ASYNC-REGION-VISUAL
    text:
      en: >-
        Semantic-only: Base owns busy projection and descendants; the family adds only ordinary readable foreground, no animated loader, spinner or material effect.


  - id: P-SHADCN-ASYNC-REGION-CLOSURE
    text:
      en: >-
        All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, raw host escape or Adapter component-name dispatch may supply default intent.


  - id: P-SHADCN-ASYNC-REGION-BOUNDARY
    text:
      en: >-
        Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; catalog presence is a draft relation, not acceptance.


dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
inherits:
  prototypes:
    - P-BASE-ASYNC-REGION
verifies:
  tests:
    - T-SHADCN-PASSIVE-PROJECTIONS-0001
sources:

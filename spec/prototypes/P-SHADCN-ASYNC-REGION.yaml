  - path: packages/prototypes/shadcn/src/async-region/index.ts
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Shadcn Async Region semantic-only projection cataloged as a draft family projection over the implemented source slice.
tags:

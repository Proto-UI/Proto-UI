id: P-LIQUID-GLASS-SELECT
type: prototype
title: Liquid Glass Select Root directly projects Base selection semantics
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Draft pending exact-source native browser and GPUI evidence, optical host proof where applicable, independent review and stable admission.
  zh-CN: 等待精确源码 native browser/GPUI 证据、适用的光学 host 绘制验证、独立审查与稳定准入，保留 draft。
summary: Liquid Glass presentation of the independent Base Select Root protocol.
statement:
  en: 'Directly consume asSelectRoot exactly once, retaining all Base Root props, exposes, requests, anatomy and lifetimes. No other family or Button protocol may own Select semantics.'
  zh-CN: '直接且仅消费一次 asSelectRoot，保留完整 Base Root props、exposes、请求、anatomy 与生命周期；不得由其他体系或 Button 协议持有 Select 语义。'
criteria:
  - id: P-LIQUID-GLASS-SELECT-BASE-INHERITANCE
    text:
      en: 'Directly consume asSelectRoot exactly once, retaining all Base Root props, exposes, requests, anatomy and lifetimes. No other family or Button protocol may own Select semantics.'
      zh-CN: '直接且仅消费一次 asSelectRoot，保留完整 Base Root props、exposes、请求、anatomy 与生命周期；不得由其他体系或 Button 协议持有 Select 语义。'
  - id: P-LIQUID-GLASS-SELECT-DIRECT-ENTRY
    text:
      en: 'Expose liquid-glass-select-root and typed public source exports through @proto.ui/prototypes-liquid-glass/select; private workspace source requires explicit workspace CLI generation and is not a registry publication.'
      zh-CN: '通过 @proto.ui/prototypes-liquid-glass/select 提供 liquid-glass-select-root 与完整类型；private workspace 源码只允许显式 workspace CLI 生成，不代表 registry 已发布。'
  - id: P-LIQUID-GLASS-SELECT-VISUAL-SAFETY
    text:
      en: "Use shrinkable logical layout and readable wrapping labels. Content is the nonmaterial portal/lifetime/frame, Surface solely owns popup paint and complete opaque fallback, and Viewport is the one scrollport. Preserve Base focus, disabled state, anchor/available bounds and item text identity without fixed content height or physical text alignment."
      zh-CN: "使用可收缩逻辑布局和可读换行标签。Content 仅为无材质 portal/lifetime/frame，Surface 独占 popup 绘制与完整不透明 fallback，Viewport 是唯一 scrollport。保留 Base focus、disabled、anchor/available 边界和 ItemText 身份，不引入固定内容高度或物理文字对齐。"
openQuestions:
  - id: P-LIQUID-GLASS-SELECT-Q-ADMISSION
    question:
      en: When do exact-source native interaction/paint evidence and independent review justify stable admission?
      zh-CN: 何时由精确源码原生交互/绘制证据和独立审查支持稳定准入？
    blocks: [activation:P-LIQUID-GLASS-SELECT]
sources:
  - path: packages/prototypes/liquid-glass/src/select/root.proto.ts
  - path: packages/prototypes/liquid-glass/src/select/types.ts
  - path: packages/prototypes/liquid-glass/src/select/index.ts
dependsOn:
  contracts: [C-AS-HOOK-0001, C-RULE-INTENT-FEEDBACK-STYLE-0001]

    label: shadcn/ui v4 new-york Toggle pinned baseline
dependsOn:
  contracts:
    [
      C-AS-HOOK-0001,
      C-CORE-SYNTAX-0003,
      C-CORE-SYNTAX-0007,
      C-PROPS-0001,
      C-PROPS-0003,
      C-RULE-WHEN-0002,
      C-RULE-INTENT-FEEDBACK-STYLE-0001,
    ]
  decisions: [D-PROTOTYPE-ENTITY-NAMING-0001, D-AS-CHILD-OMISSION-0001]
inherits:
  prototypes:
    - id: P-BASE-TOGGLE
      note: Default inherited protocol; explicit setup-time negative-patch criteria may override individual guarantees.
verifies: { tests: [T-SHADCN-TOGGLE-0001] }
revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Declared subject-local content-selection suppression without changing inherited activation or value ownership.
  - version: 0.2.0-rc.0
    change: introduced
    summary: Introduced delta-style Shadcn Toggle cataloging with reversible Base inheritance, pinned upstream identity, current visual API guarantees, intentional asChild omission, and centralized compatibility differences.
tags: [prototype, shadcn, toggle, upstream-derived, delta, compatibility, visual]

id: P-SHADCN-TOGGLE
type: prototype
title: Shadcn Toggle inherits Base Toggle and layers a pinned visual API subset
status: draft
since: 0.2.0-rc.0
summary: Shadcn Toggle is an unofficial Proto UI-maintained projection that inherits Base Toggle by default and adds the currently implemented shadcn-style variant, size, and state-driven visual surface without duplicating Base semantics.
statement:
  zh-CN: >-
    Shadcn Toggle 是在 `P-BASE-TOGGLE` 之上提供 shadcn/ui Toggle 外观与 API 投射的 direct prototype。当前协议保留 Base Toggle 的 persistent active state、activation、focus、disabled、a11y 与 `activeChange` outward signal，并新增两种 `variant`、三种 `size`，以及由 inherited Toggle state 驱动的 active、hover、focus 与 disabled 视觉反馈。兼容比较基线固定到 shadcn-ui/ui revision `f31ed81983653919dd4fe77aee4b4859f610f1dc` 的 v4 new-york Toggle；`asChild` 是明确不提供的 API，其他未对齐项统一记录为 compatibility differences。


  en: >-
    Shadcn Toggle is a direct prototype that projects the shadcn/ui Toggle appearance and API over `P-BASE-TOGGLE`. The current protocol retains Base Toggle persistent active state, activation, focus, disabled, accessibility, and the `activeChange` outward signal while adding two `variant` values, three `size` values, and active, hover, focus, and disabled visual feedback driven by inherited Toggle state. Its compatibility baseline is the v4 new-york Toggle at shadcn-ui/ui revision `f31ed81983653919dd4fe77aee4b4859f610f1dc`; `asChild` is explicitly unavailable, and every other divergence is tracked as a compatibility difference.


criteria:
  - id: P-SHADCN-TOGGLE-CONTENT-SELECTION
    text:
      en: The action subject declares select-none to suppress accidental label selection without replacing inherited activation, active state, focus or accessibility. This follows C-CONTENT-SELECTION-AFFORDANCE-0001 and does not apply blanket suppression to passive content or editors.
    dependsOn:
      contracts:
        - id: C-CONTENT-SELECTION-AFFORDANCE-0001
          since: 0.3.0-alpha.1
  - id: P-SHADCN-TOGGLE-UPSTREAM-IDENTITY
    text:
      zh-CN: Shadcn Toggle 必须明确标记为 Proto UI 维护的非官方 shadcn/ui 衍生实现，并以固定 upstream revision/path 作为兼容比较基线；P 实体只治理 Proto UI 投射，不主张上游所有权或认证。
      en: Shadcn Toggle must identify itself as an unofficial Proto UI-maintained shadcn/ui-derived implementation and use a pinned upstream revision and path as its compatibility baseline; the P entity governs only the Proto UI projection and does not claim upstream ownership or endorsement.
  - id: P-SHADCN-TOGGLE-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-toggle` 必须通过一等 `inherits.prototypes` 关系指向 `P-BASE-TOGGLE`，并通过 `asToggle()` 在 setup 期默认引入其 guarantee。上层原型允许对某个引入能力施加 setup-only 负向补丁或替代，但必须在自身准则中标明被放弃或改写的 Base 能力及替代语义；未声明偏离的 Base guarantee 保持有效。'
      en: '`shadcn-toggle` must point to `P-BASE-TOGGLE` through the first-class `inherits.prototypes` relation and call `asToggle()` to introduce its guarantees by default during setup. The upper-layer prototype may apply a setup-only negative patch or replacement to an introduced capability, but its own criteria must identify the abandoned or rewritten Base capability and the replacement semantics; every Base guarantee without a declared deviation remains effective.'
    references:
      prototypes:
        - id: P-BASE-TOGGLE
          anchors:
            [
              P-BASE-TOGGLE-ROLE-ACTIVE-CONTROL,
              P-BASE-TOGGLE-AUTHORING-ENTRIES,
              P-BASE-TOGGLE-NO-VISUAL-VARIANT-CORE,
            ]
    dependsOn:
      contracts: [C-AS-HOOK-0001, C-CORE-SYNTAX-0007]
  - id: P-SHADCN-TOGGLE-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前 Shadcn Toggle 实现不对 `asToggle()` 引入的 persistent active state、activation、focus、disabled、a11y、interaction state 或 outward signal 施加负向补丁；本实体新增的 props 与 style rules 是视觉/API 增量，不构成 Base 行为反转。
      en: The current Shadcn Toggle implementation applies no negative patch to the persistent active state, activation, focus, disabled, accessibility, interaction state, or outward signals introduced by `asToggle()`; its added props and style rules are visual and API deltas rather than Base-behavior reversals.
  - id: P-SHADCN-TOGGLE-DIRECT-ENTRY
    text:
      zh-CN: 当前 Shadcn Toggle protocol 以 `shadcn-toggle` direct prototype 公开；本层不额外提供 authored asHook。
      en: The current Shadcn Toggle protocol is exposed as the `shadcn-toggle` direct prototype; this layer does not provide an additional authored asHook.
    dependsOn:
      contracts: [C-CORE-SYNTAX-0003]
  - id: P-SHADCN-TOGGLE-VARIANT-PROP
    text:
      zh-CN: 当前 passing API 必须提供 `variant`，可选 default、outline，默认 default；每个值必须投射当前实现对应的 shadcn-style surface tokens。
      en: The current passing API must provide `variant` with default and outline options and a default of default; each value must project the corresponding currently implemented shadcn-style surface tokens.
    dependsOn:
      contracts: [C-PROPS-0001, C-PROPS-0003, C-RULE-INTENT-FEEDBACK-STYLE-0001]
  - id: P-SHADCN-TOGGLE-SIZE-PROP
    text:
      zh-CN: 当前 passing API 必须提供 `size`，可选 default、sm、lg，默认 default；每个值必须投射当前实现对应的尺寸与间距 tokens。
      en: The current passing API must provide `size` with default, sm, and lg options and a default of default; each value must project the corresponding currently implemented size and spacing tokens.
    dependsOn:
      contracts: [C-PROPS-0001, C-PROPS-0003, C-RULE-INTENT-FEEDBACK-STYLE-0001]
  - id: P-SHADCN-TOGGLE-STATE-DRIVEN-STYLES
    text:
      zh-CN: Shadcn Toggle 必须从 inherited active、hovered、focusVisible 与 disabled state 派生当前 active surface、inactive hover、focus ring 与 disabled visual rules；视觉 rule 不得成为另一套 active 或 interaction state 真相。
      en: Shadcn Toggle must derive its current active surface, inactive hover, focus-ring, and disabled visual rules from inherited active, hovered, focusVisible, and disabled state; visual rules must not become a second source of active or interaction-state truth.
    dependsOn:
      contracts: [C-RULE-WHEN-0002, C-RULE-INTENT-FEEDBACK-STYLE-0001]
    references:
      prototypes:
        - id: P-BASE-TOGGLE
          anchors:
            [
              P-BASE-TOGGLE-ACTIVE-EXPOSE,
              P-BASE-TOGGLE-POINTER-HOVER,
              P-BASE-TOGGLE-FOCUSABLE,
              P-BASE-TOGGLE-DISABLED-EXPOSE,
            ]
  - id: P-SHADCN-TOGGLE-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前实体只声明已测试的 inherited active/disabled behavior、variant、size 与 style behavior；对固定 upstream baseline 的所有差异必须集中维护在唯一 compatibility open question 中，并区分 intentional deviation 与尚未实现或待评审的 parity gap。
      en: This entity claims only the tested inherited active and disabled behavior, variant, size, and style behavior; every difference from the pinned upstream baseline must be maintained in one centralized compatibility open question and classified as either an intentional deviation or an unimplemented or pending-review parity gap.
  - id: P-SHADCN-TOGGLE-AS-CHILD-OMISSION
    text:
      zh-CN: upstream `asChild` 依 `D-AS-CHILD-OMISSION-0001` 有意不进入 Shadcn Toggle API；内容保留或元素投射不得被宣称为 Radix Slot 或 `asChild` 等价实现。
      en: Upstream `asChild` is intentionally omitted from the Shadcn Toggle API under `D-AS-CHILD-OMISSION-0001`; content preservation or element projection must not be claimed as a Radix Slot or `asChild` equivalent.
    dependsOn:
      decisions: [D-AS-CHILD-OMISSION-0001]
openQuestions:
  - id: P-SHADCN-TOGGLE-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: 相较固定的 shadcn/ui Toggle baseline，当前全部差异分别是有意偏离还是待实现 gap，以及待实现项应按什么顺序收敛？
      en: Against the pinned shadcn/ui Toggle baseline, which current differences are intentional deviations versus implementation gaps, and in what order should the implementation gaps converge?
    context:
      zh-CN: 已确定的 intentional deviation 是不提供 `asChild`，且内容保留或元素投射不等价于 Radix Slot。当前待实现/待评审差异至少包括 upstream `pressed`、`defaultPressed` 与 `onPressedChange` 相对 Proto UI `active`、`defaultActive` 与 `activeChange` 的 API 映射，className 与 native button prop forwarding、`data-slot`、aria-invalid 与 dark styling、nested SVG handling，以及现有 size、gap、radius、transition、outline shadow、active/hover surface tokens 与 upstream 的精确差异。current passing guarantee 在这些项目实现并通过测试前不得扩大。
      en: The decided intentional deviation is omission of `asChild`, and content preservation or element projection is not a Radix Slot equivalent. Current implementation or review gaps include at least mapping upstream `pressed`, `defaultPressed`, and `onPressedChange` to Proto UI `active`, `defaultActive`, and `activeChange`; className and native-button prop forwarding; `data-slot`; aria-invalid and dark styling; nested-SVG handling; and exact differences in current size, gap, radius, transition, outline shadow, and active or hover surface tokens. The current passing guarantee must not expand until an item is implemented and tested.
    blocks: [shadcn toggle parity roadmap]

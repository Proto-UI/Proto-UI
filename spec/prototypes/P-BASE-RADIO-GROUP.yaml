        Decision,
        Selection and structural invariants,
        Focus and keyboard model,
        Accessibility,
        Form and native-control boundary,
      ]
  - path: packages/prototypes/base/src/radio-group/root.proto.ts
    sections:
      [canonicalSelectedItem, resolveCurrentItemId, setupRadioGroupRoot, base-radio-group-root]
  - path: packages/prototypes/base/src/radio-group/shared.ts
    sections: [RadioGroupContextValue, registerRadioGroupCoordinator, RADIO_GROUP_FAMILY]
  - path: packages/prototypes/base/src/radio-group/types.ts
    sections: [RadioGroupRootProps, RadioGroupRootExposes]
  - path: packages/prototypes/base/test/radio-group.test.ts
    sections:
      - preserves empty and unmatched values without inventing a selection
      - owns uncontrolled requests and emits one accepted change per new selection
      - signals controlled requests without mutating final checked state
      - contains duplicate authoring to one checked item and rejects ambiguous requests
      - preserves value across structural churn and selected-item disablement
      - preserves programmatic current focus across unrelated root updates
      - wraps both arrow axes, supports Home and End, and skips disabled items
      - keeps independent groups and omits deferred form and layout APIs

id: P-SHADCN-TABS-INDICATOR
type: prototype
title: Shadcn Tabs Indicator passive projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: >-
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native evidence and independent review; source presence is not conformance or release admission.


summary: Optional repeatable Tabs Indicator deriving facts only, never selection or measurement ownership.
statement:
  en: >-
    The Prototype invokes asTabsIndicator() once, retaining Base-derived value, activeValue and orientation. It adds bounded indicator paint only; it acquires no selection, focus, event, collection or layout-measurement owner and does not promise automatic positioning.


criteria:
  - id: P-SHADCN-TABS-INDICATOR-BASE
    text:
      en: >-
        Invoke asTabsIndicator() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias or Base.setup call.


  - id: P-SHADCN-TABS-INDICATOR-VISUAL
    text:
      en: >-
        Profile-neutral foreground paint (bg-foreground) marks the indicator slot under the selected Trigger without asserting measured geometry. Indicator presence is optional and repeatable; removal or profile change withdraws only family paint.


  - id: P-SHADCN-TABS-INDICATOR-CLOSURE
    text:
      en: >-
        All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, raw host escape or Adapter component-name dispatch may supply default intent.


  - id: P-SHADCN-TABS-INDICATOR-BOUNDARY
    text:
      en: >-
        Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; catalog presence is a draft relation, not acceptance.


dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
inherits:
  prototypes:
    - P-BASE-TABS-INDICATOR
verifies:

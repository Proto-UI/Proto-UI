id: P-BOOTSTRAP-2-3-2-TOGGLE
type: prototype
title: bootstrap-2-3-2 toggle toggle over Base
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: Draft all-Base coverage increment. Source/unit availability is not release, browser paint, Compiler or native conformance admission.
summary: A genuine asToggle projection; Base retains toggle semantics and this part contributes only appearance.
statement:
  en: The authored Prototype invokes asToggle once. Design-language extension, not the original jQuery stateful button plugin. The archived default gradient/raised shadow becomes a flat inset button under inherited pressed or active state; hover flattens the fill. Metrics use 4px corners and 14/20 typography at a 16px root.
criteria:
  - id: P-BOOTSTRAP-2-3-2-TOGGLE-BASE
    text:
      en: Invoke asToggle once and retain every inherited state, event, focus, editing, context and anatomy owner; never copy the semantic implementation or introduce a competing value owner.
  - id: P-BOOTSTRAP-2-3-2-TOGGLE-API
    text:
      en: Base owns active/defaultActive, activeChange, pressed and hovered transients, disabled suppression, focus and pressed accessibility. No group, form or second active owner is introduced.
  - id: P-BOOTSTRAP-2-3-2-TOGGLE-VISUAL
    text:
      en: Design-language extension, not the original jQuery stateful button plugin. The archived default gradient/raised shadow becomes a flat inset button under inherited pressed or active state; hover flattens the fill. Metrics use 4px corners and 14/20 typography at a 16px root.
  - id: P-BOOTSTRAP-2-3-2-TOGGLE-CLOSURE
    text:
      en: All component appearance is declared by Prototype feedback and Rules and closes through the source-derived finite physical token renderer. No website-only component CSS may supply missing default intent.
  - id: P-BOOTSTRAP-2-3-2-TOGGLE-BOUNDARY
    text:
      en: The package is private and unreleased. Documentation and demos expose the real parts. Actual four-Web browser rendering, general Compiler and GPUI/Flutter/Qt conformance need separate collected evidence; source availability alone is insufficient.

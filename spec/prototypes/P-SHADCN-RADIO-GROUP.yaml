id: P-SHADCN-RADIO-GROUP
type: prototype
title: Shadcn Radio Group Root preserves the Base single-selection owner
status: draft
lifecycleRationale: This three-part presentation inherits the draft Base Radio Group protocol. Its package, interaction and browser evidence supports independent review of the bounded projection, not stable admission of the family.
since: 0.3.0-alpha.1
summary: Shadcn Radio Group is an unofficial Proto UI-maintained projection that preserves the Base value, Collection, roving-focus and accessibility owners while adding the grid presentation.
statement:
  en: Root, Item and Indicator preserve the existing Base Radio Group anatomy, with Root the sole value, Collection, Focus Roving and radiogroup owner. The unofficial draft presentation compares against the content-pinned 2026-10-10 base-nova RadioGroup registry snapshot in sources. It replaces the historical new-york reference without implying Git revision, upstream endorsement, Base UI or Radix API compatibility.
  zh-CN: Root、Item与Indicator保留既有Base Radio Group anatomy，Root是唯一value、Collection、Focus Roving与radiogroup owner。非官方draft呈现比较sources中内容hash固定的2026-10-10 base-nova RadioGroup registry snapshot，替换历史new-york参考，不推断Git revision、上游认可、Base UI或Radix API兼容。

criteria:
  - id: P-SHADCN-RADIO-GROUP-BASE-INHERITANCE
    text:
      en: Root must inherit P-BASE-RADIO-GROUP through asRadioGroupRoot() exactly once, preserving controlled and uncontrolled requests, empty and unmatched values, Collection order and nearest-domain isolation.
      zh-CN: Root 必须通过 asRadioGroupRoot() 恰好继承一次 P-BASE-RADIO-GROUP，保留 controlled/uncontrolled requests、空值与 unmatched value、Collection 顺序及 nearest-domain isolation。
  - id: P-SHADCN-RADIO-GROUP-DIRECT-ENTRY
    text:
      en: The direct Root entry is shadcn-radio-group-root; this layer introduces no authored asHook or convenience wrapper.
      zh-CN: Root direct entry 为 shadcn-radio-group-root；本层不增加 authored asHook 或 convenience wrapper。
  - id: P-SHADCN-RADIO-GROUP-PUBLIC-SURFACE
    text:
      en: >-
        The package root and ./radio-group subpath expose only ShadcnRadioGroupRoot, ShadcnRadioGroupItem, ShadcnRadioGroupIndicator and their shadcnRadioGroupRoot, shadcnRadioGroupItem, shadcnRadioGroupIndicator aliases for this family. Each part's Props, Exposes, StateHandles and AsHookContract types retain its Base shape. The shadcn-radio-group CLI entry exposes these three parts as a compound family without injecting an Indicator or creating another facade.


      zh-CN: >-
        package root 与 ./radio-group subpath 为该 family 仅导出 ShadcnRadioGroupRoot、ShadcnRadioGroupItem、ShadcnRadioGroupIndicator 及其 shadcnRadioGroupRoot、shadcnRadioGroupItem、shadcnRadioGroupIndicator aliases。各 part 的 Props、Exposes、StateHandles 与 AsHookContract types 保留对应 Base shape。shadcn-radio-group CLI entry 将这三个 part 暴露为 compound family，不注入 Indicator 或增加另一层 facade。


  - id: P-SHADCN-RADIO-GROUP-CURRENT-VISUAL-SURFACE
    text:
      en: Root projects grid w-full gap-2; consumer content determines choices and the containing layout determines the available full width.
      zh-CN: Root投射grid w-full gap-2；选项内容由consumer所有，可用满宽由包含它的布局决定。
  - id: P-SHADCN-RADIO-GROUP-OWNERSHIP-BOUNDARY
    text:
      en: The projection must add no second value, selection, Collection, focus, activation, disabled or accessibility owner; Indicator remains an explicit optional and repeatable Item child.
      zh-CN: 投射不得增加第二个 value、selection、Collection、focus、activation、disabled 或 accessibility owner；Indicator 继续作为显式、可选且可重复的 Item child。
  - id: P-SHADCN-RADIO-GROUP-COMPATIBILITY-SUBSET
    text:
      en: >-
        No asChild, form submission or validation, required or invalid state, native input, Toolbar, public orientation or loop, callback prop, visual variant or size API is added. Upstream aria-invalid styles and prop forwarding are excluded because Base does not own those semantics. The explicit Indicator and host-neutral centering are intentional presentation differences, not Radix compatibility claims.


      zh-CN: >-
        不增加 asChild、form submission/validation、required/invalid state、native input、Toolbar、公开 orientation/loop、callback prop 或视觉 variant/size API。Base 不拥有相应语义，因此不投射 upstream aria-invalid 样式或 prop forwarding。显式 Indicator 与 host-neutral 居中为有意呈现差异，不构成 Radix 兼容性声明。



lifecycleRationale:
  en: >-
    Draft catalog relation for an implemented family projection against the pinned Bootstrap 2.3.2 vocabulary. Stable admission requires real consumers, browser/native evidence and independent review; source presence and private package availability are not release or conformance admission.


summary: Field-bound scalar Slider Thumb retaining the optional Field policy owner.
statement:
  en: >-
    The Prototype invokes asSliderFieldThumb() once, preserving the scalar Thumb facts plus the optional Field binding, invalid and disabled policy.


criteria:
  - id: P-BOOTSTRAP-2-3-2-SLIDER-FIELD-THUMB-BASE
    text:
      en: >-
        Invoke asSliderFieldThumb() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias, jQuery/plugin API or Base.setup call.


  - id: P-BOOTSTRAP-2-3-2-SLIDER-FIELD-THUMB-VISUAL
    text:
      en: >-
        Shares the scalar Thumb paint; Field-invalid and disabled facts derive only from the borrowed Field binding.


  - id: P-BOOTSTRAP-2-3-2-SLIDER-FIELD-THUMB-CLOSURE
    text:
      en: >-
        All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, Glyphicons, upstream JavaScript or Adapter component-name dispatch may supply default intent.


  - id: P-BOOTSTRAP-2-3-2-SLIDER-FIELD-THUMB-BOUNDARY
    text:
      en: >-
        Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; the package is private and source-only. Catalog presence is a draft relation, not acceptance.



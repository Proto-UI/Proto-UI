id: P-BRUTALIST-SELECT
type: prototype
title: Brutalist Select Root inherits Base Select ownership
status: draft
since: 0.2.0-rc.7
summary: >-
  Brutalist Select Root inherits Base Select ownership and projects the Neo-Brutalist family entry without adding visual surface of its own. The projection is limited to confirming Base inheritance and the direct prototype entry.


statement:
  en: >-
    Brutalist Select Root is a draft Proto UI-maintained Neo-Brutalist design-language projection over Base Select. It preserves inherited Base protocol semantics (open/value/disabled state ownership) and adds only the direct prototype entry; it contributes no visual surface of its own, delegating styling to its child Trigger/Value/Content/Item projections.


  zh-CN: >-
    Brutalist Select Root 是 Proto UI 维护的 draft Neo-Brutalist design-language 投射，建立在 Base Select 之上。它保留继承的 Base 协议语义（open/value/disabled 状态归属），仅增加直接 prototype 入口；自身不贡献视觉表面，将样式委托给子级 Trigger/Value/Content/Item 投射。


criteria:
  - id: P-BRUTALIST-SELECT-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Select Root through `asSelectRoot()` once and must not redefine Base open, value, disabled, or anchor protocol semantics. Visual projection may only consume the projected state handles.


      zh-CN: >-
        该 prototype 必须通过 `asSelectRoot()` 一次性继承 Base Select Root，不得重定义 Base 的 open、value、disabled 或 anchor 协议语义；视觉投射只能消费投影出的 state handles。


  - id: P-BRUTALIST-SELECT-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-select-root`.
      zh-CN: 直接 prototype 入口名为 `brutalist-select-root`。
sources:
  - path: packages/prototypes/brutalist/src/select/root.proto.ts
relates:
  knowledge: [K-BRUTALIST-0001]
dependsOn:
  contracts: [C-CORE-SYNTAX-0003, C-AS-HOOK-0001, C-RULE-INTENT-FEEDBACK-STYLE-0001]
inherits:
  prototypes:
    - id: P-BASE-SELECT
verifies: { tests: [T-BRUTALIST-SELECT-0001] }
revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: >-
      Introduced draft Brutalist Select projection with real public-API criteria (Base inheritance, direct entry) on rc.7. Not present in immutable rc.6.


tags: [prototype, brutalist, neo-brutalist, visual, delta, select]

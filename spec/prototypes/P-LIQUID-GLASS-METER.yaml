id: P-LIQUID-GLASS-METER
type: prototype
title: Liquid Glass Meter projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native and material-host evidence plus independent review; source presence, private package availability and intent frames are not release, conformance or Apple-equivalence admission.
summary: Liquid Glass Meter family over P-BASE-METER.
statement:
  en: "Each Meter part invokes its matching Base hook once and preserves the actual range, zone, labeling and value render. Track and Indicator are nonmaterial content."
criteria:
  - id: P-LIQUID-GLASS-METER-BASE
    text:
      en: Invoke asMeter* hooks() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias or Base.setup call.
  - id: P-LIQUID-GLASS-METER-VISUAL
    text:
      en: "Root/Label/Track/Indicator/Value map existing Base zones to ordinary readable gauge paint without an optical surface or input owner. Critical status is distinct from Progress indeterminate state; actual palette provenance, contrast and native paint require independent evidence. Meter is not a Progress alias."
  - id: P-LIQUID-GLASS-METER-CLOSURE
    text:
      en: All family appearance is authored through feedback tokens, typed material intent and Rules with explicit finite physical translation; no website-only CSS, private Apple asset or Adapter component-name dispatch may supply default intent, and explicit liquid-glass intent is never silently replaced by adaptive native blur.
  - id: P-LIQUID-GLASS-METER-BOUNDARY
    text:
      en: Exact-head browser, native, material-provider and Compiler evidence plus independent review remain open; the package is private and source-only. Apple documentation is a design reference, not implementation, asset or equivalence evidence. Catalog presence is a draft relation, not acceptance.
dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
inherits:
  prototypes:
    - P-BASE-METER
verifies:
  tests:
    - T-LIQUID-GLASS-CONTENT-SOURCE-0001
sources:
  - path: packages/prototypes/liquid-glass/src/meter/
  - path: packages/prototypes/liquid-glass/src/meter/index.ts
  - path: https://developer.apple.com/design/human-interface-guidelines/materials
    label: Apple HIG Materials design reference only
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Liquid Glass Meter projection cataloged as a draft family projection over the implemented source slice.
tags:
  - prototype
  - liquid-glass
  - meter
  - draft

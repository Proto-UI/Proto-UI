criteria:
  - id: P-BRUTALIST-NAVIGATION-MENU-HOVER-HANDOFF
    text:
      zh-CN: Trigger 保留关闭态悬停高亮；Content 提供家族面板边界上下文，其内 Item/Link 仅按 Base Focus 高亮以杜绝悬停与键盘焦点双高亮，离开家族 Content 边界时恢复悬停高亮。
      en: Trigger retains closed-menu hover highlight; Content provides the family panel boundary context so descendant Item/Link paint active highlight solely from Base Focus (preventing stale hover double-highlight) while keeping hover highlight outside family Content.
  - id: P-BRUTALIST-NAVIGATION-MENU-ADMISSION
    text:
      zh-CN: Draft 准入需要精确 head 的浏览器/native 证据和独立审查。
      en: Draft admission requires exact-head browser/native evidence and independent review.

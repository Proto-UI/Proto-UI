revisions:
  - version: 0.2.0
    change: revised
    summary: Made the reference demo consumer sizing responsive up to the existing 20rem desktop cap so the complete Root and scrollbar remain available in phone preview frames.
  - version: 0.2.0-rc.7
    change: revised
    summary: Expanded the passing surface to Move Gesture-backed Thumb drag while retaining host-owned scroll facts and geometry.
  - version: 0.2.0-rc.7
    change: revised
    summary: Expanded the passing surface through host-projected passive Thumb geometry while keeping controls deferred.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Cataloged the Brutalist root visual delta, consumer-owned sizing, and tested interaction boundary on rc.7.

id: P-BRUTALIST-SCROLL-AREA
type: prototype
title: Brutalist Scroll Area inherits Base and projects a square structural frame
status: draft
since: 0.2.0-rc.7
summary: Brutalist Scroll Area preserves the Base scrolling domain and adds a square, high-contrast frame without owning consumer dimensions.
statement:
  zh-CN: Brutalist Scroll Area 是 Base Scroll Area 的 Neo-Brutalist design-language projection。Root 只增加 relative block、直角、粗前景边框和背景面；宽高由调用方布局决定。它不重定义宿主滚动事实、请求或 anatomy ownership。
  en: Brutalist Scroll Area is a Neo-Brutalist design-language projection of Base Scroll Area. Root adds only a relative block, square corners, a thick foreground border, and background surface; consumer layout owns width and height. It does not redefine host scrolling facts, requests, or anatomy ownership.
criteria:
  - id: P-BRUTALIST-SCROLL-AREA-BASE-INHERITANCE
    text:
      zh-CN: Root 必须通过 `asScrollAreaRoot()` 一次性继承 `P-BASE-SCROLL-AREA`，不得重定义 Base scroll domain 或 projection ownership。
      en: Root must inherit `P-BASE-SCROLL-AREA` once through `asScrollAreaRoot()` and must not redefine the Base scroll domain or projection ownership.
  - id: P-BRUTALIST-SCROLL-AREA-VISUAL-GRAMMAR
    text:
      zh-CN: Root 必须投射 `relative block overflow-hidden rounded-none border-2 border-foreground bg-background`，保持直角、结构性粗边框与平面填充。
      en: Root must project `relative block overflow-hidden rounded-none border-2 border-foreground bg-background`, preserving square corners, a thick structural border, and flat fill.
  - id: P-BRUTALIST-SCROLL-AREA-CONSUMER-SIZING
    text:
      zh-CN: Root 不得提供固定 width 或 height；Scroll Area 尺寸属于调用方 layout，而不是 design-language protocol。
      en: Root must not provide a fixed width or height; Scroll Area dimensions belong to consumer layout rather than the design-language protocol.
  - id: P-BRUTALIST-SCROLL-AREA-DEMO-RESPONSIVE-SIZING
    text:
      zh-CN: 参考 demo 作为 consumer layout，必须在 `w-full max-w-80` wrapper 内给 Root 使用 `h-48 w-full`；桌面宽度上限保持 20rem，在 320、360、375 与 390px viewport 下则随 preview content box 收缩，使完整 Root 与 visual scrollbar 留在 viewport 内，且不得引入 document-level horizontal overflow。Web Components、React 与 Vue 必须保持等价几何。
      en: As consumer layout, the reference demo must give Root `h-48 w-full` inside a `w-full max-w-80` wrapper. The desktop width cap stays at 20rem, while 320, 360, 375, and 390px viewports shrink to the preview content box so the complete Root and visual scrollbar remain inside the viewport without document-level horizontal overflow. Web Components, React, and Vue must preserve equivalent geometry.
  - id: P-BRUTALIST-SCROLL-AREA-TESTED-SURFACE
    text:
      zh-CN: 当前 passing surface 包含 Base anatomy/context family binding、Viewport composed preference、Scrollbar orientation styling、host-projected Thumb geometry 与 Move Gesture-backed Thumb drag；仍不包含 track page press 或完整 Drag and Drop。
      en: The current passing surface includes Base Anatomy and Context family binding, Viewport composed preference, Scrollbar orientation styling, host-projected Thumb geometry, and Move Gesture-backed Thumb dragging; it still excludes track-page press and full Drag and Drop.

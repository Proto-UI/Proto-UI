id: P-BRUTALIST-BADGE
type: prototype
title: Brutalist Badge styled-only prototype
status: draft
since: 0.2.0-rc.7
summary: Passive Neo-Brutalist label with a native tone vocabulary and paired contrast.
statement:
  en: Brutalist Badge directly owns a compact visual label surface; it has no Base counterpart and claims no status, activation, selection, focus, or announcement behavior.
  zh-CN: Brutalist Badge 直接拥有紧凑的视觉标签表面；它没有 Base counterpart，也不拥有 status、activation、selection、focus 或 announcement 行为。
criteria:
  - id: P-BRUTALIST-BADGE-PASSIVE-BOUNDARY
    text:
      en: The direct prototype is roleless and non-focusable and exposes no activation, pressed, selected, status announcement, command, event, state, or method channel.
      zh-CN: direct prototype 无 role、不可聚焦，且不暴露 activation、pressed、selected、status announcement、command、event、state 或 method channel。
  - id: P-BRUTALIST-BADGE-TONES
    text:
      en: Public `tone` is `accent | info | danger`, defaults to `accent`, restores that default after prop removal, and maps respectively to canary, sky, and coral background/foreground pairs.
      zh-CN: 公开 `tone` 为 `accent | info | danger`，默认 `accent`，prop 移除后恢复默认值，并分别映射 canary、sky 与 coral 背景/前景色对。
  - id: P-BRUTALIST-BADGE-VISUAL-GRAMMAR
    text:
      en: Every tone retains square corners, a 2px ink border, mono uppercase text, and a zero-blur hard offset shadow; outline is structural grammar rather than a variant.
      zh-CN: 每个 tone 都保持方角、2px ink 边框、mono 大写文本与零模糊硬偏移阴影；outline 是结构语法而不是 variant。
sources:
  - path: packages/prototypes/brutalist/src/badge/root.proto.ts
relates:
  knowledge: [K-BRUTALIST-0001]
dependsOn:
  contracts:
    [
      C-CORE-SYNTAX-0003,
      C-PROPS-0001,
      C-FEEDBACK-STYLE-0002,
      C-FEEDBACK-STYLE-0003,
      C-RULE-INTENT-FEEDBACK-STYLE-0001,
    ]
revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: Introduced the direct styled-only Brutalist Badge prototype.
tags:

id: P-BRUTALIST-BADGE
type: prototype
title: 'Brutalist Badge styled-only prototype'

status: draft
since: 0.2.0-rc.7
summary: 'Passive Neo-Brutalist label with a native tone vocabulary and paired contrast.'

statement:
  en: P-BRUTALIST-BADGE preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-BADGE 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-BADGE-PASSIVE-BOUNDARY
    text:
      en: The direct prototype is roleless and non-focusable and exposes no activation, pressed, selected, status announcement, command, event, state, or method channel.
      zh-CN: direct prototype 无 role、不可聚焦，且不暴露 activation、pressed、selected、status announcement、command、event、state 或 method channel。
  - id: P-BRUTALIST-BADGE-TONES
    text:
      en: Public `tone` is `accent | info | danger`, defaults to `accent`, restores that default after prop removal, and maps respectively to canary, sky, and coral background/foreground pairs.
      zh-CN: 公开 `tone` 为 `accent | info | danger`，默认 `accent`，prop 移除后恢复默认值，并分别映射 canary、sky 与 coral 背景/前景色对。
  - id: P-BRUTALIST-BADGE-VISUAL-GRAMMAR
    text:
      en: >-
        Every tone retains 5px rounded-base corners, 2px black border and font-sans font-medium text-xs (12px/16px), with authored casing and no hard shadow. Tone fill/foreground pairs and passive semantics remain unchanged.


      zh-CN: >-
        每个 tone 保持 5px rounded-base 圆角、2px 黑边与 font-sans font-medium text-xs（12px/16px），保留作者大小写，无硬阴影；tone 色对与 passive 语义不变。



revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: >-
      Introduced the draft Brutalist Tabs Root projection with real public-API criteria (vertical stack layout, inherited foreground) on the rc.7 release train. Not present in the immutable rc.6 snapshot.

  - version: 0.2.0
    change: revised
    summary: >-
      Added a responsive reference-demo sizing guard that prevents selection-driven width and centering changes without constraining the prototype API.



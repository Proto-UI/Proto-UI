id: P-BRUTALIST-TABS
type: prototype
title: Brutalist Tabs Root inherits Base Tabs and owns the family layout surface
status: draft
since: 0.2.0-rc.7
summary: >-
  Brutalist Tabs Root inherits Base Tabs coordination semantics and projects a style-family family layout surface: a vertical stack gap with inherited foreground text-color, leaving panel and trigger surfaces to the Tabs parts.


statement:
  en: >-
    Brutalist Tabs Root is a draft Proto UI-maintained Neo-Brutalist design-language projection over Base Tabs. It preserves inherited Base protocol semantics (value/defaultValue/activation/orientation) and adds only visual/style behavior: a vertically stacked `flex flex-col gap-3` family layout with `text-foreground` so descendants inherit ink. The root owns layout only; the square panel and trigger visuals belong to the Tabs parts.


  zh-CN: >-
    Brutalist Tabs Root 是 Proto UI 维护的 draft Neo-Brutalist design-language 投射，建立在 Base Tabs 之上。它保留继承的 Base 协议语义（value/defaultValue/activation/orientation），仅增加视觉/style 行为：垂直堆叠的 `flex flex-col gap-3` family 布局并配以 `text-foreground`，使后代继承墨色前景。root 仅承担布局；方形面板与 trigger 视觉归 Tabs 各 part 所有。


criteria:
  - id: P-BRUTALIST-TABS-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Tabs through `asTabsRoot()` once and must not redefine Base value/defaultValue/activation or orientation protocol semantics. Visual projection must not introduce a panel or trigger fill; it only owns the family layout surface.


      zh-CN: >-
        该 prototype 必须通过 `asTabsRoot()` 一次性继承 Base Tabs，不得重定义 Base 的 value/defaultValue/activation 或 orientation 协议语义。视觉投射不得引入面板或 trigger 填充，只承担 family 布局表面。


  - id: P-BRUTALIST-TABS-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-tabs-root` and is the only public Tabs Root entry in this foundation slice.
      zh-CN: 直接 prototype 入口名为 `brutalist-tabs-root`，且是本 foundation 切片中唯一公开的 Tabs Root 入口。
  - id: P-BRUTALIST-TABS-VISUAL-GRAMMAR
    text:
      en: >-
        The root surface must be a `flex flex-col gap-3` vertical stack carrying `text-foreground` so child Tabs parts inherit the Brutalist ink foreground. The root itself carries no fill, border, or shadow — those live on the list/trigger/content parts — and must not apply gradients, glass, rounded cards, or soft elevation.


      zh-CN: >-
        root 表面必须是 `flex flex-col gap-3` 垂直堆叠并带 `text-foreground`，使子 Tabs part 继承 Brutalist 墨色前景。root 自身不带填充、边框或阴影——那些位于 list/trigger/content part——且不得使用渐变、玻璃拟态、圆角卡片或柔和高度阴影。

  - id: P-BRUTALIST-TABS-DEMO-STABLE-WIDTH
    text:
      en: >-
        The reference demo, acting as consumer layout, must give Root `w-full max-w-sm`. Overview and Details must retain the same outer Root width and x-position through selection at desktop, remain inside 320–390px viewports without document-level horizontal overflow, and preserve equivalent geometry and interaction in Web Components, React, and Vue. The prototype itself must retain consumer-selectable intrinsic sizing.

      zh-CN: >-
        参考 demo 作为 consumer layout，必须给 Root 使用 `w-full max-w-sm`。Overview 与 Details 在桌面选择切换时必须保持相同的 Root 外部宽度与 x 位置，并在 320–390px viewport 内不产生 document-level horizontal overflow；Web Components、React 与 Vue 必须保持等价几何和交互。Prototype 本身必须继续允许 consumer 选择 intrinsic sizing。



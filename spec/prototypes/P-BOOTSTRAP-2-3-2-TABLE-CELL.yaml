id: P-BOOTSTRAP-2-3-2-TABLE-CELL
type: prototype
title: Bootstrap 2.3.2 Table Cell passive Table projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    en: Draft catalog relation for an implemented family projection against the pinned Bootstrap 2.3.2 vocabulary. Stable admission requires real consumers, browser/native evidence and independent review; source presence and private package availability are not release or conformance admission.
summary: Bootstrap passive Table part over the exact P-BASE-TABLE-CELL definition with the pinned .table recipe.
statement:
    en: The Prototype composes the exact Base table-cell prototype through the public defineAsHook pattern demonstrated by base/src/data-table/header-row.proto.ts, preserving modules, render and Table Structure ownership while adding family paint.
criteria:
  - id: P-BOOTSTRAP-2-3-2-TABLE-CELL-BASE
    text:
            en: 'Compose the exact Base base-table-cell prototype once through the public defineAsHook({...base-table-cell, name}) pattern and preserve every inherited owner, module, render result, props/exposes and lifecycle.'
  - id: P-BOOTSTRAP-2-3-2-TABLE-CELL-VISUAL
    text:
            en: 'Cells use 8px padding, left/top alignment and the #ddd 1px top border. Semantic spans do not establish native visual span geometry; content remains authored.'
  - id: P-BOOTSTRAP-2-3-2-TABLE-CELL-CLOSURE
    text:
            en: All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, Glyphicons, upstream JavaScript or Adapter component-name dispatch may supply default intent.
  - id: P-BOOTSTRAP-2-3-2-TABLE-CELL-BOUNDARY
    text:
            en: Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; the package is private and source-only. Catalog presence is a draft relation, not acceptance.

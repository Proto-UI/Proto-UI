id: P-BASE-HOVER-CARD
type: prototype
title: Base Hover Card is a delayed link-preview protocol
status: draft
since: 0.2.0-rc.0
summary: Base Hover Card is a non-modal compound preview protocol whose root owns controlled or uncontrolled visibility, delayed interaction intent, requests, and shared context.
statement:
  zh-CN: >-
    Base Hover Card 是面向可视用户的 compound link-preview protocol。Root 持有 open、controlled ownership、open/close delay 与 request sequencing；Trigger 和 Content 只发布同域 interaction intent。hover/focus 产生的 intent 必须经过可取消延时后进入统一 `openChange` request channel，只有 owner input 或非受控 Root 可以改变最终 open fact。Content 的 Overlay、Transition 与 L1 view materialization 不得成为第二套 open truth。


  en: >-
    Base Hover Card is a compound link-preview protocol for sighted users. Root owns open state, controlled ownership, open and close delays, and request sequencing while Trigger and Content publish only same-domain interaction intent. Hover and focus intent must pass through cancellable delays into one `openChange` request channel, and only owner input or an uncontrolled Root may change the final open fact. Content Overlay, Transition, and L1 view materialization must not become a second open truth.


anatomy:
  family: base-hover-card
  roles:
    root: { cardinality: { min: 1, max: 1 } }
    trigger: { cardinality: { min: 0, max: 1 } }
    content: { cardinality: { min: 0, max: 1 } }
  relations:
    - { kind: contains, parent: root, child: trigger }
    - { kind: contains, parent: root, child: content }
criteria:
  - id: P-BASE-HOVER-CARD-ROLE-LINK-PREVIEW
    text:
      zh-CN: Hover Card 必须表示对 Trigger 所指向资源的补充预览，而不是需要用户完成任务的 dialog、popover 或 tooltip。
      en: Hover Card must represent a supplementary preview of the resource referenced by Trigger, not a dialog, popover, or tooltip required to complete a task.
  - id: P-BASE-HOVER-CARD-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-hover-card-root` 与 `asHoverCardRoot` 必须是同一 Root protocol 的 direct 与 authored-asHook entries。'
      en: '`base-hover-card-root` and `asHoverCardRoot` must be direct and authored-asHook entries for the same Root protocol.'
  - id: P-BASE-HOVER-CARD-PROTOCOL-INDEPENDENCE
    text:
      zh-CN: Root 不得消费其它 Base prototype-specific authored asHook 来获得 Hover Card 核心语义。
      en: Root must not consume another Base prototype-specific authored asHook to obtain core Hover Card semantics.
  - id: P-BASE-HOVER-CARD-ROOT-OWNER
    text:
      zh-CN: Root 必须是 open、controlled ownership、disabled、delay configuration、interaction intent 与 request sequencing 的 semantic owner。
      en: Root must be the semantic owner of open state, controlled ownership, disabled state, delay configuration, interaction intent, and request sequencing.
  - id: P-BASE-HOVER-CARD-PROPS
    text:
      zh-CN: Root 必须接受 `open`、`defaultOpen`、`disabled`、`openDelay` 与 `closeDelay`；提供 `open` 时进入受控模式。
      en: Root must accept `open`, `defaultOpen`, `disabled`, `openDelay`, and `closeDelay`; providing `open` selects controlled mode.
  - id: P-BASE-HOVER-CARD-OPEN-EXPOSE
    text:
      zh-CN: Root 必须 expose `open` state 以及 `openHoverCard`、`close`、`toggle` methods；methods 必须进入与交互相同的 request channel。
      en: Root must expose open state and the `openHoverCard`, `close`, and `toggle` methods; methods must enter the same request channel as interactions.
  - id: P-BASE-HOVER-CARD-OPEN-CHANGE
    text:
      zh-CN: 延时 interaction intent 与 Root methods 必须通过 `openChange` signal 发出 requested open 与 reason。
      en: Delayed interaction intent and Root methods must emit requested open and reason through the `openChange` signal.
  - id: P-BASE-HOVER-CARD-CONTROLLED-OWNER
    text:
      zh-CN: 受控 Hover Card 在 request 后必须保持 owner 提供的 open fact，直到新的 `open` input 到达。
      en: After a request, a controlled Hover Card must retain the owner-provided open fact until a new `open` input arrives.
  - id: P-BASE-HOVER-CARD-DELAYS
    text:
      zh-CN: interaction open/close 默认必须分别延时 700ms 与 300ms；显式 `openDelay`/`closeDelay` 必须覆盖默认值，反向 intent、disabled 或 dispose 必须取消未完成任务。
      en: Interaction open and close must default to delays of 700ms and 300ms respectively; explicit `openDelay` and `closeDelay` must override the defaults, and reverse intent, disabled state, or disposal must cancel an unfinished task.
    dependsOn:
      contracts:
        - id: C-DELAY-0001
  - id: P-BASE-HOVER-CARD-INTERACTION-INTENT
    text:
      zh-CN: 非 disabled 状态下，Trigger hover/focus 或 Content hover 任一为 true 时交互目标必须为 open；全部为 false 时目标必须为 closed，目标只能提交 request 而不能绕过 Root ownership。
      en: While not disabled, interaction must target open when Trigger hover or focus or Content hover is true and target closed when all are false; the target may only submit a request and must not bypass Root ownership.
  - id: P-BASE-HOVER-CARD-INTERACTION-LIFETIME
    text:
      zh-CN: Trigger hover/focus 与 Content hover contribution 属于实际 mounted view generation。实际 repeatable unmount 或 terminal teardown 必须只撤销该 generation 的贡献；remount 不得重放旧 transient input。撤销仍经过现有 Root interaction target、delay 与 request channel，不得绕过 controlled open owner；退休已经为 false 的贡献不得重新计时现有 close delay。
      en: Trigger hover/focus and Content hover contributions belong to an actual mounted view generation. Actual repeatable unmount or terminal teardown must withdraw only that generation's contribution; remount must not replay prior transient input. Withdrawal retains the existing Root interaction target, delay, and request channel without bypassing controlled open ownership; retiring an already-false contribution must not restart an existing close delay.
  - id: P-BASE-HOVER-CARD-INTERACTION-RELEASE
    text:
      zh-CN: >-
        Root 必须公开 typed cooperation method `releaseInteraction(part, contributionId): boolean`。part 仅为 trigger 或 content；contributionId 是正 safe integer，必须在同 Root、同 part 的整个存活期内跨 publisher instance 与 view generation 唯一且不重用；分配空间耗尽必须明确失败，不能 wrap、复用或发布冲突贡献。该方法仅退休当前 Root/part 记录的匹配贡献并返回 true；非法、过期或重复 ID 返回 false，且不得更新 Context、创建 timer 或发出 request。该兼容增量是显式可见的组件能力，不因协作用途而隐藏于 public Exposes/type 之外；它不是 open/close 替代命令。


      en: >-
        Root must expose the typed cooperation method `releaseInteraction(part, contributionId): boolean`. Part is exactly trigger or content; contributionId is a positive safe integer unique and never reused across publisher instances and view generations for that Root/part's entire lifetime. Exhausted allocation must fail explicitly without wrapping, reusing, or publishing a colliding contribution. The method retires only a matching contribution recorded by this Root/part and returns true; invalid, stale, or repeated identities return false without a Context update, timer, or request. This additive compatibility surface is explicitly visible in public Exposes/types despite its cooperation purpose and is not an alternative open/close command.


  - id: P-BASE-HOVER-CARD-INTERACTION-OWNER-BINDING
    text:
      zh-CN: Trigger/Content 必须在同域且 attached 时通过 Root PartView 借用 releaseInteraction，清理前先退休本地借用，再调用该已绑定 owner 的操作；不得在移除后重新解析别的 Root 或取得目标 run、instance、host。Root terminal shutdown 必须先使该操作失效：host 仍允许进入该已借用方法时返回 false；host 已撤销调用面时遵循既有 stale-handle 失败规则，绝不复活 owner。后到 child cleanup 不得访问其已销毁 Context。Context 只保留纯 JSON contribution identity，不得保存 callback 或 state/host handle；旧贡献清理不能撤销较新贡献，且不改变每域至多一个 Trigger/Content 的既定 cardinality。
      en: >-
        Trigger/Content must borrow releaseInteraction from the same-domain Root PartView while attached, retire their local borrowed reference before cleanup invokes that owner-bound operation, and never resolve another Root after removal or obtain the target run, instance, or host. Root terminal shutdown must first invalidate the operation: an invocation still admitted by the host returns false; an already-revoked calling surface follows existing stale-handle failure rules and never revives the owner. Later child cleanup cannot access its disposed Context. Context retains only JSON contribution identity, never callbacks or state/host handles; old cleanup cannot withdraw a newer contribution and does not change the existing at-most-one Trigger/Content cardinality.


  - id: P-BASE-HOVER-CARD-CONTEXT
    text:
      zh-CN: Root 必须通过同域 Context 发布 open、controlled、disabled、delay、interaction 与 request facts。
      en: Root must publish open, controlled, disabled, delay, interaction, and request facts through same-domain Context.
  - id: P-BASE-HOVER-CARD-ANATOMY
    text:
      zh-CN: canonical Root、Trigger、Content roles、cardinality 与 contains relations 必须由顶层 anatomy 字段定义。
      en: Canonical Root, Trigger, and Content roles, cardinalities, and contains relations must be defined by the top-level anatomy field.

id: P-LIQUID-GLASS-CAROUSEL
type: prototype
title: Liquid Glass Carousel projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native and material-host evidence plus independent review; source presence, private package availability and intent frames are not release, conformance or Apple-equivalence admission.
summary: Liquid Glass Carousel family over P-BASE-CAROUSEL.
statement:
  en: The family parts each invoke their matching public Base hook exactly once and preserve the complete Base protocol. Root/Viewport/Slide/Previous/Next preserve the discrete-index Base owner; slide content stays neutral and controls project functional paint separately. Index stays controlled without autoplay.
criteria:
  - id: P-LIQUID-GLASS-CAROUSEL-BASE
    text:
      en: Invoke asCarousel* hooks() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias or Base.setup call.
  - id: P-LIQUID-GLASS-CAROUSEL-VISUAL
    text:
      en: 'Root/Viewport/Slide/Previous/Next preserve the discrete-index Base owner; slide content stays neutral and controls project functional paint separately. Index stays controlled without autoplay. Exact functional material clauses are provisional: real provider capability, missing-host opaque fallback and bounded source leases stay governed by the shared V2 material contract.'
  - id: P-LIQUID-GLASS-CAROUSEL-CLOSURE
    text:
      en: All family appearance is authored through feedback tokens, typed material intent and Rules with explicit finite physical translation; no website-only CSS, private Apple asset or Adapter component-name dispatch may supply default intent, and explicit liquid-glass intent is never silently replaced by adaptive native blur.
  - id: P-LIQUID-GLASS-CAROUSEL-BOUNDARY
    text:
      en: Exact-head browser, native, material-provider and Compiler evidence plus independent review remain open; the package is private and source-only. Apple documentation is a design reference, not implementation, asset or equivalence evidence. Catalog presence is a draft relation, not acceptance.
dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
inherits:
  prototypes:
    - P-BASE-CAROUSEL
verifies:
  tests:
    - T-LIQUID-GLASS-CONTENT-SOURCE-0001
sources:

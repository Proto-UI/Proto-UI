id: P-BASE-SELECT-ALIGNMENT-PARTS
type: prototype
title: Select alignment surface viewport and item text structural parts
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Base structural parts remain behavior-free. Content now owns the optional production binding under P-BASE-SELECT-CONTENT presentation admission; Shadcn applies its explicit default and paint recipes.
summary: Legal external composition supplies actual safe part identities for the item-aligned binding without a renderer or platform special case.
criteria:
  - id: P-BASE-SELECT-ALIGNMENT-PARTS-STRUCTURE
    text:
      en: Surface, Viewport and ItemText are genuine same-family prototypes, with matching asHook entries and slot-preserving renderers. Surface is under Content, Viewport under Surface, and each ItemText under its own Item. They install no selection, overlay, presence, focus, input or geometry owner. ItemText's slot contains the actual visible label; indicators are not its text geometry target.
  - id: P-BASE-SELECT-ALIGNMENT-PARTS-PROFILE
    text:
      en: The family baseline permits the new optional roles and leaves existing edge compositions valid. The opt-in item-aligned profile requires one Trigger, Value, Content, Surface and Viewport, places Value under Trigger and Items under Viewport. ItemText domain cardinality cannot prove exactly one text per Item; binding must separately query and validate each item's current scoped descendants and classify missing or ambiguous associations.
  - id: P-BASE-SELECT-ALIGNMENT-PARTS-OWNERSHIP
    text:
      en: The connected design retains Content as the sole portal and lifecycle owner and frame, Surface as paint/animation surface and Viewport as scrollport. The Base parts add no geometry or guessed dimensions; Content owns binding and the visual family owns source-derived paint recipes. Source-derived size/style migration must be reviewed with binding against the pinned upstream version.
  - id: P-BASE-SELECT-ALIGNMENT-PARTS-COMPOSITION
    text:
      en: Parts are instantiated by legal outer composition and preserve actual slots. Template PrototypeRef nesting, DOM selectors, host-side component dispatch and website-owned behavior are not permitted substitutes. The structural query alone does not certify host target availability, subtree commit completion or a successful item-aligned placement.
dependsOn:

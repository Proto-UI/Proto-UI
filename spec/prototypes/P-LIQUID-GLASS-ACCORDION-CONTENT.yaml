id: P-LIQUID-GLASS-ACCORDION-CONTENT
type: prototype
title: liquid-glass Accordion content projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: 'Finf #872 的 draft 实现方向。稳定准入需要独立审查及当前浏览器/native、材质与 GPUI 证据；synthetic DOM 通过不等于九维完成。'
  en: 'Draft implementation direction for Finf #872. Stable admission requires independent review and current browser/native, material and GPUI evidence; synthetic DOM success is not nine-dimension completion.'
summary: Family-owned presentation consuming the corresponding Base Accordion atom.
statement:
  zh-CN: 此 Proto UI 独立投影原样消费对应 Base authoring entry，不安装另一选择、激活、焦点、heading或presence owner。
  en: This Proto UI authored presentation consumes the matching Base authoring entry unchanged. It does not install another selection, activation, focus, heading or presence owner.
criteria:
  - id: P-LIQUID-GLASS-ACCORDION-CONTENT-INHERITANCE
    text:
      zh-CN: 调用 asAccordionContent 并保留Base JSON Props/exposes及lifecycle。
      en: Calls asAccordionContent and retains the Base JSON Props/exposes and lifecycle.
  - id: P-LIQUID-GLASS-ACCORDION-CONTENT-STYLE
    text:
      zh-CN: 拥有本family tokens，支持最小宽度收缩、标签折行、正常内容流与溢出容纳；Trigger焦点与展开视觉派生自Base。不定高裁剪，不自建激活回调。
      en: Owns family tokens with min-width shrink safety, wrapping labels, normal content flow and overflow containment. Trigger focus and expanded visuals derive from Base. No fixed-height clipping or own activation callbacks.
  - id: P-LIQUID-GLASS-ACCORDION-CONTENT-EVIDENCE
    text:
      zh-CN: 当前源码是opaque视觉基线。显式LiquidGlass光学自实现与adaptive nativeblur是共享材质工作拥有的独立意图；真实材质和GPUI证据通过前本draft不完整。
      en: Current source is the opaque visual baseline. Explicit LiquidGlass optical self rendering and adaptive native blur are separate intents owned by shared material work; this draft is incomplete until real material and GPUI evidence pass.
inherits:
  prototypes:
    - P-BASE-ACCORDION-CONTENT
dependsOn:
  contracts:
    - C-FEEDBACK-STYLE-0003
verifies:
  tests:
    - T-BASE-ACCORDION-0001
sources:
  - path: packages/prototypes/liquid-glass/src/accordion/content.proto.ts
  - path: packages/prototypes/liquid-glass/src/accordion/index.ts
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added the independent Base-consuming presentation, without claiming release or complete material/native parity.
tags:
  - prototype
  - liquid-glass
  - accordion

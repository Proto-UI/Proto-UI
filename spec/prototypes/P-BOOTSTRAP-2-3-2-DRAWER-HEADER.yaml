id: P-BOOTSTRAP-2-3-2-DRAWER-HEADER
type: prototype
title: Bootstrap 2.3.2 Drawer Header projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: >-
    Draft catalog relation for an implemented family projection against the pinned Bootstrap 2.3.2 vocabulary. Stable admission requires real consumers, browser/native evidence and independent review; source presence and private package availability are not release or conformance admission.


summary: Passive owner-scoped header slot without interaction or State ownership.
statement:
  en: >-
    The Prototype invokes asDrawerHeader() once and preserves children and the Drawer header role within its logical Root.


criteria:
  - id: P-BOOTSTRAP-2-3-2-DRAWER-HEADER-BASE
    text:
      en: >-
        Invoke asDrawerHeader() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias, jQuery/plugin API or Base.setup call.


  - id: P-BOOTSTRAP-2-3-2-DRAWER-HEADER-VISUAL
    text:
      en: >-
        Passive slot presentation only; no focus, action or layout owner.


  - id: P-BOOTSTRAP-2-3-2-DRAWER-HEADER-CLOSURE
    text:
      en: >-
        All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, Glyphicons, upstream JavaScript or Adapter component-name dispatch may supply default intent.


  - id: P-BOOTSTRAP-2-3-2-DRAWER-HEADER-BOUNDARY
    text:
      en: >-
        Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; the package is private and source-only. Catalog presence is a draft relation, not acceptance.



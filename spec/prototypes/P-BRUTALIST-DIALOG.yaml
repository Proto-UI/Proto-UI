id: P-BRUTALIST-DIALOG
type: prototype
title: Brutalist Dialog Root inherits Base modal ownership
status: draft
since: 0.2.0-rc.7
summary: >-
  Brutalist Dialog Root inherits Base Dialog ownership and projects the Neo-Brutalist family entry with a minimal relative inline-flex surface. The projection is limited to confirming Base inheritance, the direct entry, and a relative inline-flex container surface.


statement:
  en: >-
    Brutalist Dialog Root is a draft Proto UI-maintained Neo-Brutalist design-language projection over Base Dialog. It preserves inherited Base `open` ownership and request methods, and adds only the direct prototype entry and a `relative inline-flex` container surface; it delegates command state and most styling to its child Trigger/Mask/Content/Title/Description/Close projections.


  zh-CN: >-
    Brutalist Dialog Root 是 Proto UI 维护的 draft Neo-Brutalist design-language 投射，建立在 Base Dialog 之上。它保留继承的 Base `open` 归属与请求方法，仅增加直接 prototype 入口与 `relative inline-flex` 容器表面；命令状态与大部分样式委托给子级 Trigger/Mask/Content/Title/Description/Close 投射。


criteria:
  - id: P-BRUTALIST-DIALOG-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Dialog Root through `asDialogRoot()` once and must not redefine Base `open` ownership or request methods. The Root projection must not invent value or command-disabled state handles.


      zh-CN: >-
        该 prototype 必须通过 `asDialogRoot()` 一次性继承 Base Dialog Root，不得重定义 Base 的 `open` 归属或请求方法；Root 投射不得虚构 value 或命令 disabled state handle。


  - id: P-BRUTALIST-DIALOG-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-dialog-root`.
      zh-CN: 直接 prototype 入口名为 `brutalist-dialog-root`。
  - id: P-BRUTALIST-DIALOG-VISUAL-GRAMMAR
    text:
      en: >-
        The root container surface uses `relative inline-flex items-start`, a flat non-elevated container that does not itself carry borders or shadows; structural Neo-Brutalist visual grammar lives on the child panel parts, not the root.


      zh-CN: >-
        root 容器表面使用 `relative inline-flex items-start`，为不带边框或阴影的平面非抬升容器；结构化 Neo-Brutalist 视觉语法存在于子级面板部件上，而非 root。



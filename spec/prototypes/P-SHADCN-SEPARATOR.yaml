id: P-SHADCN-SEPARATOR
type: prototype
title: Shadcn Separator Root inherits Base Separator and adds the current rule surface
status: draft
since: 0.3.0-alpha.0
summary: Shadcn Separator Root is an unofficial Proto UI-maintained projection that inherits Base Separator orientation and decorative semantics and adds the currently implemented border-colored hairline surface.
statement:
  zh-CN: >-
    Shadcn Separator Root 是 `P-BASE-SEPARATOR` 之上的 direct prototype，保留 Base Separator 的 orientation、decorative accessibility 投影、contentless 与无交互边界，并增加当前实现的 border 颜色与 1px 几何。兼容比较基线固定到 shadcn-ui/ui revision `f31ed81983653919dd4fe77aee4b4859f610f1dc` 的 v4 new-york Separator；`asChild` 明确不提供，其他差异统一记录为 compatibility differences。


  en: >-
    Shadcn Separator Root is a direct prototype over `P-BASE-SEPARATOR`. It retains Base Separator orientation, decorative accessibility projection, contentlessness, and the absence of any interaction channel while adding the currently implemented border color and 1px geometry. Its compatibility baseline is the v4 new-york Separator at shadcn-ui/ui revision `f31ed81983653919dd4fe77aee4b4859f610f1dc`; `asChild` is explicitly unavailable, and all other divergences are tracked as compatibility differences.


criteria:
  - id: P-SHADCN-SEPARATOR-UPSTREAM-IDENTITY
    text:
      zh-CN: Shadcn Separator 必须标记为 Proto UI 维护的非官方 shadcn/ui 衍生实现，并固定 upstream revision/path；本实体只治理 Proto UI 投射，不主张上游所有权或认证。
      en: Shadcn Separator must identify itself as an unofficial Proto UI-maintained shadcn/ui-derived implementation and pin its upstream revision and path; this entity governs only the Proto UI projection and claims neither upstream ownership nor endorsement.
  - id: P-SHADCN-SEPARATOR-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-separator-root` 必须通过 `inherits.prototypes` 指向 `P-BASE-SEPARATOR`，并通过 `asSeparatorRoot()` 默认引入其 guarantee；若以 setup-only 负向补丁放弃或改写 Base 能力，必须在本实体中声明具体偏离和替代语义。'
      en: '`shadcn-separator-root` must point to `P-BASE-SEPARATOR` through `inherits.prototypes` and call `asSeparatorRoot()` to introduce its guarantees by default; any setup-only negative patch that abandons or rewrites a Base capability must declare the exact deviation and replacement semantics in this entity.'
    references:
      prototypes:
        - id: P-BASE-SEPARATOR
          anchors:
            [P-BASE-SEPARATOR-ORIENTATION, P-BASE-SEPARATOR-DECORATIVE, P-BASE-SEPARATOR-SEMANTIC]
    dependsOn:
      contracts: [C-AS-HOOK-0001, C-CORE-SYNTAX-0007]
  - id: P-SHADCN-SEPARATOR-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不对 `asSeparatorRoot()` 引入的 orientation、decorative hiding、semantic role 或 aria-orientation 施加负向补丁；新增 style rules 仅构成视觉增量。
      en: The current implementation applies no negative patch to orientation, decorative hiding, semantic role, or aria-orientation introduced by `asSeparatorRoot()`; its added style rules are visual deltas only.
  - id: P-SHADCN-SEPARATOR-DIRECT-ENTRY
    text:
      zh-CN: 当前 Root protocol 以 `shadcn-separator-root` direct prototype 公开；本层不额外提供 authored asHook。
      en: The current Root protocol is exposed as the `shadcn-separator-root` direct prototype; this layer provides no additional authored asHook.
    dependsOn:
      contracts: [C-CORE-SYNTAX-0003]
  - id: P-SHADCN-SEPARATOR-CURRENT-VISUAL-SURFACE
    text:
      zh-CN: Root 必须以 border 颜色渲染并保持 `shrink-0`，使分隔线在 flex 组合中不被压缩。长度由消费布局决定，Separator 不拥有 spacing 策略。
      en: Root must render in the border color and stay `shrink-0` so the rule is not compressed inside a flex composition. Length is decided by the consuming layout; Separator owns no spacing policy.
    dependsOn:
      contracts: [C-RULE-INTENT-FEEDBACK-STYLE-0001]
  - id: P-SHADCN-SEPARATOR-STATE-DRIVEN-GEOMETRY
    text:
      zh-CN: horizontal 必须投影 1px 高度与满宽，vertical 必须投影满高与 1px 宽度。两条 rule 必须以继承的 canonical orientation state handle 为条件，不得建立第二套 orientation truth，也不得依赖宿主 data attribute；具体 attribute 降级方式由 Adapter 拥有，不属于本投影的 guarantee。
      en: Horizontal must project a 1px height with full width and vertical must project full height with a 1px width. Both rules must be conditioned on the inherited canonical orientation state handle, must not establish a second orientation source of truth, and must not depend on a host data attribute; the concrete attribute lowering is owned by the Adapter and is not a guarantee of this projection.
    dependsOn:
      contracts: [C-RULE-WHEN-0002, C-RULE-INTENT-FEEDBACK-STYLE-0001]
    references:
      prototypes:
        - id: P-BASE-SEPARATOR
          anchors: [P-BASE-SEPARATOR-ORIENTATION]
  - id: P-SHADCN-SEPARATOR-CONTENTLESS
    text:
      zh-CN: 投影必须返回 contentless renderer。caller prototype 拥有自己的 renderer，因此继承 Base 的 contentless 保证必须在本层重新声明，不能依赖 default slot renderer。
      en: The projection must return a contentless renderer. A caller prototype owns its own renderer, so the inherited Base contentless guarantee must be restated at this layer rather than left to the default slot renderer.
    references:
      prototypes:
        - id: P-BASE-SEPARATOR
          anchors: [P-BASE-SEPARATOR-CONTENTLESS]
  - id: P-SHADCN-SEPARATOR-PASSIVE-BOUNDARY
    text:
      zh-CN: 投影不得引入 focus、tab stop、event、command、activation、mutable value 或 authored child surface。
      en: The projection must introduce no focus, tab stop, event, command, activation, mutable value, or authored child surface.
    references:
      prototypes:
        - id: P-BASE-SEPARATOR
          anchors: [P-BASE-SEPARATOR-NO-INTERACTION]
  - id: P-SHADCN-SEPARATOR-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前实体只声明已实现并测试的 inherited behavior 与视觉 surface；相对固定 upstream baseline 的全部差异必须集中在唯一 compatibility open question，并区分 intentional deviation 与 parity gap。
      en: This entity claims only implemented and tested inherited behavior and visual surface; every difference from the pinned upstream baseline must be centralized in one compatibility open question and classified as an intentional deviation or parity gap.
  - id: P-SHADCN-SEPARATOR-AS-CHILD-OMISSION
    text:
      zh-CN: upstream Root props 中的 `asChild` 依 `D-AS-CHILD-OMISSION-0001` 有意不进入 API，任何元素投射均不得被宣称为 Radix Slot 等价实现。
      en: The `asChild` member of upstream Root props is intentionally omitted under `D-AS-CHILD-OMISSION-0001`; no element projection may be claimed as a Radix Slot equivalent.
    dependsOn:
      decisions: [D-AS-CHILD-OMISSION-0001]
openQuestions:
  - id: P-SHADCN-SEPARATOR-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: 相较固定 shadcn/ui Separator baseline，当前全部差异分别是有意偏离还是待实现 gap，应按什么顺序收敛？
      en: Against the pinned shadcn/ui Separator baseline, which current differences are intentional deviations versus implementation gaps, and in what order should the gaps converge?
    context:
      zh-CN: >-
        已确定的 intentional deviation 是不提供 `asChild`。当前 `shrink-0`、`bg-border` 与 orientation 几何与固定 baseline 的 token 集合一致。待实现或待评审差异包括 `data-slot`、 className 与 native prop forwarding，以及 upstream 通过 Radix Separator 承载的 `orientation`/`decorative` prop 命名映射。这些项目通过实现与测试前不得扩大 passing guarantee。


      en: >-
        The decided intentional deviation is omission of `asChild`. The current `shrink-0`, `bg-border`, and orientation geometry match the pinned baseline token set. Remaining implementation or review gaps include `data-slot`, className and native prop forwarding, and the prop-naming mapping upstream inherits from the Radix Separator primitive. The passing guarantee must not expand until an item is implemented and tested.


    blocks: [shadcn separator parity roadmap]
sources:

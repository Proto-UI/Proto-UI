    label: shadcn/ui v4 new-york Separator pinned baseline
dependsOn:
  contracts:
    [
      C-AS-HOOK-0001,
      C-CORE-SYNTAX-0003,
      C-CORE-SYNTAX-0007,
      C-RULE-WHEN-0002,
      C-RULE-INTENT-FEEDBACK-STYLE-0001,
    ]
  decisions: [D-PROTOTYPE-ENTITY-NAMING-0001, D-AS-CHILD-OMISSION-0001]
inherits:
  prototypes:
    - id: P-BASE-SEPARATOR
      note: Default inherited protocol; explicit setup-time negative-patch criteria may override individual guarantees.
verifies: { tests: [T-SHADCN-SEPARATOR-0001] }
revisions:
  - version: 0.3.0-alpha.0
    change: introduced
    summary: Introduced the Shadcn Separator projection with Base inheritance, restated contentless renderer, and centralized upstream differences.

    label: Immutable adopted MIT visual reference; independent Proto semantic implementation, not upstream certification.
  - path: https://github.com/shadcn-ui/ui/blob/24a16429815cc4d691f38b49d0f4ffc11a9daef4/apps/v4/registry/styles/style-rhea.css

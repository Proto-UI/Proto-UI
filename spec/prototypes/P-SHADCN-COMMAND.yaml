id: P-SHADCN-COMMAND
type: prototype
title: shadcn command
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: 'Draft 实现方向，稳定准入需要独立审查及浏览器/native 证据。'
  en: 'Draft implementation direction. Stable admission requires independent review and browser/native evidence.'
summary: shadcn command protocol with shared Proto UI lifecycle and anatomy boundaries.
statement:
  zh-CN: 独立编写的 Proto UI 协议，复用 Base 共享能力和 L1 lifecycle。
  en: An independently authored Proto UI protocol reusing Base shared capabilities and L1 lifecycle.
criteria:
  - id: P-SHADCN-COMMAND-ADMISSION
    text:
      zh-CN: Draft 准入需要精确 head 的浏览器/native 证据和独立审查。
      en: Draft admission requires exact-head browser/native evidence and independent review.
  - id: P-SHADCN-COMMAND-DIALOG-OWNERSHIP
    text:
      en: commandDialogContent composes Base asDialogContent once and reuses its Dialog anatomy, controlled open, dismissal, focus trap/return, title/description relations and presence. It does not own Command query or selection. Existing Dialog defaults remain unchanged.
      zh-CN: commandDialogContent 只组合一次 Base asDialogContent，复用 Dialog anatomy、受控 open、关闭、焦点约束及返回、标题描述关系与 presence，不拥有 Command 查询或选中状态，不改既有 Dialog 默认值。
    references:
      prototypes:
        - id: P-BASE-DIALOG-CONTENT
          anchors:
            [
              P-BASE-DIALOG-CONTENT-PRESENCE,
              P-BASE-DIALOG-CONTENT-FOCUS,
              P-BASE-DIALOG-CONTENT-DISMISS,
              P-BASE-DIALOG-CONTENT-A11Y-RELATIONS,
            ]
  - id: P-SHADCN-COMMAND-DIALOG-GEOMETRY
    text:
      en: The direct zero-padding content recipe is bounded by available-region geometry with root-relative safe insets. It must not inherit p6 and later override it, hide overflowed results, or replace the inner Command anatomy with a page-specific surface. Narrow, short and enlarged-root layouts require native evidence.
      zh-CN: 直接零内边距 content recipe 用可用区域与 root 相对安全边距约束；不得先继承 p6 再覆盖、裁掉结果或用页面外壳冒充内部 Command anatomy。窄屏、短视口及放大 root 需要 native 证据。
  - id: P-SHADCN-COMMAND-DIALOG-MOTION
    text:
      en: Dialog-owned presence must preserve interruption/reversal, reject stale completion, and suppress nonessential CSS motion for reduced or unknown preference. Native timing, focus and cleanup evidence is separate from token or timer assertions.
      zh-CN: Dialog 所有的 presence 保留中断反转、拒绝旧完成，并在 reduced 或未知偏好禁用非必要 CSS 动画；真实时序、焦点及清理证据独立于 token 或 timer 断言。
  - id: P-SHADCN-COMMAND-DIALOG-PROFILE
    text:
      en: Explicit styleProfile or a common outer public style scope selects Rhea or New York; a child CommandRoot scope is not read upward. Rhea uses the adopted top-third, 28rem cap, rounded3xl and 100ms recipe; New York uses centered32rem, rounded-lg and200ms. Required public enterDuration/leaveDuration are bound from the same profile by the consumer; no runtime configure or second timer. No hidden switch to New York or fabricated full cmdk parity.
      zh-CN: 显式 styleProfile 或共同外层公共 style scope 选择 Rhea/NY，不向上读取内部 CommandRoot scope。Rhea 按固定上游第三屏、28rem 上限、rounded3xl 和100ms；NY 居中32rem、rounded-lg 和200ms。不得静默切回 NY 或宣称完整 cmdk 等价。
  - id: P-SHADCN-COMMAND-DIALOG-MASK
    text:
      en: Search CommandDialog uses a transparent dedicated Mask that inherits Base modal blocking, pointer participation and presence without a second open or query owner. The pinned website omits visible DialogOverlay while Radix retains modality; Proto UI explicitly retains its semantic Mask because Content alone is non-modal. Ordinary Shadcn DialogMask paint is unchanged. Mask and Content use the same consumer-selected durations. Transparent paint is not passthrough, and native outside-press, Escape, focus return and underlying-page blocking remain required evidence.
      zh-CN: Search CommandDialog 使用专用透明 Mask，继承 Base 模态阻隔、指针参与和 presence，不另建 open/query owner。固定官网省略可见 DialogOverlay 而 Radix 保留模态；Proto UI 的 Content 单独非模态，因此明确保留语义 Mask。普通 Shadcn DialogMask 外观不变，Mask/Content 时长来自同一消费 profile；透明不等于穿透，真实外点、Escape、回焦和底页阻隔仍需证据。
  - id: P-SHADCN-COMMAND-ANATOMY
    text:
      en: Root owns a full-width vertical single shell; Content is its shrinkable scrollable list, never an independently bordered or shadowed panel. Adopted Rhea retains root p1 and list18rem; New York and Brutalist adopt a root-relative18.75rem list cap from the pinned300px reference. Brutalist owns its sole2px border on Root. min-height0 is an explicit containment safeguard, not proof of native short-viewport acceptance. No wrapping-row root, page CSS repair or generic Group/InputShell parity is claimed.
      zh-CN: Root 是全宽纵向一体外壳，Content 为可收缩滚动列表，不另加边框阴影；Rhea 保留 root p1/list18rem，NY及Brutalist将固定上游300px采用为root相对18.75rem。Brutalist唯一2px边框属于Root。min-height0为显式容纳策略，不代表短视口已验收；不宣称Group/InputShell完整等价。
  - id: P-SHADCN-COMMAND-NO-ADDON-INSET
    text:
      en: In the existing bounded single-control InputShell composition without addons, the Command editor owns its profile-specific inline inset instead of depending on an absent decorative prefix. Grouped Vega, Nova, Lyra and Rhea use 0.625rem per side; Maia and Luma use 0.75rem; Mira uses 0.5rem. These are adopted from the corresponding pinned ordinary Input recipes, not a claim that the icon-free composition equals upstream CommandInput with its Search addon. Sera retains its existing editor px2 and outer shell px3; New York retains the existing wrapper px3 and adds no editor inset. Outside InputShell, existing standalone recipes are unchanged. Profile changes preserve the one real editor, query, selection, focus and composition lifetime. No DOM child detection, page override, new addon API or semantic input owner is introduced.
      zh-CN: 现有无 addon 的单编辑器 InputShell 组合由 Command 编辑器提供 profile 内联留白，不能依赖不存在的装饰前缀。Vega、Nova、Lyra、Rhea 每侧采用对应普通 Input 的0.625rem，Maia/Luma为0.75rem，Mira为0.5rem；Sera保留原编辑器px2及外壳px3，NY保留wrapper px3且不叠加编辑器留白。未置于InputShell的独立recipe不变，profile切换保留真实编辑器、query、selection、focus及composition生命周期；不增DOM探测、页面补丁或addon语义，不宣称与带Search图标的上游CommandInput完全一致。
dependsOn:
  contracts:
    - C-PROPS-0001
    - C-LIFECYCLE-0008
inherits:
  prototypes:
    - P-BASE-COMMAND
verifies:

  - version: 0.3.0-alpha.1
    change: revised
    summary: Bound the implemented family projection to its Base draft inheritance and focused profile coverage.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Restore the lost CommandDialog and shrinkable-list criteria alongside retained Base inheritance and nine-profile coverage; native acceptance remains open.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Define profile-specific editor inset for the bounded no-addon InputShell composition without changing standalone recipes or claiming full addon/native conformance.
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Register exact CommandDialog declaration sources under existing draft criteria and test relations; native admission remains open.
    change: revised
    summary: Add an explicit website-menu presentation and real bounded navigation consumer without changing default recipes or claiming clickable-prefix/target-reveal/native completion.

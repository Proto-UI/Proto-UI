id: P-BOOTSTRAP-2-3-2-CHECKBOX-GROUP
type: prototype
title: Bootstrap 2.3.2 Checkbox Group projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: >-
    Draft catalog relation for an implemented family projection against the pinned Bootstrap 2.3.2 vocabulary. Stable admission requires real consumers, browser/native evidence and independent review; source presence and private package availability are not release or conformance admission.


summary: Bootstrap Checkbox Group family over P-BASE-CHECKBOX-GROUP with pinned vocabulary.
statement:
  en: >-
    The family parts each invoke their matching public Base hook exactly once and preserve the complete Base protocol. Root/Item/All invoke the shared item setup once each; Root owns the selected array and aggregate checked/mixed facts while rows retain their own control-label/focus handling and pinned forms row paint.


criteria:
  - id: P-BOOTSTRAP-2-3-2-CHECKBOX-GROUP-BASE
    text:
      en: >-
        Invoke asCheckboxGroup* hooks() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias, jQuery/plugin API or Base.setup call.


  - id: P-BOOTSTRAP-2-3-2-CHECKBOX-GROUP-VISUAL
    text:
      en: >-
        Root/Item/All invoke the shared item setup once each; Root owns the selected array and aggregate checked/mixed facts while rows retain their own control-label/focus handling and pinned forms row paint.


  - id: P-BOOTSTRAP-2-3-2-CHECKBOX-GROUP-CLOSURE
    text:
      en: >-
        All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, Glyphicons, upstream JavaScript or Adapter component-name dispatch may supply default intent.


  - id: P-BOOTSTRAP-2-3-2-CHECKBOX-GROUP-BOUNDARY
    text:
      en: >-
        Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; the package is private and source-only. Catalog presence is a draft relation, not acceptance.



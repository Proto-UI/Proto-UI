  - path: packages/prototypes/shadcn/src/input/types.ts
  - path: packages/prototypes/shadcn/test/input.test.ts
  - path: https://ui.shadcn.com/r/styles/base-nova/input.json
    label: base-nova Input registry snapshot; exact content hashes in statement
  - path: internal/records/2026-10-10-finf-input-base-nova-definition.md

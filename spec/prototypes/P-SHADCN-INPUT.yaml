id: P-SHADCN-INPUT
type: prototype
title: Shadcn Input Root inherits Base Input and adds its expressible visual subset
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: This draft now targets the reviewed base-nova Input registry snapshot, replacing the historical new-york comparison. Implementation, generated CSS, browser evidence and independent review must converge before any stable admission.
  zh-CN: 本 draft 现以经核读的 base-nova Input registry snapshot 取代历史 new-york 比较基线；实现、生成 CSS、真实浏览器证据与独立评审收敛前不准入稳定保证。

summary: Shadcn Input Root is an unofficial visual projection over the host-mediated Base Input protocol and deliberately exposes only the verified presentation subset.
statement:
  en: Shadcn Input Root is an unofficial presentation over P-BASE-INPUT. It retains the single Base host-owned text editor, values, events, IME, native text props, accessibility and focus. The presentation reference is https://ui.shadcn.com/r/styles/base-nova/input.json, retrieved 2026-10-10, with registry SHA256 bbad1bba130ac9750a61844eeb8f043e8a710846e07689fa85398b80a46c2741 and extracted TSX SHA256 dab990dfefa0ba78854ab6602ad074270dba9d7d1262184d9bfbb62bd990903b. This content-addressed snapshot replaces the earlier new-york f31ed819 reference for this draft only; no upstream Git revision is inferred.
  zh-CN: Shadcn Input Root 是 P-BASE-INPUT 的非官方呈现投射；保留唯一 Base host-owned text editor、value、event、IME、native text props、accessibility 与 focus。呈现参考为 2026-10-10 抓取的 https://ui.shadcn.com/r/styles/base-nova/input.json，registry SHA256 bbad1bba130ac9750a61844eeb8f043e8a710846e07689fa85398b80a46c2741，提取 TSX SHA256 dab990dfefa0ba78854ab6602ad074270dba9d7d1262184d9bfbb62bd990903b。此 content-addressed snapshot 仅替换该 draft 的旧 new-york f31ed819 比较基线；不推断 upstream Git revision。

criteria:
  - id: P-SHADCN-INPUT-UPSTREAM-IDENTITY
    text:
      en: Shadcn Input must identify the unofficial Proto UI-maintained projection and pin its upstream registry URL, retrieval date and content hashes. This entity claims neither upstream ownership nor endorsement.
      zh-CN: Shadcn Input 必须标明 Proto UI 维护的非官方投射，并固定 upstream registry URL、抓取日期与内容 hash；不声称上游所有权或认证。
  - id: P-SHADCN-INPUT-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-input-root` 必须继承 `P-BASE-INPUT`，复用其 frozen Text Control requirement 并调用 `asInputRoot()`；不得通过 setup-only negative patch 放弃或改写 Base guarantee。'
      en: '`shadcn-input-root` must inherit `P-BASE-INPUT`, reuse its frozen Text Control requirement, and call `asInputRoot()`; it must not abandon or rewrite a Base guarantee through a setup-only negative patch.'
    references:
      prototypes:
        - id: P-BASE-INPUT
          anchors:
            [
              P-BASE-INPUT-PHYSICAL-TARGET,
              P-BASE-INPUT-VALUE-OWNERSHIP,
              P-BASE-INPUT-A11Y-AND-FOCUS,
            ]
    dependsOn:
      contracts: [C-AS-HOOK-0001, C-CORE-SYNTAX-0007]
  - id: P-SHADCN-INPUT-BASE-GUARANTEES
    text:
      zh-CN: 投射必须保留 Base Input 的 controlled/uncontrolled value、归一化事件与 IME、live native text props、textbox 命名/描述、disabled/readOnly 以及 focus/blur，不增加第二个编辑器或 renderer。
      en: The projection must preserve Base Input controlled/uncontrolled value, normalized events and IME, live native text props, textbox naming/description, disabled/readOnly, and focus/blur without adding a second editor or renderer.
    references:
      prototypes:
        - id: P-BASE-INPUT
          anchors:
            [
              P-BASE-INPUT-VALUE-OWNERSHIP,
              P-BASE-INPUT-EVENTS-AND-IME,
              P-BASE-INPUT-NATIVE-PROPS,
              P-BASE-INPUT-A11Y-AND-FOCUS,
            ]
  - id: P-SHADCN-INPUT-DIRECT-ENTRY
    text:
      zh-CN: 当前投射以单一 direct Root `shadcn-input-root` 公开，不新增 authored asHook 或 anatomy part。
      en: The current projection is exposed as the single direct Root `shadcn-input-root`; it adds no authored asHook or anatomy part.
    dependsOn:
      contracts: [C-CORE-SYNTAX-0003]
  - id: P-SHADCN-INPUT-VISUAL-SURFACE
    text:
      en: Root must project the base-nova subset h-8 w-full min-w-0 rounded-lg border border-input bg-transparent px-2.5 py-1 text-base transition-colors outline-none. The previous h-9, rounded-md, px-3 and shadow-xs are superseded. Retained selection:bg-primary selection:text-primary-foreground is an explicit existing Proto UI extension, not part of this base-nova source.
      zh-CN: Root 必须投射 base-nova 子集 h-8 w-full min-w-0 rounded-lg border border-input bg-transparent px-2.5 py-1 text-base transition-colors outline-none；旧 h-9、rounded-md、px-3 与 shadow-xs 被替换。保留的 selection:bg-primary selection:text-primary-foreground 是既有 Proto UI 扩展，不是本 base-nova 源码内容。
    dependsOn:
      contracts:
        [C-RULE-INTENT-FEEDBACK-STYLE-0001, C-PROTOTYPE-STYLE-CLOSURE-0001, C-FEEDBACK-STYLE-0004]
  - id: P-SHADCN-INPUT-SELECTION-PRESENTATION
    text:
      en: Native text selection retains the existing primary background and primary-foreground ink as an explicit Proto UI extension. It changes only the static native selection surface and adds no selection API or editor ownership.
      zh-CN: 原生文本选择保留现有 primary 背景与 primary-foreground 文字，明确作为 Proto UI 扩展；仅改变静态原生 selection surface，不增加 selection API 或 editor owner。
    dependsOn:
      contracts: [C-FEEDBACK-STYLE-0004]
  - id: P-SHADCN-INPUT-STATE-PRESENTATION
    text:
      en: Inherited focusVisible drives border-ring ring-ring/50 ring-3. Inherited disabled drives pointer-events-none cursor-not-allowed opacity-50 bg-input/50. Host dark colorScheme drives bg-input/30; dark and disabled together drive bg-input/80, which must override either condition alone. No second state truth or ARIA-derived invalid state is introduced.
      zh-CN: 继承的 focusVisible 驱动 border-ring ring-ring/50 ring-3；继承的 disabled 驱动 pointer-events-none cursor-not-allowed opacity-50 bg-input/50；host dark colorScheme 驱动 bg-input/30，dark 与 disabled 同时成立时驱动 bg-input/80，必须覆盖任一单独条件。不增加第二状态 truth 或从 ARIA 伪造的 invalid state。
    dependsOn:
      contracts: [C-RULE-WHEN-0002, C-RULE-INTENT-FEEDBACK-STYLE-0001]
    references:
      prototypes:
        - id: P-BASE-INPUT
          anchors: [P-BASE-INPUT-A11Y-AND-FOCUS]
  - id: P-SHADCN-INPUT-CONTENTLESS
    text:
      zh-CN: 投射 renderer 必须返回 null；caller children 不得成为第二个编辑面或额外 physical control。
      en: The projection renderer must return null; caller children must not become a second editing surface or additional physical control.
    references:
      prototypes:
        - id: P-BASE-INPUT
          anchors: [P-BASE-INPUT-PHYSICAL-TARGET, P-BASE-INPUT-BOUNDARY]
  - id: P-SHADCN-INPUT-BOUNDARY
    text:
      zh-CN: 投射不得添加 arbitrary native type、form/submit、validation/invalid、search/send command、selection API、第二 editor、authored content renderer 或 non-Web host conformance claim。
      en: The projection must not add arbitrary native types, form/submit, validation/invalid, search/send commands, selection APIs, a second editor, an authored-content renderer, or a non-Web host conformance claim.
    references:
      prototypes:
        - id: P-BASE-INPUT
          anchors: [P-BASE-INPUT-BOUNDARY]
  - id: P-SHADCN-INPUT-COMPATIBILITY-SUBSET
    text:
      zh-CN: 实体只声明当前已实现且有可执行证据的呈现及继承协议；相对固定 upstream baseline 的物质差异集中于唯一 compatibility open question，并区分 intentional deviation 与未实现 parity gap。
      en: The entity claims only presentation and inherited behavior currently implemented with executable evidence; every material difference from the pinned upstream baseline is centralized in one compatibility open question and classified as an intentional deviation or an unimplemented parity gap.
openQuestions:
  - id: P-SHADCN-INPUT-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: 相对固定 Shadcn Input baseline，placeholder、responsive text size、aria-invalid、data-slot 与 className forwarding 等差异应维持为有意偏离还是另行补足？
      en: Against the pinned Shadcn Input baseline, should differences in placeholder, responsive text size, aria-invalid, data-slot, and className forwarding remain intentional deviations or be addressed separately?
    context:
      en: 'C-FEEDBACK-STYLE-0004 permits only the static selection: pseudo-element variant. Placeholder, responsive text, file pseudo-elements, aria-invalid, data-slot and className forwarding remain outside this bounded projection; arbitrary input type and validation remain excluded by Base. Geometry, transition and disabled palette may converge through the existing style/state channels. Retained selection styling is explicitly a Proto UI extension. No full upstream parity or current browser acceptance is claimed.'
      zh-CN: 'C-FEEDBACK-STYLE-0004 仅允许静态 selection: pseudo-element variant。placeholder、responsive text、file pseudo-elements、aria-invalid、data-slot 与 className forwarding 仍在本限定投射外；arbitrary input type 与 validation 仍由 Base 边界排除。几何、transition 与 disabled 配色通过既有 style/state 通路收敛；保留的 selection 样式明确是 Proto UI 扩展。不宣称完整上游一致或当前浏览器验收通过。'

    blocks: [activation:P-SHADCN-INPUT]

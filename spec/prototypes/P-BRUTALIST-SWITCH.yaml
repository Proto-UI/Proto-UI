id: P-BRUTALIST-SWITCH
type: prototype
title: 'Brutalist Switch Root inherits Base Switch and projects a source-aligned capsule'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Switch Root preserves Base checked, keyboard, press, focus and disabled ownership while projecting a fixed 24x48 capsule, paired main checked fill, DM Sans captions and a 150ms color transition.'

statement:
  en: P-BRUTALIST-SWITCH preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-SWITCH 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-SWITCH-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Switch through `asSwitchRoot()` once and must not redefine Base checked, pressed, focus-visible, or disabled protocol semantics. Visual projection may only consume the projected state handles (`checked`, `disabled`, `focusVisible`, `pressed`).


      zh-CN: >-
        该 prototype 必须通过 `asSwitchRoot()` 一次性继承 Base Switch，不得重定义 Base 的 checked、pressed、focus-visible 或 disabled 协议语义；视觉投射只能消费投影出的 state handles（`checked`、`disabled`、`focusVisible`、`pressed`）。


  - id: P-BRUTALIST-SWITCH-DRAG-DEFERRED
    since: 0.3.0-alpha.1
    text:
      en: >-
        This family temporarily accepts draggable only as false or omitted. A runtime true value is invalid and resolves to the inherited false fallback, without changing checked, tap, keyboard, focus or disabled ownership. Its fixed zero-padding Root content interval does not match the source-defined 1.25rem Thumb travel, so it must not admit directional preview or release requests until one declared endpoint range governs both input normalization and direct presentation. This is an explicit unsupported extension, not completed drag support; dimensions, padding and checked endpoints remain unchanged.


      zh-CN: >-
        此 family 暂时仅接受 draggable 为 false 或省略。运行时 true 属于无效值，回退到继承的 false；checked、tap、键盘、focus 与 disabled 的 owner 不变。零 padding Root 的 content 区间不等于来源定义的 1.25rem Thumb 行程，在同一显式端点区间能够同时约束输入归一化和直接展示之前，不准入方向拖动预览或松手请求。这是明确不支持的扩展，不代表完成拖动；尺寸、padding 与 checked 端点保持不变。


  - id: P-BRUTALIST-SWITCH-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-switch-root` and is the only public Switch Root entry in this foundation slice.
      zh-CN: 直接 prototype 入口名为 `brutalist-switch-root`，且是本 foundation 切片中唯一公开的 Switch Root 入口。
  - id: P-BRUTALIST-SWITCH-CHECKED-PAIR-INVARIANT
    text:
      en: 'Checked changes only the track fill to bg-main. Root padding is always zero, with no checked translation; the Thumb exclusively owns movement.'
      zh-CN: 'checked 仅改变 track fill 为 bg-main。Root padding 始终为零，不随 checked 位移；Thumb 独占 movement。'

  - id: P-BRUTALIST-SWITCH-INTERACTION
    text:
      en: 'Press retains the current fill and geometry without coral flash, displacement or elevation, and hover consumes no visual state. Focus-visible retains the offset ring; disabled retains its opacity and pointer gate. Base checked, press and keyboard ownership remain unchanged. This is the binary capsule control category of D-BRUTALIST-DEPTH-MOTION-GRAMMAR-0001, whose named exception assigns travel to the Thumb instead of Button displacement.'
      zh-CN: 'press 保持当前 fill 与几何，不闪珊瑚色、不位移、不增加 elevation，hover 不消费视觉状态。focus-visible 保留 offset ring；disabled 保留 opacity 与 pointer gate；Base checked、press 与键盘 owner 不变。这属于 D-BRUTALIST-DEPTH-MOTION-GRAMMAR-0001 的 binary capsule control category，其命名 exception 将行程交给 Thumb，而不套用 Button 位移。'
    dependsOn:
      decisions: [D-BRUTALIST-DEPTH-MOTION-GRAMMAR-0001]

  - id: P-BRUTALIST-SWITCH-DEMO-NAMING
    text:
      en: >-
        The reference demo must keep a visible caption inside each Switch root so inherited Base `nameFromContent` derives the same meaningful accessible name in Web Components, React, and Vue. The caption must remain visible, must not rely on a native label relationship that cannot target the custom-element host, and must follow the Switch activation path while disabled remains inert.


      zh-CN: >-
        参考 demo 必须把可见 caption 放在每个 Switch root 内，使继承的 Base `nameFromContent` 在 Web Components、React 与 Vue 中派生同一条有意义的 accessible name。Caption 必须保持可见，不得依赖无法指向 custom-element host 的原生 label 关系；点击 caption 必须沿 Switch activation path 生效，而 disabled 保持 inert。


  - id: P-BRUTALIST-SWITCH-VISUAL-GRAMMAR
    text:
      en: 'Root projects a relative 24px by 48px capsule (h-6 w-12), rounded-full, 2px black border, neutral fill, zero padding and no shadow. It carries font-sans font-medium for authored captions. Color transitions last 150ms; spatial Thumb motion is disabled by the generated reduced-motion media rule.'
      zh-CN: 'Root 投射 relative 24px×48px 胶囊（h-6 w-12）、rounded-full、2px 黑边、中性填色、零 padding、无阴影；作者 caption 使用 font-sans font-medium。颜色 transition 为 150ms；空间 Thumb motion 由生成式 reduced-motion media rule 关闭。'


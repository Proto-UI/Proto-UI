revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Named the binary-capsule category of D-BRUTALIST-DEPTH-MOTION-GRAMMAR-0001 and its Thumb-owned travel exception without changing interaction behavior.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Temporarily reject the inherited drag extension rather than normalize against an interval inconsistent with the pinned zero-padding painted endpoints.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Aligned draft visual grammar with neobrutalism-components 3306a802; preserved Base semantics and documented Proto UI extensions.
  - version: 0.2.0-rc.7
    change: introduced
    summary: >-
      Introduced the draft Brutalist Switch Root projection with real public-API criteria (checked pair invariant, press feedback, no-padding-swap defect guard) on the rc.7 release train. Not present in the immutable rc.6 snapshot.


  - version: 0.2.0
    change: revised
    summary: >-
      Added the reference-demo accessible-name criterion: every visible caption stays inside its Switch root and is projected consistently through inherited Base name-from-content semantics.



id: P-SHADCN-SWITCH-THUMB
type: prototype
title: Shadcn Switch Thumb inherits the Base indicator and adds its current visual surface
status: draft
since: 0.2.0-rc.0
summary: Shadcn Switch Thumb inherits the Base context-driven indicator protocol and adds the currently implemented thumb shape, sizing, surface, and motion tokens.
statement:
  zh-CN: "Shadcn Switch Thumb 是 `P-BASE-SWITCH-THUMB` 之上的 direct anatomy part。它继续从同域 Root context 派生 checked/disabled display state，不拥有 value、activation、focus 或 event 语义，并增加当前实现的 thumb 尺寸、形状、surface 与 source CSS transform transition declaration。固定 upstream Shadcn wrapper 将 Thumb 作为内部结构，而 Proto UI 当前将它公开为可组合原型；该差异及 token parity 集中记录为 compatibility differences。"

  en: "Shadcn Switch Thumb is a direct anatomy part over `P-BASE-SWITCH-THUMB`. It continues to derive checked and disabled display state from same-domain Root context, owns no value, activation, focus, or event semantics, and adds the currently implemented thumb dimensions, shape, surface, and source CSS transform transition declaration. The pinned upstream Shadcn wrapper keeps Thumb internal while Proto UI currently exposes it as a composable prototype; that difference and token parity are centralized as compatibility differences."

criteria:
  - id: P-SHADCN-SWITCH-THUMB-DIRECTIONAL-PREVIEW
    text:
      en: The opt-in Base draggable enhancement projects inherited percentage through the exposed number.range style channel without owning value, input, geometry or events. New York, Vega, Nova, Maia, Lyra and Mira travel is percentage/100 times used Thumb width minus 2px; Rhea subtracts 4px and Luma 8px. Sera starts at 1px and travels used Thumb width plus 1px, preserving both source endpoints. Explicit RTL mirrors the base offset and travel once from the opposite Root edge. Both sizes retain their profile geometry. Dragging suppresses the transform transition; settlement restores the source transition. Cancel and controlled refusal follow Root rollback with no presentation-owned checked request. draggable=false retains source checked endpoints. Authored directional consumer cases cover New York/Rhea with synthetic geometry; the seven added profile drag recipes have no native acceptance claim. Rendered, assistive-technology and all-target evidence remain required.
    dependsOn:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            - P-BASE-SWITCH-DIRECTIONAL-PREVIEW
  - id: P-SHADCN-SWITCH-THUMB-UPSTREAM-IDENTITY
    text:
      zh-CN: Thumb 必须沿用 Shadcn Switch 固定 revision/path 作为比较基线，并明确本实体只治理 Proto UI 的非官方 anatomy projection。
      en: Thumb must use the pinned Shadcn Switch revision and path as its comparison baseline and identify this entity as governing only Proto UI's unofficial anatomy projection.
  - id: P-SHADCN-SWITCH-THUMB-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-switch-thumb` 必须通过 `inherits.prototypes` 指向 `P-BASE-SWITCH-THUMB` 并调用 `asSwitchThumb()`；任何 setup-only 负向补丁必须声明具体偏离和替代语义。'
      en: '`shadcn-switch-thumb` must point to `P-BASE-SWITCH-THUMB` through `inherits.prototypes` and call `asSwitchThumb()`; any setup-only negative patch must declare the exact deviation and replacement semantics.'
    dependsOn:
      contracts: [C-AS-HOOK-0001, C-CORE-SYNTAX-0007]
  - id: P-SHADCN-SWITCH-THUMB-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不反转 inherited context、indicator role 或无独立交互语义等 Base guarantee；新增 tokens 仅构成视觉增量。
      en: The current implementation reverses none of the inherited Base guarantees for context, indicator role, or absence of independent interaction semantics; added tokens are visual deltas only.
  - id: P-SHADCN-SWITCH-THUMB-DIRECT-ENTRY
    text:
      zh-CN: 当前 Thumb protocol 以 `shadcn-switch-thumb` direct prototype 公开；本层不额外提供 authored asHook。
      en: The current Thumb protocol is exposed as the `shadcn-switch-thumb` direct prototype; this layer provides no additional authored asHook.
    dependsOn:
      contracts: [C-CORE-SYNTAX-0003]
  - id: P-SHADCN-SWITCH-THUMB-CONTEXT-INDICATOR
    text:
      zh-CN: Thumb 必须继续作为 same-domain context-driven indicator 反映 Root checked state，不得拥有 checked source of truth、activation route、focus target 或 outward signal。
      en: Thumb must remain a same-domain context-driven indicator of Root checked state and must not own checked source of truth, an activation route, a focus target, or an outward signal.
    references:
      prototypes:
        - id: P-BASE-SWITCH-THUMB
          anchors:
            [
              P-BASE-SWITCH-THUMB-CONTEXT-SUBSCRIBE,
              P-BASE-SWITCH-THUMB-DERIVED-CHECKED,
              P-BASE-SWITCH-THUMB-NO-EVENT-TARGET,
            ]
  - id: P-SHADCN-SWITCH-THUMB-CURRENT-VISUAL-SURFACE
    text:
      en: Default Thumb uses pointer-events-none block size-4 rounded-full bg-background ring-0 ring-offset-0 translate-x-0 with no border or shadow. Checked uses translate-x-[calc(100%_-_2px)]; dark unchecked uses bg-foreground and dark checked bg-primary-foreground. Source size-4 remains 1rem, corresponding to 16px or 32px at those root fonts; translation is the used Thumb width minus 2px. Root now scales in rem too; declarations are not rendered geometry evidence. Local ring isolation and scoped border-box remain disclosed extensions. Source CSS transform transition replaces resident translate timing; sm uses size-3 (0.75rem) under the actual logical Root size protocol; independent transform properties and reduced-motion projection are included; actual native motion remains separately verified. No value or interaction owner is added.
      zh-CN: 默认Thumb使用pointer-events-none block size-4 rounded-full bg-background ring-0 ring-offset-0 translate-x-0，无border/shadow。checked为translate-x-[calc(100%_-_2px)]，dark unchecked为bg-foreground、checked为bg-primary-foreground。size-4保持1rem，在两种根字体下声明为16px/32px；位移为实际Thumb宽减2px。Root也按rem缩放，声明不是渲染实测。local ring isolation与scoped border-box为已披露扩展；源 CSS transform transition 替代旧 resident translate 动画，sm按实际逻辑Root尺寸协议使用size-3（0.75rem），独立 transform 属性与减少运动投射已包含，实际原生运动仍独立验证，不新增值或交互owner。
    dependsOn:
      contracts: [C-RULE-INTENT-FEEDBACK-STYLE-0001]
      decisions:
        - id: D-WEB-STYLE-BASELINE-0001
          since: 0.2.0-rc.1
  - id: P-SHADCN-SWITCH-THUMB-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前实体只声明已测试的 inherited indicator behavior 与视觉 surface；公开组合模型和 upstream token 的全部差异必须集中在唯一 compatibility open question。
      en: This entity claims only tested inherited indicator behavior and visual surface; all differences in public composition and upstream tokens must remain centralized in one compatibility open question.
  - id: P-SHADCN-SWITCH-THUMB-VISUAL-SIZE
    text:
      en: Thumb has no size prop and derives default or sm only under P-SHADCN-SWITCH-VISUAL-SIZE-OWNER and P-SHADCN-SWITCH-VISUAL-SIZE-LIFECYCLE. Default uses size-4 (1rem), sm uses size-3 (0.75rem), and checked travel remains used Thumb width minus 2px for both. At root fonts 16/32px the sm Root is 24x14/48x28px, Thumb is 12/24px and checked travel is 10/22px. These source relationships are expectations, not measured browser or native results.
      zh-CN: Thumb没有size prop，仅按P-SHADCN-SWITCH-VISUAL-SIZE-OWNER及P-SHADCN-SWITCH-VISUAL-SIZE-LIFECYCLE派生default/sm。default用size-4（1rem），sm用size-3（0.75rem），两者checked位移均为实际Thumb宽减2px。根字体16/32px时sm Root为24×14/48×28px，Thumb为12/24px，checked位移10/22px；这些源码关系是预期，不是browser/native实测。
    references:
      prototypes:
        - id: P-SHADCN-SWITCH
          anchors: [P-SHADCN-SWITCH-VISUAL-SIZE-OWNER, P-SHADCN-SWITCH-VISUAL-SIZE-LIFECYCLE]
  - id: P-SHADCN-SWITCH-THUMB-SHARED-PROFILES
    text:
      en: Actual Root style is authoritative. New York keeps full radius and 100%-2px travel; Rhea adds theme2xl, shadow-sm, light padding clip and 100%-4px travel. Both use the fixed source transform transition, whose CSS includes independent translate/scale/rotate and honors reduced motion. This replaces the previous resident translate writer, not checked ownership or Thumb anatomy.
      zh-CN: 视觉样式以实际 Root 为准。NY 保留 full 圆角与 100%-2px 位移；Rhea 使用 theme2xl、shadow-sm、浅色 padding clip 与 100%-4px 位移。两者使用固定上游 transform transition，CSS 包含独立 translate/scale/rotate 并遵循减少运动偏好；该声明替代旧 resident translate writer，不替换 checked 或 Thumb anatomy。
openQuestions:
  - id: P-SHADCN-SWITCH-THUMB-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: 当前公开 Thumb anatomy part 与固定 upstream 内部 Thumb 在组合、尺寸、状态位移和 surface 上应如何对齐？
      en: How should the current public Thumb anatomy part align with the pinned upstream internal Thumb in composition, sizing, state movement, and surface?
    context:
      en: The default/sm presentation follows the pinned New York wrapper. A public optional same-domain Thumb is retained instead of copying the upstream internal composition. Owner-bound size coordination is family-owned; full API parity remains outside this slice; transform properties and reduced-motion CSS are projected. New York has no extra border or shadow, while Rhea intentionally uses its source shadow-sm; competing resident timing is not installed; real rendered travel and dark paint remain separately testable.
      zh-CN: default/sm尺寸呈现遵循固定New York wrapper；保留公开可选same-domain Thumb，不照搬上游内部composition。owner-bound尺寸协调由家族自有；完整 API 一致仍不属于本片；投射 transform 属性与减少运动 CSS。NY 无额外 border/shadow，Rhea 使用源 shadow-sm，不安装冲突的 resident timing；真实位移与dark paint仍需独立验证。
    blocks: [shadcn switch thumb parity roadmap]

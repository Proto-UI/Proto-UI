revisions:
  - version: 0.2.0-rc.0
    change: introduced
    summary: Introduced delta-style Shadcn Switch Thumb cataloging with Base indicator inheritance, current visual guarantees, and centralized upstream composition differences.
  - version: 0.2.0-rc.5
    change: revised
    summary: Added inherited checked-state translation between translate-x-0 and translate-x-5.
  - version: 0.2.0-rc.6
    change: revised
    summary: Corrected checked travel for symmetric internal gaps and isolated the Thumb shadow from inherited focus-ring offsets.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Migrated only draft presentation to content-pinned base-nova; retained Base and public anatomy ownership; fresh runtime/CSS/browser evidence remains required.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Update the fixed New York source target and rem geometry relation; retain sm and full motion-channel gaps.
  - version: 0.3.0-alpha.1
    change: expanded
    summary: Define derived sm Thumb dimensions and owner-bound lifecycle without a Thumb size prop or Base visual semantics.

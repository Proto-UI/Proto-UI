id: P-SHADCN-SWITCH-THUMB
type: prototype
title: Shadcn Switch Thumb inherits the Base indicator and adds its current visual surface
status: draft
since: 0.2.0-rc.0
summary: Shadcn Switch Thumb inherits the Base context-driven indicator protocol and adds the currently implemented thumb shape, sizing, surface, and motion tokens.
statement:
  zh-CN: >-
    Shadcn Switch Thumb 是 `P-BASE-SWITCH-THUMB` 之上的 direct anatomy part。它继续从同域 Root context 派生 checked/disabled display state，不拥有 value、activation、focus 或 event 语义，并增加当前实现的 thumb 尺寸、形状、surface 与 transition tokens。固定 upstream Shadcn wrapper 将 Thumb 作为内部结构，而 Proto UI 当前将它公开为可组合原型；该差异及 token parity 集中记录为 compatibility differences。


  en: >-
    Shadcn Switch Thumb is a direct anatomy part over `P-BASE-SWITCH-THUMB`. It continues to derive checked and disabled display state from same-domain Root context, owns no value, activation, focus, or event semantics, and adds the currently implemented thumb dimensions, shape, surface, and transition tokens. The pinned upstream Shadcn wrapper keeps Thumb internal while Proto UI currently exposes it as a composable prototype; that difference and token parity are centralized as compatibility differences.


criteria:
  - id: P-SHADCN-SWITCH-THUMB-UPSTREAM-IDENTITY
    text:
      zh-CN: Thumb 必须沿用 Shadcn Switch 固定 revision/path 作为比较基线，并明确本实体只治理 Proto UI 的非官方 anatomy projection。
      en: Thumb must use the pinned Shadcn Switch revision and path as its comparison baseline and identify this entity as governing only Proto UI's unofficial anatomy projection.
  - id: P-SHADCN-SWITCH-THUMB-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-switch-thumb` 必须通过 `inherits.prototypes` 指向 `P-BASE-SWITCH-THUMB` 并调用 `asSwitchThumb()`；任何 setup-only 负向补丁必须声明具体偏离和替代语义。'
      en: '`shadcn-switch-thumb` must point to `P-BASE-SWITCH-THUMB` through `inherits.prototypes` and call `asSwitchThumb()`; any setup-only negative patch must declare the exact deviation and replacement semantics.'
    dependsOn:
      contracts: [C-AS-HOOK-0001, C-CORE-SYNTAX-0007]
  - id: P-SHADCN-SWITCH-THUMB-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不反转 inherited context、indicator role 或无独立交互语义等 Base guarantee；新增 tokens 仅构成视觉增量。
      en: The current implementation reverses none of the inherited Base guarantees for context, indicator role, or absence of independent interaction semantics; added tokens are visual deltas only.
  - id: P-SHADCN-SWITCH-THUMB-DIRECT-ENTRY
    text:
      zh-CN: 当前 Thumb protocol 以 `shadcn-switch-thumb` direct prototype 公开；本层不额外提供 authored asHook。
      en: The current Thumb protocol is exposed as the `shadcn-switch-thumb` direct prototype; this layer provides no additional authored asHook.
    dependsOn:
      contracts: [C-CORE-SYNTAX-0003]
  - id: P-SHADCN-SWITCH-THUMB-CONTEXT-INDICATOR
    text:
      zh-CN: Thumb 必须继续作为 same-domain context-driven indicator 反映 Root checked state，不得拥有 checked source of truth、activation route、focus target 或 outward signal。
      en: Thumb must remain a same-domain context-driven indicator of Root checked state and must not own checked source of truth, an activation route, a focus target, or an outward signal.
    references:
      prototypes:
        - id: P-BASE-SWITCH-THUMB
          anchors:
            [
              P-BASE-SWITCH-THUMB-CONTEXT-SUBSCRIBE,
              P-BASE-SWITCH-THUMB-DERIVED-CHECKED,
              P-BASE-SWITCH-THUMB-NO-EVENT-TARGET,
            ]
  - id: P-SHADCN-SWITCH-THUMB-CURRENT-VISUAL-SURFACE
    text:
      en: Default Thumb projects pointer-events-none block size-4 rounded-full bg-background ring-0 ring-offset-0 transition-transform translate-x-0 with no border or shadow. Inherited checked selects translate-x-[calc(100%_-_2px)], giving 14px travel inside the 30px track interior and symmetric zero extra horizontal padding beyond the 1px border. The 18.4px outer height minus two 1px borders and the 16px Thumb leaves 0.4px vertical space, centered by flex alignment. Dark unchecked uses bg-foreground and dark checked bg-primary-foreground. Local ring isolation and scoped border-box are retained; no second value or motion owner is added.
      zh-CN: 默认 Thumb 投射 pointer-events-none block size-4 rounded-full bg-background ring-0 ring-offset-0 transition-transform translate-x-0，无border或shadow。继承 checked 选择 translate-x-[calc(100%_-_2px)]，在30px轨道内宽中位移14px，在1px边框内侧水平两端保持对称零额外padding；18.4px外高减两个1px边框与16px Thumb仍有0.4px垂直余量，由flex居中。dark unchecked 为bg-foreground，dark checked为bg-primary-foreground。保留local ring隔离与scoped border-box，不增加value或motion owner。
    dependsOn:
      contracts: [C-RULE-INTENT-FEEDBACK-STYLE-0001]
      decisions:
        - id: D-WEB-STYLE-BASELINE-0001
          since: 0.2.0-rc.1
  - id: P-SHADCN-SWITCH-THUMB-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前实体只声明已测试的 inherited indicator behavior 与视觉 surface；公开组合模型和 upstream token 的全部差异必须集中在唯一 compatibility open question。
      en: This entity claims only tested inherited indicator behavior and visual surface; all differences in public composition and upstream tokens must remain centralized in one compatibility open question.
openQuestions:
  - id: P-SHADCN-SWITCH-THUMB-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: 当前公开 Thumb anatomy part 与固定 upstream 内部 Thumb 在组合、尺寸、状态位移和 surface 上应如何对齐？
      en: How should the current public Thumb anatomy part align with the pinned upstream internal Thumb in composition, sizing, state movement, and surface?
    context:
      en: The default-size presentation follows the pinned base-nova recipe. A public optional same-domain Thumb is retained instead of copying the upstream internal composition. Smaller size, inherited size coordination, field-label/invalid/hit-target features and full API parity remain outside this slice. Extra borders, shadows and fixed duration/easing from the historical implementation are removed; real rendered travel and dark paint remain separately testable.
      zh-CN: 默认尺寸呈现遵循固定base-nova recipe；保留公开可选same-domain Thumb，不照搬上游内部composition。sm尺寸、继承size协调、field-label/invalid/hit-target与完整API一致仍不属于本片。移除历史额外border、shadow及固定duration/easing；真实位移与dark paint仍需独立验证。
    blocks: [shadcn switch thumb parity roadmap]

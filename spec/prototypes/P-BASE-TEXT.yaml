id: P-BASE-TEXT
type: prototype
title: Base Text passive content and presentation inputs
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: New bounded Text presentation slice has source-backed Web Adapter and compiler evidence. It remains draft pending independent review and real-browser visual admission; native GPUI typography omissions remain explicit.
summary: Reusable passive text content with independent presentation axes; no document, editor or navigation ownership.
statement:
  en: Base Text owns a stable, roleless content slot and the normalized presentation vocabulary. It does not interpret text, edit content, infer document semantics or choose a host tag. Design-language projections inherit these inputs and own their feedback styles. Heading levels, label association, link destination, application copy and layout remain with their existing semantic owners.
criteria:
  - id: P-BASE-TEXT-INPUTS
    text:
      en: Public inputs are size xs|sm|base|lg|xl|2xl|3xl|4xl|5xl; tone default|muted|inherit; weight normal|medium|semibold|bold; font body|heading|mono; leading size|tighter|tight|snug|normal|relaxed; tracking normal|tight|tighter; emphasis normal|italic; decoration none|underline|line-through. Defaults are respectively base, default, normal, body, normal, normal, normal and none. Removing a prop restores its default. The size leading option preserves the selected family size line box without an additional leading override; tighter requests the compact 1.1 line-height projection. Missing size normalizes to base. An initially invalid size falls back to base; provided empty or invalid size after a valid value preserves that previous value under the existing Props contract. No numeric or expression input is accepted.
  - id: P-BASE-TEXT-CONTENT
    text:
      en: The default slot preserves authored text and children without replacing the native h1-h6, p, label, a or editor owner. One Text instance has one canonical presentation subject. No content transformation or formatting parser is provided.
  - id: P-BASE-TEXT-PASSIVE
    text:
      en: Text adds no role, accessible name, focus stop, activation, navigation, editing, exposed state, event or method. It offers no asChild, role/tag selector, arbitrary host escape, heading level, label-for or href API. Consumer or Adapter host configuration remains outside this prototype.
  - id: P-BASE-TEXT-ENTRIES
    text:
      en: The public package root and /text subpath export textRoot, asTextRoot and TextRootProps/TextRootExposes. Base remains visually neutral; family projections reuse asTextRoot rather than cloning the schema.
dependsOn:
  contracts:
    - C-CORE-SYNTAX-0003
    - C-PROPS-0001
    - C-AS-HOOK-0001
verifies:
  tests:
    - T-TEXT-0001
sources:

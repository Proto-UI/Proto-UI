  - path: packages/prototypes/base/src/text/types.ts
  - path: packages/prototypes/base/src/text/index.ts
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added governed passive Text subject and reusable presentation vocabulary without new native semantics.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Extended the finite visual vocabulary with size-owned leading and tighter leading/tracking; existing defaults and passive ownership remain unchanged.
tags:

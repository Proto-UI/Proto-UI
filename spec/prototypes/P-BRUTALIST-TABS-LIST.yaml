id: P-BRUTALIST-TABS-LIST
type: prototype
title: 'Brutalist Tabs List inherits Base Tabs List and layers a rounded ruled tab strip'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Tabs List inherits Base Tabs List coordination semantics and projects a style-family panel surface: a rounded horizontal strip with a fixed height, black structural borders, a hard offset shadow, and a flat theme-token fill.'

statement:
  en: P-BRUTALIST-TABS-LIST preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-TABS-LIST 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-TABS-LIST-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Tabs List through `asTabsList()` once and must not redefine Base trigger activation, rendering, or keyboard-navigation protocol semantics. Visual projection may only own the strip surface; trigger fills belong to the Tabs trigger.


      zh-CN: >-
        该 prototype 必须通过 `asTabsList()` 一次性继承 Base Tabs List，不得重定义 Base 的 trigger activation、渲染或键盘导航协议语义。视觉投射仅可承担 strip 表面；trigger 填充归 Tabs trigger 所有。


  - id: P-BRUTALIST-TABS-LIST-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-tabs-list` and is the only public Tabs List entry in this foundation slice.
      zh-CN: 直接 prototype 入口名为 `brutalist-tabs-list`，且是本 foundation 切片中唯一公开的 Tabs List 入口。
  - id: P-BRUTALIST-TABS-LIST-VISUAL-GRAMMAR
    text:
      en: >-
        List is an h-12 rounded-base 5px strip with border-2 border-black, bg-background/text-foreground, inline-flex items-center p-1 and no shadow. Nested Trigger owns its own rounded-base radius.


      zh-CN: >-
        List 是 h-12、rounded-base 5px strip，带 border-2 border-black、bg-background/text-foreground、inline-flex items-center p-1，无阴影；嵌套 Trigger 独立拥有 rounded-base radius。



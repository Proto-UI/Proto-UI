id: P-BASE-HOVER-CARD-TRIGGER
type: prototype
title: Base Hover Card Trigger publishes preview intent
status: draft
since: 0.2.0-rc.0
summary: Hover Card Trigger is a focusable link-preview anchor that publishes hover and focus intent without owning navigation activation or preview visibility.
statement:
  zh-CN: Hover Card Trigger 是 Hover Card domain 内至多一个的 link-preview anchor。它拥有自身 focus 与 hover facts，但不拥有 open，也不把自身改写为 Button；pointer hover 与 keyboard focus 只能向 Root 发布可延时的 interaction intent，应用提供的 link 仍持有 navigation activation。
  en: Hover Card Trigger is an optional, at-most-one link-preview anchor in a Hover Card domain. It owns its focus and hover facts but owns neither open state nor Button semantics; pointer hover and keyboard focus may only publish delayable interaction intent to Root, while an application-provided link retains navigation activation.
criteria:
  - id: P-BASE-HOVER-CARD-TRIGGER-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-hover-card-trigger` 与 `asHoverCardTrigger` 必须是同一 Trigger protocol 的 authoring entries。'
      en: '`base-hover-card-trigger` and `asHoverCardTrigger` must be authoring entries for the same Trigger protocol.'
  - id: P-BASE-HOVER-CARD-TRIGGER-ROLE
    text:
      zh-CN: Trigger 必须表示可被应用 link surface 承载的 preview anchor，不得自行投射 button role。
      en: Trigger must represent a preview anchor that can be carried by an application link surface and must not independently project a button role.
  - id: P-BASE-HOVER-CARD-TRIGGER-NO-BUTTON-DEPENDENCY
    text:
      zh-CN: Trigger 必须直接消费 core focus/interaction 能力，不得消费 `asButton`。
      en: Trigger must consume core focus and interaction capabilities directly and must not consume `asButton`.
  - id: P-BASE-HOVER-CARD-TRIGGER-INTERACTION
    text:
      zh-CN: Trigger 必须 expose disabled、hovered、focused、focusVisible 与 focusSelf，并把 pointer enter/leave 与 focus/blur 发布为 Root interaction intent。
      en: Trigger must expose disabled, hovered, focused, focusVisible, and focusSelf and publish pointer enter and leave plus focus and blur as Root interaction intent.
  - id: P-BASE-HOVER-CARD-TRIGGER-DISABLED
    text:
      zh-CN: own 或 Root disabled 为 true 时必须清除 hover/focus intent，并拒绝新的 pointer intent 与 focus request。
      en: Own or Root disabled state must clear hover and focus intent and reject new pointer intent and focus requests.
  - id: P-BASE-HOVER-CARD-TRIGGER-NO-ACTIVATION
    text:
      zh-CN: Trigger 不得 author click/press activation 或阻止 Enter navigation；资源激活仍由应用提供的 link surface 持有。
      en: Trigger must not author click or press activation or suppress Enter navigation; resource activation remains owned by the application-provided link surface.
  - id: P-BASE-HOVER-CARD-TRIGGER-INTERACTION-LIFETIME
    text:
      zh-CN: Trigger 必须遵循 Root 的 view-generation contribution identity、owner-bound release 与 remount 规则，在实际 unmount/terminal teardown 撤销自身 transient intent；不得清除其他当前贡献、替代 Root open owner 或修改共享 Focus/Runtime lifetime。
      en: Trigger must follow Root view-generation contribution identity, owner-bound release, and remount rules, withdrawing its own transient intent on actual unmount or terminal teardown without clearing another current contribution, replacing Root open ownership, or changing shared Focus/Runtime lifetime.
  - id: P-BASE-HOVER-CARD-TRIGGER-FOCUS-READINESS
    text:
      zh-CN: 合法 pending focus 在新 view readiness 兑现时，实际 focused.watch next 转换可早于 Trigger 作者的 onMounted 与 contribution owner 就绪。Trigger 必须仅暂存此类已观察转换的最新值，在同次 mounted 借用/分配 owner 后最多发布一次；实际 unmount、terminal teardown 或 disabled 必须清除未发布观察。不得通过 mount 时采样旧 focused=true、伪造 blur/focus 或改写 Focus state 来补发；旧 host generation 已失效的事件仍须由现有宿主/Focus 边界拒绝，不能以缓存重放。
      en: Fulfillment of a valid pending focus at new-view readiness may emit an actual focused.watch next transition before the Trigger author's onMounted and contribution owner are ready. Trigger must retain only the latest such observed transition and publish it at most once after borrowing/allocating the owner in that mounted callback; actual unmount, terminal teardown, or disabled state clears unpublished observations. It must not replay by sampling an old focused=true at mount, fabricating blur/focus, or rewriting Focus state. Invalidated old-host-generation events remain rejected by existing host/Focus boundaries and cannot be replayed through the buffer.
    dependsOn:
      contracts:
        - id: C-AS-FOCUSABLE-0001
          anchors: [C-AS-FOCUSABLE-0001-G]

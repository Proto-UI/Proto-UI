verifies: { tests: [T-BASE-HOVER-CARD-TRIGGER-0001] }
revisions:
  - version: 0.2.0-rc.0
    change: introduced
    summary: Cataloged Trigger focus, hover, disabled, and activation ownership.
  - version: 0.3.0-alpha.1
    change: refined
    summary: Defined owner-bound withdrawal of this part's view-generation interaction contribution; draft retained.
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Clarified consumption of newly observed focus transitions before the authored mounted callback without replaying retained facts or changing Focus ownership.
tags: [prototype, base, hover-card, trigger, link-preview]

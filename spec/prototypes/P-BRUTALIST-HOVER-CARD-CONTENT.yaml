    summary: >-
      Reconciled the no-shadow wording introduced by c7a7309a (#800) with the newer anchored content panel category introduced by ec81ad99 (#398). The existing 3px foreground depth follows that decision; Base semantics, positioning, transition, child geometry and draft status are unchanged.



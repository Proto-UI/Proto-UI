id: P-BRUTALIST-HOVER-CARD-CONTENT
type: prototype
title: Brutalist Hover Card Content inherits Base preview content and layers a hard-shadowed transition panel
status: draft
since: 0.2.0-rc.7
summary: >-
  Brutalist Hover Card Content inherits Base Hover Card preview content and projects a style-family visual API: a fixed-width Brutalist panel, a 200ms enter/leave transition with fade-zoom open animation and side-based slide-in.


statement:
  en: >-
    Brutalist Hover Card Content is a draft Proto UI-maintained Neo-Brutalist design-language projection over Base Hover Card Content. It preserves inherited Base protocol semantics (open state, side prop) and adds only visual/style behavior: a 64-width Brutalist panel with square corners, black borders, hard offset shadows, a 200ms transition via `asTransition`, an `animate-in fade-in-0 zoom-in-95` open animation, and side-based slide-in.


  zh-CN: >-
    Brutalist Hover Card Content 是 Proto UI 维护的 draft Neo-Brutalist design-language 投射，建立在 Base Hover Card Content 之上。它保留继承的 Base 协议语义（open state、side prop），仅增加视觉/style 行为：64 宽 Brutalist 面板（直角、黑色边框、硬偏移阴影）、经 `asTransition` 的 200ms 过渡、`animate-in fade-in-0 zoom-in-95` 开启动画以及按方向的 slide-in。


criteria:
  - id: P-BRUTALIST-HOVER-CARD-CONTENT-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Hover Card Content through `asHoverCardContent()` once and must not redefine Base open or side protocol semantics. It must consume the projected `open` state handle and the projected `side` prop for transition framing.


      zh-CN: >-
        该 prototype 必须通过 `asHoverCardContent()` 一次性继承 Base Hover Card Content，不得重定义 Base 的 open 或 side 协议语义；必须消费投影出的 `open` state handle 与 `side` prop 以构成过渡。


  - id: P-BRUTALIST-HOVER-CARD-CONTENT-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-hover-card-content` and is the only public Hover Card Content entry in this foundation slice.
      zh-CN: 直接 prototype 入口名为 `brutalist-hover-card-content`，且是本 foundation 切片中唯一公开的 Hover Card Content 入口。
  - id: P-BRUTALIST-HOVER-CARD-CONTENT-TRANSITION
    text:
      en: >-
        The content must configure `asTransition` with `enterDuration: 200` and `leaveDuration: 200`. When `open` is true it applies `animate-in fade-in-0 zoom-in-95`; when false it applies `animate-out fade-out-0 zoom-out-95`. Side-based slide-in is applied alongside the open animation: `bottom` → `slide-in-from-top-2`, `top` → `slide-in-from-bottom-2`, `left` → `slide-in-from-right-2`, `right` → `slide-in-from-left-2`.


      zh-CN: >-
        content 必须将 `asTransition` 配置为 `enterDuration: 200` 与 `leaveDuration: 200`。当 `open` 为 true 时应用 `animate-in fade-in-0 zoom-in-95`；为 false 时应用 `animate-out fade-out-0 zoom-out-95`。开启动画之外再按方向施加 slide-in：`bottom` → `slide-in-from-top-2`、`top` → `slide-in-from-bottom-2`、`left` → `slide-in-from-right-2`、`right` → `slide-in-from-left-2`。


  - id: P-BRUTALIST-HOVER-CARD-CONTENT-VISUAL-GRAMMAR
    text:
      en: >-
        The content projects a Brutalist panel via `BRUTALIST_PANEL_TOKENS` (`rounded-none border-2 border-black shadow-[3px_3px_0_0_#000] bg-secondary-background text-foreground`) at `w-64 p-4 text-sm leading-6 outline-none transition-none duration-200`, preserving square corners, black structural borders, hard zero-blur offset shadows, and flat theme-token fills without gradients, glass, rounded cards, or soft elevation.


      zh-CN: >-
        content 通过 `BRUTALIST_PANEL_TOKENS`（`rounded-none border-2 border-black shadow-[3px_3px_0_0_#000] bg-secondary-background text-foreground`）以 `w-64 p-4 text-sm leading-6 outline-none transition-none duration-200` 投射 Brutalist 面板，保持直角、黑色结构边框、零模糊硬偏移阴影与平面主题 token 填充，不得使用渐变、玻璃拟态、圆角卡片或柔和高度阴影。



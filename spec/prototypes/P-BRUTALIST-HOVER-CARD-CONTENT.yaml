id: P-BRUTALIST-HOVER-CARD-CONTENT
type: prototype
title: 'Brutalist Hover Card Content inherits Base preview content and layers a flat anchored transition panel'

status: draft
since: 0.2.0-rc.7
lifecycleRationale:
  en: >-
    This draft projection retains the no-hard-shadow anchored popup governed by this P entity when D-BRUTALIST-DEPTH-MOTION-GRAMMAR-0001 was admitted, now recorded as its named Hover Card Content exception. It corrects the 3px reconciliation in 22efeaac without changing Base semantics, positioning, transition, child geometry or lifecycle, and does not claim complete host and visual acceptance.


  zh-CN: >-
    本 draft 投射保留 D-BRUTALIST-DEPTH-MOTION-GRAMMAR-0001 准入时已由本 P 实体治理的无硬阴影 anchored popup，并对应其现有具名 Hover Card Content 例外。本次纠正 22efeaac 的 3px 同步判断，不改变 Base 语义、定位、过渡、child 几何或生命周期，也不宣称完整 host 与视觉验收。


summary: 'Brutalist Hover Card Content inherits Base Hover Card preview content and projects a style-family visual API: a fixed-width Brutalist panel, a 200ms enter/leave transition with fade-zoom open animation and side-based slide-in.'
statement:
  en: P-BRUTALIST-HOVER-CARD-CONTENT preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill and state criteria below. Depth follows the named no-hard-shadow Hover Card Content exception within the anchored content panel category of D-BRUTALIST-DEPTH-MOTION-GRAMMAR-0001; neobrutalism-components 3306a802 remains the historical source reference for the other visual criteria. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-HOVER-CARD-CONTENT 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色与状态准则；深度遵循 D-BRUTALIST-DEPTH-MOTION-GRAMMAR-0001 的 anchored content panel 类别中具名的无硬阴影 Hover Card Content 例外，neobrutalism-components 3306a802 仍是其余视觉准则的历史来源；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-HOVER-CARD-CONTENT-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Hover Card Content through `asHoverCardContent()` once and must not redefine Base open or side protocol semantics. It must consume the projected `open` state handle and the projected `side` prop for transition framing.


      zh-CN: >-
        该 prototype 必须通过 `asHoverCardContent()` 一次性继承 Base Hover Card Content，不得重定义 Base 的 open 或 side 协议语义；必须消费投影出的 `open` state handle 与 `side` prop 以构成过渡。


  - id: P-BRUTALIST-HOVER-CARD-CONTENT-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-hover-card-content` and is the only public Hover Card Content entry in this foundation slice.
      zh-CN: 直接 prototype 入口名为 `brutalist-hover-card-content`，且是本 foundation 切片中唯一公开的 Hover Card Content 入口。
  - id: P-BRUTALIST-HOVER-CARD-CONTENT-TRANSITION
    text:
      en: >-
        The content must configure `asTransition` with `enterDuration: 200` and `leaveDuration: 200`. When `open` is true it applies `animate-in fade-in-0 zoom-in-95`; when false it applies `animate-out fade-out-0 zoom-out-95`. Side-based slide-in is applied alongside the open animation: `bottom` → `slide-in-from-top-2`, `top` → `slide-in-from-bottom-2`, `left` → `slide-in-from-right-2`, `right` → `slide-in-from-left-2`.


      zh-CN: >-
        content 必须将 `asTransition` 配置为 `enterDuration: 200` 与 `leaveDuration: 200`。当 `open` 为 true 时应用 `animate-in fade-in-0 zoom-in-95`；为 false 时应用 `animate-out fade-out-0 zoom-out-95`。开启动画之外再按方向施加 slide-in：`bottom` → `slide-in-from-top-2`、`top` → `slide-in-from-bottom-2`、`left` → `slide-in-from-right-2`、`right` → `slide-in-from-left-2`。


  - id: P-BRUTALIST-HOVER-CARD-CONTENT-VISUAL-GRAMMAR
    text:
      en: >-
        The content uses BRUTALIST_PANEL_TOKENS: rounded-base (5px), border-2 border-black, bg-background/text-foreground, font-sans font-medium. It belongs to the anchored content panel category of D-BRUTALIST-DEPTH-MOTION-GRAMMAR-0001 and retains its named Hover Card Content exception: no hard shadow and no interaction motion. Existing positioning, available-space bounds, padding, transition and focus ownership remain unchanged. Rounded children own their own radius; the parent must not globally zero or override child geometry.


      zh-CN: >-
        Content 使用 BRUTALIST_PANEL_TOKENS：rounded-base（5px）、border-2 border-black、bg-background/text-foreground、font-sans font-medium。其所属类别为 D-BRUTALIST-DEPTH-MOTION-GRAMMAR-0001 的 anchored content panel，并保留其具名的 Hover Card Content 例外：无硬阴影且无交互 motion；现有 positioning、可用空间边界、padding、transition 与 focus owner 不变。圆角 child 各自拥有 radius；父级不得全局清零或覆盖 child 几何。



      Corrected the 3px interpretation introduced by this integration in 22efeaac (#1930). At typed-grammar admission ec81ad99, this P criterion and its implementation already required no hard shadow; the maintainer ruling preserved exact component P authority, and the decision now names that finite exception. The earlier reconciliation record is retained below as history. Base semantics, positioning, transition, child geometry and draft status remain unchanged.


  - version: 0.3.0-alpha.1

id: P-LIQUID-GLASS-SURFACE
type: prototype
title: liquid-glass passive Surface atom
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Bounded passive presentation atom under current user-directed normalization. Draft pending independent review and exact-source browser evidence; native/compiler omissions remain explicit rather than implied by Web behavior.
summary: Reusable passive content surface with presentation-only facts, independent of any page or navigation protocol.
statement:
  en: Surface owns a slotted visual shell. Its consumer supplies layout, content and facts from the existing semantic owner. It does not own hover detection, focus, activation, selection, navigation, disclosure, clipboard or source editing. This design projection inherits Base Surface, uses ordinary paint by default and permits an explicit request for the existing typed material capability on an eligible functional shell. No homepage, preview, code-toolbar or social-icon vocabulary is part of the API.
criteria:
  - id: P-LIQUID-GLASS-SURFACE-PASSIVE
    text:
      en: Surface introduces no role, tabindex, focus request, event listener, activation, semantic state, native property forwarding or exposed method. Authored content remains in its original semantic ownership. Observed presentation inputs are not an event simulation or an independent interaction truth.
  - id: P-LIQUID-GLASS-SURFACE-INPUTS
    text:
      en: Inputs are variant transparent|outline|secondary|muted|accent|solid|scrim, radius default|none|sm|md|lg|xl|full, border all|bottom|none, elevation none|raised, boolean hovered/focusVisible/pressed/current/fade, and observed transitionState closed|entering|entered|leaving. Defaults are outline/default/all/none, transitionState entered, and all booleans false. The family-local material input is auto|opaque with default opaque; auto is an explicit opt-in, not the Base default. Absent inputs restore defaults, including withdrawing the material candidate. Family is not a Surface prop.
  - id: P-LIQUID-GLASS-SURFACE-PROJECTION
    text:
      en: The family inherits asSurfaceRoot and owns its finite fill, border, radius, depth and observed-feedback recipes through rule/feedback.style. Surface does not choose font, text size or content. Pointer hit ownership stays with the semantic host. Fade projects only the existing Transition owner phase; it does not create a clock, lifecycle, inertness or interaction state. Web surface-fade consumes --pui-surface-transition-duration, default 0ms, supplied only from finite nonnegative duration milliseconds by its composition owner. Reduced-motion uses 0ms. Scrim lowers to black at 80 percent opacity. Unsupported native lowering, including unresolved CSS duration variables and starting-style selectors, remains diagnostic, never an inferred support claim.
  - id: P-LIQUID-GLASS-SURFACE-ENTRIES
    text:
      en: The private workspace package root and /surface source subpath expose Surface for internal Adapter and compiler consumption. This unpublished, release-excluded package is not offered by public CLI add or its interactive choices. Partial-family Surface defaults to neutral opaque outline presentation (transparent and scrim are ordinary fills, not material effects) and does not expand unrelated component compatibility guarantees.
  - id: P-LIQUID-GLASS-SURFACE-MATERIAL
    text:
      en: A single version-2 in-app-backdrop slot designates final style fill and foreground as its fallback. Only explicit material auto with outline, secondary or muted contributes the existing complete regular liquid-glass candidate; opaque, absent input and other variants contribute none and preserve ordinary style. Consumer compositions opt in only for eligible functional or navigation shells, never blanket content or nested decorative children. Shared source, preference, contrast and provider admission remain authoritative; missing or rejected support preserves legal ordinary paint and diagnostics. No shader, source acquisition, interaction owner or lifecycle is added, and intent is not optical or Apple-native parity evidence.
sources:

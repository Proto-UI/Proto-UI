id: P-BOOTSTRAP-2-3-2-BUTTON
type: prototype
title: Bootstrap 2.3.2 Button projection over Base Button
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: A user-directed, independently authored visual foundation. Full family/component coverage, material capability where applicable, generated/native evidence and stable admission remain open; source package availability is not release or conformance admission.
summary: Seven color variants use fixed v2.3.2 resting and state-endpoint paint, including text shadows and final modern-browser border colors. Hover/focus retain the gradient at 0px -15px with its endpoint background color; pressed/disabled flatten it. Four sizes retain upstream pixel units. A stronger focus-visible ring is preserved. The 100ms background-position motion, color-contrast acceptance, link/block recipes and complete target evidence remain open; static endpoint coverage is not full upstream parity. The legacy palette is retained in both host color schemes.
statement:
  en: Seven color variants use fixed v2.3.2 resting and state-endpoint paint, including text shadows and final modern-browser border colors. Hover/focus retain the gradient at 0px -15px with its endpoint background color; pressed/disabled flatten it. Four sizes retain upstream pixel units. A stronger focus-visible ring is preserved. The 100ms background-position motion, color-contrast acceptance, link/block recipes and complete target evidence remain open; static endpoint coverage is not full upstream parity. The legacy palette is retained in both host color schemes. variant is default | primary | warning | danger | success | info | inverse, default default; size is default | large | small | mini, default default; disabled is inherited and defaults false.
criteria:
  - id: P-BOOTSTRAP-2-3-2-BUTTON-BASE
    text:
      en: The Prototype invokes asButton() once, preserves inherited interaction, focus, disabled and click ownership, and consumes only its exposed state handles for visual Rules.
  - id: P-BOOTSTRAP-2-3-2-BUTTON-API
    text:
      en: variant is default | primary | warning | danger | success | info | inverse, default default; size is default | large | small | mini, default default; disabled is inherited and defaults false. wrap defaults false; false retains the upstream single-line nowrap recipe and true uses whitespace-normal with h-auto/min-h-8 so long labels grow instead of clipping. Removing a prop restores its default. Size Rules are mutually exclusive and retain the same Base interaction owner.
  - id: P-BOOTSTRAP-2-3-2-BUTTON-VISUAL
    text:
      en: Seven color variants use fixed v2.3.2 resting and state-endpoint paint, including text shadows and final modern-browser border colors. Hover/focus retain the gradient at 0px -15px with its endpoint background color; pressed/disabled flatten it. Four sizes retain upstream pixel units. A stronger focus-visible ring is preserved. The 100ms background-position motion, color-contrast acceptance, link/block recipes and complete target evidence remain open; static endpoint coverage is not full upstream parity. The legacy palette is retained in both host color schemes.
  - id: P-BOOTSTRAP-2-3-2-BUTTON-DIMENSIONS
    text:
      en: All seven variants retain fixed v2.3.2 CSS pixel units at root font sizes 16px and 32px. Every size has line height 20px and border 1px. Default has padding 4px 12px, font 14px, radius 4px and single-line height 30px; large has 11px 19px, 17.5px, 6px and 44px; small has 2px 10px, 11.9px, 3px and 26px; mini has 0px 6px, 10.5px, 3px and 22px. Size-dependent padding, font and radius Rules are mutually exclusive. Root-font changes are not browser zoom.
  - id: P-BOOTSTRAP-2-3-2-BUTTON-PALETTE
    text:
      en: Resting gradient start/end and background colors are default (#fff/#e6e6e6, #f5f5f5), primary (#08c/#04c, #006dcc), warning (#fbb450/#f89406, #faa732), danger (#ee5f5b/#bd362f, #da4f49), success (#62c462/#51a351, #5bb75b), info (#5bc0de/#2f96b4, #49afcd) and inverse (#444/#222, #363636). Default text is #333 with 0px 1px 1px white/75% text shadow; others use #fff with 0px -1px 0px black/25%. Top/right/left borders use black/10%; bottom uses #b3b3b3 for default and black/25% otherwise. These are the final modern CSS declarations, not older browser fallback borders.
  - id: P-BOOTSTRAP-2-3-2-BUTTON-STATE-PAINT
    text:
      en: Base focused or hovered state selects the gradient endpoint background and position 0px -15px while retaining the gradient and repeat-x. Pressed selects the endpoint color with no image and repeat-x, retaining position 0px -15px while hovered or focused, otherwise 0px 0px. Disabled uses the same flat endpoint at 0px 0px because Base clears hover/focus. Disabled suppresses the pressed shadow and uses opacity 0.65 with no painted box shadow; enabled pressed uses the inherited inset-shadow grammar. Focus-visible retains the accessible ring. There is no persistent active/toggle state or new interaction owner. The 100ms upstream motion is not implemented by this static endpoint slice.
  - id: P-BOOTSTRAP-2-3-2-BUTTON-PAINT-OWNERS
    text:
      en: Complete finite background, text-color and border-color recipes each retain one semantic token-group owner through actual merging. Background owns color/image/position/repeat, text-color owns color/text-shadow, and border-color owns four edge colors. Size, line height, border width, radius and focus/box shadows remain separate. Legacy passive paint exports and their physical translations remain unchanged for existing Form, AlertDialog and Surface consumers. This bounded representation does not fix or broaden Core token grouping.
  - id: P-BOOTSTRAP-2-3-2-BUTTON-CLOSURE
    text:
      en: Appearance is authored in feedback tokens and state/prop Rules; every token has an explicit physical translation. Standalone Web output must not depend on website component CSS or reset rules.
  - id: P-BOOTSTRAP-2-3-2-BUTTON-BOUNDARY
    text:
      en: The package is private and unreleased. Initial source and Web evidence do not establish general Prototype Compiler, GPUI, Flutter or Qt support. Homepage and full component coverage remain separate work.

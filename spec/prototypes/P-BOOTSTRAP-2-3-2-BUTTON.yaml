revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Cataloged the draft Base-inheriting visual Button foundation with explicit material, release and host limits.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Replaced the original scalable-metrics deviation with fixed upstream pixel units under the PR872 sizing decision; default/primary scope and draft lifecycle remain unchanged.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added default/large/small/mini sizes with exclusive upstream pixel dimensions, preserving default compatibility, Base ownership, two variants and draft lifecycle.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added seven source palettes and static state endpoints with text shadows and modern final borders through finite complete paint recipes; preserved focus, legacy consumers, draft lifecycle and explicit motion/contrast/target gaps.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added an explicit wrap prop for the real homepage consumer, preserving upstream nowrap by default and allowing bounded vertical growth on request.

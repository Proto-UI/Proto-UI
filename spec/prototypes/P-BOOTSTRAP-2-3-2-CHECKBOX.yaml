id: P-BOOTSTRAP-2-3-2-CHECKBOX
type: prototype
title: bootstrap-2-3-2 checkbox root over Base
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: Draft all-Base coverage increment. Source/unit availability is not release, browser paint, Compiler or native conformance admission.
summary: A genuine asCheckboxRoot projection; Base retains checkbox semantics and this part contributes only appearance.
statement:
  en: The authored Prototype invokes asCheckboxRoot once. A custom 20px square root with 4px corners, field inset shadow, blue checked/mixed paint and a stronger focus-visible ring. The native upstream checkbox is a visual reference, not an exact custom-parts skin.
criteria:
  - id: P-BOOTSTRAP-2-3-2-CHECKBOX-BASE
    text:
      en: Invoke asCheckboxRoot once and retain every inherited state, event, focus, editing, context and anatomy owner; never copy the semantic implementation or introduce a competing value owner.
  - id: P-BOOTSTRAP-2-3-2-CHECKBOX-API
    text:
      en: The root owns checked and indeterminate values, checkedChange/indeterminateChange, controlled or uncontrolled ownership, disabled suppression and focus. Indicators share its inherited anatomy domain.
  - id: P-BOOTSTRAP-2-3-2-CHECKBOX-VISUAL
    text:
      en: A custom 20px square root with 4px corners, field inset shadow, blue checked/mixed paint and a stronger focus-visible ring. The native upstream checkbox is a visual reference, not an exact custom-parts skin.
  - id: P-BOOTSTRAP-2-3-2-CHECKBOX-CLOSURE
    text:
      en: All component appearance is declared by Prototype feedback and Rules and closes through the source-derived finite physical token renderer. No website-only component CSS may supply missing default intent.
  - id: P-BOOTSTRAP-2-3-2-CHECKBOX-BOUNDARY
    text:
      en: The package is private and unreleased. Documentation and demos expose the real parts. Actual four-Web browser rendering, general Compiler and GPUI/Flutter/Qt conformance need separate collected evidence; source availability alone is insufficient.

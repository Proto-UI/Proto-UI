id: P-BRUTALIST-SELECT-CONTENT
type: prototype
title: Brutalist Select Content inherits Base Select Content and layers a hard-shadowed listbox panel
status: draft
since: 0.2.0-rc.7
summary: >-
  Brutalist Select Content inherits Base Select Content open/transition ownership and projects a style-family visual API: a square listbox panel with hard offset shadows, anchor-driven width, loadable height, and transition-based enter/leave animation with side-based slide-in.


statement:
  en: >-
    Brutalist Select Content is a draft Proto UI-maintained Neo-Brutalist design-language projection over Base Select Content. It preserves inherited Base protocol semantics (open/transitionState/side state ownership) and adds only visual/style behavior: zero radius, black structural borders, hard offset shadows, flat panel fills, and a transition configuration with side-based slide-in animation.


  zh-CN: >-
    Brutalist Select Content 是 Proto UI 维护的 draft Neo-Brutalist design-language 投射，建立在 Base Select Content 之上。它保留继承的 Base 协议语义（open/transitionState/side 状态归属），仅增加视觉/style 行为：零圆角、黑色结构边框、硬偏移阴影、平面面板填充，以及带 side 滑入方向的 transition 配置。


criteria:
  - id: P-BRUTALIST-SELECT-CONTENT-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Select Content through `asSelectContent()` once and must not redefine Base open, transitionState, or side protocol semantics. Visual projection may only consume the projected state handles.


      zh-CN: >-
        该 prototype 必须通过 `asSelectContent()` 一次性继承 Base Select Content，不得重定义 Base 的 open、transitionState 或 side 协议语义；视觉投射只能消费投影出的 state handles。


  - id: P-BRUTALIST-SELECT-CONTENT-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-select-content`.
      zh-CN: 直接 prototype 入口名为 `brutalist-select-content`。
  - id: P-BRUTALIST-SELECT-CONTENT-TRANSITION
    text:
      en: >-
        The content configures its transition with `enterDuration: 150, leaveDuration: 100`. When entering/entered it applies `animate-in fade-in-0 zoom-in-95`; when open is false it applies `animate-out fade-out-0 zoom-out-95`. Side-based slide-in: `bottom` → `slide-in-from-top-2`, `top` → `slide-in-from-bottom-2`, `left` → `slide-in-from-right-2`, `right` → `slide-in-from-left-2`, only when open.


      zh-CN: >-
        content 将其 transition 配置为 `enterDuration: 150, leaveDuration: 100`。entering/entered 时应用 `animate-in fade-in-0 zoom-in-95`；open 为 false 时应用 `animate-out fade-out-0 zoom-out-95`。基于 side 的滑入：`bottom` → `slide-in-from-top-2`，`top` → `slide-in-from-bottom-2`，`left` → `slide-in-from-right-2`，`right` → `slide-in-from-left-2`，仅在 open 时生效。


  - id: P-BRUTALIST-SELECT-CONTENT-VISUAL-GRAMMAR
    text:
      en: >-
        The panel surface reuses `BRUTALIST_PANEL_TOKENS` (`rounded-none border-2 border-black shadow-[3px_3px_0_0_#000] bg-secondary-background text-foreground`), anchored width via `--proto-ui-anchor-width`, bounded height via `--proto-ui-available-height`, with vertical scroll and outline-none focus, preserving square corners, black structural borders, hard zero-blur offset shadows, and flat theme-token fills.


      zh-CN: >-
        面板表面复用 `BRUTALIST_PANEL_TOKENS`（`rounded-none border-2 border-black shadow-[3px_3px_0_0_#000] bg-secondary-background text-foreground`），通过 `--proto-ui-anchor-width` 设定锚定宽度、通过 `--proto-ui-available-height` 限定高度，支持垂直滚动与 outline-none 聚焦，保持直角、黑色结构边框、零模糊硬偏移阴影和平面主题 token 填充。



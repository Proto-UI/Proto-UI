id: P-BRUTALIST-SELECT-CONTENT
type: prototype
title: 'Brutalist Select Content inherits Base Select Content and layers a hard-shadowed listbox panel'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Select Content inherits Base Select Content open/transition ownership and projects a style-family visual API: a rounded listbox panel with component-owned depth, anchor-driven width, loadable height, and transition-based enter/leave animation with side-based slide-in.'

statement:
  en: P-BRUTALIST-SELECT-CONTENT preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-SELECT-CONTENT 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-SELECT-CONTENT-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Select Content through `asSelectContent()` once and must not redefine Base open, transitionState, or side protocol semantics. Visual projection may only consume the projected state handles.


      zh-CN: >-
        该 prototype 必须通过 `asSelectContent()` 一次性继承 Base Select Content，不得重定义 Base 的 open、transitionState 或 side 协议语义；视觉投射只能消费投影出的 state handles。


  - id: P-BRUTALIST-SELECT-CONTENT-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-select-content`.
      zh-CN: 直接 prototype 入口名为 `brutalist-select-content`。
  - id: P-BRUTALIST-SELECT-CONTENT-TRANSITION
    text:
      en: >-
        The content configures its transition with `enterDuration: 150, leaveDuration: 100`. When entering/entered it applies `animate-in fade-in-0 zoom-in-95`; when open is false it applies `animate-out fade-out-0 zoom-out-95`. Side-based slide-in: `bottom` → `slide-in-from-top-2`, `top` → `slide-in-from-bottom-2`, `left` → `slide-in-from-right-2`, `right` → `slide-in-from-left-2`, only when open.


      zh-CN: >-
        content 将其 transition 配置为 `enterDuration: 150, leaveDuration: 100`。entering/entered 时应用 `animate-in fade-in-0 zoom-in-95`；open 为 false 时应用 `animate-out fade-out-0 zoom-out-95`。基于 side 的滑入：`bottom` → `slide-in-from-top-2`，`top` → `slide-in-from-bottom-2`，`left` → `slide-in-from-right-2`，`right` → `slide-in-from-left-2`，仅在 open 时生效。


  - id: P-BRUTALIST-SELECT-CONTENT-VISUAL-GRAMMAR
    text:
      en: >-
        The content uses BRUTALIST_PANEL_TOKENS: rounded-base (5px), border-2 border-black, bg-background/text-foreground, font-sans font-medium. This anchored popup has no hard shadow. Existing positioning, available-space bounds, padding, transition and focus ownership remain unchanged. Rounded children own their own radius; the parent must not globally zero or override child geometry.


      zh-CN: >-
        Content 使用 BRUTALIST_PANEL_TOKENS：rounded-base（5px）、border-2 border-black、bg-background/text-foreground、font-sans font-medium。anchored popup 无硬阴影；现有 positioning、可用空间边界、padding、transition 与 focus owner 不变。圆角 child 各自拥有 radius；父级不得全局清零或覆盖 child 几何。



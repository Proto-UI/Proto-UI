id: P-SHADCN-SELECT-TRIGGER
type: prototype
title: Shadcn Select Trigger inherits Base combobox behavior and adds size, styling, and chevron
status: draft
since: 0.2.0-rc.0
summary: Shadcn Select Trigger inherits Base combobox behavior and adds size, compatible default or opt-in ghost appearance, state-driven styling and a fixed chevron. Ghost is a Proto UI extension, not pinned-upstream parity.
statement:
  zh-CN: 'Shadcn Select Trigger 是 P-BASE-SELECT-TRIGGER 之上的 direct part，保留 combobox command/a11y、open request、placeholder 与 disabled behavior；增加 size: sm | default、appearance: default | ghost、继承状态的 visual feedback 与固定 chevron。default 对齐固定 upstream 的普通与 dark 外观；ghost 是 Proto UI 自有呈现扩展，不声称来自固定 upstream。asChild 仍不提供。'
  en: 'Shadcn Select Trigger is a direct part over P-BASE-SELECT-TRIGGER, retaining combobox command/accessibility, open request, placeholder and disabled behavior. It adds size: sm | default, appearance: default | ghost, state-derived visual feedback and a fixed chevron. Default matches the pinned ordinary and dark recipe; ghost is a Proto UI presentation extension, not pinned-upstream parity. asChild remains unavailable.'

criteria:
  - id: P-SHADCN-SELECT-TRIGGER-STYLE-PROFILES
    text:
      en: The earlier fixed recipes in this document describe the New York compatibility profile. Shared style selection additionally supports Rhea from shadcn/ui 3d98900e9b73c45f035f8109e9d41ba6a51685e7; the bounded profile and composition contract is P-SHADCN-SELECT-STYLE. This is not full upstream API, positioning or scroll-control parity.
  - id: P-SHADCN-SELECT-TRIGGER-UPSTREAM-IDENTITY
    text:
      {
        zh-CN: Trigger 必须沿用固定 Select revision/path 并明确其非官方 projection 身份。,
        en: Trigger must use the pinned Select revision and path and identify its unofficial projection status.,
      }
  - id: P-SHADCN-SELECT-TRIGGER-BASE-INHERITANCE
    text:
      {
        zh-CN: '`shadcn-select-trigger` 必须继承 `P-BASE-SELECT-TRIGGER` 并调用 `asSelectTrigger()`。',
        en: '`shadcn-select-trigger` must inherit `P-BASE-SELECT-TRIGGER` and call `asSelectTrigger()`.',
      }
    references:
      prototypes:
        - id: P-BASE-SELECT-TRIGGER
          anchors:
            [
              P-BASE-SELECT-TRIGGER-AUTHORING-ENTRIES,
              P-BASE-SELECT-TRIGGER-COMMAND,
              P-BASE-SELECT-TRIGGER-A11Y,
              P-BASE-SELECT-TRIGGER-REQUEST,
            ]
  - id: P-SHADCN-SELECT-TRIGGER-CURRENT-BASE-DEVIATIONS
    text:
      {
        zh-CN: 当前实现不反转 inherited command、a11y、request、disabled 或 no-selection guarantee；props、styles 与 renderer 是增量。,
        en: The current implementation reverses no inherited command,
        accessibility,
        request,
        disabled,
        or no-selection guarantee; props,
        styles,
        and renderer are deltas.,
      }
  - id: P-SHADCN-SELECT-TRIGGER-DIRECT-ENTRY
    text:
      {
        zh-CN: 当前 Trigger protocol 以 `shadcn-select-trigger` direct prototype 公开。,
        en: The current Trigger protocol is exposed as the `shadcn-select-trigger` direct prototype.,
      }
  - id: P-SHADCN-SELECT-TRIGGER-SIZE-PROP
    text:
      {
        zh-CN: size 提供 sm/default、默认 default，并分别投射 h-8/h-9。,
        en: Size provides sm and default with default as its default and projects h-8 and h-9 respectively.,
      }
  - id: P-SHADCN-SELECT-TRIGGER-CURRENT-VISUAL-SURFACE
    text:
      en: Both appearances retain w-fit, transition-[color,box-shadow], flex layout, rounded-md geometry, spacing, typography and outline policy. Default retains border-input and shadow-xs. Ghost uses border-transparent and shadow-none without changing the border-box dimensions.
      zh-CN: 两种外观保留 w-fit、transition-[color,box-shadow]、flex 布局、rounded-md 几何、间距、字体与 outline 规则。default 保留 border-input 与 shadow-xs；ghost 使用 border-transparent 与 shadow-none，不改变 border-box 尺寸。
  - id: P-SHADCN-SELECT-TRIGGER-STATE-DRIVEN-STYLES
    text:
      en: Placeholder, hover, focusVisible, pressed and disabled visuals derive only from inherited states. Default has no light hover fill or pressed displacement; dark colorScheme uses bg-input/30 and hovered bg-input/50. Ghost hover/press uses the bg-accent/text-accent-foreground pair without displacement. Both retain the visible focus ring and disabled opacity and cursor-not-allowed; changing appearance withdraws the previous appearance and motion tokens.
      zh-CN: placeholder、hover、focusVisible、pressed 与 disabled visuals 仅从继承状态派生。default 没有 light hover 填充或 pressed 位移；dark colorScheme 使用 bg-input/30，hover 时使用 bg-input/50；ghost hover/press 使用 bg-accent/text-accent-foreground 配对且无位移。二者保留清晰 focus ring 与 disabled opacity 与 cursor-not-allowed，切换 appearance 须撤回旧外观与位移 tokens。
  - id: P-SHADCN-SELECT-TRIGGER-CHEVRON
    text:
      {
        zh-CN: renderer 必须保留 slot content 并追加固定 16px、strokeWidth 2、muted foreground、不收缩且不接收 pointer 的 chevron-down SVG。,
        en: 'The renderer must preserve slot content and append a fixed 16px chevron-down SVG with strokeWidth 2, muted foreground, no shrinking and no pointer participation.',
      }
  - id: P-SHADCN-SELECT-TRIGGER-COMPATIBILITY-SUBSET
    text:
      en: Ghost is an intentional Proto UI presentation extension. Other differences beyond the cataloged behavior, size, surface and chevron remain centralized in the existing upstream-differences question.
      zh-CN: ghost 是有意的 Proto UI 呈现扩展；已收录 behavior、size、surface、chevron 之外的其余差异继续集中在既有 upstream-differences 问题中。
  - id: P-SHADCN-SELECT-TRIGGER-AS-CHILD-OMISSION
    text:
      {
        zh-CN: upstream Trigger props 中的 `asChild` 依共享决策省略；内部 Icon asChild 也不构成对外等价 API。,
        en: Upstream Trigger `asChild` is omitted under the shared decision; internal Icon asChild does not create an equivalent outward API.,
      }
    dependsOn: { decisions: [D-AS-CHILD-OMISSION-0001] }
  - id: P-SHADCN-SELECT-TRIGGER-APPEARANCE
    text:
      en: 'Public appearance is default | ghost and defaults to default. Default preserves the existing bordered input surface and shadow. Ghost is an additive Proto UI visual extension: transparent resting border/background, no resting shadow, inherited foreground, and existing size/chevron anatomy. Omission or removal restores default even during active interaction; no Base behavior or Content presentation changes.'
      zh-CN: 公开 appearance 为 default | ghost，缺省为 default。default 保留既有有框输入表面与阴影；ghost 是 Proto UI 自有视觉扩展：静止边框与背景透明、无静止阴影、继承前景，保留 size 与 chevron anatomy。缺省或移除即使在交互中也恢复 default，不改变 Base 行为或 Content 呈现。
  - id: P-SHADCN-SELECT-TRIGGER-FIELD-COMPOSITION
    text:
      en: The public fieldSelectTrigger entry invokes asFieldSelectTrigger once and reuses the standalone Trigger paint. Only the canonical optional Field binding supplies invalid, pending, policy and relationships; selection, focus, open requests and accepted truth remain with Base Select. Ordinary Trigger does not absorb a surrounding Field.
    dependsOn:
      contracts:
        - id: C-FIELD-SELECT-0001
          since: 0.3.0-alpha.1
openQuestions:
  - id: P-SHADCN-SELECT-TRIGGER-Q-UPSTREAM-DIFFERENCES
    question:
      {
        zh-CN: Trigger exact API/token 与 Icon composition parity 应如何收敛？,
        en: How should exact Trigger API,
        tokens,
        and Icon composition parity converge?,
      }
    context:
      zh-CN: intentional deviation 是省略对外 `asChild`。待核对项包括 w-fit、transition-[color,box-shadow]、disabled cursor、aria-invalid、dark styles、Value line-clamp 与 nested SVG rules、data-slot/data-size、className/native forwarding，以及官方 Radix Icon wrapper 相对直接 SVG。旧 `translate-y-px` pressed delta 已由当前 state-driven criteria 撤回；本问题不恢复该位移或 light default hover 填充。其余列出的 parity gaps 仍待评审。
      en: The intentional deviation is outward `asChild` omission. Gaps include w-fit, transition color and box-shadow, disabled cursor, aria-invalid, dark styles, Value line-clamp and nested-SVG rules, data-slot and data-size, forwarding, and upstream Radix Icon wrapper versus direct SVG. The earlier `translate-y-px` pressed delta is withdrawn by the current state-driven criteria; this question does not restore it or a light default hover fill. The other listed parity gaps still need review.
    blocks: [shadcn select trigger parity roadmap]

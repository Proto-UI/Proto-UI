id: P-SHADCN-SELECT-TRIGGER
type: prototype
title: Shadcn Select Trigger inherits Base combobox behavior and adds size, styling, and chevron
status: draft
since: 0.2.0-rc.0
summary: Shadcn Select Trigger inherits Base command, combobox accessibility, open request, placeholder, and disabled behavior and adds size, current state styles including a one-pixel press displacement, and a fixed chevron.
statement:
  zh-CN: >-
    Shadcn Select Trigger 是 `P-BASE-SELECT-TRIGGER` 之上的 direct part，保留 combobox command/a11y、open request、placeholder 与 disabled behavior，并增加 `size: sm | default`、包含 1px press displacement 的当前 visual feedback 和固定 chevron。`asChild` 明确不提供。


  en: >-
    Shadcn Select Trigger is a direct part over `P-BASE-SELECT-TRIGGER`. It retains combobox command and accessibility, open request, placeholder, and disabled behavior while adding `size: sm | default`, current visual feedback including a one-pixel press displacement, and a fixed chevron. `asChild` is explicitly unavailable.


criteria:
  - id: P-SHADCN-SELECT-TRIGGER-UPSTREAM-IDENTITY
    text:
      {
        zh-CN: Trigger 必须沿用固定 Select revision/path 并明确其非官方 projection 身份。,
        en: Trigger must use the pinned Select revision and path and identify its unofficial projection status.,
      }
  - id: P-SHADCN-SELECT-TRIGGER-BASE-INHERITANCE
    text:
      {
        zh-CN: '`shadcn-select-trigger` 必须继承 `P-BASE-SELECT-TRIGGER` 并调用 `asSelectTrigger()`。',
        en: '`shadcn-select-trigger` must inherit `P-BASE-SELECT-TRIGGER` and call `asSelectTrigger()`.',
      }
    references:
      prototypes:
        - id: P-BASE-SELECT-TRIGGER
          anchors:
            [
              P-BASE-SELECT-TRIGGER-AUTHORING-ENTRIES,
              P-BASE-SELECT-TRIGGER-COMMAND,
              P-BASE-SELECT-TRIGGER-A11Y,
              P-BASE-SELECT-TRIGGER-REQUEST,
            ]
  - id: P-SHADCN-SELECT-TRIGGER-CURRENT-BASE-DEVIATIONS
    text:
      {
        zh-CN: 当前实现不反转 inherited command、a11y、request、disabled 或 no-selection guarantee；props、styles 与 renderer 是增量。,
        en: The current implementation reverses no inherited command,
        accessibility,
        request,
        disabled,
        or no-selection guarantee; props,
        styles,
        and renderer are deltas.,
      }
  - id: P-SHADCN-SELECT-TRIGGER-DIRECT-ENTRY
    text:
      {
        zh-CN: 当前 Trigger protocol 以 `shadcn-select-trigger` direct prototype 公开。,
        en: The current Trigger protocol is exposed as the `shadcn-select-trigger` direct prototype.,
      }
  - id: P-SHADCN-SELECT-TRIGGER-SIZE-PROP
    text:
      {
        zh-CN: size 提供 sm/default、默认 default，并分别投射 h-8/h-9。,
        en: Size provides sm and default with default as its default and projects h-8 and h-9 respectively.,
      }
  - id: P-SHADCN-SELECT-TRIGGER-CURRENT-VISUAL-SURFACE
    text:
      {
        zh-CN: Trigger 必须提供当前 layout、border、background、spacing、typography、shadow、transition 与 outline tokens。,
        en: Trigger must provide the current layout,
        border,
        background,
        spacing,
        typography,
        shadow,
        transition,
        and outline tokens.,
      }
  - id: P-SHADCN-SELECT-TRIGGER-STATE-DRIVEN-STYLES
    text:
      {
        zh-CN: placeholder、hover、focusVisible、pressed 与 disabled visuals 必须从 inherited states 派生；pressed Rule 必须一同投射 `bg-input/70` 与 `translate-y-px`，让 Adapter 提供 1px 下压反馈。,
        en: Placeholder,
        hover,
        focusVisible,
        pressed,
        and disabled visuals must derive from inherited states; the pressed Rule must project `bg-input/70` and `translate-y-px` together so the Adapter provides one-pixel downward feedback.,
      }
  - id: P-SHADCN-SELECT-TRIGGER-CHEVRON
    text:
      {
        zh-CN: renderer 必须保留 slot content 并追加固定 16px、strokeWidth 2 的 chevron-down SVG。,
        en: The renderer must preserve slot content and append a fixed 16px chevron-down SVG with strokeWidth 2.,
      }
  - id: P-SHADCN-SELECT-TRIGGER-COMPATIBILITY-SUBSET
    text:
      {
        zh-CN: 当前 behavior/size/surface/chevron 之外的差异集中在唯一 open question。,
        en: Differences beyond current behavior,
        size,
        surface,
        and chevron are centralized in one open question.,
      }
  - id: P-SHADCN-SELECT-TRIGGER-AS-CHILD-OMISSION
    text:
      {
        zh-CN: upstream Trigger props 中的 `asChild` 依共享决策省略；内部 Icon asChild 也不构成对外等价 API。,
        en: Upstream Trigger `asChild` is omitted under the shared decision; internal Icon asChild does not create an equivalent outward API.,
      }
    dependsOn: { decisions: [D-AS-CHILD-OMISSION-0001] }
openQuestions:
  - id: P-SHADCN-SELECT-TRIGGER-Q-UPSTREAM-DIFFERENCES
    question:
      {
        zh-CN: Trigger exact API/token 与 Icon composition parity 应如何收敛？,
        en: How should exact Trigger API,
        tokens,
        and Icon composition parity converge?,
      }
    context:
      zh-CN: intentional deviation 是省略对外 `asChild`。待核对项包括 w-fit、transition-[color,box-shadow]、disabled cursor、aria-invalid、dark styles、Value line-clamp 与 nested SVG rules、data-slot/data-size、className/native forwarding，以及官方 Radix Icon wrapper 相对直接 SVG。当前额外 hover surface，以及本项目采用的 `translate-y-px` pressed delta 在未来 parity 收敛中是否保留，仍需评审；两者均不声称来自固定 upstream baseline。
      en: The intentional deviation is outward `asChild` omission. Gaps include w-fit, transition color and box-shadow, disabled cursor, aria-invalid, dark styles, Value line-clamp and nested-SVG rules, data-slot and data-size, forwarding, and upstream Radix Icon wrapper versus direct SVG. The current extra hover surface and whether the project-adopted `translate-y-px` pressed delta should remain during future parity convergence still need review; neither is claimed to come from the pinned upstream baseline.
    blocks: [shadcn select trigger parity roadmap]
sources:
  - path: packages/prototypes/shadcn/src/select/trigger.proto.ts
  - path: packages/prototypes/shadcn/test/select.test.ts

id: P-BOOTSTRAP-2-3-2-PROGRESS
type: prototype
title: Bootstrap 2.3.2 Progress projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Draft catalog relation for an implemented family projection against the pinned Bootstrap 2.3.2 vocabulary. Stable admission requires real consumers, browser/native evidence and independent review; source presence and private package availability are not release or conformance admission.
summary: Bootstrap Progress family over P-BASE-PROGRESS with pinned vocabulary.
statement:
  en: "Each real family part consumes its matching Base hook once and preserves its owner, modules and render. Root/Label/Track/Indicator/Value retain Base progress/range ownership and pin static gradient/shadow recipes. Determinate and indeterminate remain content information. The Indicator declares typed width motion at 600ms with CSS ease through the shared resident-motion contract, taking its target from Base's exposed percentage or the indeterminate width token. Source Web uses an explicit containing-block basis and active-only width lease. The optional 2s moving stripe choreography still requires a neutral repeating-motion capability and public variant authority; static paint does not satisfy that separate criterion."
criteria:
  - id: P-BOOTSTRAP-2-3-2-PROGRESS-BASE
    text:
      en: Invoke asProgress* hooks() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias, jQuery/plugin API or Base.setup call.
  - id: P-BOOTSTRAP-2-3-2-PROGRESS-VISUAL
    text:
      en: "Root/Label/Track/Indicator/Value retain Base progress/range ownership and pin static gradient/shadow recipes. Determinate and indeterminate remain content information. The Indicator declares typed width motion at 600ms with CSS ease through the shared resident-motion contract, taking its target from Base's exposed percentage or the indeterminate width token. Source Web uses an explicit containing-block basis and active-only width lease. The optional 2s moving stripe choreography still requires a neutral repeating-motion capability and public variant authority; static paint does not satisfy that separate criterion."
  - id: P-BOOTSTRAP-2-3-2-PROGRESS-WIDTH
    text:
      en: The Indicator's resident width declaration uses 600ms and cubic-bezier(0.25,0.1,0.25,1), with Base's current percentage or the indeterminate fraction as its sole final target. Numeric source updates, interruption and preference/visibility settlement preserve Base's value, range, status and accessibility facts. Width source/host tests do not establish the separate stripe or native/Compiler criteria.
  - id: P-BOOTSTRAP-2-3-2-PROGRESS-CLOSURE
    text:
      en: All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, Glyphicons, upstream JavaScript or Adapter component-name dispatch may supply default intent.
  - id: P-BOOTSTRAP-2-3-2-PROGRESS-BOUNDARY
    text:
      en: Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; the package is private and source-only. Catalog presence is a draft relation, not acceptance.
dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
    - C-FEEDBACK-RESIDENT-MOTION-0001
inherits:
  prototypes:
    - P-BASE-PROGRESS
verifies:
  tests:
    - T-BOOTSTRAP-2-3-2-HISTORICAL-OVERLAYS-0001
    - T-FEEDBACK-RESIDENT-MOTION-0001
sources:

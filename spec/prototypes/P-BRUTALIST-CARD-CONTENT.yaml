id: P-BRUTALIST-CARD-CONTENT
type: prototype
title: Brutalist Card Content styled region
status: draft
since: 0.2.0-rc.7
summary: Direct Card content region with horizontal spacing grammar.
statement:
  en: Brutalist Card Content is a styled-only region that accepts ordinary content and independently semantic child prototypes.
  zh-CN: Brutalist Card Content 是接纳普通内容与拥有独立语义的 child prototype 的 styled-only 区域。
criteria:
  - id: P-BRUTALIST-CARD-CONTENT-VISUAL
    text:
      en: Content directly owns horizontal padding and does not absorb the role, focus, activation, or selection behavior of nested Button, Link, or other children.
      zh-CN: Content 直接拥有水平 padding，不吸收嵌套 Button、Link 或其他 child 的 role、focus、activation 或 selection 行为。

id: P-BRUTALIST-DROPDOWN-MENU-ITEM
type: prototype
title: Brutalist Dropdown Menu Item inherits Base menu item behavior and layers pair-invariant active styling
status: draft
since: 0.2.0-rc.7
summary: >-
  Brutalist Dropdown Menu Item inherits Base menu item semantics and projects a style-family visual API: an `inset` boolean, a `default | destructive` variant enum, and explicit paired fills for default-active, destructive-active, destructive-resting, and disabled states (never opacity-only).


statement:
  en: >-
    Brutalist Dropdown Menu Item is a draft Proto UI-maintained Neo-Brutalist design-language projection over Base Dropdown Menu Item. It preserves inherited Base protocol semantics (active/focused/focusVisible/pressed/disabled navigation states) and adds only visual/style behavior: an `inset` left-pad boolean, a `default | destructive` variant enum, and explicit fill+foreground pairs for each interactive branch so no row is ever a blank white panel with un-paired text.


  zh-CN: >-
    Brutalist Dropdown Menu Item 是 Proto UI 维护的 draft Neo-Brutalist design-language 投射，建立在 Base Dropdown Menu Item 之上。它保留继承的 Base 协议语义（active/focused/focusVisible/pressed/disabled 导航状态），仅增加视觉/style 行为：`inset` 左内边距布尔、`default | destructive` variant 枚举，以及每个交互分支的显式填充+前景色对，使任何行都不会沦为白色空白面板配未配对文本。


criteria:
  - id: P-BRUTALIST-DROPDOWN-MENU-ITEM-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Dropdown Menu Item through `asDropdownItem()` once and must not redefine Base active, focused, focus-visible, pressed, or disabled protocol semantics. Visual projection may only consume the projected state handles (`active`, `focused`, `focusVisible`, `pressed`, `disabled`).


      zh-CN: >-
        该 prototype 必须通过 `asDropdownItem()` 一次性继承 Base Dropdown Menu Item，不得重定义 Base 的 active、focused、focus-visible、pressed 或 disabled 协议语义；视觉投射只能消费投影出的 state handles（`active`、`focused`、`focusVisible`、`pressed`、`disabled`）。


  - id: P-BRUTALIST-DROPDOWN-MENU-ITEM-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-dropdown-item` and is the only public Dropdown Menu Item entry in this foundation slice.
      zh-CN: 直接 prototype 入口名为 `brutalist-dropdown-item`，且是本 foundation 切片中唯一公开的 Dropdown Menu Item 入口。
  - id: P-BRUTALIST-DROPDOWN-MENU-ITEM-PROPS
    text:
      en: >-
        Public item props are: `inset` boolean with default `false`; `variant` enum `default | destructive` with default `default`. `inset: true` applies `pl-8` left padding (the row's left edge indents to align with group-label rows).


      zh-CN: >-
        公开 item props 为：`inset` 布尔，默认 `false`；`variant` 枚举 `default | destructive`，默认 `default`。`inset: true` 应用 `pl-8` 左内边距（行的左边缘缩进以对齐 group-label 行）。


  - id: P-BRUTALIST-DROPDOWN-MENU-ITEM-DEFAULTS
    text:
      en: >-
        When `inset` or `variant` are omitted or removed after mount, the prototype must restore `false` and `default` respectively.


      zh-CN: >-
        当 `inset` 或 `variant` 缺省或在挂载后被移除时，prototype 必须分别恢复为 `false` 与 `default`。


  - id: P-BRUTALIST-DROPDOWN-MENU-ITEM-PAIR-INVARIANT
    text:
      en: >-
        Every interactive branch must co-select an explicit fill+foreground pair, never opacity-only. The base resting row uses `bg-secondary-background` with `text-foreground`. Default variant under any of `active | focused | focusVisible | pressed` uses `bg-main` with `text-main-foreground`. Destructive variant resting uses `text-destructive-ink` (paper base retained), a theme-relative ink rather than the `destructive` fill, which is unreadable on the Light paper row; destructive variant under any of `active | focused | focusVisible | pressed` uses `bg-destructive` with `text-destructive-foreground`. Disabled uses `bg-secondary-background` with `text-muted-foreground` (plus `pointer-events-none`). No rule may replace a branch's foreground with a theme-global text token independently of its background.


      zh-CN: >-
        每个交互分支都必须同时选择显式填充+前景色对，绝不只改不透明度。基础静止行使用 `bg-secondary-background` 配 `text-foreground`。default variant 在 `active | focused | focusVisible | pressed` 任一状态下使用 `bg-main` 配 `text-main-foreground`。destructive variant 静止使用 `text-destructive-ink`（保留纸面底），即随主题变化的墨色而非 `destructive` 填充色，后者在 Light 纸面行上无法阅读；destructive variant 在 `active | focused | focusVisible | pressed` 任一状态下使用 `bg-destructive` 配 `text-destructive-foreground`。disabled 使用 `bg-secondary-background` 配 `text-muted-foreground`（外加 `pointer-events-none`）。任何规则都不得在脱离背景的情况下用主题全局文本 token 覆盖某分支前景。


  - id: P-BRUTALIST-DROPDOWN-MENU-ITEM-INTERACTION
    text:
      en: >-
        Disabled rows apply `pointer-events-none` and swap to the muted-foreground paper pair (preserving geometry). Active pointer-enter (while the menu is open), keyboard focus, focus-visible, and press all drive the per-variant active pair described in the PAIR-INVARIANT criterion; no separate transition animation is projected by the item.


      zh-CN: >-
        disabled 行应用 `pointer-events-none` 并切换到 muted-foreground 纸面色对（保留几何）。菜单打开期间的 active pointer-enter、键盘 focus、focus-visible 与 press 都驱动 PAIR-INVARIANT 准则所述的按 variant 的 active 色对；item 自身不投射单独的过渡动画。



revisions:
  - version: 0.3.0-alpha.0
    change: amended
    summary: >-
      Destructive resting rows now cite `text-destructive-ink` instead of the `destructive` fill. Measured on the Light paper row the fill gave 1.41:1, below the 4.5:1 body-text floor; the ink gives 8.02:1. Dark is unchanged at 10.73:1 because the ink resolves there to the value the row already painted.


  - version: 0.2.0-rc.7
    change: introduced
    summary: >-
      Introduced draft Brutalist Dropdown Menu Item projection with real public-API criteria (Base inheritance, entry, inset+variant props, defaults, explicit per-branch pair invariant, interaction) on the rc.7 release train. Not present in the immutable rc.6 snapshot.



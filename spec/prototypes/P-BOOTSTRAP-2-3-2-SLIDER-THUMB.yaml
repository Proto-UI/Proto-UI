id: P-BOOTSTRAP-2-3-2-SLIDER-THUMB
type: prototype
title: Bootstrap 2.3.2 Slider Thumb projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: >-
    Draft catalog relation for an implemented family projection against the pinned Bootstrap 2.3.2 vocabulary. Stable admission requires real consumers, browser/native evidence and independent review; source presence and private package availability are not release or conformance admission.


summary: Scalar Slider Thumb deriving accepted pointer facts from its Root.
statement:
  en: >-
    The Prototype invokes asSliderThumb() once, borrowing Root focus and deriving accepted pointer, value and percentage facts. Family thumb paint uses the private thumb-visual recipe; no second value, input or event owner.


criteria:
  - id: P-BOOTSTRAP-2-3-2-SLIDER-THUMB-BASE
    text:
      en: >-
        Invoke asSliderThumb() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias, jQuery/plugin API or Base.setup call.


  - id: P-BOOTSTRAP-2-3-2-SLIDER-THUMB-VISUAL
    text:
      en: >-
        Thumb projects the thumb-visual recipe over inherited facts; general focused facts are not transported and no focused-only paint is claimed.


  - id: P-BOOTSTRAP-2-3-2-SLIDER-THUMB-CLOSURE
    text:
      en: >-
        All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, Glyphicons, upstream JavaScript or Adapter component-name dispatch may supply default intent.


  - id: P-BOOTSTRAP-2-3-2-SLIDER-THUMB-BOUNDARY
    text:
      en: >-
        Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; the package is private and source-only. Catalog presence is a draft relation, not acceptance.



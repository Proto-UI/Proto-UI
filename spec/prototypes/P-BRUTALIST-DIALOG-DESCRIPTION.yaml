id: P-BRUTALIST-DIALOG-DESCRIPTION
type: prototype
title: 'Brutalist Dialog Description inherits Base description relations and layers sans description typography'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Dialog Description inherits Base Dialog Description relations and projects sans small description typography with flat foreground. The projection is limited to Base inheritance, the direct entry, and description typography styling.'

statement:
  en: P-BRUTALIST-DIALOG-DESCRIPTION preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-DIALOG-DESCRIPTION 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-DIALOG-DESCRIPTION-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Dialog Description through `asDialogDescription()` once and must not redefine Base description relation protocol semantics. Visual projection may only consume the projected state handles.


      zh-CN: >-
        该 prototype 必须通过 `asDialogDescription()` 一次性继承 Base Dialog Description，不得重定义 Base 的 description 关系协议语义；视觉投射只能消费投影出的 state handles。


  - id: P-BRUTALIST-DIALOG-DESCRIPTION-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-dialog-description`.
      zh-CN: 直接 prototype 入口名为 `brutalist-dialog-description`。
  - id: P-BRUTALIST-DIALOG-DESCRIPTION-VISUAL-GRAMMAR
    text:
      en: >-
        Description uses font-sans font-medium text-sm text-foreground: DM Sans 14px/20px, weight 500 and authored casing, with no frame, shadow or independent fill.


      zh-CN: >-
        Description 使用 font-sans font-medium text-sm text-foreground：DM Sans 14px/20px、500 与作者大小写，不增加 frame、shadow 或独立 fill。


sources:
  - path: docs/superpowers/specs/2026-10-03-neobrutalism-source-aligned-design.md
  - path: packages/prototypes/brutalist/src/dialog/description.proto.ts
  - path: packages/prototypes/brutalist/test/dialog.test.ts
relates:
  knowledge: [K-BRUTALIST-0001]
dependsOn:
  contracts: [C-CORE-SYNTAX-0003, C-AS-HOOK-0001, C-RULE-INTENT-FEEDBACK-STYLE-0001]
inherits:
  prototypes:
    - id: P-BASE-DIALOG-DESCRIPTION
verifies: { tests: [T-BRUTALIST-DIALOG-0001] }
revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Aligned draft visual grammar with neobrutalism-components 3306a802; preserved Base semantics and documented Proto UI extensions.
  - version: 0.2.0-rc.7
    change: introduced
    summary: >-
      Introduced draft Brutalist Dialog Description projection with real public-API criteria (Base inheritance, direct entry, mono description typography visual grammar) on rc.7. Not present in immutable rc.6.


tags: [prototype, brutalist, neo-brutalist, visual, delta, dialog]

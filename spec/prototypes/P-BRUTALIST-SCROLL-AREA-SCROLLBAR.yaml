verifies: { tests: [T-BRUTALIST-SCROLL-AREA-0001] }
revisions:
  - version: 0.2.0-rc.7
    change: revised
    summary: Kept horizontal track flow on the inline axis for host-projected Thumb geometry.
  - version: 0.2.0-rc.7
    change: revised
    summary: Positioned directional tracks against Root so composed chrome remains visible without entering Viewport flow.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Cataloged the lavender directional track visual delta without expanding scroll ownership.
tags: [prototype, brutalist, scroll-area, scrollbar, visual, delta]

id: P-BOOTSTRAP-2-3-2-CHECKBOX-INDICATOR
type: prototype
title: bootstrap-2-3-2 checkbox indicator over Base
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: Draft all-Base coverage increment. Source/unit availability is not release, browser paint, Compiler or native conformance admission.
summary: A genuine asCheckboxIndicator projection; Base retains checkbox semantics and this part contributes only appearance.
statement:
  en: The authored Prototype invokes asCheckboxIndicator once. An independently authored 14px line glyph chooses mixed before checked and omits the glyph when unchecked. It is aria-hidden, pointer-transparent, and does not copy Glyphicons.
criteria:
  - id: P-BOOTSTRAP-2-3-2-CHECKBOX-INDICATOR-BASE
    text:
      en: Invoke asCheckboxIndicator once and retain every inherited state, event, focus, editing, context and anatomy owner; never copy the semantic implementation or introduce a competing value owner.
  - id: P-BOOTSTRAP-2-3-2-CHECKBOX-INDICATOR-API
    text:
      en: The indicator derives checked and indeterminate from the nearest same-domain Base Checkbox root; it owns no value props, activation, outward change signal or focus target.
  - id: P-BOOTSTRAP-2-3-2-CHECKBOX-INDICATOR-VISUAL
    text:
      en: An independently authored 14px line glyph chooses mixed before checked and omits the glyph when unchecked. It is aria-hidden, pointer-transparent, and does not copy Glyphicons.
  - id: P-BOOTSTRAP-2-3-2-CHECKBOX-INDICATOR-CLOSURE
    text:
      en: All component appearance is declared by Prototype feedback and Rules and closes through the source-derived finite physical token renderer. No website-only component CSS may supply missing default intent.
  - id: P-BOOTSTRAP-2-3-2-CHECKBOX-INDICATOR-BOUNDARY
    text:
      en: The package is private and unreleased. Documentation and demos expose the real parts. Actual four-Web browser rendering, general Compiler and GPUI/Flutter/Qt conformance need separate collected evidence; source availability alone is insufficient.

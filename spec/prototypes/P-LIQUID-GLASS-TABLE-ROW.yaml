  - path: packages/prototypes/liquid-glass/src/table/index.ts
  - path: https://developer.apple.com/design/human-interface-guidelines/materials
    label: Apple HIG Materials design reference only
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Liquid Glass Table Row passive Table projection cataloged as a draft family projection over the implemented source slice.
tags:

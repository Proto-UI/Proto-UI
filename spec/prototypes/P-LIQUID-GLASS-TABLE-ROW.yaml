id: P-LIQUID-GLASS-TABLE-ROW
type: prototype
title: Liquid Glass Table Row passive Table projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native and material-host evidence plus independent review; source presence, private package availability and intent frames are not release, conformance or Apple-equivalence admission.
summary: Liquid Glass passive Table part over the exact P-BASE-TABLE-ROW definition.
statement:
  en: 'The Prototype composes the exact Base table-row prototype through the private public defineAsHook({...exactBasePrototype, name}) wrapper pattern demonstrated by base/src/data-table/header-row.proto.ts, preserving modules, render and Table Structure ownership while adding family paint.'
criteria:
  - id: P-LIQUID-GLASS-TABLE-ROW-BASE
    text:
      en: Compose the exact Base prototype once through the private asLiquidGlassTableRow wrapper and preserve every inherited owner, module, render result, props/exposes and lifecycle; the wrapper is family-private and not a public hook substitute.
  - id: P-LIQUID-GLASS-TABLE-ROW-VISUAL
    text:
      en: 'Row carries family cell typography and row separation only; row state stays Base-owned. No material owner is added. Exact functional material clauses are provisional: real provider capability, missing-host opaque fallback and bounded source leases stay governed by the shared V2 material contract.'
  - id: P-LIQUID-GLASS-TABLE-ROW-EXTENSION
    text:
      en: "The family adopts admitted finite table/table-row/table-cell/table-caption display, collapsed zero-spacing Table geometry and top-aligned cells while preserving the authored leading Caption. This is ordinary nonmaterial content, not a grid substitute or raw host escape. Actual native layout, visual spans, assistive technology, non-Web hosts and Compiler evidence remain open; source token availability does not prove them."
  - id: P-LIQUID-GLASS-TABLE-ROW-CLOSURE
    text:
      en: All family appearance is authored through feedback tokens, typed material intent and Rules with explicit finite physical translation; no website-only CSS, private Apple asset or Adapter component-name dispatch may supply default intent, and explicit liquid-glass intent is never silently replaced by adaptive native blur.
  - id: P-LIQUID-GLASS-TABLE-ROW-BOUNDARY
    text:
      en: Exact-head browser, native, material-provider and Compiler evidence plus independent review remain open; the package is private and source-only. Apple documentation is a design reference, not implementation, asset or equivalence evidence. Catalog presence is a draft relation, not acceptance.
dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
    - C-PROTOTYPE-STYLE-CLOSURE-0001
inherits:
  prototypes:
    - P-BASE-TABLE-ROW
verifies:
  tests:
    - T-LIQUID-GLASS-DRAFT-PASSIVE-0001
sources:

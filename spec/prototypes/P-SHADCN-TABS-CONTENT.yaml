id: P-SHADCN-TABS-CONTENT
type: prototype
title: Shadcn Tabs Content inherits Base Tabs Content and projects the pinned v4
  panel surface
status: draft
since: 0.2.0-rc.0
summary: Inherits Base behavior and projects the bounded text-only default
  surface for New York v4, Nova and Rhea through shared style scope.
statement:
  en: This draft projects only the text-only default surface of fixed upstream
    3d98900e9b73c45f035f8109e9d41ba6a51685e7 for New York v4, Nova and Rhea,
    preserving Base ownership and shared style-scope precedence. Both
    orientations and light/dark interaction paint are covered where relevant to
    this part. It is not complete Tabs or all-style parity. Existing Proto
    underline remains a separate compatibility appearance, never an alias for
    upstream line.
criteria:
  - id: P-SHADCN-TABS-CONTENT-UPSTREAM-IDENTITY
    text:
      zh-CN: Content 必须沿用固定 Shadcn Tabs revision/path，并明确为 Proto UI 治理的非官方 anatomy
        projection。
      en: Content must use the pinned Shadcn Tabs revision and path and identify
        itself as an unofficial Proto UI-governed anatomy projection.
  - id: P-SHADCN-TABS-CONTENT-BASE-INHERITANCE
    text:
      zh-CN: "`shadcn-tabs-content` 必须继承 `P-BASE-TABS-CONTENT` 并调用
        `asTabsContent()`；任何 setup-only 负向补丁必须显式声明。"
      en: "`shadcn-tabs-content` must inherit `P-BASE-TABS-CONTENT` and call
        `asTabsContent()`; any setup-only negative patch must be declared
        explicitly."
    references:
      prototypes:
        - id: P-BASE-TABS-CONTENT
          anchors:
            - P-BASE-TABS-CONTENT-AUTHORING-ENTRIES
            - P-BASE-TABS-CONTENT-ROLE-PANEL
            - P-BASE-TABS-CONTENT-CURRENT-DERIVED
  - id: P-SHADCN-TABS-CONTENT-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不反转 inherited context、current/hidden、presence 或 a11y guarantee；新增
        style 与 hidden rule 仅构成呈现增量。
      en: The current implementation reverses no inherited context, current or hidden
        state, presence, or accessibility guarantee; added style and hidden
        rules are presentation deltas only.
  - id: P-SHADCN-TABS-CONTENT-DIRECT-ENTRY
    text:
      zh-CN: 当前 Content protocol 以 `shadcn-tabs-content` direct prototype 公开。
      en: The current Content protocol is exposed as the `shadcn-tabs-content` direct
        prototype.
  - id: P-SHADCN-TABS-CONTENT-CURRENT-VISUAL-SURFACE
    text:
      en: "The source-bound text/default surface is described by the dedicated Tabs
        coverage inventory: New York compatibility dimensions plus Nova/Rhea
        recipes, Base-derived horizontal/vertical layout, and existing
        feedback.style semantic merging. Only the declared bounded surface is
        projected; it does not imply line, SVG, arbitrary native props, or
        other-style support."
  - id: P-SHADCN-TABS-CONTENT-HIDDEN-PROJECTION
    text:
      zh-CN: hidden visual rule 必须从 inherited hidden state 派生，且不得替代 Base Content 的
        presence policy 或 host hidden projection。
      en: The hidden visual rule must derive from inherited hidden state and must not
        replace Base Content presence policy or host hidden projection.
    references:
      prototypes:
        - id: P-BASE-TABS-CONTENT
          anchors:
            - P-BASE-TABS-CONTENT-CURRENT-DERIVED
            - P-BASE-TABS-CONTENT-HIDDEN-WHEN-INACTIVE
            - P-BASE-TABS-CONTENT-PRESENCE-POLICY
  - id: P-SHADCN-TABS-CONTENT-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前实体只声明已测试的 inherited panel behavior 与视觉 surface；固定 baseline 的全部差异集中维护在唯一
        compatibility open question。
      en: This entity claims only tested inherited panel behavior and visual surface;
        every difference from the pinned baseline is maintained in one
        compatibility open question.
  - id: P-SHADCN-TABS-CONTENT-AS-CHILD-OMISSION
    text:
      zh-CN: upstream Content props 中的 `asChild` 依共享决策有意省略。
      en: The `asChild` member of upstream Content props is intentionally omitted
        under the shared decision.
    dependsOn:
      decisions:
        - D-AS-CHILD-OMISSION-0001
  - id: P-SHADCN-TABS-CONTENT-STYLE-SCOPE
    text:
      en: "Shared style selection preserves the actual Base owner, value, focus, handles and caller nodes while switching among New York and the eight modern profiles. Explicit leaf selection overrides scope; absence preserves the component compatibility default. Unknown profiles fail closed rather than borrowing another recipe."
  - id: P-SHADCN-TABS-CONTENT-SOURCE-BOUND-TEXT-DEFAULT
    text:
      en: "The fixed inventory is eight modern styles (vega, nova, maia, lyra, mira, luma, sera, rhea) plus independent New York. Each has source-distinct default and line paint; List variant changes update an owned decorative line without replacing Trigger leaves, caller content, Base selection or focus. Content and the optional semantic-only Indicator gain no selection owner. Proto appearance=underline remains separate. Nested SVG/inline-glyph selector parity, full API and native/cross-adapter acceptance remain open."
openQuestions:
  - id: P-SHADCN-TABS-CONTENT-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: Content 的 presence API、host projection 与 upstream visual parity 应如何收敛？
      en: How should Content presence API, host projection, and upstream visual parity
        converge?
    context:
      en: "The nine source-distinct default/line recipes and live owned line decoration have authored consumer cases, not exact-head execution or native acceptance. Remaining gaps include nested SVG/inline-glyph sizing and placement, className/native forwarding, upstream data-slot/state correspondence, all-adapter paint, motion, assistive technology and independent review. Scope changes must preserve Base owners, live caller nodes and controlled refusal."
    blocks:
      - shadcn tabs content parity roadmap

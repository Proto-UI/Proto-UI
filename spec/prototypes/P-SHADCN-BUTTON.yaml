revisions:
  - version: 0.2.0-rc.0
    change: introduced
    summary: Introduced the delta-style Shadcn Button catalog template with reversible Base inheritance, pinned upstream identity, current visual API guarantees, intentional asChild omission, and centralized compatibility differences.
  - version: 0.3.0-alpha.0
    change: revised
    summary: Distinguished the pinned historical compatibility baseline from the later intentionally adopted destructive visual recipe and retained contrast as adopted-upstream evidence.

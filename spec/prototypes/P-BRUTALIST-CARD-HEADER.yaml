id: P-BRUTALIST-CARD-HEADER
type: prototype
title: 'Brutalist Card Header styled region'

status: draft
since: 0.2.0-rc.7
summary: 'Direct Card header region with layout and lower separator grammar.'

statement:
  en: P-BRUTALIST-CARD-HEADER preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-CARD-HEADER 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-CARD-HEADER-VISUAL
    text:
      en: >-
        HEADER directly owns flex alignment, spacing and horizontal padding, without a mandatory section border, shadow or radius. Composed content and controls retain their semantics.


      zh-CN: >-
        HEADER 直接拥有 flex 对齐、间距与水平 padding，不强制分段 border、shadow 或 radius；组合内容与 control 保留自身语义。


sources:

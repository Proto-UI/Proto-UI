id: P-BRUTALIST-SELECT-TRIGGER
type: prototype
title: 'Brutalist Select Trigger inherits Base and projects a rounded main-filled surface with explicit elevation'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Select Trigger retains Base state and chevron anatomy while projecting a 5px rounded main-filled control, DM Sans 500, a flat default with explicit elevated appearance, and a readable paired-ink placeholder in both themes.'

statement:
  en: P-BRUTALIST-SELECT-TRIGGER preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-SELECT-TRIGGER 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-SELECT-TRIGGER-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Select Trigger through `asSelectTrigger()` once and must not redefine Base open, disabled, hovered, focusVisible, pressed, or placeholder protocol semantics. Visual projection may only consume the projected state handles.


      zh-CN: >-
        该 prototype 必须通过 `asSelectTrigger()` 一次性继承 Base Select Trigger，不得重定义 Base 的 open、disabled、hovered、focusVisible、pressed 或 placeholder 协议语义；视觉投射只能消费投影出的 state handles。


  - id: P-BRUTALIST-SELECT-TRIGGER-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-select-trigger`.
      zh-CN: 直接 prototype 入口名为 `brutalist-select-trigger`。
  - id: P-BRUTALIST-SELECT-TRIGGER-SIZE-PROP
    text:
      en: >-
        Public `size` is the enum `sm | default` with default `default`. `default` maps to `h-9`; `sm` maps to `h-8`. There is no `lg` or `icon` size for Select Trigger.


      zh-CN: >-
        公开 `size` 为枚举 `sm | default`，默认 `default`。`default` 对应 `h-9`；`sm` 对应 `h-8`。Select Trigger 不提供 `lg` 或 `icon` 尺寸。


  - id: P-BRUTALIST-SELECT-TRIGGER-DEFAULTS
    text:
      en: >-
        When `size` is omitted or removed after mount, the prototype must restore `default`. Omitted or removed `appearance` restores `flat`, withdrawing elevation and movement tokens even after interaction.


      zh-CN: >-
        当 `size` 缺省或在挂载后被移除时，prototype 必须恢复为 `default`。`appearance` 缺省或移除时恢复 `flat`，即使已发生交互也须撤回 elevation 与位移 tokens。


  - id: P-BRUTALIST-SELECT-TRIGGER-PLACEHOLDER-STATE
    text:
      en: >-
        When the placeholder state is active, the trigger text shifts to `text-main-foreground`; when a committed value is present the trigger renders the value text with normal foreground.


      zh-CN: >-
        当 placeholder 状态激活时，trigger 文本切换为 `text-main-foreground`；当存在已提交值时，trigger 以正常前景渲染该值文本。


  - id: P-BRUTALIST-SELECT-TRIGGER-CHEVRON
    text:
      en: >-
        The trigger renders a trailing chevron icon (a 16×16 SVG path `m6 9 6 6 6-6`) after its slot, with `pointer-events-none` so the icon never captures pointer interaction.


      zh-CN: >-
        trigger 在其 slot 之后渲染尾部 chevron 图标（16×16 SVG 路径 `m6 9 6 6 6-6`），并设置 `pointer-events-none`，使图标永不捕获指针交互。


  - id: P-BRUTALIST-SELECT-TRIGGER-INTERACTION
    text:
      en: >-
        In the default `flat` appearance, hover and press retain the flat black frame without translation or elevation. Focus-visible retains the ring and offset; disabled retains opacity and pointer gate. Placeholder keeps the main fill's paired ink, with at least 4.5:1 text contrast in both themes; neutral muted ink must not be placed on the blue main fill.


      zh-CN: >-
        默认 `flat` appearance 的 hover 与 press 保持 flat 黑边，无位移或 elevation；focus-visible 保留 ring 与 offset，disabled 保留 opacity 与 pointer gate；placeholder 保留 main fill 的配对 ink，两个主题的文本对比度均至少 4.5:1；不得把中性 muted ink 放在蓝色 main fill 上。


  - id: P-BRUTALIST-SELECT-TRIGGER-VISUAL-GRAMMAR
    text:
      en: >-
        By default, Trigger projects rounded-base 5px, border-2 border-black, bg-main/text-main-foreground, font-sans font-medium text-sm, px-3 py-2 and no shadow or translation. Existing sm/default heights and chevron anatomy remain unchanged.


      zh-CN: >-
        默认 Trigger 投射 rounded-base 5px、border-2 border-black、bg-main/text-main-foreground、font-sans font-medium text-sm、px-3 py-2，无 shadow 或 translation；现有 sm/default 高度与 chevron anatomy 不变。


  - id: P-BRUTALIST-SELECT-TRIGGER-APPEARANCE
    text:
      en: >-
        Public `appearance` is `flat | elevated`, default `flat`. The explicit `elevated` Proto UI extension keeps the same fill, paired ink, 5px radius, 2px border, DM Sans 500, size, chevron, Base state and focus/disabled semantics. At rest it adds a hard black 4px/4px shadow; inherited hover or press translates +4px/+4px and removes that shadow, matching the canonical Button feedback. It changes only Trigger presentation: Select Content and other popup surfaces remain flat, and consumers must select this prop rather than recreate elevation in page CSS.


      zh-CN: >-
        公开 `appearance` 为 `flat | elevated`，默认 `flat`。显式 `elevated` 是 Proto UI 扩展，保留相同 fill、配对 ink、5px radius、2px border、DM Sans 500、size、chevron、Base state 及焦点/disabled 语义。静止态增加黑色 4px/4px 硬影；继承的 hover 或 press 位移 +4px/+4px 并去除硬影，与 canonical Button feedback 一致。它仅改变 Trigger 呈现：Select Content 与其它 popup 保持 flat，consumer 必须选择此 prop，不得用页面 CSS 重造 elevation。



id: P-SHADCN-TABLE-CELL
type: prototype
title: Shadcn Table Cell passive Table projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: >-
    Draft catalog relation for an implemented family projection. Stable admission requires real consumers, browser/native evidence and independent review; source presence is not conformance or release admission.


summary: Shadcn passive Table part over the exact P-BASE-TABLE-CELL definition with pinned profile recipes.
statement:
  en: >-
    The Prototype composes the exact Base table-cell prototype through the public defineAsHook pattern demonstrated by base/src/data-table/header-row.proto.ts, preserving modules, render and Table Structure ownership while adding family paint. It is a real implemented projection, not an alias for the interactive Data Table family.


criteria:
  - id: P-SHADCN-TABLE-CELL-BASE
    text:
      en: >-
        Compose the exact Base tableCell prototype once through the public defineAsHook({...baseTableCell, name}) pattern and and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias or Base.setup call.


  - id: P-SHADCN-TABLE-CELL-VISUAL
    text:
      en: >-
        Cell projects profile padding, foreground and alignment only; spans and content remain authored.


  - id: P-SHADCN-TABLE-CELL-CLOSURE
    text:
      en: >-
        All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, raw host escape or Adapter component-name dispatch may supply default intent.


  - id: P-SHADCN-TABLE-CELL-BOUNDARY
    text:
      en: >-
        Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; catalog presence is a draft relation, not acceptance.



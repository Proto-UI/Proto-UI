id: P-BOOTSTRAP-2-3-2-MESSAGE-SCROLLER
type: prototype
title: Bootstrap 2.3.2 Message Scroller projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: >-
    Draft catalog relation for an implemented family projection against the pinned Bootstrap 2.3.2 vocabulary. Stable admission requires real consumers, browser/native evidence and independent review; source presence and private package availability are not release or conformance admission.


summary: Bootstrap Message Scroller family over P-BASE-MESSAGE-SCROLLER with pinned vocabulary.
statement:
  en: >-
    The family parts each invoke their matching public Base hook exactly once and preserve the complete Base protocol. Root/Viewport/Jump preserve composed Scroll Area ownership, message facts and the end-follow request; Jump uses Button-semantics paint without another editor or scroll owner.


criteria:
  - id: P-BOOTSTRAP-2-3-2-MESSAGE-SCROLLER-BASE
    text:
      en: >-
        Invoke asMessageScroller* hooks() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias, jQuery/plugin API or Base.setup call.


  - id: P-BOOTSTRAP-2-3-2-MESSAGE-SCROLLER-VISUAL
    text:
      en: >-
        Root/Viewport/Jump preserve composed Scroll Area ownership, message facts and the end-follow request; Jump uses Button-semantics paint without another editor or scroll owner.


  - id: P-BOOTSTRAP-2-3-2-MESSAGE-SCROLLER-EXTENSION
    text:
      en: >-
        Message Scroller is a Proto extension with no upstream counterpart.


  - id: P-BOOTSTRAP-2-3-2-MESSAGE-SCROLLER-CLOSURE
    text:
      en: >-
        All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, Glyphicons, upstream JavaScript or Adapter component-name dispatch may supply default intent.


  - id: P-BOOTSTRAP-2-3-2-MESSAGE-SCROLLER-BOUNDARY
    text:
      en: >-
        Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; the package is private and source-only. Catalog presence is a draft relation, not acceptance.



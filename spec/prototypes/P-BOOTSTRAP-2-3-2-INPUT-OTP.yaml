id: P-BOOTSTRAP-2-3-2-INPUT-OTP
type: prototype
title: Bootstrap 2.3.2 Input Otp projection
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: >-
    Draft catalog relation for an implemented family projection against the pinned Bootstrap 2.3.2 vocabulary. Stable admission requires real consumers, browser/native evidence and independent review; source presence and private package availability are not release or conformance admission.


summary: Bootstrap Input Otp family over P-BASE-INPUT-OTP with pinned vocabulary.
statement:
  en: >-
    The family parts each invoke their matching public Base hook exactly once and preserve the complete Base protocol. Root/Input/Control/Slot/Separator preserve the single visible Base editor, filtering, completion and optional Field binding; slot paint uses family box recipes. Standalone focused/readOnly facts are not transported to the visual hook and remain an explicit gap.


criteria:
  - id: P-BOOTSTRAP-2-3-2-INPUT-OTP-BASE
    text:
      en: >-
        Invoke asInputOtp* hooks() exactly once and preserve every inherited owner, module, render result, props/exposes and lifecycle; no second semantic owner, cross-family alias, jQuery/plugin API or Base.setup call.


  - id: P-BOOTSTRAP-2-3-2-INPUT-OTP-VISUAL
    text:
      en: >-
        Root/Input/Control/Slot/Separator preserve the single visible Base editor, filtering, completion and optional Field binding; slot paint uses family box recipes. Standalone focused/readOnly facts are not transported to the visual hook and remain an explicit gap.


  - id: P-BOOTSTRAP-2-3-2-INPUT-OTP-EXTENSION
    text:
      en: >-
        OTP is a Proto extension; Bootstrap 2.3.2 had no segmented code input.


  - id: P-BOOTSTRAP-2-3-2-INPUT-OTP-CLOSURE
    text:
      en: >-
        All family appearance is authored through feedback tokens and Rules with explicit finite physical translation; no website-only CSS, Glyphicons, upstream JavaScript or Adapter component-name dispatch may supply default intent.


  - id: P-BOOTSTRAP-2-3-2-INPUT-OTP-BOUNDARY
    text:
      en: >-
        Exact-head browser, native, assistive-technology and Compiler evidence plus independent review remain open; the package is private and source-only. Catalog presence is a draft relation, not acceptance.


dependsOn:
  contracts:
    - C-AS-HOOK-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
inherits:
  prototypes:
    - P-BASE-INPUT-OTP
verifies:
  tests:
    - T-BOOTSTRAP-2-3-2-HISTORICAL-PRIMITIVES-0001
sources:

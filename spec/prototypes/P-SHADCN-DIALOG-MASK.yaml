id: P-SHADCN-DIALOG-MASK
type: prototype
title: Shadcn Dialog Mask inherits Base modal masking and adds a narrowed animated overlay surface
status: draft
since: 0.2.0-rc.0
summary: Shadcn Dialog Mask maps upstream Overlay onto the Base Mask protocol, retains modal presence and passthrough behavior, narrows its declared public Transition surface, and adds current fade styling.
statement:
  zh-CN: >-
    Shadcn Dialog Mask 是 upstream DialogOverlay 对 `P-BASE-DIALOG-MASK` 的投射，保留 modal mask、presence、passthrough 与 no-dismiss behavior，将 enter/leave 配置为 150ms，并在可用的 live preference/support facts 明确允许时增加黑色半透明 blur surface 与 fade animation；减少透明度、强制色、未知材质偏好或未知支持回退为不透明背景。公开类型只接受 `passthrough` 并只声明 `transitionState`/`isPresent`；其他 inherited Transition runtime capabilities 仍由内部实现使用，但不属于当前支持的 Shadcn public API。`asChild` 明确不提供。


  en: >-
    Shadcn Dialog Mask projects upstream DialogOverlay over `P-BASE-DIALOG-MASK`. It retains modal-mask, presence, passthrough, and no-dismiss behavior, configures enter and leave to 150ms, and adds the black translucent blurred surface only when live preference/support facts explicitly permit it, alongside fade animation. Reduced transparency, forced colors, non-ordinary or unknown material preferences, and unavailable blur support use an opaque background. Its public types accept only `passthrough` and declare only `transitionState` and `isPresent`; other inherited Transition runtime capabilities remain internally available but are not part of the supported Shadcn public API. `asChild` is explicitly unavailable.


criteria:
  - id: P-SHADCN-DIALOG-MASK-UPSTREAM-IDENTITY
    text:
      {
        zh-CN: Mask 必须明确映射 upstream DialogOverlay 并固定 revision/path。,
        en: Mask must explicitly map upstream DialogOverlay and pin its revision and path.,
      }
  - id: P-SHADCN-DIALOG-MASK-BASE-INHERITANCE
    text:
      {
        zh-CN: '`shadcn-dialog-mask` 必须继承 `P-BASE-DIALOG-MASK` 并调用 `asDialogMask()`。',
        en: '`shadcn-dialog-mask` must inherit `P-BASE-DIALOG-MASK` and call `asDialogMask()`.',
      }
    references:
      prototypes:
        - id: P-BASE-DIALOG-MASK
          anchors:
            [
              P-BASE-DIALOG-MASK-AUTHORING-ENTRIES,
              P-BASE-DIALOG-MASK-MODAL,
              P-BASE-DIALOG-MASK-PRESENCE,
              P-BASE-DIALOG-MASK-PASSTHROUGH,
              P-BASE-DIALOG-MASK-NO-DISMISS,
            ]
  - id: P-SHADCN-DIALOG-MASK-PUBLIC-BOUNDARY-DEVIATION
    text:
      {
        zh-CN: Shadcn public type surface 必须只接受 passthrough 并只声明 transitionState/isPresent；该收窄不取消内部 inherited Transition runtime，未声明能力不得作为稳定 public API。,
        en: The Shadcn public type surface must accept only passthrough and declare only transitionState and isPresent; this narrowing does not cancel internal inherited Transition runtime,
        and undeclared capabilities are not stable public API.,
      }
  - id: P-SHADCN-DIALOG-MASK-DIRECT-ENTRY
    text:
      {
        zh-CN: 当前 Mask protocol 以 `shadcn-dialog-mask` direct prototype 公开。,
        en: The current Mask protocol is exposed as the `shadcn-dialog-mask` direct prototype.,
      }
  - id: P-SHADCN-DIALOG-MASK-TRANSITION
    text:
      {
        zh-CN: Mask 必须配置 enterDuration=150ms、leaveDuration=150ms，并按 open state 投射 fade enter/leave。,
        en: Mask must configure enterDuration=150ms and leaveDuration=150ms and project fade enter and leave from open state.,
      }
  - id: P-SHADCN-DIALOG-MASK-CURRENT-VISUAL-SURFACE
    text:
      en: Mask always provides fixed inset and starts with opaque bg-background. Only live reducedTransparency no-preference, forcedColors none, and styleSupport.backdropBlur4px true enable the existing bg-black/50 and backdrop-blur-xs treatment. Unknown, non-ordinary or lost input withdraws both tokens; returning affirmative facts restores them without replacing the open mask, content or focus. The finite alphaFill fact describes a different secondary/80 lowering and is not widened by this recipe. No new material protocol or stable Compiler/native-host claim is introduced.
      zh-CN: Mask 始终投射 fixed inset，初始为不透明 bg-background。仅 live reducedTransparency 为 no-preference、forcedColors 为 none 且 styleSupport.backdropBlur4px 为 true 时启用既有 bg-black/50 与 backdrop-blur-xs。未知、非普通或丢失输入撤回二者；恢复肯定事实时在保留已打开 Mask、内容与焦点的前提下重新启用。有限 alphaFill fact 描述另一 secondary/80 lowering，本配方不扩张它，也不新增材质协议或稳定 Compiler/native-host 保证。
  - id: P-SHADCN-DIALOG-MASK-COMPATIBILITY-SUBSET
    text:
      {
        zh-CN: Overlay 命名、public boundary 与 token 差异集中在唯一 open question。,
        en: Overlay naming,
        public-boundary,
        and token differences are centralized in one open question.,
      }
  - id: P-SHADCN-DIALOG-MASK-AS-CHILD-OMISSION
    text:
      {
        zh-CN: upstream Overlay props 中的 `asChild` 依共享决策省略。,
        en: Upstream Overlay `asChild` is omitted under the shared decision.,
      }
    dependsOn: { decisions: [D-AS-CHILD-OMISSION-0001] }
openQuestions:
  - id: P-SHADCN-DIALOG-MASK-Q-UPSTREAM-DIFFERENCES
    question:
      {
        zh-CN: Mask/Overlay naming、Transition boundary 与 exact surface 应如何收敛？,
        en: How should Mask versus Overlay naming,
        Transition boundary,
        and exact surface converge?,
      }
    context:
      {
        zh-CN: intentional deviations 是省略 `asChild` 与当前受限 public type surface。upstream Overlay 使用 z-50、无 blur、转发 className/native/data-slot；当前 Mask 缺 z-50、增加 blur，并显式配置 150ms runtime。内部仍可见未声明 Transition controls 的类型/运行时一致性需继续治理。,
        en: Intentional deviations are `asChild` omission and the current limited public type surface. Upstream Overlay uses z-50,
        no blur,
        and forwards className,
        native props,
        and data-slot; current Mask lacks z-50,
        adds blur,
        and explicitly configures 150ms runtime. Type and runtime consistency for undeclared internal Transition controls needs continued governance.,
      }
    blocks: [shadcn dialog mask parity roadmap]

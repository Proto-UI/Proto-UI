openQuestions:
  - id: M-STATE-0001-Q-VALUE-VALIDATION
    question:
      zh-CN: 何时应把现有 validator helper 接入 define、`setDefault` 与 `set`，并决定 range clamp 与 invalid mutation 的统一诊断语义？
      en: When should the existing validator helpers be wired into definition, `setDefault`, and `set`, with unified diagnostics for range clamping and invalid mutation?
    context:
      zh-CN: 当前 Module 保存有限 spec metadata，但 kernel 尚未执行完整 value-domain validation；`C-STATE-0006-Q-VALIDATION` 仍是明确债务，本轮不把 helper 的存在冒充 runtime guarantee。
      en: The Module currently preserves finite spec metadata, but the kernel does not yet enforce complete value-domain validation; `C-STATE-0006-Q-VALIDATION` remains explicit debt, and this pass does not treat the helper's existence as a runtime guarantee.
    blocks: [state-value-validation-implementation]
  - id: M-STATE-0001-Q-REQUIRED-MODULE-VALIDATION
    question:
      zh-CN: 未来可配置 module set 应由 schema、runtime graph 还是 Adapter conformance 在 setup 前拒绝缺失 State 及其 dependent Modules？
      en: Should a future configurable module set use schema validation, the runtime graph, or Adapter conformance to reject missing State and its dependent Modules before setup?
    context:
      zh-CN: 当前 Runtime 固定安装 StateModuleDef，三个 official Adapter 没有正常的缺失路径；required 属性仍需要未来通用 module selection 机制承接。
      en: The current Runtime installs StateModuleDef unconditionally and the three official Adapters have no normal missing path; a future generic module-selection mechanism still needs to enforce required status.
    blocks: [configurable-runtime-module-selection]
revisions:
  - version: 0.2.0-rc.7
    change: revised
    summary: Cataloged the State facade, privileged port, capability views, required official Adapter support, no-host-cap boundary, instance lifetime, asHook projection, semantic compatibility bridges, and validation debt.
  - version: 0.1.0
    change: introduced
    summary: Established the State module identity for host-neutral internal state semantics.

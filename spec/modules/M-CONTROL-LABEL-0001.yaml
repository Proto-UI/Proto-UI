revisions:
  - version: 0.3.0-alpha.2
    change: clarified
    summary: Bounded the separate compiled GPUI ownership implementation to shared-SDK nominal references and exact weak participant leases; retained draft admission.
  - version: 0.3.0-alpha.2
    change: clarified
    summary: Shared nominal pairing across compatible runtime and native compiler copies while preserving target-owned A11y naming, callback routing and exact lease cleanup.
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added the bounded pairing owner and explicit unsupported/lifetime behavior.
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Bounded optional anatomy pairing reuses the same private reference registry and host-input ownership.

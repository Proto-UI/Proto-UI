id: M-CONTROL-LABEL-0001
type: module
title: Control Label owns explicit pairing and bounded request routing
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: The explicit bounded association direction has owning-layer and Web Adapter harness evidence. Stable admission remains blocked on independent review, complete native input/lifetime and assistive-technology evidence.
summary: The module pairs admitted semantic subjects while targets retain activation and value ownership.
criteria:
  - id: M-CONTROL-LABEL-0001-PAIR
    text:
      en: One opted-in subject or target per logical instance accepts only a branded reference via ControlLabelPort. Pairing is exact-reference plus host tree scope; duplicate or missing live endpoints do not select a DOM-order winner.
  - id: M-CONTROL-LABEL-0001-LEASE
    text:
      en: Logical intent survives detach. Current binding and host leases carry exact owner/generation identity, revoke on view absence/disposal and reject stale cleanup and requests. Both owned slots are cleared before disposers run; a reentrant newer association wins over the retired caller. The Module is the sole source of initial and dynamic host activation-action projection, independently of naming and visual styling.
  - id: M-CONTROL-LABEL-0001-NAME
    text:
      en: Naming uses privileged A11y semantic identity and a distinct derived-name contribution. Nonempty author names/IDREFs win, and owned cleanup preserves author or newer contributions.
  - id: M-CONTROL-LABEL-0001-REQUEST
    text:
      en: A qualifying label request enters the target callback scope and shares its existing internal operation. Missing host or callback capability is diagnostic; the module never mutates a checked/editor value.
owns:
  contracts:
    - C-CONTROL-LABEL-0001
satisfies:
  contracts:
    - C-CONTROL-LABEL-0001
requires:
  hostCaps:
    - HC-CONTROL-LABEL-0001
dependsOn:
  modules:
    - M-A11Y-0001
verifies:
  tests:
    - T-CONTROL-LABEL-0001
sources:
  - path: packages/modules/control-label/src/create.ts
  - path: packages/modules/control-label/src/registry.ts
  - path: packages/modules/control-label/src/caps.ts
  - path: packages/modules/control-label/src/web.ts
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added the bounded pairing owner and explicit unsupported/lifetime behavior.
tags:
  - module
  - label
  - lifecycle

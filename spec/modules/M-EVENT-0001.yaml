id: M-EVENT-0001
type: module
title: Event module
status: draft
since: 0.1.0
summary: The standard instance Event module owns setup registration, token identity, runtime dispatch planning, target-preflighted scoped binding lifetime, and the privileged coordination used by runtime and interaction modules.
statement:
  zh-CN: >-
    Event module 是 standard Proto UI runtime 固定安装的 instance module。它拥有 setup-time registration、precise token removal、registration diagnostics、runtime binding plan 与 instance-lifetime cleanup；prototype author surface 只通过 runtime 投影为 `def.event.on`、`onGlobal` 与 `off`，callback 的 `run handle` 由 runtime 在 dispatch window 绑定。Privileged port 供 runtime、其它 Module 与特权 asHook 注册内部 listener、bind/unbind、redirect semantic root、执行内部 callback、请求 default-action cancellation 与读取 diagnostics。Adapter 通过 host-neutral scoped Event binding 与独立 Default Action capability 落地宿主交互。Expose Event 已由独立 Module 承载，不属于 Event facade、port、registry 或 host-cap wiring。


  en: >-
    The Event module is an instance module installed by the standard Proto UI runtime. It owns setup-time registration, precise token removal, registration diagnostics, runtime binding plans, and instance-lifetime cleanup; the prototype-author surface is projected by the runtime only as `def.event.on`, `onGlobal`, and `off`, while the runtime binds the callback's `run handle` during the dispatch window. Its privileged port lets the runtime, other Modules, and privileged asHooks register internal listeners, bind or unbind, redirect the semantic root, invoke internal callbacks, request default-action cancellation, and read diagnostics. The adapter realizes host interaction through host-neutral scoped Event binding plus the separate Default Action capability. Expose Event is now owned by a standalone Module and does not belong to the Event facade, port, registry, or host-capability wiring.


criteria:
  - id: M-EVENT-0001-A
    text:
      zh-CN: Event-channel-owned `EventChannelFacade` 必须提供 setup-time `on`、`onGlobal` 与 precise-token `off` registration surface；runtime 必须只把它们投影到 `def.event`，不得固化普通 prototype-author `run.event` API。
      en: The Event-channel-owned `EventChannelFacade` must provide setup-time `on`, `onGlobal`, and precise-token `off` registration surfaces; the runtime must project them only onto `def.event` and must not stabilize an ordinary prototype-author `run.event` API.
  - id: M-EVENT-0001-B
    text:
      zh-CN: Module port 必须为 runtime、其它 Module 与特权 asHook 提供 internal `on`/`onGlobal`、`bind`/`unbind`、`dispatchInternal`、root redirect、semantic-only root redirect 与 diagnostics；这些能力不得直接进入普通作者 surface。
      en: The module port must provide internal `on` and `onGlobal`, `bind` and `unbind`, `dispatchInternal`, root redirect, semantic-only root redirect, and diagnostics for the runtime, other Modules, and privileged asHooks; these capabilities must not directly enter the ordinary author surface.
  - id: M-EVENT-0001-C
    text:
      zh-CN: Event Module 只保存 registration identity 与 binding plan，不得理解或构造 callback `run handle`，也不得向 prototype author 暴露、允许选择或要求读取具体 root/global host target。
      en: The Event module may retain registration identity and binding plans but must not understand or construct callback `run handles`, and must not expose, allow selection of, or require prototype authors to read concrete root or global host targets.
  - id: M-EVENT-0001-D
    text:
      zh-CN: Standard Runtime 与当前 official interactive Web Adapter profile 必须安装 Event Module；没有 registration 时 Module 必须 no-op 且不要求 Event binding capability，只有实际使用的 root/global scope 才能成为 host requirement。
      en: The standard Runtime and current official interactive Web Adapter profiles must install the Event module; with no registrations the module must be a no-op and require no Event binding capability, and only a root or global scope that is actually used may become a host requirement.
  - id: M-EVENT-0001-E
    text:
      zh-CN: Module 必须通过 `HC-EVENT-BINDING-0001` 把每个 root/global registration 交给 Adapter-owned translated interaction stream；相同 registration 不得去重，Adapter 的 route ownership 与 native mapping 不得进入 Module portable semantics。
      en: The module must use `HC-EVENT-BINDING-0001` to connect each root or global registration to an adapter-owned translated interaction stream; identical registrations must not be deduplicated, and adapter route ownership and native mapping must not enter the module's portable semantics.
  - id: M-EVENT-0001-F
    text:
      zh-CN: Registration 属于 instance lifetime；off、unbind、target/capability replacement、unmount 与 terminal disposal 必须释放旧 binding，并保证旧 target 不再 delivery，必要时对当前映射透明 rebind。
      en: Registrations belong to the instance lifetime; off, unbind, target or capability replacement, unmount, and terminal disposal must release old bindings, ensure old targets no longer deliver, and transparently rebind to the current mapping when necessary.
  - id: M-EVENT-0001-G
    text:
      zh-CN: Privileged port 的 default-action request 必须通过独立 `HC-DEFAULT-ACTION-0001` 投射，不得要求调用者依赖 DOM `preventDefault()`，也不得把 default-action control 与 Event routing 或 boundary classification 合并。
      en: The privileged port's default-action request must be projected through the separate `HC-DEFAULT-ACTION-0001`, must not require callers to depend on DOM `preventDefault()`, and must not merge default-action control with Event routing or boundary classification.
  - id: M-EVENT-0001-H
    text:
      zh-CN: '`EventFacade` 必须只等于 Event-channel-owned `EventChannelFacade`。Event package 对 `ExposeEventFacade`、`EXPOSE_EVENT_SINK_CAP` 与 legacy `EVENT_EMIT_CAP` 的导出只能是带 deprecation 的 source re-export；Adapter 必须把 sink 接到 `expose-event`，旧 `event` wiring 必须给出迁移诊断而不能假装构成 Expose Event 支持。'
      en: '`EventFacade` must contain only the Event-channel-owned `EventChannelFacade`. Event-package exports of `ExposeEventFacade`, `EXPOSE_EVENT_SINK_CAP`, and legacy `EVENT_EMIT_CAP` may exist only as deprecated source re-exports; Adapters must wire the sink to `expose-event`, and legacy `event` wiring must produce a migration diagnostic rather than masquerade as Expose Event support.'
  - id: M-EVENT-0001-I
    text:
      zh-CN: 一次 runtime binding attempt 必须在添加该次 attempt 的任何 host listener 前，为全部当前未绑定 registration 解析 target；若 target resolution 失败，该次 attempt 不得新增 host listener，target 可用后显式 bind retry 必须能够重试完整 registration set。该准则不要求失败后由 capability epoch 自动 retry；explicit unbind 后不得仅因 capability epoch 重新绑定。listener attachment 或 cleanup 抛错时的事务语义由 M-EVENT-0001-J 定义。
      en: A runtime binding attempt must resolve targets for every currently unbound registration before adding any host listener for that attempt; if target resolution fails, the attempt must add no host listener, and an explicit bind retry must be able to retry the complete registration set after targets become available. This criterion does not require automatic retry on a capability epoch after failure; an explicit unbind must not rebind solely because of a capability epoch. Transactional semantics when listener attachment or cleanup throws are defined by M-EVENT-0001-J.
  - id: M-EVENT-0001-J
    text:
      zh-CN: >-
        listener attachment 失败时，runtime 必须回滚本次 binding attempt 已建立的全部 host listener，并保证每个受影响 registration 保持逻辑 unbound（diagnostics 记为 unbound），显式 bind retry 能完整重装。cleanup/unbind 必须幂等：重复 cleanup 不得遗留 listener。rollback 的 removeEventListener 自身失败不得掩盖原始 attachment 错误，并必须 fail closed（不得让部分 listener 视为已绑定）。portable 事件 callback 收到的是 data-only、immutable 的新 view，不得 alias 或修改 host event/detail；default-action control 仅在当前同步 callback window 内有效，window 结束后调用须 fail closed；同一 host sample 的多次 default-action request 在宿主边界去重。semantic（非 host:*）registration 不得携带 DOM listener options。宿主绑定事件保持 raw host event。

      en: >-
        When listener attachment fails, the runtime must roll back every host listener already attached by that binding attempt, keep each affected registration logically unbound (reported as unbound in diagnostics), and let an explicit bind retry reinstall the full set. Cleanup/unbind must be idempotent: repeated cleanup must not leave listeners behind. A rollback removeEventListener failure must not mask the original attachment error and must fail closed (no partial listener set may be treated as bound). A portable event callback receives a new, immutable, data-only view and must never alias or mutate the host event/detail; the default-action control is live only for the current synchronous callback window, and a call after the window must fail closed; multiple default-action requests for the same host sample are deduplicated at the host boundary. Semantic (non-host:*) registrations must not carry DOM listener options. Host-bound events stay raw host events.


openQuestions:
  - id: M-EVENT-0001-Q-HOST-BINDING-SHAPE
    question:
      zh-CN: Event implementation 何时应把 `EventTarget` getter caps 收敛为 `HC-EVENT-BINDING-0001` 所描述的 host-owned subscription lease？
      en: When should the Event implementation replace its `EventTarget` getter caps with the host-owned subscription lease described by `HC-EVENT-BINDING-0001`?
    context:
      zh-CN: 当前 Web profiles 的行为证据完整，但 cap shape 直接依赖 DOM EventTarget，尚不能作为非 Web Adapter baseline。
      en: Current Web profiles have substantial behavioral evidence, but the cap shape directly depends on DOM EventTarget and cannot yet serve as a non-Web Adapter baseline.
    blocks: [cross-host-event-binding-port]
  - id: M-EVENT-0001-Q-REQUIRED-MODULE-POLICY
    question:
      zh-CN: 未来 non-interactive 或 static Adapter 是否可以显式 omit Event Module；若允许，使用 `def.event` 的 prototype 应在 schema、adapt time 还是 first bind 时失败？
      en: May a future non-interactive or static adapter explicitly omit the Event module, and if so, should a prototype using `def.event` fail at schema validation, adaptation time, or first bind?
    context:
      zh-CN: 当前 Runtime 固定安装 Event Module，official Web profiles 全部支持；没有 registration 时无需 host cap，因此 package installation 与实际 host requirement 不能简单等同。
      en: The current Runtime installs the Event module and every official Web profile supports it; because no host cap is needed without registrations, package installation and an actual host requirement are not equivalent.
    blocks: [configurable-runtime-module-selection, adapter-module-omission-diagnostics]
revisions:
  - version: 0.3.0-alpha.0
    change: refined
    summary: Defined transactional attach rollback with fail-closed unbound state, idempotent cleanup, immutable data-only portable payload with window-bounded and deduplicated default-action control, and semantic registration options rejection.

  - version: 0.3.0-alpha.0
    change: revised
    summary: Removed the Expose Event implementation and composite facade from Event while retaining only deprecated source re-exports for migration.
  - version: 0.2.0-rc.7
    change: revised
    summary: Assigned the co-located Expose Event facade and canonical signal sink to M-EXPOSE-EVENT-0001 while retaining source-compatible package aliases.
  - version: 0.2.0-rc.7
    change: revised
    summary: Cataloged the Event facade and privileged port, required official profile support, host-neutral binding and default-action capabilities, lifecycle ownership, Expose Event boundary, and current EventTarget portability debt.
  - version: 0.1.0
    change: introduced
    summary: Drafted the Event module entity and recorded default-action control as an internal Event port capability.
  - version: 0.2.0
    change: strengthened
    summary: Required target preflight before listener attachment, zero new listeners on target-resolution failure, and an explicit complete-plan retry without automatic recovery semantics.
tags: [event, module, required, adapter, lifecycle]

openQuestions:
  - id: M-COLLECTION-0001-Q-CONFIGURATION
    question:
      en: How should repeated configuration, conflicts and legacy state-name options be governed?
      zh-CN: 重复配置、冲突及旧 state-name option 应如何治理？
    context:
      en: This slice verifies one successful setup configuration and phase rejection. Count/index/total/first/last State name options remain declared in Core types while current no-arg hooks create fixed semantic names before configure. Their migration and transactional recovery after setup configuration errors remain outside this slice.
      zh-CN: 本 slice 验证单次成功 setup 配置及阶段拒绝。Core 类型仍声明 count/index/total/first/last State 命名 option，但当前 no-arg hook 在 configure 前以固定语义名创建 State。这些 option 的迁移以及 setup 配置失败后的事务性恢复留待单独治理。

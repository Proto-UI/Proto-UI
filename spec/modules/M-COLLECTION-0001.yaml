id: M-COLLECTION-0001
type: module
title: Collection module projects explicit ordered item sets
status: draft
since: 0.1.0
summary: Collection projects explicit Anatomy item roles into ordered metadata snapshots; privileged asHooks provide State, Expose and view-lifecycle synchronization.
satisfies:
  contracts:
    - C-AS-COLLECTION-0001
    - C-AS-COLLECTION-ITEM-0001
requires:
  contracts:
    - C-ANATOMY-ORDER-0001
verifies:
  tests:
    - T-COLLECTION-0001
    - id: T-COLLECTION-0002
      since: 0.3.0-alpha.0
sources:
  - path: packages/modules/collection/src/create.ts
  - path: packages/modules/collection/src/types.ts
  - path: packages/hooks/src/as-collection.ts
  - path: packages/hooks/src/as-collection-item.ts
revisions:
  - version: 0.1.0
    change: introduced
    summary: Drafted the collection module entity for no-arg privileged collection hooks.
  - version: 0.3.0-alpha.0
    change: refined
    summary: Added bounded module/asHook ownership, phase integrity, snapshot and lifecycle criteria with four Adapter evidence.
tags:
  - collection
  - module
statement:
  en: This bounded draft enriches the existing Module identity rather than adding a new channel or host abstraction. The Module provides configuration and structural reads; asCollection/asCollectionItem own their public returned handles and compose already governed modules.
  zh-CN: 本有界 draft 补全既有 Module 身份，不增加信息通路或宿主抽象。Module 提供配置和结构读取；asCollection/asCollectionItem 拥有各自公开返回 handle，并组合已有治理的 Module。
criteria:
  - id: M-COLLECTION-0001-A
    text:
      en: Collection owns provider/item configuration and Anatomy-backed reads. The standard Runtime installs it as an instance-owned module depending on Anatomy; the privileged asHooks compose State, Expose and lifecycle synchronization around that port. No direct Collection host capability is required.
      zh-CN: Collection 拥有 provider/item 配置与基于 Anatomy 的读取。standard Runtime 以 instance ownership 安装并依赖 Anatomy；特权 asHook 围绕 port 组合 State、Expose 和生命周期同步。无需 Collection 直接宿主能力。
  - id: M-COLLECTION-0001-B
    text:
      en: asCollection and asCollectionItem are no-argument setup hooks whose repeated calls reuse the same respective handles. Configure is setup-only; a rejected runtime configure must leave the prior metadata getter and configuration intact.
      zh-CN: asCollection 与 asCollectionItem 是无参数 setup hook，重复调用复用各自 handle。configure 为 setup-only；runtime configure 被拒绝后，原 metadata getter 与配置必须保持不变。
  - id: M-COLLECTION-0001-C
    text:
      en: Provider snapshots enumerate the explicitly configured Anatomy item role within the current domain, excluding undeclared host descendants and nested same-family domains. Reads follow current host order and support insertion, removal and reorder through Anatomy.
      zh-CN: provider snapshot 枚举当前 domain 中显式配置的 Anatomy item role，排除未声明宿主后代与嵌套同 family domain。读取遵循当前宿主顺序，通过 Anatomy 支持插入、移除与重排。
  - id: M-COLLECTION-0001-D
    text:
      en: Item metadata is read from the configured Expose key or getter. Structural index, total, first and last are computed from current order and override same-named metadata fields without mutating the metadata record. Provider and item methods read current metadata; metadata-only changes do not create a new structural notification channel.
      zh-CN: item metadata 读取配置的 Expose key 或 getter。结构字段 index、total、first、last 从当前顺序计算，覆盖 metadata 同名字段而不修改源记录。provider/item 方法读取当前 metadata；纯 metadata 变化不创建新的结构通知通路。
  - id: M-COLLECTION-0001-E
    text:
      en: asHooks synchronize count and item position State on mount, update and subscribed order changes, and publish their configured State/method Exposes. Internal order subscriptions are released on unmount and rebound on remount; instance configuration survives repeatable view epochs. Terminal owner disposal releases the hook subscriptions and Anatomy claims.
      zh-CN: asHook 在 mount、update 和已订阅 order change 时同步 count、item position State，并发布配置的 State/method Expose。内部 order subscription 在 unmount 释放、remount 重建；实例配置跨 repeatable view epoch 保留。terminal owner disposal 释放 hook subscription 与 Anatomy claim。
  - id: M-COLLECTION-0001-F
    text:
      en: Unconfigured Module reads return empty provider data and the default missing item position. Internal queries use Anatomy tolerant policies for transient absence; the item hook retains its last known position when the domain is temporarily unavailable. This does not admit ordinary author missing-query policy or selection, focus navigation, keyboard or A11y ownership.
      zh-CN: 未配置 Module 返回空 provider 数据与默认 missing item position。内部查询使用 Anatomy tolerant policy 处理暂时缺失；item hook 在 domain 暂不可用时保留最后位置。这不接纳普通作者 missing-query policy，也不引入 selection、focus navigation、keyboard 或 A11y ownership。

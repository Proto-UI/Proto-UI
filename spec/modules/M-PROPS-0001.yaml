openQuestions:
  - id: M-PROPS-0001-Q-REQUIRED-MODULE-VALIDATION
    question:
      zh-CN: 当 runtime 未来允许自定义 module set 时，应由 schema、runtime graph 还是 Adapter conformance 在创建组件前拒绝缺失 Props module？
      en: If runtimes later allow custom module sets, should schema validation, the runtime graph, or adapter conformance reject a missing Props module before component creation?
    context:
      zh-CN: 当前 runtime 固定安装 PropsModuleDef，因此 official adapters 不存在正常的缺失路径；required 属性仍需要未来通用 module selection 机制承接。
      en: The current runtime installs PropsModuleDef unconditionally, so official adapters have no normal missing-module path; a future generic module-selection mechanism still needs to enforce required status.
    blocks:
      - configurable runtime module selection
  - id: M-PROPS-0001-Q-SOURCE-MODES
    question:
      zh-CN: 未来是否需要允许 pull-only 或 push-only Props ingress，使 `RawPropsSource.subscribe` 不再是所有 host profile 的强制形状？
      en: Should future Props ingress support pull-only or push-only modes so `RawPropsSource.subscribe` is no longer mandatory for every host profile?
    context:
      zh-CN: 当前 React、Vue 与 Web Component attribute profile 都能提供 `get + subscribe`；Web Component `setElementProps` 与 `controller.applyRawProps` 也已形成独立 direct-push path。现有证据支持两条路径共存，尚不支持提前扩张 capability shape。
      en: The current React, Vue, and Web Component attribute profiles can all provide `get + subscribe`; Web Component `setElementProps` and `controller.applyRawProps` also form a distinct direct-push path. Existing evidence supports coexistence of the two paths but does not yet justify expanding the capability shape.
    blocks:
      - Props host ingress modes

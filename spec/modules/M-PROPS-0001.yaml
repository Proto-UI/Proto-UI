id: M-PROPS-0001
type: module
title: Props module
status: active
since: 0.1.0
summary: The required Props module owns Maker configuration declaration, raw-to-resolved snapshot semantics, and callback-safe props observation.
statement:
  zh-CN: >-
    Props module 是正常 Proto UI runtime 与 Adapter 的必装 instance module。它把 Adapter 提供的当前 raw props snapshot 解析为声明 key 的 portable resolved snapshot，并拥有 declaration、defaults、provided-state、fallback、watch diff 与 diagnostic task。Facade 经 runtime 投影到 `def.props` 与 `run.props`；port 只供 runtime 同步 host source、直接应用 raw snapshot、取得 watcher tasks 与 diagnostics。Module 不拥有宿主 props/attrs/property 的原始分类，也不因 props 变化隐式调度 render commit。


  en: >-
    The Props module is a required instance module for normal Proto UI runtimes and adapters. It resolves the current adapter-provided raw props snapshot into a portable declared-key resolved snapshot and owns declarations, defaults, provided state, fallback, watcher diffs, and diagnostic tasks. Its facade is projected by the runtime onto `def.props` and `run.props`; its port is reserved for runtime synchronization with the host source, direct raw-snapshot application, watcher-task consumption, and diagnostics. The module does not own the host's original props, attrs, or property classification and does not implicitly schedule a render commit when props change.


criteria:
  - id: M-PROPS-0001-A
    text:
      zh-CN: Module facade 必须提供 setup-time `define`、`setDefaults`、resolved/raw watcher registration，以及 runtime `get`、`getRaw`、`isProvided`；runtime 必须只把相应阶段允许的部分投影到 `def.props` 与 `run.props`。
      en: The module facade must provide setup-time `define`, `setDefaults`, resolved and raw watcher registration, plus runtime `get`, `getRaw`, and `isProvided`; the runtime must project only the phase-appropriate parts onto `def.props` and `run.props`.
  - id: M-PROPS-0001-B
    text:
      zh-CN: Module port 必须提供 `syncFromHost`、`applyRaw`、`consumeTasks` 与 diagnostics，使 runtime 可以在 callback-safe point 同步输入并绑定 watcher callback context；这些能力不得直接进入普通 prototype author surface。
      en: The module port must provide `syncFromHost`, `applyRaw`, `consumeTasks`, and diagnostics so the runtime can synchronize input and bind watcher callback context at callback-safe points; these capabilities must not enter the ordinary prototype-author surface directly.
  - id: M-PROPS-0001-C
    text:
      zh-CN: Module 必须通过一个 raw props snapshot source host capability 读取 Adapter 已规范化的当前输入，并把宿主或框架原始 props/attrs/property 分类留给 Adapter。
      en: The module must read adapter-normalized current input through one raw props snapshot-source host capability while leaving original host or framework props, attrs, and property classification to the adapter.
  - id: M-PROPS-0001-D
    text:
      zh-CN: source change notification 只能使当前 raw snapshot 失效；Module 必须在 runtime sync point 重新读取并按 Props contract 比较，不得把通知次数解释为 delivery event、watcher 次数或 render commit 请求。
      en: A source-change notification may only invalidate the current raw snapshot; the module must reread and compare it at a runtime synchronization point under the Props contracts and must not interpret notification count as delivery events, watcher count, or render-commit requests.
  - id: M-PROPS-0001-E
    text:
      zh-CN: '`applyRaw` 是 runtime/controller 的直接输入 port，与 host source pull/subscription 路径共享相同 Props kernel semantics，但它不是 host capability，且不得隐式 render。'
      en: '`applyRaw` is a direct runtime or controller input port that shares Props-kernel semantics with the host-source pull and subscription path; it is not a host capability and must not implicitly render.'
  - id: M-PROPS-0001-F
    text:
      zh-CN: 正常 Proto UI runtime 与 official Adapter 必须安装并接入 Props module；不提供该 module 的适配结果不得声称支持 Maker 到 Component 的标准 Props 配置通路。
      en: Normal Proto UI runtimes and official adapters must install and wire the Props module; an adaptation without it must not claim support for the standard Maker-to-Component Props configuration channel.
  - id: M-PROPS-0001-G
    text:
      zh-CN: Props logical state 与 declaration 属于 instance lifetime；host source replacement 必须取消旧订阅并读取新 source，terminal disposal 必须释放订阅与 pending tasks。
      en: Props logical state and declarations belong to the instance lifetime; host-source replacement must unsubscribe from the old source and read the new source, while terminal disposal must release subscriptions and pending tasks.

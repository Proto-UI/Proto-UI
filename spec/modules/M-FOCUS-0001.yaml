  - path: packages/hooks/src/as-focus-entry.ts
  - path: packages/hooks/src/as-focus-roving.ts
  - path: packages/hooks/src/as-focus-scope.ts
openQuestions:
  - id: M-FOCUS-0001-Q-PORTABILITY
    question:
      en: How should non-Web ordering and multiple host focus domains be represented?
      zh-CN: 非 Web order 与多个宿主 focus domain 应如何表达？
    context:
      en: Current center ordering uses host HTMLElement document order and the implementation exports one shared center. This bounded Web catalog does not admit an independent non-Web ordering protocol or cross-document focus-domain policy.
      zh-CN: 当前 center order 使用宿主 HTMLElement document order，且实现导出一个共享 center。本有界 Web 编目不接纳独立非 Web order protocol 或跨 document focus-domain policy。
revisions:
  - version: 0.3.0-alpha.0
    change: introduced
    summary: Cataloged bounded Focus ownership and executable evidence.

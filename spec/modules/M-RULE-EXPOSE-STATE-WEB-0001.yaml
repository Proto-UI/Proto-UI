    - C-RULE-RUNTIME-0001
    - C-FEEDBACK-STYLE-0004
    - C-LIFECYCLE-0006
    - C-LIFECYCLE-0007
verifies:
  tests:
    - T-RULE-EXPOSE-STATE-WEB-0001
openQuestions:
  - id: M-RULE-EXPOSE-STATE-WEB-0001-Q-REPLANNING
    question:
      en: How should a live Web mapping/policy change revoke optimization and atomically resume the default executor?
      zh-CN: 同一 view 内 Web mapping/policy 变化时，如何撤销优化并原子地恢复默认执行器？
    context:
      en: Current candidate IDs are fixed after acceptance until view teardown. A changed or missing upstream binding can leave an old selector and filtering active. RulePort has no explicit reapply/invalidation operation. This known gap is not covered by the view-boundary repair and prevents full support claims.
      zh-CN: 当前 candidate 接纳后 ID 固定至 view teardown。上游 binding 改变或丢失可能留下旧 selector 与过滤状态。RulePort 没有显式 reapply/invalidation 操作。此已知缺口未被 view-boundary 修复覆盖，阻止全面支持声明。
  - id: M-RULE-EXPOSE-STATE-WEB-0001-Q-EQUIVALENCE
    question:
      en: What evidence or eligibility restriction establishes full CSS/default-Plan equivalence?
      zh-CN: 何种证据或 eligibility 限制可以建立完整 CSS/default Plan 等价性？
    context:
      en: Legacy native pseudo-classes need not match independently writable State, mixed optimized/default rules may interact through CSS specificity and order, and emitting a token does not prove the host stylesheet contains it. Shared CLI canonicalization and bounded DOM journeys are partial evidence. Arbitrary encoding, custom mapping CSS generation and Rule Meta evolution remain separate work.
      zh-CN: legacy native pseudo-class 未必等于可独立写入的 State；混合 optimized/default rule 可能受 CSS specificity/order 影响；输出 token 不证明宿主 stylesheet 包含它。共享 CLI canonicalization 与有界 DOM journey 只是部分证据。任意编码、自定义 mapping 的 CSS 生成及 Rule Meta 演进留待单独工作。

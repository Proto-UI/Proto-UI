id: M-EXPOSE-STATE-0001
type: module
title: Expose State compositor module
status: draft
since: 0.1.0
summary: The required Expose State module composes Expose and State into a classified Adapter translation record, projects internal State handles as stable read-only external handles, and publishes that record through one host-neutral sink capability.
statement:
  zh-CN: >-
    Expose State 是 standard Runtime 与 official Adapter 的 required instance composition Module。它没有普通 prototype-author facade；`def.expose.state` registration 仍通过 runtime 投影到 Expose core facade，Module 则消费 Expose port 与 State port，把 internal State handle 降权为 App-Maker-facing external handle，并让其它 classified expose entry 按原语义通过，形成完整 Adapter translation record。该 record 可以包含供 Adapter 识别 outward signal 的 branded declaration descriptor；Adapter public-record projection 必须在完成宿主翻译后删除 descriptor。Privileged port 供 runtime、dependent Module 与诊断读取 translation record，不提供 App Maker write authority。Module 通过 `HC-EXPOSES-RECORD-SINK-0001` 发布 replacement snapshot，维护 sink rebind 与 terminal cleanup；external handle identity、subscription 与 same-source value 属于 instance lifetime。DOM attribute/CSS variable mirror 属于独立 Web extension，不是本 Module 或该 host-cap 的跨宿主要求。


  en: >-
    Expose State is a required instance composition Module for the standard Runtime and official Adapters. It has no ordinary prototype-author facade: `def.expose.state` registration is still projected by the runtime onto the Expose core facade, while this Module consumes the Expose and State ports, attenuates internal State handles into App-Maker-facing external handles, and passes other classified Expose entries through with their existing semantics to form the complete Adapter translation record. That record may include branded declaration descriptors that let an Adapter recognize outward signals; the Adapter's public-record projection must remove those descriptors after host translation. Its privileged port lets the runtime, dependent Modules, and diagnostics read the translation record without granting App Maker write authority. The Module publishes replacement snapshots through `HC-EXPOSES-RECORD-SINK-0001` and owns sink rebinding and terminal cleanup; external-handle identity, subscriptions, and same-source values belong to the instance lifetime. DOM attribute and CSS-variable mirroring belongs to a separate Web extension and is not a cross-host requirement of this Module or capability.


criteria:
  - id: M-EXPOSE-STATE-0001-A
    text:
      zh-CN: Module 必须依赖 Expose core port 与 State port 组成 classified Adapter translation record，并保持空 author facade；`def.expose.state` 是 runtime 对 Expose registration 的分类投影，不得伪装成本 Module 自有的普通 facade。
      en: The Module must compose a classified Adapter translation record from the Expose core and State ports while retaining an empty author facade; `def.expose.state` is a runtime-classified projection of Expose registration and must not be represented as this Module's own ordinary facade.
  - id: M-EXPOSE-STATE-0001-B
    text:
      zh-CN: Privileged port 必须提供按 key 与完整 translation record 的 read 以及 diagnostics；internal State handle 必须被替换为 external handle，branded Expose Event declaration metadata 必须保持到 Adapter translation boundary，其它 entry 必须保持 core value identity 与语义，返回 record 不得成为 live mutable registry。
      en: The privileged port must provide reads by key and as a complete translation record plus diagnostics; internal State handles must be replaced by external handles, branded Expose Event declaration metadata must survive to the Adapter translation boundary, other entries must retain their core value identities and semantics, and returned records must not become a live mutable registry.
  - id: M-EXPOSE-STATE-0001-C
    text:
      zh-CN: External state handle 必须提供只读 `get`、`subscribe`/unsubscribe 与 `spec`，不得暴露 `set`、`setDefault`、raw slot 或 prototype-author owned/borrowed/observed authority。
      en: External State handles must provide read-only `get`, subscribe or unsubscribe, and `spec`, and must not expose `set`, `setDefault`, a raw slot, or prototype-author owned, borrowed, or observed authority.
  - id: M-EXPOSE-STATE-0001-D
    text:
      zh-CN: External `get` 与 subscription 必须观察同一 internal source，subscription event 与 StateEvent 对齐但不得携带 author `run handle`；一个 instance 内对同一 internal handle 的重复 projection 必须保持 external handle identity。
      en: External `get` and subscription must observe the same internal source, subscription events must align with StateEvent without carrying an author `run handle`, and repeated projection of the same internal handle within one instance must preserve external-handle identity.
  - id: M-EXPOSE-STATE-0001-E
    text:
      zh-CN: External handle、identity 与 subscription 属于 instance lifetime，必须跨 repeatable view detach/remount 保留；terminal disposal 必须取消仍存 subscription、使残留 handle fail，并清空 host sink。
      en: External handles, their identities, and subscriptions belong to the instance lifetime and must survive repeatable view detachment and remounting; terminal disposal must cancel remaining subscriptions, make retained handles fail, and clear the host sink.
  - id: M-EXPOSE-STATE-0001-F
    text:
      zh-CN: Standard Runtime 与 official Adapter profile 必须安装 Expose State，并由 Adapter 以 translated capability 提供 `HC-EXPOSES-RECORD-SINK-0001`；没有 sink 时 internal port 仍可工作，但 Adapter 不得宣称支持 standard App Maker Expose surface。
      en: The standard Runtime and official Adapter profiles must install Expose State, and the Adapter must provide `HC-EXPOSES-RECORD-SINK-0001` as a translated capability; the internal port may still operate without a sink, but an Adapter must not claim the standard App Maker Expose surface in that state.
  - id: M-EXPOSE-STATE-0001-G
    text:
      zh-CN: Sink attach、replacement 与 capability epoch 必须发布当前 complete record；replacement、removal 与 terminal disposal 必须清空先前 sink，repeatable view detach 不得清空仍存活 owner 的 record。
      en: Sink attachment, replacement, and capability epochs must publish the current complete record; replacement, removal, and terminal disposal must clear the previous sink, while repeatable view detachment must not clear the record of a still-live owner.
  - id: M-EXPOSE-STATE-0001-H
    text:
      zh-CN: Canonical wiring token 必须表达 complete classified translation record sink；旧 `EXPOSE_STATE_SET_EXPOSES_CAP` 可以作为同一 token 的 deprecated source-compatible alias，但不得继续把 capability 解释为只发布 state entry。
      en: The canonical wiring token must express a complete classified translation-record sink; legacy `EXPOSE_STATE_SET_EXPOSES_CAP` may remain as a deprecated source-compatible alias of the same token but must no longer cause the capability to be interpreted as publishing only State entries.
  - id: M-EXPOSE-STATE-0001-I
    text:
      zh-CN: Expose State core 不得镜像 DOM attribute、CSS variable 或 ARIA；这些 Web-specific projection 属于 `@proto.ui/module-expose-state-web` 及相关 rule optimization，非 Web Adapter 可以诚实地不接入这些外围 Module。
      en: Expose State core must not mirror DOM attributes, CSS variables, or ARIA; those Web-specific projections belong to `@proto.ui/module-expose-state-web` and related rule optimization, and non-Web Adapters may honestly omit those peripheral Modules.

openQuestions:
  - id: M-EXPOSE-STATE-0001-Q-COMPOSITOR-IDENTITY
    question:
      zh-CN: 当未来出现更多需要转换的 outward entry 类型时，translation record compositor 是否应从 Expose State 更名或抽象为通用 projector pipeline？
      en: When more outward entry types require transformation, should the translation-record compositor be renamed from Expose State or generalized into a projector pipeline?
    context:
      zh-CN: 当前 State handle 需要在进入 Adapter 前强制降权，而 Expose Event declaration metadata 必须保留到 Adapter translation 后再从 public record 删除；Expose State 已成为 classified translation record compositor，但 package 名称难以完整表达该 ownership。
      en: State handles require mandatory attenuation before entering the Adapter, while Expose Event declaration metadata must survive through Adapter translation and then be removed from the public record; Expose State has become the classified translation-record compositor, but the package name no longer fully describes that ownership.
    blocks: [generalized-expose-projector-pipeline]
  - id: M-EXPOSE-STATE-0001-Q-REQUIRED-MODULE-VALIDATION
    question:
      zh-CN: 未来可配置 module set 应在何处拒绝缺失 Expose State 或 sink capability、却仍宣称 standard Expose support 的 Adapter？
      en: Where should a future configurable module set reject an Adapter that lacks Expose State or its sink capability while still claiming standard Expose support?
    context:
      zh-CN: 当前 Runtime 固定安装 Expose State，三个 official Adapter 均提供 sink；通用 module selection 与 support assertion 尚未实现。
      en: The current Runtime installs Expose State and all three official Adapters provide the sink; generic module selection and support assertion are not yet implemented.
    blocks: [configurable-runtime-module-selection, adapter-module-support-validation]

id: M-ANATOMY-0001
type: module
title: Anatomy owns family claims and scoped structural views
status: draft
since: 0.3.0-alpha.0
summary: Anatomy realizes family role claims, nearest-root domains, safe Expose-backed views, diagnostics and host order without owning component communication or assembly.
statement:
  en: This draft catalogs existing Anatomy semantics and their standard Runtime realization. Static family declarations belong to Core; Anatomy consumes them, depends on Expose, and delegates logical structure and host order facts to the Adapter. It does not own A11y relationships, collection interaction policy, or host materialization.
  zh-CN: 本 draft 编目已有 Anatomy 语义及其 standard Runtime 实现。静态 family 声明由 Core 定义；Anatomy 消费声明、依赖 Expose，向 Adapter 获取逻辑结构与宿主顺序事实。它不拥有 A11y relationship、collection 交互策略或宿主物化。
criteria:
  - id: M-ANATOMY-0001-A
    text:
      en: Setup claims use canonical family-token identity, one role per instance per family, and root-only profile selection. Profiles refine the baseline; diagnostics distinguish family errors from profile warnings and check asHook requirements without injecting behavior.
      zh-CN: setup claim 使用 canonical family token identity；每实例每 family 一个 role，仅 root 可选 profile。profile 收紧基线；diagnostics 区分 family error 与 profile warning，检查 asHook requirement 而不注入行为。
  - id: M-ANATOMY-0001-B
    text:
      en: Runtime queries resolve the nearest same-family root using logical ancestry and isolate nested domains. PartView exposes only role, explicit Expose reads and hook checks; callable exposes execute in the target part callback scope. Host targets remain internal.
      zh-CN: runtime query 沿逻辑祖先解析最近的同 family root，隔离嵌套 domain。PartView 仅提供 role、显式 Expose 读取与 hook 检查；可调用 expose 在目标 part callback scope 执行。host target 留在内部。
  - id: M-ANATOMY-0001-C
    text:
      en: Order queries project existing domain claims in host-comparable order, preserving input order when targets cannot be compared. Adjacency and version describe structure only; Anatomy does not add selection, focus or keyboard policy.
      zh-CN: order query 按宿主可比较顺序投影已有 domain claim，target 不可比较时保留输入顺序。相邻位置与 version 只描述结构；Anatomy 不增加 selection、focus 或键盘策略。
  - id: M-ANATOMY-0001-D
    text:
      en: subscribeParts registration and its author cancellation function are setup-only. Runtime cancellation must fail before removing the subscription. Callbacks report changed role membership/order signatures in callback scope, with no initial emission and no notification for business-data-only changes.
      zh-CN: subscribeParts 注册与其作者取消函数均为 setup-only。runtime 取消必须在移除订阅前失败。callback 在 callback scope 报告 role membership/order signature 变化，无 initial emission，纯业务数据变化不触发。
  - id: M-ANATOMY-0001-E
    text:
      en: Mixed ownership retains claims and author subscription declarations across repeatable view detach/remount, while host order observation stops on detach and resumes on mount. Terminal disposal deletes owner claims and releases its listeners and shared-observer participation. View detachment alone does not delete a logical claim.
      zh-CN: mixed ownership 跨 repeatable view detach/remount 保留 claim 与作者订阅声明，宿主顺序观察在 detach 停止、mount 恢复。terminal disposal 删除 owner claim 并释放自身 listener 与 shared observer 参与关系。view detach 本身不删除 logical claim。
  - id: M-ANATOMY-0001-F
    text:
      en: Standard Runtime installs Anatomy with Expose as a required semantic dependency. Internal domain/descendant/target ports serve downstream modules without expanding public PartView or turning Anatomy into an arbitrary instance registry.
      zh-CN: standard Runtime 安装 Anatomy，以 Expose 为必需语义依赖。内部 domain/descendant/target port 服务下游 Module，不扩大公开 PartView，也不使 Anatomy 成为任意 instance registry。

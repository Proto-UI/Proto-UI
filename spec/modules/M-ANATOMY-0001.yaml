openQuestions:
  - id: M-ANATOMY-0001-Q-DEFERRED
    question:
      en: When should family derivation, non-hook requirements or ordinary author missing-query policy be admitted?
      zh-CN: 何时接纳 family 派生、非 hook requirement 或普通作者 missing-query policy？
    context:
      en: Existing decisions keep these outside the admitted author slice. Internal tolerant reads and target/domain ports already support consumers; their existence does not admit a wider public API.
      zh-CN: 已有 decision 将这些留在本作者 slice 之外。内部 tolerant read 和 target/domain port 已服务消费者；实现存在不代表接纳更宽公开 API。
  - id: M-ANATOMY-0001-Q-TARGET
    question:
      en: What further conformance is needed for disconnected targets, target replacement and projected order across separate physical trees?
      zh-CN: disconnected target、target replacement 与跨物理树投射顺序还需哪些 conformance？
    context:
      en: The current implementation uses compareDocumentPosition and a root-subtree observer. This slice verifies ordinary Web order, missing-target fallback and lifecycle cleanup, not a universal cross-tree order or all host-view transitions.
      zh-CN: 当前实现使用 compareDocumentPosition 和 root subtree observer。本 slice 验证普通 Web 顺序、missing-target fallback 与 lifecycle cleanup，不保证通用跨树顺序或全部 host view transition。
revisions:

      en: Should runtime style writes explicitly reject readonly render scope?
      zh-CN: runtime style write 是否应显式拒绝 readonly render scope？
    context:
      en: C-FEEDBACK-STYLE-0005 leaves this policy open; this catalog does not resolve it.
      zh-CN: C-FEEDBACK-STYLE-0005 保留此策略问题；本编目不做决定。
    blocks:

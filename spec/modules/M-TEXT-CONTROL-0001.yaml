id: M-TEXT-CONTROL-0001
type: module
title: Text Control module owns line-mode-aware value reconciliation
status: draft
since: 0.2.0-rc.7
summary: The mixed-lifetime Text Control module owns stable value mode, portable line-mode-aware editing patches (single or multiline), CR/LF canonicalization, normalized callback routing, composition-safe restoration, and host lease rebinding.
satisfies:
  contracts:
    - C-TEXT-CONTROL-0001
requires:
  hostCaps:
    - HC-TEXT-CONTROL-0001
verifies:
  tests:
    - T-TEXT-CONTROL-0001
sources:
  - path: packages/modules/text-control/src/create.ts
  - path: packages/modules/text-control/src/declaration.ts
  - path: packages/modules/text-control/src/impl.ts
  - path: packages/modules/text-control/src/types.ts
revisions:
  - version: 0.2.0-rc.7
    change: revised
    summary: Adopted host-neutral static requirements and editing-session preservation.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Added the mixed-lifetime Text Control module for native multiline controls.
  - version: 0.2.0
    change: revised
    summary: >-
      Made the module line-mode-aware (single or multiline), added CR/LF canonicalization at the module boundary, and exposed single-line portable properties (inputMode, enterKeyHint, type) alongside the existing multiline properties (rows, wrap).


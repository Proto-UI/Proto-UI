id: M-A11Y-0001
type: module
title: A11y module records semantic object IR
status: draft
since: 0.1.0
summary: The a11y module provides asAccessible declarations, opaque logical identity, direct-ref transport and a separate same-domain part relationship service with bounded view leases.
criteria:
  - id: M-A11Y-0001-PART-RELATIONSHIPS
    text:
      en: Part declarations bind a protocol key to the current Anatomy claim. A11y derives the opaque domain and source role, resolves the full tuple, retains logical membership across view detach, and publishes epoch-bound relationships and bounded diagnostics. State owns mutable keys; Anatomy owns structural facts; hosts own physical identity and projection.
      zh-CN: part 声明将 protocol key 绑定到当前 Anatomy claim。A11y 推导 opaque domain 与 source role，按完整 tuple 解析，跨 view detach 保留 logical membership，并发布带 epoch 的 relationship 与有界诊断。State 拥有 mutable key，Anatomy 拥有结构事实，Host 拥有物理 identity 与投影。
satisfies:
  contracts:
    - C-A11Y-0001
    - id: C-A11Y-PART-RELATIONSHIP-0001
      since: 0.3.0-alpha.1
dependsOn:
  modules:
    - M-STATE-0001
    - id: M-ANATOMY-0001
      since: 0.3.0-alpha.1
      note: Optional for ordinary A11y declarations; structured part relationships fail closed without the current claim and opaque domain facts.
requires:
  hostCaps:
    - HC-A11Y-0001
verifies:
  tests:
    - T-A11Y-0001
    - id: T-A11Y-PART-RELATIONSHIP-0001
      since: 0.3.0-alpha.1
sources:
  - path: packages/modules/a11y/src/part-relationships.ts
  - path: packages/modules/a11y/test/part-relationships.test.ts
  - path: packages/hooks/src/as-accessible.ts
  - path: packages/modules/a11y/src/create.ts
  - path: packages/modules/a11y/src/types.ts
  - path: packages/modules/a11y/src/web.ts
  - path: packages/modules/a11y/test/web-reference.test.ts
revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added exact family/domain/role/key resolution, instance-owned observation, epoch transport and bounded projector handoff while keeping registry and host facts off the author handle.
  - version: 0.3.0-alpha.0
    change: revised
    summary: Exposed the existing instance facade through asAccessible while retaining setup guards, State observation and host projection ownership.
  - version: 0.3.0-alpha.0
    change: revised
    summary: >-
      Added portable heading-level (1-6) support. The a11y module rejects invalid setup and final-setup declarations, observes State-owned runtime values without veto or rollback, omits invalid or non-heading levels from snapshots, restores later valid projection, and delegates stale aria-level cleanup to the Web host projection.


  - version: 0.1.0
    change: introduced
    summary: Drafted the a11y module entity.
  - version: 0.3.0-alpha.0
    change: refined
    summary: Added opaque semantic-object identity, ordered direct-ref relationships, runtime relation mutation, and projector disposal without admitting the pending anatomy matcher.
tags:
  - a11y
  - accessibility
  - module

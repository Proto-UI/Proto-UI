id: M-A11Y-0001
type: module
title: A11y module records semantic object IR
status: draft
since: 0.1.0
summary: The a11y module provides the prototype author API and runtime IR storage for host-projectable accessibility semantic objects.
satisfies:
  contracts:
    - C-A11Y-0001
requires:
  hostCaps:
    - HC-A11Y-0001
verifies:
  tests:
    - T-A11Y-0001
sources:
  - path: packages/modules/a11y/src/create.ts
  - path: packages/modules/a11y/src/types.ts
  - path: packages/modules/a11y/src/web.ts
revisions:
  - version: 0.3.0-alpha.0
    change: revised
    summary: >-
      Added portable heading-level (1-6) support with fail-closed validation. The a11y module now accepts a level value and projects it as aria-level on the Web profile. Invalid levels (0, negatives, fractions, NaN, Infinity) are rejected.


  - version: 0.1.0
    change: introduced
    summary: Drafted the a11y module entity.
tags:
  - a11y
  - accessibility
  - module

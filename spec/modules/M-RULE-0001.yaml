    - C-RULE-0001
    - C-RULE-0002
    - C-RULE-0004
    - C-CORE-SYNTAX-0007
    - C-RULE-WHEN-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
    - id: C-RULE-0003
      note: Bounded to Props/State predicates with serializable values and feedback.style; Context and intent.state gaps remain.
    - id: C-RULE-RUNTIME-0001
      anchors:
        - C-RULE-RUNTIME-0001-A
        - C-RULE-RUNTIME-0001-B
        - C-RULE-RUNTIME-0001-C
        - C-RULE-RUNTIME-0001-D
dependsOn:

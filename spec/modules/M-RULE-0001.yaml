openQuestions:
  - id: M-RULE-0001-Q-CONTEXT
    question:
      en: How should Context identity serialization and reactive evaluation be completed?
      zh-CN: Context identity 序列化与响应式评估应如何补全？
    context:
      en: Current driver uses tryRead without establishing subscriptions; raw Context keys and String(key) deduplication limit identity/serialization claims. Context path remains deferred.
      zh-CN: 当前 driver 通过 tryRead 读取而不建立订阅；raw Context key 与 String(key) 去重限制 identity/serialization 声明。Context path 继续 deferred。
  - id: M-RULE-0001-Q-DEFERRED
    question:
      en: When should demand justify state intent execution or stable extension API admission?
      zh-CN: 何时由实际需求推动 state intent 执行或稳定 extension API 的接纳？
    context:
      en: intent.state remains unexecuted with live handles in IR. meta is deployed for colorScheme but evolving, not a placeholder or stable core guarantee. No new behavior is admitted here.
      zh-CN: intent.state 仍不执行且在 IR 保留 live handle。meta 已用于 colorScheme，但 API 仍演进，不是占位，也不是稳定 core 保证。本轮不接纳新行为。
revisions:
  - version: 0.3.0-alpha.0
    change: introduced
    summary: Cataloged the bounded Props/State style slice and explicit deferred limits.

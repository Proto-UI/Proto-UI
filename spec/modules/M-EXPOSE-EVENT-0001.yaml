id: M-EXPOSE-EVENT-0001
type: module
title: Expose Event outward-signal bridge module
status: draft
since: 0.1.0
summary: The required standalone Expose Event module composes Expose shared-key declarations with a host-neutral Adapter sink while remaining distinct from the User-to-Component Event channel.
statement:
  zh-CN: >-
    Expose Event 是 standard Runtime 与 official Adapter 的 required instance Module，由独立的 `@proto.ui/module-expose-event` package 与 `ExposeEventModuleDef` 承载。它硬依赖 Expose core 的只读 port，以 branded declaration 复用唯一的 shared-key registry，而不再在 Event Module 中维护第二份 outward registry；Component → App Maker signal 不得进入 User → Component Event channel。Prototype-author facade 只被 runtime 投影为 setup-only `def.expose.event` 与 runtime-only `run.expose.emit`，不产生普通 `run.event`。声明 metadata 可随 classified translation record 到达 Adapter；Adapter 必须把它翻译为 callback、framework emit、CustomEvent、message 或其它忠实 outward carrier，而不能让 metadata 成为 `getExposes()` value。实际 emission 通过 `HC-EXPOSE-EVENT-SINK-0001` 交付。当前没有独立 privileged port。


  en: >-
    Expose Event is a required instance Module for the standard Runtime and official Adapters, owned by the standalone `@proto.ui/module-expose-event` package and `ExposeEventModuleDef`. It has a hard dependency on the read-only Expose core port, reusing its single shared-key registry through branded declarations instead of keeping a second outward registry in the Event Module; Component-to-App-Maker signals must not enter the User-to-Component Event channel. The prototype-author facade is projected only as setup-only `def.expose.event` and runtime-only `run.expose.emit`, without creating an ordinary `run.event`. Declaration metadata may reach the Adapter in the classified translation record; the Adapter must translate it into a callback, framework emit, CustomEvent, message, or another faithful outward carrier rather than expose the metadata as a `getExposes()` value. Actual emissions pass through `HC-EXPOSE-EVENT-SINK-0001`. There is currently no separate privileged port.


criteria:
  - id: M-EXPOSE-EVENT-0001-A
    text:
      zh-CN: Expose Event 必须由独立 `@proto.ui/module-expose-event` package 与 ModuleDef 承载，并保持独立于 Event information channel；不得让 outward key 进入 root/global input routing。Event package 只能保留有明确 deprecation 的 source re-export 与旧 wiring target 的迁移诊断，不得继续拥有 facade implementation、registry 或 sink wiring。
      en: Expose Event must be owned by a standalone `@proto.ui/module-expose-event` package and ModuleDef and remain distinct from the Event information channel; outward keys must not enter root or global input routing. The Event package may retain explicitly deprecated source re-exports and a migration diagnostic for the old wiring target only, and must no longer own the facade implementation, registry, or sink wiring.
  - id: M-EXPOSE-EVENT-0001-B
    text:
      zh-CN: Author facade 必须由 runtime 分别投影为 setup-only `def.expose.event(key, spec?)` 与 runtime-only `run.expose.emit(key, payload?, options?)`；不得产生普通 `run.event`，当前也不得虚构独立 privileged port。
      en: The author facade must be projected by the runtime as setup-only `def.expose.event(key, spec?)` and runtime-only `run.expose.emit(key, payload?, options?)`; it must not create an ordinary `run.event`, and the current implementation must not invent a separate privileged port.
  - id: M-EXPOSE-EVENT-0001-C
    text:
      zh-CN: Declaration 必须参与 Expose core 的单一非空 string shared-key namespace 并拒绝 duplicate；用于占位和分类的 branded declaration metadata 必须保留到 Adapter translation boundary，再由 Adapter public-record projection 精确删除，结构相似的普通 author value 不得被误删。
      en: Declarations must participate in Expose core's single non-empty-string shared-key namespace and reject duplicates; branded declaration metadata used for reservation and classification must survive to the Adapter translation boundary and then be removed precisely by the Adapter's public-record projection, while structurally similar ordinary author values must not be removed.
  - id: M-EXPOSE-EVENT-0001-D
    text:
      zh-CN: Emit 必须引用当前 instance 已注册 key；invalid、duplicate 或 unregistered key 必须失败，且 validation 必须在调用 host sink 前完成。
      en: Emission must reference a key registered on the current instance; invalid, duplicate, or unregistered keys must fail, and validation must complete before the host sink is invoked.
  - id: M-EXPOSE-EVENT-0001-E
    text:
      zh-CN: "`payload?: 'void' | 'any' | 'json'` 仍只是 v0 declaration hint；Module 不得伪造尚未实现的 payload validation，`options` 也不得成为跨宿主 portable behavior 保证。"
      en: "`payload?: 'void' | 'any' | 'json'` remains only a v0 declaration hint; the Module must not claim unimplemented payload validation, and `options` must not become a cross-host portable behavior guarantee."
  - id: M-EXPOSE-EVENT-0001-F
    text:
      zh-CN: Standard Runtime 与 official Adapter profile 必须接入该 slice，并由 Adapter 以 translated capability 提供 `HC-EXPOSE-EVENT-SINK-0001`；无 sink 时 registration 与 validation 仍可工作、emit 可以 no-op，但 Adapter 不得因此宣称支持 standard outward-signal surface。
      en: The standard Runtime and official Adapter profiles must wire this slice, and the Adapter must provide `HC-EXPOSE-EVENT-SINK-0001` as a translated capability; registration and validation may still work and emission may no-op without a sink, but an Adapter must not claim the standard outward-signal surface in that state.
  - id: M-EXPOSE-EVENT-0001-G
    text:
      zh-CN: 每次合法 emit 必须只读取当前 sink 并传递 key、payload 与 opaque options；capability replacement/removal 只影响后续 emission，不得 replay、buffer 或转入 Event input dispatch。
      en: Each valid emission must read only the current sink and pass its key, payload, and opaque options; capability replacement or removal affects only later emissions and must not replay, buffer, or redirect them into Event input dispatch.
  - id: M-EXPOSE-EVENT-0001-H
    text:
      zh-CN: Expose core declaration registry 与 Expose Event emit authority 属于同一 instance lifetime，必须跨 repeatable view detach/remount 保留；terminal disposal 必须清除 core registration 并使残留 `run.expose.emit` authority 失败。Expose Event Module 不得维护可与 core registry 漂移的第二份 key map。
      en: The Expose core declaration registry and Expose Event emission authority belong to the same instance lifetime and must survive repeatable view detachment and remounting; terminal disposal must clear the core registration and make retained `run.expose.emit` authority fail. The Expose Event Module must not keep a second key map that can drift from the core registry.
  - id: M-EXPOSE-EVENT-0001-I
    text:
      zh-CN: React `onXxx`、Vue emit/listener 与 Web Component `CustomEvent` 是 profile-specific translation，不是 Module 或 host-cap 的跨宿主形状；这些 listener props 不得泄漏进 Proto raw props，signal declaration 也不得作为 record value 暴露。
      en: React `onXxx`, Vue emits or listeners, and Web Component `CustomEvent` are profile-specific translations rather than cross-host shapes of the Module or capability; those listener props must not leak into Proto raw props, and signal declarations must not be exposed as record values.

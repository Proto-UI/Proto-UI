openQuestions:
  - id: M-EXPOSE-EVENT-0001-Q-PAYLOAD-OPTIONS
    question:
      zh-CN: portable JSON validation、host-local payload escape hatch 与 options 白名单应由 Module、host-cap 还是 profile-specific contract 拥有？
      en: Should portable JSON validation, a host-local payload escape hatch, and an options allowlist belong to the Module, the host capability, or profile-specific contracts?
    context:
      zh-CN: 当前只传递 metadata hint 与 opaque options；React 忽略 options、Vue 作为第二参数传递、Web Component 把它映射到 CustomEvent init，尚无跨宿主等价性。
      en: The current implementation only carries a metadata hint and opaque options; React ignores options, Vue passes them as a second argument, and Web Component maps them into CustomEvent initialization, with no cross-host equivalence yet.
    blocks: [expose-event-payload-portability-policy]
  - id: M-EXPOSE-EVENT-0001-Q-REQUIRED-VALIDATION
    question:
      zh-CN: future configurable runtime 应在何处拒绝缺失 Expose Event sink、却适配声明了 outward signal 的 prototype 或宣称 standard support 的 Adapter？
      en: Where should a future configurable runtime reject an Adapter that lacks the Expose Event sink while adapting a prototype that declares outward signals or claiming standard support?
    context:
      zh-CN: 当前 official Adapter 均提供 sink，而缺失 cap 时 emit 为兼容性 no-op；通用 feature-use validation 尚未实现。
      en: All current official Adapters provide the sink, while emission is a compatibility no-op when the capability is absent; generic feature-use validation is not yet implemented.
    blocks: [configurable-runtime-module-selection, adapter-module-support-validation]
revisions:
  - version: 0.3.0-alpha.0
    change: revised
    summary: Extracted Expose Event into a standalone required package and ModuleDef, made Expose core the only declaration registry, moved Adapter sink wiring, and limited Event-package compatibility to deprecated source re-exports.
  - version: 0.2.0-rc.7
    change: revised
    summary: Cataloged the co-located semantic Module boundary, branded shared-key declaration through the Adapter translation boundary, host-neutral signal sink, instance lifetime, and official Adapter mappings.
  - version: 0.1.0
    change: introduced
    summary: Established the Expose Event outward-signal composition identity.
tags: [expose, event, signal, module, required, adapter, lifecycle]

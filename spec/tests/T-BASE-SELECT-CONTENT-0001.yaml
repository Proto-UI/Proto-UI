revisions:
  - version: 0.3.0-alpha.1
    change: extended
    summary: Map the current-user uniform sibling-size direction to multi-row binding and named-failure boundaries; require fresh execution and keep native geometry evidence separate.
  - version: 0.3.0-alpha.1
    change: removed
    summary: Removed the real-Content popper size gate case together with the retired match-trigger size policy; popper composition now completes on current semantics alone.
  - version: 0.2.0-rc.0
    change: introduced
    summary: Added Content listbox, focus-roving, Overlay, Transition, positioning, keyboard, typeahead, dismissal, and scope coverage.

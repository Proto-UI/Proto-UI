id: T-BASE-SELECT-CONTENT-0001
type: test
title: Base Select Content protocol tests
status: draft
since: 0.2.0-rc.0
summary: Covers listbox semantics, asFocusRoving ownership, Transition-bound Overlay presence, anchored Portal positioning, keyboard navigation, typeahead, and dismissal.
cases:
  - id: T-BASE-SELECT-CONTENT-0001-CASE-UNIFORM-ITEM-SIZE
    title: All current registered sibling rows share the Trigger size lease without changing alignment selection
    covers: [P-BASE-SELECT-CONTENT-UNIFORM-ITEM-SIZE, P-BASE-SELECT-CONTENT-CURRENT-ALIGNMENT-INTENT]
    expectation: ordered-all-row-targets-include-disabled-and-unset-keeps-enabled-alignment-without-commit
    notes:
      - Logical binding tests do not establish actual browser dimensions, RTL, zoom, wrapping, paint or four-runtime conformance.
  - id: T-BASE-SELECT-CONTENT-0001-CASE-UNIFORM-SIZE-BOUNDARY
    title: Row replacement and size failure cannot preserve stale all-row delivery or silently choose popper
    covers: [P-BASE-SELECT-CONTENT-UNIFORM-ITEM-SIZE, P-BASE-SELECT-CONTENT-PRESENTATION-ADMISSION]
    expectation: old-target-lease-retires-and-host-size-conflict-remains-named-unavailability
    notes:
      - A supplied unavailable callback verifies consumer handling, not actual long-label overflow detection by a native host.
  - id: T-BASE-SELECT-CONTENT-0001-CASE-ALIGNMENT-ADMISSION
    title: One Content owner separates logical open from complete composition presentation
    covers:
      [P-BASE-SELECT-CONTENT-PRESENTATION-ADMISSION, P-BASE-SELECT-CONTENT-CURRENT-ALIGNMENT-INTENT]
    expectation: complete-composition-releases-only-current-request-and-invalid-structure-aborts-without-changing-root
  - id: T-BASE-SELECT-CONTENT-0001-CASE-A11Y-FOCUS
    title: Content is a vertical listbox with selected-or-boundary focus entry
    covers:
      [
        P-BASE-SELECT-CONTENT-AUTHORING-ENTRIES,
        P-BASE-SELECT-CONTENT-A11Y,
        P-BASE-SELECT-CONTENT-FOCUS-ROVING,
      ]
    expectation: select-content-listbox-entry-and-navigation-are-owned-by-as-focus-roving
  - id: T-BASE-SELECT-CONTENT-0001-CASE-ENTRY-STABILITY
    title: Selected-option entry waits for a stable synchronously mounted collection across adapters
    covers: [P-BASE-SELECT-CONTENT-A11Y, P-BASE-SELECT-CONTENT-FOCUS-ROVING]
    expectation: select-entry-focus-never-falls-back-before-the-current-item-mount-turn-stabilizes
  - id: T-BASE-SELECT-CONTENT-0001-CASE-PRESENCE-POSITION
    title: Content retains leave view and portals a collision-aware Trigger-anchored surface
    covers: [P-BASE-SELECT-CONTENT-OVERLAY-PRESENCE, P-BASE-SELECT-CONTENT-POSITION]
    expectation: select-content-transition-is-the-only-positioned-overlay-presence-driver
  - id: T-BASE-SELECT-CONTENT-0001-CASE-CONTROLLED-PRESENCE
    title: Refused controlled close never drives transient presence or a new focus entry
    covers: [P-BASE-SELECT-CONTENT-OVERLAY-PRESENCE]
    expectation: committed-root-open-is-the-only-presence-authority
  - id: T-BASE-SELECT-CONTENT-0001-CASE-KEYBOARD
    title: Keyboard movement, boundaries, commit, and runtime-delayed typeahead skip disabled options
    covers: [P-BASE-SELECT-CONTENT-KEYBOARD]
    expectation: select-listbox-keyboard-navigation-and-typeahead-skip-disabled-options
  - id: T-BASE-SELECT-CONTENT-0001-CASE-DISMISS
    title: Escape, Tab including deferred Trigger focus, outside press, and Trigger boundary behavior preserve or commit selection correctly
    covers: [P-BASE-SELECT-CONTENT-DISMISS, P-BASE-SELECT-CONTENT-DEFERRED-SURFACES]
    expectation: select-dismiss-paths-close-once-without-accidental-selection
implementations:

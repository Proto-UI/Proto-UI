id: T-BASE-HOVER-CARD-CONTENT-0001
type: test
title: Base Hover Card Content protocol tests
status: draft
since: 0.2.0-rc.0
summary: Covers Content non-modal Overlay behavior, Transition presence, hover bridge, Trigger anchoring, collision-aware positioning, Portal escape, and deferred extension boundaries.
cases:
  - id: T-BASE-HOVER-CARD-CONTENT-0001-CASE-PRESENCE
    title: Content retains leave view through Transition-bound Overlay presence
    covers:
      - P-BASE-HOVER-CARD-CONTENT-AUTHORING-ENTRIES
      - P-BASE-HOVER-CARD-CONTENT-SURFACE
      - P-BASE-HOVER-CARD-CONTENT-OVERLAY
      - P-BASE-HOVER-CARD-CONTENT-PRESENCE
      - P-BASE-HOVER-CARD-CONTENT-NON-MODAL
    expectation: hover-card-content-retains-leave-view-without-modal-focus-behavior
  - id: T-BASE-HOVER-CARD-CONTENT-0001-CASE-HOVER-BRIDGE
    title: Content hover bridges movement from Trigger until close delay
    covers: [P-BASE-HOVER-CARD-CONTENT-HOVER-BRIDGE]
    expectation: content-hover-keeps-hover-card-open-after-trigger-leave
  - id: T-BASE-HOVER-CARD-CONTENT-0001-CASE-POSITION
    title: Content supports side, alignment, offsets, collision policy, and resolved host projection
    covers:
      - P-BASE-HOVER-CARD-CONTENT-POSITION
      - P-BASE-HOVER-CARD-CONTENT-ANCHOR
      - P-BASE-HOVER-CARD-CONTENT-COLLISION
      - P-BASE-HOVER-CARD-CONTENT-PORTAL
      - P-BASE-HOVER-CARD-CONTENT-DEFERRED-EXTENSIONS
    expectation: hover-card-content-portals-and-positions-from-trigger-with-collision-policy
  - id: T-BASE-HOVER-CARD-CONTENT-0001-CASE-LIFECYCLE
    title: View-generation withdrawal preserves owner, replacement, and request boundaries
    covers: [P-BASE-HOVER-CARD-CONTENT-INTERACTION-LIFETIME]
    expectation: With openDelay=0 and closeDelay=20, enter Trigger, enter Content, leave Trigger, and remove Content without pointerleave. Root remains open at 19ms and closes at 20ms. Repeat with actual retained L1 unmount/remount and terminal replacement; neither remount replays hover, and an old ID cannot release a new contribution. A still-hovered Trigger independently keeps Root open.
implementations:
  - id: prototypes-base-hover-card-content-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/hover-card.test.ts
    required: true
    consumesCases:
      - T-BASE-HOVER-CARD-CONTENT-0001-CASE-PRESENCE
      - T-BASE-HOVER-CARD-CONTENT-0001-CASE-HOVER-BRIDGE
      - T-BASE-HOVER-CARD-CONTENT-0001-CASE-POSITION
    exercises: [P-BASE-HOVER-CARD-CONTENT]
  - id: prototypes-shadcn-hover-card-content-composition
    kind: module-test
    status: passing
    path: packages/prototypes/shadcn/test/hover-card.test.ts
    required: true
    consumesCases:
      - T-BASE-HOVER-CARD-CONTENT-0001-CASE-PRESENCE
      - T-BASE-HOVER-CARD-CONTENT-0001-CASE-HOVER-BRIDGE
      - T-BASE-HOVER-CARD-CONTENT-0001-CASE-POSITION
    exercises: [P-BASE-HOVER-CARD-CONTENT]
  - id: prototypes-base-hover-card-content-lifecycle-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/hover-card-lifecycle.test.ts
    required: true
    consumesCases: [T-BASE-HOVER-CARD-CONTENT-0001-CASE-LIFECYCLE]
    exercises: [P-BASE-HOVER-CARD-CONTENT]
verifies:
  prototypes:
    - id: P-BASE-HOVER-CARD-CONTENT
      anchors:
        - P-BASE-HOVER-CARD-CONTENT-OVERLAY
        - P-BASE-HOVER-CARD-CONTENT-PRESENCE

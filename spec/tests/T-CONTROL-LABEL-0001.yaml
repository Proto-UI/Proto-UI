id: T-CONTROL-LABEL-0001
type: test
title: Control Label identity, ownership, lowering and Adapter evidence
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: The explicit bounded association direction has owning-layer and Web Adapter harness evidence. Stable admission remains blocked on independent review, complete native input/lifetime and assistive-technology evidence.
summary: Executable evidence is separated into portable ownership, synthetic host integration, compiler and real browser admission.
cases:
  - id: T-CONTROL-LABEL-0001-CASE-GPUI-COMPILED
    title: Unchanged native Button, Toggle and Label share nominal references and current pair leases
    covers:
      - C-CONTROL-LABEL-0001-GPUI-IDENTITY
      - C-CONTROL-LABEL-0001-GPUI-LEASE
      - M-CONTROL-LABEL-0001-GPUI
      - HC-CONTROL-LABEL-0001-GPUI
      - HC-CONTROL-LABEL-0001-GPUI-OPAQUE-CHILD
      - C-CONTROL-LABEL-0001-NAME
      - C-CONTROL-LABEL-0001-ACTIVATION
      - C-CONTROL-LABEL-0001-FOCUS
    expectation: The complete unchanged Base Button, Toggle and Label sources pass compileFile and are consumed as separate crates sharing one native SDK. Actual native framework consumers cover typed identity and undeclared recipients, current rendered Label naming, exactly-once target activation, disabled and controlled ownership, author name preservation, duplicate arbitration in both orders, foreign scopes, replacement, detach/remount, disposal and invalidated callback work. Final pointer samples, cancellation and nested opaque input retain negative controls. Anatomy and nonportable transport stay explicit unsupported states. Source-bound platform receipts distinguish this compiled execution from Adapter PNGs and physical OS or assistive-technology acceptance.
  - id: T-CONTROL-LABEL-0001-CASE-PRIVATE-SSR
    title: Private client-only hydration preserves dormant server declarations and real client pairs
    covers:
      - C-CONTROL-LABEL-0001-LOWERING
      - C-CONTROL-LABEL-0001-BOUNDS
      - C-CONTROL-LABEL-0001-INTEROP
      - C-CONTROL-LABEL-0001-NAME
      - C-CONTROL-LABEL-0001-ACTIVATION
    expectation: The explicit private Web Component client-only experiment retains unpaired server Button behavior and the original first frame, then uses the real emitted ControlLabel helper and dedicated client input for hydration pairing and rebinding. Server Props, options, markup and carriers cannot transport association identities, and implicit Anatomy pairing remains diagnosed. Public SSR profiles and direct SSR without this private option retain their existing unsupported boundary.
  - id: T-CONTROL-LABEL-0001-CASE-COMPILED-ADMISSION
    title: Actual Button, Toggle and Label definitions produce checked standalone Web source
    covers:
      - C-CONTROL-LABEL-0001-LOWERING
      - C-CONTROL-LABEL-0001-BOUNDS
    expectation: The complete official Button, Toggle and Label sources compile through all four Web profiles and every reached generated source file passes strict checking against real host declarations. IR schema 6 rejects old schema 5 inputs. Existing unsupported Toggle Group Root and Item language is diagnosed explicitly and is not counted as successful component lowering.
  - id: T-CONTROL-LABEL-0001-CASE-COMPILED-CONSUMER
    title: Independent generated graphs and Runtime Adapters share public references and target ownership
    covers:
      - C-CONTROL-LABEL-0001-IDENTITY
      - C-CONTROL-LABEL-0001-INTEROP
      - C-CONTROL-LABEL-0001-NAME-INTEROP
      - C-CONTROL-LABEL-0001-DOMAIN
      - C-CONTROL-LABEL-0001-NAME
      - C-CONTROL-LABEL-0001-ACTIVATION
      - C-CONTROL-LABEL-0001-FOCUS
      - C-CONTROL-LABEL-0001-OWNED-NAME
      - P-BASE-BUTTON-EXTERNAL-LABEL
      - P-BASE-TOGGLE-EXTERNAL-LABEL
      - P-BASE-LABEL-ACTION
    expectation: Ordinary generated imports and the public factory connect actual Label to Button or Toggle across independent output directories and both mixed Runtime directions. Naming, single activation, disabled and controlled ownership, public focus and pressed state, reference replacement, focus reentry and disposal remain observable through the consumer interface. Distinct references never pair by position; ordinary Vue2 Observer metadata is accepted without admitting forged metadata or unknown keys.
  - id: T-CONTROL-LABEL-0001-CASE-COMPILED-NATIVE
    title: Actual generated and mixed Runtime consumers retain browser input and accessible naming
    covers:
      - C-CONTROL-LABEL-0001-INPUT
      - C-CONTROL-LABEL-0001-NAME
      - C-CONTROL-LABEL-0001-ACTIVATION
      - C-CONTROL-LABEL-0001-FOCUS
      - C-CONTROL-LABEL-0001-WEB
      - P-BASE-BUTTON-EXTERNAL-LABEL
      - P-BASE-TOGGLE-EXTERNAL-LABEL
    expectation: Normal sandboxed Chromium pointer and keyboard input reaches the same target operation exactly once, preserves browser-computed naming and disabled or controlled ownership, and rejects a retired focus-reentry request. The bounded four-profile Button and Toggle matrix records source and generated hashes; collection or bundling alone does not satisfy native execution.
  - id: T-CONTROL-LABEL-0001-CASE-INTEROP
    title: Compatible implementation copies share exact nominal admission and one pair domain
    covers:
      - C-CONTROL-LABEL-0001-INTEROP
      - M-CONTROL-LABEL-0001-INTEROP
    expectation: factory-references-cross-module-copies-with-shared-duplicate-arbitration-and-current-owner-routing
  - id: T-CONTROL-LABEL-0001-CASE-NAME-INTEROP
    title: Target-owned naming translates the current foreign Label view and retains generated IDs
    covers:
      - C-CONTROL-LABEL-0001-NAME-INTEROP
      - C-CONTROL-LABEL-0001-NAME
      - C-CONTROL-LABEL-0001-OWNED-NAME
    expectation: real-label-idref-with-exact-local-reuse-ambiguous-view-rejection-and-cross-implementation-id-lifetime
  - id: T-CONTROL-LABEL-0001-CASE-IDENTITY
    title: Opaque identity and explicit channel preserve JSON Props
    covers:
      - C-CONTROL-LABEL-0001-IDENTITY
      - C-CONTROL-LABEL-0001-LOWERING
      - A-WEB-COMPONENT-0001-CONTROL-LABEL
      - A-REACT-18-19-0001-CONTROL-LABEL
      - A-VUE-3-0001-CONTROL-LABEL
      - A-VUE-2-0001-CONTROL-LABEL
    expectation: only-factory-reference-through-separate-typed-input
  - id: T-CONTROL-LABEL-0001-CASE-PAIR
    title: Pair domain uniqueness and exact lifetime guards
    covers:
      - C-CONTROL-LABEL-0001-DOMAIN
      - C-CONTROL-LABEL-0001-UNIQUENESS
      - C-CONTROL-LABEL-0001-OWNED-NAME
      - M-CONTROL-LABEL-0001-PAIR
      - M-CONTROL-LABEL-0001-LEASE
      - HC-CONTROL-LABEL-0001-VIEW
    expectation: one-current-pair-with-stale-owner-rejection
  - id: T-CONTROL-LABEL-0001-CASE-INPUT
    title: Pointer and trusted non-pointer eligibility retain synchronous cancellation boundary
    covers:
      - C-CONTROL-LABEL-0001-INPUT
      - HC-CONTROL-LABEL-0001-INPUT
    expectation: eligible-label-request-only
  - id: T-CONTROL-LABEL-0001-CASE-TARGETS
    title: Associated targets retain naming, disabled, controlled and focus ownership
    covers:
      - C-CONTROL-LABEL-0001-NAME
      - C-CONTROL-LABEL-0001-ACTIVATION
      - C-CONTROL-LABEL-0001-FOCUS
      - P-BASE-CHECKBOX-EXTERNAL-LABEL
      - P-BASE-SWITCH-EXTERNAL-LABEL
      - P-BASE-RADIO-GROUP-ITEM-EXTERNAL-LABEL
      - P-BASE-INPUT-EXTERNAL-LABEL
      - P-BASE-TEXTAREA-EXTERNAL-LABEL
      - P-BASE-BUTTON-EXTERNAL-LABEL
      - P-BASE-TOGGLE-EXTERNAL-LABEL
      - P-BASE-TOGGLE-GROUP-EXTERNAL-LABEL
      - M-CONTROL-LABEL-0001-REQUEST
      - M-CONTROL-LABEL-0001-NAME
      - HC-CONTROL-LABEL-0001-CALLBACK
      - HC-CONTROL-LABEL-0001-ACTION-PROJECTION
    expectation: shared-target-operation-with-independent-naming
  - id: T-CONTROL-LABEL-0001-CASE-COMPILER
    title: Explicit workspace/private-source and host support boundaries
    covers:
      - C-CONTROL-LABEL-0001-LOWERING
      - C-CONTROL-LABEL-0001-BOUNDS
    expectation: four-web-facades-and-explicit-unsupported-installation
  - id: T-CONTROL-LABEL-0001-CASE-NATIVE
    title: Real pointer, keyboard, focus and selectable-description behavior
    covers:
      - C-CONTROL-LABEL-0001-INPUT
      - C-CONTROL-LABEL-0001-CONTENT
      - C-CONTROL-LABEL-0001-WEB
    expectation: source-bound-native-browser-evidence-not-inferred-from-harness
  - id: T-CONTROL-LABEL-0001-CASE-PROJECTIONS
    title: Independent Base Label and four declared style projections
    covers:
      - P-BASE-LABEL-ENTRIES
      - P-BASE-LABEL-OPTIONS
      - P-BASE-LABEL-CONTENT
      - P-BASE-LABEL-ACTION
      - P-SHADCN-LABEL-INHERITANCE
      - P-SHADCN-LABEL-STYLE
      - P-SHADCN-LABEL-CONSUMPTION
      - P-BRUTALIST-LABEL-INHERITANCE
      - P-BRUTALIST-LABEL-STYLE
      - P-BRUTALIST-LABEL-CONSUMPTION
      - P-BOOTSTRAP-2-3-2-LABEL-INHERITANCE
      - P-BOOTSTRAP-2-3-2-LABEL-STYLE
      - P-BOOTSTRAP-2-3-2-LABEL-CONSUMPTION
      - P-LIQUID-GLASS-LABEL-INHERITANCE
      - P-LIQUID-GLASS-LABEL-STYLE
      - P-LIQUID-GLASS-LABEL-CONSUMPTION
    expectation: All five Label families inherit default-on activation; explicit false is naming-only, re-enabling and Prop removal restore activation, and unpaired labels never discover a target.
  - id: T-CONTROL-LABEL-0001-CASE-ANATOMY
    title: Module-owned nearest-root pairing uses the real Label input guard
    covers:
      - C-CONTROL-LABEL-0001-ANATOMY
    expectation: Nested scope isolation, missing/duplicate targets, moved ancestry and in-flight pointer turn, drag/cancel/modified/nested input, prevented click and text selection, reentrant disable and explicit association conflict are independently asserted.
  - id: T-CONTROL-LABEL-0001-CASE-SELECTION
    title: Explicit label text-selection policy defaults and overrides
    covers:
      - C-CONTROL-LABEL-0001-CONTENT
      - C-CONTENT-SELECTION-AFFORDANCE-0001-LABELS
      - P-BASE-LABEL-OPTIONS
      - P-BASE-LABEL-ACTION
    expectation: >-
      The 'policy' default derives select-none only from actionable labels, explicit auto/text/none override in both directions, removal restores the derived default, and no second selection state machine appears.



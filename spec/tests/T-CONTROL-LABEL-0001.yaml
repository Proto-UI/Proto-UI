id: T-CONTROL-LABEL-0001
type: test
title: Control Label identity, ownership, lowering and Adapter evidence
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: The explicit bounded association direction has owning-layer and Web Adapter harness evidence. Stable admission remains blocked on independent review, complete native input/lifetime and assistive-technology evidence.
summary: Executable evidence is separated into portable ownership, synthetic host integration, compiler and real browser admission.
cases:
  - id: T-CONTROL-LABEL-0001-CASE-IDENTITY
    title: Opaque identity and explicit channel preserve JSON Props
    covers:
      - C-CONTROL-LABEL-0001-IDENTITY
      - C-CONTROL-LABEL-0001-LOWERING
      - A-WEB-COMPONENT-0001-CONTROL-LABEL
      - A-REACT-18-19-0001-CONTROL-LABEL
      - A-VUE-3-0001-CONTROL-LABEL
      - A-VUE-2-0001-CONTROL-LABEL
    expectation: only-factory-reference-through-separate-typed-input
  - id: T-CONTROL-LABEL-0001-CASE-PAIR
    title: Pair domain uniqueness and exact lifetime guards
    covers:
      - C-CONTROL-LABEL-0001-DOMAIN
      - C-CONTROL-LABEL-0001-UNIQUENESS
      - C-CONTROL-LABEL-0001-OWNED-NAME
      - M-CONTROL-LABEL-0001-PAIR
      - M-CONTROL-LABEL-0001-LEASE
      - HC-CONTROL-LABEL-0001-VIEW
    expectation: one-current-pair-with-stale-owner-rejection
  - id: T-CONTROL-LABEL-0001-CASE-INPUT
    title: Pointer and trusted non-pointer eligibility retain synchronous cancellation boundary
    covers:
      - C-CONTROL-LABEL-0001-INPUT
      - HC-CONTROL-LABEL-0001-INPUT
    expectation: eligible-label-request-only
  - id: T-CONTROL-LABEL-0001-CASE-TARGETS
    title: Associated targets retain naming, disabled, controlled and focus ownership
    covers:
      - C-CONTROL-LABEL-0001-NAME
      - C-CONTROL-LABEL-0001-ACTIVATION
      - C-CONTROL-LABEL-0001-FOCUS
      - P-BASE-CHECKBOX-EXTERNAL-LABEL
      - P-BASE-SWITCH-EXTERNAL-LABEL
      - P-BASE-RADIO-GROUP-ITEM-EXTERNAL-LABEL
      - P-BASE-INPUT-EXTERNAL-LABEL
      - P-BASE-TEXTAREA-EXTERNAL-LABEL
      - M-CONTROL-LABEL-0001-REQUEST
      - M-CONTROL-LABEL-0001-NAME
      - HC-CONTROL-LABEL-0001-CALLBACK
      - HC-CONTROL-LABEL-0001-ACTION-PROJECTION
    expectation: shared-target-operation-with-independent-naming
  - id: T-CONTROL-LABEL-0001-CASE-COMPILER
    title: Explicit workspace/private-source and host support boundaries
    covers:
      - C-CONTROL-LABEL-0001-LOWERING
      - C-CONTROL-LABEL-0001-BOUNDS
    expectation: four-web-facades-and-explicit-unsupported-installation
  - id: T-CONTROL-LABEL-0001-CASE-NATIVE
    title: Real pointer, keyboard, focus and selectable-description behavior
    covers:
      - C-CONTROL-LABEL-0001-INPUT
      - C-CONTROL-LABEL-0001-CONTENT
      - C-CONTROL-LABEL-0001-WEB
    expectation: source-bound-native-browser-evidence-not-inferred-from-harness
  - id: T-CONTROL-LABEL-0001-CASE-PROJECTIONS
    title: Independent Base Label and four declared style projections
    covers:
      - P-BASE-LABEL-ENTRIES
      - P-BASE-LABEL-OPTIONS
      - P-BASE-LABEL-CONTENT
      - P-BASE-LABEL-ACTION
      - P-SHADCN-LABEL-INHERITANCE
      - P-SHADCN-LABEL-STYLE
      - P-SHADCN-LABEL-CONSUMPTION
      - P-BRUTALIST-LABEL-INHERITANCE
      - P-BRUTALIST-LABEL-STYLE
      - P-BRUTALIST-LABEL-CONSUMPTION
      - P-BOOTSTRAP-2-3-2-LABEL-INHERITANCE
      - P-BOOTSTRAP-2-3-2-LABEL-STYLE
      - P-BOOTSTRAP-2-3-2-LABEL-CONSUMPTION
      - P-LIQUID-GLASS-LABEL-INHERITANCE
      - P-LIQUID-GLASS-LABEL-STYLE
      - P-LIQUID-GLASS-LABEL-CONSUMPTION
    expectation: public-family-projection-of-one-independent-base-protocol

id: T-LIFECYCLE-0003
type: test
title: Epoch-aware lifecycle event trace tests
status: draft
since: 0.1.0
summary: Runtime and adapter tests verify structured lifecycle events, repeated mount epochs, update revisions, and deprecated checkpoint projection.
cases:
  - id: T-LIFECYCLE-0003-CASE-INSTANCE-EVENTS
    title: Instance setup, created, disposing, and disposed events are ordered once
    covers:
      - C-LIFECYCLE-0004-A
    expectation: instance-events-occur-once-in-order
  - id: T-LIFECYCLE-0003-CASE-MOUNT-EPOCHS
    title: Repeated mounts carry monotonically increasing epochs
    covers:
      - C-LIFECYCLE-0004-B
      - C-LIFECYCLE-0006-C
    expectation: repeated-mount-events-carry-monotonic-epochs
  - id: T-LIFECYCLE-0003-CASE-UPDATE-REVISION
    title: Update render, commit completion, and updated share an epoch and revision
    covers:
      - C-LIFECYCLE-0004-C
    expectation: update-events-ordered-by-epoch-and-revision
  - id: T-LIFECYCLE-0003-CASE-STALE-COMPLETION
    title: Stale async completion cannot advance a newer epoch
    covers:
      - C-LIFECYCLE-0004-D
    expectation: stale-epoch-completion-is-ignored
  - id: T-LIFECYCLE-0003-CASE-LEGACY-PROJECTION
    title: CP0-CP10 remains only a deprecated lossy compatibility projection
    covers:
      - C-LIFECYCLE-0004-F
    expectation: structured-events-project-to-legacy-checkpoints-without-governing-state
  - id: T-LIFECYCLE-0003-CASE-ADAPTER-EVENT-TRACE
    title: Official adapters expose structured lifecycle conformance events
    covers:
      - C-LIFECYCLE-0004-E
    expectation: official-adapters-emit-epoch-aware-events
implementations:
  - id: runtime-repeatable-lifecycle-events
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/lifecycle.session.v1.contract.test.ts
    required: true
    consumesCases:
      - T-LIFECYCLE-0003-CASE-INSTANCE-EVENTS
      - T-LIFECYCLE-0003-CASE-MOUNT-EPOCHS
      - T-LIFECYCLE-0003-CASE-STALE-COMPLETION
  - id: runtime-legacy-checkpoint-projection
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/lifecycle.checkpoints.v0.contract.test.ts
    required: false
    consumesCases:
      - T-LIFECYCLE-0003-CASE-LEGACY-PROJECTION
    notes:
      - Legacy CP tests remain during migration but no longer define the lifecycle source of truth.
  - id: adapter-react-lifecycle-events
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/contract/lifecycle-events.v1.contract.test.ts
    required: true
    consumesCases:
      - T-LIFECYCLE-0003-CASE-UPDATE-REVISION
      - T-LIFECYCLE-0003-CASE-ADAPTER-EVENT-TRACE
  - id: adapter-vue-lifecycle-events
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/contract/lifecycle-events.v1.contract.test.ts
    required: true
    consumesCases:
      - T-LIFECYCLE-0003-CASE-UPDATE-REVISION
      - T-LIFECYCLE-0003-CASE-ADAPTER-EVENT-TRACE
  - id: adapter-vue2-lifecycle-events
    kind: adapter-test
    status: passing
    path: packages/adapters/vue2/test/lifecycle.test.ts
    required: true
    consumesCases:
      - T-LIFECYCLE-0003-CASE-ADAPTER-EVENT-TRACE
  - id: adapter-web-component-lifecycle-events
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/contract/lifecycle-events.v1.contract.test.ts
    required: true
    consumesCases:
      - T-LIFECYCLE-0003-CASE-UPDATE-REVISION
      - T-LIFECYCLE-0003-CASE-ADAPTER-EVENT-TRACE
verifies:
  contracts:
    - id: C-LIFECYCLE-0004
      anchors:
        - C-LIFECYCLE-0004-A
        - C-LIFECYCLE-0004-B
        - C-LIFECYCLE-0004-C
        - C-LIFECYCLE-0004-D
        - C-LIFECYCLE-0004-E
        - C-LIFECYCLE-0004-F
  adapters:
    - id: A-REACT-18-19-0001
      since: 0.2.0-rc.7
      anchors:
        - A-REACT-18-19-0001-H
    - id: A-VUE-3-0001
      since: 0.2.0-rc.7
      anchors:
        - A-VUE-3-0001-H
    - id: A-VUE-2-0001
      since: 0.3.0-alpha.0
      anchors:
        - A-VUE-2-0001-H
    - id: A-WEB-COMPONENT-0001
      since: 0.2.0-rc.7
      anchors:
        - A-WEB-COMPONENT-0001-H
revisions:
  - version: 0.3.0-alpha.0
    change: strengthened
    summary: Bound the update-revision case to the React, Vue, and Web Component lifecycle-events tests, which already assert a shared epoch and revision.
  - version: 0.3.0-alpha.0
    change: implemented
    summary: Added structured lifecycle event evidence for the official Vue 2 Adapter.
  - version: 0.2.0-rc.7
    change: implemented
    summary: Added structured lifecycle event trace coverage for all three official Adapter profiles.
  - version: 0.1.0
    change: introduced
    summary: Added original CP0-CP10 checkpoint conformance coverage.
  - version: 0.1.0
    change: breaking
    summary: Replaced checkpoint source-of-truth coverage with epoch-aware lifecycle event traces.
tags:
  - lifecycle
  - event
  - epoch
  - runtime
  - adapter

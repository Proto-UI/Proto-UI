id: T-AS-HOOK-0002
type: test
title: asHook result, captured effects, and state projection tests
status: draft
since: 0.1.0
summary: Runtime tests for caller-owned captured effects, setup-only disposers, artifacts, render fragments, expose captures, rule captures, and borrowed state projection.
cases:
  - id: T-AS-HOOK-0002-CASE-CALLER-EFFECTS
    title: asHook setup effects attach to the caller prototype and follow module-owned semantics
    covers:
      - C-AS-HOOK-0005-A
      - C-AS-HOOK-0005-B
      - C-AS-HOOK-0005-C
      - C-AS-HOOK-0005-D
    expectation: caller-owned-captured-effects
  - id: T-AS-HOOK-0002-CASE-RESULT-ARTIFACTS
    title: AsHookResult exposes handles, artifacts, methods, event keys, child asHook entries, and render fragments
    covers:
      - C-AS-HOOK-0006-A
      - C-AS-HOOK-0006-E
      - C-AS-HOOK-0006-F
    expectation: as-hook-result-artifacts
  - id: T-AS-HOOK-0002-CASE-SETUP-DISPOSERS
    title: Captured setup-effect disposers are exposed but remain setup-only
    covers:
      - C-AS-HOOK-0006-B
      - C-AS-HOOK-0006-C
      - C-AS-HOOK-0006-D
    expectation: setup-only-captured-disposers
  - id: T-AS-HOOK-0002-CASE-BORROWED-STATE
    title: State handles exposed by asHook are borrowed views and can drive rule evaluation
    covers:
      - C-AS-HOOK-0007-A
      - C-AS-HOOK-0007-B
      - C-AS-HOOK-0007-C
      - C-AS-HOOK-0007-D
      - C-AS-HOOK-0007-E
      - C-AS-HOOK-0007-F
      - C-AS-HOOK-0007-G
    expectation: borrowed-state-projection
  - id: T-AS-HOOK-0002-CASE-NESTED-RESULT
    title: Nested asHook state handles are preserved under child asHook entries and not flattened into outer stateHandles
    covers:
      - C-AS-HOOK-0006-A
      - C-AS-HOOK-0006-F
      - C-AS-HOOK-0007-H
    expectation: nested-as-hook-result-not-flattened
implementations:
  - id: compiler-public-capture-runtime
    kind: runtime-test
    status: missing
    required: true
    consumesCases:
      [
        T-AS-HOOK-0002-CASE-CALLER-EFFECTS,
        T-AS-HOOK-0002-CASE-RESULT-ARTIFACTS,
        T-AS-HOOK-0002-CASE-SETUP-DISPOSERS,
        T-AS-HOOK-0002-CASE-NESTED-RESULT,
      ]
    notes:
      - "Retired with the old compiler at the 0.4 foundation: packages/compiler/test/capture-facade-runtime.test.ts (historical source 67fd94f58372cf35fa929f24ef731416b5817e31). Earlier results are historical only; independent replacement evidence is missing."
      - Actual React, Vue 3, Vue 2 and Web Component consumers retain shared public references and execute real event unsubscribe tokens. Internal receipt bucket layout remains opaque.
  - id: generated-native-capture-artifacts
    kind: runtime-test
    status: missing
    required: true
    consumesCases: [T-AS-HOOK-0002-CASE-RESULT-ARTIFACTS, T-AS-HOOK-0002-CASE-NESTED-RESULT]
    notes:
      - "Retired with the old compiler at the 0.4 foundation: packages/compiler/test/fixtures/gpui-ordinary-values/capture_facade.rs (historical source 67fd94f58372cf35fa929f24ef731416b5817e31). Earlier results are historical only; independent replacement evidence is missing."
      - Actual native mount, rendered text, emitted events, retained callable lifetime and per-owner isolation are separate from compiler acceptance.
  - id: runtime-as-hook-result-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/as-hook.v0.contract.test.ts
    required: true
    consumesCases:
      - T-AS-HOOK-0002-CASE-CALLER-EFFECTS
      - T-AS-HOOK-0002-CASE-RESULT-ARTIFACTS
      - T-AS-HOOK-0002-CASE-SETUP-DISPOSERS
      - T-AS-HOOK-0002-CASE-BORROWED-STATE
      - T-AS-HOOK-0002-CASE-NESTED-RESULT

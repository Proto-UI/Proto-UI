        P-SHADCN-SELECT-TRIGGER-COMPATIBILITY-SUBSET,
        P-SHADCN-SELECT-TRIGGER-AS-CHILD-OMISSION,
      ]
    expectation: shadcn-select-trigger-current-combobox-surface-with-adapter-press-feedback
  - id: T-SHADCN-SELECT-TRIGGER-0001-CASE-GHOST
    title: Ghost presentation and default restoration preserve inherited command ownership
    covers:
      - P-SHADCN-SELECT-TRIGGER-APPEARANCE

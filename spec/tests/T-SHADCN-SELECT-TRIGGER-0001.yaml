id: T-SHADCN-SELECT-TRIGGER-0001
type: test
title: Shadcn Select Trigger delta protocol contract tests
status: draft
since: 0.2.0-rc.0
summary: Covers Trigger Base inheritance, size, state styles including Adapter-projected one-pixel press feedback, chevron, asChild omission, and bounded parity.
cases:
  - id: T-SHADCN-SELECT-TRIGGER-0001-CASE-CURRENT-PROTOCOL
    title: Trigger inherits combobox behavior and projects current size, state, one-pixel press, and chevron surface
    covers:
      [
        P-SHADCN-SELECT-TRIGGER-UPSTREAM-IDENTITY,
        P-SHADCN-SELECT-TRIGGER-BASE-INHERITANCE,
        P-SHADCN-SELECT-TRIGGER-CURRENT-BASE-DEVIATIONS,

revisions:
  - version: 0.3.0-alpha.2
    change: strengthened
    summary: Bind native TextRun and selection projection to real AccessKit consumer execution while retaining separate OS accessibility and geometry acceptance.
  - version: 0.3.0-alpha.2
    change: strengthened
    summary: Map cold-hover ownership, post-failure native output delivery and focused legacy selection notification to real generated consumers without promoting platform acceptance.
  - version: 0.3.0-alpha.2
    change: strengthened
    summary: Bind native sequential default-action evidence to existing Focus participation, scope trapping and editing-session criteria without changing their draft lifecycle.
  - version: 0.3.0-alpha.2
    change: introduced
    summary: Bind source admission and native execution to generic activation, applicability, scalar and editing-lease criteria.

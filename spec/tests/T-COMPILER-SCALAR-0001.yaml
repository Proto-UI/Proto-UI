id: T-COMPILER-SCALAR-0001
type: test
title: Checked scalar admission and independent generated consumers
status: removed
since: 0.3.0-alpha.2
removedSince: 0.4.0
replacedBy: T-COMPILER-FOUNDATION-0001
lifecycleRationale: >-
  Retired for the new 0.4 compiler by the maintainer-selected foundation decision.
  This identity and prior criteria remain historical; old implementation, source
  admission, artifacts and results impose no compatibility or correctness
  obligation on the new language. The replacement has no executed evidence yet.


cases:
  - id: T-COMPILER-SCALAR-0001-CASE-ADMISSION
    title: Checked scalar forms lower in each declared source profile
    covers:
      [
        C-COMPILER-SCALAR-0001-BINDING,
        C-COMPILER-SCALAR-0001-NUMBER,
        C-COMPILER-SCALAR-0001-STRING,
        C-COMPILER-SCALAR-0001-ROUNDING,
        C-COMPILER-SCALAR-0001-UTF16,
        C-COMPILER-SCALAR-0001-TARGET-EVIDENCE,
      ]
    expectation: React, Vue, Vue2, Web Component and GPUI source compilation accept the bounded forms; compilation success alone is not described as target execution.
  - id: T-COMPILER-SCALAR-0001-CASE-NEGATIVE
    title: Source and serialized IR cannot fabricate scalar or nominal authority
    covers:
      [
        C-COMPILER-SCALAR-0001-BINDING,
        C-COMPILER-SCALAR-0001-NUMBER,
        C-COMPILER-SCALAR-0001-STRING,
        C-COMPILER-SCALAR-0001-EVALUATION,
      ]
    expectation: Wrong arity, nonnumeric rounding, shadowed language bindings, opaque or structured native conversions and forged IR operands reject; broader browser String behavior remains intact.
  - id: T-COMPILER-SCALAR-0001-CASE-RUST
    title: Generated headless Rust executes source-language scalar edge values
    covers:
      [
        C-COMPILER-SCALAR-0001-NUMBER,
        C-COMPILER-SCALAR-0001-STRING,
        C-COMPILER-SCALAR-0001-ROUNDING,
        C-COMPILER-SCALAR-0001-UTF16,
        C-COMPILER-SCALAR-0001-EVALUATION,
        C-COMPILER-SCALAR-0001-TARGET-EVIDENCE,
      ]
    expectation: Cargo executes the unchanged generated crate against ECMAScript-derived numeric bits and text, including negative ties, signed zero, precision edges, invalid numeric strings, astral text and the finite public-data boundary. A skipped Cargo case is not a pass.
  - id: T-COMPILER-SCALAR-0001-CASE-WEB-STRING
    title: Actual browser source consumers retain their wider native String semantics
    covers:
      [
        C-COMPILER-SCALAR-0001-STRING,
        C-COMPILER-SCALAR-0001-EVALUATION,
        C-COMPILER-SCALAR-0001-TARGET-EVIDENCE,
      ]
    expectation: Existing generated consumers preserve missing versus undefined input, scalar spellings, opaque conversion, single evaluation and abrupt completion without claiming native structured coercion.
  - id: T-COMPILER-SCALAR-0001-CASE-GPUI
    title: A mounted generated GPUI consumer observes the bounded scalar operations
    covers:
      [
        C-COMPILER-SCALAR-0001-NUMBER,
        C-COMPILER-SCALAR-0001-STRING,
        C-COMPILER-SCALAR-0001-ROUNDING,
        C-COMPILER-SCALAR-0001-UTF16,
        C-COMPILER-SCALAR-0001-TARGET-EVIDENCE,
      ]
    expectation: A source-bound generated component executes these boundaries through its live owner and ordinary exposed methods. Source compilation and a headless Rust helper are insufficient substitutes.
implementations:
  - id: scalar-conversions
    kind: runtime-test
    status: missing
    required: true
    consumesCases:
      [
        T-COMPILER-SCALAR-0001-CASE-ADMISSION,
        T-COMPILER-SCALAR-0001-CASE-NEGATIVE,
        T-COMPILER-SCALAR-0001-CASE-RUST,
      ]
    notes:
      - "Retired with the old compiler at the 0.4 foundation: packages/compiler/test/scalar-conversions.test.ts (historical source 67fd94f58372cf35fa929f24ef731416b5817e31). Earlier results are historical only; independent replacement evidence is missing."
      - Thirteen cases passed locally, including actual generated Rust execution with Cargo; this is not a GPUI Window execution.
      - The language-support dependency is resolved into a lockfile before testing with --locked; prepared offline runners may set CARGO_NET_OFFLINE.
  - id: scalar-rounding
    kind: runtime-test
    status: missing
    required: true
    consumesCases:
      [
        T-COMPILER-SCALAR-0001-CASE-ADMISSION,
        T-COMPILER-SCALAR-0001-CASE-NEGATIVE,
        T-COMPILER-SCALAR-0001-CASE-RUST,
      ]
    notes:
      - "Retired with the old compiler at the 0.4 foundation: packages/compiler/test/scalar-round.test.ts (historical source 67fd94f58372cf35fa929f24ef731416b5817e31). Earlier results are historical only; independent replacement evidence is missing."
      - The recorded fourteen-case run includes emitted Rust bit comparisons for ties, signed zero and precision boundaries; full native component admission remains separate.
  - id: string-coercion
    kind: runtime-test
    status: missing
    required: true
    consumesCases: [T-COMPILER-SCALAR-0001-CASE-NEGATIVE, T-COMPILER-SCALAR-0001-CASE-WEB-STRING]
    notes:
      - "Retired with the old compiler at the 0.4 foundation: packages/compiler/test/string-coercion.test.ts (historical source 67fd94f58372cf35fa929f24ef731416b5817e31). Earlier results are historical only; independent replacement evidence is missing."
      - Twenty-five cases passed after replacing the stale blanket GPUI rejection with bounded scalar success and explicit opaque/structured negatives; direct Qt/Flutter String rejection remains covered.
  - id: mounted-gpui-scalar-boundaries
    kind: runtime-test
    status: missing
    required: true
    consumesCases: [T-COMPILER-SCALAR-0001-CASE-GPUI]
    notes:
      - A dedicated upstream mounted-native scalar boundary consumer has not been recorded. The downstream combined native build was pending when this mapping was authored.
verifies:
  contracts:
    - id: C-COMPILER-SCALAR-0001
      until: 0.4.0
      anchors:
        - C-COMPILER-SCALAR-0001-BINDING
        - C-COMPILER-SCALAR-0001-NUMBER
        - C-COMPILER-SCALAR-0001-STRING
        - C-COMPILER-SCALAR-0001-ROUNDING
        - C-COMPILER-SCALAR-0001-UTF16
        - C-COMPILER-SCALAR-0001-EVALUATION
        - C-COMPILER-SCALAR-0001-TARGET-EVIDENCE

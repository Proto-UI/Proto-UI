id: T-MATERIAL-VISUAL-RESULT-0001
type: test
title: Finite material visual-result and transaction conformance plan
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: The cases distinguish planned private pure resolver/state-machine evidence from unimplemented Runtime, optimizer and host integration. No implementation is passing until its actual tests exist and are executed and reviewed. Host atomicity, native paint and full compiler conformance remain unproven.
  zh-CN: cases 区分计划中的私有纯 resolver/state-machine 证据与尚未实现的 Runtime、optimizer 和宿主集成。 实际测试存在、执行并审阅之前，任何 implementation 都不得标记 passing。 宿主原子性、native paint 与完整 compiler conformance 仍未证明。
summary: Draft addressable cases for finite candidates, conservative fallback, post-patch ownership, complete snapshots and independent freshness rejection.
cases:
  - id: T-MATERIAL-VISUAL-RESULT-0001-CASE-GRAMMAR
    title: Closed candidates reject arbitrary and malformed material values
    covers:
      - C-FEEDBACK-MATERIAL-0001-GRAMMAR
    expectation: Accept only the finite version/fidelity/model/variant/phase/center/rounded-rectangle combinations; reject unknown fields, NaN/Infinity, arbitrary coordinates, paths, texture URLs, CSS and shader programs. A strict portable-model request never silently becomes native-semantic.
  - id: T-MATERIAL-VISUAL-RESULT-0001-CASE-SLOT
    title: Complete exclusive candidates never merge or use last-write-wins
    covers:
      - C-FEEDBACK-MATERIAL-0001-SLOT
    expectation: Exactly one valid active candidate can enhance; zero selects the slot fallback; multiple or invalid active candidates select the same fallback plus deterministic diagnostics. Reordering conflicting candidates never chooses a different winning candidate. Removing a slot produces a tombstone.
  - id: T-MATERIAL-VISUAL-RESULT-0001-CASE-FALLBACK
    title: Resolved opaque fallback is validated before candidate selection
    covers:
      - C-FEEDBACK-MATERIAL-0001-FALLBACK
    expectation: Require complete finite in-range opaque RGBA fill and foreground with the same resolved foreground as final style. Invalid alpha, missing/invalid colors and unresolved palette roles/cycles reject the slot before candidate resolution, without fabricating a default or claiming valid fallback.
  - id: T-MATERIAL-VISUAL-RESULT-0001-CASE-OWNERSHIP
    title: Retained slots explicitly clear owned paint while tombstones restore legal style
    covers:
      - C-FEEDBACK-MATERIAL-0001-OWNERSHIP
      - C-VISUAL-TRANSACTION-0001-SNAPSHOT
      - C-VISUAL-TRANSACTION-0001-REMOVE
    expectation: Observable conflicting Proto paint produces a diagnostic and a non-competing fallback snapshot. A retained slot emits explicit clearPaint for fill/background-image/backdrop/coat and removes only tokens linked to those normalized paint contributions. Layout, text, border and unrelated presentation remain owned by their existing source. A slot tombstone restores current legal input style and does not continue clearing its paint; zero active candidates still retain material fallback.
  - id: T-MATERIAL-VISUAL-RESULT-0001-CASE-PROVENANCE
    title: Pure resolution consumes final style provenance and fails closed on unresolved lowering
    covers:
      - C-FEEDBACK-MATERIAL-0001-PROVENANCE
    expectation: Supply complete post-patch normalized paint contributions with channel and owned token references; cover adding/removing fill via patch, suppress and clearPatch. Unknown/incomplete or selector-dependent provenance selects fallback and diagnostic, never enhanced. Claims stop at observable Proto intent and do not assert the absence of arbitrary external CSS.
    notes:
      - Synthetic final-style inputs exercise the pure boundary only; they do not prove the current optimizer supplies that boundary.
  - id: T-MATERIAL-VISUAL-RESULT-0001-CASE-GEOMETRY
    title: Outer surface and material clip use the same resolved geometry revision
    covers:
      - C-FEEDBACK-MATERIAL-0001-GEOMETRY
      - C-VISUAL-TRANSACTION-0001-IDENTITY
    expectation: The accepted axis-aligned rounded rectangle uses one final style geometry and radius source. Invalid/unknown/incompatible bounds or radii select fallback and diagnostic. A geometry revision change invalidates old material completion even when surface identity and frame sequence match.
  - id: T-MATERIAL-VISUAL-RESULT-0001-CASE-SAFETY
    title: Every conservative first-profile veto resolves opaque without a later Rule turn
    covers:
      - C-FEEDBACK-MATERIAL-0001-SAFETY
      - C-VISUAL-TRANSACTION-0001-FALLBACK
    expectation: Individually vary reducedMotion, reducedTransparency, forced colors, unsafe/unknown contrast, unknown preference facts, missing/false/unknown/incompatible support and source loss/staleness. Each veto produces the complete opaque fallback immediately in the result. Recovery requires current valid inputs; CSS syntax support alone cannot produce enhanced quality.
  - id: T-MATERIAL-VISUAL-RESULT-0001-CASE-SNAPSHOT
    title: Complete snapshot fields distinguish style clear and material tombstone from omission
    covers:
      - C-VISUAL-TRANSACTION-0001-SNAPSHOT
    expectation: Reject incomplete or mixed snapshots instead of carrying old style/material implicitly. Verify explicit style clear, whole style replacement, retained opaque fallback and material tombstone transitions. No accepted logical snapshot carries both material-owned and conflicting style fill.
    notes:
      - Logical acceptance by a pure state-machine is not physical host atomicity evidence.
  - id: T-MATERIAL-VISUAL-RESULT-0001-CASE-IDENTITY
    title: Target, lease, surface, geometry and frame identities remain independent
    covers:
      - C-VISUAL-TRANSACTION-0001-IDENTITY
      - C-VISUAL-TRANSACTION-0001-STALE
    expectation: Vary authored target generation, source lease generation, surface/view identity, geometry revision and frame sequence one at a time. Reject malformed/mismatched/stale values, duplicate completions and out-of-order frames. A new frame cannot rescue an obsolete target, lease, surface or geometry; new frames under one live lease do not create a new authored target.
  - id: T-MATERIAL-VISUAL-RESULT-0001-CASE-RETIREMENT
    title: Replace, source loss, rebind, detach and dispose cannot resurrect resources
    covers:
      - C-VISUAL-TRANSACTION-0001-STALE
      - C-VISUAL-TRANSACTION-0001-FALLBACK
      - C-VISUAL-TRANSACTION-0001-REMOVE
    expectation: Accept a current logical result, retire it through each lifecycle transition, then submit its old completion and a malformed newer completion. Neither advances state nor restores a retired material/style resource. Repeated cleanup is idempotent; reacquisition accepts only current target identities. Distinguish retain-slot fallback from slot tombstone and terminal disposal.
  - id: T-MATERIAL-VISUAL-RESULT-0001-CASE-PURE
    title: Private resolution performs no host or semantic side effects
    covers:
      - C-FEEDBACK-MATERIAL-0001-SEMANTICS
      - C-FEEDBACK-MATERIAL-0001-QUALITY
      - C-VISUAL-TRANSACTION-0001-BOUNDARY
    expectation: For equivalent finite inputs, obtain equivalent results/diagnostics without DOM reads, resource acquisition, host writes, structural render, input dispatch or activation. Verify truthful enhanced/fallback/unavailable quality and reason. Imports remain private and do not wire author APIs, a provider, native support or a compiler by implication.
  - id: T-MATERIAL-VISUAL-RESULT-0001-CASE-RUNTIME
    title: Real Rule optimization and runtime patches preserve final material conflict evidence
    covers:
      - C-FEEDBACK-MATERIAL-0001-PROVENANCE
      - C-FEEDBACK-MATERIAL-0001-OWNERSHIP
      - C-FEEDBACK-MATERIAL-0001-SEMANTICS
    expectation: Through actual Runtime and selector-lowered Rule paths, validate all final fill/radius contributions after patch/suppress/clearPatch, with retained provenance or declared optimizer inhibition. The same real Base prototype drives rest/pressed/disabled once without a second semantic owner or structural render. Removing a Rule candidate differs from removing the material slot.
    notes:
      - Planned integration evidence; the private resolver's synthetic provenance input cannot satisfy this case.
  - id: T-MATERIAL-VISUAL-RESULT-0001-CASE-LEASE
    title: Real provider resource leases bind source, coordinates, profile and lifetime
    covers:
      - C-VISUAL-TRANSACTION-0001-LEASE
      - C-VISUAL-TRANSACTION-0001-STALE
      - C-VISUAL-TRANSACTION-0001-REMOVE
    expectation: In an explicitly admitted host/profile, prove provider/scope/surface binding, bounds/clip/sampling transform/DPR/margin, color/alpha profile and source-frame freshness. Exercise resize, coordinate change, source replacement/loss, rebind and disposal; all owned nodes/textures/listeners/frame callbacks retire and unrelated host presentation survives. Reject self-capture/recursive feedback.
    notes:
      - Planned real-provider evidence; a mocked lease descriptor or Rust map test does not satisfy this case.
  - id: T-MATERIAL-VISUAL-RESULT-0001-CASE-ATOMIC
    title: Real host paints whole visual snapshots across replacement and fallback
    covers:
      - C-VISUAL-TRANSACTION-0001-ATOMIC
      - C-VISUAL-TRANSACTION-0001-FALLBACK
      - C-VISUAL-TRANSACTION-0001-REMOVE
      - C-VISUAL-TRANSACTION-0001-BOUNDARY
      - C-FEEDBACK-MATERIAL-0001-QUALITY
    expectation: Observe actual host paint across opaque-to-material, source-loss fallback, recovery, style clear, material tombstone, geometry change and surface replacement. No transparent intermediate paint, double fill or mixed-generation clip is visible. Bind evidence to exact Adapter/engine/profile; test interruption and stale callbacks. React setters, Vue shallowRef and immediate requestFlush call order alone cannot pass. Native admission also requires negotiated protocol negative vectors.
    notes:
      - Planned host evidence; this case claims no present Web/native provider support, Apple resemblance or complete compiler support.

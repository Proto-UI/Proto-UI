id: T-POPOVER-NAVIGATION-PRESENTATION-0001
type: test
title: Public Popover navigation presentation
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: 'Source-host and canonical-preset coverage does not establish exact native focus, geometry, scroll or website-composition acceptance; those obligations remain outstanding.'
summary: Explicit navigation presentation preserves one Popover owner and default profile behavior.
cases:
  - id: T-POPOVER-NAVIGATION-PRESENTATION-0001-CASE-PAINT
    title: Navigation replaces the card shell and default profile restoration is exact
    covers:
      - P-SHADCN-POPOVER-NAVIGATION-PRESENTATION
      - P-SHADCN-POPOVER-NAVIGATION-TRIGGER
      - P-SHADCN-POPOVER-NAVIGATION-MOTION-SUPPORT
      - P-BRUTALIST-POPOVER-NAVIGATION
    expectation: available-size-navigation-and-default-compatibility
  - id: T-POPOVER-NAVIGATION-PRESENTATION-0001-CASE-OWNER
    title: One public Popover owner retains open and presence through trigger changes
    covers:
      - P-SHADCN-POPOVER-NAVIGATION-TRIGGER
      - P-BRUTALIST-POPOVER-NAVIGATION
    expectation: no-second-button-or-overlay-owner
  - id: T-POPOVER-NAVIGATION-PRESENTATION-0001-CASE-OUTSIDE
    title: Both explicit navigation families preserve controlled outside focus after settled open and cold cancellation
    covers:
      - P-SHADCN-POPOVER-NAVIGATION-SEMANTICS
      - P-BRUTALIST-POPOVER-NAVIGATION
    expectation: public-controlled-navigation-outside-focus-without-website
  - id: T-POPOVER-NAVIGATION-PRESENTATION-0001-CASE-PRESET
    title: Actual document and shadow preset commands include available-size and overscroll rules
    covers:
      - P-SHADCN-POPOVER-NAVIGATION-CSS-CLOSURE
      - P-BRUTALIST-POPOVER-NAVIGATION-CSS-CLOSURE
    expectation: canonical-generated-manifest-and-preset-command-css-with-missing-token-countercontrols
  - id: T-POPOVER-NAVIGATION-PRESENTATION-0001-CASE-CONSUMER
    title: Ordinary public navigation demos retain exact dependency and native-owner boundaries
    covers:
      - P-SHADCN-POPOVER-NAVIGATION-TRIGGER
      - P-SHADCN-POPOVER-NAVIGATION-SEMANTICS
      - P-BRUTALIST-POPOVER-NAVIGATION
    expectation: literal-ordinary-demo-glob-and-exact-public-loader-with-missing-dependency-countercontrol
  - id: T-POPOVER-NAVIGATION-PRESENTATION-0001-CASE-NATIVE
    title: Uncontrolled navigation consumers realize available-size scrolling and dismissal across four Web runtimes
    covers:
      - P-SHADCN-POPOVER-NAVIGATION-PRESENTATION
      - P-SHADCN-POPOVER-NAVIGATION-SEMANTICS
      - P-BRUTALIST-POPOVER-NAVIGATION
    expectation: real-pointer-wheel-tab-outside-focus-escape-and-resized-reopen-with-source-bound-images
implementations:
  - id: popover-navigation-host
    kind: module-test
    status: planned
    path: packages/prototypes/shadcn/test/popover-navigation.test.ts
    required: true
    consumesCases:
      - T-POPOVER-NAVIGATION-PRESENTATION-0001-CASE-PAINT
      - T-POPOVER-NAVIGATION-PRESENTATION-0001-CASE-OWNER
      - T-POPOVER-NAVIGATION-PRESENTATION-0001-CASE-OUTSIDE
    exercises:
      - P-SHADCN-POPOVER
      - P-BRUTALIST-POPOVER
    notes:
      - 'Source-host coverage preserves the original 16 presentation and four default-only outside cases, and adds four explicit Shadcn/Brutalist navigation outside cases. Historical 20/20 on main971 does not verify the new navigation cases.'
      - 'Controlled outside-focus coverage is not native Escape, modifier links, available geometry, borrowed-tree handback or fatal-retirement completion. Those require independent consumer/native evidence.'
  - id: popover-navigation-preset
    kind: module-test
    status: planned
    path: packages/cli/test/popover-navigation-preset.test.ts
    required: true
    consumesCases:
      - T-POPOVER-NAVIGATION-PRESENTATION-0001-CASE-PRESET
    exercises:
      - P-SHADCN-POPOVER
      - P-BRUTALIST-POPOVER
    notes:
      - 'Real source CLI preset command writes document CSS and a serialized shadow artifact from the canonical generated manifests. Each navigation token is removed in a restored in-memory countercontrol; no generated source is hand-edited.'
  - id: popover-navigation-public-consumer
    kind: module-test
    status: planned
    path: apps/www/src/content/docs/zh-cn/popover-navigation-evidence.test.ts
    required: true
    consumesCases:
      - T-POPOVER-NAVIGATION-PRESENTATION-0001-CASE-CONSUMER
    exercises: [P-SHADCN-POPOVER, P-BRUTALIST-POPOVER]
    notes:
      - 'Ordinary full demo glob and real renderer/loader checks, including a genuinely missing reached Root, are host-source evidence rather than native geometry or focus acceptance.'
  - id: popover-navigation-public-native
    kind: adapter-test
    status: planned
    path: apps/www/src/content/docs/zh-cn/popover-navigation.browser.test.ts
    required: true
    consumesCases:
      - T-POPOVER-NAVIGATION-PRESENTATION-0001-CASE-NATIVE
    exercises: [P-SHADCN-POPOVER, P-BRUTALIST-POPOVER]
    notes:
      - 'Thirty-two planned family/runtime/theme/viewport subjects use real public MDX consumers and one exact-head loopback CI owner. Only actual terminal per-case receipts and their commit-bound screenshots establish execution.'
      - 'This uncontrolled reduced-motion consumer does not certify the separate controlled cold-cancellation case, modifier/context-menu/no-JS activation, unreduced motion, Trigger design parity, website borrowed-tree handback or fatal retirement.'

id: T-COMPILER-PIPELINE-0001
type: test
title: Semantic HIR, AST generation, native LLVM construction, and compiler coverage evidence
status: draft
since: 0.3.0
lifecycleRationale: >-
  Maps acceptance for the current-user correction of #1809 to a semantic compiler with no source-template generation or prototype-runtime fallback. Earlier passing mappings described the 73ff2847 wrapper/metadata snapshot and are not inherited as evidence for this contract. Required native corpus, regression, and consumer coverage remains explicit debt; individual mappings may become passing only after their revised executable tests are run and reviewed.


summary: Separate behavioral compilation evidence from analysis, coverage reporting, kernel output, and real consumer acceptance.
cases:
  - id: T-COMPILER-PIPELINE-0001-CASE-HIR
    title: TypeScript binding and Proto HIR preserve authored behavior or report a located lowering gap
    covers:
      - D-COMPILER-ARCH-0001-B
      - D-COMPILER-ARCH-0001-C
      - C-COMPILER-PIPELINE-0001-FRONTEND
      - C-COMPILER-PIPELINE-0001-HIR
    expectation: symbol-binding-alias-shadowing-control-flow-state-event-order-and-explicit-unsupported-without-silent-erasure
  - id: T-COMPILER-PIPELINE-0001-CASE-SSA-OPT
    title: Kernel verification and optimization preserve source values, control flow, and effects
    covers:
      - D-COMPILER-ARCH-0001-C
      - C-COMPILER-PIPELINE-0001-SSA-IR
      - C-COMPILER-PIPELINE-0001-OPT
    expectation: malformed-ir-rejection-and-source-versus-optimized-execution-including-nan-infinity-signed-zero-branches-and-side-effects
  - id: T-COMPILER-PIPELINE-0001-CASE-LLVM-WASM
    title: LLVM C++ IRBuilder constructs and verifies modules that execute through the real native or WASM pipeline
    covers:
      - D-COMPILER-ARCH-0001-A
      - D-COMPILER-ARCH-0001-D
      - C-COMPILER-PIPELINE-0001-LLVM-ABI
    expectation: real-native-builder-structured-request-module-verification-standard-printing-executable-output-and-invalid-request-rejection
  - id: T-COMPILER-PIPELINE-0001-CASE-ABI-BOUNDS
    title: Versioned kernel ABI uses the actual module memory with checked capacities and isolated instances
    covers:
      - C-COMPILER-PIPELINE-0001-LLVM-ABI
    expectation: heap-based-nonoverlapping-slots-capacity-and-growth-checks-instance-isolation-and-missing-memory-or-metadata-rejection
  - id: T-COMPILER-PIPELINE-0001-CASE-THIN-REACT
    title: Native React AST output executes admitted semantics and rejects unsupported behavior without runtime fallback
    covers:
      - D-COMPILER-ARCH-0001-A
      - C-COMPILER-PIPELINE-0001-HIR
      - C-COMPILER-PIPELINE-0001-THIN-EMIT
    expectation: ts-factory-printer-native-output-props-default-empty-updates-state-event-order-rules-and-lifecycle-or-explicit-unsupported
  - id: T-COMPILER-PIPELINE-0001-CASE-GPUI
    title: Rust AST output builds against the real GPUI dependency and preserves admitted native component behavior
    covers:
      - D-COMPILER-ARCH-0001-A
      - D-COMPILER-ARCH-0001-F
      - C-COMPILER-PIPELINE-0001-GPUI
    expectation: syn-prettyplease-structured-components-real-gpui-cargo-build-props-state-render-events-rules-lifecycle-or-explicit-unsupported
  - id: T-COMPILER-PIPELINE-0001-CASE-COVERAGE-REPORT
    title: Corpus reports distinguish analysis, native compilation, unsupported input, kernels, and consumer evidence
    covers:
      - C-COMPILER-PIPELINE-0001-COVERAGE
      - C-COMPILER-PIPELINE-0001-DIAGNOSTICS
    expectation: exact-per-export-target-outcomes-and-reasons-without-counting-wrapper-or-metadata-success-as-native-coverage
  - id: T-COMPILER-PIPELINE-0001-CASE-BASE-CORPUS
    title: Official Base and committed family components compile natively and preserve their defined behavior
    covers:
      - D-COMPILER-ARCH-0001-E
      - C-COMPILER-PIPELINE-0001-CONSUMERS
    expectation: full-required-native-corpus-and-behavioral-regression-coverage-without-prototype-runtime-imports
  - id: T-COMPILER-PIPELINE-0001-CASE-CONSUMERS
    title: Existing targets, tools, and real consumers migrate with build and behavior evidence
    covers:
      - D-COMPILER-ARCH-0001-E
      - C-COMPILER-PIPELINE-0001-CONSUMERS
    expectation: target-browser-cli-library-shenko-react-verdant-gpui-build-input-state-lifecycle-and-accessibility-acceptance
  - id: T-COMPILER-PIPELINE-0001-CASE-CLI
    title: CLI and API propagate requested-stage failures and emit only successful target artifacts
    covers:
      - C-COMPILER-PIPELINE-0001-DIAGNOSTICS
      - C-COMPILER-PIPELINE-0001-COVERAGE
    expectation: deterministic-exit-structured-diagnostics-real-requested-verification-and-no-fabricated-output
implementations:
  - id: compiler-semantic-hir
    kind: module-test
    status: passing
    path: packages/compiler/test/frontend-hir.test.ts
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-HIR
    notes:
      - The final revised file passed 15 of 15 tests in the isolated worktree on 2026-11-25; tests inspect semantic HIR and target admission rather than counting wrapper generation.
      - Covers canonical factory aliases and setup-handle aliases, proven pure initializers versus unproven external calls, callback control flow, dynamic setup and rule effects rejected without erasure, default precedence, lifecycle/watch bodies, both helper return branches, and floating-point negation.
      - Additional regression cases retain unresolved definitions in the inventory denominator, resolve immutable local factory aliases and quoted setup keys, bind shadowed state symbols, preserve return completion, reject mutable-function constant folding, and retain executable module initializers as explicit unsupported behavior.
      - This test record does not establish full helper/Hook composition, closure/ownership semantics, or complete Base/family coverage.
  - id: compiler-semantic-composition
    kind: module-test
    status: passing
    path: packages/compiler/test/composition-hir.test.ts
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-HIR
    notes:
      - The current 18 cases cover expression-bodied setup, empty/array/slot templates, canonical once-hook aliases, per-invocation scalar options/defaults, static branches and styles, helper argument snapshots/return scope, props snapshots and transitive authored module effects.
      - Callback default-parameter effects in lifecycle/events/watch and generator/async rule intent are explicitly rejected. This evidence does not grant unsupported effects ordinary synchronous execution semantics.
  - id: compiler-initialization-proof
    kind: module-test
    status: passing
    path: packages/compiler/test/initialization-proof.test.ts
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-HIR
      - T-COMPILER-PIPELINE-0001-CASE-SSA-OPT
    notes:
      - All 20 actual TypeScript cases passed with no source diagnostics, including 15 rejection controls and 5 positive controls. Original independent reproductions were rerun after the fix.
      - Checks module/setup/callback TDZ, const callee and alias initialization, ambient global reads, direct and hoisted-function-mediated cyclic module reads, unreachable captured declarations, and style-intrinsic aliases in render/rule/setup helpers. Initialized captures, hoisted functions, safe aliases and ordinary action helpers remain accepted.
      - A local captured only after callback registration remains conservatively unsupported until setup-exit initialization proof is represented; this rejects a valid subset explicitly instead of treating all source positions as completed.
  - id: compiler-action-update-order
    kind: module-test
    status: passing
    path: packages/compiler/test/action-flow.test.ts
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-HIR
    notes:
      - The three shared admission tests check path-sensitive terminal requests, helper return boundaries, and concatenated callback groups. Target tests additionally reject multiple or early updates across same-event handlers and watcher/lifecycle ordering.
      - Full synchronous-first-read and in-flight commit scheduling remains unimplemented; passing this bounded admission check does not complete that obligation.
  - id: compiler-actual-base-source-slice
    kind: runtime-test
    status: passing
    path: packages/compiler/test/real-base-react.test.ts
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-THIN-REACT
    notes:
      - Three source-driven React tests compile the real Text/Surface definitions, execute their props/children and fallback behavior, and reject a composite Base button whose required capabilities remain unsupported.
      - Matching GPUI source and native tests and the browser Worker exercise the same unchanged authored sources. This bounded slice does not satisfy CASE-BASE-CORPUS or a full application migration.
  - id: compiler-browser-memory-program
    kind: module-test
    status: passing
    path: packages/compiler/test/browser-ast.test.ts
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-HIR
      - T-COMPILER-PIPELINE-0001-CASE-CONSUMERS
    notes:
      - Five memory-host tests check actual TypeScript binding and shared HIR/React lowering, build-owned core/types/lib sources, editable path and intrinsic-identity protection, and explicit unsupported/invalid diagnostics without evaluating authored modules.
  - id: compiler-browser-native-react
    kind: runtime-test
    status: passing
    path: scripts/compiler/browser-ast-smoke.mjs
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-THIN-REACT
      - T-COMPILER-PIPELINE-0001-CASE-CONSUMERS
    notes:
      - Seven actual Chrome cases execute the real Worker and isolated native React preview, including Base Text/Surface, edit/recompile, state-only versus explicit update, module-effect rejection, unsupported GPUI clearing stale output, digest rejection and cancel/reopen cleanup.
      - Current source requests, generated TS/JS, actual DOM, build fingerprints and raw receipts are retained at packages/compiler/evidence/browser-ast-20261125/README.md. This is bounded browser compiler execution, not a full deployed docs-route or non-React target claim.
  - id: compiler-ssa-ir-unit
    kind: module-test
    status: passing
    path: packages/compiler/test/ssa-llvm-builder.test.ts
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-SSA-OPT
    notes:
      - The revised file passed 8 of 8 tests with no skips in the isolated worktree on 2026-11-25 using LLVM 22.1.8; it is shared with the LLVM pipeline mapping and is not a second test-count total.
      - Covers dominance/use-before-definition, call signatures, return types, slot and PHI invariants, removed-edge PHI repair, i32 constant multiplication, fneg and IEEE constants, and execution of the repaired CFG.
  - id: compiler-llvm-wasm-pipeline
    kind: module-test
    status: passing
    path: packages/compiler/test/ssa-llvm-builder.test.ts
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-LLVM-WASM
    notes:
      - Executed with the native C++ LLVM 22.1.8 SDK driver, IRBuilder/Module construction and verification, standard printing, opt/llc/wasm-ld, and WebAssembly execution; the revised file passed 8 of 8 tests without skips on 2026-11-25.
      - Includes mapped string initialization and a compiled 129-prop module consumed through the real slot ABI; kernel execution does not establish a native GPUI component or UI consumer migration.
  - id: compiler-kernel-admission
    kind: module-test
    status: passing
    path: packages/compiler/test/kernel-admission.test.ts
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-HIR
      - T-COMPILER-PIPELINE-0001-CASE-LLVM-WASM
    notes:
      - Both revised tests passed with the actual LLVM/WASM toolchain in the isolated worktree on 2026-11-25. Kernel admission rejects action control flow or state-domain validation that the scalar backend cannot preserve.
      - Actual WASM execution verifies that numeric gte rejects Infinity and preserves finite comparison behavior. Kernel acceptance is separate from React/GPUI component admission.
  - id: compiler-wasm-abi-bounds
    kind: runtime-test
    status: passing
    path: packages/compiler/test/wasm-kernel-layout.test.ts
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-ABI-BOUNDS
    notes:
      - Executed in the isolated compiler worktree on 2026-11-25; 3 of 3 tests passed against actual WebAssembly memory.
      - Covers real memory growth for 9000 props, non-overlapping props/state after slot 128, access and int32 bounds, separate instances, signed-zero/NaN/Infinity preservation, and rejection of missing memory/layout or invalid offsets.
  - id: compiler-react-codegen-execution
    kind: runtime-test
    status: passing
    path: packages/compiler/test/react-ast-codegen.test.ts
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-THIN-REACT
    notes:
      - The current revised file passed 11 of 11 tests in the isolated worktree on 2026-11-25; generated modules underwent strict TypeScript checking and React 19/happy-dom execution, with an import allowlist containing only React.
      - Covers props updates and prevValid, missing/empty/error fallback, native keyboard callbacks with local/if/else/return and synchronous state reads, listener cleanup, static/rule styles, signed-zero/text literals, and explicit unsupported diagnostics.
      - Also covers created before the first render, actual React StrictMode detach/remount preserving state, resolved watcher hydration skipping and FIFO/current/previous/batched-change semantics, synchronous watcher state writes before updated callbacks, Object.is signed-zero changes, finite gte rules, and semantic style-token merging.
      - Nullable current/previous props retain native primitive arithmetic, string concatenation and comparison, nullish right-hand values, and signed-zero unary semantics through AST-generated helpers.
      - Unexpanded/builtin hooks, context/expose, global or unsupported events, dynamic render, non-scalar props, before-dispose, and raw props subscriptions remain unsupported; this record does not claim full prototype coverage.
  - id: compiler-gpui-ast-output
    kind: module-test
    status: passing
    path: packages/compiler/test/gpui-ast-codegen.test.ts
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-GPUI
    notes:
      - The expanded AST target suite passed 10 of 10 tests in the isolated worktree on 2026-11-25, using the actual syn/prettyplease builder with authored control flow, typed raw/resolved props, numeric edge cases, safe literals, and explicit unsupported diagnostics.
      - Source-to-HIR-to-Rust checks include unchanged official Base Text and Surface, host Root versus template structure, native slots, created/watch actions, numeric state policies and explicit update admission. Current hashes and logs are retained under packages/compiler/native/rust-builder/test-support/evidence/continuation-20261125-summary.md; older six-fixture receipts remain historical.
      - AST generation is recorded separately from native Cargo execution and real application integration.
  - id: compiler-gpui-native-output
    kind: runtime-test
    status: passing
    path: packages/compiler/native/rust-builder/test-support/src/tests.rs
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-GPUI
    notes:
      - The generated-component workspace passed cargo +1.98.1 check --workspace --all-targets --locked and 13 native tests with no skips on 2026-11-25, using the actual Verdant fork cyjin-yl/z3rm at e5f2f9db75e97613232b5c1946333e61fa3828ab.
      - Covers actual Base Text/Surface, independent host Root and templates, Text/AnyView slot identity and final release, bubbling input, created and resolved-watch ordering, explicit update versus state-only writes, immediate rule paint with unchanged template text, props/default/empty/prevValid, instance isolation and numeric domains. A throwing watcher preserves earlier live effects and resolved props, aborts later watchers and retains the prior template snapshot. Layout and paint observations do not claim full screenshot or accessibility-tree acceptance.
      - This is an isolated native harness against the consumer dependency. Full Verdant application migration remains required separately, and Shenko remains a React/Web consumer.
  - id: compiler-gpui-upstream-pin
    kind: module-test
    status: passing
    path: packages/compiler/native/rust-builder/test-support/generated/GpuiPinned/Cargo.toml
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-GPUI
    notes:
      - The expanded generated native workspace passed cargo +1.98.1 check --workspace --all-targets --locked against upstream GPUI 62e5991dd0f0c8a3af8d5e7e9c4652490d468db8 on 2026-11-25 using the recorded manifest and lockfile; the earlier single GpuiPinned crate check remains historical.
      - This is independent build evidence for the default upstream pin. It does not inherit the different Verdant fork's native execution result or establish real consumer migration.
  - id: compiler-corpus-report
    kind: module-test
    status: passing
    path: packages/compiler/test/base-corpus.test.ts
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-COVERAGE-REPORT
    notes:
      - The revised coverage-report test passed in the isolated worktree on 2026-11-25, enumerating every official Base input and checking declared/unsupported/source-error accounting, explicit failure diagnostics, incomplete native coverage, and zero execution claims.
      - The final actual React and GPUI inventories each analyzed 184 files, identified 212 prototypes and 214 authored Hooks, emitted 2 of 212 prototypes natively (Text and Surface), and reported 210 unsupported prototypes with 0 source-error files and 0 execution-verified prototypes. Each target has 2 emitted files, 177 unsupported files and 5 hook-analysis files; the final summary is retained at packages/compiler/evidence/continuation-20261125/base-inventory-summary.json. The older 0/212 result retains its separate historical receipt.
      - A correct report may include unsupported components and does not satisfy the separate full native corpus case.
  - id: compiler-base-shadcn-corpus
    kind: runtime-test
    status: missing
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-BASE-CORPUS
    notes:
      - The old 184/184 report included runtime-wrapper generation. The current actual React and GPUI inventories both emit 2 of 212 official Base prototypes natively; the remaining 210 remain unsupported. Full native lowering and behavior evidence remains required.
  - id: compiler-native-assets
    kind: module-test
    status: passing
    path: packages/compiler/test/native-assets.test.ts
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-CONSUMERS
    notes:
      - Both native-asset location tests passed in the isolated worktree on 2026-11-25, covering source and relocated bundle layouts for the LLVM and Rust drivers.
      - The exact clean candidate 39ea50a0635be857734461a7af1bd6e61ecd70a6 was built, installed with npm ci, relocated intact and consumed with fresh native caches. Installed-package React SSR, LLVM IRBuilder/WASM/kernel-host, GPUI Rust AST, CLI publication and independent DOM consumer checks all passed; receipts are retained at packages/compiler/evidence/pinned-package-39ea50a0/README.md.
      - Earlier mechanism receipts remain at packages/compiler/evidence/pinned-package-snapshot-01a33b38 with their original temporary snapshot identity. The current installed package has no ./runtime export and explicitly exposes ./kernel-host; package success does not complete real application migration.
  - id: compiler-real-consumers
    kind: runtime-test
    status: missing
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-CONSUMERS
    notes:
      - Retains cross-target, browser/library, Shenko React/Web, and Verdant GPUI migration obligations. Verdant workspace z3rm@e5f2f9db75e97613232b5c1946333e61fa3828ab and compiler upstreamGPUI 62e5991 require separate checks, not an assertion of one identical version.
      - Current exact-package admission preserves both raw-checkout TS2307 failures caused by missing authoring SDK resolution. With explicit candidate Core/Types mapping and unchanged consumer source, Shenko transport-badge emits one React prototype; Verdant pitch-gesture-surface is explicitly unsupported because expose lowering is missing. Both reports claim zero execution and no application source changes.
      - The migrated library worker coordinator retains 1015 authored entries across 11 target/obligation rows. The selected Text rows emit for React and GPUI, Button rows remain unsupported, and all unselected/unimplemented rows retain their states; selected execution completeness is separate from full admission coverage.
  - id: compiler-cli-e2e
    kind: module-test
    status: passing
    path: packages/compiler/test/cli.test.ts
    required: true
    consumesCases:
      - T-COMPILER-PIPELINE-0001-CASE-CLI
    notes:
      - All 6 revised CLI tests passed with no skips in the final isolated-worktree integration run on 2026-11-25. They cover target/toolchain identity, option position and invalid combinations, React without LLVM, explicit missing-toolchain failures, output/input overwrite protection, no output after unsupported source failure, a real requested optimized LLVM module, and invalid target rejection through the public API. Independent source/installed CLI controls additionally check symlink paths, concurrent exclusive publication and explicit overwrite semantics.
      - The final current compiler run is recorded by exact suite/test counts and source hashes under packages/compiler/evidence/continuation-20261125. The earlier 12-file/61-test result belongs to 59c18246 and is not inherited. The current 13 GPUI native Rust tests and independent Cargo checks are separate evidence; none of these totals establishes full corpus or application migration.

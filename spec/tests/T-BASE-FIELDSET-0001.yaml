id: T-BASE-FIELDSET-0001
type: test
title: Fieldset policy, relationships and projection acceptance
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: 可移植分组的 draft 方向。原生无障碍、跨 Adapter 实现、关系生命周期与独立精确 head 验收仍阻塞稳定准入；synthetic DOM 与源码 token 不建立这些保证。
  en: Draft portable grouping direction. Native accessibility, cross-Adapter realization, relation lifetime and independent exact-head acceptance remain activation blockers; synthetic DOM and source tokens do not establish them.
summary: Source-bound evidence plan distinguishing synthetic runtime checks from native acceptance.
statement:
  zh-CN: 检验被动分组及真实 family atoms；不将 smoke tests、style tokens 或类型兼容当作完整一致性验收。
  en: Exercise the passive group and actual family atoms without treating smoke tests, style tokens or type compatibility as full conformance.
cases:
  - id: T-BASE-FIELDSET-0001-CASE-OWNER
    title: Fieldset owner
    covers:
      - C-FIELDSET-0001-OWNER
    expectation: Root is a passive semantic group, not a Field or Form owner. It accepts disabled and ariaLabel and exposes effective disabled; it owns no control value, editor, validation, submission, reset or additional focus target.
  - id: T-BASE-FIELDSET-0001-CASE-DISABLED
    title: Fieldset disabled
    covers:
      - C-FIELDSET-0001-DISABLED
    expectation: Effective disabled is local disabled OR the enclosing Fieldset policy. Nested Roots must not hide ancestors; removing an ancestor restriction preserves every descendant local restriction. Participating Fields consume that policy through their own contract; Fieldset does not infer arbitrary descendant controls or rewrite values.
  - id: T-BASE-FIELDSET-0001-CASE-ANATOMY
    title: Fieldset anatomy
    covers:
      - C-FIELDSET-0001-ANATOMY
    expectation: One Root establishes a group with at most one Legend and one Description. Nested group naming and description targets remain scoped to their own Root. Legend and Description are passive slotted content and expose inherited disabled without adding an input, activation action or tab stop.
  - id: T-BASE-FIELDSET-0001-CASE-RELATIONS
    title: Fieldset relations
    covers:
      - C-FIELDSET-0001-RELATIONS
    expectation: Root declares group role, ariaLabel naming and exact Anatomy labelledBy Legend / describedBy Description relationships through A11y. No authored DOM IDs or direct DOM discovery. Hosts own accessible-name computation and relationship projection. Absent, replaced or detached parts must not leave stale or cross-group references; duplicate exact targets fail closed under C-A11Y-PART-RELATIONSHIP-0001 rather than selecting the first. Full terminal/remount and host evidence remain explicitly open.
  - id: T-BASE-FIELDSET-0001-CASE-BOUNDS
    title: Fieldset bounds
    covers:
      - C-FIELDSET-0001-BOUNDS
    expectation: This portable group does not adopt the native HTML first-Legend disabled exemption. A participating Field inside Legend follows the same inherited disabled policy. No native fieldset/form serialization, validation forwarding, second editing/keyboard owner or host-specific bypass is admitted. C-FIELD-0001 excludes Fieldset and is not its definition.
  - id: T-BASE-FIELDSET-0001-CASE-BASE-ROOT
    title: base root semantic and presentation conformance
    covers:
      - P-BASE-FIELDSET-SEMANTICS
    expectation: Own the passive group, local-or-ancestor disabled policy and group naming/description relations. Preserve slotted children without creating value, validation, submission or focus ownership. Full mapping is planned acceptance, not evidence supplied by a smoke or token check.
  - id: T-BASE-FIELDSET-0001-CASE-BASE-LEGEND
    title: base legend semantic and presentation conformance
    covers:
      - P-BASE-FIELDSET-LEGEND-SEMANTICS
    expectation: Contribute the visible group name as the scoped legend part; mirror inherited disabled and render passive slot content. Do not install control-label activation or a first-Legend exception. Full mapping is planned acceptance, not evidence supplied by a smoke or token check.
  - id: T-BASE-FIELDSET-0001-CASE-BASE-DESCRIPTION
    title: base description semantic and presentation conformance
    covers:
      - P-BASE-FIELDSET-DESCRIPTION-SEMANTICS
    expectation: Contribute passive descriptive content to the same Root through the scoped description relationship, mirror inherited disabled, and create no live region, editor or validation state. Full mapping is planned acceptance, not evidence supplied by a smoke or token check.
  - id: T-BASE-FIELDSET-0001-CASE-SHADCN-ROOT
    title: shadcn root semantic and presentation conformance
    covers:
      - P-SHADCN-FIELDSET-SEMANTICS
      - P-SHADCN-FIELDSET-INHERITANCE
      - P-SHADCN-FIELDSET-PRESENTATION
    expectation: Own the passive group, local-or-ancestor disabled policy and group naming/description relations. Preserve slotted children without creating value, validation, submission or focus ownership. Consume asFieldsetRoot once and retain the inherited renderer, Props, exposes and modules; add no second policy or relationship owner. Unboxed flexible vertical grouping with gap-4 and min-width shrink safety. Full mapping is planned acceptance, not evidence supplied by a smoke or token check.
  - id: T-BASE-FIELDSET-0001-CASE-SHADCN-LEGEND
    title: shadcn legend semantic and presentation conformance
    covers:
      - P-SHADCN-FIELDSET-LEGEND-SEMANTICS
      - P-SHADCN-FIELDSET-LEGEND-INHERITANCE
      - P-SHADCN-FIELDSET-LEGEND-PRESENTATION
    expectation: Contribute the visible group name as the scoped legend part; mirror inherited disabled and render passive slot content. Do not install control-label activation or a first-Legend exception. Consume asFieldsetLegend once and retain the inherited renderer, Props, exposes and modules; add no second policy or relationship owner. Medium-weight base text with bottom spacing; no uppercase transformation. Full mapping is planned acceptance, not evidence supplied by a smoke or token check.
  - id: T-BASE-FIELDSET-0001-CASE-SHADCN-DESCRIPTION
    title: shadcn description semantic and presentation conformance
    covers:
      - P-SHADCN-FIELDSET-DESCRIPTION-SEMANTICS
      - P-SHADCN-FIELDSET-DESCRIPTION-INHERITANCE
      - P-SHADCN-FIELDSET-DESCRIPTION-PRESENTATION
    expectation: Contribute passive descriptive content to the same Root through the scoped description relationship, mirror inherited disabled, and create no live region, editor or validation state. Consume asFieldsetDescription once and retain the inherited renderer, Props, exposes and modules; add no second policy or relationship owner. Small normal-weight muted wrapping help text. Full mapping is planned acceptance, not evidence supplied by a smoke or token check.
  - id: T-BASE-FIELDSET-0001-CASE-BRUTALIST-ROOT
    title: brutalist root semantic and presentation conformance
    covers:
      - P-BRUTALIST-FIELDSET-SEMANTICS
      - P-BRUTALIST-FIELDSET-INHERITANCE
      - P-BRUTALIST-FIELDSET-PRESENTATION
    expectation: Own the passive group, local-or-ancestor disabled policy and group naming/description relations. Preserve slotted children without creating value, validation, submission or focus ownership. Consume asFieldsetRoot once and retain the inherited renderer, Props, exposes and modules; add no second policy or relationship owner. Unboxed gap-4 vertical group with sans medium-weight foreground text. Full mapping is planned acceptance, not evidence supplied by a smoke or token check.
  - id: T-BASE-FIELDSET-0001-CASE-BRUTALIST-LEGEND
    title: brutalist legend semantic and presentation conformance
    covers:
      - P-BRUTALIST-FIELDSET-LEGEND-SEMANTICS
      - P-BRUTALIST-FIELDSET-LEGEND-INHERITANCE
      - P-BRUTALIST-FIELDSET-LEGEND-PRESENTATION
    expectation: Contribute the visible group name as the scoped legend part; mirror inherited disabled and render passive slot content. Do not install control-label activation or a first-Legend exception. Consume asFieldsetLegend once and retain the inherited renderer, Props, exposes and modules; add no second policy or relationship owner. Bold sans base-size legend with bottom spacing, without uppercase transformation. Full mapping is planned acceptance, not evidence supplied by a smoke or token check.
  - id: T-BASE-FIELDSET-0001-CASE-BRUTALIST-DESCRIPTION
    title: brutalist description semantic and presentation conformance
    covers:
      - P-BRUTALIST-FIELDSET-DESCRIPTION-SEMANTICS
      - P-BRUTALIST-FIELDSET-DESCRIPTION-INHERITANCE
      - P-BRUTALIST-FIELDSET-DESCRIPTION-PRESENTATION
    expectation: Contribute passive descriptive content to the same Root through the scoped description relationship, mirror inherited disabled, and create no live region, editor or validation state. Consume asFieldsetDescription once and retain the inherited renderer, Props, exposes and modules; add no second policy or relationship owner. Small medium-weight foreground help text with wrapping, not a muted-color substitution. Full mapping is planned acceptance, not evidence supplied by a smoke or token check.
  - id: T-BASE-FIELDSET-0001-CASE-BOOTSTRAP-2-3-2-ROOT
    title: bootstrap-2-3-2 root semantic and presentation conformance
    covers:
      - P-BOOTSTRAP-2-3-2-FIELDSET-SEMANTICS
      - P-BOOTSTRAP-2-3-2-FIELDSET-INHERITANCE

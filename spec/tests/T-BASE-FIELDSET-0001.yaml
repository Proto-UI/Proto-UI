    expectation: Own the passive group, local-or-ancestor disabled policy and group naming/description relations. Preserve slotted children without creating value, validation, submission or focus ownership. Consume asFieldsetRoot once and retain the inherited renderer, Props, exposes and modules; add no second policy or relationship owner. Block group with zero margin, padding and border; no card shell. Full mapping is planned acceptance, not evidence supplied by a smoke or token check.
  - id: T-BASE-FIELDSET-0001-CASE-BOOTSTRAP-2-3-2-LEGEND
    title: bootstrap-2-3-2 legend semantic and presentation conformance
    covers:
      - P-BOOTSTRAP-2-3-2-FIELDSET-LEGEND-SEMANTICS
      - P-BOOTSTRAP-2-3-2-FIELDSET-LEGEND-INHERITANCE
      - P-BOOTSTRAP-2-3-2-FIELDSET-LEGEND-PRESENTATION
    expectation: Contribute the visible group name as the scoped legend part; mirror inherited disabled and render passive slot content. Do not install control-label activation or a first-Legend exception. Consume asFieldsetLegend once and retain the inherited renderer, Props, exposes and modules; add no second policy or relationship owner. Full-width normal-weight 1.3125rem legend with 2.5rem line height, bottom border and spacing. Full mapping is planned acceptance, not evidence supplied by a smoke or token check.
  - id: T-BASE-FIELDSET-0001-CASE-BOOTSTRAP-2-3-2-DESCRIPTION
    title: bootstrap-2-3-2 description semantic and presentation conformance
    covers:
      - P-BOOTSTRAP-2-3-2-FIELDSET-DESCRIPTION-SEMANTICS
      - P-BOOTSTRAP-2-3-2-FIELDSET-DESCRIPTION-INHERITANCE
      - P-BOOTSTRAP-2-3-2-FIELDSET-DESCRIPTION-PRESENTATION
    expectation: Contribute passive descriptive content to the same Root through the scoped description relationship, mirror inherited disabled, and create no live region, editor or validation state. Consume asFieldsetDescription once and retain the inherited renderer, Props, exposes and modules; add no second policy or relationship owner. Block small normal-weight muted help text with leading-5 and wrapping. Full mapping is planned acceptance, not evidence supplied by a smoke or token check.
  - id: T-BASE-FIELDSET-0001-CASE-LIQUID-GLASS-ROOT
    title: liquid-glass root semantic and presentation conformance
    covers:
      - P-LIQUID-GLASS-FIELDSET-SEMANTICS
      - P-LIQUID-GLASS-FIELDSET-INHERITANCE
      - P-LIQUID-GLASS-FIELDSET-PRESENTATION
    expectation: Own the passive group, local-or-ancestor disabled policy and group naming/description relations. Preserve slotted children without creating value, validation, submission or focus ownership. Consume asFieldsetRoot once and retain the inherited renderer, Props, exposes and modules; add no second policy or relationship owner. Rounded bordered padded group with gap-3 and a version-2 in-app-backdrop material declaration, style fallback and liquid-glass intent. Material intent does not prove optical rendering. Full mapping is planned acceptance, not evidence supplied by a smoke or token check.
  - id: T-BASE-FIELDSET-0001-CASE-LIQUID-GLASS-LEGEND
    title: liquid-glass legend semantic and presentation conformance

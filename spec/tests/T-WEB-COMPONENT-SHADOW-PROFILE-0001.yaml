    summary: Connected mode-qualified Adapter admission and the S5 public-dist consumer alongside website and native lease evidence.
  - version: 0.3.0-alpha.0
    change: revised
    summary: Mapped passing S5 native adapter and bilingual website evidence including bounded geometry and native focus; real IME and cross-Shadow external IDREF remain outside this evidence.
  - version: 0.3.0-alpha.0
    change: revised
    summary: Added planned bounded S5 native editor surface evidence without claiming browser IME or geometry from DOM tests.
  - version: 0.3.0-alpha.0
    change: revised
    summary: Added S1 browser paths for customization removal after live theme, tone and slot updates; source independence and composed lifecycle remain bounded integration observations.
  - version: 0.3.0-alpha.0
    change: revised

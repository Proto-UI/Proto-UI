      since: 0.3.0-alpha.0
      anchors:
        - HC-SCROLL-SURFACE-0001-A
        - HC-SCROLL-SURFACE-0001-B
        - HC-SCROLL-SURFACE-0001-C
        - HC-SCROLL-SURFACE-0001-D
  adapters:
    - id: A-REACT-18-19-0001
      since: 0.3.0-alpha.0
      anchors:

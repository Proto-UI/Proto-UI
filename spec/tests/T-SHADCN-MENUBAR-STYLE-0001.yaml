id: T-SHADCN-MENUBAR-STYLE-0001
type: test
title: Menubar source-bound existing-part style projection
status: draft
since: 0.3.0-alpha.1
summary: Focused synthetic checks for two existing-part profiles, not native or complete Menubar acceptance.
lifecycleRationale:
  en: Focused synthetic tests have executed; independent acceptance and exact-head native/AT evidence remain required.
cases:
  - id: T-SHADCN-MENUBAR-STYLE-0001-CASE-PAINT
    title: Existing Root/Trigger/Content/Item state paint matches separate source recipes
    covers:
      - P-SHADCN-MENUBAR-SOURCE-BOUND-PARTS
    expectation: source-specific-default-expanded-focused-disabled-paint
  - id: T-SHADCN-MENUBAR-STYLE-0001-CASE-NO-RESET
    title: Shared scope switching withdraws old paint without semantic events or owner replacement
    covers:
      - P-SHADCN-MENUBAR-STYLE-SCOPE
      - P-SHADCN-MENUBAR-BASE-OWNERSHIP
    expectation: unchanged-base-value-and-logical-parts
  - id: T-SHADCN-MENUBAR-STYLE-0001-CASE-SOURCE-UNITS
    title: Static lowering retains source relative and pixel units
    covers:
      - P-SHADCN-MENUBAR-SOURCE-BOUND-PARTS
    expectation: rem-and-source-px-remain-distinct
  - id: T-SHADCN-MENUBAR-STYLE-0001-CASE-NATIVE
    title: Four Web native input and physical lifecycle evidence remains required
    covers:
      - P-SHADCN-MENUBAR-BASE-OWNERSHIP
      - P-SHADCN-MENUBAR-REMAINING-CLOSURE
    expectation: no-acceptance-from-synthetic-style-presence
verifies:
  prototypes:
    - id: P-SHADCN-MENUBAR
      anchors:
        - P-SHADCN-MENUBAR-STYLE-SCOPE
        - P-SHADCN-MENUBAR-SOURCE-BOUND-PARTS
        - P-SHADCN-MENUBAR-BASE-OWNERSHIP
        - P-SHADCN-MENUBAR-REMAINING-CLOSURE
openQuestions:
  - id: T-SHADCN-MENUBAR-STYLE-0001-Q-NATIVE-ACCEPTANCE
    question:
      en: Which native evidence completes Menubar ownership and the remaining family closure?
    context:
      en: >-
        The real public Rhea browser consumer authors four-runtime light/dark physical paint, keyboard focus/navigation, Escape restoration and pointer selection at both font scales. New York native parity, controlled refusal, disabled/touch behavior, complete submenu behavior and assistive-technology acceptance remain pending. Its narrower scope cannot establish the original full native case or complete-family acceptance; synthetic existing-part style tests remain separate.


    blocks:
      - implementation:T-SHADCN-MENUBAR-STYLE-0001#website-shadcn-menubar-rhea-native
      - criterion:P-SHADCN-MENUBAR#P-SHADCN-MENUBAR-BASE-OWNERSHIP
      - criterion:P-SHADCN-MENUBAR#P-SHADCN-MENUBAR-REMAINING-CLOSURE
      - activation:T-SHADCN-MENUBAR-STYLE-0001
implementations:
  - id: website-shadcn-menubar-rhea-native
    kind: runtime-test
    status: planned
    path: apps/www/src/content/docs/zh-cn/demo-shadcn-menubar.browser.test.ts
    required: true
    consumesCases: [T-SHADCN-MENUBAR-STYLE-0001-CASE-NATIVE]
    exercises: [P-SHADCN-MENUBAR]
    notes:
      - >-
        Existing authored Rhea public-consumer assertions cover WC, React, Vue 3 and Vue 2, light/dark paint, both font scales, real keyboard entry/navigation, Escape focus restoration and pointer selection. No fresh result is claimed. New York, controlled/disabled/touch, complete submenu and AT evidence remain required; NATIVE is not assigned to the synthetic existing-part implementation.


  - id: shadcn-menubar-existing-part-projection
    kind: module-test
    status: active
    path: packages/prototypes/shadcn/test/menubar-style-projection.test.ts
    required: true
    consumesCases:
      - T-SHADCN-MENUBAR-STYLE-0001-CASE-PAINT
      - T-SHADCN-MENUBAR-STYLE-0001-CASE-NO-RESET
      - T-SHADCN-MENUBAR-STYLE-0001-CASE-SOURCE-UNITS
    exercises: [P-SHADCN-MENUBAR]
    notes:
      - Executable synthetic adapter and CSS-lowering checks; not native rendering or complete-family acceptance.
exercises:
  prototypes:
    - P-SHADCN-MENUBAR
sources:
  - path: packages/prototypes/shadcn/test/menubar-style-projection.test.ts
  - path: apps/www/src/content/docs/zh-cn/demo-shadcn-menubar.browser.test.ts
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Describe focused projection tests and outstanding native acceptance.
tags:
  - prototype
  - shadcn
  - menubar
  - test

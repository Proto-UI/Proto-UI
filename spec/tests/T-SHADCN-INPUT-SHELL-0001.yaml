id: T-SHADCN-INPUT-SHELL-0001
type: test
title: Bounded input shell composition and public catalog evidence
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Maps existing shell tests and native collector plus the new catalog regression without treating source inspection or historical PR 971 results as a fresh run. Criterion-level mapping, missing derived-editor coverage and independent review remain pending.
summary: Separates binder lifecycle, real-consumer presentation, native measurements and catalog ownership from full inherited-editor conformance.
cases:
  - id: T-SHADCN-INPUT-SHELL-0001-CASE-BINDING
    title: Public facts and explicit view lifetime
    covers: [P-SHADCN-INPUT-SHELL-BINDING-FACTS, P-SHADCN-INPUT-SHELL-BINDING-LIFETIME]
    expectation: Missing/malformed facts and duplicate real identities fail; replacement, disposal and owner retirement detach subscriptions, and stale or reentrant callbacks never publish retired facts. Caller fact merging must retain authored presentation inputs. Public terminal disconnect must release both identity reservations and every subscription without reading the dead source, including synchronous disconnect during attachment and cleanup failure; a stale generation disconnect must not retire its replacement.
  - id: T-SHADCN-INPUT-SHELL-0001-CASE-CONSUMERS
    title: Command and ordinary Input retain one actual editor through style changes
    covers:
      [
        P-SHADCN-INPUT-SHELL-STYLE-SELECTION,
        P-SHADCN-INPUT-SHELL-OUTER-PAINT,
        P-SHADCN-INPUT-SHELL-CONTROL-PAINT,
        P-SHADCN-INPUT-SHELL-CONTROL-STYLE-CONTINUITY,
      ]
    expectation: Both consumers use the same passive shell and binder; borderless editor identity and selected value/selection/focus persist across style scope changes. Ordinary editor remains distinct from Command. Existing tests cover only part of the profile matrix; direct shell/control negative-profile and alias/withdrawal coverage must be reviewed separately.
  - id: T-SHADCN-INPUT-SHELL-0001-CASE-NATIVE
    title: Exact-source four-Web-runtime native shell observations
    covers:
      [
        P-SHADCN-INPUT-SHELL-OUTER-PAINT,
        P-SHADCN-INPUT-SHELL-FOCUS-PAINT,
        P-SHADCN-INPUT-SHELL-CONTROL-PAINT,
        P-SHADCN-INPUT-SHELL-CONTROL-STYLE-CONTINUITY,
      ]
    expectation: Source receipts bind real WC/React/Vue/Vue2 measurements and images to the tested head; fixed theme geometry and keyboard ring distinction, selected continuity/readOnly/disabled flows and 320/1180 text200 bounds remain strict. Failures retain artifacts. Text resizing is not browser UI zoom, and the collector is not full Base Input or non-Web conformance.
  - id: T-SHADCN-INPUT-SHELL-0001-CASE-CATALOG
    title: Actual public export has real draft owners without a policy exemption
    covers: [P-SHADCN-INPUT-SHELL-PUBLIC-BOUNDARY, P-SHADCN-INPUT-SHELL-CONTROL-BOUNDARY]
    expectation: The real manifest entry resolves to the bounded draft Root identity, its separate Control owns the correct source and inherits Base Input, and both retain reciprocal P/T mappings. Removing the Root restores the exact missing-family diagnostic; unrelated missing exports still fail. At a release that includes this family, missing overview and sidebar still fail.
  - id: T-SHADCN-INPUT-SHELL-0001-CASE-BOUNDARIES
    title: Complete passive and direct profile-boundary coverage
    covers:
      [
        P-SHADCN-INPUT-SHELL-PASSIVE,
        P-SHADCN-INPUT-SHELL-PUBLIC-BOUNDARY,
        P-SHADCN-INPUT-SHELL-STYLE-SELECTION,
        P-SHADCN-INPUT-SHELL-CONTROL-STYLE-CONTINUITY,
      ]
    expectation: Explicit direct-entry tests establish no shell role/tabindex/interaction ownership, caller-owned single-control and fact-merge boundaries, and direct Root/Control unsupported-profile rejection, alias and withdrawal. Existing Command-only negative tests do not automatically cover both entries.
  - id: T-SHADCN-INPUT-SHELL-0001-CASE-INHERITED
    title: Complete Base Input guarantees through this derived entry
    covers: [P-SHADCN-INPUT-SHELL-CONTROL-BASE-OWNERSHIP, P-SHADCN-INPUT-SHELL-CONTROL-BOUNDARY]
    expectation: Exercise controlled/uncontrolled ownership, normalization, composition/IME, native-prop updates, naming/description and disabled-aware physical focus through inputShellControl itself. A reusable Base suite must be adapted explicitly; a relation or successful shell geometry run is insufficient evidence.

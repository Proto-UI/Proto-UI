id: T-LIFECYCLE-0005
type: test
title: Lifecycle ownership and repeatable host binding tests
status: draft
since: 0.1.0
summary: Adapter conformance tests prove that one host owner retains one Proto instance across view epochs and disposes it at terminal teardown.
cases:
  - id: T-LIFECYCLE-0005-CASE-OWNER-ONE-INSTANCE
    title: One host component owner creates one Proto instance
    covers:
      - C-LIFECYCLE-0007-A
    expectation: host-owner-creates-one-proto-instance
  - id: T-LIFECYCLE-0005-CASE-INTERNAL-CONDITIONAL-VIEW
    title: Adapter-internal conditional rendering remounts the same Proto instance
    covers:
      - C-LIFECYCLE-0007-B
      - C-LIFECYCLE-0006-D
    expectation: conditional-view-rebinds-same-proto-instance
  - id: T-LIFECYCLE-0005-CASE-TERMINAL-OWNER-TEARDOWN
    title: Terminal host teardown disposes the owned Proto instance once
    covers:
      - C-LIFECYCLE-0007-C
    expectation: terminal-owner-teardown-disposes-once
  - id: T-LIFECYCLE-0005-CASE-HOST-BINDING-REVOKED
    title: Detached view bindings are revoked before a later binding is attached
    covers:
      - C-LIFECYCLE-0006-C
    expectation: stale-host-binding-is-unavailable-after-detach
  - id: T-LIFECYCLE-0005-CASE-STALE-COMPLETION
    title: Late commit completion from an invalidated epoch has no runtime or module effects
    covers:
      - C-LIFECYCLE-0006-C
    expectation: stale-epoch-completion-is-inert
  - id: T-LIFECYCLE-0005-CASE-MODULE-RESOURCE-SYMMETRY
    title: Mixed modules suspend host resources and realize their latest logical state on remount
    covers:
      - C-LIFECYCLE-0006-B
      - C-LIFECYCLE-0006-D
    expectation: mixed-module-resources-suspend-and-resume-symmetrically
implementations:
  - id: adapter-react-lifecycle-ownership
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/lifecycle-repeatable-mount.test.ts
    required: true
    consumesCases:
      - T-LIFECYCLE-0005-CASE-OWNER-ONE-INSTANCE
      - T-LIFECYCLE-0005-CASE-INTERNAL-CONDITIONAL-VIEW
      - T-LIFECYCLE-0005-CASE-TERMINAL-OWNER-TEARDOWN
      - T-LIFECYCLE-0005-CASE-HOST-BINDING-REVOKED
  - id: adapter-vue-lifecycle-ownership
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/lifecycle-keep-alive.test.ts
    required: true
    consumesCases:
      - T-LIFECYCLE-0005-CASE-OWNER-ONE-INSTANCE
      - T-LIFECYCLE-0005-CASE-INTERNAL-CONDITIONAL-VIEW
      - T-LIFECYCLE-0005-CASE-TERMINAL-OWNER-TEARDOWN
      - T-LIFECYCLE-0005-CASE-HOST-BINDING-REVOKED
  - id: adapter-vue2-lifecycle-ownership
    kind: adapter-test
    status: passing
    path: packages/adapters/vue2/test/lifecycle.test.ts
    required: true
    consumesCases:
      - T-LIFECYCLE-0005-CASE-OWNER-ONE-INSTANCE
      - T-LIFECYCLE-0005-CASE-INTERNAL-CONDITIONAL-VIEW
      - T-LIFECYCLE-0005-CASE-TERMINAL-OWNER-TEARDOWN
  - id: adapter-react-strict-replay
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/lifecycle-strict-replay.test.ts
    required: true
    consumesCases:
      - T-LIFECYCLE-0005-CASE-INTERNAL-CONDITIONAL-VIEW
      - T-LIFECYCLE-0005-CASE-TERMINAL-OWNER-TEARDOWN
  - id: runtime-lifecycle-transition-matrix
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/lifecycle.session.transitions.v1.contract.test.ts
    required: true
    consumesCases:
      - T-LIFECYCLE-0005-CASE-HOST-BINDING-REVOKED
      - T-LIFECYCLE-0005-CASE-STALE-COMPLETION
  - id: runtime-module-resource-ownership
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/lifecycle.module-resources.v1.contract.test.ts
    required: true
    consumesCases:
      - T-LIFECYCLE-0005-CASE-MODULE-RESOURCE-SYMMETRY
verifies:
  contracts:
    - id: C-LIFECYCLE-0006
    - id: C-LIFECYCLE-0007

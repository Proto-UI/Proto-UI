    title: Busy and live region updates retain descendant and focus identity
    covers:
      - P-SHADCN-ASYNC-REGION-BASE
      - P-SHADCN-LIVE-REGION-BASE
    expectation: prop-updates-preserve-content-and-focus
  - id: T-SHADCN-PASSIVE-PROJECTIONS-0001-CASE-IMAGE
    title: Image View source, alternative text, fit and loading transitions through the host-owned target
    covers:
      - P-SHADCN-IMAGE-BASE
      - P-SHADCN-IMAGE-VISUAL
    expectation: image-view-module-transport-and-lifecycle
  - id: T-SHADCN-PASSIVE-PROJECTIONS-0001-CASE-TRANSITION
    title: Standalone Transition slot identity, phase endpoints, reversal and reduced motion
    covers:
      - P-SHADCN-TRANSITION-BASE
      - P-SHADCN-TRANSITION-VISUAL
    expectation: slot-preserving-phase-sequencing
  - id: T-SHADCN-PASSIVE-PROJECTIONS-0001-CASE-TABLE
    title: Table topology, spans, ordered header relationships, section borders, profile switching and withdrawal
    covers:
      - P-SHADCN-TABLE-BASE
      - P-SHADCN-TABLE-VISUAL
      - P-SHADCN-TABLE-ROW-VISUAL
      - P-SHADCN-TABLE-CELL-VISUAL
      - P-SHADCN-TABLE-HEADER-CELL-VISUAL
      - P-SHADCN-TABLE-CAPTION-VISUAL

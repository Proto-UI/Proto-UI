    notes:
      - Exercises web.ts resolveWebTextControlLocalName('single') → 'input', inputMode/enterKeyHint/type projection, and CR/LF canonicalization through the web bridge. Cross-adapter single-line materialization and module-boundary canonicalization through TextControlModuleImpl are covered by impl-spec.test.ts and adapter integration tests.

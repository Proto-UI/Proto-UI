id: T-BRUTALIST-SPINNER-0001
type: test
title: Brutalist Spinner direct-ownership and visual contract tests
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: New draft test entity delivering the admitted Spinner carrier's executable evidence; module-test coverage proves direct ownership, semantic absence, size mapping, ring grammar, and reduced-motion retention without promoting any entity to active.
summary: Covers direct ownership without a Base Spinner hook, semantic absence, size mapping and default restoration, circular open-edge ring grammar, and reduced-motion fallback retention.
cases:
  - id: T-BRUTALIST-SPINNER-0001-CASE-DIRECT-OWNERSHIP
    title: Spinner owns the visual-only prototype directly without a Base Spinner hook
    covers: [P-BRUTALIST-SPINNER-DIRECT-OWNERSHIP]
    expectation: spinner-owns-direct-visual-only-prototype
  - id: T-BRUTALIST-SPINNER-0001-CASE-SEMANTIC-ABSENCE
    title: Spinner is aria-hidden, roleless, non-focusable, and contentless
    covers: [P-BRUTALIST-SPINNER-DIRECT-OWNERSHIP]
    expectation: spinner-semantic-absence
  - id: T-BRUTALIST-SPINNER-0001-CASE-SIZE
    title: Every size maps to its square Root dimensions and md restores after prop removal
    covers: [P-BRUTALIST-SPINNER-SIZE-PROP]
    expectation: spinner-size-mapping-and-default-restoration
  - id: T-BRUTALIST-SPINNER-0001-CASE-VISUAL
    title: Root projects the circular open-edge ring grammar without fill or soft effects
    covers: [P-BRUTALIST-SPINNER-VISUAL-GRAMMAR]
    expectation: spinner-open-edge-ring-grammar
  - id: T-BRUTALIST-SPINNER-0001-CASE-REDUCED-MOTION
    title: The open edge stays the reduced-motion fallback while rotation is on by default
    covers: [P-BRUTALIST-SPINNER-MOTION-REDUCED-MOTION]
    expectation: spinner-reduced-motion-fallback-retention
  - id: T-BRUTALIST-SPINNER-0001-CASE-CROSS-RUNTIME-BROWSER
    title: Both parent compositions preserve Spinner's visual and semantic boundary across runtimes and themes
    covers:
      - P-BRUTALIST-SPINNER-DIRECT-OWNERSHIP
      - P-BRUTALIST-SPINNER-SIZE-PROP
      - P-BRUTALIST-SPINNER-VISUAL-GRAMMAR
      - D-BRUTALIST-STYLED-ONLY-ADMISSION-0001-SPINNER-COMPOSITIONS
    expectation: spinner-cross-runtime-browser-baseline
  - id: T-BRUTALIST-SPINNER-0001-CASE-BROWSER-MOTION
    title: Browser computed style removes rotation under reduced motion and retains the open edge
    covers: [P-BRUTALIST-SPINNER-MOTION-REDUCED-MOTION]
    expectation: spinner-rendered-motion-and-static-open-edge
implementations:
  - id: prototypes-brutalist-spinner-contract
    kind: module-test
    status: passing
    path: packages/prototypes/brutalist/test/spinner.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-SPINNER-0001-CASE-DIRECT-OWNERSHIP
      - T-BRUTALIST-SPINNER-0001-CASE-SEMANTIC-ABSENCE
      - T-BRUTALIST-SPINNER-0001-CASE-SIZE
      - T-BRUTALIST-SPINNER-0001-CASE-VISUAL
      - T-BRUTALIST-SPINNER-0001-CASE-REDUCED-MOTION
    exercises: [P-BRUTALIST-SPINNER]
  - id: prototypes-brutalist-spinner-browser
    kind: adapter-test
    status: passing
    path: apps/www/src/content/docs/zh-cn/demo-brutalist-spinner.browser.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-SPINNER-0001-CASE-CROSS-RUNTIME-BROWSER
      - T-BRUTALIST-SPINNER-0001-CASE-BROWSER-MOTION
    exercises: [P-BRUTALIST-SPINNER]
verifies:
  prototypes:
    - id: P-BRUTALIST-SPINNER
      anchors:
        - P-BRUTALIST-SPINNER-DIRECT-OWNERSHIP
        - P-BRUTALIST-SPINNER-SIZE-PROP

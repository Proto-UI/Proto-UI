  decisions: [D-BRUTALIST-STYLED-ONLY-ADMISSION-0001]
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added Brutalist Spinner direct-ownership, semantic-absence, size, visual, and reduced-motion coverage.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Mapped four-runtime parent-composition browser evidence and rendered reduced-motion coverage without lifecycle promotion.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Updated the draft circular ring expectation and added source-bound visual, contrast, and motion evidence across all four Web runtimes without semantic or lifecycle expansion.
tags: [prototype, brutalist, spinner, test, styled-only, reduced-motion]

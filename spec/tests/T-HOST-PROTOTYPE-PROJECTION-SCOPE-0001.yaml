id: T-HOST-PROTOTYPE-PROJECTION-SCOPE-0001
type: test
title: Host Prototype projection-scope coherence tests
status: draft
since: 0.3.0-alpha.0
summary: Maps manifest, unit, and real-browser evidence for coherent Runtime and projection-lane switching across Website-owned selection controls, composition content, themes, and portaled overlays.
cases:
  - id: T-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-CASE-MANIFEST-COMPLETENESS
    title: an explicit projection-lane manifest resolves complete part and auxiliary recipe Prototype mappings with declared Base lineage
    covers:
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-EXPLICIT-MANIFEST
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-FAIL-CLOSED
    expectation: explicit-lane-manifest-classifies-complete-part-and-auxiliary-lineage-and-rejects-missing-mappings
  - id: T-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-CASE-ORTHOGONAL-ATOMIC-SWITCH
    title: Runtime and design-language switches including requests during initial preparation activate only the latest complete generation
    covers:
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-ORTHOGONAL-SELECTION
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-ATOMIC-GENERATION
    expectation: four-runtimes-by-two-lanes-and-pending-initial-supersession-never-expose-a-stale-mixed-or-partial-generation
  - id: T-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-CASE-PORTAL-THEME-CLOSURE
    title: Select trigger content and items retain the selected projection lane and Light or Dark theme across body portals
    covers:
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-PORTAL-CLOSURE
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-ORTHOGONAL-SELECTION
    expectation: visible-portal-surfaces-carry-the-current-lane-generation-and-theme-without-page-inheritance
  - id: T-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-CASE-PORTAL-OBSERVER-SCALING
    title: one document observer dispatches portal reconciliation only to the affected owner and generation
    covers:
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-PORTAL-CLOSURE
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-ATOMIC-GENERATION
    expectation: portal-mutations-trigger-one-owner-generation-filtered-document-scan
  - id: T-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-CASE-NO-HYBRID-PRESENTATION
    title: Brutalist and Shadcn scope controls use their own Prototype identities behavior and style assets rather than recolored foreign-lane chrome
    covers:
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-ORTHOGONAL-SELECTION
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-NO-HYBRID-PRESENTATION
      - C-PROTOTYPE-STYLE-CLOSURE-0001-C
    expectation: selected-lane-controls-contain-no-hard-coded-or-recolored-foreign-prototype-parts
  - id: T-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-CASE-STATE-FOCUS-CONTINUITY
    title: controlled selections and semantic focus survive rematerialization without delayed cleanup stealing later user focus
    covers:
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-STATE-BOUNDARY
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-ATOMIC-GENERATION
    expectation: controlled-selection-and-post-commit-focus-restore-precedes-cleanup-and-never-reuses-replaced-instances
  - id: T-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-CASE-STALE-CLEANUP
    title: stale loads fulfilled start caches events cleanup and client retention cannot commit erase retain or block retry of a superseded generation
    covers:
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-ATOMIC-GENERATION
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-FAIL-CLOSED
    expectation: generation-guarded-completion-start-cache-cleanup-and-client-registries-preserve-only-current-owned-trees
  - id: T-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-CASE-WEBSITE-BOUNDARY
    title: projection-lane tokens remain inside the scope explicit host light or dark activation wins over system preference and unrelated Website chrome retains the site theme
    covers:
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-PORTAL-CLOSURE
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-NEGATIVE-BOUNDARY
      - C-PROTOTYPE-STYLE-CLOSURE-0001-C
      - C-PROTOTYPE-STYLE-CLOSURE-0001-D
    expectation: explicit-host-theme-controls-the-preview-lane-without-root-mutation-or-unrelated-site-recoloring
  - id: T-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-CASE-SURFACE-METADATA-CLOSURE
    title: every marker-bearing HTML or SVG Prototype surface receives the current generation coordinates identity and direct theme copy
    covers:
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-EXPLICIT-MANIFEST
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-PORTAL-CLOSURE
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-NO-HYBRID-PRESENTATION
    expectation: html-and-svg-prototype-surfaces-carry-complete-generation-metadata-and-theme-values
  - id: T-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-CASE-INITIAL-FAILURE-SURFACE
    title: an initial materialization failure renders its exact error successful retry replaces it and replacement failure retains the committed generation
    covers:
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-FAIL-CLOSED
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-ATOMIC-GENERATION
    expectation: empty-initial-host-renders-error-successful-retry-removes-it-and-retained-generation-is-never-overwritten
  - id: T-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-CASE-TEARDOWN-AWAIT
    title: active disposal begins immediately while repeated destroy callers await pending cleanup and late materialization cannot repopulate client registries
    covers:
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-ATOMIC-GENERATION
    expectation: destroy-starts-active-disposal-before-pending-work-and-shares-one-promise-without-post-destroy-retention

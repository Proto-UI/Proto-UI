    required: true
    consumesCases:
      - T-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-CASE-ORTHOGONAL-ATOMIC-SWITCH
      - T-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-CASE-PORTAL-THEME-CLOSURE
    exercises:
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001
  - id: www-projection-scope-browser
    kind: runtime-test
    status: passing
    path: apps/www/src/content/docs/zh-cn/prototype-projection-scope.browser.test.ts
    required: true
    consumesCases:
      - T-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-CASE-ORTHOGONAL-ATOMIC-SWITCH
      - T-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-CASE-PORTAL-THEME-CLOSURE
      - T-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-CASE-NO-HYBRID-PRESENTATION
      - T-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-CASE-STATE-FOCUS-CONTINUITY
      - T-HOST-PROTOTYPE-PROJECTION-SCOPE-0001-CASE-WEBSITE-BOUNDARY
    exercises:
      - D-HOST-PROTOTYPE-PROJECTION-SCOPE-0001
      - A-WEB-COMPONENT-0001
      - A-REACT-18-19-0001
      - A-VUE-3-0001
      - A-VUE-2-0001
      - P-SHADCN-SELECT
      - P-BRUTALIST-SELECT

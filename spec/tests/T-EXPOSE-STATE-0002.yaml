id: T-EXPOSE-STATE-0002
type: test
title: Expose State Module, record sink, and Adapter conformance
status: draft
since: 0.2.0-rc.7
summary: Module, Runtime, Adapter-base, official Adapter, and schema evidence verifies finalized-record composition, stable external handles, sink replacement lifecycle, required support, and separation from Web-only projection.
cases:
  - id: T-EXPOSE-STATE-0002-CASE-COMPOSITION
    title: Expose State composes a finalized record without an author facade
    covers:
      - M-EXPOSE-STATE-0001-A
      - M-EXPOSE-STATE-0001-B
      - M-EXPOSE-STATE-0001-H
    expectation: expose-and-state-compose-one-final-record
  - id: T-EXPOSE-STATE-0002-CASE-EXTERNAL-HANDLE
    title: Internal State authority is attenuated into a stable external handle
    covers:
      - M-EXPOSE-STATE-0001-C
      - M-EXPOSE-STATE-0001-D
      - C-EXPOSE-STATE-0001-I
      - HC-EXPOSES-RECORD-SINK-0001-B
    expectation: stable-read-only-same-source-external-handle
  - id: T-EXPOSE-STATE-0002-CASE-LIFECYCLE
    title: External handles and outward records follow instance lifetime
    covers:
      - M-EXPOSE-STATE-0001-E
      - M-EXPOSE-STATE-0001-G
      - HC-EXPOSES-RECORD-SINK-0001-D
    expectation: preserve-view-epochs-and-clear-terminal-or-old-sink
  - id: T-EXPOSE-STATE-0002-CASE-SINK
    title: Adapter sink receives complete host-neutral replacement snapshots
    covers:
      - M-EXPOSE-STATE-0001-F
      - M-EXPOSE-STATE-0001-G
      - HC-EXPOSES-RECORD-SINK-0001-A
      - HC-EXPOSES-RECORD-SINK-0001-B
      - HC-EXPOSES-RECORD-SINK-0001-C
      - HC-EXPOSES-RECORD-SINK-0001-D
      - HC-EXPOSES-RECORD-SINK-0001-E
    expectation: finalized-record-replacement-sink
  - id: T-EXPOSE-STATE-0002-CASE-PROFILES
    title: Official Adapter profiles install Expose State and provide its sink
    covers:
      - M-EXPOSE-STATE-0001-F
      - A-REACT-18-19-0001-L
      - A-VUE-3-0001-L
      - A-VUE-2-0001-L
      - A-WEB-COMPONENT-0001-L
    expectation: official-adapters-provide-required-expose-state-composition
  - id: T-EXPOSE-STATE-0002-CASE-WEB-BOUNDARY
    title: DOM and CSS mirroring remains outside Expose State core
    covers:
      - M-EXPOSE-STATE-0001-I
      - HC-EXPOSES-RECORD-SINK-0001-E
    expectation: web-projection-is-a-separate-peripheral-module
implementations:
  - id: module-expose-state-compositor-contract
    kind: module-test
    status: passing
    path: packages/modules/expose-state/test/impl-spec.test.ts
    required: true
    consumesCases:
      - T-EXPOSE-STATE-0002-CASE-COMPOSITION
      - T-EXPOSE-STATE-0002-CASE-EXTERNAL-HANDLE
      - T-EXPOSE-STATE-0002-CASE-LIFECYCLE
      - T-EXPOSE-STATE-0002-CASE-SINK
  - id: runtime-expose-state-finalization-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/expose-state.v0.contract.test.ts
    required: true
    consumesCases:
      - T-EXPOSE-STATE-0002-CASE-COMPOSITION
      - T-EXPOSE-STATE-0002-CASE-EXTERNAL-HANDLE
      - T-EXPOSE-STATE-0002-CASE-SINK
  - id: runtime-expose-state-instance-lifecycle-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/lifecycle.module-resources.v1.contract.test.ts
    required: true
    consumesCases:

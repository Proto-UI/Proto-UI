  - id: adapter-web-component-expose-state-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/contract/expose.basic.v0.contract.test.ts
    required: true
    consumesCases:
      - T-EXPOSE-STATE-0002-CASE-EXTERNAL-HANDLE
      - T-EXPOSE-STATE-0002-CASE-PROFILES
  - id: adapter-profile-expose-state-schema
    kind: workspace-check
    status: passing
    path: packages/spec/fixtures/test/adapter-profile-schema.test.ts
    required: true
    consumesCases:
      - T-EXPOSE-STATE-0002-CASE-PROFILES
  - id: module-expose-state-web-boundary
    kind: workspace-check
    status: passing
    path: packages/modules/expose-state-web/src/create.ts
    required: true
    consumesCases:
      - T-EXPOSE-STATE-0002-CASE-WEB-BOUNDARY

      - T-EXPOSE-STATE-0002-CASE-LIFECYCLE
  - id: adapter-base-external-handle-identity-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/base/test/contract/expose-record.v0.contract.test.ts
    required: true
    consumesCases:
      - T-EXPOSE-STATE-0002-CASE-EXTERNAL-HANDLE
      - T-EXPOSE-STATE-0002-CASE-SINK
  - id: adapter-react-expose-state-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/expose.test.ts
    required: true
    consumesCases:
      - T-EXPOSE-STATE-0002-CASE-EXTERNAL-HANDLE
      - T-EXPOSE-STATE-0002-CASE-PROFILES
  - id: adapter-vue-expose-state-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/expose.test.ts
    required: true
    consumesCases:
      - T-EXPOSE-STATE-0002-CASE-EXTERNAL-HANDLE
      - T-EXPOSE-STATE-0002-CASE-PROFILES
  - id: adapter-vue2-expose-state-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/vue2/test/expose.test.ts
    required: true
    consumesCases:
      - T-EXPOSE-STATE-0002-CASE-EXTERNAL-HANDLE

    required: true
    consumesCases: [T-SHADCN-SCROLL-AREA-0001-CASE-PUBLIC-SURFACE]
    exercises: *scroll-area-prototypes
  - id: type-shadcn-scroll-area-export-parity
    kind: workspace-check
    status: passing
    path: internal/contracts/types/prototype-family-exports.contract.v0.type-test.ts
    required: true
    consumesCases: [T-SHADCN-SCROLL-AREA-0001-CASE-PUBLIC-SURFACE]
    exercises: *scroll-area-prototypes
  - id: www-shadcn-scroll-area-browser
    kind: adapter-test
    status: planned
    path: apps/www/src/content/docs/zh-cn/demo-shadcn-scroll-area.browser.test.ts

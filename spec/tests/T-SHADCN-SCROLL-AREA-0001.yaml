      - T-SHADCN-SCROLL-AREA-0001-CASE-SURFACES
      - T-SHADCN-SCROLL-AREA-0001-CASE-COMPOSED-PREFERENCE
      - T-SHADCN-SCROLL-AREA-0001-CASE-HOST-BEHAVIOR
    notes:
      - The repaired consumer retains unsupported-prop type checks, real host behavior and lifecycle assertions; an incidental exhaustive module-export snapshot is not evidence for this implementation. CLI and package type checks remain independently mapped.
      - New York paint follows the existing f31ed819 baseline and retained 3d98900e comparison with inherited Viewport radius, left/top track borders and no Thumb border. Exact-source execution and native forced-color acceptance remain pending.
    exercises: &scroll-area-prototypes
      - P-BASE-SCROLL-AREA
      - P-BASE-SCROLL-AREA-VIEWPORT
      - P-BASE-SCROLL-AREA-SCROLLBAR
      - P-BASE-SCROLL-AREA-THUMB
      - P-SHADCN-SCROLL-AREA
      - P-SHADCN-SCROLL-AREA-VIEWPORT
      - P-SHADCN-SCROLL-AREA-SCROLLBAR
      - P-SHADCN-SCROLL-AREA-THUMB
  - id: cli-shadcn-scroll-area-facade
    kind: workspace-check
    status: passing

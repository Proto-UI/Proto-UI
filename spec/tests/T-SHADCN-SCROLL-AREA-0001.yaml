id: T-SHADCN-SCROLL-AREA-0001
type: test
title: shadcn Scroll Area inheritance, fallback, package, geometry, and rendered tests
status: draft
lifecycleRationale: This execution map accompanies the draft Shadcn four-part slice. Direct fallback, package, geometry and browser tests are technical evidence for independent review, not activation of the mapped prototypes.
since: 0.3.0-alpha.0
summary: "Covers four-part API boundaries, independently mapped package/CLI checks, retained New York paint, a fallible composed preference, unsupported-composed fallback, two-axis host behavior, passive controls, teardown and separately mapped real cross-runtime geometry. The modified module consumer remains unrun."
cases:
  - id: T-SHADCN-SCROLL-AREA-0001-CASE-CORNER
    title: Rendered tracks reserve a continuous unpainted lower-right intersection with no second control
    covers:
      - P-SHADCN-SCROLL-AREA-SCROLLBAR-CORNER
    expectation: measured-inset-keeps-controls-out-of-unpainted-corner-across-four-web-runtimes
  - id: T-SHADCN-SCROLL-AREA-0001-CASE-PUBLIC-SURFACE
    title: Portable four-part APIs reject unsupported host-specific props while package and CLI checks retain their own coverage
    covers:
      - P-SHADCN-SCROLL-AREA-UPSTREAM-IDENTITY
      - P-SHADCN-SCROLL-AREA-DIRECT-ENTRY
      - P-SHADCN-SCROLL-AREA-PUBLIC-SURFACE
      - P-SHADCN-SCROLL-AREA-COMPATIBILITY-SUBSET
      - P-SHADCN-SCROLL-AREA-VIEWPORT-DIRECT-ENTRY
      - P-SHADCN-SCROLL-AREA-SCROLLBAR-DIRECT-ENTRY
      - P-SHADCN-SCROLL-AREA-THUMB-DIRECT-ENTRY
    expectation: portable-four-part-props-and-independent-package-cli-surfaces-without-an-exhaustive-module-export-snapshot
  - id: T-SHADCN-SCROLL-AREA-0001-CASE-SURFACES
    title: New York Viewport inherits radius and oriented tracks retain inward borders with a borderless passive Thumb
    covers:
      - P-SHADCN-SCROLL-AREA-CURRENT-VISUAL-SURFACE
      - P-SHADCN-SCROLL-AREA-VIEWPORT-CURRENT-VISUAL-SURFACE
      - P-SHADCN-SCROLL-AREA-VIEWPORT-FOCUS-FEEDBACK
      - P-SHADCN-SCROLL-AREA-SCROLLBAR-CURRENT-VISUAL-SURFACE
      - P-SHADCN-SCROLL-AREA-SCROLLBAR-ORIENTED-GEOMETRY
      - P-SHADCN-SCROLL-AREA-THUMB-CURRENT-VISUAL-SURFACE
    expectation: shadcn-scroll-area-projects-complete-common-and-oriented-surfaces
  - id: T-SHADCN-SCROLL-AREA-0001-CASE-COMPOSED-PREFERENCE
    title: Viewport requests composed chrome as a fallible preference
    covers:
      - P-SHADCN-SCROLL-AREA-VIEWPORT-BASE-INHERITANCE
      - P-SHADCN-SCROLL-AREA-VIEWPORT-COMPOSED-PREFERENCE
    expectation: shadcn-viewport-resolves-composed-when-supported-and-system-when-composed-is-unsupported
  - id: T-SHADCN-SCROLL-AREA-0001-CASE-HOST-BEHAVIOR
    title: One host-owned Viewport drives both axes guarded Thumb movement replacement and teardown
    covers:
      - P-SHADCN-SCROLL-AREA-BASE-INHERITANCE
      - P-SHADCN-SCROLL-AREA-OWNERSHIP-BOUNDARY
      - P-SHADCN-SCROLL-AREA-SCROLLBAR-BASE-INHERITANCE
      - P-SHADCN-SCROLL-AREA-THUMB-BASE-INHERITANCE
      - P-SHADCN-SCROLL-AREA-THUMB-PASSIVE-BOUNDARY
    expectation: shadcn-scroll-area-retains-base-two-axis-host-control-and-lifecycle
  - id: T-SHADCN-SCROLL-AREA-0001-CASE-BROWSER
    title: Real package exports render exact focus and oriented geometry with two-axis movement across Web Components React Vue and Vue 2
    covers:
      - P-SHADCN-SCROLL-AREA-OWNERSHIP-BOUNDARY
      - P-SHADCN-SCROLL-AREA-VIEWPORT-COMPOSED-PREFERENCE
      - P-SHADCN-SCROLL-AREA-VIEWPORT-FOCUS-FEEDBACK
      - P-SHADCN-SCROLL-AREA-SCROLLBAR-ORIENTED-GEOMETRY
      - P-SHADCN-SCROLL-AREA-THUMB-CURRENT-VISUAL-SURFACE
      - P-SHADCN-SCROLL-AREA-THUMB-PASSIVE-BOUNDARY
    expectation: rendered-shadcn-scroll-area-keeps-one-host-surface-exact-tracks-and-two-axis-thumb-movement
implementations:
  - id: prototypes-shadcn-passive-corner
    kind: module-test
    status: active
    path: packages/prototypes/test-utils/scroll-area-passive-corner.test.ts
    required: true
    consumesCases: [T-SHADCN-SCROLL-AREA-0001-CASE-CORNER]
    notes:
      - Checks no private corner paint or control, preserved slot identity across orientation changes, and disposal in the real Web Component adapter.
  - id: www-shadcn-scroll-area-corner
    kind: adapter-test
    status: active
    path: apps/www/src/content/docs/zh-cn/scroll-area-corner.browser.test.ts
    required: true
    consumesCases: [T-SHADCN-SCROLL-AREA-0001-CASE-CORNER]
    notes:
      - Dedicated real-browser geometry, transparent corner absence, strict hit-testing, pointer drag, hidden-track zero-paint clipping, fractional resize, overflow and focus coverage across Web Components, React, Vue and Vue 2. Execution remains pending until the exact candidate CI run.

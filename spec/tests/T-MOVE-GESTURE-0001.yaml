id: T-MOVE-GESTURE-0001
type: test
title: Move Gesture bounded-session conformance
status: draft
since: 0.2.0-rc.7
summary: Covers primary-contact ownership, ordered samples, host cancellation, target replacement and detach, disposal, and style restoration.
cases:
  - id: T-MOVE-GESTURE-0001-CASE-LIFECYCLE
    title: Accepted primary contact produces one ordered bounded lifecycle
    covers:
      - C-MOVE-GESTURE-0001-A
      - C-MOVE-GESTURE-0001-B
      - C-MOVE-GESTURE-0001-C
    expectation: primary-contact-start-move-end-samples-are-ordered-and-local
  - id: T-MOVE-GESTURE-0001-CASE-CANCEL
    title: Host and lifecycle loss cancel ownership and restore resources
    covers:
      - C-MOVE-GESTURE-0001-D
      - HC-MOVE-GESTURE-0001-B
      - HC-MOVE-GESTURE-0001-D
    expectation: replacement-cancel-detach-and-dispose-release-the-active-session
  - id: T-MOVE-GESTURE-0001-CASE-BOUNDARY
    title: Move remains a host substrate without domain or Drag and Drop semantics
    covers:
      - C-MOVE-GESTURE-0001-E
      - HC-MOVE-GESTURE-0001-A
      - HC-MOVE-GESTURE-0001-C
    expectation: host-binding-exposes-only-move-lifecycle-and-rejects-non-primary-contact
implementations:
  - id: adapter-base-web-move-gesture-host
    kind: adapter-test
    status: passing
    path: packages/adapters/base/test/web-move-gesture-host.test.ts
    required: true
    consumesCases:
      - T-MOVE-GESTURE-0001-CASE-LIFECYCLE
      - T-MOVE-GESTURE-0001-CASE-CANCEL
      - T-MOVE-GESTURE-0001-CASE-BOUNDARY
verifies:
  contracts: [C-MOVE-GESTURE-0001]
  decisions: [D-MOVE-GESTURE-0001]
exercises:
  hostCaps: [HC-MOVE-GESTURE-0001]
revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: Added executable coverage for the first Web Move Gesture host realization.
tags: [test, move, gesture, lifecycle, web]

id: T-MOVE-GESTURE-0001
type: test
title: Move Gesture bounded-session conformance
status: draft
since: 0.2.0-rc.7
lifecycleRationale: Existing Web results are retained; native fixture definitions require source-bound execution and review. Framework dispatch does not establish physical touch-device, OS input or general gesture-arena conformance, so this test remains draft.
summary: Covers primary-contact ownership, ordered samples, host cancellation, target replacement and detach, disposal, and style restoration.
cases:
  - id: T-MOVE-GESTURE-0001-CASE-LIFECYCLE
    title: Accepted primary contact produces one ordered bounded lifecycle
    covers:
      - C-MOVE-GESTURE-0001-A
      - C-MOVE-GESTURE-0001-B
      - C-MOVE-GESTURE-0001-C
    expectation: primary-contact-start-move-end-samples-are-ordered-and-local
  - id: T-MOVE-GESTURE-0001-CASE-CANCEL
    title: Host and lifecycle loss cancel ownership and restore resources
    covers:
      - C-MOVE-GESTURE-0001-D
      - HC-MOVE-GESTURE-0001-B
      - HC-MOVE-GESTURE-0001-D
    expectation: replacement-cancel-detach-and-dispose-release-the-active-session
  - id: T-MOVE-GESTURE-0001-CASE-BOUNDARY
    title: Move remains a host substrate without domain or Drag and Drop semantics
    covers:
      - C-MOVE-GESTURE-0001-E
      - HC-MOVE-GESTURE-0001-A
      - HC-MOVE-GESTURE-0001-C
    expectation: host-binding-exposes-only-move-lifecycle-and-rejects-non-primary-contact
  - id: T-MOVE-GESTURE-0001-CASE-NATIVE-CLAIM
    title: Native direct-touch claims preserve contact ownership and independent unclaimed input
    covers:
      - HC-MOVE-GESTURE-0001-E
      - HC-MOVE-GESTURE-0001-F
      - HC-MOVE-GESTURE-0001-G
      - HC-MOVE-GESTURE-0001-H
    expectation: accepted-contact-only-one-terminal-outcome-and-unclaimed-scroll-preserved
    notes:
      - Required controls include refusal and missed targets, concurrent contact and competing lease, stale termination, host cancellation, replacement, detach and disposal, plus independent unclaimed touch and wheel or scroll dispatch. Automatic continuation remains application-owned.
implementations:
  - id: adapter-base-web-move-gesture-host
    kind: adapter-test
    status: passing
    path: packages/adapters/base/test/web-move-gesture-host.test.ts
    required: true
    consumesCases:
      - T-MOVE-GESTURE-0001-CASE-LIFECYCLE
      - T-MOVE-GESTURE-0001-CASE-CANCEL
      - T-MOVE-GESTURE-0001-CASE-BOUNDARY
  - id: gpui-native-move-consumer
    kind: fixture
    status: needs-review
    path: packages/compiler/test/fixtures/gpui-ordinary-values/consumer.rs
    required: true
    consumesCases:
      - T-MOVE-GESTURE-0001-CASE-LIFECYCLE
      - T-MOVE-GESTURE-0001-CASE-CANCEL
      - T-MOVE-GESTURE-0001-CASE-BOUNDARY
    notes:
      - The checked-in move_gesture_* tests exercise actual generated owners through GPUI framework dispatch, including early attachment, local samples, continuation outside initial bounds, release ordering, cancellation and restart, cross-window isolation, duplicate ownership refusal, replacement and disposal. No fresh passing execution is claimed by this record.
      - The producer and README bind the default SDK to GPUI 62e5991dd0f0c8a3af8d5e7e9c4652490d468db8; this spec change does not change that pin. Physical touch-device input, pen, thresholds, velocity, keyboard movement and general recognizer competition require separate evidence.
  - id: gpui-native-direct-touch-claim
    kind: fixture
    status: planned
    path: packages/compiler/test/fixtures/gpui-ordinary-values/consumer.rs
    required: true
    consumesCases: [T-MOVE-GESTURE-0001-CASE-NATIVE-CLAIM]
    notes:
      - This records the native direct-touch claim controls as an execution obligation, not passing evidence. Upstream TouchDragEvent vocabulary alone does not prove emitted claim acquisition, single termination or unclaimed wheel/scroll behavior. The complete native consumer must execute against its admitted SDK and retain failures before this record can change status.
verifies:
  contracts: [C-MOVE-GESTURE-0001]
  decisions: [D-MOVE-GESTURE-0001]
exercises:
  hostCaps: [HC-MOVE-GESTURE-0001]
revisions:
  - version: 0.3.0-alpha.2
    change: revised
    summary: Map bounded native direct-touch claim obligations and the existing GPUI consumer without changing historical Web evidence, draft status or claiming new native execution.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Added executable coverage for the first Web Move Gesture host realization.
tags: [test, move, gesture, lifecycle, web]

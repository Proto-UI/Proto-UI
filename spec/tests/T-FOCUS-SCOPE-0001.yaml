id: T-FOCUS-SCOPE-0001
type: test
title: Focus scope activation runtime contract tests
status: draft
since: 0.1.0
lifecycleRationale: Existing scope evidence is retained; new per-activation and restore-policy cases are planned until their exact source executes, and do not prove native Dialog or Search continuity.
summary: Runtime contract tests for explicit focus scope activation, previous focus restoration, and outside focus request gating.
cases:
  - id: T-FOCUS-SCOPE-0001-CASE-ACTIVATION-ENTRY-OVERRIDE
    title: Manual override is activation-local and preserves the scope boundary and restoration
    covers:
      [
        C-AS-FOCUS-SCOPE-0002-K,
        C-AS-FOCUS-SCOPE-0002-B,
        C-AS-FOCUS-SCOPE-0002-C,
        C-AS-FOCUS-SCOPE-0002-D,
        C-AS-FOCUS-SCOPE-0002-E,
        C-AS-FOCUS-SCOPE-0002-F,
      ]
    expectation: manual-zero-auto-entry-default-reasons-and-next-activation-preserved
  - id: T-FOCUS-SCOPE-0001-CASE-ENTRY-ELIGIBILITY-MUTATIONS
    title: Entry fallback follows current native descendant eligibility and revokes observation on cleanup
    covers: [C-AS-FOCUS-SCOPE-0002-J]
    expectation: entry-fallback-reprojects-after-native-eligibility-input-changes
  - id: T-FOCUS-SCOPE-0001-CASE-HOST-SEQUENTIAL-SAMPLE
    title: Host sequential sample composes open slots, navigation participation and entry fallback
    covers: [C-AS-FOCUS-SCOPE-0002-H, C-AS-FOCUS-SCOPE-0002-I, C-AS-FOCUS-SCOPE-0002-J]
    expectation: scoped-tab-preserves-projected-current-native-and-fallback-targets
  - id: T-FOCUS-SCOPE-0001-CASE-ACTIVATE-FIRST
    title: Activating a scope requests focus for its first logical focusable child
    covers:
      - C-AS-FOCUS-SCOPE-0002-A
      - C-AS-FOCUS-SCOPE-0002-B
      - C-AS-FOCUS-SCOPE-0002-F
    expectation: scope-activate-focuses-first-logical-child
  - id: T-FOCUS-SCOPE-0001-CASE-DEACTIVATE-RESTORE
    title: Deactivating a scope restores focus to the previous owner
    covers:
      - C-AS-FOCUS-SCOPE-0002-C
      - C-AS-FOCUS-SCOPE-0002-D
    expectation: scope-deactivate-restores-previous-focus
  - id: T-FOCUS-SCOPE-0001-CASE-RESTORE-NONE
    title: Explicit restore none preserves an outside destination while ordinary scopes still restore
    covers: [C-AS-FOCUS-SCOPE-0002-C, C-AS-FOCUS-SCOPE-0002-D]
    expectation: none-no-automatic-handback-default-previous-and-explicit-consumer-handback-independent
  - id: T-FOCUS-SCOPE-0001-CASE-RESTORE-OWNERSHIP
    title: Nested scopes and removed previous owners retain the live boundary and close ownership
    covers: [C-AS-FOCUS-SCOPE-0002-C, C-AS-FOCUS-SCOPE-0002-D, C-AS-FOCUS-SCOPE-0002-E]
    expectation: nested-none-preserves-destination-parent-restores-and-stale-previous-does-not-end-boundary
  - id: T-FOCUS-SCOPE-0001-CASE-RESTORE-CLEANUP
    title: Scope cleanup and synchronous notifications preserve newer focus and activation ownership
    covers: [C-AS-FOCUS-SCOPE-0002-A, C-AS-FOCUS-SCOPE-0002-D]
    expectation: none-releases-module-target-facts-and-pending-work-without-overwriting-newer-notification-effects
  - id: T-FOCUS-SCOPE-0001-CASE-OUTSIDE-GATE
    title: Active scope ignores outside focus requests and records a warning
    covers:
      - C-AS-FOCUS-SCOPE-0002-E
    expectation: active-scope-blocks-outside-focus-request
  - id: T-FOCUS-SCOPE-0001-CASE-INACTIVE-WITHOUT-TARGET
    title: Scope without focusable children remains inactive unless container activation is allowed
    covers:
      - C-AS-FOCUS-SCOPE-0002-A
      - C-AS-FOCUS-SCOPE-0002-B
    expectation: scope-without-target-remains-inactive
implementations:
  - id: module-scope-restore-policy
    kind: module-test
    status: planned
    path: packages/modules/focus/test/scope-restore-mode.test.ts
    required: true
    consumesCases:
      - T-FOCUS-SCOPE-0001-CASE-RESTORE-NONE
      - T-FOCUS-SCOPE-0001-CASE-RESTORE-OWNERSHIP
      - T-FOCUS-SCOPE-0001-CASE-RESTORE-CLEANUP
    notes:
      - Real FocusCenter with DOM effects and explicitly reported host facts; covers pending-target cancellation, nested none, removed previous owners, cross-owner notification activation and synchronous newer-owner notifications. A close notification can retain a newer pending target request without a scope-stack change, while a later successful owner still clears it. This is not native-input evidence.
      - The distinct-old/new pending case requires a closed scope's old C request to be retired even when its inactive observer queues unavailable D outside that scope. C becomes ready before D is delivered so a later owner transfer cannot hide missed retirement; a subsequent ordinary close still restores its previous owner. The current pending-only repair requires execution.
  - id: emitted-native-scope-restore-policy
    kind: fixture
    status: planned
    path: packages/compiler/src/native-focus-scope-restore.test.ts
    required: true
    consumesCases:
      - T-FOCUS-SCOPE-0001-CASE-RESTORE-NONE
      - T-FOCUS-SCOPE-0001-CASE-RESTORE-OWNERSHIP
      - T-FOCUS-SCOPE-0001-CASE-RESTORE-CLEANUP
    notes:
      - Executes actual emitted Vue2 split support/shared ownership and the WC monolithic helper in Happy DOM. Covers restore policy, nested boundaries, stale captures, cross-owner notifications and view retirement.
      - Actual createNativeInteraction owners exercise ordinary focus and focusSelf requests through the separate adapter and interaction queues, with active-scope remount controls. Scope closure retires pending work without physical blur. These are controlled helper fixtures, not ordinary-framework or browser-input acceptance.
      - Planned close-notification cases use both real target-request queues with default previous restoration and no new scope or DOM focus change; the newer request survives to remount, and a subsequent ordinary activation still restores its captured owner. These cases have no executed before-result.
  - id: runtime-scope-restore-none
    kind: runtime-test
    status: planned
    path: packages/runtime/test/contract/focus.v0.contract.test.ts
    required: true
    consumesCases: [T-FOCUS-SCOPE-0001-CASE-RESTORE-NONE]
    notes:
      - FOCUS-0815 supplies the explicit-none control beside retained ordinary-default FOCUS-0810. The current repair still requires its source-bound validation; earlier execution does not certify this later delta.
  - id: wc-popover-scope-restore-policy
    kind: adapter-test
    status: planned
    path: packages/prototypes/base/test/navigation-overlays/popover-focus-restore.test.ts
    required: true
    consumesCases: [T-FOCUS-SCOPE-0001-CASE-RESTORE-NONE]
    notes:
      - Real Base Popover and WC Adapter with a focused pre-open Trigger; synthetic outside/Escape inputs and controlled acceptance discriminate scope none from explicit Popover handback. Native/browser input remains separate.
  - id: module-scope-activation-entry-policy
    kind: module-test
    status: planned
    path: packages/modules/focus/test/scope-activation-entry.test.ts
    required: true
    consumesCases: [T-FOCUS-SCOPE-0001-CASE-ACTIVATION-ENTRY-OVERRIDE]
    notes:
      - Direct FocusCenter policy controls preserve default request options, manual gating and explicit inside entry, previous-owner restoration, subsequent configured activation, configured manual and empty-scope behavior.
      - Synthetic request outcomes are not native focus or trap traversal evidence. Dialog controlled refusal and runtime-replacement continuity remain separate consumer obligations; compiler support is not implied.
  - id: wc-entry-eligibility-observer
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/focus-entry-observer.test.ts
    required: true
    consumesCases: [T-FOCUS-SCOPE-0001-CASE-ENTRY-ELIGIBILITY-MUTATIONS]
    notes:
      - Deterministic Happy DOM completion boundaries cover input type, details open state, image-map association changes and observation cleanup; this is not cross-platform browser certification.
  - id: wc-native-scope-order-browser
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/shadow-closeout.browser.test.ts
    required: true
    consumesCases:
      - T-FOCUS-SCOPE-0001-CASE-HOST-SEQUENTIAL-SAMPLE
      - T-FOCUS-SCOPE-0001-CASE-ENTRY-ELIGIBILITY-MUTATIONS
    notes:
      - Chrome native Tab and Shift+Tab provide the oracle for positive tabindex across ShadowRoot and slot scopes, including explicitly indexed hosts; also exercises descendant-first entry and active trapped traversal.
      - Radio evidence covers checked and unchecked groups, directional entry and revisits, form/tree identity and unchanged selection; input type transitions verify actual Tab entry in Light, direct Shadow and split profiles.
      - Eligibility consults checked group members outside the trap without returning outside targets; programmatic negative-tabindex focus retains an insertion position without becoming a Tab stop.
  - id: s4-scope-native-composition
    kind: workspace-check
    status: passing
    path: scripts/analysis/shadow-s4-journey.mjs
    required: true
    consumesCases: [T-FOCUS-SCOPE-0001-CASE-HOST-SEQUENTIAL-SAMPLE]
    notes:
      - Executed by the S4 public and website runners; covers selected Tabs stop, native Details button, empty-panel fallback, forward/backward wrap and recovery after external native focus.
  - id: wc-scope-sequential-sample
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/focus-scope-targets.test.ts
    required: true
    consumesCases: [T-FOCUS-SCOPE-0001-CASE-HOST-SEQUENTIAL-SAMPLE]
  - id: runtime-focus-scope-activation-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/focus.v0.contract.test.ts
    required: true
    consumesCases:
      - T-FOCUS-SCOPE-0001-CASE-ACTIVATE-FIRST
      - T-FOCUS-SCOPE-0001-CASE-DEACTIVATE-RESTORE
      - T-FOCUS-SCOPE-0001-CASE-OUTSIDE-GATE
      - T-FOCUS-SCOPE-0001-CASE-INACTIVE-WITHOUT-TARGET

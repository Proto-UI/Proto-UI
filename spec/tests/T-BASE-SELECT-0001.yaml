id: T-BASE-SELECT-0001
type: test
title: Base Select Root and compound protocol tests
status: draft
since: 0.2.0-rc.0
summary: Covers Root ownership, controlled open and value requests, selection invariants, text derivation, anatomy, and extension boundaries.
cases:
  - id: T-BASE-SELECT-0001-CASE-REPEATED-OPEN-BOUNDARIES
    title: Repeated-open repair preserves genuine entry and controlled or disabled ownership
    covers: [P-BASE-SELECT-REQUESTS, P-BASE-SELECT-SELECTION-INVARIANT]
    expectation: genuine-open-keeps-selected-first-or-last-entry-and-controlled-refusal-or-acceptance-while-disabled-root-rejects-without-emitting
    notes:
      - 'Prepared against main d850c28a on 2026-11-02; source execution is pending. This is not a current-head passing result.'
      - 'Execution addendum 2026-11-02: fixed tree 971100155b0fc67b05e85f136c6399b51b8de921 passed this module suite 34/34, including entry, controlled acceptance and disabled boundaries. The five-suite candidate aggregate remains 122/123 due to the same pre-existing Header ghost case as baseline; native browser and exact-head CI remain pending.'
  - id: T-BASE-SELECT-0001-CASE-ROOT-OWNERSHIP
    title: Root owns open, value, selected text, policies, collection, context, and anatomy
    covers:
      [
        P-BASE-SELECT-ROLE-SELECT-ONLY,
        P-BASE-SELECT-ROOT-OWNER,
        P-BASE-SELECT-PROPS,
        P-BASE-SELECT-CONTEXT,
        P-BASE-SELECT-ANATOMY,
      ]
    expectation: select-root-owns-single-selection-and-open-facts
  - id: T-BASE-SELECT-0001-CASE-REQUESTS
    title: Open and value paths enter Root request methods and preserve controlled owner facts
    covers: [P-BASE-SELECT-AUTHORING-ENTRIES, P-BASE-SELECT-REQUESTS]
    expectation: select-controlled-and-uncontrolled-requests-arbitrate-independently
  - id: T-BASE-SELECT-0001-CASE-SELECTION-TEXT
    title: Navigation stays transient while committed item text remains live
    covers: [P-BASE-SELECT-SELECTION-INVARIANT, P-BASE-SELECT-TEXT-DERIVATION]
    expectation: select-navigation-never-commits-and-selected-text-updates-live
  - id: T-BASE-SELECT-0001-CASE-BOUNDARY
    title: Current authoring entries do not claim deferred select extensions
    covers: [P-BASE-SELECT-DEFERRED-EXTENSIONS]
    expectation: select-current-scope-excludes-form-groups-search-and-virtualization

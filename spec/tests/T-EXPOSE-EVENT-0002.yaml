id: T-EXPOSE-EVENT-0002
type: test
title: Expose Event Module, signal sink, and Adapter conformance
status: draft
since: 0.2.0-rc.7
summary: Module, Runtime, translation-record, official Adapter, and schema evidence verifies outward-signal ownership, shared-key declaration metadata, current-sink delivery, instance lifetime, and host-specific mapping.
cases:
  - id: T-EXPOSE-EVENT-0002-CASE-SURFACE
    title: Expose Event projects only def.expose.event and run.expose.emit
    covers:
      - M-EXPOSE-EVENT-0001-A
      - M-EXPOSE-EVENT-0001-B
    expectation: outward-signal-surface-remains-separate-from-event-input
  - id: T-EXPOSE-EVENT-0002-CASE-DECLARATION
    title: Branded declaration metadata reaches Adapter translation but is absent from public getExposes
    covers:
      - M-EXPOSE-EVENT-0001-C
      - C-EXPOSE-EVENT-0001-G
    expectation: shared-key-metadata-reaches-adapter-translation-not-public-record
  - id: T-EXPOSE-EVENT-0002-CASE-VALIDATION
    title: Registration validation completes before sink delivery
    covers:
      - M-EXPOSE-EVENT-0001-D
      - HC-EXPOSE-EVENT-SINK-0001-A
    expectation: only-registered-outward-signals-reach-sink
  - id: T-EXPOSE-EVENT-0002-CASE-PAYLOAD
    title: Payload declarations remain minimal v0 metadata
    covers:
      - M-EXPOSE-EVENT-0001-E
      - C-EXPOSE-EVENT-0002-A
      - C-EXPOSE-EVENT-0002-B
      - C-EXPOSE-EVENT-0002-C
      - C-EXPOSE-EVENT-0002-D
      - C-EXPOSE-EVENT-0002-E
    expectation: payload-and-options-remain-minimal-v0-hints
  - id: T-EXPOSE-EVENT-0002-CASE-SINK
    title: Current host-neutral sink receives one immediate outward emission
    covers:
      - M-EXPOSE-EVENT-0001-F
      - M-EXPOSE-EVENT-0001-G
      - HC-EXPOSE-EVENT-SINK-0001-A
      - HC-EXPOSE-EVENT-SINK-0001-B
      - HC-EXPOSE-EVENT-SINK-0001-C
      - HC-EXPOSE-EVENT-SINK-0001-D
      - HC-EXPOSE-EVENT-SINK-0001-E
    expectation: current-sink-receives-host-neutral-emission-without-replay
  - id: T-EXPOSE-EVENT-0002-CASE-LIFECYCLE
    title: Registration and emit authority follow instance lifetime
    covers:
      - M-EXPOSE-EVENT-0001-H
      - C-EXPOSE-EVENT-0001-H
    expectation: preserve-view-epochs-and-invalidate-at-terminal-disposal
  - id: T-EXPOSE-EVENT-0002-CASE-PROFILES
    title: Official Adapters translate outward signals without leaking listener props or declarations
    covers:
      - M-EXPOSE-EVENT-0001-I
      - A-REACT-18-19-0001-M
      - A-VUE-3-0001-M
      - A-VUE-2-0001-M
      - A-WEB-COMPONENT-0001-M
    expectation: official-adapters-provide-profile-specific-outward-carriers
  - id: T-EXPOSE-EVENT-0002-CASE-COMPATIBILITY
    title: Legacy EVENT_EMIT_CAP remains the same token as the canonical sink
    covers:
      - M-EXPOSE-EVENT-0001-F
    expectation: legacy-event-emit-token-is-a-source-compatible-alias
  - id: T-EXPOSE-EVENT-0002-CASE-WIRING-MIGRATION
    title: Legacy Event-target sink wiring fails with an Expose Event migration diagnostic
    covers:
      - M-EXPOSE-EVENT-0001-A
      - M-EVENT-0001-H
    expectation: source-import-alias-remains-but-wiring-target-must-be-expose-event
implementations:
  - id: expose-event-surface-fixture
    kind: fixture
    status: active
    path: packages/spec/fixtures/src/event/type-payload.ts
    required: true
    consumesCases:

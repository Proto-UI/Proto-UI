    required: true
    consumesCases:
      - T-EXPOSE-EVENT-0002-CASE-SURFACE
      - T-EXPOSE-EVENT-0002-CASE-DECLARATION
      - T-EXPOSE-EVENT-0002-CASE-VALIDATION
      - T-EXPOSE-EVENT-0002-CASE-SINK
      - T-EXPOSE-EVENT-0002-CASE-WIRING-MIGRATION
  - id: runtime-expose-event-lifecycle-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/lifecycle.module-resources.v1.contract.test.ts
    required: true
    consumesCases:
      - T-EXPOSE-EVENT-0002-CASE-LIFECYCLE
  - id: adapter-react-expose-event-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/expose-event.test.ts
    required: true
    consumesCases:
      - T-EXPOSE-EVENT-0002-CASE-DECLARATION
      - T-EXPOSE-EVENT-0002-CASE-PROFILES
  - id: adapter-vue-expose-event-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/expose-event.test.ts
    required: true
    consumesCases:
      - T-EXPOSE-EVENT-0002-CASE-DECLARATION
      - T-EXPOSE-EVENT-0002-CASE-PROFILES
  - id: adapter-vue2-expose-event-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/vue2/test/event.test.ts
    required: true
    consumesCases:
      - T-EXPOSE-EVENT-0002-CASE-PROFILES
  - id: adapter-web-component-expose-event-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/expose.test.ts
    required: true
    consumesCases:
      - T-EXPOSE-EVENT-0002-CASE-DECLARATION
      - T-EXPOSE-EVENT-0002-CASE-PROFILES
  - id: adapter-profile-expose-event-schema
    kind: workspace-check
    status: passing
    path: packages/spec/fixtures/test/adapter-profile-schema.test.ts
    required: true
    consumesCases:
      - T-EXPOSE-EVENT-0002-CASE-PROFILES

id: T-AS-HOOK-PRIVILEGED-0001
type: test
title: Privileged asHook tests
status: draft
since: 0.1.0
summary: Runtime tests for privileged asHooks using restricted module-port capabilities, custom repeat/configuration rules, and privileged trace metadata.
cases:
  - id: T-AS-HOOK-PRIVILEGED-0001-CASE-PORT-CAPABILITY
    title: Privileged asHooks may expose restricted module-port capabilities through dedicated APIs
    covers:
      - C-AS-HOOK-PRIVILEGED-0001-A
      - C-AS-HOOK-PRIVILEGED-0001-B
    expectation: privileged-module-port-capability
  - id: T-AS-HOOK-PRIVILEGED-0001-CASE-TRACE
    title: Privileged asHooks mark trace metadata as privileged
    covers:
      - C-AS-HOOK-PRIVILEGED-0001-C
    expectation: privileged-trace-metadata
  - id: T-AS-HOOK-PRIVILEGED-0001-CASE-ROLLBACK-BOUNDARY
    title: Privileged asHooks may define restricted rollback or omit full rollback in their own contracts
    covers:
      - C-AS-HOOK-PRIVILEGED-0001-D
    expectation: privileged-rollback-owned-by-hook-contract
implementations:
  - id: runtime-focus-privileged-as-hook-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/focus.v0.contract.test.ts
    required: true
    consumesCases:
      - T-AS-HOOK-PRIVILEGED-0001-CASE-PORT-CAPABILITY
      - T-AS-HOOK-PRIVILEGED-0001-CASE-TRACE
  - id: runtime-boundary-privileged-as-hook-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/boundary.v0.contract.test.ts
    required: true
    consumesCases:
      - T-AS-HOOK-PRIVILEGED-0001-CASE-PORT-CAPABILITY
      - T-AS-HOOK-PRIVILEGED-0001-CASE-TRACE
  - id: runtime-overlay-privileged-as-hook-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/overlay.v0.contract.test.ts
    required: true
    consumesCases:
      - T-AS-HOOK-PRIVILEGED-0001-CASE-PORT-CAPABILITY
      - T-AS-HOOK-PRIVILEGED-0001-CASE-TRACE
  - id: runtime-hit-participation-privileged-as-hook-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/hit-participation.v0.contract.test.ts
    required: true
    consumesCases:
      - T-AS-HOOK-PRIVILEGED-0001-CASE-PORT-CAPABILITY
      - T-AS-HOOK-PRIVILEGED-0001-CASE-TRACE
  - id: spec-privileged-rollback-declaration
    kind: workspace-check
    status: planned
    path: packages/spec/graph/test/privileged-rollback-declaration.test.ts
    required: true
    consumesCases:
      - T-AS-HOOK-PRIVILEGED-0001-CASE-ROLLBACK-BOUNDARY
    notes:
      - Planned because none of the four privileged contract tests asserts a restricted or omitted rollback; the word does not appear in any of them.
      - A workspace check rather than a runtime test, because `C-AS-HOOK-PRIVILEGED-0001-D` requires that a hook omitting full rollback says so in its own contract. A runtime test can observe the behaviour but not the declaration, so it could pass while the required contract text is absent.
verifies:
  contracts:
    - id: C-AS-HOOK-PRIVILEGED-0001
      anchors:
        - C-AS-HOOK-PRIVILEGED-0001-A
        - C-AS-HOOK-PRIVILEGED-0001-B
        - C-AS-HOOK-PRIVILEGED-0001-C
        - C-AS-HOOK-PRIVILEGED-0001-D
revisions:
  - version: 0.3.0-alpha.0
    change: strengthened
    summary: Recorded the rollback-boundary case as a planned workspace check, because the criterion is a contract declaration a runtime test cannot observe.
  - version: 0.1.0
    change: introduced
    summary: Added privileged asHook test mapping through focus, boundary, overlay, and hit-participation runtime tests.
tags:
  - as-hook
  - privileged
  - module-port
  - contract-test

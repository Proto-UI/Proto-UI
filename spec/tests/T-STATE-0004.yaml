id: T-STATE-0004
type: test
title: State watch, event, and lifecycle tests
status: draft
since: 0.1.0
summary: Module and runtime tests for setup-only watch registration, callback-scope binding, StateEvent delivery, deterministic ordering, lifecycle cleanup, and callback mutation admission after successful or caught-failing nested renders with idle rejection.
cases:
  - id: T-STATE-0004-CASE-WATCH-SETUP-ONLY
    title: Watch registration is setup-only and absent from owned views
    covers:
      - C-STATE-0004-D
      - C-STATE-0010-A
      - C-STATE-0010-B
    expectation: watch-registration-setup-only
  - id: T-STATE-0004-CASE-WATCH-EVENTS
    title: Watch callbacks receive portable StateEvent records
    covers:
      - C-STATE-0010-C
      - C-STATE-0011-A
      - C-STATE-0011-B
      - C-STATE-0011-C
    expectation: next-event-records
  - id: T-STATE-0004-CASE-REENTRANT-ORDER
    title: Re-entrant state events are delivered in deterministic order
    covers:
      - C-STATE-0011-E
    expectation: deterministic-reentrant-order
  - id: T-STATE-0004-CASE-DISCONNECT-CLEANUP
    title: Watch registrations disconnect and clean up with instance lifecycle
    covers:
      - C-STATE-0010-E
      - C-STATE-0011-D
      - C-STATE-0012-C
      - C-STATE-0012-D
      - C-STATE-0012-E
    expectation: disconnect-and-cleanup
  - id: T-STATE-0004-CASE-LIFECYCLE-ALIVE
    title: State views remain usable while the instance is alive
    covers:
      - C-STATE-0012-A
      - C-STATE-0012-B
    expectation: alive-instance-view-use
  - id: T-STATE-0004-CASE-CALLBACK-SCOPE
    title: Privileged State mutations dispatch watchers in the current runtime callback scope
    covers:
      - C-CORE-SYNTAX-0002-E
      - C-CORE-SYNTAX-0002-F
      - C-STATE-0010-F
      - C-STATE-0010-G
      - M-STATE-0001-B
    expectation: current-run-callback-scope-and-phase-restoration
  - id: T-STATE-0004-CASE-NESTED-RENDER-CALLBACK
    title: State mutation remains admitted in the owning callback after a nested render returns or throws, but not after the callback exits
    covers:
      - C-STATE-0004-C
      - C-STATE-0004-E
    expectation: nested-render-success-or-caught-error-preserves-callback-set-and-idle-set-rejects-without-mutation
    notes:
      - Both normal render return and the exact caught render exception are exercised inside the owning callback. The subsequent owned State set changes the observable value to true.
      - After callback exit, idle set(false) must throw and leave the observed value true. This is a preserved phase boundary, not a weakened guard or a run-handle forwarding assertion.
implementations:
  - id: module-state-port-watch-contract
    kind: module-test
    status: passing
    path: packages/modules/state/test/port.v0.test.ts
    required: true
    consumesCases:
      - T-STATE-0004-CASE-WATCH-SETUP-ONLY
      - T-STATE-0004-CASE-WATCH-EVENTS
      - T-STATE-0004-CASE-REENTRANT-ORDER
      - T-STATE-0004-CASE-DISCONNECT-CLEANUP
  - id: module-state-kernel-event-contract
    kind: module-test
    status: passing
    path: packages/modules/state/test/kernel.v0.test.ts
    required: true
    consumesCases:
      - T-STATE-0004-CASE-WATCH-EVENTS
      - T-STATE-0004-CASE-REENTRANT-ORDER
  - id: runtime-state-lifecycle-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/state-basic.v0.contract.test.ts
    required: true
    consumesCases:
      - T-STATE-0004-CASE-LIFECYCLE-ALIVE
      - T-STATE-0004-CASE-DISCONNECT-CLEANUP
  - id: runtime-state-repeatable-lifecycle-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/state-lifecycle.v1.contract.test.ts
    required: true
    consumesCases:
      - T-STATE-0004-CASE-DISCONNECT-CLEANUP
      - T-STATE-0004-CASE-LIFECYCLE-ALIVE
  - id: runtime-state-phase-guard-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/state-phase-guards.v0.contract.test.ts
    required: true
    consumesCases:
      - T-STATE-0004-CASE-CALLBACK-SCOPE
      - T-STATE-0004-CASE-NESTED-RENDER-CALLBACK
    notes:
      - "Nested-render selector: it.each([false, true]) 'preserves state mutation admission after a nested render (throws=%s)'. Both throws=false and throws=true passed in the retained PR #811 final affected run, following the retained two-case red/green reproduction; this catalog edit is not a fresh execution."

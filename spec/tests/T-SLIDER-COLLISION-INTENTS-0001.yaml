id: T-SLIDER-COLLISION-INTENTS-0001
type: test
title: Bounded logical Slider collision numerical intents
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: Pure numerical and logical Root slices have operational counterexamples, veto, controlled proposal history and retirement evidence. Physical focus migration, real pointer input, native browser/AT and Compiler realization remain missing.
summary: Tests source-informed push, one-neighbor swap, none and explicit numerical failure boundaries plus bounded logical Root session publication and four synchronous Adapter carriers, without executing upstream code or claiming pointer support.
cases:
  - id: T-SLIDER-COLLISION-INTENTS-0001-CASE-PUSH
    title: Push propagates from latest proposal and does not undo displaced neighbors on pullback
    covers:
      - C-SLIDER-VALUE-0001-COLLISION
      - C-SLIDER-VALUE-0001-COLLISION-PUSH
    expectation: fresh-ordered-vector-with-stable-index-and-latest-proposal-history
  - id: T-SLIDER-COLLISION-INTENTS-0001-CASE-SWAP
    title: Swap migrates at most one adjacent slot and restores from the session-start history
    covers:
      - C-SLIDER-VALUE-0001-COLLISION-SWAP
    expectation: one-adjacent-index-and-history-sensitive-values-with-exact-crossing
  - id: T-SLIDER-COLLISION-INTENTS-0001-CASE-NONE
    title: None constrains one slot by adjacent gap without adopting keyboard semantics
    covers:
      - C-SLIDER-VALUE-0001-COLLISION-NONE
      - C-SLIDER-VALUE-0001-KEYBOARD
    expectation: only-selected-slot-changes-and-keyboard-path-stays-distinct
  - id: T-SLIDER-COLLISION-INTENTS-0001-CASE-DOMAIN
    title: Invalid shape, history, index and infeasible or nonfinite arithmetic reject without mutation
    covers:
      - C-SLIDER-VALUE-0001-COLLISION-DOMAIN
    expectation: explicit-diagnostic-and-no-side-effects-or-owner-publication
  - id: T-SLIDER-COLLISION-INTENTS-0001-CASE-ROOT
    title: Logical Root uses prior uncanceled proposal history while keeping one current owner
    covers:
      - C-SLIDER-VALUE-0001-COLLISION-PUBLICATION
      - C-SLIDER-VALUE-0001-CONTROLLED
      - C-SLIDER-VALUE-0001-SESSION
      - C-SLIDER-VALUE-0001-BOUNDARY
      - P-BASE-SLIDER-VALUES-COLLISION-ENTRY
    expectation: selected-session-only-input-with-veto-aware-index-and-no-host-focus-or-stale-retirement-frame
implementations:
  - id: slider-collision-numerical-intents
    kind: fixture
    status: passing
    path: packages/prototypes/base/test/slider-values-collision.test.ts
    required: true
    consumesCases:
      - T-SLIDER-COLLISION-INTENTS-0001-CASE-PUSH
      - T-SLIDER-COLLISION-INTENTS-0001-CASE-SWAP
      - T-SLIDER-COLLISION-INTENTS-0001-CASE-NONE
      - T-SLIDER-COLLISION-INTENTS-0001-CASE-DOMAIN
    notes:
      - No Root session, focus, pointer capture, native host or Compiler admission.
  - id: slider-collision-root-publication
    kind: runtime-test
    status: passing
    path: packages/prototypes/base/test/slider-values-collision-runtime.test.ts
    required: true
    consumesCases:
      - T-SLIDER-COLLISION-INTENTS-0001-CASE-ROOT
    notes:
      - Actual WC mapping and direct Runtime sessions; no pointer recognizer or host focus migration.
  - id: slider-collision-synchronous-carriers
    kind: adapter-test
    status: passing
    path: packages/prototypes/base/test/slider-values-collision-carriers.test.ts
    required: true
    consumesCases:
      - T-SLIDER-COLLISION-INTENTS-0001-CASE-ROOT
    notes:
      - React fake harness, Vue, Vue2 and WC with actual Root and three Thumb mappings in happy-dom.
      - Synchronous veto, controlled non-echo and nested edit checks are not native-browser or async-host admission.
verifies:
  contracts:
    - C-SLIDER-VALUE-0001
  prototypes:
    - P-BASE-SLIDER-VALUES
sources:
  - path: packages/prototypes/base/test/slider-values-collision.test.ts
  - path: packages/prototypes/base/src/slider/values-collision.ts
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added bounded numerical collision intents and negative-domain cases separately from host and Runtime admission.
  - version: 0.3.0-alpha.1
    change: updated
    summary: Added logical Root session, controlled history, veto/index, lifecycle and four-carrier evidence while retaining physical focus/input omissions.
tags:
  - slider
  - collision
  - draft
  - numerical-intent

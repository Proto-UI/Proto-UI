id: T-MATERIAL-PAINT-RESERVATION-0001
type: test
title: Bounded draft reservation transport and lifetime evidence
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: Unit geometry is injected. Real four-host optical readiness, native layout, physical input, AT and cost remain independent acceptance conditions.
summary: Separates declaration, source safety and lifecycle checks from original-deadline native product acceptance.
cases:
  - id: T-MATERIAL-PAINT-RESERVATION-0001-CASE-OWNERSHIP
    title: Strict declaration, exact domain and neutral owned template transport
    covers:
      [C-MATERIAL-PAINT-RESERVATION-0001-DECLARATION, C-MATERIAL-PAINT-RESERVATION-0001-PROJECTION]
    expectation: exact-current-owner-and-part-no-input-or-accessibility-transfer
  - id: T-MATERIAL-PAINT-RESERVATION-0001-CASE-LIFETIME
    title: Stale same-node refs, failed staging, cleanup exceptions and reentry
    covers: [C-MATERIAL-PAINT-RESERVATION-0001-LEASE]
    expectation: no-old-write-or-release-on-successor-and-attempt-all-owned-cleanup
  - id: T-MATERIAL-PAINT-RESERVATION-0001-CASE-LAYOUT
    title: Separate target basis, independent responsive reference and exact outline clearance
    covers:
      [
        C-MATERIAL-PAINT-RESERVATION-0001-LAYOUT,
        C-MATERIAL-PAINT-RESERVATION-0001-INLINE,
        C-MATERIAL-PAINT-RESERVATION-0001-OUTLINE,
      ]
    expectation: unknown-is-unavailable-no-reference-self-growth-original-profile-ROI-retained
  - id: T-MATERIAL-PAINT-RESERVATION-0001-CASE-NATIVE
    title: Actual Liquid Accordion four Web hosts under the original 1000ms readiness guard
    covers: [C-MATERIAL-PAINT-RESERVATION-0001-ADMISSION, C-MATERIAL-PAINT-RESERVATION-0001-OUTLINE]
    expectation: exact-head-self-optical-and-opaque-ancestor-negative-control-open-reopen-same-input-node-real-border-and-content-evidence

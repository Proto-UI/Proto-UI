id: T-BRUTALIST-SCROLL-AREA-0001
type: test
title: Brutalist Scroll Area visual and documentation layout contract tests
status: draft
since: 0.2.0-rc.7
summary: Covers the current Neo-Brutalist visual grammar, exact-once Base anatomy inheritance, surface projection, orientation, host-resolved composed preference, host-projected Thumb geometry, Move Gesture-backed dragging, the inward Viewport focus ring, and responsive reference-demo consumer sizing.
cases:
  - id: T-BRUTALIST-SCROLL-AREA-0001-CASE-BASE-INHERITANCE
    title: Every Brutalist anatomy part installs its matching Base hook exactly once
    covers:
      - P-BRUTALIST-SCROLL-AREA-BASE-INHERITANCE
      - P-BRUTALIST-SCROLL-AREA-SCROLLBAR-BASE-INHERITANCE
      - P-BRUTALIST-SCROLL-AREA-THUMB-BASE-INHERITANCE
      - P-BRUTALIST-SCROLL-AREA-VIEWPORT-BASE-INHERITANCE
    expectation: p-brutalist-scroll-area-base-hooks-are-installed-exactly-once
  - id: T-BRUTALIST-SCROLL-AREA-0001-CASE-COMPOSED-PREFERENCE
    title: Viewport asks the host to resolve the composed design-language preference
    covers:
      - P-BRUTALIST-SCROLL-AREA-VIEWPORT-COMPOSED-PREFERENCE
    expectation: p-brutalist-scroll-area-viewport-resolves-composed-projection
  - id: T-BRUTALIST-SCROLL-AREA-0001-CASE-1
    title: P-BRUTALIST-SCROLL-AREA retains Base semantics and projects the Brutalist visual grammar
    covers:
      - P-BRUTALIST-SCROLL-AREA-VISUAL-GRAMMAR
      - P-BRUTALIST-SCROLL-AREA-TESTED-SURFACE
      - P-BRUTALIST-SCROLL-AREA-THUMB-SURFACE
      - P-BASE-SCROLL-AREA-THUMB-MOVE-HIT-SUBREGION
    expectation: p-brutalist-scroll-area-visual-contract
  - id: T-BRUTALIST-SCROLL-AREA-0001-CASE-2
    title: Reference demo keeps Root and scrollbar inside phone preview frames
    covers:
      - P-BRUTALIST-SCROLL-AREA-CONSUMER-SIZING
      - P-BRUTALIST-SCROLL-AREA-DEMO-RESPONSIVE-SIZING
    expectation: p-brutalist-scroll-area-responsive-demo-sizing
  - id: T-BRUTALIST-SCROLL-AREA-0001-CASE-VIEWPORT-FOCUS
    title: The focused Viewport carries an inward ring the Root cannot clip
    covers:
      - P-BRUTALIST-SCROLL-AREA-VIEWPORT-FOCUS-RING
      - P-BRUTALIST-SCROLL-AREA-VIEWPORT-SURFACE
    expectation: p-brutalist-scroll-area-viewport-rings-inside-its-own-box
  - id: T-BRUTALIST-SCROLL-AREA-0001-CASE-SCROLLBAR-SURFACE
    title: Scrollbar projects the Brutalist visual surface and orientation geometry
    covers:
      - P-BRUTALIST-SCROLL-AREA-SCROLLBAR-TRACK
      - P-BRUTALIST-SCROLL-AREA-SCROLLBAR-ORIENTATION
    expectation: p-brutalist-scroll-area-scrollbar-visual-surface
  - id: T-BRUTALIST-SCROLL-AREA-0001-CASE-THUMB-SURFACE
    title: Thumb projects the Brutalist surface tokens
    covers:
      - P-BRUTALIST-SCROLL-AREA-THUMB-SURFACE
    expectation: p-brutalist-scroll-area-thumb-visual-surface
  - id: T-BRUTALIST-SCROLL-AREA-0001-CASE-VIEWPORT-SURFACE
    title: Viewport projects the Brutalist surface and focus ring
    covers:
      - P-BRUTALIST-SCROLL-AREA-VIEWPORT-SURFACE
    expectation: p-brutalist-scroll-area-viewport-visual-surface
  - id: T-BRUTALIST-SCROLL-AREA-0001-CASE-ROOT-SURFACE
    title: Root projects the Brutalist visual grammar surface
    covers:
      - P-BRUTALIST-SCROLL-AREA-VISUAL-GRAMMAR
    expectation: p-brutalist-scroll-area-root-visual-surface

implementations:
  - id: prototypes-brutalist-scroll-area-contract
    kind: module-test
    status: passing
    path: packages/prototypes/brutalist/test/scroll-area.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-SCROLL-AREA-0001-CASE-BASE-INHERITANCE
      - T-BRUTALIST-SCROLL-AREA-0001-CASE-COMPOSED-PREFERENCE
      - T-BRUTALIST-SCROLL-AREA-0001-CASE-1
      - T-BRUTALIST-SCROLL-AREA-0001-CASE-VIEWPORT-FOCUS
      - T-BRUTALIST-SCROLL-AREA-0001-CASE-SCROLLBAR-SURFACE
      - T-BRUTALIST-SCROLL-AREA-0001-CASE-THUMB-SURFACE
      - T-BRUTALIST-SCROLL-AREA-0001-CASE-VIEWPORT-SURFACE
      - T-BRUTALIST-SCROLL-AREA-0001-CASE-ROOT-SURFACE
    exercises:
      - P-BASE-SCROLL-AREA
      - P-BASE-SCROLL-AREA-SCROLLBAR
      - P-BASE-SCROLL-AREA-THUMB
      - P-BRUTALIST-SCROLL-AREA-SCROLLBAR
      - P-BRUTALIST-SCROLL-AREA-THUMB
      - P-BRUTALIST-SCROLL-AREA-VIEWPORT
      - P-BASE-SCROLL-AREA-VIEWPORT
      - P-BRUTALIST-SCROLL-AREA
  - id: web-adapters-brutalist-scroll-area-move-journey
    kind: adapter-test
    status: passing
    path: packages/web-conformance/test/brutalist-scroll-area-move.journey.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-SCROLL-AREA-0001-CASE-1
    exercises:
      - P-BASE-SCROLL-AREA
      - P-BASE-SCROLL-AREA-SCROLLBAR
      - P-BASE-SCROLL-AREA-THUMB
      - P-BRUTALIST-SCROLL-AREA
      - P-BRUTALIST-SCROLL-AREA-SCROLLBAR
      - P-BRUTALIST-SCROLL-AREA-THUMB
      - P-BRUTALIST-SCROLL-AREA-VIEWPORT
    notes:
      - The shared journey is mandatory for Web Components, React, Vue, and Vue 2.
  - id: www-brutalist-scroll-area-demo-layout
    kind: workspace-check
    status: passing
    path: apps/www/src/content/docs/zh-cn/demo-brutalist-controls.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-SCROLL-AREA-0001-CASE-2
    exercises:
      - P-BRUTALIST-SCROLL-AREA
  - id: www-brutalist-scroll-area-focus-ring-browser
    kind: runtime-test
    status: passing
    path: apps/www/src/content/docs/zh-cn/demo-brutalist-controls.browser.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-SCROLL-AREA-0001-CASE-VIEWPORT-FOCUS
    exercises:
      - P-BRUTALIST-SCROLL-AREA-VIEWPORT
    notes:
      - Reads the computed box-shadow in Web Components, React, and Vue, in both schemes, and requires one inset layer with zero offsets and a positive spread. That shape is the four-sided claim; an outward layer would be clipped by the Root and is asserted absent.
      - The demo gained a row wider than the Viewport so the same surface scrolls both ways, and the case scrolls each axis while the ring is up.
      - Viewport bounds are compared before focus, after focus, and after scrolling, so the ring cannot be paid for with a geometry shift.

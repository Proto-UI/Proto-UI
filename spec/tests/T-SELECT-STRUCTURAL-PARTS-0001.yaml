id: T-SELECT-STRUCTURAL-PARTS-0001
type: test
title: Select passive grouping and decorative parts conformance
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Runtime and real framework/peer integration evidence remains distinct from native assistive-technology and screenshot acceptance.
summary: Group-local names, negative scope and lifetime cases, collection invariants, public entries and source-derived family recipes.
cases:
  - id: T-SELECT-STRUCTURAL-PARTS-0001-CASE-SEMANTICS
    title: Passive groups retain ordered single-selection and contentless decorative separation
    covers:
      [
        P-BASE-SELECT-STRUCTURAL-PARTS-OWNERSHIP,
        P-BASE-SELECT-STRUCTURAL-PARTS-SEPARATOR,
        P-BASE-SELECT-STRUCTURAL-PARTS-ENTRIES,
      ]
    expectation: only-root-owns-selection-and-collection
  - id: T-SELECT-STRUCTURAL-PARTS-0001-CASE-NAMING
    title: Two groups, nested Select boundaries and relationship lifetime fail closed correctly
    covers: [P-BASE-SELECT-STRUCTURAL-PARTS-SCOPE, P-BASE-SELECT-STRUCTURAL-PARTS-NAME]
    expectation: current-unique-group-local-label-only
  - id: T-SELECT-STRUCTURAL-PARTS-0001-CASE-RECIPE
    title: Shadcn uses inherited semantics and fixed upstream relative recipes
    covers:
      [
        P-SHADCN-SELECT-STRUCTURAL-PARTS-INHERITANCE,
        P-SHADCN-SELECT-STRUCTURAL-PARTS-RECIPE,
        P-SHADCN-SELECT-STRUCTURAL-PARTS-CONSUMER,
      ]
    expectation: inherited-grouping-with-canonical-source-closure

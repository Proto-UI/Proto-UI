id: T-BRUTALIST-CHECKBOX-0001
type: test
title: Brutalist Checkbox visual, interaction, and inheritance tests
status: draft
since: 0.3.0-alpha.0
summary: >-
  Covers the Brutalist Checkbox public API (root checked fill swap, derived Indicator tick/bar and opacity visibility, press/focus/disabled) against P-BRUTALIST-CHECKBOX and P-BRUTALIST-CHECKBOX-INDICATOR criteria.


cases:
  - id: T-BRUTALIST-CHECKBOX-0001-CASE-1
    title: Direct entry and Base Checkbox inheritance for root and indicator
    covers:
      - P-BRUTALIST-CHECKBOX-ENTRY
      - P-BRUTALIST-CHECKBOX-BASE-INHERITANCE
      - P-BRUTALIST-CHECKBOX-INDICATOR-ENTRY
      - P-BRUTALIST-CHECKBOX-INDICATOR-BASE-INHERITANCE
    expectation: p-brutalist-checkbox-entry-inheritance
  - id: T-BRUTALIST-CHECKBOX-0001-CASE-2
    title: Resting and mixed states use paired main ink; checked swaps to foreground fill
    covers:
      - P-BRUTALIST-CHECKBOX-VISUAL-GRAMMAR
    expectation: p-brutalist-checkbox-checked-fill-swap
  - id: T-BRUTALIST-CHECKBOX-0001-CASE-3
    title: Indicator glyph and opacity follow checked and indeterminate state
    covers:
      - P-BRUTALIST-CHECKBOX-INDICATOR-VISUAL-GRAMMAR
    expectation: p-brutalist-checkbox-indicator-glyph-opacity
  - id: T-BRUTALIST-CHECKBOX-0001-CASE-4
    title: Press clears shadow; focus-visible applies ring; disabled de-emphasizes
    covers:
      - P-BRUTALIST-CHECKBOX-INTERACTION
    expectation: p-brutalist-checkbox-interaction
  - id: T-BRUTALIST-CHECKBOX-0001-CASE-BROWSER
    title: Rendered checkbox glyph, contrast, geometry, and state transitions across WC, React, Vue, and Vue 2
    covers:
      - P-BRUTALIST-CHECKBOX-VISUAL-GRAMMAR
      - P-BRUTALIST-CHECKBOX-INDICATOR-VISUAL-GRAMMAR
      - P-BRUTALIST-CHECKBOX-INTERACTION
    expectation: rendered-brutalist-checkbox-cross-runtime-state-contrast-and-geometry

implementations:
  - id: prototypes-brutalist-checkbox-contract
    kind: module-test
    status: passing
    path: packages/prototypes/brutalist/test/checkbox.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-CHECKBOX-0001-CASE-1
      - T-BRUTALIST-CHECKBOX-0001-CASE-2
      - T-BRUTALIST-CHECKBOX-0001-CASE-3
      - T-BRUTALIST-CHECKBOX-0001-CASE-4
    exercises:
      - P-BASE-CHECKBOX
      - P-BASE-CHECKBOX-INDICATOR
      - P-BRUTALIST-CHECKBOX
      - P-BRUTALIST-CHECKBOX-INDICATOR
  - id: pr534-checkbox-browser-acceptance
    kind: adapter-test
    status: passing
    path: apps/www/src/content/docs/zh-cn/demo-pr534-coverage.browser.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-CHECKBOX-0001-CASE-BROWSER
    exercises:
      - P-BRUTALIST-CHECKBOX
      - P-BRUTALIST-CHECKBOX-INDICATOR

verifies:
  prototypes:
    - id: P-BRUTALIST-CHECKBOX
    - id: P-BRUTALIST-CHECKBOX-INDICATOR

exercises:
  prototypes:
    - P-BASE-CHECKBOX
    - P-BASE-CHECKBOX-INDICATOR
    - P-BRUTALIST-CHECKBOX
    - P-BRUTALIST-CHECKBOX-INDICATOR

revisions:
  - version: 0.3.0-alpha.0
    change: introduced
    summary: Introduced draft Brutalist Checkbox coverage.

tags:
  - test
  - brutalist
  - neo-brutalist
  - visual
  - checkbox

id: T-RULE-MATRIX-0001
type: test
title: Rule stable matrix tests
status: draft
since: 0.1.0
summary: Matrix coverage for stable Rule when and intent dimensions, with per-axis semantics covered by their own test entities and only cross-dimension behavior asserted here.
cases:
  - id: T-RULE-MATRIX-0001-CASE-PROPS-FEEDBACK-STYLE
    title: props-driven Rules produce and remove feedback.style tokens through semantic merge
    covers:
      - C-RULE-WHEN-0002-B
      - C-RULE-WHEN-0002-C
      - C-RULE-WHEN-0002-D
      - C-RULE-INTENT-FEEDBACK-STYLE-0001-C
      - C-RULE-INTENT-FEEDBACK-STYLE-0001-D
      - C-RULE-INTENT-FEEDBACK-STYLE-0001-E
      - C-RULE-RUNTIME-0001-A
      - C-RULE-RUNTIME-0001-B
    expectation: props-to-feedback-style-rule-cell
  - id: T-RULE-MATRIX-0001-CASE-STATE-FEEDBACK-STYLE
    title: state-driven Rules update feedback.style tokens on state changes without periodic polling
    covers:
      - C-RULE-WHEN-0002-B
      - C-RULE-WHEN-0002-C
      - C-RULE-WHEN-0002-D
      - C-RULE-INTENT-FEEDBACK-STYLE-0001-C
      - C-RULE-INTENT-FEEDBACK-STYLE-0001-D
      - C-RULE-INTENT-FEEDBACK-STYLE-0001-E
      - C-RULE-RUNTIME-0001-A
      - C-RULE-RUNTIME-0001-B
    expectation: state-to-feedback-style-rule-cell
  - id: T-RULE-MATRIX-0001-CASE-CONTEXT-FEEDBACK-STYLE
    title: context-driven Rules use whole context values or null fallback to produce feedback.style tokens
    covers:
      - C-RULE-WHEN-0002-B
      - C-RULE-WHEN-0002-C
      - C-RULE-WHEN-0002-D
      - C-RULE-INTENT-FEEDBACK-STYLE-0001-C
      - C-RULE-INTENT-FEEDBACK-STYLE-0001-D
      - C-RULE-INTENT-FEEDBACK-STYLE-0001-E
      - C-RULE-RUNTIME-0001-A
      - C-RULE-RUNTIME-0001-B
    expectation: context-to-feedback-style-rule-cell
  - id: T-RULE-MATRIX-0001-CASE-STATE-INTENT-DEFERRED
    title: state.set intent cells remain deferred and are excluded from required stable matrix coverage
    covers:
      - C-RULE-INTENT-0001-D
    expectation: deferred-state-intent-matrix-cells
implementations:
  - id: rule-react-supported-cells
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/rule.integration.test.ts
    required: true
    consumesCases:
      - T-RULE-MATRIX-0001-CASE-PROPS-FEEDBACK-STYLE
      - T-RULE-MATRIX-0001-CASE-STATE-FEEDBACK-STYLE
  - id: rule-vue-supported-cells
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/rule.integration.test.ts
    required: true
    consumesCases:
      - T-RULE-MATRIX-0001-CASE-PROPS-FEEDBACK-STYLE
      - T-RULE-MATRIX-0001-CASE-STATE-FEEDBACK-STYLE
  - id: rule-vue2-supported-cells
    kind: adapter-test
    status: passing
    path: packages/adapters/vue2/test/rule.integration.test.ts
    required: true
    consumesCases:
      - T-RULE-MATRIX-0001-CASE-PROPS-FEEDBACK-STYLE
      - T-RULE-MATRIX-0001-CASE-STATE-FEEDBACK-STYLE
  - id: rule-web-component-supported-cells
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/rule.integration.test.ts
    required: true
    consumesCases:
      - T-RULE-MATRIX-0001-CASE-PROPS-FEEDBACK-STYLE
      - T-RULE-MATRIX-0001-CASE-STATE-FEEDBACK-STYLE
  - id: rule-matrix-fixture
    kind: fixture
    status: active
    path: packages/runtime/test/contract/rule.matrix.fixture.ts
    required: true
    consumesCases:
      - T-RULE-MATRIX-0001-CASE-PROPS-FEEDBACK-STYLE
      - T-RULE-MATRIX-0001-CASE-STATE-FEEDBACK-STYLE
      - T-RULE-MATRIX-0001-CASE-CONTEXT-FEEDBACK-STYLE
      - T-RULE-MATRIX-0001-CASE-STATE-INTENT-DEFERRED
  - id: runtime-rule-matrix-combine-contract
    kind: runtime-test
    status: planned
    path: packages/runtime/test/contract/rule.matrix.combine.v0.contract.test.ts
    required: true
    consumesCases:
      - T-RULE-MATRIX-0001-CASE-PROPS-FEEDBACK-STYLE
      - T-RULE-MATRIX-0001-CASE-STATE-FEEDBACK-STYLE
      - T-RULE-MATRIX-0001-CASE-CONTEXT-FEEDBACK-STYLE
verifies:
  contracts:
    - id: C-RULE-WHEN-0002
      anchors:
        - C-RULE-WHEN-0002-B
        - C-RULE-WHEN-0002-C
        - C-RULE-WHEN-0002-D
    - id: C-RULE-INTENT-FEEDBACK-STYLE-0001
      anchors:
        - C-RULE-INTENT-FEEDBACK-STYLE-0001-C
        - C-RULE-INTENT-FEEDBACK-STYLE-0001-D
        - C-RULE-INTENT-FEEDBACK-STYLE-0001-E
    - id: C-RULE-RUNTIME-0001
      anchors:
        - C-RULE-RUNTIME-0001-A
        - C-RULE-RUNTIME-0001-B
exercises:
  decisions:
    - id: D-RULE-STATE-INTENT-0001
      role: diagnostic-policy
      coverageImpact: review-test-surface
      note: The matrix fixture may enumerate state.set combinations, but required v0 matrix coverage only includes the stable feedback.style intent.
revisions:
  - version: 0.1.0
    change: introduced
    summary: Added stable Rule matrix test mapping and deferred state intent exclusion.
tags:
  - rule
  - matrix
  - feedback
  - style
  - contract-test

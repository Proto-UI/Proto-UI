id: T-ADAPTER-PROFILE-0001
type: test
title: Adapter Profile schema and graph conformance
status: active
since: 0.2.0-rc.7
summary: Schema, workspace-loader, and graph tests verify first-class Adapter identities, target metadata, honest Module support or omission including State, Expose core, Expose State, and Expose Event, host-capability provision roles, and Adapter-targeted relations.
cases:
  - id: T-ADAPTER-PROFILE-0001-CASE-IDENTITY
    title: Adapter identities require package and target metadata
    covers:
      - D-ADAPTER-PROFILE-0001-A
    expectation: adapter-identity-requires-profile-metadata
  - id: T-ADAPTER-PROFILE-0001-CASE-MODULE-DECISION
    title: Supported and omitted Module decisions are explicit and disjoint
    covers:
      - D-ADAPTER-PROFILE-0001-B
      - D-ADAPTER-PROFILE-0001-C
    expectation: module-support-and-omission-cannot-overlap
  - id: T-ADAPTER-PROFILE-0001-CASE-CAPABILITY-MODE
    title: Provided host capabilities state their realization mode
    covers:
      - D-ADAPTER-PROFILE-0001-D
    expectation: provided-host-capability-requires-honesty-role
  - id: T-ADAPTER-PROFILE-0001-CASE-ADAPTER-RELATION
    title: Workspace relations validate Adapter target types
    covers:
      - D-ADAPTER-PROFILE-0001-E
    expectation: adapters-relation-targets-only-adapter-entities
  - id: T-ADAPTER-PROFILE-0001-CASE-GRAPH
    title: Support and capability relations enter the spec graph
    covers:
      - D-ADAPTER-PROFILE-0001-B
      - D-ADAPTER-PROFILE-0001-D
    expectation: adapter-support-and-provision-are-queryable-edges
implementations:
  - id: adapter-profile-schema-fixture
    kind: fixture
    status: passing
    path: packages/spec/fixtures/test/adapter-profile-schema.test.ts
    required: true
    consumesCases:
      - T-ADAPTER-PROFILE-0001-CASE-IDENTITY
      - T-ADAPTER-PROFILE-0001-CASE-MODULE-DECISION
      - T-ADAPTER-PROFILE-0001-CASE-CAPABILITY-MODE
      - T-ADAPTER-PROFILE-0001-CASE-ADAPTER-RELATION
  - id: adapter-profile-graph-projection
    kind: workspace-check
    status: passing
    path: packages/spec/graph/test/adapter-profile.test.ts
    required: true
    consumesCases:
      - T-ADAPTER-PROFILE-0001-CASE-GRAPH
verifies:
  decisions:
    - id: D-ADAPTER-PROFILE-0001
      anchors:
        - D-ADAPTER-PROFILE-0001-A
        - D-ADAPTER-PROFILE-0001-B
        - D-ADAPTER-PROFILE-0001-C
        - D-ADAPTER-PROFILE-0001-D
        - D-ADAPTER-PROFILE-0001-E
  adapters:
    - id: A-REACT-18-19-0001
      anchors:
        - A-REACT-18-19-0001-A
        - A-REACT-18-19-0001-B
        - A-REACT-18-19-0001-E
        - A-REACT-18-19-0001-L
        - A-REACT-18-19-0001-M
    - id: A-VUE-2-0001
      since: 0.3.0-alpha.0
      anchors:
        - A-VUE-2-0001-A
        - A-VUE-2-0001-B
        - A-VUE-2-0001-E
        - A-VUE-2-0001-L
        - A-VUE-2-0001-M
    - id: A-VUE-3-0001
      anchors:
        - A-VUE-3-0001-A
        - A-VUE-3-0001-B
        - A-VUE-3-0001-E
        - A-VUE-3-0001-L
        - A-VUE-3-0001-M
    - id: A-WEB-COMPONENT-0001
      anchors:
        - A-WEB-COMPONENT-0001-A
        - A-WEB-COMPONENT-0001-B
        - A-WEB-COMPONENT-0001-E
        - A-WEB-COMPONENT-0001-L
        - A-WEB-COMPONENT-0001-M
sources:
  - path: packages/spec/schema/src/index.ts
  - path: packages/spec/engine/src/node.ts
  - path: packages/spec/fixtures/test/adapter-profile-schema.test.ts
  - path: packages/spec/graph/test/adapter-profile.test.ts
revisions:
  - version: 0.3.0-alpha.0
    change: revised
    summary: Added exact package, runtime, Module, host-capability, and executable evidence alignment for the official Vue 2.6 profile.
  - version: 0.2.0-rc.7
    change: revised
    summary: Extended official profile fixture coverage to required Expose Event support and translated outward-signal sink provision.
  - version: 0.2.0-rc.7
    change: revised
    summary: Extended official profile fixture coverage to required Expose State support and translated finalized-record sink provision.
  - version: 0.2.0-rc.7
    change: revised
    summary: Extended official profile fixture coverage to required Expose core support without adding a core Expose host capability.
  - version: 0.2.0-rc.7
    change: revised
    summary: Extended official profile fixture coverage to required State support without adding a State host capability.
  - version: 0.2.0-rc.7
    change: revised
    summary: Extended official profile fixture coverage from the Props slice to required Event support and translated Event host capabilities.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Added executable schema, relation-type, and graph coverage for first-class Adapter Profile entities.
tags: [adapter, profile, schema, graph, conformance]

id: T-BRUTALIST-TEXTAREA-0001
type: test
title: Brutalist Textarea inheritance and visual contract tests
status: draft
since: 0.2.0-rc.7
summary: Covers complete Base Textarea inheritance on one contentless native target, Web Component modality-correct focus projection, and the rounded neutral sans visual delta.
cases:
  - id: T-BRUTALIST-TEXTAREA-0001-CASE-INHERITANCE
    title: Brutalist Textarea preserves the complete Base protocol and normalized uncontrolled editing on one native target
    covers:
      - P-BRUTALIST-TEXTAREA-BASE-INHERITANCE
      - P-BRUTALIST-TEXTAREA-SINGLE-TARGET
      - P-BRUTALIST-TEXTAREA-NO-PROTOCOL-DELTA
    expectation: brutalist-textarea-reuses-one-base-backed-native-control-without-behavioral-delta
  - id: T-BRUTALIST-TEXTAREA-0001-CASE-VISUAL-GRAMMAR
    title: The native target receives the neutral sans treatment
    covers:
      - P-BRUTALIST-TEXTAREA-VISUAL-GRAMMAR
      - P-BRUTALIST-TEXTAREA-SINGLE-TARGET
    expectation: brutalist-textarea-projects-rounded-neutral-sans-tokens
  - id: T-BRUTALIST-TEXTAREA-0001-CASE-STATEFUL-SURFACE
    title: Disabled and read-only selector context is colocated with the styled physical textarea
    covers:
      - P-BRUTALIST-TEXTAREA-VISUAL-GRAMMAR
      - P-BRUTALIST-TEXTAREA-SINGLE-TARGET
      - C-HOST-SURFACE-PROJECTION-0001-G
    expectation: wc-brutalist-textarea-state-markers-and-conditional-style-share-one-surface
  - id: T-BRUTALIST-TEXTAREA-0001-CASE-WC-FOCUS-RING
    title: Keyboard and pointer focus project the Brutalist ring according to the physical textarea native focus-visible result
    covers:
      - P-BRUTALIST-TEXTAREA-BASE-INHERITANCE
      - P-BRUTALIST-TEXTAREA-SINGLE-TARGET
      - P-BRUTALIST-TEXTAREA-VISUAL-GRAMMAR
      - P-BASE-TEXTAREA-A11Y-AND-FOCUS
      - P-BASE-TEXTAREA-PRESENTATION-SURFACE
    expectation: wc-brutalist-textarea-focus-facts-markers-and-ring-follow-the-physical-target-native-focus-visible-result
implementations:
  - id: prototypes-brutalist-textarea-contract
    kind: module-test
    status: passing
    path: packages/prototypes/brutalist/test/textarea.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-TEXTAREA-0001-CASE-INHERITANCE
      - T-BRUTALIST-TEXTAREA-0001-CASE-VISUAL-GRAMMAR
      - T-BRUTALIST-TEXTAREA-0001-CASE-STATEFUL-SURFACE
    exercises:
      - P-BASE-TEXTAREA
      - P-BRUTALIST-TEXTAREA
    notes:
      - Historical passing evidence predates this source-pinned presentation migration; current runtime/CSS/browser evidence must be verified separately.
      - Three successor runtime tests verify the 80px source literal, 12/8px padding, existing value/native-state ownership and real CSS/selection output. Browser evidence remains planned.
  - id: docs-browser-brutalist-textarea-focus
    kind: adapter-test
    status: planned
    path: apps/www/src/content/docs/zh-cn/demo-brutalist-controls.browser.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-TEXTAREA-0001-CASE-WC-FOCUS-RING
    exercises:
      - P-BASE-TEXTAREA
      - P-BRUTALIST-TEXTAREA
    notes:
      - Historical passing evidence predates this source-pinned presentation migration; current runtime/CSS/browser evidence must be verified separately.
verifies:
  prototypes:
    - id: P-BRUTALIST-TEXTAREA
      anchors:
        - P-BRUTALIST-TEXTAREA-BASE-INHERITANCE
        - P-BRUTALIST-TEXTAREA-SINGLE-TARGET
        - P-BRUTALIST-TEXTAREA-VISUAL-GRAMMAR
        - P-BRUTALIST-TEXTAREA-NO-PROTOCOL-DELTA
exercises:
  contracts:
    - C-HOST-SURFACE-PROJECTION-0001
  prototypes:
    - P-BASE-TEXTAREA
    - P-BRUTALIST-TEXTAREA
sources:
  - path: packages/prototypes/brutalist/test/textarea.test.ts
  - path: apps/www/src/content/docs/zh-cn/demo-brutalist-controls.browser.test.ts
revisions:
  - version: 0.3.0-alpha.0
    change: revised
    summary: Added Light/Dark browser evidence that keyboard and pointer focus facts/markers/ring follow the measured native focus-visible result of the physical textarea without a Brutalist modality override.
  - version: 0.2.0-rc.7
    change: revised
    summary: Added state-selector colocation coverage for the Web Component presentation surface.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Added executable Brutalist Textarea inheritance and visual coverage.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Require source-pinned geometry and negative legacy-recipe controls; presentation evidence is planned until current execution.
tags:
  - test
  - prototype
  - brutalist
  - neo-brutalist
  - textarea
  - visual

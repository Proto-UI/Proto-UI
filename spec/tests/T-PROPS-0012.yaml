id: T-PROPS-0012
type: test
title: Props module boundary and host source conformance
status: draft
since: 0.2.0-rc.7
summary: Module, runtime, and official Adapter tests verify the Props facade and port split, required runtime installation, Adapter input normalization, raw snapshot source semantics, callback-safe invalidation, direct-push separation, source replacement cleanup, and terminal disposal.
cases:
  - id: T-PROPS-0012-CASE-FACADE-PORT-SPLIT
    title: Props facade and privileged port expose distinct surfaces
    covers:
      - M-PROPS-0001-A
      - M-PROPS-0001-B
    expectation: author-facade-excludes-runtime-sync-and-task-consumption
  - id: T-PROPS-0012-CASE-REQUIRED-RUNTIME-MODULE
    title: Normal Runtime instances install the required Props module
    covers:
      - M-PROPS-0001-F
    expectation: runtime-always-constructs-props-module
  - id: T-PROPS-0012-CASE-ADAPTER-WIRING
    title: Official Adapters install Props and provide its translated host source
    covers:
      - A-REACT-18-19-0001-B
      - A-VUE-3-0001-B
      - A-VUE-2-0001-B
      - A-WEB-COMPONENT-0001-B
    expectation: official-adapters-wire-required-props-and-translated-source-capability
  - id: T-PROPS-0012-CASE-SOURCE-SNAPSHOT
    title: Adapter source provides a current string-keyed snapshot
    covers:
      - M-PROPS-0001-C
      - HC-PROPS-SOURCE-0001-A
      - HC-PROPS-SOURCE-0001-D
    expectation: adapter-normalized-source-is-read-by-props-module
  - id: T-PROPS-0012-CASE-INVALIDATION
    title: Source notification invalidates and later sync performs the diff
    covers:
      - M-PROPS-0001-D
      - HC-PROPS-SOURCE-0001-B
      - HC-PROPS-SOURCE-0001-C
      - A-REACT-18-19-0001-D
      - A-VUE-3-0001-D
      - A-VUE-2-0001-D
      - A-WEB-COMPONENT-0001-C
    expectation: notification-does-not-dispatch-until-runtime-sync
  - id: T-PROPS-0012-CASE-FRAMEWORK-NORMALIZATION
    title: React and Vue classify framework inputs before exposing raw Props
    covers:
      - A-REACT-18-19-0001-C
      - A-VUE-3-0001-C
      - A-VUE-2-0001-C
    expectation: default-filtering-and-explicit-get-props-replacement-are-executable
  - id: T-PROPS-0012-CASE-DIRECT-APPLY
    title: Direct runtime apply uses the Props kernel without becoming a host capability
    covers:
      - M-PROPS-0001-E
    expectation: direct-apply-dispatches-at-callback-safe-point-without-render
  - id: T-PROPS-0012-CASE-WEB-COMPONENT-DIRECT-NORMALIZATION
    title: Web Component direct apply keeps presentation fields outside raw Props
    covers:
      - A-WEB-COMPONENT-0001-D
    expectation: presentation-projection-and-direct-props-application-remain-separated
  - id: T-PROPS-0012-CASE-SOURCE-REPLACEMENT
    title: Source replacement disposes the old subscription and reads the new source
    covers:
      - M-PROPS-0001-G
      - HC-PROPS-SOURCE-0001-E
    expectation: old-source-is-unsubscribed-before-new-source-controls-snapshot
  - id: T-PROPS-0012-CASE-TERMINAL-DISPOSAL
    title: Terminal module disposal releases the current source subscription
    covers:
      - M-PROPS-0001-G
      - HC-PROPS-SOURCE-0001-E
    expectation: disposed-module-no-longer-observes-source

id: T-SHADCN-INPUT-0001
type: test
title: Shadcn Input Root visual projection and Base-inheritance tests
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: >-
    本 Test 保持 draft：首版投射目前有本地契约测试与四个 Web Adapter 的浏览器 evidence，但完整 Base/Adapter parity、待处理 compatibility 差异及人工视觉确认尚未完成，因而不足以作为已审阅稳定 conformance contract。


  en: >-
    This Test remains draft because the initial projection currently has local contract tests and browser evidence across four Web Adapters, but complete Base/Adapter parity, remaining compatibility differences, and human visual confirmation are not yet closed; it is not a reviewed stable conformance contract.


summary: Covers Shadcn Input identity, exact export, inherited single-line editor ownership, verified visual subset including native text selection, state-driven presentation, contentless behavior, and compatibility boundary.
cases:
  - id: T-SHADCN-INPUT-0001-CASE-EXPORTS
    title: Root is the exact direct Shadcn Input package entry
    covers:
      [
        P-SHADCN-INPUT-UPSTREAM-IDENTITY,
        P-SHADCN-INPUT-DIRECT-ENTRY,
        P-SHADCN-INPUT-COMPATIBILITY-SUBSET,
      ]
    expectation: shadcn-input-root-is-exported-from-exact-public-package-entry
  - id: T-SHADCN-INPUT-0001-CASE-EDITOR-OWNERSHIP
    title: Base preserves one host-owned input and the unchanged text-control protocol
    covers:
      [P-SHADCN-INPUT-BASE-INHERITANCE, P-SHADCN-INPUT-BASE-GUARANTEES, P-SHADCN-INPUT-BOUNDARY]
    expectation: shadcn-input-materializes-one-base-owned-text-editor-without-extra-protocol
  - id: T-SHADCN-INPUT-0001-CASE-VISUAL-SURFACE
    title: Root projects content-pinned base-nova geometry and rejects superseded new-york geometry
    covers: [P-SHADCN-INPUT-VISUAL-SURFACE, P-SHADCN-INPUT-COMPATIBILITY-SUBSET]
    expectation: shadcn-input-base-nova-h8-rounded-lg-px2-5-without-legacy-shadow
  - id: T-SHADCN-INPUT-0001-CASE-SELECTION-PRESENTATION
    title: Native text selection retains the explicit Proto UI primary-palette extension
    covers: [P-SHADCN-INPUT-SELECTION-PRESENTATION]
    expectation: native-input-selection-renders-primary-background-and-foreground
  - id: T-SHADCN-INPUT-0001-CASE-STATE-PRESENTATION
    title: Inherited focus and disabled plus host dark metadata preserve base-nova state-palette precedence
    covers: [P-SHADCN-INPUT-STATE-PRESENTATION]
    expectation: shadcn-input-disabled-and-dark-intersection-overrides-single-condition-palette
  - id: T-SHADCN-INPUT-0001-CASE-CONTENTLESS
    title: Projection drops authored children and adds no content renderer
    covers: [P-SHADCN-INPUT-CONTENTLESS, P-SHADCN-INPUT-BOUNDARY]
    expectation: shadcn-input-keeps-a-single-contentless-host-owned-editor
implementations:
  - id: prototypes-shadcn-input-contract
    kind: module-test
    status: passing
    path: packages/prototypes/shadcn/test/input.test.ts
    required: true
    consumesCases:
      [
        T-SHADCN-INPUT-0001-CASE-EXPORTS,
        T-SHADCN-INPUT-0001-CASE-EDITOR-OWNERSHIP,
        T-SHADCN-INPUT-0001-CASE-VISUAL-SURFACE,
        T-SHADCN-INPUT-0001-CASE-SELECTION-PRESENTATION,
        T-SHADCN-INPUT-0001-CASE-STATE-PRESENTATION,
        T-SHADCN-INPUT-0001-CASE-CONTENTLESS,
      ]
    exercises: &inputPrototypes [P-SHADCN-INPUT, P-BASE-INPUT]
    notes:
      - 'Historical evidence note before the 2026-10-10 recipe migration: Remaining style-channel limitations and absent Base invalid/className/data-slot ownership are recorded as compatibility differences, not silently implemented with an extra protocol.'
      - Six successor module tests passed for source-pinned geometry, explicit selection extension, real CSS generation, state-marker colocation, repeated disabled updates, contentless editor and unchanged public ownership. This is happy-dom and CSS-output evidence; the separate browser implementation remains planned.
  - id: prototypes-shadcn-input-browser
    kind: runtime-test
    status: planned
    path: apps/www/src/content/docs/zh-cn/demo-shadcn-input.browser.test.ts
    required: true
    consumesCases:
      [
        T-SHADCN-INPUT-0001-CASE-EDITOR-OWNERSHIP,
        T-SHADCN-INPUT-0001-CASE-SELECTION-PRESENTATION,
        T-SHADCN-INPUT-0001-CASE-STATE-PRESENTATION,
      ]
    exercises: *inputPrototypes
    notes:
      - 'Historical evidence note before the 2026-10-10 recipe migration: Planned four-runtime rendered behavior and style evidence through Web Component, React, Vue, and Vue 2 previews; manual visual verification remains a separate human gate.'
      - Existing historical passing evidence predates the base-nova draft migration. Current implementation and real-browser evidence must be rerun; this definition-only change does not claim a pass.
verifies:
  prototypes: [P-SHADCN-INPUT]
exercises:
  prototypes: *inputPrototypes
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added draft conformance cases and implementation mappings for the Shadcn Input projection and native selection presentation.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Specified base-nova geometry and dark-disabled precedence; marked affected evidence planned until the successor implementation is verified.

id: T-LIQUID-GLASS-MATERIAL-0001
type: test
title: Liquid Glass V2 optical intent and four-Web source evidence
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: Bounded material policy is experimental. Unit evidence does not establish optical or cross-host conformance; actual four-Web consumer evidence must be collected.
summary: Real Prototype V2 intent tests plus planned four-Web optical pixel, visible-source revocation, overlap and preference evidence.
cases:
  - id: T-LIQUID-GLASS-MATERIAL-0001-CASE-POLICY
    title: Base press candidates, opt-out, opaque ordinary style and view remount
    covers:
      - P-LIQUID-GLASS-BUTTON-MATERIAL
      - P-LIQUID-GLASS-BUTTON-API
    expectation: source-rule-safe-material-policy
  - id: T-LIQUID-GLASS-MATERIAL-0001-CASE-PAINT
    title: Actual same-control optical pixels and four-host source fallback
    covers:
      - P-LIQUID-GLASS-BUTTON-MATERIAL
      - P-LIQUID-GLASS-BUTTON-VISUAL
      - P-LIQUID-GLASS-BUTTON-CLOSURE
    expectation: real-web-visible-canvas-optics-and-live-fallback
implementations:
  - id: liquid-glass-material-policy
    kind: module-test
    status: passing
    path: packages/prototypes/liquid-glass/test/material.test.ts
    required: true
    consumesCases:
      - T-LIQUID-GLASS-MATERIAL-0001-CASE-POLICY
    notes:
      - Five focused cases on the real Prototype and Runtime; provider presence is distinct from committed paint. No browser result is inferred.
  - id: liquid-glass-material-browser
    kind: runtime-test
    status: planned
    path: apps/www/src/content/docs/zh-cn/demo-liquid-glass-material.browser.test.ts
    required: true
    consumesCases:
      - T-LIQUID-GLASS-MATERIAL-0001-CASE-PAINT
    notes:
      - Must run on the exact combined source head after primitive review. Captures actual four-runtime controls and decodes their GPU output for the same-source press negative control.
      - Visible canvas source-loss/recovery and overlap refusal are exercised on the real browser consumers, together with static reduced-motion and opaque reduced-transparency paths. No native Apple, GPUI, Compiler, Flutter or Qt claim.
exercises:
  prototypes:
    - P-LIQUID-GLASS-BUTTON
sources:
  - path: packages/prototypes/liquid-glass/test/material.test.ts
  - path: .github/workflows/liquid-material-evidence.yml
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added finite material policy evidence and planned actual-Web consumer capture without promoting the draft.
tags:
  - test
  - liquid-glass
  - material
  - draft

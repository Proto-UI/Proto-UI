    exercises: [P-SHADCN-HOVER-CARD-CONTENT, P-BASE-HOVER-CARD-CONTENT]
    notes:
      - Positive tests cover detached presence, entering and leaving states, current surface and directional animations, fixed positioning, and hover bridge; remaining parity stays centralized.

  - id: T-SHADCN-HOVER-CARD-CONTENT-0001-CASE-MOTION-SURFACE-AND-COMPATIBILITY
    title: open and side state drive the current 200ms animated surface with an explicit theme border while parity gaps stay bounded
    covers:
      [
        P-SHADCN-HOVER-CARD-CONTENT-TRANSITION,
        P-SHADCN-HOVER-CARD-CONTENT-CURRENT-VISUAL-SURFACE,
        P-SHADCN-HOVER-CARD-CONTENT-OPEN-AND-SIDE-STYLES,
        P-SHADCN-HOVER-CARD-CONTENT-COMPATIBILITY-SUBSET,
        P-SHADCN-HOVER-CARD-CONTENT-AS-CHILD-OMISSION,
      ]
    expectation: shadcn-hover-card-content-projects-its-theme-border-and-current-motion
implementations:

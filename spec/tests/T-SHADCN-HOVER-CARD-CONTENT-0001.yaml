    title: Content is a named direct entry that inherits Base overlay and transition behavior
    covers:
      [
        P-SHADCN-HOVER-CARD-CONTENT-UPSTREAM-IDENTITY,
        P-SHADCN-HOVER-CARD-CONTENT-BASE-INHERITANCE,

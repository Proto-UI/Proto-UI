id: T-BRUTALIST-BUTTON-0001
type: test
title: Brutalist Button visual contract and public API tests
status: draft
since: 0.2.0-rc.7
summary: >-
  Covers the redesigned Brutalist Button public API, paired fills, interaction states, Light/Dark behavior, and live theme transitions against P-BRUTALIST-BUTTON criteria.


cases:
  - id: T-BRUTALIST-BUTTON-0001-CASE-1
    title: Direct entry and Base Button inheritance (runtime identity)
    covers:
      - P-BRUTALIST-BUTTON-ENTRY
      - P-BRUTALIST-BUTTON-BASE-INHERITANCE
    expectation: p-brutalist-button-entry-inheritance
  - id: T-BRUTALIST-BUTTON-0001-CASE-2
    title: Defaults restore after prop removal
    covers:
      - P-BRUTALIST-BUTTON-DEFAULTS
      - P-BRUTALIST-BUTTON-VARIANT-PROP
      - P-BRUTALIST-BUTTON-COLOR-PROP
      - P-BRUTALIST-BUTTON-SIZE-PROP
    expectation: p-brutalist-button-defaults
  - id: T-BRUTALIST-BUTTON-0001-CASE-3
    title: Every solid color keeps its foreground pair
    covers:
      - P-BRUTALIST-BUTTON-COLOR-PROP
      - P-BRUTALIST-BUTTON-PAIR-INVARIANT
    expectation: p-brutalist-button-solid-pairs
  - id: T-BRUTALIST-BUTTON-0001-CASE-4
    title: Surface and destructive fills keep paired foregrounds
    covers:
      - P-BRUTALIST-BUTTON-VARIANT-PROP
      - P-BRUTALIST-BUTTON-PAIR-INVARIANT
    expectation: p-brutalist-button-variant-fills
  - id: T-BRUTALIST-BUTTON-0001-CASE-5
    title: Visual grammar remains square hard-shadow Neo-Brutalist
    covers:
      - P-BRUTALIST-BUTTON-VISUAL-GRAMMAR
    expectation: p-brutalist-button-visual-grammar
  - id: T-BRUTALIST-BUTTON-0001-CASE-6
    title: Hover press focus-visible and disabled projection
    covers:
      - P-BRUTALIST-BUTTON-INTERACTION
      - P-BRUTALIST-BUTTON-BASE-INHERITANCE
    expectation: p-brutalist-button-interaction
  - id: T-BRUTALIST-BUTTON-0001-CASE-7
    title: Solid accent pairs stay identical under Light and Dark meta
    covers:
      - P-BRUTALIST-BUTTON-LIGHT-DARK
      - P-BRUTALIST-BUTTON-PAIR-INVARIANT
    expectation: p-brutalist-button-light-dark
  - id: T-BRUTALIST-BUTTON-0001-CASE-8
    title: Host theme change repaints mounted buttons (including disabled) via computed CSS
    covers:
      - P-BRUTALIST-BUTTON-LIVE-THEME
      - P-BRUTALIST-BUTTON-PAIR-INVARIANT
    expectation: p-brutalist-button-live-theme
  - id: T-BRUTALIST-BUTTON-0001-CASE-9
    title: Every size option maps to dimension tokens
    covers:
      - P-BRUTALIST-BUTTON-SIZE-PROP
    expectation: p-brutalist-button-sizes
  - id: T-BRUTALIST-BUTTON-0001-CASE-LIVE-THEME-BROWSER
    title: A host theme change repaints theme-following fills in a real browser, in every runtime
    covers:
      - P-BRUTALIST-BUTTON-LIVE-THEME
      - P-BRUTALIST-BUTTON-LIGHT-DARK
      - P-BRUTALIST-BUTTON-PAIR-INVARIANT
    expectation: p-brutalist-button-live-theme-browser
implementations:
  - id: prototypes-brutalist-button-contract
    kind: module-test
    status: passing
    path: packages/prototypes/brutalist/test/button.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-BUTTON-0001-CASE-1
      - T-BRUTALIST-BUTTON-0001-CASE-2
      - T-BRUTALIST-BUTTON-0001-CASE-3
      - T-BRUTALIST-BUTTON-0001-CASE-4
      - T-BRUTALIST-BUTTON-0001-CASE-5
      - T-BRUTALIST-BUTTON-0001-CASE-6
      - T-BRUTALIST-BUTTON-0001-CASE-7
      - T-BRUTALIST-BUTTON-0001-CASE-9
    exercises:
      - P-BASE-BUTTON
      - P-BRUTALIST-BUTTON
  - id: prototypes-brutalist-button-live-theme
    kind: module-test
    status: passing
    path: packages/prototypes/brutalist/test/button-live-theme.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-BUTTON-0001-CASE-8
    exercises:
      - P-BRUTALIST-BUTTON
  - id: www-brutalist-button-live-theme-browser
    kind: runtime-test
    status: passing
    path: apps/www/src/content/docs/zh-cn/demo-brutalist-controls.browser.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-BUTTON-0001-CASE-LIVE-THEME-BROWSER
    exercises:
      - P-BASE-BUTTON
      - P-BRUTALIST-BUTTON
    notes:
      - The module test scopes theme variables to a wrapper element and strips the `@layer proto-ui` wrapper, because happy-dom implements neither. This case reads the same fills in Chromium, where the layer and the `:root` theme both apply, in Web Components, React, Vue, and Vue 2.
      - Each fill is compared against the `:root` value of the variable it names rather than against a pinned colour, so the case states which variable the surface follows instead of restating the palette.
      - The `destructive` pair holds the same value in both schemes, so only `surface` is asserted to move; a collapsed theme would still satisfy the per-scheme comparisons.
      - The pointer is parked off the demo and `data-hovered`/`data-pressed` are asserted absent, which is the "without pointer interaction" half of the criterion.
      - The media preference is pinned to Light for the whole case and Dark is reached by calling the documentation theme control, because the criterion puts `prefers-color-scheme` outside the supported mechanism and a media-query implementation would otherwise satisfy every comparison. The case asserts the root carries no `dark` class, so it cannot stay green on a class selector while the selector the real toggle depends on is broken.
      - The variables this criterion pair requires the surface and destructive fills to resolve through are then overridden, each with a distinct value in neither palette, and those fills are asserted against the variable they name. A pair hard-coded to a value both palettes share passes both schemes and fails here, which is what separates variable resolution from a fixed colour. The solid accent variables are left alone and the accent pair is asserted unchanged, because the criterion asks solid to be theme-invariant rather than variable-backed and a conforming projection may materialize it as fixed colours.
      - The demo gained a disabled `surface` Button; the disabled example it already had is `solid`, whose accent pair is theme-invariant and cannot show a repaint.
verifies:
  prototypes:
    - id: P-BRUTALIST-BUTTON
exercises:
  prototypes:
    - P-BASE-BUTTON
    - P-BRUTALIST-BUTTON
revisions:
  - version: 0.3.0-alpha.0
    change: strengthened
    summary: Added real-browser live-theme coverage across Web Components, React, and Vue, so the criterion no longer rests only on a module test that must strip `@layer` and scope the theme to a wrapper.
  - version: 0.2.0-rc.7
    change: introduced
    summary: >-
      Introduced draft Brutalist Button coverage mapped 1:1 to the rc.7 P criteria (API, pairs, interaction, Light/Dark, live theme). Not present in the immutable rc.6 snapshot.


tags:

id: T-BRUTALIST-BUTTON-0001
type: test
title: Brutalist Button visual contract and public API tests
status: draft
since: 0.2.0-rc.7
summary: >-
  Covers the redesigned Brutalist Button public API, paired fills, interaction states, Light/Dark behavior, and live theme transitions against P-BRUTALIST-BUTTON criteria.


cases:
  - id: T-BRUTALIST-BUTTON-0001-CASE-MOTION
    title: Continuous transform and shadow curves with live reduced-motion preference
    covers: [P-BRUTALIST-BUTTON-MOTION]
    expectation: brutalist-button-real-frame-curves-and-reduced-motion
  - id: T-BRUTALIST-BUTTON-0001-CASE-WRAP
    title: Opt-in wrapping preserves family minima and fixed default/icon sizes
    covers: [P-BRUTALIST-BUTTON-WRAP]
    expectation: brutalist-button-wrap-minimum-and-default-restoration
  - id: T-BRUTALIST-BUTTON-0001-CASE-1
    title: Direct entry and Base Button inheritance (runtime identity)
    covers:
      - P-BRUTALIST-BUTTON-ENTRY
      - P-BRUTALIST-BUTTON-BASE-INHERITANCE
    expectation: p-brutalist-button-entry-inheritance
  - id: T-BRUTALIST-BUTTON-0001-CASE-2
    title: Defaults restore after prop removal
    covers:
      - P-BRUTALIST-BUTTON-DEFAULTS
      - P-BRUTALIST-BUTTON-VARIANT-PROP
      - P-BRUTALIST-BUTTON-COLOR-PROP
      - P-BRUTALIST-BUTTON-SIZE-PROP
    expectation: p-brutalist-button-defaults
  - id: T-BRUTALIST-BUTTON-0001-CASE-3
    title: Every solid color keeps its foreground pair
    covers:
      - P-BRUTALIST-BUTTON-COLOR-PROP
      - P-BRUTALIST-BUTTON-PAIR-INVARIANT
    expectation: p-brutalist-button-solid-pairs
  - id: T-BRUTALIST-BUTTON-0001-CASE-4
    title: Surface and destructive fills keep paired foregrounds
    covers:
      - P-BRUTALIST-BUTTON-VARIANT-PROP
      - P-BRUTALIST-BUTTON-PAIR-INVARIANT
    expectation: p-brutalist-button-variant-fills
  - id: T-BRUTALIST-BUTTON-0001-CASE-5
    title: Visual grammar remains source-aligned component-specific Neo-Brutalist
    covers:
      - P-BRUTALIST-BUTTON-VISUAL-GRAMMAR
    expectation: p-brutalist-button-visual-grammar
  - id: T-BRUTALIST-BUTTON-0001-CASE-6
    title: Hover press focus-visible and disabled projection
    covers:
      - P-BRUTALIST-BUTTON-INTERACTION
      - P-BRUTALIST-BUTTON-BASE-INHERITANCE
    expectation: p-brutalist-button-interaction
  - id: T-BRUTALIST-BUTTON-0001-CASE-7
    title: Solid accent pairs stay identical under Light and Dark meta
    covers:
      - P-BRUTALIST-BUTTON-LIGHT-DARK
      - P-BRUTALIST-BUTTON-PAIR-INVARIANT
    expectation: p-brutalist-button-light-dark
  - id: T-BRUTALIST-BUTTON-0001-CASE-8
    title: Host theme change repaints mounted buttons (including disabled) via computed CSS
    covers:
      - P-BRUTALIST-BUTTON-LIVE-THEME
      - P-BRUTALIST-BUTTON-PAIR-INVARIANT
    expectation: p-brutalist-button-live-theme
  - id: T-BRUTALIST-BUTTON-0001-CASE-9
    title: Every size option maps to dimension tokens
    covers:
      - P-BRUTALIST-BUTTON-SIZE-PROP
    expectation: p-brutalist-button-sizes
  - id: T-BRUTALIST-BUTTON-0001-CASE-LIVE-THEME-BROWSER
    title: A host theme change repaints theme-following fills in a real browser, in every runtime
    covers:
      - P-BRUTALIST-BUTTON-LIVE-THEME
      - P-BRUTALIST-BUTTON-LIGHT-DARK
      - P-BRUTALIST-BUTTON-PAIR-INVARIANT
    expectation: p-brutalist-button-live-theme-browser

    exercises: [P-BRUTALIST-BUTTON]
    notes:
      [Local isolated module results do not establish native drag or rendered geometry acceptance.]
  - id: homepage-brutalist-button-contract-browser
    kind: adapter-test
    status: planned
    path: apps/www/src/content/docs/zh-cn/homepage-button-contract.browser.test.ts
    required: true
    consumesCases: [T-BRUTALIST-BUTTON-0001-CASE-WRAP]
    exercises: [P-BRUTALIST-BUTTON]
    notes:
      [
        Four runtimes and both homepage families retain real input and geometry assertions; browser result is pending for this candidate.,
      ]
  - id: prototypes-brutalist-button-contract
    kind: module-test
    status: passing
    path: packages/prototypes/brutalist/test/button.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-BUTTON-0001-CASE-1
      - T-BRUTALIST-BUTTON-0001-CASE-2
      - T-BRUTALIST-BUTTON-0001-CASE-3
      - T-BRUTALIST-BUTTON-0001-CASE-4
      - T-BRUTALIST-BUTTON-0001-CASE-5
      - T-BRUTALIST-BUTTON-0001-CASE-6
      - T-BRUTALIST-BUTTON-0001-CASE-7
      - T-BRUTALIST-BUTTON-0001-CASE-9
    exercises:
      - P-BASE-BUTTON
      - P-BRUTALIST-BUTTON
  - id: prototypes-brutalist-button-live-theme
    kind: module-test
    status: passing
    path: packages/prototypes/brutalist/test/button-live-theme.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-BUTTON-0001-CASE-8
    exercises:
      - P-BRUTALIST-BUTTON
  - id: www-brutalist-button-live-theme-browser
    kind: runtime-test
    status: passing
    path: apps/www/src/content/docs/zh-cn/demo-brutalist-controls.browser.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-BUTTON-0001-CASE-LIVE-THEME-BROWSER
    exercises:
      - P-BASE-BUTTON
      - P-BRUTALIST-BUTTON
    notes:
      - The module test scopes theme variables to a wrapper element and strips the `@layer proto-ui` wrapper, because happy-dom implements neither. This case reads the same fills in Chromium, where the layer and the `:root` theme both apply, in Web Components, React, Vue, and Vue 2.
      - Each fill is compared against the computed value of the variable it names on that same rendered presentation surface rather than against a pinned colour. This keeps the evidence valid when a Website projection scope deliberately keeps one lane's theme off `:root`, while still stating which variable the surface follows instead of restating the palette.
      - The `destructive` pair holds the same value in both schemes, so only `surface` is asserted to move; a collapsed theme would still satisfy the per-scheme comparisons.
      - The pointer is parked off the demo and `data-hovered`/`data-pressed` are asserted absent, which is the "without pointer interaction" half of the criterion.
      - The media preference is pinned to Light for the whole case and Dark is reached by calling the documentation theme control, because the criterion puts `prefers-color-scheme` outside the supported mechanism and a media-query implementation would otherwise satisfy every comparison. The case asserts the root carries no `dark` class, so it cannot stay green on a class selector while the selector the real toggle depends on is broken.
      - The variables this criterion pair requires the surface and destructive fills to resolve through are then overridden on each rendered presentation surface, each with a distinct value in neither palette, and those fills are asserted against the variable they name. A pair hard-coded to a value both palettes share passes both schemes and fails here, which is what separates variable resolution from a fixed colour. The solid accent variables are left alone and the accent pair is asserted unchanged, because the criterion asks solid to be theme-invariant rather than variable-backed and a conforming projection may materialize it as fixed colours.
      - The demo gained a disabled `surface` Button; the disabled example it already had is `solid`, whose accent pair is theme-invariant and cannot show a repaint.
  - id: www-brutalist-button-visual-interaction-browser
    kind: runtime-test
    status: passing
    path: apps/www/src/content/docs/zh-cn/demo-brutalist-button.browser.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-BUTTON-0001-CASE-5
      - T-BRUTALIST-BUTTON-0001-CASE-6
    exercises:
      - P-BASE-BUTTON
      - P-BRUTALIST-BUTTON
    notes:
      - Exercises Web Components, React, and Vue in Chromium through the public Button preview and asserts exact square borders, black zero-blur hard shadows, hover lift, pressed sink, focus-visible ring, and disabled projections from computed CSS.
      - Compares rest, hover, press, and settled state pairs so the verdict depends on exact shadow and transform transitions; optional fixed-host frames are inspection artifacts and are not compared by brittle PNG byte equality.
      - >-
        Resolves the focus ring and its offset from active CSS custom properties, rejects transparent colors, and compares the disabled background/foreground pair, border, radius, shadow, and transform with the enabled rest state in addition to exact `opacity: 0.5` and `pointer-events: none`.



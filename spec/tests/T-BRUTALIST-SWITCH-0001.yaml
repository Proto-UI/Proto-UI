id: T-BRUTALIST-SWITCH-0001
type: test
title: Brutalist Switch visual, interaction, and demo naming tests
status: draft
since: 0.2.0-rc.7
summary: >-
  Covers the Brutalist Switch public API (root checked-fill pair without padding swap, thumb single-movement checked translation, press/focus/disabled) plus the visible name-from-content reference-demo composition against P-BRUTALIST-SWITCH and P-BRUTALIST-SWITCH-THUMB criteria.


cases:
  - id: T-BRUTALIST-SWITCH-0001-CASE-RESIDENT
    title: Real prototype resident targets preserve timing, acknowledged reversal and lifecycle ownership
    covers: [P-BRUTALIST-SWITCH-THUMB-RESIDENT-MOTION]
    expectation: brutalist-thumb-neutral-resident-translate-without-competing-css-timing
  - id: T-BRUTALIST-SWITCH-0001-CASE-RESIDENT-BROWSER
    title: Actual Document and Shadow consumer frames preserve constant y and font-relative checked travel
    covers: [P-BRUTALIST-SWITCH-THUMB-RESIDENT-MOTION]
    expectation: brutalist-thumb-source-bound-physical-trajectory-at-16-and-32-root-font
  - id: T-BRUTALIST-SWITCH-0001-CASE-1
    title: Direct entry and Base Switch inheritance for root and thumb
    covers:
      - P-BRUTALIST-SWITCH-ENTRY
      - P-BRUTALIST-SWITCH-BASE-INHERITANCE
      - P-BRUTALIST-SWITCH-THUMB-ENTRY
      - P-BRUTALIST-SWITCH-THUMB-BASE-INHERITANCE
    expectation: p-brutalist-switch-entry-inheritance
  - id: T-BRUTALIST-SWITCH-0001-CASE-2
    title: Thumb is the sole checked-movement mechanism; root padding stays zero
    covers:
      - P-BRUTALIST-SWITCH-THUMB-SINGLE-MOVEMENT
      - P-BRUTALIST-SWITCH-CHECKED-PAIR-INVARIANT
    expectation: p-brutalist-switch-single-movement
  - id: T-BRUTALIST-SWITCH-0001-CASE-3
    title: Checked root swaps fill to bg-main without geometry change
    covers:
      - P-BRUTALIST-SWITCH-CHECKED-PAIR-INVARIANT
      - P-BRUTALIST-SWITCH-THUMB-SINGLE-MOVEMENT
    expectation: p-brutalist-switch-checked-pair
  - id: T-BRUTALIST-SWITCH-0001-CASE-4
    title: Press focus-visible and disabled projection on root
    covers:
      - P-BRUTALIST-SWITCH-INTERACTION
      - P-BRUTALIST-SWITCH-BASE-INHERITANCE
    expectation: p-brutalist-switch-interaction
  - id: T-BRUTALIST-SWITCH-0001-CASE-5
    title: Visual grammar remains source-aligned component-specific Neo-Brutalist for root and thumb
    covers:
      - P-BRUTALIST-SWITCH-VISUAL-GRAMMAR
      - P-BRUTALIST-SWITCH-THUMB-VISUAL-GRAMMAR
    expectation: p-brutalist-switch-visual-grammar
  - id: T-BRUTALIST-SWITCH-0001-CASE-6
    title: Visible demo captions supply the accessible name through Switch content
    covers:
      - P-BRUTALIST-SWITCH-DEMO-NAMING
    expectation: p-brutalist-switch-demo-name-from-content
implementations:
  - id: brutalist-switch-shadow-admission
    kind: adapter-test
    status: planned
    path: packages/prototypes/brutalist/test/switch-shadow-admission.test.ts
    required: true
    consumesCases: [T-BRUTALIST-SWITCH-0001-CASE-RESIDENT]
    exercises: [P-BRUTALIST-SWITCH, P-BRUTALIST-SWITCH-THUMB]
    notes:
      - Actual Shadow setup and final targets with unknown measurement/preference settle. Regression reproduces the 3161744 unresolved-role failure; physical trajectories require a fresh CI run.
  - id: brutalist-switch-resident-runtime
    kind: module-test
    status: planned
    path: packages/prototypes/brutalist/test/switch-resident.test.ts
    required: true
    consumesCases: [T-BRUTALIST-SWITCH-0001-CASE-RESIDENT]
    exercises: [P-BRUTALIST-SWITCH, P-BRUTALIST-SWITCH-THUMB]
    notes:
      - Actual Root/Thumb and Web Adapter with deterministic frame, media and measurement substitutes; not physical browser or native host evidence.
  - id: brutalist-switch-resident-source
    kind: module-test
    status: planned
    path: packages/prototypes/brutalist/test/switch-resident-source.test.ts
    required: true
    consumesCases: [T-BRUTALIST-SWITCH-0001-CASE-RESIDENT]
    exercises: [P-BRUTALIST-SWITCH-THUMB]
  - id: brutalist-switch-resident-browser
    kind: workspace-check
    status: planned
    path: packages/prototypes/brutalist/test/switch-motion.browser.test.ts
    required: true
    consumesCases: [T-BRUTALIST-SWITCH-0001-CASE-RESIDENT-BROWSER]
    exercises: [P-BRUTALIST-SWITCH, P-BRUTALIST-SWITCH-THUMB]
    notes:
      - Fresh Brutalist-only fixture in existing CI evidence workflow; local browser execution unavailable. Native activation and programmatic reversal traces are distinguished. Root color resident, small sizing, native host and Compiler remain outside this slice.
  - id: prototypes-brutalist-switch-contract
    kind: module-test
    status: passing
    path: packages/prototypes/brutalist/test/switch.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-SWITCH-0001-CASE-1
      - T-BRUTALIST-SWITCH-0001-CASE-2
      - T-BRUTALIST-SWITCH-0001-CASE-3
      - T-BRUTALIST-SWITCH-0001-CASE-4
      - T-BRUTALIST-SWITCH-0001-CASE-5
    exercises:
      - P-BASE-SWITCH
      - P-BASE-SWITCH-THUMB
      - P-BRUTALIST-SWITCH
      - P-BRUTALIST-SWITCH-THUMB
  - id: www-brutalist-control-demo-contract
    kind: workspace-check
    status: passing
    path: apps/www/src/content/docs/zh-cn/demo-brutalist-controls.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-SWITCH-0001-CASE-6
    exercises:
      - P-BASE-SWITCH
      - P-BRUTALIST-SWITCH
verifies:
  prototypes:
    - id: P-BRUTALIST-SWITCH
    - id: P-BRUTALIST-SWITCH-THUMB
exercises:
  prototypes:
    - P-BASE-SWITCH
    - P-BASE-SWITCH-THUMB
    - P-BRUTALIST-SWITCH
    - P-BRUTALIST-SWITCH-THUMB
revisions:
  - version: 0.3.0-alpha.1
    change: expanded
    summary: Add source, deterministic Runtime and planned real-browser resident Thumb acceptance without promoting draft host support.
  - version: 0.2.0-rc.7
    change: introduced
    summary: >-
      Introduced draft Brutalist Switch coverage mapped 1:1 to the rc.7 P criteria (entry/inheritance, single-movement, checked pair, interaction, visual grammar). Not present in the immutable rc.6 snapshot.


  - version: 0.2.0
    change: revised
    summary: >-
      Added executable reference-demo coverage that keeps each visible caption inside its Switch root for inherited name-from-content projection.


tags:

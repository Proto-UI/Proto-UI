id: T-SLIDER-VALUES-RUNTIME-0001
type: test
title: Reconstructed Slider Values bounded Runtime evidence
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: Fresh numerical, owner/keyboard, publication and synchronous Adapter-harness checks exist for the new reconstruction; independent review is pending. Pointer/Field/native/family/Compiler completion remains explicitly missing.
summary: Separates newly executed evidence from unavailable historical local artifacts.
cases:
  - id: T-SLIDER-VALUES-RUNTIME-0001-CASE-NUMERIC
    title: Safe owner copies, derived display and bounded keyboard requests
    covers:
      - C-SLIDER-VALUE-0001-VALUES
      - C-SLIDER-VALUE-0001-NUMERIC-CLOSURE
      - C-SLIDER-VALUE-0001-KEYBOARD
    expectation: independent-operational-number-helper-with-explicit-diagnostics
  - id: T-SLIDER-VALUES-RUNTIME-0001-CASE-OWNER
    title: Portable mode, raw ownership, initialization and recovery
    covers:
      - C-SLIDER-VALUE-0001-OWNER
      - C-SLIDER-VALUE-0001-CONTROLLED
      - P-BASE-SLIDER-VALUES-ROOT
    expectation: resolved-only-input-and-sole-current-list-owner
  - id: T-SLIDER-VALUES-RUNTIME-0001-CASE-PUBLICATION
    title: Synchronous veto, authoritative Props and logical commit
    covers:
      - C-SLIDER-VALUE-0001-BOUNDARY
      - C-SLIDER-VALUE-0001-SESSION
    expectation: no-causal-ack-or-rollback-and-no-stale-completion
  - id: T-SLIDER-VALUES-RUNTIME-0001-CASE-PARTS
    title: Indexed parts, projection, keyboard and retirement
    covers:
      - P-BASE-SLIDER-VALUES-ANATOMY
      - P-BASE-SLIDER-VALUES-THUMB
      - P-BASE-SLIDER-VALUES-PROJECTION
    expectation: live-current-owner-routing-and-strict-required-context
  - id: T-SLIDER-VALUES-RUNTIME-0001-CASE-COMPATIBILITY
    title: Actual scalar and union API types and generated facades
    covers:
      - P-BASE-SLIDER-VALUES-ROOT
    expectation: old-scalar-remains-narrow-and-new-static-entry-is-union
  - id: T-SLIDER-VALUES-RUNTIME-0001-CASE-MISSING
    title: Pointer, Field, families, native and Compiler remain separate
    covers:
      - P-BASE-SLIDER-VALUES-TRACK
      - P-BASE-SLIDER-VALUES-NO-ADMISSION
    expectation: no-full-slider-or-cross-host-admission

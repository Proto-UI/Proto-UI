id: T-SHADCN-BUTTON-0001
type: test
title: Shadcn Button delta protocol contract tests
status: draft
since: 0.2.0-rc.0
summary: Covers Shadcn Button's first-class reversible Base inheritance, current absence of Base-behavior reversals, direct entry, visual API, intentional asChild omission, and the centralized upstream compatibility boundary including pinned-baseline versus adopted-recipe evidence.
cases:
  - id: T-SHADCN-BUTTON-0001-CASE-IDENTITY-AND-INHERITANCE
    title: Shadcn Button is a direct unofficial projection that inherits Base Button
    covers:
      - P-SHADCN-BUTTON-UPSTREAM-IDENTITY
      - P-SHADCN-BUTTON-BASE-INHERITANCE
      - P-SHADCN-BUTTON-CURRENT-BASE-DEVIATIONS
      - P-SHADCN-BUTTON-DIRECT-ENTRY
    expectation: shadcn-button-direct-entry-inherits-as-button-protocol
  - id: T-SHADCN-BUTTON-0001-CASE-VARIANT-AND-SIZE
    title: current variant and size props project tokens and omission restores defaults
    covers:
      - P-SHADCN-BUTTON-VARIANT-PROP
      - P-SHADCN-BUTTON-SIZE-PROP
      - P-SHADCN-BUTTON-NEW-YORK-PAINT
      - P-SHADCN-BUTTON-WRAP-PROP
    expectation: shadcn-button-current-variant-size-and-removal-defaults
  - id: T-SHADCN-BUTTON-0001-CASE-CONSUMER-PAINT
    title: current New York consumer oracles reject stale geometry and missing installed styles
    covers:
      - P-SHADCN-BUTTON-NEW-YORK-PAINT
    expectation: shadcn-button-consumer-checks-current-tokens-and-installed-css-without-obsolete-marker
  - id: T-SHADCN-BUTTON-0001-CASE-INTERACTION-STYLES
    title: inherited Button facts drive hover focus press and disabled visual rules
    covers:
      - P-SHADCN-BUTTON-INTERACTION-STYLES
    expectation: shadcn-button-styles-derive-from-base-button-facts
  - id: T-SHADCN-BUTTON-0001-CASE-COLOR-SCHEME
    title: dark color-scheme meta affects outline, destructive and ghost visuals only
    covers:
      - P-SHADCN-BUTTON-COLOR-SCHEME-STYLES
    expectation: shadcn-button-dark-meta-projects-visual-deltas
  - id: T-SHADCN-BUTTON-0001-CASE-GHOST-NEW-YORK
    title: ghost hover follows fixed New York paint and clears on inherited state, meta and lifecycle transitions
    covers:
      - P-SHADCN-BUTTON-GHOST-NEW-YORK-PAINT
      - P-SHADCN-BUTTON-INTERACTION-STYLES
      - P-SHADCN-BUTTON-COLOR-SCHEME-STYLES
    expectation: shadcn-ghost-accent-hover-and-dark-half-opacity-follow-current-button-facts
  - id: T-SHADCN-BUTTON-0001-CASE-GHOST-CONSUMER
    title: real ghost source rules reach generated CSS and a live public Button consumer
    covers:
      - P-SHADCN-BUTTON-GHOST-NEW-YORK-PAINT
    expectation: shadcn-ghost-style-closure-is-source-derived-and-consumer-visible
  - id: T-SHADCN-BUTTON-0001-CASE-COMPATIBILITY-SUBSET
    title: pinned baseline, adopted recipe evidence, and undemonstrated render branches stay outside passing parity claims
    covers:
      - P-SHADCN-BUTTON-COMPATIBILITY-SUBSET
      - P-SHADCN-BUTTON-AS-CHILD-OMISSION
    expectation: shadcn-button-does-not-overclaim-upstream-parity
implementations:
  - id: prototypes-shadcn-button-contract
    kind: module-test
    status: passing
    path: packages/prototypes/shadcn/test/button.test.ts
    required: true
    consumesCases:
      - T-SHADCN-BUTTON-0001-CASE-IDENTITY-AND-INHERITANCE
      - T-SHADCN-BUTTON-0001-CASE-VARIANT-AND-SIZE
      - T-SHADCN-BUTTON-0001-CASE-INTERACTION-STYLES
      - T-SHADCN-BUTTON-0001-CASE-COLOR-SCHEME
      - T-SHADCN-BUTTON-0001-CASE-COMPATIBILITY-SUBSET
    exercises: [P-SHADCN-BUTTON, P-BASE-BUTTON]
    notes:
      - Positive tests cover only the current Proto UI guarantee; asChild omission is governed by D-AS-CHILD-OMISSION-0001. The pinned compatibility baseline and the later stable official source for the intentionally adopted destructive recipe remain distinct catalog evidence, so the recipe adoption does not widen the parity claim. Remaining upstream gaps stay bounded by declared prop enums, source review, and the single catalog-visible compatibility question.
  - id: prototypes-shadcn-button-consumer-style
    kind: module-test
    status: passing
    path: packages/prototypes/shadcn/test/button-consumer-style.test.ts
    required: true
    consumesCases:
      - T-SHADCN-BUTTON-0001-CASE-CONSUMER-PAINT
    exercises: [P-SHADCN-BUTTON, P-BASE-BUTTON]
    notes:
      - Source host plus generated CLI CSS in HappyDOM; not packed-artifact or native browser admission. The release helper tests reject obsolete tokens, class leakage, absent CSS and stale installed height/padding. Native website suites retain exact default/icon geometry and interaction assertions. See scripts/release/consumer-smoke/README.md for the consumer boundary.
  - id: prototypes-shadcn-button-ghost
    kind: module-test
    status: passing
    path: packages/prototypes/shadcn/test/button-ghost.test.ts
    required: true
    consumesCases: [T-SHADCN-BUTTON-0001-CASE-GHOST-NEW-YORK]
    exercises: [P-SHADCN-BUTTON, P-BASE-BUTTON]
    notes:
      - Real Runtime sessions with inherited Button state and controlled meta inputs; not physical pointer or cross-Adapter acceptance.
  - id: prototypes-shadcn-button-ghost-consumer
    kind: module-test
    status: passing
    path: packages/prototypes/shadcn/test/button-ghost-style.test.ts
    required: true
    consumesCases: [T-SHADCN-BUTTON-0001-CASE-GHOST-CONSUMER]
    exercises: [P-SHADCN-BUTTON, P-BASE-BUTTON]
    notes:
      - Actual source collection, generated preset equality, Document/Shadow/Shadow-split declaration closure and a real WC host in HappyDOM. Outer-layer unwrapping is explicit; native cascade, pixels, packed artifacts and cross-Adapter visual acceptance remain separate.
  - id: website-shadcn-button-ghost-native
    kind: adapter-test
    status: failing
    path: apps/www/src/content/docs/zh-cn/finf-button-ghost.browser.test.ts
    required: true
    consumesCases:
      [T-SHADCN-BUTTON-0001-CASE-GHOST-NEW-YORK, T-SHADCN-BUTTON-0001-CASE-GHOST-CONSUMER]
    exercises: [P-SHADCN-BUTTON, P-BASE-BUTTON]
    notes:
      - Eight real public-page cases use Header Adapter selection, actual mounted framework, OS theme projection, generated CSS and outward-signal readouts. Native hover/leave, enabled pointer/Enter/Space controls, disabled pointer rejection and keyboard entry exclusion are source-bound. A disabled host receives native keys only if an unmodified DOM focus attempt actually obtains focus. No passing native receipt has been established; screenshots alone do not establish full Button or host acceptance.
      - 'Official 794b5eb0be5f5d4b7ee1db46085b4949cb57d2ec artifact 11866842609 records eight failures at Header runtime selection with zero Button observations and zero screenshots. This is a documentation navigation prerequisite failure, not evidence of failing Ghost paint. The original suite, automatic workflow and required result remain preserved.'
  - id: website-shadcn-button-ghost-component-native
    kind: adapter-test
    status: planned
    path: apps/www/src/content/docs/zh-cn/finf-button-ghost-component.browser.test.ts
    required: true
    consumesCases:
      [T-SHADCN-BUTTON-0001-CASE-GHOST-NEW-YORK, T-SHADCN-BUTTON-0001-CASE-GHOST-CONSUMER]
    exercises: [P-SHADCN-BUTTON, P-BASE-BUTTON]
    notes:
      - Independent component-only native evidence imports the same public DemoSpec into four static runtime routes with official Adapters, ThemeProvider and generated production CSS. Eight cases and source-bound screenshots remain planned until official execution. Header navigation and RuntimePreviewSurface are excluded; this implementation never substitutes for the separate failed public-page journey or full Button acceptance.
verifies:
  prototypes:
    - id: P-SHADCN-BUTTON
      anchors:
        - P-SHADCN-BUTTON-UPSTREAM-IDENTITY
        - P-SHADCN-BUTTON-BASE-INHERITANCE
        - P-SHADCN-BUTTON-CURRENT-BASE-DEVIATIONS
        - P-SHADCN-BUTTON-VARIANT-PROP
        - P-SHADCN-BUTTON-SIZE-PROP
        - P-SHADCN-BUTTON-NEW-YORK-PAINT
        - P-SHADCN-BUTTON-GHOST-NEW-YORK-PAINT
        - P-SHADCN-BUTTON-WRAP-PROP
        - P-SHADCN-BUTTON-INTERACTION-STYLES
        - P-SHADCN-BUTTON-COLOR-SCHEME-STYLES
        - P-SHADCN-BUTTON-COMPATIBILITY-SUBSET
        - P-SHADCN-BUTTON-AS-CHILD-OMISSION
exercises:
  prototypes: [P-SHADCN-BUTTON, P-BASE-BUTTON]

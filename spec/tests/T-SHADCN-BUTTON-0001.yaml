  - version: 0.2.0-rc.0
    change: introduced
    summary: Added delta-style Shadcn Button coverage for reversible Base inheritance, current visual API, intentional asChild omission, environment styling, and centralized upstream compatibility differences.
  - version: 0.3.0-alpha.0
    change: revised
    summary: Updated compatibility evidence mapping to keep the historical pinned baseline distinct from later adopted recipe evidence.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added bounded source-host consumer paint coverage and mapped current New York geometry to packed and website test oracles without widening upstream parity claims.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added ghost theme/state/lifetime and source-derived consumer closure cases without claiming full upstream parity.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Registered planned public ghost native journeys and exact-candidate screenshots; no native or full-delivery pass is inferred from fixture authoring.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Registered planned independent component-native Ghost evidence while retaining the separate public Header journey and its failure signals.
tags: [prototype, shadcn, button, delta, compatibility, test]

id: T-ANCHORED-POSITIONING-0001
type: test
title: Anchored positioning contract and host integration tests
status: draft
since: 0.2.0-rc.0
summary: Covers host-mediated offsets, collision resolution, non-transform coordinate projection, Overlay lease lifetime, and Hover Card adapter integration.
cases:
  - id: T-ANCHORED-POSITIONING-0001-CASE-MODULE
    title: Module connection and host capability lifetime
    covers: ['M-POSITIONING-0001-A', 'M-POSITIONING-0001-B', 'M-POSITIONING-0001-C']
    expectation: retained-declaration-without-host-and-one-current-lease
  - id: T-ANCHORED-POSITIONING-0001-CASE-GENERATION
    title: Stale computations and disposed leases cannot publish or observe
    covers: ['HC-ANCHORED-POSITION-0001-B', 'C-ANCHORED-POSITIONING-0001-E']
    expectation: newer-calculation-wins-and-dispose-is-terminal
  - id: T-ANCHORED-POSITIONING-0001-CASE-ADAPTER
    title: Four Web Adapters project active Overlay geometry and stop after close/unmount
    covers:
      [
        'A-VUE-2-0001-POSITIONING',
        'A-WEB-COMPONENT-0001-POSITIONING',
        'A-REACT-18-19-0001-POSITIONING',
        'A-VUE-3-0001-POSITIONING',
      ]
    expectation: real-adapter-wiring-with-simulated-dom-geometry-and-observation-cleanup
  - id: T-ANCHORED-POSITIONING-0001-CASE-OFFSET
    title: Floating UI host applies placement, non-transform coordinates, and geometry variables
    covers:
      - C-ANCHORED-POSITIONING-0001-A
      - C-ANCHORED-POSITIONING-0001-B
      - C-ANCHORED-POSITIONING-0001-D
    expectation: host-applies-fixed-left-top-categorical-placement-and-anchor-size-variables
  - id: T-ANCHORED-POSITIONING-0001-CASE-COLLISION
    title: Floating UI host reports collision-resolved placement
    covers:
      - C-ANCHORED-POSITIONING-0001-C
    expectation: host-flips-and-shifts-against-viewport-root-boundary
  - id: T-ANCHORED-POSITIONING-0001-CASE-LIFETIME
    title: Overlay creates and disposes one positioning lease with active view lifetime
    covers:
      - C-ANCHORED-POSITIONING-0001-E
    expectation: anchored-host-lease-exists-only-for-live-overlay-view
  - id: T-ANCHORED-POSITIONING-0001-CASE-ANCHOR-TRANSLATION
    title: Host keeps rendered anchor geometry by default and excludes anchor translation only on explicit opt-in
    covers:
      - C-ANCHORED-POSITIONING-0001-G
    expectation: rendered-geometry-by-default-with-opt-in-translation-exclusion
  - id: T-ANCHORED-POSITIONING-0001-CASE-PORTAL
    title: Hover Card uses Portal separately from positioning and preserves its logical compound protocol
    covers:
      - C-ANCHORED-POSITIONING-0001-F
    expectation: portaled-hover-card-escapes-previewer-clipping-with-logical-owner-intact
implementations:
  - id: positioning-module-lifetime
    kind: module-test
    status: passing
    path: packages/modules/positioning/test/module-lifetime.test.ts
    required: true
    consumesCases: [T-ANCHORED-POSITIONING-0001-CASE-MODULE]
  - id: positioning-lease-generation
    kind: module-test
    status: passing
    path: packages/modules/positioning/test/lease-generation.test.ts
    required: true
    consumesCases: [T-ANCHORED-POSITIONING-0001-CASE-GENERATION]
  - id: react-positioning-catalog
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/positioning.integration.test.ts
    required: true
    consumesCases: [T-ANCHORED-POSITIONING-0001-CASE-ADAPTER]
  - id: vue-positioning-catalog
    kind: adapter-test
    status: passing

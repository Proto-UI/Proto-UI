    status: planned
    path: scripts/prototypes/shadcn-card-evidence.mjs
    required: true
    consumesCases:
      - T-SHADCN-CARD-0001-CASE-NATIVE
      - T-SHADCN-CARD-0001-CASE-SCOPE

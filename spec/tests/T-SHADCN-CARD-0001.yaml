id: T-SHADCN-CARD-0001
type: test
title: Shadcn Card passive source and harness evidence
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Owning-layer and synthetic Web harness coverage only; native browser visual and first-frame evidence remain pending, with no stable or complete Finf credit.
summary: Four-part exports, passive composition, finite New York/Rhea scope and density projection, and gallery inheritance.
cases:
  - id: T-SHADCN-CARD-0001-CASE-1
    title: Four public parts and facade aliases
    covers:
      - P-SHADCN-CARD-ANATOMY
    expectation: exact-four-part-exports
  - id: T-SHADCN-CARD-0001-CASE-2
    title: Passive slots retain native semantic children
    covers:
      - P-SHADCN-CARD-PASSIVE
      - P-SHADCN-CARD-CONTENT-VISUAL
    expectation: roleless-nonfocusable-native-anchor-composition
  - id: T-SHADCN-CARD-0001-CASE-3
    title: Source-bound token recipes and distinct card colors
    covers:
      - P-SHADCN-CARD-VISUAL
      - P-SHADCN-CARD-HEADER-VISUAL
      - P-SHADCN-CARD-CONTENT-VISUAL
      - P-SHADCN-CARD-FOOTER-VISUAL
    expectation: card-specific-token-projection
  - id: T-SHADCN-CARD-0001-CASE-4
    title: Gallery SSR uses actual Card with inherited title/body and explicit muted caption
    covers:
      - P-SHADCN-CARD-CONTENT
    expectation: nested-text-does-not-reset-card-foreground
  - id: T-SHADCN-CARD-0001-CASE-NATIVE
    title: Native alternate-theme paint and semantic composition
    covers:
      - P-SHADCN-CARD-VISUAL
      - P-SHADCN-CARD-PASSIVE
      - P-SHADCN-CARD-CONTENT
      - P-SHADCN-CARD-HEADER-VISUAL
    expectation: native-card-paint-distinct-from-page-and-inherited-text
  - id: T-SHADCN-CARD-0001-CASE-SCOPE
    title: Root family scope and density preserve native child identity
    covers:
      - P-SHADCN-CARD-SHARED-SCOPE
      - P-SHADCN-CARD-PASSIVE
      - P-SHADCN-CARD-VISUAL
    expectation: inherited-and-explicit-style-density-without-editor-reset
implementations:
  - id: shadcn-card-style-projection
    kind: module-test
    status: passing
    path: packages/prototypes/shadcn/test/card-style-projection.test.ts
    required: true
    consumesCases:
      - T-SHADCN-CARD-0001-CASE-SCOPE
    exercises:
      - P-SHADCN-CARD
      - P-SHADCN-CARD-HEADER
      - P-SHADCN-CARD-CONTENT
      - P-SHADCN-CARD-FOOTER
  - id: shadcn-card-style-native

      - T-SHADCN-CARD-0001-CASE-3
    exercises:
      - P-SHADCN-CARD
      - P-SHADCN-CARD-HEADER
      - P-SHADCN-CARD-CONTENT
      - P-SHADCN-CARD-FOOTER
  - id: shadcn-card-public-cli

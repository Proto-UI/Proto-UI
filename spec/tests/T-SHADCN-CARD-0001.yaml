    status: passing
    path: packages/prototypes/shadcn/test/card.test.ts
    required: true
    consumesCases:
      - T-SHADCN-CARD-0001-CASE-1
      - T-SHADCN-CARD-0001-CASE-2
      - T-SHADCN-CARD-0001-CASE-3
    exercises:

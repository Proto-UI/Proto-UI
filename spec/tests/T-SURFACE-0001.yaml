id: T-SURFACE-0001
type: test
title: Passive Surface Adapter and compiler consumption
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Source-bound real four-Adapter and Web compiler cases pass locally; exact-source browser review and independent admission remain pending.
summary: Verifies roleless content ownership and finite presentation inputs without a second interaction owner.
cases:
  - id: T-SURFACE-0001-CASE-PASSIVE
    title: Real framework and WC adapters preserve native ownership
    covers:
      [
        P-BASE-SURFACE-PASSIVE,
        P-BASE-SURFACE-INPUTS,
        P-SHADCN-SURFACE-PROJECTION,
        P-BRUTALIST-SURFACE-PROJECTION,
        P-BOOTSTRAP-2-3-2-SURFACE-PROJECTION,
        P-LIQUID-GLASS-SURFACE-PROJECTION,
      ]
    expectation: Native content remains and the passive child has no role, tabindex or activation channel across updates.
  - id: T-SURFACE-0001-CASE-COMPILER
    title: Public facades, private workspace exports and honest unsupported targets
    covers:
      [
        P-BASE-SURFACE-ENTRIES,
        P-SHADCN-SURFACE-ENTRIES,
        P-BRUTALIST-SURFACE-ENTRIES,
        P-BOOTSTRAP-2-3-2-SURFACE-ENTRIES,
        P-LIQUID-GLASS-SURFACE-ENTRIES,
      ]
    expectation: All declared tokens produce Web CSS, publishable entries generate each Web facade, private family source exports remain workspace-only and absent from public CLI choices, and unsupported target or token remains an explicit error or diagnostic.
  - id: T-SURFACE-0001-CASE-ACTION-APPEARANCE
    title: Passive public action appearance preserves native navigation ownership
    covers: [P-SHADCN-SURFACE-ACTION-APPEARANCE, P-BRUTALIST-SURFACE-ACTION-APPEARANCE]
    expectation: Public composition geometry matches the compiled default wrapped Button and supplies only passive Surface/Text props and layout. Native anchor identity and Space behavior remain native; action-label drag selection is suppressed without suppressing prose or editor selection. Ordinary navigation and Surface defaults are unchanged.
implementations:
  - id: public-action-appearance
    kind: module-test
    status: planned
    path: apps/www/src/components/site-action-appearance.test.ts
    required: true
    consumesCases: [T-SURFACE-0001-CASE-ACTION-APPEARANCE]
    exercises: [P-SHADCN-SURFACE, P-BRUTALIST-SURFACE]
  - id: surface-public-compiler
    kind: module-test
    status: passing
    path: packages/cli/test/surface-prototype.test.ts
    required: true
    consumesCases: [T-SURFACE-0001-CASE-COMPILER]
    exercises:
      [
        P-BASE-SURFACE,
        P-SHADCN-SURFACE,
        P-BRUTALIST-SURFACE,
        P-BOOTSTRAP-2-3-2-SURFACE,
        P-LIQUID-GLASS-SURFACE,
      ]
  - id: surface-real-adapters
    kind: adapter-test
    status: passing
    path: packages/web-conformance/test/surface.journey.test.ts
    required: true
    consumesCases: [T-SURFACE-0001-CASE-PASSIVE]
    exercises:
      [
        P-BASE-SURFACE,
        P-SHADCN-SURFACE,
        P-BRUTALIST-SURFACE,
        P-BOOTSTRAP-2-3-2-SURFACE,
        P-LIQUID-GLASS-SURFACE,
      ]
verifies:
  prototypes:
    [
      P-BASE-SURFACE,
      P-SHADCN-SURFACE,
      P-BRUTALIST-SURFACE,
      P-BOOTSTRAP-2-3-2-SURFACE,
      P-LIQUID-GLASS-SURFACE,
    ]
exercises:
  prototypes:
    [
      P-BASE-SURFACE,
      P-SHADCN-SURFACE,
      P-BRUTALIST-SURFACE,
      P-BOOTSTRAP-2-3-2-SURFACE,
      P-LIQUID-GLASS-SURFACE,
    ]
revisions:

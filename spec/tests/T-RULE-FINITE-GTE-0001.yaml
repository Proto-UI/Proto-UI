  - id: rule-finite-gte-runtime
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/rule.finite-gte.contract.test.ts
    required: true
    consumesCases: [T-RULE-FINITE-GTE-0001-CASE-RUNTIME]
  - id: rule-finite-gte-compiler-boundary
    kind: module-test
    status: passing
    path: packages/compiler/test/rule-gte-boundary.test.ts
    required: true
    consumesCases: [T-RULE-FINITE-GTE-0001-CASE-COMPILER]
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Red/green runtime gte tests plus explicit current compiler rejection boundary.
tags: [rule, comparison, numeric]

id: T-RULE-WHEN-0002
type: test
title: Rule when dependency dimension tests
status: draft
since: 0.1.0
summary: Matrix-backed tests for module-backed when dependency identities, read semantics, and re-evaluation triggers across props, state, and context.
cases:
  - id: T-RULE-WHEN-0002-CASE-PROPS-DEPS
    title: props when dependencies record serializable prop identity and re-evaluate on prop changes
    covers:
      - C-RULE-WHEN-0002-A
      - C-RULE-WHEN-0002-B
      - C-RULE-WHEN-0002-C
      - C-RULE-WHEN-0002-D
    expectation: props-when-dependency-dimension
  - id: T-RULE-WHEN-0002-CASE-STATE-DEPS
    title: state when dependencies observe owned, borrowed, and observed views without polling
    covers:
      - C-RULE-WHEN-0002-A
      - C-RULE-WHEN-0002-B
      - C-RULE-WHEN-0002-C
      - C-RULE-WHEN-0002-D
    expectation: state-when-dependency-dimension
  - id: T-RULE-WHEN-0002-CASE-CONTEXT-DEPS
    title: context when dependencies read the whole context value and use null when no provider is present
    covers:
      - C-RULE-WHEN-0002-A
      - C-RULE-WHEN-0002-B
      - C-RULE-WHEN-0002-C
      - C-RULE-WHEN-0002-D
    expectation: context-whole-value-when-dependency-dimension
  - id: T-RULE-WHEN-0002-CASE-META-DEFERRED
    title: host/environment meta inputs remain secondary and naming is not stable core
    covers:
      - C-RULE-WHEN-0002-E
    expectation: meta-input-not-core-stable
implementations:
  - id: rule-matrix-fixture
    kind: fixture
    status: active
    path: packages/runtime/test/contract/rule.matrix.fixture.ts
    required: true
    consumesCases:
      - T-RULE-WHEN-0002-CASE-PROPS-DEPS
      - T-RULE-WHEN-0002-CASE-STATE-DEPS
      - T-RULE-WHEN-0002-CASE-CONTEXT-DEPS
  - id: runtime-rule-matrix-when-contract
    kind: runtime-test
    status: planned
    path: packages/runtime/test/contract/rule.matrix.when.v0.contract.test.ts
    required: true
    consumesCases:
      - T-RULE-WHEN-0002-CASE-PROPS-DEPS
      - T-RULE-WHEN-0002-CASE-STATE-DEPS
      - T-RULE-WHEN-0002-CASE-CONTEXT-DEPS
    notes:
      - The runtime matrix contract is the executable side of the props, state, and context cases.
  - id: spec-meta-secondary-boundary
    kind: workspace-check
    status: planned
    path: packages/spec/graph/test/meta-secondary-boundary.test.ts
    required: true
    consumesCases:
      - T-RULE-WHEN-0002-CASE-META-DEFERRED
    notes:
      - Planned because no executable guard proves the deferred boundary; the decision record states it and nothing asserts it.
      - A workspace check rather than a runtime test, because `C-RULE-WHEN-0002-E` is a governance claim about `meta` staying secondary and out of stable Rule-core naming. `rule.meta.v0.contract.test.ts` already proves the runtime behaviour while `packages/core/src/handles.ts` still declares `WhenBuilder.meta`, so a runtime test could pass while the boundary it claims to cover went unchecked.

verifies:
  contracts:
    - id: C-RULE-WHEN-0002
      anchors:
        - C-RULE-WHEN-0002-A
        - C-RULE-WHEN-0002-B
        - C-RULE-WHEN-0002-C
        - C-RULE-WHEN-0002-D
        - C-RULE-WHEN-0002-E
exercises:
  decisions:
    - id: D-RULE-CONTEXT-PATH-0001
      role: diagnostic-policy
      coverageImpact: review-test-surface
      note: Required context when coverage is whole-value plus null fallback; static context path access remains deferred.
    - id: D-RULE-META-NAMING-0001
      role: diagnostic-policy
      coverageImpact: review-test-surface
      note: Host/environment meta inputs are not required by the core when dependency matrix.
revisions:
  - version: 0.3.0-alpha.0
    change: strengthened
    summary: Moved the deferred meta case to its own planned workspace check, because the criterion is a governance boundary rather than runtime behaviour.
  - version: 0.1.0
    change: introduced
    summary: Added Rule when dependency dimension test mapping and fixture ownership.
tags:
  - rule
  - when
  - deps
  - matrix
  - contract-test

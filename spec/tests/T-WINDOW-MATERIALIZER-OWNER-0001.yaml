    covers: [C-WINDOW-MATERIALIZER-OWNER-0001-EXCLUSIVE]
    expectation: only-one-current-host-acquires-a-logical-collection
  - id: T-WINDOW-MATERIALIZER-OWNER-0001-CASE-RETIRE
    title: Retired or failed hosts clean resources and cannot revoke replacements
    covers: [C-WINDOW-MATERIALIZER-OWNER-0001-RETIRE]
    expectation: retired-or-failed-hosts-clean-resources-and-cannot-revoke-replacements
  - id: T-WINDOW-MATERIALIZER-OWNER-0001-CASE-BOUNDARY
    title: Real public Root disposal revokes outward calls and removes physical views
    covers: [C-WINDOW-MATERIALIZER-OWNER-0001-BOUNDARY]
    expectation: real-public-root-disposal-revokes-outward-calls-and-removes-physical-views

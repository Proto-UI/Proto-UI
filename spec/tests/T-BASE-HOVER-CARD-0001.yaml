id: T-BASE-HOVER-CARD-0001
type: test
title: Base Hover Card Root and compound protocol tests
status: draft
since: 0.2.0-rc.0
summary: Covers Root ownership, controlled requests, delayed interaction, cancellation, context, anatomy, and authoring independence.
cases:
  - id: T-BASE-HOVER-CARD-0001-CASE-ROOT-OWNERSHIP
    title: Root owns Hover Card facts and compound context
    covers:
      - P-BASE-HOVER-CARD-ROLE-LINK-PREVIEW
      - P-BASE-HOVER-CARD-ROOT-OWNER
      - P-BASE-HOVER-CARD-PROPS
      - P-BASE-HOVER-CARD-OPEN-EXPOSE
      - P-BASE-HOVER-CARD-CONTEXT
      - P-BASE-HOVER-CARD-ANATOMY
    expectation: hover-card-root-owns-open-delay-and-shared-context
  - id: T-BASE-HOVER-CARD-0001-CASE-DELAYS
    title: Interaction intent honors explicit and default delays
    covers:
      - P-BASE-HOVER-CARD-DELAYS
      - P-BASE-HOVER-CARD-INTERACTION-INTENT
      - P-BASE-HOVER-CARD-OPEN-CHANGE
    expectation: hover-card-interaction-emits-after-configured-delay
  - id: T-BASE-HOVER-CARD-0001-CASE-DELAY-CANCELLATION
    title: Reverse intent cancels an unfinished delay task
    covers: [P-BASE-HOVER-CARD-DELAYS, P-BASE-HOVER-CARD-INTERACTION-INTENT]
    expectation: reverse-hover-card-intent-cancels-pending-delay
  - id: T-BASE-HOVER-CARD-0001-CASE-POINTER-CHURN
    title: Short pointer boundary churn never materializes delayed Content
    covers: [P-BASE-HOVER-CARD-DELAYS, P-BASE-HOVER-CARD-INTERACTION-INTENT]
    expectation: rapid-pointer-boundary-churn-never-materializes-hover-card-content
  - id: T-BASE-HOVER-CARD-0001-CASE-CONTROLLED
    title: Controlled requests retain the owner open fact
    covers: [P-BASE-HOVER-CARD-OPEN-CHANGE, P-BASE-HOVER-CARD-CONTROLLED-OWNER]
    expectation: controlled-hover-card-emits-request-without-mutating-owner-fact
  - id: T-BASE-HOVER-CARD-0001-CASE-METHODS
    title: Root methods enter the shared request channel
    covers: [P-BASE-HOVER-CARD-OPEN-EXPOSE, P-BASE-HOVER-CARD-OPEN-CHANGE]
    expectation: hover-card-root-methods-emit-open-change
  - id: T-BASE-HOVER-CARD-0001-CASE-AUTHORING-INDEPENDENCE
    title: Direct and authored entries share an independent Root protocol
    covers:
      - P-BASE-HOVER-CARD-AUTHORING-ENTRIES
      - P-BASE-HOVER-CARD-PROTOCOL-INDEPENDENCE
    expectation: hover-card-root-authoring-entries-share-independent-protocol
  - id: T-BASE-HOVER-CARD-0001-CASE-LIFECYCLE-OWNERSHIP
    title: View-generation withdrawal preserves owner, replacement, and request boundaries
    covers:
      [
        P-BASE-HOVER-CARD-INTERACTION-LIFETIME,
        P-BASE-HOVER-CARD-INTERACTION-RELEASE,
        P-BASE-HOVER-CARD-INTERACTION-OWNER-BINDING,
      ]
    expectation: With open=true controlled and closeDelay=20, remove the only hovered Content; after 20ms exactly one close request is emitted while owner open remains true.
  - id: T-BASE-HOVER-CARD-0001-CASE-STALE-CONTRIBUTION
    title: A new instance or retained generation replaces an old contribution
    covers: [P-BASE-HOVER-CARD-INTERACTION-OWNER-BINDING]
    expectation: Publish a new same-role ID after retiring an old instance or view generation; a later release of the old ID returns false, leaves the new hover true, and emits no close request. Rebuilding Root binds later releases only to the retired Root.
  - id: T-BASE-HOVER-CARD-0001-CASE-RELEASE-NOOP
    title: Invalid, duplicate and shutdown release cannot dispatch work
    covers: [P-BASE-HOVER-CARD-INTERACTION-RELEASE]
    expectation: For unknown role, non-positive, fractional, unsafe, stale or repeated IDs, release returns false and Context version, active delay and request counts remain unchanged; a previously borrowed callable still admitted after Root shutdown returns false without reading disposed Context; a revoked host surface retains its existing stale-handle failure and cannot revive Root.
  - id: T-BASE-HOVER-CARD-0001-CASE-FALSE-RETIREMENT
    title: Retiring a false source preserves the in-flight close deadline
    covers: [P-BASE-HOVER-CARD-INTERACTION-LIFETIME]
    expectation: With closeDelay=20 and open=true, pointerleave at t=0 schedules close; remove that already-false source at t=10. Root stays open at t=19 and requests closed at t=20, not t=30.
  - id: T-BASE-HOVER-CARD-0001-CASE-IDENTITY-EXHAUSTION
    title: Allocation never wraps or reuses an identity
    covers: [P-BASE-HOVER-CARD-INTERACTION-RELEASE]
    expectation: Initialize a deterministic allocator fixture at MAX_SAFE_INTEGER-1. Its first allocation is MAX_SAFE_INTEGER; every subsequent allocation fails explicitly before any contribution is published. Independently mounted same-role instances otherwise receive distinct IDs.

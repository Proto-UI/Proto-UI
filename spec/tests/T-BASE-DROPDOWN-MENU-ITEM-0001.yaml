id: T-BASE-DROPDOWN-MENU-ITEM-0001
type: test
title: Base Dropdown Menu Item protocol tests
status: draft
since: 0.2.0-rc.0
summary: Covers collection snapshots, menuitem semantics, active navigation, select signaling, commit-close policy, disabled behavior, and absence of persistent selection.
cases:
  - id: T-BASE-DROPDOWN-MENU-ITEM-0001-CASE-POINTER-FOCUS
    title: Admitted mouse movement transfers focus without selection or stale dual highlight
    covers:
      [
        P-BASE-DROPDOWN-MENU-ITEM-POINTER-FOCUS,
        P-BASE-DROPDOWN-MENU-ITEM-ACTIVE,
        P-BASE-DROPDOWN-MENU-ITEM-DISABLED,
      ]
    expectation: single-observed-focus-owner-with-mouse-admission-and-keyboard-disabled-boundaries
  - id: T-BASE-DROPDOWN-MENU-ITEM-0001-CASE-TRANSIENT-CLEANUP
    title: Cancellation and view withdrawal clear transient state while preserving semantic owner facts
    covers: [P-BASE-DROPDOWN-MENU-ITEM-TRANSIENT-CLEANUP]
    expectation: cancellation-and-unmount-clear-hovered-and-pressed-without-activation-or-semantic-state-change
  - id: T-BASE-DROPDOWN-MENU-ITEM-0001-CASE-COLLECTION-A11Y
    title: Item publishes ordered collection and accessible menu-action facts
    covers:
      [
        P-BASE-DROPDOWN-MENU-ITEM-AUTHORING-ENTRIES,
        P-BASE-DROPDOWN-MENU-ITEM-COLLECTION,
        P-BASE-DROPDOWN-MENU-ITEM-A11Y,
      ]
    expectation: dropdown-item-is-an-ordered-named-menu-action
  - id: T-BASE-DROPDOWN-MENU-ITEM-0001-CASE-ACTIVE-SELECT
    title: Focus and pointer update active while activation emits select and requests policy close
    covers: [P-BASE-DROPDOWN-MENU-ITEM-ACTIVE, P-BASE-DROPDOWN-MENU-ITEM-SELECT]
    expectation: dropdown-item-active-select-and-close-policy-share-root-context
  - id: T-BASE-DROPDOWN-MENU-ITEM-0001-CASE-DISABLED
    title: Disabled Item remains focusable but cannot activate or close
    covers: [P-BASE-DROPDOWN-MENU-ITEM-DISABLED]
    expectation: disabled-menu-item-can-receive-focus-without-selection-or-close
  - id: T-BASE-DROPDOWN-MENU-ITEM-0001-CASE-NO-SELECTION
    title: Closing clears active without creating selection state
    covers: [P-BASE-DROPDOWN-MENU-ITEM-NO-SELECTION]
    expectation: dropdown-item-value-and-active-never-project-selected-or-checked
implementations:
  - id: prototypes-base-dropdown-pointer-focus
    kind: module-test
    status: planned
    path: packages/prototypes/base/test/dropdown-pointer-focus.test.ts
    required: true
    consumesCases: [T-BASE-DROPDOWN-MENU-ITEM-0001-CASE-POINTER-FOCUS]
    exercises: [P-BASE-DROPDOWN-MENU-ITEM]
    notes:
      - Source Runtime and WC router with synthetic host input; execution and native browser paint remain separately bound evidence.
  - id: prototypes-base-dropdown-menu-item-transient-cleanup
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/command-cancel-lifetime.test.ts
    required: true
    consumesCases: [T-BASE-DROPDOWN-MENU-ITEM-0001-CASE-TRANSIENT-CLEANUP]
    exercises: [P-BASE-DROPDOWN-MENU-ITEM]
    notes:
      - Real Runtime sessions cover controlled/uncontrolled owner facts, press.cancel, pointer.cancel, native-source blur through the existing Web router, and unmount/remount without prior cancellation.
      - Happy DOM synthetic native-event-source tests are not browser, visual, assistive-technology, or stable-admission evidence.
  - id: prototypes-base-dropdown-item-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/dropdown.test.ts
    required: true
    consumesCases:
      [
        T-BASE-DROPDOWN-MENU-ITEM-0001-CASE-COLLECTION-A11Y,
        T-BASE-DROPDOWN-MENU-ITEM-0001-CASE-ACTIVE-SELECT,
        T-BASE-DROPDOWN-MENU-ITEM-0001-CASE-DISABLED,
        T-BASE-DROPDOWN-MENU-ITEM-0001-CASE-NO-SELECTION,
      ]
    exercises: [P-BASE-DROPDOWN-MENU-ITEM]
verifies:
  prototypes:
    - id: P-BASE-DROPDOWN-MENU-ITEM
      anchors:
        [
          P-BASE-DROPDOWN-MENU-ITEM-POINTER-FOCUS,
          P-BASE-DROPDOWN-MENU-ITEM-COLLECTION,
          P-BASE-DROPDOWN-MENU-ITEM-A11Y,
          P-BASE-DROPDOWN-MENU-ITEM-SELECT,
          P-BASE-DROPDOWN-MENU-ITEM-DISABLED,
          P-BASE-DROPDOWN-MENU-ITEM-NO-SELECTION,
        ]
exercises: { prototypes: [P-BASE-DROPDOWN-MENU-ITEM] }
revisions:
  - version: 0.2.0-rc.0
    change: introduced
    summary: Added Item collection, a11y, active, select, close, disabled, and no-selection coverage.
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Map cancellation and uncancelled view-withdrawal regression evidence for Base transient cleanup.
tags: [prototype, base, dropdown-menu, item, a11y, test]

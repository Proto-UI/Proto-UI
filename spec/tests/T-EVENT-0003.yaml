id: T-EVENT-0003
type: test
title: Event Module boundary and official Adapter binding conformance
status: draft
since: 0.2.0-rc.7
summary: Module, runtime, Adapter-base, official Adapter, and profile-schema evidence verifies the Event facade/port boundary, conditional and target-preflighted scoped binding, translation ownership, cleanup, default-action projection, and Expose Event separation.
cases:
  - id: T-EVENT-0003-CASE-FACADE-PORT-SPLIT
    title: Event author facade and privileged port expose distinct surfaces
    covers:
      - M-EVENT-0001-A
      - M-EVENT-0001-B
      - M-EVENT-0001-C
    expectation: author-event-surface-excludes-binding-target-and-internal-dispatch-control
  - id: T-EVENT-0003-CASE-REQUIRED-CONDITIONAL-BINDING
    title: Standard Runtime installs Event while unused registration scopes require no host binding
    covers:
      - M-EVENT-0001-D
      - HC-EVENT-BINDING-0001-D
    expectation: installed-event-module-binds-only-scopes-with-registrations
  - id: T-EVENT-0003-CASE-SCOPED-TRANSLATION
    title: Official Adapters translate host input into root and global Event streams
    covers:
      - M-EVENT-0001-E
      - HC-EVENT-BINDING-0001-A
      - HC-EVENT-BINDING-0001-B
      - HC-EVENT-BINDING-0001-C
      - A-REACT-18-19-0001-E
      - A-REACT-18-19-0001-F
      - A-VUE-3-0001-E
      - A-VUE-3-0001-F
      - A-WEB-COMPONENT-0001-E
      - A-WEB-COMPONENT-0001-F
    expectation: adapter-owned-event-routing-delivers-declared-types-to-the-owning-scope
  - id: T-EVENT-0003-CASE-REBIND-CLEANUP
    title: Binding replacement and terminal disposal release prior host resources
    covers:
      - M-EVENT-0001-F
      - HC-EVENT-BINDING-0001-E
      - HC-EVENT-BINDING-0001-F
    expectation: old-event-binding-cannot-dispatch-after-replacement-or-disposal
  - id: T-EVENT-0003-CASE-BIND-TARGET-PREFLIGHT
    title: Failed target preflight adds no listener and permits explicit retry
    covers:
      - M-EVENT-0001-I
    expectation: target-resolution-failure-adds-no-listener-and-explicit-retry-binds-complete-plan
  - id: T-EVENT-0003-CASE-DEFAULT-ACTION-REQUEST
    title: Event port projects a host-independent request through a separate capability
    covers:
      - M-EVENT-0001-G
      - HC-DEFAULT-ACTION-0001-A
    expectation: default-action-request-is-host-mediated
  - id: T-EVENT-0003-CASE-DEFAULT-ACTION-WEB
    title: Official Web Adapters project default-action cancellation to preventDefault
    covers:
      - HC-DEFAULT-ACTION-0001-B
      - A-REACT-18-19-0001-E
      - A-VUE-3-0001-E
      - A-WEB-COMPONENT-0001-E
    expectation: cancelable-dom-event-receives-prevent-default
  - id: T-EVENT-0003-CASE-TRANSACTIONAL-ROLLBACK
    title: Failed attachment rolls back prior listeners, keeps registrations unbound, and retries the full plan
    covers:
      - M-EVENT-0001-J
    expectation: attachment-failure-rolls-back-and-keeps-diagnostics-unbound-then-retries-complete
  - id: T-EVENT-0003-CASE-PORTABLE-PAYLOAD
    title: Portable callbacks receive an immutable data-only view whose control is window-bounded and deduplicated
    covers:
      - M-EVENT-0001-J
    expectation: immutable-data-only-payload-with-synchronous-window-bounded-and-deduplicated-default-action-control
  - id: T-EVENT-0003-CASE-HOST-OPTIONS-BOUNDARY
    title: Semantic registrations reject DOM listener options while host extensions stay raw host events
    covers:
      - M-EVENT-0001-J
    expectation: semantic-registration-rejects-options-and-portable-payload-awaits-host-extensions
  - id: T-EVENT-0003-CASE-EXPOSE-BOUNDARY
    title: Expose Event implementation and wiring remain outside the Event Module
    covers:
      - M-EVENT-0001-H
    expectation: event-facade-and-wiring-exclude-the-standalone-expose-event-bridge
implementations:
  - id: module-event-boundary-types
    kind: workspace-check
    status: passing
    path: packages/modules/event/src/types.ts
    required: true
    consumesCases:
      - T-EVENT-0003-CASE-FACADE-PORT-SPLIT
      - T-EVENT-0003-CASE-EXPOSE-BOUNDARY
  - id: module-event-binding-contract
    kind: module-test
    status: passing
    path: packages/modules/event/test/contract/event-module.v0.contract.test.ts
    required: true
    consumesCases:
      - T-EVENT-0003-CASE-FACADE-PORT-SPLIT
      - T-EVENT-0003-CASE-REQUIRED-CONDITIONAL-BINDING
      - T-EVENT-0003-CASE-REBIND-CLEANUP
      - T-EVENT-0003-CASE-BIND-TARGET-PREFLIGHT
      - T-EVENT-0003-CASE-DEFAULT-ACTION-REQUEST
  - id: module-event-impl-spec-contract
    kind: module-test
    status: passing
    path: packages/modules/event/test/impl-spec.test.ts
    required: true
    consumesCases:
      - T-EVENT-0003-CASE-EXPOSE-BOUNDARY
      - T-EVENT-0003-CASE-TRANSACTIONAL-ROLLBACK
      - T-EVENT-0003-CASE-PORTABLE-PAYLOAD
      - T-EVENT-0003-CASE-HOST-OPTIONS-BOUNDARY
  - id: runtime-required-event-module
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/event-no-registrations.v0.contract.test.ts
    required: true
    consumesCases:
      - T-EVENT-0003-CASE-REQUIRED-CONDITIONAL-BINDING
  - id: adapter-base-event-target-requirements
    kind: adapter-test
    status: passing
    path: packages/adapters/base/test/contract/event-target-requirements.v0.contract.test.ts
    required: true
    consumesCases:
      - T-EVENT-0003-CASE-REQUIRED-CONDITIONAL-BINDING
      - T-EVENT-0003-CASE-SCOPED-TRANSLATION
  - id: adapter-react-event-binding
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/event-routing.test.ts
    required: true
    notes:
      - Supporting native delivery and post-unmount cleanup coverage is in packages/adapters/react/test/event.test.ts.
    consumesCases:
      - T-EVENT-0003-CASE-SCOPED-TRANSLATION
      - T-EVENT-0003-CASE-REBIND-CLEANUP
  - id: adapter-vue-event-binding
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/event-routing.test.ts
    required: true
    notes:
      - Supporting commit-gate and post-unmount cleanup coverage is in packages/adapters/vue/test/event.test.ts.
    consumesCases:
      - T-EVENT-0003-CASE-SCOPED-TRANSLATION
      - T-EVENT-0003-CASE-REBIND-CLEANUP
  - id: adapter-web-component-event-binding
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/contract/event.router.mapping.v0.contract.test.ts
    required: true
    notes:
      - Dispose, precise removal, host-bound, dual-path, and ownership behavior have parallel focused router contract tests.
    consumesCases:
      - T-EVENT-0003-CASE-SCOPED-TRANSLATION
      - T-EVENT-0003-CASE-REBIND-CLEANUP
  - id: adapter-profile-event-slice-schema
    kind: workspace-check
    status: passing
    path: packages/spec/fixtures/test/adapter-profile-schema.test.ts
    required: true
    consumesCases:
      - T-EVENT-0003-CASE-SCOPED-TRANSLATION
  - id: adapter-official-web-default-action-projection
    kind: adapter-test
    status: passing
    path: packages/adapters/base/test/contract/event-default-action.v0.contract.test.ts
    required: true
    notes:
      - React, Vue, and Web Component profiles inject the tested Adapter Base projection as their Event default-action capability.
    consumesCases:
      - T-EVENT-0003-CASE-DEFAULT-ACTION-WEB

id: T-HOST-SURFACE-PROJECTION-0001
type: test
title: Host boundary and presentation surface projection tests
status: draft
since: 0.2.0-rc.7
summary: Covers collapsed and split boundary/surface mappings, owned visual projection migration, Web Component Text Control surface targeting, and cross-adapter preview surface parity.
cases:
  - id: T-HOST-SURFACE-PROJECTION-0001-CASE-DEFAULT
    title: Ordinary host projection collapses boundary and presentation roles onto one target
    covers:
      - C-HOST-SURFACE-PROJECTION-0001-A
      - C-HOST-SURFACE-PROJECTION-0001-B
    expectation: default-host-surface-is-the-logical-boundary-target
  - id: T-HOST-SURFACE-PROJECTION-0001-CASE-SPLIT-TEXT-CONTROL
    title: Web Component Text Control retains its custom-element boundary while styling the inner textarea surface
    covers:
      - C-HOST-SURFACE-PROJECTION-0001-B
      - C-HOST-SURFACE-PROJECTION-0001-C
      - C-HOST-SURFACE-PROJECTION-0001-D
    expectation: wc-text-control-boundary-metadata-stays-on-wrapper-and-surface-style-reaches-textarea
  - id: T-HOST-SURFACE-PROJECTION-0001-CASE-REPLACEMENT
    title: Replacing a presentation target migrates only adapter-owned surface projection
    covers:
      - C-HOST-SURFACE-PROJECTION-0001-E
    expectation: owned-surface-projection-is-revoked-and-replayed-across-target-replacement
  - id: T-HOST-SURFACE-PROJECTION-0001-CASE-NORMALIZED-CHANNEL
    title: Previewer surface classes reach the physical visual target across Web Component React and Vue
    covers:
      - C-HOST-SURFACE-PROJECTION-0001-C
      - C-HOST-SURFACE-PROJECTION-0001-F
    expectation: normalized-preview-surface-class-does-not-style-a-wc-infrastructure-wrapper
  - id: T-HOST-SURFACE-PROJECTION-0001-CASE-STATE-SELECTOR-CONTEXT
    title: Stateful feedback selectors evaluate on a split Web Component presentation surface
    covers:
      - C-HOST-SURFACE-PROJECTION-0001-C
      - C-HOST-SURFACE-PROJECTION-0001-G
    expectation: canonical-state-remains-on-boundary-while-surface-receives-selector-context
implementations:
  - id: adapter-base-host-surface-projection
    kind: adapter-test
    status: passing
    path: packages/adapters/base/test/host-surface-projection.test.ts
    required: true

id: T-BASE-SELECT-TRIGGER-0001
type: test
title: Base Select Trigger protocol tests
status: draft
since: 0.2.0-rc.0
summary: Covers independent command state, combobox relationships, pointer and keyboard entry, disabled gating, and absence of selection ownership.
cases:
  - id: T-BASE-SELECT-TRIGGER-0001-CASE-AUTHOR-NAME
    title: Stable author name remains independent of selected content and Field naming
    covers: [P-BASE-SELECT-TRIGGER-AUTHOR-NAME]
    expectation: author-label-updates-and-clears-without-selection-mutation-and-resolved-field-label-retains-priority
  - id: T-BASE-SELECT-TRIGGER-0001-CASE-TRANSIENT-CLEANUP
    title: Cancellation and view withdrawal clear transient state while preserving semantic owner facts
    covers: [P-BASE-SELECT-TRIGGER-TRANSIENT-CLEANUP]
    expectation: cancellation-and-unmount-clear-hovered-and-pressed-without-activation-or-semantic-state-change
  - id: T-BASE-SELECT-TRIGGER-0001-CASE-COLD-TAB
    title: Trigger owns early cold Tab with exactly one controlled close request
    covers: [P-BASE-SELECT-TRIGGER-COLD-TAB]
    expectation: trigger-tab-does-not-wait-for-content-mount-or-prevent-default
  - id: T-BASE-SELECT-TRIGGER-0001-CASE-COMMAND-A11Y
    title: Trigger is an independent accessible select-only combobox command
    covers:
      [
        P-BASE-SELECT-TRIGGER-AUTHORING-ENTRIES,
        P-BASE-SELECT-TRIGGER-COMMAND,
        P-BASE-SELECT-TRIGGER-A11Y,
      ]
    expectation: select-trigger-projects-combobox-listbox-relations-without-base-button
  - id: T-BASE-SELECT-TRIGGER-0001-CASE-KEYBOARD
    title: Pointer and keyboard paths request open and selected-or-boundary entry once
    covers: [P-BASE-SELECT-TRIGGER-REQUEST, P-BASE-SELECT-TRIGGER-NO-SELECTION]
    expectation: select-trigger-pointer-enter-space-down-up-preserve-value
  - id: T-BASE-SELECT-TRIGGER-0001-CASE-DISABLED
    title: Local and Root disabled suppress focus and all open requests
    covers: [P-BASE-SELECT-TRIGGER-DISABLED]
    expectation: disabled-select-trigger-never-opens-or-focuses
implementations:
  - id: prototypes-base-select-trigger-author-name
    kind: module-test
    status: planned
    path: packages/prototypes/base/test/select.test.ts
    required: true
    consumesCases: [T-BASE-SELECT-TRIGGER-0001-CASE-AUTHOR-NAME]
    exercises: [P-BASE-SELECT-TRIGGER]
    notes:
      - Candidate authored but unexecuted. Existing exact-038 browser evidence demonstrates absent author names; new browser acceptance remains required, not inferred from DOM attributes.
  - id: prototypes-base-select-trigger-field-author-name
    kind: module-test
    status: planned
    path: packages/prototypes/base/test/field-select-trigger.test.ts
    required: true
    consumesCases: [T-BASE-SELECT-TRIGGER-0001-CASE-AUTHOR-NAME]
    exercises: [P-BASE-SELECT-TRIGGER]
  - id: prototypes-base-select-trigger-transient-cleanup
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/command-cancel-lifetime.test.ts
    required: true
    consumesCases: [T-BASE-SELECT-TRIGGER-0001-CASE-TRANSIENT-CLEANUP]
    exercises: [P-BASE-SELECT-TRIGGER]
    notes:
      - Real Runtime sessions cover controlled/uncontrolled owner facts, press.cancel, pointer.cancel, native-source blur through the existing Web router, and unmount/remount without prior cancellation.
      - Happy DOM synthetic native-event-source tests are not browser, visual, assistive-technology, or stable-admission evidence.
  - id: shadcn-select-trigger-cold-tab
    kind: module-test
    status: passing
    path: packages/prototypes/shadcn/test/select-alignment-owner.test.ts
    required: true
    consumesCases: [T-BASE-SELECT-TRIGGER-0001-CASE-COLD-TAB]
    exercises: [P-BASE-SELECT-TRIGGER]
  - id: prototypes-base-select-trigger-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/select.test.ts
    required: true
    consumesCases:
      [
        T-BASE-SELECT-TRIGGER-0001-CASE-COMMAND-A11Y,
        T-BASE-SELECT-TRIGGER-0001-CASE-KEYBOARD,
        T-BASE-SELECT-TRIGGER-0001-CASE-DISABLED,
      ]
    exercises: [P-BASE-SELECT-TRIGGER]
verifies:
  prototypes:
    - id: P-BASE-SELECT-TRIGGER
      anchors:
        [
          P-BASE-SELECT-TRIGGER-COMMAND,
          P-BASE-SELECT-TRIGGER-A11Y,
          P-BASE-SELECT-TRIGGER-REQUEST,
          P-BASE-SELECT-TRIGGER-DISABLED,
        ]
exercises: { prototypes: [P-BASE-SELECT-TRIGGER] }
revisions:
  - version: 0.2.0-rc.0
    change: introduced
    summary: Added Trigger command, combobox a11y, keyboard, disabled, and selection-boundary coverage.
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Map cancellation and uncancelled view-withdrawal regression evidence for Base transient cleanup.
tags: [prototype, base, select, trigger, keyboard, a11y, test]

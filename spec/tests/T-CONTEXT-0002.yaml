id: T-CONTEXT-0002
type: test
title: Context subscription, read, update, and lifecycle tests
status: draft
since: 0.1.0
summary: Module, runtime, and adapter tests for required and optional context subscription intent, read surfaces, runtime update APIs, callback delivery, render-read access, rebinding, and cleanup.
cases:
  - id: T-CONTEXT-0002-CASE-REQUIRED-SUBSCRIBE
    title: Required subscribe declares a required context dependency and gates required reads
    covers:
      - C-CONTEXT-0006-A
      - C-CONTEXT-0006-C
      - C-CONTEXT-0006-D
      - C-CONTEXT-0007-A
      - C-CONTEXT-0007-B
      - C-CONTEXT-0007-C
    expectation: required-subscription-intent
  - id: T-CONTEXT-0002-CASE-OPTIONAL-SUBSCRIBE
    title: Optional trySubscribe allows autonomous operation and gates optional reads
    covers:
      - C-CONTEXT-0006-B
      - C-CONTEXT-0006-E
      - C-CONTEXT-0007-D
      - C-CONTEXT-0007-E
    expectation: optional-subscription-intent
  - id: T-CONTEXT-0002-CASE-RUNTIME-UPDATE
    title: Runtime update and tryUpdate explicitly name the ContextKey and follow subscription intent
    covers:
      - C-CONTEXT-0008-A
      - C-CONTEXT-0008-B
      - C-CONTEXT-0008-C
      - C-CONTEXT-0008-D
      - C-CONTEXT-0008-E
    expectation: explicit-runtime-update
  - id: T-CONTEXT-0002-CASE-CALLBACK-DELIVERY
    title: Context callbacks observe semantic updates with next and previous values
    covers:
      - C-CONTEXT-0010-A
      - C-CONTEXT-0010-B
      - C-CONTEXT-0010-C
      - C-CONTEXT-0010-D
      - C-CONTEXT-0010-E
    expectation: deterministic-callback-delivery
  - id: T-CONTEXT-0002-CASE-RENDER-READ
    title: Render read exposes context read and tryRead without context write APIs
    covers:
      - C-CONTEXT-0007-A
      - C-CONTEXT-0007-D
      - C-CONTEXT-0007-E
    expectation: render-read-context-surface
  - id: T-CONTEXT-0002-CASE-RECONNECT-CLEANUP
    title: Context reads and updates resolve current scope availability after rebinding or cleanup
    covers:
      - C-CONTEXT-0011-A
      - C-CONTEXT-0011-B
      - C-CONTEXT-0011-C
      - C-CONTEXT-0011-D
      - C-CONTEXT-0011-E
      - C-CONTEXT-0012-A
      - C-CONTEXT-0012-B
      - C-CONTEXT-0012-C
      - C-CONTEXT-0012-D
      - C-CONTEXT-0012-E
    expectation: scope-rebind-and-cleanup
implementations:
  - id: context-runtime-surface-fixture
    kind: fixture
    status: active
    path: packages/spec/fixtures/src/context/runtime-surface.ts
    required: true
    consumesCases:
      - T-CONTEXT-0002-CASE-REQUIRED-SUBSCRIBE
      - T-CONTEXT-0002-CASE-OPTIONAL-SUBSCRIBE
      - T-CONTEXT-0002-CASE-RUNTIME-UPDATE
      - T-CONTEXT-0002-CASE-CALLBACK-DELIVERY
      - T-CONTEXT-0002-CASE-RENDER-READ
      - T-CONTEXT-0002-CASE-RECONNECT-CLEANUP
  - id: module-context-with-tree-contract
    kind: module-test
    status: passing
    path: packages/modules/context/test/contract/context.with-tree.v0.contract.test.ts
    required: true
    consumesCases:
      - T-CONTEXT-0002-CASE-REQUIRED-SUBSCRIBE
      - T-CONTEXT-0002-CASE-OPTIONAL-SUBSCRIBE
      - T-CONTEXT-0002-CASE-RUNTIME-UPDATE
      - T-CONTEXT-0002-CASE-CALLBACK-DELIVERY
      - T-CONTEXT-0002-CASE-RECONNECT-CLEANUP
  - id: runtime-prototype-render-syntax-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/prototype.render-syntax.v0.contract.test.ts
    required: true
    consumesCases:
      - T-CONTEXT-0002-CASE-RENDER-READ
  - id: adapter-web-component-context-basic-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/contract/context.basic.v0.contract.test.ts
    required: true
    consumesCases:
      - T-CONTEXT-0002-CASE-RUNTIME-UPDATE
      - T-CONTEXT-0002-CASE-CALLBACK-DELIVERY
  - id: adapter-web-component-context-state-sync-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/contract/context.state-sync.v0.contract.test.ts
    required: true
    consumesCases:
      - T-CONTEXT-0002-CASE-CALLBACK-DELIVERY
  - id: context-runtime-instance-lifetime
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/context-lifecycle.v1.contract.test.ts
    required: true
    consumesCases:
      - T-CONTEXT-0002-CASE-RUNTIME-UPDATE
      - T-CONTEXT-0002-CASE-CALLBACK-DELIVERY
      - T-CONTEXT-0002-CASE-RECONNECT-CLEANUP
    notes:
      - Proves provider self-update without subscription and repeatable-view preservation versus terminal cleanup; diagnostics remain covered by module tests.

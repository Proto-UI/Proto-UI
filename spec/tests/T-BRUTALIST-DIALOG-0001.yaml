      - P-BRUTALIST-DIALOG-BASE-INHERITANCE
      - P-BRUTALIST-DIALOG-VISUAL-GRAMMAR
    expectation: p-brutalist-dialog-root-entry-container
  - id: T-BRUTALIST-DIALOG-0001-CASE-2

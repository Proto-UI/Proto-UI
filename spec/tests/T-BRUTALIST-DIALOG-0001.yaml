id: T-BRUTALIST-DIALOG-0001
type: test
title: Brutalist Dialog visual contract and public API tests
status: draft
since: 0.2.0-rc.7
summary: >-
  Covers the Brutalist Dialog public API (trigger sky pair, mask fade, content fade-zoom panel, close-icon canary pair + a11y Close name, header/footer anatomy) against P-BRUTALIST-DIALOG criteria.



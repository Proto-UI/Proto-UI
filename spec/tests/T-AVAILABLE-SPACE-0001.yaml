id: T-AVAILABLE-SPACE-0001
type: test
title: Available-space lease and Dialog geometry controls
status: draft
lifecycleRationale: Bounded logical-space lease with Web controls; native viewport, physical occlusion and GPUI realization remain separately evidenced obligations.
since: 0.3.0-alpha.1
summary: Paired host lifecycle controls, four real Web Adapter wiring tests, compiler lowering and pending native Dialog geometry evidence.
cases:
  - id: T-AVAILABLE-SPACE-0001-CASE-HOST
    title: Lease ownership and unknown geometry
    covers:
      [
        HC-AVAILABLE-SPACE-0001-REGION,
        HC-AVAILABLE-SPACE-0001-OWNERSHIP,
        HC-AVAILABLE-SPACE-0001-OBSERVATION,
        M-POSITIONING-0001-AVAILABLE,
      ]
    expectation: current-target-only-projection-and-terminal-cleanup
  - id: T-AVAILABLE-SPACE-0001-CASE-ADAPTER
    title: Four Web adapters bind and release available geometry
    covers:
      [
        A-REACT-18-19-0001-AVAILABLE,
        A-VUE-3-0001-AVAILABLE,
        A-VUE-2-0001-AVAILABLE,
        A-WEB-COMPONENT-0001-AVAILABLE,
      ]
    expectation: active-content-only-lease
  - id: T-AVAILABLE-SPACE-0001-CASE-DIALOG
    title: Native centered Dialog remains bounded and scrollable
    covers:
      [
        P-BASE-DIALOG-CONTENT-AVAILABLE,
        P-SHADCN-DIALOG-CONTENT-AVAILABLE,
        P-BRUTALIST-DIALOG-CONTENT-AVAILABLE,
      ]
    expectation: live-region-insets-long-content-and-full-window-mask
implementations:
  - id: available-space-host-controls
    kind: module-test
    status: passing
    path: packages/modules/positioning/test/available-space.test.ts
    required: true
    consumesCases: [T-AVAILABLE-SPACE-0001-CASE-HOST]
  - id: react-available-space-wiring
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/positioning.integration.test.ts
    required: true
    consumesCases: [T-AVAILABLE-SPACE-0001-CASE-ADAPTER]
  - id: vue-available-space-wiring
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/positioning.integration.test.ts
    required: true
    consumesCases: [T-AVAILABLE-SPACE-0001-CASE-ADAPTER]
  - id: vue2-available-space-wiring
    kind: adapter-test
    status: passing
    path: packages/adapters/vue2/test/positioning.integration.test.ts
    required: true
    consumesCases: [T-AVAILABLE-SPACE-0001-CASE-ADAPTER]
  - id: web-component-available-space-wiring
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/positioning.integration.test.ts
    required: true
    consumesCases: [T-AVAILABLE-SPACE-0001-CASE-ADAPTER]
  - id: native-dialog-available-space
    kind: runtime-test
    status: planned
    path: apps/www/src/content/docs/zh-cn/dialog-available-space.browser.test.ts
    required: true
    exercises: [P-BASE-DIALOG-CONTENT, P-SHADCN-DIALOG-CONTENT, P-BRUTALIST-DIALOG-CONTENT]
    notes:
      - Base Dialog Content is exercised through both real styled projections and their inherited available-space behavior; this fixture does not open a separate bare Base demo or certify all native visual contexts.
    consumesCases: [T-AVAILABLE-SPACE-0001-CASE-DIALOG]
exercises:
  prototypes: [P-BASE-DIALOG-CONTENT, P-SHADCN-DIALOG-CONTENT, P-BRUTALIST-DIALOG-CONTENT]
  modules: [M-POSITIONING-0001]
  hostCaps: [HC-AVAILABLE-SPACE-0001]
  adapters: [A-REACT-18-19-0001, A-VUE-3-0001, A-VUE-2-0001, A-WEB-COMPONENT-0001]
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added controls without promoting the draft contracts or claiming physical device evidence.
tags: [test, positioning, dialog, available-space]

    title: Exact syntax filters and missing support remain distinguishable
    covers:
      [
        C-RULE-STYLE-SUPPORT-0001-B,
        HC-STYLE-SUPPORT-INVALIDATION-0001-A,
        HC-STYLE-SUPPORT-INVALIDATION-0001-B,
      ]
    expectation: explicit-true-false-unknown-with-exact-lowering-syntax
  - id: T-RULE-STYLE-SUPPORT-0001-CASE-LIFETIME
    title: Getter pairing and source loss control the actual Rule contribution
    covers: [C-RULE-STYLE-SUPPORT-0001-A, C-RULE-STYLE-SUPPORT-0001-C]
    expectation: active-lease-only-source-loss-unknown-and-no-late-callback
implementations:
  - id: source
    kind: adapter-test
    status: passing
    path: packages/adapters/base/test/web-style-support-source.test.ts
    required: true
    consumesCases: [T-RULE-STYLE-SUPPORT-0001-CASE-SOURCE]
  - id: lifetime
    kind: runtime-test
    status: passing

    required: true
    consumesCases: [T-RULE-STYLE-SUPPORT-0001-CASE-LIFETIME]
verifies:
  contracts: [C-RULE-STYLE-SUPPORT-0001]
  hostCaps: [HC-STYLE-SUPPORT-INVALIDATION-0001]

id: T-RULE-STYLE-SUPPORT-0001
type: test
title: Finite style support pairing and syntax filter evidence
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: Unit and runtime tests cover finite facts and lifetime. Actual material consumer paint and independent admission are additional requirements, not inferred from these tests.
summary: Controlled finite-source and real Rule lifetime evidence without a material fidelity claim.
cases:

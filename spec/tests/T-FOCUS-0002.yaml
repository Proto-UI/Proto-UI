id: T-FOCUS-0002
type: test
title: Four Adapter Focus entry and logical roving translation
status: draft
since: 0.3.0-alpha.0
summary: Bounded React/Vue capability and real framework evidence distinguish acquisition readiness, committed blur, entry delegation and logical roving.
cases:
  - id: T-FOCUS-0002-CASE-UNUSABLE-NATIVE
    title: Hidden inputs and unassociated areas cannot suppress entry fallback
    covers: [HC-FOCUS-ENTRY-0001-A, HC-FOCUS-ENTRY-0001-B]
    expectation: hidden-input-with-or-without-tabindex-and-invalid-area-skip-to-self-absence-or-next-usable-descendant
  - id: T-FOCUS-0002-CASE-NATIVE-ENTRY
    title: Native summary entry wins without an explicit tabindex or a container fallback stop
    covers: [HC-FOCUS-ENTRY-0001-A, HC-FOCUS-ENTRY-0001-B]
    expectation: first-details-summary-delegation-with-self-and-none-fallback-and-negative-tabindex-exclusion
  - id: T-FOCUS-0002-CASE-ENTRY
    title: Descendant-first entry avoids an extra container Tab target and supports disabled/self fallback
    covers:
      [
        C-AS-FOCUS-ENTRY-0001-D,
        C-AS-FOCUS-ENTRY-0001-E,
        C-AS-FOCUS-ENTRY-0001-G,
        M-FOCUS-0001-D,
        HC-FOCUS-ENTRY-0001-A,
        HC-FOCUS-ENTRY-0001-B,
      ]
    expectation: descendant-focus-no-extra-container-tab-target-disabled-entry-self-fallback
  - id: T-FOCUS-0002-CASE-UPDATED-ENTRY
    title: Lifecycle entry acquisition replays after readiness independently of target disable
    covers:
      [
        C-AS-FOCUS-ENTRY-0001-G,
        C-AS-FOCUS-ENTRY-0001-H,
        C-AS-FOCUSABLE-0001-G,
        HC-FOCUS-TARGET-0001-D,
      ]
    expectation: mounted-and-updated-descendant-entry-acquires-after-readiness-and-survives-independent-target-disable-without-owning-descendant-facts
    notes:
      - These React lifecycle cases use fallback none. They do not exercise Tab traversal, entry-role disable, self fallback, or logical roving.
  - id: T-FOCUS-0002-CASE-ACQUISITION-READINESS
    title: Per-kind acquisition guards preserve committed target access for blur and A11y projection
    covers: [HC-FOCUS-TARGET-0001-D]
    expectation: closed-ingress-rejects-native-and-entry-but-allows-programmatic-focus-blur-and-a11y-projection
    notes:
      - The controlled capability test checks one registered root; it does not establish roving navigation, nested owner replacement or full Adapter conformance.
  - id: T-FOCUS-0002-CASE-UPDATED-BLUR
    title: onUpdated blur clears the committed physical target and its observed focused fact
    covers: [HC-FOCUS-TARGET-0001-B, HC-FOCUS-TARGET-0001-D]
    expectation: updated-blur-removes-physical-focus-and-clears-observed-focused-fact-despite-acquisition-gate
    notes:
      - The real React and Vue lifecycle tests use one focusable target for this blur case and do not establish roving navigation.
  - id: T-FOCUS-0002-CASE-ROVING
    title: Logical roving moves to eligible targets outside Tab order and clears stale facts across fresh owners
    covers:
      [
        M-FOCUS-0001-B,
        M-FOCUS-0001-C,
        HC-FOCUS-TARGET-0001-A,
        HC-FOCUS-TARGET-0001-B,
        A-REACT-18-19-0001-FOCUS,
        A-VUE-3-0001-FOCUS,
        A-VUE-2-0001-FOCUS,
        A-WEB-COMPONENT-0001-FOCUS,
      ]
    expectation: logical-roving-programmatic-focus-observed-owner-replacement-disabled-rejection
implementations:
  - id: vue-focus-acquisition-readiness
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/focus-target-readiness.test.ts
    required: true
    consumesCases: [T-FOCUS-0002-CASE-ACQUISITION-READINESS]
  - id: vue-focus-updated-native-blur
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/focus-request-readiness.integration.test.ts
    required: true
    consumesCases: [T-FOCUS-0002-CASE-UPDATED-BLUR]
  - id: react-focus-acquisition-readiness
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/focus-target-readiness.test.ts
    required: true
    consumesCases: [T-FOCUS-0002-CASE-ACQUISITION-READINESS]
  - id: react-focus-updated-native-blur
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/focus-readiness-blur.integration.test.ts
    required: true
    consumesCases: [T-FOCUS-0002-CASE-UPDATED-BLUR]
  - id: react-focus-updated-entry-replay
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/focus-readiness-entry.integration.test.ts
    required: true
    consumesCases: [T-FOCUS-0002-CASE-UPDATED-ENTRY]
    notes:
      - A dual-role instance retains enabled descendant entry across target disable during onUpdated and clears the disabled target's facts.
  - id: react-focus-catalog
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/focus-catalog.integration.test.ts
    required: true
    consumesCases:
      [
        T-FOCUS-0002-CASE-ENTRY,
        T-FOCUS-0002-CASE-NATIVE-ENTRY,
        T-FOCUS-0002-CASE-UNUSABLE-NATIVE,
        T-FOCUS-0002-CASE-ROVING,
      ]
  - id: vue-focus-catalog
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/focus-catalog.integration.test.ts
    required: true
    consumesCases:
      [
        T-FOCUS-0002-CASE-ENTRY,
        T-FOCUS-0002-CASE-NATIVE-ENTRY,
        T-FOCUS-0002-CASE-UNUSABLE-NATIVE,
        T-FOCUS-0002-CASE-ROVING,
      ]
  - id: vue2-focus-catalog
    kind: adapter-test
    status: passing
    path: packages/adapters/vue2/test/focus-catalog.integration.test.ts
    required: true
    consumesCases:
      [
        T-FOCUS-0002-CASE-ENTRY,
        T-FOCUS-0002-CASE-NATIVE-ENTRY,
        T-FOCUS-0002-CASE-UNUSABLE-NATIVE,
        T-FOCUS-0002-CASE-ROVING,
      ]
  - id: web-component-focus-catalog
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/focus-catalog.integration.test.ts
    required: true
    consumesCases:
      [
        T-FOCUS-0002-CASE-ENTRY,
        T-FOCUS-0002-CASE-NATIVE-ENTRY,
        T-FOCUS-0002-CASE-UNUSABLE-NATIVE,
        T-FOCUS-0002-CASE-ROVING,
      ]
verifies:
  contracts: [C-AS-FOCUS-ENTRY-0001, C-FOCUS-0002, C-AS-FOCUSABLE-0001]
  modules: [M-FOCUS-0001]
  hostCaps: [HC-FOCUS-TARGET-0001, HC-FOCUS-ENTRY-0001]
  adapters: [A-REACT-18-19-0001, A-VUE-3-0001, A-VUE-2-0001, A-WEB-COMPONENT-0001]
revisions:
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Scoped lifecycle entry replay to readiness and independent target-disable evidence without claiming Tab traversal, entry-role disable, or self fallback.
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Scoped React acquisition-readiness and updated-blur evidence to their host-capability cases instead of crediting unrelated roving and Adapter criteria.
  - version: 0.3.0-alpha.1
    change: strengthened
    summary: Added real React updated entry replay when the same instance disables its independent focusable target.
  - version: 0.3.0-alpha.1
    change: strengthened
    summary: Bound React acquisition readiness to real updated blur and entry replay evidence while retaining target and A11y projection access.
  - version: 0.3.0-alpha.0
    change: clarified
    summary: Added four-Adapter hidden-input and invalid-area fallback regressions; corrected the area positive fixture to use a named map and associated image.
  - version: 0.3.0-alpha.0
    change: clarified
    summary: Added four-Adapter native summary entry regressions for both fallback policies; valid descendants must not create a fallback container tab stop.
  - version: 0.3.0-alpha.0
    change: introduced
    summary: Added real Adapter entry and logical roving tests; exposed and repaired missing entry capabilities in React, Vue and Vue2.

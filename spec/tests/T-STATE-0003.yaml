    required: true
    consumesCases:
      - T-STATE-0003-CASE-NUMBER-LIST-INPUT
verifies:
  contracts:
    - id: C-STATE-0006
      anchors:
        - C-STATE-0006-A
        - C-STATE-0006-B
        - C-STATE-0006-C
        - C-STATE-0006-D
        - C-STATE-0006-E
    - id: C-STATE-NUMBER-LIST-0001
      since: 0.3.0-alpha.1
      anchors:
        - C-STATE-NUMBER-LIST-0001-A
        - C-STATE-NUMBER-LIST-0001-B
exercises:

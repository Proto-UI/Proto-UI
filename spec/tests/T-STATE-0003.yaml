    title: State definitions preserve finite JSON-compatible v0 state kinds
    covers:
      - C-STATE-0006-A
      - C-STATE-0006-B
    expectation: finite-state-kinds
  - id: T-STATE-0003-CASE-ENUM-SPEC
    title: Enum state definitions preserve options metadata
    covers:
      - C-STATE-0006-C
    expectation: enum-options-spec
  - id: T-STATE-0003-CASE-NUMBER-RANGE-SPEC
    title: Number range state definitions preserve min and max metadata
    covers:
      - C-STATE-0006-D
    expectation: number-range-spec
  - id: T-STATE-0003-CASE-HOST-NEUTRAL-METADATA
    title: String and discrete number metadata remains host-neutral
    covers:
      - C-STATE-0006-E
    expectation: host-neutral-metadata
  - id: T-STATE-0003-CASE-NUMBER-LIST-INPUT
    title: Dense finite immutable sequence input normalization
    covers:
      - C-STATE-NUMBER-LIST-0001-A
      - C-STATE-NUMBER-LIST-0001-B
    expectation: number-list-input
implementations:
  - id: module-state-value-spec-contract
    kind: module-test
    status: passing
    path: packages/modules/state/test/port.v0.test.ts
    required: true
    consumesCases:

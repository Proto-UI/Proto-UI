id: T-ADAPTER-TYPES-0001
type: test
title: Adapter public type projection tests
status: draft
since: 0.2.0-rc.1
summary: Source and packed-consumer type checks verify that React, Vue, and Web Component adapters retain Prototype props, events, and exposes without any erosion.
cases:
  - id: T-ADAPTER-TYPES-0001-CASE-PROPS
    title: Adapted host surfaces retain exact Prototype props
    covers:
      - C-ADAPTER-TYPES-0001-A
      - C-ADAPTER-TYPES-0001-D
    expectation: exact-prototype-props-and-explicit-host-props
  - id: T-ADAPTER-TYPES-0001-CASE-EVENTS
    title: Outward signals map to typed host listeners without leaking event markers
    covers:
      - C-ADAPTER-TYPES-0001-B
    expectation: typed-host-listeners-and-emits
  - id: T-ADAPTER-TYPES-0001-CASE-EXPOSES
    title: Adapter handles project values, methods, and external state handles
    covers:
      - C-ADAPTER-TYPES-0001-C
    expectation: typed-instance-exposes
  - id: T-ADAPTER-TYPES-0001-CASE-PACKED
    title: Packed declarations and CLI facades reject invalid public usage
    covers:
      - C-ADAPTER-TYPES-0001-E
    expectation: packed-facade-negative-type-checks
implementations:
  - id: adapter-base-public-type-projection
    kind: adapter-test
    status: passing
    path: packages/adapters/base/test/public-types.test.ts
    required: true
    consumesCases:
      - T-ADAPTER-TYPES-0001-CASE-EXPOSES
  - id: adapter-react-public-types
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/types.test.ts
    required: true
    consumesCases:
      - T-ADAPTER-TYPES-0001-CASE-PROPS
      - T-ADAPTER-TYPES-0001-CASE-EVENTS
      - T-ADAPTER-TYPES-0001-CASE-EXPOSES
  - id: adapter-vue-public-types
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/types.test.ts
    required: true
    consumesCases:
      - T-ADAPTER-TYPES-0001-CASE-PROPS
      - T-ADAPTER-TYPES-0001-CASE-EVENTS
      - T-ADAPTER-TYPES-0001-CASE-EXPOSES
  - id: adapter-vue2-public-types
    kind: adapter-test
    status: passing
    path: packages/adapters/vue2/test/types.test.ts
    required: false
    consumesCases:
      - T-ADAPTER-TYPES-0001-CASE-PROPS
      - T-ADAPTER-TYPES-0001-CASE-EVENTS
      - T-ADAPTER-TYPES-0001-CASE-EXPOSES
  - id: adapter-web-component-public-types
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/types.test.ts
    required: true
    consumesCases:
      - T-ADAPTER-TYPES-0001-CASE-PROPS
      - T-ADAPTER-TYPES-0001-CASE-EXPOSES
  - id: release-packed-adapter-type-smoke
    kind: workspace-check
    status: passing
    path: scripts/release/consumer-smoke-cli.mjs
    required: true
    consumesCases:
      - T-ADAPTER-TYPES-0001-CASE-PACKED
verifies:
  contracts:
    - id: C-ADAPTER-TYPES-0001
      anchors:
        - C-ADAPTER-TYPES-0001-A
        - C-ADAPTER-TYPES-0001-B
        - C-ADAPTER-TYPES-0001-C
        - C-ADAPTER-TYPES-0001-D
        - C-ADAPTER-TYPES-0001-E
revisions:
  - version: 0.2.0-rc.1
    change: introduced
    summary: Added source-level and packed-consumer checks for all three official Web adapters.
tags:
  - adapter
  - typescript
  - release-smoke

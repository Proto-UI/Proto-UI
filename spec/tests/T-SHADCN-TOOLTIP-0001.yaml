id: T-SHADCN-TOOLTIP-0001
type: test
title: shadcn Tooltip visual, interaction, and inheritance tests
status: draft
since: 0.3.0-alpha.0
summary: Covers shadcn Tooltip public API against P-SHADCN-TOOLTIP criteria.
cases:
  - id: T-SHADCN-TOOLTIP-0001-CASE-1
    title: Direct entry and Base Tooltip inheritance
    covers:
      - P-SHADCN-TOOLTIP-ENTRY
      - P-SHADCN-TOOLTIP-BASE-INHERITANCE
      - P-SHADCN-TOOLTIP-GROUP-ENTRY
      - P-SHADCN-TOOLTIP-TRIGGER-ENTRY
      - P-SHADCN-TOOLTIP-CONTENT-ENTRY
    expectation: p-shadcn-tooltip-entry-inheritance
  - id: T-SHADCN-TOOLTIP-0001-CASE-2
    title: Content visual grammar is rounded popover
    covers:
      - P-SHADCN-TOOLTIP-CONTENT-VISUAL-GRAMMAR
    expectation: p-shadcn-tooltip-visual-grammar
  - id: T-SHADCN-TOOLTIP-0001-CASE-3
    title: Trigger visual feedback is state-driven without activation ownership
    covers:
      - P-SHADCN-TOOLTIP-TRIGGER-STATE-DRIVEN-VISUALS
    expectation: p-shadcn-tooltip-trigger-state-driven-visuals
  - id: T-SHADCN-TOOLTIP-0001-CASE-4
    title: Inherited delay cancellation, disabled teardown, and disposal safety
    covers:
      - P-BASE-TOOLTIP-DELAYS
      - P-BASE-TOOLTIP-DISABLED
    expectation: p-shadcn-tooltip-inherited-delay-disposal
  - id: T-SHADCN-TOOLTIP-0001-CASE-5
    title: Inherited warm sibling handoff keeps one active owner
    covers:
      - P-BASE-TOOLTIP-GROUP-WARMTH
      - P-BASE-TOOLTIP-GROUP-ACTIVE-OWNER
      - P-BASE-TOOLTIP-GROUP-INSTANT-HANDOFF
    expectation: p-shadcn-tooltip-inherited-warm-handoff
  - id: T-SHADCN-TOOLTIP-0001-CASE-BROWSER
    title: Rendered focus-linked tooltip visibility and Escape dismissal across WC, React, Vue, and Vue 2
    covers:
      - P-BASE-TOOLTIP-TRIGGER-DESCRIPTION
      - P-BASE-TOOLTIP-CONTENT-SEMANTICS
      - P-BASE-TOOLTIP-CONTENT-OVERLAY
      - P-BASE-TOOLTIP-CONTENT-ESCAPE
    expectation: rendered-tooltip-cross-runtime-focus-description-and-dismissal
implementations:
  - id: prototypes-shadcn-tooltip-contract
    kind: module-test
    status: passing
    path: packages/prototypes/shadcn/test/tooltip.test.ts
    required: true
    consumesCases:
      - T-SHADCN-TOOLTIP-0001-CASE-1
      - T-SHADCN-TOOLTIP-0001-CASE-2
      - T-SHADCN-TOOLTIP-0001-CASE-3
      - T-SHADCN-TOOLTIP-0001-CASE-4
      - T-SHADCN-TOOLTIP-0001-CASE-5
    exercises:
      - P-BASE-TOOLTIP
      - P-BASE-TOOLTIP-GROUP
      - P-BASE-TOOLTIP-TRIGGER
      - P-BASE-TOOLTIP-CONTENT
      - P-SHADCN-TOOLTIP
      - P-SHADCN-TOOLTIP-GROUP
      - P-SHADCN-TOOLTIP-TRIGGER
      - P-SHADCN-TOOLTIP-CONTENT
  - id: pr534-tooltip-browser-acceptance
    kind: adapter-test
    status: passing
    path: apps/www/src/content/docs/zh-cn/demo-pr534-coverage.browser.test.ts
    required: true
    consumesCases:
      - T-SHADCN-TOOLTIP-0001-CASE-BROWSER
    exercises:
      - P-BASE-TOOLTIP-TRIGGER
      - P-BASE-TOOLTIP-CONTENT
      - P-SHADCN-TOOLTIP
      - P-SHADCN-TOOLTIP-TRIGGER
      - P-SHADCN-TOOLTIP-CONTENT
verifies:
  prototypes:
    - id: P-SHADCN-TOOLTIP
    - id: P-SHADCN-TOOLTIP-GROUP
    - id: P-SHADCN-TOOLTIP-TRIGGER
    - id: P-SHADCN-TOOLTIP-CONTENT
exercises:
  prototypes:
    - P-BASE-TOOLTIP
    - P-BASE-TOOLTIP-GROUP
    - P-BASE-TOOLTIP-TRIGGER
    - P-BASE-TOOLTIP-CONTENT
    - P-SHADCN-TOOLTIP
    - P-SHADCN-TOOLTIP-GROUP
    - P-SHADCN-TOOLTIP-TRIGGER
    - P-SHADCN-TOOLTIP-CONTENT
revisions:

id: T-BRUTALIST-TOGGLE-0001
type: test
title: Brutalist Toggle visual contract and public API tests
status: draft
since: 0.2.0-rc.7
summary: >-
  Covers the Brutalist Toggle public API (size enum, defaults), active accent pair and persistent non-color frame, interaction precedence, and Base semantic ownership against P-BRUTALIST-TOGGLE criteria.


cases:
  - id: T-BRUTALIST-TOGGLE-0001-CASE-1
    title: Direct entry and Base Toggle inheritance
    covers:
      - P-BRUTALIST-TOGGLE-ENTRY
      - P-BRUTALIST-TOGGLE-BASE-INHERITANCE
    expectation: p-brutalist-toggle-entry-inheritance
  - id: T-BRUTALIST-TOGGLE-0001-CASE-2
    title: Active fill pairs with its foreground
    covers:
      - P-BRUTALIST-TOGGLE-PAIR-INVARIANT
    expectation: p-brutalist-toggle-active-pair
  - id: T-BRUTALIST-TOGGLE-0001-CASE-3
    title: Every size option maps to dimension tokens
    covers:
      - P-BRUTALIST-TOGGLE-SIZE-PROP
    expectation: p-brutalist-toggle-sizes
  - id: T-BRUTALIST-TOGGLE-0001-CASE-4
    title: Reactive defaults restore after prop removal and defaultActive initializes false
    covers:
      - P-BRUTALIST-TOGGLE-DEFAULTS
      - P-BRUTALIST-TOGGLE-SIZE-PROP
    expectation: p-brutalist-toggle-defaults
  - id: T-BRUTALIST-TOGGLE-0001-CASE-5
    title: Visual grammar remains square hard-shadow Neo-Brutalist
    covers:
      - P-BRUTALIST-TOGGLE-VISUAL-GRAMMAR
    expectation: p-brutalist-toggle-visual-grammar
  - id: T-BRUTALIST-TOGGLE-0001-CASE-6
    title: Hover press focus-visible and disabled projection
    covers:
      - P-BRUTALIST-TOGGLE-INTERACTION
      - P-BRUTALIST-TOGGLE-BASE-INHERITANCE
    expectation: p-brutalist-toggle-interaction
  - id: T-BRUTALIST-TOGGLE-0001-CASE-7
    title: Active state keeps a persistent geometry-stable inset ink frame
    covers:
      - P-BRUTALIST-TOGGLE-ACTIVE-SIGNAL
      - P-BRUTALIST-TOGGLE-PAIR-INVARIANT
    expectation: p-brutalist-toggle-active-non-color-signal
  - id: T-BRUTALIST-TOGGLE-0001-CASE-8
    title: Press takes precedence over hover and outer active elevation
    covers:
      - P-BRUTALIST-TOGGLE-ACTIVE-SIGNAL
      - P-BRUTALIST-TOGGLE-INTERACTION
    expectation: p-brutalist-toggle-state-precedence
  - id: T-BRUTALIST-TOGGLE-0001-CASE-BROWSER
    title: Rendered active and resting Toggle surfaces preserve paired fills and hard frames across official runtimes
    covers:
      - P-BRUTALIST-TOGGLE-PAIR-INVARIANT
      - P-BRUTALIST-TOGGLE-VISUAL-GRAMMAR
    expectation: rendered-brutalist-toggle-cross-runtime-visual-and-active-pair
implementations:
  - id: prototypes-brutalist-toggle-contract
    kind: module-test
    status: passing
    path: packages/prototypes/brutalist/test/toggle.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-TOGGLE-0001-CASE-1
      - T-BRUTALIST-TOGGLE-0001-CASE-2
      - T-BRUTALIST-TOGGLE-0001-CASE-3
      - T-BRUTALIST-TOGGLE-0001-CASE-4
      - T-BRUTALIST-TOGGLE-0001-CASE-5
      - T-BRUTALIST-TOGGLE-0001-CASE-6
      - T-BRUTALIST-TOGGLE-0001-CASE-7
      - T-BRUTALIST-TOGGLE-0001-CASE-8
    exercises:
      - P-BASE-TOGGLE
      - P-BRUTALIST-TOGGLE
  - id: website-brutalist-remaining-browser-toggle
    kind: adapter-test
    status: passing
    path: apps/www/src/content/docs/zh-cn/demo-brutalist-remaining.browser.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-TOGGLE-0001-CASE-BROWSER
    exercises:
      - P-BRUTALIST-TOGGLE
verifies:
  prototypes:
    - id: P-BRUTALIST-TOGGLE
exercises:
  prototypes:
    - P-BASE-TOGGLE
    - P-BRUTALIST-TOGGLE
revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: >-
      Introduced draft Brutalist Toggle coverage mapped to the rc.7 P criteria (size, defaults, active pair, interaction). Not present in the immutable rc.6 snapshot.


  - version: 0.2.0
    change: revised
    summary: >-
      Added executable coverage for the persistent non-color active frame and deterministic hover/press/active precedence.


tags:
  - test
  - brutalist
  - neo-brutalist
  - visual
  - toggle

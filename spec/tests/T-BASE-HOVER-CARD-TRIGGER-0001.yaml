id: T-BASE-HOVER-CARD-TRIGGER-0001
type: test
title: Base Hover Card Trigger protocol tests
status: draft
since: 0.2.0-rc.0
summary: Covers Trigger focus and hover intent, disabled suppression, link-preview role, authoring parity, and independence from Button activation.
cases:
  - id: T-BASE-HOVER-CARD-TRIGGER-0001-CASE-INTERACTION
    title: Trigger publishes pointer and focus intent and suppresses it while disabled
    covers:
      - P-BASE-HOVER-CARD-TRIGGER-INTERACTION
      - P-BASE-HOVER-CARD-TRIGGER-DISABLED
    expectation: hover-card-trigger-publishes-focus-and-hover-intent
  - id: T-BASE-HOVER-CARD-TRIGGER-0001-CASE-INDEPENDENCE
    title: Trigger remains a link-preview anchor without Button activation
    covers:
      - P-BASE-HOVER-CARD-TRIGGER-AUTHORING-ENTRIES
      - P-BASE-HOVER-CARD-TRIGGER-ROLE
      - P-BASE-HOVER-CARD-TRIGGER-NO-BUTTON-DEPENDENCY
      - P-BASE-HOVER-CARD-TRIGGER-NO-ACTIVATION
    expectation: hover-card-trigger-has-no-button-role-press-or-click-surface
  - id: T-BASE-HOVER-CARD-TRIGGER-0001-CASE-LIFECYCLE
    title: View-generation withdrawal preserves owner, replacement, and request boundaries
    covers: [P-BASE-HOVER-CARD-TRIGGER-INTERACTION-LIFETIME]
    expectation: With openDelay=0 and closeDelay=20, hover or focus Trigger to open then remove it without leave or blur. With no Content hover, exactly one close occurs at 20ms; with Content still hovered Root stays open. Removing a pending-open Trigger cancels its old deadline and a replacement waits its full own openDelay.
implementations:
  - id: prototypes-base-hover-card-trigger-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/hover-card.test.ts
    required: true
    consumesCases:
      - T-BASE-HOVER-CARD-TRIGGER-0001-CASE-INTERACTION
      - T-BASE-HOVER-CARD-TRIGGER-0001-CASE-INDEPENDENCE
    exercises: [P-BASE-HOVER-CARD-TRIGGER]
  - id: prototypes-base-hover-card-trigger-lifecycle-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/hover-card-lifecycle.test.ts
    required: true
    consumesCases: [T-BASE-HOVER-CARD-TRIGGER-0001-CASE-LIFECYCLE]
    exercises: [P-BASE-HOVER-CARD-TRIGGER]
verifies:
  prototypes:
    - id: P-BASE-HOVER-CARD-TRIGGER
      anchors:
        - P-BASE-HOVER-CARD-TRIGGER-INTERACTION
        - P-BASE-HOVER-CARD-TRIGGER-DISABLED
        - P-BASE-HOVER-CARD-TRIGGER-NO-BUTTON-DEPENDENCY
        - P-BASE-HOVER-CARD-TRIGGER-NO-ACTIVATION
exercises: { prototypes: [P-BASE-HOVER-CARD-TRIGGER] }
revisions:
  - version: 0.2.0-rc.0
    change: introduced
    summary: Added Trigger interaction and protocol-independence coverage.
  - version: 0.3.0-alpha.1
    change: extended
    summary: Added planned view-generation interaction cleanup, stale-owner, and controlled-request lifecycle evidence.
  - version: 0.3.0-alpha.1
    change: implemented
    summary: Added executed source-bound lifecycle regressions and negative controls; prototype and test lifecycle remain draft.
tags: [prototype, base, hover-card, trigger, test]

id: T-LIQUID-GLASS-BUTTON-0001
type: test
title: Liquid Glass fallback Button evidence
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: Tests cover the bounded visual foundation; stable and cross-host admission are not implied.
summary: Unit state/token closure plus a collected real-four-Web Button fixture; native/compiler remain outside this slice.
cases:
  - id: T-LIQUID-GLASS-BUTTON-0001-CASE-INHERITANCE
    title: Identity, inherited Base states and restored defaults
    covers:
      - P-LIQUID-GLASS-BUTTON-BASE
      - P-LIQUID-GLASS-BUTTON-API
    expectation: base-inherited-state-and-defaults
  - id: T-LIQUID-GLASS-BUTTON-0001-CASE-TOKENS
    title: Source-extracted finite style vocabulary and theme closure
    covers:
      - P-LIQUID-GLASS-BUTTON-VISUAL
      - P-LIQUID-GLASS-BUTTON-CLOSURE
    expectation: source-token-physical-closure
  - id: T-LIQUID-GLASS-BUTTON-0001-CASE-BROWSER
    title: Real four-Web-adapter rendering and activation
    covers:
      - P-LIQUID-GLASS-BUTTON-BASE
      - P-LIQUID-GLASS-BUTTON-VISUAL
      - P-LIQUID-GLASS-BUTTON-CLOSURE
    expectation: real-web-host-button-appearance-and-interaction
implementations:
  - id: liquid-glass-button-contract
    kind: module-test
    status: passing
    path: packages/prototypes/liquid-glass/test/button.test.ts
    required: true
    consumesCases:
      - T-LIQUID-GLASS-BUTTON-0001-CASE-INHERITANCE
      - T-LIQUID-GLASS-BUTTON-0001-CASE-TOKENS
  - id: liquid-glass-button-browser
    kind: runtime-test
    status: passing
    path: apps/www/src/content/docs/zh-cn/demo-new-projection-families.browser.test.ts
    required: true
    consumesCases:
      - T-LIQUID-GLASS-BUTTON-0001-CASE-BROWSER
    notes:
      - This is a Web-only fixture; it does not establish native or Prototype Compiler parity.
      - Passed at source 9c10090bd497b73890a4599459bebf3c828aa157 in GitHub Actions run 37119252013, Node 24.21.0 and Chrome 154.0.8037.57. The five browser cases cover only the Bootstrap 2.3.2 default/primary Button and Liquid Glass opaque fallback through WC, React, Vue 3 and Vue 2; no translucent material or wider family/native support is admitted.
      - The exact-head artifact contains paired pressed/focus states, light/dark/mobile captures and disposal metadata. Official project-local Astro devToolbar.enabled=false was read back; all 24 fixture controls and runtime roots were removed, with no page-wide survivor in that capture run.
exercises:
  prototypes:
    - P-LIQUID-GLASS-BUTTON
sources:
  - path: packages/prototypes/liquid-glass/test/button.test.ts
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added bounded family-state and physical-token closure cases; browser evidence remains explicitly planned until run.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Recorded passing four-Web Button fixture evidence at source 9c10090 and Actions run 37119252013, preserving draft lifecycle and explicit opaque-material, family-coverage and native/compiler limits.
tags:
  - test
  - liquid-glass
  - button

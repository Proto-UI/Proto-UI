    change: revised
    summary: Implemented all six required paths, with explicit Runtime/host ownership assertions, exact-key Tabs migration and honest React simulation versus browser evidence boundaries.
  - version: 0.3.0-alpha.0
    change: revised
    summary: Recorded the remain-draft lifecycle rationale while preserving all six required implementation mappings as planned.

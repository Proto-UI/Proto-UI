id: T-A11Y-PART-RELATIONSHIP-0001
type: test
title: Same-domain anatomy-part relationship conformance
status: draft
since: 0.3.0-alpha.0
lifecycleRationale:
  zh-CN: 七个 cases 已有实际 Runtime、Web ownership 与四 Adapter Tabs 执行断言；保留 draft，等待对应 contract 的独立稳定准入。React 仿真测试的 retained 范围与真实浏览器 L1 证据分开记录。
  en: The seven cases now have executable Runtime, Web ownership and four-Adapter Tabs assertions. Remains draft pending independent stable admission of the corresponding contract; React simulation covers retained bindings separately from real-browser L1 evidence.
summary: Maps the structured relationship carrier, exact matching, view epochs, host-id ownership, resource cleanup and Tabs migration to executable owning-layer, Runtime and four-Adapter tests.
cases:
  - id: T-A11Y-PART-RELATIONSHIP-0001-CASE-STRUCTURED-CARRIER
    title: Structured relationship declarations preserve portable identity fields without exposing host data
    covers:
      - C-A11Y-PART-RELATIONSHIP-0001-A
      - C-A11Y-PART-RELATIONSHIP-0001-B
      - C-A11Y-PART-RELATIONSHIP-0001-H
      - C-A11Y-PART-RELATIONSHIP-0001-I
    expectation: structured-portable-relationship-carrier
  - id: T-A11Y-PART-RELATIONSHIP-0001-CASE-FAIL-CLOSED-RESOLUTION
    title: Missing, duplicate, arbitrary-key, re-keyed, and re-domained targets resolve atomically without guessing or cross-domain residue
    covers:
      - C-A11Y-PART-RELATIONSHIP-0001-C
      - C-A11Y-PART-RELATIONSHIP-0001-G
    expectation: exact-tuple-fail-closed-atomic-resolution
  - id: T-A11Y-PART-RELATIONSHIP-0001-CASE-VIEW-EPOCH-LIFECYCLE
    title: Source and target detach withdraws IDREF projection before removal and rematerialization restores current bindings before visibility
    covers:
      - C-A11Y-PART-RELATIONSHIP-0001-D
      - C-A11Y-PART-RELATIONSHIP-0001-E
    expectation: detach-and-rematerialization-precommit-ordering
  - id: T-A11Y-PART-RELATIONSHIP-0001-CASE-TERMINAL-CLEANUP
    title: Terminal disposal removes every retained registry, lease, projection, observer, and adapter reservation resource
    covers:
      - C-A11Y-PART-RELATIONSHIP-0001-F
    expectation: complete-terminal-relationship-resource-cleanup
  - id: T-A11Y-PART-RELATIONSHIP-0001-CASE-HOST-ID-OWNERSHIP
    title: Host ids and identical pre-existing IDREF tokens survive adoption, collision, live mutation, and compare-and-restore cleanup
    covers:
      - C-A11Y-PART-RELATIONSHIP-0001-D
      - C-A11Y-PART-RELATIONSHIP-0001-J
    expectation: non-destructive-host-id-and-idref-token-ownership
  - id: T-A11Y-PART-RELATIONSHIP-0001-CASE-SAME-EPOCH-REPLACEMENT
    title: Same-epoch source and target binding replacement revokes old ownership and projects the new valid binding before visibility
    covers:
      - C-A11Y-PART-RELATIONSHIP-0001-K
    expectation: atomic-same-epoch-physical-binding-replacement
  - id: T-A11Y-PART-RELATIONSHIP-0001-CASE-TABS-MIGRATION
    title: Tabs uses reciprocal structured Trigger and Content relationships across lazy, retained, ambiguous, and dynamic compositions in every Web adapter
    covers:
      - C-A11Y-PART-RELATIONSHIP-0001-A
      - C-A11Y-PART-RELATIONSHIP-0001-C
      - C-A11Y-PART-RELATIONSHIP-0001-D
      - C-A11Y-PART-RELATIONSHIP-0001-E
      - C-A11Y-PART-RELATIONSHIP-0001-G
      - C-A11Y-PART-RELATIONSHIP-0001-J
      - C-A11Y-PART-RELATIONSHIP-0001-K
      - P-BASE-TABS-A11Y-RELATIONSHIP-TARGET
      - P-BASE-TABS-DEFAULT-L1-DETACH
      - P-BASE-TABS-TRIGGER-A11Y-CONTROLS-TARGET
      - P-BASE-TABS-CONTENT-A11Y-LABELLEDBY-TARGET
    expectation: cross-adapter-tabs-structured-relationship-migration
implementations:
  - id: runtime-a11y-part-relationship-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/a11y.v0.contract.test.ts
    required: true
    consumesCases:
      - T-A11Y-PART-RELATIONSHIP-0001-CASE-STRUCTURED-CARRIER
      - T-A11Y-PART-RELATIONSHIP-0001-CASE-FAIL-CLOSED-RESOLUTION
      - T-A11Y-PART-RELATIONSHIP-0001-CASE-TERMINAL-CLEANUP
    notes:
      - Actual Runtime sessions exercise the generic authored family, derived structural carrier, dynamic key/domain changes, both endpoint epochs, intent-before-removal and bounded projector cleanup.
  - id: web-component-a11y-part-relationship-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/contract/a11y.v0.contract.test.ts
    required: true
    consumesCases:
      - T-A11Y-PART-RELATIONSHIP-0001-CASE-VIEW-EPOCH-LIFECYCLE
      - T-A11Y-PART-RELATIONSHIP-0001-CASE-HOST-ID-OWNERSHIP
      - T-A11Y-PART-RELATIONSHIP-0001-CASE-SAME-EPOCH-REPLACEMENT
    notes:
      - Actual WC elements exercise both endpoint detach/remount and host ID mutation/collision. The actual WC surface capability provider exercises same-epoch source and native target replacement plus stale-epoch rejection.
  - id: base-tabs-structured-relationship-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/tabs.test.ts
    required: true
    consumesCases:
      - T-A11Y-PART-RELATIONSHIP-0001-CASE-FAIL-CLOSED-RESOLUTION
      - T-A11Y-PART-RELATIONSHIP-0001-CASE-VIEW-EPOCH-LIFECYCLE
      - T-A11Y-PART-RELATIONSHIP-0001-CASE-TABS-MIGRATION
    notes:
      - Actual WC Tabs exercise exact keys, ambiguity and recovery, nested/adjacent domains and lazy identity retention while preserving selection and keyboard coverage.
  - id: react-tabs-structured-relationship-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/tabs.test.ts
    required: true
    consumesCases:
      - T-A11Y-PART-RELATIONSHIP-0001-CASE-TABS-MIGRATION
    notes:
      - React simulation covers retained exact-key bindings, ambiguity recovery and domain isolation. Real React DOM browser evidence is required separately for physical L1 removal and reveal ordering.
  - id: vue-tabs-structured-relationship-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/tabs.test.ts
    required: true
    consumesCases:
      - T-A11Y-PART-RELATIONSHIP-0001-CASE-TABS-MIGRATION
  - id: vue2-tabs-structured-relationship-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/vue2/test/tabs.test.ts
    required: true
    consumesCases:
      - T-A11Y-PART-RELATIONSHIP-0001-CASE-TABS-MIGRATION

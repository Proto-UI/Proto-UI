  - id: adapter-react-initial-view-intent
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/lifecycle-view-intent.test.ts
    required: true
    consumesCases:
      - T-LIFECYCLE-0006-CASE-INITIAL-DETACHED
      - T-LIFECYCLE-0006-CASE-REPEATABLE-DETACH

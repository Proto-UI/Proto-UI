id: T-BASE-DROPDOWN-COMPOSITION-0001
type: test
title: Dropdown passive composition and single action-owner checks
status: draft
since: 0.3.0-alpha.1
summary: Checks live group naming, passive separators and shortcut hints, collection isolation and lifecycle without adding an input owner.
cases:
  - id: T-BASE-DROPDOWN-COMPOSITION-0001-CASE-GROUP
    title: Group owns only its defined passive semantics
    covers: [P-BASE-DROPDOWN-MENU-GROUP-GROUP-ROLE, P-BASE-DROPDOWN-MENU-GROUP-LIFECYCLE]
    expectation: live-identity-and-passive-action-boundary-survive-remount
  - id: T-BASE-DROPDOWN-COMPOSITION-0001-CASE-LABEL
    title: Label owns only its defined passive semantics
    covers: [P-BASE-DROPDOWN-MENU-LABEL-LABEL-RELATION, P-BASE-DROPDOWN-MENU-LABEL-LIFECYCLE]
    expectation: live-identity-and-passive-action-boundary-survive-remount

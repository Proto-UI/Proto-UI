      [P-BASE-DROPDOWN-MENU-SEPARATOR-SEPARATOR-PASSIVE, P-BASE-DROPDOWN-MENU-SEPARATOR-LIFECYCLE]
    expectation: live-identity-and-passive-action-boundary-survive-remount

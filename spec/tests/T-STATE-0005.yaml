id: T-STATE-0005
type: test
title: State module boundary and official Adapter conformance
status: draft
since: 0.2.0-rc.7
summary: Module, runtime, and official Adapter evidence verifies the State facade and port split, capability views, required installation, no-host-cap boundary, explicit rendering, and instance-lifetime preservation.
cases:
  - id: T-STATE-0005-CASE-FACADE-PORT-SPLIT
    title: Author definitions and privileged State operations remain separate
    covers:
      - M-STATE-0001-A
      - M-STATE-0001-B
      - M-STATE-0001-C
    expectation: state-facade-and-port-preserve-capability-boundaries
  - id: T-STATE-0005-CASE-HOST-NEUTRAL
    title: State needs no host capability and projects no host side effects
    covers:
      - M-STATE-0001-D
    expectation: state-is-instance-memory-without-host-capability
  - id: T-STATE-0005-CASE-REQUIRED-SUPPORT
    title: Standard Runtime and official Adapter profiles install State as required
    covers:
      - M-STATE-0001-E
      - A-REACT-18-19-0001-J
      - A-VUE-3-0001-J
      - A-VUE-2-0001-J
      - A-WEB-COMPONENT-0001-J
    expectation: official-adapters-expose-required-state-runtime
  - id: T-STATE-0005-CASE-INSTANCE-LIFETIME
    title: State values, views, and watchers survive repeatable view epochs
    covers:
      - M-STATE-0001-F
      - C-STATE-0011-D
      - C-STATE-0012-A
      - C-STATE-0012-B
      - C-STATE-0012-C
      - C-STATE-0012-D
      - C-STATE-0012-E
    expectation: state-survives-detach-and-invalidates-on-terminal-dispose
  - id: T-STATE-0005-CASE-AS-HOOK-PROJECTION
    title: Privileged asHook projection shares borrowed views without authority escalation
    covers:
      - M-STATE-0001-G
    expectation: as-hook-state-is-projected-as-borrowed-view
  - id: T-STATE-0005-CASE-SEMANTIC-BRIDGES
    title: Interaction and accessibility compatibility accessors remain outside the core facade
    covers:
      - M-STATE-0001-H
    expectation: semantic-state-accessors-delegate-to-dependent-modules
  - id: T-STATE-0005-CASE-EXPLICIT-RENDER
    title: State mutation through each official Adapter remains separate from update
    covers:
      - M-STATE-0001-D
      - A-REACT-18-19-0001-J
      - A-VUE-3-0001-J
      - A-VUE-2-0001-J
      - A-WEB-COMPONENT-0001-J
    expectation: state-mutation-does-not-render-until-adapter-update

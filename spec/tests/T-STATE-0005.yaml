      - T-STATE-0005-CASE-EXPLICIT-RENDER
  - id: adapter-vue-state-runtime
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/contract/state-runtime.v0.contract.test.ts
    required: true
    consumesCases:
      - T-STATE-0005-CASE-REQUIRED-SUPPORT
      - T-STATE-0005-CASE-EXPLICIT-RENDER
  - id: adapter-vue2-state-runtime
    kind: adapter-test
    status: passing

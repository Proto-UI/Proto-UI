      - T-STATE-0005-CASE-EXPLICIT-RENDER
  - id: adapter-profile-state-slice-schema
    kind: workspace-check
    status: passing
    path: packages/spec/fixtures/test/adapter-profile-schema.test.ts
    required: true
    consumesCases:

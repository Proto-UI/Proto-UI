id: T-RULE-WHEN-0001
type: test
title: Rule when expression tests
status: draft
since: 0.1.0
summary: Contract tests for pure Rule when expressions, strict equality, core boolean operators, and the event-occurrence boundary.
cases:
  - id: T-RULE-WHEN-0001-CASE-PURITY
    title: when evaluation reads observable inputs and performs no side effects
    covers:
      - C-RULE-WHEN-0001-A
    expectation: pure-when-predicate
  - id: T-RULE-WHEN-0001-CASE-CORE-EXPRESSIONS
    title: v0 when expressions include true, false, eq, not, all, and any
    covers:
      - C-RULE-WHEN-0001-B
    expectation: core-when-expression-set
  - id: T-RULE-WHEN-0001-CASE-STRICT-EQUALITY
    title: eq uses strict equality without coercion, deep comparison, or custom comparators
    covers:
      - C-RULE-WHEN-0001-C
    expectation: strict-eq-semantics
  - id: T-RULE-WHEN-0001-CASE-EMPTY-LOGICALS
    title: all([]) is true and any([]) is false
    covers:
      - C-RULE-WHEN-0001-D
    expectation: empty-logical-identity-values
  - id: T-RULE-WHEN-0001-CASE-NO-EVENT-OCCURRENCE
    title: when cannot match instantaneous event occurrences directly
    covers:
      - C-RULE-WHEN-0001-E
    expectation: event-occurrence-requires-observable-state
implementations:
  - id: runtime-rule-when-expression-contract
    kind: runtime-test
    status: planned
    path: packages/runtime/test/contract/rule.matrix.when.v0.contract.test.ts
    required: true
    consumesCases:
      - T-RULE-WHEN-0001-CASE-PURITY
      - T-RULE-WHEN-0001-CASE-CORE-EXPRESSIONS
      - T-RULE-WHEN-0001-CASE-STRICT-EQUALITY
      - T-RULE-WHEN-0001-CASE-EMPTY-LOGICALS
      - T-RULE-WHEN-0001-CASE-NO-EVENT-OCCURRENCE
  - id: runtime-rule-matrix-when-contract
    kind: runtime-test
    status: planned
    path: packages/runtime/test/contract/rule.matrix.when.v0.contract.test.ts
    required: false
    consumesCases:
      - T-RULE-WHEN-0001-CASE-STRICT-EQUALITY
      - T-RULE-WHEN-0001-CASE-CORE-EXPRESSIONS
verifies:
  contracts:
    - id: C-RULE-WHEN-0001
      anchors:
        - C-RULE-WHEN-0001-A
        - C-RULE-WHEN-0001-B
        - C-RULE-WHEN-0001-C
        - C-RULE-WHEN-0001-D
        - C-RULE-WHEN-0001-E
revisions:
  - version: 0.1.0
    change: introduced
    summary: Added core Rule when expression test mapping.
tags:
  - rule
  - when
  - expression
  - contract-test

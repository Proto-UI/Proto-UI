  - id: adapter-web-component-image-view-integration
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/image-view.integration.test.ts
    required: true
    consumesCases:
      - T-IMAGE-VIEW-0001-CASE-WEB-PROJECTION
      - T-IMAGE-VIEW-0001-CASE-WEB-LIFECYCLE
    exercises:

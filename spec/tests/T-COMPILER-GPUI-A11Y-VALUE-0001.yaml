openQuestions:
  - id: T-COMPILER-GPUI-A11Y-VALUE-0001-Q-OS
    question: Acceptance of a platform bridge needs a real accessibility client setting a rendered native control and observing its authored commit; an SDK bridge test is insufficient.
    blocks: [activation:T-COMPILER-GPUI-A11Y-VALUE-0001]
revisions:
  - version: 0.3.0-alpha.2
    change: introduced
    summary: Map checked numeric host payload, actual generated native bridge and Runtime request tests without promoting them to OS evidence.
  - version: 0.4.0
    change: removed
    summary: Retire the old compiler-specific identity; preserve history and use the independent foundation.
tags: [compiler, gpui, accessibility, event, conformance]

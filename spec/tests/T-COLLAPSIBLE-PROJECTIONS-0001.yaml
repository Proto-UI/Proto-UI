    title: Package facade and finite style compiler consumption
    covers:
      - P-SHADCN-COLLAPSIBLE-DIRECT-ENTRY
      - P-SHADCN-COLLAPSIBLE-TRIGGER-DIRECT-ENTRY
      - P-SHADCN-COLLAPSIBLE-CONTENT-DIRECT-ENTRY

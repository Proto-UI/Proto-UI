      - P-BRUTALIST-COLLAPSIBLE-CONTENT-VISUAL-SAFETY
      - P-BOOTSTRAP-2-3-2-COLLAPSIBLE-VISUAL-SAFETY
      - P-BOOTSTRAP-2-3-2-COLLAPSIBLE-TRIGGER-VISUAL-SAFETY
      - P-BOOTSTRAP-2-3-2-COLLAPSIBLE-CONTENT-VISUAL-SAFETY
      - P-LIQUID-GLASS-COLLAPSIBLE-VISUAL-SAFETY
      - P-LIQUID-GLASS-COLLAPSIBLE-TRIGGER-VISUAL-SAFETY
      - P-LIQUID-GLASS-COLLAPSIBLE-CONTENT-VISUAL-SAFETY
    expectation: Source assertions establish width/wrapping/style-state policy only. Separately registered native journeys exercise real input, computed hidden display, safe padding, 320px long text at 200% font size, light/dark, and source-bound screenshots. GPUI/optical material require separate evidence.
  - id: T-COLLAPSIBLE-PROJECTIONS-0001-CASE-MATERIAL-INTENT
    title: Liquid Trigger consumes shared whole optical intent without another semantic owner
    covers:
      - P-LIQUID-GLASS-COLLAPSIBLE-TRIGGER-MATERIAL-INTENT
    expectation: A real three-part Runtime fixture records one Trigger slot, mutually exclusive Base pressed/rest candidates, disabled/cancel resets, view release/remount and complete opaque fallback/diagnosis with no visual sink. Root and Content remain material-neutral. This evidence does not render optical material or prove host/GPUI parity.

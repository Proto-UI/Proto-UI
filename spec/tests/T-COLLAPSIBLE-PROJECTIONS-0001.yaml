      - P-BOOTSTRAP-2-3-2-COLLAPSIBLE-TRIGGER-DIRECT-ENTRY
      - P-BOOTSTRAP-2-3-2-COLLAPSIBLE-CONTENT-DIRECT-ENTRY
      - P-LIQUID-GLASS-COLLAPSIBLE-DIRECT-ENTRY
      - P-LIQUID-GLASS-COLLAPSIBLE-TRIGGER-DIRECT-ENTRY
      - P-LIQUID-GLASS-COLLAPSIBLE-CONTENT-DIRECT-ENTRY
    expectation: All twelve direct entries and corresponding four-Web-host facades resolve; private source families require explicit workspace code generation; every source token has finite CSS lowering. No registry publishing occurs.
  - id: T-COLLAPSIBLE-PROJECTIONS-0001-CASE-VISUAL-SAFETY
    title: Long-text, focus-space and hidden-content source and native surface safety
    covers:
      - P-SHADCN-COLLAPSIBLE-VISUAL-SAFETY
      - P-SHADCN-COLLAPSIBLE-TRIGGER-VISUAL-SAFETY
      - P-SHADCN-COLLAPSIBLE-CONTENT-VISUAL-SAFETY
      - P-BRUTALIST-COLLAPSIBLE-VISUAL-SAFETY

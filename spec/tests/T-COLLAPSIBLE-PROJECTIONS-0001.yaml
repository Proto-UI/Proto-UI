      - P-LIQUID-GLASS-COLLAPSIBLE-TRIGGER-BASE-INHERITANCE
      - P-LIQUID-GLASS-COLLAPSIBLE-CONTENT-BASE-INHERITANCE
    expectation: Every actual projection setup retains controlled/uncontrolled requests, disabled suppression, keyboard and focus, role-neutral content, L1 remount, keepMounted, domain isolation and anatomy rejection under four Web adapters. Source tests do not establish native fidelity.

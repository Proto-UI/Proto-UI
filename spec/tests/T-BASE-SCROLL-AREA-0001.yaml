    change: revised
    summary: Reframed Thumb coverage around no independent control semantics while interaction moved to T-SCROLL-COMPOSED-CONTROL-0001.
  - version: 0.2.0-rc.7
    change: revised
    summary: Added family scope and host-projected passive Thumb geometry coverage.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Added Base Scroll Area host-surface and control-boundary coverage.
tags: [test, prototype, base, scroll-area, host-projection]

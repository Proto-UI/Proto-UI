id: T-SHADCN-SWITCH-THUMB-0001
type: test
title: Shadcn Switch Thumb delta protocol contract tests
status: draft
since: 0.2.0-rc.0
summary: Covers Switch Thumb identity, Base indicator inheritance, context-driven checked state, current visual surface, and its bounded upstream composition claim.
cases:
  - id: T-SHADCN-SWITCH-THUMB-0001-CASE-DIRECTIONAL-PREVIEW
    title: Inherited drag preview follows logical direction and rolls back controlled refusal
    covers: [P-SHADCN-SWITCH-THUMB-DIRECTIONAL-PREVIEW]
    expectation: inherited-percentage-projects-without-another-checked-request
  - id: T-SHADCN-SWITCH-THUMB-0001-CASE-VISUAL-SIZE
    title: Family-only default and sm sizes follow the actual logical Root across updates and remounts
    covers: [P-SHADCN-SWITCH-THUMB-VISUAL-SIZE]
    expectation: shadcn-switch-size-is-current-owner-bound-without-value-events
  - id: T-SHADCN-SWITCH-THUMB-0001-CASE-IDENTITY-AND-INHERITANCE
    title: Thumb is a direct unofficial projection that inherits the Base indicator
    covers:
      [
        P-SHADCN-SWITCH-THUMB-UPSTREAM-IDENTITY,
        P-SHADCN-SWITCH-THUMB-BASE-INHERITANCE,
        P-SHADCN-SWITCH-THUMB-CURRENT-BASE-DEVIATIONS,
        P-SHADCN-SWITCH-THUMB-DIRECT-ENTRY,
      ]
    expectation: shadcn-switch-thumb-direct-entry-inherits-as-switch-thumb
  - id: T-SHADCN-SWITCH-THUMB-0001-CASE-CONTEXT-AND-VISUALS
    title: Thumb follows same-domain Root checked state with symmetric end gaps and isolated focus-ring variables
    covers: [P-SHADCN-SWITCH-THUMB-CONTEXT-INDICATOR, P-SHADCN-SWITCH-THUMB-CURRENT-VISUAL-SURFACE]
    expectation: shadcn-switch-thumb-follows-root-translates-symmetrically-and-does-not-inherit-root-ring
  - id: T-SHADCN-SWITCH-THUMB-0001-CASE-COMPATIBILITY-SUBSET
    title: upstream internal composition and remaining token gaps stay outside the passing claim
    covers: [P-SHADCN-SWITCH-THUMB-COMPATIBILITY-SUBSET]
    expectation: shadcn-switch-thumb-does-not-overclaim-upstream-parity
implementations:
  - id: t-shadcn-switch-thumb-directional-projection
    kind: module-test
    status: planned
    path: packages/prototypes/shadcn/test/switch-directional-projection.test.ts
    required: true
    consumesCases: [T-SHADCN-SWITCH-THUMB-0001-CASE-DIRECTIONAL-PREVIEW]
    exercises: [P-SHADCN-SWITCH-THUMB, P-BASE-SWITCH]
    notes:
      - Authored actual WC consumers with synthetic geometry/contact for New York and Rhea LTR/RTL; not executed here and not native capture, layout or seven-other-profile evidence.
  - id: t-shadcn-switch-thumb-0001-size-lifecycle
    kind: module-test
    status: planned
    path: packages/prototypes/shadcn/test/switch-size-lifecycle.test.ts
    required: true
    consumesCases: [T-SHADCN-SWITCH-THUMB-0001-CASE-VISUAL-SIZE]
    exercises: [P-SHADCN-SWITCH, P-SHADCN-SWITCH-THUMB]
    notes:
      - Deterministic Runtime tests cover repeated detach/remount, current-owner rebinding, subscription count and parent-first terminal disposal; no rendered or native-input acceptance.
  - id: t-shadcn-switch-thumb-0001-size-generated-preset
    kind: module-test
    status: planned
    path: packages/prototypes/shadcn/test/switch-size-preset.test.ts
    required: true
    consumesCases: [T-SHADCN-SWITCH-THUMB-0001-CASE-VISUAL-SIZE]
    exercises: [P-SHADCN-SWITCH, P-SHADCN-SWITCH-THUMB]
    notes:
      - Executes the actual generated WC facade against real prototypes for default, replacement and omission; other adapters and packed consumers retain separate gates.
  - id: prototypes-shadcn-switch-thumb-contract
    kind: module-test
    status: planned
    path: packages/prototypes/shadcn/test/switch.test.ts
    required: true
    consumesCases:
      [
        T-SHADCN-SWITCH-THUMB-0001-CASE-VISUAL-SIZE,
        T-SHADCN-SWITCH-THUMB-0001-CASE-IDENTITY-AND-INHERITANCE,
        T-SHADCN-SWITCH-THUMB-0001-CASE-CONTEXT-AND-VISUALS,
        T-SHADCN-SWITCH-THUMB-0001-CASE-COMPATIBILITY-SUBSET,
      ]
    exercises: [P-SHADCN-SWITCH-THUMB, P-BASE-SWITCH-THUMB]
    notes:
      - 'Historical evidence note before the 2026-10-10 recipe migration: Positive tests cover direct identity, inherited context-driven state, and current tokens; public-composition and upstream-token gaps remain bounded by source review and the centralized question.'
      - Historical passing evidence predates the 2026-10-12 New York presentation migration; new source, CSS, packed consumer and browser evidence must be verified separately.

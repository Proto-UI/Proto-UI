id: T-SHADCN-SWITCH-0001
type: test
title: Shadcn Switch Root delta protocol contract tests
status: draft
since: 0.2.0-rc.0
summary: Covers Switch Root identity, Base inheritance, Root/Thumb behavior, the replaceable default-Thumb preset, current styles, intentional asChild omission, and its bounded upstream compatibility claim.
cases:
  - id: T-SHADCN-SWITCH-0001-CASE-SHARED-PROFILES
    title: NY and Rhea retain scope precedence, actual Root visual ownership and bounded hit lease
    covers:
      [
        P-SHADCN-SWITCH-SHARED-PROFILES,
        P-SHADCN-SWITCH-RHEA-SURFACE,
        P-SHADCN-SWITCH-RHEA-HIT-LEASE,
      ]
    expectation: switch-style-profile-and-four-runtime-native-evidence
  - id: T-SHADCN-SWITCH-0001-CASE-VISUAL-SIZE
    title: Family-only default and sm sizes follow the actual logical Root across updates and remounts
    covers:
      [
        P-SHADCN-SWITCH-VISUAL-SIZE-PROP,
        P-SHADCN-SWITCH-VISUAL-SIZE-OWNER,
        P-SHADCN-SWITCH-VISUAL-SIZE-LIFECYCLE,
      ]
    expectation: shadcn-switch-size-is-current-owner-bound-without-value-events
  - id: T-SHADCN-SWITCH-0001-CASE-IDENTITY-AND-INHERITANCE
    title: Root is a direct unofficial projection that inherits Base Switch
    covers:
      [
        P-SHADCN-SWITCH-UPSTREAM-IDENTITY,
        P-SHADCN-SWITCH-BASE-INHERITANCE,
        P-SHADCN-SWITCH-CURRENT-BASE-DEVIATIONS,
        P-SHADCN-SWITCH-DIRECT-ENTRY,
      ]
    expectation: shadcn-switch-root-direct-entry-inherits-as-switch-root
  - id: T-SHADCN-SWITCH-0001-CASE-FAMILY-AND-VISUALS
    title: inherited checked focus and disabled facts coordinate the family while Root keeps symmetric track spacing
    covers:
      [
        P-SHADCN-SWITCH-CURRENT-VISUAL-SURFACE,
        P-SHADCN-SWITCH-STATIC-ACQUISITION,
        P-SHADCN-SWITCH-STATE-DRIVEN-STYLES,
        C-FEEDBACK-STYLE-0003-E,
      ]
    expectation: shadcn-switch-root-state-drives-family-with-symmetric-track-spacing
  - id: T-SHADCN-SWITCH-0001-CASE-COMPATIBILITY-SUBSET
    title: intentional asChild omission and remaining upstream gaps stay outside the passing claim
    covers: [P-SHADCN-SWITCH-COMPATIBILITY-SUBSET, P-SHADCN-SWITCH-AS-CHILD-OMISSION]
    expectation: shadcn-switch-root-does-not-overclaim-upstream-parity
  - id: T-SHADCN-SWITCH-0001-CASE-COMPONENT-PRESET
    title: generated convenience facades mount replaceable default Thumb parts only after Root context exists
    covers: [P-SHADCN-SWITCH-COMPONENT-PRESET, D-COMPONENT-PRESET-MATERIALIZATION-0001-F]
    expectation: shadcn-switch-generated-facades-support-context-safe-default-replacement-and-omission
implementations:
  - id: t-shadcn-switch-0001-size-lifecycle
    kind: module-test
    status: planned
    path: packages/prototypes/shadcn/test/switch-size-lifecycle.test.ts
    required: true
    consumesCases: [T-SHADCN-SWITCH-0001-CASE-VISUAL-SIZE]
    exercises: [P-SHADCN-SWITCH, P-SHADCN-SWITCH-THUMB]
    notes:
      - Deterministic Runtime tests cover repeated detach/remount, current-owner rebinding, subscription count and parent-first terminal disposal; no rendered or native-input acceptance.
  - id: t-shadcn-switch-0001-size-generated-preset
    kind: module-test
    status: planned
    path: packages/prototypes/shadcn/test/switch-size-preset.test.ts
    required: true
    consumesCases: [T-SHADCN-SWITCH-0001-CASE-VISUAL-SIZE]
    exercises: [P-SHADCN-SWITCH, P-SHADCN-SWITCH-THUMB]
    notes:
      - Executes the actual generated WC facade against real prototypes for default, replacement and omission; other adapters and packed consumers retain separate gates.
  - id: prototypes-shadcn-switch-new-york-browser
    kind: module-test
    status: planned
    path: packages/prototypes/shadcn/test/switch-motion.browser.test.ts
    required: true
    consumesCases: [T-SHADCN-SWITCH-0001-CASE-FAMILY-AND-VISUALS]
    exercises: [P-SHADCN-SWITCH, P-SHADCN-SWITCH-THUMB]
    notes:
      - New York default/sm root-16/root-32 browser evidence must be collected afresh for document and shadow surfaces; source/token assertions are not rendered geometry or native activation acceptance.
  - id: prototypes-shadcn-switch-root-contract
    kind: module-test
    status: planned
    path: packages/prototypes/shadcn/test/switch.test.ts
    required: true
    consumesCases:
      [
        T-SHADCN-SWITCH-0001-CASE-VISUAL-SIZE,
        T-SHADCN-SWITCH-0001-CASE-IDENTITY-AND-INHERITANCE,
        T-SHADCN-SWITCH-0001-CASE-FAMILY-AND-VISUALS,
        T-SHADCN-SWITCH-0001-CASE-COMPATIBILITY-SUBSET,
      ]
    exercises: [P-SHADCN-SWITCH, P-BASE-SWITCH]
    notes:
      - 'Historical evidence note before the 2026-10-10 recipe migration: Positive tests cover only the current Proto UI guarantee; asChild omission and remaining parity gaps are bounded by the decision, declared surface, source review, and centralized compatibility question.'
      - Historical passing evidence predates the 2026-10-12 New York presentation migration; new source, CSS, packed consumer and browser evidence must be verified separately.
  - id: cli-shadcn-switch-component-preset
    kind: module-test
    status: planned
    path: packages/cli/test/cli.test.ts
    required: true
    consumesCases: [T-SHADCN-SWITCH-0001-CASE-COMPONENT-PRESET]
    exercises: [P-SHADCN-SWITCH]
    notes:
      - Historical passing evidence predates the 2026-10-12 New York presentation migration; new source, CSS, packed consumer and browser evidence must be verified separately.
  - id: prototypes-shadcn-switch-component-preset-recipe
    kind: module-test
    status: passing
    path: packages/prototypes/shadcn/test/component-presets.test.ts
    required: true
    consumesCases: [T-SHADCN-SWITCH-0001-CASE-COMPONENT-PRESET]
    exercises: [P-SHADCN-SWITCH]
  - id: release-packed-cli-switch-component-preset
    kind: workspace-check
    status: planned
    path: scripts/release/consumer-smoke-cli.mjs
    required: true
    consumesCases: [T-SHADCN-SWITCH-0001-CASE-COMPONENT-PRESET]
    exercises: [P-SHADCN-SWITCH, P-SHADCN-SWITCH-THUMB]
    notes:
      - Historical passing evidence predates the 2026-10-12 New York presentation migration; new source, CSS, packed consumer and browser evidence must be verified separately.

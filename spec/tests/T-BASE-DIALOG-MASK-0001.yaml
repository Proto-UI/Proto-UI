id: T-BASE-DIALOG-MASK-0001
type: test
title: Base Dialog Mask protocol contract tests
status: draft
since: 0.2.0-rc.0
summary: Covers modal backdrop ownership, Transition-backed presence, passthrough, and the absence of independent dismissal policy.
cases:
  - id: T-BASE-DIALOG-MASK-0001-CASE-DEFAULT-FOCUS
    title: Participating backdrop does not steal restored focus through a native default action
    covers:
      [P-BASE-DIALOG-MASK-MODAL, P-BASE-DIALOG-MASK-NO-DISMISS, P-BASE-DIALOG-MASK-PASSTHROUGH]
    expectation: prevent-default-focus-without-owning-dismissal-or-affecting-passthrough
  - id: T-BASE-DIALOG-MASK-0001-CASE-PRESENCE
    title: Mask retains modal resources and its view through leave
    covers:
      - P-BASE-DIALOG-MASK-AUTHORING-ENTRIES
      - P-BASE-DIALOG-MASK-MODAL
      - P-BASE-DIALOG-MASK-PRESENCE
    expectation: dialog-mask-releases-modal-resources-and-detaches-after-leave
  - id: T-BASE-DIALOG-MASK-0001-CASE-PARTICIPATION
    title: Mask passthrough changes hit participation without owning dismissal
    covers:
      - P-BASE-DIALOG-MASK-PASSTHROUGH
      - P-BASE-DIALOG-MASK-NO-DISMISS
    expectation: dialog-mask-passthrough-does-not-change-dialog-open
  - id: T-BASE-DIALOG-MASK-0001-CASE-DEFAULT-ACTION
    title: Participating Mask protects Content focus return without intercepting passthrough or Content controls
    covers:
      - P-BASE-DIALOG-MASK-DEFAULT-ACTION
      - P-BASE-DIALOG-MASK-NO-DISMISS
      - P-BASE-DIALOG-MASK-PASSTHROUGH
    expectation: dialog-mask-default-prevention-respects-content-owner-and-passthrough
  - id: T-BASE-DIALOG-MASK-0001-CASE-POINTER-OWNER
    title: Root pointer routing excludes independent descendant owners and retains native bubbling
    covers:
      - C-EVENT-0003-E
    expectation: ancestor-mask-cannot-consume-descendant-owned-pointer-down
implementations:
  - id: web-pointer-root-owner-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/base/test/contract/pointer-root-ownership.v0.contract.test.ts
    required: true
    consumesCases:
      - T-BASE-DIALOG-MASK-0001-CASE-POINTER-OWNER
  - id: prototypes-base-dialog-mask-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/dialog.test.ts
    required: true
    consumesCases:
      - T-BASE-DIALOG-MASK-0001-CASE-DEFAULT-FOCUS
      - T-BASE-DIALOG-MASK-0001-CASE-PRESENCE
      - T-BASE-DIALOG-MASK-0001-CASE-PARTICIPATION
      - T-BASE-DIALOG-MASK-0001-CASE-DEFAULT-ACTION
    exercises: [P-BASE-DIALOG-MASK]
verifies:
  contracts:
    - id: C-EVENT-0003
      anchors: [C-EVENT-0003-E]
  prototypes:
    - id: P-BASE-DIALOG-MASK
      anchors:
        - P-BASE-DIALOG-MASK-PRESENCE
        - P-BASE-DIALOG-MASK-PASSTHROUGH
        - P-BASE-DIALOG-MASK-NO-DISMISS
        - P-BASE-DIALOG-MASK-DEFAULT-ACTION
exercises: { prototypes: [P-BASE-DIALOG-MASK] }
revisions:
  - version: 0.3.0-alpha.1
    change: extended
    summary: Added real Web Component default-prevention, Content focus-return, Alert Dialog policy and passthrough transition coverage; arbitrary unowned Mask descendants are outside this case.
  - { version: 0.2.0-rc.0, change: introduced, summary: Added Dialog Mask protocol coverage. }
tags: [prototype, base, dialog, mask, test]

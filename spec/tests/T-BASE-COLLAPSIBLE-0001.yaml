      - T-BASE-COLLAPSIBLE-0001-CASE-ANATOMY-CARDINALITY
      - T-BASE-COLLAPSIBLE-0001-CASE-AUTHORING-CONSUMER
    exercises: [P-BASE-COLLAPSIBLE, P-BASE-COLLAPSIBLE-TRIGGER, P-BASE-COLLAPSIBLE-CONTENT]
    notes:
      - Focused assertions executed with the real Web Component owner under happy-dom, including controlled requests, synthetic Enter/Space, L1/retention, controls, domains, terminal replacement and all three authored asHooks.
      - Added discriminating synchronous-owner-acceptance, live Trigger/Content reparent and maximum, and detached Content wake cases after independent source review. Settled minimum inspects real ready parts, not a new completion signal or continuous minimum.
      - Additional executed regressions cover controlled/disabled requests during Root L1, interrupted Trigger pointer facts, and initial replacement-Root admission of already-created detached duplicates. Negative minimum conformance queries the actual Runtime Anatomy port after a controlled host acknowledges its mount commit, rather than adding an author-facing completion flag or automatic throw.
      - Executed cold adoption preserves an already-detached Trigger's logical identity while rebinding expanded and disabled to its new default-closed Root before rematerialization. Live adoption of an already-detached Content into a retained detached Root rejects the second logical role through existing membership guards, without keeping view-order observers alive.
      - Rejected live Trigger and Content adoption preserves both accepted logical memberships and exposed identity, including a detached destination Root, and permits a subsequent valid adoption. Moving a Trigger outside all Proto ancestors withdraws its former membership and controls and reports the normal invalid-claim error rather than borrowing the old provider. These assertions do not promise rollback of author-owned DOM moves.
      - An earlier-created, reused Trigger can request opening synchronously from its disabled-state subscriber during Root synchronization. The executed regression emits only that programmatic request and keeps Root, the current context provider, Trigger and Content canonically open when the older publication resumes.
      - Distinct accepted requests retain their individual openChange payloads when an expanded-state subscriber makes a nested closing request before Root receives the opening envelope. Canonical facts follow the current provider, not the older request; later prop synchronization does not replay either signal and a subsequent request remains live. Callback delivery order is not asserted as a portable guarantee.
      - A reused Trigger's expanded-state observer can synchronously disable its Root during an accepted opening request. Root synchronization preserves the current request envelope and pending uncontrolled expansion; Trigger derives disabled and sequential-focus eligibility from the post-observer owner fact. Re-enabling emits no synchronization signal, and subsequent closing and opening requests each retain their own payload.
      - Synchronous disabled-state observers can restore the owner's prior disabled value in either direction. Settled Trigger disabled and rendered tabIndex agree with that final input; guarded focusSelf rejects the disabled result and actually focuses the enabled result under happy-dom, without rewriting controlled expansion or emitting openChange. This is bounded final-state consistency, not an atomic multi-state notification or native Tab/viewport guarantee.
      - Compiled generated CLI-consumer provenance is recorded separately with the change. No native input, browser paint, OS accessibility or complete relationship-service conformance is claimed.

id: T-BASE-COLLAPSIBLE-0001
type: test
title: Base Collapsible complete bounded disclosure evidence
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: 十一项 cases 描述 Issue 388 接受的完整 Collapsible slice；Base 与四种真实 Web framework owner 的 focused tests 已在 synthetic DOM 执行通过，浏览器 mapping 已实现并注册但尚未执行。保留 draft，等待完整宿主证据、精确 revision 与独立稳定准入审查；passing mapping 不是 native fidelity 或稳定保证。
  en: Eleven cases describe the complete accepted Issue 388 Collapsible slice. Focused Base and four real Web framework-owner tests passed under a synthetic DOM; the implemented and registered browser mapping is unexecuted. This entity remains draft pending complete host evidence, exact revision binding and independent stable-admission review. A passing mapping is not native fidelity or a stable guarantee.
summary: Executed synthetic-DOM Base and four Web Adapter evidence with a separately unexecuted public-browser mapping.
statement:
  zh-CN: 五个 focused implementation 覆盖 Base 与四种 Web Adapter；第六个 public-browser mapping 单独承担实际输入与可见 surface 的证据，当前尚未执行。各 mapping 的 notes 限定已检查的子范围；passing 标记不是新鲜运行、native browser 或独立 approval，运行结果仍须由 provenance 绑定实际源 revision。稳定准入与实现完成是分开的决定。
  en: Five focused implementations cover Base and four Web Adapters; a sixth public-browser mapping separately exercises actual input and visible surfaces and is unexecuted. Each mapping’s notes bound its checked subsets. A passing label is neither a fresh run, native browser evidence nor independent approval; execution results still require provenance bound to the actual source revision. Stable admission and implementation completion remain separate decisions.
cases:
  - id: T-BASE-COLLAPSIBLE-0001-CASE-UNCONTROLLED
    title: Uncontrolled creation and requests keep one canonical open fact
    covers:
      - P-BASE-COLLAPSIBLE-ROOT-OWNER
      - P-BASE-COLLAPSIBLE-PROPS
      - P-BASE-COLLAPSIBLE-DEFAULT-OPEN
      - P-BASE-COLLAPSIBLE-REQUEST-ONLY
      - P-BASE-COLLAPSIBLE-CONTEXT
      - P-BASE-COLLAPSIBLE-NO-SYNC-EVENTS
      - P-BASE-COLLAPSIBLE-TRIGGER-EXPANDED
      - P-BASE-COLLAPSIBLE-CONTENT-DERIVED-STATES
    expectation: An uncontrolled Root initializes from defaultOpen once, then accepted pointer/keyboard or openCollapsible/close/toggle requests update canonical open and emit the requested open with normalized reason. Later defaultOpen changes and repeated mounts preserve user expansion; initialization and synchronization emit no openChange.
  - id: T-BASE-COLLAPSIBLE-0001-CASE-CONTROLLED
    title: Controlled requests never optimistically alter canonical or derived facts
    covers:
      - P-BASE-COLLAPSIBLE-PROPS
      - P-BASE-COLLAPSIBLE-DEFAULT-OPEN
      - P-BASE-COLLAPSIBLE-REQUEST-ONLY
      - P-BASE-COLLAPSIBLE-CONTROLLED
      - P-BASE-COLLAPSIBLE-NO-SYNC-EVENTS
      - P-BASE-COLLAPSIBLE-TRIGGER-EXPANDED
      - P-BASE-COLLAPSIBLE-CONTENT-DERIVED-STATES
    expectation: With owner open supplied, both opening and closing requests emit request-only openChange while Root open, Trigger expanded and Content open/hidden/presence stay at the owner's fact. Updating owner open synchronizes all derived facts without an event; defaultOpen cannot override owner input.
  - id: T-BASE-COLLAPSIBLE-0001-CASE-DISABLED
    title: Root and local Trigger disabled suppress requests and sequential focus without state rewrite
    covers:
      - P-BASE-COLLAPSIBLE-DISABLED
      - P-BASE-COLLAPSIBLE-NO-SYNC-EVENTS
      - P-BASE-COLLAPSIBLE-TRIGGER-DISABLED
      - P-BASE-COLLAPSIBLE-TRIGGER-FOCUS
      - P-BASE-COLLAPSIBLE-TRIGGER-INTERACTION-EXPOSES
    expectation: Root disabled or local Trigger disabled produces effectively disabled Trigger semantics, removes sequential focus and guards focusSelf/activation. Root disabled also suppresses imperative requests. Neither source of disabled rewrites expansion or emits openChange; controlled owner open updates remain authoritative while disabled.
  - id: T-BASE-COLLAPSIBLE-0001-CASE-ACTIVATION
    title: Portable press commits supply the natural Tab and Enter/Space disclosure baseline
    covers:
      - P-BASE-COLLAPSIBLE-REQUEST-ONLY
      - P-BASE-COLLAPSIBLE-BOUNDARIES
      - P-BASE-COLLAPSIBLE-TRIGGER-A11Y
      - P-BASE-COLLAPSIBLE-TRIGGER-FOCUS
      - P-BASE-COLLAPSIBLE-TRIGGER-ACTIVATION
      - P-BASE-COLLAPSIBLE-TRIGGER-INTERACTION-EXPOSES
      - P-BASE-COLLAPSIBLE-TRIGGER-KEYBOARD-BOUNDARY
      - P-BASE-COLLAPSIBLE-CONTENT-NO-FOCUS
    expectation: Enabled button-like Trigger uses natural sequential focus and one successful portable press commit per toggle, with pointer/keyboard reasons and focused Space default prevention. Incomplete/cancelled presses do not toggle; hover/press/focus facts remain transient. Focus alone and Arrow/Home/End cause no toggle, roving or automatic movement into Content.
  - id: T-BASE-COLLAPSIBLE-0001-CASE-RELATIONSHIP
    title: Explicit content match keys resolve controls through the reusable relationship service
    covers:
      - P-BASE-COLLAPSIBLE-TRIGGER-A11Y
      - P-BASE-COLLAPSIBLE-TRIGGER-RELATIONSHIP
      - P-BASE-COLLAPSIBLE-TRIGGER-NO-HOST-IDENTITY
      - P-BASE-COLLAPSIBLE-CONTENT-ROLE-NEUTRAL
      - P-BASE-COLLAPSIBLE-CONTENT-RELATIONSHIP-IDENTITY
      - P-BASE-COLLAPSIBLE-CONTENT-NO-FOCUS
    expectation: Both endpoints use the explicit protocol key content; Web controls resolves only to the uniquely materialized Content in the same domain with an opaque reserved identity. Missing/ambiguous targets and host-id conflicts fail closed without guessing or overwriting host authors. Trigger exposes button/name/expanded semantics; Content adds no region, tabpanel, heading or automatic focus stop.
    notes:
      - Service tuple, identity ownership and non-destructive lease behavior remain governed by draft C-A11Y-PART-RELATIONSHIP-0001; this case verifies Collapsible use rather than claiming complete service conformance.
  - id: T-BASE-COLLAPSIBLE-0001-CASE-L1-LIFECYCLE
    title: Initially closed and repeatedly detached Content preserve only governed logical identity
    covers:
      - P-BASE-COLLAPSIBLE-CARDINALITY
      - P-BASE-COLLAPSIBLE-NO-SYNC-EVENTS
      - P-BASE-COLLAPSIBLE-CONTENT-PRESENCE-POLICY
      - P-BASE-COLLAPSIBLE-CONTENT-INITIAL-L1
      - P-BASE-COLLAPSIBLE-CONTENT-L1
      - P-BASE-COLLAPSIBLE-CONTENT-RELATIONSHIP-IDENTITY
    expectation: Created callback intent prevents the initial closed view from rendering/committing/mounting or flashing. Repeated open/close cycles detach and rematerialize the view while preserving logical state, props, context, exposes and setup identity, not promising host child/native-view state. Detach withdraws service-owned controls before removal; rematerialization restores the reserved target identity and controls before visible commit, with stale epochs inert and no lifecycle openChange.
  - id: T-BASE-COLLAPSIBLE-0001-CASE-KEEP-MOUNTED
    title: Explicit retention keeps a complete closed view hidden and responds to policy changes
    covers:
      - P-BASE-COLLAPSIBLE-NO-SYNC-EVENTS
      - P-BASE-COLLAPSIBLE-CONTENT-DERIVED-STATES
      - P-BASE-COLLAPSIBLE-CONTENT-PRESENCE-POLICY
      - P-BASE-COLLAPSIBLE-CONTENT-KEEP-MOUNTED
      - P-BASE-COLLAPSIBLE-CONTENT-NO-FOCUS
    expectation: keepMounted=true retains the closed view with hidden accessibility and feedback projection, without autofocus or a new Tab stop. Switching keepMounted against current canonical open reconciles retention/detachment and derived hidden without changing open or emitting openChange.
  - id: T-BASE-COLLAPSIBLE-0001-CASE-DOMAIN-ISOLATION
    title: Sibling and nested Collapsibles isolate ownership, disabled and controls
    covers:
      - P-BASE-COLLAPSIBLE-CONTEXT
      - P-BASE-COLLAPSIBLE-TRIGGER-SAME-DOMAIN
      - P-BASE-COLLAPSIBLE-TRIGGER-RELATIONSHIP
      - P-BASE-COLLAPSIBLE-CONTENT-SAME-DOMAIN
      - P-BASE-COLLAPSIBLE-CONTENT-RELATIONSHIP-IDENTITY
    expectation: Independent sibling and nested Roots with the same constant protocol match key each control only their own Content; activation, disabled, open, hidden and presence updates remain local to the matching anatomy domain, never resolving another domain's target by host order.
  - id: T-BASE-COLLAPSIBLE-0001-CASE-TERMINAL-CLEANUP
    title: Terminal owner teardown removes leases and rejects stale resurrection
    covers:
      - P-BASE-COLLAPSIBLE-NO-SYNC-EVENTS
      - P-BASE-COLLAPSIBLE-TRIGGER-NO-HOST-IDENTITY
      - P-BASE-COLLAPSIBLE-CONTENT-TERMINAL-DISPOSAL
      - P-BASE-COLLAPSIBLE-CONTENT-RELATIONSHIP-IDENTITY
    expectation: Terminal disposal from retained or detached states releases owned subscriptions, service records, controls contributions and identity leases without overwriting host/independent contributions. Stale callbacks cannot reattach the disposed owner or emit lifecycle openChange; a new same-tuple instance is not rejected due to stale registry entries.
  - id: T-BASE-COLLAPSIBLE-0001-CASE-ANATOMY-CARDINALITY
    title: One Root, Trigger and Content are required with immediate max and readiness-settled min
    covers:
      - P-BASE-COLLAPSIBLE-ANATOMY
      - P-BASE-COLLAPSIBLE-CARDINALITY
      - P-BASE-COLLAPSIBLE-TRIGGER-A11Y
      - P-BASE-COLLAPSIBLE-CONTENT-ROLE-NEUTRAL
    expectation: The canonical family declares root/trigger/content each 1..1 with root contains trigger/content. Duplicate claims reject immediately. An explicit settled-composition conformance query after host readiness reports an absent Trigger or Content as a family error, following C-ANATOMY-0010; it is not an automatic runtime admission exception during construction or closed L1 detach. No invented completion signal or automatic part creation supplies missing anatomy.
  - id: T-BASE-COLLAPSIBLE-0001-CASE-AUTHORING-CONSUMER
    title: Public direct and authored-asHook consumers share one independent disclosure protocol
    covers:
      - P-BASE-COLLAPSIBLE-IDENTITY
      - P-BASE-COLLAPSIBLE-AUTHORING-ENTRIES
      - P-BASE-COLLAPSIBLE-PROTOCOL-INDEPENDENCE
      - P-BASE-COLLAPSIBLE-ROOT-OWNER
      - P-BASE-COLLAPSIBLE-PROPS
      - P-BASE-COLLAPSIBLE-BOUNDARIES
      - P-BASE-COLLAPSIBLE-TRIGGER-AUTHORING-ENTRIES
      - P-BASE-COLLAPSIBLE-TRIGGER-INDEPENDENCE
      - P-BASE-COLLAPSIBLE-TRIGGER-KEYBOARD-BOUNDARY
      - P-BASE-COLLAPSIBLE-CONTENT-AUTHORING-ENTRIES
      - P-BASE-COLLAPSIBLE-CONTENT-ROLE-NEUTRAL
      - P-BASE-COLLAPSIBLE-CONTENT-NO-FOCUS
    expectation: Real consumers use collapsibleRoot/Trigger/Content and asCollapsibleRoot/Trigger/Content through @proto.ui/prototypes-base/collapsible with the canonical names and COLLAPSIBLE_FAMILY/COLLAPSIBLE_CONTEXT. Both authoring entries support the same canonical Root requests and part facts without importing a different Base protocol, Accordion group ownership, heading/region, roving, Overlay, new Host Capability or automatic focus behavior.

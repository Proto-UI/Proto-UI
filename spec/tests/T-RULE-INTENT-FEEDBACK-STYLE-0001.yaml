id: T-RULE-INTENT-FEEDBACK-STYLE-0001
type: test
title: Rule feedback.style intent tests
status: draft
since: 0.1.0
summary: Contract tests for the stable v0 feedback.style Rule intent, including style handle constraints, declaration-order collection, semantic merge, and deactivation cleanup.
cases:
  - id: T-RULE-INTENT-FEEDBACK-STYLE-0001-CASE-STABLE-CHANNEL
    title: i.feedback.style.use is the stable v0 Rule intent channel
    covers:
      - C-RULE-INTENT-FEEDBACK-STYLE-0001-A
    expectation: stable-feedback-style-intent-channel
  - id: T-RULE-INTENT-FEEDBACK-STYLE-0001-CASE-HANDLE-CONSTRAINTS
    title: Rule style intent accepts only feedback.style handles that obey token constraints
    covers:
      - C-RULE-INTENT-FEEDBACK-STYLE-0001-B
    expectation: feedback-style-handle-token-constraints
  - id: T-RULE-INTENT-FEEDBACK-STYLE-0001-CASE-DECLARATION-ORDER
    title: Active Rule style tokens are collected in Rule declaration order
    covers:
      - C-RULE-INTENT-FEEDBACK-STYLE-0001-C
      - C-RULE-RUNTIME-0001-B
    expectation: active-style-token-declaration-order
  - id: T-RULE-INTENT-FEEDBACK-STYLE-0001-CASE-SEMANTIC-MERGE
    title: Collected style tokens pass through feedback semantic merge instead of last-write-wins
    covers:
      - C-RULE-INTENT-FEEDBACK-STYLE-0001-D
    expectation: rule-style-semantic-merge
  - id: T-RULE-INTENT-FEEDBACK-STYLE-0001-CASE-DEACTIVATION
    title: Deactivated Rules remove only their own style token contribution on the next evaluation
    covers:
      - C-RULE-INTENT-FEEDBACK-STYLE-0001-E
      - C-RULE-RUNTIME-0001-A
    expectation: rule-style-deactivation-cleanup
implementations:
  - id: rule-matrix-fixture
    kind: fixture
    status: active
    path: packages/runtime/test/contract/rule.matrix.fixture.ts
    required: true
    consumesCases:
      - T-RULE-INTENT-FEEDBACK-STYLE-0001-CASE-STABLE-CHANNEL
      - T-RULE-INTENT-FEEDBACK-STYLE-0001-CASE-DECLARATION-ORDER
      - T-RULE-INTENT-FEEDBACK-STYLE-0001-CASE-SEMANTIC-MERGE
      - T-RULE-INTENT-FEEDBACK-STYLE-0001-CASE-DEACTIVATION
  - id: runtime-rule-matrix-intent-contract
    kind: runtime-test
    status: planned
    path: packages/runtime/test/contract/rule.matrix.intent.v0.contract.test.ts
    required: true
    consumesCases:
      - T-RULE-INTENT-FEEDBACK-STYLE-0001-CASE-STABLE-CHANNEL
      - T-RULE-INTENT-FEEDBACK-STYLE-0001-CASE-DECLARATION-ORDER
      - T-RULE-INTENT-FEEDBACK-STYLE-0001-CASE-SEMANTIC-MERGE
      - T-RULE-INTENT-FEEDBACK-STYLE-0001-CASE-DEACTIVATION
  - id: runtime-rule-feedback-style-contract
    kind: runtime-test
    status: planned
    path: packages/runtime/test/contract/feedback.style.setup-only.v0.contract.test.ts
    required: true
    consumesCases:
      - T-RULE-INTENT-FEEDBACK-STYLE-0001-CASE-HANDLE-CONSTRAINTS
      - T-RULE-INTENT-FEEDBACK-STYLE-0001-CASE-DECLARATION-ORDER
      - T-RULE-INTENT-FEEDBACK-STYLE-0001-CASE-SEMANTIC-MERGE
      - T-RULE-INTENT-FEEDBACK-STYLE-0001-CASE-DEACTIVATION
verifies:
  contracts:
    - id: C-RULE-INTENT-FEEDBACK-STYLE-0001
      anchors:
        - C-RULE-INTENT-FEEDBACK-STYLE-0001-A
        - C-RULE-INTENT-FEEDBACK-STYLE-0001-B
        - C-RULE-INTENT-FEEDBACK-STYLE-0001-C
        - C-RULE-INTENT-FEEDBACK-STYLE-0001-D
        - C-RULE-INTENT-FEEDBACK-STYLE-0001-E
    - id: C-RULE-RUNTIME-0001
      anchors:
        - C-RULE-RUNTIME-0001-A
        - C-RULE-RUNTIME-0001-B
revisions:
  - version: 0.1.0
    change: introduced
    summary: Added stable feedback.style Rule intent test mapping.
tags:
  - rule
  - intent
  - feedback
  - style
  - contract-test

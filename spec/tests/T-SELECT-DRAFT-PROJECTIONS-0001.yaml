    kind: module-test
    status: passing
    required: true
    path: packages/cli/test/select-projections.test.ts
    consumesCases:
      - T-SELECT-DRAFT-PROJECTIONS-0001-CASE-DIRECT-ENTRY
      - T-SELECT-DRAFT-PROJECTIONS-0001-CASE-VISUAL-SAFETY
    exercises: *a1
  - id: real-framework-previewer
    kind: adapter-test
    status: passing
    required: true
    path: apps/www/src/components/PrototypePreviewer/select-draft-projections.integration.test.ts
    consumesCases:
      - T-SELECT-DRAFT-PROJECTIONS-0001-CASE-BASE-INHERITANCE
      - T-SELECT-DRAFT-PROJECTIONS-0001-CASE-DIRECT-ENTRY
      - T-SELECT-DRAFT-PROJECTIONS-0001-CASE-VISUAL-SAFETY
    exercises: *a1
  - id: liquid-material-intent
    kind: runtime-test
    status: passing
    required: true
    path: packages/prototypes/liquid-glass/test/select-material.test.ts
    consumesCases:
      - T-SELECT-DRAFT-PROJECTIONS-0001-CASE-MATERIAL-INTENT
    exercises: *a1
  - id: native-browser
    kind: workspace-check
    status: planned
    required: true
    path: apps/www/src/content/docs/zh-cn/demo-select-draft-projections.browser.test.ts
    consumesCases:
      - T-SELECT-DRAFT-PROJECTIONS-0001-CASE-BASE-INHERITANCE
      - T-SELECT-DRAFT-PROJECTIONS-0001-CASE-VISUAL-SAFETY
    exercises: *a1

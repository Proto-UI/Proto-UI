id: T-SELECT-DRAFT-PROJECTIONS-0001
type: test
title: Complete Bootstrap and Liquid Select projection evidence
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Retain draft until native browser/GPUI and applicable optical paint evidence, independent review and stable admission complete.
summary: Ten direct projected Select parts with explicitly separated source, runtime, compiler, composed Web and native evidence.
cases:
  - id: T-SELECT-DRAFT-PROJECTIONS-0001-CASE-BASE-INHERITANCE
    title: Complete single-selection protocol through direct Base consumers
    covers:
      - P-BOOTSTRAP-2-3-2-SELECT-BASE-INHERITANCE
      - P-BOOTSTRAP-2-3-2-SELECT-TRIGGER-BASE-INHERITANCE
      - P-BOOTSTRAP-2-3-2-SELECT-VALUE-BASE-INHERITANCE
      - P-BOOTSTRAP-2-3-2-SELECT-CONTENT-BASE-INHERITANCE
      - P-BOOTSTRAP-2-3-2-SELECT-ITEM-BASE-INHERITANCE
      - P-LIQUID-GLASS-SELECT-BASE-INHERITANCE
      - P-LIQUID-GLASS-SELECT-TRIGGER-BASE-INHERITANCE
      - P-LIQUID-GLASS-SELECT-VALUE-BASE-INHERITANCE
      - P-LIQUID-GLASS-SELECT-CONTENT-BASE-INHERITANCE
      - P-LIQUID-GLASS-SELECT-ITEM-BASE-INHERITANCE
    expectation: Controlled/uncontrolled requests, disabled suppression, selected-text derivation, accessible relationships, keyboard/typeahead, pointer active separation, dismissal, focus restoration and portal presence remain Base-owned.
  - id: T-SELECT-DRAFT-PROJECTIONS-0001-CASE-DIRECT-ENTRY
    title: All five public source parts and four-Web CLI facades
    covers:
      - P-BOOTSTRAP-2-3-2-SELECT-DIRECT-ENTRY
      - P-BOOTSTRAP-2-3-2-SELECT-TRIGGER-DIRECT-ENTRY
      - P-BOOTSTRAP-2-3-2-SELECT-VALUE-DIRECT-ENTRY
      - P-BOOTSTRAP-2-3-2-SELECT-CONTENT-DIRECT-ENTRY
      - P-BOOTSTRAP-2-3-2-SELECT-ITEM-DIRECT-ENTRY
      - P-LIQUID-GLASS-SELECT-DIRECT-ENTRY
      - P-LIQUID-GLASS-SELECT-TRIGGER-DIRECT-ENTRY
      - P-LIQUID-GLASS-SELECT-VALUE-DIRECT-ENTRY
      - P-LIQUID-GLASS-SELECT-CONTENT-DIRECT-ENTRY
      - P-LIQUID-GLASS-SELECT-ITEM-DIRECT-ENTRY
    expectation: All five private source exports and complete WC/React/Vue/Vue2 workspace facades resolve; installed-consumer mode and GPUI hosts reject unsupported use.
  - id: T-SELECT-DRAFT-PROJECTIONS-0001-CASE-VISUAL-SAFETY
    title: Bounded readable layout and real family toolbar
    covers:
      - P-BOOTSTRAP-2-3-2-SELECT-VISUAL-SAFETY
      - P-BOOTSTRAP-2-3-2-SELECT-TRIGGER-VISUAL-SAFETY
      - P-BOOTSTRAP-2-3-2-SELECT-VALUE-VISUAL-SAFETY
      - P-BOOTSTRAP-2-3-2-SELECT-CONTENT-VISUAL-SAFETY
      - P-BOOTSTRAP-2-3-2-SELECT-ITEM-VISUAL-SAFETY
      - P-LIQUID-GLASS-SELECT-VISUAL-SAFETY
      - P-LIQUID-GLASS-SELECT-TRIGGER-VISUAL-SAFETY
      - P-LIQUID-GLASS-SELECT-VALUE-VISUAL-SAFETY
      - P-LIQUID-GLASS-SELECT-CONTENT-VISUAL-SAFETY
      - P-LIQUID-GLASS-SELECT-ITEM-VISUAL-SAFETY
    expectation: Source checks establish logical alignment, shrinkability, full token closure and wrapping. Actual framework composition exercises native owner boundaries and family toolbar controls. Native browser geometry/input/paint must be separately executed.
  - id: T-SELECT-DRAFT-PROJECTIONS-0001-CASE-MATERIAL-INTENT
    title: Shared whole optical intent and view lifecycle
    covers:
      - P-LIQUID-GLASS-SELECT-TRIGGER-MATERIAL-INTENT
      - P-LIQUID-GLASS-SELECT-CONTENT-MATERIAL-INTENT
      - P-BASE-SELECT-TRIGGER-VIEW-LIFETIME
    expectation: A real Runtime records mutually exclusive Trigger rest/pressed, Content open intent, disabled/cancel/withdrawal resets, view release/remount and opaque fallback without a visual sink; no optical paint or GPUI execution is inferred.
implementations:
  - id: projection-protocol
    kind: adapter-test
    status: passing
    required: true
    path: packages/prototypes/test-utils/test/select-projections.behavior.test.ts
    consumesCases:
      - T-SELECT-DRAFT-PROJECTIONS-0001-CASE-BASE-INHERITANCE
      - T-SELECT-DRAFT-PROJECTIONS-0001-CASE-VISUAL-SAFETY
    exercises: &a1
      - P-BOOTSTRAP-2-3-2-SELECT
      - P-BOOTSTRAP-2-3-2-SELECT-TRIGGER
      - P-BOOTSTRAP-2-3-2-SELECT-VALUE
      - P-BOOTSTRAP-2-3-2-SELECT-CONTENT
      - P-BOOTSTRAP-2-3-2-SELECT-ITEM
      - P-LIQUID-GLASS-SELECT
      - P-LIQUID-GLASS-SELECT-TRIGGER
      - P-LIQUID-GLASS-SELECT-VALUE
      - P-LIQUID-GLASS-SELECT-CONTENT
      - P-LIQUID-GLASS-SELECT-ITEM
      - P-BASE-SELECT-TRIGGER

      - P-BRUTALIST-CARD-HEADER
      - P-BRUTALIST-CARD-CONTENT
      - P-BRUTALIST-CARD-FOOTER
  - id: website-brutalist-remaining-browser-card
    kind: adapter-test
    status: planned
    path: apps/www/src/content/docs/zh-cn/demo-brutalist-remaining.browser.test.ts

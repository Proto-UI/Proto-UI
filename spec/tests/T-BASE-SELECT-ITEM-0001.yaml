  - version: 0.3.0-alpha.1
    change: refined
    summary: Prepare two current-canonical disabled reentry cases and a new dependency-bound 23-case composition without reclassifying historical union81c failure or transferring separate producer acceptance.
  - version: 0.3.0-alpha.1
    change: refined
    summary: 'Defined mouse-focus handoff and negative controls, preserving the historical non-focused-only leave criterion and explicit oracle delta. Fixed union81c source evidence is partial: new fixture20/21 with a shared producer getter failure; existing Select suite26/26. No native, four compiled or stable acceptance is claimed.'
  - version: 0.2.0-rc.0
    change: introduced
    summary: Added Item collection, a11y, state separation, commit, controlled ownership, close policy, and disabled coverage.
  - version: 0.3.0-alpha.1
    change: clarified

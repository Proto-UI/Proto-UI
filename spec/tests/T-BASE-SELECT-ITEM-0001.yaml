id: T-BASE-SELECT-ITEM-0001
type: test
title: Base Select Item protocol tests
status: draft
since: 0.2.0-rc.0
summary: Covers ordered option metadata, option a11y, active and selected separation, controlled and uncontrolled commits, close policy, and disabled gating.
cases:
  - id: T-BASE-SELECT-ITEM-0001-CASE-METADATA-FOCUS-ORDER
    title: Disabled focused selection retires to Trigger and enabled repair restores eligibility
    covers: [P-BASE-SELECT-ITEM-METADATA-FOCUS-ORDER]
    expectation: disabled-abort-preserves-focus-ownership-and-enabled-recovery-can-focus
  - id: T-BASE-SELECT-ITEM-0001-CASE-LOCAL-TAB
    title: Original Item Tab route remains unique under synchronous focus changes
    covers: [P-BASE-SELECT-ITEM-LOCAL-TAB]
    expectation: one-original-event-one-close-request-and-next-independent-event-remains-valid
  - id: T-BASE-SELECT-ITEM-0001-CASE-COLLECTION-A11Y
    title: Item publishes ordered option metadata and accessible option facts
    covers:
      [P-BASE-SELECT-ITEM-AUTHORING-ENTRIES, P-BASE-SELECT-ITEM-COLLECTION, P-BASE-SELECT-ITEM-A11Y]
    expectation: select-item-is-an-ordered-named-option
  - id: T-BASE-SELECT-ITEM-0001-CASE-STATE-SEPARATION
    title: Focus and pointer update active without changing committed selected
    covers: [P-BASE-SELECT-ITEM-STATE-SEPARATION]
    expectation: select-item-active-navigation-remains-distinct-from-selected
  - id: T-BASE-SELECT-ITEM-0001-CASE-TRANSIENT-RESET
    title: Pointer leave and popup close clear stale Item highlight and focus facts
    covers: [P-BASE-SELECT-ITEM-STATE-SEPARATION]
    expectation: select-item-transient-interaction-state-never-survives-leave-or-close
  - id: T-BASE-SELECT-ITEM-0001-CASE-COMMIT
    title: Enabled activation emits select, requests value, and applies close policy under controlled ownership
    covers: [P-BASE-SELECT-ITEM-COMMIT, P-BASE-SELECT-ITEM-CONTROLLED]
    expectation: select-item-commit-arbitrates-value-and-open-independently
  - id: T-BASE-SELECT-ITEM-0001-CASE-DISABLED
    title: Disabled Item is unavailable to navigation and cannot activate or close
    covers: [P-BASE-SELECT-ITEM-DISABLED]
    expectation: disabled-select-item-never-focuses-selects-or-closes
implementations:
  - id: select-item-metadata-synchronous-disposal
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/select-metadata-disposal.test.ts
    required: true
    consumesCases: [T-BASE-SELECT-ITEM-0001-CASE-METADATA-FOCUS-ORDER]
    exercises: [P-BASE-SELECT-ITEM]
  - id: shadcn-select-item-local-tab
    kind: module-test
    status: passing
    path: packages/prototypes/shadcn/test/select-alignment-owner.test.ts
    required: true
    consumesCases:
      [T-BASE-SELECT-ITEM-0001-CASE-LOCAL-TAB, T-BASE-SELECT-ITEM-0001-CASE-METADATA-FOCUS-ORDER]
    exercises: [P-BASE-SELECT-ITEM]
  - id: prototypes-base-select-item-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/select.test.ts
    required: true
    consumesCases:
      [
        T-BASE-SELECT-ITEM-0001-CASE-COLLECTION-A11Y,
        T-BASE-SELECT-ITEM-0001-CASE-STATE-SEPARATION,
        T-BASE-SELECT-ITEM-0001-CASE-TRANSIENT-RESET,
        T-BASE-SELECT-ITEM-0001-CASE-COMMIT,
        T-BASE-SELECT-ITEM-0001-CASE-DISABLED,
      ]
    exercises: [P-BASE-SELECT-ITEM]
verifies:
  prototypes:
    - id: P-BASE-SELECT-ITEM
      anchors:
        [
          P-BASE-SELECT-ITEM-COLLECTION,
          P-BASE-SELECT-ITEM-A11Y,
          P-BASE-SELECT-ITEM-STATE-SEPARATION,
          P-BASE-SELECT-ITEM-COMMIT,
          P-BASE-SELECT-ITEM-DISABLED,
        ]
exercises: { prototypes: [P-BASE-SELECT-ITEM] }
revisions:
  - version: 0.2.0-rc.0
    change: introduced
    summary: Added Item collection, a11y, state separation, commit, controlled ownership, close policy, and disabled coverage.
tags: [prototype, base, select, item, option, selection, test]

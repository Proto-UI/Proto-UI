id: T-BASE-SELECT-SIZE-POLICY-0001
type: test
title: Public Select sizing policy keeps portable ownership and current request identity
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: The bounded public-policy and real Content ownership tests pass in isolated adapter execution with 213 cases with five discriminating single-path regressions. Deterministic safe-part descriptors do not prove native layout, neutral Popper support, family author defaults, compiled targets or independent acceptance.
summary: Verify actual Root and Item policy inputs and neutral descriptor identity without replacing selection, focus or host geometry owners.
cases:
  - id: T-BASE-SELECT-SIZE-POLICY-0001-CASE-POLICY
    title: Intrinsic defaults, normalized public inputs, inheriting and intrinsic rows
    covers:
      - P-BASE-SELECT-ITEM-SIZING-POLICY
      - P-BASE-SELECT-ITEM-SIZING
    expectation: explicit-safe-association-or-unchanged-intrinsic
  - id: T-BASE-SELECT-SIZE-POLICY-0001-CASE-REVISION
    title: Same-value policy changes, pending retirement, view and close cycles
    covers:
      - P-BASE-SELECT-ITEM-SIZING-REVISION
    expectation: current-policy-only-without-semantic-side-effects
  - id: T-BASE-SELECT-SIZE-POLICY-0001-CASE-MODE
    title: Unsupported explicit match does not masquerade as Popper sizing
    covers:
      - P-BASE-SELECT-ITEM-SIZING-POLICY
      - P-BASE-SELECT-CONTENT-PRESENTATION-ADMISSION
    expectation: explicit-unavailable-and-policy-repair-without-implicit-mode-switch
  - id: T-BASE-SELECT-SIZE-POLICY-0001-CASE-FOCUS
    title: Real Content applied preserves sizing-only focus ownership but not across a pending semantic excursion
    covers:
      - P-BASE-SELECT-ITEM-SIZING-POLICY
      - P-BASE-SELECT-ITEM-SIZING
      - P-BASE-SELECT-CONTENT-PRESENTATION-ADMISSION
    expectation: current-readiness-before-focus-and-no-policy-only-focus-replay
implementations:
  - id: public-policy
    kind: adapter-test
    status: passing
    path: packages/prototypes/base/test/select-alignment-controller.test.ts
    required: true
    consumesCases:
      - T-BASE-SELECT-SIZE-POLICY-0001-CASE-POLICY
      - T-BASE-SELECT-SIZE-POLICY-0001-CASE-REVISION
      - T-BASE-SELECT-SIZE-POLICY-0001-CASE-MODE
  - id: real-presentation-focus
    kind: adapter-test
    status: passing
    path: packages/prototypes/base/test/select-alignment-owner.test.ts
    required: true
    consumesCases:
      - T-BASE-SELECT-SIZE-POLICY-0001-CASE-FOCUS
verifies:
  prototypes: [P-BASE-SELECT, P-BASE-SELECT-ITEM, P-BASE-SELECT-CONTENT]
exercises: { prototypes: [P-BASE-SELECT, P-BASE-SELECT-ITEM] }
openQuestions:
  - id: T-BASE-SELECT-SIZE-POLICY-0001-Q-EDGE
    question:
      en: Which independently defined neutral edge size association and lifecycle establishes Popper matching without component-name dispatch or changing family positioning defaults?
    blocks: [activation:T-BASE-SELECT-SIZE-POLICY-0001]
  - id: T-BASE-SELECT-SIZE-POLICY-0001-Q-CONSUMER
    question:
      en: What exact-head public four-family and four-runtime first-open, reopen, long-text, disabled, font, RTL and author-override evidence verifies Item dimensions against each Trigger, separately from compiled and assistive-technology acceptance?
    blocks: [activation:T-BASE-SELECT-SIZE-POLICY-0001]
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Declared public scalar policy and identity tests as planned; no native geometry or unsupported edge capability accepted.
tags: [prototype, select, sizing, ownership, conformance]

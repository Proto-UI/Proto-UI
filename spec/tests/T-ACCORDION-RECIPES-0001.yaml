id: T-ACCORDION-RECIPES-0001
type: test
title: Accordion family recipe and decorative glyph regressions
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Bounded source/host regressions; exact-source native pixels, four-host narrow layout, material and GPUI acceptance remain incomplete.
  zh-CN: 仅源码/宿主回归；精确源码native像素、四host窄屏、材质与GPUI验收未完整，保持draft。
summary: Checks source-specific recipes and non-shrinking decorative glyphs without adding a disclosure owner.
cases:
  - id: T-ACCORDION-RECIPES-0001-CASE-RECIPE
    title: Component-specific recipe positive and superseded-shell negative controls
    covers:
      - P-SHADCN-ACCORDION-TRIGGER-STYLE
      - P-SHADCN-ACCORDION-CONTENT-STYLE
      - P-BRUTALIST-ACCORDION-TRIGGER-STYLE
      - P-BRUTALIST-ACCORDION-ITEM-STYLE
      - P-BRUTALIST-ACCORDION-CONTENT-STYLE
      - P-BOOTSTRAP-2-3-2-ACCORDION-TRIGGER-STYLE
      - P-LIQUID-GLASS-ACCORDION-TRIGGER-STYLE
    expectation: Shadcn uses compact trigger/content spacing and a 3px focus ring; Neo retains main Trigger fill, rounded clipped Item and secondary small-text Content. Four family chevrons have a passive non-shrinking wrapper; Neo uses 20px, others 16px. Existing Base activation and disabled suppression remain single-owner. Token and synthetic-DOM checks do not establish native paint.
  - id: T-ACCORDION-RECIPES-0001-CASE-LIQUID-COMPOSITION
    title: Liquid structural Item does not obscure its own Trigger material source
    covers:
      - P-LIQUID-GLASS-ACCORDION-ITEM-EVIDENCE
      - P-LIQUID-GLASS-ACCORDION-CONTENT-EVIDENCE
      - P-LIQUID-GLASS-ACCORDION-TRIGGER-MATERIAL
    expectation: Item remains transparent with no material candidate; Trigger retains existing optical intent and opaque fallback; Content retains its own opaque background and corner radius. Runtime style evidence is not optical pixel acceptance.
  - id: T-ACCORDION-RECIPES-0001-CASE-SHADCN-FLOW
    title: Open Shadcn content owns block flow without overriding Base hidden or presence
    covers:
      - P-SHADCN-ACCORDION-CONTENT-FLOW
      - P-SHADCN-ACCORDION-CONTENT-STYLE
      - P-BASE-ACCORDION-CONTENT-PRESENCE
    expectation: Nine profiles keep their existing padding and a conditional Base-open-derived block rule. Controlled refusal leaves visibility unchanged; retained closed content remains display none, and L1 detach/reopen retains Base ownership. Four native Web runtimes render an actual Rhea homepage block child inside horizontal and bottom padding at normal and 200 percent root text size. Source/resident-token evidence alone does not establish native geometry.
implementations:
  - id: liquid-composition-runtime
    kind: module-test
    status: passing
    required: true
    path: packages/prototypes/liquid-glass/test/accordion-material.test.ts
    consumesCases:
      - T-ACCORDION-RECIPES-0001-CASE-LIQUID-COMPOSITION
    exercises:
      - P-LIQUID-GLASS-ACCORDION-ITEM
      - P-LIQUID-GLASS-ACCORDION-CONTENT
      - P-LIQUID-GLASS-ACCORDION-TRIGGER
  - id: source-host-recipes
    kind: module-test
    status: passing
    required: true
    path: packages/prototypes/test-utils/test/accordion-recipes.test.ts
    consumesCases:
      - T-ACCORDION-RECIPES-0001-CASE-RECIPE
    exercises: &a1
      - P-SHADCN-ACCORDION-TRIGGER
      - P-SHADCN-ACCORDION-CONTENT
      - P-BRUTALIST-ACCORDION-TRIGGER
      - P-BRUTALIST-ACCORDION-ITEM
      - P-BRUTALIST-ACCORDION-CONTENT
      - P-BOOTSTRAP-2-3-2-ACCORDION-TRIGGER
      - P-LIQUID-GLASS-ACCORDION-TRIGGER
    notes:
      - Nine regressions fail against c2cbb8 before the repair. A source collector and CSS renderer are exercised without changing their semantics.
  - id: shadcn-open-flow-source
    kind: module-test
    status: planned
    required: true
    path: packages/prototypes/test-utils/test/accordion-recipes.test.ts
    consumesCases:
      - T-ACCORDION-RECIPES-0001-CASE-SHADCN-FLOW
    exercises:
      - P-SHADCN-ACCORDION-CONTENT
      - P-BASE-ACCORDION-CONTENT
    notes:
      - Newly authored nine-profile retained/detached and controlled-refusal controls are unexecuted. Existing passing recipe records above are historical evidence, not a pass for this addition.
  - id: shadcn-open-flow-native
    kind: workspace-check
    status: planned
    required: true
    path: apps/www/src/content/docs/zh-cn/demo-accordion-family.browser.test.ts
    consumesCases:
      - T-ACCORDION-RECIPES-0001-CASE-SHADCN-FLOW
    exercises:
      - P-SHADCN-ACCORDION-CONTENT
      - P-BASE-ACCORDION-CONTENT
    notes:
      - New real Rhea homepage geometry cases cover four runtimes at 1180px/100 percent and 390px/200 percent root text. Existing family journeys gain a retained closed display-none check. All new assertions and exact-candidate screenshots remain unexecuted.
  - id: native-narrow-glyph
    kind: workspace-check
    status: planned
    required: true
    path: apps/www/src/content/docs/zh-cn/demo-accordion-family.browser.test.ts
    consumesCases:
      - T-ACCORDION-RECIPES-0001-CASE-RECIPE
    exercises: *a1
    notes:
      - Registered 320px/200% React long-label glyph dimensions and non-shrink assertions. No new exact-source browser execution or screenshot in this repair. Four-host narrow coverage remains separate debt.

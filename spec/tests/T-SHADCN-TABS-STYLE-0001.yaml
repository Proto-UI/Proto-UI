id: T-SHADCN-TABS-STYLE-0001
type: test
title: Tabs nine-profile default and line paint with no-reset scope switching
status: draft
since: 0.3.0-alpha.1
summary: Authored nine-profile default/line consumers and live owned decoration; not executed here and not native or all-adapter parity.
cases:

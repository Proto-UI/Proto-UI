    covers:
      - P-SHADCN-TABS-STYLE-SCOPE
      - P-SHADCN-TABS-SOURCE-BOUND-TEXT-DEFAULT
      - P-SHADCN-TABS-LIST-STYLE-SCOPE
      - P-SHADCN-TABS-LIST-SOURCE-BOUND-TEXT-DEFAULT
      - P-SHADCN-TABS-TRIGGER-STYLE-SCOPE
      - P-SHADCN-TABS-TRIGGER-SOURCE-BOUND-TEXT-DEFAULT
      - P-SHADCN-TABS-CONTENT-STYLE-SCOPE
      - P-SHADCN-TABS-CONTENT-SOURCE-BOUND-TEXT-DEFAULT
    expectation: source-bound-default-surface-and-semantic-withdrawal
  - id: T-SHADCN-TABS-STYLE-0001-CASE-NO-RESET
    title: Production scope precedence preserves value, handles, focus, user
      children and selection
    covers:
      - P-SHADCN-TABS-STYLE-SCOPE
      - P-SHADCN-TABS-LIST-STYLE-SCOPE
      - P-SHADCN-TABS-TRIGGER-STYLE-SCOPE
      - P-SHADCN-TABS-CONTENT-STYLE-SCOPE

id: T-AXIS-INPUT-CONTACT-BASIS-0001
type: test
title: Axis Input contact-basis interruption evidence
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: Definition-stage cases need executable source, lifecycle and independent host evidence; no real-input or Compiler acceptance is inferred.
summary: Checks compatible default normalization, opt-in held-contact size interruption, translation stability and terminal cleanup.
cases:
  - id: T-AXIS-INPUT-CONTACT-BASIS-0001-CASE-POLICY
    title: Policy configuration preserves defaults, validates updates and revokes changed contact policy
    covers: [C-AXIS-INPUT-CONTACT-BASIS-0001-POLICY]
    expectation: default-compatible-explicit-policy-invalid-update-rejected-same-update-inert
  - id: T-AXIS-INPUT-CONTACT-BASIS-0001-CASE-EXTENT
    title: Changed extent cancels held contacts and preempts stale move or end while translation stays live
    covers: [C-AXIS-INPUT-CONTACT-BASIS-0001-EXTENT, C-AXIS-INPUT-CONTACT-BASIS-0001-OBSERVATION]
    expectation: idle-layout-change-cancels-once-origin-only-change-does-not-cancel
  - id: T-AXIS-INPUT-CONTACT-BASIS-0001-CASE-LIFETIME
    title: Cancellation releases capture and stale session callbacks across host and view lifecycles
    covers: [C-AXIS-INPUT-CONTACT-BASIS-0001-LIFETIME]
    expectation: first-terminal-wins-old-observer-inert-fresh-contact-admitted-no-lease-resurrection

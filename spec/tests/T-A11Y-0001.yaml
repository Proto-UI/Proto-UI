    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/a11y.v0.contract.test.ts
    required: true
    consumesCases:
      - T-A11Y-0001-CASE-DYNAMIC-ROLE
      - T-A11Y-0001-CASE-IR

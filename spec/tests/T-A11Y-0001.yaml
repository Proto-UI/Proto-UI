      - T-A11Y-0001-CASE-ADDITIVE-RELATION
      - T-A11Y-0001-CASE-DYNAMIC-TREE
      - T-A11Y-0001-CASE-OPTIONAL-STATE
      - T-A11Y-0001-CASE-LIVE-ATOMIC-BUSY
      - T-A11Y-0001-CASE-HEADING-LEVEL
  - id: a11y-web-projector-heading-contract
    kind: module-test
    status: passing
    path: packages/modules/a11y/test/web.test.ts
    required: true
    consumesCases:
      - T-A11Y-0001-CASE-HEADING-LEVEL
    exercises:
      - HC-A11Y-0001
  - id: react-a11y-heading-level-integration
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/a11y-heading-level.integration.test.ts
    required: true
    consumesCases:
      - T-A11Y-0001-CASE-HEADING-LEVEL
    exercises:
      - HC-A11Y-0001
  - id: vue-a11y-heading-level-integration
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/a11y-heading-level.integration.test.ts
    required: true
    consumesCases:
      - T-A11Y-0001-CASE-HEADING-LEVEL
    exercises:
      - HC-A11Y-0001
  - id: vue2-a11y-heading-level-integration
    kind: adapter-test
    status: passing
    path: packages/adapters/vue2/test/a11y-heading-level.integration.test.ts
    required: true
    consumesCases:
      - T-A11Y-0001-CASE-HEADING-LEVEL
    exercises:
      - HC-A11Y-0001

id: T-A11Y-0001
type: test
title: A11y semantic object contract tests
status: draft
since: 0.1.0
summary: Contract tests for a11y semantic object IR, Button consumption, identity/relation projection, Web adapter projection, portable heading-level validation, role coherence, target rebinding, and cross-adapter lifecycle behavior.
cases:
  - id: T-A11Y-0001-CASE-DYNAMIC-ROLE
    title: A semantic role may follow a state-backed fact
    covers:
      - C-A11Y-0001-C
      - C-A11Y-0001-J
    expectation: state-backed-role-projection
  - id: T-A11Y-0001-CASE-IR
    title: A prototype can declare identity, role, name, state, action, and relation into a stable a11y IR
    covers:
      - C-A11Y-0001-A
      - C-A11Y-0001-B
      - C-A11Y-0001-C
      - C-A11Y-0001-D
      - C-A11Y-0001-E
      - C-A11Y-0001-F
      - C-A11Y-0001-H
      - C-A11Y-0001-I
    expectation: semantic-object-ir
  - id: T-A11Y-0001-CASE-BUTTON
    title: Base Button declares button role, content-derived name policy, disabled state, and activate action
    covers:
      - C-A11Y-0001-B
      - C-A11Y-0001-C
      - C-A11Y-0001-D
      - C-A11Y-0001-E
      - C-A11Y-0001-F
    expectation: base-button-a11y-consumption
  - id: T-A11Y-0001-CASE-WEB-PROJECTION
    title: Web adapter projects supported a11y IR identity and relation facts to host attributes
    covers:
      - C-A11Y-0001-G
      - C-A11Y-0001-H
      - C-A11Y-0001-I
      - HC-A11Y-0001-A
      - HC-A11Y-0001-B
    expectation: web-a11y-projection
  - id: T-A11Y-0001-CASE-ADDITIVE-RELATION
    title: Additive Web relation projection preserves host-authored IDREF targets
    covers:
      - C-A11Y-0001-K
      - HC-A11Y-0001-B
    expectation: additive-web-relation-projection
  - id: T-A11Y-0001-CASE-DYNAMIC-TREE
    title: Semantic tree behavior follows state without changing layout visibility
    covers:
      - C-A11Y-0001-L
      - HC-A11Y-0001-A
      - HC-A11Y-0001-B
    expectation: state-backed-tree-projection-preserves-layout
  - id: T-A11Y-0001-CASE-OPTIONAL-STATE
    title: Web projection removes an optional a11y state attribute for empty values and restores it for non-empty values
    covers:
      - C-A11Y-0001-M
      - HC-A11Y-0001-A
    expectation: optional-web-a11y-state-removes-and-restores-host-attribute
  - id: T-A11Y-0001-CASE-LIVE-ATOMIC-BUSY
    title: Web adapter projects live, atomic, and busy a11y state keys to host attributes
    covers:
      - C-A11Y-0001-G
      - C-ASYNC-A11Y-0001-F
      - HC-A11Y-0001-A
      - HC-A11Y-0001-B
    expectation: web-a11y-live-atomic-busy-projection
  - id: T-A11Y-0001-CASE-HEADING-LEVEL
    title: Portable heading levels separate setup rejection from runtime omission and remain coherent across Web projection lifecycles
    covers:
      - C-A11Y-0001-LEVEL
      - HC-A11Y-0001-A
      - HC-A11Y-0001-B
      - HC-A11Y-0001-C
    expectation: portable-heading-level-setup-validation-runtime-omission-recovery-role-and-target-cleanup
implementations:

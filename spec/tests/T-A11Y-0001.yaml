id: T-A11Y-0001
type: test
title: A11y semantic object contract tests
status: draft
since: 0.1.0
summary: Contract tests for a11y semantic object IR, Button consumption, identity/relation projection, and Web adapter projection.
cases:
  - id: T-A11Y-0001-CASE-DYNAMIC-ROLE
    title: A semantic role may follow a state-backed fact
    covers:
      - C-A11Y-0001-C
      - C-A11Y-0001-J
    expectation: state-backed-role-projection
  - id: T-A11Y-0001-CASE-IR
    title: A prototype can declare identity, role, name, state, action, and relation into a stable a11y IR
    covers:
      - C-A11Y-0001-A
      - C-A11Y-0001-B
      - C-A11Y-0001-C
      - C-A11Y-0001-D
      - C-A11Y-0001-E
      - C-A11Y-0001-F
      - C-A11Y-0001-H
      - C-A11Y-0001-I
    expectation: semantic-object-ir
  - id: T-A11Y-0001-CASE-OPAQUE-RELATIONS
    title: A logical semantic object keeps one opaque ref, normalizes ordered relation refs, and rewires runtime State-backed relation mutations
    covers:
      - C-A11Y-0001-H
      - C-A11Y-0001-N
      - C-A11Y-0001-O
    expectation: opaque-semantic-object-ref-and-ordered-relation-ir
  - id: T-A11Y-0001-CASE-OPAQUE-RELATION-PROJECTION
    title: Web direct-ref projection fails closed, rebinds identity per document, targets dependency reconciliation, and preserves unowned tokens across projector and view lifecycle
    covers:
      - C-A11Y-0001-G
      - C-A11Y-0001-K
      - C-A11Y-0001-P
      - HC-A11Y-0001-A
      - HC-A11Y-0001-B
      - HC-A11Y-0001-C
    expectation: bounded-web-direct-ref-projection-lifecycle
  - id: T-A11Y-0001-CASE-BUTTON
    title: Base Button declares button role, content-derived name policy, disabled state, and activate action
    covers:
      - C-A11Y-0001-B
      - C-A11Y-0001-C
      - C-A11Y-0001-D
      - C-A11Y-0001-E
      - C-A11Y-0001-F
    expectation: base-button-a11y-consumption
  - id: T-A11Y-0001-CASE-WEB-PROJECTION
    title: Web adapter projects supported a11y IR identity and relation facts to host attributes
    covers:
      - C-A11Y-0001-G
      - C-A11Y-0001-H
      - C-A11Y-0001-I
      - HC-A11Y-0001-A
      - HC-A11Y-0001-B
    expectation: web-a11y-projection
  - id: T-A11Y-0001-CASE-ADDITIVE-RELATION
    title: Additive Web relation projection preserves host-authored IDREF targets
    covers:
      - C-A11Y-0001-K
      - HC-A11Y-0001-B
    expectation: additive-web-relation-projection
  - id: T-A11Y-0001-CASE-DYNAMIC-TREE
    title: Semantic tree behavior follows state without changing layout visibility
    covers:
      - C-A11Y-0001-L
      - HC-A11Y-0001-A
      - HC-A11Y-0001-B
    expectation: state-backed-tree-projection-preserves-layout
  - id: T-A11Y-0001-CASE-OPTIONAL-STATE
    title: Web projection removes an optional a11y state attribute for empty values and restores it for non-empty values
    covers:
      - C-A11Y-0001-M
      - HC-A11Y-0001-A
    expectation: optional-web-a11y-state-removes-and-restores-host-attribute
  - id: T-A11Y-0001-CASE-LIVE-ATOMIC-BUSY
    title: Web adapter projects live, atomic, and busy a11y state keys to host attributes
    covers:
      - C-A11Y-0001-G
      - C-ASYNC-A11Y-0001-F
      - HC-A11Y-0001-A
      - HC-A11Y-0001-B
    expectation: web-a11y-live-atomic-busy-projection
implementations:
  - id: runtime-a11y-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/a11y.v0.contract.test.ts
    required: true
    consumesCases:
      - T-A11Y-0001-CASE-DYNAMIC-ROLE
      - T-A11Y-0001-CASE-IR
      - T-A11Y-0001-CASE-OPAQUE-RELATIONS
  - id: module-a11y-web-reference-projector
    kind: module-test
    status: passing
    path: packages/modules/a11y/test/web-reference.test.ts
    required: true
    consumesCases:
      - T-A11Y-0001-CASE-OPAQUE-RELATION-PROJECTION
    notes:
      - Direct-ref transport evidence only; this does not claim the pending PR #553 family/domain/key matcher or Tabs migration.
  - id: base-button-a11y-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/as-button.test.ts
    required: true
    consumesCases:
      - T-A11Y-0001-CASE-BUTTON
  - id: web-component-a11y-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/contract/a11y.v0.contract.test.ts
    required: true
    consumesCases:
      - T-A11Y-0001-CASE-WEB-PROJECTION
      - T-A11Y-0001-CASE-ADDITIVE-RELATION
      - T-A11Y-0001-CASE-DYNAMIC-TREE
      - T-A11Y-0001-CASE-OPTIONAL-STATE
      - T-A11Y-0001-CASE-LIVE-ATOMIC-BUSY
verifies:
  contracts:
    - id: C-A11Y-0001
      anchors:
        - C-A11Y-0001-A
        - C-A11Y-0001-B
        - C-A11Y-0001-C
        - C-A11Y-0001-D
        - C-A11Y-0001-E
        - C-A11Y-0001-F
        - C-A11Y-0001-G
        - C-A11Y-0001-H
        - C-A11Y-0001-I
        - C-A11Y-0001-J
        - C-A11Y-0001-K
        - C-A11Y-0001-L
        - C-A11Y-0001-M
        - C-A11Y-0001-N
        - C-A11Y-0001-O
        - C-A11Y-0001-P
    - id: C-ASYNC-A11Y-0001
      since: 0.2.0-rc.7
      anchors:
        - C-ASYNC-A11Y-0001-F
  hostCaps:
    - id: HC-A11Y-0001
      anchors:
        - HC-A11Y-0001-A
        - HC-A11Y-0001-B
        - HC-A11Y-0001-C
revisions:
  - version: 0.1.0
    change: introduced
    summary: Added the first a11y semantic object test mapping.
  - version: 0.1.1
    change: refined
    summary: Added coverage for dynamic a11y name projection from state-backed text facts.
  - version: 0.1.2
    change: refined
    summary: Added runtime coverage for state-backed semantic role projection.
  - version: 0.2.0-rc.7
    change: refined
    summary: Added additive relation ownership, dynamic semantic tree projection, optional Web state omission, and live/atomic/busy Web projection coverage.
  - version: 0.3.0-alpha.0
    change: refined
    summary: Added passing Runtime and Web projector evidence for opaque logical refs, ordered direct-ref relations, view replacement, fail-closed targets, and terminal cleanup.
tags:
  - a11y

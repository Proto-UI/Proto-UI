revisions:
  - version: 0.4.0
    change: introduced
    summary: Define independent new-language cases and record all executable implementation routes as missing.
  - version: 0.4.0
    change: revised
    summary: Add identical-source-closure and independent-oracle cases with an explicitly missing shared-source consumer implementation.
  - version: 0.4.0
    change: revised
    breaking: true
    summary: Replace the transactional writable-capture expectation with a source-invalid case and a declared-state rollback case, matching the revised CAPTURES criterion.
  - version: 0.4.0
    change: revised
    breaking: true
    summary: Compare composite values through the explicit structural equality operation and reject composite operator equality and member assignment.

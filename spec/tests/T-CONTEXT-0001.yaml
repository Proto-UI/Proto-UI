id: T-CONTEXT-0001
type: test
title: Context identity, scope, and provider tests
status: draft
since: 0.1.0
summary: Core and module tests for ContextKey reference identity, official context-channel positioning, scope resolution, provider setup, and context value boundaries.
cases:
  - id: T-CONTEXT-0001-CASE-KEY-IDENTITY
    title: ContextKey identity is created through the core factory and compared by reference
    covers:
      - C-CONTEXT-0003-A
      - C-CONTEXT-0003-B
      - C-CONTEXT-0003-C
      - C-CONTEXT-0003-D
    expectation: reference-identity-context-key
  - id: T-CONTEXT-0001-CASE-CHANNEL-SCOPE
    title: Context is the official inter-component channel and provider establishes the communication scope
    covers:
      - C-CONTEXT-0001-A
      - C-CONTEXT-0001-B
      - C-CONTEXT-0001-C
      - C-CONTEXT-0001-D
      - C-CONTEXT-0002-A
      - C-CONTEXT-0002-B
      - C-CONTEXT-0002-C
      - C-CONTEXT-0002-D
    expectation: component-context-channel
  - id: T-CONTEXT-0001-CASE-SCOPE-RESOLUTION
    title: Context resolution binds participants to the nearest provider or equivalent scope owner
    covers:
      - C-CONTEXT-0004-A
      - C-CONTEXT-0004-B
      - C-CONTEXT-0004-C
      - C-CONTEXT-0004-D
      - C-CONTEXT-0004-E
    expectation: nearest-scope-owner
  - id: T-CONTEXT-0001-CASE-PROVIDE-VALUE
    title: Provide is setup-only, installs a JSON object context value for the current scope, and does not return a provider updater
    covers:
      - C-CONTEXT-0005-A
      - C-CONTEXT-0005-B
      - C-CONTEXT-0005-C
      - C-CONTEXT-0005-D
      - C-CONTEXT-0005-E
      - C-CONTEXT-0009-A
      - C-CONTEXT-0009-B
      - C-CONTEXT-0009-C
      - C-CONTEXT-0009-D
      - C-CONTEXT-0009-E
    expectation: setup-provider-json-object-without-updater
implementations:
  - id: context-identity-scope-fixture
    kind: fixture
    status: active
    path: packages/spec/fixtures/src/context/identity-scope.ts
    required: true
    consumesCases:
      - T-CONTEXT-0001-CASE-KEY-IDENTITY
      - T-CONTEXT-0001-CASE-CHANNEL-SCOPE
      - T-CONTEXT-0001-CASE-SCOPE-RESOLUTION
      - T-CONTEXT-0001-CASE-PROVIDE-VALUE
  - id: core-context-key-contract
    kind: module-test
    status: passing
    path: packages/core/test/contract/context-key.v0.contract.test.ts
    required: true
    consumesCases:
      - T-CONTEXT-0001-CASE-KEY-IDENTITY
  - id: module-context-with-tree-contract
    kind: module-test
    status: passing
    path: packages/modules/context/test/contract/context.with-tree.v0.contract.test.ts
    required: true
    consumesCases:
      - T-CONTEXT-0001-CASE-SCOPE-RESOLUTION
      - T-CONTEXT-0001-CASE-PROVIDE-VALUE
verifies:
  contracts:
    - id: C-CONTEXT-0003
      anchors:
        - C-CONTEXT-0003-A
        - C-CONTEXT-0003-B
        - C-CONTEXT-0003-C
        - C-CONTEXT-0003-D
    - id: C-CONTEXT-0004
      anchors:
        - C-CONTEXT-0004-A
        - C-CONTEXT-0004-B
        - C-CONTEXT-0004-C
        - C-CONTEXT-0004-D
        - C-CONTEXT-0004-E
    - id: C-CONTEXT-0005
      anchors:
        - C-CONTEXT-0005-A
        - C-CONTEXT-0005-B
        - C-CONTEXT-0005-C
        - C-CONTEXT-0005-D
        - C-CONTEXT-0005-E
    - id: C-CONTEXT-0009
      anchors:
        - C-CONTEXT-0009-A
        - C-CONTEXT-0009-B
        - C-CONTEXT-0009-C
        - C-CONTEXT-0009-D
        - C-CONTEXT-0009-E
exercises:
  contracts:
    - id: C-CONTEXT-0001
      role: test-surface
      coverageImpact: exercises-test-surface
      note: Exercises Context as the only official component-to-component channel through provider and consumer scope behavior.
    - id: C-CONTEXT-0002
      role: test-surface
      coverageImpact: exercises-test-surface
      note: Exercises provider-established scope without treating provider as the only possible update source.
revisions:
  - version: 0.2.0-rc.7
    change: revised
    summary: Added nearest-provider identity coverage for bounded module-internal scope coordination.
  - version: 0.1.0
    change: introduced
    summary: Added context identity, scope, provider, and value-boundary test mapping.
  - version: 0.1.0
    change: revised
    summary: Updated provider tests to require the unified runtime context update surface instead of a provide-returned updater.
tags:

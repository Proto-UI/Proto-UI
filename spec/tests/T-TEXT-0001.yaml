id: T-TEXT-0001
type: test
title: Text content, four-Adapter and compiler conformance
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: New bounded Text presentation slice has source-backed Web Adapter and compiler evidence. It remains draft pending independent review and real-browser visual admission; native GPUI typography omissions remain explicit.
summary: Source-bound Text presentation evidence with native host semantics and unsupported compiler boundaries.
cases:
  - id: T-TEXT-0001-CASE-CONTENT
    title: Exact content and one subject inside native h1/p/label/a owners
    covers:
      - P-BASE-TEXT-CONTENT
    expectation: text-content
  - id: T-TEXT-0001-CASE-PASSIVE
    title: No role, tab stop, event, navigation or editing ownership
    covers:
      - P-BASE-TEXT-PASSIVE
    expectation: text-passive
  - id: T-TEXT-0001-CASE-PROJECTION
    title: Every finite input and prop-removal default on all four real Web Adapters
    covers:
      - P-BASE-TEXT-INPUTS
      - P-SHADCN-TEXT-INHERITANCE
      - P-BRUTALIST-TEXT-INHERITANCE
      - P-SHADCN-TEXT-PROJECTION
      - P-BRUTALIST-TEXT-PROJECTION
    expectation: text-projection
  - id: T-TEXT-0001-CASE-DENSITY
    title: Shadcn and Brutalist size-owned line boxes and tighter inputs survive four public Web Adapter prop transports
    covers:
      - P-BASE-TEXT-INPUTS
      - P-SHADCN-TEXT-PROJECTION
      - P-BRUTALIST-TEXT-PROJECTION
    expectation: text-density
  - id: T-TEXT-0001-CASE-PUBLIC
    title: Package exports and generated public Adapter facades
    covers:
      - P-BASE-TEXT-ENTRIES
      - P-SHADCN-TEXT-CONSUMPTION
      - P-BRUTALIST-TEXT-CONSUMPTION
    expectation: text-public
  - id: T-TEXT-0001-CASE-COMPILER
    title: Actual source token closure and compiled Web typography declarations
    covers:
      - P-SHADCN-TEXT-PROJECTION
      - P-BRUTALIST-TEXT-PROJECTION
    expectation: text-compiler
  - id: T-TEXT-0001-CASE-LIMITS
    title: Unsupported CLI host and unknown Web token diagnostics
    covers:
      - P-SHADCN-TEXT-CONSUMPTION
      - P-BRUTALIST-TEXT-CONSUMPTION
    expectation: text-limits
  - id: T-TEXT-0001-CASE-NATIVE-LIMITS
    title: Native unmapped-property diagnostics for italic, tracking and decoration
    covers:
      - P-SHADCN-TEXT-CONSUMPTION
      - P-BRUTALIST-TEXT-CONSUMPTION
    expectation: text-native-limits
implementations:
  - id: text-real-web-adapters
    kind: adapter-test
    status: passing
    path: packages/web-conformance/test/text.journey.test.ts
    required: true
    consumesCases:
      - T-TEXT-0001-CASE-CONTENT
      - T-TEXT-0001-CASE-PASSIVE
      - T-TEXT-0001-CASE-PROJECTION
      - T-TEXT-0001-CASE-DENSITY
    exercises:
      - P-BASE-TEXT
      - P-SHADCN-TEXT
      - P-BRUTALIST-TEXT
  - id: text-public-web-compiler
    kind: module-test
    status: passing
    path: packages/cli/test/text-prototype.test.ts
    required: true
    consumesCases:
      - T-TEXT-0001-CASE-PUBLIC
      - T-TEXT-0001-CASE-COMPILER
      - T-TEXT-0001-CASE-DENSITY
      - T-TEXT-0001-CASE-LIMITS
    exercises:
      - P-BASE-TEXT
      - P-SHADCN-TEXT
      - P-BRUTALIST-TEXT
  - id: text-native-explicit-omissions
    kind: adapter-test
    status: skipped
    path: native/gpui/crates/proto-ui-gpui/tests/style_map.rs
    required: false
    consumesCases:
      - T-TEXT-0001-CASE-NATIVE-LIMITS
    exercises:
      - P-SHADCN-TEXT
      - P-BRUTALIST-TEXT
exercises:
  prototypes: [P-BASE-TEXT, P-SHADCN-TEXT, P-BRUTALIST-TEXT]
verifies:
  prototypes:
    - P-BASE-TEXT
    - P-SHADCN-TEXT
    - P-BRUTALIST-TEXT
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added real four-Web-Adapter, source compiler and explicit unsupported-surface evidence; native Rust execution remains pending.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added all-size line-box, tighter token whitelist, generated-preset closure, and separate missing versus unusable-prop compatibility evidence for Shadcn and Brutalist.
tags:
  - test
  - text
  - typography
  - compiler
  - adapter

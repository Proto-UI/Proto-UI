id: T-AS-OVERLAY-0001
type: test
title: Overlay logical state, Presence binding, and resource lifetime tests
status: draft
since: 0.1.0
summary: Runtime and Base integration tests for no-argument Overlay installation, immediate ViewIntent projection, Transition binding, single-writer conflict diagnostics, and leaving resource retention.
cases:
  - id: T-AS-OVERLAY-0001-CASE-NO-ARG-ONCE
    title: repeated no-argument asOverlay calls reuse one configurable handle
    covers:
      - C-AS-OVERLAY-0001-A
    expectation: no-argument-once-overlay-handle
  - id: T-AS-OVERLAY-0001-CASE-IMMEDIATE
    title: unbound Overlay projects logical open directly to ViewIntent
    covers:
      - C-AS-OVERLAY-0001-B
    expectation: immediate-overlay-presence-driver
  - id: T-AS-OVERLAY-0001-CASE-BOUND
    title: Transition-bound Overlay disables immediate presence and retains resources through leave
    covers:
      - C-AS-OVERLAY-0001-C
      - C-AS-OVERLAY-0001-E
      - C-AS-OVERLAY-0001-F
    expectation: transition-bound-overlay-presence
  - id: T-AS-OVERLAY-0001-CASE-KEEP-MOUNTED
    title: keepMounted retains structural presence independently of logical open
    covers:
      - C-AS-OVERLAY-0001-H
    expectation: explicit-retained-overlay-view
  - id: T-AS-OVERLAY-0001-CASE-CONFLICT
    title: a second competing Presence binding is rejected
    covers:
      - C-AS-OVERLAY-0001-D
    expectation: single-overlay-presence-writer
  - id: T-AS-OVERLAY-0001-CASE-BOUNDARY-HIT
    title: Boundary dismissal and Hit Participation remain independently composable
    covers:
      - C-AS-OVERLAY-0001-G
    expectation: independent-boundary-hit-composition
  - id: T-AS-OVERLAY-0001-CASE-DISMISS
    title: opted-in outside press and Escape policies use Boundary and Event transport
    covers:
      - C-AS-OVERLAY-0001-I
    expectation: explicit-overlay-dismiss-transport
  - id: T-AS-OVERLAY-0001-CASE-RENDERER-PORTAL
    title: React and Vue portal projection remains renderer-owned
    covers:
      - C-AS-OVERLAY-0001-J
    expectation: renderer-owned-overlay-portal
  - id: T-AS-OVERLAY-0001-CASE-PORTAL-REENTER
    title: A detached portal view preserves logical ownership and can re-enter
    covers:
      - C-AS-OVERLAY-0001-K
      - C-LIFECYCLE-0008-E
    expectation: portaled-overlay-logical-owner-survives-detach
  - id: T-AS-OVERLAY-0001-CASE-POST-CALLBACK-RECONCILE
    title: bound host resources reconcile only after the outer runtime callback chain
    covers:
      - C-AS-OVERLAY-0001-L
    expectation: runtime-owned-post-callback-overlay-reconciliation
  - id: T-AS-OVERLAY-0001-CASE-ANCHORED
    title: Anchored Overlay delegates one active-view lease and shares resolved anchors with Boundary
    covers:
      - C-AS-OVERLAY-0001-M
      - C-AS-OVERLAY-0001-N
      - C-AS-OVERLAY-0001-O
    expectation: overlay-delegates-positioning-and-boundary-classification-without-exposing-anatomy-target
  - id: T-AS-OVERLAY-0001-CASE-MODULE
    title: Overlay coordination boundary
    covers:
      - M-OVERLAY-0001-A
    expectation: one-logical-owner-and-one-presence-driver-with-distinct-view-lifetime
implementations:

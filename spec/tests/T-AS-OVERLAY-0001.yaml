    required: true
    consumesCases:
      - T-AS-OVERLAY-0001-CASE-RENDERER-PORTAL
  - id: vue-overlay-portal-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/overlay-portal-ownership.test.ts
    required: true
    consumesCases:
      - T-AS-OVERLAY-0001-CASE-RENDERER-PORTAL
  - id: vue-dialog-portal-reentry

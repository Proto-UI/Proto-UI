id: T-AS-TRANSITION-0001
type: test
title: asTransition perceptual phase and ViewIntent integration tests
status: active
since: 0.1.0
summary: Deterministic coverage for once registration, transition sequencing, interruption, neutral delay completion, and cross-adapter repeatable view epochs.
cases:
  - id: T-AS-TRANSITION-0001-CASE-ONCE
    title: Repeated no-argument calls return one handle
    covers:
      - C-AS-TRANSITION-0001-A
    expectation: repeated-as-transition-call-is-referentially-identical
  - id: T-AS-TRANSITION-0001-CASE-INITIAL
    title: Initial open and appear select the correct perceptual and structural start
    covers:
      - C-AS-TRANSITION-0001-B
      - C-AS-TRANSITION-0001-C
      - C-AS-TRANSITION-0001-D
    expectation: initial-transition-intent-precedes-view-phase
  - id: T-AS-TRANSITION-0001-CASE-SEQUENCING
    title: Leave retains the view and enter materializes before entering
    covers:
      - C-AS-TRANSITION-0001-D
      - C-AS-TRANSITION-0001-E
      - C-AS-TRANSITION-0001-F
      - C-AS-TRANSITION-0001-K
    expectation: transition-view-intent-ordering
  - id: T-AS-TRANSITION-0001-CASE-DELAY
    title: Neutral delay completes phases and stale tasks cannot win
    covers:
      - C-AS-TRANSITION-0001-G
      - C-AS-TRANSITION-0001-H
    expectation: lifecycle-bound-delay-completion
  - id: T-AS-TRANSITION-0001-CASE-INTERRUPT
    title: Interruption modes resolve against the latest target
    covers:
      - C-AS-TRANSITION-0001-I
    expectation: reverse-wait-immediate-latest-target
  - id: T-AS-TRANSITION-0001-CASE-CONTROL
    title: Controlled props and uncontrolled controls remain distinct
    covers:
      - C-AS-TRANSITION-0001-J
    expectation: controlled-and-uncontrolled-transition-targets
  - id: T-AS-TRANSITION-0001-CASE-CONFIGURE
    title: Setup configuration supplies defaults while explicit host props retain precedence
    covers:
      - C-AS-TRANSITION-0001-L
      - C-AS-TRANSITION-0001-M
    expectation: setup-only-configured-defaults-with-host-prop-precedence
  - id: T-AS-TRANSITION-0001-CASE-REDUCED-MOTION
    title: Reduced motion uses zero-duration fallback while preserving transition ordering
    covers:
      - C-AS-TRANSITION-0001-N
    expectation: reduced-motion-zero-duration-fallback-preserves-transition-ordering
  - id: T-AS-TRANSITION-0001-CASE-INITIAL-CONTEXT
    title: Declarative context source supplies one initial fallback without becoming a target owner
    covers:
      - C-AS-TRANSITION-0001-O
      - C-AS-TRANSITION-0001-P
      - C-AS-TRANSITION-0001-Q
    expectation: context-field-initial-fallback-is-setup-only-and-sampled-once
implementations:
  - id: transition-initial-context-source
    kind: runtime-test
    status: passing
    path: packages/prototypes/base/test/transition-initial-context.test.ts
    required: true
    consumesCases:
      - T-AS-TRANSITION-0001-CASE-INITIAL-CONTEXT
  - id: popover-initial-context-composition
    kind: adapter-test
    status: passing
    path: packages/prototypes/shadcn/test/popover-motion-gap.test.ts
    required: true
    consumesCases:
      - T-AS-TRANSITION-0001-CASE-INITIAL-CONTEXT
    notes:
      - Normal source-runtime execution of the same Shadcn Popover; not browser-native paint or compiled conformance evidence.
  - id: base-transition-state-machine
    kind: runtime-test
    status: passing
    path: packages/prototypes/base/test/as-transition.test.ts
    required: true
    consumesCases:
      - T-AS-TRANSITION-0001-CASE-ONCE
      - T-AS-TRANSITION-0001-CASE-INITIAL
      - T-AS-TRANSITION-0001-CASE-SEQUENCING
      - T-AS-TRANSITION-0001-CASE-DELAY
      - T-AS-TRANSITION-0001-CASE-INTERRUPT
      - T-AS-TRANSITION-0001-CASE-CONTROL
      - T-AS-TRANSITION-0001-CASE-CONFIGURE
      - T-AS-TRANSITION-0001-CASE-REDUCED-MOTION
  - id: react-transition-view-intent
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/transition-command-closed-enter.test.ts
    required: true
    consumesCases:
      - T-AS-TRANSITION-0001-CASE-SEQUENCING
  - id: vue-transition-view-intent
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/transition-command-closed-enter.test.ts
    required: true
    consumesCases:
      - T-AS-TRANSITION-0001-CASE-SEQUENCING
  - id: react-repeatable-transition-view-epochs
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/lifecycle-repeatable-mount.test.ts
    required: true
    consumesCases:
      - T-AS-TRANSITION-0001-CASE-SEQUENCING
verifies:
  contracts:
    - id: C-AS-TRANSITION-0001
      anchors:
        - C-AS-TRANSITION-0001-A
        - C-AS-TRANSITION-0001-D
        - C-AS-TRANSITION-0001-E
        - C-AS-TRANSITION-0001-N
        - C-AS-TRANSITION-0001-O
        - C-AS-TRANSITION-0001-P
        - C-AS-TRANSITION-0001-Q
exercises:
  contracts:
    - id: C-DELAY-0001
      role: execution-order
      coverageImpact: exercises-test-surface
    - id: C-LIFECYCLE-0008
      role: lifecycle-model
      coverageImpact: exercises-test-surface
revisions:
  - version: 0.1.0
    change: introduced
    summary: Added state-machine and cross-adapter conformance coverage for the rewritten Transition model.
  - version: 0.2.0-rc.0
    change: refined
    summary: Added reduced-motion fallback coverage and explicit contract anchors.
  - version: 0.2.0-rc.0
    change: refined
    summary: Added initial context-source and actual Popover composition coverage.
tags:
  - transition
  - view-intent
  - adapter
  - contract-test
